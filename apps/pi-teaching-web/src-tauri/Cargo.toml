[package]
name = "studyforge"
version = "0.1.0"
description = "StudyForge desktop shell"
authors = ["StudyForge contributors"]
edition = "2024"
autobins = false

[[bin]]
name = "studyforge-desktop"
path = "src/main.rs"

[lib]
name = "studyforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
