name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/windows-*']
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'apps/pi-teaching-web/**'
      - 'examples/derivative-m0/**'

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/pi-teaching-web

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check application
        run: bun run check

      - name: Build unsigned Windows x64 installer
        run: bun run desktop:build:windows

      - name: Install, verify, and uninstall packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $PWD 'src-tauri\target\release\bundle\nsis'
          $installRoot = Join-Path $env:RUNNER_TEMP 'StudyForge 学生 Beta'
          $receiptPath = Join-Path $env:RUNNER_TEMP 'studyforge-windows-receipt.json'
          $installer = Get-ChildItem -LiteralPath $bundle -Filter '*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'STUDYFORGE_WINDOWS_INSTALLER_NOT_FOUND' }

          & $installer.FullName /S "/D=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw "STUDYFORGE_WINDOWS_INSTALL_FAILED: $LASTEXITCODE" }

          $receipt = & bun run desktop:verify:windows -- "$installRoot"
          if ($LASTEXITCODE -ne 0) { throw "STUDYFORGE_WINDOWS_VERIFY_FAILED: $LASTEXITCODE" }
          $receipt | Set-Content -LiteralPath $receiptPath -Encoding utf8

          $uninstaller = Join-Path $installRoot 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw 'STUDYFORGE_WINDOWS_UNINSTALLER_NOT_FOUND'
          }
          & $uninstaller /S
          if ($LASTEXITCODE -ne 0) { throw "STUDYFORGE_WINDOWS_UNINSTALL_FAILED: $LASTEXITCODE" }
          if (Test-Path -LiteralPath (Join-Path $installRoot 'studyforge-desktop.exe')) {
            throw 'STUDYFORGE_WINDOWS_UNINSTALL_INCOMPLETE'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: studyforge-windows-x64-private-beta
          path: |
            apps/pi-teaching-web/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/studyforge-windows-receipt.json
          if-no-files-found: error
