original_problem:
  stem: 已知关于 $x$ 的不等式 $x^{x^2}>ax^2\ln x$ 在 $(0,+\infty)$ 上恒成立，则实数 $a$ 的取值范围为 ________.
  parts: *a1
  choices: []
  answer: $(-2e^{1-\frac{1}{2e}}, e)$
  fidelity_notes:
    - 源 markdown 与 legacy locator 均把左端写成 $x^2$；原图清楚为 $x^{x^2}$，且解析全程按 $x^{x^2}=e^{x^2\ln x}$ 推进。
    - 空格题无选项；答案两端均为开端点。
solution:
  source_solution_summary: 把 $x^{x^2}$ 写成 $e^{x^2\ln x}$，令 $t=x^2\ln x=\frac12x^2\ln x^2$，则 $t\ge -\frac1{2e}$，原不等式为 $e^t>at$。当 $t=0$ 时恒真；当 $t>0$ 时需 $a<e^t/t$ 对所有 $t>0$ 成立，由 $e^t/t$ 最小值为 $e$ 得 $a<e$；当 $-\frac1{2e}\le t<0$ 时需 $a>e^t/t$，该函数在负区间最大值为 $-2e^{1-\frac1{2e}}$，故 $a>-2e^{1-\frac1{2e}}$。
  key_steps:
    - step_id: step_1
      statement: 把左端幂函数写成指数形式，并引入单变量 $t$。
      formula_trace:
        from: $x^{x^2}>ax^2\ln x$
        to: $e^{x^2\ln x}>a(x^2\ln x)$
        operation: 使用 $x^{x^2}=e^{x^2\ln x}$，并把右端 $x^2\ln x$ 视为同一个整体。
        why: 这样左右两端都围绕同一个量 $t=x^2\ln x$，可转成 $e^t>at$。
      source_ref: page_0020
    - step_id: step_2
      statement: 确定 $t$ 的取值范围。
      formula_trace:
        from: $t=x^2\ln x=\frac12x^2\ln x^2$
        to: $t\ge -\frac1{2e}$
        operation: 令 $u=x^2>0$，则 $t=\frac12u\ln u$；由 $u\ln u$ 在 $u=e^{-1}$ 处最小为 $-1/e$。
        why: 后续求 $e^t/t$ 的上、下界必须先知道 $t$ 的完整区间。
      source_ref: page_0020
    - step_id: step_3
      statement: 处理 $t=0$ 的特殊点。
      formula_trace:
        from: $e^t>at$
        to: $1>0$
        operation: 代入 $t=0$。
        why: 此处不限制 $a$，因此不能在全程直接除以 $t$。
      source_ref: page_0020
    - step_id: step_4
      statement: 当 $t>0$ 时，得到参数上界。
      formula_trace:
        from: $e^t>at,\quad t>0$
        to: $a<\frac{e^t}{t},\quad \min_{t>0}\frac{e^t}{t}=e$
        operation: 除以正数 $t$，再对 $g(t)=e^t/t$ 求最小值，$g'(t)=e^t(t-1)/t^2$。
        why: 恒成立要求 $a$ 小于右侧在正区间的最小值。
      source_ref: page_0020
    - step_id: step_5
      statement: 当 $-\frac1{2e}\le t<0$ 时，得到参数下界。
      formula_trace:
        from: $e^t>at,\quad t<0$
        to: $a>\frac{e^t}{t},\quad \max_{[-\frac1{2e},0)}\frac{e^t}{t}=\frac{e^{-\frac1{2e}}}{-\frac1{2e}}=-2e^{1-\frac1{2e}}$
        operation: 除以负数 $t$ 时不等号反向；$g'(t)=e^t(t-1)/t^2<0$，故负区间最大值在左端点。
        why: 这是保证所有负 $t$ 情形均成立的必要且充分下界。
      source_ref: page_0020
    - step_id: step_6
      statement: 合并两个方向的限制。
      formula_trace:
        from: $a<e$ 与 $a>-2e^{1-\frac1{2e}}$
        to: $a\in(-2e^{1-\frac1{2e}},e)$
        operation: 取交集。
        why: 正、负 $t$ 区间的限制必须同时满足。
      source_ref: page_0020
teaching_card:
  student_title: 把 $x^{x^2}$ 和 $x^2\ln x$ 合成一个 $t$
  what_it_trains: 训练在恒成立求参中先把幂指混合式指数化，再围绕同一个整体 $t=x^2\ln x$ 分离参数，并按 $t$ 的正负讨论。
  recognition_cues:
    - 题干同时出现 $x^{x^2}$ 和 $x^2\ln x$。
    - 解析入口能写成 $e^{x^2\ln x}>a(x^2\ln x)$。
    - 整体变量 $x^2\ln x$ 的范围不是全体实数，最小值来自 $u\ln u$。
    - 分离参数后出现 $e^t/t$，需要按 $t>0$、$t<0$ 分别看。
  normalization_moves:
    - 先把 $x^{x^2}$ 改写为 $e^{x^2\ln x}$。
    - 令 $u=x^2$，把 $x^2\ln x$ 改写为 $\frac12u\ln u$ 来求范围。
    - 处理 $e^t>at$ 时先看 $t=0$，再除以正负不同的 $t$。
    - 把恒成立要求翻译成 $a$ 必须落在 $e^t/t$ 的正区间最小值和负区间最大值之间。
  common_failures:
    - 照 markdown 误读成 $x^2>ax^2\ln x$，会得到完全不同的参数结论。
    - 忘记 $t=x^2\ln x$ 有下界 $-1/(2e)$。
    - 在 $t<0$ 时不等号没有反向。
    - 把 $t=0$ 代入 $e^t/t$，导致除零错误。
    - 只求出 $a<e$，漏掉负区间给出的下界。
  similar_practice_query: x^{x^2} ax^2 ln x 恒成立 参数范围 e^t/t 正负分段
