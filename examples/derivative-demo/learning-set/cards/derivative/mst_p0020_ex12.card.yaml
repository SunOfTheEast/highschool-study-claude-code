stem: 已知关于 $x$ 的不等式 $x^{x^2}>ax^2\ln x$ 在 $(0,+\infty)$ 上恒成立，则实数 $a$ 的取值范围为 ________.
answer: |-
  $(-2e^{1-\frac{1}{2e}}, e)$

  把 $x^{x^2}$ 写成 $e^{x^2\ln x}$，令 $t=x^2\ln x=\frac12x^2\ln x^2$，则 $t\ge -\frac1{2e}$，原不等式为 $e^t>at$。当 $t=0$ 时恒真；当 $t>0$ 时需 $a<e^t/t$ 对所有 $t>0$ 成立，由 $e^t/t$ 最小值为 $e$ 得 $a<e$；当 $-\frac1{2e}\le t<0$ 时需 $a>e^t/t$，该函数在负区间最大值为 $-2e^{1-\frac1{2e}}$，故 $a>-2e^{1-\frac1{2e}}$。
