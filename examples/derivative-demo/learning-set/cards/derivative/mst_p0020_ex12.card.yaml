    evidence:
      - $x^{x^2}$ 经指数化后变成 $e^{x^2\ln x}$，与右端 $x^2\ln x$ 同构。
      - 参数 $a$ 通过 $e^t>at$ 被分离到 $a<e^t/t$ 或 $a>e^t/t$。
    normalization_moves_used:
      - 用 $x^{x^2}=e^{x^2\ln x}$ 统一底层变量。
      - 令 $t=\frac12x^2\ln x^2$，先求 $t\ge-1/(2e)$。
      - 对 $t=0$ 单独处理，避免错误除零。
      - 按 $t>0$ 和 $t<0$ 分别除以 $t$，记录不等号方向变化。
      - 用 $g'(t)=e^t(t-1)/t^2$ 判断 $e^t/t$ 的极值。
