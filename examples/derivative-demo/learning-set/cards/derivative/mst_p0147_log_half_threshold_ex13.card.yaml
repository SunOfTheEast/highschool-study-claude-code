stem: |-
  （2021·新高考 II 卷）已知 $a=\log_5 2,\ b=\log_8 3,\ c=\frac{1}{2}$，则下列判断正确的是（  ）
  A. $c<b<a$
  B. $b<a<c$
  C. $a<c<b$
  D. $a<b<c$
answer: |
  C

  先比较 $a$ 与 $c=\frac12$：
  \[
  a=\log_5 2<\log_5 5^{1/2}=\frac12=c.
  \]
  再比较 $b$ 与 $c=\frac12$：
  \[
  b=\log_8 3>\log_8 8^{1/2}=\frac12=c.
  \]
  所以
  \[
  a<c<b.
  \]
  对应选项 C。
