solution:
  source_solution_summary: |
    先比较 $a$ 与 $c=\frac12$：
    \[
    a=\log_5 2<\log_5 5^{1/2}=\frac12=c.
    \]
    再比较 $b$ 与 $c=\frac12$：
    \[
    b=\log_8 3>\log_8 8^{1/2}=\frac12=c.
    \]
    所以
    \[
    a<c<b.
    \]
    对应选项 C。
  key_steps:
    - step_id: step_1
      statement: 选取共同阈值 $c=\frac12$。
      formula_trace:
        from: $a=\log_5 2,\ b=\log_8 3,\ c=\frac12$
        to: 分别比较 $a,c$ 与 $b,c$
        operation: 把三数比较拆成两个二元比较。
        why: 阈值在题干已给出，最省步骤。
      source_ref: page_0147_ex13_solution
    - step_id: step_2
      statement: 证明 $a<c$。
      formula_trace:
        from: $a=\log_5 2$
        to: $a<\log_5 5^{1/2}=\frac12=c$
        operation: 底数5大于1，对数函数递增；比较真数 $2$ 与 $\sqrt5$。
        why: 给出下界侧关系。
      source_ref: page_0147_ex13_solution
    - step_id: step_3
      statement: 证明 $b>c$。
      formula_trace:
        from: $b=\log_8 3$
        to: $b>\log_8 8^{1/2}=\frac12=c$
        operation: 底数8大于1，对数函数递增；比较真数 $3$ 与 $\sqrt8$。
        why: 给出上界侧关系。
      source_ref: page_0147_ex13_solution
    - step_id: step_4
      statement: 合并并匹配选项。
      formula_trace:
        from: $a<c$ 且 $b>c$
        to: $a<c<b$，选 C
        operation: 传递性与选项对照。
        why: 完成作答。
      source_ref: page_0147_ex13_solution
teaching_card:
  student_title: 给你一个常数，就别硬比两条对数
  what_it_trains: 训练“先找公共阈值再排序”的对数比较基本动作。
  recognition_cues:
    - 三数里包含显式常数（如 $\frac12$）。
    - 其余两项是不同底对数，直接互比不方便。
    - 选项是纯顺序判断。
  normalization_moves:
    - 把常数改写成对应底数的对数值。
    - 分别判定每项在阈值上下。
    - 最后用“左-中-右”拼接顺序。
  common_failures:
    - 误把 $\sqrt8$ 看成小于3，导致 $b<c$。
    - 把底数大于1时的对数单调性写反。
    - 只得到 $a<c$ 或 $b>c$ 之一，未完成全序。
  similar_practice_query: log5 2 log8 3 1/2 阈值法 对数比大小
