original_problem:
  stem: （2018 · 常德一模 T21）已知函数 $f(x)=\ln x-ax+1$，$a\in\mathbf R$。
  parts: *a1
  choices: []
  answer: （1）$a\leqslant0$ 时，$f$ 在 $(0,+\infty)$ 上单调递增；$a>0$ 时，$f$ 在 $(0,1/a)$ 上单调递增，在 $(1/a,+\infty)$ 上单调递减。（2）$a\geqslant1$。（3）证明见解析。
  fidelity_notes:
    - 三问解答题，无选项。
    - 第(3)问题头在 page_0224 顶部，是 page_0223 例8的续页，不是新例题。
solution:
  source_solution_summary: $f^{\prime}(x)=\frac1x-a=\frac{1-ax}{x}$。若 $a\leqslant0$， 则 $f^{\prime}(x)>0$，$f$ 在 $(0,+\infty)$ 上递增；若 $a>0$， 则 $0<x<1/a$ 时 $f^{\prime}(x)>0$，$x>1/a$ 时 $f^{\prime}(x)<0$，所以先增后减。第二问若 $a\leqslant0$ 显然不可能 恒有 $f(x)\leqslant0$；若 $a>0$，最大值在 $x=1/a$， $f(1/a)=-\ln a$，故恒成立等价于 $-\ln a\leqslant0$，即 $a\geqslant1$。source 也写成 $a\geqslant\frac{\ln x+1}{x}=e\frac{\ln(ex)}{ex}$，最大值为 1。 第三问要证 $e^x>x\ln x-x$，即 $\frac{e^x}{x^2}>\frac{\ln x-1}{x}$。令 $g(u)=\frac{e^u}{u}$，则 $\frac{e^x}{x^2}=\frac14\left(\frac{e^{x/2}}{x/2}\right)^2 \geqslant e^2/4$；令 $h(u)=\frac{\ln u}{u}$，则 $\frac{\ln x-1}{x}=\frac1e\frac{\ln(x/e)}{x/e}\leqslant1/e^2$。 因 $e^2/4>1/e^2$，命题得证。
  key_steps:
    - step_id: step_1
      statement: 第一问求导并按 $a$ 分类。
      formula_trace:
        from: $f(x)=\ln x-ax+1$
        to: $f^{\prime}(x)=\frac1x-a=\frac{1-ax}{x}$
        operation: 求导并通分。
        why: 导数零点由 $a$ 的符号决定。
      source_ref: page_0224_ex08_continuation
    - step_id: step_2
      statement: 读出单调性。
      formula_trace:
        from: $f^{\prime}(x)=\frac{1-ax}{x}$
        to: $a\leqslant0$ 时全域递增；$a>0$ 时 $(0,1/a)$ 递增、$(1/a,+\infty)$ 递减
        operation: 按 $1-ax$ 的符号判号。
        why: 完成第一问。
      source_ref: page_0224_ex08_continuation
    - step_id: step_3
      statement: 第二问用最大值求参。
      formula_trace:
        from: $f(x)\leqslant0$ 对任意 $x>0$ 恒成立
        to: $a>0$ 且 $f(1/a)=-\ln a\leqslant0$
        operation: 利用第一问先增后减，取全局最大值。
        why: 恒小于等于 0 等价于最大值不超过 0。
      source_ref: page_0224_ex08_continuation
    - step_id: step_4
      statement: 得到 $a$ 的范围。
      formula_trace:
        from: $-\ln a\leqslant0$
        to: $a\geqslant1$
        operation: 利用对数单调性。
        why: 完成第二问。
      source_ref: page_0224_ex08_continuation
    - step_id: step_5
      statement: 第三问转成同构函数比较。
      formula_trace:
        from: $e^x-x\ln x+x>0$
        to: $\frac{e^x}{x^2}>\frac{\ln x-1}{x}$
        operation: 移项后除以 $x^2>0$。
        why: 制造 $\frac{e^x}{x^2}$ 与 $\frac{\ln x-1}{x}$ 的上下界。
      source_ref: page_0224_ex08_continuation
    - step_id: step_6
      statement: 用 $\frac{e^u}{u}$ 给左边下界。
      formula_trace:
        from: $\frac{e^x}{x^2}$
        to: $\frac14\left(\frac{e^{x/2}}{x/2}\right)^2\geqslant\frac{e^2}{4}$
        operation: 令 $u=x/2$，套用 $\frac{e^u}{u}\geqslant e$。
        why: 左侧得到统一正下界。
      source_ref: page_0224_ex08_continuation
    - step_id: step_7
      statement: 用 $\frac{\ln u}{u}$ 给右边上界。
      formula_trace:
        from: $\frac{\ln x-1}{x}$
        to: $\frac1e\frac{\ln(x/e)}{x/e}\leqslant\frac1{e^2}$
        operation: 令 $u=x/e$，套用 $\frac{\ln u}{u}\leqslant1/e$。
        why: 右侧得到统一上界。
      source_ref: page_0224_ex08_continuation
    - step_id: step_8
      statement: 比较常数完成证明。
      formula_trace:
        from: $\frac{e^x}{x^2}\geqslant\frac{e^2}{4}$，$\frac{\ln x-1}{x}\leqslant\frac1{e^2}$
        to: $\frac{e^x}{x^2}>\frac{\ln x-1}{x}$
        operation: 使用 $\frac{e^2}{4}>\frac1{e^2}$。
        why: 完成第三问的不等式证明。
      source_ref: page_0224_ex08_continuation
teaching_card:
  student_title: 先用最大值定 $a$，再除以 $x^2$ 证明指对不等式
  what_it_trains: 训练同一题中“导数分类求参”和“分而治之证明不等式”的衔接。
  recognition_cues:
    - 函数是 $\ln x-ax+1$，导数只有 $\frac1x-a$，适合直接分类。
    - 恒有 $f(x)\leqslant0$，就是最大值不能超过 0。
    - 第三问出现 $e^x$ 与 $x\ln x$，source 提示“除以 $x^2$”。
  normalization_moves:
    - 先把第一问的单调结果写完整，包括 $a=0$。
    - 第二问用 $x=1/a$ 的最大值，不要逐点硬压。
    - 第三问把 $x\ln x-x$ 移到右侧，再除以 $x^2$。
  common_failures:
    - 按 source 漏写 $a=0$，导致第一问分类不完整。
    - 第二问只代 $x=1$ 得 $a\geqslant1$，没有证明充分性。
    - 第三问看见 $e^x$ 和 $\ln x$ 就乱用切线，没有按 $x^2$ 统一尺度。
  similar_practice_query: lnx-ax+1 单调性 a>=1 e^x-xlnx+x 除以x^2 e^x/x^2 lnx/x
