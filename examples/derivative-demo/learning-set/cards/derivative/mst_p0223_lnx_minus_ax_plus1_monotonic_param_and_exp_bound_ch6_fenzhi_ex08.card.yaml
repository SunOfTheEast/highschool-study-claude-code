stem: |-
  （2018 · 常德一模 T21）已知函数 $f(x)=\ln x-ax+1$，$a\in\mathbf R$。
  1. 讨论函数 $f(x)$ 的单调性。
  2. 若对任意的 $x>0$，$f(x)\leqslant0$ 恒成立，求实数 $a$ 的取值范围。
  3. 求证：当 $x>0$ 时，$e^x-x\ln x+x>0$。
answer: |-
  （1）$a\leqslant0$ 时，$f$ 在 $(0,+\infty)$ 上单调递增；$a>0$ 时，$f$ 在 $(0,1/a)$ 上单调递增，在 $(1/a,+\infty)$ 上单调递减。（2）$a\geqslant1$。（3）证明见解析。

  $f^{\prime}(x)=\frac1x-a=\frac{1-ax}{x}$。若 $a\leqslant0$， 则 $f^{\prime}(x)>0$，$f$ 在 $(0,+\infty)$ 上递增；若 $a>0$， 则 $0<x<1/a$ 时 $f^{\prime}(x)>0$，$x>1/a$ 时 $f^{\prime}(x)<0$，所以先增后减。第二问若 $a\leqslant0$ 显然不可能 恒有 $f(x)\leqslant0$；若 $a>0$，最大值在 $x=1/a$， $f(1/a)=-\ln a$，故恒成立等价于 $-\ln a\leqslant0$，即 $a\geqslant1$。source 也写成 $a\geqslant\frac{\ln x+1}{x}=e\frac{\ln(ex)}{ex}$，最大值为 1。 第三问要证 $e^x>x\ln x-x$，即 $\frac{e^x}{x^2}>\frac{\ln x-1}{x}$。令 $g(u)=\frac{e^u}{u}$，则 $\frac{e^x}{x^2}=\frac14\left(\frac{e^{x/2}}{x/2}\right)^2 \geqslant e^2/4$；令 $h(u)=\frac{\ln u}{u}$，则 $\frac{\ln x-1}{x}=\frac1e\frac{\ln(x/e)}{x/e}\leqslant1/e^2$。 因 $e^2/4>1/e^2$，命题得证。
