stem: |-
  （2022 · 天津卷）已知函数 $f(x)=e^x-a\sin x$，$g(x)=b\sqrt{x}$。
  1. 求函数 $y=f(x)$ 在 $(0,f(0))$ 处的切线方程。
  2. 若 $y=f(x)$ 和 $y=g(x)$ 有公共点，当 $a=0$ 时，求 $b$ 的取值范围。
  3. 若 $y=f(x)$ 和 $y=g(x)$ 有公共点，求证：$a^2+b^2>e$。
answer: |-
  第 (1) 问：$y=(1-a)x+1$；第 (2)(i) 问：$b\geqslant\sqrt{2e}$；第 (2)(ii) 问：$a^2+b^2>e$。

  第 (1) 问 $f(0)=1$，$f'(0)=1-a$，切线为 $y=(1-a)x+1$。第 (2)(i) 问当 $a=0$，公共点方程为 $e^x=b\sqrt{x}$。若 $b\leqslant0$ 无公共点；若 $b>0$，等价看 $h(x)=e^{2x}-b^2x$ 的零点。由 $h'(x)=2e^{2x}-b^2$，当 $h_{\min}\leqslant0$ 得 $b\geqslant\sqrt{2e}$。第 (2)(ii) 问，由柯西不等式， 只需证明 $|a|+|b|>\sqrt{2e}$。若 $a=0$，由 (i) 得 $|b|\geqslant\sqrt{2e}$，从而 $a^2+b^2>e$。若 $a\neq0$ 且有公共点， $x=0$ 不可能，故 $x>0$，且 $e^x=a\sin x+b\sqrt{x}$。除以 $\sqrt{x}$ 后，只需证明 $|a|\sqrt{x}\geqslant a\sin x$。$a\leqslant0$ 时显然成立；$a>0$ 时， $0<x\leqslant1$ 有 $\sin x<x<\sqrt{x}$，$x>1$ 有 $\sqrt{x}>1\geqslant\sin x$，所以严格成立。于是 $|a|+|b|>e^x/\sqrt{x}\geqslant\sqrt{2e}$，柯西推出 $a^2+b^2>e$。
