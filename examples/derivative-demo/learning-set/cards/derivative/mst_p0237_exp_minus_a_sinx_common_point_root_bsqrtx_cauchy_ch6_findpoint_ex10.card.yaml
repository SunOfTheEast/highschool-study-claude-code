original_problem:
  stem: （2022 · 天津卷）已知函数 $f(x)=e^x-a\sin x$，$g(x)=b\sqrt{x}$。
  parts: *a1
  choices: []
  answer: 第 (1) 问：$y=(1-a)x+1$；第 (2)(i) 问：$b\geqslant\sqrt{2e}$；第 (2)(ii) 问：$a^2+b^2>e$。
  fidelity_notes:
    - 三小问均无选项。
    - 由于 $g(x)=b\sqrt{x}$，公共点部分默认 $x\geqslant0$，且实际公共点不能是 $x=0$。
solution:
  source_solution_summary: 第 (1) 问 $f(0)=1$，$f'(0)=1-a$，切线为 $y=(1-a)x+1$。第 (2)(i) 问当 $a=0$，公共点方程为 $e^x=b\sqrt{x}$。若 $b\leqslant0$ 无公共点；若 $b>0$，等价看 $h(x)=e^{2x}-b^2x$ 的零点。由 $h'(x)=2e^{2x}-b^2$，当 $h_{\min}\leqslant0$ 得 $b\geqslant\sqrt{2e}$。第 (2)(ii) 问，由柯西不等式， 只需证明 $|a|+|b|>\sqrt{2e}$。若 $a=0$，由 (i) 得 $|b|\geqslant\sqrt{2e}$，从而 $a^2+b^2>e$。若 $a\neq0$ 且有公共点， $x=0$ 不可能，故 $x>0$，且 $e^x=a\sin x+b\sqrt{x}$。除以 $\sqrt{x}$ 后，只需证明 $|a|\sqrt{x}\geqslant a\sin x$。$a\leqslant0$ 时显然成立；$a>0$ 时， $0<x\leqslant1$ 有 $\sin x<x<\sqrt{x}$，$x>1$ 有 $\sqrt{x}>1\geqslant\sin x$，所以严格成立。于是 $|a|+|b|>e^x/\sqrt{x}\geqslant\sqrt{2e}$，柯西推出 $a^2+b^2>e$。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问直接写切线。
      formula_trace:
        from: $f(x)=e^x-a\sin x$
        to: $f(0)=1,\ f^\prime(0)=1-a$
        operation: 求导并代入切点 $x=0$。
        why: 切线方程为 $y-1=(1-a)x$。
      source_ref: page_0237_ex10_solution_start
    - step_id: step_2
      statement: $a=0$ 时把公共点转成根式零点。
      formula_trace:
        from: $e^x=b\sqrt{x}$
        to: $h(x)=e^{2x}-b^2x=0$
        operation: 平方并利用 $b>0$ 时同零点。
        why: 根式方程直接看不方便，平方后变成单极值函数。
      source_ref: page_0237_ex10_solution_start
    - step_id: step_3
      statement: 用 $h$ 的最小值求 $b$ 范围。
      formula_trace:
        from: $h^\prime(x)=2e^{2x}-b^2=0$
        to: $x=\ln\frac b{\sqrt2}$，$h_{\min}\leqslant0\Leftrightarrow b\geqslant\sqrt{2e}$
        operation: 求极小值并解不等式。
        why: 公共点存在等价于平方后的函数至少有一个零点。
      source_ref: page_0237_ex10_solution_start
    - step_id: step_4
      statement: 用右侧取点说明 $b>\sqrt{2e}$ 时确有第二个零点。
      formula_trace:
        from: $h(0)=1>0,\ h_{\min}<0$
        to: $h(2\ln\frac b{\sqrt2})>0$
        operation: 在极小值点右侧代入一个显点。
        why: 这补足存在性，而不是只看必要条件。
      source_ref: page_0238_ex10_continuation
    - step_id: step_5
      statement: 证明 $a^2+b^2>e$ 先转成证明 $|a|+|b|>\sqrt{2e}$。
      formula_trace:
        from: $(a^2+b^2)(1^2+1^2)\geqslant(|a|+|b|)^2$
        to: $a^2+b^2\geqslant\frac{(|a|+|b|)^2}{2}$
        operation: 使用柯西不等式。
        why: 若 $|a|+|b|>\sqrt{2e}$，则立刻得到 $a^2+b^2>e$。
      source_ref: page_0238_ex10_continuation
    - step_id: step_6
      statement: 从公共点方程反推出 $|a|+|b|$ 的下界。
      formula_trace:
        from: $e^x=a\sin x+b\sqrt{x}$
        to: $\frac{e^x}{\sqrt{x}}=\frac{a\sin x}{\sqrt{x}}+b$
        operation: 公共点处除以 $\sqrt{x}$。
        why: 要和 $\left(e^x/\sqrt{x}\right)_{\min}$ 对接。
      source_ref: page_0238_ex10_continuation
    - step_id: step_7
      statement: 证明 $|a|\sqrt{x}\geqslant a\sin x$。
      formula_trace:
        from: $x>0$
        to: $a\leqslant0$ 时显然；$a>0$ 时 $\sin x<\sqrt{x}$
        operation: 按 $a$ 的符号和 $x$ 的范围分段。
        why: 这保证 $|a|+|b|$ 大于公共点处的 $e^x/\sqrt{x}$。
      source_ref: page_0238_ex10_continuation
    - step_id: step_8
      statement: 用 $\frac{e^x}{\sqrt{x}}$ 的最小值收尾。
      formula_trace:
        from: $\left(\frac{e^x}{\sqrt{x}}\right)_{\min}=\sqrt{2e}$
        to: $|a|+|b|>\sqrt{2e}$，所以 $a^2+b^2>e$
        operation: 代入标准最小值并套柯西。
        why: 这是 part (i) 的数据反向进入不等式证明。
      source_ref: page_0238_ex10_continuation
teaching_card:
  student_title: 公共点证明 $a^2+b^2>e$：先找出 $\sqrt{2e}$ 这个数据
  what_it_trains: 训练把公共点条件反向变成不等式：先从根式零点求出关键常数，再用柯西和公共点方程收束。
  recognition_cues:
    - $g(x)=b\sqrt{x}$，公共点里自然会出现 $e^x/\sqrt{x}$。
    - $a=0$ 时就是 $e^x=b\sqrt{x}$，平方后看 $e^{2x}-b^2x$。
    - 要证平方和大于常数，常先想 $|a|+|b|$ 与柯西。
  normalization_moves:
    - 第 (1) 问先写切线。
    - 第 (2)(i) 把 $e^x=b\sqrt{x}$ 平方成 $h(x)$。
    - 用 $h_{\min}\leqslant0$ 得 $b\geqslant\sqrt{2e}$。
    - 第 (2)(ii) 用公共点方程除以 $\sqrt{x}$。
    - 用 $\sin x<\sqrt{x}$ 和柯西完成证明。
  common_failures:
    - 平方后忘记先讨论 $b>0$。
    - 只证明了 $b\geqslant\sqrt{2e}$，没有把这个常数迁移到第 (2)(ii)。
    - 公共点处漏掉 $x=0$ 不可能这一点。
    - 把柯西方向写反，导致 $a^2+b^2$ 推不出来。
  similar_practice_query: e^x-a sinx b sqrtx 公共点 a^2+b^2>e e^x/sqrtx 柯西
