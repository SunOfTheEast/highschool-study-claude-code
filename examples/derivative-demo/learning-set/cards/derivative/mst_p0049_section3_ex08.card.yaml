stem: |-
  （江西重点中学协作体 2021 届高三联考 T20）已知函数 $f(x)=x-\frac{a}{e^x}-\frac12(\sin x-\cos x)$。
  (1). 当 $a=0$ 时，判断函数 $f(x)$ 的单调性。
  (2). 已知 $f(x)\ge1$ 对任意 $x\in\mathbf R$ 恒成立，求 $a$ 的取值范围。
answer: |-
  (1) $f(x)$ 在 $\mathbf R$ 上单调递增；(2) $a\in\left(-\infty,-\frac12\right]$。

  当 a=0 时，f'(x)=1-(cos x+sin x)/2 =1-(sqrt2/2)sin(x+pi/4)>0，所以 f 在 R 上递增。 若 f(x)>=1 恒成立，代入 x=0 得 -a+1/2>=1，故 a<=-1/2。 对 a<=-1/2，有 -a/e^x>=1/(2e^x)，只需证明 x-1/2(sin x-cos x)+1/(2e^x)>=1。等价于 e^x(2-2x+sin x-cos x)<=1。令 g 为左侧，则 g'(x)=2e^x(sin x-x)。由 h(x)=sin x-x 单调递减且 h(0)=0， 知 g 在 0 左增、0 右减，最大值 g(0)=1，故充分。 法二直接分离为 a<=(x-1-1/2 sin x+1/2 cos x)e^x，对该右侧求最小值也得 -1/2。
