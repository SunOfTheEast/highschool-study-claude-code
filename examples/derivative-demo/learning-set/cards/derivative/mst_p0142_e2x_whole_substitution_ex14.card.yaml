solution:
  source_solution_summary: |
    设 $m(x)=xf(x)$，则
    \[
    m^{\prime}(x)=f(x)+xf^{\prime}(x)=\frac{e^{2x}}{x}.
    \]
    又 $f(x)=\frac{m(x)}{x}$，故
    \[
    f^{\prime}(x)=\frac{m^{\prime}(x)x-m(x)}{x^2}
    =\frac{e^{2x}-m(x)}{x^2}.
    \]
    设 $h(x)=e^{2x}-m(x)$，则
    \[
    h^{\prime}(x)=2e^{2x}-m^{\prime}(x)
    =e^{2x}\left(2-\frac{1}{x}\right)
    =e^{2x}\cdot\frac{2x-1}{x}.
    \]
    所以 $h$ 在 $\left(0,\frac12\right)$ 递减、在 $\left(\frac12,+\infty\right)$ 递增，
    从而
    \[
    h(x)\ge h\left(\frac12\right)=e-\frac12f\left(\frac12\right)=0.
    \]
    即 $f^{\prime}(x)=\frac{h(x)}{x^2}\ge0$，故 $f$ 单调递增，A对，B错。
    对于 C，设 $g(x)=xf(x)-e^2\ln x$，则
    \[
    g^{\prime}(x)=f(x)+xf^{\prime}(x)-\frac{e^2}{x}
    =\frac{e^{2x}-e^2}{x},
    \]
    解 $g^{\prime}(x)>0$ 得 $x>1$，故增区间为 $(1,+\infty)$，C对。
    对于 D，设 $\varphi(x)=f(x)-e^{2x}-e$，有 $\varphi\left(\frac12\right)=0$，
    \[
    \varphi^{\prime}(x)=\frac{e^{2x}-xf(x)-2x^2e^{2x}}{x^2}
    =\frac{n(x)}{x^2},
    \]
    \[
    n^{\prime}(x)=e^{2x}\left[(2-4x)-\frac1x-4x^2\right].
    \]
    当 $x>\frac12$ 时上式为负，故 $n$ 递减，且
    \[
    n\left(\frac12\right)=e-\frac12f\left(\frac12\right)-\frac e2=-\frac e2<0.
    \]
    于是 $x>\frac12$ 时 $\varphi^{\prime}(x)<0$，$\varphi$ 递减，配合 $\varphi\left(\frac12\right)=0$
    得 $\varphi(x)<0$，即 $f(x)<e^{2x}+e$（在 $x>\frac12$ 上），D错。综上选 AC。
  key_steps:
    - step_id: step_1
      statement: 整体代换 $m(x)=xf(x)$，统一题设中的 $xf$ 与 $x^2f^{\prime}$。
      formula_trace:
        from: $xf(x)+x^2f^{\prime}(x)=e^{2x}$
        to: $m^{\prime}(x)=f(x)+xf^{\prime}(x)=\\frac{e^{2x}}{x}$
        operation: 先设 $m(x)=xf(x)$，再除以 $x>0$。
        why: 后续各选项都依赖 $f(x)+xf^{\prime}(x)$ 或 $f^{\prime}(x)$。
      source_ref: page_0142_solution
    - step_id: step_2
      statement: 把 $f^{\prime}(x)$ 写成新函数 $h(x)$ 的符号问题。
      formula_trace:
        from: $f(x)=\\frac{m(x)}{x}$
        to: $f^{\prime}(x)=\\frac{e^{2x}-m(x)}{x^2}=\\frac{h(x)}{x^2}$
        operation: 商求导后代回 $m^{\prime}(x)=\\frac{e^{2x}}{x}$。
        why: 只需研究 $h(x)$ 即可判断 $f$ 的单调与极值。
      source_ref: page_0142_solution
    - step_id: step_3
      statement: 用 $h^{\prime}(x)$ 的分段符号得到 A、B。
      formula_trace:
        from: $h^{\prime}(x)=e^{2x}\\cdot\\frac{2x-1}{x}$
        to: $h(x)\\ge h\\left(\\frac12\\right)=0\\Rightarrow f^{\prime}(x)\\ge0$
        operation: 先判 $h$ 在 $\\left(0,\\frac12\\right)$ 递减、在 $\\left(\\frac12,+\\infty\\right)$ 递增，再代入已知值。
        why: 推出 $f$ 递增，故 A真、B假。
      source_ref: page_0142_solution
    - step_id: step_4
      statement: 直接对 C 的函数求导并解不等式。
      formula_trace:
        from: $g(x)=xf(x)-e^2\\ln x$
        to: $g^{\prime}(x)=\\frac{e^{2x}-e^2}{x}>0\\iff x>1$
        operation: 用 step_1 的结论 $f(x)+xf^{\prime}(x)=\\frac{e^{2x}}{x}$。
        why: 确定增区间即判定 C。
      source_ref: page_0142_solution
    - step_id: step_5
      statement: 构造 $\varphi(x)$ 与 $n(x)$，判定 D 结论反向成立。
      formula_trace:
        from: $\\varphi(x)=f(x)-e^{2x}-e,\\ \\varphi\\left(\\frac12\\right)=0$
        to: $x>\\frac12$ 时 $\\varphi^{\prime}(x)<0\\Rightarrow \\varphi(x)<0$
        operation: 把 $\\varphi^{\prime}(x)$ 化为 $\\frac{n(x)}{x^2}$，再用 $n^{\prime}(x)<0$ 与 $n\\left(\\frac12\\right)<0$。
        why: 得到 $f(x)<e^{2x}+e$（在 $x>\\frac12$ 上），所以 D 错。
      source_ref: page_0142_solution
teaching_card:
  student_title: 一题三构造：先换元，再分选项判导数
  what_it_trains: 训练把耦合的 $xf$ 与 $x^2f^{\prime}$ 关系改写成可控的新函数导数符号，并在多选题里分轨判定。
  recognition_cues:
    - 题干给出 $xf(x)+x^2f^{\prime}(x)=\\text{指数函数}$。
    - 选项同时考单调性、增区间和不等式解集。
    - 出现已知点值 $f\\left(\\frac12\\right)$，常用于锁定构造函数符号。
  normalization_moves:
    - 先设 $m(x)=xf(x)$。
    - 把 $f^{\prime}(x)$ 转化为 $\\frac{h(x)}{x^2}$ 再判 $h$。
    - 对不同选项再构造 $g(x),\\varphi(x)$。
  common_failures:
    - 把 $f^{\prime}(x)\\ge0$ 误写成“有极小值”。
    - 在 $g^{\prime}(x)>0$ 时漏掉定义域 $x>0$。
    - 只看到 $\\varphi\\left(\\frac12\\right)=0$ 就误判 D 为真。
  similar_practice_query: 整体代换 $xf+x^2f^{\\prime}$ 多选题 单调性与不等式联合判定
