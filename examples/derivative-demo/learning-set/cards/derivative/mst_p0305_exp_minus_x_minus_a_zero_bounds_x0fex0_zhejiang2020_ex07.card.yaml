stem: |-
  （2020 · 浙江）已知 $1<a\le2$，函数 $f(x)=e^x-x-a$，其中 $e=2.71828\cdots$ 为自然对数的底数。
  1. 证明：函数 $y=f(x)$ 在 $(0,+\infty)$ 上有唯一零点。
  2. 记 $x_0$ 为函数 $y=f(x)$ 在 $(0,+\infty)$ 上的零点，证明：$\sqrt{a-1}\le x_0\le\sqrt{2(a-1)}$。
  3. 证明：$x_0f(e^{x_0})\ge(e-1)(a-1)a$。
answer: |-
  第(1)问：$(0,+\infty)$ 上唯一零点。第(2)(i)：$\sqrt{a-1}\le x_0\le\sqrt{2(a-1)}$。第(2)(ii)：$x_0f(e^{x_0})\ge(e-1)(a-1)a$。

  第(1)问：$f^\prime(x)=e^x-1>0$，所以 $f$ 在 $(0,+\infty)$ 上递增；又 $f(0)=1-a<0$， $f(2)=e^2-2-a\ge e^2-4>0$，故唯一零点存在。 第(2)(i)：令 $t=\sqrt{a-1}\in(0,1]$。左界只需证 $f(t)<0$，即 $g(t)=e^t-t^2-t-1<0$，由导数分析得 $g(t)<g(0)=0$。右界只需证 $f(\sqrt2t)>0$，即 $h(t)=e^{\sqrt2t}-t^2-\sqrt2t-1\ge0$； 因 $h^\prime(t)=\sqrt2(e^{\sqrt2t}-\sqrt2t-1)\ge0$， 所以 $h(t)\ge h(0)=0$。第(2)(ii)：由 $f(x_0)=0$ 得 $e^{x_0}=x_0+a$，故 $f(e^{x_0})=f(x_0+a)=e^{x_0+a}-(x_0+a)-a$。源解先比较以 $a$ 为主元和以 $x_0$ 为主元，最后选择以 $x_0$ 为主元； 由 (i) 的下界，只需证明 $\sqrt{a-1}(e^{\sqrt{a-1}+a}-\sqrt{a-1}-2a) \ge(e-1)a(a-1)$。用 (i) 中的 $h(t)\ge0$ 得到 $e^u\ge1+u+\frac12u^2$，把问题化为 $\frac{a}{\sqrt{a-1}}-\frac{\sqrt{a-1}}a\ge2(e-2)$。 因 $\frac{a}{\sqrt{a-1}}=\frac1{\sqrt{a-1}}+\sqrt{a-1}\ge2$， 且 $\frac{\sqrt{a-1}}a\le\frac12$，左边至少为 $\frac32\ge2(e-2)$，结论成立。
