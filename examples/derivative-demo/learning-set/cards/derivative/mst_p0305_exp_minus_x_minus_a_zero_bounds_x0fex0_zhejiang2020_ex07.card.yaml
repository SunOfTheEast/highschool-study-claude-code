original_problem:
  stem: （2020 · 浙江）已知 $1<a\le2$，函数 $f(x)=e^x-x-a$，其中 $e=2.71828\cdots$ 为自然对数的底数。
  parts: *a1
  choices: []
  answer: 第(1)问：$(0,+\infty)$ 上唯一零点。第(2)(i)：$\sqrt{a-1}\le x_0\le\sqrt{2(a-1)}$。第(2)(ii)：$x_0f(e^{x_0})\ge(e-1)(a-1)a$。
  fidelity_notes:
    - 无选项。
    - $x_0$ 是 $e^x-x-a=0$ 的正零点，零点关系为 $e^{x_0}=x_0+a$。
    - 第(2)(ii) 不是直接估 $f(e^{x_0})$，而是先把输入 $e^{x_0}$ 改为 $x_0+a$。
solution:
  source_solution_summary: 第(1)问：$f^\prime(x)=e^x-1>0$，所以 $f$ 在 $(0,+\infty)$ 上递增；又 $f(0)=1-a<0$， $f(2)=e^2-2-a\ge e^2-4>0$，故唯一零点存在。 第(2)(i)：令 $t=\sqrt{a-1}\in(0,1]$。左界只需证 $f(t)<0$，即 $g(t)=e^t-t^2-t-1<0$，由导数分析得 $g(t)<g(0)=0$。右界只需证 $f(\sqrt2t)>0$，即 $h(t)=e^{\sqrt2t}-t^2-\sqrt2t-1\ge0$； 因 $h^\prime(t)=\sqrt2(e^{\sqrt2t}-\sqrt2t-1)\ge0$， 所以 $h(t)\ge h(0)=0$。第(2)(ii)：由 $f(x_0)=0$ 得 $e^{x_0}=x_0+a$，故 $f(e^{x_0})=f(x_0+a)=e^{x_0+a}-(x_0+a)-a$。源解先比较以 $a$ 为主元和以 $x_0$ 为主元，最后选择以 $x_0$ 为主元； 由 (i) 的下界，只需证明 $\sqrt{a-1}(e^{\sqrt{a-1}+a}-\sqrt{a-1}-2a) \ge(e-1)a(a-1)$。用 (i) 中的 $h(t)\ge0$ 得到 $e^u\ge1+u+\frac12u^2$，把问题化为 $\frac{a}{\sqrt{a-1}}-\frac{\sqrt{a-1}}a\ge2(e-2)$。 因 $\frac{a}{\sqrt{a-1}}=\frac1{\sqrt{a-1}}+\sqrt{a-1}\ge2$， 且 $\frac{\sqrt{a-1}}a\le\frac12$，左边至少为 $\frac32\ge2(e-2)$，结论成立。
  key_steps:
    - step_id: step_1
      statement: 证明正半轴唯一零点。
      formula_trace:
        from: $f(x)=e^x-x-a$
        to: $f^\prime(x)=e^x-1>0,\quad f(0)<0,\quad f(2)>0$
        operation: 求导判单调，再找两侧异号点。
        why: 单调性给唯一性，异号点给存在性。
      source_ref: page_0305_ex07_part1_part2i
    - step_id: step_2
      statement: 把根式双界改成两个取点判号。
      formula_trace:
        from: $\sqrt{a-1}\le x_0\le\sqrt{2(a-1)}$
        to: $f(\sqrt{a-1})<0,\quad f(\sqrt{2(a-1)})>0$
        operation: 利用 $f$ 单调递增。
        why: 零点夹在两个取点之间。
      source_ref: page_0305_ex07_part1_part2i
    - step_id: step_3
      statement: 令 $t=\sqrt{a-1}$ 处理左界。
      formula_trace:
        from: $f(t)=e^t-t^2-t-1$
        to: $f(t)<0$
        operation: 设 $g(t)=e^t-t^2-t-1$，由导数分析得 $g(t)<g(0)=0$。
        why: 证明 $x_0$ 在 $t$ 的右侧。
      source_ref: page_0305_ex07_part1_part2i
    - step_id: step_4
      statement: 处理右界，并拿到后续二阶指数放缩。
      formula_trace:
        from: $h(t)=e^{\sqrt2t}-t^2-\sqrt2t-1$
        to: $h(t)\ge0$
        operation: 用 $h^\prime(t)=\sqrt2(e^{\sqrt2t}-\sqrt2t-1)\ge0$。
        why: 一方面证明右界，另一方面为后面使用 $e^u\ge1+u+\frac12u^2$ 做铺垫。
      source_ref: page_0305_ex07_part1_part2i
    - step_id: step_5
      statement: 用零点关系改写 $f(e^{x_0})$。
      formula_trace:
        from: $f(x_0)=0$
        to: $e^{x_0}=x_0+a,\quad f(e^{x_0})=f(x_0+a)$
        operation: 把指数输入 $e^{x_0}$ 换成线性输入 $x_0+a$。
        why: 原式 $f(e^{x_0})$ 太复杂，必须先用零点关系降维。
      source_ref: page_0305_ex07_part2ii_start
    - step_id: step_6
      statement: 选择 $x_0$ 为主元。
      formula_trace:
        from: $x_0[e^{x_0+a}-(x_0+a)-a]$
        to: $\sqrt{a-1}(e^{\sqrt{a-1}+a}-\sqrt{a-1}-2a)$
        operation: 用 (i) 的 $x_0\ge\sqrt{a-1}$ 做下界替换。
        why: 若以 $a$ 为主元，两边都随 $a$ 增大，不能直接放缩；以 $x_0$ 为主元右侧固定，更好比较。
      source_ref: page_0306_ex07_part2ii_tail
    - step_id: step_7
      statement: 用二阶指数放缩把最后一步变成代数不等式。
      formula_trace:
        from: $e^{\sqrt{a-1}+a}$
        to: $1+(\sqrt{a-1}+a)+\frac12(\sqrt{a-1}+a)^2$
        operation: 调用前面右界证明中得到的 $e^u\ge1+u+\frac12u^2$。
        why: 把指数不等式压成关于 $a$ 和 $\sqrt{a-1}$ 的代数式。
      source_ref: page_0306_ex07_part2ii_tail
    - step_id: step_8
      statement: 完成最后的代数下界。
      formula_trace:
        from: $\frac{a}{\sqrt{a-1}}-\frac{\sqrt{a-1}}a$
        to: $\frac{a}{\sqrt{a-1}}-\frac{\sqrt{a-1}}a\ge\frac32\ge2(e-2)$
        operation: 用 $\frac{a}{\sqrt{a-1}}=\frac1{\sqrt{a-1}}+\sqrt{a-1}\ge2$ 和 $\frac{\sqrt{a-1}}a\le\frac12$。
        why: 这是第(2)(ii) 的最终数值兜底。
      source_ref: page_0306_ex07_part2ii_tail
teaching_card:
  student_title: 先找点夹住零点，再选主元放缩
  what_it_trains: 训练高考真题里常见的路线：先用取点把隐藏零点夹住，再把复杂目标改成适合放缩的主元。
  recognition_cues:
    - 题目先要求唯一零点，再让你估这个零点。
    - 目标里出现 $f(e^{x_0})$，但 $x_0$ 满足 $e^{x_0}=x_0+a$。
    - 根式 $\sqrt{a-1}$ 和 $\sqrt{2(a-1)}$ 明显提示取点夹零点。
    - 最后一问同时含 $a$ 和 $x_0$，需要判断谁做主元。
  normalization_moves:
    - 先证明 $f$ 单调，之后所有取点才有意义。
    - 把 $\sqrt{a-1}\le x_0\le\sqrt{2(a-1)}$ 翻译成左右取点判号。
    - 看到 $f(e^{x_0})$，先用 $e^{x_0}=x_0+a$ 换输入。
    - 不要急着对 $a$ 放缩；源解明确选择 $x_0$ 为主元。
  common_failures:
    - 只证存在零点，忘记唯一性来自单调。
    - 根式双界的取点方向写反。
    - 忘记第(2)(i) 的结果是第(2)(ii) 的工具。
    - 把 $f(e^{x_0})$ 直接展开后硬算，导致表达式爆炸。
    - 没有解释为什么选择 $x_0$ 为主元。
  similar_practice_query: 浙江导数 零点根式双界 x0 f(e^x0) 主元 放缩取点
