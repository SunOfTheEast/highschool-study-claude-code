stem: |-
  （2025 · 安徽月考）已知函数 $f(x)=ae^{-x}-x^2$，$g(x)=xe^x-a\sin x$，其中 $a\in\mathbf R$。
  1. 若 $a>0$，证明 $f(x)$ 在 $(0,+\infty)$ 上存在唯一的零点。
  2. 若 $1<a\le e$，设 $x_1$ 为 $f(x)$ 在 $(0,+\infty)$ 上的零点，证明：$g(x)$ 在 $(0,\pi)$ 上有唯一的零点 $x_2$，且 $3x_1-x_2>2$。
answer: |-
  $a>0$ 时 $f$ 在正半轴有唯一零点；当 $1<a\le e$ 时，$g$ 在 $(0,\pi)$ 上有唯一零点 $x_2$，且 $3x_1-x_2>2$。

  第(1)问中，$f^\prime(x)=-ae^{-x}-2x<0$，所以 $f$ 在正半轴单调递减。 又 $f(0)=a>0$，且在 $x=\sqrt a$ 处有 $f(\sqrt a)=ae^{-\sqrt a}-a<0$，因此唯一零点存在。第(2)问中， $g^\prime(x)=(x+1)e^x-a\cos x$， $g^{\prime\prime}(x)=(x+2)e^x+a\sin x>0$，所以 $g^\prime$ 在 $(0,\pi)$ 上递增。由 $g^\prime(0)=1-a<0$、 $g^\prime(1)=2e-a\cos1>0$ 得唯一临界点 $x_0\in(0,1)$， $g$ 先减后增，结合 $g(0)=0,g(x_0)<0,g(\pi)>0$ 得唯一零点 $x_2$。再由 $f(x_1)=0$ 得 $a=x_1^2e^{x_1}$。利用 $x>\sin x$，在 $x=\ln a$ 处得 $g(\ln a)>0$，所以 $x_2<\ln a$。因此只要证明 $3x_1\ge 2+\ln a$ 即可。代入 $\ln a=\ln(x_1^2e^{x_1})=2\ln x_1+x_1$，化为 $x_1\ge \ln x_1+1$，这是 $\ln x\le x-1$ 的基本形式；当端点 $a=e$ 时这里取等，但因为 $x_2<\ln a$，最终结论仍是严格的。
