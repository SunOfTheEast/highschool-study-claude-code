solution:
  source_solution_summary: |
    由题设除以正数 $ye^x$，得 $\frac{x/2+1}{e^x}=\frac{\ln(y/2)+1}{y}$。由于 $y>2$，有 $\frac{\ln(y/2)+1}{y}<\frac{\ln(y/2)+2}{y}$。构造 $g(u)=\frac{u/2+1}{e^u}$，则 $g'(u)=-(u+1)/(2e^u)<0$，所以 $g$ 在 $u>0$ 上递减。又 $g(\ln(y/2))=\frac{\ln(y/2)+2}{y}$，因此 $g(x)<g(\ln(y/2))$，递减性推出 $x>\ln(y/2)$，即 $e^x>y/2$，故 $2e^x>y$。
  key_steps:
    - step_id: step_1
      statement: 把题设除成左右同构的分式。
      formula_trace:
        from: |
          $\left(\frac x2+1\right)y=e^x\ln\frac{ey}{2}$
        to: |
          $\frac{x/2+1}{e^x}=\frac{\ln(y/2)+1}{y}$
        operation: 两边除以 $ye^x$，并用 $\ln(ey/2)=1+\ln(y/2)$。
        why: 左侧已经是 $g(x)$，右侧接近 $g(\ln(y/2))$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:33
    - step_id: step_2
      statement: 构造一个更大的右侧同构值。
      formula_trace:
        from: |
          $\frac{\ln(y/2)+1}{y}$
        to: |
          $\frac{\ln(y/2)+1}{y}<\frac{\ln(y/2)+2}{y}$
        operation: 在同一个正分母 $y$ 上比较分子。
        why: 多出的 $1$ 正好来自 $g(\ln(y/2))$ 的分子结构。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:33
    - step_id: step_3
      statement: 证明 $g$ 在正数域上递减。
      formula_trace:
        from: |
          $g(u)=\frac{u/2+1}{e^u}$
        to: |
          $g'(u)=-\frac{u+1}{2e^u}<0\quad(u>0)$
        operation: 用商法则或写成 $(u/2+1)e^{-u}$ 后求导。
        why: 后面要由 $g(x)<g(v)$ 反推出 $x>v$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:33
    - step_id: step_4
      statement: 计算比较点 $g(\ln(y/2))$。
      formula_trace:
        from: |
          $g\left(\ln\frac y2\right)=\frac{\frac12\ln(y/2)+1}{e^{\ln(y/2)}}$
        to: |
          $g\left(\ln\frac y2\right)=\frac{\ln(y/2)+2}{y}$
        operation: 用 $e^{\ln(y/2)}=y/2$，分子分母同乘 $2$。
        why: 这正好是上一步构造出的较大右侧。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:33
    - step_id: step_5
      statement: 用递减性推出目标选项。
      formula_trace:
        from: |
          $g(x)<g\left(\ln\frac y2\right)$
        to: |
          $x>\ln\frac y2\Rightarrow e^x>\frac y2\Rightarrow 2e^x>y$
        operation: 递减函数函数值小，输入反而大；再对指数函数取值。
        why: 得到选项 D。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:33
teaching_card:
  student_title: 用递减同构拿到 $2e^x>y$
  what_it_trains: 等式两边差一点同构时，不要硬解；把右侧补成一个更大的 $g(\ln(y/2))$，再利用 $g$ 递减，把函数值比较转成输入比较。
  recognition_cues:
    - 题干中有 $x/2+1$ 和 $\\ln(ey/2)=1+\\ln(y/2)$。
    - 选项都在比较 $e^x$、$e^{x/2}$ 与 $y$。
    - 把 $x$ 与 $\\ln(y/2)$ 比出来就能判断 D。
  normalization_moves:
    - 先除以 $ye^x$，整理成 $g(x)$。
    - 把 $(\\ln(y/2)+1)/y$ 放大到 $(\\ln(y/2)+2)/y$。
    - 算出 $g(\\ln(y/2))$，再用递减性反推 $x>\\ln(y/2)$。
  common_failures:
    - 把 $g$ 当成递增函数，比较方向反了。
    - 不会把 $g(\\ln(y/2))$ 的分母化成 $y/2$。
    - 得到 $e^x>y/2$ 后误选 A，而不是 D。
  similar_practice_query: 不完整同构 上界构造 (x/2+1)/e^x ln(y/2) 递减
