stem: |-
  （2024 · 新课标 2 卷 13）设函数 $f(x)=(a+x)\ln(x+b)$，若 $f(x)\geqslant0$，则 $a^2+b^2$ 的最小值为（  ）
  A. \frac{1}{8}
  B. \frac{1}{4}
  C. \frac{1}{2}
  D. 1
answer: |-
  C

  定义域为 $x>-b$。源解按穿根原理处理乘积结构：一次因子 $a+x$ 的零点为 $x=-a$，对数因子 $\ln(x+b)$ 的零点为 $x=1-b$。由题设 $f(x)=(a+x)\ln(x+b)\ge0$，两处符号切换点对齐，故 $-a=1-b$，即 $a=b-1$。于是\n$ a^2+b^2=(b-1)^2+b^2=2b^2-2b+1=2\left(b-\frac{1}{2}\right)^2+\frac{1}{2}\ge\frac{1}{2}$。\n当 $b=\frac{1}{2}$ 时取等，此时 $a=-\frac{1}{2}$，故最小值为 $\frac{1}{2}$，选 C。
