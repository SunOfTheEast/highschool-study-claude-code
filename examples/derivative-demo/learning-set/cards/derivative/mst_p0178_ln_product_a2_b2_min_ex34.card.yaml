  what_it_trains: 训练对“线性因子 × 对数因子”的恒号题先做零点对齐，再把参数最值转为单变量配方法。
  recognition_cues:
    - 出现 $(\text{线性})\cdot\ln(\text{线性})$ 的乘积结构。
    - 题目目标是参数平方和最小值。
    - 源解直接提示“穿根原理”。
  normalization_moves:
    - 写两因子零点：$x=-a,\ x=1-b$。
    - 对齐得 $-a=1-b$。
    - 消掉一个参数再做配方。
  common_failures:
    - 把 $\ln(x+b)=0$ 错写成 $x=-b$。
    - 由 $-a=1-b$ 反解 $a,b$ 时符号出错。
    - 配方后误判常数项，导致选项偏到 $\frac{1}{4}$。
