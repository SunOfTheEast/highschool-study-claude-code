solution:
  source_solution_summary: 定义域为 $x>-b$。源解按穿根原理处理乘积结构：一次因子 $a+x$ 的零点为 $x=-a$，对数因子 $\ln(x+b)$ 的零点为 $x=1-b$。由题设 $f(x)=(a+x)\ln(x+b)\ge0$，两处符号切换点对齐，故 $-a=1-b$，即 $a=b-1$。于是\n$ a^2+b^2=(b-1)^2+b^2=2b^2-2b+1=2\left(b-\frac{1}{2}\right)^2+\frac{1}{2}\ge\frac{1}{2}$。\n当 $b=\frac{1}{2}$ 时取等，此时 $a=-\frac{1}{2}$，故最小值为 $\frac{1}{2}$，选 C。
  key_steps:
    - step_id: step_1
      statement: 写出定义域与两个因子的零点。
      formula_trace:
        from: $f(x)=(a+x)\ln(x+b)$
        to: 定义域 $x>-b$；$a+x=0$ 的零点是 $x=-a$；$\ln(x+b)=0$ 的零点是 $x=1-b$
        operation: 分别解线性与对数零点方程。
        why: 穿根原理要先定位两条“过零”位置。
      source_ref: page_0178_ex34a_solution
    - step_id: step_2
      statement: 按穿根原理对齐零点。
      formula_trace:
        from: $f(x)\ge0$
        to: $-a=1-b$
        operation: 令两因子符号切换点重合。
        why: 这是源页给出的核心关系。
      source_ref: page_0178_ex34a_solution
    - step_id: step_3
      statement: 代入并化为单变量二次式。
      formula_trace:
        from: $-a=1-b$
        to: $a=b-1,\quad a^2+b^2=(b-1)^2+b^2=2b^2-2b+1$
        operation: 消元代换。
        why: 将双参数最值降为一元最值。
      source_ref: page_0178_ex34a_solution
    - step_id: step_4
      statement: 配方求最小值并回填选项。
      formula_trace:
        from: $2b^2-2b+1$
        to: $2\left(b-\frac{1}{2}\right)^2+\frac{1}{2}\ge\frac{1}{2}$
        operation: 完全平方。
        why: 直接得到最小值对应选项 C。
      source_ref: page_0178_ex34a_solution
