solution:
  source_solution_summary: 先验算 $x=0$ 时 $(e^0-0)(0^2-0+1)=1\ge0$。对 $x\ne0$ 分区：\n当 $x>0$，原式等价于 $\left(a-\frac{e^x}{x}\right)\left(a-\left(x+\frac{1}{x}\right)\right)\le0$ 的同号判定。源解写成两组“同时 $\le$ 或同时 $\ge$”条件，并令 $f(x)=\frac{e^x}{x}$、$g(x)=x+\frac{1}{x}$，用 $f_{\min}=e,\ g_{\min}=2$ 且两者无最大值得到 $a\le2$。\n当 $x<0$，同理得到 $a$ 需要同时不小于两函数的上界边界；由 $g_{\max}=-2$、$f(x)<0$ 且上确界为 $0$，可归结为 $a\ge0$。综合得 $0\le a\le2$。\n检验选项：$-e<0$ 不可，$\ln6\in(0,2)$ 可，$e^2>2$ 不可，$\frac{\pi}{2}\in(0,2)$ 可，故选 BD。
  key_steps:
    - step_id: step_1
      statement: 先做 $x=0$ 的基点检验。
      formula_trace:
        from: $(e^x-ax)(x^2-ax+1)\ge0$
        to: $(e^0-0)(0^2-0+1)=1\ge0$
        operation: 代入零点。
        why: 确认原不等式在中心点无额外约束。
      source_ref: page_0179_ex34b_continuation
    - step_id: step_2
      statement: 处理 $x>0$：改写为两函数对参数的上下夹。
      formula_trace:
        from: $e^x-ax$ 与 $x^2-ax+1$ 在 $x>0$ 的同号要求
        to: $a\le\frac{e^x}{x},\ a\le x+\frac{1}{x}$（或另一支 $a\ge\cdots$）
        operation: 对 $x>0$ 除以正数 $x$，分同号两支。
        why: 把乘积条件转成参数与函数图像的比较。
      source_ref: page_0179_ex34b_continuation
    - step_id: step_3
      statement: 在 $x>0$ 上取可行公共边界。
      formula_trace:
        from: $f(x)=\frac{e^x}{x},\ g(x)=x+\frac{1}{x}$
        to: $f_{\min}=e,\ g_{\min}=2$，且上界分支无解 $\Rightarrow a\le2$
        operation: 比较两函数在 $(0,+\infty)$ 的最小值与“无最大值”性质。
        why: 得到正半轴对 $a$ 的必要范围。
      source_ref: page_0179_ex34b_continuation
    - step_id: step_4
      statement: 处理 $x<0$：继续做同号分支。
      formula_trace:
        from: $e^x-ax$ 与 $x^2-ax+1$ 在 $x<0$ 的同号要求
        to: $a\ge\frac{e^x}{x},\ a\ge x+\frac{1}{x}$（或另一支 $a\le\cdots$）
        operation: 对 $x<0$ 除以负数后按源解分支。
        why: 补齐负半轴约束。
      source_ref: page_0179_ex34b_continuation
    - step_id: step_5
      statement: 在 $x<0$ 上压出下界。
      formula_trace:
        from: $g_{\max}=-2,\ f(x)<0,\ \sup f(x)=0$
        to: $a\ge0$
        operation: 取两函数共同上界约束；另一分支因“下无界”不可行。
        why: 得到负半轴对 $a$ 的必要范围。
      source_ref: page_0179_ex34b_continuation
    - step_id: step_6
      statement: 合并区间并筛选选项。
      formula_trace:
        from: $a\le2$ 与 $a\ge0$
        to: $0\le a\le2 \Rightarrow a\in\{\ln6,\frac{\pi}{2}\}$
        operation: 区间交集后逐项代数比较。
        why: 得到多选答案 BD。
      source_ref: page_0179_ex34b_continuation
teaching_card:
  student_title: 先分 $x$ 正负，再夹住参数区间
  what_it_trains: 训练“乘积恒号 + 参数”题的稳定流程：按自变量符号分区，把每区间都改写成参数与函数最值的比较。
  recognition_cues:
    - 题干是两个含 $a$ 因子的乘积恒非负。
    - 一个因子含 $e^x$，另一个可整理成 $x+\frac{1}{x}$。
    - 最终问题是多选候选参数筛选。
  normalization_moves:
    - 先代 $x=0$ 做一致性检查。
    - 对 $x>0$、$x<0$ 各自除以 $x$，注意方向。
    - 把条件统一成 $a$ 与 $f,g$ 的上下界比较。
    - 合并区间后再做候选值判定。
  common_failures:
    - 忽略 $x<0$ 分支，直接只做 $x>0$。
    - 把“无最大值/无最小值”误读成有界，导致错误保留无解分支。
    - 最后筛选选项时只近似估值，不先写出区间 $[0,2]$。
  similar_practice_query: 乘积恒成立 参数范围 x正负分类 e^x/x x+1/x 多选
quality:
  confidence: high
