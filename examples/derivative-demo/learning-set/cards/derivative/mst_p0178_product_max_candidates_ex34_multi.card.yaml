stem: |-
  （2023 · 山西模拟 · 多选 T11）已知 $(e^x-ax)(x^2-ax+1)\geqslant0$，则 $a$ 的可能取值有（  ）
  A. -e
  B. \ln 6
  C. e^2
  D. \frac{\pi}{2}
answer: |-
  BD

  先验算 $x=0$ 时 $(e^0-0)(0^2-0+1)=1\ge0$。对 $x\ne0$ 分区：\n当 $x>0$，原式等价于 $\left(a-\frac{e^x}{x}\right)\left(a-\left(x+\frac{1}{x}\right)\right)\le0$ 的同号判定。源解写成两组“同时 $\le$ 或同时 $\ge$”条件，并令 $f(x)=\frac{e^x}{x}$、$g(x)=x+\frac{1}{x}$，用 $f_{\min}=e,\ g_{\min}=2$ 且两者无最大值得到 $a\le2$。\n当 $x<0$，同理得到 $a$ 需要同时不小于两函数的上界边界；由 $g_{\max}=-2$、$f(x)<0$ 且上确界为 $0$，可归结为 $a\ge0$。综合得 $0\le a\le2$。\n检验选项：$-e<0$ 不可，$\ln6\in(0,2)$ 可，$e^2>2$ 不可，$\frac{\pi}{2}\in(0,2)$ 可，故选 BD。
