  key_steps:
    - step_id: step_1
      statement: 由对数变形确认 $f,g$ 互为反函数，先判 A。
      formula_trace:
        from: $y=e^{kx}$
        to: $x=\\frac{\\ln y}{k}$
        operation: 两边取自然对数并解出 $x$。
        why: 得到关于 $y=x$ 的对称关系，直接支持 A。
      source_ref: page_0194_ex24_solution_start
    - step_id: step_2
      statement: 在 $k=e$ 时找平行于 $y=x$ 的切线切点。
      formula_trace:
        from: $f^{\\prime}(x)=e\\cdot e^{ex}$
        to: $M\\left(-\\frac1e,\\frac1e\\right)$
        operation: 令斜率等于 1，解 $e\\cdot e^{ex}=1$。
        why: 最短距离对应对称轴法，需要先定位关键切点。
      source_ref: page_0194_ex24_solution_start
    - step_id: step_3
      statement: 把最短距离写成到对称轴距离的两倍，判 B 错。
      formula_trace:
        from: $d=\\mathrm{dist}(M,x-y=0)=\\frac{\\sqrt2}{e}$
        to: $|AB|_{\\min}=2d=\\frac{2\\sqrt2}{e}$
        operation: 应用反函数图像关于 $y=x$ 对称的距离结论。
        why: 与选项给值 $\\frac{\\sqrt2}{e}$ 不一致。
      source_ref: page_0194_ex24_solution_start
    - step_id: step_4
      statement: 在 $k=1$ 时用导数唯一零点锁定极小值点。
