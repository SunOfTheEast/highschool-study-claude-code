        from: $f(x)=e^{-2ex},\\ g(x)=\\frac{\\ln x}{-2e}$
        to: 3 个交点 $\\Rightarrow$ $G(x)=f(x)-g(x)$ 有 3 个零点，选 ACD
        operation: 图像对称计数（并可用 $h(-2ex)=h(\\ln x)$ 分段同值核验）。
        why: 完成 D 的真值判定并收束多选结果。
      source_ref: page_0195_ex24_solution_cont
teaching_card:
  student_title: 互逆图像四选判真
  what_it_trains: 训练在同一题中切换“反函数对称、切线最短距、导数极小值、交点计数”四条判断链，并稳定完成多选筛查。
  recognition_cues:
    - 题干给出一组指数-对数互逆函数。
    - 选项同时涉及点对称、最短距离、极小值范围、零点个数。
    - 参数取值分别触发几何法与导数法。
  normalization_moves:
    - 先统一到“关于 $y=x$ 对称”的总框架。
    - 距离题优先找与 $y=x$ 平行切线。
    - 极值题写出 $F^{\\prime},F^{\\prime\\prime}$ 再定位唯一极小点。
    - 零点题先看交点计数，再用代数同值式复查。
  common_failures:
    - 把 B 项中的 $d$ 误当成 $|AB|_{\\min}$，漏掉 2 倍关系。
    - C 项只算到 $F_{\\min}=e^{x_0}$ 就停，不继续转成可比较上界。
    - D 项只说“互为反函数”但未完成三交点数量论证。
  similar_practice_query: 指数对数互逆 多选 y=x 对称 最短距离 极小值 零点个数
