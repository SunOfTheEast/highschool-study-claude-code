stem: |-
  （2023 · 东昌府区开学 T12）已知函数 $f(x)=e^{kx}$，$g(x)=\\frac{\\ln x}{k}$，其中 $k\\neq0$，则（  ）
  A. 若点 $P(a,b)$ 在 $f(x)$ 的图象上，则点 $Q(b,a)$ 在 $g(x)$ 的图象上
  B. 当 $k=e$ 时，设点 $A,B$ 分别在 $f(x),g(x)$ 的图象上，则 $|AB|$ 的最小值为 $\\frac{\\sqrt2}{e}$
  C. 当 $k=1$ 时，函数 $F(x)=f(x)-g(x)$ 的最小值小于 $\\frac{5}{2}$
  D. 当 $k=-2e$ 时，函数 $G(x)=f(x)-g(x)$ 有 3 个零点
answer: |
  ACD

  对 A：由
  \[
  y=e^{kx}\Rightarrow \ln y=kx\Rightarrow x=\frac{\ln y}{k},
  \]
  所以 $g(x)=\frac{\ln x}{k}$ 是 $f(x)=e^{kx}$ 的反函数，二者图像关于 $y=x$ 对称，A 正确。

  对 B（$k=e$）：$f(x)=e^{ex}$，求与 $y=x$ 平行切线，令
  \[
  f^{\prime}(x)=e\cdot e^{ex}=1\Rightarrow x=-\frac1e,\ f\!\left(-\frac1e\right)=\frac1e.
  \]
  切点为 $M(-1/e,1/e)$。$M$ 到对称轴 $x-y=0$ 的距离
  \[
  d=\frac{|-\frac1e-\frac1e|}{\sqrt2}=\frac{\sqrt2}{e},
  \]
  两条互逆曲线间对应点最短连线为 $2d$，故
  \[
  |AB|_{\min}=\frac{2\sqrt2}{e},
  \]
  与选项不符，B 错。

  对 C（$k=1$）：$F(x)=e^x-\ln x$，有
  \[
  F^{\prime}(x)=e^x-\frac1x,\quad F^{\prime\prime}(x)=e^x+\frac1{x^2}>0.
  \]
  故 $F^{\prime}$ 递增，且 $F^{\prime}(1/2)<0,\ F^{\prime}(1)>0$，存在唯一 $x_0\in(1/2,1)$ 使 $F^{\prime}(x_0)=0$。于是
  \[
  e^{x_0}=\frac1{x_0},\quad x_0=\ln\frac1{x_0}=-\ln x_0,
  \]
  且
  \[
  F_{\min}=F(x_0)=e^{x_0}=\frac1{x_0},\quad
  F_{\min}=-\ln x_0+x_0=\frac1{x_0}+x_0<2+\frac12=\frac52.
  \]
  所以 C 正确。

  对 D（$k=-2e$）：$f(x)=e^{-2ex}$、$g(x)=\frac{\ln x}{-2e}$ 都单调递减且互为反函数。由图像可见它们在右侧与 $y=x$ 上各有一交点，且在 $(1,0)$ 左右过渡区与对称位置再产生两交点，共 3 个交点，因此 $G(x)=f(x)-g(x)$ 有 3 个零点，D 正确。源解法二也用
  \[
  e^{-2ex}=\frac{\ln x}{-2e}\Rightarrow h(-2ex)=h(\ln x)
  \]
  分三段同值对应验证三解。综上选 ACD。
