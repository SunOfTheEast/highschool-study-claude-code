        from: $F^{\\prime}(x)=e^x-\\frac1x,\\ F^{\\prime\\prime}(x)>0$
        to: $\\exists!\\ x_0\\in\\left(\\frac12,1\\right),\\ F^{\\prime}(x_0)=0$
        operation: 由 $F^{\\prime}$ 递增与端点异号得到唯一根。
        why: 把极小值计算集中到 $x_0$。
      source_ref: page_0194_ex24_solution_start
    - step_id: step_5
      statement: 续页完成 C 的数值上界。
      formula_trace:
        from: $F^{\\prime}(x_0)=0\\Rightarrow e^{x_0}=\\frac1{x_0},\\ x_0=-\\ln x_0$
        to: $F_{\\min}=\\frac1{x_0}+x_0<\\frac52$
        operation: 利用 $x_0\\in(1/2,1)$ 与 $y=\\frac1x+x$ 在该区间递减做估计。
        why: 直接判定 C 正确。
      source_ref: page_0195_ex24_solution_cont
