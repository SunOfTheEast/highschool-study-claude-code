stem: |
  （2023·江西模拟 T16）已知 $ae^{ax}-\ln\left(x+\frac2a\right)-2\geqslant0$ 在其定义域上恒成立，则实数 $a$ 的取值范围________。
answer: |
  $[e,+\infty)$

  当 $a<0$ 时源解判定不成立；当 $a>0$ 时，题设在 $\left(-\frac2a,+\infty\right)$ 上恒成立。把 $\ln\left(x+\frac2a\right)$ 改为 $\ln(ax+2)-\ln a$ 后，原式等价于 $ae^{ax}+\ln(ae^{ax})\ge\ln(ax+2)+ax+2$。令 $h(t)=t+\ln t$，由 $h$ 递增得 $ae^{ax}\ge ax+2$，即 $e^{ax}\ge x+\frac2a$。设 $y=ax+2>0$，则 $e^y/y\ge e^2/a$；因为 $e^y/y$ 在 $y>0$ 的最小值为 $e$，故需且只需 $a\ge e$。
