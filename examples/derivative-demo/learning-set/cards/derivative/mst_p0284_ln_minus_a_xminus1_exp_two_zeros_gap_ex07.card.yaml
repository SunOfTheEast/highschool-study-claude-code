stem: |-
  （2019 · 天津）设函数 $f(x)=\ln x-a(x-1)e^x$，其中 $a\in\mathbf{R}$。
  1. 若 $a\le0$，讨论 $f(x)$ 的单调性。
  2. 若 $0<a<\frac1e$，证明 $f(x)$ 恰有两个零点。
  3. 设 $x_0$ 为 $f(x)$ 的极值点，$x_1$ 为 $f(x)$ 的零点，且 $x_1>x_0$，证明：$3x_0-x_1>2$。
answer: |-
  当 $a\le0$ 时 $f$ 在 $(0,+\infty)$ 上递增；当 $0<a<1/e$ 时恰有两个零点，且 $3x_0-x_1>2$。

  第(1)问直接求导： $f^\prime(x)=\frac{1-ax^2e^x}{x}$。当 $a\le0$ 时 $f^\prime(x)>0$， 所以 $f$ 在 $(0,+\infty)$ 递增。第(2)(i)问令 $g(x)=1-ax^2e^x$，它在正半轴递减，且 $g(1)=1-ae>0$。 用等效零点分析在 $x=\ln\frac1a$ 处找到 $g<0$，所以导函数唯一零点 $x_0\in(1,\ln\frac1a)$，原函数先增后减。又 $f(1)=0$， $f(x_0)>0$，再把 $f(x)=(x-1)(\frac{\ln x}{x-1}-ae^x)$，在 $x=\ln\frac1a$ 处找负值，得另一个零点 $x_1\in(1,\ln\frac1a)$。第(2)(ii)问由 $f^\prime(x_0)=0$ 得 $a=\frac1{x_0^2e^{x_0}}$，由 $f(x_1)=0$ 得 $a=\frac{\ln x_1}{(x_1-1)e^{x_1}}$。source 的核心不是强行代换， 而是用找点得到 $x_0,x_1$ 都被 $\ln\frac1a$ 控住： 要证 $3x_0-x_1>2$，只需证 $3x_0>2+\ln\frac1a>2+x_1$。代入 $\ln\frac1a=\ln(x_0^2e^{x_0})$ 后化为 $x_0>\ln x_0+1$，由 $x_0>1$ 成立。
