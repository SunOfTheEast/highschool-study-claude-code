stem: |-
  （福建省厦门市 2024 届高中毕业班第四次质量检测数学试题 T19）帕德近似是法国数学家亨利·帕德发明的用有理多项式近似特定函数的方法，在计算机数学中有着广泛的应用。已知函数 f(x) 在 x=0 处的 [m,n] 阶帕德近似定义为： R(x)=\frac{a_0+a_1x+\cdots+a_mx^m}{1+b_1x+\cdots+b_nx^n}，且满足： f(0)=R(0), f'(0)=R'(0), f^{(2)}(0)=R^{(2)}(0), \cdots, f^{(m+n)}(0)=R^{(m+n)}(0)。已知 f(x)=\ln(x+1) 在 x=0 处的 [2,2] 阶帕德近似为 R(x)=\frac{a+bx+\frac12x^2}{1+x+\frac16x^2}。
  (1). 求实数 a,b 的值。
  (2). 设 h(x)=f(x)-R(x)，证明：xh(x)\geqslant0。
  (3). 已知 x_1,x_2,x_3 是方程 \ln x=\lambda\left(x-\frac1x\right) 的三个不等实根，求实数 \lambda 的取值范围，并证明： \frac{x_1+x_2+x_3}{3}>\frac1\lambda-1。
answer: |-
  (1) a=0,b=1，R(x)=\frac{x+\frac12x^2}{1+x+\frac16x^2} =\frac{6x+3x^2}{6+6x+x^2}。(2) 证明见解析，结论为 xh(x)\geqslant0。 (3) \lambda 的取值范围为 0<\lambda<\frac12，并且 \frac{x_1+x_2+x_3}{3}>\frac1\lambda-1。

  第 (1) 问由 R(0)=a=f(0)=0 与 R'(0)=b=f'(0)=1 得 a=0,b=1。 第 (2) 问写 h(x)=\ln(1+x)-\frac{6x+3x^2}{6+6x+x^2}， 直接求得 h'(x)=\frac{x^4}{(1+x)(x^2+6x+6)^2}\geqslant0， 所以 h 在 (-1,+\infty) 上递增，结合 h(0)=0 得 -1<x<0 时 h(x)<0， x>0 时 h(x)>0，从而 xh(x)\geqslant0。第 (3) 问中，方程恒有根 x=1；存在三个不等实根等价于 0<\lambda<1/2，另两根互为倒数。取 x_3>1、x_1=1/x_3、x_2=1，再由第 (2) 问推出 \ln x>\frac{3x^2-3}{x^2+4x+1} (x>1)，代入 x_3 并与方程联立，得到 \lambda>\frac{3}{x_3+4+1/x_3}，于是 \frac1\lambda<\frac{x_3+4+1/x_3}{3} =\frac{x_1+x_2+x_3}{3}+1。
