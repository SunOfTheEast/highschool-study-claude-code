solution:
  source_solution_summary: |
    由 $g(3+x)$ 为偶函数且 $g(x)=f'(x+1)$，可得 $f'(x)$ 关于直线 $x=4$
    对称，即 $f'(4+t)=f'(4-t)$。对
    $f(2+x)-f(2-x)=4x$ 求导，得
    $f'(2+x)+f'(2-x)=4$，故 $f'(x)$ 关于点 $(2,2)$ 中心对称。
    轴对称与中心对称叠加后可得 $f'$ 的周期为 $8$，并有 $f'(2)=2$。
    又 $g$ 是 $f'$ 左移 $1$ 个单位，故 $g$ 关于 $x=3$ 轴对称，且关于
    $(1,2)$ 中心对称，所以 $g(17)=g(1)=2$。
    同时 $g'$ 周期也为 $8$，并有 $g'(-1)=g'(3)=0$，故
    $g'(7)=g'(-1)=0$。于是
    $g'(7)+g(17)=2$，选 C。
  key_steps:
    - step_id: step_1
      statement: 由 $g(3+x)$ 偶性把信息转回到 $f'$ 的轴对称。
      formula_trace:
        from: |
          $g(3+t)=g(3-t),\qquad g(x)=f'(x+1)$
        to: |
          $f'(4+t)=f'(4-t)$
        operation: 把 $g$ 写成 $f'$ 的平移表达，再对称点回代。
        why: 确定 $f'$ 的一条对称轴 $x=4$，为后续周期配凑做准备。
      source_ref: page_0120
    - step_id: step_2
      statement: 由差式求导得到 $f'$ 的中心对称。
      formula_trace:
        from: $f(2+x)-f(2-x)=4x$
        to: $f'(2+x)+f'(2-x)=4$
        operation: 两边对 $x$ 求导并整理成“和为常数”形式。
        why: 这等价于 $f'$ 关于点 $(2,2)$ 中心对称。
      source_ref: page_0120
    - step_id: step_3
      statement: 把 $f'$ 的对称性平移到 $g$ 上并取函数值。
      formula_trace:
        from: |
          $g(x)=f'(x+1)$
        to: |
          $g\text{ 关于 }x=3\text{ 轴对称，关于 }(1,2)\text{ 中心对称，}g(17)=2$
        operation: 将 $f'$ 左移 1 个单位。
        why: 目标式包含 $g(17)$，可直接由中心对称与周期读出。
      source_ref: page_0120
    - step_id: step_4
      statement: 利用 $g'$ 的周期与对称得到导数项。
      formula_trace:
        from: |
          $T_g=8,\qquad g'(1+t)=g'(1-t),\qquad g'(3)=0$
        to: |
          $g'(7)=g'(-1)=g'(3)=0$
        operation: 先用周期把 7 退回到 -1，再用对称转到 3。
        why: 导数项归零后即可得到最终值。
      source_ref: page_0120
teaching_card:
  student_title: 先配对称再读周期：一眼算出组合点值
  what_it_trains: 训练把复合条件转成轴对称、中心对称并联立出周期，再用于函数值和导数值求值。
  recognition_cues:
    - 题干同时给“偶函数”与“$f(a+x)-f(a-x)$”结构，常见于对称配凑。
    - 最终问的是两个离散点值，通常依赖周期与对称，不靠显式表达式。
    - 出现 $g(x)=f'(x+1)$ 时要先做平移还原。
  normalization_moves:
    - 先由偶性得到轴对称。
    - 再由求导得到中心对称。
    - 轴 + 中心配出周期。
    - 把 17、7 用周期和对称折返到基准点。
  common_failures:
    - 把 $f(2-x)$ 求导写成 $f'(2-x)$，漏掉负号导致和式错误。
    - 把“关于点对称”误当“关于轴对称”，导致导数关系错向。
    - 只求出 $g(17)$，遗漏 $g'(7)$ 的归零链。
    - 未先平移还原，直接在 $f'$ 与 $g$ 之间混用对称点。
  similar_practice_query: 抽象函数 对称 轴对称 中心对称 周期 求值 g(x)=f'(x+1)
