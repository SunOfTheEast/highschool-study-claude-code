original_problem:
  stem: （2024 · 重庆南开中学期末）已知函数 $f(x)=\frac{\ln x}{x-1}$。
  parts: *a1
  choices: []
  answer: 第(1)问：$f(x)$ 在 $(0,1)$ 和 $(1,+\infty)$ 上均单调递减，无单调增区间。第(2)问：$a\in\{-\frac12\}$。
  fidelity_notes:
    - 定义域为 $(0,1)\cup(1,+\infty)$。
    - 第(2)问的分侧符号来自分母 $x-1$ 在 1 两侧变号。
solution:
  source_solution_summary: 第(1)问定义域为 $(0,1)\cup(1,+\infty)$， $f^\prime(x)=\frac{1-\frac1x-\ln x}{(x-1)^2}$。令 $g(x)=1-\frac1x-\ln x$，则 $g^\prime(x)=\frac{1-x}{x^2}$，在 $(0,1)$ 上递增、 在 $(1,+\infty)$ 上递减，且两侧都以 $g(1)=0$ 为上界， 故 $g(x)<0$，所以 $f$ 在两个定义区间上均递减。第(2)问 $f(x)<x^a$ 等价于：$x>1$ 时 $h(x)=x^{a+1}-x^a-\ln x>0$，$0<x<1$ 时 $h(x)<0$。 因 $h(1)=0$、$h^\prime(1)=0$，这是导函数极点效应； 再令 $\varphi(x)=(a+1)x^{a+1}-ax^a-1$， $\varphi^\prime(x)=x^{a-1}[(a+1)^2x-a^2]$。通过 $x_0=\frac{a^2}{(a+1)^2}$ 与 1 的位置分类，除 $a=-\frac12$ 外均与所需分侧符号矛盾，因此 $a=-\frac12$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：求导并抽出分子。
      formula_trace:
        from: $f(x)=\frac{\ln x}{x-1}$
        to: $f^\prime(x)=\frac{1-\frac1x-\ln x}{(x-1)^2}$
        operation: 商法则求导。
        why: 分母平方为正，单调性只看分子符号。
      source_ref: page_0267_ex7_solution_start
    - step_id: step_2
      statement: 第(1)问：证明分子恒负。
      formula_trace:
        from: $g(x)=1-\frac1x-\ln x$
        to: $g^\prime(x)=\frac{1-x}{x^2}$，$g(x)<g(1)=0$
        operation: 分 $(0,1)$ 与 $(1,+\infty)$ 判单调。
        why: 得到 $f^\prime(x)<0$。
      source_ref: page_0267_ex7_solution_start
    - step_id: step_3
      statement: 第(2)问：把不等式改成分侧符号问题。
      formula_trace:
        from: $\frac{\ln x}{x-1}<x^a$
        to: $x>1$ 时 $h(x)>0$；$0<x<1$ 时 $h(x)<0$
        operation: 乘以 $x-1$ 并注意变号。
        why: $x=1$ 两侧的符号要求相反。
      source_ref: page_0267_ex7_solution_start
    - step_id: step_4
      statement: 第(2)问：识别导函数极点效应。
      formula_trace:
        from: $h(x)=x^{a+1}-x^a-\ln x$
        to: $h(1)=0$，$h^\prime(1)=0$
        operation: 代入分界点 $x=1$。
        why: 原函数定义域不含 $x=1$，但两侧需要在这里一边负一边正。
      source_ref: page_0267_ex7_solution_start
    - step_id: step_5
      statement: 第(2)问：用二阶信息锁候选。
      formula_trace:
        from: $\varphi^\prime(1)=2a+1$
        to: 候选临界为 $a=-\frac12$
        operation: 让导函数在 $x=1$ 附近产生正确穿越。
        why: 若二阶方向不匹配，就会在一侧破坏 $h$ 的符号要求。
      source_ref: page_0268_ex7_solution_continuation
    - step_id: step_6
      statement: 第(2)问：分类排除其余参数。
      formula_trace:
        from: $x_0=\frac{a^2}{(a+1)^2}$
        to: $a\ge1$、$a\le-1$、$1>a>-\frac12$、$-1<a<-\frac12$ 均矛盾
        operation: 按 $x_0$ 与 1 的位置分类。
        why: 三幅图对应不同弯曲形态，只有 $a=-\frac12$ 符合两侧符号。
      source_ref: page_0268_ex7_solution_continuation
teaching_card:
  student_title: 开区间分界点：$x=1$ 不在定义域，但符号必须从这里穿过去
  what_it_trains: 训练导函数极点效应失效/成立的判断：函数本身不含分界点，却要靠分界点附近的局部形态锁参数。
  recognition_cues:
    - $\frac{\ln x}{x-1}$ 在 $x=1$ 不定义，但左右极限相关。
    - 目标是和 $x^a$ 比较，乘 $x-1$ 后左右区间符号要求相反。
    - $h(1)=0$、$h^\prime(1)=0$ 自动成立，关键看更高阶形态。
  normalization_moves:
    - 先完成第(1)问的单调性，不把它和求参混在一起。
    - 第(2)问先改成 $h(x)$ 在 1 两侧的符号要求。
    - 再看 $\varphi^\prime$ 和 $x_0$，用分类排除只剩 $a=-\frac12$。
  common_failures:
    - 乘以 $x-1$ 时忘记 $0<x<1$ 要反向。
    - 把 $x=1$ 当作定义域内极值点直接套结论。
    - 只算到 $h^\prime(1)=0$，没有继续看导函数的形态。
    - 分类时把 $x_0<1$ 与 $x_0>1$ 对应的 $a$ 区间写反。
  similar_practice_query: lnx/(x-1) x^a 导函数极点效应 x=1 分侧符号 a=-1/2
