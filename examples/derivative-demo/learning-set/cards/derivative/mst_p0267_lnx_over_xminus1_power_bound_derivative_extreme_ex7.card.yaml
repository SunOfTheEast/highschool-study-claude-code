stem: |-
  （2024 · 重庆南开中学期末）已知函数 $f(x)=\frac{\ln x}{x-1}$。
  1. 求 $f(x)$ 的单调性。
  2. 若 $f(x)<x^a$，求实数 $a$ 的取值集合。
answer: |-
  第(1)问：$f(x)$ 在 $(0,1)$ 和 $(1,+\infty)$ 上均单调递减，无单调增区间。第(2)问：$a\in\{-\frac12\}$。

  第(1)问定义域为 $(0,1)\cup(1,+\infty)$， $f^\prime(x)=\frac{1-\frac1x-\ln x}{(x-1)^2}$。令 $g(x)=1-\frac1x-\ln x$，则 $g^\prime(x)=\frac{1-x}{x^2}$，在 $(0,1)$ 上递增、 在 $(1,+\infty)$ 上递减，且两侧都以 $g(1)=0$ 为上界， 故 $g(x)<0$，所以 $f$ 在两个定义区间上均递减。第(2)问 $f(x)<x^a$ 等价于：$x>1$ 时 $h(x)=x^{a+1}-x^a-\ln x>0$，$0<x<1$ 时 $h(x)<0$。 因 $h(1)=0$、$h^\prime(1)=0$，这是导函数极点效应； 再令 $\varphi(x)=(a+1)x^{a+1}-ax^a-1$， $\varphi^\prime(x)=x^{a-1}[(a+1)^2x-a^2]$。通过 $x_0=\frac{a^2}{(a+1)^2}$ 与 1 的位置分类，除 $a=-\frac12$ 外均与所需分侧符号矛盾，因此 $a=-\frac12$。
