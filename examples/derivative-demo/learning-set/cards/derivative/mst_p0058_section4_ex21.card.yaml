solution:
  source_solution_summary: |
    由 $f(1)+f(3)=2f(2)$ 计算得 $12a+2b=0$，所以 $b=-6a$，于是
    $f(x)=a(x-2)^3+(c-12a)(x-2)+f(2)$。
    这说明图像关于点 $(2,f(2))$ 成中心对称，A 正确；导函数 $f^{\prime}(x)=3a(x-2)^2+c-12a$ 关于 $x=2$ 对称，若 $(0,1)$ 上导数为正，则与之对称的 $(3,4)$ 上导数也为正，B 正确。又 $f(1)-f(3)=2(11a-c)$，条件 $a[f(1)-f(3)]\ge0$ 推出导函数在顶点处与开口方向相反，从而有两个极值点，所以 C 错。对 D，任取 $x_0$，设 $u=x-2,u_0=x_0-2$，曲线与该直线相交等价于 $a(u^3-u_0^3)=0$，实数范围内只有 $u=u_0$，故只有一个公共点，D 正确。
  key_steps:
    - step_id: step_1
      statement: 把题设条件化成二次项系数关系。
      formula_trace:
        from: $f(1)+f(3)=2f(2)$
        to: $12a+2b=0\Longleftrightarrow b=-6a$
        operation: 把 $f(1),f(2),f(3)$ 展开并合并同类项。
        why: 三次函数的二阶差分只留下 $a,b$，能定位对称中心横坐标。
      source_ref: page_0059_ex21_solution
    - step_id: step_2
      statement: 用 $x-2$ 重写三次函数，判断 A。
      formula_trace:
        from: $f(x)=ax^3-6ax^2+cx+d$
        to: $f(x)=a(x-2)^3+(c-12a)(x-2)+f(2)$
        operation: 令 $u=x-2$ 展开整理。
        why: 关于 $u=0$ 只含奇次项和常数，图像关于 $(2,f(2))$ 中心对称。
      source_ref: page_0059_ex21_solution
    - step_id: step_3
      statement: 利用导函数的轴对称性判断 B。
      formula_trace:
        from: $f^{\prime}(x)=3ax^2-12ax+c$
        to: $f^{\prime}(x)=3a(x-2)^2+c-12a,\quad f^{\prime}(x)=f^{\prime}(4-x)$
        operation: 配方后读取导函数关于 $x=2$ 对称。
        why: $(0,1)$ 与 $(3,4)$ 关于 $x=2$ 对称，导数符号同步。
      source_ref: page_0059_ex21_solution
    - step_id: step_4
      statement: 严格复核 C 的条件会推出有极值，而不是无极值。
      formula_trace:
        from: $a\cdot f(1)\geqslant a\cdot f(3)$
        to: $a(11a-c)\ge0$
        operation: 用 $f(1)-f(3)=2(11a-c)$ 化简不等式。
        why: 这是判断导函数顶点值与二次项开口方向的关键关系。
      source_ref: page_0059_ex21_solution
    - step_id: step_5
      statement: 由 C 的条件看导函数确实有两个零点。
      formula_trace:
        from: $f^{\prime}(x)=3a(x-2)^2+c-12a,\quad a(11a-c)\ge0$
        to: $f^{\prime}(x)=0\ \text{有两个实根，}f(x)\ \text{有极值}$
        operation: 若 $a>0$，则 $c\le11a<12a$；若 $a<0$，则 $c\ge11a>12a$，均使顶点值 $c-12a$ 与开口方向相反。
        why: 导函数二次曲线与 $x$ 轴相交两次，三次函数出现极大、极小值。
      source_ref: page_0059_ex21_solution
    - step_id: step_6
      statement: 把 D 的几何说法改写成代数唯一交点。
      formula_trace:
        from: $y=(c-12a)(x-x_0)+f(x_0)$ 与 $y=f(x)$
        to: $a\big[(x-2)^3-(x_0-2)^3\big]=0$
        operation: 用 $f(x)=a(x-2)^3+(c-12a)(x-2)+f(2)$ 代入相交方程，斜率项相消。
        why: 实数中 $u^3=u_0^3$ 只有 $u=u_0$，所以唯一公共点就是原点 $x=x_0$。
      source_ref: page_0059_ex21_solution
teaching_card:
  student_title: 把三次函数平移到对称中心
  what_it_trains: 训练看到三次函数的对称条件后，先平移到拐点中心，再统一处理单调、极值和交点问题。
  recognition_cues:
    - 题干给出 $f(1)+f(3)=2f(2)$，三个横坐标关于 2 对称。
    - 选项同时问中心对称、区间单调、极值和一类直线交点。
    - 直线斜率出现 $c-12a$，正好是 $f^{\prime}(2)$。
  normalization_moves:
    - 先展开题设得到 $b=-6a$。
    - 再把 $f(x)$ 改写成 $a(x-2)^3+(c-12a)(x-2)+f(2)$。
    - 用导函数关于 $x=2$ 对称来迁移单调性。
    - 把 D 的直线代回曲线，让一次项抵消，只剩三次方相等。
  common_failures:
    - 直接相信图中 $x=1,3$ 是极值点，没有用题设推导。
    - 只看函数图像对称，忘记 B 要比较导函数符号。
    - 判断 C 时把 $a$ 的正负漏掉。
    - D 中把“过任意曲线上一点且平行拐点切线”误当成普通切线。
  similar_practice_query: 三次函数 中心对称 拐点切线 平行线唯一交点 f(1)+f(3)=2f(2)
