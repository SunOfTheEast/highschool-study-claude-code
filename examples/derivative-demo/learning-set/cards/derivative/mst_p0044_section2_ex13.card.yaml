original_problem:
  stem: 写出曲线 y=\ln|x| 过坐标原点的切线方程：______，______。
  parts: *a1
  choices: []
  answer: y=\frac{x}{e}，y=-\frac{x}{e}
  fidelity_notes: []
solution:
  source_solution_summary: 按 |x| 的定义分两支。x>0 时是 y=\ln x，过原点的切线切点为 x=e，得到 y=x/e；x<0 时是 y=\ln(-x)，由对称性或同样求切点得到 y=-x/e。
  key_steps:
    - step_id: step_1
      statement: 把绝对值对数拆成正、负两支。
      formula_trace:
        from: y=\ln|x|
        to: "x>0: y=\\ln x；x<0: y=\\ln(-x)"
        operation: 按 |x| 的定义分类。
        why: 两支的切点和斜率符号不同，必须分开找切线。
      source_ref: page_0044_solution
    - step_id: step_2
      statement: 正半轴上找过原点的对数切线。
      formula_trace:
        from: y-\ln t=\frac{1}{t}(x-t),\quad t>0
        to: t=e,\quad y=\frac{x}{e}
        operation: 令切线过 (0,0)，得 0-\ln t=-1，所以 t=e。
        why: 切点确定后，斜率为 1/e。
      source_ref: page_0044_solution
    - step_id: step_3
      statement: 负半轴上利用对称性得到另一条切线。
      formula_trace:
        from: y=\ln(-x)
        to: y=-\frac{x}{e}
        operation: 函数 y=\ln|x| 关于 y 轴对称，正半轴切线镜像后斜率变为 -1/e。
        why: 两条过原点切线互为关于 y 轴的对称直线。
      source_ref: page_0044_solution
teaching_card:
  student_title: 给 \ln|x| 找过原点的两条切线
  what_it_trains: 训练先拆绝对值，再用切线过定点倒推出对数切点。
  recognition_cues:
    - 曲线是 y=\ln|x|。
    - 切线要求过坐标原点。
    - 答案应成对出现，斜率一正一负。
  normalization_moves:
    - 先按 x>0、x<0 拆函数。
    - 正半轴求出切点 x=e 后，用对称性给出负半轴切线。
  common_failures:
    - 忘记负半轴还有一支 y=\ln(-x)。
    - 把过原点误解为在原点处相切。
    - 把负半轴切线写成 y=x/e。
  similar_practice_query: 对数绝对值函数过原点切线，按定义域拆分并利用对称性
