stem: 写出曲线 y=\ln|x| 过坐标原点的切线方程：______，______。
answer: |-
  y=\frac{x}{e}，y=-\frac{x}{e}

  按 |x| 的定义分两支。x>0 时是 y=\ln x，过原点的切线切点为 x=e，得到 y=x/e；x<0 时是 y=\ln(-x)，由对称性或同样求切点得到 y=-x/e。
