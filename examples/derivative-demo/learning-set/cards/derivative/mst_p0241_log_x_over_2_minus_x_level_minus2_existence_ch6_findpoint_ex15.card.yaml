original_problem:
  stem: （MST—李老师，改编）证明：$a<-2$，$0<x<1$ 时，$f(x)=\ln\frac{x}{2-x}+ax+b(x-1)^3=-2$ 有解。
  parts: *a1
  choices: []
  answer: 用关于横坐标为 $1$ 的点中心对称思路，可转到右侧区间找点；解析等价证明目标水平 $f(x)=-2$ 有解。
  fidelity_notes:
    - 题干写 $0<x<1$。
    - 解析使用 $1<x<2$，按用户说明理解为利用关于横坐标为 $1$ 的点中心对称讨论。
    - 解析末尾 $f(x)=0$ 按目标水平移到 0 的写法处理。
solution:
  source_solution_summary: 解析思路是连续性找点：先有 $f(1)=a<-2$，再在右侧 $1<x<2$ 通过放缩给出一个点使函数值高于 $-2$，从而夹出一个 目标水平解。用户已说明这里可以利用相关函数图像关于横坐标为 $1$ 的点中心对称，把区间挪到右侧讨论；解析末尾的 $f(x)=0$ 按把目标水平 $-2$ 移到 0 后的写法理解。
  key_steps:
    - step_id: step_1
      statement: 解析以 $x=1$ 作为低值点。
      formula_trace:
        from: $f(1)=a$
        to: $f(1)<-2$
        operation: 代入 $x=1$ 并用 $a<-2$。
        why: 连续性证明需要一个低于目标水平的点。
      source_ref: page_0241_ex15_solution
    - step_id: step_2
      statement: 解析在 $1<x<2$ 上找高于 $-2$ 的点。
      formula_trace:
        from: $f(x)=\ln\frac{x}{2-x}+ax+b(x-1)^3$
        to: $f(x)>\ln\frac{x}{2-x}+2a-|b|$
        operation: 按解析给出的区间和绝对值界放缩。
        why: 右侧对数项可向 $+\infty$ 增长，适合找高值点。
      source_ref: page_0241_ex15_solution
    - step_id: step_3
      statement: 按用户说明，用关于横坐标为 $1$ 的点中心对称理解区间挪动。
      formula_trace:
        from: 题干 $0<x<1$；解析 $1<x<2$
        to: 右侧找点可作为点中心对称后的讨论
        operation: 采用用户澄清后的阅读方式。
        why: 本题本质训练连续性找点，右侧区间用于构造跨过目标水平的点。
      source_ref: page_0241_ex15_solution
