stem: （MST—李老师，改编）证明：$a<-2$，$0<x<1$ 时，$f(x)=\ln\frac{x}{2-x}+ax+b(x-1)^3=-2$ 有解。
answer: |-
  用关于横坐标为 $1$ 的点中心对称思路，可转到右侧区间找点；解析等价证明目标水平 $f(x)=-2$ 有解。

  解析思路是连续性找点：先有 $f(1)=a<-2$，再在右侧 $1<x<2$ 通过放缩给出一个点使函数值高于 $-2$，从而夹出一个 目标水平解。用户已说明这里可以利用相关函数图像关于横坐标为 $1$ 的点中心对称，把区间挪到右侧讨论；解析末尾的 $f(x)=0$ 按把目标水平 $-2$ 移到 0 后的写法理解。
rubric:
  max_score: 3
  criteria:
    - step_id: step_1
      description: 解析以 $x=1$ 作为低值点。
      max_score: 1
    - step_id: step_2
      description: 解析在 $1<x<2$ 上找高于 $-2$ 的点。
      max_score: 1
    - step_id: step_3
      description: 按用户说明，用关于横坐标为 $1$ 的点中心对称理解区间挪动。
      max_score: 1
