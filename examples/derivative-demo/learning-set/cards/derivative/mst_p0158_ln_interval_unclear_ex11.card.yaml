stem: |-
  已知 $a=5$，$b=15\ln\frac43$，$c=16(\ln5-\ln4)$，则（  ）
  A. $a<c<b$
  B. $c<b<a$
  C. $b<a<c$
  D. $a<b<c$
answer: |
  B

  按重建后的题干，$b=15\ln\frac43$。
  先用
  \[
  \ln x\le x-1
  \]
  取 $x=\frac43$，得
  \[
  b<15\left(\frac43-1\right)=5=a,
  \]
  所以 $b<a$。
  对
  \[
  c=16(\ln5-\ln4)=16\ln\frac54,
  \]
  同样用 $\ln x\le x-1$ 得
  \[
  c<16\left(\frac54-1\right)=4.
  \]
  再用
  \[
  \ln x\ge\frac{2(x-1)}{x+1}\quad(x\ge1),
  \]
  取 $x=\frac43$，有
  \[
  b>15\cdot\frac{2\left(\frac43-1\right)}{\frac43+1}
   =\frac{30}{7}>4.
  \]
  于是
  \[
  c<4<\frac{30}{7}<b<a,
  \]
  即 $c<b<a$，选 B。
