teaching_card:
  student_title: 同一对数模板下的双侧夹逼链
  what_it_trains: 训练把多个对数量统一到同一不等式模板，并用中间阈值连接比较链。
  recognition_cues:
    - 多个量都可写成“常数倍 $\ln(\frac{p}{q})$”。
    - 解析同时调用 $\ln x\le x-1$ 与 $\ln x\ge\frac{2(x-1)}{x+1}$。
    - 题目目标是三数顺序，常通过构造公共阈值完成。
  normalization_moves:
    - 先把每个量写成单个对数形式。
    - 先压上界，再给关键量提下界。
    - 用固定阈值（如 4）拼接整条顺序。
  common_failures:
    - 把两条对数不等式方向混淆。
    - 只做 $b<a$、$c<4$，忘了补 $b>4$ 导致无法比较 $b,c$。
    - 没有看出 $b=15\ln\frac43$ 才能同时满足源解析的上下界链。
  similar_practice_query: 15ln(4/3) 16ln(5/4) 比大小 c<b<a 对数上下界
