stem: |-
  （2024 · 运城月考）已知 $a=1+\sin0.1$，$b=1+\ln1.1$，$c=1.01^{10}$，则（  ）
  A. $a<b<c$
  B. $b<a<c$
  C. $c<a<b$
  D. $b<c<a$
answer: |
  B

  先比较 $a,c$。
  源解把
  \[
  c=1.01^{10}
  \]
  做二项式展开并取前两项，得到
  \[
  c>1+\mathrm C_{10}^1\cdot0.01=1.1.
  \]
  又由 $\sin x<x\ (x>0)$，
  \[
  a=1+\sin0.1<1+0.1=1.1,
  \]
  故 $a<c$。
  再比较 $a,b$。设
  \[
  f(x)=\sin x-\ln(1+x),\quad x\in(0,1),
  \]
  源解给出
  \[
  f(x)>x-\frac{x^3}{6}-\left(x-\frac{x^2}{2}+\frac{x^3}{3}\right)
    =\frac{x^2}{2}-\frac{x^3}{2}>0.
  \]
  代入 $x=0.1$ 得 $\sin0.1>\ln1.1$，即 $a>b$。
  所以
  \[
  b<a<c,
  \]
  选 B。
