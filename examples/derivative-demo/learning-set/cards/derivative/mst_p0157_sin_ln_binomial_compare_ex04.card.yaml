  key_steps:
    - step_id: step_1
      statement: 二项式展开给出 $c$ 的下界。
      formula_trace:
        from: $c=1.01^{10}$
        to: $c>1+\mathrm C_{10}^1\cdot0.01=1.1$
        operation: 对 $(1+0.01)^{10}$ 取前两项并舍去正高次项。
        why: 建立与 $a$ 的共同比较锚点 $1.1$。
      source_ref: page_0157_ex04_problem
    - step_id: step_2
      statement: 用 $\sin x<x$ 得到 $a<1.1$。
      formula_trace:
        from: $a=1+\sin0.1$
        to: $a<1+0.1=1.1$
        operation: 在正区间应用 $\sin x<x$。
        why: 与 step_1 合并可得 $a<c$。
      source_ref: page_0157_ex04_problem
    - step_id: step_3
      statement: 用泰勒差值证明 $\sin0.1>\ln1.1$。
      formula_trace:
        from: $f(x)=\sin x-\ln(1+x)$
        to: $f(x)>\frac{x^2}{2}-\frac{x^3}{2}>0\ (0<x<1)$
        operation: 按源解分别用 $\sin x$ 下界与 $\ln(1+x)$ 上界。
        why: 直接给出 $a>b$。
      source_ref: page_0157_ex04_problem
    - step_id: step_4
      statement: 合并不等式并对应选项。
      formula_trace:
        from: $a<c$ 且 $a>b$
        to: $b<a<c$
        operation: 传递比较。
        why: 与选项 B 一致。
      source_ref: page_0157_ex04_problem
teaching_card:
  student_title: 先卡住 1.1，再拆分比较
  what_it_trains: 训练遇到“1+小量”时先找公共锚点，再用局部展开完成细分排序。
  recognition_cues:
    - 题干有 $1+\sin0.1$、$1+\ln1.1$、$1.01^{10}$。
    - 三个量都围绕 $1$ 附近波动。
    - 选项是线性次序。
  normalization_moves:
    - 把 $c$ 先压到 $>1.1$。
    - 把 $a$ 先压到 $<1.1$。
    - 再单独比较 $\sin0.1$ 与 $\ln1.1$。
  common_failures:
    - 把 $1.01^{10}$ 错当成 $(1+0.1)^{10}$ 直接放大。
    - 只比较 $a$ 与 $c$，漏掉 $b$ 的定位。
    - 泰勒差值展开到不同阶次导致符号不稳。
  similar_practice_query: 1+sin0.1 1+ln1.1 1.01^10 比大小 泰勒
