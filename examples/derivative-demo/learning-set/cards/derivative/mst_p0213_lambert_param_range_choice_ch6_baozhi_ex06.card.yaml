original_problem:
  stem: （2023 · 江西师大附中三模 T12）若 $\frac{e^x}{x}+a\ln x-ax+e^2\geqslant0\ (a>0)$，则 $a$ 的取值范围为（  ）
  parts: *a1
  choices:
    - label: A
      text_raw: $(0,e^2]$
      text_latex: $(0,e^2]$
    - label: B
      text_raw: $\left(0,\frac{e^2}{2}\right]$
      text_latex: $\left(0,\frac{e^2}{2}\right]$
    - label: C
      text_raw: $\left[\frac1e,e^2\right]$
      text_latex: $\left[\frac1e,e^2\right]$
    - label: D
      text_raw: $\left[\frac1e,\frac{e^2}{2}\right]$
      text_latex: $\left[\frac1e,\frac{e^2}{2}\right]$
  answer: A；$a\in(0,e^2]$。
  fidelity_notes:
    - source 题干显式给出参数前提 $a>0$。
    - 题面未单写“对任意 $x>0$ 恒成立”，但解析按 $x-\ln x$ 的全域性质求参，本卡按恒成立题处理。
solution:
  source_solution_summary: 先把原式改写为 $e^{x-\ln x-2}-\frac{a}{e^2}(x-\ln x)+1\ge0$。设 $g(t)=e^t-t-1\ge0$，则 $e^{x-\ln x-2}-\frac{a}{e^2}(x-\ln x)+1 =g(x-\ln x-2)+\left(1-\frac{a}{e^2}\right)(x-\ln x)$。 其中 $x-\ln x\ge1$，且取值 2 可达，因此可把主体选成 $x-\ln x-2$ 以触发 $g(0)=0$。当 $x-\ln x=2$ 时，原不等式化为 $2\left(1-\frac{a}{e^2}\right)\ge0$，故必有 $a\le e^2$；反过来若 $a\le e^2$，则 $\left(1-\frac{a}{e^2}\right)(x-\ln x)\ge0$，再结合 $g(\cdot)\ge0$，原式对定义域内 $x$ 成立。再并上题设 $a>0$，得 $a\in(0,e^2]$，选 A。
  key_steps:
    - step_id: step_1
      statement: 把原式统一到 $x-\ln x$ 的同构变量。
      formula_trace:
        from: $\frac{e^x}{x}+a\ln x-ax+e^2\ge0$
        to: $e^{x-\ln x-2}-\frac{a}{e^2}(x-\ln x)+1\ge0$
        operation: 利用 $\frac{e^x}{x}=e^{x-\ln x}$，再整体除以 $e^2$ 并配凑常数。
        why: 把混合指对式归并到同一个“朗博同构”变量。
      source_ref: page_0213_ex06_solution
    - step_id: step_2
      statement: 引入母函数并拆成“保值块 + 参数块”。
      formula_trace:
        from: $g(t)=e^t-t-1$
        to: $g(x-\ln x-2)+\left(1-\frac{a}{e^2}\right)(x-\ln x)\ge0$
        operation: 加减 $(x-\ln x-2)+1$ 完成同构拆分。
        why: 将恒成立条件压缩成可直接判号的两块。
      source_ref: page_0213_ex06_solution
    - step_id: step_3
      statement: 利用“可取零点”锁定必要条件。
      formula_trace:
        from: $x-\ln x\ge1$，且可取到 $x-\ln x=2$
        to: $2\left(1-\frac{a}{e^2}\right)\ge0\Rightarrow a\le e^2$
        operation: 在 $x-\ln x=2$ 时有 $g(0)=0$，直接消去保值块。
        why: 这一步给出参数上界的必要性。
      source_ref: page_0213_ex06_solution
    - step_id: step_4
      statement: 验证上界也是充分条件。
      formula_trace:
        from: $a\le e^2$
        to: $g(x-\ln x-2)+\left(1-\frac{a}{e^2}\right)(x-\ln x)\ge0$
        operation: 由 $g(\cdot)\ge0$ 与 $x-\ln x>0$ 逐项判非负。
        why: 完成恒成立的双向闭环。
      source_ref: page_0213_ex06_solution
    - step_id: step_5
      statement: 合并题设参数前提得到最终区间。
      formula_trace:
        from: $a\le e^2$ 与 $a>0$
        to: $a\in(0,e^2]$，选 A
        operation: 取区间交集。
        why: 给出与选项对应的最终答案。
      source_ref: page_0213_ex06_solution
teaching_card:
  student_title: 朗博同构取零点：一步锁定参数上界
  what_it_trains: 训练把含 $e^x/x$ 与 $\ln x$ 的恒成立题统一到 $x-\ln x$ 变量，并用同构母式取等点精确卡参数。
  recognition_cues:
    - 题干同时出现 $\frac{e^x}{x}$、$\ln x$ 与线性参数项。
    - 解析强调“选择有取零点条件的主体”。
    - 答案区间由同构余量系数直接决定。
  normalization_moves:
    - 先把原式改写为 $e^{x-\ln x-2}-\frac{a}{e^2}(x-\ln x)+1$。
    - 引入 $g(t)=e^t-t-1$ 完成保值拆分。
    - 选取 $x-\ln x=2$ 使 $g(0)=0$，直取必要条件。
    - 再用 $g\ge0$ 与余量同号验证充分性。
  common_failures:
    - 把 $x-\ln x\ge1$ 错当作“只能取到 1”，忽略可取到 2。
    - 同构拆分时漏掉常数 1，导致系数错配。
    - 只得到 $a\le e^2$ 却忘记并上题设 $a>0$。
  similar_practice_query: e^x/x a lnx 恒成立 朗博同构 x-lnx 参数范围
