stem: |-
  （2023 · 江西师大附中三模 T12）若 $\frac{e^x}{x}+a\ln x-ax+e^2\geqslant0\ (a>0)$，则 $a$ 的取值范围为（  ）
  A. $(0,e^2]$
  B. $\left(0,\frac{e^2}{2}\right]$
  C. $\left[\frac1e,e^2\right]$
  D. $\left[\frac1e,\frac{e^2}{2}\right]$
answer: |-
  A；$a\in(0,e^2]$。

  先把原式改写为 $e^{x-\ln x-2}-\frac{a}{e^2}(x-\ln x)+1\ge0$。设 $g(t)=e^t-t-1\ge0$，则 $e^{x-\ln x-2}-\frac{a}{e^2}(x-\ln x)+1 =g(x-\ln x-2)+\left(1-\frac{a}{e^2}\right)(x-\ln x)$。 其中 $x-\ln x\ge1$，且取值 2 可达，因此可把主体选成 $x-\ln x-2$ 以触发 $g(0)=0$。当 $x-\ln x=2$ 时，原不等式化为 $2\left(1-\frac{a}{e^2}\right)\ge0$，故必有 $a\le e^2$；反过来若 $a\le e^2$，则 $\left(1-\frac{a}{e^2}\right)(x-\ln x)\ge0$，再结合 $g(\cdot)\ge0$，原式对定义域内 $x$ 成立。再并上题设 $a>0$，得 $a\in(0,e^2]$，选 A。
