stem: |-
  （2019 · 新课标 II 卷 T21）已知函数 $f(x)=(x-a)\ln x$（$a\in\mathbf R$），它的导函数为 $f^\prime(x)$。
  1. 当 $a=1$ 时，求 $f^\prime(x)$ 的零点。
  2. 当 $a=0$ 时，证明：$f(x)<e^x+\cos x-1$。
answer: |-
  第 (1) 问：$f^\prime(x)$ 的零点为 $x=1$；第 (2) 问不等式成立。

  当 $a=1$ 时，$f(x)=(x-1)\ln x$，所以 $f'(x)=\ln x+1-\frac1x$。该函数在 $(0,+\infty)$ 上递增，且 $f'(1)=0$，故导函数零点为 $x=1$。当 $a=0$ 时，$f(x)=x\ln x$。 由 $\cos x-1+\frac{x^2}{2}\geqslant0$ 可知，只需证明 $x\ln x<e^x-\frac{x^2}{2}$，即 $\frac{\ln x}{x}<\frac{e^x}{x^2}-\frac12$。左侧最大为 $1/e$， 在 $x=e$ 取到；右侧最小为 $(e^2-2)/4$，在 $x=2$ 取到。由于 $1/e<(e^2-2)/4$，命题成立。
