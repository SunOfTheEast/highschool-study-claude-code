original_problem:
  stem: （2019 · 新课标 II 卷 T21）已知函数 $f(x)=(x-a)\ln x$（$a\in\mathbf R$），它的导函数为 $f^\prime(x)$。
  parts: *a1
  choices: []
  answer: 第 (1) 问：$f^\prime(x)$ 的零点为 $x=1$；第 (2) 问不等式成立。
  fidelity_notes:
    - 两问均无选项。
    - 第 (2) 问自然定义域为 $x>0$。
solution:
  source_solution_summary: 当 $a=1$ 时，$f(x)=(x-1)\ln x$，所以 $f'(x)=\ln x+1-\frac1x$。该函数在 $(0,+\infty)$ 上递增，且 $f'(1)=0$，故导函数零点为 $x=1$。当 $a=0$ 时，$f(x)=x\ln x$。 由 $\cos x-1+\frac{x^2}{2}\geqslant0$ 可知，只需证明 $x\ln x<e^x-\frac{x^2}{2}$，即 $\frac{\ln x}{x}<\frac{e^x}{x^2}-\frac12$。左侧最大为 $1/e$， 在 $x=e$ 取到；右侧最小为 $(e^2-2)/4$，在 $x=2$ 取到。由于 $1/e<(e^2-2)/4$，命题成立。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问先代入 $a=1$ 并求导。
      formula_trace:
        from: $f(x)=(x-1)\ln x$
        to: $f^\prime(x)=\ln x+1-\frac1x$
        operation: 乘积求导。
        why: 导函数零点问题先把导函数写出来。
      source_ref: page_0229_ex17_solution
    - step_id: step_2
      statement: 用增性锁定导函数零点。
      formula_trace:
        from: $f^\prime(x)=\ln x+1-\frac1x$
        to: $x=1$ 是唯一零点
        operation: 利用 $f^\prime(x)$ 递增且 $f^\prime(1)=0$。
        why: 递增性排除其他零点。
      source_ref: page_0229_ex17_solution
    - step_id: step_3
      statement: 第 (2) 问把三角部分先放缩掉。
      formula_trace:
        from: $\cos x-1+\frac{x^2}{2}\geqslant0$
        to: $e^x+\cos x-1\geqslant e^x-\frac{x^2}{2}$
        operation: 使用 $\cos x\geqslant1-\frac{x^2}{2}$。
        why: 右侧变成指数和二次项，便于和 $x\ln x$ 比。
      source_ref: page_0229_ex17_solution
    - step_id: step_4
      statement: 把证明目标转成两个函数的最大最小比较。
      formula_trace:
        from: $x\ln x<e^x-\frac{x^2}{2}$
        to: $\frac{\ln x}{x}<\frac{e^x}{x^2}-\frac12$
        operation: 两边除以 $x^2>0$。
        why: $\ln x/x$ 和 $e^x/x^2-\frac12$ 都有清晰极值点。
      source_ref: page_0229_ex17_solution
    - step_id: step_5
      statement: 分别取左侧最大和右侧最小。
      formula_trace:
        from: $h(x)=\frac{\ln x}{x},\quad g(x)=\frac{e^x}{x^2}-\frac12$
        to: $h_{\max}=1/e,\quad g_{\min}=(e^2-2)/4$
        operation: 求导判极值，$h$ 在 $x=e$ 取最大，$g$ 在 $x=2$ 取最小。
        why: 如果左侧最大仍小于右侧最小，则原不等式恒成立。
      source_ref: page_0229_ex17_solution
    - step_id: step_6
      statement: 完成分治比较。
      formula_trace:
        from: $\frac1e<\frac{e^2-2}{4}$
        to: $x\ln x<e^x+\cos x-1$
        operation: 左最大小于右最小，并回代三角放缩。
        why: 两个独立块比较完成后，原命题成立。
      source_ref: page_0229_ex17_solution
teaching_card:
  student_title: 把三角先放成二次，再比较 $\ln x/x$ 和指数块
  what_it_trains: 训练分而治之中的“左最大右最小”：把混合不等式拆成两个可以分别取界的整体。
  recognition_cues:
    - $x\ln x$ 与 $e^x$ 同时出现，常需要除出 $\ln x/x$。
    - $\cos x-1$ 可以用 $-\frac{x^2}{2}$ 承接。
    - 出现 $\frac{\ln x}{x}$ 和 $\frac{e^x}{x^2}$ 后，极值点分别是 $e$ 和 2。
  normalization_moves:
    - 第 (1) 问用导函数增性得到零点 $x=1$。
    - 第 (2) 问先用 $\cos x\geqslant1-\frac{x^2}{2}$。
    - 同除以 $x^2$，把目标变成两个函数比较。
    - 证明左边最大值小于右边最小值。
  common_failures:
    - 看见 $\cos x$ 就直接泰勒展开，但没有把它和后面的二次结构接起来。
    - 只会分别求极值，没说明为什么左最大小于右最小可以推出恒成立。
    - 忽略 $x>0$，除以 $x^2$ 时没有说明正性。
  similar_practice_query: xlnx exp cos 三角二次放缩 lnx/x e^x/x^2 左最大右最小 分而治之
