solution:
  source_solution_summary: |
    设切点为 $(x_0,\ln x_0)$，切线方程为 $y-\ln x_0=\frac1{x_0}(x-x_0)$。代入 $(s,t)$ 得 $t+1=\ln x_0+\frac{s}{x_0}$。令 $F(x)=\ln x+\frac{s}{x}\ (x>0)$，则切线条数等价于直线 $y=t+1$ 与 $F(x)$ 的交点个数。若 $s\le0$，$F'(x)=\frac{x-s}{x^2}>0$，不可能有两个交点；若 $s>0$，$F$ 在 $(0,s)$ 上递减、在 $(s,+\infty)$ 上递增，最小值为 $F(s)=\ln s+1$。要有两个不同交点，须 $t+1>\ln s+1$，即 $t>\ln s$，故选 D。
  key_steps:
    - step_id: step_1
      statement: 设切点并代入外点坐标。
      formula_trace:
        from: |
          $y-\ln x_0=\frac1{x_0}(x-x_0),\qquad (s,t)\text{ 在切线上}$
        to: |
          $t-\ln x_0=\frac1{x_0}(s-x_0),\qquad t+1=\ln x_0+\frac{s}{x_0}$
        operation: 用 $y=\ln x$ 在 $x_0$ 处的导数 $\frac1{x_0}$ 写切线，再代入 $(s,t)$。
        why: 外点可引两条切线，等价于切点横坐标 $x_0$ 有两个不同解。
      source_ref: page_0086
    - step_id: step_2
      statement: 把切线条数转成函数交点个数。
      formula_trace:
        from: |
          $t+1=\ln x_0+\frac{s}{x_0}$
        to: |
          $y=t+1\text{ 与 }F(x)=\ln x+\frac{s}{x}\ (x>0)\text{ 有两个不同交点}$
        operation: 把切点横坐标改记为自变量 $x$，构造辅助函数 $F(x)$。
        why: 判断方程解个数比直接画所有切线更稳定。
      source_ref: page_0086
    - step_id: step_3
      statement: 分类讨论 $s$，找辅助函数的极值。
      formula_trace:
        from: |
          $F'(x)=\frac1x-\frac{s}{x^2}=\frac{x-s}{x^2}$
        to: |
          $s\le0$ 时 $F$ 单调递增；$s>0$ 时 $F$ 在 $(0,s)$ 上递减、在 $(s,+\infty)$ 上递增，$F_{\min}=F(s)=\ln s+1$
        operation: 按 $s\le0$ 与 $s>0$ 判断 $x-s$ 的符号变化。
        why: 只有 $s>0$ 时，辅助函数有一个谷底，水平线高于谷底才可能有两个交点。
      source_ref: page_0086
    - step_id: step_4
      statement: 由两个交点得到最终不等式。
      formula_trace:
        from: |
          $y=t+1$ 与 $F(x)$ 有两个不同交点
        to: |
          $t+1>\ln s+1,\qquad t>\ln s$
        operation: 令水平线高度严格高于 $F$ 的最小值。
        why: 等于最小值只有一个切点，低于最小值没有切点，高于最小值才有两个切点。
      source_ref: page_0086
    - step_id: step_5
      statement: 用上凸函数外侧区域复核答案。
      formula_trace:
        from: |
          $y=\ln x$ 为上凸函数，过外侧点可作两条切线
        to: |
          $(s,t)$ 在曲线上方：$t>\ln s$
        operation: 类比圆的切线，将两条切线区域理解为对数曲线外侧区域。
        why: 对 $y=\ln x$ 这类上凸曲线，外侧位于曲线的上方。
      source_ref: page_0086
teaching_card:
  student_title: 把对数曲线两条切线化成一个谷底条件
  what_it_trains: 训练对 $y=\ln x$ 的过点切线问题设切点参数，用辅助函数的极小值判断能否出现两个切点。
  recognition_cues:
    - 题干说“过点 $(s,t)$ 可以作两条切线”，说明切点未知且可能有两个。
    - $y=\ln x$ 的切线斜率是 $\frac1{x_0}$，代入外点后自然出现 $\ln x_0+\frac{s}{x_0}$。
    - 选项比较 $t$ 与 $\ln s$，提示最终是在判断点在曲线上方还是下方。
  normalization_moves:
    - 设切点为 $(x_0,\ln x_0)$，写出点斜式切线。
    - 把过点条件整理成 $t+1=F(x_0)$。
    - 用 $F'(x)=\frac{x-s}{x^2}$ 找谷底 $F(s)=\ln s+1$。
  common_failures:
    - 把外点横坐标 $s$ 直接当切点横坐标，漏掉另一个切点。
    - 没有先排除 $s\le0$，导致 $\ln s$ 的边界说不清。
    - 把“高于最小值有两个交点”误写成 $t+1\ge\ln s+1$，把相切的一条也算成两条。
    - 只凭图像选 $t>\ln s$，却不能用切点参数证明。
  similar_practice_query: 对数函数 过点两条切线 切点参数 $\ln x+s/x$ 极小值
