solution:
  source_solution_summary: |
    由
    \[
    g(x)=-\frac23x^3+\frac32x^2-x,\quad
    g^{\prime}(x)=-2x^2+3x-1=-(2x-1)(x-1),
    \]
    在区间 $[\frac13,2]$ 上可知 $g$ 先减后增再减，且
    \[
    g\!\left(\frac13\right)<g(1),\quad g(2)<g(1),
    \]
    故
    \[
    g(x)_{\max}=g(1)=-\frac16.
    \]
    题设“任意 $x_1,x_2$ 都满足 $f(x_1)\ge g(x_2)$”等价于
    \[
    f(x)_{\min}\ge g(x)_{\max}.
    \]
    又
    \[
    f(x)=\frac{a}{x}+\ln x-\frac23,\quad
    f^{\prime}(x)=\frac{x-a}{x^2}.
    \]
    源解分两类：
    当 $a\le0$ 时，$f$ 在 $[\frac13,2]$ 递增，最小值在 $x=\frac13$，该分支被舍去；
    当 $a>0$ 时，源解取
    \[
    f(x)_{\min}=f(a)=\frac13+\ln a.
    \]
    代入 $f_{\min}\ge-\frac16$ 得
    \[
    \frac13+\ln a\ge-\frac16
    \Rightarrow \ln a\ge-\frac12
    \Rightarrow a\ge e^{-1/2}=\frac{\sqrt e}{e}.
    \]
    综上
    \[
    a\in\left[\frac{\sqrt e}{e},+\infty\right),
    \]
    选 A。
  key_steps:
    - step_id: step_1
      statement: 先求 $g$ 在 $[\frac13,2]$ 上的最大值。
      formula_trace:
        from: $g^{\prime}(x)=-(2x-1)(x-1)$
        to: $g(x)_{\max}=g(1)=-\frac16$
        operation: 由导数符号判单调区间，再比较关键点函数值。
        why: 把双函数比较中的右端统一成固定上界。
      source_ref: page_0169_ex07_solution
    - step_id: step_2
      statement: 把量词条件转成最值不等式。
      formula_trace:
        from: $\forall x_1,x_2\in[\frac13,2],\ f(x_1)\ge g(x_2)$
        to: $f(x)_{\min}\ge g(x)_{\max}$
        operation: 左端取最小、右端取最大。
        why: 得到只含参数 $a$ 的单目标约束。
      source_ref: page_0169_ex07_solution
    - step_id: step_3
      statement: 对 $f^{\prime}(x)=\frac{x-a}{x^2}$ 按参数分情况。
      formula_trace:
        from: $f(x)=\frac{a}{x}+\ln x-\frac23$
        to: 源解在 $a\le0$ 分支舍去，在 $a>0$ 分支取 $f_{\min}=f(a)=\frac13+\ln a$
        operation: 依据导数正负定位最小值表达式。
        why: 把条件化为对 $\ln a$ 的线性不等式。
      source_ref: page_0169_ex07_solution
    - step_id: step_4
      statement: 解不等式并给出参数范围。
      formula_trace:
        from: $\frac13+\ln a\ge-\frac16$
        to: $a\ge e^{-1/2}=\frac{\sqrt e}{e}$
        operation: 移项并指数化。
        why: 对应选项 A。
      source_ref: page_0169_ex07_solution
teaching_card:
  student_title: 任意-任意条件先做最值对接
  what_it_trains: 训练把双变量全称不等式压缩成“左侧最小值 ≥ 右侧最大值”，再通过导数与参数分支求范围。
  recognition_cues:
    - 题干同时出现两个自变量 $x_1,x_2$ 且量词为“任意”。
    - 两边都是可导函数，目标是参数范围。
    - 选项是区间型参数答案。
  normalization_moves:
    - 先改写成 $f_{\min}\ge g_{\max}$。
    - 先求不含参数一侧的极值。
    - 再求含参数一侧的最小值表达式。
    - 最后解参数不等式并匹配选项。
  common_failures:
    - 把“任意 $x_1,x_2$”误写成比较同一个 $x$。
    - 只算驻点不看区间端点，导致 $g_{\max}$ 判断错误。
    - 参数分支漏写，直接套一个最小值公式。
  similar_practice_query: 任意x1任意x2 最值分离 fmin>=gmax 参数范围 导数分支
