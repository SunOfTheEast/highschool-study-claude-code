stem: |-
  (2024 · 成都七中月考 T12) 曲线 $y=\sin x$ 在 $x=x_0$ ($x_0\ge0$) 处的切线为 $y=ax+b$, 且满足 $\forall x\ge0,\ \sin x\le ax+b$, 若 $10ab\le m$, 则整数 $m$ 的最小值为 ( )
  A. 1
  B. 2
  C. 3
  D. 4
answer: |-
  B

  源页先由切线条件写出 $a=\cos x_0$、$b=\sin x_0-x_0\cos x_0$，从而 $ab=\cos x_0(\sin x_0-x_0\cos x_0)$，并限制 $0\le x_0\le\frac\pi2$。设 $g(x)=\cos x(\sin x-x\cos x)$，则 $ab=g(x_0)$。续页给出 $g^{\prime}(x)=\sin x(-\sin x+2x\cos x)$，由 $g^{\prime}(x)=0$ 得 $x=0$ 或 $\tan x=2x$（$0<x<\frac\pi2$）。若记内点解为 $t_\ast$，则 $g(t_\ast)=\frac{1}{4t_\ast+1/t_\ast}$。数值解 $t_\ast\approx1.16556$，得 $10g(t_\ast)\approx1.8116$，因此满足 $10ab\le m$ 的最小整数为 $m=2$，选 B。源页使用 $\frac{1}{4t+1/t}\le\frac14$ 推出 $m=3$，这是把松上界误当精确最大值。
