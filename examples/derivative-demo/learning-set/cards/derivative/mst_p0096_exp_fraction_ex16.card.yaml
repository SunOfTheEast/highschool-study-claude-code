stem: |-
  （2023 · 思明区月考 · 多选 T12）已知函数 $f(x)=\frac{x}{e^x}$，过点 $(a,b)$ 作曲线 $f(x)$ 的切线，下列说法正确的 ( )
  A. 当 $a=0,b=0$ 时，有且仅有一条切线
  B. 当 $a=0$ 时，可作三条切线，$0<b<\frac{4}{e^2}$
  C. 当 $a=2,b>0$ 时，可作两条切线
  D. $0<a<2$ 时，可作两条切线，$b=\frac{4-a}{e^2}$ 或 $\frac{a}{e^a}$
answer: |
  ABD

  对 $f(x)=x e^{-x}$ 求导得 $f'(x)=(1-x)e^{-x}$，
  $f''(x)=(x-2)e^{-x}$，拐点为 $\left(2,\frac{2}{e^2}\right)$。
  拐点处切线为 $y-\frac{2}{e^2}=-\frac1{e^2}(x-2)$，
  即 $y=\frac{-x+4}{e^2}$。源页据此用曲线和拐点切线划分区域：
  $(0,0)$ 在曲线上且只作一条切线，A 正确；当 $a=0$ 且
  $0<b<4/e^2$ 时，点在 y 轴上方区域，可作三条切线，B 正确；
  当 $a=2,b>0$ 时，点在内弧区域，只能作一条切线，C 错误；
  当 $0<a<2$ 时，要恰作两条切线只能落在曲线或拐点切线上，
  所以 $b=a/e^a$ 或 $b=(4-a)/e^2$，D 正确。故选 ABD。
