solution:
  source_solution_summary: |
    对 $f(x)=x e^{-x}$ 求导得 $f'(x)=(1-x)e^{-x}$，
    $f''(x)=(x-2)e^{-x}$，拐点为 $\left(2,\frac{2}{e^2}\right)$。
    拐点处切线为 $y-\frac{2}{e^2}=-\frac1{e^2}(x-2)$，
    即 $y=\frac{-x+4}{e^2}$。源页据此用曲线和拐点切线划分区域：
    $(0,0)$ 在曲线上且只作一条切线，A 正确；当 $a=0$ 且
    $0<b<4/e^2$ 时，点在 y 轴上方区域，可作三条切线，B 正确；
    当 $a=2,b>0$ 时，点在内弧区域，只能作一条切线，C 错误；
    当 $0<a<2$ 时，要恰作两条切线只能落在曲线或拐点切线上，
    所以 $b=a/e^a$ 或 $b=(4-a)/e^2$，D 正确。故选 ABD。
  key_steps:
    - step_id: step_1
      statement: 求出 $f(x)=x/e^x$ 的拐点和拐点切线。
      formula_trace:
        from: $f(x)=xe^{-x}$
        to: $f^{\prime}(x)=(1-x)e^{-x},\quad f^{\prime\prime}(x)=(x-2)e^{-x},\quad \left(2,\frac2{e^2}\right)$
        operation: 连续求导，令二阶导数为 $0$ 得到拐点横坐标。
        why: 切线条数分区的关键边界是拐点处切线。
      source_ref: page_0096
    - step_id: step_2
      statement: 写出拐点处切线并得到区域边界。
      formula_trace:
        from: $f(2)=\frac2{e^2},\quad f^{\prime}(2)=-\frac1{e^2}$
        to: $y-\frac2{e^2}=-\frac1{e^2}(x-2),\quad y=\frac{-x+4}{e^2}$
        operation: 用切点坐标和切线斜率写点斜式。
        why: 源图以该切线和曲线共同分割不同切线条数区域。
      source_ref: page_0096
    - step_id: step_3
      statement: 判断 A、B、C 三个给定位置的切线条数。
      formula_trace:
        from: $(0,0)$、$x=0$ 上 $0<b<\frac4{e^2}$、$x=2$ 上 $b>0$
        to: "A: 1 条；B: 3 条；C: 1 条"
        operation: 在源页区域图中定位外点相对曲线和拐点切线的位置。
        why: 切线条数由外点所在区域决定。
      source_ref: page_0096
    - step_id: step_4
      statement: 判断 $0<a<2$ 时两条切线的边界条件。
      formula_trace:
        from: $0<a<2$ 且点 $(a,b)$ 恰在曲线或拐点切线上
        to: $b=f(a)=\frac{a}{e^a}\quad\text{或}\quad b=\frac{4-a}{e^2}$
        operation: 把 $x=a$ 分别代入曲线方程和拐点切线方程。
        why: 源页指出拐点左侧恰作两条切线只能出现在这两条边界上。
      source_ref: page_0096
    - step_id: step_5
      statement: 汇总多选答案。
      formula_trace:
        from: A、B、D 正确，C 错误
        to: $\text{答案}=ABD$
        operation: 按各选项对应区域逐项筛选。
        why: 本题目标是判断外点切线条数条件是否成立。
      source_ref: page_0096
teaching_card:
  student_title: 用拐点切线分区数 $x/e^x$ 的切线条数
  what_it_trains: 训练先找曲线拐点切线，再用曲线和切线围出的区域判断外点能作几条切线。
  recognition_cues:
    - 题干问“过点 $(a,b)$ 作曲线切线”且选项在变动外点位置。
    - 函数 $x/e^x$ 的二阶导数只在 $x=2$ 变号，适合用拐点切线界定区域。
    - 选项中出现 $4/e^2$ 和 $(4-a)/e^2$，提示来自拐点切线。
  normalization_moves:
    - 先求 $f^{\prime}$、$f^{\prime\prime}$，定位拐点 $\left(2,2/e^2\right)$。
    - 写拐点切线 $y=(-x+4)/e^2$。
    - 把选项里的点或直线 $x=a$ 放回区域图判断切线条数。
  common_failures:
    - 只把点在曲线上理解成“本点切线”，漏掉曲线上某些点还可作另一条切线。
    - 把 $a=2,b>0$ 误看成上方外弧区，导致 C 误判为两条。
    - D 选项漏掉曲线边界 $b=a/e^a$，只写拐点切线高度。
  similar_practice_query: $x/e^x$ 外点切线条数 拐点切线 $(-x+4)/e^2$ 多选
