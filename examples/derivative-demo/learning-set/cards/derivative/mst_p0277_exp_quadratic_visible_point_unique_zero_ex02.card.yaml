original_problem:
  stem: （2021 · 新高考 II）已知函数 $f(x)=(x-1)e^x-ax^2+b$。
  parts: *a1
  choices: []
  answer: (1) 单调性按 $a\le0$、$0<a<\frac12$、$a=\frac12$、$a>\frac12$ 分段； (2) 两个给定选项都可推出 $f(x)$ 恰有一个零点。
  fidelity_notes:
    - 无选择题选项；第(2)问是从两个证明条件中任选一项。
    - source 同时写了选(1)和选(2)的证明，本卡均保留。
solution:
  source_solution_summary: 先求导：$f^\prime(x)=x(e^x-2a)$。当 $a\le0$ 时， $f$ 在 $(-\infty,0)$ 减、在 $(0,+\infty)$ 增；当 $0<a<\frac12$ 时，驻点顺序为 $\ln(2a)<0$，所以 $(-\infty,\ln(2a))$、$(0,+\infty)$ 增，$(\ln(2a),0)$ 减； 当 $a=\frac12$ 时全域增；当 $a>\frac12$ 时，驻点顺序为 $0<\ln(2a)$，所以 $(-\infty,0)$、$(\ln(2a),+\infty)$ 增， $(0,\ln(2a))$ 减。第(2)问的核心是显点效应：显点是 $f(1)$， 另一个关键点是 $\ln(2a)$。选(1)时先证 $x\ge0$ 上最小值 $f(\ln(2a))>0$，所以非负半轴无零点；再用 $f(0)=b-1>0$ 和 $f(-\sqrt{b/a})<0$ 锁定负半轴唯一零点。 选(2)时先证 $x\le0$ 上最大值 $f(\ln(2a))<0$，所以非正半轴无零点； 再在正半轴用取点或二次切线模型证明存在正值，从而正半轴唯一零点。
  key_steps:
    - step_id: step_1
      statement: 求导并找出两个可能的驻点。
      formula_trace:
        from: $f(x)=(x-1)e^x-ax^2+b$
        to: $f^\prime(x)=x(e^x-2a)$
        operation: 求导并提取公共因子 $x$。
        why: 单调性和零点个数都由 $0$ 与 $\ln(2a)$ 的相对位置控制。
      source_ref: page_0277_ex02_monotonicity
    - step_id: step_2
      statement: 按 $a$ 分段给出单调性。
      formula_trace:
        from: $x=0,\ x=\ln(2a)$
        to: 四种情形：$a\le0$、$0<a<\frac12$、$a=\frac12$、$a>\frac12$
        operation: 比较 $\ln(2a)$ 与 $0$ 的位置，再判 $f^\prime$ 符号。
        why: 这是第(2)问证明唯一零点的形态基础。
      source_ref: page_0277_ex02_monotonicity
    - step_id: step_3
      statement: 选(1)：先排除非负半轴零点。
      formula_trace:
        from: $\frac12<a\le\frac{e^2}{2},\ b>2a$
        to: $f(\ln(2a))>a\ln(2a)(2-\ln(2a))\ge0$
        operation: 代入极小点并用 $0<\ln(2a)\le2$。
        why: 非负半轴的最小值大于 0，所以 $x\ge0$ 没有零点。
      source_ref: page_0278_ex02_option1_continuation
    - step_id: step_4
      statement: 选(1)：在负半轴取点，锁定唯一零点。
      formula_trace:
        from: $f(0)=b-1>0,\quad x=-\sqrt{\frac ba}$
        to: $f\left(-\sqrt{\frac ba}\right)<0,\ \exists x_1\in\left(-\sqrt{\frac ba},0\right)$
        operation: 利用 $x<0$ 时 $(x-1)e^x\in(-1,0)$，并让 $-ax^2+b=0$。
        why: $(-\infty,0)$ 上单调递增，正负号各给一端，故只穿一次。
      source_ref: page_0278_ex02_option1_continuation
    - step_id: step_5
      statement: 选(2)：先排除非正半轴零点。
      formula_trace:
        from: $0<a<\frac12,\ b\le2a$
        to: $f(\ln(2a))\le a\ln(2a)(2-\ln(2a))<0$
        operation: 代入极大点并用 $\ln(2a)<0$。
        why: 非正半轴最大值小于 0，所以 $x\le0$ 没有零点。
      source_ref: page_0278_ex02_option2_solution
    - step_id: step_6
      statement: 选(2)：用正半轴取点或二次切线补出存在性。
      formula_trace:
        from: $(x-1)e^x$ 与二次客体 $-ax^2+b$
        to: $x=3-b$ 或 $x=\sqrt{\frac{1-b}{\frac12-a}}$ 给出 $f(x)>0$
        operation: 用 source 的主元锁定不等式，或用二次切线 $(x-1)e^x>\frac12x^2-1$。
        why: $f(0)=b-1<0$，正半轴又能找到正值，且该区间最终单调上升，所以只穿一次。
      source_ref: page_0278_ex02_option2_solution
teaching_card:
  student_title: 用显点效应证明指数二次函数只有一个零点
  what_it_trains: 训练先用导数形态确定曲线哪一侧不可能有零点，再用一个取点或二次切线补出另一侧确实穿轴。
  recognition_cues:
    - 导数分解成 $x(e^x-2a)$，两个驻点是 $0$ 和 $\ln(2a)$。
    - 题目不是求零点，而是证明“恰有一个零点”。
    - 两个选项分别把 $\ln(2a)$ 放在 0 的右侧和左侧。
    - source 明确提示“显点效应”，不要硬解超越方程。
  normalization_moves:
    - 先讨论单调性，得到曲线形状。
    - 用 $f(\ln(2a))$ 判断一整个半轴没有零点。
    - 选(1) 在负半轴取 $-\sqrt{b/a}$。
    - 选(2) 可用 $3-b$ 取点，也可用二次切线 $(x-1)e^x>\frac12x^2-1$。
  common_failures:
    - 把第(2)问当成解方程，试图直接求零点。
    - 没有先做第(1)问的单调性，导致唯一性没有依据。
    - 混淆 $0<a<\frac12$ 与 $a>\frac12$ 时 $\ln(2a)$ 的左右位置。
    - 把取点当成主线，忽略“先排除一个半轴，再证明另一个半轴穿轴”。
    - 不会解释为什么二次切线给的是 $(x-1)e^x$ 的下界。
  similar_practice_query: 显点效应 (x-1)e^x-ax^2+b 恰有一个零点 ln(2a) 二次切线
