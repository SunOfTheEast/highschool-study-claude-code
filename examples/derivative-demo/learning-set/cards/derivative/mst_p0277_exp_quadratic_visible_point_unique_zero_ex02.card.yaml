stem: |-
  （2021 · 新高考 II）已知函数 $f(x)=(x-1)e^x-ax^2+b$。
  1. 讨论 $f(x)$ 的单调性。
  2. 从以下 (1) 和 (2) 中选择一项，(1) $\frac12<a\le\frac{e^2}{2}$，$b>2a$；(2) $0<a<\frac12$，$b\le2a$。证明：$f(x)$ 恰有一个零点。
answer: |-
  (1) 单调性按 $a\le0$、$0<a<\frac12$、$a=\frac12$、$a>\frac12$ 分段； (2) 两个给定选项都可推出 $f(x)$ 恰有一个零点。

  先求导：$f^\prime(x)=x(e^x-2a)$。当 $a\le0$ 时， $f$ 在 $(-\infty,0)$ 减、在 $(0,+\infty)$ 增；当 $0<a<\frac12$ 时，驻点顺序为 $\ln(2a)<0$，所以 $(-\infty,\ln(2a))$、$(0,+\infty)$ 增，$(\ln(2a),0)$ 减； 当 $a=\frac12$ 时全域增；当 $a>\frac12$ 时，驻点顺序为 $0<\ln(2a)$，所以 $(-\infty,0)$、$(\ln(2a),+\infty)$ 增， $(0,\ln(2a))$ 减。第(2)问的核心是显点效应：显点是 $f(1)$， 另一个关键点是 $\ln(2a)$。选(1)时先证 $x\ge0$ 上最小值 $f(\ln(2a))>0$，所以非负半轴无零点；再用 $f(0)=b-1>0$ 和 $f(-\sqrt{b/a})<0$ 锁定负半轴唯一零点。 选(2)时先证 $x\le0$ 上最大值 $f(\ln(2a))<0$，所以非正半轴无零点； 再在正半轴用取点或二次切线模型证明存在正值，从而正半轴唯一零点。
