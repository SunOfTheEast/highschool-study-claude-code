solution:
  source_solution_summary: 由 $ae^{ax}-1\ge\ln(x/e)$ 得 $ae^{ax}\ge\ln x$，再乘以 $x>0$ 得 $axe^{ax}\ge x\ln x=\ln x\,e^{\ln x}$。令 $F(t)=te^t$，则 $F(ax)\ge F(\ln x)$。因 $ax>0$，若 $\ln x<0$ 则 $ax\ge\ln x$ 自动成立；若 $\ln x\ge0$，$F$ 在非负区间递增，仍等价转向 $ax\ge\ln x$。所以需 $a\ge\ln x/x$ 对任意 $x>0$ 成立，而 $(\ln x/x)_{\max}=1/e$。
  key_steps:
    - step_id: step_1
      statement: 把原不等式先移项并乘以正数 $x$。
      formula_trace:
        from: $ae^{ax}-1\geqslant\ln\frac{x}{e}$
        to: $axe^{ax}\geqslant x\ln x=\ln x\,e^{\ln x}$
        operation: 利用 $\ln(x/e)=\ln x-1$ 移项得 $ae^{ax}\ge\ln x$，再同乘 $x>0$。
        why: 这样左右两边都能写成 $t e^t$ 的同构形式。
      source_ref: page_0016
    - step_id: step_2
      statement: 引入同构函数 $F(t)=te^t$，把两边识别为 $F(ax)$ 与 $F(\ln x)$。
      formula_trace:
        from: $axe^{ax}\geqslant \ln x\,e^{\ln x}$
        to: $F(ax)\geqslant F(\ln x)$
        operation: 令 $F(t)=te^t$，分别代入 $t=ax$ 与 $t=\ln x$。
        why: 源页前文已经给出 $te^t$ 的单调模型，可直接用于同构比较。
      source_ref: page_0016
    - step_id: step_3
      statement: 由 $ax>0$ 推出控制条件为 $ax\ge\ln x$。
      formula_trace:
        from: $F(ax)\geqslant F(\ln x),\quad ax>0$
        to: $a\geqslant\frac{\ln x}{x}$
        operation: 当 $\ln x<0$ 时不等式自动满足 $ax\ge\ln x$；当 $\ln x\ge0$ 时用 $F$ 在 $(0,+\infty)$ 上递增。
        why: 恒成立问题被转成 $a$ 对所有 $x>0$ 压住 $\ln x/x$。
      source_ref: page_0016
    - step_id: step_4
      statement: 求 $\ln x/x$ 的最大值。
      formula_trace:
        from: $a\geqslant\frac{\ln x}{x}\quad(x>0)$
        to: $a\geqslant\left(\frac{\ln x}{x}\right)_{\max}=\frac1e$
        operation: 使用源页同构模型 $\frac{\ln x}{x}$ 在 $x=e$ 处取最大值 $1/e$。
        why: 对任意 $x$ 恒成立时，参数最小值等于右侧函数的全局最大值。
      source_ref: page_0016
teaching_card:
  student_title: 把 $ae^{ax}$ 配成 $xe^x$ 同构
  what_it_trains: 训练把带参数的指数恒成立不等式，先乘正量补出 $te^t$，再分离成 $\ln x/x$ 最大值。
  recognition_cues:
    - 题干同时出现 $e^{ax}$ 和 $\ln(x/e)$。
    - 参数 $a$ 与 $x$ 以 $ax$ 的形式进入指数。
    - 恒成立问 $a$ 的最小值，通常要压住某个关于 $x$ 的最大值。
  normalization_moves:
    - 先用 $\ln(x/e)=\ln x-1$ 消掉常数项。
    - 同乘 $x>0$，让左侧出现 $ax e^{ax}$。
    - 把 $x\ln x$ 改写成 $\ln x e^{\ln x}$，和 $ax e^{ax}$ 对齐。
    - 最后把参数条件写成 $a\ge \ln x/x$，再取最大值。
  common_failures:
    - 忘记乘以 $x>0$，导致看不出 $te^t$。
    - 把 $\ln(x/e)$ 误写为 $\ln x/e$。
    - 只记得 $xe^x$ 的最小值，却没有切到 $\ln x/x$ 的最大值。
    - 没有说明恒成立要求取 $\ln x/x$ 的最大值。
  similar_practice_query: $ae^{ax}$ $\ln(x/e)$ 恒成立 参数最小值 $xe^x$ 同构 $\ln x/x$ 最大值
