stem: |-
  设实数 $a>0$，若不等式 $ae^{ax}-1\geqslant \ln \frac{x}{e}$ 对任意 $x>0$ 恒成立，则 $a$ 的最小值为（ ）
  A. $e$
  B. $2e$
  C. $\frac{1}{e}$
  D. $\frac{1}{2e}$
answer: |-
  C；$a_{\min}=\frac1e$。

  由 $ae^{ax}-1\ge\ln(x/e)$ 得 $ae^{ax}\ge\ln x$，再乘以 $x>0$ 得 $axe^{ax}\ge x\ln x=\ln x\,e^{\ln x}$。令 $F(t)=te^t$，则 $F(ax)\ge F(\ln x)$。因 $ax>0$，若 $\ln x<0$ 则 $ax\ge\ln x$ 自动成立；若 $\ln x\ge0$，$F$ 在非负区间递增，仍等价转向 $ax\ge\ln x$。所以需 $a\ge\ln x/x$ 对任意 $x>0$ 成立，而 $(\ln x/x)_{\max}=1/e$。
rubric:
  max_score: 4
  criteria:
    - step_id: step_1
      description: 把原不等式先移项并乘以正数 $x$。
      max_score: 1
    - step_id: step_2
      description: 引入同构函数 $F(t)=te^t$，把两边识别为 $F(ax)$ 与 $F(\ln x)$。
      max_score: 1
    - step_id: step_3
      description: 由 $ax>0$ 推出控制条件为 $ax\ge\ln x$。
      max_score: 1
    - step_id: step_4
      description: 求 $\ln x/x$ 的最大值。
      max_score: 1
