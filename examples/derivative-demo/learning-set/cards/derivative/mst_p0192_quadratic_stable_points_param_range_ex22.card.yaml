stem: （重庆市第十八中学2024高一期中T16）对于函数 $f(x)$，若 $f(x_0)=x_0$ 称 $x_0$ 为不动点；若 $f(f(x_0))=x_0$ 称 $x_0$ 为稳定点。若 $f(x)=x^2+a\ (x\in\mathbf{R})$ 的稳定点恰是它的不动点，则实数 $a$ 的取值范围是______。
answer: |-
  $\left[-\frac34,\frac14\right]$

  设 $y=f(x)$，稳定点满足 $f(f(x))=x$，得到方程组 $\begin{cases}y^2+a=x\\x^2+a=y\end{cases}$。 两式相减得 $(y-x)(y+x+1)=0$，即分支 $y=x$ 或 $y+x+1=0$。 其中 $y=x$ 等价于不动点方程 $x^2-x+a=0$，它必须有解，故 $1-4a\ge0\Rightarrow a\le\frac14$。 又因“稳定点恰是不动点”，第二分支 $y+x+1=0$ 不能产生额外稳定点：要么 $x^2+x+a+1=0$ 无解（$a>-\frac34$）， 要么它与 $x^2-x+a=0$ 同解。联立同解情形可得 $x=\frac12,\ a=-\frac34$。 综合得到 $a\in\left[-\frac34,\frac14\right]$。
