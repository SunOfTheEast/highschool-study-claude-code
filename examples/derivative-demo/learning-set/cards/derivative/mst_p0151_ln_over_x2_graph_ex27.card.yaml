solution:
  source_solution_summary: |
    由条件可化为
    \[
    \frac{\ln a}{a^2}=\frac{\ln4}{4^2},\quad
    \frac{\ln b}{b^2}=\frac{\ln2}{2^2},\quad
    \frac{\ln c}{c^2}=\frac{\ln3}{3^2}.
    \]
    令
    \[
    f(x)=\frac{\ln x}{x^2}=\frac12\cdot\frac{\ln x^2}{x^2}
    =\frac12\,g(x^2),\quad g(x)=\frac{\ln x}{x}.
    \]
    因 $g$ 在 $(0,e)$ 递增、在 $(e,+\infty)$ 递减，
    得 $f$ 在 $(0,\sqrt e)$ 递增、在 $(\sqrt e,+\infty)$ 递减。
    又 $f(2)>f(3)>f(4)$，故
    \[
    f(b)>f(c)>f(a).
    \]
    结合 $0<b<2,\ 0<c<3,\ 0<a<4$（排除右支点 $2,3,4$），
    三个未知量都落在左支 $(0,\sqrt e)$，且该支递增，
    所以
    \[
    \sqrt e>b>c>a>0,
    \]
    从而 $b>c>a$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把三个条件统一成 $\frac{\ln x}{x^2}$ 同值方程。
      formula_trace:
        from: |
          $16\ln a=a^2\ln4,\ 4\ln b=b^2\ln2,\ 9\ln c=c^2\ln3$
        to: |
          $f(a)=f(4),\ f(b)=f(2),\ f(c)=f(3)$，其中 $f(x)=\frac{\ln x}{x^2}$
        operation: 各式同除以对应幂次，归一成“函数值相等”模板。
        why: 把未知量比较转为同一函数左右两支的定位问题。
      source_ref: page_0151_ex27_figure_and_solution
    - step_id: step_2
      statement: 通过 $g(x)=\ln x/x$ 传递得到 $f$ 的单峰性。
      formula_trace:
        from: |
          $f(x)=\frac12g(x^2),\quad g(x)=\frac{\ln x}{x}$
        to: |
          $f(x)\ \text{在}\ (0,\sqrt e)\ \text{递增，在}\ (\sqrt e,+\infty)\ \text{递减}$
        operation: 利用复合 $x^2$ 与 $g$ 的已知单调区间。
        why: 确定图像为“先升后降”的单峰结构。
      source_ref: page_0151_ex27_figure_and_solution
    - step_id: step_3
      statement: 借助右支锚点与左支递增性锁定 $b,c,a$ 次序。
      formula_trace:
        from: |
          $f(2)>f(3)>f(4)$ 且 $f(b)=f(2),\ f(c)=f(3),\ f(a)=f(4)$
        to: |
          $f(b)>f(c)>f(a)\Rightarrow \sqrt e>b>c>a>0\Rightarrow b>c>a$
        operation: 先由区间约束排除 $2,3,4$ 右支解，再在左支按递增反推出点位次序。
        why: 与源图水平线对应关系一致，直接匹配选项 D。
      source_ref: page_0151_ex27_figure_and_solution
teaching_card:
  student_title: 把三式压成同一个单峰函数，再用图像左支排顺序
  what_it_trains: 训练“同值映射 + 单峰图像”联动：先锚定右支已知点，再反推左支未知点大小。
  recognition_cues:
    - 条件形如“常数 × ln(未知) = 未知幂 × 常数”。
    - 每个未知量都附带上界（$a<4,b<2,c<3$），提示可排除右支解。
    - 题目配了函数图，说明图像对应关系是核心证据。
  normalization_moves:
    - 归一出 $f(a)=f(4),f(b)=f(2),f(c)=f(3)$。
    - 确认 $f$ 单峰后先看右支锚点高低。
    - 转回左支递增关系得到 $b>c>a$。
  common_failures:
    - 只看到 $f(2)>f(3)>f(4)$ 就直接写 $2>3>4$ 式误读。
    - 忘记用 $b<2,c<3,a<4$ 排除右支点。
    - 把左支误当递减，导致顺序全反。
  similar_practice_query: lnx/x^2 单峰 图像 左支反推 b>c>a
