  student_title: 把常数改写进对数下界模板
  what_it_trains: 训练三数比较里“先压三角、再抬对数”的两段夹逼链。
  recognition_cues:
    - 题目同时出现 $\sin(\text{小角})$ 与 $\ln(1+\text{小量})$。
    - 有理数可改写为 $\frac{2(x-1)}{x+1}$ 形态。
    - 选项是严格全序。
  normalization_moves:
    - 先处理明显的 $\sin x<x$。
    - 把常数凑成对数下界模板值。
    - 最后传递不等式拼全序。
  common_failures:
    - 把 $\ln x>\frac{2(x-1)}{x+1}$ 的方向写反。
    - 只得到 $b<a$ 就停，漏掉 $c$ 与 $a$。
    - 常数改写时通分出错。
  similar_practice_query: sin(2/21) ln(11/10) 帕德 比大小 c>a>b
