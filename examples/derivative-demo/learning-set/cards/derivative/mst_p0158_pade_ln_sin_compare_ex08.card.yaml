stem: |-
  （2024·京口区月考）设 $a=\frac{2}{21}$，$b=\sin\frac{2}{21}$，$c=\ln\frac{11}{10}$，则（  ）
  A. $a>b>c$
  B. $a>c>b$
  C. $c>a>b$
  D. $b>c>a$
answer: |
  C

  先比较 $b$ 与 $a$。由
  \[
  \sin x<x\quad\left(0<x<\frac{\pi}{2}\right),
  \]
  代入 $x=\frac{2}{21}$ 得
  \[
  b=\sin\frac{2}{21}<\frac{2}{21}=a.
  \]
  再比较 $c$ 与 $a$。注意
  \[
  a=\frac{2}{21}
  =\frac{2\left(\frac{11}{10}-1\right)}{\frac{11}{10}+1}.
  \]
  由帕德型下界
  \[
  \ln x>\frac{2(x-1)}{x+1}\quad(x>1),
  \]
  取 $x=\frac{11}{10}$ 得
  \[
  c=\ln\frac{11}{10}>a.
  \]
  合并可得
  \[
  c>a>b.
  \]
  故选 C。
