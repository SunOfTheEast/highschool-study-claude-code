solution:
  source_solution_summary: |
    先比较 $b$ 与 $a$。由
    \[
    \sin x<x\quad\left(0<x<\frac{\pi}{2}\right),
    \]
    代入 $x=\frac{2}{21}$ 得
    \[
    b=\sin\frac{2}{21}<\frac{2}{21}=a.
    \]
    再比较 $c$ 与 $a$。注意
    \[
    a=\frac{2}{21}
    =\frac{2\left(\frac{11}{10}-1\right)}{\frac{11}{10}+1}.
    \]
    由帕德型下界
    \[
    \ln x>\frac{2(x-1)}{x+1}\quad(x>1),
    \]
    取 $x=\frac{11}{10}$ 得
    \[
    c=\ln\frac{11}{10}>a.
    \]
    合并可得
    \[
    c>a>b.
    \]
    故选 C。
  key_steps:
    - step_id: step_1
      statement: 用三角上界直接锁定 $b<a$。
      formula_trace:
        from: $b=\sin\frac{2}{21}$
        to: $b<\frac{2}{21}=a$
        operation: 代入 $\sin x<x$（$0<x<\frac{\pi}{2}$）。
        why: 先固定三角项在最下方。
      source_ref: page_0158_ex08_solution
    - step_id: step_2
      statement: 把 $a$ 改写成对数下界模板值。
      formula_trace:
        from: $a=\frac{2}{21}$
        to: $a=\frac{2\left(\frac{11}{10}-1\right)}{\frac{11}{10}+1}$
        operation: 同构变形为 $\frac{2(x-1)}{x+1}$ 形式。
        why: 与 $\ln x$ 的标准下界同型。
      source_ref: page_0158_ex08_solution
    - step_id: step_3
      statement: 调用帕德下界得到 $c>a$。
      formula_trace:
        from: $c=\ln\frac{11}{10}$
        to: $c>\frac{2\left(\frac{11}{10}-1\right)}{\frac{11}{10}+1}=a$
        operation: 取 $x=\frac{11}{10}$ 代入 $\ln x>\frac{2(x-1)}{x+1}$。
        why: 完成对数项与有理项比较。
      source_ref: page_0158_ex08_solution
