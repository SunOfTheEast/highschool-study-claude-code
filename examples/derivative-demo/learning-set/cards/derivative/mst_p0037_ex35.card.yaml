solution:
  source_solution_summary: |
    设 $f(x)=e^x-\cos x$，则 $f'(x)=e^x+\sin x>0$，所以 $f$ 在 $(0,\pi)$ 上严格递增。由题设得 $f(\alpha)=f(\beta)-\cos\beta$。若 $\beta\in(0,\pi/2)$，则 $\cos\beta>0$，于是 $f(\alpha)<f(\beta)$，故 $\alpha<\beta<\pi/2$，从而 $\sin\alpha<\sin\beta$。若 $\beta\in(\pi/2,\pi)$，则 $\cos\beta<0$，于是 $f(\alpha)>f(\beta)$，故 $\pi/2<\beta<\alpha<\pi$，而 $\sin x$ 在 $(\pi/2,\pi)$ 上递减，仍有 $\sin\alpha<\sin\beta$。当 $\beta=\pi/2$ 时会推出 $\alpha=\beta$，与题设矛盾，所以无解。故 A 一定成立。
  key_steps:
    - step_id: step_1
      statement: 把条件整理成同一个递增函数的关系。
      formula_trace:
        from: |
          $e^\alpha-e^\beta=\cos\alpha-2\cos\beta$
        to: |
          $e^\alpha-\cos\alpha=e^\beta-\cos\beta-\cos\beta$
        operation: 把 $\\cos\\alpha$ 移到左侧，把 $e^\\beta$ 移到右侧，并在右侧配出 $e^\\beta-\\cos\\beta$。
        why: 两边都能出现 $f(x)=e^x-\\cos x$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:42
    - step_id: step_2
      statement: 证明 $f$ 在 $(0,\pi)$ 上递增。
      formula_trace:
        from: |
          $f(x)=e^x-\cos x$
        to: |
          $f'(x)=e^x+\sin x>0$
        operation: 求导并利用 $x\\in(0,\\pi)$ 时 $e^x>0$、$\\sin x>0$。
        why: 函数值比较可以转化为角的大小比较。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:42
    - step_id: step_3
      statement: 当 $\beta$ 在左半区间时比较。
      formula_trace:
        from: |
          $\beta\in(0,\pi/2),\quad f(\alpha)=f(\beta)-\cos\beta$
        to: |
          $f(\alpha)<f(\beta)\Rightarrow \alpha<\beta$
        operation: 由 $\\cos\\beta>0$ 得右侧小于 $f(\\beta)$，再用 $f$ 递增。
        why: 此时 $0<\\alpha<\\beta<\\pi/2$，正弦递增给出 $\\sin\\alpha<\\sin\\beta$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:42
    - step_id: step_4
      statement: 当 $\beta$ 在右半区间时比较。
      formula_trace:
        from: |
          $\beta\in(\pi/2,\pi),\quad f(\alpha)=f(\beta)-\cos\beta$
        to: |
          $f(\alpha)>f(\beta)\Rightarrow \alpha>\beta$
        operation: 由 $\\cos\\beta<0$ 得 $-\\cos\\beta>0$，再用 $f$ 递增。
        why: 此时 $\\pi/2<\\beta<\\alpha<\\pi$，正弦递减仍给出 $\\sin\\alpha<\\sin\\beta$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:43-44
    - step_id: step_5
      statement: 排除边界并确定选项。
      formula_trace:
        from: |
          $\beta=\pi/2$
        to: |
          $f(\alpha)=f(\beta)\Rightarrow \alpha=\beta$
        operation: 代入 $\\cos\\beta=0$，再用 $f$ 的单调性。
        why: 这与 $\\alpha\\ne\\beta$ 矛盾；剩余两类都得到 A。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:42-44
teaching_card:
  student_title: 看 $-\cos\beta$ 的符号来比较两个角
  what_it_trains: 三角和指数混在一起时，先把 $e^x-\cos x$ 作为同一个递增函数；剩下的 $-\cos\beta$ 决定函数值往哪边偏，再结合正弦的分段单调性。
  recognition_cues:
    - 条件里有 $e^\\alpha,e^\\beta$，也有 $\\cos\\alpha,\\cos\\beta$。
    - 移项后能配出 $e^x-\\cos x$。
    - 选项比较的是 $\\sin$ 或 $\\cos$，需要先知道角的相对位置。
  normalization_moves:
    - 先构造 $f(x)=e^x-\\cos x$，不要直接比较正弦。
    - 按 $\\beta$ 在 $\\pi/2$ 左右分情况，因为 $\\cos\\beta$ 变号。
    - 左半区间用正弦递增，右半区间用正弦递减。
  common_failures:
    - 只讨论 $\\alpha,\\beta$ 同在某个区间，忘记说明这是由 $\\beta$ 的位置推出的。
    - 在右半区间仍按正弦递增处理。
    - 把 $e^\\alpha-\\cos\\alpha=e^\\beta-\cos\\beta-\\cos\\beta$ 的符号看反。
  similar_practice_query: e^x-cosx 同构 alpha beta sin比较 cosbeta符号
