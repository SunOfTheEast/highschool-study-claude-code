stem: |-
  已知 $\alpha,\beta\in(0,\pi)$，$\alpha\ne\beta$，若 $e^\alpha-e^\beta=\cos\alpha-2\cos\beta$，则下列结论一定成立的是 ( )
  A. $\sin\alpha<\sin\beta$
  B. $\cos\alpha<\cos\beta$
  C. $\sin\alpha>\sin\beta$
  D. $\cos\alpha>\cos\beta$
answer: |
  A

  设 $f(x)=e^x-\cos x$，则 $f'(x)=e^x+\sin x>0$，所以 $f$ 在 $(0,\pi)$ 上严格递增。由题设得 $f(\alpha)=f(\beta)-\cos\beta$。若 $\beta\in(0,\pi/2)$，则 $\cos\beta>0$，于是 $f(\alpha)<f(\beta)$，故 $\alpha<\beta<\pi/2$，从而 $\sin\alpha<\sin\beta$。若 $\beta\in(\pi/2,\pi)$，则 $\cos\beta<0$，于是 $f(\alpha)>f(\beta)$，故 $\pi/2<\beta<\alpha<\pi$，而 $\sin x$ 在 $(\pi/2,\pi)$ 上递减，仍有 $\sin\alpha<\sin\beta$。当 $\beta=\pi/2$ 时会推出 $\alpha=\beta$，与题设矛盾，所以无解。故 A 一定成立。
