stem: （2023 · 山西阳泉高二期末 T14）若当 $x>0$ 时，函数 $f(x)=2-e^x+mx^2$ 有两个极值点，求实数 $m$ 的取值范围。
answer: |-
  $m\in\left(\frac e2,+\infty\right)$。

  由 $f(x)=2-e^x+mx^2$，得 $f^{\prime}(x)=-e^x+2mx$。题设“有两个极值点”意味着 $f^{\prime}(x)=0$ 在 $(0,+\infty)$ 有两个解，即 $e^x=2mx$ 有两解。写成 $m=\frac{e^x}{2x}$（$x>0$），令 $h(x)=\frac{e^x}{2x}$，则 $h^{\prime}(x)=\frac{e^x(x-1)}{2x^2}$，所以 $h$ 在 $(0,1)$ 递减、在 $(1,+\infty)$ 递增，最小值是 $h(1)=\frac e2$。因此直线 $y=m$ 与 $y=h(x)$ 相交两次当且仅当 $m>\frac e2$；当 $m=\frac e2$ 只有一解，不满足“两极值点”。故 $m\in\left(\frac e2,+\infty\right)$。
