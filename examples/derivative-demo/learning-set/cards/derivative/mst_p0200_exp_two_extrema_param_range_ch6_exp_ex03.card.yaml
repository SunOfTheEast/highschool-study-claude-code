original_problem:
  stem: （2023 · 山西阳泉高二期末 T14）若当 $x>0$ 时，函数 $f(x)=2-e^x+mx^2$ 有两个极值点，求实数 $m$ 的取值范围。
  parts: *a1
  choices: []
  answer: $m\in\left(\frac e2,+\infty\right)$。
  fidelity_notes:
    - 源题为填空型单问，无选择项。
    - “有两个极值点”等价于 $f^{\prime}(x)$ 在 $(0,+\infty)$ 有两个零点且变号。
solution:
  source_solution_summary: 由 $f(x)=2-e^x+mx^2$，得 $f^{\prime}(x)=-e^x+2mx$。题设“有两个极值点”意味着 $f^{\prime}(x)=0$ 在 $(0,+\infty)$ 有两个解，即 $e^x=2mx$ 有两解。写成 $m=\frac{e^x}{2x}$（$x>0$），令 $h(x)=\frac{e^x}{2x}$，则 $h^{\prime}(x)=\frac{e^x(x-1)}{2x^2}$，所以 $h$ 在 $(0,1)$ 递减、在 $(1,+\infty)$ 递增，最小值是 $h(1)=\frac e2$。因此直线 $y=m$ 与 $y=h(x)$ 相交两次当且仅当 $m>\frac e2$；当 $m=\frac e2$ 只有一解，不满足“两极值点”。故 $m\in\left(\frac e2,+\infty\right)$。
  key_steps:
    - step_id: step_1
      statement: 把极值点条件转成导函数零点个数。
      formula_trace:
        from: $f(x)=2-e^x+mx^2$
        to: $f^{\prime}(x)=-e^x+2mx,\ e^x=2mx$
        operation: 求导并令导函数等于零。
        why: 极值点个数由导函数变号零点个数决定。
      source_ref: page_0200_ex03_solution
    - step_id: step_2
      statement: 做参变量分离。
      formula_trace:
        from: $e^x=2mx,\ x>0$
        to: $m=\frac{e^x}{2x}$
        operation: 移项并除以 $2x$（$x>0$）。
        why: 把参数范围问题改成水平线与函数值域问题。
      source_ref: page_0200_ex03_solution
    - step_id: step_3
      statement: 求 $h(x)=\frac{e^x}{2x}$ 的最小值阈值。
      formula_trace:
        from: $h(x)=\frac{e^x}{2x}$
        to: $h^{\prime}(x)=\frac{e^x(x-1)}{2x^2},\ h_{\min}=h(1)=\frac e2$
        operation: 导数判单调并取极小值。
        why: 两交点条件等价于参数高于极小值。
      source_ref: page_0200_ex03_solution
    - step_id: step_4
      statement: 由交点个数读参数范围。
      formula_trace:
        from: $m=\frac{e^x}{2x}$
        to: $m>\frac e2$
        operation: 两解对应严格大于最小值；等于最小值仅一解。
        why: 题目要求“有两个极值点”。
      source_ref: page_0200_ex03_solution
teaching_card:
  student_title: 把两极值点转成一条阈值线
  what_it_trains: 训练“极值点个数题”中最常用的参变量分离与阈值判交点套路。
  recognition_cues:
    - 题干给“有两个极值点”并要求参数范围。
    - 导函数方程里参数与 $e^x,x$ 乘积同现。
    - 可改写成 $m=h(x)$ 的值域判定。
  normalization_moves:
    - 先写 $f^{\prime}(x)=0$。
    - 再变形为 $m=\frac{e^x}{2x}$。
    - 求 $h(x)$ 最小值阈值，再读“两解”条件。
  common_failures:
    - 把 $m=\frac e2$ 也算进来，忽略这时只有一个切点。
    - 只用 $e^x\ge ex$ 给必要条件，不补足充分性。
    - 忘记题目限制 $x>0$，导致函数讨论区间错位。
  similar_practice_query: 两个极值点 参数范围 m=e^x/(2x) 阈值 e/2
