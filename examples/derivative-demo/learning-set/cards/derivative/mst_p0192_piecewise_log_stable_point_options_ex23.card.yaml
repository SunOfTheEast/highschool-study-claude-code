stem: |-
  （2023·广州月考·多选T12）已知 $x>0$ 时，$x>\log_2 x$。关于函数 $f(x)=\begin{cases}2^x,&x\le0\\|\log_2 x|,&x>0\end{cases}$，下列说法正确的是（  ）。
  A. 方程 $f(x)=x$ 的解只有一个
  B. 方程 $f(f(x))=1$ 的解有五个
  C. 方程 $f(f(x))=t,\ (0<t<1)$ 的解有五个
  D. 方程 $f(f(x))=x$ 的解有三个
answer: |-
  AC

  先作分段函数图像。由图 23-1 可见，直线 $y=x$ 与 $y=f(x)$ 仅有一个交点，因此 A 正确。 对 B，令 $f(x)=u$，由 $f(u)=1$ 得 $u=0,\frac12,2$。再数方程 $f(x)=0,\ f(x)=\frac12,\ f(x)=2$ 的根数，分别为 $1,3,2$，合计 6 个，所以“有五个”错误，B 错。 对 C，当 $0<t<1$，由图 23-4 得满足 $f(u)=t$ 的 $u$ 有三类：$u_1<0,\ 0<u_2<1,\ u_3>1$。再看 $f(x)=u_i$：对应根数分别为 $0,3,2$，总计 5 个，C 对。 对 D，$f(f(x))=x$ 是稳定点问题，令 $y=f(x)$，则求 $y=f(x)$ 与 $x=f(y)$ 的交点。按图 23-6，将 $y=f(x)$ 关于 $y=x$ 对称后与原曲线有 5 个交点， 因而稳定点有 5 个，D 错。故选 AC。
