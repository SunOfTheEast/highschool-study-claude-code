solution:
  source_solution_summary: 先作分段函数图像。由图 23-1 可见，直线 $y=x$ 与 $y=f(x)$ 仅有一个交点，因此 A 正确。 对 B，令 $f(x)=u$，由 $f(u)=1$ 得 $u=0,\frac12,2$。再数方程 $f(x)=0,\ f(x)=\frac12,\ f(x)=2$ 的根数，分别为 $1,3,2$，合计 6 个，所以“有五个”错误，B 错。 对 C，当 $0<t<1$，由图 23-4 得满足 $f(u)=t$ 的 $u$ 有三类：$u_1<0,\ 0<u_2<1,\ u_3>1$。再看 $f(x)=u_i$：对应根数分别为 $0,3,2$，总计 5 个，C 对。 对 D，$f(f(x))=x$ 是稳定点问题，令 $y=f(x)$，则求 $y=f(x)$ 与 $x=f(y)$ 的交点。按图 23-6，将 $y=f(x)$ 关于 $y=x$ 对称后与原曲线有 5 个交点， 因而稳定点有 5 个，D 错。故选 AC。
  key_steps:
    - step_id: step_1
      statement: 由图 23-1 判断 A。
      formula_trace:
        from: $f(x)=\begin{cases}2^x,&x\le0\\|\log_2 x|,&x>0\end{cases}$
        to: $y=f(x)$ 与 $y=x$ 仅一个交点
        operation: 图像交点计数。
        why: 交点个数就是方程 $f(x)=x$ 的解个数。
      source_ref: page_0193_ex23_solution_cont
    - step_id: step_2
      statement: 把 $f(f(x))=1$ 分层为 $f(x)=u$。
      formula_trace:
        from: $f(f(x))=1$
        to: $f(u)=1\Rightarrow u\in\{0,\frac12,2\}$
        operation: 设中间变量并先解外层方程。
        why: 复合方程先外后内，便于逐层计数。
      source_ref: page_0193_ex23_solution_cont
    - step_id: step_3
      statement: 统计 B 的总根数并判错。
      formula_trace:
        from: $f(x)=0,\ f(x)=\frac12,\ f(x)=2$
        to: 根数 $1+3+2=6$
        operation: 分别数水平线与图像交点。
        why: 与选项“五个”矛盾，故 B 错。
      source_ref: page_0193_ex23_solution_cont
    - step_id: step_4
      statement: 对任意 $0<t<1$，先解 $f(u)=t$ 再回代计数。
      formula_trace:
        from: $f(f(x))=t,\ 0<t<1$
        to: $u_1<0,\ 0<u_2<1,\ u_3>1$，对应根数 $0,3,2$，总计 5
        operation: 图像上分三段取值并分别计交点。
        why: 得到 C 为真。
      source_ref: page_0193_ex23_solution_cont
    - step_id: step_5
      statement: 用稳定点对称图判断 D。
      formula_trace:
        from: $f(f(x))=x$
        to: 原曲线与其关于 $y=x$ 对称曲线交点数为 5
        operation: 把 $x=f(y)$ 解释为对称曲线并计交点。
        why: 稳定点个数是 5，不是 3。
      source_ref: page_0193_ex23_solution_cont
    - step_id: step_6
      statement: 汇总选项。
      formula_trace:
        from: A对，B错，C对，D错
        to: AC
        operation: 多选归并。
        why: 完成作答。
      source_ref: page_0193_ex23_solution_cont
teaching_card:
  student_title: 复合分段函数：先外层取值，再内层计交点
  what_it_trains: 训练复合方程的图像分层计数方法，尤其是分段函数下的稳定点与根数判断。
  recognition_cues:
    - 题目是多选，核心对象是 $f(f(x))$。
    - 函数是“指数 + 绝对值对数”的分段结构。
    - 选项集中在“解的个数”与“稳定点个数”。
  normalization_moves:
    - 先画或读出 $y=f(x)$ 图像关键形状。
    - 令 $u=f(x)$，先解 $f(u)=\text{常数}$。
    - 把每个 $u$ 转为水平线交点数并求和。
  common_failures:
    - 把 B 项中 $f(f(x))=1$ 误数成 5，漏掉一条分支。
    - 对 C 项忘记负值分支 $u_1<0$ 时无解。
    - 把 D 项稳定点误当成不动点个数。
  similar_practice_query: 分段函数 复合方程 根个数 图像交点 稳定点 多选
