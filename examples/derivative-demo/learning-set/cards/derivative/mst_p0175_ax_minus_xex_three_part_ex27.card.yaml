solution:
  source_solution_summary: 第(1)问 $f(0)=0$，$f^{\prime}(x)=a-(x+1)e^x$，所以 $f^{\prime}(0)=a-1$，切线为 $y=(a-1)x$。第(2)问先看 $x\leqslant-1$ 时 $f^{\prime}(x)>0$，无极值；当 $x>-1$ 时 $f^{\prime\prime}(x)=-(x+2)e^x<0$ 在源解控制区间内给出 $f^{\prime}$ 单调下降，并通过 $f^{\prime}(-1)>0$ 与 $f^{\prime}(ea-1)<0$ 夹出唯一零点 $x_0$。第(3)问把 $f(x)\leqslant a+b$ 改写成 $h(x)=xe^x-a(x-1)+b\geqslant0$， 在极小点用 $a=(x_0+1)e^{x_0}$ 消参，得到 $b\geqslant(x_0^2-x_0-1)e^{x_0}$；再令 $t(x)=(x^2-x-1)e^x$，最小值为 $t(1)=-e$，所以 $b\geqslant-e$。
  key_steps:
    - step_id: step_1
      statement: 求切线斜率并写出第(1)问切线方程。
      formula_trace:
        from: $f(x)=ax-xe^x$
        to: $f^{\prime}(x)=a-(x+1)e^x,\quad f^{\prime}(0)=a-1$
        operation: 对 $xe^x$ 用乘积求导。
        why: 切线方程需要切点和斜率。
      source_ref: page_0175:lines 62-66
    - step_id: step_2
      statement: 证明 $f^{\prime}$ 只有一个零点。
      formula_trace:
        from: $f^{\prime}(x)=a-(x+1)e^x$
        to: 存在唯一 $x_0\in(-1,ea-1)$ 使 $f^{\prime}(x_0)=0$
        operation: 用 $f^{\prime}(-1)>0$ 与 $f^{\prime}(ea-1)<0$ 夹根，并结合单调性排除多根。
        why: 极值点个数等于导函数变号零点个数。
      source_ref: page_0175:lines 66-71; page_0176:lines 9-12
    - step_id: step_3
      statement: 把第(3)问恒成立改写成极小值非负。
      formula_trace:
        from: $f(x)\leqslant a+b$
        to: $h(x)=xe^x-a(x-1)+b\geqslant0$
        operation: 移项并定义辅助函数 $h$。
        why: 要对任意 $x$ 恒成立，只需控制 $h$ 的唯一极小值。
      source_ref: page_0176:lines 13-15
    - step_id: step_4
      statement: 用极值点方程消去参数 $a$。
      formula_trace:
        from: $h^{\prime}(x_0)=0,\quad (x_0+1)e^{x_0}-a=0$
        to: $h(x_0)\geqslant0\Rightarrow b\geqslant(x_0^2-x_0-1)e^{x_0}$
        operation: 代入 $a=(x_0+1)e^{x_0}$ 并整理。
        why: 这是把含参恒成立降成单变量最值的关键消参。
      source_ref: page_0176:lines 13-18
    - step_id: step_5
      statement: 求单变量函数最小值得到 $b$ 的范围。
      formula_trace:
        from: $t(x)=(x^2-x-1)e^x$
        to: $t_{\min}=t(1)=-e,\quad b\geqslant-e$
        operation: 求导 $t^{\prime}(x)=(x-1)(x+2)e^x$ 并在 $x>-1$ 上判单调。
        why: 第(3)问最终只剩 $b$ 的下界。
      source_ref: page_0176:lines 18-23
teaching_card:
  student_title: 用极值点方程消掉参数
  what_it_trains: 训练从导函数零点找到隐藏极值点，再把极值点方程代回恒成立条件，完成含参问题降维。
  recognition_cues:
    - 函数含 $xe^x$，导数会出现 $(x+1)e^x$。
    - 题目先问极值点唯一性，再问存在参数的恒成立范围。
    - 第(3)问需要借用第(2)问的唯一极小值点。
  normalization_moves:
    - 先求 $f^{\prime}$ 和 $f^{\prime\prime}$。
    - 用导函数零点 $x_0$ 表示参数 $a$。
    - 把 $h(x_0)\geqslant0$ 整理成只含 $x_0$ 的不等式。
    - 最后再对单变量函数求最小值。
  common_failures:
    - 第(2)问只说“看图显然唯一”，没有给出导函数变号证据。
    - 第(3)问忘记使用 $h^{\prime}(x_0)=0$ 消去 $a$。
    - 整理 $h(x_0)$ 时符号错，把 $x_0^2-x_0-1$ 写错。
  similar_practice_query: ax-xe^x 极值点唯一性 隐极值点消参 恒成立 b范围
