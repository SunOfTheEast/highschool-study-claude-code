  stem: （2021 · 天津高考）已知函数 $f(x)=a x-x e^x\ (a>0)$。
  parts: *a1
  choices: []
  answer: （1）$y=(a-1)x$；（2）仅有一个极值点；（3）$b\geqslant -e$。
