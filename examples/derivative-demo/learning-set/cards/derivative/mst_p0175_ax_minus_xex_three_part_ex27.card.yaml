stem: |-
  （2021 · 天津高考）已知函数 $f(x)=a x-x e^x\ (a>0)$。
  1. 求 $(0,f(0))$ 处的切线方程。
  2. 求证：$f(x)$ 仅有一个极值点。
  3. 若存在 $a$，使 $f(x)\leqslant a+b$ 对任意的 $x\in\mathbf{R}$ 恒成立，求实数 $b$ 的取值范围。
answer: |-
  （1）$y=(a-1)x$；（2）仅有一个极值点；（3）$b\geqslant -e$。

  第(1)问 $f(0)=0$，$f^{\prime}(x)=a-(x+1)e^x$，所以 $f^{\prime}(0)=a-1$，切线为 $y=(a-1)x$。第(2)问先看 $x\leqslant-1$ 时 $f^{\prime}(x)>0$，无极值；当 $x>-1$ 时 $f^{\prime\prime}(x)=-(x+2)e^x<0$ 在源解控制区间内给出 $f^{\prime}$ 单调下降，并通过 $f^{\prime}(-1)>0$ 与 $f^{\prime}(ea-1)<0$ 夹出唯一零点 $x_0$。第(3)问把 $f(x)\leqslant a+b$ 改写成 $h(x)=xe^x-a(x-1)+b\geqslant0$， 在极小点用 $a=(x_0+1)e^{x_0}$ 消参，得到 $b\geqslant(x_0^2-x_0-1)e^{x_0}$；再令 $t(x)=(x^2-x-1)e^x$，最小值为 $t(1)=-e$，所以 $b\geqslant-e$。
