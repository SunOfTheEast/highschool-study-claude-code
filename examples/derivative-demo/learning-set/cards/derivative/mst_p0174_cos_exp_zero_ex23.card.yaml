    - 题头在 page_0174；法二结尾跨到 page_0175 顶部。
solution:
  source_solution_summary: |
    法一：由 $f(x)=0$ 得
    \[
    e^{\cos(2\pi x)}=2ex-e^{2x}+\frac1e=:g(x).
    \]
    因 $\cos(2\pi x)\ge-1$，故
    \[
    e^{\cos(2\pi x)}\ge\frac1e,
    \]
    且当且仅当
    \[
    2\pi x=\pi+2k\pi,\ k\in\mathbf{Z}\Longleftrightarrow x=\frac12+k
    \]
    取等。再看右侧
    \[
    g^{\prime}(x)=2e-2e^{2x},
    \]
    所以 $x<\frac12$ 时 $g^{\prime}(x)>0$，$x>\frac12$ 时 $g^{\prime}(x)<0$，
    即 $g$ 在 $x=\frac12$ 取最大值
    \[
    g\!\left(\frac12\right)=\frac1e.
    \]
    因而
    \[
    g(x)\le\frac1e.
    \]
    要使 $e^{\cos(2\pi x)}=g(x)$，只能两边同时等于 $\frac1e$，故 $x=\frac12$。

    法二：源页把
    \[
    f(x)=(e^{2x}-2ex)+\left(e^{\cos(2\pi x)}-\frac1e\right),
    \]
    两项都非负，第一项在 $x=\frac12$ 取等，第二项在 $x=\frac12+k$ 取等，
    跨页收尾给出
    \[
    \frac12=\frac12+k\Rightarrow k=0,
    \]
    仍得零点 $x=\frac12$。
  key_steps:
    - step_id: step_1
      statement: 把零点方程改写为“左侧指数项 = 右侧函数项”。
      formula_trace:
        from: $e^{\cos(2\pi x)}+e^{2x}-2ex-\frac1e=0$
        to: $e^{\cos(2\pi x)}=2ex-e^{2x}+\frac1e=:g(x)$
        operation: 移项定义右侧函数 $g(x)$。
        why: 便于分别估计左右两边的可取范围。
      source_ref: page_0174_ex23_solution_method1
    - step_id: step_2
      statement: 给出左侧下界及取等条件。
      formula_trace:
        from: $\cos(2\pi x)\ge-1$
        to: $e^{\cos(2\pi x)}\ge\frac1e$，且取等当且仅当 $x=\frac12+k$
        operation: 指数函数单调，直接由余弦最小值推下界。
        why: 锁定左侧最小可达值与候选等号点。
      source_ref: page_0174_ex23_solution_method1
    - step_id: step_3
      statement: 求右侧函数最大值。
      formula_trace:
        from: $g(x)=2ex-e^{2x}+\frac1e$
        to: $g^{\prime}(x)=2e-2e^{2x}$，$g(x)\le g\!\left(\frac12\right)=\frac1e$
        operation: 求导判单调：先增后减，顶点在 $x=\frac12$。
        why: 右侧被上界 $\frac1e$ 卡住，与左侧下界形成夹逼。
      source_ref: page_0174_ex23_solution_method1
    - step_id: step_4
      statement: 双边等号同时成立，锁定唯一解。
      formula_trace:
        from: $e^{\cos(2\pi x)}\ge\frac1e,\ g(x)\le\frac1e$
        to: $e^{\cos(2\pi x)}=g(x)$ 只能在 $x=\frac12$ 取到
        operation: 令上下界同时取等并交叉匹配候选点。
        why: 等式成立必须两边同取边界值。
      source_ref: page_0174_ex23_solution_method1
    - step_id: step_5
      statement: 法二跨页复核同一结论。
      formula_trace:
        from: $f(x)=(e^{2x}-2ex)+\left(e^{\cos(2\pi x)}-\frac1e\right)$
        to: 两项同为 0 需 $x=\frac12$ 且 $x=\frac12+k$，故 $k=0$
        operation: 拆成两段非负项并在 page_0175 顶部完成零点比大小收尾。
        why: 独立路线再次确认零点唯一为 $\frac12$。
      source_ref: page_0175_ex23_solution_method2_end
teaching_card:
  student_title: 上下界夹同一个值：零点只剩 $\frac12$
  what_it_trains: 训练“等式两边分别估上下界，再看是否夹到同一个常数”的零点判定套路。
  recognition_cues:
    - 题式含 $e^{\cos(\cdot)}$ 与指数二次组合，直接硬解困难。
    - 能分别看出一侧天然有下界、另一侧天然有上界。
    - 题目是填空零点，常见唯一解结构。
  normalization_moves:
    - 移项成 $e^{\cos(2\pi x)}=g(x)$。
    - 左边用 $\cos\ge-1$ 给下界 $\frac1e$。
    - 右边用导数给上界 $\frac1e$。
    - 两边同取等，交集锁定 $x=\frac12$。
  common_failures:
    - 把 $g^{\prime}(x)$ 求错成 $2e-2xe^{2x}$。
    - 只用 $x=\frac12+k$ 就下结论，漏掉与右侧极值点匹配。
    - 没有检查 page_0175 顶部续解，遗漏法二的收尾等号条件。
  similar_practice_query: e^{cos2pix} e^{2x}-2ex 零点 夹逼 取等条件
