original_problem:
  stem: （2024 · 浙江新阵地教育联盟高三第三次联考）已知函数 $f(x)=\cos x+\lambda\ln(1+x)$，且曲线 $y=f(x)$ 在点 $(0,f(0))$ 处的切线斜率为 1。
  parts: *a1
  choices: []
  answer: 第(1)问：$f(x)=\cos x+\ln(1+x)$。第(2)问：$a=1$。
