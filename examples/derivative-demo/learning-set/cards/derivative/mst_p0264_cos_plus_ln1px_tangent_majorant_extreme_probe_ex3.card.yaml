stem: |-
  （2024 · 浙江新阵地教育联盟高三第三次联考）已知函数 $f(x)=\cos x+\lambda\ln(1+x)$，且曲线 $y=f(x)$ 在点 $(0,f(0))$ 处的切线斜率为 1。
  1. 求 $f(x)$ 的表达式。
  2. 若 $f(x)\le ax+1$ 恒成立，求 $a$ 的值。
answer: |-
  第(1)问：$f(x)=\cos x+\ln(1+x)$。第(2)问：$a=1$。

  第(1)问求导 $f^\prime(x)=-\sin x+\frac{\lambda}{1+x}$，切线斜率 $f^\prime(0)=\lambda=1$，故 $f(x)=\cos x+\ln(1+x)$。 第(2)问令 $h(x)=\cos x+\ln(1+x)-ax-1$。题设要求 $h(x)\le0$， 且 $h(0)=0$，所以 $x=0$ 是极大值点，必有 $h^\prime(0)=1-a=0$，得 $a=1$。当 $a=1$ 时， $h=(\cos x-1)+(\ln(1+x)-x)\le0$，故充分。
