solution:
  source_solution_summary: 第(1)问求导 $f^\prime(x)=-\sin x+\frac{\lambda}{1+x}$，切线斜率 $f^\prime(0)=\lambda=1$，故 $f(x)=\cos x+\ln(1+x)$。 第(2)问令 $h(x)=\cos x+\ln(1+x)-ax-1$。题设要求 $h(x)\le0$， 且 $h(0)=0$，所以 $x=0$ 是极大值点，必有 $h^\prime(0)=1-a=0$，得 $a=1$。当 $a=1$ 时， $h=(\cos x-1)+(\ln(1+x)-x)\le0$，故充分。
  key_steps:
    - step_id: step_1
      statement: 由切线斜率确定 $\lambda$。
      formula_trace:
        from: $f^\prime(x)=-\sin x+\frac{\lambda}{1+x}$
        to: $f^\prime(0)=\lambda=1$
        operation: 代入切点 $x=0$。
        why: 切线斜率已给为 1。
      source_ref: page_0264_ex3_solution
    - step_id: step_2
      statement: 构造差函数。
      formula_trace:
        from: $f(x)\le ax+1$
        to: $h(x)=\cos x+\ln(1+x)-ax-1\le0$
        operation: 移项。
        why: 恒成立问题转为 $h$ 的极大值不超过 0。
      source_ref: page_0264_ex3_solution
    - step_id: step_3
      statement: 用 $h(0)=0$ 锁住参数。
      formula_trace:
        from: $h(0)=0$，且 $h(x)\le0$
        to: $h^\prime(0)=1-a=0$，$a=1$
        operation: 开区间内极大值点导数为 0。
        why: 极点效应给出必要条件。
      source_ref: page_0264_ex3_solution
    - step_id: step_4
      statement: 回证 $a=1$。
      formula_trace:
        from: $h(x)=(\cos x-1)+[\ln(1+x)-x]$
        to: $h(x)\le0$
        operation: 分别使用 $\cos x\le1$ 和 $\ln(1+x)\le x$。
        why: 完成充分性。
      source_ref: page_0264_ex3_solution
teaching_card:
  student_title: 上界刚好过 $x=0$，先令导数也贴住
  what_it_trains: 训练切线型极点效应：恒有 $f(x)\le ax+1$，且 $x=0$ 取等，就先让差函数在 0 处导数为 0。
  recognition_cues:
    - 题目给了 $(0,f(0))$ 处切线斜率。
    - 不等式右侧是直线 $ax+1$，且在 $x=0$ 与函数同值。
    - 差函数 $h(0)=0$，目标是 $h\le0$。
  normalization_moves:
    - 先用切线斜率求 $\lambda$。
    - 再构造 $h=f-ax-1$。
    - 由 $h^\prime(0)=0$ 求 $a$，最后回证。
  common_failures:
    - 只求出 $a=1$，没有证明 $a=1$ 时全域成立。
    - 把 $\ln(1+x)\le x$ 只用在 $x\ge0$，忘记它在 $x>-1$ 都成立。
    - 忽略 $\cos x-1\le0$ 可以直接提供另一半上界。
  similar_practice_query: 极点效应 cosx ln(1+x) 切线斜率 ax+1 上界 a=1
