stem: |-
  设 0<x<1。
  (1). 证明：\frac{1}{x}-\frac{x}{6}<\frac{\sin x}{x^{2}}。
  (2). 若 ax-\frac{x^{3}}{6}<\sin x，求 a 的取值范围。
answer: |-
  (1) 证明见解析；(2) a\leqslant1。

  第 (1) 问把不等式乘以正数 x^2，等价于证明 g(x)=\sin x+\frac{x^3}{6}-x>0。由 g''(x)=x-\sin x>0 得 g'(x)>g'(0)=0，再得 g(x)>g(0)=0。第 (2) 问令 h(x)=\sin x+\frac{x^3}{6}-ax；若 a\leqslant1，则 h'(x) 递增且 h'(x)>h'(0)=1-a\geqslant0，所以 h(x)>0。若 a>1，则 h'(0)<0， 而源解用 h'(2a)>0 说明 h' 有零点，故 0 附近 h 先下降并小于 0， 与题设矛盾，最终 a\leqslant1。
