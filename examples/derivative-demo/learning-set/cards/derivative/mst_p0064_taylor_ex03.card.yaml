original_problem:
  stem: 设 0<x<1。
  parts: *a1
  choices: []
  answer: (1) 证明见解析；(2) a\leqslant1。
  fidelity_notes:
    - 原题为证明题与求参题，没有选择项。
    - 源解末尾用非严格的 h(x)\geqslant0 收束；结合前文 h(x)>h(0)=0 对 0<x<1 成立，本卡按题干严格不等式记录。
solution:
  source_solution_summary: 第 (1) 问把不等式乘以正数 x^2，等价于证明 g(x)=\sin x+\frac{x^3}{6}-x>0。由 g''(x)=x-\sin x>0 得 g'(x)>g'(0)=0，再得 g(x)>g(0)=0。第 (2) 问令 h(x)=\sin x+\frac{x^3}{6}-ax；若 a\leqslant1，则 h'(x) 递增且 h'(x)>h'(0)=1-a\geqslant0，所以 h(x)>0。若 a>1，则 h'(0)<0， 而源解用 h'(2a)>0 说明 h' 有零点，故 0 附近 h 先下降并小于 0， 与题设矛盾，最终 a\leqslant1。
  key_steps:
    - step_id: step_1
      statement: 先把第 (1) 问的分式不等式化为一个误差函数的正性。
      formula_trace:
        from: \frac{1}{x}-\frac{x}{6}<\frac{\sin x}{x^2},\quad 0<x<1
        to: g(x)=\sin x+\frac{x^3}{6}-x>0
        operation: 两边乘以正数 x^2，并把所有项移到右侧。
        why: 这样把 \sin x 与它的三阶泰勒下界差值集中到 g(x)。
      source_ref: page_0064_solution
    - step_id: step_2
      statement: 用二阶导证明 g 在 0 右侧严格为正。
      formula_trace:
        from: g'(x)=\cos x+\frac{x^2}{2}-1,\quad g''(x)=x-\sin x>0
        to: g'(x)>g'(0)=0,\quad g(x)>g(0)=0\quad(0<x<1)
        operation: 先由 g''>0 得 g' 单调递增，再由 g'>0 得 g 单调递增。
        why: x>0 时有 \sin x<x，故 g''(x)>0；从 0 右侧出发可得到严格正性。
      source_ref: page_0064_solution
    - step_id: step_3
      statement: 第 (2) 问改写为 h(x)>0 对所有 0<x<1 成立。
      formula_trace:
        from: ax-\frac{x^3}{6}<\sin x
        to: h(x)=\sin x+\frac{x^3}{6}-ax>0
        operation: 把含 a 的线性项移到同一侧，构造与第 (1) 问同型的误差函数。
        why: 参数 a 只出现在 -ax 中，便于通过 h'(0)=1-a 判断临界值。
      source_ref: page_0064_solution
    - step_id: step_4
      statement: 证明 a\leqslant1 时条件成立。
      formula_trace:
        from: h'(x)=\cos x+\frac{x^2}{2}-a,\quad h''(x)=x-\sin x>0
        to: h'(x)>h'(0)=1-a\geqslant0,\quad h(x)>h(0)=0
        operation: 利用 h' 在 x>0 上严格递增，并从 h'(0) 与 h(0) 起步比较。
        why: 当 a\leqslant1 时，h' 在 0 右侧为正，所以 h 在 0 右侧严格增大。
      source_ref: page_0064_solution
    - step_id: step_5
      statement: 排除 a>1：此时 h 在 0 右侧会先下降。
      formula_trace:
        from: h'(0)=1-a<0,\quad h'(2a)=\cos2a-a+2a^2
        to: "h'(2a)\\geqslant2a^2-a-1>0,\\quad \\exists x_0\\in(0,2a): h'(x_0)=0"
        operation: 用 \cos2a\geqslant-1 估计 h'(2a)，再用零点存在性定理。
        why: h' 从负变到正且单调递增，说明在第一个零点前 h'(x)<0。
      source_ref: page_0064_solution
    - step_id: step_6
      statement: 在 a>1 时取足够小的正 x，就与题设矛盾。
      formula_trace:
        from: h'(x)<0\quad(0<x<x_0),\quad h(0)=0
        to: 0<x<\min\{x_0,1\}\Rightarrow h(x)<0
        operation: 在 h' 为负的右邻域内比较函数值。
        why: 题设要求所有 0<x<1 都有 h(x)>0；近 0 的反例排除 a>1。
      source_ref: page_0064_solution
    - step_id: step_7
      statement: 合并充分性与必要性，得到参数范围。
      formula_trace:
        from: a\leqslant1\Rightarrow h(x)>0;\quad a>1\Rightarrow \exists x\in(0,1),h(x)<0
        to: a\leqslant1
        operation: 取满足题设的全部 a。
        why: 临界值由 h'(0)=1-a 决定，且 a=1 本身因 h'(x)>0、h(x)>0 可取。
      source_ref: page_0064_solution
teaching_card:
  student_title: 用 \sin x 的三阶下界卡住参数 a
  what_it_trains: 训练把三角函数泰勒下界写成“误差函数大于 0”，再用导数递增和 0 右侧邻域判断参数能不能超过临界值。
  recognition_cues:
    - 题干出现 \sin x 与 x-\frac{x^3}{6} 的比较。
    - 区间是 0<x<1，0 的右邻域虽然不含端点，但可以用极限和导数符号逼近。
    - 参数只在线性项 ax 中出现。
  normalization_moves:
    - 先把第 (1) 问化为 g(x)=\sin x+\frac{x^3}{6}-x>0。
    - 第 (2) 问照样构造 h(x)=\sin x+\frac{x^3}{6}-ax。
    - 用 h'(0)=1-a 判断 a 的临界值是 1。
    - 对 a>1，不求全局最小值，只取 0 右侧足够小的反例。
  common_failures:
    - 把第 (1) 问误当成直接套 \sin x\geqslant x-\frac{x^3}{6}，忽略本题要证明严格大于。
    - 认为 a<1 才能成立，漏掉 a=1 时 h'(x)>0、h(x)>0。
    - 排除 a>1 时只看 h'(0)<0，却忘了说明存在 0<x<1 使 h(x)<0。
  similar_practice_query: sin x 三阶泰勒下界 参数 a 0 右邻域 导数递增 不等式恒成立
