stem: （2023 河南驻马店高二期中 T16）点 $P$ 是曲线 $f(x)=2x^2-3\ln x$ 上任意一点，则点 $P$ 到直线 $y=x-4$ 的最短距离______。
answer: |-
  $\frac{5\sqrt2}{2}$

  直线 $y=x-4$ 的斜率为 1。曲线 $f(x)=2x^2-3\ln x$ 满足 $f'(x)=4x-\frac3x$。令 $4x-\frac3x=1$, 得 $x=1$ 或 $x=-3/4$, 由 $x>0$ 舍去负根。切点为 $(1,2)$。把直线写成 $x-y-4=0$, 则最短距离为 $|1-2-4|/\sqrt2=5\sqrt2/2$。
