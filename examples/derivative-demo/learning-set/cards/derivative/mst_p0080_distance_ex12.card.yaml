original_problem:
  stem: （2023 河南驻马店高二期中 T16）点 $P$ 是曲线 $f(x)=2x^2-3\ln x$ 上任意一点，则点 $P$ 到直线 $y=x-4$ 的最短距离______。
  parts: *a1
  choices: []
  answer: $\frac{5\sqrt2}{2}$
  fidelity_notes:
    - 源题为填空题, 无分问和选项。
    - 因含 $\ln x$, 曲线定义域为 $x>0$; 源解在求导处明确标出该条件。
solution:
  source_solution_summary: 直线 $y=x-4$ 的斜率为 1。曲线 $f(x)=2x^2-3\ln x$ 满足 $f'(x)=4x-\frac3x$。令 $4x-\frac3x=1$, 得 $x=1$ 或 $x=-3/4$, 由 $x>0$ 舍去负根。切点为 $(1,2)$。把直线写成 $x-y-4=0$, 则最短距离为 $|1-2-4|/\sqrt2=5\sqrt2/2$。
  key_steps:
    - step_id: step_1
      statement: 用平行切线条件列方程。
      formula_trace:
        from: $f(x)=2x^2-3\ln x,\quad y=x-4$ 的斜率为 $1$
        to: $f'(x)=4x-\frac3x=1$
        operation: 求导后令切线斜率等于给定直线斜率。
        why: 曲线到直线的最短距离对应一条与给定直线平行的曲线切线。
      source_ref: page_0080:line 31
    - step_id: step_2
      statement: 解切点横坐标并用定义域筛根。
      formula_trace:
        from: $4x-\frac3x=1$
        to: $x=1\quad (x=-\frac34\text{舍去})$
        operation: 两边同乘 $x$ 得 $4x^2-x-3=0$, 再按 $x>0$ 保留正根。
        why: $\ln x$ 要求 $x>0$, 负根不在曲线上。
      source_ref: page_0080:line 31
    - step_id: step_3
      statement: 求切点并计算到直线的距离。
      formula_trace:
        from: $x=1,\quad f(1)=2,\quad y=x-4$
        to: $d=\frac{|1-2-4|}{\sqrt{1+1}}=\frac{5\sqrt2}{2}$
        operation: 求出切点 $(1,2)$, 将直线写成 $x-y-4=0$ 后套距离公式。
        why: 该平行切线切点给出全局最短距离。
      source_ref: page_0080:line 31
teaching_card:
  student_title: 先用定义域筛掉无效切点
  what_it_trains: 训练学生在曲线到直线的最短距离题中, 先用平行切线找候选点, 再用对数函数的定义域筛掉假根, 最后用距离公式完成计算。
  recognition_cues:
    - 题目问曲线 $2x^2-3\ln x$ 到固定直线的最短距离。
    - 固定直线 $y=x-4$ 的斜率是 1。
    - 求导方程会出现一个负根, 但原曲线只在 $x>0$ 有意义。
  normalization_moves:
    - 先写 $x>0$。
    - "令 $4x-\frac3x=1$。"
    - 保留切点 $(1,2)$。
    - 把直线化为 $x-y-4=0$ 后算距离。
  common_failures:
    - 忘记 $\ln x$ 的定义域, 把负根也当候选点。
    - 把 $y=x-4$ 的标准式误写成 $x-y+4=0$。
    - 只求出切点, 没有代入点到直线距离公式。
  similar_practice_query: 2x^2-3lnx 到 y=x-4 最短距离 平行切线 定义域筛根
