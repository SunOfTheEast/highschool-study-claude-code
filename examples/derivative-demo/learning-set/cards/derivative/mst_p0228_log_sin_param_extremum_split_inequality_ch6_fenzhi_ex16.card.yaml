original_problem:
  stem: （2020 · 淮南一模 T21）已知函数 $f(x)=\frac{x\ln x+a+1}{x}$，在区间 $[1,2]$ 有极值。
  parts: *a1
  choices: []
  answer: 第 (1) 问：$0<a<1$；第 (2) 问在 $x>0$ 上成立。
  fidelity_notes:
    - 两问均无选项。
    - 第 (2) 问原题未另列区间，解析按 $x>0$ 使用；这是 $f$ 的自然定义域。
solution:
  source_solution_summary: $f(x)=\ln x+\frac{a+1}{x}$，所以 $f'(x)=\frac{x-(a+1)}{x^2}$。若 $a+1\leqslant1$，则 $f$ 在 $[1,2]$ 上单调递增，无极值；若 $a+1\geqslant2$，则 $f$ 在 $[1,2]$ 上单调递减，无极值。只有 $1<a+1<2$，即 $0<a<1$ 时，临界点落在区间内部，$f$ 先减后增，有极值。 第 (2) 问等价于证明 $x\ln x+a+1>a(\sin x+1)$，即 $x\ln x+1>a\sin x$。令 $g(x)=x\ln x-x+1$，得 $x\ln x\geqslant x-1$；又由 $h(x)=x-\sin x$ 可知 $x>\sin x$ 对 $x>0$ 成立。因为 $0<a<1$，所以 $x\ln x\geqslant x-1>ax-1>a\sin x-1$，即 $x\ln x+1>a\sin x$，从而 $f(x)>\frac{a(\sin x+1)}x$。
  key_steps:
    - step_id: step_1
      statement: 先把 $f$ 化成易求导形式。
      formula_trace:
        from: $f(x)=\frac{x\ln x+a+1}{x}$
        to: $f(x)=\ln x+\frac{a+1}{x}$
        operation: 拆分分式。
        why: 拆开后临界点直接由一阶导决定。
      source_ref: page_0228_ex16_solution_start
    - step_id: step_2
      statement: 求导并定位临界点。
      formula_trace:
        from: $f(x)=\ln x+\frac{a+1}{x}$
        to: $f^\prime(x)=\frac{x-(a+1)}{x^2}$
        operation: 求导并通分。
        why: $x^2>0$，导数符号由 $x-(a+1)$ 决定。
      source_ref: page_0228_ex16_solution_start
    - step_id: step_3
      statement: 用“区间内部极值点”给出参数范围。
      formula_trace:
        from: $x=a+1$ 要落在 $(1,2)$
        to: $0<a<1$
        operation: 由 $1<a+1<2$ 解参数。
        why: 端点或区间外只会导致 $[1,2]$ 上单调，无极值。
      source_ref: page_0229_ex16_continuation
    - step_id: step_4
      statement: 把第 (2) 问乘以正数 $x$ 后化简。
      formula_trace:
        from: $f(x)>\frac{a(\sin x+1)}x$
        to: $x\ln x+1>a\sin x$
        operation: 两边乘以 $x>0$ 并消去 $a$。
        why: 证明目标变成 $x\ln x$、$x$、$\sin x$ 的基础比较。
      source_ref: page_0229_ex16_continuation
    - step_id: step_5
      statement: 证明 $x\ln x\geqslant x-1$。
      formula_trace:
        from: $g(x)=x\ln x-x+1$
        to: $g(x)\geqslant0$
        operation: 求导 $g^\prime(x)=\ln x$，最小值在 $x=1$ 处为 0。
        why: 这是对数切线放缩的基础形式。
      source_ref: page_0229_ex16_continuation
    - step_id: step_6
      statement: 证明 $x>\sin x$。
      formula_trace:
        from: $h(x)=x-\sin x$
        to: $h(x)>0\quad(x>0)$
        operation: 求导 $h^\prime(x)=1-\cos x\geqslant0$，且 $h(0)=0$。
        why: 三角部分用最基础的整体比较处理。
      source_ref: page_0229_ex16_continuation
    - step_id: step_7
      statement: 利用 $0<a<1$ 串起不等式链。
      formula_trace:
        from: $x\ln x\geqslant x-1,\ x>\sin x,\ 0<a<1$
        to: $x\ln x+1>a\sin x$
        operation: 写成 $x\ln x\geqslant x-1>ax-1>a\sin x-1$。
        why: 参数范围把 $x$ 缩成 $ax$，三角界再把 $ax$ 缩成 $a\sin x$。
      source_ref: page_0229_ex16_continuation
teaching_card:
  student_title: 先让极值点落进区间，再用两条基础不等式串链
  what_it_trains: 训练参数范围反哺证明：第 (1) 问得到 $0<a<1$ 后，第 (2) 问用它把 $x$ 缩成 $ax$，再接三角界。
  recognition_cues:
    - “在 $[1,2]$ 有极值”说明导数零点要落在区间内部。
    - $x\ln x$ 优先想到 $x\ln x\geqslant x-1$。
    - 右侧有 $a\sin x$，且已知 $0<a<1$，可以走 $x>ax>a\sin x$ 这条链。
  normalization_moves:
    - 拆分 $f(x)$ 并求导，得到临界点 $a+1$。
    - 由 $1<a+1<2$ 得 $0<a<1$。
    - 第 (2) 问乘以 $x>0$，化为 $x\ln x+1>a\sin x$。
    - 用 $x\ln x\geqslant x-1$ 和 $x>\sin x$ 串成严格不等式。
  common_failures:
    - 把端点 $a=0$ 或 $a=1$ 也放进“有极值”的范围。
    - 第 (2) 问忘记先乘以 $x>0$，导致结构看不出来。
    - 只会分别写 $x\ln x\geqslant x-1$ 和 $x>\sin x$，但不会用 $0<a<1$ 串链。
  similar_practice_query: xlnx+a+1 over x 区间极值 0<a<1 xlnx>=x-1 x>sinx 参数缩放链
