stem: |-
  （2020 · 淮南一模 T21）已知函数 $f(x)=\frac{x\ln x+a+1}{x}$，在区间 $[1,2]$ 有极值。
  1. 求 $a$ 的取值范围。
  2. 证明：$f(x)>\frac{a(\sin x+1)}{x}$。
answer: |-
  第 (1) 问：$0<a<1$；第 (2) 问在 $x>0$ 上成立。

  $f(x)=\ln x+\frac{a+1}{x}$，所以 $f'(x)=\frac{x-(a+1)}{x^2}$。若 $a+1\leqslant1$，则 $f$ 在 $[1,2]$ 上单调递增，无极值；若 $a+1\geqslant2$，则 $f$ 在 $[1,2]$ 上单调递减，无极值。只有 $1<a+1<2$，即 $0<a<1$ 时，临界点落在区间内部，$f$ 先减后增，有极值。 第 (2) 问等价于证明 $x\ln x+a+1>a(\sin x+1)$，即 $x\ln x+1>a\sin x$。令 $g(x)=x\ln x-x+1$，得 $x\ln x\geqslant x-1$；又由 $h(x)=x-\sin x$ 可知 $x>\sin x$ 对 $x>0$ 成立。因为 $0<a<1$，所以 $x\ln x\geqslant x-1>ax-1>a\sin x-1$，即 $x\ln x+1>a\sin x$，从而 $f(x)>\frac{a(\sin x+1)}x$。
