    - 题设出现 $(x^2+x)f^{\prime}(x)$ 与线性系数 $(3x+2)f(x)$。
    - 选项全是固定点函数值的倍数比较。
  normalization_moves:
    - 先同乘 $x$ 对齐到 $x^3+x^2$。
    - 作商并判 $g^{\prime}(x)<0$。
    - 建立 $\frac12\to3$ 的比较链统一判项。
