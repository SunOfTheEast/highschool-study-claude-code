stem: |-
  （2023 · 如东县期末 · 多选）定义在 $(0,+\infty)$ 上的函数 $f(x)$ 的导函数为 $f^{\prime}(x)$，且 $(x^2+x)f^{\prime}(x)<(3x+2)f(x)$ 恒成立，则必有（  ）
  A. $f(3)>20f(1)$
  B. $f(2)<6f(1)$
  C. $3f(1)>16f\left(\frac{1}{2}\right)$
  D. $f(3)<3f(2)$
answer: |
  BD

  令
  \[
  g(x)=\frac{f(x)}{x^3+x^2},\quad x>0.
  \]
  则
  \[
  g^{\prime}(x)=
  \frac{f^{\prime}(x)(x^3+x^2)-f(x)(3x^2+2x)}{(x^3+x^2)^2}.
  \]
  由题设
  \[
  (x^2+x)f^{\prime}(x)<(3x+2)f(x)
  \]
  两边同乘 $x(>0)$ 得
  \[
  f^{\prime}(x)(x^3+x^2)-f(x)(3x^2+2x)<0,
  \]
  故 $g^{\prime}(x)<0$，即 $g$ 在 $(0,+\infty)$ 单调递减。
  因而
  \[
  g\left(\frac12\right)>g(1)>g(2)>g(3),
  \]
  即
  \[
  \frac{f(1/2)}{3/8}>\frac{f(1)}{2}>\frac{f(2)}{12}>\frac{f(3)}{36}.
  \]
  于是
  \[
  f(2)<6f(1),\quad f(3)<3f(2),
  \]
  得 B、D 正确。
  同时由链可得 $f(3)<18f(1)$，故 A 错；
  且 $3f(1)<16f(1/2)$，故 C 错。
  所以选 BD。
