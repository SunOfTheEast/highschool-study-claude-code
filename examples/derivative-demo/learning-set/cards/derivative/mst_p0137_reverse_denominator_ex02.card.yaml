    - step_id: step_1
      statement: 把题设右侧系数对齐为 $(x^3+x^2)^{\prime}$。
      formula_trace:
        from: $(x^2+x)f^{\prime}(x)<(3x+2)f(x)$
        to: $f^{\prime}(x)(x^3+x^2)-f(x)(3x^2+2x)<0$
