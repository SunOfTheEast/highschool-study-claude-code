stem: |-
  （2024 · 河南漯河高级中学三模 T17）已知函数 $f(x)=a(\ln x+1)+\frac1{x^3}$（$a>0$）。
  1. 求证：$1+x\ln x>0$。
  2. 若 $x_1,x_2$ 是 $f(x)$ 的两个相异零点，求证：$|x_2-x_1|<1-\sqrt{\frac1a}$。
answer: |-
  第 (1) 问：$1+x\ln x>0$；第 (2) 问：在两个相异零点存在时，$|x_2-x_1|<1-\sqrt{1/a}$。

  第 (1) 问令 $g(x)=1+x\ln x$，$g'(x)=1+\ln x$，极小值点为 $x=1/e$，$g_{\min}=1-1/e>0$。第 (2) 问 $f'(x)=\frac{ax^3-3}{x^4}$，所以 $f$ 在 $(0,\sqrt[3]{3/a})$ 递减，在 $(\sqrt[3]{3/a},+\infty)$ 递增。 极小值为 $\frac a3(\ln\frac3a+3)+\frac a3=\frac a3(\ln\frac3a+4)$。 若 $0<a\leq3e^4$，至多一个零点；若 $a>3e^4$，则有两个零点， 且右侧零点 $x_2$ 满足 $\sqrt[3]{3/a}<x_2<1$。左侧用第 (1) 问 得 $x\ln x>-1$，从而 $f(x)=a\ln(ex)+1/x^3>-a/(ex)+1/x^3$，取 $x=\sqrt{e/a}$ 得 $\sqrt{1/a}<\sqrt{e/a}<x_1$。因此 $x_2<1$ 且 $x_1>\sqrt{1/a}$，所以 $|x_2-x_1|<1-\sqrt{1/a}$。
