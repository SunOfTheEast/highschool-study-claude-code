stem: （2024 · 天津卷压轴节选）设函数 $f(x)=x\ln x$。若 $f(x)\ge a(x-\sqrt x)$ 在 $x\in(0,+\infty)$ 时恒成立，求 $a$ 的取值范围。
answer: |-
  $a=2$。

  构造 $g(x)=x\ln x-a(x-\sqrt x)$。因为 $g(1)=0$， 若 $g(x)\ge0$ 对开区间全域成立，则 $x=1$ 是极小值点， 必有 $g^\prime(1)=0$，于是 $g^\prime(x)=\ln x+1-a+\frac{a}{2\sqrt x}$， 代入 $x=1$ 得 $2-\frac a2=0$，所以 $a=2$。充分性： 当 $a=2$ 时， $g(x)=x(\ln x-2+\frac2{\sqrt x}) =2x(\ln\sqrt x-1+\frac1{\sqrt x})\ge0$， 因此答案为 $a=2$。
