original_problem:
  stem: （2024 · 天津卷压轴节选）设函数 $f(x)=x\ln x$。若 $f(x)\ge a(x-\sqrt x)$ 在 $x\in(0,+\infty)$ 时恒成立，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a=2$。
  fidelity_notes:
    - 求参范围退化为单点值。
    - source 先用极点效应锁必要性，再在 page_0264 证明充分性。
solution:
  source_solution_summary: 构造 $g(x)=x\ln x-a(x-\sqrt x)$。因为 $g(1)=0$， 若 $g(x)\ge0$ 对开区间全域成立，则 $x=1$ 是极小值点， 必有 $g^\prime(1)=0$，于是 $g^\prime(x)=\ln x+1-a+\frac{a}{2\sqrt x}$， 代入 $x=1$ 得 $2-\frac a2=0$，所以 $a=2$。充分性： 当 $a=2$ 时， $g(x)=x(\ln x-2+\frac2{\sqrt x}) =2x(\ln\sqrt x-1+\frac1{\sqrt x})\ge0$， 因此答案为 $a=2$。
  key_steps:
    - step_id: step_1
      statement: 构造差函数并锁定 $x=1$。
      formula_trace:
        from: $x\ln x\ge a(x-\sqrt x)$
        to: $g(x)=x\ln x-a(x-\sqrt x)$，$g(1)=0$
        operation: 移项构造差函数。
        why: 恒非负且在 $x=1$ 取到 0，提示极点效应。
      source_ref: page_0263_ex2_solution_start
    - step_id: step_2
      statement: 用极小值必要条件锁参数。
      formula_trace:
        from: $g^\prime(x)=\ln x+1-a+\frac{a}{2\sqrt x}$
        to: $g^\prime(1)=2-\frac a2=0$，$a=2$
        operation: 令极小值点导数为 0。
        why: 开区间内极小值点必须满足导数为 0。
      source_ref: page_0263_ex2_solution_start
    - step_id: step_3
      statement: 证明 $a=2$ 的充分性。
      formula_trace:
        from: $g(x)=x\ln x-2(x-\sqrt x)$
        to: $g(x)=2x(\ln\sqrt x-1+\frac1{\sqrt x})\ge0$
        operation: 提取 $x$ 并把 $\ln x$ 改成 $2\ln\sqrt x$。
        why: 利用 $\ln u\ge1-\frac1u$ 证明括号非负。
      source_ref: page_0264_ex2_solution_continuation
    - step_id: step_4
      statement: 合并结论。
      formula_trace:
        from: $a=2$ 必要且充分
        to: $a$ 的取值范围为 $\{2\}$
        operation: 必要性与充分性合并。
        why: 求参范围退化为单点。
      source_ref: page_0264_ex2_solution_continuation
teaching_card:
  student_title: 全域恒成立在 $x=1$ 贴住，先令导数为 0
  what_it_trains: 训练开区间极点效应：差函数已经在 $x=1$ 取到 0，恒非负就必须让这里成为极小值点。
  recognition_cues:
    - $x\ln x$ 和 $x-\sqrt x$ 在 $x=1$ 都为 0。
    - 题目要求整个 $(0,+\infty)$ 恒成立。
    - 参数范围最后退化为一个值。
  normalization_moves:
    - 先构造 $g(x)=x\ln x-a(x-\sqrt x)$。
    - 用 $g(1)=0$ 和 $g^\prime(1)=0$ 锁参。
    - 锁参后必须回证 $a=2$ 真的全域成立。
  common_failures:
    - 只由 $g^\prime(1)=0$ 得到 $a=2$，漏掉充分性。
    - 把“取值范围”误以为一定是区间，没接受单点答案。
    - 不会把 $\ln x-2+\frac2{\sqrt x}$ 改写成 $\ln\sqrt x-1+\frac1{\sqrt x}$。
  similar_practice_query: 极点效应 xlnx x-sqrtx x=1 导数锁参 a=2
