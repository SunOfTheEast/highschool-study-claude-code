solution:
  source_solution_summary: |
    设 $g(x)=\frac{f(x)}{x}$，则
    $g^{\prime}(x)=\frac{xf^{\prime}(x)-f(x)}{x^2}
    =\frac{(x-1)e^x}{x^2}
    =\left(\frac{e^x}{x}\right)^{\prime}$。
    故 $g(x)=\frac{e^x}{x}+c$。由 $f(1)=0$ 得 $g(1)=0$，所以
    $e+c=0$，即 $c=-e$，从而
    $g(x)=\frac{e^x}{x}-e$，$f(x)=e^x-ex$。
    再算 $f^{\prime}(x)=e^x-e$：当 $0<x<1$ 时 $f^{\prime}(x)<0$，当 $x>1$ 时 $f^{\prime}(x)>0$，
    所以 $f$ 先减后增，在 $x=1$ 处取极小值，B 错、C 对；且 $x\to+\infty$ 时 $f(x)\to+\infty$，D 对。
    另外由 $g^{\prime}(x)=\frac{e^x(x-1)}{x^2}$，当 $x>1$ 时 $g$ 递增，故
    $g(2)<g(3)$，即 $\frac{f(2)}{2}<\frac{f(3)}{3}$，A 对。答案 ACD。
  key_steps:
    - step_id: step_1
      statement: 作比值代换，消去“$xf^{\prime}(x)-f(x)$”结构。
      formula_trace:
        from: $xf^{\prime}(x)-f(x)=(x-1)e^x$
        to: $g(x)=\frac{f(x)}{x},\quad g^{\prime}(x)=\frac{(x-1)e^x}{x^2}$
        operation: 利用 $\left(\frac{f(x)}{x}\right)^{\prime}=\frac{xf^{\prime}(x)-f(x)}{x^2}$。
        why: 把原方程直接改写为一个可积分的一阶导数等式。
      source_ref: page_0140_ex11_solution_start
    - step_id: step_2
      statement: 识别右侧为已知导数并积分。
      formula_trace:
        from: $g^{\prime}(x)=\frac{(x-1)e^x}{x^2}$
        to: $g^{\prime}(x)=\left(\frac{e^x}{x}\right)^{\prime}\Rightarrow g(x)=\frac{e^x}{x}+c$
        operation: 逆向识别导数模板。
        why: 把隐式关系转成显式函数式。
      source_ref: page_0140_ex11_solution_start
    - step_id: step_3
      statement: 用初值确定常数并还原 $f(x)$。
      formula_trace:
        from: $f(1)=0\Rightarrow g(1)=0$
        to: $0=e+c,\ c=-e,\ g(x)=\frac{e^x}{x}-e,\ f(x)=e^x-ex$
        operation: 代入 $x=1$ 求常数，再乘回 $x$。
        why: 后续所有选项都依赖 $f$ 的显式表达。
      source_ref: page_0140_ex11_solution_start
    - step_id: step_4
      statement: 判断 A：比较比值函数在 2 与 3 处的大小。
      formula_trace:
        from: $g^{\prime}(x)=\frac{e^x(x-1)}{x^2}$
        to: $x>1\Rightarrow g^{\prime}(x)>0\Rightarrow g(2)<g(3)\Rightarrow \frac{f(2)}{2}<\frac{f(3)}{3}$
        operation: 在区间 $(1,+\infty)$ 用单调性比较函数值。
        why: A 选项本质是 $g(2)<g(3)$。
      source_ref: page_0141_ex11_solution_cont
    - step_id: step_5
      statement: 判断 B、C：用 $f^{\prime}(x)$ 的符号表。
      formula_trace:
        from: $f^{\prime}(x)=e^x-e$
        to: $0<x<1\Rightarrow f^{\prime}(x)<0;\ x>1\Rightarrow f^{\prime}(x)>0$
        operation: 比较 $e^x$ 与 $e$。
        why: $f$ 在 $(0,1)$ 递减，故 B 错；在 $x=1$ 处由负到正，故 C 对。
      source_ref: page_0141_ex11_solution_cont
    - step_id: step_6
      statement: 判断 D 并汇总答案。
      formula_trace:
        from: $f(x)=e^x-ex$
        to: $x\to+\infty,\ f(x)\to+\infty\Rightarrow f(x)\text{ 无最大值}$
        operation: 看指数项主导增长。
        why: D 为真，联合 A/C 得答案 ACD。
      source_ref: page_0141_ex11_solution_cont
teaching_card:
  student_title: 先除以 x，再把函数还原出来
  what_it_trains: 训练识别 $xf^{\prime}(x)-f(x)$ 的比值导数结构，并把抽象条件快速还原成显式函数进行多选判定。
  recognition_cues:
    - 题设出现 $xf^{\prime}(x)-f(x)$。
    - 给出一个点值条件 $f(1)=0$。
    - 选项同时考比值、单调、极值和最大值。
  normalization_moves:
    - 令 $g(x)=\frac{f(x)}{x}$。
    - 把右侧识别成 $\left(\frac{e^x}{x}\right)^{\prime}$。
    - 先求出 $f(x)$，再分流做 A 与 B/C/D。
  common_failures:
    - 把 $g(1)$ 错写成 $\frac{f(1)}{1}$ 以外的值，导致常数算错。
    - 只判断 $f^{\prime}(1)=0$ 就断言极小，忽略左右符号。
    - A 项误比 $f(2)$ 与 $f(3)$，忽略选项中的分母。
  similar_practice_query: 抽象函数 比值导数 x f^{\prime}-f 逆向构造 指数函数 单调极值
