solution:
  source_solution_summary: $g(x)=0$ 等价于 $f(x)=ax+1$，所以问题变成过定点 $(0,1)$ 的直线与分段函数图象有三个交点。由图可读： $a<0$ 时只有一个交点，$a=0$ 时有两个交点， $0<a<\frac12$ 时有三个交点；右侧指数支上，$a=e$ 时 $y=ex+1$ 与 $y=e^x+1$ 相切，此时只有两个交点，$a>e$ 时有三个交点，而 $\frac12<a<e$ 时只有一个交点。因此 $a\in(0,\frac12)\cup(e,+\infty)$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把零点个数改成交点个数。
      formula_trace:
        from: $g(x)=f(x)-ax-1=0$
        to: $f(x)=ax+1$
        operation: 移项。
        why: 过定点直线与分段函数图象的交点数可以直接从图象分类。
      source_ref: page_0182
    - step_id: step_2
      statement: 分析左侧 $x<0$ 的斜率阈值。
      formula_trace:
        from: $y=ax+1$ 与 $|x^2+2x|$
        to: $0<a<\frac12$ 给出左侧配合下的三个交点情形
        operation: 利用源图中 $a=0$、$a=\frac12$ 的分界线读交点个数。
        why: 左侧绝对值二次支决定第一个有效区间。
      source_ref: page_0182
    - step_id: step_3
      statement: 分析右侧指数支的切线阈值。
      formula_trace:
        from: $e^x+1$ 与 $ax+1$
        to: $a=e$ 为相切分界，$a>e$ 时有三个交点
        operation: 由 $y=e^x+1$ 在 $x=1$ 处切线斜率 $e$ 读出分界。
        why: 右侧指数支决定第二个有效区间。
      source_ref: page_0182
