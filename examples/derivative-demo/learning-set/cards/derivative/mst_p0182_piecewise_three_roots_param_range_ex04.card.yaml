stem: |-
  （2020 · 赤峰模拟 T12）设函数 $f(x)=\begin{cases}e^x+1,&x\ge0\\ |x^2+2x|,&x<0\end{cases}$，若函数 $g(x)=f(x)-ax-1$ 有三个零点，则 $a$ 的取值范围为（  ）
  A. $\left(0,\frac12\right)$
  B. $(e,+\infty)$
  C. $\left(0,\frac12\right)\cup(e,e^2)$
  D. $\left(0,\frac12\right)\cup(e,+\infty)$
answer: |-
  D

  $g(x)=0$ 等价于 $f(x)=ax+1$，所以问题变成过定点 $(0,1)$ 的直线与分段函数图象有三个交点。由图可读： $a<0$ 时只有一个交点，$a=0$ 时有两个交点， $0<a<\frac12$ 时有三个交点；右侧指数支上，$a=e$ 时 $y=ex+1$ 与 $y=e^x+1$ 相切，此时只有两个交点，$a>e$ 时有三个交点，而 $\frac12<a<e$ 时只有一个交点。因此 $a\in(0,\frac12)\cup(e,+\infty)$，选 D。
