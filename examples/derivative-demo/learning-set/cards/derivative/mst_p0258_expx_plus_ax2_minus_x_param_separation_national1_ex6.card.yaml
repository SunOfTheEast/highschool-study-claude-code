original_problem:
  stem: （2020 · 全国 I 卷）已知函数 $f(x)=e^x+ax^2-x$。
  parts: *a1
  choices: []
  answer: 第(1)问：减区间 $(-\infty,0)$，增区间 $(0,+\infty)$。第(2)问：$a\in[\frac{7-e^2}{4},+\infty)$。
  fidelity_notes:
