solution:
  source_solution_summary: 第(1)问当 $a=1$ 时，$f^\prime(x)=e^x+2x-1$， 设 $g=f^\prime$，则 $g^\prime(x)=e^x+2>0$，故 $f^\prime$ 递增；又 $f^\prime(0)=0$，所以 $f$ 在 $(-\infty,0)$ 递减、 在 $(0,+\infty)$ 递增。第(2)问令 $e^x-\frac12x^3+ax^2-x-1\ge0$。当 $x=0$ 时自动成立； 当 $x>0$ 时参变分离得 $a\ge h(x)=-\frac{e^x-\frac12x^3-x-1}{x^2}$。求导整理为 $h^\prime(x)=\frac{(2-x)(e^x-\frac12x^2-x-1)}{x^3}$。 对 $m(x)=e^x-\frac12x^2-x-1$，有 $m^{\prime\prime}(x)=e^x-1>0$，进而 $m(x)>0$。因此 $h$ 在 $(0,2)$ 递增、在 $(2,+\infty)$ 递减，最大值 $h(2)=\frac{7-e^2}{4}$，所以 $a\ge\frac{7-e^2}{4}$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：判断 $f^\prime$ 的单调性。
      formula_trace:
        from: $f^\prime(x)=e^x+2x-1$
        to: $g^\prime(x)=e^x+2>0$
        operation: 设 $g=f^\prime$ 并继续求导。
        why: $f^\prime$ 严格递增，只有一个零点。
      source_ref: page_0258_ex6_solution_start
    - step_id: step_2
      statement: 第(1)问：用 $f^\prime(0)=0$ 定单调区间。
      formula_trace:
        from: $f^\prime$ 递增，$f^\prime(0)=0$
        to: $(-\infty,0)$ 上递减，$(0,+\infty)$ 上递增
        operation: 按导数零点两侧判号。
        why: 完成单调性讨论。
      source_ref: page_0258_ex6_solution_start
    - step_id: step_3
      statement: 第(2)问：把不等式改成含参差函数。
      formula_trace:
        from: $e^x+ax^2-x\ge\frac12x^3+1$
        to: $e^x-\frac12x^3+ax^2-x-1\ge0$
        operation: 移项。
        why: 准备分离参数 $a$。
      source_ref: page_0258_ex6_solution_start
    - step_id: step_4
      statement: 第(2)问：对 $x>0$ 参变分离。
      formula_trace:
        from: $e^x-\frac12x^3+ax^2-x-1\ge0$
        to: $a\ge h(x)=-\frac{e^x-\frac12x^3-x-1}{x^2}$
        operation: 除以 $x^2>0$。
        why: 求 $a$ 的下界转为求 $h$ 的最大值。
      source_ref: page_0259_ex6_solution_continuation
    - step_id: step_5
      statement: 第(2)问：整理 $h^\prime$。
      formula_trace:
        from: $h(x)=-\frac{e^x-\frac12x^3-x-1}{x^2}$
        to: $h^\prime(x)=\frac{(2-x)(e^x-\frac12x^2-x-1)}{x^3}$
        operation: 求导并按 $(2-x)$ 因式整理。
        why: 导数符号被拆成 $2-x$ 和一个正函数。
      source_ref: page_0259_ex6_solution_continuation
    - step_id: step_6
      statement: 第(2)问：证明剩余因子为正。
      formula_trace:
        from: $m(x)=e^x-\frac12x^2-x-1$
        to: $x>0$ 时 $m(x)>0$
        operation: 用 $m^{\prime\prime}(x)=e^x-1>0$ 逐级推出 $m^\prime>0$、$m>0$。
        why: 这样 $h^\prime$ 的符号只由 $2-x$ 决定。
      source_ref: page_0259_ex6_solution_continuation
    - step_id: step_7
      statement: 第(2)问：取 $h$ 的最大值。
      formula_trace:
        from: $h$ 在 $(0,2)$ 递增、在 $(2,+\infty)$ 递减
        to: $h_{\max}=h(2)=\frac{7-e^2}{4}$
        operation: 代入峰值点 $x=2$。
        why: 要让 $a\ge h(x)$ 对所有 $x>0$ 成立，必须且只需 $a$ 不低于最大值。
      source_ref: page_0259_ex6_solution_continuation
teaching_card:
  student_title: 端点不够用时，分离参数找 $h(x)$ 的最高点
  what_it_trains: 训练端点效应失效后的标准补救：不要卡在 $x=0$，而是对 $x>0$ 分离参数，转成辅助函数最大值。
  recognition_cues:
    - 题目在 $x=0$ 自动取等，但 source 明确说端点效应失效。
    - 参数乘 $x^2$，且区间是 $x\ge0$，适合对 $x>0$ 除以 $x^2$。
    - 求导后能整理出 $(2-x)(e^x-\frac12x^2-x-1)$。
  normalization_moves:
    - 先单独处理 $x=0$，再处理 $x>0$。
    - 分离出 $a\ge h(x)$ 后，目标是找 $h_{\max}$。
    - 证明 $m(x)>0$ 后，马上锁定 $x=2$ 是峰值点。
  common_failures:
    - 只代 $x=0$，误以为端点已经决定参数。
    - 参变分离时忘记 $x>0$ 才能除以 $x^2$。
    - 把需要取 $h$ 的最大值误写成最小值。
  similar_practice_query: 端点效应失效 参变分离 e^x ax2 x^3 h最大值 x=2 导中切
