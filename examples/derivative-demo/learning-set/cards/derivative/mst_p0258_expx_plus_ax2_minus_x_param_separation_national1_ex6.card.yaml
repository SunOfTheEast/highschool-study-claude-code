stem: |-
  （2020 · 全国 I 卷）已知函数 $f(x)=e^x+ax^2-x$。
  1. 当 $a=1$ 时，讨论 $f(x)$ 的单调性。
  2. 当 $x\ge0$ 时，$f(x)\ge\frac12x^3+1$，求 $a$ 的取值范围。
answer: |-
  第(1)问：减区间 $(-\infty,0)$，增区间 $(0,+\infty)$。第(2)问：$a\in[\frac{7-e^2}{4},+\infty)$。

  第(1)问当 $a=1$ 时，$f^\prime(x)=e^x+2x-1$， 设 $g=f^\prime$，则 $g^\prime(x)=e^x+2>0$，故 $f^\prime$ 递增；又 $f^\prime(0)=0$，所以 $f$ 在 $(-\infty,0)$ 递减、 在 $(0,+\infty)$ 递增。第(2)问令 $e^x-\frac12x^3+ax^2-x-1\ge0$。当 $x=0$ 时自动成立； 当 $x>0$ 时参变分离得 $a\ge h(x)=-\frac{e^x-\frac12x^3-x-1}{x^2}$。求导整理为 $h^\prime(x)=\frac{(2-x)(e^x-\frac12x^2-x-1)}{x^3}$。 对 $m(x)=e^x-\frac12x^2-x-1$，有 $m^{\prime\prime}(x)=e^x-1>0$，进而 $m(x)>0$。因此 $h$ 在 $(0,2)$ 递增、在 $(2,+\infty)$ 递减，最大值 $h(2)=\frac{7-e^2}{4}$，所以 $a\ge\frac{7-e^2}{4}$。
