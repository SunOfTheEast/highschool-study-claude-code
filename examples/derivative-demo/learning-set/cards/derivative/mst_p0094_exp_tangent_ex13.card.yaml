solution:
  source_solution_summary: |
    设切点为 $(x_0,(x_0+a)e^{x_0})$，则 $f'(x)=(x+a+1)e^x$。切线过原点给出
    $-(x_0+a)e^{x_0}=(x_0+a+1)e^{x_0}(-x_0)$，化简为
    $x_0^2+ax_0-a=0$。要有两条不同切线，切点参数方程必须有两个不同实根，
    因而 $\Delta=a^2+4a=a(a+4)>0$，得到 $a<-4$ 或 $a>0$。
    图像法中，$a>0$ 时原点在区域 5；拐点切线为 $y=-e^{-a-2}(x+a+4)$，
    其横截距为 $-a-4$，要使原点在区域 7 需 $-a-4>0$，即 $a<-4$。
  key_steps:
    - step_id: step_1
      statement: 设切点并写出过原点切线条件。
      formula_trace:
        from: |
          $f(x)=(x+a)e^x,\quad f'(x)=(x+a+1)e^x,\quad T=(x_0,(x_0+a)e^{x_0})$
        to: |
          $0-(x_0+a)e^{x_0}=(x_0+a+1)e^{x_0}(0-x_0)$
        operation: 用切点处导数作为斜率，写切线点斜式并代入原点。
        why: 过原点的切线条数等价于切点横坐标 $x_0$ 的可取个数。
      source_ref: page_0094
    - step_id: step_2
      statement: 化简为切点参数二次方程。
      formula_trace:
        from: |
          $-(x_0+a)e^{x_0}=-(x_0+a+1)x_0e^{x_0}$
        to: |
          $x_0+a=x_0(x_0+a+1),\qquad x_0^2+ax_0-a=0$
        operation: 消去正因子 $e^{x_0}$，再展开移项。
        why: 二次方程的不同实根对应不同切点，从而对应不同切线。
      source_ref: page_0094
    - step_id: step_3
      statement: 用判别式保证有两条切线。
      formula_trace:
        from: |
          $x_0^2+ax_0-a=0\text{ 有两个不同实根}$
        to: |
          $\Delta=a^2+4a=a(a+4)>0,\qquad a\in(-\infty,-4)\cup(0,+\infty)$
        operation: 对二次方程使用 $\Delta>0$，解一元二次不等式。
        why: 题目要求“两条”切线，重根只对应一条切线。
      source_ref: page_0094
    - step_id: step_4
      statement: 用拐点切线区域复核两个参数段。
      formula_trace:
        from: |
          $f''(x)=(x+a+2)e^x,\quad x_{\text{拐}}=-a-2$
        to: |
          $y=-e^{-a-2}(x+a+4),\quad x\text{ 截距}=-a-4$
        operation: 求拐点与拐点处切线方程，读取其横截距。
        why: $a>0$ 时原点位于区域 5；$-a-4>0$ 即 $a<-4$ 时原点位于区域 7，均可作两条切线。
      source_ref: page_0094
teaching_card:
  student_title: 把过原点两切线化成切点方程判别式
  what_it_trains: 训练对含参指数曲线设切点，用切线过定点条件建立切点参数方程，再用判别式判断切线条数。
  recognition_cues:
    - 题干说“过坐标原点的切线”，切点未知，先设切点横坐标。
    - 函数是 $(x+a)e^x$，求导后仍带同一个指数因子，过点条件容易消去 $e^{x_0}$。
    - 要求两条切线，通常对应切点参数方程有两个不同实根。
  normalization_moves:
    - 设切点 $(x_0,(x_0+a)e^{x_0})$。
    - 把原点代入切线点斜式，得到 $x_0^2+ax_0-a=0$。
    - 用 $\Delta>0$ 解出 $a<-4$ 或 $a>0$。
  common_failures:
    - 把原点误认为曲线上的点，直接令 $a=0$。
    - 消去指数因子后符号出错，把方程写成 $x_0^2+ax_0+a=0$。
    - 把判别式等于 $0$ 的重切点也算成两条切线。
  similar_practice_query: $(x+a)e^x$ 过原点两条切线 切点参数 判别式
