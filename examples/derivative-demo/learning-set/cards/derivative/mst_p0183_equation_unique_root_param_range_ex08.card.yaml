stem: （河南省南阳市 2023 高三期中 T16）若方程 $x^2e^{-x}=ax-\ln x-1$ 存在唯一实根，则实数 $a$ 的取值范围是________。
answer: |-
  $(-\infty,0]\cup\left\{1+\frac1e\right\}$

  原方程可化为 $\frac{x}{e^x}=a-\frac{\ln(ex)}x$。令 $f(x)=\frac{x}{e^x}$，则 $f$ 在 $x=1$ 处取最大值 $\frac1e$；另一侧可看作与 $g(x)=-\frac{e\ln(ex)}{e^{\ln(ex)}}$ 同形的平移图像， $g$ 在 $x=1$ 处取最小值 $-1$。从源图和峰谷位置看，要让两图 只有一个交点，只能是平移到 $a\le0$ 的穿过方式，或临界相切 $a=1+\frac1e$。故答案为 $(-\infty,0]\cup\{1+\frac1e\}$。
