stem: |-
  （24高一上·河北唐山·阶段练习）设 $a=\\left(\\frac34\\right)^{\\frac12}$，$b=\\ln1.5$，$c=\\left(\\frac23\\right)^{\\frac34}$，则 $a,b,c$ 的大小顺序是（  ）
  A. $c<a<b$
  B. $c<b<a$
  C. $a<c<b$
  D. $b<c<a$
answer: |
  D

  先同幂化：
  \[
  a=\left(\frac34\right)^{\frac12}=\left(\frac{9}{16}\right)^{\frac14},\quad
  c=\left(\frac23\right)^{\frac34}=\left(\frac{8}{27}\right)^{\frac14}.
  \]
  由于
  \[
  \frac{9}{16}>\frac{8}{27}>\frac{1}{16}>0,
  \]
  且 $y=x^{1/4}$ 在 $(0,+\infty)$ 上单调递增，所以
  \[
  a>c>\left(\frac{1}{16}\right)^{\frac14}=\frac12.
  \]
  再比较 $b$：
  \[
  \frac32<e^{1/2}\Rightarrow \ln\frac32<\ln e^{1/2}=\frac12,
  \]
  即 $b<\frac12$。
  合并得
  \[
  b<c<a.
  \]
  故选 D。
