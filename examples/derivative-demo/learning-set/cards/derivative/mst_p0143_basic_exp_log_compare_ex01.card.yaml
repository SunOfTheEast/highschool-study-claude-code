solution:
  source_solution_summary: |
    先同幂化：
    \[
    a=\left(\frac34\right)^{\frac12}=\left(\frac{9}{16}\right)^{\frac14},\quad
    c=\left(\frac23\right)^{\frac34}=\left(\frac{8}{27}\right)^{\frac14}.
    \]
    由于
    \[
    \frac{9}{16}>\frac{8}{27}>\frac{1}{16}>0,
    \]
    且 $y=x^{1/4}$ 在 $(0,+\infty)$ 上单调递增，所以
    \[
    a>c>\left(\frac{1}{16}\right)^{\frac14}=\frac12.
    \]
    再比较 $b$：
    \[
    \frac32<e^{1/2}\Rightarrow \ln\frac32<\ln e^{1/2}=\frac12,
    \]
    即 $b<\frac12$。
    合并得
    \[
    b<c<a.
    \]
    故选 D。
  key_steps:
    - step_id: step_1
      statement: 把分数幂统一到同一个幂指数 $\\frac14$。
      formula_trace:
        from: $a=\\left(\\frac34\\right)^{1/2},\\ c=\\left(\\frac23\\right)^{3/4}$
        to: $a=\\left(\\frac{9}{16}\\right)^{1/4},\\ c=\\left(\\frac{8}{27}\\right)^{1/4}$
        operation: 平方再开四次根，立方再开四次根。
        why: 同幂后可直接比较被开方数。
      source_ref: page_0143_solution
    - step_id: step_2
      statement: 利用 $x^{1/4}$ 的单调性得到 $a$ 与 $c$ 及 $\\frac12$ 的顺序。
      formula_trace:
        from: $\\frac{9}{16}>\\frac{8}{27}>\\frac{1}{16}>0$
        to: $a>c>\\frac12$
        operation: 在 $(0,+\\infty)$ 上施加同一增函数 $x^{1/4}$。
        why: 先把 $a,c$ 压到同一参照线 $\\frac12$ 上。
      source_ref: page_0143_solution
    - step_id: step_3
      statement: 用指数比较转成对数上界。
      formula_trace:
        from: $\\frac32<e^{1/2}$
        to: $b=\\ln\\frac32<\\frac12$
        operation: 两侧取自然对数。
        why: $b$ 也放到 $\\frac12$ 参照线，便于三数合并。
      source_ref: page_0143_solution
    - step_id: step_4
      statement: 汇总三数顺序并对照选项。
      formula_trace:
        from: $a>c>\\frac12$ 与 $b<\\frac12$
        to: $b<c<a$
        operation: 传递比较。
        why: 唯一对应选项 D。
      source_ref: page_0143_solution
teaching_card:
  student_title: 先把幂统一，再把对数压到同一参照值
  what_it_trains: 训练“同幂化 + 参照值比较”的基本比大小套路，避免直接算近似值。
  recognition_cues:
    - 多个数分别是分数幂、对数，形态不同。
    - 底数都在 $(0,1)$，常见同底/同幂改写机会。
    - 题目是三数排序单选。
  normalization_moves:
    - 把 $a,c$ 改写成 $\\frac14$ 次幂。
    - 以 $\\frac12$ 作为中间参照。
    - 把 $b$ 通过 $\\frac32<e^{1/2}$ 转成 $b<\\frac12$。
  common_failures:
    - 忽略 $x^{1/4}$ 的定义域要求，随意比较负数情形。
    - 把 $\\ln1.5$ 误当成大于 $\\frac12$。
    - 只比较 $a,c$ 后忘记与 $b$ 统一。
  similar_practice_query: 指数对数比大小 同幂化 三数排序 参照值法
