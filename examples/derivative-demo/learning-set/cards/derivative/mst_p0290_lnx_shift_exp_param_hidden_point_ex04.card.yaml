stem: |-
  （2024 · 广东期末）已知函数 $f(x)=\ln x+1$，$g(x)=e^x-1$。若 $a>0$，$\forall x\in(-1,+\infty)$，$f(x+1)\le a^2g(x)+a^2-a+1$，求 $a$ 的取值范围。
  1. 求使不等式对任意 $x\in(-1,+\infty)$ 恒成立的 $a$ 的取值范围。
answer: |-
  $a\in[1,+\infty)$。

  题目等价于 $\ln(x+1)\le a^2e^x-a$ 对所有 $x>-1$ 恒成立。令 $h(x)=a^2e^x-\ln(x+1)-a$，则 $h^\prime(x)=a^2e^x-\frac1{x+1}$， $h^{\prime\prime}(x)=a^2e^x+\frac1{(x+1)^2}>0$，所以 $h^\prime$ 递增，若 $h^\prime(x_0)=0$，则 $h(x_0)$ 是最小值。用隐点探路 联立 $h(x_0)=0,h^\prime(x_0)=0$，可得到候选 $x_0=0$， 因此必要性为 $h(0)=a^2-a\ge0$，即 $a\ge1$。充分性分两段： 当 $x\ge-\ln2$，因 $a\ge1$ 可得 $h(x)\ge e^x-\ln(x+1)-1\ge x-\ln(x+1)\ge0$。当 $-1<x<-\ln2$，把 $h(x)=a^2e^x-\ln(x+1)-a$ 看成关于 $a$ 的二次函数，在 $a\ge1$ 上用顶点下界得到 $h(x)\ge-\ln(x+1)-\frac1{4e^x}=p(x)$；再由 $p^\prime(x)<0$ 和 $p(x)>p(\ln\frac12)>0$ 得 $h(x)\ge0$。所以答案是 $[1,+\infty)$。
