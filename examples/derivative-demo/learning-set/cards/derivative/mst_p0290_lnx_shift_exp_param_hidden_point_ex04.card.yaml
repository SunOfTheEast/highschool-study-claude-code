original_problem:
  stem: （2024 · 广东期末）已知函数 $f(x)=\ln x+1$，$g(x)=e^x-1$。若 $a>0$，$\forall x\in(-1,+\infty)$，$f(x+1)\le a^2g(x)+a^2-a+1$，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\in[1,+\infty)$。
  fidelity_notes:
    - 无选项。
    - page_0291 顶部“主元法与放缩的碰撞”是例4的点评，不属于例5。
solution:
  source_solution_summary: 题目等价于 $\ln(x+1)\le a^2e^x-a$ 对所有 $x>-1$ 恒成立。令 $h(x)=a^2e^x-\ln(x+1)-a$，则 $h^\prime(x)=a^2e^x-\frac1{x+1}$， $h^{\prime\prime}(x)=a^2e^x+\frac1{(x+1)^2}>0$，所以 $h^\prime$ 递增，若 $h^\prime(x_0)=0$，则 $h(x_0)$ 是最小值。用隐点探路 联立 $h(x_0)=0,h^\prime(x_0)=0$，可得到候选 $x_0=0$， 因此必要性为 $h(0)=a^2-a\ge0$，即 $a\ge1$。充分性分两段： 当 $x\ge-\ln2$，因 $a\ge1$ 可得 $h(x)\ge e^x-\ln(x+1)-1\ge x-\ln(x+1)\ge0$。当 $-1<x<-\ln2$，把 $h(x)=a^2e^x-\ln(x+1)-a$ 看成关于 $a$ 的二次函数，在 $a\ge1$ 上用顶点下界得到 $h(x)\ge-\ln(x+1)-\frac1{4e^x}=p(x)$；再由 $p^\prime(x)<0$ 和 $p(x)>p(\ln\frac12)>0$ 得 $h(x)\ge0$。所以答案是 $[1,+\infty)$。
  key_steps:
    - step_id: step_1
      statement: 先把题目化成一个恒非负函数。
      formula_trace:
        from: $f(x+1)\le a^2g(x)+a^2-a+1$
        to: $h(x)=a^2e^x-\ln(x+1)-a\ge0$
        operation: 代入 $f,g$ 并整理。
        why: 统一成 $h(x)$ 的最小值问题。
      source_ref: page_0290_ex04_solution_start
    - step_id: step_2
      statement: 用隐点探路锁定候选取等点。
      formula_trace:
        from: $h(x_0)=0,\quad h^\prime(x_0)=0$
        to: $x_0=0$
        operation: 联立取等与导数为零。
        why: source 先用草稿探路判断临界取等应发生在 $x=0$。
      source_ref: page_0290_ex04_solution_start
    - step_id: step_3
      statement: 由 $x=0$ 给出必要条件。
      formula_trace:
        from: $h(0)=a^2-a$
        to: $a\ge1$
        operation: 代入取等候选点。
        why: 由于 $a>0$，$h(0)\ge0$ 等价于 $a\ge1$。
      source_ref: page_0291_ex04_solution_end
    - step_id: step_4
      statement: 第一段充分性：$x\ge-\ln2$。
      formula_trace:
        from: $h(x)=a^2e^x-\ln(x+1)-a$
        to: $h(x)\ge e^x-\ln(x+1)-1\ge x-\ln(x+1)\ge0$
        operation: 利用 $a\ge1$ 和 $e^x\ge x+1$。
        why: 这一段指数下界足够直接压住对数项。
      source_ref: page_0291_ex04_solution_end
    - step_id: step_5
      statement: 第二段充分性：$-1<x<-\ln2$，换主元看 $a$。
      formula_trace:
        from: $h(x)=a^2e^x-\ln(x+1)-a$
        to: $h(x)\ge-\ln(x+1)-\frac1{4e^x}=p(x)$
        operation: 把 $h$ 当作关于 $a$ 的二次函数，取顶点下界。
        why: 这一段不能直接用第一段放缩，需要换主元处理参数。
      source_ref: page_0291_ex04_solution_end
    - step_id: step_6
      statement: 证明 $p(x)>0$ 完成充分性。
      formula_trace:
        from: $p(x)=-\ln(x+1)-\frac1{4e^x}$
        to: $p^\prime(x)<0,\quad p(x)>p(\ln\frac12)>0$
        operation: 求导判单调并比较端点。
        why: 补完 $a\ge1$ 对全区间的充分性。
      source_ref: page_0291_ex04_solution_end
teaching_card:
  student_title: 隐点探出 $a=1$ 后分段证明
  what_it_trains: 训练先用取等点和导数为零探出参数候选，再用分区间放缩证明这个候选真的充分。
  recognition_cues:
    - 题目是 $\ln(x+1)$ 与 $e^x$ 的恒成立比较。
    - 参数以 $a^2e^x-a$ 的形式出现，既有平方项也有一次项。
    - 隐点探路会把候选点推到 $x=0$。
    - 充分性证明分成 $x\ge-\ln2$ 和 $-1<x<-\ln2$ 两段。
  normalization_moves:
    - 先整理成 $h(x)=a^2e^x-\ln(x+1)-a\ge0$。
    - 用 $h(x_0)=0,h^\prime(x_0)=0$ 探候选点。
    - 从 $h(0)\ge0$ 得到 $a\ge1$。
    - 证明充分性时，不同区间换不同压法。
  common_failures:
    - 只得到 $a\ge1$，但没有证明充分性。
    - 在 $-1<x<-\ln2$ 仍然硬套第一段放缩。
    - 没有看出 $h$ 可以换主元当成关于 $a$ 的二次函数。
    - 把分段放缩当成随手估计，忽略它是为了补充分性的。
  similar_practice_query: ln(x+1) a^2 e^x - a 隐点探路 a=1 主元法 分区间放缩
