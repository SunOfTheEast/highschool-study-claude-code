stem: |-
  （2023 · 枣庄期末 · 多选 T12）已知函数 $f(x)=\frac{x^2}{e^x}+e^{x-4}-ax$ 有四个零点 $x_1,x_2,x_3,x_4$（$x_1<x_2<x_3<x_4$），则（  ）
  A. $x_1+x_2>2$
  B. $\frac{2}{e^2}<a<\frac1e+\frac1{e^3}$
  C. $\ln(x_1x_2x_3x_4)-(x_1+x_2+x_3+x_4)=-8$
  D. 若 $x_2=2-\sqrt3$，则 $x_4=2+\sqrt3$
answer: |-
  BCD

  由四零点条件： $\frac{x^2}{e^x}+e^{x-4}-ax=0$，且 $x\neq0$，可化为 $\frac{x}{e^x}+\frac{e^x}{e^4x}-a=0$。令 $t=\frac{x}{e^x}$，得到 $t+\frac1{e^4t}-a=0$，即 $e^4t^2-e^4at+1=0$。因原式有四个不同零点，故此二次式有两正根 $0<t_1<t_2<\frac1e$，并且 $t_1=\frac{x_1}{e^{x_1}}=\frac{x_4}{e^{x_4}}$， $t_2=\frac{x_2}{e^{x_2}}=\frac{x_3}{e^{x_3}}$。 由 $t(x)=\frac{x}{e^x}$ 图像知 $0<x_1<x_2<1$，故 $x_1+x_2<2$，A 错。 对 B：结合 $\Delta>0$、$0<\frac a2<\frac1e$ 与 $e^4(\frac1e)^2-e^4a\cdot\frac1e+1>0$，得 $\frac2{e^2}<a<\frac1e+\frac1{e^3}$，B 对。 对 C：由 $\prod_{i=1}^4\frac{x_i}{e^{x_i}}=(t_1t_2)^2=\frac1{e^8}$， 取对数得 $\ln(x_1x_2x_3x_4)-(x_1+x_2+x_3+x_4)=-8$，C 对。 对 D：由 $t_1t_2=\frac{x_2x_4}{e^{x_2+x_4}}=\frac1{e^4}$ 得 $\ln x_2+\ln x_4=x_2+x_4-4$。代 $x_2=2-\sqrt3$ 化为 $\ln x_4-x_4=\ln(2+\sqrt3)-(2+\sqrt3)$。 令 $m(x)=\ln x-x$（$x>1$），其在 $(1,+\infty)$ 单调递减，且 $x_4>1$，故 $x_4=2+\sqrt3$，D 对。综上选 BCD。
