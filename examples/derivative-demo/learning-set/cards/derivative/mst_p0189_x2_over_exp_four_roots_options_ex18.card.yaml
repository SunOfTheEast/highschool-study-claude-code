solution:
  source_solution_summary: 由四零点条件： $\frac{x^2}{e^x}+e^{x-4}-ax=0$，且 $x\neq0$，可化为 $\frac{x}{e^x}+\frac{e^x}{e^4x}-a=0$。令 $t=\frac{x}{e^x}$，得到 $t+\frac1{e^4t}-a=0$，即 $e^4t^2-e^4at+1=0$。因原式有四个不同零点，故此二次式有两正根 $0<t_1<t_2<\frac1e$，并且 $t_1=\frac{x_1}{e^{x_1}}=\frac{x_4}{e^{x_4}}$， $t_2=\frac{x_2}{e^{x_2}}=\frac{x_3}{e^{x_3}}$。 由 $t(x)=\frac{x}{e^x}$ 图像知 $0<x_1<x_2<1$，故 $x_1+x_2<2$，A 错。 对 B：结合 $\Delta>0$、$0<\frac a2<\frac1e$ 与 $e^4(\frac1e)^2-e^4a\cdot\frac1e+1>0$，得 $\frac2{e^2}<a<\frac1e+\frac1{e^3}$，B 对。 对 C：由 $\prod_{i=1}^4\frac{x_i}{e^{x_i}}=(t_1t_2)^2=\frac1{e^8}$， 取对数得 $\ln(x_1x_2x_3x_4)-(x_1+x_2+x_3+x_4)=-8$，C 对。 对 D：由 $t_1t_2=\frac{x_2x_4}{e^{x_2+x_4}}=\frac1{e^4}$ 得 $\ln x_2+\ln x_4=x_2+x_4-4$。代 $x_2=2-\sqrt3$ 化为 $\ln x_4-x_4=\ln(2+\sqrt3)-(2+\sqrt3)$。 令 $m(x)=\ln x-x$（$x>1$），其在 $(1,+\infty)$ 单调递减，且 $x_4>1$，故 $x_4=2+\sqrt3$，D 对。综上选 BCD。
  key_steps:
    - step_id: step_1
      statement: 把原零点方程同构到 $t=\frac{x}{e^x}$ 二次式。
      formula_trace:
        from: $\frac{x^2}{e^x}+e^{x-4}-ax=0$
        to: $e^4t^2-e^4at+1=0,\quad t=\frac{x}{e^x}$
        operation: 在 $x\neq0$ 上先除以 $x$ 再换元。
        why: 把四根问题转成“二次根 + 单峰函数反解”结构。
      source_ref: page_0190_ex18_continuation
    - step_id: step_2
      statement: 由图像与四根条件确定 $t_1,t_2$ 的区间和配对。
      formula_trace:
        from: $0<t_1<t_2<\frac1e,\ t_1t_2=\frac1{e^4}$
        to: $t_1=\frac{x_1}{e^{x_1}}=\frac{x_4}{e^{x_4}},\ t_2=\frac{x_2}{e^{x_2}}=\frac{x_3}{e^{x_3}}$
        operation: 利用 $t(x)=\frac{x}{e^x}$ 在 $(0,1)$ 增、$(1,+\infty)$ 减的交点分布。
        why: 后续每个选项都依赖这组配对关系。
      source_ref: page_0190_ex18_continuation
    - step_id: step_3
      statement: 用根位置快速判 A。
      formula_trace:
        from: $0<x_1<x_2<1$
        to: $x_1+x_2<2$
        operation: 区间上界直接比较。
        why: 否定 A 项。
      source_ref: page_0190_ex18_continuation
    - step_id: step_4
      statement: 由二次根落在 $(0,\frac1e)$ 推出参数范围 B。
      formula_trace:
        from: $e^4t^2-e^4at+1=0$ 两根满足 $0<t_1<t_2<\frac1e$
        to: $\frac2{e^2}<a<\frac1e+\frac1{e^3}$
        operation: 联立判别式、根均值位置和端点函数值条件。
        why: 完整刻画两根落区间的充要范围。
      source_ref: page_0190_ex18_continuation
    - step_id: step_5
      statement: 乘积取对数得到 C。
      formula_trace:
        from: $\prod_{i=1}^4\frac{x_i}{e^{x_i}}=(t_1t_2)^2=\frac1{e^8}$
        to: $\ln(x_1x_2x_3x_4)-(x_1+x_2+x_3+x_4)=-8$
        operation: 两边取自然对数并整理。
        why: 把“积等式”转成选项 C 的线性和式。
      source_ref: page_0190_ex18_continuation
    - step_id: step_6
      statement: 利用 $m(x)=\ln x-x$ 的单调性验证 D。
      formula_trace:
        from: $\ln x_2+\ln x_4=x_2+x_4-4,\ x_2=2-\sqrt3$
        to: $\ln x_4-x_4=\ln(2+\sqrt3)-(2+\sqrt3)\Rightarrow x_4=2+\sqrt3$
        operation: 构造 $m(x)=\ln x-x$，在 $(1,+\infty)$ 上严格递减。
        why: 同值反推唯一点，得到 D 正确。
      source_ref: page_0190_ex18_continuation
teaching_card:
  student_title: 四根先降维成二根，再逐项判真
  what_it_trains: 训练“先换元降维，再用图像配对 + 区间根条件 + 对数线性化”完成多选判定。
  recognition_cues:
    - 原式同时有 $\frac{x^2}{e^x}$ 与 $e^{x}/x$ 互逆结构。
    - 题目给“四个零点”，常见要先压成两个参数根。
    - 选项里既有参数范围也有根间代数关系。
  normalization_moves:
    - 先化成 $t+\frac1{e^4t}-a=0$。
    - 再用 $t=\frac{x}{e^x}$ 单峰图做根配对。
    - 乘积型先取对数，根式型构造 $m(x)=\ln x-x$。
  common_failures:
    - 忘记排除 $x=0$ 就直接除以 $x$。
    - 把 $t_1,t_2$ 与 $(x_1,x_4)$、$(x_2,x_3)$ 的配对写反。
    - B 项只写判别式，漏写两根都落在 $(0,\frac1e)$ 的附加条件。
    - D 项算到同值方程后没有用单调性保证唯一。
  similar_practice_query: x^2/e^x + e^{x-k} - ax 四零点 换元 t=x/e^x 多选 BCD
