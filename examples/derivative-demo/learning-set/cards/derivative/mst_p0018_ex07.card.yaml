solution:
  source_solution_summary: 将 $f(x)=\frac{a+\ln x}{x}$ 写成 $e^a\frac{\ln(e^a x)}{e^a x}$。由于 $y=\frac{\ln u}{u}$ 在 $(0,e)$ 上单调递增，在 $(e,+\infty)$ 上单调递减， 所以 $e^a x\in(0,e)$ 时原函数单调递增，即 $x\in(0,e^{1-a})$，选 B。
  key_steps:
    - step_id: step_1
      statement: 把参数 a 藏进对数的输入，化到标准模型。
      formula_trace:
        from: $f(x)=\frac{a+\ln x}{x}$
        to: $f(x)=e^a\cdot\frac{\ln(e^a x)}{e^a x}$
        operation: 用 $a+\ln x=\ln(e^a x)$，再把分母 $x$ 改写为 $(e^a x)/e^a$。
        why: 这样可以直接套用 $y=\ln u/u$ 的单调区间。
      source_ref: page_0019_solution
    - step_id: step_2
      statement: 读取同构模型的递增输入范围。
      formula_trace:
        from: $y=\frac{\ln u}{u}$ 在 $(0,e)$ 递增
        to: $e^a x\in(0,e)$ 时 $f(x)$ 递增
        operation: 令 $u=e^a x$，外侧正倍数 $e^a$ 不改变单调性。
        why: 源页使用的是同一基础函数的横向输入替换。
      source_ref: page_0019_solution
    - step_id: step_3
      statement: 把输入范围解回 x 的区间并对应选项。
      formula_trace:
        from: $0<e^a x<e$
        to: $0<x<e^{1-a}$
        operation: 两边除以正数 $e^a$。
        why: 函数定义域要求 $x>0$，所以得到开区间 $(0,e^{1-a})$。
      source_ref: page_0019_solution
teaching_card:
  student_title: 把 $a+\ln x$ 塞进 $\ln(e^a x)$ 来找增区间
  what_it_trains: 训练把含参数的对数分式配成 $\ln u/u$，再从标准函数的单调区间读出 x 的范围。
  recognition_cues:
    - 题干出现 $\frac{a+\ln x}{x}$，常数 a 与 $\ln x$ 可以合并到一个对数里。
    - 选项都是指数端点，提示要把 $e^a x$ 与 e 比较。
    - 只问单调增区间，不需要重新全程求导。
  normalization_moves:
    - 先写 $a+\ln x=\ln(e^a x)$。
    - 再把分母 x 同步换成 $e^a x$，补出外面的正倍数 $e^a$。
    - 最后把 $e^a x\in(0,e)$ 解回 x。
  common_failures:
    - 把递增区间误写成 $x\in(0,e^a)$，没有把输入 $e^a x$ 解回 x。
    - 忽略定义域 $x>0$，误选含负半轴的 A。
    - 只记得 $\ln x/x$ 有最大值，却忘记递增段是 $(0,e)$。
  similar_practice_query: ln x over x 同构 a+ln x 单调增区间 e^a x
