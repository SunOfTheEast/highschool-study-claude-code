stem: |-
  函数 $f(x)=\frac{a+\ln x}{x}$ 的单调增区间为 ( )
  A. $(-\infty, \mathrm{e}^{1-a})$
  B. $(0, \mathrm{e}^{1-a})$
  C. $(0, \mathrm{e}^a)$
  D. $(\mathrm{e}^a,+\infty)$
answer: |-
  B. $(0, \mathrm{e}^{1-a})$

  将 $f(x)=\frac{a+\ln x}{x}$ 写成 $e^a\frac{\ln(e^a x)}{e^a x}$。由于 $y=\frac{\ln u}{u}$ 在 $(0,e)$ 上单调递增，在 $(e,+\infty)$ 上单调递减， 所以 $e^a x\in(0,e)$ 时原函数单调递增，即 $x\in(0,e^{1-a})$，选 B。
