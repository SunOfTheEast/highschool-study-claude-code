stem: |-
  （2024 · 全国百校强 T8）已知函数 $f(x)=\frac{ax}{e^{x-1}}+x-\ln(ax)-2\ (a>0)$，若函数 $f(x)$ 在区间 $(0,+\infty)$ 内存在零点，则实数 $a$ 的取值范围是 ( )
  A. $(0, 1]$
  B. $[1, +\infty)$
  C. $(0, e]$
  D. $[3, +\infty)$
answer: |
  B

  设 $t=\\ln(ax)-x+1$，则 $\\frac{ax}{e^{x-1}}=e^t$，且
  $f(x)=e^t-[\\ln(ax)-x+1]-1=e^t-t-1$。由于 $e^t-t-1\\ge0$，且只有 $t=0$ 时等号成立，所以 $f(x)$ 存在零点等价于方程 $\\ln(ax)-x+1=0$ 在 $x>0$ 上有解。该方程化为 $a=e^{x-1}/x=(1/e)(e^x/x)$。因为 $e^x/x$ 在 $x>0$ 上最小值为 $e$，故 $a\\ge1$，且每个 $a\\ge1$ 都可由相应的交点取到。故选 B。
