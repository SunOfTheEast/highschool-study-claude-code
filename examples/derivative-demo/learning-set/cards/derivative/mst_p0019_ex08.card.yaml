stem: |-
  (2024 春·封开县校级期中) 函数 $f(x)=ax^2-x\ln x$ 在 $\left[\frac{1}{\mathrm{e}},+\infty\right)$ 上单调递增，则实数 $a$ 的取值范围是 ( )
  A. $\left[\frac{1}{2},+\infty\right)$
  B. $\left(\frac{1}{2},+\infty\right)$
  C. $[1,+\infty)$
  D. $(1,+\infty)$
answer: |-
  A. $\left[\frac{1}{2},+\infty\right)$

  由单调递增要求 $f'(x)=2ax-1-\ln x\ge 0$ 对所有 $x\in[1/e,+\infty)$ 成立。因 $x>0$，分离参数得 $2a\ge\frac{1+\ln x}{x}=e\frac{\ln(ex)}{ex}$。令 $u=ex$，则 $u\in[1,+\infty)$，$\ln u/u$ 的最大值为 $1/e$，所以右端最大值为 1， 得 $a\ge 1/2$，选 A。
