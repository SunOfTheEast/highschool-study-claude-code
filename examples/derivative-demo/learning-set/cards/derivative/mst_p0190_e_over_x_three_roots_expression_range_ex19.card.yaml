solution:
  source_solution_summary: 源解把 $\frac{e^{x-1}}x$ 记成一个新变量，并等价转成关于 $t=\frac{e^x}{x}$ 的二次方程。设二次方程两根为 $t_1,t_2$，结合 $g(x)=\frac{e^x}{x}$ 图像，三零点对应 $\frac{e^{x_1}}{x_1}=t_1<0$， $\frac{e^{x_2}}{x_2}=\frac{e^{x_3}}{x_3}=t_2>e$。 因此目标式 $\frac{2e^{x_1}}{x_1}+\frac{e^{x_2}}{x_2}+\frac{e^{x_3}}{x_3} =2(t_1+t_2)$。由源解二次函数性质可得 $a<-\frac32$， 从而 $2(t_1+t_2)>e$，故取值范围为 $(e,+\infty)$，选 A。
  key_steps:
    - step_id: step_1
      statement: 把复合分式压成一个变量的二次方程。
      formula_trace:
        from: $\frac{e^{x-1}}x+\frac{x}{e^{x-1}+x}+a=0$
        to: $h(t)=\frac{t^2}{e^2}+(a+1)\frac{t}{e}+a+1=0$
        operation: 令 $t=\frac{e^x}{x}$，把第二个分式写成关于 $t$ 的有理式后通分。
        why: 三零点来自 $t$ 方程的两个水平值与 $g(x)=\frac{e^x}{x}$ 图像相交。
      source_ref: page_0190
    - step_id: step_2
      statement: 用 $g(x)=\frac{e^x}{x}$ 图像分配三根。
      formula_trace:
        from: $g(x)=\frac{e^x}{x}$
        to: $\frac{e^{x_1}}{x_1}=t_1<0,\quad \frac{e^{x_2}}{x_2}=\frac{e^{x_3}}{x_3}=t_2>e$
        operation: 读图：负支给一根，正支 $y>e$ 给两根。
        why: 这是三零点结构的来源。
      source_ref: page_0191
    - step_id: step_3
      statement: 把目标表达式转成二次根和。
      formula_trace:
        from: $\frac{2e^{x_1}}{x_1}+\frac{e^{x_2}}{x_2}+\frac{e^{x_3}}{x_3}$
        to: $2(t_1+t_2)>e$
        operation: 代入三个零点对应的两个 $t$ 值，并用源解给出的根和范围。
        why: 目标式不需要求具体 $x_i$，只需二次方程根和。
      source_ref: page_0191
teaching_card:
  student_title: 把三个零点压到两个 $t$ 值
  what_it_trains: 训练在含 $\frac{e^x}{x}$ 的零点题中，用换元和图像把多个 $x$ 根压缩为二次方程的两个根。
  recognition_cues:
    - 题目同时出现 $\frac{e^{x-1}}x$ 和 $\frac{x}{e^{x-1}+x}$。
    - 最后的目标式含 $\frac{e^{x_i}}{x_i}$。
    - 源图是 $g(x)=\frac{e^x}{x}$ 的负支和正支。
  normalization_moves:
    - 令 $t=\frac{e^x}{x}$。
    - 把方程通分成 $h(t)=0$。
    - 读出 $t_1<0$ 对应一个根，$t_2>e$ 对应两个根。
    - 把目标式写成 $2(t_1+t_2)$。
  common_failures:
    - 直接求三个 $x_i$，计算不可控。
    - 把 $e^{x-1}/x$ 和 $e^x/x$ 差一个 $e$ 的比例关系漏掉。
    - 没有用图像判断 $t_2>e$。
  similar_practice_query: e^x/x 三个零点 t换元 根和 表达式范围
