stem: |-
  （2023·射洪市模拟）设函数 $f(x)$，$g(x)$ 在 $\mathbf{R}$ 的导函数存在，且 $f^{\prime}(x)<g^{\prime}(x)$，则当 $x\in(a,b)$ 时（  ）
  A. $f(x)<g(x)$
  B. $f(x)>g(x)$
  C. $f(x)+g(a)<g(x)+f(a)$
  D. $f(x)+g(b)<g(x)+f(b)$
answer: |
  C

  设 $h(x)=f(x)-g(x)$，则
  \[
  h^{\prime}(x)=f^{\prime}(x)-g^{\prime}(x)<0,
  \]
  所以 $h(x)$ 在 $\mathbf{R}$ 上单调递减。又 $a<x<b$，故
  \[
  h(a)>h(x)>h(b).
  \]
  即
  \[
  f(a)-g(a)>f(x)-g(x)>f(b)-g(b).
  \]
  变形得
  \[
  f(x)+g(a)<g(x)+f(a),
  \]
  以及
  \[
  f(x)+g(b)>g(x)+f(b).
  \]
  因而 C 正确、D 错误；A 与 B 仅比较 $f(x)$ 与 $g(x)$ 本身，题设无法确定其恒定大小关系，故不能判断。答案为 C。
