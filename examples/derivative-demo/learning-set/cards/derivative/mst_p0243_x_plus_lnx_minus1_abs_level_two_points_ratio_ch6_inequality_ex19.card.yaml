stem: |-
  （陪跑课学生答疑）已知函数 $f(x)=x+\ln x-1$。
  1. 若 $f(x)\leqslant kx-k$ 对于 $\forall x>0$ 恒成立，求 $k$ 的值。
  2. 若存在 $x_1<x_2$，使得 $|f(x_1)|=|f(x_2)|=a$ 成立，求证：$x_2>e^{a/2}x_1$。
answer: |-
  第 (1) 问：$k=2$；第 (2) 问：$x_2>e^{a/2}x_1$。

  第 (1) 问，$f$ 是凹函数，且 $f(1)=0$、$f'(1)=2$，所以图像在 $x=1$ 处的切线 $y=2x-2$ 上方不超过切线，故恒成立时 $k=2$。 第 (2) 问由题意可知 $f(x_1)=-a$，$f(x_2)=a$，且 $x_1<1<x_2$。两式相减得 $(x_2-x_1)+\ln(x_2/x_1)=2a$。要证 $x_2>e^{a/2}x_1$，等价于 $\ln(x_2/x_1)>a/2$，只需证明 $x_2-x_1<3a/2$。当 $0<a<2$ 时，先由 $f(a+1)>a$ 得 $x_2<a+1$，再证 $x_1>1-a/2$；当 $a\ge2$ 时，由 $f(3a/2)>a$ 得 $x_2<3a/2$，又 $x_1>0$，所以同样成立。
