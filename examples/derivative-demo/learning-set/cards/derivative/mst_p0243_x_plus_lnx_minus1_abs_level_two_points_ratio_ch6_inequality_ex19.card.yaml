original_problem:
  stem: （陪跑课学生答疑）已知函数 $f(x)=x+\ln x-1$。
  parts: *a1
  choices: []
  answer: 第 (1) 问：$k=2$；第 (2) 问：$x_2>e^{a/2}x_1$。
  fidelity_notes:
    - 两问均无选项。
    - 函数定义域为 $x>0$。
solution:
  source_solution_summary: 第 (1) 问，$f$ 是凹函数，且 $f(1)=0$、$f'(1)=2$，所以图像在 $x=1$ 处的切线 $y=2x-2$ 上方不超过切线，故恒成立时 $k=2$。 第 (2) 问由题意可知 $f(x_1)=-a$，$f(x_2)=a$，且 $x_1<1<x_2$。两式相减得 $(x_2-x_1)+\ln(x_2/x_1)=2a$。要证 $x_2>e^{a/2}x_1$，等价于 $\ln(x_2/x_1)>a/2$，只需证明 $x_2-x_1<3a/2$。当 $0<a<2$ 时，先由 $f(a+1)>a$ 得 $x_2<a+1$，再证 $x_1>1-a/2$；当 $a\ge2$ 时，由 $f(3a/2)>a$ 得 $x_2<3a/2$，又 $x_1>0$，所以同样成立。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问补出 $k=2$。
      formula_trace:
        from: $f(x)=x+\ln x-1$
        to: $f(1)=0,\ f^\prime(1)=2$
        operation: 求切点和切线斜率。
        why: 恒成立线 $kx-k$ 过 $(1,0)$，必须贴住切线斜率。
      source_ref: page_0243_ex19_solution
    - step_id: step_2
      statement: 把两点条件写成一正一负。
      formula_trace:
        from: $|f(x_1)|=|f(x_2)|=a,\ x_1<x_2$
        to: $f(x_1)=-a,\ f(x_2)=a,\ x_1<1<x_2$
        operation: 利用 $f$ 单调递增且 $f(1)=0$。
        why: 这样才能把距离和对数比联系起来。
      source_ref: page_0243_ex19_solution
    - step_id: step_3
      statement: 把目标转成控制 $x_2-x_1$。
      formula_trace:
        from: $f(x_2)-f(x_1)=2a$
        to: $\ln(x_2/x_1)=2a-(x_2-x_1)$
        operation: 两式相减。
        why: 若 $x_2-x_1<3a/2$，则 $\ln(x_2/x_1)>a/2$。
      source_ref: page_0243_ex19_solution
    - step_id: step_4
      statement: $0<a<2$ 时先压住右点。
      formula_trace:
        from: $f(a+1)=a+\ln(a+1)>a$
        to: $x_2<a+1$
        operation: 用 $f$ 单调递增。
        why: 右点小于 $a+1$ 后，只需给左点下界。
      source_ref: page_0243_ex19_solution
    - step_id: step_5
      statement: $0<a<2$ 时给左点下界。
      formula_trace:
        from: $f(1-\frac a2)= -\frac a2+\ln(1-\frac a2)$
        to: $f(1-\frac a2)<-a$
        operation: 用 $\ln(1-\frac a2)<-\frac a2$。
        why: 因为 $f$ 递增，所以 $x_1>1-a/2$。
      source_ref: page_0243_ex19_solution
    - step_id: step_6
      statement: $a\ge2$ 时直接压住右点。
      formula_trace:
        from: $f(\frac{3a}{2})=\frac{3a}{2}+\ln\frac{3a}{2}-1$
        to: $f(\frac{3a}{2})>a$
        operation: 用 $a\ge2$ 的粗估计。
        why: 得到 $x_2<3a/2$，且 $x_1>0$，距离自然小于 $3a/2$。
      source_ref: page_0243_ex19_solution
    - step_id: step_7
      statement: 回到原目标。
      formula_trace:
        from: $x_2-x_1<3a/2$
        to: $\ln(x_2/x_1)>a/2$，即 $x_2>e^{a/2}x_1$
        operation: 代回两式相减结果。
        why: 完成比例形式的不等式证明。
      source_ref: page_0243_ex19_solution
teaching_card:
  student_title: 等高两点比例题：先把比例变成对数差，再控距离
  what_it_trains: 训练把指数比例目标转成对数差，再通过两点方程相减寻找中间目标。
  recognition_cues:
    - $f(x)=x+\ln x-1$ 单调递增且 $f(1)=0$。
    - $|f(x_1)|=|f(x_2)|=a$ 会变成 $f(x_1)=-a,f(x_2)=a$。
    - 目标 $x_2>e^{a/2}x_1$ 应先取对数。
  normalization_moves:
    - 第 (1) 问用切线得到 $k=2$。
    - 第 (2) 问写出两点方程。
    - 两式相减得到 $\ln(x_2/x_1)=2a-(x_2-x_1)$。
    - 转证 $x_2-x_1<3a/2$。
    - 按 $0<a<2$ 和 $a\ge2$ 分段取点。
  common_failures:
    - 不取对数，直接处理 $e^{a/2}x_1$。
    - 忘记 $x_1<1<x_2$。
    - 不知道为什么要证明 $x_2-x_1<3a/2$。
  similar_practice_query: x+lnx-1 等高两点 绝对值 a x2>e^(a/2)x1 距离 3a/2
quality:
  confidence: high
