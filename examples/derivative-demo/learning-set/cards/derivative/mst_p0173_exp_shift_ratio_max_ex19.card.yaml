stem: |-
  （2022 · 镇海月考 T8）不等式 $e^x-4x+2\geqslant ax+b\ (a,b\in\mathbf{R},a\neq-4)$ 对任意实数 $x$ 恒成立，则 $\frac{b-4}{a+4}$ 的最大值为（  ）
  A. $-\ln 2$
  B. $-1-\ln 2$
  C. $-2\ln 2$
  D. $2-2\ln 2$
answer: |
  A

  原不等式等价于
  \[
  e^x-2\ge (a+4)x+b-4.
  \]
  设右侧直线零点
  \[
  x_1=-\frac{b-4}{a+4},
  \]
  左侧函数零点
  \[
  x_2=\ln2.
  \]
  按源解零点比大小模型有
  \[
  x_1\ge x_2
  \Rightarrow
  -\frac{b-4}{a+4}\ge\ln2
  \Rightarrow
  \frac{b-4}{a+4}\le-\ln2.
  \]
  因此该比值最大为 $-\ln2$，选 A。
