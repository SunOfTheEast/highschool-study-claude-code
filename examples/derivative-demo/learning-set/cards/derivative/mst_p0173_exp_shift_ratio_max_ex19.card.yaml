solution:
  source_solution_summary: |
    原不等式等价于
    \[
    e^x-2\ge (a+4)x+b-4.
    \]
    设右侧直线零点
    \[
    x_1=-\frac{b-4}{a+4},
    \]
    左侧函数零点
    \[
    x_2=\ln2.
    \]
    按源解零点比大小模型有
    \[
    x_1\ge x_2
    \Rightarrow
    -\frac{b-4}{a+4}\ge\ln2
    \Rightarrow
    \frac{b-4}{a+4}\le-\ln2.
    \]
    因此该比值最大为 $-\ln2$，选 A。
  key_steps:
    - step_id: step_1
      statement: 先把题目改写成标准比较式。
      formula_trace:
        from: $e^x-4x+2\ge ax+b$
        to: $e^x-2\ge (a+4)x+b-4$
        operation: 移项合并一次项与常数项。
        why: 便于直接读出“指数函数 vs 直线”的零点。
      source_ref: page_0173_ex19_solution
    - step_id: step_2
      statement: 写出右侧直线零点。
      formula_trace:
        from: $(a+4)x+b-4=0$
        to: $x_1=-\frac{b-4}{a+4}$
        operation: 一次方程求根。
        why: 目标分式正好嵌在零点表达式中。
      source_ref: page_0173_ex19_solution
    - step_id: step_3
      statement: 写出左侧函数零点。
      formula_trace:
        from: $e^x-2=0$
        to: $x_2=\ln2$
        operation: 指数方程取对数。
        why: 提供固定比较基准。
      source_ref: page_0173_ex19_solution
    - step_id: step_4
      statement: 零点比较转为分式上界。
      formula_trace:
        from: $x_1\ge x_2$
        to: $\frac{b-4}{a+4}\le-\ln2$
        operation: 代入 $x_1,x_2$ 并整理。
        why: 直接得到该分式的最大值。
      source_ref: page_0173_ex19_solution
teaching_card:
  student_title: 把分式藏进零点坐标
  what_it_trains: 训练在“指数函数压线性函数”的恒成立题中，把目标分式重写进直线零点，然后用固定指数零点给出最值界。
  recognition_cues:
    - 题干目标是 $\frac{b-4}{a+4}$ 的最大值。
    - 不等式含 $e^x$ 与线性项，适合零点探路。
    - 通过移项可出现 $e^x-2$ 的固定零点。
  normalization_moves:
    - 先移项得到 $e^x-2\ge (a+4)x+b-4$。
    - 求两边零点并比较位置。
    - 把零点不等式回译成目标分式上界。
  common_failures:
    - 把 $(a+4)x+b-4=0$ 解根时符号写反。
    - 把 $\ln2$ 误记为 $2$。
    - 最后把“最大值”错读成“最小值”。
  similar_practice_query: e^x-4x+2≥ax+b (b-4)/(a+4) 最大值 零点比大小
