stem: |-
  （2024 重庆巴蜀中学高二期中 T19）若函数 $f(x)$ 的导函数 $f^{\prime}(x)$ 在点 $x_0$ 可导，则称 $f^{\prime}(x)$ 在点 $x_0$ 的导数值为 $f(x)$ 在点 $x_0$ 的二阶导数，记作 $f^{\prime\prime}(x)$。若 $f(x)$ 在开区间 $I$ 内的每一点都二阶可导，则得到一个定义在 $I$ 上的二阶导函数，记作 $f^{\prime\prime}(x)$。曲线 $y=x^2$ 上任意两点间的弧段总在这两点的下方；而曲线 $y=\sqrt{x}$ 则相反，任意两点间的弧段总在这两点连线的上方。我们把具有前一种特性的曲线称为凸的，相应的函数称为凸函数；后一种曲线称为凹的，相应的函数称为凹函数。连续曲线上凹弧与凸弧的分界点称为曲线的拐点。拐点在统计学，物理学，经济学领域都有重要的应用。若函数 $f(x)$ 在定义域内是一条连续不断的曲线，对任意的 $x\in(m,n)$，$f(x)$ 的导函数 $f^{\prime}(x)$ 都存在，且 $f^{\prime}(x)$ 的导函数 $f^{\prime\prime}(x)$ 也都存在，若 $\exists x_0\in(m,n)$，使得 $f^{\prime\prime}(x_0)=0$，且在 $x_0$ 的左右附近，$f^{\prime\prime}(x)$ 异号，则称点 $(x_0,f(x_0))$ 为曲线 $y=f(x)$ 的拐点。已知函数 $f(x)=x-(x+1)\ln(x+1)$，$g(x)=(x-5)e^x-\frac{k}{12}x^4+\frac12kx^3$，$h(x)=e^x-ax^3-\sin x$。
  求 $f(x)$ 在定义域内的拐点个数。
  若 $g(x)$ 在 $(0,+\infty)$ 上有唯一拐点 $(3,g(3))$，求实数 $k$ 的取值范围。
  函数 $F(x)=f(x)+h(x)$ 在区间 $(-1,0)$ 恰有一个拐点，求实数 $a$ 的取值范围。
answer: |
  （1）0 个；（2）$k\le e$；（3）$a\in\left(\frac12,+\infty\right)$。

  (1) $f(x)$ 的定义域为 $x>-1$，$f^{\prime}(x)=-\ln(x+1)$，$f^{\prime\prime}(x)=-\frac1{x+1}<0$，二阶导不为 0 且不变号，所以没有拐点。
  (2) $g^{\prime\prime}(x)=(x-3)e^x-kx^2+3kx=(x-3)(e^x-kx)$。要让 $(3,g(3))$ 是 $(0,+\infty)$ 上唯一拐点，$e^x-kx$ 不能再给出变号零点。若 $k\le e$，则 $e^x-kx\ge e^x-ex\ge0$，只由 $x-3$ 产生唯一变号零点 $x=3$；若 $k>e$，$e^x-kx$ 在 $(0,\ln k)$ 内已有变号零点，矛盾，所以 $k\le e$。
  (3) $F^{\prime\prime}(x)=-\frac1{x+1}+e^x-6ax+\sin x$。令 $G(x)=F^{\prime\prime}(x)$，则 $G(-1^+)=-\infty$，$G(0)=0$，$G^{\prime}(x)=\frac1{(x+1)^2}+e^x-6a+\cos x$，$G^{\prime}(0)=3-6a$。再由 $G^{\prime\prime}(x)=-\frac2{(x+1)^3}+e^x-\sin x<0$ 知 $G^{\prime}$ 严格递减。若 $a\le\frac12$，$G^{\prime}(0)\ge0$，$G$ 在 $(-1,0)$ 上递增且不在内部取零；若 $a>\frac12$，$G^{\prime}$ 由 $+\infty$ 降到负值，$G$ 先增后减，结合 $G(-1^+)=-\infty$、$G(0)=0$ 和近 0 左侧 $G(x)>0$，内部恰有一个零点。因此 $a>\frac12$。
