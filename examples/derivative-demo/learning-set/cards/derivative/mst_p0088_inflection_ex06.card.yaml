original_problem:
  stem: （2024 重庆巴蜀中学高二期中 T19）若函数 $f(x)$ 的导函数 $f^{\prime}(x)$ 在点 $x_0$ 可导，则称 $f^{\prime}(x)$ 在点 $x_0$ 的导数值为 $f(x)$ 在点 $x_0$ 的二阶导数，记作 $f^{\prime\prime}(x)$。若 $f(x)$ 在开区间 $I$ 内的每一点都二阶可导，则得到一个定义在 $I$ 上的二阶导函数，记作 $f^{\prime\prime}(x)$。曲线 $y=x^2$ 上任意两点间的弧段总在这两点的下方；而曲线 $y=\sqrt{x}$ 则相反，任意两点间的弧段总在这两点连线的上方。我们把具有前一种特性的曲线称为凸的，相应的函数称为凸函数；后一种曲线称为凹的，相应的函数称为凹函数。连续曲线上凹弧与凸弧的分界点称为曲线的拐点。拐点在统计学，物理学，经济学领域都有重要的应用。若函数 $f(x)$ 在定义域内是一条连续不断的曲线，对任意的 $x\in(m,n)$，$f(x)$ 的导函数 $f^{\prime}(x)$ 都存在，且 $f^{\prime}(x)$ 的导函数 $f^{\prime\prime}(x)$ 也都存在，若 $\exists x_0\in(m,n)$，使得 $f^{\prime\prime}(x_0)=0$，且在 $x_0$ 的左右附近，$f^{\prime\prime}(x)$ 异号，则称点 $(x_0,f(x_0))$ 为曲线 $y=f(x)$ 的拐点。已知函数 $f(x)=x-(x+1)\ln(x+1)$，$g(x)=(x-5)e^x-\frac{k}{12}x^4+\frac12kx^3$，$h(x)=e^x-ax^3-\sin x$。
  parts: *a1
  choices: []
  answer: （1）0 个；（2）$k\le e$；（3）$a\in\left(\frac12,+\infty\right)$。
  fidelity_notes:
    - 源题为三问解答题，无选项。
    - page_0088 顶部上一题 ex05 续页不属于本卡，只作为跳过内容处理。
