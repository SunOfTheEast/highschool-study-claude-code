solution:
  source_solution_summary: |
    (1) $f(x)$ 的定义域为 $x>-1$，$f^{\prime}(x)=-\ln(x+1)$，$f^{\prime\prime}(x)=-\frac1{x+1}<0$，二阶导不为 0 且不变号，所以没有拐点。
    (2) $g^{\prime\prime}(x)=(x-3)e^x-kx^2+3kx=(x-3)(e^x-kx)$。要让 $(3,g(3))$ 是 $(0,+\infty)$ 上唯一拐点，$e^x-kx$ 不能再给出变号零点。若 $k\le e$，则 $e^x-kx\ge e^x-ex\ge0$，只由 $x-3$ 产生唯一变号零点 $x=3$；若 $k>e$，$e^x-kx$ 在 $(0,\ln k)$ 内已有变号零点，矛盾，所以 $k\le e$。
    (3) $F^{\prime\prime}(x)=-\frac1{x+1}+e^x-6ax+\sin x$。令 $G(x)=F^{\prime\prime}(x)$，则 $G(-1^+)=-\infty$，$G(0)=0$，$G^{\prime}(x)=\frac1{(x+1)^2}+e^x-6a+\cos x$，$G^{\prime}(0)=3-6a$。再由 $G^{\prime\prime}(x)=-\frac2{(x+1)^3}+e^x-\sin x<0$ 知 $G^{\prime}$ 严格递减。若 $a\le\frac12$，$G^{\prime}(0)\ge0$，$G$ 在 $(-1,0)$ 上递增且不在内部取零；若 $a>\frac12$，$G^{\prime}$ 由 $+\infty$ 降到负值，$G$ 先增后减，结合 $G(-1^+)=-\infty$、$G(0)=0$ 和近 0 左侧 $G(x)>0$，内部恰有一个零点。因此 $a>\frac12$。
  key_steps:
    - step_id: step_1
      statement: 用二阶导直接判定 $f(x)$ 没有拐点。
      formula_trace:
        from: $f(x)=x-(x+1)\ln(x+1),\quad x>-1$
        to: $f^{\prime}(x)=-\ln(x+1),\quad f^{\prime\prime}(x)=-\frac1{x+1}<0$
        operation: 连续求导并判断二阶导符号。
        why: 拐点要求 $f^{\prime\prime}(x_0)=0$ 且左右变号；这里二阶导恒负。
      source_ref: page_0088_ex06_solution_part1
    - step_id: step_2
      statement: 把 $g^{\prime\prime}$ 分解成固定变号因子和参数因子。
      formula_trace:
        from: $g(x)=(x-5)e^x-\frac{k}{12}x^4+\frac12kx^3$
        to: $g^{\prime\prime}(x)=(x-3)(e^x-kx)$
        operation: 先求 $g^{\prime}(x)=(x-4)e^x-\frac{k}{3}x^3+\frac32kx^2$，再求二阶导并提因式。
        why: $(x-3)$ 确保 $x=3$ 处可能变号；唯一性取决于 $e^x-kx$ 是否产生额外变号零点。
      source_ref: page_0089_ex06_solution_continuation
    - step_id: step_3
      statement: 证明 $k\le e$ 时没有额外变号零点。
      formula_trace:
        from: $k\le e,\quad x>0$
        to: $e^x-kx\ge e^x-ex\ge0$
        operation: 用 $e^x-ex$ 在 $x=1$ 处取最小值 0。
        why: $e^x-kx$ 不变号，$g^{\prime\prime}$ 只在 $x=3$ 由 $(x-3)$ 变号。
      source_ref: page_0089_ex06_solution_continuation
    - step_id: step_4
      statement: 排除 $k>e$。
      formula_trace:
        from: $y=e^x-kx,\quad k>e$
        to: $y(0)=1>0,\quad y(\ln k)=k-k\ln k<0$
        operation: 由 $y^{\prime}=e^x-k$ 得 $y$ 在 $(0,\ln k)$ 下降，并用介值定理找零点。
        why: 这个零点是 $e^x-kx$ 的变号零点，会在 $x=3$ 之外造成额外拐点或破坏 $x=3$ 的唯一性。
      source_ref: page_0089_ex06_solution_continuation
    - step_id: step_5
      statement: 把第 (3) 问转成 $G(x)=F^{\prime\prime}(x)$ 在 $(-1,0)$ 的零点个数。
      formula_trace:
        from: $F(x)=x-(x+1)\ln(x+1)+e^x-ax^3-\sin x$
        to: $G(x)=F^{\prime\prime}(x)=-\frac1{x+1}+e^x-6ax+\sin x$
        operation: 连续求导并令 $G=F^{\prime\prime}$。
        why: 拐点对应二阶导的变号零点。
      source_ref: page_0089_ex06_solution_continuation
    - step_id: step_6
      statement: 由端点导数得到参数的必要临界。
      formula_trace:
        from: $G^{\prime}(x)=\frac1{(x+1)^2}+e^x-6a+\cos x$
        to: $G^{\prime}(0)=3-6a<0\Longleftrightarrow a>\frac12$
        operation: 利用 $G(-1^+)=-\infty$、$G(0)=0$，要在开区间内出现零点，近 0 左侧必须先高于 0。
        why: 若 $G^{\prime}(0)\ge0$，结合 $G^{\prime}$ 的递减性，$G$ 在终点前保持小于 0，不能有内部零点。
      source_ref: page_0089_ex06_solution_continuation
    - step_id: step_7
      statement: 补足 $a>\frac12$ 的充分性与唯一性。
      formula_trace:
        from: $G^{\prime\prime}(x)=-\frac2{(x+1)^3}+e^x-\sin x<0\quad(-1<x<0)$
        to: $G^{\prime}$ 严格递减，$G$ 先增后减，且内部恰有一个零点
        operation: 用 $e^x<1$、$-\sin x<\sin1<1$ 得 $G^{\prime\prime}<0$，再结合 $G(-1^+)=-\infty$、$G(0)=0$、$G^{\prime}(0)<0$。
        why: 这排除多个零点，保证 $F$ 在 $(-1,0)$ 恰有一个拐点。
      source_ref: page_0089_ex06_solution_continuation
teaching_card:
  student_title: 拐点题先盯二阶导的变号
  what_it_trains: 训练把拐点定义落实为二阶导的变号零点，并用参数分类、端点符号和导数形状控制唯一性。
  recognition_cues:
    - 题干反复给出“$f^{\prime\prime}(x_0)=0$ 且左右异号”的拐点定义。
    - 第 (2) 问指定唯一拐点在 $x=3$，说明要防止其他因子产生额外变号零点。
    - 第 (3) 问区间是 $(-1,0)$，端点 $x=-1$ 附近有 $\frac1{x+1}$ 的无穷效应。
  normalization_moves:
    - 先算二阶导，再分辨“零点”和“变号零点”。
    - 把 $g^{\prime\prime}$ 因式分解成 $(x-3)(e^x-kx)$。
    - 用 $k=e$ 作为 $e^x-kx$ 是否触底的临界。
    - 令 $G=F^{\prime\prime}$，再用 $G^{\prime}$、$G^{\prime\prime}$ 判定内部零点个数。
  common_failures:
    - 看到 $f^{\prime\prime}<0$ 仍误以为有凹函数拐点。
    - 第 (2) 问只保证 $x=3$ 是零点，忘了排除 $e^x-kx$ 的额外变号零点。
    - 把 $G(0)=0$ 当成 $(-1,0)$ 内的零点。
    - 只推出 $a>\frac12$ 是必要条件，没有说明它也是充分条件。
