stem: |
  (2024 秋·湖北月考 T15) 已知实数 $x_1$，$x_2$ 满足 $e^{x_1}+x_1=10$，$\ln\sqrt[3]{3x_2+2}+x_2=\frac83$，则 $x_1+3x_2=$________。
answer: |-
  $8$

  将 $\ln\sqrt[3]{3x_2+2}+x_2=\frac83$ 化为 $\frac13\ln(3x_2+2)+x_2=\frac83$，再乘以 3 并加 2，得 $\ln(3x_2+2)+(3x_2+2)=10$。令 $g(t)=t+e^t$，它在 $\mathbf R$ 上严格递增；因为 $e^{x_1}+x_1=10$，且 $e^{\ln(3x_2+2)}+\ln(3x_2+2)=10$，所以 $\ln(3x_2+2)=x_1$。于是 $3x_2+2=e^{x_1}=10-x_1$，故 $x_1+3x_2=8$。
