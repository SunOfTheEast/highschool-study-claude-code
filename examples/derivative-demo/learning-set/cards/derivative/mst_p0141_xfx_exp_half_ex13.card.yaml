  stem: （2023 · 哈尔滨三模 · 多选）已知函数 $f(x)$ 定义在 $(0,+\infty)$ 上，$f^{\prime}(x)$ 是其导函数，若 $x^2f^{\prime}(x)+xf(x)=e^{x/2}$，且 $f(2)=\frac{e}{2}$，则下列结论正确的是（  ）
