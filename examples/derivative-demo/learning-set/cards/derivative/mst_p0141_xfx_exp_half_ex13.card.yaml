solution:
  source_solution_summary: |
    令 $m(x)=xf(x)$，则
    $m^{\prime}(x)=f(x)+xf^{\prime}(x)=\frac{e^{x/2}}{x}$。
    又
    $f(x)=\frac{m(x)}{x}$，所以
    $f^{\prime}(x)=\frac{m^{\prime}(x)x-m(x)}{x^2}
    =\frac{e^{x/2}-m(x)}{x^2}$。
    令 $h(x)=e^{x/2}-m(x)$，则
    $h^{\prime}(x)=\frac{e^{x/2}}{2}-m^{\prime}(x)
    =e^{x/2}\frac{x-2}{2x}$。
    故 $h$ 在 $(0,2)$ 递减、在 $(2,+\infty)$ 递增，且
    $h(2)=e-m(2)=e-2f(2)=0$，所以 $h(x)\ge0$，从而
    $f^{\prime}(x)=\frac{h(x)}{x^2}\ge0$，即 $f$ 单调递增，B 对、A 错。
    对 C：$H(x)=m(x)-e\ln x$，
    $H^{\prime}(x)=m^{\prime}(x)-\frac{e}{x}
    =\frac{e^{x/2}-e}{x}$，
    所以 $H^{\prime}(x)<0\iff 0<x<2$，C 对。
    对 D：不等式等价于
    $xf(x)>\frac{xe^{x/2}+xe}{4}$。
    设
    $\varphi(x)=m(x)-\frac{xe^{x/2}}4-\frac{ex}{4}$，
    则
    $\varphi^{\prime}(x)
    =m^{\prime}(x)-\frac{e^{x/2}}4\!\left(1+\frac{x}{2}\right)-\frac{e}{4}
    =e^{x/2}\frac{8-2x-x^2}{8x}-\frac{e}{4}$。
    当 $x>2$ 时，$8-2x-x^2<0$，故 $\varphi^{\prime}(x)<0$，即 $\varphi$ 在 $(2,+\infty)$ 递减，
    且 $\varphi(2)=m(2)-e=0$，所以 $x>2$ 时 $\varphi(x)<0$，
    即 $xf(x)<\frac{xe^{x/2}+xe}{4}$，与 D 断言方向相反，D 错。
    故选 BC。
  key_steps:
    - step_id: step_1
      statement: 整体代换 $m(x)=xf(x)$，把原式变成一阶关系。
      formula_trace:
        from: $x^2f^{\prime}(x)+xf(x)=e^{x/2}$
        to: $m(x)=xf(x),\quad m^{\prime}(x)=f(x)+xf^{\prime}(x)=\frac{e^{x/2}}{x}$
        operation: 两边除以 $x$（$x>0$）并识别 $m^{\prime}$。
        why: 把“$xf$ 与 $x^2f^{\prime}$”统一成一个新函数及其导数。
      source_ref: page_0141_ex13_solution_start
    - step_id: step_2
      statement: 把 $f^{\prime}(x)$ 表示为一个符号函数除以 $x^2$。
      formula_trace:
        from: $f(x)=\frac{m(x)}{x}$
        to: $f^{\prime}(x)=\frac{m^{\prime}(x)x-m(x)}{x^2}=\frac{e^{x/2}-m(x)}{x^2}$
        operation: 对商函数求导并代入 step_1。
        why: 后续只需研究分子 $e^{x/2}-m(x)$ 的符号。
      source_ref: page_0141_ex13_solution_start
    - step_id: step_3
      statement: 构造 $h(x)=e^{x/2}-m(x)$ 并定位其最小值点。
      formula_trace:
        from: $h(x)=e^{x/2}-m(x)$
        to: $h^{\prime}(x)=e^{x/2}\frac{x-2}{2x},\ h(2)=e-2f(2)=0,\ h(x)\ge0$
        operation: 求导判单调，再用已知点值 $f(2)=\frac{e}{2}$ 锁定极小值。
        why: $h\ge0$ 直接推出 $f^{\prime}\ge0$。
      source_ref: page_0141_ex13_solution_start
    - step_id: step_4
      statement: 由 $f^{\prime}(x)\ge0$ 判断 A、B。
      formula_trace:
        from: $f^{\prime}(x)=\frac{h(x)}{x^2}\ge0$
        to: $f(x)$ 在 $(0,+\infty)$ 单调递增
        operation: 利用导数符号判单调。
        why: B 正确；A“有极小值”不成立。
      source_ref: page_0141_ex13_solution_start
    - step_id: step_5
      statement: 直接求 $H^{\prime}(x)$ 判 C。
      formula_trace:
        from: $H(x)=xf(x)-e\ln x=m(x)-e\ln x$
        to: $H^{\prime}(x)=m^{\prime}(x)-\frac{e}{x}=\frac{e^{x/2}-e}{x}<0\iff 0<x<2$
        operation: 代入 $m^{\prime}(x)=\frac{e^{x/2}}{x}$ 并比较指数。
        why: 得到单调递减区间恰为 $(0,2)$。
      source_ref: page_0142_ex13_solution_cont
    - step_id: step_6
      statement: 把 D 转成 $\varphi(x)$ 的符号问题。
      formula_trace:
        from: $f(x)>\frac{e^{x/2}+e}{4}$
        to: $\varphi(x)=m(x)-\frac{xe^{x/2}}4-\frac{ex}{4},\ \varphi(x)>0$
        operation: 两边同乘 $x>0$ 并移项。
        why: 与原断言“解集是 $(2,+\infty)$”做区间符号比较。
      source_ref: page_0142_ex13_solution_cont
    - step_id: step_7
      statement: 在 $(2,+\infty)$ 上求出反向不等式，判 D 错。
      formula_trace:
        from: $\varphi^{\prime}(x)=e^{x/2}\frac{8-2x-x^2}{8x}-\frac{e}{4}$
        to: $x>2\Rightarrow \varphi^{\prime}(x)<0,\ \varphi(x)<\varphi(2)=0$
        operation: 用 $8-2x-x^2<0$ 判导数负，再利用端点值。
        why: 得到 $x>2$ 时 $xf(x)<\frac{xe^{x/2}+xe}{4}$，与 D 声称相反。
      source_ref: page_0142_ex13_solution_cont
    - step_id: step_8
      statement: 汇总正确选项。
      formula_trace:
        from: A 错，B 对，C 对，D 错
        to: 答案 BC
        operation: 合并逐项判断。
        why: 与源页结论一致。
      source_ref: page_0142_ex13_solution_cont
teaching_card:
  student_title: 整体代换后做符号追踪
  what_it_trains: 训练在抽象函数方程里通过 $m(x)=xf(x)$、$h(x)=e^{x/2}-m(x)$ 两层代换，把单调性与选项真假统一成符号链判断。
  recognition_cues:
    - 方程同时出现 $x^2f^{\prime}(x)$ 与 $xf(x)$。
    - 给定单点值 $f(2)=\frac{e}{2}$，通常用于锁定符号函数的零点。
    - 选项混合“单调/极值/区间/不等式解集”，适合拆成多个导函数符号问题。
  normalization_moves:
    - 先令 $m(x)=xf(x)$。
    - 再令 $h(x)=e^{x/2}-m(x)$，用 $h(2)=0$ 控制 $f^{\prime}$。
    - 对 D 专门构造 $\varphi(x)$，只检查其声称区间。
  common_failures:
    - 把 $m^{\prime}(x)=\frac{e^{x/2}}{x}$ 写成 $\frac{e^{x/2}}{2x}$。
    - 由 $f^{\prime}(x)\ge0$ 直接断言“有极小值”，忽略定义域是开区间。
    - D 中未利用 $\varphi(2)=0$，只凭 $\varphi^{\prime}(x)<0$ 下结论不完整。
  similar_practice_query: 抽象函数 整体代换 x f(x) 指数符号 判单调 不等式解集真假
quality:
  confidence: high
  needs_review: false
