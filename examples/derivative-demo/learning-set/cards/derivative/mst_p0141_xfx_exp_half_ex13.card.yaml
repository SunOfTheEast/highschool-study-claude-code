stem: |-
  （2023 · 哈尔滨三模 · 多选）已知函数 $f(x)$ 定义在 $(0,+\infty)$ 上，$f^{\prime}(x)$ 是其导函数，若 $x^2f^{\prime}(x)+xf(x)=e^{x/2}$，且 $f(2)=\frac{e}{2}$，则下列结论正确的是（  ）
  A. 函数 $f(x)$ 在定义域上有极小值
  B. 函数 $f(x)$ 在定义域上单调递增
  C. 函数 $H(x)=xf(x)-e\ln x$ 的单调递减区间为 $(0,2)$
  D. 不等式 $f(x)>\frac{e^{x/2}+e}{4}$ 的解集为 $(2,+\infty)$
answer: |
  BC

  令 $m(x)=xf(x)$，则
  $m^{\prime}(x)=f(x)+xf^{\prime}(x)=\frac{e^{x/2}}{x}$。
  又
  $f(x)=\frac{m(x)}{x}$，所以
  $f^{\prime}(x)=\frac{m^{\prime}(x)x-m(x)}{x^2}
  =\frac{e^{x/2}-m(x)}{x^2}$。
  令 $h(x)=e^{x/2}-m(x)$，则
  $h^{\prime}(x)=\frac{e^{x/2}}{2}-m^{\prime}(x)
  =e^{x/2}\frac{x-2}{2x}$。
  故 $h$ 在 $(0,2)$ 递减、在 $(2,+\infty)$ 递增，且
  $h(2)=e-m(2)=e-2f(2)=0$，所以 $h(x)\ge0$，从而
  $f^{\prime}(x)=\frac{h(x)}{x^2}\ge0$，即 $f$ 单调递增，B 对、A 错。
  对 C：$H(x)=m(x)-e\ln x$，
  $H^{\prime}(x)=m^{\prime}(x)-\frac{e}{x}
  =\frac{e^{x/2}-e}{x}$，
  所以 $H^{\prime}(x)<0\iff 0<x<2$，C 对。
  对 D：不等式等价于
  $xf(x)>\frac{xe^{x/2}+xe}{4}$。
  设
  $\varphi(x)=m(x)-\frac{xe^{x/2}}4-\frac{ex}{4}$，
  则
  $\varphi^{\prime}(x)
  =m^{\prime}(x)-\frac{e^{x/2}}4\!\left(1+\frac{x}{2}\right)-\frac{e}{4}
  =e^{x/2}\frac{8-2x-x^2}{8x}-\frac{e}{4}$。
  当 $x>2$ 时，$8-2x-x^2<0$，故 $\varphi^{\prime}(x)<0$，即 $\varphi$ 在 $(2,+\infty)$ 递减，
  且 $\varphi(2)=m(2)-e=0$，所以 $x>2$ 时 $\varphi(x)<0$，
  即 $xf(x)<\frac{xe^{x/2}+xe}{4}$，与 D 断言方向相反，D 错。
  故选 BC。
