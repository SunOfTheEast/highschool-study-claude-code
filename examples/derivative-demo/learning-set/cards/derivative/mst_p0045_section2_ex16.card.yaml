stem: 若对于 \forall x\in(0,+\infty)，关于 x 的不等式 \ln x-ax+2\leqslant0 恒成立，则实数 a 的取值范围是______。
answer: |-
  a\geqslant e

  因为 x>0，恒成立条件可分离为 a\geqslant(\ln x+2)/x 对所有 x>0 成立，所以 a 至少为该函数最大值。将 (\ln x+2)/x 写成 e^2\ln(e^2x)/(e^2x)，用 \ln u/u 的最大值 1/e，得到最大值 e，故 a\geqslant e。
