stem: （广东省河源市河源中学 2023 届高三 10 月教学质量检测 T16）已知函数 f(x)=a ln x，g(x)=b e^x，若直线 y=kx (k>0) 与函数 f(x)、g(x) 的图象都相切， 则 4a+1/b 的最小值为 _____。
answer: |-
  4e

  过原点切 a ln x 的切点是 x=e，给出切线斜率 a/e； 过原点切 b e^x 的切点是 x=1，给出切线斜率 be。由同一条直线得 a/e=be， 再用基本不等式求 4a+1/b 的最小值。
rubric:
  max_score: 4
  criteria:
    - step_id: step_1
      description: 由 e^x>=ex，得 b e^x>=be x。若 y=kx 与 g(x)=b e^x 相切， 则 k=be，对应切点 x=1。
      max_score: 1
    - step_id: step_2
      description: 由 ln x<=x/e，得 a ln x<=a x/e。若 y=kx 与 f(x)=a ln x 相切， 则 k=a/e，对应切点 x=e。
      max_score: 1
    - step_id: step_3
      description: 同一条直线 y=kx 与两图象都相切，所以 a/e=be，即 a=b e^2。
      max_score: 1
    - step_id: step_4
      description: 4a+1/b>=2 sqrt(4a/b)=4e；当 a=e/2，b=1/(2e) 时等号成立， 所以最小值为 4e。
      max_score: 1
