solution:
  source_solution_summary: |
    由题设
    \[
    [x+f(x)]\sin x=f^{\prime}(x)\cos x
    \]
    得
    \[
    f^{\prime}(x)\cos x-f(x)\sin x=x\sin x.
    \]
    设
    \[
    g(x)=f(x)\cos x,
    \]
    则
    \[
    g^{\prime}(x)=x\sin x.
    \]
    在区间 $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$ 内有 $x\sin x\ge 0$，故 $g$ 单调递增。
    又 $f(0)=0$，所以 $g(0)=0$，从而
    \[
    x\in\left(-\frac{\pi}{2},0\right)\Rightarrow g(x)<0,\quad
    x\in\left(0,\frac{\pi}{2}\right)\Rightarrow g(x)>0.
    \]

    由
    \[
    f(x)=\frac{g(x)}{\cos x}
    \]
    可得
    \[
    f^{\prime}(x)=\left[\frac{g(x)}{\cos x}\right]^{\prime}
    =\frac{g^{\prime}(x)\cos x+g(x)\sin x}{\cos^2 x}.
    \]
    当 $x\in\left(-\frac{\pi}{2},0\right)$ 时，$g(x)<0,\ g^{\prime}(x)>0,\ \cos x>0,\ \sin x<0$，
    故分子两项均为正，$f^{\prime}(x)>0$；
    当 $x\in\left(0,\frac{\pi}{2}\right)$ 时，$g(x)>0,\ g^{\prime}(x)>0,\ \cos x>0,\ \sin x>0$，
    仍有 $f^{\prime}(x)>0$。
    因而 $f^{\prime}(x)\ge 0$ 在全区间成立，$f(x)$ 单调递增，A正确、B错误。
    又该区间为开区间且函数单调递增，所以无极值与最值，D正确、C错误。
    故选 AD。
  key_steps:
    - step_id: step_1
      statement: 把原式改写为可识别的乘积求导结构。
      formula_trace:
        from: $[x+f(x)]\\sin x=f^{\prime}(x)\\cos x$
        to: $f^{\prime}(x)\\cos x-f(x)\\sin x=x\\sin x$
        operation: 移项整理。
        why: 左侧正是 $(f(x)\\cos x)^{\prime}$ 的形式。
      source_ref: page_0133
    - step_id: step_2
      statement: 构造 $g(x)=f(x)\\cos x$ 并判定其单调与符号。
      formula_trace:
        from: $g^{\prime}(x)=x\\sin x$，$f(0)=0$
        to: $g$递增，$g(0)=0$，故左负右正
        operation: 利用 $x\\sin x\\ge 0$ 与过零点信息。
        why: 这是后续判断 $f^{\prime}(x)$ 号向的关键输入。
      source_ref: page_0133
    - step_id: step_3
      statement: 用商函数求导表达 $f^{\prime}(x)$ 并分区间判号。
      formula_trace:
        from: $f(x)=\\frac{g(x)}{\\cos x}$
        to: $f^{\prime}(x)=\\frac{g^{\prime}(x)\\cos x+g(x)\\sin x}{\\cos^2 x}>0$
        operation: 求导后按 $(-\\frac{\\pi}{2},0)$ 与 $(0,\\frac{\\pi}{2})$ 分析各因子符号。
        why: 直接给出 $f$ 的单调性。
      source_ref: page_0133
    - step_id: step_4
      statement: 由单调性与开区间性质判断选项。
      formula_trace:
        from: $f$ 在 $\\left(-\\frac{\\pi}{2},\\frac{\\pi}{2}\\right)$ 单调递增
        to: A对，B错，且无极值和最值，D对、C错
        operation: 逐项对照。
        why: 多选题需要区分“增减性”与“极值/最值”两个层面。
      source_ref: page_0133
teaching_card:
  student_title: 把式子认成 $(f\\cos x)^{\prime}$，再回代判 $f^{\prime}$
  what_it_trains: 训练三角复合场景下的结构识别、符号分区间分析和多选结论拆分。
  recognition_cues:
    - 出现 $f^{\prime}(x)\\cos x$ 与 $f(x)\\sin x$ 的线性组合。
    - 定义域是 $\\left(-\\frac{\\pi}{2},\\frac{\\pi}{2}\\right)$，提示按左右半区讨论符号。
  normalization_moves:
    - 移项后设 $g=f\\cos x$。
    - 由 $g^{\prime}=x\\sin x$ 判 $g$ 递增，并结合 $g(0)=0$ 定符号。
    - 写 $f=\\frac{g}{\\cos x}$，求 $f^{\prime}$ 后判号。
  common_failures:
    - 忽视 $\cos x>0$ 在该定义域内恒成立。
    - 把 $x\\sin x$ 在负半轴误判为负。
    - 把“没有最值”误当成“有极值”。
  similar_practice_query: 抽象函数 三角复合 $f^{\prime}(x)\cos x-f(x)\sin x$ 乘积构造 单调性 极值 多选
