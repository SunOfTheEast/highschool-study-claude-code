stem: |-
  （2024·小店区月考·多选）已知函数 $f(x)$ 的定义域为 $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$，其导函数为 $f^{\prime}(x)$。若 $[x+f(x)]\sin x=f^{\prime}(x)\cos x$，且 $f(0)=0$，则（  ）
  A. $f(x)$ 是增函数
  B. $f(x)$ 是减函数
  C. $f(x)$ 有最大值
  D. $f(x)$ 没有极值
answer: |
  AD

  由题设
  \[
  [x+f(x)]\sin x=f^{\prime}(x)\cos x
  \]
  得
  \[
  f^{\prime}(x)\cos x-f(x)\sin x=x\sin x.
  \]
  设
  \[
  g(x)=f(x)\cos x,
  \]
  则
  \[
  g^{\prime}(x)=x\sin x.
  \]
  在区间 $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$ 内有 $x\sin x\ge 0$，故 $g$ 单调递增。
  又 $f(0)=0$，所以 $g(0)=0$，从而
  \[
  x\in\left(-\frac{\pi}{2},0\right)\Rightarrow g(x)<0,\quad
  x\in\left(0,\frac{\pi}{2}\right)\Rightarrow g(x)>0.
  \]

  由
  \[
  f(x)=\frac{g(x)}{\cos x}
  \]
  可得
  \[
  f^{\prime}(x)=\left[\frac{g(x)}{\cos x}\right]^{\prime}
  =\frac{g^{\prime}(x)\cos x+g(x)\sin x}{\cos^2 x}.
  \]
  当 $x\in\left(-\frac{\pi}{2},0\right)$ 时，$g(x)<0,\ g^{\prime}(x)>0,\ \cos x>0,\ \sin x<0$，
  故分子两项均为正，$f^{\prime}(x)>0$；
  当 $x\in\left(0,\frac{\pi}{2}\right)$ 时，$g(x)>0,\ g^{\prime}(x)>0,\ \cos x>0,\ \sin x>0$，
  仍有 $f^{\prime}(x)>0$。
  因而 $f^{\prime}(x)\ge 0$ 在全区间成立，$f(x)$ 单调递增，A正确、B错误。
  又该区间为开区间且函数单调递增，所以无极值与最值，D正确、C错误。
  故选 AD。
