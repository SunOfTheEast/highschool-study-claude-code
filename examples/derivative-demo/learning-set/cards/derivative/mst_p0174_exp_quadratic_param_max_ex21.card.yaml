solution:
  source_solution_summary: |
    由 $f(x)\ge0$ 得
    \[
    6x^2e^x\ge 3ax-2a=a(3x-2).
    \]
    源解作参数分离并取对数，写成
    \[
    \ln6+x\ge \ln a+\ln\frac{3x-2}{x^2},
    \]
    即
    \[
    \ln\frac{6}{a}+x\ge \ln\frac{3x-2}{x^2}.
    \]
    令左侧直线函数
    \[
    y_1=\ln\frac{6}{a}+x,\quad x_1=\ln\frac{a}{6},
    \]
    右侧函数
    \[
    y_2=\ln\frac{3x-2}{x^2},\quad x_2=1.
    \]
    由源页“零点比大小”模型得 $x_1\le x_2$，故
    \[
    \ln\frac{a}{6}\le1\Longrightarrow a\le 6e.
    \]
    因此 $a$ 的最大值为 $6e$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把“恒成立”不等式分离成含参数的一侧与纯 $x$ 结构的一侧。
      formula_trace:
        from: $6x^2e^x-3ax+2a\ge0$
        to: $6x^2e^x\ge a(3x-2)$
        operation: 移项并提取参数 $a$。
        why: 为后续参数与自变量分离做准备。
      source_ref: page_0174_ex21_solution
    - step_id: step_2
      statement: 取对数并改写成“直线 vs 函数”比较。
      formula_trace:
        from: $6x^2e^x\ge a(3x-2)$
        to: $\ln\frac{6}{a}+x\ge\ln\frac{3x-2}{x^2}$
        operation: 两侧取对数并把参数项并到左侧。
        why: 把参数只保留在左侧常数项中，形成零点比较模型。
      source_ref: page_0174_ex21_solution
    - step_id: step_3
      statement: 写出两侧零点并执行零点比大小。
      formula_trace:
        from: $y_1=\ln\frac{6}{a}+x,\ y_2=\ln\frac{3x-2}{x^2}$
        to: $x_1=\ln\frac{a}{6},\ x_2=1,\ x_1\le x_2$
        operation: 分别令两侧为 0，按源页模型比较零点位置。
        why: 零点位置关系直接给出参数上界。
      source_ref: page_0174_ex21_solution
    - step_id: step_4
      statement: 回到参数并匹配选项。
      formula_trace:
        from: $\ln\frac{a}{6}\le1$
        to: $a\le6e$，最大值为 $6e$
        operation: 指数化得到 $a$ 的上界。
        why: 题目要求最大值，故取该上界。
      source_ref: page_0174_ex21_solution
teaching_card:
  student_title: 把参数塞进直线零点：一眼拿到 $a$ 上界
  what_it_trains: 训练在“恒成立+参数”题中先分离参数，再把问题转成两侧零点顺序，从而快速求参数极值。
  recognition_cues:
    - 题干是“对任意 $x$ 恒成立，求参数最大值”。
    - 原式含指数和代数混合项，参数只在线性项里。
    - 解析出现“取对数 + 零点比大小”信号。
  normalization_moves:
    - 移项后把参数集中到一边。
    - 取对数改成“直线函数 vs 固定函数”。
    - 先算两个零点，再比较位置。
    - 把零点不等式还原为参数上界。
  common_failures:
    - 直接对原式盲目求导，错过更短的零点路线。
    - 取对数时忽略分式项定义域约束。
    - 算出 $x_1$ 后把不等号方向写反，导致 $a$ 上下界颠倒。
