stem: |-
  （2021·安徽皖江八校 T12）设函数 $f(x)=6x^2\cdot e^x-3ax+2a$（$e$ 为自然对数的底数），当 $x\in\mathbf{R}$ 时 $f(x)\geqslant0$ 恒成立，则实数 $a$ 的最大值为（  ）
  A. $e$
  B. $2e$
  C. $4e$
  D. $6e$
answer: |
  D

  由 $f(x)\ge0$ 得
  \[
  6x^2e^x\ge 3ax-2a=a(3x-2).
  \]
  源解作参数分离并取对数，写成
  \[
  \ln6+x\ge \ln a+\ln\frac{3x-2}{x^2},
  \]
  即
  \[
  \ln\frac{6}{a}+x\ge \ln\frac{3x-2}{x^2}.
  \]
  令左侧直线函数
  \[
  y_1=\ln\frac{6}{a}+x,\quad x_1=\ln\frac{a}{6},
  \]
  右侧函数
  \[
  y_2=\ln\frac{3x-2}{x^2},\quad x_2=1.
  \]
  由源页“零点比大小”模型得 $x_1\le x_2$，故
  \[
  \ln\frac{a}{6}\le1\Longrightarrow a\le 6e.
  \]
  因此 $a$ 的最大值为 $6e$，选 D。
