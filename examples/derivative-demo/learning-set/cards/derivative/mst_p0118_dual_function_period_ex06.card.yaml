solution:
  source_solution_summary: |
    因 $g(x)$ 为偶函数，所以 $g'(x)$ 为奇函数。
    由
    $f(x)+g'(x)-5=0$ 与
    $f(x)-g'(4-x)-5=0$ 相减得
    $g'(x)+g'(4-x)=0$，故 $g'$ 关于点 $(2,0)$ 中心对称，
    立得 $g'(2)=0$，B 正确。
    又由
    $f(x)-5=-g'(x)=g'(4-x)$，
    配合奇函数关系可得
    $g'(x)=g'(x+4)$，即 $g'$ 周期为 4。
    再由
    $f(x)+g'(x)=5$ 与
    $f(x)-g'(4-x)=5$
    可推出 $f(x)=f(x+4)$。
    同时由代入 $-x$ 并利用 $g'(x+4)=g'(x)$，得到
    $f(x)+f(-x)=10$，所以 $f$ 关于若干点 $(2+2k,5)$ 中心对称，
    故 $f(1)+f(3)=10$，D 正确。
    由周期与对称还可得 $f(0)=f(4)=5$，A 正确。
    而 $f(-1)+f(-3)=10$ 只能给和，不能推出两者相等，C 不一定成立。
    故选 ABD。
  key_steps:
    - step_id: step_1
      statement: 由 $g$ 偶推出 $g'$ 奇，并先判 B。
      formula_trace:
        from: |
          $g(-x)=g(x),\qquad
          f(x)+g'(x)-5=0,\qquad
          f(x)-g'(4-x)-5=0$
        to: |
          $g'(-x)=-g'(x),\qquad
          g'(x)+g'(4-x)=0,\qquad
          g'(2)=0$
        operation: 偶函数求导得奇性；两式相减得对称恒等式，再令 $x=2$。
        why: $g^{\prime}$ 关于 $(2,0)$ 中心对称，中心点函数值必为 0。
      source_ref: page_0119
    - step_id: step_2
      statement: 由奇性与位移关系推出 $g'$ 周期为 4。
      formula_trace:
        from: $f(x)-5=-g^{\prime}(x)=g^{\prime}(4-x)$
        to: $g^{\prime}(-x)=g^{\prime}(4-x)\\Rightarrow g^{\prime}(x)=g^{\prime}(x+4)$
        operation: 把奇函数关系代入并做变量替换。
        why: 得到 $g^{\prime}$ 的周期后，可继续推 $f$ 的周期。
      source_ref: page_0119
    - step_id: step_3
      statement: 联立两式推出 $f(x)=f(x+4)$ 与 $f(x)+f(-x)=10$。
      formula_trace:
        from: |
          $f(x)+g'(x)=5,\qquad
          f(x)-g'(4-x)=5$
        to: |
          $f(x)=f(x+4),\qquad
          f(x)+f(-x)=10$
        operation: 对第二式作平移/代入 $-x$，结合 $g^{\prime}$ 奇性与周期性后加减消元。
        why: 同时得到周期和中心对称，决定 A、C、D 的真伪。
      source_ref: page_0119
    - step_id: step_4
      statement: 用“周期 + 中心对称”判 A、C、D。
      formula_trace:
        from: |
          $f(x)+f(-x)=10,\qquad f(x+4)=f(x)$
        to: |
          $f(1)+f(3)=10,\quad f(4)=f(0)=5,\quad f(-1)+f(-3)=10\not\Rightarrow f(-1)=f(-3)$
        operation: 代入对称点并区分“和值确定”与“单值确定”。
        why: D、A 必真，C 非必真。
      source_ref: page_0119
teaching_card:
  student_title: 双方程先消 $f$，再用偶导奇锁周期
  what_it_trains: 训练在双函数位移方程里，先做奇偶性降维，再做消元与周期/对称联判。
  recognition_cues:
    - 题干给出“$g$ 偶 + $g'$ 参与方程”，先想到 $g'$ 奇。
    - 两个方程只差 $g'(x)$ 与 $g'(4-x)$，典型可做加减消元。
    - 选项同时问零点、和式、相等性，通常要用“周期 + 对称”统一解释。
  normalization_moves:
    - 由 $g$ 偶得到 $g'$ 奇。
    - 两式相减得到 $g'(x)+g'(4-x)=0$。
    - 推进到 $g'$ 周期 4，再反推 $f$ 周期 4。
    - 联立 $f(x)+f(-x)=10$ 判和值类选项。
  common_failures:
    - 把偶函数求导后的奇偶性写反。
    - 在 $f(x)-g'(4-x)$ 求导或代换时漏掉负号。
    - 只得到 $f(-1)+f(-3)=10$ 就误判 $f(-1)=f(-3)$。
    - 忽略周期导致无法推出 $f(4)=5$。
  similar_practice_query: 抽象函数 偶函数 导函数奇 双方程消元 周期 对称 多选
