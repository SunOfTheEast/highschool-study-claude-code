stem: |-
  （2022 · 滕州市月考）已知函数 $f(x)$，$g(x)$ 的定义域为 $\\mathbf{R}$，$g'(x)$ 为 $g(x)$ 的导函数，且 $f(x)+g'(x)=5$，$f(x)-g'(4-x)=5$，若 $g(x)$ 为偶函数，则下列结论一定正确的是（  ）
  A. $f(4)=5$
  B. $g'(2)=0$
  C. $f(-1)=f(-3)$
  D. $f(1)+f(3)=10$
answer: |
  ABD

  因 $g(x)$ 为偶函数，所以 $g'(x)$ 为奇函数。
  由
  $f(x)+g'(x)-5=0$ 与
  $f(x)-g'(4-x)-5=0$ 相减得
  $g'(x)+g'(4-x)=0$，故 $g'$ 关于点 $(2,0)$ 中心对称，
  立得 $g'(2)=0$，B 正确。
  又由
  $f(x)-5=-g'(x)=g'(4-x)$，
  配合奇函数关系可得
  $g'(x)=g'(x+4)$，即 $g'$ 周期为 4。
  再由
  $f(x)+g'(x)=5$ 与
  $f(x)-g'(4-x)=5$
  可推出 $f(x)=f(x+4)$。
  同时由代入 $-x$ 并利用 $g'(x+4)=g'(x)$，得到
  $f(x)+f(-x)=10$，所以 $f$ 关于若干点 $(2+2k,5)$ 中心对称，
  故 $f(1)+f(3)=10$，D 正确。
  由周期与对称还可得 $f(0)=f(4)=5$，A 正确。
  而 $f(-1)+f(-3)=10$ 只能给和，不能推出两者相等，C 不一定成立。
  故选 ABD。
