stem: |-
  （2023 · 越秀期中 T22）设 $f(x)=ax+bx\ln x$，$f(x)$ 在 $x=e$ 处的切线方程是 $x+y-e=0$，其中 $e=2.718\cdots$ 为自然对数的底数。
  1. 求 $a,b$ 的值。
  2. 证明：$f(x)\leqslant \frac1{e^x}+x^2$。
answer: |-
  (1) $a=1,b=-1$；(2) 对任意 $x>0$，$f(x)\leqslant \frac1{e^x}+x^2$。

  第(1)问：由切线 $x+y-e=0$ 可知切点为 $(e,0)$、斜率为 $-1$，故 $f(e)=0,\ f^{\prime}(e)=-1$。又 $f^{\prime}(x)=a+b+b\ln x$，代入得到 $\begin{cases}a+2b=-1\\a+b=0\end{cases}$，解得 $a=1,b=-1$，即 $f(x)=x-x\ln x$。 第(2)问：设 $h(x)=x-x\ln x-\frac1{e^x}-x^2$。有 $h^{\prime}(x)=-\ln x+\frac1{e^x}-2x$， $h^{\prime\prime}(x)=-\frac1x-\frac1{e^x}-2<0$， 因而 $h^{\prime}$ 严格递减；并且 $\lim_{x\to0^+}h^{\prime}(x)=+\infty,\ h^{\prime}(1)<0$， 故存在唯一 $x_0\in(0,1)$ 使 $h^{\prime}(x_0)=0$，从而 $h$ 在 $x_0$ 处取最大值。由 $2x_0=-\ln x_0+\frac1{e^{x_0}}$ 代回得 $h(x_0)=(x_0+1)\left(x_0-\frac1{e^{x_0}}\right)$。再设 $m(x)=x-\frac1{e^x}$，则 $m^{\prime}(x)=1+\frac1{e^x}>0$，且 $m(0)<0,\ m(1)>0$，故存在唯一 $x_1\in(0,1)$ 满足 $m(x_1)=0$，即 $x_1=\frac1{e^{x_1}}\Rightarrow \ln x_1=-x_1$。 代入可得 $h^{\prime}(x_1)=0$，故 $x_0=x_1$，于是 $h(x)\le h(x_0)=(x_0+1)m(x_0)=0$，即 $f(x)\le \frac1{e^x}+x^2$。同页还给出同构写法： $\frac1{e^x}+x^2+x\ln x-x=x\!\left(e^{-x-\ln x}+x+\ln x-1\right) =xH(-x-\ln x)\ge0$，其中 $H(t)=e^t-t-1$。
