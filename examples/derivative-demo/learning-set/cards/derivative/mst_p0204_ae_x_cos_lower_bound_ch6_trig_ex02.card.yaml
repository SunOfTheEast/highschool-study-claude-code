solution:
  source_solution_summary: 由 $a\ge1$，要证 $a(e^x-1)-x^2+x+\cos x>1$ 只需证 $e^x-1-x^2+x+\cos x>1$。 设 $F(x)=e^x-1-x^2+x+\cos x$， source 给出 $F^{\prime}(x)=e^x-2x+1-\sin x>0$，故 $F(x)$ 单调递增。 又 $x>0$，所以 $F(x)>F(0)=1$，即 $a(e^x-1)-x^2+x+\cos x>1$，原命题得证。
  key_steps:
    - step_id: step_1
      statement: 用参数下界把命题降到无参数核心。
      formula_trace:
        from: $a(e^x-1)-x^2+x+\cos x>1,\ a\ge1$
        to: 只需证 $e^x-1-x^2+x+\cos x>1$
        operation: 将 $a(e^x-1)$ 用最小系数 $1$ 代替。
        why: 去掉参数后目标可直接做单调性证明。
      source_ref: page_0205_ex02_solution_continuation
    - step_id: step_2
      statement: 构造辅助函数并求导。
      formula_trace:
        from: $F(x)=e^x-1-x^2+x+\cos x$
        to: $F^{\prime}(x)=e^x-2x+1-\sin x$
        operation: 逐项求导并合并。
        why: 为判定 $F$ 的单调性。
      source_ref: page_0205_ex02_solution_continuation
    - step_id: step_3
      statement: 用导数正性得到严格递增。
      formula_trace:
        from: $F^{\prime}(x)=e^x-2x+1-\sin x>0$
        to: $F(x)$ 在比较区间上单调递增
        operation: 按 source 直接使用导数符号结论。
        why: 把目标转为与 $x=0$ 的函数值比较。
      source_ref: page_0205_ex02_solution_continuation
    - step_id: step_4
      statement: 代入基准点完成不等式。
      formula_trace:
        from: $x>0$ 且 $F$ 递增
        to: $F(x)>F(0)=1$
        operation: 比较点取 $x=0$。
        why: 恰好得到 step_1 的核心目标。
      source_ref: page_0205_ex02_solution_continuation
teaching_card:
  student_title: 参数下界降阶 + 单调性收束
  what_it_trains: 训练先用参数条件降阶，再用“构造函数-求导-锚点比较”完成严格不等式证明。
  recognition_cues:
    - 题干含参数下界（如 $a\ge1$）且目标是证明不等式。
    - 核心表达式含 $e^x$、多项式与三角项，可合并成单函数。
    - 结论比较值可自然锚定在 $x=0$。
  normalization_moves:
    - 先把参数项降到最小值情形。
    - 把目标改写为 $F(x)>F(0)$ 型。
    - 通过 $F^{\prime}(x)$ 符号锁定单调性。
  common_failures:
    - 忽略 $a\ge1$，直接在含参式上硬算。
    - 把 $F^{\prime}(x)$ 中 $-\sin x$ 误求成 $+\sin x$。
    - 只写“$F$ 递增”却未回代 $F(0)=1$ 完成闭环。
  similar_practice_query: a>=1 e^x 三角 不等式 先降参 再单调性
