stem: （2024 · 宁夏一模 T21）已知函数 $f(x)=a(e^x-1)-x^2+x$。若 $a\geqslant1$，证明：当 $x>0$ 时，$f(x)+\cos x>1$。
answer: |-
  当 $a\geqslant1,\ x>0$ 时，$f(x)+\cos x>1$ 成立。

  由 $a\ge1$，要证 $a(e^x-1)-x^2+x+\cos x>1$ 只需证 $e^x-1-x^2+x+\cos x>1$。 设 $F(x)=e^x-1-x^2+x+\cos x$， source 给出 $F^{\prime}(x)=e^x-2x+1-\sin x>0$，故 $F(x)$ 单调递增。 又 $x>0$，所以 $F(x)>F(0)=1$，即 $a(e^x-1)-x^2+x+\cos x>1$，原命题得证。
