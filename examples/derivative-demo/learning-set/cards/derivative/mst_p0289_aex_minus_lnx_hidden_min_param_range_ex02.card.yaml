solution:
  source_solution_summary: 第(1)问中，当 $a=1$，$f(x)=e^x-\ln x$。 由 $f^\prime(x)=e^x-\frac1x$、$f^{\prime\prime}(x)=e^x+\frac1{x^2}>0$， 可知 $f^\prime$ 递增，且 $f^\prime(1/2)<0,f^\prime(1)>0$， 因而存在唯一极小点 $x_0\in(1/2,1)$。由 $f^\prime(x_0)=0$ 得 $e^{x_0}=1/x_0$，于是 $f(x_0)=e^{x_0}-\ln x_0=1/x_0+x_0>2$，所以 $f(x)>2$。 第(2)问题面原写 $f(x)\le e+1$，但解析从 $f(x)\ge e+1$ 出发；用户确认这是题面错误。按修正后的下界恒成立条件，参变分离得 $a\ge(\frac{\ln x+e+1}{e^x})_{\max}$，最大值在 $x=1/e$， 为 $e^{1-1/e}$；隐点效应也由 $\{f(x_0)=e+1,\ f^\prime(x_0)=0\}$ 推出 $x_0=1/e$， 最终得到 $a\in[e^{1-1/e},+\infty)$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问先证明 $f$ 有唯一极小点。
      formula_trace:
        from: $f(x)=e^x-\ln x$
        to: $f^\prime(x)=e^x-\frac1x,\quad f^{\prime\prime}(x)>0$
        operation: 求一阶、二阶导。
        why: $f^\prime$ 递增后，可以用取点证明唯一极小点存在。
      source_ref: page_0289_ex02_solution_part1
    - step_id: step_2
      statement: 用隐极小点关系消掉对数。
      formula_trace:
        from: $f^\prime(x_0)=0$
        to: $e^{x_0}=\frac1{x_0},\quad f(x_0)=\frac1{x_0}+x_0>2$
        operation: 由导函数零点关系替换 $e^{x_0}$ 和 $\ln x_0$。
        why: 这是本章训练的隐点效应：极小点不能直接求，但它满足可用的方程。
      source_ref: page_0289_ex02_solution_part1
    - step_id: step_3
      statement: 第(2)问按解析意图做参变分离。
      formula_trace:
        from: $ae^x-\ln x\ge e+1$
        to: $a\ge \frac{\ln x+e+1}{e^x}$
        operation: 分离参数 $a$。
        why: 若条件是下界恒成立，参数要大于右侧最大值。
      source_ref: page_0289_ex02_solution_part2_start
    - step_id: step_4
      statement: 求分离后函数的最大值。
      formula_trace:
        from: $F(x)=\frac{\ln x+e+1}{e^x}$
        to: $F_{\max}=F(1/e)=e^{1-\frac1e}$
        operation: 研究 $F^\prime$ 的符号。
        why: 这给出解析意图下的参数下界。
      source_ref: page_0289_ex02_solution_part2_start
    - step_id: step_5
      statement: 隐点效应也锁定同一个取等点。
      formula_trace:
        from: $f(x_0)=e+1,\quad f^\prime(x_0)=0$
        to: $x_0=\frac1e,\quad a\ge e^{1-\frac1e}$
        operation: 联立取等与导数为零。
        why: 这是本节“构造极点效应解决含参恒成立”的核心路线。
      source_ref: page_0290_ex02_solution_end
teaching_card:
  student_title: 用隐极小点处理 $ae^x-\ln x$
  what_it_trains: 训练极小点求不出来时，使用 $f^\prime(x_0)=0$ 提供的关系来替换指数和对数；第(2)问训练下界恒成立的参变量分离。
  recognition_cues:
    - $e^x$ 和 $\ln x$ 同时出现，直接求极小点不容易。
    - 第(1)问只要求证明 $f(x)>2$，可在隐极小点处证明最小值大于 2。
    - 第(2)问按“下界恒成立”做，需要分离参数并求右侧最大值。
    - 取等点由 $f(x_0)=e+1$ 和 $f^\prime(x_0)=0$ 一起探出来。
  normalization_moves:
    - 先用 $f^{\prime\prime}>0$ 证明 $f^\prime$ 单调。
    - 用取点 $1/2,1$ 夹住隐极小点 $x_0$。
    - 把 $f^\prime(x_0)=0$ 改写成 $e^{x_0}=1/x_0$。
    - 第(2)问把 $f(x)\ge e+1$ 分离成 $a\ge\frac{\ln x+e+1}{e^x}$。
  common_failures:
    - 直接尝试求出 $x_0$，但其实只需要用它满足的方程。
    - 没有先核对恒成立方向，导致最大值/最小值取反。
    - 分离参数时没有根据恒成立方向判断取最大值还是最小值。
    - 把 $x\to0^+$ 时 $-\ln x\to+\infty$ 的边界行为漏掉。
  similar_practice_query: ae^x-lnx 隐极小点 f(x)>2 参数范围 e+1 1/e 不等号冲突
