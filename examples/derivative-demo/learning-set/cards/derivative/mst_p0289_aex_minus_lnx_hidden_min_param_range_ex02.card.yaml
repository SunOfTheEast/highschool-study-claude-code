stem: |-
  （2024 · 山东期中）已知函数 $f(x)=ae^x-\ln x$。
  1. 当 $a=1$ 时，证明：$f(x)>2$。
  2. 若 $f(x)\ge e+1$ 恒成立，求 $a$ 的取值范围。
answer: |-
  第(1)问 $f(x)>2$；第(2)问 $a\in[e^{1-\frac1e},+\infty)$。

  第(1)问中，当 $a=1$，$f(x)=e^x-\ln x$。 由 $f^\prime(x)=e^x-\frac1x$、$f^{\prime\prime}(x)=e^x+\frac1{x^2}>0$， 可知 $f^\prime$ 递增，且 $f^\prime(1/2)<0,f^\prime(1)>0$， 因而存在唯一极小点 $x_0\in(1/2,1)$。由 $f^\prime(x_0)=0$ 得 $e^{x_0}=1/x_0$，于是 $f(x_0)=e^{x_0}-\ln x_0=1/x_0+x_0>2$，所以 $f(x)>2$。 第(2)问题面原写 $f(x)\le e+1$，但解析从 $f(x)\ge e+1$ 出发；用户确认这是题面错误。按修正后的下界恒成立条件，参变分离得 $a\ge(\frac{\ln x+e+1}{e^x})_{\max}$，最大值在 $x=1/e$， 为 $e^{1-1/e}$；隐点效应也由 $\{f(x_0)=e+1,\ f^\prime(x_0)=0\}$ 推出 $x_0=1/e$， 最终得到 $a\in[e^{1-1/e},+\infty)$。
