stem: |-
  （2025 高三下 · 辽宁沈阳模拟节选）已知函数 $f(x)=e^x-ax(a\in\mathbf{R})$。
  1. 若 $x\in[-\frac\pi2,+\infty)$ 时，$xf(x)\ge2x-x\cos x$，求 $a$ 的取值范围。
answer: |-
  $a\le1$。

  题设等价于 $x(e^x-ax-2+\cos x)\ge0$。令 $h(x)=e^x-ax-2+\cos x$。因为 $x$ 在 0 两侧符号相反， 需要 $x\ge0$ 时 $h(x)\ge0$，$-\frac\pi2<x<0$ 时 $h(x)<0$。又 $h(0)=0$， $h^\prime(0)=1-a$，为了让 $h$ 在 0 邻域先负后正，必须 $a\le1$。当 $a\le1$ 且 $x\ge0$ 时， $h(x)\ge e^x-x-2+\cos x=k(x)$，而 $k^\prime=e^x-1-\sin x\ge x-\sin x\ge0$，故 $h\ge0$。 当 $-\frac\pi2<x<0$ 时，利用 $p(x)=\frac{1+\sin x}{e^x}$ 在该区间递增且 $p(0)=1$， 得 $h^\prime(x)>0$，于是 $h(x)<h(0)=0$。综上 $a\le1$。
