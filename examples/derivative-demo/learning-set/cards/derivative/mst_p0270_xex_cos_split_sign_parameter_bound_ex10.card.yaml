original_problem:
  stem: （2025 高三下 · 辽宁沈阳模拟节选）已知函数 $f(x)=e^x-ax(a\in\mathbf{R})$。
  parts: *a1
  choices: []
  answer: $a\le1$。
  fidelity_notes:
    - source 只提供第(3)问；不补写第(1)(2)问。
    - 在 $x=0$ 时原不等式自动取等，实际证明分 $x\ge0$ 与 $-\frac\pi2<x<0$。
solution:
  source_solution_summary: 题设等价于 $x(e^x-ax-2+\cos x)\ge0$。令 $h(x)=e^x-ax-2+\cos x$。因为 $x$ 在 0 两侧符号相反， 需要 $x\ge0$ 时 $h(x)\ge0$，$-\frac\pi2<x<0$ 时 $h(x)<0$。又 $h(0)=0$， $h^\prime(0)=1-a$，为了让 $h$ 在 0 邻域先负后正，必须 $a\le1$。当 $a\le1$ 且 $x\ge0$ 时， $h(x)\ge e^x-x-2+\cos x=k(x)$，而 $k^\prime=e^x-1-\sin x\ge x-\sin x\ge0$，故 $h\ge0$。 当 $-\frac\pi2<x<0$ 时，利用 $p(x)=\frac{1+\sin x}{e^x}$ 在该区间递增且 $p(0)=1$， 得 $h^\prime(x)>0$，于是 $h(x)<h(0)=0$。综上 $a\le1$。
  key_steps:
    - step_id: step_1
      statement: 把原不等式提出公共因子 $x$。
      formula_trace:
        from: $x(e^x-ax)\ge2x-x\cos x$
        to: $x(e^x-ax-2+\cos x)\ge0$
        operation: 移项并提取 $x$。
        why: 每项都有 $x$，直接分 $x$ 的正负比硬做 $g$ 更清楚。
      source_ref: page_0270_ex10_solution
    - step_id: step_2
      statement: 转为 $h$ 的分侧符号。
      formula_trace:
        from: $h(x)=e^x-ax-2+\cos x$
        to: $x\ge0$ 需 $h\ge0$；$-\frac\pi2<x<0$ 需 $h<0$
        operation: 按 $x$ 的符号拆分。
        why: 乘数 $x$ 改变不等式方向。
      source_ref: page_0270_ex10_solution
    - step_id: step_3
      statement: 由 0 附近符号得到必要条件。
      formula_trace:
        from: $h(0)=0$，$h^\prime(0)=1-a$
        to: $1-a\ge0$，$a\le1$
        operation: 要求 $h$ 在 0 邻域递增。
        why: 这样才能在左侧为负、右侧为正。
      source_ref: page_0270_ex10_solution
    - step_id: step_4
      statement: 证明 $x\ge0$ 时 $h\ge0$。
      formula_trace:
        from: $a\le1$
        to: $h(x)\ge e^x-x-2+\cos x=k(x)\ge k(0)=0$
        operation: 用 $a\le1$ 降到 $a=1$ 并判 $k^\prime\ge0$。
        why: 正半轴需要 $h$ 非负。
      source_ref: page_0270_ex10_solution
    - step_id: step_5
      statement: 证明负半轴小区间 $h<0$。
      formula_trace:
        from: $p(x)=\frac{1+\sin x}{e^x}$
        to: $p^\prime(x)=\frac{\sqrt2\cos(x+\frac\pi4)-1}{e^x}>0$，$p(x)<p(0)=1$
        operation: 构造比值并判单调。
        why: 推出 $h^\prime(x)>0$，从而 $h(x)<h(0)=0$。
      source_ref: page_0270_ex10_solution
teaching_card:
  student_title: 每项都有 $x$，先分左右再证明
  what_it_trains: 训练极点效应失效后的换路：别在原差函数里硬求高阶导，先利用公共因子把问题拆成左右两侧的符号。
  recognition_cues:
    - 原不等式两边每一项都有 $x$。
    - $x=0$ 自动取等，直接构造大差函数会出现极点效应失效。
    - 区间从 $-\frac\pi2$ 到正无穷，明显要按 0 左右拆。
  normalization_moves:
    - 先提出 $x$，定义 $h=e^x-ax-2+\cos x$。
    - 用 $h^\prime(0)=1-a$ 得 $a\le1$。
    - 正半轴降到 $a=1$ 后证明 $h\ge0$。
    - 负半轴证明 $h^\prime>0$，所以 $h<h(0)=0$。
  common_failures:
    - 直接对 $g=xe^x-ax^2-2x+x\cos x$ 多次求导，结构越来越乱。
    - 在 $x<0$ 时忘记不等式方向反过来。
    - 只证明 $x\ge0$，漏掉 $-\frac\pi2<x<0$。
    - 负半轴估计时不知道为什么要构造 $\frac{1+\sin x}{e^x}$。
  similar_practice_query: xf(x) >= 2x - xcosx 公因子x 分侧符号 e^x ax cosx a<=1
