original_problem:
  stem: （2021 · 浙江）设 $a,b$ 为实数，且 $a>1$，函数 $f(x)=a^x-bx+e^2$，$x\in\mathbb R$。
  parts: *a1
  choices: []
  answer: 第(1)问：$b\le0$ 时在 $\mathbb R$ 上递增；$b>0$ 时先减后增，极小值点 $x_0=\log_a\frac b{\ln a}$。第(2)问：$1<a\le e^2$。第(3)问：按二分取点可证目标不等式。
  fidelity_notes:
    - 三问综合题，无选项。
    - 第(3)问是本题教学重点：在已有粗取点范围内提高 $x_1$ 的取点精度。
solution:
  source_solution_summary: $f^\prime(x)=a^x\ln a-b$。若 $b\le0$，则 $f^\prime>0$，函数递增； 若 $b>0$，极小值点为 $x_0=\log_a\frac b{\ln a}$，函数先减后增。 第(2)问对任意 $b>2e^2$ 要有两个零点，需要极小值小于 0。令 $t=\frac b{\ln a}$，则 $f(x_0)=t-t\ln t+e^2$。当 $t>e^2$ 时该值小于 0；为了任意 $b>2e^2$ 都成立，需 $\ln a\le2$，故 $1<a\le e^2$。第(3)问令 $a=e$，则极小值点为 $\ln b$，且 $\frac{e^2}{b}<x_1<\ln b<x_2<2\ln b$。要证 $x_2>\frac{b\ln b}{2e^2}x_1+\frac{e^2}{b}$，找一个 $m$ 满足 $x_1<m<\ln b$，并且 $\frac{b\ln b}{2e^2}m+\frac{e^2}{b}<\ln b$。source 用二分取点 $m=\frac{3e^2}{2b}$，验证 $f(m)<0$，所以 $x_1<m$；同时 $\frac{3}{4}\ln b+\frac{e^2}{b}<\ln b$，于是目标成立。
  key_steps:
    - step_id: step_1
      statement: 先求单调性。
      formula_trace:
        from: $f(x)=a^x-bx+e^2$
        to: $f^\prime(x)=a^x\ln a-b$
        operation: 求导。
        why: $a>1$ 时 $a^x\ln a$ 单调递增，导数最多一个零点。
      source_ref: page_0251_ex27_parts_and_solution
    - step_id: step_2
      statement: 第(2)问把极小值写成同构变量。
      formula_trace:
        from: $x_0=\log_a\frac b{\ln a}$
        to: $f(x_0)=\frac b{\ln a}-\frac b{\ln a}\ln\frac b{\ln a}+e^2$
        operation: 代入极小值点。
        why: 两个零点需要谷底低于 $x$ 轴。
      source_ref: page_0251_ex27_parts_and_solution
    - step_id: step_3
      statement: 令 $t=\frac b{\ln a}$ 解出 $a$ 的范围。
      formula_trace:
        from: $t-t\ln t+e^2<0$
        to: $t>e^2$，从而 $\ln a\le2$
        operation: 同构换元并考虑任意 $b>2e^2$。
        why: 要对所有 $b>2e^2$ 成立，最坏情况逼近 $2e^2$。
      source_ref: page_0251_ex27_parts_and_solution
    - step_id: step_4
      statement: 第(3)问先拿到粗范围。
      formula_trace:
        from: $a=e$
        to: $\frac{e^2}{b}<x_1<\ln b<x_2<2\ln b$
        operation: 沿用第(2)问的左右取点。
        why: 先确定两个零点在极小值点两侧的大致位置。
      source_ref: page_0251_ex27_parts_and_solution
    - step_id: step_5
      statement: 把目标转成找一个更精确的左侧点 $m$。
      formula_trace:
        from: $x_2>\frac{b\ln b}{2e^2}x_1+\frac{e^2}{b}$
        to: 找 $m$ 使 $x_1<m<\ln b$ 且 $\frac{b\ln b}{2e^2}m+\frac{e^2}{b}<\ln b$
        operation: 用 $\ln b<x_2$ 作右侧上桥。
        why: 只要中间表达式小于 $\ln b$，自然小于 $x_2$。
      source_ref: page_0251_ex27_parts_and_solution
    - step_id: step_6
      statement: 用二分取点 $m=\frac{3e^2}{2b}$。
      formula_trace:
        from: $\frac{e^2}{b}<m<\frac{2e^2}{b}$
        to: $m=\frac{3e^2}{2b}$
        operation: 在粗取点区间中取中间偏右点。
        why: 既要保证 $m$ 已经越过左零点，又要让线性表达式仍小于 $\ln b$。
      source_ref: page_0252_ex27_precision_continuation
    - step_id: step_7
      statement: 验证 $m$ 在左零点右侧。
      formula_trace:
        from: $f(\frac{3e^2}{2b})$
        to: $e^{3e^2/(2b)}-\frac12e^2<0$
        operation: 直接代入并用 $b>e^4$ 放缩。
        why: $f(\frac{e^2}{b})>0$ 而 $f(m)<0$，所以 $x_1<m$。
      source_ref: page_0252_ex27_precision_continuation
    - step_id: step_8
      statement: 验证线性表达式还在 $\ln b$ 左侧。
      formula_trace:
        from: $m=\frac{3e^2}{2b}$
        to: $\frac{b\ln b}{2e^2}m+\frac{e^2}{b}=\frac34\ln b+\frac{e^2}{b}<\ln b$
        operation: 代入并用 $b>e^4$。
        why: 由 $b>e^4$ 得 $\frac{e^2}{b}<\frac14\ln b$。
      source_ref: page_0252_ex27_precision_continuation
teaching_card:
  student_title: 用二分取点把零点估得更准
  what_it_trains: 训练先用粗取点证明两个零点，再根据目标不等式反推出需要的精度，选择更合适的中间点压住左零点。
  recognition_cues:
    - 函数是 $a^x-bx+e^2$，导数只有一个零点。
    - 第(2)问要求“任意 $b>2e^2$”，需要看最坏参数。
    - 第(3)问的右边含 $x_1$，说明要给左零点找更精确上界。
    - 图中出现 $\frac{e^2}{b}$、$\frac{3e^2}{2b}$、$\frac{2e^2}{b}$，就是二分取点。
  normalization_moves:
    - 先把极小值写成 $t-t\ln t+e^2$。
    - 第(2)问用任意性推出 $\ln a\le2$。
    - 第(3)问先得到粗范围。
    - 再反推需要一个 $m$，使 $x_1<m<\ln b$。
    - 取 $m=\frac{3e^2}{2b}$ 同时满足函数值和线性表达式约束。
  common_failures:
    - 只知道两个零点存在，不会继续提高 $x_1$ 的估计精度。
    - 把 $b>2e^2$ 和 $b>e^4$ 两个条件混用。
    - 没有看清目标右边的线性表达式为什么要小于 $\ln b$。
    - 在 $f(\frac{3e^2}{2b})$ 的代入中把 $-bm+e^2$ 算错。
  similar_practice_query: a^x-bx+e^2 两个零点 零点二分法 取点精度 m=3e^2/2b x2>x1线性表达式
