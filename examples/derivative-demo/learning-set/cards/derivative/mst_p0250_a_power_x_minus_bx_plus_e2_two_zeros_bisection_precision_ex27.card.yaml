stem: |-
  （2021 · 浙江）设 $a,b$ 为实数，且 $a>1$，函数 $f(x)=a^x-bx+e^2$，$x\in\mathbb R$。
  1. 求函数 $f(x)$ 的单调区间。
  2. 若对任意 $b>2e^2$，函数 $f(x)$ 有两个不同的零点，求 $a$ 的取值范围。
  3. 当 $a=e$ 时，证明：对任意 $b>e^4$，函数 $f(x)$ 有两个不同的零点 $x_1,x_2$，满足 $x_2>\frac{b\ln b}{2e^2}x_1+\frac{e^2}{b}$。
answer: |-
  第(1)问：$b\le0$ 时在 $\mathbb R$ 上递增；$b>0$ 时先减后增，极小值点 $x_0=\log_a\frac b{\ln a}$。第(2)问：$1<a\le e^2$。第(3)问：按二分取点可证目标不等式。

  $f^\prime(x)=a^x\ln a-b$。若 $b\le0$，则 $f^\prime>0$，函数递增； 若 $b>0$，极小值点为 $x_0=\log_a\frac b{\ln a}$，函数先减后增。 第(2)问对任意 $b>2e^2$ 要有两个零点，需要极小值小于 0。令 $t=\frac b{\ln a}$，则 $f(x_0)=t-t\ln t+e^2$。当 $t>e^2$ 时该值小于 0；为了任意 $b>2e^2$ 都成立，需 $\ln a\le2$，故 $1<a\le e^2$。第(3)问令 $a=e$，则极小值点为 $\ln b$，且 $\frac{e^2}{b}<x_1<\ln b<x_2<2\ln b$。要证 $x_2>\frac{b\ln b}{2e^2}x_1+\frac{e^2}{b}$，找一个 $m$ 满足 $x_1<m<\ln b$，并且 $\frac{b\ln b}{2e^2}m+\frac{e^2}{b}<\ln b$。source 用二分取点 $m=\frac{3e^2}{2b}$，验证 $f(m)<0$，所以 $x_1<m$；同时 $\frac{3}{4}\ln b+\frac{e^2}{b}<\ln b$，于是目标成立。
