solution:
  source_solution_summary: |
    $f(x)=\frac{x+1}{e^x}=(x+1)e^{-x}$，有
    $f'(x)=-xe^{-x}$，$f''(x)=(x-1)e^{-x}$，拐点为
    $(1,2/e)$，拐点切线为 $y=(-x+3)/e$。在 $x=-1$ 上，该切线的高度为
    $4/e$，曲线的高度为 $f(-1)=0$。因此 $t>4/e$ 的上段只有一条切线；
    $0<t<4/e$ 的中间段有三条切线；$t=0$ 为曲线交点，只有一条切线；
    $t=4/e$ 是拐点切线边界，不属于 $n=1$。所以 A 可取 $t=2022,n=1$ 成立；
    B 因 $0<t<4/e$ 时 $n=3$ 而错误；C 可由 $t=0,n=1$ 得 $te+n=1$ 反驳；
    D 的 $n=1$ 范围正是 $\{0\}\cup(4/e,+\infty)$。故选 AD。
  key_steps:
    - step_id: step_1
      statement: 求拐点和拐点处切线。
      formula_trace:
        from: |
          $f(x)=(x+1)e^{-x}$
        to: |
          $f'(x)=-xe^{-x},\quad f''(x)=(x-1)e^{-x},\quad x_{\text{拐}}=1$
        operation: 连续求导并令二阶导数为 $0$。
        why: 源页用拐点切线作为切线条数区域的分界线。
      source_ref: page_0095
    - step_id: step_2
      statement: 计算拐点切线在 $x=-1$ 处的边界高度。
      formula_trace:
        from: |
          $f(1)=\frac{2}{e},\quad f'(1)=-\frac1e$
        to: |
          $y-\frac2e=-\frac1e(x-1),\qquad y=\frac{-x+3}{e},\qquad y(-1)=\frac4e$
        operation: 用拐点坐标和斜率写切线，再代入 $x=-1$。
        why: 点 $P(-1,t)$ 在这条竖线上，$t=4/e$ 是区域分界高度。
      source_ref: page_0095
    - step_id: step_3
      statement: 用切点参数复核不同 $t$ 对应的切线条数。
      formula_trace:
        from: |
          $P(-1,t)\text{ 在 }x=s\text{ 处切线上}$
        to: |
          $t=f(s)+f'(s)(-1-s)=(s+1)^2e^{-s}=:H(s)$
        operation: 把 $P(-1,t)$ 代入 $x=s$ 处切线方程，得到高度函数 $H(s)$。
        why: 方程 $H(s)=t$ 的实根个数就是从 $P(-1,t)$ 可作切线的条数。
      source_ref: page_0096
    - step_id: step_4
      statement: 分类得到 $n$ 的取值。
      formula_trace:
        from: |
          $H'(s)=(s+1)(1-s)e^{-s},\quad H(-1)=0,\quad H(1)=\frac4e$
        to: |
          $t=0:n=1;\quad 0<t<\frac4e:n=3;\quad t=\frac4e:n=2;\quad t>\frac4e:n=1$
        operation: 按 $H$ 在 $(-\infty,-1)$、$(-1,1)$、$(1,+\infty)$ 的单调性数交点。
        why: 这与源页区域图的“最上段一条、中间段三条、曲线交点一条”一致，并补足边界 $t=4/e$。
      source_ref: page_0096
    - step_id: step_5
      statement: 逐项判断多选。
      formula_trace:
        from: |
          $n=1\Leftrightarrow t\in\{0\}\cup\left(\frac4e,+\infty\right),\quad 0<t<\frac4e\Rightarrow n=3$
        to: |
          $\text{A 正确，B 错误，C 错误，D 正确}$
        operation: A 取 $t=2022,n=1$；B 用中间段反驳；C 取 $t=0,n=1$；D 直接读 $n=1$ 范围。
        why: 选项考查的是各区域切线条数与参数 $t$ 的关系。
      source_ref: page_0096
teaching_card:
  student_title: 沿 $x=-1$ 数指数分式曲线的切线条数
  what_it_trains: 训练把外点沿一条竖线移动时的切线条数变化，转化为拐点切线分区和切点参数函数交点数。
  recognition_cues:
    - 题干固定点 $P(-1,t)$，说明只需研究竖线 $x=-1$ 上高度变化。
    - 函数 $(x+1)e^{-x}$ 在 $x=-1$ 处过 $x$ 轴，在 $x=1$ 处有拐点。
    - 选项出现 $4/e$，提示它来自拐点切线在 $x=-1$ 处的截距。
  normalization_moves:
    - 求 $f'$、$f''$，得到拐点切线 $y=(-x+3)/e$。
    - 在 $x=-1$ 上标出 $t=0$ 和 $t=4/e$ 两个边界。
    - 用 $H(s)=(s+1)^2e^{-s}$ 数各段对应的一条、两条或三条切线。
  common_failures:
    - 只看源图中上段和中段，漏掉 $t=0$ 的曲线交点也只有一条切线。
    - 把 $t=4/e$ 当作上段，误判为 $n=1$。
    - 判断 C 时只随手代 $t>4/e$，没找能反驳的 $t=0,n=1$。
  similar_practice_query: $(x+1)/e^x$ 过 $P(-1,t)$ 切线条数 拐点切线 $4/e$
quality:
