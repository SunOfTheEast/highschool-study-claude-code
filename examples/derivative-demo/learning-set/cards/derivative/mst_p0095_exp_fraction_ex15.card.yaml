stem: |-
  （2022 扬州高二期末 · 多选 T12）若过点 $P(-1,t)$ 最多可以作出 $n\ (n\in\mathbf{N}^*)$ 条直线与函数 $f(x)=\frac{x+1}{e^x}$ 的图像相切，则 (  )
  A. $tn$ 可以等于 2022
  B. $n$ 不可以等于 3
  C. $te+n>3$
  D. $n=1$ 时，$t\in\{0\}\cup\left(\frac{4}{e},+\infty\right)$
answer: |
  AD

  $f(x)=\frac{x+1}{e^x}=(x+1)e^{-x}$，有
  $f'(x)=-xe^{-x}$，$f''(x)=(x-1)e^{-x}$，拐点为
  $(1,2/e)$，拐点切线为 $y=(-x+3)/e$。在 $x=-1$ 上，该切线的高度为
  $4/e$，曲线的高度为 $f(-1)=0$。因此 $t>4/e$ 的上段只有一条切线；
  $0<t<4/e$ 的中间段有三条切线；$t=0$ 为曲线交点，只有一条切线；
  $t=4/e$ 是拐点切线边界，不属于 $n=1$。所以 A 可取 $t=2022,n=1$ 成立；
  B 因 $0<t<4/e$ 时 $n=3$ 而错误；C 可由 $t=0,n=1$ 得 $te+n=1$ 反驳；
  D 的 $n=1$ 范围正是 $\{0\}\cup(4/e,+\infty)$。故选 AD。
