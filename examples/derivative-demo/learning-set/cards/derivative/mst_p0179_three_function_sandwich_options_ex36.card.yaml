stem: |-
  （2023 · 云南三校联考 · 多选 T12）已知 $x>0$ 时，$(e^x-ax-b-c)(ax+b-\ln x)\geqslant0$，则（  ）
  A. 当 $c<2$ 时，$a+\ln a>c$
  B. 当 $c<2$ 时，$a+\ln a>2c-3$
  C. 当 $c>3$ 时，$a+\ln a<c$
  D. 当 $c>3$ 时，$a+\ln a<2c-3$
answer: |-
  BCD

  设 $f(x)=e^x-c,\ g(x)=\ln x,\ h(x)=ax+b$。由 $(e^x-ax-b-c)(ax+b-\ln x)\ge0$ 得 $[f(x)-h(x)][h(x)-g(x)]\ge0$，故对 $x>0$ 有 $f\ge h\ge g$ 或 $f\le h\le g$。 当 $c<2$ 时，源解把 $f-g=e^x-\ln x-c$ 拆为 $(e^x-x-1)+(x-\ln x-1)+(2-c)>0$，从而全域 $f>g$，只能是 $f\ge h\ge g$。令 $s(x)=h-g=ax+b-\ln x\ge0$， $s^{\prime}(x)=a-\frac1x$，得 $s(x)\ge s\left(\frac1a\right)=1+b+\ln a\ge0$ 与 $s(1)\ge0$， 即 $a\ge e^{-b-1},\ a\ge-b$。于是 $a+\ln a\ge a-b-1\ge-2b-1$。又由 $x\to0^+$ 时 $f\ge h$ 得 $b<1-c$，故 $a+\ln a>2c-3$，B 正确。取 $(c,a,b)=(1,1,-1)$ 时 $a+\ln a=c$，A 错误。 当 $c>3$ 时，源解由图像构造 $f$ 与 $g$ 两交点 $M(x_1,\ln x_1),N(x_2,\ln x_2)$（$0<x_1<1<x_2$），并令直线 $h$ 过两点，得到 $c>a+\ln a$，故 C 正确；又因 $c>3$，有 $c<2c-3$，于是 $a+\ln a<2c-3$，D 正确。 所以选 BCD。
