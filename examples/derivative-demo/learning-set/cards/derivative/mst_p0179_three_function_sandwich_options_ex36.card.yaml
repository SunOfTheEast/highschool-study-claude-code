solution:
  source_solution_summary: 设 $f(x)=e^x-c,\ g(x)=\ln x,\ h(x)=ax+b$。由 $(e^x-ax-b-c)(ax+b-\ln x)\ge0$ 得 $[f(x)-h(x)][h(x)-g(x)]\ge0$，故对 $x>0$ 有 $f\ge h\ge g$ 或 $f\le h\le g$。 当 $c<2$ 时，源解把 $f-g=e^x-\ln x-c$ 拆为 $(e^x-x-1)+(x-\ln x-1)+(2-c)>0$，从而全域 $f>g$，只能是 $f\ge h\ge g$。令 $s(x)=h-g=ax+b-\ln x\ge0$， $s^{\prime}(x)=a-\frac1x$，得 $s(x)\ge s\left(\frac1a\right)=1+b+\ln a\ge0$ 与 $s(1)\ge0$， 即 $a\ge e^{-b-1},\ a\ge-b$。于是 $a+\ln a\ge a-b-1\ge-2b-1$。又由 $x\to0^+$ 时 $f\ge h$ 得 $b<1-c$，故 $a+\ln a>2c-3$，B 正确。取 $(c,a,b)=(1,1,-1)$ 时 $a+\ln a=c$，A 错误。 当 $c>3$ 时，源解由图像构造 $f$ 与 $g$ 两交点 $M(x_1,\ln x_1),N(x_2,\ln x_2)$（$0<x_1<1<x_2$），并令直线 $h$ 过两点，得到 $c>a+\ln a$，故 C 正确；又因 $c>3$，有 $c<2c-3$，于是 $a+\ln a<2c-3$，D 正确。 所以选 BCD。
  key_steps:
    - step_id: step_1
      statement: 把原乘积不等式改写为三函数顺序关系。
      formula_trace:
        from: $(e^x-ax-b-c)(ax+b-\ln x)\geqslant0$
        to: $[f(x)-h(x)][h(x)-g(x)]\geqslant0$
        operation: 设 $f(x)=e^x-c,\ g(x)=\ln x,\ h(x)=ax+b$。
        why: 便于转化为 $f,h,g$ 的链式大小关系。
      source_ref: page_0179_ex36_solution_start
    - step_id: step_2
      statement: 处理 $c<2$ 时的全域顺序。
      formula_trace:
        from: $f(x)-g(x)=e^x-\ln x-c$
        to: $f(x)-g(x)>0\ (x>0)$
        operation: 按源解拆分为 $(e^x-x-1)+(x-\ln x-1)+(2-c)$。
        why: 锁定只能取 $f\ge h\ge g$ 分支。
      source_ref: page_0179_ex36_solution_start
    - step_id: step_3
      statement: 由 $s(x)=h(x)-g(x)\ge0$ 推出 B 项结论。
      formula_trace:
        from: $s(x)=ax+b-\ln x,\ s^{\prime}(x)=a-\frac1x$
        to: $a+\ln a>2c-3$
        operation: 用 $s\left(\frac1a\right)\ge0,\ s(1)\ge0$ 与 $b<1-c$ 组合估计。
        why: 直接得到 B 正确。
      source_ref: page_0180_ex36_solution_cont
    - step_id: step_4
      statement: 用源解反例否定 A。
      formula_trace:
        from: 取 $c=1,\ a=1,\ b=-1$
        to: $a+\ln a=c$
        operation: 代入验证不满足严格大于。
        why: A 不是必然成立。
      source_ref: page_0180_ex36_solution_cont
    - step_id: step_5
      statement: 处理 $c>3$ 时的两交点构造。
      formula_trace:
        from: $\ln x_1=e^{x_1}-c=ax_1+b,\ \ln x_2=e^{x_2}-c=ax_2+b$
        to: $a+\ln a<c$
        operation: 按源解使用两交点表达式与 ALG 不等式比较。
        why: 给出 C 正确。
      source_ref: page_0180_ex36_solution_cont
    - step_id: step_6
      statement: 由 $c>3$ 推出 D 并汇总答案。
      formula_trace:
        from: $a+\ln a<c,\ c>3$
        to: $a+\ln a<2c-3$，选 BCD
        operation: 比较 $c$ 与 $2c-3$ 的大小并合并真假。
        why: 完成多选判定。
      source_ref: page_0180_ex36_solution_cont
teaching_card:
  student_title: 三函数夹逼，多选分情形判真
  what_it_trains: 训练把乘积符号题转成三函数顺序关系，再用参数分段与反例法稳定判断多选项真假。
  recognition_cues:
    - 题面结构是 $(f-h)(h-g)\ge0$。
    - 选项都在比较同一个量 $a+\ln a$ 与 $c$ 的线性表达式。
    - 参数阈值被分成明显的 $c<2$ 与 $c>3$。
  normalization_moves:
    - 先写出 $f,h,g$ 并转成链式关系。
    - 按参数区间逐段判定，而不是一次硬推全局。
    - 用一个具体反例快速否掉“必然成立”选项。
  common_failures:
    - 把“或”关系误读成“且”，导致链式关系写错。
    - 只证明了 B 就误判 A 一定也对。
    - 在 $c>3$ 情形只得到 $a+\ln a<c$，漏掉与 $2c-3$ 的再比较。
  similar_practice_query: (f-h)(h-g)≥0 三函数夹逼 多选 参数分类 a+ln a
