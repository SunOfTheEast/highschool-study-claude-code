  recognition_cues:
    - 题干说“公共点处的切线相同”，先列同点的导数相等。
    - $a>0$ 和 $\ln x$ 的定义域会把 $x_0=-a$ 排掉。
    - 式子里出现 $1+\ln 9a^2$，提示把 $1$ 并入对数成为 $\ln(9a^2e)$。
  normalization_moves:
    - 由导数相等得到 $x_0=3a$。
    - 代回函数值相等，得到 $b=-3a^2(1+\ln 9a^2)$。
    - 令 $t=9a^2e$，用 $-t\ln t$ 的最大值收尾。
