stem: |-
  （2024 · 聊城模拟 T8）若存在 $a>0$，使得函数 $f(x)=6a^2\ln x$ 与 $g(x)=x^2-4ax-b$ 的图象在这两个函数图象的公共点处的切线相同，则 $b$ 的最大值为 （  ）
  A. $-\frac{1}{3e^2}$
  B. $-\frac{1}{6e^2}$
  C. $\frac{1}{6e^2}$
  D. $\frac{1}{3e^2}$
answer: |
  D

  设公共切点为 $(x_0,y_0)$。由
  $f'(x)=\frac{6a^2}{x}$，$g'(x)=2x-4a$，
  得 $2x_0-4a=\frac{6a^2}{x_0}$，
  即 $x_0^2-2ax_0-3a^2=0$。解得
  $x_0=-a$ 或 $x_0=3a$；因 $x_0>0$ 且 $a>0$，所以 $x_0=3a$。
  再由 $f(x_0)=g(x_0)$ 得
  $x_0^2-4ax_0-b=6a^2\ln x_0$，
  代入 $x_0=3a$：
  $b=-3a^2-6a^2\ln(3a)=-3a^2(1+\ln 9a^2)$。
  写成
  $b=-3a^2\ln(9a^2e)=-\frac1{3e}\,9a^2e\ln(9a^2e)$。
  令 $t=9a^2e>0$，则 $b=-\frac1{3e}t\ln t$。
  因 $-t\ln t\le\frac1e$，等号在 $t=e^{-1}$ 处成立，
  所以 $b\le\frac1{3e^2}$，当 $a=\frac1{3e}$ 时取等，选 D。
