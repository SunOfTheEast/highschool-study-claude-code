  stem: （2022 江苏苏北七市三调 T16）一曲线族的包络线 (Envelope) 是这样的曲线：该曲线不包含于曲线族中，但过该曲线上的每一点，都有曲线族中的一条曲线与它在这一点处相切。若圆 $C_1:x^2+y^2=1$ 是直线族 $ax+by-1=0(a,b\in\mathbf{R})$ 的包络线，则 $a,b$ 满足的关系式为_______；若曲线 $C_2$ 是直线族 $(1-t^2)x+2ty-2t-4=0(t\in\mathbf{R})$ 的包络线，则 $C_2$ 的长为_______。
  parts: *a1
  choices: []
  answer: $a^2+b^2=1$；$4\pi$
  fidelity_notes:
    - 例 16 题干从 page_0107 开始，解析续到 page_0108 顶部并在例 17 前结束。
