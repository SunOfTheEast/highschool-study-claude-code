solution:
  source_solution_summary: |
    对第一空，若单位圆 $C_1:x^2+y^2=1$ 是直线族 $ax+by-1=0$ 的包络线，
    则每条直线都应与单位圆相切。原点到直线的距离为
    $\frac{1}{\sqrt{a^2+b^2}}$，令它等于半径 $1$，得
    $a^2+b^2=1$。对第二空，源页设 $C_2$ 为圆
    $(X-x)^2+(Y-y)^2=r^2$，则圆心 $(x,y)$ 到直线族
    $(1-t^2)X+2tY-2t-4=0$ 的距离要恒为 $r$：
    \[
      \frac{|(1-t^2)x+2ty-2t-4|}{\sqrt{(1-t^2)^2+(2t)^2}}
      =\frac{|-xt^2+2(y-1)t+x-4|}{1+t^2}=r.
    \]
    因为右端对任意 $t$ 都为定值，分子必须与 $1+t^2$ 成比例，源页比较系数得
    $2(y-1)=0,\ -x=x-4$，所以圆心为 $(2,1)$。此时
    $r=2$，故 $C_2$ 方程为 $(X-2)^2+(Y-1)^2=4$，长为 $2\pi r=4\pi$。
  key_steps:
    - step_id: step_1
      statement: 由单位圆与直线相切求 $a,b$ 的关系。
      formula_trace:
        from: |
          C_1:x^2+y^2=1,\qquad ax+by-1=0
        to: |
          d=\frac{|0+0-1|}{\sqrt{a^2+b^2}}=\frac1{\sqrt{a^2+b^2}}=1,\qquad
          a^2+b^2=1
        operation: 把“直线族包络单位圆”转成每条直线到圆心的距离等于半径。
        why: 圆的切线到圆心距离等于半径，这是源页第一空的直接判定。
      source_ref: page_0107
    - step_id: step_2
      statement: 设 $C_2$ 为被直线族切出的圆，并写圆心到直线的距离。
      formula_trace:
        from: |
          (1-t^2)X+2tY-2t-4=0,\qquad C_2:(X-x)^2+(Y-y)^2=r^2
        to: |
          \frac{|(1-t^2)x+2ty-2t-4|}{\sqrt{(1-t^2)^2+(2t)^2}}
          =
          \frac{|-xt^2+2(y-1)t+x-4|}{1+t^2}=r
        operation: 使用点到直线距离公式，并化简分母 $(1-t^2)^2+(2t)^2=(1+t^2)^2$。
        why: 若所有直线都是同一圆的切线，圆心到每条直线的距离必须是不随 $t$ 改变的半径。
      source_ref: page_0108
    - step_id: step_3
      statement: 用“距离为定值”比较系数。
      formula_trace:
        from: |
          \frac{|-xt^2+2(y-1)t+x-4|}{1+t^2}=r
        to: |
          2(y-1)=0,\qquad -x=x-4
        operation: 令一次项系数为 0，并让 $t^2$ 项系数与常数项按 $1+t^2$ 成比例。
        why: 只有这样分子绝对值才会恒等于某个常数倍的 $1+t^2$。
      source_ref: page_0108
    - step_id: step_4
      statement: 求圆心、半径和周长。
      formula_trace:
        from: |
          2(y-1)=0,\qquad -x=x-4
        to: |
          x=2,\qquad y=1,\qquad r=2,\qquad C_2:(X-2)^2+(Y-1)^2=4,\qquad
          |C_2|=4\pi
        operation: 解系数方程，再把圆心代回距离式确定半径。
        why: 半径为 2 的圆的周长为 $2\pi r=4\pi$。
      source_ref: page_0108
teaching_card:
  student_title: 用圆心到直线的恒定距离找包络圆
  what_it_trains: 训练把直线族的包络线问题转成“每条直线都是圆的切线”，再用点到直线距离和系数对齐求圆心、半径。
  recognition_cues:
    - 题干直接给“直线族的包络线”，且源页讲过可看成切线存在性。
    - 第一空是圆的切线族，优先用圆心到直线距离等于半径。
    - 第二空的直线族含参数 $t$，距离对所有 $t$ 都应等于同一个半径。
  normalization_moves:
    - 对 $C_1$ 写 $\frac1{\sqrt{a^2+b^2}}=1$。
    - 对 $C_2$ 设圆心 $(x,y)$、半径 $r$。
    - 写出 $\frac{|-xt^2+2(y-1)t+x-4|}{1+t^2}=r$。
    - 比较系数得到圆心 $(2,1)$、半径 $2$，周长 $4\pi$。
  common_failures:
    - 把包络线误认为直线族中的某一条直线。
    - 第二空直接令分子等于 0，忘记它表示圆心到切线的距离。
    - 忽略分母 $1+t^2$，只让一次项为 0 而没有比较 $t^2$ 项和常数项。
    - 算出半径 2 后把周长误写成面积 $4\pi$；本题的 $4\pi$ 是周长。
  similar_practice_query: 包络线 直线族 圆心到直线距离 恒定 系数比较 周长
