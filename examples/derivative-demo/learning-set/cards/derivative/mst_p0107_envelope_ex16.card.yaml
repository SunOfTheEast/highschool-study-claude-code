stem: |-
  （2022 江苏苏北七市三调 T16）一曲线族的包络线 (Envelope) 是这样的曲线：该曲线不包含于曲线族中，但过该曲线上的每一点，都有曲线族中的一条曲线与它在这一点处相切。若圆 $C_1:x^2+y^2=1$ 是直线族 $ax+by-1=0(a,b\in\mathbf{R})$ 的包络线，则 $a,b$ 满足的关系式为_______；若曲线 $C_2$ 是直线族 $(1-t^2)x+2ty-2t-4=0(t\in\mathbf{R})$ 的包络线，则 $C_2$ 的长为_______。
  blank_1. 求圆 $C_1:x^2+y^2=1$ 作为直线族 $ax+by-1=0$ 的包络线时，$a,b$ 满足的关系式。
  blank_2. 求直线族 $(1-t^2)x+2ty-2t-4=0$ 的包络线 $C_2$ 的长。
answer: |
  $a^2+b^2=1$；$4\pi$

  对第一空，若单位圆 $C_1:x^2+y^2=1$ 是直线族 $ax+by-1=0$ 的包络线，
  则每条直线都应与单位圆相切。原点到直线的距离为
  $\frac{1}{\sqrt{a^2+b^2}}$，令它等于半径 $1$，得
  $a^2+b^2=1$。对第二空，源页设 $C_2$ 为圆
  $(X-x)^2+(Y-y)^2=r^2$，则圆心 $(x,y)$ 到直线族
  $(1-t^2)X+2tY-2t-4=0$ 的距离要恒为 $r$：
  \[
    \frac{|(1-t^2)x+2ty-2t-4|}{\sqrt{(1-t^2)^2+(2t)^2}}
    =\frac{|-xt^2+2(y-1)t+x-4|}{1+t^2}=r.
  \]
  因为右端对任意 $t$ 都为定值，分子必须与 $1+t^2$ 成比例，源页比较系数得
  $2(y-1)=0,\ -x=x-4$，所以圆心为 $(2,1)$。此时
  $r=2$，故 $C_2$ 方程为 $(X-2)^2+(Y-1)^2=4$，长为 $2\pi r=4\pi$。
