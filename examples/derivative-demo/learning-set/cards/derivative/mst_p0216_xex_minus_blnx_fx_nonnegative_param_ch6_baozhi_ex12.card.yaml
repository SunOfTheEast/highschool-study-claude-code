solution:
  source_solution_summary: 第(1)问：令 $a=0$，得 $f(-x)=-b\ln(-x)-3x$（$x<0$）， $f^{\prime}(-x)=-\frac{b}{x}-3=-\frac{b+3x}{x}$。 当 $b\leqslant0$ 时，导数恒负，故在 $(-\infty,0)$ 上递减； 当 $b>0$ 时，$f^{\prime}(-x)>0\Leftrightarrow-\frac b3<x<0$， $f^{\prime}(-x)<0\Leftrightarrow x<-\frac b3$，故先减后增。 第(2)问取 $a=1$，有 $f(x)=xe^{x-1}-b\ln x+3x-4$。source 先给极点效应速解： $f(x)=h(x+\ln x-1)+4h(\ln x)+(5-b)\ln x$， 其中 $h(t)=e^t-t-1\geqslant0$，两块 $h$ 在 $x=1$ 同时取零，且 $\ln1=0$，因此余量项系数必须为零，得 $b=5$。 其后给完整导数证明：由 $f(1)=0$、恒有 $f(x)\geqslant0$ 可知 $x=1$ 应是最小值点，故 $f^{\prime}(1)=0\Rightarrow b=5$。 再设 $H(x)=x(x+1)e^{x-1}+3x-b$，有 $H^{\prime}(x)=(x^2+3x+1)e^{x-1}+3>0$，故 $H$ 递增， 进而验证 $b=5$ 时 $f$ 先减后增且最小值为 0；若 $b>5$ 或 $b<5$ 都会在某区间出现 $f(x)<0$，矛盾，故唯一 $b=5$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问代入 $a=0$ 并求 $f(-x)$ 的导数。
      formula_trace:
        from: $f(x)=a(xe^{x-1}-4)-b\ln x+3x$
        to: $f(-x)=-b\ln(-x)-3x,\ f^{\prime}(-x)=-\frac{b}{x}-3=-\frac{b+3x}{x}$
        operation: 先代入参数，再对 $f(-x)$ 直接求导。
        why: 单调性判定要先建立导数符号表达式。
      source_ref: page_0216_ex12_solution_start
    - step_id: step_2
      statement: 第(1)问按 $b$ 分类给出单调区间。
      formula_trace:
        from: $x<0,\ f^{\prime}(-x)=-\frac{b+3x}{x}$
        to: $b\leqslant0$ 时恒负；$b>0$ 时在 $(-\infty,-\frac b3)$ 负、$(-\frac b3,0)$ 正
        operation: 利用分母 $x<0$ 的固定符号转化不等式。
        why: 完成“讨论单调性”的分情形结论。
      source_ref: page_0217_ex12_solution_continuation
    - step_id: step_3
      statement: 第(2)问先做保值同构拆分。
      formula_trace:
        from: $a=1,\ f(x)=xe^{x-1}-b\ln x+3x-4$
        to: $f(x)=h(x+\ln x-1)+4h(\ln x)+(5-b)\ln x$
        operation: 把指数对数混合项配到 $h(t)=e^t-t-1$。
        why: 形成“两块非负 + 一块余量”的极点效应结构。
      source_ref: page_0217_ex12_solution_continuation
    - step_id: step_4
      statement: 在共零点 $x=1$ 锁定余量系数。
      formula_trace:
        from: $h(x+\ln x-1),\ h(\ln x)$ 在 $x=1$ 同时取零，且 $\ln1=0$
        to: 余量项系数需满足 $5-b=0$，即 $b=5$
        operation: 应用极点效应：若要全局非负，余量项在极点处不能破坏取等结构。
        why: 给出快速求参结论。
      source_ref: page_0217_ex12_solution_continuation
    - step_id: step_5
      statement: 按解答题格式：由最小值点条件先得 $b=5$。
      formula_trace:
        from: $f(1)=0,\ f(x)\geqslant0$
        to: $f^{\prime}(1)=0\Rightarrow b=5$
        operation: 把恒成立条件转为“在 $x=1$ 处取最小值”的必要条件。
        why: 给出与速解一致的严格必要条件。
      source_ref: page_0217_ex12_solution_continuation
    - step_id: step_6
      statement: 构造单调辅助函数并验证 $b=5$ 的充分性。
      formula_trace:
        from: $f^{\prime}(x)=\frac{x(x+1)e^{x-1}+3x-b}{x}$，令 $H(x)=x(x+1)e^{x-1}+3x-b$
        to: $H^{\prime}(x)=(x^2+3x+1)e^{x-1}+3>0$，$b=5$ 时 $f$ 先减后增且 $f_{\min}=f(1)=0$
        operation: 利用 $H$ 递增和 $H(1)=0$ 判定 $f^{\prime}$ 号变。
        why: 完成充分性验证：$b=5$ 时确有 $f(x)\geqslant0$。
      source_ref: page_0217_ex12_solution_continuation
    - step_id: step_7
      statement: 排除 $b>5$ 与 $b<5$，收束唯一参数。
      formula_trace:
        from: $H$ 递增，且 $H(1)$ 符号随 $b-5$ 改变
        to: $b>5$ 或 $b<5$ 都会在某邻域得到 $f(x)<f(1)=0$，矛盾
        operation: 对 $b$ 两侧做存在性反证。
        why: 给出唯一性：$b=5$。
      source_ref: page_0217_ex12_solution_continuation
teaching_card:
  student_title: 极点效应定参：$xe^{x-1}-b\ln x+3x-4\geqslant0$
  what_it_trains: 训练“先做代入后导数分段，再用保值同构与余量函数锁参”的双问联动处理。
  recognition_cues:
    - 同题含“单调性讨论 + 恒成立求参”两类任务。
    - 第(2)问出现 $xe^{x-1}$ 与 $\ln x$ 叠加，适合配到 $e^t-t-1$ 母函数。
    - 解析里会出现“极点效应”“余量函数”与 $x=1$ 取等点。
  normalization_moves:
    - 先固定定义域再判导数号，避免符号翻转错误。
    - 把复杂式拆成保值块与余量，再在共零点定参。
    - 最后用导数分类法复核充分必要性。
  common_failures:
    - 在第(1)问解不等式时忘记 $x<0$，导致区间方向写反。
    - 第(2)问只写 $f^{\prime}(1)=0$ 得 $b=5$，漏掉 $b\neq5$ 的排除。
    - 把 $h(\ln x)=x-\ln x-1$ 写错，造成同构链断裂。
  similar_practice_query: xe^{x-1} blnx 恒成立 求参 极点效应 保值性
