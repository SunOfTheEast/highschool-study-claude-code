stem: |-
  （2023 · 广州期末 T22）已知函数 $f(x)=a(xe^{x-1}-4)-b\ln x+3x$。
  1. 当 $a=0$ 时，讨论 $f(-x)$ 的单调性。
  2. 若 $a=1$，且 $f(x)\geqslant0$，求 $b$ 的值。
answer: |-
  (1) 当 $b\leqslant0$ 时，$f(-x)$ 在 $(-\infty,0)$ 上单调递减；当 $b>0$ 时，$f(-x)$ 在 $(-\infty,-\frac b3)$ 上单调递减、在 $(-\frac b3,0)$ 上单调递增。 (2) $b=5$。

  第(1)问：令 $a=0$，得 $f(-x)=-b\ln(-x)-3x$（$x<0$）， $f^{\prime}(-x)=-\frac{b}{x}-3=-\frac{b+3x}{x}$。 当 $b\leqslant0$ 时，导数恒负，故在 $(-\infty,0)$ 上递减； 当 $b>0$ 时，$f^{\prime}(-x)>0\Leftrightarrow-\frac b3<x<0$， $f^{\prime}(-x)<0\Leftrightarrow x<-\frac b3$，故先减后增。 第(2)问取 $a=1$，有 $f(x)=xe^{x-1}-b\ln x+3x-4$。source 先给极点效应速解： $f(x)=h(x+\ln x-1)+4h(\ln x)+(5-b)\ln x$， 其中 $h(t)=e^t-t-1\geqslant0$，两块 $h$ 在 $x=1$ 同时取零，且 $\ln1=0$，因此余量项系数必须为零，得 $b=5$。 其后给完整导数证明：由 $f(1)=0$、恒有 $f(x)\geqslant0$ 可知 $x=1$ 应是最小值点，故 $f^{\prime}(1)=0\Rightarrow b=5$。 再设 $H(x)=x(x+1)e^{x-1}+3x-b$，有 $H^{\prime}(x)=(x^2+3x+1)e^{x-1}+3>0$，故 $H$ 递增， 进而验证 $b=5$ 时 $f$ 先减后增且最小值为 0；若 $b>5$ 或 $b<5$ 都会在某区间出现 $f(x)<0$，矛盾，故唯一 $b=5$。
