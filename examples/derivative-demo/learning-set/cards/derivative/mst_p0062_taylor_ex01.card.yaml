original_problem:
  stem: |
    （2010 · 新课改 2 卷）设函数 $f(x)=e^x-1-x-a x^2$。
  parts: *a1
  choices: []
  answer: |
    (1) 当 $a=0$ 时，$f(x)$ 在 $(-\infty,0)$ 上单调递减，在 $(0,+\infty)$ 上单调递增。
    (2) $a\le\frac12$。
  fidelity_notes:
