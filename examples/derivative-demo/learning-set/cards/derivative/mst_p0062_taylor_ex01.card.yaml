solution:
  source_solution_summary: |
    第(1)问直接由 $f'(x)=e^x-1$ 判定单调性。第(2)问先把 $f(x)$ 拆成 $g(x)+(\frac12-a)x^2$，其中 $g(x)=e^x-1-x-\frac12x^2$，再用 $h(x)=\frac{1+x+\frac12x^2}{e^x}$ 单调递减证明 $g(x)\ge0$；若 $a>\frac12$，则 $f''(0)<0$，在 $0$ 右侧出现 $f(x)<0$，与恒成立矛盾。
  key_steps:
    - step_id: step_1
      statement: 第(1)问在 $a=0$ 时，用一阶导数符号求单调区间。
      formula_trace:
        from: $f(x)=e^x-1-x$
        to: $f'(x)=e^x-1$
        operation: 对 $f(x)$ 求导，并以 $x=0$ 为符号分界点。
        why: $e^x-1<0$ 当 $x<0$，$e^x-1>0$ 当 $x>0$。
      source_ref: page_0062, page_0063
    - step_id: step_2
      statement: 把参数项和二阶泰勒余量分开。
      formula_trace:
        from: $e^x-1-x-a x^2\ge0$
        to: $g(x)+\left(\frac12-a\right)x^2\ge0,\quad g(x)=e^x-1-x-\frac12x^2$
        operation: 加减 $\frac12x^2$，把固定的二阶近似差额单独命名为 $g(x)$。
        why: 若能证明 $g(x)\ge0$，则 $a\le\frac12$ 时剩余参数项也非负。
      source_ref: page_0063
    - step_id: step_3
      statement: 证明二阶泰勒余量 $g(x)$ 在 $x\ge0$ 上非负。
      formula_trace:
        from: $g(x)\ge0$
        to: $h(x)=\frac{1+x+\frac12x^2}{e^x}\le1$
        operation: |
          把 $e^x\ge1+x+\frac12x^2$ 改写成比值不超过 $1$，并直接求导得到 $h'(x)=-\frac{x^2}{2e^x}\le0$。
        why: $h$ 在 $[0,+\infty)$ 单调递减，故 $h(x)\le h(0)=1$。
      source_ref: page_0063
    - step_id: step_4
      statement: 当 $a\le\frac12$ 时，恒成立条件满足。
      formula_trace:
        from: $g(x)\ge0,\quad \left(\frac12-a\right)x^2\ge0$
        to: $f(x)=g(x)+\left(\frac12-a\right)x^2\ge0$
        operation: 把两个非负项相加。
        why: 这给出参数范围的充分性。
      source_ref: page_0063
    - step_id: step_5
      statement: 当 $a>\frac12$ 时，利用 $0$ 右侧的凹性制造反例。
      formula_trace:
        from: |
          $f(0)=0,\quad f'(0)=0,\quad f''(x)=e^x-2a,\quad f''(0)=1-2a<0$
        to: $\exists x\in(0,\ln 2a):\ f(x)<0$
        operation: |
          按源页记号承接为二阶判断：$f'(x)=e^x-1-2ax$，$f''(x)=e^x-2a$，在 $(0,\ln 2a)$ 上 $f''(x)<0$，所以 $f'(x)<f'(0)=0$，进而 $f$ 下降到 $0$ 以下。
        why: 这与 $x\ge0$ 时 $f(x)\ge0$ 矛盾，排除 $a>\frac12$。
      source_ref: page_0063
teaching_card:
  student_title: 用 $e^x$ 二阶下界卡住参数
  what_it_trains: 训练把恒成立求参拆成一个固定泰勒下界和一个参数余项，再用反设说明参数不能越过临界值。
  recognition_cues:
    - 题干出现 $e^x-1-x-a x^2$，前两项正好对应 $e^x$ 在 $0$ 处展开后的低阶项。
    - 要求 $x\ge0$ 上恒成立，临界参数通常由最低未抵消的二次项决定。
    - 源页前文刚给出 $e^x\ge1+x+\frac{x^2}{2}$ 的常用展开式。
  normalization_moves:
    - 加减 $\frac12x^2$，把式子写成 $g(x)+(\frac12-a)x^2$。
    - 用 $h(x)$ 的单调性证明 $g(x)\ge0$。
    - 超过临界值时，在 $0$ 右侧用二阶导数为负制造矛盾。
  common_failures:
    - |
      只会求导讨论 $f'(x)$，看不出临界参数来自二阶泰勒项。
    - |
      证明 $g(x)\ge0$ 时把 $h'(x)$ 的符号算错。
    - |
      排除 $a>\frac12$ 时，只说“局部为负”却没有用 $f''<0$ 推出 $f'<0$ 和 $f<0$。
  similar_practice_query: $e^x$ 二阶泰勒下界 恒成立 求参数 $e^x-1-x-a x^2$
