solution:
  source_solution_summary: |
    由 $3y+\log_3y=2$ 得 $3y+\log_3y+1=3$，也就是 $3y+\log_3(3y)=3$。因为 $3y=3^{\log_3(3y)}$，所以 $\log_3(3y)+3^{\log_3(3y)}=3$。设 $f(u)=u+3^u$，该函数严格递增。已知 $f(x)=3$，又有 $f(\log_3(3y))=3$，因此 $x=\log_3(3y)$，从而 $3^x=3y$，所以 $x+3y=x+3^x=3$。
  key_steps:
    - step_id: step_1
      statement: 把第二个条件凑成 $u+3^u$ 的形式。
      formula_trace:
        from: |
          $3y+\log_3y=2$
        to: |
          $3y+\log_3(3y)=3$
        operation: 两边加 $1$，并用 $\log_3(3y)=\log_3y+1$。
        why: 要把 $3y$ 与 $\log_3(3y)$ 配成同一个输入。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:39
    - step_id: step_2
      statement: 把 $3y$ 写成指数形式。
      formula_trace:
        from: |
          $3y+\log_3(3y)=3$
        to: |
          $\log_3(3y)+3^{\log_3(3y)}=3$
        operation: 利用 $3^{\log_3(3y)}=3y$。
        why: 这就与 $x+3^x=3$ 完全同构。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:39
    - step_id: step_3
      statement: 用递增函数的单射性确定输入相等。
      formula_trace:
        from: |
          $f(u)=u+3^u,\quad f(x)=3,\quad f(\log_3(3y))=3$
        to: |
          $x=\log_3(3y)$
        operation: 函数 $f$ 在实数集上严格递增，所以同一个函数值只能对应同一个输入。
        why: 把两个变量之间的隐藏关系抽出来。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:39
    - step_id: step_4
      statement: 回代求目标值。
      formula_trace:
        from: |
          $x=\log_3(3y)$
        to: |
          $3^x=3y,\quad x+3y=x+3^x=3$
        operation: 对等式取以 $3$ 为底的指数，再代入第一个已知式。
        why: 所求正好化为已知的 $x+3^x$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:39
teaching_card:
  student_title: 把 $3y+\log_3y$ 凑成同一个 $u+3^u$
  what_it_trains: 看到一个变量在指数里、另一个变量在对数里时，先试着把它们改写成同一个递增函数的两个输入，再用函数值相等推出输入相等。
  recognition_cues:
    - 一个条件是 $x+3^x=3$，另一个条件含 $3y$ 和 $\\log_3y$。
    - 给 $3y+\\log_3y=2$ 加 $1$ 后，$\\log_3y+1$ 正好合并成 $\\log_3(3y)$。
    - 所求 $x+3y$ 可以借 $3y=3^x$ 回到已知式。
  normalization_moves:
    - 先给第二个条件两边加 $1$。
    - 把 $3y$ 写成 $3^{\\log_3(3y)}$。
    - 设 $f(u)=u+3^u$，用递增性比较输入。
  common_failures:
    - 只盯着 $y$，没有把 $3y$ 看成一个整体。
    - 把 $\\log_3y+1$ 错写成 $\\log_3(y+1)$。
    - 得到 $x=\\log_3(3y)$ 后没有立刻转成 $3^x=3y$。
  similar_practice_query: 双元同构 x+3^x log_3(3y) 数值求值
