stem: |-
  （2020·全国新高考Ⅰ卷 T21）已知函数 $f(x)=ae^{x-1}-\ln x+\ln a$。
  (1) 当 $a=e$ 时，求曲线 $y=f(x)$ 在点 $(1,f(1))$ 处的切线与两坐标轴围成的三角形面积。
  (2) 若 $f(x)\geqslant1$，求 $a$ 的取值范围。
answer: |-
  (1) $S=\frac{2}{e-1}$；(2) $a\in[1,+\infty)$。

  第(1)问：代入 $a=e$ 得 $f(x)=e^x-\ln x+1$， $f^{\prime}(x)=e^x-\frac1x$，故 $f^{\prime}(1)=e-1,\ f(1)=e+1$， 切线为 $y-(e+1)=(e-1)(x-1)$。由截距得 $y$ 轴截距为 2，$x$ 轴截距为 $-\frac{2}{e-1}$，面积 $S=\frac12\cdot2\cdot\frac{2}{e-1}=\frac{2}{e-1}$。 第(2)问：令 $h(t)=e^t-t-1\ge0$，且 $a>0$。 原不等式等价于 $a(e^{x-1}-x)+\left(\frac xa-\ln\frac xa-1\right)+\left(a-\frac1a\right)x\ge0$， 即 $ah(x-1)+h(\ln\frac xa)+\left(a-\frac1a\right)x\ge0$。 前两项非负，因此关键是余量项 $\left(a-\frac1a\right)x$： 当 $a>1$ 时恒正；当 $a=1$ 时可取等；当 $0<a<1$ 时代 $x=1$ 得 $f(1)-1=a+\ln a-1<0$ 矛盾，故 $a\in[1,+\infty)$。 source 在续页还给出法二、法三，均归结到同一结论。
