stem: |-
  （2023 浙江浙南名校联盟第一次联考·多选 T12）已知函数 $f(x)=ax^3-3ax^2+b$，其中实数 $a>0$，$b\in\mathbf{R}$， 点 $A(2,a)$，则下列结论正确的是（ ）
  A. $f(x)$ 必有两个极值点
  B. 当 $b=2a$ 时，点 $(1,0)$ 是曲线 $y=f(x)$ 的对称中心
  C. 当 $b=3a$ 时，过点 $A$ 可以作曲线 $y=f(x)$ 的 2 条切线
  D. 当 $5a<b<6a$ 时，过点 $A$ 可以作曲线 $y=f(x)$ 的 3 条切线
answer: |-
  ABD

  $f'(x)=3ax^2-6ax=3ax(x-2)$，因 $a>0$， 导数在 $x=0,2$ 处变号，所以必有两个极值点，A 正确。 三次函数的对称中心横坐标为 $x=1$，且 $f(1)=b-2a$， 当 $b=2a$ 时中心为 $(1,0)$，B 正确。若 $b=3a$， 对称中心为 $(1,a)$，而 $A(2,a)$ 落在内弧区域，过 $A$ 仅有一条切线，C 错。若 $5a<b<6a$，则在 $x=2$ 处， 拐点切线高度 $b-5a<a$，曲线高度 $b-4a>a$， 点 $A(2,a)$ 落在外弧区域，可作 3 条切线，D 正确。故选 ABD。
