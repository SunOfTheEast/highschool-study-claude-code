solution:
  source_solution_summary: $f'(x)=3ax^2-6ax=3ax(x-2)$，因 $a>0$， 导数在 $x=0,2$ 处变号，所以必有两个极值点，A 正确。 三次函数的对称中心横坐标为 $x=1$，且 $f(1)=b-2a$， 当 $b=2a$ 时中心为 $(1,0)$，B 正确。若 $b=3a$， 对称中心为 $(1,a)$，而 $A(2,a)$ 落在内弧区域，过 $A$ 仅有一条切线，C 错。若 $5a<b<6a$，则在 $x=2$ 处， 拐点切线高度 $b-5a<a$，曲线高度 $b-4a>a$， 点 $A(2,a)$ 落在外弧区域，可作 3 条切线，D 正确。故选 ABD。
  key_steps:
    - step_id: step_1
      statement: 判断 A：用导数零点和变号确认两个极值点。
      formula_trace:
        from: |
          $f'(x)=3ax^2-6ax=3ax(x-2),\quad a>0$
        to: |
          $x=0,2$ 为导数零点，且 $f'$ 在两点处变号，所以 $f(x)$ 必有两个极值点
        operation: 求导并按区间 $(-\infty,0)$、$(0,2)$、$(2,+\infty)$ 判断符号。
        why: 三次函数的两个驻点都发生单调性改变时，就是极大/极小值点。
      source_ref: page_0090
    - step_id: step_2
      statement: 判断 B：求三次函数对称中心。
      formula_trace:
        from: |
          $f''(x)=6a(x-1),\quad f(1)=a-3a+b=b-2a$
        to: |
          对称中心为 $(1,b-2a)$；当 $b=2a$ 时，对称中心为 $(1,0)$
        operation: 由 $f''(x)=0$ 定位拐点，再代入函数值。
        why: 三次函数的拐点就是图象对称中心。
      source_ref: page_0090
    - step_id: step_3
      statement: 判断 C：$b=3a$ 时点 $A$ 位于内弧区域。
      formula_trace:
        from: |
          $b=3a,\quad f(1)=a,\quad f(2)=-a,\quad l_{\text{拐点}}(2)=a-3a=-2a$
        to: |
          $A(2,a)$ 在源图所示内弧区域，过 $A$ 仅有一条切线，C 项“2 条切线”错误
        operation: 把点 $A$ 与曲线及拐点切线的相对位置放回三次函数分区图。
        why: 内弧区域内的点作三次函数切线有且仅有 1 条。
      source_ref: page_0091
    - step_id: step_4
      statement: 判断 D：用 $5a<b<6a$ 把 $A$ 夹在外弧区域。
      formula_trace:
        from: |
          对称中心 $(1,b-2a)$，拐点切线斜率 $f'(1)=-3a$，
          $l_{\text{拐点}}(2)=b-5a,\quad f(2)=b-4a$
        to: |
          $5a<b<6a\Rightarrow b-5a<a<b-4a$，
          所以 $A(2,a)$ 位于外弧区域，可作 3 条切线
        operation: 在 $x=2$ 处比较拐点切线、点 $A$ 和曲线三者高度。
        why: 外弧区域内的点作三次函数切线有 3 条。
      source_ref: page_0091
teaching_card:
  student_title: 用三次函数对称中心判断外点能引几条切线
  what_it_trains: 训练在含参数三次函数多选题中，先抓住极值点和对称中心， 再用拐点切线分区判断外点引切线条数。
  recognition_cues:
    - 函数形如 $ax^3-3ax^2+b$，二阶导会把对称中心固定在 $x=1$。
    - 题干给点 $A(2,a)$，选项 C、D 都在问过同一点能作几条切线。
    - 参数范围 $5a<b<6a$ 正好用于比较 $b-5a,a,b-4a$ 三个高度。
  normalization_moves:
    - 求 $f'(x)$ 判断极值点。
    - 求 $f''(x)=0$ 和 $f(1)$ 得到对称中心。
    - 在 $x=2$ 处比较拐点切线、点 $A$ 和曲线高度。
  common_failures:
    - 把外点 $A(2,a)$ 误当成曲线上的点。
    - 只比较 $f(2)$ 与 $a$，漏掉拐点切线高度 $b-5a$。
    - 看到“过点作切线”就直接设切点方程，忽略本题源解给出的三次函数分区捷径。
  similar_practice_query: 三次函数 对称中心 拐点切线 外弧内弧 过点切线条数 多选
