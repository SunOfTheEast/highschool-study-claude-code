stem: 当 $a<0$ 时，讨论函数 $f(x)=e^x-ax$ 的零点个数。
answer: |-
  $f(x)$ 有唯一零点，且零点 $x_1\in(\frac1a,0)$。

  因为 $f'(x)=e^x-a$，当 $a<0$ 时 $f'(x)>0$，所以 $f$ 单调递增， 至多一个零点。又 $f(0)=1>0$，需要找一个 $m<0$ 使 $f(m)<0$。 当 $x<0$ 时 $e^x<1$，所以 $f(x)=e^x-ax<1-ax$。取 $m=\frac1a$，有 $1-am=0$，且 $f(\frac1a)=e^{1/a}-1<0$。因此由介值定理， 存在唯一 $x_1\in(\frac1a,0)$ 使 $f(x_1)=0$。
