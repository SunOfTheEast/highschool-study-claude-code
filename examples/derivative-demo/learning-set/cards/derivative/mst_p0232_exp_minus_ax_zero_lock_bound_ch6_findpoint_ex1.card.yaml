original_problem:
  stem: 当 $a<0$ 时，讨论函数 $f(x)=e^x-ax$ 的零点个数。
  parts: *a1
  choices: []
  answer: $f(x)$ 有唯一零点，且零点 $x_1\in(\frac1a,0)$。
  fidelity_notes:
    - 单问零点个数题，无选项。
    - 题设 $a<0$，所以 $\frac1a<0$。
solution:
  source_solution_summary: 因为 $f'(x)=e^x-a$，当 $a<0$ 时 $f'(x)>0$，所以 $f$ 单调递增， 至多一个零点。又 $f(0)=1>0$，需要找一个 $m<0$ 使 $f(m)<0$。 当 $x<0$ 时 $e^x<1$，所以 $f(x)=e^x-ax<1-ax$。取 $m=\frac1a$，有 $1-am=0$，且 $f(\frac1a)=e^{1/a}-1<0$。因此由介值定理， 存在唯一 $x_1\in(\frac1a,0)$ 使 $f(x_1)=0$。
  key_steps:
    - step_id: step_1
      statement: 先证明函数单调递增。
      formula_trace:
        from: $f(x)=e^x-ax$
        to: $f^\prime(x)=e^x-a>0$
        operation: 求导并用 $a<0$。
        why: 单调递增说明零点至多一个。
      source_ref: page_0232_ex1_solution
    - step_id: step_2
      statement: 用 $f(0)>0$ 锁定一个上界点。
      formula_trace:
        from: $f(0)=1$
        to: $f(0)>0$
        operation: 代入 $x=0$。
        why: 递增函数要证明有零点，还需要在左侧找到负值点。
      source_ref: page_0232_ex1_solution
    - step_id: step_3
      statement: 构造找小点的大函数。
      formula_trace:
        from: $f(x)=e^x-ax$
        to: $f(x)<1-ax\quad(x<0)$
        operation: 用 $x<0$ 时 $e^x<1$。
        why: 增函数找小点用大函数，令大函数为 0 后原函数更小。
      source_ref: page_0232_ex1_solution
    - step_id: step_4
      statement: 取点并完成存在性。
      formula_trace:
        from: $1-ax=0$
        to: $m=\frac1a,\quad f(\frac1a)=e^{1/a}-1<0$
        operation: 解可解方程并代回。
        why: $a<0$ 使 $1/a<0$，刚好在 0 左侧。
      source_ref: page_0232_ex1_solution
    - step_id: step_5
      statement: 由单调性和变号确定唯一零点。
      formula_trace:
        from: $f(\frac1a)<0,\ f(0)>0$
        to: $\exists! x_1\in(\frac1a,0),\ f(x_1)=0$
        operation: 介值定理加单调性。
        why: 存在性由变号，唯一性由单调递增。
      source_ref: page_0232_ex1_solution
teaching_card:
  student_title: 递增函数先锁住 $0$，再用 $e^x<1$ 找左边负值点
  what_it_trains: 训练零点找点的最小模型：单调性给唯一性，放缩取点给存在性。
  recognition_cues:
    - $a<0$ 时 $e^x-ax$ 单调递增。
    - $f(0)>0$，所以要往左找负值点。
    - 左侧 $x<0$ 时 $e^x$ 有上界 1，可以换成 $1-ax$。
  normalization_moves:
    - 先判 $f^\prime(x)>0$。
    - 代 $x=0$ 得到正值。
    - 用 $e^x<1$ 构造 $1-ax=0$。
    - 取 $m=1/a$ 并用介值定理夹出零点。
  common_failures:
    - 只说函数递增，忘记还要证明存在零点。
    - 没有注意 $a<0$，误以为 $1/a$ 在右侧。
    - 找点时直接猜点，没有解释为什么用 $1-ax$。
  similar_practice_query: e^x-ax a<0 零点个数 锁界 放缩取点 增反减同 1/a
