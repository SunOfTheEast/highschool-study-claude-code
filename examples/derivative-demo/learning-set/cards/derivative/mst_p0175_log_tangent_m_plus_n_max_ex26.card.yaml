stem: |-
  （2024 · 重庆十一中月考 T6）已知曲线 $y=\ln(mx+n)$ 与直线 $2x-y=0$ 相切，则 $m+n$ 的最大值为（  ）
  A. $\frac{e^2}{4}$
  B. $\frac{e^2}{2}$
  C. $e^2$
  D. $2e^2$
answer: |-
  C

  因为目标是 $m+n$，直接看 $x=1$ 时曲线的函数值： $y_1=\ln(m+n)$。直线 $2x-y=0$ 即 $y=2x$，在 $x=1$ 时 $y_2=2$。相切且切点比大小给出 $\ln(m+n)\leqslant2$，所以 $m+n\leqslant e^2$，最大值为 $e^2$，选 C。
