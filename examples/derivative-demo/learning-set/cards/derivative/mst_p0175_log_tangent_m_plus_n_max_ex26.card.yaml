solution:
  source_solution_summary: 因为目标是 $m+n$，直接看 $x=1$ 时曲线的函数值： $y_1=\ln(m+n)$。直线 $2x-y=0$ 即 $y=2x$，在 $x=1$ 时 $y_2=2$。相切且切点比大小给出 $\ln(m+n)\leqslant2$，所以 $m+n\leqslant e^2$，最大值为 $e^2$，选 C。
  key_steps:
    - step_id: step_1
      statement: 从目标 $m+n$ 选取对应横坐标。
      formula_trace:
        from: $m+n$
        to: $x=1,\quad \ln(mx+n)=\ln(m+n)$
        operation: 把目标量识别为对数内部在 $x=1$ 的值。
        why: 这样不用先解切点，就能直接比较目标量。
      source_ref: page_0175:lines 44-54
    - step_id: step_2
      statement: 比较曲线和直线在该点的高度。
      formula_trace:
        from: $y_1=\ln(m+n),\quad y_2=2x$
        to: $\ln(m+n)\leqslant2$
        operation: 在 $x=1$ 代入直线 $y=2x$。
        why: 源书切点比大小模型把相切约束转成目标点处的高度比较。
      source_ref: page_0175:lines 50-54
    - step_id: step_3
      statement: 指数化得到最大值。
      formula_trace:
        from: $\ln(m+n)\leqslant2$
        to: $m+n\leqslant e^2$
        operation: 两边取指数。
        why: $\ln$ 单调递增。
      source_ref: page_0175:lines 50-54
teaching_card:
  student_title: 从目标 $m+n$ 反找切点比较
  what_it_trains: 训练在相切题中先看目标量能在哪个横坐标自然出现，再用切点比大小直接压出最值。
  recognition_cues:
    - 题目给对数曲线和直线相切。
    - 最后问 $m+n$ 的最大值。
    - $m+n$ 正好是 $mx+n$ 在 $x=1$ 时的值。
  normalization_moves:
    - 把 $2x-y=0$ 写成 $y=2x$。
    - 代入 $x=1$ 得到 $\ln(m+n)$ 和 $2$。
    - 用 $\ln(m+n)\leqslant2$ 收束。
  common_failures:
    - 一上来联立切点方程，反而增加参数计算量。
    - 没有意识到 $x=1$ 是由目标 $m+n$ 触发的。
    - 把最大值写成 $2$ 而不是 $e^2$。
