solution:
  source_solution_summary: |
    先比较 $a,b$。源解将
    \[
    a=\frac1{10}=1-\frac{9}{10}=1-\frac{1}{10/9}.
    \]
    由 $\ln x<x-1$ 可得
    \[
    \ln x>1-\frac1x\quad(x>0),
    \]
    代入 $x=\frac{10}{9}$：
    \[
    b=\ln\frac{10}{9}>1-\frac{9}{10}=0.1=a.
    \]
    再比较 $b,c$：利用源文给出的
    \[
    \sin x>\ln(1+x)\quad(0<x<1),
    \]
    代入 $x=\frac19$ 得
    \[
    c=\sin\frac19>\ln\!\left(1+\frac19\right)=\ln\frac{10}{9}=b.
    \]
    于是
    \[
    a<b<c,
    \]
    选 C。
  key_steps:
    - step_id: step_1
      statement: 把 $a$ 改写成 $1-\frac1x$ 结构。
      formula_trace:
        from: $a=0.1=\frac1{10}$
        to: $a=1-\frac{1}{10/9}$
        operation: 代数恒等改写。
        why: 与 $\ln x>1-\frac1x$ 模板对齐。
      source_ref: page_0157_ex05_problem
    - step_id: step_2
      statement: 由对数下界得到 $b>a$。
      formula_trace:
        from: $b=\ln\frac{10}{9}$
        to: $b>1-\frac{9}{10}=0.1=a$
        operation: 用 $\ln x<x-1$ 推出 $\ln x>1-\frac1x$，再代入 $x=\frac{10}{9}$。
        why: 确定 $a,b$ 的相对顺序。
      source_ref: page_0157_ex05_problem
    - step_id: step_3
      statement: 用 $\sin x>\ln(1+x)$ 得到 $c>b$。
      formula_trace:
        from: $c=\sin\frac19,\ b=\ln\left(1+\frac19\right)$
        to: $c>b$
        operation: 代入区间点 $x=\frac19\in(0,1)$。
        why: 完成 $b,c$ 的比较。
      source_ref: page_0157_ex05_problem
    - step_id: step_4
      statement: 合并两段顺序。
      formula_trace:
        from: $b>a$ 且 $c>b$
        to: $a<b<c$
        operation: 传递比较。
        why: 对应选项 C。
      source_ref: page_0157_ex05_problem
teaching_card:
  student_title: 把 0.1 改写后，顺手接上两条经典不等式
  what_it_trains: 训练把常数改写到不等式模板中，再用同一小参数点完成三项排序。
  recognition_cues:
    - $b$ 是 $\ln(1+\frac19)$ 形态，$c$ 是 $\sin\frac19$。
    - $a=0.1$ 可以写成 $1-\frac1x$ 的形式。
    - 解析通常会先拿到一条中间顺序再传递。
  normalization_moves:
    - 先把 $a$ 改写成 $1-\frac{1}{10/9}$。
    - 用 $\ln x>1-\frac1x$ 比 $a,b$。
    - 用 $\sin x>\ln(1+x)$ 比 $b,c$。
  common_failures:
    - 把 $\ln x<x-1$ 方向误抄到 $\ln x>1-\frac1x$。
    - 忘记检查 $x=\frac19$ 在 $(0,1)$ 内。
    - 得到 $b>a$、$c>b$ 后未写成最终顺序。
