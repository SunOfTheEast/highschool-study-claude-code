stem: |-
  （2023 · 东城区一模 T7）过坐标原点作曲线 $y=e^{x-2}+1$ 的切线， 则切线方程为（   ）
  A. $y=x$
  B. $y=2x$
  C. $y=\frac{1}{e^2}x$
  D. $y=ex$
answer: |-
  A

  设切点为 $(t,e^{t-2}+1)$，曲线导数为 $e^{x-2}$，切线方程是 $y-(e^{t-2}+1)=e^{t-2}(x-t)$。原点在该切线上，代入 $(0,0)$ 得 $-(e^{t-2}+1)=-t e^{t-2}$，即 $(t-1)e^{t-2}=1$，解得 $t=2$。 此时斜率 $e^{0}=1$，切线为 $y-(1+1)=1(x-2)$，即 $y=x$。 也可设切线为 $y=kx$，令差函数 $f(x)=e^{x-2}+1-kx$，相切时 $f(x_0)=0,f'(x_0)=0$，解得 $x_0=2,k=1$，故选 A。
