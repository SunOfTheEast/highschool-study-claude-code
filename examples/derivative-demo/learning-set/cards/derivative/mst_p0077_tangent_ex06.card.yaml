solution:
  source_solution_summary: 设切点为 $(t,e^{t-2}+1)$，曲线导数为 $e^{x-2}$，切线方程是 $y-(e^{t-2}+1)=e^{t-2}(x-t)$。原点在该切线上，代入 $(0,0)$ 得 $-(e^{t-2}+1)=-t e^{t-2}$，即 $(t-1)e^{t-2}=1$，解得 $t=2$。 此时斜率 $e^{0}=1$，切线为 $y-(1+1)=1(x-2)$，即 $y=x$。 也可设切线为 $y=kx$，令差函数 $f(x)=e^{x-2}+1-kx$，相切时 $f(x_0)=0,f'(x_0)=0$，解得 $x_0=2,k=1$，故选 A。
  key_steps:
    - step_id: step_1
      statement: 设未知切点并写出切线斜率。
      formula_trace:
        from: $y=e^{x-2}+1$
        to: $y'=e^{x-2},\quad P(t,e^{t-2}+1),\quad k=e^{t-2}$
        operation: 求导并用 $t$ 表示切点横坐标。
        why: 原点不在曲线上，不能直接把原点当切点。
      source_ref: page_0077:例6解析法一
    - step_id: step_2
      statement: 写出切点处切线方程并代入原点。
      formula_trace:
        from: $y-(e^{t-2}+1)=e^{t-2}(x-t)$
        to: $0-(e^{t-2}+1)=e^{t-2}(0-t)$
        operation: 把 $(0,0)$ 代入切线方程。
        why: 题目要求过坐标原点作切线。
      source_ref: page_0077:例6解析法一
    - step_id: step_3
      statement: 求出切点横坐标。
      formula_trace:
        from: $-(e^{t-2}+1)=-t e^{t-2}$
        to: $(t-1)e^{t-2}=1\Rightarrow t=2$
        operation: 移项整理；源解直接给出解 $t=2$。
        why: $t=2$ 代入左侧为 1，且该方程在可行正区间上对应唯一切点。
      source_ref: page_0077:例6解析法一
    - step_id: step_4
      statement: 代回切点和斜率，得到切线方程。
      formula_trace:
        from: $t=2,\quad e^{t-2}=1$
        to: $y-(e^0+1)=e^0(x-2)\Rightarrow y=x$
        operation: 代入切线方程并化简。
        why: 切点为 $(2,2)$，斜率为 1，且该直线过原点。
      source_ref: page_0077:例6解析法一
    - step_id: step_5
      statement: 用极点效应复核斜率。
      formula_trace:
        from: $f(x)=e^{x-2}+1-kx$
        to: $\begin{cases}e^{x_0-2}+1-kx_0=0\\e^{x_0-2}-k=0\end{cases}\Rightarrow\begin{cases}x_0=2\\k=1\end{cases}$
        operation: 令曲线与直线 $y=kx$ 的差函数在切点处函数值和导数值均为 0。
        why: 相切且直线过原点，等价于差函数在切点有不变号零点。
      source_ref: page_0078:例6续解法二
teaching_card:
  student_title: 原点不在曲线上，就先设切点
  what_it_trains: 训练学生处理“过曲线外一点作切线”：不要把给定点当切点， 而是设真实切点，写切线方程，再把给定点代入求斜率。
  recognition_cues:
    - 题干说“过坐标原点作切线”，但曲线 $y=e^{x-2}+1$ 不过原点。
    - 选项都是过原点的直线 $y=kx$。
    - 曲线是指数平移，导数仍为 $e^{x-2}$。
  normalization_moves:
    - 设切点横坐标 $t$，切点为 $(t,e^{t-2}+1)$。
    - 写 $y-(e^{t-2}+1)=e^{t-2}(x-t)$。
    - 代入原点得到 $(t-1)e^{t-2}=1$。
    - 解出 $t=2$ 后得到斜率 $k=1$。
  common_failures:
    - 把 $(0,0)$ 直接代入曲线，发现不满足后误判无切线。
    - 只用切线斜率 $k=e^{t-2}$，漏掉切线必须过原点。
    - 解出 $t=2$ 后忘记选的是切线方程 $y=x$。
  similar_practice_query: 过原点作指数曲线切线 设切点 极点效应 y=e^{x-2}+1
