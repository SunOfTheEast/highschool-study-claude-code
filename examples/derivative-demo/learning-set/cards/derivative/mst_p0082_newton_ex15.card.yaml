stem: |-
  （2023 东北三省四市教研联合体·多选 T12）人们很早以前就开始探索高次方程的数值求解问题。牛顿在《流数法》一书中给出了牛顿迭代法：用“作切线”的方法求方程的近似解。具体步骤如下：设 $r$ 是函数 $y=f(x)$ 的一个零点，任意选取 $x_0$ 作为 $r$ 的初始近似值，曲线 $y=f(x)$ 在点 $(x_0,f(x_0))$ 处的切线为 $l_1$，设 $l_1$ 与 $x$ 轴交点的横坐标为 $x_1$，并称 $x_1$ 为 $r$ 的 1 次近似值；曲线 $y=f(x)$ 在点 $(x_1,f(x_1))$ 处的切线为 $l_2$，设 $l_2$ 与 $x$ 轴交点的横坐标为 $x_2$，称 $x_2$ 为 $r$ 的 2 次近似值。一般地，曲线 $y=f(x)$ 在点 $(x_n,f(x_n))(n\in\mathbf{N}_+)$ 处的切线为 $l_{n+1}$，记 $l_{n+1}$ 与 $x$ 轴交点的横坐标为 $x_{n+1}$，并称 $x_{n+1}$ 为 $r$ 的 $n+1$ 次近似值。在一定精确度下，用四舍五入法取值，当 $x_n$ 与 $x_{n+1}$ 的近似值相等时，该近似值即作为函数 $f(x)$ 的一个零点 $r$ 的近似值。下列说法正确的是 (  )

  A. $x_{n+1}=x_n+\frac{f(x_n)}{f^{\prime}(x_n)}\ (f^{\prime}(x_n)\neq0)$
  B. 利用牛顿迭代法求函数 $f(x)=x^3-6$ 的零点 $r$ 的近似值（精确到 0.1），取 $x_0=2$，需要作两条切线即可确定 $r$ 的近似值
  C. 利用二分法求函数 $f(x)=x^3-6$ 的零点 $r$ 的近似值（精确度为 0.1），给定初始区间为 $(1,2)$，需进行 4 次区间二分可得到零点 $r$ 的近似值
  D. 利用牛顿迭代法求函数 $f(x)=\ln x+2x-b\ (b>2)$ 的零点 $r$ 的近似值，任取 $x_0\in(1,r)$，总有 $x_n<x_{n+1}<r$
answer: |
  BCD

  对 A，切线方程为 $y-f(x_n)=f^{\prime}(x_n)(x-x_n)$，令 $y=0$ 得 $x_{n+1}=x_n-\frac{f(x_n)}{f^{\prime}(x_n)}$，所以 A 的加号错误。对 B，$f(x)=x^3-6$，$x_0=2$，两次切线给 $x_1=\frac{11}{6}\approx1.83$、$x_2=\frac{1979}{1089}\approx1.82$，二者四舍五入到 $0.1$ 位相同，故两条切线即可确定近似值，B 正确。对 C，二分法从 $(1,2)$ 依次缩到 $(\frac32,2)$、$(\frac74,2)$、$(\frac74,\frac{15}{8})$，三次后长度为 $\frac18=0.125$，第四次后长度小于 $0.1$，C 正确。对 D，$f(x)=\ln x+2x-b$ 是单调递增且上凸向下的函数；在 $x_n$ 处的切线 $h(x)$ 满足 $f(x)\le h(x)$，由切线零点 $x_{n+1}$ 可得 $f(x_{n+1})<0=f(r)$，所以 $x_{n+1}<r$；又 $x_n<r$ 时 $f(x_n)<0$、$f^{\prime}(x_n)>0$，于是 $x_{n+1}>x_n$，D 正确。故选 BCD。
