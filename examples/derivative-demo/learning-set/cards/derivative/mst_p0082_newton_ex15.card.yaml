solution:
  source_solution_summary: |
    对 A，切线方程为 $y-f(x_n)=f^{\prime}(x_n)(x-x_n)$，令 $y=0$ 得 $x_{n+1}=x_n-\frac{f(x_n)}{f^{\prime}(x_n)}$，所以 A 的加号错误。对 B，$f(x)=x^3-6$，$x_0=2$，两次切线给 $x_1=\frac{11}{6}\approx1.83$、$x_2=\frac{1979}{1089}\approx1.82$，二者四舍五入到 $0.1$ 位相同，故两条切线即可确定近似值，B 正确。对 C，二分法从 $(1,2)$ 依次缩到 $(\frac32,2)$、$(\frac74,2)$、$(\frac74,\frac{15}{8})$，三次后长度为 $\frac18=0.125$，第四次后长度小于 $0.1$，C 正确。对 D，$f(x)=\ln x+2x-b$ 是单调递增且上凸向下的函数；在 $x_n$ 处的切线 $h(x)$ 满足 $f(x)\le h(x)$，由切线零点 $x_{n+1}$ 可得 $f(x_{n+1})<0=f(r)$，所以 $x_{n+1}<r$；又 $x_n<r$ 时 $f(x_n)<0$、$f^{\prime}(x_n)>0$，于是 $x_{n+1}>x_n$，D 正确。故选 BCD。
  key_steps:
    - step_id: step_1
      statement: 由切线与 $x$ 轴交点推出牛顿迭代公式。
      formula_trace:
        from: |
          $y-f(x_n)=f^{\prime}(x_n)(x-x_n)$
        to: |
          $0-f(x_n)=f^{\prime}(x_n)(x_{n+1}-x_n)$，所以
          $x_{n+1}=x_n-\frac{f(x_n)}{f^{\prime}(x_n)}$
        operation: 令切线上的交点纵坐标 $y=0$，再解出横坐标 $x_{n+1}$。
        why: $x_{n+1}$ 的定义就是第 $n+1$ 条切线与 $x$ 轴交点的横坐标。
      source_ref: page_0082
    - step_id: step_2
      statement: 用通式判断 A 选项符号。
      formula_trace:
        from: |
          $x_{n+1}=x_n-\frac{f(x_n)}{f^{\prime}(x_n)}$
        to: |
          A 中 $x_{n+1}=x_n+\frac{f(x_n)}{f^{\prime}(x_n)}$ 错误
        operation: 把推得的减号公式与选项 A 的加号公式逐项比较。
        why: 切线交 $x$ 轴时要从当前横坐标减去 $\frac{f(x_n)}{f^{\prime}(x_n)}$。
      source_ref: page_0082
    - step_id: step_3
      statement: 计算 $x^3-6=0$ 从 $x_0=2$ 出发的前两次牛顿迭代。
      formula_trace:
        from: |
          $f(x)=x^3-6,\quad f^{\prime}(x)=3x^2,\quad x_0=2$
        to: |
          $x_1=2-\frac{2}{3\cdot4}=\frac{11}{6}\approx1.83$
        operation: 代入 $x_{n+1}=x_n-\frac{f(x_n)}{f^{\prime}(x_n)}$。
        why: 第一条切线交 $x$ 轴横坐标就是 $x_1$。
      source_ref: page_0082
    - step_id: step_4
      statement: 继续计算第二条切线给出的近似值。
      formula_trace:
        from: |
          $x_1=\frac{11}{6}$
        to: |
          $x_2=\frac{11}{6}-\frac{(\frac{11}{6})^3-6}{3(\frac{11}{6})^2}
          =\frac{1979}{1089}\approx1.82$
        operation: 把 $x_1$ 再代入牛顿迭代公式。
        why: 第二条切线得到 $x_2$，与 $x_1$ 的 $0.1$ 位近似值相同，可确定近似值。
      source_ref: page_0082
    - step_id: step_5
      statement: 用二分法区间长度判断 C 选项。
      formula_trace:
        from: |
          $f(1)=-5<0,\quad f(2)=2>0$
        to: |
          $(1,2)\to(\frac32,2)\to(\frac74,2)\to(\frac74,\frac{15}{8})$
        operation: 依次检验中点 $\frac32,\frac74,\frac{15}{8}$ 的函数值符号。
        why: 零点始终位于函数值异号的子区间内。
      source_ref: page_0083
    - step_id: step_6
      statement: 比较第三、第四次二分后的区间长度。
      formula_trace:
        from: |
          $\frac{15}{8}-\frac74=\frac18=0.125$
        to: |
          第四次二分后区间长度为 $\frac12\cdot\frac18=\frac1{16}<0.1$
        operation: 每二分一次区间长度减半。
        why: 精确度为 $0.1$ 时，区间长度小于 $0.1$ 即可锁定近似值所在区间。
      source_ref: page_0083
    - step_id: step_7
      statement: 为 D 选项写出切线函数并证明切线在图像上方。
      formula_trace:
        from: |
          $f(x)=\ln x+2x-b,\quad f^{\prime}(x_n)=\frac1{x_n}+2$
        to: |
          $h(x)=\frac{1+2x_n}{x_n}x+\ln x_n-b-1$
        operation: 把 $x_n$ 处的切线写成斜截式。
        why: $h(x)$ 是曲线在 $x_n$ 处的切线，$x_{n+1}$ 是 $h(x)$ 的零点。
      source_ref: page_0083
    - step_id: step_8
      statement: 用差函数证明 $f(x)\le h(x)$。
      formula_trace:
        from: |
          $F(x)=f(x)-h(x)=\ln x-\frac{x}{x_n}-\ln x_n+1$
        to: |
          $F^{\prime}(x)=\frac1x-\frac1{x_n}=\frac{x_n-x}{x_nx}$，且 $F(x)\le F(x_n)=0$
        operation: 按 $x<x_n$、$x>x_n$ 讨论 $F^{\prime}(x)$ 的符号。
        why: $F$ 在 $x_n$ 左增右减，所以 $x_n$ 是最大点，切线位于图像上方。
      source_ref: page_0083
    - step_id: step_9
      statement: 由切线零点推出 $x_{n+1}<r$。
      formula_trace:
        from: |
          $h(x_{n+1})=0,\quad f(x_{n+1})<h(x_{n+1}),\quad f(r)=0$
        to: |
          $f(x_{n+1})<0=f(r)$，所以 $x_{n+1}<r$
        operation: 利用 $f(x)\le h(x)$ 且非切点处严格小于切线，再用 $f$ 的单调递增性比较横坐标。
        why: $f^{\prime}(x)=\frac1x+2>0$，因此 $f$ 在 $(0,+\infty)$ 上严格递增。
      source_ref: page_0083
    - step_id: step_10
      statement: 由当前点在根左侧推出下一项更大。
      formula_trace:
        from: |
          $x_n<r,\quad f(x_n)<0,\quad f^{\prime}(x_n)>0$
        to: |
          $x_{n+1}=x_n-\frac{f(x_n)}{f^{\prime}(x_n)}>x_n$
        operation: 把 $f(x_n)$ 的负号和 $f^{\prime}(x_n)$ 的正号代入牛顿公式。
        why: 减去一个负数等于向右推进；结合上一步得到 $x_n<x_{n+1}<r$。
      source_ref: page_0083
teaching_card:
  student_title: 用切线交点一步步逼近零点
  what_it_trains: 训练把牛顿迭代的几何步骤翻译成递推公式，并能同时比较牛顿法、二分法和凹函数切线放缩下的逼近效果。
  recognition_cues:
    - 题干反复出现“切线与 $x$ 轴交点的横坐标”，应立即写 $y=0$ 推 $x_{n+1}$。
    - 选项 A 只差一个符号，要从切线方程原推一遍，不要记错公式。
    - 选项 B、C 都围绕“精确到 0.1”，一个看相邻迭代近似值，一个看二分区间长度。
    - 选项 D 中 $\ln x+2x-b$ 有 $f^{\prime}>0$ 且 $f^{\prime\prime}<0$，切线会压在图像上方。
  normalization_moves:
    - 先把切线点斜式改成 $x_{n+1}=x_n-\frac{f(x_n)}{f^{\prime}(x_n)}$。
    - 计算牛顿迭代时保留分数，再转小数判断精度。
    - 二分法每次只保留函数值异号的一半区间。
    - 证明迭代方向时，先证 $x_{n+1}<r$，再由 $f(x_n)<0$ 推 $x_{n+1}>x_n$。
  common_failures:
    - 把牛顿公式写成加号，导致 A 误判。
    - 只算出 $x_1$ 就认为作了一条切线够用，漏掉题中要比较 $x_1$ 与 $x_2$ 的近似值。
    - 二分法数次数时把初始区间也算作一次二分。
    - D 选项只看 $f^{\prime}>0$，没有证明切线零点仍在 $r$ 左侧。
  similar_practice_query: 牛顿迭代法 切线交 x 轴 二分法精确度 ln x+2x-b 递增逼近
