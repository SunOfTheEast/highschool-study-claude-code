    only_if_trace_shows:
      - 若学生不会由切线方程令 $y=0$ 解出 $x_{n+1}$，回补导数运算与几何意义。
      - 若学生在 $x^3-6$ 的迭代分数计算中出错，回补代数恒等变形。
      - 若学生不会用异号区间做二分法，回补函数性质与图像。
      - 若学生不能理解切线在 $\ln x+2x-b$ 图像上方，回补函数性质与图像。
      - 若学生不会判断 $\frac1x+2>0$ 导致 $f$ 单调递增，回补导数单调极值基础。
