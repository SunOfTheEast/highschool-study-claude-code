original_problem:
  stem: （2015 · 新课标 I）设函数 $f(x)=e^{2x}-a\ln x$。
  parts: *a1
  choices: []
  answer: (1) 当 $a\leqslant0$ 时，$f^{\prime}(x)$ 无零点；当 $a>0$ 时，$f^{\prime}(x)$ 有且仅有 1 个零点。 (2) 结论成立。
  fidelity_notes:
    - 第(2)问解答跨页：page_0210 页底起式，page_0211 页顶闭合。
    - source 在第(1)问使用“找大点/找小点”口径来证明存在零点。
solution:
  source_solution_summary: |
    由定义域知 $x>0$，且 $f^{\prime}(x)=2e^{2x}-\frac{a}{x}$。第(1)问分两类： 若 $a\le0$，则 $-\frac{a}{x}\ge0$，故 $f^{\prime}(x)>0$ 无零点； 若 $a>0$，则 $f^{\prime\prime}(x)>0$，故 $f^{\prime}(x)$ 递增。 source 取 $x=\frac a2$ 得 $f^{\prime}\!\left(\frac a2\right)>0$， 再用 $e^t<\frac1{1-t}$（$t<1$）在 $x=\frac{a}{2+2a}$ 处构造到 $f^{\prime}(x)<0$，故存在零点；结合递增性知零点唯一。 第(2)问将目标改写为 $e^{2x-\ln a}-\ln2x-2+\ln a\ge0$，令 $h(t)=e^t-t-1$，则该式等于 $h(2x-\ln a)+h(\ln2x)$，两项均非负，结论成立； 且取等需同时满足 $2x-\ln a=0,\ \ln2x=0$，即 $x=\frac12,\ a=e$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问先分 $a\le0$ 与 $a>0$ 两类。
      formula_trace:
        from: $f^{\prime}(x)=2e^{2x}-\frac{a}{x},\ x>0$
        to: 当 $a\le0$ 时 $f^{\prime}(x)>0$，无零点
        operation: 利用 $-\frac{a}{x}\ge0$ 与 $2e^{2x}>0$。
        why: 先快速排除一类参数。
      source_ref: page_0210_ex03_solution_head
    - step_id: step_2
      statement: 在 $a>0$ 下利用单调性锁定“至多一个零点”。
      formula_trace:
        from: $a>0$
        to: $f^{\prime\prime}(x)>0\Rightarrow f^{\prime}(x)$ 单调递增
        operation: 对 $f^{\prime}(x)$ 再求导并判符号。
        why: 递增性保证零点唯一性方向。
      source_ref: page_0210_ex03_solution_head
    - step_id: step_3
      statement: 找一正一负两点，完成零点存在性。
      formula_trace:
        from: $f^{\prime}(x)=2e^{2x}-\frac{a}{x}$
        to: $f^{\prime}\!\left(\frac a2\right)>0,\ f^{\prime}\!\left(\frac{a}{2+2a}\right)<0$
        operation: 先用 $e^{2x}>1$ 得正值点，再用 $e^{2x}<\frac1{1-2x}$（$x<\frac12$）构造负值点。
        why: 与 step_2 结合推出“有且仅有一个零点”。
      source_ref: page_0210_ex03_solution_head
    - step_id: step_4
      statement: 第(2)问先把目标改写到同构模板。
      formula_trace:
        from: $e^{2x}\ge a\ln x+2a+a\ln\frac2a$
        to: $e^{2x-\ln a}-\ln2x-2+\ln a\ge0$
        operation: 两边除以 $a(>0)$ 并合并对数项。
        why: 将不等式整理成 $e^u-u-1$ 可拼接结构。
      source_ref: page_0210_ex03_solution_head
    - step_id: step_5
      statement: 跨页收尾：用双 $h$ 函数并联判非负。
      formula_trace:
        from: $h(t)=e^t-t-1$
        to: $h(2x-\ln a)+h(\ln2x)=e^{2x-\ln a}-\ln2x+\ln a-2\ge0$
        operation: 把目标式拆成两个 $h$ 项并用 $h(t)\ge0$。
        why: 直接闭合第(2)问，并可同步读出取等条件。
      source_ref: page_0211_ex03_solution_continuation
teaching_card:
  student_title: 零点探路 + 双同构闭环
  what_it_trains: 训练先用导数单调性压缩零点个数，再用两点探路判存在，最后把指对不等式改写为母函数并联非负。
  recognition_cues:
    - 第一问是“导函数零点个数”，且表达式含指数与反比项。
    - 第二问目标带 $a\ln\frac2a$，通常要做对数合并与同构配凑。
    - 题目显式给出参数正负分界（$a\le0$ / $a>0$）。
  normalization_moves:
    - 先判 $f^{\prime\prime}(x)$ 单调性，再去找正负样本点。
    - 用 $e^{2x}>1$ 与 $e^{2x}<\frac1{1-2x}$ 双向放缩定点。
    - 把目标式拆为 $h(2x-\ln a)+h(\ln2x)$。
  common_failures:
    - 只证“有零点”却漏掉“唯一性”所需的单调性。
    - 在 $x=\frac{a}{2+2a}$ 处代入化简出错，导致符号判断失败。
    - 第(2)问对数合并时把 $\ln2x$ 与 $\ln x$ 混写。
  similar_practice_query: e2x alnx 导函数零点个数 找点放缩 同构保值性
