stem: |-
  （2023 · 山东模拟）已知函数 $f(x)=a(x+1)^2-e^x$，$a\in\mathbf{R}$。若 $f(x)$ 有两个极值点 $x_1,x_2$，且 $x_1<x_2$。
  1. 证明：$-\frac12<f(x_1)<-\frac1e$。
answer: |-
  $-\frac12<f(x_1)<-\frac1e$。

  由 $f$ 有两个极值点可知 $f^\prime(x)=2a(x+1)-e^x$ 有两个根 $x_1,x_2$。令 $h(x)=2a(x+1)-e^x$，则 $h^\prime(x)=2a-e^x$。若 $a\le0$，$h$ 单调递减，不可能有两个根；若 $a>0$， $h$ 先增后减，要有两个根需最大值为正，推出 $a>\frac12$。 此时 $f^\prime(-1)=-\frac1e<0$，$f^\prime(0)=2a-1>0$， 所以 $-1<x_1<0$。因为 $x_1$ 是第一个极值点，且在 $(-1,x_1)$ 上 $f$ 递减，故 $f(x_1)<f(-1)=-\frac1e$，这是原函数找点。另一方面， 由 $f^\prime(x_1)=0$ 得 $a=\frac{e^{x_1}}{2(x_1+1)}$，代回 $f(x_1)=a(x_1+1)^2-e^{x_1} =\frac12(x_1-1)e^{x_1}$。令 $q(x)=\frac12(x-1)e^x$，则 $q^\prime(x)=\frac12xe^x<0$ 在 $(-1,0)$ 上成立，所以 $q(x_1)>q(0)=-\frac12$。综上 $-\frac12<f(x_1)<-\frac1e$。
