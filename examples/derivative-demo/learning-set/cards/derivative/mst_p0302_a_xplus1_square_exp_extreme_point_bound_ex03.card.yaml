original_problem:
  stem: （2023 · 山东模拟）已知函数 $f(x)=a(x+1)^2-e^x$，$a\in\mathbf{R}$。若 $f(x)$ 有两个极值点 $x_1,x_2$，且 $x_1<x_2$。
  parts: *a1
  choices: []
  answer: $-\frac12<f(x_1)<-\frac1e$。
  fidelity_notes:
    - 无选项。
    - $x_1$ 是较小的极值点，对应 $f^\prime$ 的第一个零点。
solution:
  source_solution_summary: 由 $f$ 有两个极值点可知 $f^\prime(x)=2a(x+1)-e^x$ 有两个根 $x_1,x_2$。令 $h(x)=2a(x+1)-e^x$，则 $h^\prime(x)=2a-e^x$。若 $a\le0$，$h$ 单调递减，不可能有两个根；若 $a>0$， $h$ 先增后减，要有两个根需最大值为正，推出 $a>\frac12$。 此时 $f^\prime(-1)=-\frac1e<0$，$f^\prime(0)=2a-1>0$， 所以 $-1<x_1<0$。因为 $x_1$ 是第一个极值点，且在 $(-1,x_1)$ 上 $f$ 递减，故 $f(x_1)<f(-1)=-\frac1e$，这是原函数找点。另一方面， 由 $f^\prime(x_1)=0$ 得 $a=\frac{e^{x_1}}{2(x_1+1)}$，代回 $f(x_1)=a(x_1+1)^2-e^{x_1} =\frac12(x_1-1)e^{x_1}$。令 $q(x)=\frac12(x-1)e^x$，则 $q^\prime(x)=\frac12xe^x<0$ 在 $(-1,0)$ 上成立，所以 $q(x_1)>q(0)=-\frac12$。综上 $-\frac12<f(x_1)<-\frac1e$。
  key_steps:
    - step_id: step_1
      statement: 把两个极值点转成导函数两个零点。
      formula_trace:
        from: $f(x)=a(x+1)^2-e^x$
        to: $f^\prime(x)=2a(x+1)-e^x$ 有两个根
        operation: 求导。
        why: 极值点来自导函数零点。
      source_ref: page_0302_ex03_solution
    - step_id: step_2
      statement: 推出参数必须满足 $a>\frac12$。
      formula_trace:
        from: $h(x)=2a(x+1)-e^x,\quad h^\prime(x)=2a-e^x$
        to: $a>\frac12$
        operation: 分析 $h$ 先增后减并要求最大值为正。
        why: 这保证两个导数零点存在。
      source_ref: page_0302_ex03_solution
    - step_id: step_3
      statement: 定位较小极值点 $x_1$。
      formula_trace:
        from: $f^\prime(-1)=-\frac1e<0,\quad f^\prime(0)=2a-1>0$
        to: $-1<x_1<0$
        operation: 用变号和零点顺序。
        why: 后面估 $f(x_1)$ 需要知道 $x_1$ 的区间。
      source_ref: page_0302_ex03_solution
    - step_id: step_4
      statement: 用原函数找点证明右侧上界。
      formula_trace:
        from: $-1<x_1<0$ 且 $x_1$ 为第一个极值点
        to: $f(x_1)<f(-1)=-\frac1e$
        operation: 利用 $f$ 在 $(-1,x_1)$ 上递减。
        why: 要证明 $f(x_1)$ 小于某个值，直接在原函数上找更高的点。
      source_ref: page_0302_ex03_solution
    - step_id: step_5
      statement: 用隐零点方程改写 $f(x_1)$。
      formula_trace:
        from: $f^\prime(x_1)=2a(x_1+1)-e^{x_1}=0$
        to: $a=\frac{e^{x_1}}{2(x_1+1)}$
        operation: 解出参数 $a$。
        why: 把 $f(x_1)$ 中的参数消掉。
      source_ref: page_0302_ex03_solution
    - step_id: step_6
      statement: 证明左侧下界。
      formula_trace:
        from: $f(x_1)=\frac12(x_1-1)e^{x_1}$
        to: $f(x_1)>-\frac12$
        operation: 设 $q(x)=\frac12(x-1)e^x$，在 $(-1,0)$ 上递减。
        why: $x_1<0$，所以 $q(x_1)>q(0)$。
      source_ref: page_0302_ex03_solution
teaching_card:
  student_title: 极值点函数值的两边估
  what_it_trains: 训练同一个极值点函数值，一边用原函数找点，另一边用导数零点方程消参。
  recognition_cues:
    - 题目直接给 $f$ 有两个极值点。
    - 要估的是较小极值点 $x_1$ 的函数值。
    - $f^\prime(x_1)=0$ 能把参数 $a$ 消掉。
    - 右界 $-\frac1e$ 来自原函数上的点 $x=-1$。
  normalization_moves:
    - 先判断 $a>\frac12$，不是为了求范围，而是为了定位 $x_1$。
    - 不要把两个不等号混成一个办法。
    - 证明 $f(x_1)<-\frac1e$ 时看原函数。
    - 证明 $f(x_1)>-\frac12$ 时看消参后的新函数。
  common_failures:
    - 忘记证明 $-1<x_1<0$。
    - 把 $f(x_1)<f(-1)$ 的单调方向看反。
    - 代回 $a$ 时漏掉 $x_1+1$。
    - 把 $q(x)$ 在 $(-1,0)$ 上递减的结论用反。
  similar_practice_query: a(x+1)^2-e^x 两个极值点 x1 原函数找点 隐零点消参
