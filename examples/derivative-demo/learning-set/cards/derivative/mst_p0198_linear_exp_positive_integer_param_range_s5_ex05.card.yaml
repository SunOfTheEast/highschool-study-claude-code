stem: |-
  （2024 · 西安模拟）已知函数 $f(x)=a(x+1)e^x-x$，若存在唯一的正整数 $x_0$，使得 $f(x_0)<0$，则实数 $a$ 的取值范围是（  ）
  A. $\left[-\frac{1}{2e},\frac{3}{4e^3}\right)$
  B. $\left[\frac{3}{4e^3},\frac{2}{3e^2}\right)$
  C. $\left[\frac{2}{3e^2},\frac{1}{2e}\right)$
  D. $\left[\frac{1}{2e},\frac{1}{2}\right)$
answer: |-
  C

  由 $f(x)=a(x+1)e^x-x$，条件 $f(x_0)<0$ 等价于 $a(x+1)<\frac{x}{e^x}$。令 $h(x)=a(x+1)$， $g(x)=\frac{x}{e^x}$，则需“存在唯一正整数 $x$ 使 $h(x)<g(x)$”。 因 $g'(x)=\frac{1-x}{e^x}$，$g$ 在 $x=1$ 取最大值 $\frac1e$，且在 $(1,+\infty)$ 单调递减。若 $a\le0$，则对任意正整数 $x$ 有 $h(x)\le0<g(x)$，不满足唯一性，故 $a>0$。此时 $h$ 单调递增，要使仅 $x=1$ 满足不等式，需 $h(1)<g(1)$ 且 $h(2)\ge g(2)$，即 $2a<\frac1e,\ 3a\ge\frac2{e^2}$，得到 $\frac{2}{3e^2}\le a<\frac1{2e}$，故选 C。
