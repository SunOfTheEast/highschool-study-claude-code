      text_latex: $\left[-\frac{1}{2e},\frac{3}{4e^3}\right)$
    - label: B
      text_raw: $\left[\frac{3}{4e^3},\frac{2}{3e^2}\right)$
      text_latex: $\left[\frac{3}{4e^3},\frac{2}{3e^2}\right)$
    - label: C
      text_raw: $\left[\frac{2}{3e^2},\frac{1}{2e}\right)$
      text_latex: $\left[\frac{2}{3e^2},\frac{1}{2e}\right)$
    - label: D
      text_raw: $\left[\frac{1}{2e},\frac{1}{2}\right)$
      text_latex: $\left[\frac{1}{2e},\frac{1}{2}\right)$
  answer: C
  fidelity_notes:
    - 源题为单选题，A-D 选项已按原页完整转录。
    - “唯一的正整数”是判定条件核心，后续用 $x=1,2$ 的分界实现唯一性。
solution:
  source_solution_summary: 由 $f(x)=a(x+1)e^x-x$，条件 $f(x_0)<0$ 等价于 $a(x+1)<\frac{x}{e^x}$。令 $h(x)=a(x+1)$， $g(x)=\frac{x}{e^x}$，则需“存在唯一正整数 $x$ 使 $h(x)<g(x)$”。 因 $g'(x)=\frac{1-x}{e^x}$，$g$ 在 $x=1$ 取最大值 $\frac1e$，且在 $(1,+\infty)$ 单调递减。若 $a\le0$，则对任意正整数 $x$ 有 $h(x)\le0<g(x)$，不满足唯一性，故 $a>0$。此时 $h$ 单调递增，要使仅 $x=1$ 满足不等式，需 $h(1)<g(1)$ 且 $h(2)\ge g(2)$，即 $2a<\frac1e,\ 3a\ge\frac2{e^2}$，得到 $\frac{2}{3e^2}\le a<\frac1{2e}$，故选 C。
  key_steps:
    - step_id: step_1
      statement: 把“唯一正整数使 $f(x)<0$”改写成函数大小比较。
      formula_trace:
        from: $a(x+1)e^x-x<0$
        to: $a(x+1)<\frac{x}{e^x}$
        operation: 移项并除以恒正的 $e^x$，再记 $h(x)=a(x+1)$、$g(x)=\frac{x}{e^x}$。
        why: 把含参数不等式转成“直线与曲线在整数点的相对位置”问题。
      source_ref: page_0198_solution
    - step_id: step_2
      statement: 先定出 $g(x)$ 的单峰结构并排除 $a\le0$。
      formula_trace:
        from: $g^{\prime}(x)=\frac{1-x}{e^x}$
        to: $g(1)=\frac1e,\ g\text{ 在 }(1,+\infty)\text{ 递减；且 }a\le0\Rightarrow h(x)\le0<g(x)$
        operation: 用导数判单调与极大值，再比较符号。
        why: 若 $a\le0$ 会有无穷多个正整数满足 $h(x)<g(x)$，与“唯一”矛盾。
      source_ref: page_0198_solution
    - step_id: step_3
      statement: 在 $a>0$ 下把“唯一正整数”压成 $x=1,2$ 两个阈值条件。
      formula_trace:
        from: $a>0,\ h(x)=a(x+1)\text{ 递增},\ g(x)\text{ 在 }x\ge1\text{ 递减}$
        to: $h(1)<g(1),\ h(2)\ge g(2)$
        operation: 利用一增一减：若在 $x=1$ 成立且从 $x=2$ 起不成立，则仅 $x=1$ 命中。
        why: 这正是“存在唯一正整数解”的充要整数判定。
      source_ref: page_0198_solution
    - step_id: step_4
      statement: 解阈值不等式得到参数区间。
      formula_trace:
        from: $2a<\frac1e,\ 3a\ge\frac2{e^2}$
        to: $\frac{2}{3e^2}\le a<\frac1{2e}$
        operation: 分别解两个一次不等式并取交集。
        why: 对应选项 C。
      source_ref: page_0198_solution
teaching_card:
  student_title: 唯一正整数条件先卡住 $x=1,2$
  what_it_trains: 训练把“唯一整数解”题先做参变量分离，再用一增一减图像在相邻整数点做阈值判定。
  recognition_cues:
    - 题干含“存在唯一的正整数 $x_0$”。
    - 式子可整理成“线性函数 $a(x+1)$ 与 $x/e^x$ 比较”。
    - 源图给出过定点直线与单峰曲线的相对位置。
  normalization_moves:
    - 先写 $a(x+1)<\frac{x}{e^x}$。
    - 再判 $g(x)=x/e^x$ 的峰值位置 $x=1$。
    - 在 $a>0$ 下用 $x=1,2$ 两个整数点锁定唯一性。
    - 最后解出区间并核对端点开闭。
  common_failures:
    - 忘记先分 $a\le0$ 与 $a>0$。
    - 把“唯一正整数”误写成“唯一实数解”。
    - 只写 $h(1)<g(1)$，漏掉 $h(2)\ge g(2)$。
    - 端点写成 $(\frac{2}{3e^2},\frac1{2e}]$，开闭反了。
  similar_practice_query: 唯一正整数 参数范围 a(x+1) 与 x/e^x 比较 x=1 x=2 阈值
