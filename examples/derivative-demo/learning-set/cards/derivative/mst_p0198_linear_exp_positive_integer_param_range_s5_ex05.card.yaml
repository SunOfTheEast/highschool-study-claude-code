original_problem:
  stem: （2024 · 西安模拟）已知函数 $f(x)=a(x+1)e^x-x$，若存在唯一的正整数 $x_0$，使得 $f(x_0)<0$，则实数 $a$ 的取值范围是（  ）
  parts: *a1
  choices:
    - label: A
