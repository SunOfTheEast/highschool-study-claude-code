stem: |-
  已知函数 f(x)=e^x-e^{-x}-2x。
  (1). 讨论 f(x) 的单调性。
  (2). 设 g(x)=f(2x)-4b f(x)，当 x>0 时，g(x)>0，求 b 的最大值。
  (3). 已知 1.4142<\sqrt2<1.4143，估计 \ln2 的近似值（精确到 0.001）。
answer: |-
  (1) f(x) 在 \mathbf{R} 上为增函数；(2) b 的最大值为 2； (3) \ln2\approx0.693。

  第 (1) 问由 f'(x)=e^x+e^{-x}-2\geqslant0 且等号只在 x=0 取得，得 f 在 \mathbf{R} 上递增。第 (2) 问展开 g(x)=e^{2x}-e^{-2x}-4b(e^x-e^{-x})+(8b-4)x，求导后因式分解为 2(e^x+e^{-x}-2)(e^x+e^{-x}+2-2b)。当 b\leqslant2 时 g'(x)>0 且 g(0)=0，故 x>0 时 g(x)>0；当 b>2 时，0 右侧存在区间使 g'(x)<0， 从而 g(x)<0，矛盾，所以 b_{\max}=2。第 (3) 问代入 x=\ln\sqrt2， 用 b=2 得下界 \ln2>0.6928，再取临界 b=\frac{3\sqrt2}{4}+1>2 得上界 \ln2<0.6934，因此 \ln2 精确到 0.001 为 0.693。
