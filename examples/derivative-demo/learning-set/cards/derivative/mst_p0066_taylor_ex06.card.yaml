original_problem:
  stem: 已知函数 f(x)=e^x-e^{-x}-2x。
  parts: *a1
  choices: []
  answer: (1) f(x) 在 \mathbf{R} 上为增函数；(2) b 的最大值为 2； (3) \ln2\approx0.693。
  fidelity_notes:
    - 例 6 的题头和函数定义在 page_0066，三问及完整解析在 page_0067。
    - 原题无选择项；源解另附 Taylor 端点效应说明和 \ln\frac{1+x}{1-x} 的近似说明，本卡纳入解题结构。
solution:
  source_solution_summary: 第 (1) 问由 f'(x)=e^x+e^{-x}-2\geqslant0 且等号只在 x=0 取得，得 f 在 \mathbf{R} 上递增。第 (2) 问展开 g(x)=e^{2x}-e^{-2x}-4b(e^x-e^{-x})+(8b-4)x，求导后因式分解为 2(e^x+e^{-x}-2)(e^x+e^{-x}+2-2b)。当 b\leqslant2 时 g'(x)>0 且 g(0)=0，故 x>0 时 g(x)>0；当 b>2 时，0 右侧存在区间使 g'(x)<0， 从而 g(x)<0，矛盾，所以 b_{\max}=2。第 (3) 问代入 x=\ln\sqrt2， 用 b=2 得下界 \ln2>0.6928，再取临界 b=\frac{3\sqrt2}{4}+1>2 得上界 \ln2<0.6934，因此 \ln2 精确到 0.001 为 0.693。
  key_steps:
    - step_id: step_1
      statement: 由 f'(x) 的非负性判断 f 的单调性。
      formula_trace:
        from: f(x)=e^x-e^{-x}-2x
        to: f'(x)=e^x+e^{-x}-2\geqslant2\sqrt{e^x e^{-x}}-2=0
        operation: 求导后使用基本不等式 e^x+e^{-x}\geqslant2。
        why: 等号只在 e^x=e^{-x} 即 x=0 时成立，导数非负且不在区间内恒为 0， 可判定 f 在 \mathbf{R} 上递增。
      source_ref: page_0067_solution
    - step_id: step_2
      statement: 展开 g 并完成导数因式分解。
      formula_trace:
        from: g(x)=f(2x)-4b f(x)
        to: g'(x)=2(e^x+e^{-x}-2)(e^x+e^{-x}+2-2b)
        operation: 先写出 g(x)=e^{2x}-e^{-2x}-4b(e^x-e^{-x})+(8b-4)x，再求导整理。
        why: 因式 e^x+e^{-x}-2 的符号固定，参数 b 只影响第二个因式。
      source_ref: page_0067_solution
    - step_id: step_3
      statement: b\leqslant2 时证明 g(x)>0。
      formula_trace:
        from: x>0\Rightarrow e^x+e^{-x}>2,\quad b\leqslant2
        to: g'(x)>0,\quad g(0)=0,\quad x>0\Rightarrow g(x)>0
        operation: 用两个因式同为正判断 g' 的符号。
        why: g 从 0 开始在右侧递增，所以满足题设。
      source_ref: page_0067_solution
    - step_id: step_4
      statement: b>2 时构造 0 右侧反例。
      formula_trace:
        from: b>2,\quad 2<e^x+e^{-x}<2b-2
        to: g'(x)<0,\quad 0<x\leqslant\ln(b-1+\sqrt{b^2-2b})\Rightarrow g(x)<0
        operation: 解 e^x+e^{-x}<2b-2 并取 0 右侧满足条件的 x。
        why: 一旦 g 在 0 右侧先下降，就与“所有 x>0 有 g(x)>0”矛盾。
      source_ref: page_0067_solution
    - step_id: step_5
      statement: 用 Taylor 端点效应解释临界值 b=2。
      formula_trace:
        from: f(x)=e^x-e^{-x}-2x=\frac{x^3}{3}+\frac{x^5}{60}+\cdots
        to: f(2x)-4bf(x)=\frac{(2x)^3}{3}-4b\frac{x^3}{3}+\cdots =\frac{4(2-b)}{3}x^3+\cdots
        operation: 展开 f(2x) 与 f(x) 的三阶主项并比较系数。
        why: 0 点附近三阶项刚好给出 b\leqslant2 的端点。
      source_ref: page_0067_solution
    - step_id: step_6
      statement: 把 x=\ln\sqrt2 代入 g，得到含 \ln2 的表达式。
      formula_trace:
        from: x=\ln\sqrt2,\quad e^x=\sqrt2,\quad e^{2x}=2
        to: g(\ln\sqrt2)=\frac32-2\sqrt2\,b+2(2b-1)\ln2
        operation: 将指数项化为 \sqrt2 和 2，并合并线性项。
        why: 题目给了 \sqrt2 的近似值，代入 \ln\sqrt2=\frac12\ln2 可以夹逼 \ln2。
      source_ref: page_0067_solution
    - step_id: step_7
      statement: 用 b=2 的可行性给出 \ln2 下界。
      formula_trace:
        from: b=2:\quad g(\ln\sqrt2)=\frac32-4\sqrt2+6\ln2>0
        to: \ln2>\frac{8\sqrt2-3}{12}>\frac{8\cdot1.4142-3}{12}=0.6928
        operation: 解关于 \ln2 的不等式，并代入 \sqrt2 的下界。
        why: b=2 时 g(x)>0 对 x>0 成立，所以可得到可靠下界。
      source_ref: page_0067_solution
    - step_id: step_8
      statement: 用 b>2 的反例边界给出 \ln2 上界。
      formula_trace:
        from: \ln(b-1+\sqrt{b^2-2b})=\ln\sqrt2
        to: b=\frac{3\sqrt2}{4}+1,\quad \ln2<\frac{18+\sqrt2}{28}<\frac{18+1.4143}{28}<0.6934
        operation: 令反例区间右端等于 \ln\sqrt2，代入 g(\ln\sqrt2)<0 后解出上界。
        why: 这个 b 已经大于 2，源解的 b>2 反例机制给出反向不等式。
      source_ref: page_0067_solution
    - step_id: step_9
      statement: 合并上下界得到三位小数近似值。
      formula_trace:
        from: 0.6928<\ln2<0.6934
        to: \ln2\approx0.693
        operation: 按精确到 0.001 四舍五入。
        why: 整个区间落在 0.693 的千分位舍入范围内。
      source_ref: page_0067_solution
teaching_card:
  student_title: 用双曲函数的端点效应估算 \ln2
  what_it_trains: 训练把参数恒成立题中的临界函数继续拿来做数值夹逼，理解 Taylor 三阶主项为什么决定 b=2。
  recognition_cues:
    - f(x)=e^x-e^{-x}-2x 出现，说明 0 点三阶主项是核心。
    - g(x)=f(2x)-4bf(x) 让 f(2x) 与 f(x) 的三阶主项可直接比较。
    - 题目给 \sqrt2 的小数范围，暗示代入 x=\ln\sqrt2。
  normalization_moves:
    - 展开 g 后把 g' 写成两个因式，先解决 b 的临界值。
    - 将 \ln\sqrt2=\frac12\ln2 代入同一个 g，转成 \ln2 的线性不等式。
    - 用一个可行 b 和一个不可行 b 的边界分别夹住 \ln2。
  common_failures:
    - 把 f'(x)\geqslant0 当成只有非严格单调，忽略导数只在孤立点为 0。
    - 对 b>2 只说“不符合”而没有给出 0 右侧 g'(x)<0 的区间。
    - 代入 x=\ln\sqrt2 时把 e^{-2x} 或线性项算错。
    - 得到 0.6928<\ln2<0.6934 后没有按 0.001 精度判断。
  similar_practice_query: 双曲正弦 Taylor 三阶主项、g=f(2x)-cf(x) 端点效应、代入 \ln\sqrt2 估算 \ln2。
quality:
  confidence: high
  needs_review: false
  review_notes:
    - page_0067 markdown 的 e^t 是转写小误差；页图和数学上下文可直接确定为 e^x。
