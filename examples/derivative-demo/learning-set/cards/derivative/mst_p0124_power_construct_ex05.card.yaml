stem: |-
  （24-25高二下·天津和平·阶段练习）已知 $f(x)$ 为 $(0,+\infty)$ 上的可导函数，且 $(x+1)\cdot f'(x)>f(x)$，则下列不等式一定成立的是（  ）
  A. $3f(4)<4f(3)$
  B. $4f(4)<5f(3)$
  C. $3f(3)<4f(2)$
  D. $3f(3)>4f(2)$
answer: |
  D

  设
  \[
  h(x)=\frac{f(x)}{x+1},\quad x>0.
  \]
  则
  \[
  h'(x)=\frac{(x+1)f'(x)-f(x)}{(x+1)^2}.
  \]
  由题设 $(x+1)f'(x)>f(x)$ 得 $h'(x)>0$，故 $h$ 在 $(0,+\infty)$ 上递增。
  因而
  \[
  h(4)>h(3)\Rightarrow \frac{f(4)}5>\frac{f(3)}4\Rightarrow 4f(4)>5f(3),
  \]
  所以 B 错；又
  \[
  h(3)>h(2)\Rightarrow \frac{f(3)}4>\frac{f(2)}3\Rightarrow 3f(3)>4f(2),
  \]
  所以 D 对、C 错。A 无法由已知推出，故选 D。
