stem: |-
  （2025 新课标 II 卷第 18 题）已知 $f(x)=\ln(1+x)-x+\frac12x^2-kx^3$，$0<k<\frac13$。
  1. 证明：$f(x)$ 在 $(0,+\infty)$ 存在唯一极值点和唯一零点。
  2. 设 $x_1,x_2$ 为 $f(x)$ 在 $(0,+\infty)$ 的极值点和零点；设 $g(t)=f(x_1+t)-f(x_1-t)$，证明：$g(t)$ 在 $(0,x_1)$ 单调递减。
  3. 比较 $2x_1$ 与 $x_2$ 的大小，并证明。
answer: |-
  唯一极值点 $x_1=\frac1{3k}-1$，唯一零点 $x_2$；$g(t)$ 在 $(0,x_1)$ 单调递减，且 $2x_1>x_2$。

  先求导： $f^\prime(x)=\frac{1}{1+x}-1+x-3kx^2 =\frac{x^2[1-3k(x+1)]}{1+x}$。因 $x>0$ 时 $\frac{x^2}{1+x}>0$，导数符号只由 $1-3k(x+1)$ 决定，故 $f$ 在 $(0,\frac1{3k}-1)$ 上递增，在 $(\frac1{3k}-1,+\infty)$ 上递减，唯一极值点为 $\frac1{3k}-1$。又 $f(0)=0$，极值点左侧 $f>0$；在右侧取 $x=\frac1{2k}$，由 $\ln(1+x)-x<0$ 得 $f(\frac1{2k})<0$，所以有且仅有一个正零点。第(2)问 source 令极值点为 $x_1$，零点为 $x_2$，用 $g(t)=f(x_1+t)-f(x_1-t)$ 比较极值点两侧。经真题核对，第(2)(i)应证明 $g$ 单调递减；解析推出 $g^\prime(t)<0$，并由 $g(x_1)<g(0)$ 得 $f(2x_1)<0=f(x_2)$，再利用 $f$ 在右侧递减， 得 $2x_1>x_2$。
