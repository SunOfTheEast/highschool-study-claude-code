original_problem:
  stem: （2025 新课标 II 卷第 18 题）已知 $f(x)=\ln(1+x)-x+\frac12x^2-kx^3$，$0<k<\frac13$。
  parts: *a1
  choices: []
  answer: 唯一极值点 $x_1=\frac1{3k}-1$，唯一零点 $x_2$；$g(t)$ 在 $(0,x_1)$ 单调递减，且 $2x_1>x_2$。
  fidelity_notes:
    - 三问综合题，无选项。
    - 本地页第(2)(i)题干与解析方向冲突；经联网核对 2025 新高考Ⅱ卷真题，题干应为“单调递减”。
solution:
  source_solution_summary: 先求导： $f^\prime(x)=\frac{1}{1+x}-1+x-3kx^2 =\frac{x^2[1-3k(x+1)]}{1+x}$。因 $x>0$ 时 $\frac{x^2}{1+x}>0$，导数符号只由 $1-3k(x+1)$ 决定，故 $f$ 在 $(0,\frac1{3k}-1)$ 上递增，在 $(\frac1{3k}-1,+\infty)$ 上递减，唯一极值点为 $\frac1{3k}-1$。又 $f(0)=0$，极值点左侧 $f>0$；在右侧取 $x=\frac1{2k}$，由 $\ln(1+x)-x<0$ 得 $f(\frac1{2k})<0$，所以有且仅有一个正零点。第(2)问 source 令极值点为 $x_1$，零点为 $x_2$，用 $g(t)=f(x_1+t)-f(x_1-t)$ 比较极值点两侧。经真题核对，第(2)(i)应证明 $g$ 单调递减；解析推出 $g^\prime(t)<0$，并由 $g(x_1)<g(0)$ 得 $f(2x_1)<0=f(x_2)$，再利用 $f$ 在右侧递减， 得 $2x_1>x_2$。
  key_steps:
    - step_id: step_1
      statement: 把导数化成一个线性判号因子。
      formula_trace:
        from: $f(x)=\ln(1+x)-x+\frac12x^2-kx^3$
        to: $f^\prime(x)=\frac{x^2[1-3k(x+1)]}{1+x}$
        operation: 求导并通分分解。
        why: 这样导数符号只看 $1-3k(x+1)$。
      source_ref: page_0244_ex21_part1_start
    - step_id: step_2
      statement: 确定唯一极值点。
      formula_trace:
        from: $1-3k(x+1)=0$
        to: $x_E=\frac1{3k}-1$
        operation: 解导数变号点。
        why: $0<k<\frac13$ 保证 $x_E>0$，且导数从正到负。
      source_ref: page_0244_ex21_part1_start
    - step_id: step_3
      statement: 用放缩取点证明右侧一定穿过 $x$ 轴。
      formula_trace:
        from: $\ln(1+x)-x<0$
        to: $f(\frac1{2k})<\frac12(\frac1{2k})^2-k(\frac1{2k})^3=0$
        operation: 在右侧取显点并放缩。
        why: 极值点右侧函数递减，从正值到负值，只能有一个零点。
      source_ref: page_0245_ex21_part1_continuation
    - step_id: step_4
      statement: 围绕极值点构造偏移函数。
      formula_trace:
        from: $g(t)=f(x_1+t)-f(x_1-t)$
        to: $g^\prime(t)=f^\prime(x_1+t)+f^\prime(x_1-t)$
        operation: 对极值点左右两侧差值求导。
        why: 这是比较右侧零点和 $2x_1$ 的偏移入口。
      source_ref: page_0245_ex21_offset_solution
    - step_id: step_5
      statement: 按解析链路，$g(t)$ 实际为递减。
      formula_trace:
        from: $f^\prime(x_1+s)=\frac{(x_1+s)^2[-3ks]}{1+x_1+s}$
        to: $g^\prime(t)<0,\quad 0<t<x_1$
        operation: 代入 $s=t$ 和 $s=-t$ 后比较极值点两侧。
        why: 右侧同距离处下降更快，体现极值点偏移。
      source_ref: page_0245_ex21_offset_solution
    - step_id: step_6
      statement: 由偏移关系推出零点位置。
      formula_trace:
        from: $g(x_1)<g(0)$
        to: $f(2x_1)-f(0)<0$，即 $f(2x_1)<0$
        operation: 取 $t=x_1$ 并利用 $f(0)=0$。
        why: 若 $2x_1$ 处已经低于 $x$ 轴，则它在右侧零点之后。
      source_ref: page_0245_ex21_offset_solution
    - step_id: step_7
      statement: 利用极值点右侧单调递减比较横坐标。
      formula_trace:
        from: $f(2x_1)<f(x_2)=0$
        to: $2x_1>x_2$
        operation: 在 $(x_1,+\infty)$ 上用函数递减反推横坐标。
        why: 右侧越往右函数值越小。
      source_ref: page_0245_ex21_offset_solution
teaching_card:
  student_title: 用极值点偏移比较零点位置
  what_it_trains: 训练先找极值点和零点，再围绕极值点比较左右两侧函数值，从而判断零点落在 $2x_1$ 的哪一边。
  recognition_cues:
    - 导数能化成 $x^2[1-3k(x+1)]/(1+x)$，极值点显式可写。
    - 题目同时问极值点和零点的位置关系。
    - 出现 $f(x_1+t)$ 与 $f(x_1-t)$，说明要看极值点左右偏移。
    - 结论比较 $2x_1$ 和 $x_2$，本质是在问 $x_2$ 是否超过极值点的对称位置。
  normalization_moves:
    - 先把导数判号做到一眼看出唯一极值点。
    - 用 $\ln(1+x)-x<0$ 找右侧负值点，保证唯一零点。
    - 把 $x_1$ 当成极值点中心，构造左右差函数。
    - 用右侧单调递减把函数值比较翻译成横坐标比较。
  common_failures:
    - 只算出极值点，不知道怎么证明唯一零点。
    - 看到 $g(t)$ 就硬算，没意识到它在比较极值点两侧。
    - 把右侧递减时的函数值大小和横坐标大小关系反了。
    - 沿用本地页“OCR/录入为递增”的错误题面，导致证明方向反掉。
  similar_practice_query: 极值点偏移 ln(1+x)-x 放缩取点 唯一零点 2x1 与 x2 比较
quality:
  confidence: high
  needs_review: false
