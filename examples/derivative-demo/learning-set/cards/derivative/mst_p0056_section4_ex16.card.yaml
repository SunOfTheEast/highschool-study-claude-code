solution:
  source_solution_summary: |
    $f^{\prime}(x)=3x^2-1$，导数在 $x=\pm\frac{\sqrt3}{3}$ 处为零，且符号为“增-减-增”，所以有两个极值点，A 正确。两个极值值
    $f\left(-\frac{\sqrt3}{3}\right)=\frac{2\sqrt3+9}{9}>0$，
    $f\left(\frac{\sqrt3}{3}\right)=\frac{9-2\sqrt3}{9}>0$，因此三次函数只在右侧穿过一次 $x$ 轴，只有一个零点，B 错误。又 $f(x)+f(-x)=2$，曲线关于 $(0,1)$ 成中心对称，C 正确。若 $y=2x$ 是切线，切点横坐标 $a$ 应满足 $f^{\prime}(a)=2$，得 $a=\pm1$；但 $f(1)=1\ne2$，$f(-1)=1\ne-2$，对应点不在直线 $y=2x$ 上，D 错误。故选 AC。
  key_steps:
    - step_id: step_1
      statement: 用导数判断极值点个数。
      formula_trace:
        from: $f(x)=x^3-x+1$
        to: $f^{\prime}(x)=3x^2-1,\quad f^{\prime}(x)=0\Rightarrow x=\pm\frac{\sqrt3}{3}$
        operation: 求导并解导数零点。
        why: 极值点候选来自导数为零的位置。
      source_ref: page_0056_ex16_solution
    - step_id: step_2
      statement: 比较两个极值值，排除三个零点。
      formula_trace:
        from: $f\left(-\frac{\sqrt3}{3}\right)=\frac{2\sqrt3+9}{9},\quad f\left(\frac{\sqrt3}{3}\right)=\frac{9-2\sqrt3}{9}$
        to: $f(x)\ \text{有两个极值点，但只有一个零点}$
        operation: 结合导数符号“增-减-增”和两个极值值都大于 0。
        why: 三次函数若极大值和极小值都在 $x$ 轴上方，就不会有三个实零点。
      source_ref: page_0056_ex16_solution
    - step_id: step_3
      statement: 用代数配对识别对称中心。
      formula_trace:
        from: $f(x)+f(-x)$
        to: $x^3-x+1-x^3+x+1=2$
        operation: 把横坐标关于 0 对称的两点函数值相加。
        why: 若和恒为 $2$，则中点纵坐标恒为 $1$，中心为 $(0,1)$。
      source_ref: page_0056_ex16_solution
    - step_id: step_4
      statement: 检验直线 $y=2x$ 是否能成为切线。
      formula_trace:
        from: $f^{\prime}(a)=2$
        to: $a=\pm1,\quad f(1)=1\ne2,\quad f(-1)=1\ne-2$
        operation: 先由切线斜率等于 2 求切点横坐标，再检查切点是否在直线 $y=2x$ 上。
        why: 斜率相同只是必要条件，点也必须落在给定直线上。
      source_ref: page_0056_ex16_solution
teaching_card:
  student_title: 三次函数选项题要逐项验条件
  what_it_trains: 训练把导数、零点、中心对称和切线条件拆开核验，避免把“斜率对了”误当作“切线成立”。
  recognition_cues:
    - 函数是标准三次式 $x^3-x+1$。
    - 选项同时问极值、零点、对称中心和切线。
    - 给定直线 $y=2x$，需要找可能切点。
  normalization_moves:
    - 先求导并列出导数符号。
    - 算两个极值值，判断是否能有三个零点。
    - 用 $f(x)+f(-x)$ 找中心。
    - 切线先看斜率，再看切点是否在直线上。
  common_failures:
    - 看到两个极值点就误以为一定有三个零点。
    - 把 $f(x)+f(-x)=2$ 的中心纵坐标写成 2。
    - 检验切线时漏掉 $f(a)=2a$。
  similar_practice_query: 三次函数 多选 极值 零点 对称中心 切线
