stem: |-
  （2022 · 新高考 I · 多选）已知函数 $f(x)=x^3-x+1$，则（  ）
  A. $f(x)$ 有两个极值点
  B. $f(x)$ 有三个零点
  C. 点 $(0,1)$ 是曲线 $y=f(x)$ 的对称中心
  D. 直线 $y=2x$ 是曲线 $y=f(x)$ 的切线
answer: |
  AC

  $f^{\prime}(x)=3x^2-1$，导数在 $x=\pm\frac{\sqrt3}{3}$ 处为零，且符号为“增-减-增”，所以有两个极值点，A 正确。两个极值值
  $f\left(-\frac{\sqrt3}{3}\right)=\frac{2\sqrt3+9}{9}>0$，
  $f\left(\frac{\sqrt3}{3}\right)=\frac{9-2\sqrt3}{9}>0$，因此三次函数只在右侧穿过一次 $x$ 轴，只有一个零点，B 错误。又 $f(x)+f(-x)=2$，曲线关于 $(0,1)$ 成中心对称，C 正确。若 $y=2x$ 是切线，切点横坐标 $a$ 应满足 $f^{\prime}(a)=2$，得 $a=\pm1$；但 $f(1)=1\ne2$，$f(-1)=1\ne-2$，对应点不在直线 $y=2x$ 上，D 错误。故选 AC。
