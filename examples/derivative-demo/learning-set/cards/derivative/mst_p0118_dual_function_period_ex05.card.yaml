stem: |-
  （2024 · 广陵区月考 · 多选）已知函数 $f(x)$ 及其导函数 $f^{\prime}(x)$ 的定义域均为 $\\mathbf{R}$，且满足 $f(x)=2-f(6-x)$，$f^{\prime}(x)=2-f^{\prime}(4-x)$，$f^{\prime}(3)=-1$，$g(x)=f(3-x)+5$，则 $\\sum_{i=1}^{18} g^{\prime}(k)=$（  ）
  A. $-18$
  B. $-20$
  C. $88$
  D. $90$
answer: |
  B

  由 $f(x)=2-f(6-x)$ 得
  $f^{\prime}(x)=f^{\prime}(6-x)$，所以 $f^{\prime}$ 关于 $x=3$ 轴对称。
  又 $f^{\prime}(x)=2-f^{\prime}(4-x)$，即
  $f^{\prime}(x)+f^{\prime}(4-x)=2$，说明 $f^{\prime}$ 关于点 $(2,1)$ 中心对称。
  轴对称与中心对称叠加可得周期 $4$，故 $f^{\prime},f$ 都以 $4$ 为周期。
  由 $g(x)=f(3-x)+5$ 得
  $g^{\prime}(x)=-f^{\prime}(3-x)$，再用
  $f^{\prime}(3-x)+f^{\prime}(1+x)=2$ 得
  $g^{\prime}(x)=f^{\prime}(1+x)-2$。
  于是
  \[
    \sum_{k=1}^{18}g^{\prime}(k)
    =\sum_{k=1}^{18}\bigl(f^{\prime}(k+1)-2\bigr)
    =\sum_{j=2}^{19}f^{\prime}(j)-36.
  \]
  源页给出 $f^{\prime}(2)=f^{\prime}(4)=\cdots=f^{\prime}(18)=1$、
  $f^{\prime}(2)+f^{\prime}(3)+f^{\prime}(4)+f^{\prime}(5)=4$，按周期分组可得
  $\sum_{j=2}^{19}f^{\prime}(j)=16$，故总和为 $16-36=-20$，选 B。
