solution:
  source_solution_summary: |
    由 $f(x)=2-f(6-x)$ 得
    $f^{\prime}(x)=f^{\prime}(6-x)$，所以 $f^{\prime}$ 关于 $x=3$ 轴对称。
    又 $f^{\prime}(x)=2-f^{\prime}(4-x)$，即
    $f^{\prime}(x)+f^{\prime}(4-x)=2$，说明 $f^{\prime}$ 关于点 $(2,1)$ 中心对称。
    轴对称与中心对称叠加可得周期 $4$，故 $f^{\prime},f$ 都以 $4$ 为周期。
    由 $g(x)=f(3-x)+5$ 得
    $g^{\prime}(x)=-f^{\prime}(3-x)$，再用
    $f^{\prime}(3-x)+f^{\prime}(1+x)=2$ 得
    $g^{\prime}(x)=f^{\prime}(1+x)-2$。
    于是
    \[
      \sum_{k=1}^{18}g^{\prime}(k)
      =\sum_{k=1}^{18}\bigl(f^{\prime}(k+1)-2\bigr)
      =\sum_{j=2}^{19}f^{\prime}(j)-36.
    \]
    源页给出 $f^{\prime}(2)=f^{\prime}(4)=\cdots=f^{\prime}(18)=1$、
    $f^{\prime}(2)+f^{\prime}(3)+f^{\prime}(4)+f^{\prime}(5)=4$，按周期分组可得
    $\sum_{j=2}^{19}f^{\prime}(j)=16$，故总和为 $16-36=-20$，选 B。
  key_steps:
    - step_id: step_1
      statement: 用两条函数关系锁定 $f^{\prime}$ 的轴对称与中心对称。
      formula_trace:
        from: |
          $f(x)=2-f(6-x),\qquad f^{\prime}(x)=2-f^{\prime}(4-x)$
        to: |
          $f^{\prime}(x)=f^{\prime}(6-x),\qquad f^{\prime}(x)+f^{\prime}(4-x)=2$
        operation: 第一式求导；第二式直接改写为和为常数。
        why: 分别对应“关于 $x=3$ 轴对称”和“关于 $(2,1)$ 中心对称”。
      source_ref: page_0118
    - step_id: step_2
      statement: 由双对称叠加得到周期 $4$。
      formula_trace:
        from: $f^{\prime}$ 关于 $x=3$ 对称且关于 $(2,1)$ 对称
        to: $f^{\prime}(x+4)=f^{\prime}(x)$
        operation: 利用轴对称与中心对称间距为 1 的组合周期结论。
        why: 周期性是后续分组求和的主干。
      source_ref: page_0118
    - step_id: step_3
      statement: 把 $g^{\prime}$ 化为 $f^{\prime}$，再转为等差平移索引求和。
      formula_trace:
        from: |
          $g(x)=f(3-x)+5,\quad g^{\prime}(x)=-f^{\prime}(3-x),\quad f^{\prime}(3-x)+f^{\prime}(1+x)=2$
        to: |
          $g^{\prime}(x)=f^{\prime}(1+x)-2,\quad
          \sum_{k=1}^{18}g^{\prime}(k)=\sum_{j=2}^{19}f^{\prime}(j)-36$
        operation: 先用链式求导，再以对称恒等式代换。
        why: 将目标和式统一到一个周期函数 $f^{\prime}$ 上。
      source_ref: page_0118
    - step_id: step_4
      statement: 按周期分组计算并得出选项。
      formula_trace:
        from: $f^{\prime}(2)+f^{\prime}(3)+f^{\prime}(4)+f^{\prime}(5)=4$，且周期为 4
        to: $\sum_{j=2}^{19}f^{\prime}(j)=16,\ \sum_{k=1}^{18}g^{\prime}(k)=16-36=-20$
        operation: 把 18 项拆成 4 个完整周期加 2 项并求和。
        why: 周期和固定后，求和可快速收敛到常数。
      source_ref: page_0118
teaching_card:
  student_title: 双对称先出周期，再做导函数平移求和
  what_it_trains: 训练在双函数场景下把“对称关系→周期→分组求和”串成一条稳定计算链。
  recognition_cues:
    - 题干同时给 $f(x)$ 与 $f^{\prime}(x)$ 的对称关系，优先尝试合成周期。
    - 目标是 $\\sum g^{\prime}(k)$，应先把 $g^{\prime}$ 统一改写成 $f^{\prime}$。
    - 给出单点值 $f^{\prime}(3)=-1$ 与周期关系，通常是为周期块求和服务。
  normalization_moves:
    - 先把 $f$ 关系求导，提取 $f^{\prime}$ 对称信息。
    - 由双对称判周期 4。
    - 用 $g^{\prime}(x)=-f^{\prime}(3-x)$ 与对称恒等式化成 $f^{\prime}(1+x)-2$。
    - 把长和式按周期分组后一次算完。
  common_failures:
    - 把 $[f(6-x)]^{\prime}$ 的负号漏掉。
    - 只得到对称，不继续提炼周期。
    - 把 $g^{\prime}(x)=-f^{\prime}(3-x)$ 错写成 $f^{\prime}(3-x)$。
    - 周期分组时把端点 $2,19$ 的对应项错配。
  similar_practice_query: 双函数 导函数 对称 周期 求和 g^{\prime}(k)
