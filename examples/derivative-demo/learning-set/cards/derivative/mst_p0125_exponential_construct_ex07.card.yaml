stem: |-
  （2024·南关区月考）定义域为 $\mathbf{R}$ 的函数 $f(x)$ 的导函数记作 $f'(x)$，满足 $f'(x)-f(x)>3e^x$，$f(2)=6e^2$，则不等式 $f(x)>3xe^x$ 的解集为（  ）
  A. $(2,+\infty)$
  B. $(-\infty,2)$
  C. $(3,+\infty)$
  D. $(-\infty,3)$
answer: |
  A

  令
  \[
  G(x)=\frac{f(x)}{e^x}-3x.
  \]
  则
  \[
  G'(x)=\frac{f'(x)-f(x)}{e^x}-3>\frac{3e^x}{e^x}-3=0,
  \]
  所以 $G(x)$ 在 $\\mathbf{R}$ 上单调递增。又由 $f(2)=6e^2$ 得
  \[
  G(2)=\frac{f(2)}{e^2}-3\\cdot2=6-6=0.
  \]
  原不等式
  \[
  f(x)>3xe^x
  \]
  等价于
  \[
  \frac{f(x)}{e^x}-3x>0,
  \]
  即 $G(x)>G(2)$。由 $G$ 递增得 $x>2$，故解集 $(2,+\\infty)$，选 A。
