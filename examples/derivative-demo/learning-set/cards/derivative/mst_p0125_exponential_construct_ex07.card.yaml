solution:
  source_solution_summary: |
    令
    \[
    G(x)=\frac{f(x)}{e^x}-3x.
    \]
    则
    \[
    G'(x)=\frac{f'(x)-f(x)}{e^x}-3>\frac{3e^x}{e^x}-3=0,
    \]
    所以 $G(x)$ 在 $\\mathbf{R}$ 上单调递增。又由 $f(2)=6e^2$ 得
    \[
    G(2)=\frac{f(2)}{e^2}-3\\cdot2=6-6=0.
    \]
    原不等式
    \[
    f(x)>3xe^x
    \]
    等价于
    \[
    \frac{f(x)}{e^x}-3x>0,
    \]
    即 $G(x)>G(2)$。由 $G$ 递增得 $x>2$，故解集 $(2,+\\infty)$，选 A。
  key_steps:
    - step_id: step_1
      statement: 将目标式标准化为“构造函数大于0”。
      formula_trace:
        from: $f(x)>3xe^x$
        to: $\frac{f(x)}{e^x}-3x>0$
        operation: 两边除以正数 $e^x$。
        why: 直接提示构造 $G(x)=\frac{f(x)}{e^x}-3x$。
      source_ref: page_0125
    - step_id: step_2
      statement: 利用题设判定 $G$ 递增。
      formula_trace:
        from: $f'(x)-f(x)>3e^x$
        to: $G'(x)=\frac{f'(x)-f(x)}{e^x}-3>0$
        operation: 对 $G$ 求导并代入题设。
        why: 得到全实数范围的单调递增。
      source_ref: page_0125
    - step_id: step_3
      statement: 用已知点值确定比较基准。
      formula_trace:
        from: $f(2)=6e^2$
        to: $G(2)=0$
        operation: 代入 $x=2$。
        why: 将目标不等式转成 $G(x)>G(2)$。
      source_ref: page_0125
    - step_id: step_4
      statement: 由递增性还原解集。
      formula_trace:
        from: $G(x)>G(2)$
        to: $x>2$
        operation: 递增函数值比较等价为自变量比较。
        why: 对应选项 A。
      source_ref: page_0125
teaching_card:
  student_title: 把 $f(x)>3xe^x$ 化成递增函数过零点
  what_it_trains: 将指数型不等式转为标准比较函数，再借助给定点值一键求解区间。
  recognition_cues:
    - 题设给的是 $f'(x)-f(x)$ 与 $e^x$ 的比较。
    - 题干额外给 $f(2)$，通常用于构造函数定点。
  normalization_moves:
    - 将目标式除以 $e^x$。
    - 设 $G=\frac{f}{e^x}-3x$ 并判 $G'>0$。
    - 求 $G(2)$ 并用 $G(x)>G(2)$ 解出 $x>2$。
  common_failures:
    - 漏掉构造中的 $-3x$。
    - 把 $G'(x)$ 误写成 $\frac{f'(x)-f(x)-3}{e^x}$。
    - 把严格不等式误写成含端点。
  similar_practice_query: 抽象函数 f'-f>3e^x 指数商函数 不等式解集
