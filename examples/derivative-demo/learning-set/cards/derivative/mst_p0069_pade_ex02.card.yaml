original_problem:
  stem: （2016 · 新课标 II）已知函数 $f(x)=(x+1)\ln x-a(x-1)$。若当 $x\in(1,+\infty)$ 时，$f(x)>0$，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\leqslant2$。
  fidelity_notes:
    - 题干从 page_0069 底部开始，并在 page_0070 顶部续完。
    - 本题无选择项，choices 保持为空列表。
solution:
  source_solution_summary: 源页先指出 $f(1)=0$，因此要让 $x>1$ 时 $f(x)>0$，右端点附近不能先下降。求导得 $f^{\prime\prime}(x)=\frac{x-1}{x^2}>0$，所以 $f^{\prime}(x)$ 在 $(1,+\infty)$ 上递增，且 $f^{\prime}(1)=2-a$。若 $a\le2$，则 $f^{\prime}(x)>f^{\prime}(1)\ge0$，$f$ 递增并有 $f(x)>f(1)=0$；若 $a>2$，则 $f^{\prime}(1)<0$，函数在 $1$ 右侧先减小，会出现 $f(x)<0$，与题意矛盾，所以 $a\le2$。
  key_steps:
    - step_id: step_1
      statement: 识别端点效应：端点函数值正好为零。
      formula_trace:
        from: $f(x)=(x+1)\ln x-a(x-1)$
        to: $f(1)=0$
        operation: 代入 $x=1$，利用 $\ln1=0$。
        why: 题设要求 $x>1$ 时 $f(x)>0$，也就是右侧函数值必须高于端点值 $f(1)$。
      source_ref: page_0070
    - step_id: step_2
      statement: 用二阶导数判断一阶导数的变化。
      formula_trace:
        from: $f^{\prime}(x)=1+\frac1x+\ln x-a$
        to: $f^{\prime\prime}(x)=\frac{x-1}{x^2}>0\quad(x>1)$
        operation: 对 $f^{\prime}(x)$ 再求导，并利用 $x>1$ 判断符号。
        why: $f^{\prime\prime}(x)>0$ 说明 $f^{\prime}(x)$ 在 $(1,+\infty)$ 上单调递增，可以由 $f^{\prime}(1)$ 控制右侧趋势。
      source_ref: page_0070
    - step_id: step_3
      statement: 求出端点右侧导数门槛。
      formula_trace:
        from: $f^{\prime}(x)=1+\frac1x+\ln x-a$
        to: $f^{\prime}(1)=2-a,\quad f^{\prime}(x)>f^{\prime}(1)=2-a\ (x>1)$
        operation: 代入 $x=1$，并用 $f^{\prime}$ 递增得到右侧严格大于端点导数。
        why: $2-a$ 的符号决定端点右侧是直接上升还是先下降。
      source_ref: page_0070
    - step_id: step_4
      statement: 证明 $a\le2$ 时条件成立。
      formula_trace:
        from: $a\le2,\quad f^{\prime}(x)>f^{\prime}(1)=2-a\ge0$
        to: $f(x)>f(1)=0\quad(x>1)$
        operation: 由 $f^{\prime}(x)>0$ 得 $f$ 在 $(1,+\infty)$ 上单调递增，再与端点值比较。
        why: 这给出参数范围 $a\le2$ 的充分性。
      source_ref: page_0070
    - step_id: step_5
      statement: 证明 $a>2$ 时必然违背题意。
      formula_trace:
        from: $a>2,\quad f^{\prime}(1)=2-a<0$
        to: $\exists x_1\in(1,+\infty),\ f(x_1)<0$
        operation: 源页取 $x=e^{a-1}$ 得 $f^{\prime}(e^{a-1})>0$，由 $f^{\prime}$ 递增可得存在 $x_0$ 使 $f^{\prime}(x_0)=0$；于是 $f$ 在 $(1,x_0)$ 上先递减。
        why: 从 $f(1)=0$ 出发右侧先递减，就会在某点低于 $0$，与“任意 $x>1$ 都有 $f(x)>0$”矛盾。
      source_ref: page_0070
    - step_id: step_6
      statement: 合并充分性和必要性。
      formula_trace:
        from: $a\le2$ 成立，$a>2$ 不成立
        to: $a\le2$
        operation: 排除不满足题意的参数，并保留已证明满足的参数。
        why: 这就是题目所求的完整取值范围。
      source_ref: page_0070
teaching_card:
  student_title: 看端点导数判断对数函数是否先下降
  what_it_trains: 训练恒成立参数题里的端点效应：先找临界端点，再用导数单调性判断右侧能不能保持在端点上方。
  recognition_cues:
    - 题设区间是 $(1,+\infty)$，而函数在 $x=1$ 处自然有 $f(1)=0$。
    - 目标是 $f(x)>0$，等价于右侧始终高于端点值。
    - 求导后 $f^{\prime\prime}(x)=\frac{x-1}{x^2}$ 在 $x>1$ 恒正，导函数趋势很干净。
  normalization_moves:
    - 先代入端点 $x=1$ 得 $f(1)=0$。
    - 求出 $f^{\prime}(x)$ 和 $f^{\prime\prime}(x)$，确认 $f^{\prime}$ 递增。
    - 用 $f^{\prime}(1)=2-a$ 把参数分成 $a\le2$ 与 $a>2$。
    - 对 $a>2$，说明右侧先下降会让 $f(x)$ 低于 $0$。
  common_failures:
    - 只看 $f^{\prime}(x)$ 的表达式，没有先抓住 $f(1)=0$ 这个端点。
    - 把 $f^{\prime}(x)>f^{\prime}(1)$ 误读成 $f^{\prime}(x)$ 一定为正，漏掉 $a>2$ 情况。
    - 证明 $a\le2$ 成立后就停笔，没有说明 $a>2$ 会矛盾。
    - 在 $a>2$ 时只说 $f^{\prime}(1)<0$，却没有用连续性或单调性推出右侧存在负值。
  similar_practice_query: 端点效应 $(x+1)\ln x-a(x-1)$ 恒正 参数范围 $f(1)=0$ $f^{\prime\prime}>0$
