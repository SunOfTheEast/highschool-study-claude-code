stem: （2016 · 新课标 II）已知函数 $f(x)=(x+1)\ln x-a(x-1)$。若当 $x\in(1,+\infty)$ 时，$f(x)>0$，求 $a$ 的取值范围。
answer: |-
  $a\leqslant2$。

  源页先指出 $f(1)=0$，因此要让 $x>1$ 时 $f(x)>0$，右端点附近不能先下降。求导得 $f^{\prime\prime}(x)=\frac{x-1}{x^2}>0$，所以 $f^{\prime}(x)$ 在 $(1,+\infty)$ 上递增，且 $f^{\prime}(1)=2-a$。若 $a\le2$，则 $f^{\prime}(x)>f^{\prime}(1)\ge0$，$f$ 递增并有 $f(x)>f(1)=0$；若 $a>2$，则 $f^{\prime}(1)<0$，函数在 $1$ 右侧先减小，会出现 $f(x)<0$，与题意矛盾，所以 $a\le2$。
