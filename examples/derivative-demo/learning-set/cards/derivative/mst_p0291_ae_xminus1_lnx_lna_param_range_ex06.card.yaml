stem: |-
  （2020 · 新高考山东卷）已知函数 $f(x)=ae^{x-1}-\ln x+\ln a$。若 $f(x)\ge1$，求 $a$ 的取值范围。
  1. 求使 $f(x)\ge1$ 恒成立的 $a$ 的取值范围。
answer: |-
  $a\ge1$。

  令 $h(x)=ae^{x-1}-\ln x+\ln a-1$。隐点探路联立 $h(x_0)=0,h^\prime(x_0)=0$。由 $h^\prime(x_0)=ae^{x_0-1}-\frac1{x_0}=0$ 得 $a=\frac1{x_0e^{x_0-1}}$；代回 $h(x_0)=0$ 得 $\frac1{x_0}-2\ln x_0-x_0=0$。source 称其为飘带函数，只在 $x_0=1$ 成立，于是候选取等点是 $x=1$。必要性为 $h(1)=a+\ln a-1\ge0$，由于 $a+\ln a$ 在 $a>0$ 上递增，得到 $a\ge1$。充分性：当 $a\ge1$ 时， $f(x)=ae^{x-1}-\ln x+\ln a\ge e^{x-1}-\ln x\ge x-\ln x\ge1$， 所以答案是 $a\ge1$。
