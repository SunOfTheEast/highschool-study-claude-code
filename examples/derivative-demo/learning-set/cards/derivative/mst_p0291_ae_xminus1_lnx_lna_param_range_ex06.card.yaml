original_problem:
  stem: （2020 · 新高考山东卷）已知函数 $f(x)=ae^{x-1}-\ln x+\ln a$。若 $f(x)\ge1$，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\ge1$。
  fidelity_notes:
    - 无选项。
    - 题目默认 $a>0$，否则 $\ln a$ 无定义。
solution:
  source_solution_summary: 令 $h(x)=ae^{x-1}-\ln x+\ln a-1$。隐点探路联立 $h(x_0)=0,h^\prime(x_0)=0$。由 $h^\prime(x_0)=ae^{x_0-1}-\frac1{x_0}=0$ 得 $a=\frac1{x_0e^{x_0-1}}$；代回 $h(x_0)=0$ 得 $\frac1{x_0}-2\ln x_0-x_0=0$。source 称其为飘带函数，只在 $x_0=1$ 成立，于是候选取等点是 $x=1$。必要性为 $h(1)=a+\ln a-1\ge0$，由于 $a+\ln a$ 在 $a>0$ 上递增，得到 $a\ge1$。充分性：当 $a\ge1$ 时， $f(x)=ae^{x-1}-\ln x+\ln a\ge e^{x-1}-\ln x\ge x-\ln x\ge1$， 所以答案是 $a\ge1$。
  key_steps:
    - step_id: step_1
      statement: 把恒成立写成 $h(x)\ge0$。
      formula_trace:
        from: $f(x)\ge1$
        to: $h(x)=ae^{x-1}-\ln x+\ln a-1\ge0$
        operation: 移项构造目标函数。
        why: 方便用取等点和导数为零探路。
      source_ref: page_0291_ex06_solution
    - step_id: step_2
      statement: 联立隐点条件探路。
      formula_trace:
        from: $h(x_0)=0,\quad h^\prime(x_0)=0$
        to: $a=\frac1{x_0e^{x_0-1}},\quad \frac1{x_0}-2\ln x_0-x_0=0$
        operation: 由导数方程消去参数 $a$。
        why: 这是双位置参数隐点效应：先找到可能取等的隐藏点。
      source_ref: page_0291_ex06_solution
    - step_id: step_3
      statement: 由飘带函数锁定 $x_0=1$。
      formula_trace:
        from: $\frac1{x_0}-2\ln x_0-x_0=0$
        to: $x_0=1$
        operation: 使用 source 所说的飘带函数判定唯一取等点。
        why: 取等点确定后，参数必要条件也随之确定。
      source_ref: page_0291_ex06_solution
    - step_id: step_4
      statement: 用 $x=1$ 给出必要条件。
      formula_trace:
        from: $h(1)=a+\ln a-1$
        to: $a+\ln a\ge1,\quad a\ge1$
        operation: 代入取等点并利用单调性。
        why: $a+\ln a$ 在 $a>0$ 上递增，且 $a=1$ 时等于 $1$。
      source_ref: page_0291_ex06_solution
    - step_id: step_5
      statement: 证明 $a\ge1$ 的充分性。
      formula_trace:
        from: $f(x)=ae^{x-1}-\ln x+\ln a$
        to: $f(x)\ge e^{x-1}-\ln x\ge x-\ln x\ge1$
        operation: 用 $a\ge1$、$\ln a\ge0$ 和 $e^{x-1}\ge x$。
        why: 补齐答案范围的充分性。
      source_ref: page_0291_ex06_solution
teaching_card:
  student_title: 用隐点把 $a$ 锁到 1
  what_it_trains: 训练带 $\ln a$ 的恒成立求参题，先用隐点条件找取等位置，再把必要性和充分性分开证明。
  recognition_cues:
    - 函数里既有 $ae^{x-1}$，又有 $\ln a$。
    - 题目是全体 $x>0$ 上的下界恒成立。
    - 取等点不能直接看出来，需要联立 $h=0,h^\prime=0$。
    - source 明确把这一节叫“双位置参数”。
  normalization_moves:
    - 先构造 $h=f-1$。
    - 用 $h^\prime(x_0)=0$ 表示 $a$。
    - 代回 $h(x_0)=0$ 找 $x_0=1$。
    - 最后用基础放缩证明 $a\ge1$ 足够。
  common_failures:
    - 把 source 的 $f^\prime(x)=a+\ln a$ 当真，忽略它实际是 $f(1)$。
    - 只用取等点得到必要性，漏写充分性。
    - 不知道为什么 $a>0$ 是默认条件。
    - 不会把 $e^{x-1}\ge x$ 接到 $x-\ln x\ge1$。
  similar_practice_query: ae^{x-1}-lnx+lna >=1 参数范围 双位置参数 隐点探路 x0=1
