stem: |-
  下列四个命题：① $\ln5<\sqrt5\ln2$；② $\ln\pi>\sqrt{\frac\pi e}$；③ $2^{\sqrt{11}}<11$；④ $3e\ln2>4\sqrt2$；其中真命题的个数是（ ）
  A. 1
  B. 2
  C. 3
  D. 4
answer: |
  B

  设模板函数
  \[
  f(x)=\frac{\ln x}{x}.
  \]
  ① 若 $\ln5<\sqrt5\ln2$，则
  \[
  \frac{\ln\sqrt5}{\sqrt5}<\frac{\ln2}{2}.
  \]
  但 $2<\sqrt5<e$ 且 $f$ 在 $(0,e)$ 递增，应有
  \[
  \frac{\ln\sqrt5}{\sqrt5}>\frac{\ln2}{2},
  \]
  矛盾，所以①假。
  ②
  \[
  \frac{\ln\pi}{\sqrt\pi}
  =
  \frac{2\ln\sqrt\pi}{\sqrt\pi}
  >
  \frac{2\ln\sqrt e}{\sqrt e}
  =
  \frac1{\sqrt e},
  \]
  （因 $\sqrt e<\sqrt\pi<e$，在增区比较），故
  \[
  \ln\pi>\sqrt{\frac\pi e},
  \]
  ②真。
  ③ 比较 $2^{\sqrt{11}}$ 与 $11=(\sqrt{11})^2$，等价比较
  \[
  \frac{\ln2}{2}\ \text{与}\ \frac{\ln\sqrt{11}}{\sqrt{11}}.
  \]
  源解用 $f(2)=f(4)$：
  \[
  \frac{\ln2}{2}=\frac{\ln4}{4}<\frac{\ln\sqrt{11}}{\sqrt{11}},
  \]
  故 $2^{\sqrt{11}}<11$，③真。
  ④ 比较 $3e\ln2$ 与 $4\sqrt2$，等价比较
  \[
  \frac{\ln\sqrt8}{\sqrt8}\ \text{与}\ \frac1e.
  \]
  由于 $f(x)$ 最大值为 $\frac1e$，有
  \[
  \frac{\ln\sqrt8}{\sqrt8}<\frac1e,
  \]
  得 $3e\ln2<4\sqrt2$，故④假。
  综上真命题为②③，共 2 个，选 B。
