stem: |-
  （2024 · 新高考一卷 18 题）$f(x)=\ln\frac{x}{2-x}+ax+b(x-1)^3$。
  1. 若 $b=0$，$f^\prime(x)\ge0$，求 $a$ 的取值范围。
  2. 证明：$f(x)$ 是中心对称图形。
  3. $f(x)>-2$，当且仅当 $1<x<2$ 时成立，求 $b$ 的范围。
answer: |-
  第(1)问：$a\ge-2$。第(2)问：图像关于 $(1,a)$ 中心对称。第(3)问：$b\ge-\frac23$。

  第(1)问在 $b=0$ 时， $f^\prime(x)=\frac1x+\frac1{2-x}+a$，而 $\frac1x+\frac1{2-x}$ 在 $x=1$ 处最小为 2，所以 $a\ge-2$。第(2)问直接算 $f(x)+f(2-x)=2a$，故图像关于 $(1,a)$ 中心对称。第(3)问由 “$f(x)>-2$ 当且仅当 $1<x<2$” 和连续性锁定 $a=-2$。令 $t=x-1$，得 $h(t)=\ln\frac{1+t}{1-t}-2t+bt^3$，需要 $h(t)>0$ 当且仅当 $0<t<1$。由于 $h$ 是奇函数，只需处理右侧。近零展开 $h(t)=(b+\frac23)t^3+O(t^5)$，必要条件为 $b\ge-\frac23$；当 $b\ge-\frac23$ 时，source 用 $h'''(t)=\frac2{(1+t)^3}+\frac2{(1-t)^3}+6b$ 及四阶导正性推出 $h'''$、$h''$、$h'$、$h$ 在 $(0,1)$ 上逐级非负，从而充分。
