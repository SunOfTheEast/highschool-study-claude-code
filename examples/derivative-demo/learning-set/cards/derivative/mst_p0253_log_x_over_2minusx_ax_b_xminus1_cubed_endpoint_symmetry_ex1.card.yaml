original_problem:
  stem: （2024 · 新高考一卷 18 题）$f(x)=\ln\frac{x}{2-x}+ax+b(x-1)^3$。
  parts: *a1
  choices: []
  answer: 第(1)问：$a\ge-2$。第(2)问：图像关于 $(1,a)$ 中心对称。第(3)问：$b\ge-\frac23$。
  fidelity_notes:
    - 三问综合题，无选项。
    - 第(3)问 source 末尾的 $b$ 范围符号有误，卡片按前文推导和局部展开修正。
solution:
  source_solution_summary: 第(1)问在 $b=0$ 时， $f^\prime(x)=\frac1x+\frac1{2-x}+a$，而 $\frac1x+\frac1{2-x}$ 在 $x=1$ 处最小为 2，所以 $a\ge-2$。第(2)问直接算 $f(x)+f(2-x)=2a$，故图像关于 $(1,a)$ 中心对称。第(3)问由 “$f(x)>-2$ 当且仅当 $1<x<2$” 和连续性锁定 $a=-2$。令 $t=x-1$，得 $h(t)=\ln\frac{1+t}{1-t}-2t+bt^3$，需要 $h(t)>0$ 当且仅当 $0<t<1$。由于 $h$ 是奇函数，只需处理右侧。近零展开 $h(t)=(b+\frac23)t^3+O(t^5)$，必要条件为 $b\ge-\frac23$；当 $b\ge-\frac23$ 时，source 用 $h'''(t)=\frac2{(1+t)^3}+\frac2{(1-t)^3}+6b$ 及四阶导正性推出 $h'''$、$h''$、$h'$、$h$ 在 $(0,1)$ 上逐级非负，从而充分。
  key_steps:
    - step_id: step_1
      statement: 第(1)问用导数最小值。
      formula_trace:
        from: $f^\prime(x)=\frac1x+\frac1{2-x}+a$
        to: $\min(\frac1x+\frac1{2-x})=2$
        operation: 用均值或求导求最小值。
        why: $f^\prime(x)\ge0$ 等价于 $a\ge-2$。
      source_ref: page_0253_ex1_part1_part2_solution
    - step_id: step_2
      statement: 第(2)问直接配对 $x$ 和 $2-x$。
      formula_trace:
        from: $f(x)+f(2-x)$
        to: $2a$
        operation: 代入并相加。
        why: 函数值和恒定，说明关于 $(1,a)$ 中心对称。
      source_ref: page_0253_ex1_part1_part2_solution
    - step_id: step_3
      statement: 第(3)问先由端点锁定 $a=-2$。
      formula_trace:
        from: $f(x)>-2$ 当且仅当 $1<x<2$
        to: $f(1)=-2$，所以 $a=-2$
        operation: 用连续性和端点效应。
        why: $x=1$ 是开区间边界，函数值必须贴住临界水平。
      source_ref: page_0253_ex1_part3_start
    - step_id: step_4
      statement: 平移到中心点。
      formula_trace:
        from: $x-1=t$
        to: $h(t)=\ln\frac{1+t}{1-t}-2t+bt^3$
        operation: 令 $t=x-1$。
        why: 把中心对称结构变成奇函数结构。
      source_ref: page_0253_ex1_part3_start
    - step_id: step_5
      statement: 用近零展开得到必要条件。
      formula_trace:
        from: $\ln\frac{1+t}{1-t}=2t+\frac23t^3+O(t^5)$
        to: $h(t)=(b+\frac23)t^3+O(t^5)$
        operation: 在 $t=0$ 附近展开。
        why: 若 $b<-\frac23$，右侧极小正 $t$ 会让 $h(t)<0$。
      source_ref: page_0254_ex1_continuation
    - step_id: step_6
      statement: 用高阶导链证明充分性。
      formula_trace:
        from: $h^{(3)}(t)=\frac2{(1+t)^3}+\frac2{(1-t)^3}+6b$
        to: $h(t)>0,\quad 0<t<1$
        operation: 从 $h^{(3)}(0)\ge0$ 和四阶导正性逐级推出二阶导、一阶导和 $h$ 非负。
        why: 这完成 $b\ge-\frac23$ 的充分性。
      source_ref: page_0254_ex1_continuation
teaching_card:
  student_title: 端点锁参数，再把中心对称变成奇函数
  what_it_trains: 训练从“当且仅当”的端点条件锁住参数，再围绕对称中心平移，把恒成立问题转成右侧奇函数符号问题。
  recognition_cues:
    - 题目有 $\ln\frac{x}{2-x}$ 和 $(x-1)^3$，天然围绕 $x=1$。
    - 要求证明中心对称，后续通常要用 $x-1=t$。
    - “当且仅当 $1<x<2$” 是端点效应，不是普通恒成立。
    - 平移后出现 $\ln\frac{1+t}{1-t}-2t+bt^3$。
  normalization_moves:
    - 先用第(1)问求 $a\ge-2$。
    - 用 $f(x)+f(2-x)=2a$ 证明中心对称。
    - 第(3)问由端点锁定 $a=-2$。
    - 令 $t=x-1$，只看 $0<t<1$。
    - 用三阶项系数得到 $b\ge-\frac23$，再用高阶导链证明充分。
  common_failures:
    - 把第(3)问当成普通求最值，没有先用端点锁 $a=-2$。
    - 没有利用中心对称，导致左右区间重复分析。
    - 把 source 末尾的 $b\ge\frac23$ 直接抄下，漏掉负号。
    - 只做必要条件，没有证明 $b\ge-\frac23$ 的充分性。
  similar_practice_query: ln x/(2-x) 中心对称 端点效应 x-1=t b>=-2/3 高阶导链
