original_problem:
  stem: （2023 · 炎德英才联考）已知函数 $f(x)=\frac12ax^2+x-e^x$。当 $a>1$ 时，求证函数 $f(x)$ 在 $(0,+\infty)$ 上存在极值点 $m$，且 $f(m)>\frac{m-3}{2}$。
  parts: *a1
  choices: []
  answer: $f(x)$ 在 $(0,+\infty)$ 上存在极值点 $m$，且 $f(m)>\frac{m-3}{2}$。
  fidelity_notes:
    - 无选项。
    - $m$ 是导函数 $f^\prime$ 在 $\ln a$ 右侧的零点，对应 $f$ 的极大值点。
    - page_0304 顶部只补全例5尾句；page_0304 例6另起。
solution:
  source_solution_summary: 令 $h(x)=f^\prime(x)=ax+1-e^x$，则 $h^\prime(x)=a-e^x$，所以 $h$ 在 $(0,\ln a)$ 上递增， 在 $(\ln a,+\infty)$ 上递减。由 $e^x>x+1$ 代入 $x=\ln\frac1a$，得 $\ln a>-\frac1a+1$，从而 $h(\ln a)=a\ln a+1-a>0$。又 $h(0)=0$，所以左侧没有新的零点。 为了在右侧制造变号，取 $x=2\ln 2a-1$，用 $\frac{x+1}{e^{x/2}}\le\frac2{\sqrt e}$ 得 $h(x)<0$，且该点在 $\ln a$ 右侧，于是存在 $m\in(\ln a,2\ln 2a-1)$ 使 $f^\prime(m)=0$，此时 $f(m)$ 为极大值。由 $f^\prime(m)=0$ 得 $am=e^m-1$，代入原函数： $2f(m)=am^2+2m-2e^m=(m-2)e^m+m$。要证 $f(m)>\frac{m-3}{2}$，等价于 $(m-2)e^m+3>0$。令 $\varphi(x)=(x-2)e^x+3$，则 $\varphi^\prime(x)=(x-1)e^x$，所以 $\varphi(x)$ 在 $x=1$ 处取最小值 $\varphi(1)=3-e>0$，结论成立。
  key_steps:
    - step_id: step_1
      statement: 把极值点存在性转成导函数零点存在性。
      formula_trace:
        from: $f(x)=\frac12ax^2+x-e^x$
        to: $h(x)=f^\prime(x)=ax+1-e^x$
        operation: 求导并命名导函数。
        why: 极值点来自 $f^\prime(x)=0$。
      source_ref: page_0303_ex05_solution_main
    - step_id: step_2
      statement: 证明 $h$ 的最高点在零线上方。
      formula_trace:
        from: $h^\prime(x)=a-e^x$
        to: $h(\ln a)=a\ln a+1-a>0$
        operation: 先判 $h$ 先增后减，再由 $e^x>x+1$ 推出 $\ln a>-\frac1a+1$。
        why: 这说明导函数峰值为正，右侧才可能再穿过零线。
      source_ref: page_0303_ex05_solution_main
    - step_id: step_3
      statement: 在 $\ln a$ 右侧放缩取点，制造负值。
      formula_trace:
        from: $h(x)=ax+1-e^x$
        to: $h(2\ln2a-1)<0$
        operation: 用 $\frac{x+1}{e^{x/2}}\le\frac2{\sqrt e}$ 控制 $ax+a-e^x$。
        why: 有 $h(\ln a)>0$ 和右侧负值，才能夹出导函数零点。
      source_ref: page_0303_ex05_solution_main
    - step_id: step_4
      statement: 得到极值点 $m$。
      formula_trace:
        from: $h(\ln a)>0,\quad h(2\ln2a-1)<0$
        to: $\exists m\in(\ln a,2\ln2a-1),\ f^\prime(m)=0$
        operation: 连续函数介值与导函数符号变化。
        why: $h$ 在 $\ln a$ 右侧递减，所以这个零点对应 $f$ 的极大值点。
      source_ref: page_0303_ex05_solution_main
    - step_id: step_5
      statement: 用极值点方程消去参数。
      formula_trace:
        from: $f^\prime(m)=am+1-e^m=0$
        to: $am=e^m-1$
        operation: 把 $f^\prime(m)=0$ 改写成代入原函数的方程。
        why: 目标里有 $f(m)$，必须把参数 $a$ 从 $f(m)$ 中消掉。
      source_ref: page_0303_ex05_solution_main
    - step_id: step_6
      statement: 把目标不等式降成单变量不等式。
      formula_trace:
        from: $am=e^m-1$
        to: $2f(m)=(m-2)e^m+m$
        operation: 代入 $2f(m)=am^2+2m-2e^m$。
        why: 这样 $f(m)>\frac{m-3}{2}$ 只剩关于 $m$ 的判号。
      source_ref: page_0303_ex05_solution_main
    - step_id: step_7
      statement: 证明降维后的不等式恒正。
      formula_trace:
        from: $(m-2)e^m+3$
        to: $(m-2)e^m+3>0$
        operation: 设 $\varphi(x)=(x-2)e^x+3$，由 $\varphi^\prime(x)=(x-1)e^x$ 得最小值 $\varphi(1)=3-e>0$。
        why: 这是最后的单变量兜底证明。
      source_ref: page_0304_ex05_solution_tail
teaching_card:
  student_title: 极值点方程消参证明 $f(m)$ 下界
  what_it_trains: 训练先找到隐藏极值点，再用 $f^\prime(m)=0$ 把含参函数值不等式化成一元函数判号。
  recognition_cues:
    - 题目只要求存在极值点 $m$，不要求求出 $m$。
    - 目标是 $f(m)>g(m)$，通常要用 $f^\prime(m)=0$ 提供方程。
    - $f^\prime(x)=ax+1-e^x$ 是一条先增后减的导函数。
    - 右侧零点需要主动放缩取点。
  normalization_moves:
    - 先证明导函数峰值在零线上方。
    - 再在峰值右侧找一个让导函数为负的点。
    - 拿到 $m$ 后不要硬解，直接用 $am=e^m-1$ 消参。
    - 最后把目标转成 $\varphi(x)=(x-2)e^x+3$ 的最小值问题。
  common_failures:
    - 只证明 $h(\ln a)>0$，忘记还要找右侧负值。
    - 把 $h(0)=0$ 当成所需极值点，忽略题目要求在 $(0,+\infty)$ 内出现新的零点。
    - 不会解释为什么 $m$ 是极大值点。
    - 代入 $am=e^m-1$ 时把 $am^2$ 错写成 $e^m-1$。
    - 证明 $(x-2)e^x+3>0$ 时忘记 $x>0$。
  similar_practice_query: 含参 f(m)>g(m) 极值点方程消参 ax+1-e^x 放缩取点
