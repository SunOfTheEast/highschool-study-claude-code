stem: |-
  （2023 · 炎德英才联考）已知函数 $f(x)=\frac12ax^2+x-e^x$。当 $a>1$ 时，求证函数 $f(x)$ 在 $(0,+\infty)$ 上存在极值点 $m$，且 $f(m)>\frac{m-3}{2}$。
  1. 证明 $f(x)$ 在 $(0,+\infty)$ 上存在极值点 $m$。
  2. 证明 $f(m)>\frac{m-3}{2}$。
answer: |-
  $f(x)$ 在 $(0,+\infty)$ 上存在极值点 $m$，且 $f(m)>\frac{m-3}{2}$。

  令 $h(x)=f^\prime(x)=ax+1-e^x$，则 $h^\prime(x)=a-e^x$，所以 $h$ 在 $(0,\ln a)$ 上递增， 在 $(\ln a,+\infty)$ 上递减。由 $e^x>x+1$ 代入 $x=\ln\frac1a$，得 $\ln a>-\frac1a+1$，从而 $h(\ln a)=a\ln a+1-a>0$。又 $h(0)=0$，所以左侧没有新的零点。 为了在右侧制造变号，取 $x=2\ln 2a-1$，用 $\frac{x+1}{e^{x/2}}\le\frac2{\sqrt e}$ 得 $h(x)<0$，且该点在 $\ln a$ 右侧，于是存在 $m\in(\ln a,2\ln 2a-1)$ 使 $f^\prime(m)=0$，此时 $f(m)$ 为极大值。由 $f^\prime(m)=0$ 得 $am=e^m-1$，代入原函数： $2f(m)=am^2+2m-2e^m=(m-2)e^m+m$。要证 $f(m)>\frac{m-3}{2}$，等价于 $(m-2)e^m+3>0$。令 $\varphi(x)=(x-2)e^x+3$，则 $\varphi^\prime(x)=(x-1)e^x$，所以 $\varphi(x)$ 在 $x=1$ 处取最小值 $\varphi(1)=3-e>0$，结论成立。
