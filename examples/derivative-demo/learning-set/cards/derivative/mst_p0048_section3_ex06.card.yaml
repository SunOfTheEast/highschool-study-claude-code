stem: |-
  （2025 · 漳州高三第四次质检 T16）已知函数 $f(x)=\sin x-ae^x$。
  (1). 若 $a=1$，求 $f(x)$ 在 $[0,+\infty)$ 上的最大值。
  (2). 若 $f(x)$ 在 $[0,2\pi]$ 上恰有两个零点，求实数 $a$ 的取值范围。
answer: |-
  (1) 最大值为 $-1$；(2) $a\in\left(-\frac{\sqrt2}{2e^{5\pi/4}},0\right)\cup\left(0,\frac{\sqrt2}{2e^{\pi/4}}\right)$。

  当 a=1 时，f'(x)=cos x-e^x<=0，且 x>0 时严格小于 0，所以 f 在 [0,+infty) 上递减，最大值 f(0)=-1。第 (2) 问由 sin x-ae^x=0 分离出 a=sin x/e^x，令 g(x)=sin x/e^x。 g'(x)=(cos x-sin x)/e^x，在 [0,2pi] 上的临界点为 pi/4 和 5pi/4；g 从 0 增至正最大值，再降至负最小值，再升回 0。 因此水平线 y=a 与图像恰有两个交点时， a 位于负最小值与 0 之间，或 0 与正最大值之间。
