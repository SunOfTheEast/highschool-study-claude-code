stem: |-
  （2025春·无锡校级月考）已知 $a,b,c\in(1,+\infty)$，且 $a-\ln a-1=e^{-1}$，$b-\ln b-2=e^{-2}$，$c-\ln c-4=e^{-4}$，其中 $e$ 是自然对数的底数，则（  ）
  A. $a<b<c$
  B. $b<a<c$
  C. $b<c<a$
  D. $c<b<a$
answer: |
  A

  由题意可化为
  \[
  a-\ln a=e^{-1}+1,\quad
  b-\ln b=e^{-2}+2,\quad
  c-\ln c=e^{-4}+4.
  \]
  令
  \[
  f(x)=e^{-x}+x,
  \]
  则
  \[
  f^{\prime}(x)=1-e^{-x}>0\quad(x>0),
  \]
  所以
  \[
  f(1)<f(2)<f(4),
  \]
  即
  \[
  a-\ln a<b-\ln b<c-\ln c.
  \]

  再令
  \[
  g(x)=x-\ln x.
  \]
  因 $a,b,c>1$ 且
  \[
  g^{\prime}(x)=1-\frac1x>0\quad(x>1),
  \]
  得
  \[
  g(a)<g(b)<g(c)\Rightarrow a<b<c.
  \]
  故选 A。
