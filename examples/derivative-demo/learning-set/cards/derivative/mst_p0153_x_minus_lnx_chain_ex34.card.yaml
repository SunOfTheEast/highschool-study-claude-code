teaching_card:
  student_title: 先排右端，再回译左端变量
  what_it_trains: 训练“参数链比较 + 同构函数回译”的两段式流程，避免在 $x-\ln x$ 上直接硬比较。
  recognition_cues:
    - 多条条件都含 $x-\ln x$。
    - 右端是 $e^{-1}+1,e^{-2}+2,e^{-4}+4$ 这类可统一比较的常数。
    - 题设给出 $a,b,c>1$。
  normalization_moves:
    - 把等式先写成 $g(a),g(b),g(c)$。
    - 引入 $f(t)=e^{-t}+t$ 排序右端。
    - 再用 $g$ 在 $(1,+\infty)$ 上递增回译。
  common_failures:
    - 直接把 $e^{-1},e^{-2},e^{-4}$ 单独比较，忽略“+1,+2,+4”。
    - 忘记验证 $g$ 的适用区间。
    - 拿到 $g(a)<g(b)<g(c)$ 后未回到 $a,b,c$ 顺序。
  similar_practice_query: x-lnx 同构函数 e^{-x}+x 参数链 比大小
