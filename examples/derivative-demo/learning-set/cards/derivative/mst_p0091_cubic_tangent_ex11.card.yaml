stem: |-
  （2023 枣庄二模·多选 T12）已知函数 $f(x)=(x-1)^3-ax-b+1$，则下列结论正确的是（ ）
  A. 当 $a=3$ 时，若 $f(x)$ 有三个零点，则 $b$ 的取值范围为 $(-4,0)$
  B. 若 $f(x)$ 满足 $f(2-x)=3-f(x)$，则 $a+b=-1$
  C. 若过点 $(2,m)$ 可作出曲线 $g(x)=f(x)-3x+ax+b$ 的三条切线，则 $-5<m<-4$
  D. 若 $f(x)$ 存在极值点 $x_0$，且 $f(x_0)=f(x_1)$， 其中 $x_0\ne x_1$，则 $x_1+2x_0=3$
answer: |-
  ACD

  $f'(x)=3(x-1)^2-a$，$f''(x)=6(x-1)$，所以三次函数的对称中心横坐标为 $1$。A 中令 $a=3$，则 $f'(x)=3x(x-2)$， 极大值 $f(0)=-b$、极小值 $f(2)=-4-b$，有三个零点需 $-b>0$ 且 $-4-b<0$，得 $-4<b<0$，A 正确。B 中 $f(2-x)=3-f(x)$ 表示图象关于 $(1,\frac32)$ 对称， 而 $f(1)=1-a-b$，故 $1-a-b=\frac32$，即 $a+b=-\frac12$， 不是 $-1$，B 错。C 中 $g(x)=f(x)-3x+ax+b=x^3-3x^2$，拐点为 $(1,-2)$， 拐点切线为 $y=-3x+1$；在 $x=2$ 处切线高为 $-5$， 曲线高为 $-4$，点 $(2,m)$ 要在外弧区域，故 $-5<m<-4$， C 正确。D 中设 $u=x-1$，极值点满足 $a=3u_0^2$， 由 $f(x_1)=f(x_0)$ 得 $u_1=-2u_0$，即 $x_1+2x_0=3$， D 正确。故选 ACD。
