stem: |-
  （25高三上·河南许昌模拟）设 $a=\frac{4(2-\ln4)}{e^2},\ b=\frac1e,\ c=\frac{\ln4}{4}$，则 $a,b,c$ 的大小顺序为（  ）
  A. $a<c<b$
  B. $c<a<b$
  C. $a<b<c$
  D. $b<a<c$
answer: |
  A

  先把三项改写成统一函数值：
  \[
  a=\frac{4(2-\ln4)}{e^2}
  =\frac{\ln\frac{e^2}{4}}{\frac{e^2}{4}},
  \quad
  b=\frac1e=\frac{\ln e}{e},
  \quad
  c=\frac{\ln4}{4}.
  \]
  构造
  \[
  f(x)=\frac{\ln x}{x},
  \quad
  f^{\prime}(x)=\frac{1-\ln x}{x^2}.
  \]
  则
  \[
  a=f\!\left(\frac{e^2}{4}\right),\quad b=f(e),\quad c=f(4)=f(2).
  \]
  由 $f^{\prime}(x)$ 符号知：$f$ 在 $(0,e)$ 递增，在 $(e,+\infty)$ 递减，故 $b=f(e)$ 最大。
  又因为
  \[
  \frac{e^2}{4}<2<e,
  \]
  且都在增区间 $(0,e)$，所以
  \[
  f\!\left(\frac{e^2}{4}\right)<f(2)<f(e),
  \]
  即
  \[
  a<c<b.
  \]
  选 A。
