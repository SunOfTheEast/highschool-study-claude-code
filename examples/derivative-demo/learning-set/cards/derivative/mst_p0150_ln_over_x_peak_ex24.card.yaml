teaching_card:
  student_title: 把三项都送到 $\frac{\ln x}{x}$ 上
  what_it_trains: 训练“同构到峰值函数 + 分区间排序”的稳定比大小套路。
  recognition_cues:
    - 多个表达式都能改成 $\frac{\ln(\cdot)}{(\cdot)}$。
    - 题里出现 $\frac1e$ 或 $\ln$ 与分母同框。
    - 选项是三个量的全序关系。
  normalization_moves:
    - 优先把各项写成 $f(x)=\frac{\ln x}{x}$。
    - 先用 $x=e$ 锁最大值。
    - 再在同一单调区间内比较剩余两点。
  common_failures:
    - 把 $f$ 的增减区间写反。
    - 忽略 $c=f(2)$ 的等值换点，导致比较链断裂。
    - 只判断 $b$ 最大，未完成 $a,c$ 相对次序。
  similar_practice_query: lnx/x 峰值 e 比大小 e^2/4 ln4/4 1/e
