stem: |-
  （2023·哈尔滨月考）设 $a=\sin\frac\pi e,\ b=\frac{\ln\pi}{\pi},\ c=\frac{2\pi-\pi\ln\pi}{e^2}$，其中 $e$ 为自然对数的底数，则（ ）
  A. $a<c<b$
  B. $b<a<c$
  C. $b<c<a$
  D. $c<b<a$
answer: |
  D

  先比较 $a,b$。
  源解给出
  \[
  a=\sin\frac{\pi}{e}>\sin\frac{\pi}{3}=\frac{\sqrt3}{2}.
  \]
  令
  \[
  f(x)=\frac{\ln x}{x},
  \quad
  f^{\prime}(x)=\frac{1-\ln x}{x^2}.
  \]
  因 $f$ 在 $(e,+\infty)$ 递减，且 $\pi>e$，得
  \[
  b=\frac{\ln\pi}{\pi}=f(\pi)<f(e)=\frac1e<\frac{\sqrt3}{2}<a,
  \]
  所以 $b<a$。
  再比较 $b,c$：
  \[
  c=\frac{2\pi-\pi\ln\pi}{e^2}
  =
  \frac{\pi}{e^2}\ln\frac{e^2}{\pi}
  =
  \frac{\ln\left(e^2/\pi\right)}{e^2/\pi}.
  \]
  设 $x_1=\frac{e^2}{\pi}$，$x_2=\pi$，则 $x_1<e<x_2$ 且 $x_1x_2=e^2$。
  源解使用“极值点左偏”结论：在该乘积对称关系下，
  \[
  f(x_1)<f(x_2),
  \]
  即
  \[
  c<b.
  \]
  综上 $a>b>c$，等价于 $c<b<a$，选 D。
