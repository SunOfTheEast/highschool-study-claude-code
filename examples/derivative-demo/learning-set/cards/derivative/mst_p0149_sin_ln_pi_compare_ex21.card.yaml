solution:
  source_solution_summary: |
    先比较 $a,b$。
    源解给出
    \[
    a=\sin\frac{\pi}{e}>\sin\frac{\pi}{3}=\frac{\sqrt3}{2}.
    \]
    令
    \[
    f(x)=\frac{\ln x}{x},
    \quad
    f^{\prime}(x)=\frac{1-\ln x}{x^2}.
    \]
    因 $f$ 在 $(e,+\infty)$ 递减，且 $\pi>e$，得
    \[
    b=\frac{\ln\pi}{\pi}=f(\pi)<f(e)=\frac1e<\frac{\sqrt3}{2}<a,
    \]
    所以 $b<a$。
    再比较 $b,c$：
    \[
    c=\frac{2\pi-\pi\ln\pi}{e^2}
    =
    \frac{\pi}{e^2}\ln\frac{e^2}{\pi}
    =
    \frac{\ln\left(e^2/\pi\right)}{e^2/\pi}.
    \]
    设 $x_1=\frac{e^2}{\pi}$，$x_2=\pi$，则 $x_1<e<x_2$ 且 $x_1x_2=e^2$。
    源解使用“极值点左偏”结论：在该乘积对称关系下，
    \[
    f(x_1)<f(x_2),
    \]
    即
    \[
    c<b.
    \]
    综上 $a>b>c$，等价于 $c<b<a$，选 D。
  key_steps:
    - step_id: step_1
      statement: 先给出 $a$ 的下界。
      formula_trace:
        from: $a=\sin\frac\pi e$
        to: $a>\sin\frac\pi3=\frac{\sqrt3}{2}$
        operation: 用 $\frac\pi e>\frac\pi3$ 且正弦在 $(0,\frac\pi2)$ 递增。
        why: 为后续与 $b$ 的比较提供明确参照。
      source_ref: page_0149_ex21_solution_start
    - step_id: step_2
      statement: 用 $f(x)=\frac{\ln x}{x}$ 得到 $b<a$。
      formula_trace:
        from: $b=f(\pi),\ f(e)=\frac1e$
        to: $b=f(\pi)<f(e)=\frac1e<\frac{\sqrt3}{2}<a$
        operation: 在 $(e,+\infty)$ 递减区比较。
        why: 锁定 $a$ 比 $b$ 大。
      source_ref: page_0150_ex21_continuation
    - step_id: step_3
      statement: 把 $c$ 同构到 $f(x)$ 形式。
      formula_trace:
        from: $c=\frac{2\pi-\pi\ln\pi}{e^2}$
        to: $c=\frac{\ln(e^2/\pi)}{e^2/\pi}=f\!\left(\frac{e^2}{\pi}\right)$
        operation: 提取 $\frac\pi{e^2}$ 并用 $2-\ln\pi=\ln\frac{e^2}{\pi}$。
        why: 把 $c$ 与 $b=f(\pi)$ 放到同一函数框架比较。
      source_ref: page_0150_ex21_continuation
    - step_id: step_4
      statement: 用极值点偏移结论比较 $c,b$。
      formula_trace:
        from: $x_1=\frac{e^2}{\pi}<e<\pi=x_2,\ x_1x_2=e^2$
        to: $f(x_1)<f(x_2)$，即 $c<b$
        operation: 应用源解给出的跨峰配对结论（极值点左偏）。
        why: 完成 $b,c$ 的顺序判定。
      source_ref: page_0150_ex21_continuation
    - step_id: step_5
      statement: 合并顺序并对应选项。
      formula_trace:
        from: $b<a$ 且 $c<b$
        to: $a>b>c$，等价 $c<b<a$，选 D
        operation: 传递比较并匹配选项。
        why: 得到最终答案。
      source_ref: page_0150_ex21_continuation
teaching_card:
  student_title: 先压三角项，再用 ln/x 跨峰配对
  what_it_trains: 训练混合结构排序：三角项先建立粗下界，剩余项统一到 $\frac{\ln x}{x}$，再用极值点偏移完成跨峰比较。
  recognition_cues:
    - 三项里有一个三角值，另外两项可化为 $\ln/x$。
    - 出现 $\pi,e,e^2/\pi$ 这类天然配对点。
    - 题目是全序单选。
  normalization_moves:
    - 先证 $a$ 足够大（大于 $\frac{\sqrt3}{2}$）。
    - 把 $b,c$ 全部写成 $f(x)=\frac{\ln x}{x}$。
    - 用极值点偏移比较左右配对点。
  common_failures:
    - 忽略例21跨页续解，导致只完成 $b<a$。
    - 把 $c$ 化简时漏掉 $\frac\pi{e^2}$ 因子。
    - 跨峰比较时误用“对称即相等”。
