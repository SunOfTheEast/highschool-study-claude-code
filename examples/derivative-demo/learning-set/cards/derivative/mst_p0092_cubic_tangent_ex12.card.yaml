solution:
  source_solution_summary: 由 $f'(x)=3ax^2+2bx+9$、$f''(x)=6ax+2b$，三次函数对称中心 $(2,-2)$ 给出 $f''(2)=0$ 与 $f(2)=-2$，解得 $a=1,b=-6$， 所以 A 错。此时 $f(x)=x^3-6x^2+9x-4$， $f'(x)=3(x-1)(x-3)$，函数在 $x=3$ 处取极小值 $-4$，B 对。 由 $f(x)+4=x(x-3)^2$ 及图象可知，开区间 $(m,4)$ 存在最小值 当且仅当 $0\le m<3$，C 对。D 项设切点横坐标为 $c$， 切线经过 $(3,m)$ 等价于 $m=-2c^3+15c^2-36c+23$； 该辅助三次函数在 $c=2$ 取极小值 $-5$，在 $c=3$ 取极大值 $-4$， 因此 $-5<m<-4$ 时有三个不同切点，D 对。故选 BCD。
  key_steps:
    - step_id: step_1
      statement: 由三次函数对称中心确定参数。
      formula_trace:
        from: $f(x)=ax^3+bx^2+9x-4,\quad \text{对称中心为 }(2,-2)$
        to: $12a+2b=0,\quad 8a+4b+18-4=-2\Rightarrow a=1,b=-6$
        operation: 求 $f''(x)=6ax+2b$，用拐点横坐标满足 $f''(2)=0$，再代入中心纵坐标 $f(2)=-2$。
        why: 三次函数的拐点就是图象对称中心。
      source_ref: page_0092:lines 34-41
    - step_id: step_2
      statement: 用导数号表判断极小值并判定 B。
      formula_trace:
        from: $f(x)=x^3-6x^2+9x-4$
        to: $f'(x)=3x^2-12x+9=3(x-1)(x-3),\quad f(3)=-4$
        operation: 由 $f'>0$ 得 $x<1$ 或 $x>3$，由 $f'<0$ 得 $1<x<3$，所以 $x=3$ 为极小值点。
        why: 导数由负变正的位置给出极小值。
      source_ref: page_0092:line 42
    - step_id: step_3
      statement: 处理开区间上“存在最小值”的端点效应并判定 C。
      formula_trace:
        from: $f(x)=-4\Leftrightarrow x^3-6x^2+9x=0$
        to: $f(x)+4=x(x-3)^2,\quad x=0\text{ 或 }3,\quad 0\le m<3$
        operation: 结合图象与单调性：$m<0$ 时左端开口给出更低但不取到的下确界，$m=0$ 或 $0<m<3$ 时 $x=3$ 在区间内取到最小值，$m\ge3$ 时 $x=3$ 不在区间内。
        why: 开区间是否包含极小值点，以及被删去端点附近是否产生更低下确界，决定最小值是否存在。
      source_ref: page_0092:line 43; page_0093:lines 14-18
    - step_id: step_4
      statement: 把过定点的三条切线转为切点参数方程。
      formula_trace:
        from: $y-f(c)=f'(c)(x-c),\quad f'(c)=3c^2-12c+9,\quad (3,m)\text{ 在切线上}$
        to: $m-(c^3-6c^2+9c-4)=(3c^2-12c+9)(3-c)$
        operation: 设切点为 $(c,f(c))$，写出切线方程，再代入定点 $(3,m)$。
        why: 每一个可行切点对应一条过定点的曲线切线。
      source_ref: page_0092:line 44; page_0093:line 12
    - step_id: step_5
      statement: 分析辅助三次函数的水平截线条数并判定 D。
      formula_trace:
        from: $m=-2c^3+15c^2-36c+23$
        to: $g'(c)=-6(c-2)(c-3),\quad g(2)=-5,\quad g(3)=-4,\quad -5<m<-4$
        operation: 令 $g(c)=-2c^3+15c^2-36c+23$，由单调区间和极值判断直线 $y=m$ 与 $g$ 有三个交点的条件。
        why: 三个不同交点对应三个不同切点，因此对应三条切线。
      source_ref: page_0093:line 12
    - step_id: step_6
      statement: 用拐点切线法复核 D 项范围。
      formula_trace:
        from: $f'(2)=-3,\quad (2,-2)$
        to: $y+2=-3(x-2)\Rightarrow y=-3x+4,\quad -3\cdot3+4<m<f(3)\Rightarrow -5<m<-4$
        operation: 写出拐点处切线，在 $x=3$ 处比较拐点切线纵坐标与曲线纵坐标。
        why: 三次函数的拐点切线把过定点三切线区域与非三切线区域分开。
      source_ref: page_0093:line 26
teaching_card:
  student_title: 三次函数的拐点中心先定型
  what_it_trains: 训练学生把三次函数的对称中心转成参数方程，随后用导数号表、 开区间端点效应和切点参数化，逐项判定多选题中的极值与切线条数结论。
  recognition_cues:
    - 题干主动给出“三次函数拐点就是对称中心”。
    - 函数含未知 $a,b$，但对称中心的横纵坐标已知。
    - 选项同时出现极小值、开区间最小值存在性和过定点三切线。
    - D 项的定点横坐标 $3$ 正好是曲线的极小值点横坐标。
  normalization_moves:
    - 先写 $f''(2)=0$ 和 $f(2)=-2$，不要直接猜 $a,b$。
    - 求出 $f(x)=x^3-6x^2+9x-4$ 后立刻因式分解 $f'(x)$。
    - 判断 C 项时同时检查 $m=0$、$m=3$ 两个开端点临界位置。
    - D 项先设切点横坐标 $c$，把切线条数转成 $g(c)=m$ 的根个数。
    - 可用拐点切线 $y=-3x+4$ 在 $x=3$ 处的高度快速复核 D 项。
  common_failures:
    - 把 A 项中的 $b=6$ 当成对称中心代入后的正确值。
    - 只算出驻点 $1,3$，但没有用导数符号判断哪个是极小值。
    - C 项忘记 $(m,4)$ 是开区间，误把 $m<3$ 全部接受。
    - D 项把切点横坐标 $c$ 与定点横坐标 $3$ 混为一谈。
    - 在 $g'(c)$ 的号表中漏掉 $x>3$ 的递减区间，导致三交点范围错。
  similar_practice_query: 三次函数 对称中心 拐点 切线条数 开区间最小值 多选题
