  stem: （2025 齐齐哈尔期中 T11）设 $f'(x)$ 是 $f(x)$ 的导函数，$f''(x)$ 是函数 $f'(x)$ 的导函数。若方程 $f''(x)=0$ 有实数解 $x_0$，且在 $x_0$ 的左、右附近，$f''(x)$ 异号，则称点 $(x_0,f(x_0))$ 为函数 $y=f(x)$ 的“拐点”。经过探究发现：任何一个三次函数都有“拐点”且“拐点”就是三次函数图象的对称中心。已知函数 $f(x)=ax^3+bx^2+9x-4\ (ab\ne0)$ 的对称中心为 $(2,-2)$，则下列说法中正确的是（  ）
