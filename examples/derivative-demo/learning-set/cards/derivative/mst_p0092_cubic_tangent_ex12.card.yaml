stem: |-
  （2025 齐齐哈尔期中 T11）设 $f'(x)$ 是 $f(x)$ 的导函数，$f''(x)$ 是函数 $f'(x)$ 的导函数。若方程 $f''(x)=0$ 有实数解 $x_0$，且在 $x_0$ 的左、右附近，$f''(x)$ 异号，则称点 $(x_0,f(x_0))$ 为函数 $y=f(x)$ 的“拐点”。经过探究发现：任何一个三次函数都有“拐点”且“拐点”就是三次函数图象的对称中心。已知函数 $f(x)=ax^3+bx^2+9x-4\ (ab\ne0)$ 的对称中心为 $(2,-2)$，则下列说法中正确的是（  ）
  A. a=1, b=6
  B. f(x) 的极小值为 -4
  C. 若函数 f(x) 在区间 (m, 4) 上存在最小值，则 m 的取值范围为 [0, 3)
  D. 若过点 (3, m) 可以作三条直线与 y=f(x) 的图象相切，则 m 的取值范围为 (-5, -4)
answer: |-
  BCD

  由 $f'(x)=3ax^2+2bx+9$、$f''(x)=6ax+2b$，三次函数对称中心 $(2,-2)$ 给出 $f''(2)=0$ 与 $f(2)=-2$，解得 $a=1,b=-6$， 所以 A 错。此时 $f(x)=x^3-6x^2+9x-4$， $f'(x)=3(x-1)(x-3)$，函数在 $x=3$ 处取极小值 $-4$，B 对。 由 $f(x)+4=x(x-3)^2$ 及图象可知，开区间 $(m,4)$ 存在最小值 当且仅当 $0\le m<3$，C 对。D 项设切点横坐标为 $c$， 切线经过 $(3,m)$ 等价于 $m=-2c^3+15c^2-36c+23$； 该辅助三次函数在 $c=2$ 取极小值 $-5$，在 $c=3$ 取极大值 $-4$， 因此 $-5<m<-4$ 时有三个不同切点，D 对。故选 BCD。
