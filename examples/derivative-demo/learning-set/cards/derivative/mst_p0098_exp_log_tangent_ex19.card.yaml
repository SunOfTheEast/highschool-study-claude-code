original_problem:
  stem: （2023 广东五校期末·多选 T12）已知函数 $f(x)=e^{x-1}+\ln x$，则过点 $(a,b)$ 恰能作曲线 $y=f(x)$ 的两条切线的充分条件可以是（  ）
  parts: *a1
  choices:
    - label: A
      text_raw: $b=2a-1>1$
      text_latex: $b=2a-1>1$
    - label: B
      text_raw: $b=f(a)$
      text_latex: $b=f(a)$
    - label: C
      text_raw: $2a-1<b<f(a)$
      text_latex: $2a-1<b<f(a)$
    - label: D
      text_raw: $b<2a-1\leqslant -1$
      text_latex: $b<2a-1\leqslant -1$
  answer: AD
  fidelity_notes:
    - 源页是多选题，要求判断“充分条件可以是”，不是求 $(a,b)$ 的完整充要区域。
    - 选项 B 覆盖曲线上的所有点，其中包含拐点 $(1,1)$，故不能作为充分条件。
    - 选项 A 是拐点切线 $y=2x-1$ 上且 $b>1$ 的点，避开了拐点本身。
solution:
  source_solution_summary: |
    先看曲线 $f(x)=e^{x-1}+\ln x$ 的整体形状：$f^{\prime}(x)=e^{x-1}+\frac1x>0$，所以它在 $(0,+\infty)$ 上单调递增；$f^{\prime\prime}(x)=e^{x-1}-\frac1{x^2}$，唯一零点为 $x=1$，拐点为 $(1,1)$，拐点处切线为 $y=2x-1$。曲线、拐点切线和渐近线 $x=0$ 将平面划成若干区域。源页按区域切线条数判断：曲线上除拐点外的点可作两条切线，拐点切线上除拐点外的点也可作两条切线；夹在切线与曲线之间的相应区域只有一条切线；渐近线外侧的区域 5 少了一条趋向 $y\to-\infty$ 的远切线，因此也恰有两条切线。于是 A、D 是充分条件，B、C 不是，故选 AD。
  key_steps:
    - step_id: step_1
      statement: 确定 $f$ 的单调性、拐点和拐点切线。
      formula_trace:
        from: $f(x)=e^{x-1}+\ln x$
        to: $f^{\prime}(x)=e^{x-1}+\frac1x>0,\quad f^{\prime\prime}(x)=e^{x-1}-\frac1{x^2}$
        operation: 对指数项和对数项求一、二阶导。
        why: 切线条数由曲线整体形状控制，拐点是区域划分的关键边界。
      source_ref: page_0098_ex19_solution
    - step_id: step_2
      statement: 把唯一拐点和拐点切线写出来。
      formula_trace:
        from: $f^{\prime\prime}(x)=0$
        to: $x=1,\quad f(1)=1,\quad f^{\prime}(1)=2,\quad y=2x-1$
        operation: 解二阶导零点，并用点斜式写切线。
        why: 源页用这条切线和曲线一起划分切线条数区域。
      source_ref: page_0098_ex19_solution
    - step_id: step_3
      statement: 判断曲线和拐点切线边界上的点。
      formula_trace:
        from: 点在 $y=f(x)$ 上或在 $y=2x-1$ 上
        to: 除拐点 $(1,1)$ 外，边界点恰能作两条切线；拐点本身只对应重合的拐点切线。
        operation: 利用源页区域图中的边界切线条数。
        why: 这直接区分 A 与 B：A 避开拐点，B 包含拐点。
      source_ref: page_0098_ex19_solution
    - step_id: step_4
      statement: 逐项判定 A、B、C。
      formula_trace:
        from: "A: $b=2a-1>1$；B: $b=f(a)$；C: $2a-1<b<f(a)$"
        to: A 正确，B 错误，C 错误
        operation: A 是拐点切线上高于拐点的边界点；B 包含拐点；C 落在切线与曲线之间的一内弧一外弧区域。
        why: 充分条件必须保证每个满足选项的点都恰有两条切线。
      source_ref: page_0098_ex19_solution
    - step_id: step_5
      statement: 用渐近线外侧区域判断 D。
      formula_trace:
        from: $b<2a-1\leqslant -1$
        to: 点在渐近线外侧的区域 5，恰能作两条切线
        operation: 由 $2a-1\leqslant -1$ 得 $a\leqslant0$，结合 $b<2a-1$ 定位到源图的渐近线外侧下方区域。
        why: 该区域比右侧外弧区域少一条 $y\to-\infty$ 的远切线，源页判定为两条切线。
      source_ref: page_0099_ex19_continuation
    - step_id: step_6
      statement: 汇总正确选项。
      formula_trace:
        from: A 正确，B 错误，C 错误，D 正确
        to: 答案 AD
        operation: 按多选题逐项合并。
        why: A、D 都能充分保证过点 $(a,b)$ 恰能作两条切线。
      source_ref: page_0098_ex19_solution
teaching_card:
  student_title: 用拐点切线数清外点切线
  what_it_trains: 训练先找曲线的拐点切线和渐近线，再用平面分区判断外点能作几条切线。
  recognition_cues:
    - 题目问“过点能作几条切线”。
    - 函数含 $e^{x-1}$ 与 $\ln x$，定义域右侧有 $y$ 轴渐近线。
    - 二阶导只有一个零点，拐点切线会成为分区边界。
  normalization_moves:
    - 先求 $f^{\prime}$、$f^{\prime\prime}$，锁定唯一拐点。
    - 写出拐点切线 $y=2x-1$，把选项里的 $2a-1$ 识别成这条线。
    - 把“在曲线上”拆成普通点和拐点，充分条件题不能放过例外点。
    - 遇到 $a\leqslant0$ 时联想到点在定义域外侧，切线条数会受渐近线影响。
  common_failures:
    - 看到 $b=f(a)$ 就认为曲线上点都有两条切线，漏掉拐点。
    - 只比较 $b$ 与 $2a-1$、$f(a)$，没有结合区域图判断切线条数。
    - 忽略 $\ln x$ 的定义域，把 $a\leqslant0$ 当成普通右侧区域。
    - 把“充分条件”误做成“所有恰有两条切线的点的充要条件”。
  similar_practice_query: 指数对数函数 拐点切线 渐近线 外点切线条数 多选
