stem: |-
  （2023 广东五校期末·多选 T12）已知函数 $f(x)=e^{x-1}+\ln x$，则过点 $(a,b)$ 恰能作曲线 $y=f(x)$ 的两条切线的充分条件可以是（  ）
  A. $b=2a-1>1$
  B. $b=f(a)$
  C. $2a-1<b<f(a)$
  D. $b<2a-1\leqslant -1$
answer: |
  AD

  先看曲线 $f(x)=e^{x-1}+\ln x$ 的整体形状：$f^{\prime}(x)=e^{x-1}+\frac1x>0$，所以它在 $(0,+\infty)$ 上单调递增；$f^{\prime\prime}(x)=e^{x-1}-\frac1{x^2}$，唯一零点为 $x=1$，拐点为 $(1,1)$，拐点处切线为 $y=2x-1$。曲线、拐点切线和渐近线 $x=0$ 将平面划成若干区域。源页按区域切线条数判断：曲线上除拐点外的点可作两条切线，拐点切线上除拐点外的点也可作两条切线；夹在切线与曲线之间的相应区域只有一条切线；渐近线外侧的区域 5 少了一条趋向 $y\to-\infty$ 的远切线，因此也恰有两条切线。于是 A、D 是充分条件，B、C 不是，故选 AD。
