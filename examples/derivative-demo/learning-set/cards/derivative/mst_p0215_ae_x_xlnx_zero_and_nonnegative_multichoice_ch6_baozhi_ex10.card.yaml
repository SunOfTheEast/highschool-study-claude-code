stem: |-
  （2024 · 衡水月考 · 多选 T12）已知函数 $f(x)=ae^x-x^2+x\ln x-ax$，则（  ）
  A. 当 $a=0$ 时，$f(x)$ 单调递减
  B. 当 $a=1$ 时，$f(x)>0$
  C. 若 $f(x)$ 有且仅有一个零点，则 $a\leqslant1$
  D. 若 $f(x)\geqslant0$，则 $a\geqslant\frac1{e-1}$
answer: |-
  ABD

  对 A：当 $a=0$ 时，$f(x)=x\ln x-x^2$，有 $f^{\prime}(x)=1+\ln x-2x$。设 $g(x)=1+\ln x-2x$， 则 $g^{\prime}(x)=\frac1x-2$，故 $g$ 在 $\left(0,\frac12\right)$ 增、在 $\left(\frac12,+\infty\right)$ 减，且 $f^{\prime}\left(\frac12\right)=1+\ln\frac12-1=-\ln2<0$， 所以 $f^{\prime}(x)<0$，A 正确。 对 B：当 $a=1$ 时， $f(x)=e^x+x\ln x-x^2=x\left[e^{x-\ln x}-(x-\ln x)-1\right]>0$， B 正确。 对 C：令 $t=x-\ln x\ge1$，零点条件化为 $ae^t-t-a=0\iff a=\frac{t}{e^t-1}=F(t)$。由 $F^{\prime}(t)=\frac{(1-t)e^t-1}{(e^t-1)^2}<0$（$t\ge1$），$F$ 递减； source 据此写出“若仅一个零点则 $t=1,\ a=\frac1{e-1}$”，并判 C 错。 用户确认 C 项按“必要且充分 / 精确条件”判断，$a\le1$ 不是有且仅有一个零点的精确条件。 对 D（续页）：若 $f(x)\ge0$，则同样有 $a\ge F(t)$，从而 $a\ge\max_{t\ge1}F(t)=F(1)=\frac1{e-1}$，D 正确。 source 最终答案给为 ABD。
