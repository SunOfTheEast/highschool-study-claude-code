solution:
  source_solution_summary: $g(x)$ 有 3 个零点等价于水平线 $y=m$ 与 $f(x)$ 有 3 个交点。 当 $x\le0$ 时，$f(x)=x^2+2x$，最小值为 $-1$，且 $f(0)=0$； 当 $x>0$ 时，$f(x)=\frac{\ln(2x)}x=2\frac{\ln(2x)}{2x}$， 由同构函数可知在 $2x=e$ 即 $x=\frac e2$ 处取最大值 $\frac2e$。由图像可知三交点对应 $-1<m<\frac2e$，选 B。
  key_steps:
    - step_id: step_1
      statement: 把零点个数变成水平线交点数。
      formula_trace:
        from: $g(x)=f(x)-m=0$
        to: $f(x)=m$
        operation: 移项。
        why: 水平线 $y=m$ 与分段函数图像的交点数就是零点个数。
      source_ref: page_0183
    - step_id: step_2
      statement: 分析左侧二次函数支。
      formula_trace:
        from: $f(x)=x^2+2x,\ x\le0$
        to: $f_{\min}=f(-1)=-1,\quad f(0)=0$
        operation: 配方或读抛物线顶点。
        why: 左支决定下端开区间 $m>-1$。
      source_ref: page_0183
    - step_id: step_3
      statement: 分析右侧指对同构支。
      formula_trace:
        from: $f(x)=\frac{\ln(2x)}x=2\frac{\ln(2x)}{2x}$
        to: $f_{\max}=f(\frac e2)=\frac2e$
        operation: 套用 $\frac{\ln u}{u}$ 在 $u=e$ 处取最大值。
        why: 右支决定上端开区间 $m<\frac2e$。
      source_ref: page_0183
teaching_card:
  student_title: 水平线扫两段函数找三零点
  what_it_trains: 训练把分段函数零点个数转成水平线交点数，并快速读出每一段的关键极值。
  recognition_cues:
    - 题目问 $f(x)-m$ 有几个零点。
    - 函数左边是二次函数，右边是 $\frac{\ln(2x)}x$。
    - 配图直接给出水平线 $y=m$。
  normalization_moves:
    - 先画/读水平线 $y=m$。
    - 左支找 $-1$ 和 $0$。
    - 右支用 $2x=e$ 找 $\frac2e$。
  common_failures:
    - 把右支最大值误算成 $\frac{\sqrt e}{e}$。
    - 边界 $m=-1$ 或 $m=\frac2e$ 时交点数变化，不能闭合。
    - 漏看左侧 $x\le0$ 支。
