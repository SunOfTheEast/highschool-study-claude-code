stem: |-
  （2025 · 南京金陵中学期中 T6）已知函数 $f(x)=\begin{cases}x^2+2x,&x\leqslant0\\ \frac{\ln(2x)}{x},&x>0\end{cases}$，若函数 $g(x)=f(x)-m$ 有 3 个零点，则实数 $m$ 的取值范围为（  ）
  A. $\left[0,\frac2e\right)$
  B. $\left(-1,\frac2e\right)$
  C. $\left[0,\frac{\sqrt e}{e}\right)$
  D. $\left(-1,\frac{\sqrt e}{e}\right)$
answer: |-
  B

  $g(x)$ 有 3 个零点等价于水平线 $y=m$ 与 $f(x)$ 有 3 个交点。 当 $x\le0$ 时，$f(x)=x^2+2x$，最小值为 $-1$，且 $f(0)=0$； 当 $x>0$ 时，$f(x)=\frac{\ln(2x)}x=2\frac{\ln(2x)}{2x}$， 由同构函数可知在 $2x=e$ 即 $x=\frac e2$ 处取最大值 $\frac2e$。由图像可知三交点对应 $-1<m<\frac2e$，选 B。
