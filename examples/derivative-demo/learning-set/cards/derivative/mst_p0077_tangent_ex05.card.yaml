stem: （2025 · 新高考 I T12）若直线 $y=2x+5$ 是曲线 $y=e^x+x+a$ 的切线， 则 $a=$_______。
answer: |-
  4

  法一把 $y=2x+5$ 与 $y=e^x+x+a$ 相切改写成 $y=x+5-a$ 是 $y=e^x$ 的切线；由于 $e^x$ 斜率为 1 的切点为 $x=0$，对应切线 $y=x+1$，所以 $5-a=1$，$a=4$。法二设差函数 $g(x)=e^x+x+a-2x-5=e^x-x+a-5$，相切时 $g(x_0)=0,g'(x_0)=0$，由 $e^{x_0}-1=0$ 得 $x_0=0$，再得 $a=4$。 法三设切点直接列切线方程，同样由斜率 $e^{x_0}+1=2$ 得 $x_0=0,a=4$。
