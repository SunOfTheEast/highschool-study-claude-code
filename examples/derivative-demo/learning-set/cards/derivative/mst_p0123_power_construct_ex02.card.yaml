stem: |-
  （2023 · 厦门模拟）已知函数 $f(x)(x\in\mathbf{R})$ 是偶函数，$f^{\prime}(x)$ 是函数 $f(x)(x\in\mathbf{R})$ 的导函数，$f(1)=1$，若 $x\geqslant0$ 时，$3f(x)+x f^{\prime}(x)>0$，则使得不等式 $(x-2022)^3f(x-2022)>1$ 成立的 $x$ 的取值范围是（  ）
  A. $(2021,+\infty)$
  B. $(-\infty,2021)$
  C. $(2023,+\infty)$
  D. $(-\infty,2023)$
answer: |
  C

  构造 $g(x)=x^3f(x)$。当 $x\ge0$ 时，
  $g'(x)=3x^2f(x)+x^3f'(x)=x^2[3f(x)+xf'(x)]\ge0$，
  且不恒为零，所以 $g$ 在 $[0,+\infty)$ 上为增函数。
  又 $f$ 是偶函数，故
  $g(-x)=(-x)^3f(-x)=-x^3f(x)=-g(x)$，即 $g$ 是奇函数，
  于是 $g$ 在 $\mathbf{R}$ 上为增函数。由 $f(1)=1$ 得
  $g(1)=1$。原不等式即 $g(x-2022)>g(1)$，由 $g$ 单调递增得
  $x-2022>1$，所以 $x>2023$，选 C。
