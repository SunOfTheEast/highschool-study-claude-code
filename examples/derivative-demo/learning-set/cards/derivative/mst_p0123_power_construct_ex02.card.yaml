solution:
  source_solution_summary: |
    构造 $g(x)=x^3f(x)$。当 $x\ge0$ 时，
    $g'(x)=3x^2f(x)+x^3f'(x)=x^2[3f(x)+xf'(x)]\ge0$，
    且不恒为零，所以 $g$ 在 $[0,+\infty)$ 上为增函数。
    又 $f$ 是偶函数，故
    $g(-x)=(-x)^3f(-x)=-x^3f(x)=-g(x)$，即 $g$ 是奇函数，
    于是 $g$ 在 $\mathbf{R}$ 上为增函数。由 $f(1)=1$ 得
    $g(1)=1$。原不等式即 $g(x-2022)>g(1)$，由 $g$ 单调递增得
    $x-2022>1$，所以 $x>2023$，选 C。
  key_steps:
    - step_id: step_1
      statement: 把 $3f(x)+xf^{\prime}(x)$ 识别为 $x^3f(x)$ 的导数因子。
      formula_trace:
        from: |
          $3f(x)+xf'(x)>0,\qquad x\ge0$
        to: |
          $g(x)=x^3f(x),\quad g'(x)=x^2[3f(x)+xf'(x)]\ge0$
        operation: 乘上非负因子 $x^2$，配成乘积导数。
        why: 目标不等式也含三次幂与 $f$ 的乘积，辅助函数正好承接题干结构。
      source_ref: page_0123
    - step_id: step_2
      statement: 由偶函数把 $g$ 转成奇函数。
      formula_trace:
        from: |
          $f(-x)=f(x),\qquad g(x)=x^3f(x)$
        to: |
          $g(-x)=(-x)^3f(-x)=-x^3f(x)=-g(x)$
        operation: 利用奇次幂和偶函数相乘。
        why: 已知单调性先在非负半轴上建立，需要奇性将它延拓到负半轴。
      source_ref: page_0123
    - step_id: step_3
      statement: 确认 $g$ 在全实数上递增。
      formula_trace:
        from: |
          $g$ 在 $[0,+\infty)$ 上递增，且 $g$ 为奇函数
        to: |
          $g$ 在 $\mathbf{R}$ 上递增
        operation: 负半轴由奇函数对称得到同向增性，跨过 $0$ 时用 $g(0)=0$ 衔接。
        why: 原式中的 $x-2022$ 可取任意实数，需要全实数单调性才能直接比较。
      source_ref: page_0123
    - step_id: step_4
      statement: 把原不等式化成辅助函数比较。
      formula_trace:
        from: |
          $(x-2022)^3f(x-2022)>1,\qquad f(1)=1$
        to: |
          $g(x-2022)>g(1)$
        operation: 用 $g(t)=t^3f(t)$ 和 $g(1)=1^3f(1)=1$ 替换。
        why: 辅助函数递增后，函数值大小等价于自变量大小。
      source_ref: page_0123
    - step_id: step_5
      statement: 利用单调性解出 $x$。
      formula_trace:
        from: |
          $g(x-2022)>g(1)$
        to: |
          $x-2022>1,\qquad x>2023$
        operation: 对递增函数两侧去掉 $g$。
        why: 这直接给出选项 C。
      source_ref: page_0123
teaching_card:
  student_title: 把 $3f+xf^{\prime}$ 打包成 $x^3f$ 的单调性
  what_it_trains: 训练从幂函数乘法导数构造辅助函数，并用奇偶性把半轴单调性延拓为全轴比较。
  recognition_cues:
    - 条件中 $3f(x)+xf^{\prime}(x)$ 对应 $x^3f(x)$。
    - 目标式有 $(x-2022)^3f(x-2022)$，提示直接设 $g(t)=t^3f(t)$。
    - $f$ 是偶函数，乘上 $x^3$ 后辅助函数变奇。
  normalization_moves:
    - 构造 $g(x)=x^3f(x)$。
    - 由 $g^{\prime}(x)=x^2[3f(x)+xf^{\prime}(x)]$ 得 $g$ 在非负半轴递增。
    - 用 $g$ 是奇函数将增性扩展到全实数。
    - 把原式写成 $g(x-2022)>g(1)$。
  common_failures:
    - 构造了 $x f(x)$ 而不是 $x^3f(x)$。
    - 看到 $x=0$ 处 $x^2=0$ 就误以为不能判单调，忽略区间内整体增性。
    - 忘记证明 $g$ 在负半轴也递增。
    - 平移时把 $x-2022>1$ 算成 $x>2021$。
  similar_practice_query: 3f+xf^{\prime} x^3f 偶函数 奇函数 单调 不等式 平移
