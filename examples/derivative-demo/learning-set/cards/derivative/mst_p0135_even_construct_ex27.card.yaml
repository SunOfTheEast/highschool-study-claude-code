solution:
  source_solution_summary: |
    由 $f(x)-f(-x)+2x^3+2x=0$ 得
    $f(x)+x^3+x=f(-x)-x^3-x$。设
    $g(x)=f(x)+x^3+x$，则 $g(-x)=g(x)$，即 $g$ 为偶函数。
    又 $g^{\prime}(x)=f^{\prime}(x)+3x^2+1$，由题设在 $x\ge0$ 上有
    $g^{\prime}(x)\le0$，故 $g$ 在 $[0,+\infty)$ 单调递减，
    由偶性可知在 $(-\infty,0)$ 单调递增。
    原不等式
    $f(x+1)-f(x)+3x^2+3x+2\le0$
    等价于
    $f(x+1)+(x+1)^3+(x+1)\le f(x)+x^3+x$，
    即 $g(x+1)\le g(x)$。再写成
    $g(|x+1|)\le g(|x|)$，在非负轴上由递减性得到
    $|x+1|\ge |x|$，解得 $x\ge-\frac12$，故选 D。
  key_steps:
    - step_id: step_1
      statement: 把奇差约束改写成偶函数约束。
      formula_trace:
        from: $f(x)-f(-x)+2x^3+2x=0$
        to: $g(x)=f(x)+x^3+x,\quad g(-x)=g(x)$
        operation: 把 $x^3+x$ 吸收到 $f$ 中，令左右两侧成为同一个函数在 $\pm x$ 处的值。
        why: 偶性是后续绝对值比较的核心。
      source_ref: page_0135_solution
    - step_id: step_2
      statement: 利用导数条件确定非负轴单调性。
      formula_trace:
        from: $x\ge0$ 时 $f^{\prime}(x)+3x^2+1\le0$
        to: $g^{\prime}(x)=f^{\prime}(x)+3x^2+1\le0\Rightarrow g$ 在 $[0,+\infty)$ 递减
        operation: 对构造函数求导并直接套导数判单调。
        why: 需要在非负轴上把函数值不等式还原为输入不等式。
      source_ref: page_0135_solution
    - step_id: step_3
      statement: 把题设目标不等式统一成 $g$ 的比较。
      formula_trace:
        from: $f(x+1)-f(x)+3x^2+3x+2\le0$
        to: $f(x+1)+(x+1)^3+(x+1)\le f(x)+x^3+x\Rightarrow g(x+1)\le g(x)$
        operation: 用恒等式 $(x+1)^3+(x+1)-(x^3+x)=3x^2+3x+2$ 完成配凑。
        why: 让不等式两侧正好对应 $g$ 在两个输入处的取值。
      source_ref: page_0135_solution
    - step_id: step_4
      statement: 偶性转绝对值，递减性给出输入方向。
      formula_trace:
        from: $g(x+1)\le g(x)$
        to: $g(|x+1|)\le g(|x|)\Rightarrow |x+1|\ge|x|$
        operation: 先用偶性统一到非负输入，再在递减函数上去掉函数符号。
        why: 最终化为一元绝对值不等式。
      source_ref: page_0135_solution
    - step_id: step_5
      statement: 解绝对值不等式并匹配选项。
      formula_trace:
        from: $|x+1|\ge|x|$
        to: $(x+1)^2\ge x^2\Rightarrow x\ge-\frac12$
        operation: 两侧平方后化简。
        why: 对应选项 D。
      source_ref: page_0135_solution
teaching_card:
  student_title: 先把差式锁成偶函数再解绝对值
  what_it_trains: 训练在“$f(x)-f(-x)$ + 多项式”结构里，快速识别可吸收项，做出偶函数后把复杂不等式降成 $|x+1|$ 与 $|x|$ 的比较。
  recognition_cues:
    - 题干有 $f(x)-f(-x)$，并伴随奇多项式 $x^3+x$。
    - 目标式出现 $3x^2+3x+2$，可联想到 $(x+1)^3+(x+1)-(x^3+x)$。
    - 选项端点是 $-\frac12$，常见于 $|x+1|$ 与 $|x|$ 比较。
  normalization_moves:
    - 先定义 $g(x)=f(x)+x^3+x$。
    - 把目标式改写为 $g(x+1)\le g(x)$。
    - 偶函数取绝对值输入，再用递减性还原输入比较。
  common_failures:
    - 没把多项式吸收进 $g$，导致结构分裂。
    - 将 $g(x+1)\le g(x)$ 误写成 $|x+1|\le|x|$。
    - 平方去绝对值时漏算中间项，端点错成 $-1$。
  similar_practice_query: 偶函数锁定 立方配凑 绝对值不等式 解集
quality:
  confidence: high
  needs_review: false
  review_notes:
