stem: |-
  （2022·安徽期末）已知定义在 $\mathbf{R}$ 上的函数 $f(x)$，其导函数为 $f^{\prime}(x)$。若 $f(x)-f(-x)+2x^3+2x=0$，且当 $x\geqslant0$ 时，$f^{\prime}(x)+3x^2+1\leqslant0$，则不等式 $f(x+1)-f(x)+3x^2+3x+2\leqslant0$ 的解集为（  ）
  A. $(-\infty,0]$
  B. $[0,+\infty)$
  C. $\left(-\infty,-\frac12\right]$
  D. $\left[-\frac12,+\infty\right)$
answer: |
  D

  由 $f(x)-f(-x)+2x^3+2x=0$ 得
  $f(x)+x^3+x=f(-x)-x^3-x$。设
  $g(x)=f(x)+x^3+x$，则 $g(-x)=g(x)$，即 $g$ 为偶函数。
  又 $g^{\prime}(x)=f^{\prime}(x)+3x^2+1$，由题设在 $x\ge0$ 上有
  $g^{\prime}(x)\le0$，故 $g$ 在 $[0,+\infty)$ 单调递减，
  由偶性可知在 $(-\infty,0)$ 单调递增。
  原不等式
  $f(x+1)-f(x)+3x^2+3x+2\le0$
  等价于
  $f(x+1)+(x+1)^3+(x+1)\le f(x)+x^3+x$，
  即 $g(x+1)\le g(x)$。再写成
  $g(|x+1|)\le g(|x|)$，在非负轴上由递减性得到
  $|x+1|\ge |x|$，解得 $x\ge-\frac12$，故选 D。
