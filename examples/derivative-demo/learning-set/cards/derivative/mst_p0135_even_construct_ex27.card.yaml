  stem: （2022·安徽期末）已知定义在 $\mathbf{R}$ 上的函数 $f(x)$，其导函数为 $f^{\prime}(x)$。若 $f(x)-f(-x)+2x^3+2x=0$，且当 $x\geqslant0$ 时，$f^{\prime}(x)+3x^2+1\leqslant0$，则不等式 $f(x+1)-f(x)+3x^2+3x+2\leqslant0$ 的解集为（  ）
  parts: *a1
  choices:
    - label: A
      text_raw: $(-\infty,0]$
      text_latex: $(-\infty,0]$
    - label: B
      text_raw: $[0,+\infty)$
      text_latex: $[0,+\infty)$
    - label: C
      text_raw: $\left(-\infty,-\frac12\right]$
