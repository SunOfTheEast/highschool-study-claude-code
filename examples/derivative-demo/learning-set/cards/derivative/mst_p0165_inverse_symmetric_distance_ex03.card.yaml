solution:
  source_solution_summary: 由 $y=e^{ex}$ 得 $\ln y=ex$，即 $x=\frac{\ln y}{e}$，故 $y=e^{ex}$ 与 $y=\frac{\ln x}{e}$ 互为反函数，图象关于 $y=x$ 对称。 直线 $x+y+a=0$ 斜率为 $-1$，与 $y=x$ 垂直，因此其与两曲线的交点 $A,B$ 关于 $y=x$ 对称。设 $B(x_0,y_0)$，则 $A(y_0,x_0)$， 且 $|AB|=2\,d(B,y=x)$。要使该距离最小，在 $y=\frac{\ln x}{e}$ 上取切线平行于 $y=x$ 的点： $y^{\prime}=\frac{1}{ex}=1\Rightarrow x_0=\frac1e$， $y_0=\frac{\ln(1/e)}{e}=-\frac1e$。于是 \[ |AB|_{\min}=2\cdot\frac{|x_0-y_0|}{\sqrt2} =2\cdot\frac{\left|\frac1e-\left(-\frac1e\right)\right|}{\sqrt2} =\frac{2\sqrt2}{e}, \] 故选 B。
  key_steps:
    - step_id: step_1
      statement: 识别两条曲线互为反函数。
      formula_trace:
        from: $y=e^{ex}$
        to: $\ln y=ex\Rightarrow x=\frac{\ln y}{e}$
        operation: 对等式取对数并整理为反解形式。
        why: 反函数图象关于 $y=x$ 对称，可把两曲线距离问题降到一侧。
      source_ref: page_0165:line 50
    - step_id: step_2
      statement: 把 $|AB|$ 转化为到对称轴 $y=x$ 的距离。
      formula_trace:
        from: $x+y+a=0\perp y=x$，且 $A,B$ 关于 $y=x$ 对称
        to: $|AB|=2|BM|=2\,d(B,\ y=x)$
        operation: 设 $B(x_0,y_0)$，对应点为 $A(y_0,x_0)$，中点 $M$ 在 $y=x$ 上。
        why: 对称点连线被对称轴平分，最短值可由单侧点到轴距离求得。
      source_ref: page_0166:line 14
    - step_id: step_3
      statement: 在 $y=\frac{\ln x}{e}$ 上找与 $y=x$ 平行的切点。
      formula_trace:
        from: $y=\frac{\ln x}{e},\ y=x$ 的斜率为 $1$
        to: $y^{\prime}=\frac{1}{ex}=1\Rightarrow x_0=\frac1e,\ y_0=-\frac1e$
        operation: 令导数等于 1，再代回函数求纵坐标。
        why: 点到直线最短时，曲线在该点的切线平行于目标直线。
      source_ref: page_0166:line 14
    - step_id: step_4
      statement: 计算最小距离并对应选项。
      formula_trace:
        from: $x_0=\frac1e,\ y_0=-\frac1e$
        to: $|AB|_{\min}=2\cdot\frac{|x_0-y_0|}{\sqrt2}=\frac{2\sqrt2}{e}$
        operation: 用点到直线 $x-y=0$ 的距离公式后乘 2。
        why: 两侧对称距离相等，总距离是单侧到轴距离的 2 倍。
      source_ref: page_0166:line 14
teaching_card:
  student_title: 反函数对称轴降维求最短距离
  what_it_trains: 训练学生把“反函数两图象交同一垂轴直线”的距离问题先降为“到 $y=x$ 的距离”，再用平行切线定点完成最值。
  recognition_cues:
    - 两条曲线可互相反解，一条是指数型一条是对数型。
    - 题中直线斜率为 $-1$，与 $y=x$ 垂直。
    - 目标是两交点间距离最小值。
  normalization_moves:
    - 反解确认两曲线互为反函数。
    - 将 $|AB|$ 写成 $2\,d(B,\ y=x)$。
    - 在单侧曲线上令导数等于 1 找切点。
    - 用 $x-y=0$ 的点线距离公式计算并翻倍。
  common_failures:
    - 没识别反函数对称性，直接双参数联立硬算。
    - 把 $y^{\prime}=\frac{1}{ex}$ 误写成 $\frac{1}{x}$。
    - 忘记总距离是单侧距离的 2 倍。
  similar_practice_query: e^{ex} 与 lnx/e 反函数对称 y=x 最短距离 平行切线
