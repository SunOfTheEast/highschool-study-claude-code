stem: |-
  （2024 · 重庆月考 T6）已知直线 $x+y+a=0$ 与曲线 $y=e^{ex}$，$y=\frac{\ln x}{e}$ 分别交于点 $A$，$B$，则 $|AB|$ 的最小值为（  ）
  A. $\frac{2}{e}$
  B. $\frac{2\sqrt{2}}{e}$
  C. 1
  D. $e$
answer: |-
  B

  由 $y=e^{ex}$ 得 $\ln y=ex$，即 $x=\frac{\ln y}{e}$，故 $y=e^{ex}$ 与 $y=\frac{\ln x}{e}$ 互为反函数，图象关于 $y=x$ 对称。 直线 $x+y+a=0$ 斜率为 $-1$，与 $y=x$ 垂直，因此其与两曲线的交点 $A,B$ 关于 $y=x$ 对称。设 $B(x_0,y_0)$，则 $A(y_0,x_0)$， 且 $|AB|=2\,d(B,y=x)$。要使该距离最小，在 $y=\frac{\ln x}{e}$ 上取切线平行于 $y=x$ 的点： $y^{\prime}=\frac{1}{ex}=1\Rightarrow x_0=\frac1e$， $y_0=\frac{\ln(1/e)}{e}=-\frac1e$。于是 \[ |AB|_{\min}=2\cdot\frac{|x_0-y_0|}{\sqrt2} =2\cdot\frac{\left|\frac1e-\left(-\frac1e\right)\right|}{\sqrt2} =\frac{2\sqrt2}{e}, \] 故选 B。
