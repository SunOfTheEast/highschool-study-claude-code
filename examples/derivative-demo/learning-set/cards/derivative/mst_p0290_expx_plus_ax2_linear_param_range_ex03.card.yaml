stem: |-
  （2024 · MST 虎哥）已知 $f(x)=e^x+ax^2+e(1-x)$，$a\in\mathbf R$，$x\in\mathbf R$。当 $x\ge0$，$f(x)\ge0$，求 $a$ 的取值范围。
  1. 求使 $x\ge0$ 时 $f(x)\ge0$ 恒成立的 $a$ 的取值范围。
answer: |-
  $a\ge\frac{e-e^2}{4}$。

  当 $x=0$ 时，$f(0)=1+e>0$。当 $x>0$ 时，把 $e^x+ax^2+e(1-x)\ge0$ 除以 $x^2$，得到 $a+\frac{e^x+e(1-x)}{x^2}\ge0$，即 $a\ge-\frac{e^x+e(1-x)}{x^2}$。source 等价地令 $q(x)=\frac{e^x+e(1-x)}{x^2}$，求它的最小值。 其导数为 $q^\prime(x)=\frac{(x-2)(e^x+e)}{x^3}$，所以 $q$ 在 $(0,2)$ 上递减，在 $(2,+\infty)$ 上递增，最小值为 $q(2)=\frac{e^2-e}{4}$。因此 $q(x)+a\ge0$ 恒成立等价于 $a+\frac{e^2-e}{4}\ge0$，即 $a\ge\frac{e-e^2}{4}$。
