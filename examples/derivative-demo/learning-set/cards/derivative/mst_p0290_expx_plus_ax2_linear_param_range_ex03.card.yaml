original_problem:
  stem: （2024 · MST 虎哥）已知 $f(x)=e^x+ax^2+e(1-x)$，$a\in\mathbf R$，$x\in\mathbf R$。当 $x\ge0$，$f(x)\ge0$，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\ge\frac{e-e^2}{4}$。
  fidelity_notes:
    - 无选项。
    - $x=0$ 处 $f(0)=1+e>0$，source 主要处理 $x>0$ 的参变量分离。
solution:
  source_solution_summary: 当 $x=0$ 时，$f(0)=1+e>0$。当 $x>0$ 时，把 $e^x+ax^2+e(1-x)\ge0$ 除以 $x^2$，得到 $a+\frac{e^x+e(1-x)}{x^2}\ge0$，即 $a\ge-\frac{e^x+e(1-x)}{x^2}$。source 等价地令 $q(x)=\frac{e^x+e(1-x)}{x^2}$，求它的最小值。 其导数为 $q^\prime(x)=\frac{(x-2)(e^x+e)}{x^3}$，所以 $q$ 在 $(0,2)$ 上递减，在 $(2,+\infty)$ 上递增，最小值为 $q(2)=\frac{e^2-e}{4}$。因此 $q(x)+a\ge0$ 恒成立等价于 $a+\frac{e^2-e}{4}\ge0$，即 $a\ge\frac{e-e^2}{4}$。
  key_steps:
    - step_id: step_1
      statement: 先处理 $x=0$。
      formula_trace:
        from: $f(x)=e^x+ax^2+e(1-x)$
        to: $f(0)=1+e>0$
        operation: 代入端点。
        why: 后面除以 $x^2$ 只适用于 $x>0$，端点必须单独检查。
      source_ref: page_0290_ex03_solution
    - step_id: step_2
      statement: 在 $x>0$ 上分离参数。
      formula_trace:
        from: $e^x+ax^2+e(1-x)\ge0$
        to: $a+\frac{e^x+e(1-x)}{x^2}\ge0$
        operation: 除以正数 $x^2$。
        why: 把恒成立求参转成一个单变量函数的最值问题。
      source_ref: page_0290_ex03_solution
    - step_id: step_3
      statement: 求分离后函数的最小值。
      formula_trace:
        from: $q(x)=\frac{e^x+e(1-x)}{x^2}$
        to: $q^\prime(x)=\frac{(x-2)(e^x+e)}{x^3}$
        operation: 求导并化简。
        why: $e^x+e>0$、$x^3>0$，导数符号只看 $x-2$。
      source_ref: page_0290_ex03_solution
    - step_id: step_4
      statement: 由最小值给出参数范围。
      formula_trace:
        from: $q_{\min}=q(2)=\frac{e^2-e}{4}$
        to: $a\ge\frac{e-e^2}{4}$
        operation: 令 $a+q_{\min}\ge0$。
        why: 这是保证 $a+q(x)\ge0$ 对所有 $x>0$ 成立的充要条件。
      source_ref: page_0290_ex03_solution
teaching_card:
  student_title: 除以 $x^2$ 后分离参数
  what_it_trains: 训练含参恒成立题中，先处理不能除的端点，再在正区间把参数分离出来求最值。
  recognition_cues:
    - 参数 $a$ 只挂在 $x^2$ 上。
    - 条件是 $x\ge0$，但除以 $x^2$ 只能在 $x>0$ 做。
    - 分离后出现 $\frac{e^x+e(1-x)}{x^2}$。
    - 求导后导数符号只由 $x-2$ 决定。
  normalization_moves:
    - 先代 $x=0$。
    - 再对 $x>0$ 除以 $x^2$。
    - 把问题转成 $a+q(x)\ge0$。
    - 求 $q(x)$ 的最小值。
  common_failures:
    - 直接除以 $x^2$，忘记检查 $x=0$。
    - 分离参数后取错最大值/最小值方向。
    - 求导化简时没有看出共同因子 $e^x+e$。
    - 把机械除法当成主方法，忽略本题真正训练的是分离参数求最值。
  similar_practice_query: e^x+a x^2+e(1-x) x>=0 参数范围 除以x^2 分离参数 x=2
