stem: |-
  已知 $a=4\ln 5^{\pi}$，$b=5\ln 4^{\pi}$，$c=5\ln \pi^{4}$，则 $a,b,c$ 的大小关系是 ( )
  A. $c<a<b$
  B. $a<b<c$
  C. $a<c<b$
  D. $c<b<a$
answer: |-
  B

  构造 $f(x)=\frac{\ln x}{x}$。因 $f'(x)=\frac{1-\ln x}{x^2}<0$ 在 $(e,+\infty)$ 上成立，所以 $f$ 在该区间递减。由 $4<5$ 得 $\frac{\ln4}{4}>\frac{\ln5}{5}$，推出 $b>a$；由 $e<\pi<4$ 得 $\frac{\ln\pi}{\pi}>\frac{\ln4}{4}$，推出 $c>b$，故 $a<b<c$。
