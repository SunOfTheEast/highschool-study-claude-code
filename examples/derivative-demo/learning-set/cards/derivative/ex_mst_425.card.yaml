original_problem:
  stem: 已知 $a=4\ln 5^{\pi}$，$b=5\ln 4^{\pi}$，$c=5\ln \pi^{4}$，则 $a,b,c$ 的大小关系是 ( )
  parts: *a1
  choices:
    - A. $c<a<b$
    - B. $a<b<c$
    - C. $a<c<b$
    - D. $c<b<a$
  answer: B
  fidelity_notes:
    - 已核对 page_0151 原图，题干中的指数分别为 $5^{\pi}$、$4^{\pi}$、$\pi^4$，选项与页 markdown 一致。
    - 源页 Reconstruction Markers 为“无”。
solution:
  source_solution_summary: 构造 $f(x)=\frac{\ln x}{x}$。因 $f'(x)=\frac{1-\ln x}{x^2}<0$ 在 $(e,+\infty)$ 上成立，所以 $f$ 在该区间递减。由 $4<5$ 得 $\frac{\ln4}{4}>\frac{\ln5}{5}$，推出 $b>a$；由 $e<\pi<4$ 得 $\frac{\ln\pi}{\pi}>\frac{\ln4}{4}$，推出 $c>b$，故 $a<b<c$。
  key_steps:
    - step_id: step_1
      statement: 建立比较函数并确定单调区间。
      formula_trace:
        from: $f(x)=\frac{\ln x}{x}$
        to: $f'(x)=\frac{1-\ln x}{x^2}<0\quad (x>e)$
        operation: 求导，并利用 $x>e\Rightarrow \ln x>1$ 判断导数为负。
        why: 后续所有数值都落在 $e$ 右侧或用 $e<\pi<4<5$ 比较，可用递减性。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0151/page_0151.md:27
    - step_id: step_2
      statement: 比较 $a$ 与 $b$。
      formula_trace:
        from: $4<5$ 且 $4,5>e$
        to: $\frac{\ln4}{4}>\frac{\ln5}{5}\Rightarrow 5\pi\ln4>4\pi\ln5\Rightarrow b>a$
        operation: 由 $f$ 递减得到分式比较，再同乘正数 $20\pi$，并用 $\ln x^r=r\ln x$ 还原。
        why: $a=4\ln5^{\pi}=4\pi\ln5$，$b=5\ln4^{\pi}=5\pi\ln4$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0151/page_0151.md:27
    - step_id: step_3
      statement: 比较 $b$ 与 $c$。
      formula_trace:
        from: $e<\pi<4$
        to: $\frac{\ln\pi}{\pi}>\frac{\ln4}{4}\Rightarrow 4\ln\pi>\pi\ln4\Rightarrow 5\ln\pi^4>5\ln4^{\pi}\Rightarrow c>b$
        operation: 由递减性比较 $f(\pi)$ 与 $f(4)$，同乘正数 $4\pi$，再用对数幂展开还原到 $b,c$。
        why: $c=5\ln\pi^4=20\ln\pi$，$b=5\ln4^{\pi}=5\pi\ln4$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0151/page_0151.md:27
    - step_id: step_4
      statement: 合并大小关系并选项。
      formula_trace:
        from: $b>a$ 且 $c>b$
        to: $a<b<c$
        operation: 传递合并两个严格不等式。
        why: 选项 B 与合并后的顺序一致。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0151/page_0151.md:22-27
teaching_card:
  student_title: 把对数乘积统一成 $\ln x/x$ 比大小
  what_it_trains: 看到 $m\ln n^r$ 这类交叉乘积时，先展开幂指数，再把目标不等式改写成 $\frac{\ln x}{x}$ 的函数值比较；本题不是复杂大题同构，而是小题中的快速标准化。
  recognition_cues:
    - 待比较对象含有 $4\ln5^{\pi}$、$5\ln4^{\pi}$ 这类“系数与底数交叉”的形式。
    - 变量底数都在 $e$ 右侧，适合直接调用 $\frac{\ln x}{x}$ 递减。
    - 比较 $\pi^4$ 与 $4^{\pi}$ 或 $5\ln\pi^4$ 与 $5\ln4^{\pi}$ 时，可转成 $\frac{\ln\pi}{\pi}$ 与 $\frac{\ln4}{4}$。
  normalization_moves:
    - 先用 $\ln u^v=v\ln u$ 去掉指数位置的常数。
    - 比较 $k\ln m$ 与 $m\ln k$ 时，除以正数 $km$，转成 $\ln m/m$ 与 $\ln k/k$。
    - 确认比较点位于 $e$ 的同侧；本题 $e<\pi<4<5$，均使用递减段。
  common_failures:
    - 直接用 $4<5$ 判断 $4\ln5^{\pi}$ 与 $5\ln4^{\pi}$，忽略系数和对数底数交叉。
    - 把 $\ln5^{\pi}$ 误读成 $(\ln5)^{\pi}$。
    - 忘记 $\frac{\ln x}{x}$ 在 $(e,+\infty)$ 上递减，导致不等号方向反了。
    - 比较 $c$ 与 $b$ 时只看 $\pi<4$，没有先标准化到 $\ln x/x$。
  similar_practice_query: 对数幂乘积 比大小 ln x / x 递减
