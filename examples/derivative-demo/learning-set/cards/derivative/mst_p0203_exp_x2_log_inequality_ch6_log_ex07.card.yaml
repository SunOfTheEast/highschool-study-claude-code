original_problem:
  stem: （2018 · 郑州二模 T21）已知函数 $f(x)=e^x-x^2$，求证：当 $x>0$ 时，$\frac{e^x+(2-e)x-1}{x}\geqslant \ln x+1$。
  parts: *a1
  choices: []
  answer: 不等式成立，且在 $x=1$ 取等号。
  fidelity_notes:
    - 源题是证明题，无选项。
    - 等号条件“当且仅当 $x=1$”在 source 解析中已明示。
solution:
  source_solution_summary: |
    因为 $x>0$，先乘 $x$ 并移项，目标等价于 $e^x-ex+x-1-x\ln x\ge0$。按源解写成 $\bigl(e^x-ex-(x-1)^2\bigr)+\bigl(x^2-x-x\ln x\bigr)\ge0$。 第一项令 $A(x)=e^x-ex-(x-1)^2$，由二、三阶导数分析得 $A(x)\ge0\ (x\ge0)$，且 $x=0,1$ 取等；第二项令 $B(x)=x^2-x-x\ln x=x(x-1-\ln x)\ge0\ (x>0)$， 且 $x=1$ 取等。两项相加得结论，并且仅在 $x=1$ 取等。
  key_steps:
    - step_id: step_1
      statement: 把原式化成 source 给出的等价目标。
      formula_trace:
        from: $\frac{e^x+(2-e)x-1}{x}\ge \ln x+1,\ x>0$
        to: $e^x-(x-1)^2-ex+x^2-x-x\ln x\ge0$
        operation: 乘以正数 $x$ 并配凑 $(x-1)^2$。
        why: 与源解一致地拆出两个可独立证明的子不等式。
      source_ref: page_0203_ex07_solution
    - step_id: step_2
      statement: 证明第一条：$e^x\ge ex+(x-1)^2\ (x\ge0)$。
      formula_trace:
        from: $A(x)=e^x-ex-(x-1)^2$
        to: $A(x)\ge0$，且 $x=0,1$ 取等
        operation: 求导：$A^{\prime}(x)=e^x-e-2x+2$，$A^{\prime\prime}(x)=e^x-2$，$A^{\prime\prime\prime}(x)=e^x>0$，据此判定 $A$ 在 $[0,1]$ 先增后减且端点同为 0，在 $(1,+\infty)$ 递增。
        why: 给出第一项非负与等号点。
      source_ref: page_0203_ex07_solution
    - step_id: step_3
      statement: 证明第二条：$x^2-x-x\ln x\ge0\ (x>0)$。
      formula_trace:
        from: $B(x)=x(x-1-\ln x)$
        to: $x-1-\ln x\ge0\Rightarrow B(x)\ge0$
        operation: 令 $\phi(x)=x-1-\ln x$，$\phi^{\prime}(x)=1-\frac1x$，在 $x=1$ 处取最小值 0。
        why: 这是 source 解析明确提示的第二条基础不等式。
      source_ref: page_0203_ex07_solution
    - step_id: step_4
      statement: 合并两条子不等式，得到原命题及等号。
      formula_trace:
        from: step_2 与 step_3
        to: $\frac{e^x+(2-e)x-1}{x}\ge \ln x+1$，且当且仅当 $x=1$ 取等
        operation: 对子目标求和并回代 step_1。
        why: 闭合 source 给出的证明链。
      source_ref: page_0203_ex07_solution
teaching_card:
  student_title: 配凑平方后双不等式并联
  what_it_trains: 训练把分式型指对不等式改写为两个可验证子命题，再通过求和完成整体证明。
  recognition_cues:
    - 分式左边含 $e^x$ 与线性项，右边是 $\ln x+1$。
    - source 明确提示“需分别证明两条不等式”。
    - 表达式可自然配凑 $(x-1)^2$。
  normalization_moves:
    - 先乘 $x$ 再移项，去掉分母。
    - 配凑 $(x-1)^2$ 并拆成两项。
    - 对子项分别判号后再相加。
  common_failures:
    - 漏掉 $x>0$ 就直接乘 $x$，等价性说明不完整。
    - 把 $x^2-x-x\ln x$ 错写成 $(x-1-\ln x)$，漏乘因子 $x$。
    - 只验证数值点，未证明两条子不等式在区间内成立。
  similar_practice_query: 指数对数不等式 配凑(x-1)^2 两条子不等式相加
