solution:
  source_solution_summary: |
    由
    \[
    g(x)=\frac{f(x)}{e^x}
    \]
    得
    \[
    g^{\prime}(x)=\frac{f^{\prime}(x)-f(x)}{e^x}.
    \]
    由题设
    \[
    (x-1)\bigl(f^{\prime}(x)-f(x)\bigr)\ge0,\ \text{且仅 }x=1\text{ 取等},
    \]
    可知 $x<1$ 时 $f^{\prime}(x)-f(x)<0$，$x>1$ 时 $f^{\prime}(x)-f(x)>0$，故
    $g^{\prime}(x)<0$（$x<1$），$g^{\prime}(x)>0$（$x>1$）。
    所以 $g$ 在 $(-\infty,1)$ 递减、在 $(1,+\infty)$ 递增，$x=1$ 为极小值点。
    因而 A 对、B 错。
    对 C：由极小值点并不能推出“必有2个零点”，例如当 $g(1)>0$ 时可无零点，故 C 错。
    对 D：在 $(1,+\infty)$ 上递增且 $2<e$，故
    \[
    g(2)<g(e)\Rightarrow \frac{f(2)}{e^2}<\frac{f(e)}{e^e}
    \Rightarrow e^ef(2)<e^2f(e),
    \]
    即 D 对。综上选 AD。
  key_steps:
    - step_id: step_1
      statement: 先把题设不等式转译到 $g^{\prime}(x)$。
      formula_trace:
        from: $g(x)=\frac{f(x)}{e^x}$
        to: $g^{\prime}(x)=\frac{f^{\prime}(x)-f(x)}{e^x}$
        operation: 商求导并约去公共因子 $e^x$。
        why: 把 $(x-1)[f^{\prime}(x)-f(x)]$ 与导数符号直接挂钩。
      source_ref: page_0136_solution
    - step_id: step_2
      statement: 用“仅在 $x=1$ 取等号”确定两侧严格单调。
      formula_trace:
        from: $(x-1)[f^{\prime}(x)-f(x)]\ge0$，且仅 $x=1$ 等号
        to: $x<1\Rightarrow g^{\prime}(x)<0,\ x>1\Rightarrow g^{\prime}(x)>0$
        operation: 分区间看 $(x-1)$ 的符号。
        why: 得到 A、B 所需的单调与极值性质。
      source_ref: page_0136_solution
    - step_id: step_3
      statement: 判定 A、B。
      formula_trace:
        from: $g^{\prime}(x)<0$（$x<1$），$g^{\prime}(x)>0$（$x>1$）
        to: A 正确，B 错误（$x=1$ 为极小值点）
        operation: 由导数符号到函数增减表。
        why: 直接对应选项描述。
      source_ref: page_0136_solution
    - step_id: step_4
      statement: 判定 C：它不是必然命题。
      formula_trace:
        from: $g(1)=\frac{f(1)}{e}$
        to: 若 $g(1)>0$，则 $g$ 可无零点
        operation: 利用最小值点可高于 0 的情形构造反例。
        why: “必有2个零点”被否定。
      source_ref: page_0136_solution
    - step_id: step_5
      statement: 判定 D：递增区间内比较两点。
      formula_trace:
        from: $g(2)<g(e)$
        to: $e^2f(e)>e^ef(2)$
        operation: 代入 $g(x)=\frac{f(x)}{e^x}$ 并同乘正数。
        why: 把函数值比较还原成选项里的代数不等式。
      source_ref: page_0136_solution
teaching_card:
  student_title: 先把 $f^{\prime}-f$ 吸收进指数商，再分区间判结论
  what_it_trains: 训练把“导数与函数差”型条件转成商函数导数符号，再完成单调、极值、零点与数值比较的联动判断。
  recognition_cues:
    - 题设出现 $(x-a)\,[f^{\prime}(x)-f(x)]$ 的符号条件。
    - 给出或暗示指数因子 $e^x$，适合构造 $\frac{f}{e^x}$。
    - 选项同时覆盖“单调-极值-零点-两点比较”。
  normalization_moves:
    - 把题设拆成 $x<1$ 与 $x>1$ 两段符号。
    - 作 $g=\frac{f}{e^x}$ 并写出 $g^{\prime}$。
    - 递增区间内先比 $g$，再反代成 $f$ 的不等式。
  common_failures:
    - 忽略“仅在 $x=1$ 取等号”，把严格不等式写成非严格。
    - 把“极小值点”误写成“极大值点”。
    - 将“可有2个零点”误判成“必有2个零点”。
  similar_practice_query: 抽象函数 f^{\prime}(x)-f(x) 指数商构造 左减右增 极值点 零点必然性 比较 g(2) 与 g(e)
