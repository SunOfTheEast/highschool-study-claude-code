stem: |-
  （2023 · 长沙县月考）已知函数 $f(x)=ae^x-\ln(x+a)-1$。
  1. 若 $f(x)$ 的极小值为 $0$，求实数 $a$ 的值。
  2. 当 $a>0$ 时，证明：$f(x)$ 存在唯一极值点 $x_0$，且 $f(x_0)+2|x_0|\ge0$。
answer: |-
  第(1)问：$a=1$。第(2)问：$f(x)$ 存在唯一极值点 $x_0$，且 $f(x_0)+2|x_0|\ge0$。

  第(1)问：定义域为 $(-a,+\infty)$， $f^\prime(x)=ae^x-\frac1{x+a}$。若 $a\le0$，则 $f^\prime(x)<0$，无极值，所以 $a>0$。此时 $f^{\prime\prime}(x)=ae^x+\frac1{(x+a)^2}>0$， $f^\prime$ 单调递增。设极小值点为 $x_1$，由 $f^\prime(x_1)=0$ 与 $f(x_1)=0$ 得 $ae^{x_1}=\frac1{x_1+a}$，以及 $\frac1{x_1+a}-\ln(x_1+a)-1=0$。令 $t=x_1+a$，$\varphi(t)=\frac1t-\ln t-1$ 单调递减， 且 $\varphi(1)=0$，故 $x_1+a=1$。再由 $ae^{x_1}=1$ 得 $x_1=0,a=1$。 第(2)问：当 $a>0$ 时，$f^{\prime\prime}>0$，所以 $f^\prime$ 严格递增，并由端点趋势知存在唯一极值点 $x_0$。 若 $a=1$，由第(1)问 $x_0=0$，等号成立。若 $0<a<1$，$f^\prime(0)<0$，所以 $x_0>0$；用 $ae^{x_0}=\frac1{x_0+a}$ 得 $f(x_0)+2|x_0| =\frac1{x_0+a}-\ln(x_0+a)+2x_0-1$，再由 $x_0+a<x_0+1$ 下放到 $\frac1{x_0+1}-\ln(x_0+1)+2x_0-1>0$。若 $a>1$，$f^\prime(0)>0$，所以 $x_0<0$；第一次只代换指数不能证明， 改由 $f^\prime(x_0)=0$ 得 $\ln(x_0+a)=-\ln a-x_0$，于是 $f(x_0)+2|x_0|=ae^{x_0}+\ln a-x_0-1 >e^{x_0}-x_0-1>0$。
rubric:
  max_score: 7
  criteria:
    - step_id: step_1
      description: 先排除 $a\le0$，确认极小值点只能在 $a>0$ 时出现。
      max_score: 1
    - step_id: step_2
      description: 用极小值点同时满足导数为零和函数值为零来消元。
      max_score: 1
    - step_id: step_3
      description: 令 $t=x_1+a$，解出第(1)问参数。
      max_score: 1
    - step_id: step_4
      description: 第(2)问先证明唯一极值点，并用 $f^\prime(0)$ 判断 $x_0$ 正负。
      max_score: 1
    - step_id: step_5
      description: 处理 $0<a<1$：代换指数部分并向 $x_0+1$ 放缩。
      max_score: 1
    - step_id: step_6
      description: 处理 $a>1$：第一次代换指数失败，改代换对数。
      max_score: 1
    - step_id: step_7
      description: 用对数代换完成 $a>1$ 情形。
      max_score: 1
