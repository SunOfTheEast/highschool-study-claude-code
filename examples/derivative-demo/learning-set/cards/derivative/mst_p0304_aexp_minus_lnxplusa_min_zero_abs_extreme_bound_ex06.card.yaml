original_problem:
  stem: （2023 · 长沙县月考）已知函数 $f(x)=ae^x-\ln(x+a)-1$。
  parts: *a1
  choices: []
  answer: 第(1)问：$a=1$。第(2)问：$f(x)$ 存在唯一极值点 $x_0$，且 $f(x_0)+2|x_0|\ge0$。
  fidelity_notes:
    - 无选项。
    - 第(2)问的关键分界是 $f^\prime(0)=a-\frac1a$，不是机械按绝对值分段。
solution:
  source_solution_summary: 第(1)问：定义域为 $(-a,+\infty)$， $f^\prime(x)=ae^x-\frac1{x+a}$。若 $a\le0$，则 $f^\prime(x)<0$，无极值，所以 $a>0$。此时 $f^{\prime\prime}(x)=ae^x+\frac1{(x+a)^2}>0$， $f^\prime$ 单调递增。设极小值点为 $x_1$，由 $f^\prime(x_1)=0$ 与 $f(x_1)=0$ 得 $ae^{x_1}=\frac1{x_1+a}$，以及 $\frac1{x_1+a}-\ln(x_1+a)-1=0$。令 $t=x_1+a$，$\varphi(t)=\frac1t-\ln t-1$ 单调递减， 且 $\varphi(1)=0$，故 $x_1+a=1$。再由 $ae^{x_1}=1$ 得 $x_1=0,a=1$。 第(2)问：当 $a>0$ 时，$f^{\prime\prime}>0$，所以 $f^\prime$ 严格递增，并由端点趋势知存在唯一极值点 $x_0$。 若 $a=1$，由第(1)问 $x_0=0$，等号成立。若 $0<a<1$，$f^\prime(0)<0$，所以 $x_0>0$；用 $ae^{x_0}=\frac1{x_0+a}$ 得 $f(x_0)+2|x_0| =\frac1{x_0+a}-\ln(x_0+a)+2x_0-1$，再由 $x_0+a<x_0+1$ 下放到 $\frac1{x_0+1}-\ln(x_0+1)+2x_0-1>0$。若 $a>1$，$f^\prime(0)>0$，所以 $x_0<0$；第一次只代换指数不能证明， 改由 $f^\prime(x_0)=0$ 得 $\ln(x_0+a)=-\ln a-x_0$，于是 $f(x_0)+2|x_0|=ae^{x_0}+\ln a-x_0-1 >e^{x_0}-x_0-1>0$。
  key_steps:
    - step_id: step_1
      statement: 先排除 $a\le0$，确认极小值点只能在 $a>0$ 时出现。
      formula_trace:
        from: $f^\prime(x)=ae^x-\frac1{x+a}$
        to: $a>0$
        operation: 若 $a\le0$，则 $ae^x\le0$ 且 $-\frac1{x+a}<0$。
        why: 极小值为 $0$ 先要求函数确有极值。
      source_ref: page_0304_ex06_part1_solution
    - step_id: step_2
      statement: 用极小值点同时满足导数为零和函数值为零来消元。
      formula_trace:
        from: $f^\prime(x_1)=0,\quad f(x_1)=0$
        to: $\frac1{x_1+a}-\ln(x_1+a)-1=0$
        operation: 由 $ae^{x_1}=\frac1{x_1+a}$ 代回 $f(x_1)=0$。
        why: 把含参极小值条件降成只含 $x_1+a$ 的方程。
      source_ref: page_0304_ex06_part1_solution
    - step_id: step_3
      statement: 令 $t=x_1+a$，解出第(1)问参数。
      formula_trace:
        from: $\frac1t-\ln t-1=0$
        to: $t=1,\quad x_1=0,\quad a=1$
        operation: 利用 $\frac1t-\ln t-1$ 单调递减且在 $t=1$ 为零。
        why: 这锁定极小值为零时的唯一参数。
      source_ref: page_0304_ex06_part1_solution
    - step_id: step_4
      statement: 第(2)问先证明唯一极值点，并用 $f^\prime(0)$ 判断 $x_0$ 正负。
      formula_trace:
        from: $f^{\prime\prime}(x)=ae^x+\frac1{(x+a)^2}>0,\quad f^\prime(0)=a-\frac1a$
        to: $a=1\Rightarrow x_0=0;\ 0<a<1\Rightarrow x_0>0;\ a>1\Rightarrow x_0<0$
        operation: 用 $f^\prime$ 严格递增和零点相对 $0$ 的位置。
        why: 绝对值 $|x_0|$ 的拆法由 $x_0$ 的符号决定。
      source_ref: page_0304_ex06_part2_split
    - step_id: step_5
      statement: 处理 $0<a<1$：代换指数部分并向 $x_0+1$ 放缩。
      formula_trace:
        from: $ae^{x_0}=\frac1{x_0+a}$
        to: $f(x_0)+2|x_0|>\frac1{x_0+1}-\ln(x_0+1)+2x_0-1>0$
        operation: 用 $x_0+a<x_0+1$ 与 $\frac1u-\ln u$ 递减，再拆成 $x_0-\ln(x_0+1)$ 和 $\frac1{x_0+1}+x_0+1-2$。
        why: 这个方向能把单调性调整成可直接判正的式子。
      source_ref: page_0304_ex06_part2_split
    - step_id: step_6
      statement: 处理 $a>1$：第一次代换指数失败，改代换对数。
      formula_trace:
        from: $ae^{x_0}(x_0+a)=1$
        to: $\ln(x_0+a)=-\ln a-x_0$
        operation: 对导数零点方程取对数。
        why: 此时产生极值点的主体变量是 $-\frac1{x+a}$，换对数项才顺单调。
      source_ref: page_0305_ex06_part2_tail
    - step_id: step_7
      statement: 用对数代换完成 $a>1$ 情形。
      formula_trace:
        from: $f(x_0)+2|x_0|=ae^{x_0}+\ln a-x_0-1$
        to: $f(x_0)+2|x_0|>e^{x_0}-x_0-1>0$
        operation: 用 $a>1$、$\ln a>0$，再用 $e^x>x+1$。
        why: 完成绝对值另一侧的证明。
      source_ref: page_0305_ex06_part2_tail
teaching_card:
  student_title: 按主体变量选择隐点代换方向
  what_it_trains: 训练含绝对值的极值点不等式：先确定隐点位置，再判断该消指数项还是消对数项。
  recognition_cues:
    - 函数里同时有 $ae^x$ 和 $\ln(x+a)$。
    - 目标里出现 $f(x_0)$ 和 $|x_0|$，而 $x_0$ 是极值点。
    - $f^\prime(0)=a-\frac1a$ 直接决定 $x_0$ 在 0 的哪一侧。
    - 同一个隐点方程可以消指数，也可以消对数，方向不同结果差很多。
  normalization_moves:
    - 第(1)问不要硬求极小值点，先把 $x_1+a$ 当整体。
    - 第(2)问先拆 $a=1,0<a<1,a>1$。
    - $0<a<1$ 时换掉 $ae^{x_0}$，再向 $x_0+1$ 放缩。
    - $a>1$ 时换掉 $\ln(x_0+a)$，得到 $e^{x_0}-x_0-1$。
  common_failures:
    - 忘记检查 $a\le0$ 时没有极值。
    - 把 $f^{\prime\prime}$ 的正性写成只在极值点成立。
    - 第(2)问不先判断 $x_0$ 正负就展开绝对值。
    - 在 $0<a<1$ 情形把放缩方向写反。
    - $a>1$ 情形坚持只代换指数，导致证明卡死。
  similar_practice_query: ae^x ln(x+a) 极值点 绝对值 隐点代换 指数对数分流
