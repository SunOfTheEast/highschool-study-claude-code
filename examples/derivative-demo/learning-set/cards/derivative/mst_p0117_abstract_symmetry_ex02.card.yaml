stem: |-
  （2024·南京模拟·多选）已知函数 $f(x)$ 及其导函数 $f'(x)$ 的定义域均为 $\mathbf{R}$，记 $g(x)=f'(x)$，若 $f(2x+1)$，$g(x-1)$ 均为偶函数，则下列等式一定正确的是（ ）
  A. $f(-1)=0$
  B. $f(-3)=f(5)$
  C. $g(2)=0$
  D. $g\left(-\frac{1}{2}\right)=g\left(\frac{7}{2}\right)$
answer: |
  B

  由 $f(2x+1)$ 为偶函数，得 $f(x)$ 关于直线 $x=1$ 对称，
  因而 $f(-3)=f(5)$，B 正确。又 $g(x)=f'(x)$ 关于点 $(1,0)$ 对称。
  由 $g(x-1)$ 为偶函数得 $g$ 关于直线 $x=-1$ 对称。
  对同一函数 $g$ 而言，中心 $(1,0)$ 与对称轴 $x=-1$ 的距离为 $2$，
  所以周期可取 $4\\times2=8$，并可推出其中心在 $(4k-3,0)$、
  对称轴在 $x=4k-1$（$k\\in\\mathbf Z$）。
  A项：由 $g$ 关于 $x=-1$ 对称，只能推出 $f$ 关于某点 $(-1,b)$ 对称，
  故 $f(-1)=b$ 不必为0，A错。
  C项：$x=2$ 不是必然中心点，$g(2)$ 不必为0，C错。
  D项要求关于 $x=\\frac32$ 对称才成立，但 $x=\\frac32$ 不是上述必然对称轴，
  故D错。综上选 B。
