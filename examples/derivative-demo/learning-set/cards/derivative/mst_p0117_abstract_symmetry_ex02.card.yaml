solution:
  source_solution_summary: |
    由 $f(2x+1)$ 为偶函数，得 $f(x)$ 关于直线 $x=1$ 对称，
    因而 $f(-3)=f(5)$，B 正确。又 $g(x)=f'(x)$ 关于点 $(1,0)$ 对称。
    由 $g(x-1)$ 为偶函数得 $g$ 关于直线 $x=-1$ 对称。
    对同一函数 $g$ 而言，中心 $(1,0)$ 与对称轴 $x=-1$ 的距离为 $2$，
    所以周期可取 $4\\times2=8$，并可推出其中心在 $(4k-3,0)$、
    对称轴在 $x=4k-1$（$k\\in\\mathbf Z$）。
    A项：由 $g$ 关于 $x=-1$ 对称，只能推出 $f$ 关于某点 $(-1,b)$ 对称，
    故 $f(-1)=b$ 不必为0，A错。
    C项：$x=2$ 不是必然中心点，$g(2)$ 不必为0，C错。
    D项要求关于 $x=\\frac32$ 对称才成立，但 $x=\\frac32$ 不是上述必然对称轴，
    故D错。综上选 B。
  key_steps:
    - step_id: step_1
      statement: 由 $f(2x+1)$ 偶函数得到 f 的轴对称并判定 B。
      formula_trace:
        from: $f(2x+1)$ 为偶函数
        to: $f(1+t)=f(1-t)$，即 $f$ 关于 $x=1$ 对称，故 $f(-3)=f(5)$
        operation: 把偶性改写成关于中点1的等值关系。
        why: B项正是关于 $x=1$ 的对称点取值。
      source_ref: page_0117
    - step_id: step_2
      statement: 把两个条件都转成 g 的几何对称信息。
      formula_trace:
        from: $g=f'$，$f$ 关于 $x=1$ 对称，且 $g(x-1)$ 为偶函数
        to: $g$ 关于点 $(1,0)$ 对称，且关于直线 $x=-1$ 对称
        operation: 用原函数与导函数的对称对应定理 + 偶性平移还原。
        why: 后续周期构造依赖“一个中心 + 一条轴”。
      source_ref: page_0117
    - step_id: step_3
      statement: 由一点一轴构造周期并筛掉 C、D。
      formula_trace:
        from: 中心 $(1,0)$，对称轴 $x=-1$
        to: 周期 $T=4|1-(-1)|=8$；中心 $(4k-3,0)$；对称轴 $x=4k-1$
        operation: 应用一点一轴距离四倍为周期的结论。
        why: $x=2$ 不是必然中心，$x=\frac32$ 不是必然对称轴，所以 C、D 不一定成立。
      source_ref: page_0117
    - step_id: step_4
      statement: 解释 A 只可得常数值，不可得零值。
      formula_trace:
        from: $g$ 关于 $x=-1$ 对称
        to: $f$ 关于点 $(-1,b)$ 对称，故 $f(-1)=b$（常数但不必为0）
        operation: 用“导函数轴对称 ↔ 原函数中心对称”反推。
        why: A将未知常数误写成0，因此错误。
      source_ref: page_0117
teaching_card:
  student_title: 双偶性条件下的“一点一轴”周期构造
  what_it_trains: 训练在抽象函数多选题中，把复合偶性快速还原成对称轴/中心，再用固定周期模板做“必然性”判断。
  recognition_cues:
    - 题干给出 $f(2x+1)$、$g(x-1)$ 都是偶函数。
    - 出现 $g=f'$，要把 f 与 g 的对称关系联动处理。
    - 选项含“等于0”与“两点函数值相等”混合，需先判断点位是否为必然对称点。
  normalization_moves:
    - 偶性平移还原：$u(x-a)$ 偶 $\Rightarrow$ $u$ 关于 $x=a$ 轴对称。
    - 从 f 的轴对称推出 g 的中心对称。
    - 一点一轴配周期：$T=4\times$（中心到轴距离）。
    - 将候选点映射到“中心族/轴族”再判真伪。
  common_failures:
    - 把 $f(2x+1)$ 偶误判成 f 关于原点偶。
    - 忘记导函数对称转换，直接在 f 与 g 之间硬套同一种对称。
    - 把周期8误解为“任意相差8k才相等”，忽略还需同一函数值轨道。
    - 将 A 项中的常数中心值误写成0。
  similar_practice_query: 抽象函数 多选 f(2x+1)偶 g(x-1)偶 一点一轴 周期8
