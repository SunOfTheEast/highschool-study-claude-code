stem: |-
  （2023 · 成都模拟 T12）已知函数 $f(x)=\frac{e^x}{x}+t\left(3\ln x+\frac2x-x\right)$ 有两个极值点，则 $t$ 的取值范围为（  ）
  A. $(e^3,+\infty)$
  B. $(-\infty,-\frac12)\cup\{e^3\}$
  C. $(-\infty,-e)\cup(-e,-\frac12)\cup\{e^3\}$
  D. $(-\infty,-e)\cup(-e,-\frac12)$
answer: |-
  C

  求导得 $f^{\prime}(x)=\frac{x-1}{x^2}(e^x-tx+2t)$。 因“有两个极值点”，$f^{\prime}(x)$ 需有两个变号零点； 已知 $x=1$ 是一个零点，因此 $g(x)=e^x-tx+2t$ 在 $(0,1)\cup(1,+\infty)$ 上应恰有一个零点。 又 $g(2)=e^2\ne0$，可改写为 $t=\frac{e^x}{x-2}=h(x)$ 在同一区间恰有一个解。 对 $h(x)$，有 $h^{\prime}(x)=\frac{e^x(x-3)}{(x-2)^2}$，故在 $(0,1),(1,2),(2,3)$ 递减，在 $(3,+\infty)$ 递增； 且 $h(0)=-\frac12,\ h(1)=-e,\ h(3)=e^3$。 于是恰一解当且仅当 $t<-\frac12$ 且 $t\ne-e$，或 $t=e^3$，即 $(-\infty,-e)\cup(-e,-\frac12)\cup\{e^3\}$，选 C。
