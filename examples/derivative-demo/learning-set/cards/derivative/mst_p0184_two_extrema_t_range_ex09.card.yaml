solution:
  source_solution_summary: 求导得 $f^{\prime}(x)=\frac{x-1}{x^2}(e^x-tx+2t)$。 因“有两个极值点”，$f^{\prime}(x)$ 需有两个变号零点； 已知 $x=1$ 是一个零点，因此 $g(x)=e^x-tx+2t$ 在 $(0,1)\cup(1,+\infty)$ 上应恰有一个零点。 又 $g(2)=e^2\ne0$，可改写为 $t=\frac{e^x}{x-2}=h(x)$ 在同一区间恰有一个解。 对 $h(x)$，有 $h^{\prime}(x)=\frac{e^x(x-3)}{(x-2)^2}$，故在 $(0,1),(1,2),(2,3)$ 递减，在 $(3,+\infty)$ 递增； 且 $h(0)=-\frac12,\ h(1)=-e,\ h(3)=e^3$。 于是恰一解当且仅当 $t<-\frac12$ 且 $t\ne-e$，或 $t=e^3$，即 $(-\infty,-e)\cup(-e,-\frac12)\cup\{e^3\}$，选 C。
  key_steps:
    - step_id: step_1
      statement: 导函数因式分解并锁定固定根。
      formula_trace:
        from: $f(x)=\frac{e^x}{x}+t\left(3\ln x+\frac2x-x\right)$
        to: $f^{\prime}(x)=\frac{x-1}{x^2}(e^x-tx+2t)$
        operation: 求导、通分、提取公因子 $(x-1)$。
        why: 极值点个数由 $f^{\prime}(x)$ 变号零点个数决定。
      source_ref: page_0185
    - step_id: step_2
      statement: 把“再有一根”改写成参数方程。
      formula_trace:
        from: $e^x-tx+2t=0$
        to: $t=\frac{e^x}{x-2}$
        operation: 移项并除以 $x-2$（借助 $g(2)=e^2\ne0$ 排除 x=2）。
        why: 把参数判根数转成水平线与单变量曲线的交点数问题。
      source_ref: page_0185
    - step_id: step_3
      statement: 用单调区间与关键值判“恰一解”。
      formula_trace:
        from: $h(x)=\frac{e^x}{x-2},\ h^{\prime}(x)=\frac{e^x(x-3)}{(x-2)^2}$
        to: $t<-\frac12,\ t\ne-e\ \text{或}\ t=e^3$
        operation: 分区间读值域并排除导致与固定根重合的 $t=-e$。
        why: 确保 $f^{\prime}(x)$ 除 x=1 外仅再给一个变号零点。
      source_ref: page_0185
teaching_card:
  student_title: 先锁固定根，再做参数判单根
  what_it_trains: 训练在“两个极值点”题里先拆固定根，再把剩余参数条件转成单变量函数的交点计数。
  recognition_cues:
    - 导函数可提取 $(x-1)$。
    - 题目只问参数 $t$ 的范围。
    - 解法出现 $t=\frac{e^x}{x-2}$ 这类参变分离式。
  normalization_moves:
    - 先把 $f^{\prime}(x)$ 因式分解。
    - 固定根 x=1 单独处理。
    - 改写为 $t=h(x)$ 后按区间值域判“恰一根”。
  common_failures:
    - 漏掉 $t=-e$ 需要剔除。
    - 只写 $t<-\frac12$，漏掉孤立点 $t=e^3$。
    - 把 $(1,+\infty)$ 当成连通区间，忽略 x=2 间断。
  similar_practice_query: 导函数因式分解 固定根 x=1 参数判根数 t=e^x/(x-2)
