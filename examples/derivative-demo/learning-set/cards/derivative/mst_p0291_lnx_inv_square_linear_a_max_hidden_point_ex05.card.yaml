original_problem:
  stem: （2024 吉林中学生数学奥林匹克竞赛一试第10题）已知函数 $f(x)=\ln x-\frac1{x^2}+\frac{2a}{x}-ax$。若 $\exists m>0$，使得 $f(m)\ge a^2$，则实数 $a$ 的最大值为。
  parts: *a1
  choices: []
  answer: $a_{\max}=\frac1e$。
  fidelity_notes:
    - 无选项。
    - 解析里把 $f-a^2$ 简写成 $f$ 的地方已在 source_discrepancies 记录。
solution:
  source_solution_summary: 令 $\Phi_a(x)=f(x)-a^2=\ln x-\frac1{x^2}+\frac{2a}{x}-ax-a^2$。 若最大参数处恰好取到边界，隐点探路应满足 $\Phi_a(x_0)=0,\Phi_a^\prime(x_0)=0$。联立可解得 $a=1/e,x_0=e$。当 $a=1/e$ 时， $\Phi_a(x)=\ln x-\frac{x}{e}-(\frac1x-\frac1e)^2$， 代入 $x=e$ 得 $\Phi_a(e)=0$，所以存在 $m=e$ 使 $f(m)\ge a^2$。当 $a>1/e$ 时， $\Phi_a(x)=\ln x-ax-(\frac1x-a)^2 <\ln x-\frac{x}{e}-(\frac1x-a)^2<0$，因为 $\ln x-\frac{x}{e}\le \ln e-\frac{e}{e}=0$，且平方项非负。 因而 $a>1/e$ 不可能，最大值为 $1/e$。
  key_steps:
    - step_id: step_1
      statement: 把存在条件改写成目标函数非负。
      formula_trace:
        from: $f(m)\ge a^2$
        to: $\Phi_a(x)=\ln x-\frac1{x^2}+\frac{2a}{x}-ax-a^2\ge0$
        operation: 移项定义 $\Phi_a=f-a^2$。
        why: 存在 $m$ 就等价于 $\Phi_a$ 在正半轴某点非负。
      source_ref: page_0291_ex05_solution
    - step_id: step_2
      statement: 用隐点探路找最大参数的候选。
      formula_trace:
        from: $\Phi_a(x_0)=0,\quad \Phi_a^\prime(x_0)=0$
        to: $a=\frac1e,\quad x_0=e$
        operation: 联立边界取等与导数为零。
        why: 参数最大值通常出现在“刚好碰到”的隐点处。
      source_ref: page_0291_ex05_solution
    - step_id: step_3
      statement: 验证 $a=1/e$ 可以达到。
      formula_trace:
        from: $a=\frac1e$
        to: $\Phi_a(x)=\ln x-\frac{x}{e}-(\frac1x-\frac1e)^2,\quad \Phi_a(e)=0$
        operation: 平方配法。
        why: 取 $m=e$，就满足 $f(m)\ge a^2$。
      source_ref: page_0291_ex05_solution
    - step_id: step_4
      statement: 排除所有 $a>1/e$。
      formula_trace:
        from: $a>\frac1e$
        to: $\Phi_a(x)<\ln x-\frac{x}{e}-(\frac1x-a)^2\le0$
        operation: 用 $-ax<-x/e$ 和 $\ln x\le x/e$ 的峰值形式。
        why: 任何 $x>0$ 都不能让 $\Phi_a(x)\ge0$，所以不存在合格的 $m$。
      source_ref: page_0291_ex05_solution
teaching_card:
  student_title: 用隐点探出 $a$ 的最大值
  what_it_trains: 训练存在型最值题中，把条件改写成某个函数能非负，再用边界取等和导数为零找最大参数。
  recognition_cues:
    - 题目说“存在 $m$”，不是要求对所有 $x$ 恒成立。
    - 参数 $a$ 同时出现在一次项、倒数项和右侧 $a^2$。
    - 最大参数处通常是刚好碰到 $0$ 的隐点。
    - 后续证明靠平方配法排除 $a>1/e$。
  normalization_moves:
    - 先定义 $\Phi_a(x)=f(x)-a^2$。
    - 用 $\Phi_a(x_0)=0,\Phi_a^\prime(x_0)=0$ 探出 $x_0=e$。
    - 把式子配成 $\ln x-ax-(\frac1x-a)^2$。
    - 用 $\ln x-\frac{x}{e}\le0$ 做最终压制。
  common_failures:
    - 把“存在 $m$”误看成“任意 $x$”。
    - 忘记右侧还有 $a^2$，只研究原来的 $f(x)$。
    - 只算出 $a=1/e$，没有证明更大的 $a$ 不可能。
    - 平方配法中把 $a$ 和 $1/e$ 混用。
  similar_practice_query: lnx 1/x^2 2a/x ax a^2 存在m 最大a 隐点探路 平方配法
