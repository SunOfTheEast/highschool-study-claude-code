stem: |-
  （2024 吉林中学生数学奥林匹克竞赛一试第10题）已知函数 $f(x)=\ln x-\frac1{x^2}+\frac{2a}{x}-ax$。若 $\exists m>0$，使得 $f(m)\ge a^2$，则实数 $a$ 的最大值为。
  1. 求使存在 $m>0$ 且 $f(m)\ge a^2$ 的实数 $a$ 的最大值。
answer: |-
  $a_{\max}=\frac1e$。

  令 $\Phi_a(x)=f(x)-a^2=\ln x-\frac1{x^2}+\frac{2a}{x}-ax-a^2$。 若最大参数处恰好取到边界，隐点探路应满足 $\Phi_a(x_0)=0,\Phi_a^\prime(x_0)=0$。联立可解得 $a=1/e,x_0=e$。当 $a=1/e$ 时， $\Phi_a(x)=\ln x-\frac{x}{e}-(\frac1x-\frac1e)^2$， 代入 $x=e$ 得 $\Phi_a(e)=0$，所以存在 $m=e$ 使 $f(m)\ge a^2$。当 $a>1/e$ 时， $\Phi_a(x)=\ln x-ax-(\frac1x-a)^2 <\ln x-\frac{x}{e}-(\frac1x-a)^2<0$，因为 $\ln x-\frac{x}{e}\le \ln e-\frac{e}{e}=0$，且平方项非负。 因而 $a>1/e$ 不可能，最大值为 $1/e$。
