stem: 比较 $a=\log_4 3,\ b=\log_5 2,\ c=\log_8 5$ 的大小。
answer: |
  $a>c>b$

  先同底化比较 $a$ 与 $c$：
  \[
  \log_4 3=\log_{64}27,\quad \log_8 5=\log_{64}25,
  \]
  所以 $a>c$。
  再比较 $c$ 与 $b$：
  \[
  2\log_8 5=\log_8 25>1,\quad 2\log_5 2=\log_5 4<1,
  \]
  得 $2c>2b$，即 $c>b$。
  合并得到
  \[
  a>c>b.
  \]
