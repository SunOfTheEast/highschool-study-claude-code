original_problem:
  stem: 比较 $a=\log_4 3,\ b=\log_5 2,\ c=\log_8 5$ 的大小。
  parts: *a1
  choices: []
  answer: $a>c>b$
  fidelity_notes:
    - 源题为比较大小题，无A-D选项。
    - 题干和解析均完整位于page_0147。
solution:
  source_solution_summary: |
    先同底化比较 $a$ 与 $c$：
    \[
    \log_4 3=\log_{64}27,\quad \log_8 5=\log_{64}25,
    \]
    所以 $a>c$。
    再比较 $c$ 与 $b$：
    \[
    2\log_8 5=\log_8 25>1,\quad 2\log_5 2=\log_5 4<1,
    \]
    得 $2c>2b$，即 $c>b$。
    合并得到
    \[
    a>c>b.
    \]
  key_steps:
    - step_id: step_1
      statement: 把两项同步升次到同底数。
      formula_trace:
        from: $a=\log_4 3,\ c=\log_8 5$
        to: $a=\log_{64}27,\ c=\log_{64}25$
        operation: 利用 $\log_a b=\log_{a^m}b^m$ 做同底化。
        why: 同底后可直接比较真数27与25。
      source_ref: page_0147_ex12_solution
    - step_id: step_2
      statement: 先得出 $a>c$。
      formula_trace:
        from: $a=\log_{64}27,\ c=\log_{64}25$
        to: $a>c$
        operation: 底数64大于1时，对数函数单调递增。
        why: 27>25。
      source_ref: page_0147_ex12_solution
    - step_id: step_3
      statement: 借助阈值1比较 $c$ 与 $b$。
      formula_trace:
        from: $2c=2\log_8 5,\ 2b=2\log_5 2$
        to: $2c=\log_8 25>1,\ 2b=\log_5 4<1$
        operation: 把系数2并入对数真数，转为是否超过1的判断。
        why: 避免直接算小数。
      source_ref: page_0147_ex12_solution
    - step_id: step_4
      statement: 由 $2c>2b$ 推出 $c>b$。
      formula_trace:
        from: $2c>1>2b$
        to: $c>b$
        operation: 同除正数2。
        why: 完成剩余两项比较。
      source_ref: page_0147_ex12_solution
    - step_id: step_5
      statement: 合并顺序。
      formula_trace:
        from: $a>c,\ c>b$
        to: $a>c>b$
        operation: 传递性合并。
        why: 得到最终大小关系。
      source_ref: page_0147_ex12_solution
teaching_card:
  student_title: 对数三数比较：先同底，再卡1阈值
  what_it_trains: 训练“不同底对数比大小”时先标准化，再用中间阈值完成剩余比较。
  recognition_cues:
    - 出现 $\log_a b$ 与 $\log_c d$ 混合比较。
    - 底数和真数都不一致，直接算小数不稳。
    - 题目只需给出顺序关系。
  normalization_moves:
    - 优先尝试同步升次到同底数。
    - 把某些量乘常数后转成“与1比较”。
    - 两两比较后再拼接完整顺序。
  common_failures:
    - 只比较出 $a>c$，漏掉 $b$ 与 $c$。
    - 把 $\log_8 25>1$ 与 $\log_5 4<1$ 方向写反。
    - 误把“乘2后比较”当成改变大小方向。
  similar_practice_query: log4 3 log5 2 log8 5 对数同步升次 比大小
