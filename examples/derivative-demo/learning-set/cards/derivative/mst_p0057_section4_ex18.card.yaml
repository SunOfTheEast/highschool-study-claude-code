original_problem:
  stem: （2021 · 乙卷）已知函数 $f(x)=x^3-x^2+ax+1$。
  parts: *a1
  choices: []
  answer: （1）当 $a\ge\frac13$ 时，$f(x)$ 在 $\mathbf{R}$ 上单调递增；当 $a<\frac13$ 时，$f(x)$ 在 $\left(-\infty,\frac{1-\sqrt{1-3a}}3\right)$、$\left(\frac{1+\sqrt{1-3a}}3,+\infty\right)$ 上单调递增，在 $\left(\frac{1-\sqrt{1-3a}}3,\frac{1+\sqrt{1-3a}}3\right)$ 上单调递减。（2）公共点为 $(1,a+1)$ 和 $(-1,-a-1)$。
  fidelity_notes:
    - 源题无选项。
    - 第 (2) 问问的是“过坐标原点的切线与曲线的公共点”，不是只求切点。
solution:
  source_solution_summary: |
    第 (1) 问，$f^{\prime}(x)=3x^2-2x+a$，判别式 $\Delta=4-12a$。当 $a\ge\frac13$ 时，$\Delta\le0$，且二次项系数为正，所以 $f^{\prime}(x)\ge0$，$f$ 在 $\mathbf R$ 上单调递增。当 $a<\frac13$ 时，导数有两根
    $x_1=\frac{1-\sqrt{1-3a}}3$，$x_2=\frac{1+\sqrt{1-3a}}3$，导数在两根外为正、两根内为负，所以 $f$ 在 $(-\infty,x_1)$、$(x_2,+\infty)$ 上递增，在 $(x_1,x_2)$ 上递减。
    第 (2) 问，设切点横坐标为 $x_0$，切线斜率为 $f^{\prime}(x_0)=3x_0^2-2x_0+a$。切线过原点代入切线方程，得到 $2x_0^3-x_0^2-1=0$，即 $(x_0-1)(2x_0^2+x_0+1)=0$，唯一实根为 $x_0=1$。切线为 $y=(a+1)x$。与曲线联立：
    $x^3-x^2+ax+1=(a+1)x$，即 $x^3-x^2-x+1=(x-1)^2(x+1)=0$，公共点横坐标为 $1$ 与 $-1$，对应坐标为 $(1,a+1)$、$(-1,-a-1)$。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问：求导并用判别式分类。
      formula_trace:
        from: $f(x)=x^3-x^2+ax+1$
        to: $f^{\prime}(x)=3x^2-2x+a,\quad \Delta=4-12a$
        operation: 求导后把导函数看成开口向上的二次函数。
        why: 单调性由 $f^{\prime}(x)$ 的符号决定，符号形态由判别式决定。
      source_ref: page_0057_ex18_solution
    - step_id: step_2
      statement: 第 (1) 问：处理 $\Delta\le0$。
      formula_trace:
        from: $\Delta\le0$
        to: $a\ge\frac13,\quad f^{\prime}(x)\ge0,\quad f(x)\ \text{在}\ \mathbf R\ \text{上递增}$
        operation: 由 $4-12a\le0$ 解出 $a$ 的范围。
        why: 开口向上的二次导函数没有两个实变号点时不为负。
      source_ref: page_0057_ex18_solution
    - step_id: step_3
      statement: 第 (1) 问：处理 $\Delta>0$。
      formula_trace:
        from: $a<\frac13,\quad f^{\prime}(x)=0$
        to: $x_1=\frac{1-\sqrt{1-3a}}3,\quad x_2=\frac{1+\sqrt{1-3a}}3$
        operation: 用求根公式解导函数的两个零点。
        why: 导数正负在两根外和两根内不同。
      source_ref: page_0057_ex18_solution
    - step_id: step_4
      statement: 第 (1) 问：写出单调区间。
      formula_trace:
        from: $f^{\prime}(x)>0\ (x<x_1\ \text{或}\ x>x_2),\quad f^{\prime}(x)<0\ (x_1<x<x_2)$
        to: $f\ \text{在}\ (-\infty,x_1),(x_2,+\infty)\ \text{递增，在}\ (x_1,x_2)\ \text{递减}$
        operation: 按导数符号转写函数单调性。
        why: 这是导数法讨论单调性的最后落点。
      source_ref: page_0057_ex18_solution
    - step_id: step_5
      statement: 第 (2) 问：设切点并写出过原点条件。
      formula_trace:
        from: 切点 $(x_0,f(x_0))$，斜率 $f^{\prime}(x_0)$
        to: $0-f(x_0)=f^{\prime}(x_0)(0-x_0)$
        operation: 把原点代入切线方程 $y-f(x_0)=f^{\prime}(x_0)(x-x_0)$。
        why: 切线过原点把切点横坐标约束成一个方程。
      source_ref: page_0057_ex18_solution
    - step_id: step_6
      statement: 第 (2) 问：解出切点横坐标。
      formula_trace:
        from: $0-(x_0^3-x_0^2+ax_0+1)=(3x_0^2-2x_0+a)(-x_0)$
        to: $2x_0^3-x_0^2-1=0\Rightarrow x_0=1$
        operation: 整理后因式分解为 $(x_0-1)(2x_0^2+x_0+1)=0$，二次因子无实根。
        why: 过原点的切线切点被唯一确定，且参数 $a$ 在整理中消去。
      source_ref: page_0057_ex18_solution
    - step_id: step_7
      statement: 第 (2) 问：求切线与曲线的所有公共点。
      formula_trace:
        from: $x_0=1,\quad y=(a+1)x$
        to: $x^3-x^2+ax+1=(a+1)x\Rightarrow (x-1)^2(x+1)=0$
        operation: 用切线方程与原曲线联立。
        why: 公共点包括切点和曲线与这条切线的另一个交点。
      source_ref: page_0057_ex18_solution
    - step_id: step_8
      statement: 第 (2) 问：写出公共点坐标。
      formula_trace:
        from: $x=1\ \text{或}\ x=-1,\quad y=(a+1)x$
        to: $(1,a+1),\quad (-1,-a-1)$
        operation: 把两个横坐标代入切线方程。
        why: 题目要求的是坐标，不能只停在横坐标。
      source_ref: page_0057_ex18_solution
teaching_card:
  student_title: 参数单调性和过原点切线分开做
  what_it_trains: 训练三次函数综合题的两条主线：先用导函数判别式完整讨论单调性，再用切点设参求过定点切线和公共点。
  recognition_cues:
    - 导函数是含参数的二次函数。
    - 题目要求“过坐标原点的切线”，自然设切点 $(x_0,f(x_0))$。
    - 第 (2) 问求公共点，不等于只求切点。
  normalization_moves:
    - 第 (1) 问先算 $\Delta=4-12a$，按是否有两个导数零点分类。
    - 第 (2) 问把原点代入切线方程，得到切点横坐标方程。
    - 求出切线后与曲线联立，找出全部交点。
  common_failures:
    - 把 $a=\frac13$ 边界漏掉。
    - 导数两根写对后，增减区间写反。
    - 直接设过原点切线 $y=kx$，但没有让它与曲线相切。
    - 只写切点，漏掉另一个公共点 $(-1,-a-1)$。
  similar_practice_query: 三次函数 含参数单调性 过原点切线 公共点
