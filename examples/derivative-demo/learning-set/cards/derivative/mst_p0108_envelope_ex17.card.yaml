solution:
  source_solution_summary: |
    A 中圆 $x^2+y^2=1$ 是直线族 $ax+by-1=0$ 的包络线，源页用
    原点到直线的距离等于半径，得
    $\frac1{\sqrt{a^2+b^2}}=1$，所以 $a^2+b^2=1$，A 正确。
    B 中设包络线为圆 $(x-\alpha)^2+(y-\beta)^2=r^2$，令圆心到
    直线族的距离恒为 $r$：
    $\frac{|(1-t^2)\alpha+2t\beta-2t-4|}{1+t^2}=r$。
    分子整理为 $-\alpha t^2+2(\beta-1)t+\alpha-4$，为使比值对
    $t$ 恒定，取 $2(\beta-1)=0$、$-\alpha=\alpha-4$，得
    $\alpha=2,\beta=1,r=2$，于是 $C_2$ 周长为 $4\pi$，B 错。
    C 中对 $f(x)=\frac e{2x}+\ln x$ 求导，得
    $f'(x)=\frac{2x-e}{2x^2}$，函数先减后增；
    $f''(x)=\frac e{x^3}-\frac1{x^2}$，拐点为 $(e,\frac32)$，
    拐点切线为 $y=\frac{x}{2e}+1$。源页图示说明当
    $a>e$ 且 $f(a)<b<\frac a{2e}+1$ 时，点 $(a,b)$ 位于区域 III，
    可作三条切线，C 正确。D 中两曲线同为一条直线的包络线等价于
    $y=x^2-1$ 与 $y=a\ln x-1$ 有公切线；源页给出
    $a\le \min_{x>1}\frac{x^2}{\ln x}=2e$，所以 D 所称
    $(2e,+\infty)$ 错。故选 AC。
  key_steps:
    - step_id: step_1
      statement: 用圆的切线距离判定选项 A。
      formula_trace:
        from: $C_1:x^2+y^2=1,\qquad ax+by-1=0$
        to: $\frac{|0+0-1|}{\sqrt{a^2+b^2}}=1\Rightarrow a^2+b^2=1$
        operation: 把“直线族包络单位圆”转成原点到每条切线的距离等于半径 1。
        why: 圆的切线到圆心距离恒等于半径。
      source_ref: page_0108
    - step_id: step_2
      statement: 用圆心到直线族的恒定距离判定选项 B。
      formula_trace:
        from: |
          $C_2:(x-\alpha)^2+(y-\beta)^2=r^2$
        to: |
          $\frac{|(1-t^2)\alpha+2t\beta-2t-4|}{\sqrt{(1-t^2)^2+(2t)^2}}
          =\frac{|-\alpha t^2+2(\beta-1)t+\alpha-4|}{1+t^2}=r$
        operation: 设包络线为圆，代入圆心到直线 $(1-t^2)x+2ty-2t-4=0$ 的距离公式，并化简分母。
        why: 若直线族包络同一圆，则所有切线到圆心的距离应为同一个半径。
      source_ref: page_0108
    - step_id: step_3
      statement: 由恒定距离求出 $C_2$ 的半径和周长。
      formula_trace:
        from: $-\alpha t^2+2(\beta-1)t+\alpha-4$ 与 $1+t^2$ 成比例
        to: $2(\beta-1)=0,\quad -\alpha=\alpha-4,\quad \alpha=2,\beta=1,r=2,\quad L_{C_2}=4\pi$
        operation: 令一次项为 0，并让二次项与常数项匹配源页比例关系。
        why: 距离为定值时，分子绝对值必须随 $1+t^2$ 同比例变化。
      source_ref: page_0108
    - step_id: step_4
      statement: 用导数和拐点切线判定选项 C 的三切线区域。
      formula_trace:
        from: $f(x)=\frac e{2x}+\ln x$
        to: |
          $f'(x)=\frac{2x-e}{2x^2},\quad
          f''(x)=\frac e{x^3}-\frac1{x^2},\quad
          (e,\frac32),\quad y=\frac{x}{2e}+1$
        operation: 求一、二阶导数，确定单调性、拐点和拐点处切线。
        why: 源页图把曲线和拐点切线分成四个区域，区域 III 对应过点可作三条切线。
      source_ref: page_0108
    - step_id: step_5
      statement: 把 C 的区域条件翻译成选项不等式。
      formula_trace:
        from: 点 $(a,b)$ 位于 $x>e$ 的区域 III
        to: $a>e,\qquad f(a)<b<\frac a{2e}+1,\qquad f(a)=\frac e{2a}+\ln a$
        operation: 用曲线值作下边界，用拐点切线作上边界。
        why: 源页说明该区域内任一点都能作 $y=f(x)$ 的三条切线。
      source_ref: page_0108
    - step_id: step_6
      statement: 用公切线阈值判定选项 D。
      formula_trace:
        from: $y=x^2-1$ 与 $y=a\ln x-1$ 有公切线
        to: $x^2-1\ge a\ln x-1,\quad a\le \min_{x>1}\frac{x^2}{\ln x}=2e$
        operation: 去掉共同的 $-1$，在 $x>1$ 上分离参数，并求 $\frac{x^2}{\ln x}$ 的最小值。
        why: 源页用内公切线判定说明允许的 $a$ 不在 $(2e,+\infty)$，所以 D 错。
      source_ref: page_0109
    - step_id: step_7
      statement: 汇总多选答案。
      formula_trace:
        from: A 正确；B 错误；C 正确；D 错误
        to: AC
        operation: 逐项筛选。
        why: 题目是多选题，需保留所有正确选项。
      source_ref: page_0109
teaching_card:
  student_title: 用切线距离和区域图判断包络线多选
  what_it_trains: 训练把“包络线”翻译成切线、距离、区域和公切线阈值，逐项判断一个综合多选题。
  recognition_cues:
    - 题干直接给出包络线定义，选项都在问“某曲线能否作为一族切线的外轮廓”。
    - A、B 是直线族和圆，优先用点到直线距离。
    - C 出现“过点作三条切线”，要看曲线与拐点切线分出的区域。
    - D 是二次函数与对数函数公切线，关键数通常来自 $\frac{x^2}{\ln x}$ 的最小值。
  normalization_moves:
    - A 把包络单位圆化成 $\frac1{\sqrt{a^2+b^2}}=1$。
    - B 设圆心和半径，让圆心到参数直线族距离恒定。
    - C 先求 $f'(x)$、$f''(x)$，再画出拐点切线分区。
    - D 去掉共同的 $-1$，用 $a\le\min\frac{x^2}{\ln x}$ 判范围。
  common_failures:
    - 把包络线只当成“经过曲线上的点”，忘了还要相切。
    - B 中看到源页分子里的疑似 $x$ 就跟着算，导致圆心参数混乱。
    - C 中只判断单调性，没有用拐点切线分出三切线区域。
    - D 中把真实范围 $a\le2e$ 看反，误以为 $(2e,+\infty)$ 正确。
  similar_practice_query: 包络线 直线族 圆 点到直线距离 三切线区域 公切线 x^2/lnx 2e
quality:
  confidence: high
  needs_review: false
  review_notes:
    - 已核对 page_0108/page_0109 图片；page_0108 顶部例 16 续解未建卡，page_0109 后半 exposition 未建卡。
    - B 解析中的疑似 $x-4$ 已按源页上下文和后续方程解析为圆心横坐标项 $a-4$，并在 source_discrepancies 记录。
