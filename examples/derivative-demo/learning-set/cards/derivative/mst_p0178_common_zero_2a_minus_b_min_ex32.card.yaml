  stem: （2025 · 昆明一中期末 T8）已知 $a>0$，$b\in\mathbf{R}$，若关于 $x$ 的不等式 $(ax-1)(x^2+bx-1)\geqslant0$ 在 $(0,+\infty)$ 上恒成立，$2a-b$ 的最小值是（  ）
