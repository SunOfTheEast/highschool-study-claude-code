stem: |-
  （2025 · 昆明一中期末 T8）已知 $a>0$，$b\in\mathbf{R}$，若关于 $x$ 的不等式 $(ax-1)(x^2+bx-1)\geqslant0$ 在 $(0,+\infty)$ 上恒成立，$2a-b$ 的最小值是（  ）
  A. 0
  B. 1
  C. \sqrt{2}
  D. 2
answer: |-
  D

  由 $a>0$ 知 $y=ax-1$ 在 $(0,+\infty)$ 上递增，且零点为 $x=\frac{1}{a}$。源解按“单调函数共零点”处理：乘积在 $(0,+\infty)$ 恒非负时，两因子零点对齐，故 $\frac{1}{a}$ 也是 $x^2+bx-1=0$ 的正根，得到 $\frac{1}{a^2}+\frac{b}{a}-1=0$，即 $b=a-\frac{1}{a}$。于是 $2a-b=a+\frac{1}{a}\ge2$，当 $a=1$ 时取等，配套 $b=0$，最小值为 $2$，选 D。
