solution:
  source_solution_summary: 由 $a>0$ 知 $y=ax-1$ 在 $(0,+\infty)$ 上递增，且零点为 $x=\frac{1}{a}$。源解按“单调函数共零点”处理：乘积在 $(0,+\infty)$ 恒非负时，两因子零点对齐，故 $\frac{1}{a}$ 也是 $x^2+bx-1=0$ 的正根，得到 $\frac{1}{a^2}+\frac{b}{a}-1=0$，即 $b=a-\frac{1}{a}$。于是 $2a-b=a+\frac{1}{a}\ge2$，当 $a=1$ 时取等，配套 $b=0$，最小值为 $2$，选 D。
  key_steps:
    - step_id: step_1
      statement: 锁定第一个因子的零点。
      formula_trace:
        from: $ax-1=0,\ a>0$
        to: $x=\frac{1}{a}>0$
        operation: 解一次方程并用 $a>0$ 判断零点落在目标区间。
        why: 共零点法需要先抓住可控零点。
      source_ref: page_0178_ex32_solution
    - step_id: step_2
      statement: 用共零点关系写出 $a,b$ 约束。
      formula_trace:
        from: $(ax-1)(x^2+bx-1)\ge0$ 在 $(0,+\infty)$ 恒成立
        to: $\left(\frac{1}{a}\right)^2+b\left(\frac{1}{a}\right)-1=0$
        operation: 把 $x=\frac{1}{a}$ 代入第二因子。
        why: 把二元参数约束压成一条代数关系。
      source_ref: page_0178_ex32_solution
    - step_id: step_3
      statement: 消去 $b$，把目标改成单变量最值。
      formula_trace:
        from: $\frac{1}{a^2}+\frac{b}{a}-1=0$
        to: $b=a-\frac{1}{a},\quad 2a-b=a+\frac{1}{a}$
        operation: 代数移项与代入。
        why: 把原目标转为标准的 $a+\frac{1}{a}$ 下界问题。
      source_ref: page_0178_ex32_solution
    - step_id: step_4
      statement: 用基本不等式取最小值。
      formula_trace:
        from: $a>0,\ 2a-b=a+\frac{1}{a}$
        to: $2a-b\ge2$
        operation: 应用 $u+\frac{1}{u}\ge2\ (u>0)$。
        why: 直接得到最小值与选项。
      source_ref: page_0178_ex32_solution
teaching_card:
  student_title: 先用共零点消掉 b
  what_it_trains: 训练在乘积恒成立题里，先抓单调因子的确定零点，再通过代入把双参数目标降到一元最值。
  recognition_cues:
    - 结构是“两个因子乘积恒非负”。
    - 其中一个因子是一次函数，零点显式可写。
    - 题目最终问的是参数线性组合最小值。
  normalization_moves:
    - 先解 $ax-1=0$ 得 $x=\frac{1}{a}$。
    - 代入二次因子得到 $a,b$ 关系式。
    - 把目标式完全改写为只含 $a$。
    - 最后用 $u+\frac{1}{u}\ge2$ 收尾。
  common_failures:
    - 把“恒成立”误解成只需某个点成立。
    - 从 $\frac{1}{a^2}+\frac{b}{a}-1=0$ 解 $b$ 时漏项。
    - 得到 $a+\frac{1}{a}$ 后忘记 $a>0$ 才能直接套下界。
  similar_practice_query: 共零点 乘积恒成立 参数最值 a+1/a
