original_problem:
  stem: （2018 · 新课标 I T21）已知函数 f(x)=ae^x-\ln x-1。
  parts: *a1
  choices: []
  answer: (1) a=1/(2e^2)，f(x) 在 (0,2) 上单调递减，在 (2,+infty) 上单调递增； (2) f(x)>=0，且当 a=1/e、x=1 时取等。
  fidelity_notes:
    - 题干含 ln x，默认定义域 x>0。
solution:
  source_solution_summary: 第 (1) 问由极值点必要条件求 a，再用 x e^x 的单调性判断 f' 的符号。 第 (2) 问先用 a>=1/e 把 f(x) 下界化成 e^{x-1}-ln x-1， 再写为 h(x-1)+h(ln x)。
  key_steps:
    - step_id: step_1
      statement: 在 x>0 上，f'(x)=ae^x-1/x。由 f'(2)=0 得 ae^2-1/2=0， 所以 a=1/(2e^2)。
      formula_trace:
        from: f'(2)=ae^2-1/2=0
        to: a=1/(2e^2)
        operation: 代入极值点的导数必要条件
        why: x=2 为定义域内部极值点。
      source_ref: page_0040:例2解析(1)
    - step_id: step_2
      statement: 此时 f'(x)=e^x/(2e^2)-1/x。因为 x e^x 在 x>0 上递增， 所以 0<x<2 时 f'(x)<0，x>2 时 f'(x)>0。
      formula_trace:
        from: e^x/(2e^2)-1/x
        to: sign(f')=sign(xe^x-2e^2)
        operation: 同乘正数 2e^2x，转成比较 xe^x 与 2e^2
        why: xe^x 在正半轴递增，且 x=2 时等号成立。
      source_ref: page_0040:例2解析(1)
    - step_id: step_3
      statement: 当 a>=1/e 时，f(x)>=e^{x-1}-ln x-1。
      formula_trace:
        from: ae^x-ln x-1
        to: e^{x-1}-ln x-1
        operation: 用 a>=1/e 替换出临界下界
        why: e^x>0，参数越大，ae^x 越大。
      source_ref: page_0040:例2解析(2)
    - step_id: step_4
      statement: 令 h(t)=e^t-t-1，则 e^{x-1}-ln x-1=h(x-1)+h(ln x)>=0。
      formula_trace:
        from: e^{x-1}-ln x-1
        to: h(x-1)+h(ln x)
        operation: 加减 x，把指数偏移项和对数换元项拆成两个 h
        why: h(x-1)=e^{x-1}-x，h(ln x)=x-ln x-1，二者都非负。
      source_ref: page_0040:例2解析(2)
teaching_card:
  student_title: 先降到临界参数，再拆成两个 h(t)
  what_it_trains: 训练学生处理含参数不等式时，先找使函数最小的参数临界值，再把剩下的 e^{x-1}-ln x-1 拆成两个标准非负项。
  recognition_cues:
    - 题干给出 a>=1/e，参数只乘在 e^x 前。
    - 目标是证明非负，而不是严格正。
    - e^{x-1} 与 ln x 可以通过加减 x 接到同一个 h(t)。
  normalization_moves:
    - 把 ae^x 下界替换为 e^{x-1}。
    - 写出 e^{x-1}-ln x-1=(e^{x-1}-x)+(x-ln x-1)。
    - 分别识别为 h(x-1) 和 h(ln x)。
  common_failures:
    - 把 a>=1/e 误当作 a=1/e 后忘记说明下界关系。
    - 证明完两个非负项后漏掉等号成立条件。
    - 在第 (1) 问判断 f' 符号时没有说明 xe^x 的递增性。
  similar_practice_query: 参数乘 e^x 的 ln x 不等式，临界参数和 h(t)=e^t-t-1 同构
