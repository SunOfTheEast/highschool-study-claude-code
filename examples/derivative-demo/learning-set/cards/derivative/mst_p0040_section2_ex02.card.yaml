stem: |-
  （2018 · 新课标 I T21）已知函数 f(x)=ae^x-\ln x-1。
  (1). 设 x=2 是 f(x) 的极值点，求 a，并求 f(x) 的单调区间。
  (2). 证明：当 a>=1/e 时，f(x)>=0。
answer: |-
  (1) a=1/(2e^2)，f(x) 在 (0,2) 上单调递减，在 (2,+infty) 上单调递增； (2) f(x)>=0，且当 a=1/e、x=1 时取等。

  第 (1) 问由极值点必要条件求 a，再用 x e^x 的单调性判断 f' 的符号。 第 (2) 问先用 a>=1/e 把 f(x) 下界化成 e^{x-1}-ln x-1， 再写为 h(x-1)+h(ln x)。
rubric:
  max_score: 4
  criteria:
    - step_id: step_1
      description: 在 x>0 上，f'(x)=ae^x-1/x。由 f'(2)=0 得 ae^2-1/2=0， 所以 a=1/(2e^2)。
      max_score: 1
    - step_id: step_2
      description: 此时 f'(x)=e^x/(2e^2)-1/x。因为 x e^x 在 x>0 上递增， 所以 0<x<2 时 f'(x)<0，x>2 时 f'(x)>0。
      max_score: 1
    - step_id: step_3
      description: 当 a>=1/e 时，f(x)>=e^{x-1}-ln x-1。
      max_score: 1
    - step_id: step_4
      description: 令 h(t)=e^t-t-1，则 e^{x-1}-ln x-1=h(x-1)+h(ln x)>=0。
      max_score: 1
