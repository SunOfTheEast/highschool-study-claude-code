stem: （2021 · 沈阳一模 T22）已知函数 $f(x)=mx\ln x-1$，$m\neq0$。若 $g(x)=x^2-\frac2e x$，且关于 $x$ 的不等式 $f(x)\leqslant g(x)$ 在 $(0,+\infty)$ 上恒成立（其中 $e$ 是自然对数的底数），求实数 $m$ 的取值范围。
answer: |-
  $m\in\left[\frac1e-e,0\right)\cup\left(0,e-\frac1e\right]$。

  由题意 $mx\ln x-1\leqslant x^2-\frac2e x$。当 $m>0$ 时，两边除以 $x^2>0$ 得 $m\frac{\ln x}{x}\leqslant1-\frac2{ex}+\frac1{x^2}$。 左侧最大为 $m/e$，在 $x=e$ 取等；右侧 $1-\frac2{ex}+\frac1{x^2}$ 的最小值为 $1-\frac1{e^2}$，也在 $x=e$ 取等，因此 $m/e\leqslant1-\frac1{e^2}$，即 $0<m\leqslant e-\frac1e$。若 $m>e-\frac1e$，代 $x=e$ 得 $f(e)>g(e)$，矛盾。当 $m<0$ 时，$mx\ln x$ 的最大值为 $-m/e$， 在 $x=1/e$ 取等；右侧 $x^2-\frac2e x+1$ 的最小值为 $1-\frac1{e^2}$，也在 $x=1/e$ 取等，于是 $-m/e\leqslant1-\frac1{e^2}$，得到 $\frac1e-e\leqslant m<0$。 若 $m<\frac1e-e$，代 $x=1/e$ 得 $f(1/e)>g(1/e)$，矛盾。综上 $m\in[\frac1e-e,0)\cup(0,e-\frac1e]$。
