solution:
  source_solution_summary: |
    由 $f(x)=ae^x-\ln x-1$ 的定义域得 $x>0$，且 $f^{\prime}(x)=ae^x-\frac1x$。由 $x=2$ 是极值点， $f^{\prime}(2)=ae^2-\frac12=0$，故 $a=\frac{1}{2e^2}$。 代回得 $f^{\prime}(x)=\frac{1}{2e^2}e^x-\frac1x$，从而在 $(0,2)$ 上为负、在 $(2,+\infty)$ 上为正，单调区间可得。 对第(2)问，先写 $f(x)=\frac1e e^x-\ln x-1+\left(a-\frac1e\right)e^x$， 令 $h(x)=e^x-x-1$，则 $f(x)=h(x-1)+h(\ln x)+\left(a-\frac1e\right)e^x$。 由 $h(\cdot)\ge0$ 及 $a-\frac1e\ge0$，三项均非负，故 $f(x)\ge0$。
  key_steps:
    - step_id: step_1
      statement: 由极值点条件解参数 $a$。
      formula_trace:
        from: $f^{\prime}(x)=ae^x-\frac1x,\ f^{\prime}(2)=0$
        to: $a=\frac{1}{2e^2}$
        operation: 代入 $x=2$ 并解一元方程。
        why: 第(1)问先锁定参数，后续才能判导数符号。
      source_ref: page_0210_ex02_solution
    - step_id: step_2
      statement: 代回参数并判定单调区间。
      formula_trace:
        from: $f^{\prime}(x)=\frac{1}{2e^2}e^x-\frac1x$
        to: $0<x<2$ 时 $f^{\prime}(x)<0$，$x>2$ 时 $f^{\prime}(x)>0$
        operation: 按 source 的导数符号比较写出区间结论。
        why: 单调性是第(1)问目标输出。
      source_ref: page_0210_ex02_solution
    - step_id: step_3
      statement: 第(2)问先做参数拆分并引入母函数 $h$。
      formula_trace:
        from: $f(x)=ae^x-\ln x-1,\ a\ge\frac1e$
        to: $f(x)=h(x-1)+h(\ln x)+\left(a-\frac1e\right)e^x$
        operation: 先拆出 $\frac1e e^x$，再把指数项与对数项配凑到 $h(t)=e^t-t-1$。
        why: 把目标转化为“若干非负项之和”。
      source_ref: page_0210_ex02_solution
    - step_id: step_4
      statement: 逐项判非负并闭合证明。
      formula_trace:
        from: $h(x-1)\ge0,\ h(\ln x)\ge0,\ \left(a-\frac1e\right)e^x\ge0$
        to: $f(x)\ge0$
        operation: 利用 $h(t)=e^t-t-1\ge0$ 与参数条件。
        why: 三项同向非负直接得到目标不等式。
      source_ref: page_0210_ex02_solution
teaching_card:
  student_title: 极值定参后做差一同构证明
  what_it_trains: 训练“先由导数极值点定参数，再把指对混合式拆成母函数非负项”的双段式处理。
  recognition_cues:
    - 题干同时给出“极值点定参”与“全局不等式证明”。
    - 表达式含 $ae^x-\ln x-1$，适合配凑到 $e^t-t-1$ 母函数。
    - 参数条件是下界型（$a\ge\frac1e$），天然对应余量项。
  normalization_moves:
    - 极值点代入导数方程先定 $a$。
    - 把目标式改写成 $h(\cdot)$ 非负项之和。
    - 将参数差值作为余量独立判非负。
  common_failures:
    - 只算出 $a$ 却没把导数符号转成完整单调区间。
    - 把 $h(\ln x)$ 错写为 $h(x)$ 导致结构断裂。
    - 漏写 $x>0$ 定义域，后续对 $\ln x$ 的使用不严谨。
  similar_practice_query: ae^x lnx 极值点 定参 同构保值性 不等式
