stem: |-
  （2018 · 新课标 I）已知函数 $f(x)=ae^x-\ln x-1$。
  (1) 设 $x=2$ 是 $f(x)$ 的极值点，求 $a$，并求 $f(x)$ 的单调区间。
  (2) 证明：当 $a\geqslant\frac{1}{e}$ 时，$f(x)\geqslant0$。
answer: |
  (1) $a=\frac{1}{2e^2}$，$f(x)$ 在 $(0,2)$ 上单调递减、在 $(2,+\infty)$ 上单调递增；(2) 结论成立。

  由 $f(x)=ae^x-\ln x-1$ 的定义域得 $x>0$，且 $f^{\prime}(x)=ae^x-\frac1x$。由 $x=2$ 是极值点， $f^{\prime}(2)=ae^2-\frac12=0$，故 $a=\frac{1}{2e^2}$。 代回得 $f^{\prime}(x)=\frac{1}{2e^2}e^x-\frac1x$，从而在 $(0,2)$ 上为负、在 $(2,+\infty)$ 上为正，单调区间可得。 对第(2)问，先写 $f(x)=\frac1e e^x-\ln x-1+\left(a-\frac1e\right)e^x$， 令 $h(x)=e^x-x-1$，则 $f(x)=h(x-1)+h(\ln x)+\left(a-\frac1e\right)e^x$。 由 $h(\cdot)\ge0$ 及 $a-\frac1e\ge0$，三项均非负，故 $f(x)\ge0$。
