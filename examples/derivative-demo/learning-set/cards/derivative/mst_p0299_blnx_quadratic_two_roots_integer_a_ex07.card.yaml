stem: |-
  （2024 · 辽宁一模）已知函数 $f(x)=b\ln x$，$g(x)=x^2+ax$，其中 $a,b$ 为实数，且 $b>0$。
  1. 当 $a=-1$ 时，$f(x)\leqslant g(x)$ 恒成立，求 $b$。
  2. 当 $b=2$ 时，函数 $G(x)=f(x)-g(x)$ 有两个不同的零点，求 $a$ 的最大整数值。参考数据：$\ln\frac54\approx0.223$。
answer: |-
  第(1)问 $b=1$；第(2)问 $a$ 的最大整数值为 $-1$。

  第(1)问当 $a=-1$ 时，设 $F(x)=f(x)-g(x)=b\ln x-x^2+x$，要求 $F(x)\le0$。 当 $b=1$ 时， $F^\prime(x)=\frac{-(2x+1)(x-1)}{x}$，所以 $F$ 在 $(0,1)$ 上递增、在 $(1,+\infty)$ 上递减， $F(x)\le F(1)=0$。若 $b>1$，$F^\prime=0$ 的正根 $x_2>1$，在 $(1,x_2)$ 上 $F(x)>F(1)=0$；若 $0<b<1$，正根 $x_2<1$，在 $(x_2,1)$ 上 $F(x)>F(1)=0$，均不合题意，所以 $b=1$。第(2)问 $b=2$ 时，$G$ 有两个零点等价于 $a=h(x)=\frac{2\ln x-x^2}{x}$ 有两个不同解。求导得 $h^\prime(x)=\frac{2-x^2-2\ln x}{x^2}$。令 $m(x)=2-x^2-2\ln x$，则 $m$ 在 $(0,+\infty)$ 上递减， 且 $m(1)>0$、$m(\frac54)<0$，所以唯一零点 $x_0\in(1,\frac54)$。由 $m(x_0)=0$ 得 $h_{\max}=h(x_0)=\frac2{x_0}-2x_0\in(-\frac9{10},0)$。 因此最大整数候选为 $-1$。当 $a=-1$ 时，令 $p(x)=2\ln x-x^2+x$，$p$ 先增后减，且 $p(1)=0$、$p(\frac{1+\sqrt{17}}4)>0$、$p(e)<0$， 故有两个不同零点，结论为 $a=-1$。
