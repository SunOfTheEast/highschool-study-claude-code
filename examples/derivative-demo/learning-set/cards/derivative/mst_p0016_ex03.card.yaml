original_problem:
  stem: 若正实数 $x_1$ 是函数 $f(x)=xe^x-x-e^2$ 的一个零点，$x_2$ 是函数 $g(x)=(x-e)(\ln x-1)-e^3$ 的一个大于 $e$ 的零点，则 $\frac{x_1(x_2-e)}{e^2}$ 的值为（ ）
