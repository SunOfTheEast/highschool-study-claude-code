solution:
  source_solution_summary: 由 $f(x_1)=0$ 得 $x_1(e^{x_1}-1)=e^2$。由 $g(x_2)=0$ 且 $x_2>e$，令 $u=\ln(x_2/e)=\ln x_2-1>0$，则 $x_2/e=e^u$，并且 $(x_2-e)(\ln x_2-1)=e(e^u-1)u=e^3$，所以 $u(e^u-1)=e^2$。函数 $h(t)=t(e^t-1)$ 在 $(0,+\infty)$ 单调递增，因此 $x_1=u=\ln(x_2/e)$。于是 $x_2-e=e(e^{x_1}-1)$，目标值为 $x_1 e(e^{x_1}-1)/e^2=x_1(e^{x_1}-1)/e=e$。
  key_steps:
    - step_id: step_1
      statement: 把 $f(x_1)=0$ 写成 $h(x_1)=e^2$。
      formula_trace:
        from: $x_1e^{x_1}-x_1-e^2=0$
        to: $x_1(e^{x_1}-1)=e^2$
        operation: 提取公因式 $x_1$ 并移项。
        why: 这给出同构函数 $h(t)=t(e^t-1)$ 的第一个函数值。
      source_ref: page_0017
    - step_id: step_2
      statement: 把 $g(x_2)=0$ 缩放到同一个 $h(t)$。
      formula_trace:
        from: $(x_2-e)(\ln x_2-1)-e^3=0$
        to: $\ln\frac{x_2}{e}\left(\frac{x_2}{e}-1\right)=e^2$
        operation: 用 $\ln x_2-1=\ln(x_2/e)$，并将 $x_2-e=e(\frac{x_2}{e}-1)$ 后同除以 $e$。
        why: 把 $x_2$ 的零点条件转成与 $x_1(e^{x_1}-1)$ 同形。
      source_ref: page_0017
    - step_id: step_3
      statement: 令 $u=\ln(x_2/e)$，使用单调性得到 $x_1=u$。
      formula_trace:
        from: $\ln\frac{x_2}{e}\left(\frac{x_2}{e}-1\right)=e^2$
        to: $u(e^u-1)=e^2,\quad u=\ln\frac{x_2}{e}=x_1$
        operation: 代入 $x_2/e=e^u$，再与 $x_1(e^{x_1}-1)=e^2$ 比较。
        why: $x_1>0$ 且 $u>0$，$h(t)=t(e^t-1)$ 在正区间单调递增。
      source_ref: page_0017
    - step_id: step_4
      statement: 化简目标值。
      formula_trace:
        from: $x_1=\ln\frac{x_2}{e},\quad x_1(e^{x_1}-1)=e^2$
        to: $\frac{x_1(x_2-e)}{e^2}=e$
        operation: 由 $x_2/e=e^{x_1}$ 得 $x_2-e=e(e^{x_1}-1)$，再代入 step_1。
        why: 目标式正好含 $x_1$ 与 $x_2-e$，可还原成 $x_1(e^{x_1}-1)$。
      source_ref: page_0017
teaching_card:
  student_title: 把两个零点条件缩成同一个 $x(e^x-1)$
  what_it_trains: 训练处理跨表达式零点：先把两个零点方程都改成同一单调函数的函数值，再把目标式回代成这个函数值。
  recognition_cues:
    - 一个零点方程含 $xe^x-x$，另一个含 $(x-e)(\ln x-1)$。
    - 条件给出 $x_2>e$，提示使用 $\ln(x_2/e)>0$。
    - 目标式含 $x_2-e$，与 $x_2/e-1$ 的缩放直接相关。
  normalization_moves:
    - 先把 $xe^x-x$ 提成 $x(e^x-1)$。
    - 把 $\ln x_2-1$ 改成 $\ln(x_2/e)$，把 $x_2-e$ 改成 $e(x_2/e-1)$。
    - 令 $u=\ln(x_2/e)$，得到 $u(e^u-1)=e^2$。
    - 用单调性得到 $u=x_1$ 后，再算目标式。
  common_failures:
    - 把 page_0017 顶部续页当成新题，漏掉 page_0016 的 $x_1$ 条件。
    - 缩放时漏掉 $x_2-e=e(x_2/e-1)$ 中的 $e$。
    - 没有使用 $x_2>e$，导致 $\ln(x_2/e)>0$ 的单调区间依据不清。
    - 同构出 $x_1=\ln(x_2/e)$ 后，没有把 $x_2-e$ 回写成 $e(e^{x_1}-1)$。
  similar_practice_query: $xe^x-x$ $(x-e)(\ln x-1)$ 零点 $x(e^x-1)$ 同构 数值求值
