stem: |-
  若正实数 $x_1$ 是函数 $f(x)=xe^x-x-e^2$ 的一个零点，$x_2$ 是函数 $g(x)=(x-e)(\ln x-1)-e^3$ 的一个大于 $e$ 的零点，则 $\frac{x_1(x_2-e)}{e^2}$ 的值为（ ）
  A. $\frac{1}{e}$
  B. $\frac{1}{e^2}$
  C. $e$
  D. $e^2$
answer: |-
  C；$\frac{x_1(x_2-e)}{e^2}=e$。

  由 $f(x_1)=0$ 得 $x_1(e^{x_1}-1)=e^2$。由 $g(x_2)=0$ 且 $x_2>e$，令 $u=\ln(x_2/e)=\ln x_2-1>0$，则 $x_2/e=e^u$，并且 $(x_2-e)(\ln x_2-1)=e(e^u-1)u=e^3$，所以 $u(e^u-1)=e^2$。函数 $h(t)=t(e^t-1)$ 在 $(0,+\infty)$ 单调递增，因此 $x_1=u=\ln(x_2/e)$。于是 $x_2-e=e(e^{x_1}-1)$，目标值为 $x_1 e(e^{x_1}-1)/e^2=x_1(e^{x_1}-1)/e=e$。
