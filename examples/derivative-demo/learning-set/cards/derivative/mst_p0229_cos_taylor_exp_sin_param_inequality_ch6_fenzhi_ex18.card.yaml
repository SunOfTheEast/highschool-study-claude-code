solution:
  source_solution_summary: 第 (1) 问令 $F(x)=\cos x-1+\frac12x^2$，$F(0)=0$。有 $F'(x)=x-\sin x$。再令 $u(x)=x-\sin x$，则 $u'(x)=1-\cos x\geqslant0$，$u(0)=0$，故 $u(x)\geqslant0$， 从而 $F'(x)\geqslant0$，$F(x)\geqslant0$，即 $\cos x\geqslant1-\frac12x^2$。第 (2) 问由第 (1) 问和 $x\geqslant\sin x$、$a\geqslant1$ 得 $xe^{ax}+x\cos x+1\geqslant xe^x+x(1-\frac12x^2)+1$， 且 $(1+\sin x)^2\leqslant(1+x)^2$。所以只需证明 $xe^x+x(1-\frac12x^2)+1\geqslant(1+x)^2$，即 $e^x-(\frac12x^2+x+1)\geqslant0$。令 $G(x)=e^x-(\frac12x^2+x+1)$，再令 $H(x)=e^x-x-1$，由 $H'(x)=e^x-1\geqslant0$ 得 $H(x)\geqslant0$，从而 $G'(x)\geqslant0$、$G(x)\geqslant0$，命题成立。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问构造余弦下界函数。
      formula_trace:
        from: $\cos x\geqslant1-\frac12x^2$
        to: $F(x)=\cos x-1+\frac12x^2\geqslant0$
        operation: 移项。
        why: 转成证明一个函数从 0 开始不下降。
      source_ref: page_0229_ex18_solution_start
    - step_id: step_2
      statement: 用 $x-\sin x$ 控制 $F^\prime(x)$。
      formula_trace:
        from: $F^\prime(x)=x-\sin x$
        to: $F^\prime(x)\geqslant0$
        operation: 构造 $u(x)=x-\sin x$，由 $u^\prime(x)=1-\cos x\geqslant0$ 得 $u(x)\geqslant0$。
        why: 这是余弦二次下界的基础证明。
      source_ref: page_0229_ex18_solution_start
    - step_id: step_3
      statement: 第 (2) 问先把左右两边分别放缩。
      formula_trace:
        from: $xe^{ax}+x\cos x+1$ 与 $(1+\sin x)^2$
        to: $xe^x+x(1-\frac12x^2)+1$ 与 $(1+x)^2$
        operation: 用 $a\geqslant1$、$\cos x\geqslant1-\frac12x^2$、$\sin x\leqslant x$。
        why: 把含参指数三角不等式化为单变量指数二次不等式。
      source_ref: page_0229_ex18_solution_start
    - step_id: step_4
      statement: 化归到指数二次余项。
      formula_trace:
        from: $xe^x+x(1-\frac12x^2)+1\geqslant(1+x)^2$
        to: $e^x-(\frac12x^2+x+1)\geqslant0$
        operation: 整理并在 $x>0$ 时除以 $x$；$x=0$ 直接取等。
        why: 右边变成指数函数减二次多项式。
      source_ref: page_0229_ex18_solution_start
    - step_id: step_5
      statement: 用二次求导证明指数二次余项非负。
      formula_trace:
        from: $G(x)=e^x-(\frac12x^2+x+1)$
        to: $G(x)\geqslant0$
        operation: 令 $H(x)=G^\prime(x)=e^x-x-1$，再由 $H^\prime(x)=e^x-1\geqslant0$ 得 $H,G$ 均从 0 起不下降。
        why: 这是 $e^x$ 的二阶下界形式。
      source_ref: page_0229_ex18_solution_start
    - step_id: step_6
      statement: 回代得到原不等式。
      formula_trace:
        from: $xe^x+x(1-\frac12x^2)+1\geqslant(1+x)^2\geqslant(1+\sin x)^2$
        to: $xe^{ax}+x\cos x+1\geqslant(1+\sin x)^2$
        operation: 合并左侧下界、右侧上界和 $a\geqslant1$。
        why: 分而治之的各个下界/上界方向一致。
      source_ref: page_0230_ex18_continuation
teaching_card:
  student_title: 先做三角基础界，再把原题压成指数二次余项
  what_it_trains: 训练三角借助泰勒放缩后的分而治之：先建可复用引理，再把复杂不等式化为单个指数余项。
  recognition_cues:
    - 第 (1) 问证明的 $\cos x$ 下界，在第 (2) 问会直接复用。
    - 右侧是 $(1+\sin x)^2$，自然想到 $\sin x\leqslant x$。
    - $a\geqslant1$ 且 $x\geqslant0$，说明 $xe^{ax}$ 可以下放到 $xe^x$。
  normalization_moves:
    - 先证明 $x-\sin x\geqslant0$，再证明 $\cos x\geqslant1-\frac12x^2$。
    - 左侧保留下界：$xe^x+x(1-\frac12x^2)+1$。
    - 右侧放成上界：$(1+\sin x)^2\leqslant(1+x)^2$。
    - 整理到 $e^x-(\frac12x^2+x+1)\geqslant0$。
  common_failures:
    - 只记住结论 $\cos x\geqslant1-\frac12x^2$，不会在题内证明。
    - 左边和右边放缩方向混乱，把需要证明的目标变强或变弱。
    - 整理到指数二次余项时漏掉 $x=0$ 的边界处理。
  similar_practice_query: cosx>=1-x^2/2 x>=sinx xe^{ax} (1+sinx)^2 e^x 二次下界 分而治之
