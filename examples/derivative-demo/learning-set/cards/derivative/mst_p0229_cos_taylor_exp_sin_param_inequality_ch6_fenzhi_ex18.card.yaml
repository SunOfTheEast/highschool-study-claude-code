stem: |-
  （2019 · 武汉模拟 T21）
  1. 求证：$x\geqslant0$ 时，$\cos x\geqslant1-\frac12x^2$ 恒成立。
  2. 当 $a\geqslant1$ 时，$\forall x\in[0,+\infty)$，证明不等式 $xe^{ax}+x\cos x+1\geqslant(1+\sin x)^2$ 恒成立。
answer: |-
  两问不等式均成立。

  第 (1) 问令 $F(x)=\cos x-1+\frac12x^2$，$F(0)=0$。有 $F'(x)=x-\sin x$。再令 $u(x)=x-\sin x$，则 $u'(x)=1-\cos x\geqslant0$，$u(0)=0$，故 $u(x)\geqslant0$， 从而 $F'(x)\geqslant0$，$F(x)\geqslant0$，即 $\cos x\geqslant1-\frac12x^2$。第 (2) 问由第 (1) 问和 $x\geqslant\sin x$、$a\geqslant1$ 得 $xe^{ax}+x\cos x+1\geqslant xe^x+x(1-\frac12x^2)+1$， 且 $(1+\sin x)^2\leqslant(1+x)^2$。所以只需证明 $xe^x+x(1-\frac12x^2)+1\geqslant(1+x)^2$，即 $e^x-(\frac12x^2+x+1)\geqslant0$。令 $G(x)=e^x-(\frac12x^2+x+1)$，再令 $H(x)=e^x-x-1$，由 $H'(x)=e^x-1\geqslant0$ 得 $H(x)\geqslant0$，从而 $G'(x)\geqslant0$、$G(x)\geqslant0$，命题成立。
