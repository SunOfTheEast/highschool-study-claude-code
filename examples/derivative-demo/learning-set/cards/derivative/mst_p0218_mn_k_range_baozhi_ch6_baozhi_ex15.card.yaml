stem: （2022 · 名校联盟 T14）对任意实数 $m,n$，不等式 $kme^{n-1}-2n+1+(2n-2m+1)e^{2n-m}\geqslant0$ 恒成立，求实数 $k$ 的取值范围。
answer: |-
  $k\in[1,4e^{3/2}]$。

  先将原式整理为 $[1-2(m-n)]e^{n-m+1}+k(m-n)+(1-2n)e^{1-n}+kn\geqslant0$。 构造 $f(x)=(1-2x)e^{1-x}+kx$，则原式即 $f(m-n)+f(n)\geqslant0$。由 $m-n$ 与 $n$ 可自由取值，source 转为 要求 $f(x)\geqslant0$ 恒成立。对 $x\ne0$，由 $(1-2x)e^{1-x}+kx\geqslant0$ 得 $x<0$ 时 $k\leqslant g(x)$，$x>0$ 时 $k\geqslant g(x)$，其中 $g(x)=\frac{2x-1}{xe^{x-1}}$。求导 $g^{\prime}(x)=\frac{-2x^2+x+1}{x^2e^{x-1}} =-\frac{(2x+1)(x-1)}{x^2e^{x-1}}$，可得 $x<0$ 段的下界为 $g(-1/2)=4e^{3/2}$，$x>0$ 段的上界为 $g(1)=1$，故 $1\leqslant k\leqslant4e^{3/2}$。
