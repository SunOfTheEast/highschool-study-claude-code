stem: |-
  （2022·全国甲卷文）已知 $9^m=10,\ a=10^m-11,\ b=8^m-9$，则（ ）
  A. $a>0>b$
  B. $a>b>0$
  C. $b>a>0$
  D. $b>0>a$
answer: |
  A

  由 $9^m=10$ 得
  \[
  m=\log_9 10=\frac{\lg10}{\lg9}>1.
  \]
  比较 $a$ 的符号：源解用糖水不等式
  \[
  \frac{\lg10}{\lg9}
  >
  \frac{\lg10+\lg\frac{10}{9}}{\lg9+\lg\frac{10}{9}}
  =
  \frac{\lg(100/9)}{\lg10}
  >
  \lg11,
  \]
  所以 $m>\lg11$，从而
  \[
  a=10^m-11>10^{\lg11}-11=0.
  \]
  比较 $b$ 的符号：源解同理给出
  \[
  \frac{\lg9}{\lg8}
  >
  \frac{\lg9+\lg\frac98}{\lg8+\lg\frac98}
  >
  \frac{\lg10}{\lg9}=m,
  \]
  即 $\log_8 9>m$，故
  \[
  b=8^m-9<8^{\log_8 9}-9=0.
  \]
  因此 $a>0>b$，选 A。
