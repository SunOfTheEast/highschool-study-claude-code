stem: |-
  (2020 · 新课标ⅢT20) 设函数 $f(x)=x^3+bx+c$，曲线 $y=f(x)$ 在点
  $\left(\frac{1}{2}, f\left(\frac{1}{2}\right)\right)$ 处的切线与 $y$ 轴垂直。
answer: |-
  (1) $b=-\frac{3}{4}$。
  (2) 当 $f(x)$ 在 $[-1,1]$ 内至少有一个零点时，必有
  $-\frac{1}{4}\le c\le \frac{1}{4}$，进而所有零点都在 $[-1,1]$ 内。

  切线与 $y$ 轴垂直说明该点切线水平，因此 $f'(\frac12)=0$，得
  $b=-\frac34$。代回后，$f'(x)=3(x+\frac12)(x-\frac12)$，函数在
  $(-\infty,-\frac12)$、$(\frac12,+\infty)$ 上递增，在
  $(-\frac12,\frac12)$ 上递减。又有
  $f(-1)=f(\frac12)=c-\frac14$，
  $f(-\frac12)=f(1)=c+\frac14$。若 $[-1,1]$ 内有零点，则
  $c-\frac14\le0\le c+\frac14$。再按
  $-\frac14<c<\frac14$、$c=\frac14$、$c=-\frac14$ 分类，用介值定理和端点重合情形得到所有零点的绝对值都不大于 $1$。
