  key_steps:
    - step_id: step_1
      statement: 把线性微分关系改写成乘幂乘积导数。
      formula_trace:
        from: $xf^{\prime}(x)+2f(x)=e^x$
        to: $(x^2f(x))^{\prime}=xe^x>0$
