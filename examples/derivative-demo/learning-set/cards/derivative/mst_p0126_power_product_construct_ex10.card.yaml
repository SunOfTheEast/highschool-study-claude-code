stem: |-
  （24-25高二下·江苏·期中）设 $f^{\prime}(x)$ 是函数 $f(x)$ 定义在 $(0,+\infty)$ 上的导函数，满足 $xf^{\prime}(x)+2f(x)=e^x$，则下列不等式一定成立的是（ ）
  A. $\frac{f(e)}{e^2}>\frac{f(e^2)}{e}$
  B. $\frac{f(2)}{9}>\frac{f(3)}{4}$
  C. $\frac{f(e)}{e^2}<\frac{f(3)}{9}$
  D. $\frac{f(2)}{e^2}<\frac{f(e)}{4}$
answer: |
  D

  由
  \[
  xf^{\prime}(x)+2f(x)=e^x
  \]
  可构造
  \[
  (x^2f(x))^{\prime}=2xf(x)+x^2f^{\prime}(x)=x\bigl(2f(x)+xf^{\prime}(x)\bigr)=xe^x>0\quad(x>0).
  \]
  所以 $x^2f(x)$ 在 $(0,+\infty)$ 上单调递增。
  取 $2<3$，有
  \[
  4f(2)<9f(3)\Rightarrow \frac{f(2)}{9}<\frac{f(3)}{4},
  \]
  故 B 错。取 $2<e$，有
  \[
  4f(2)<e^2f(e)\Rightarrow \frac{f(2)}{e^2}<\frac{f(e)}{4},
  \]
  故 D 恒成立。

  再由积分表达可写
  \[
  x^2f(x)=(x-1)e^x+C,\qquad
  f(x)=\frac{(x-1)e^x+C}{x^2}.
  \]
  对 A：当 $C=0$ 时，令 $h(x)=xf(x)=\frac{(x-1)e^x}{x}$，
  \[
  h^{\prime}(x)=\frac{(x^2-x+1)e^x}{x^2}>0,
  \]
  所以 $h$ 递增，且 $e<e^2$，故
  \[
  ef(e)<e^2f(e^2)\Rightarrow \frac{f(e)}{e^2}<\frac{f(e^2)}{e},
  \]
  A不成立（因此A不具有“必然性”）。

  对 C：令
  \[
  q(x)=\frac{f(x)}{x^2}=\frac{(x-1)e^x+C}{x^4},
  \]
  则
  \[
  q^{\prime}(x)=\frac{(x-2)^2e^x-4C}{x^5}.
  \]
  设 $m(x)=(x-2)^2e^x-4C$，当 $x>2$ 时
  \[
  m^{\prime}(x)=x(x-2)e^x>0.
  \]
  取 $C=10$，对 $2<x\le 3$ 有
  \[
  m(x)\le m(3)=e^3-40<0\Rightarrow q^{\prime}(x)<0,
  \]
  所以 $q$ 在 $(2,3]$ 递减，从而
  \[
  \frac{f(e)}{e^2}>\frac{f(3)}{9},
  \]
  C不成立（也非必然）。

  综上，只有 D 一定成立。
