teaching_card:
  student_title: 先找恒增乘积，再用参数反例筛选
  what_it_trains: 训练“先证恒真，再证其余不恒真”的多选单选混合判定思路，尤其是利用参数通解构造反例。
  recognition_cues:
    - 题设是 $xf^{\prime}(x)+2f(x)$ 型。
    - 四个选项都是不同点位的比值比较。
    - 关键词“一定成立”提示必须做必要性校验。
  normalization_moves:
    - 先构造 $(x^2f)^{\prime}$ 判断核心单调。
    - 由单调直接判 B、D。
    - 写出 $f$ 的参数通解。
    - 对A、C分别代入不同 $C$ 造反例。
  common_failures:
    - 只验证D成立就停下，未排除A/C的“也可能成立”。
    - 把 $ef(e)<e^2f(e^2)$ 转换时不等号方向写错。
    - 在 $q^{\prime}(x)$ 符号判断时忽略区间 $2<x\le3$。
  similar_practice_query: 抽象函数 乘积构造 参数反例 恒成立 不等式比较
