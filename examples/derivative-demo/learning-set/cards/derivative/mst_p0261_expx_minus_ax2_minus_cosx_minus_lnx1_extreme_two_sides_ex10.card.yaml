original_problem:
  stem: （2024 · 全国一模）已知函数 $f(x)=e^x-ax^2-\cos x-\ln(x+1)$。
  parts: *a1
  choices: []
  answer: 第(1)问：图象与 $x$ 轴相切于原点。第(2)问：$a\in(\frac32,+\infty)$。
  fidelity_notes:
    - 无选项。
    - 第(2)问是极值点个数，不是零点个数；source 将其解释为 $f^\prime$ 的两侧零点模型。
solution:
  source_solution_summary: 第(1)问当 $a=1$ 时，$f(0)=0$，且 $f^\prime(x)=e^x-2x+\sin x-\frac1{x+1}$，所以 $f^\prime(0)=0$，在原点处切线为 $y=0$，即与 $x$ 轴相切。 第(2)问令 $g=f^\prime$， $g^\prime(x)=e^x-2a+\cos x+\frac1{(x+1)^2}$。关键是 $g(0)=f^\prime(0)=0$，这是导函数的中间零点。若 $a\le\frac32$，则左侧不能产生所需极值点；若 $a>\frac32$，因为 $g^\prime(0)=3-2a<0$，source 分别在 $(-1,0)$ 与 $(0,+\infty)$ 构造出 $g^\prime$ 的零点，再推出 $g=f^\prime$ 在两侧各有一个零点，故 $f$ 在两侧各有一个极小值点。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：验证原点在图象上。
      formula_trace:
        from: $f(x)=e^x-x^2-\cos x-\ln(x+1)$
        to: $f(0)=0$
        operation: 代入 $x=0$。
        why: 原点是切点候选。
      source_ref: page_0261_ex10_solution_start
    - step_id: step_2
      statement: 第(1)问：验证切线斜率为 0。
      formula_trace:
        from: $f^\prime(x)=e^x-2x+\sin x-\frac1{x+1}$
        to: $f^\prime(0)=0$
        operation: 代入 $x=0$。
        why: 切线为 $y=0$，即 $x$ 轴。
      source_ref: page_0261_ex10_solution_start
    - step_id: step_3
      statement: 第(2)问：把极值点问题转成 $f^\prime$ 的零点问题。
      formula_trace:
        from: $f^\prime(x)=e^x-2ax+\sin x-\frac1{x+1}$
        to: $g(x)=f^\prime(x)$，$g(0)=0$
        operation: 把导函数另设为 $g$。
        why: 两侧各有极值点等价于 $g$ 在两侧各有一个零点。
      source_ref: page_0262_ex10_solution_continuation
    - step_id: step_4
      statement: 第(2)问：看 $g$ 在中间零点的二阶趋势。
      formula_trace:
        from: $g^\prime(x)=e^x-2a+\cos x+\frac1{(x+1)^2}$
        to: $g^\prime(0)=3-2a$
        operation: 求 $f^{\prime\prime}(0)$。
        why: 中间零点已知时，二阶导符号决定两侧能否产生极值点。
      source_ref: page_0262_ex10_solution_continuation
    - step_id: step_5
      statement: 排除 $a\le\frac32$。
      formula_trace:
        from: $3-2a\ge0$
        to: $(-1,0)$ 上不能形成所需极值点
        operation: 用 source 的 $h=g^\prime$ 在左侧的单调性判定。
        why: 左侧 $g$ 没有符合要求的零点，故 $f$ 无极值点。
      source_ref: page_0262_ex10_solution_continuation
    - step_id: step_6
      statement: 证明 $a>\frac32$ 时左侧有一个极小值点。
      formula_trace:
        from: $a>\frac32$，$g^\prime(0)<0$
        to: 存在 $m\in(-1,0)$，$f^\prime(m)=0$，且左侧先负后正
        operation: 先找 $g^\prime$ 的零点 $x_0$，再找 $g=f^\prime$ 的零点 $m$。
        why: 这给出 $f$ 在 $(-1,0)$ 的一个极小值点。
      source_ref: page_0262_ex10_solution_continuation
    - step_id: step_7
      statement: 证明 $a>\frac32$ 时右侧有一个极小值点。
      formula_trace:
        from: $a>\frac32$，$g^\prime(0)<0$ 且远处 $g^\prime>0$
        to: 存在 $n>0$，$f^\prime(n)=0$，且右侧先负后正
        operation: 在 $(0,+\infty)$ 上同样先找 $g^\prime$ 的零点，再找 $g$ 的零点。
        why: 这给出 $f$ 在 $(0,+\infty)$ 的一个极小值点。
      source_ref: page_0262_ex10_solution_continuation
    - step_id: step_8
      statement: 合并参数范围。
      formula_trace:
        from: $a>\frac32$ 必要且充分
        to: $a\in(\frac32,+\infty)$
        operation: 合并两侧极值点存在条件。
        why: 完成求参。
      source_ref: page_0262_ex10_solution_continuation
teaching_card:
  student_title: 极值点题先看 $f^\prime(0)=0$ 这个中间零点
  what_it_trains: 训练把“两侧各有一个极值点”翻译成导函数两侧各有一个零点，再用 $f^{\prime\prime}(0)$ 判断形状。
  recognition_cues:
    - 题目要求 $(-1,0)$ 和 $(0,+\infty)$ 各有一个极值点。
    - 直接算出 $f^\prime(0)=0$，说明导函数中间零点已知。
    - source 最后点明本质是 $f^{\prime\prime}(0)<0$，即 $a>\frac32$。
  normalization_moves:
    - 先完成第(1)问的 $f(0)=0$、$f^\prime(0)=0$。
    - 第(2)问不要直接找 $f$ 的极值，先研究 $f^\prime$。
    - 用 $f^{\prime\prime}(0)$ 锁参数方向，再补左右存在性。
  common_failures:
    - 把两侧极值点误读成两侧零点。
    - 只得到 $a>\frac32$，没有说明两侧确实各有一个极值点。
    - 忘记定义域左端是 $-1$，左侧只能在 $(-1,0)$ 讨论。
  similar_practice_query: 中间零点 fprime0 极值点两侧 e^x cosx ln(1+x) 参数范围 a>3/2
