stem: |-
  （2024 · 全国一模）已知函数 $f(x)=e^x-ax^2-\cos x-\ln(x+1)$。
  1. 若 $a=1$，求证：函数 $f(x)$ 的图象与 $x$ 轴相切于原点。
  2. 若函数 $f(x)$ 在区间 $(-1,0)$、$(0,+\infty)$ 各恰有一个极值点，求实数 $a$ 的取值范围。
answer: |-
  第(1)问：图象与 $x$ 轴相切于原点。第(2)问：$a\in(\frac32,+\infty)$。

  第(1)问当 $a=1$ 时，$f(0)=0$，且 $f^\prime(x)=e^x-2x+\sin x-\frac1{x+1}$，所以 $f^\prime(0)=0$，在原点处切线为 $y=0$，即与 $x$ 轴相切。 第(2)问令 $g=f^\prime$， $g^\prime(x)=e^x-2a+\cos x+\frac1{(x+1)^2}$。关键是 $g(0)=f^\prime(0)=0$，这是导函数的中间零点。若 $a\le\frac32$，则左侧不能产生所需极值点；若 $a>\frac32$，因为 $g^\prime(0)=3-2a<0$，source 分别在 $(-1,0)$ 与 $(0,+\infty)$ 构造出 $g^\prime$ 的零点，再推出 $g=f^\prime$ 在两侧各有一个零点，故 $f$ 在两侧各有一个极小值点。
