stem: |-
  （22-23高二下·浙江杭州·期中）已知 $a=\frac{\ln\sqrt2}{2},\ b=\frac{\ln3}{6},\ c=\frac1{2e}$，则 $a,b,c$ 的大小为（ ）
  A. $b>c>a$
  B. $a>b>c$
  C. $b>a>c$
  D. $c>b>a$
answer: |
  D

  先化简
  \[
  a=\frac{\ln\sqrt2}{2}=\frac{\ln2}{4},\quad
  c=\frac1{2e}=\frac{\ln e}{2e}.
  \]
  构造
  \[
  f(x)=\frac{\ln x}{2x}\ (x>0),\qquad
  f^{\prime}(x)=\frac{1-\ln x}{2x^2}.
  \]
  因此 $f$ 在 $(0,e)$ 递增，在 $(e,+\infty)$ 递减。
  由 $2,3<e$，得
  \[
  a=f(2)<f(e)=c,\qquad b=f(3)<f(e)=c.
  \]
  再比 $a,b$：
  \[
  a=\frac{\ln2}{4}=\frac{\ln8}{12}<\frac{\ln9}{12}=\frac{\ln3}{6}=b.
  \]
  所以 $c>b>a$，选 D。
  法二也可写成
  \[
  a=\frac{\ln2}{4}=\frac{\ln4}{8}=f(4),
  \]
  而 $4>3>e$ 位于递减段，故 $f(4)<f(3)<f(e)$，同得 $a<b<c$，等价于 $c>b>a$。
