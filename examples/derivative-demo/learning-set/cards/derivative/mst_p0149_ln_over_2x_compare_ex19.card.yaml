teaching_card:
  student_title: 把三项都塞进同一个峰值函数
  what_it_trains: 训练把零散分式统一到 $\frac{\ln x}{x}$ 模型，再借助极值点附近的单调区间快速排序。
  recognition_cues:
    - 表达式含 $\ln x$ 与线性分母。
    - 出现常见锚点 $2,3,e$。
    - 题目要求三数全序。
  normalization_moves:
    - 先构造同构函数。
    - 先找谁最接近峰值 $e$。
    - 再用通分对数补齐剩余比较。
  common_failures:
    - 把 $f$ 的增减区间记反。
    - 认为 $a=\frac{\ln\sqrt2}{2}$ 难算而放弃同构。
    - 忽略法二重建符号，导致链式比较断裂。
