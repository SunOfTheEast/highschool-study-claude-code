solution:
  source_solution_summary: |
    分类讨论。若 $a>0$，$y=ax^2$ 与 $y=\ln x+1$ 是一凹一凸内公切线模型，
    需要抛物线在对数曲线外侧，即
    $ax^2\ge\ln x+1$ 对 $x>0$ 恒成立，所以
    $a\ge\left(\frac{\ln x+1}{x^2}\right)_{\max}$。
    令 $r(x)=\frac{\ln x+1}{x^2}=\frac{\ln(ex)}{x^2}$，则
    $r'(x)=-\frac{2\ln x+1}{x^3}$，最大值在
    $x=e^{-1/2}$ 处取得，$r_{\max}=\frac e2$。页图中的同构写法为
    $\left(\frac{e^2\ln(e^2x^2)}{2e^2x^2}\right)_{\max}=\frac e2$。
    因此 $a>0$ 时需 $a\ge\frac e2$。若 $a<0$，源页图像显示两曲线在各自递增分支上形成外公切线模型，一定存在一条公共切线。结合选项，
    $-1$、$e$、$\frac e2$ 可取，$\frac12<\frac e2$ 不可取。故选 ABC。
  key_steps:
    - step_id: step_1
      statement: 先讨论 $a>0$ 的内公切线模型。
      formula_trace:
        from: |
          $a>0,\quad y=ax^2,\quad y=\ln x+1$
        to: |
          $ax^2\ge\ln x+1\quad (x>0)$
        operation: 根据源页左图，把开口向上的抛物线放在对数曲线外侧。
        why: 一凹一凸内公切线存在可由外侧包裹关系保证。
      source_ref: page_0105
    - step_id: step_2
      statement: 分离参数并求最大值。
      formula_trace:
        from: |
          $ax^2\ge\ln x+1$
        to: |
          $a\ge r(x)=\frac{\ln x+1}{x^2}=\frac{\ln(ex)}{x^2}$
        operation: 除以 $x^2>0$，把 $a$ 放到不等式左侧。
        why: 要对所有 $x>0$ 成立，$a$ 至少要达到右端函数的最大值。
      source_ref: page_0105
    - step_id: step_3
      statement: 消解源页模糊公式并得到 $r_{\max}=\frac e2$。
      formula_trace:
        from: |
          $r(x)=\frac{\ln x+1}{x^2}$
        to: |
          $r'(x)=-\frac{2\ln x+1}{x^3},\quad x=e^{-1/2},\quad r_{\max}=\frac e2$
        operation: 直接求导；也可按页图写成 $\frac{\ln(ex)}{x^2}=\frac{e^2\ln(e^2x^2)}{2e^2x^2}$ 后套 $\frac{\ln u}{u}$ 的最大值。
        why: 这一步对应 markdown 的 unclear marker，图片和求导给出同一结果。
      source_ref: page_0105
    - step_id: step_4
      statement: 处理 $a<0$ 的外公切线模型。
      formula_trace:
        from: |
          $a<0$
        to: |
          $y=ax^2$ 的左支与 $y=\ln x+1$ 的递增分支形成外公切线模型，存在一条公共切线
        operation: 按源页右图进行分支位置判断。
        why: 负开口抛物线与对数曲线在两侧分离，外公切线由图像模型保证。
      source_ref: page_0105
    - step_id: step_5
      statement: 结合选项。
      formula_trace:
        from: |
          $a<0\text{ 均可};\qquad a>0\text{ 时 }a\ge\frac e2$
        to: |
          $-1,e,\frac e2\text{ 可取};\quad \frac12\text{ 不可取}$
        operation: 把选项代入分类后的参数条件。
        why: 题目问可能取值，需同时考虑正负两类。
      source_ref: page_0105
teaching_card:
  student_title: 正负开口分开看抛物线和对数的公切线
  what_it_trains: 训练对含参二次曲线先按开口方向分类，再用包裹关系和比值最大值判断公共切线是否存在。
  recognition_cues:
    - 题干写 $a\ne0$，选项同时有负数和正数，必须先分 $a>0$ 与 $a<0$。
    - 正开口时要压住 $\ln x+1$，自然出现 $\frac{\ln x+1}{x^2}$。
    - 选项出现 $\frac e2$，提示最大值点在 $x=e^{-1/2}$。
  normalization_moves:
    - 正参数：写 $a\ge\frac{\ln x+1}{x^2}$。
    - 求 $r_{\max}=\frac e2$。
    - 负参数：读图判断外公切线存在。
    - 最后用 $a<0$ 或 $a\ge\frac e2$ 筛选选项。
  common_failures:
    - 只做 $a>0$，漏选负数 A。
    - 把最大值误算成 $\frac12$，从而误选 D。
    - 看到公共切线就强行列两个切点，忽略图像模型能先给出范围。
  similar_practice_query: ax^2 ln x+1 公切线 a正负分类 e/2
