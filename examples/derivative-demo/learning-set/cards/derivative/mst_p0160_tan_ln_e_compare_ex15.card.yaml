original_problem:
  stem: （2023·靖江市期中）已知 $a=\tan\frac1e$，$b=\frac{e-1}{e^2}$，$c=\ln\frac{e}{e-1}$，其中 $e$ 为自然对数的底数，则 $a,b,c$ 的大小关系为（  ）
