solution:
  source_solution_summary: |
    先注意零支：若 $a=0$，则任意 $b>-1$ 都满足原等式；若 $b=0$，则任意实数
    $a$ 都满足原等式。A 可由 $a=0,-1<b<0$ 反驳。对非零支，原等式可化为
    $\frac{a}{e^a-1}=\frac{\ln(1+b)}{b}$。令
    $F(x)=\frac{x}{e^x-1}$，则
    $\frac{\ln(1+b)}{b}=F(\ln(1+b))$；由 $F$ 严格递减，得到
    $a=\ln(1+b)$，即 $b=e^a-1$。B 中若 $b=0$ 显然成立；若非零支且 $a>0$，
    则 $b>0$，只需证
    $\frac{b^2}{2}-b+\ln(1+b)>0$，其导数
    $b-1+\frac{1}{1+b}\ge0$ 且从 0 出发，故 B 正确。C 可在非零支上由连续函数
    $b-\ln(1+b)$ 从 0 增至无穷得到解，也可由 $b=0,a=\sqrt2$ 的零支直接给出例子。
    D 源解用图像说明同一高度下 $F$ 的横向变化更大，得到相反的不等式；零支中取
    $b_1=b_2=0$、$a_1,a_2<0$ 且 $a_1\ne a_2$ 也立即反驳 D。故选 BC。
  key_steps:
    - step_id: step_1
      statement: 先处理不能直接相除的零支。
      formula_trace:
        from: $ab=(e^a-1)\ln(1+b)$
        to: $a=0$ 时任意 $b>-1$ 成立；$b=0$ 时任意 $a$ 成立
        operation: 分别代入 $a=0$ 与 $b=0$，两边都化为 $0$。
        why: 后续分式化会除以 $e^a-1$ 和 $b$，必须先把零支拿出来。
      source_ref: page_0051
    - step_id: step_2
      statement: 用 $a=0$ 的零支反驳 A。
      formula_trace:
        from: $a=0,\quad -1<b<0$
        to: $b<0$ 但 $a<0$ 不成立
        operation: 把零支中的任意负 $b$ 作为反例。
        why: 一个反例即可判定 A 错。
      source_ref: page_0051
    - step_id: step_3
      statement: 在非零支上同构化，推出 $a=\ln(1+b)$。
      formula_trace:
        from: $\frac{a}{e^a-1}=\frac{\ln(1+b)}{b}$
        to: $F(a)=F(\ln(1+b))\Rightarrow a=\ln(1+b)$
        operation: 令 $F(x)=\frac{x}{e^x-1}$，并用 $F$ 的严格递减性。
        why: 同一个单调母函数取相同值，只能对应相同输入。
      source_ref: page_0051
    - step_id: step_4
      statement: 判定 B：把目标化成一个递增函数的正性。
      formula_trace:
        from: $b<a+\frac{b^2}{2},\quad a=\ln(1+b)$
        to: $h(b)=\frac{b^2}{2}+\ln(1+b)-b>0\quad (b>0)$
        operation: 由 $a>0$ 得非零支上 $b>0$；求导 $h^{\prime}(b)=b-1+\frac{1}{1+b}=\frac{b^2}{1+b}\ge0$，且 $h(0)=0$。
        why: 把选项 B 的比较变为从 0 出发的单调性判断。
      source_ref: page_0051
    - step_id: step_5
      statement: 判定 C：构造满足距离为 $\sqrt2$ 的解。
      formula_trace:
        from: $a=\ln(1+b),\quad |a-b|=|b-\ln(1+b)|$
        to: 存在 $b>0$ 使 $b-\ln(1+b)=\sqrt2$
        operation: 函数 $q(b)=b-\ln(1+b)$ 在 $[0,+\infty)$ 连续，$q(0)=0$ 且 $q(b)\to+\infty$。
        why: 介值性给出非零同构支上的一组解，因此 C 正确。
      source_ref: page_0051
    - step_id: step_6
      statement: 判定 D：源图给出相反距离关系，零支也能直接反驳。
      formula_trace:
        from: $b_1=b_2=0,\quad a_1<0,\ a_2<0,\ a_1\ne a_2$
        to: $|a_1-a_2|>0=|b_1-b_2|$
        operation: 取 $b=0$ 零支中的两组负 $a$ 解；源图的非零支比较同样显示 $|a_1-a_2|>|b_1-b_2|$。
        why: D 要求的是严格小于，任一满足条件的反例即可判定 D 错。
      source_ref: page_0052
teaching_card:
  student_title: 先拆零支，再用同构关系选多选
  what_it_trains: 训练在隐式指对方程里先保护定义域和零支，再把非零部分收缩成同一个单调母函数，从而判断符号、大小和存在性选项。
  recognition_cues:
    - 等式两边都是乘积，$a=0$ 或 $b=0$ 会让两边同时为 0。
    - 非零支能出现 $\frac{a}{e^a-1}$ 与 $\frac{\ln(1+b)}{b}$。
    - 右边分式正好可以写成 $F(\ln(1+b))$。
    - 选项同时考符号、大小、存在性和两点距离，不能只算一个通式就结束。
  normalization_moves:
    - 先列出 $a=0$ 和 $b=0$ 两条零支。
    - 非零支除法后统一到 $F(x)=\frac{x}{e^x-1}$。
    - 由 $F$ 单调递减推出 $a=\ln(1+b)$。
    - 把 B 化成 $h(b)=\frac{b^2}{2}+\ln(1+b)-b$ 的正性。
    - 用零支或函数图反驳 D。
  common_failures:
    - 漏掉 $a=0$ 或 $b=0$，导致 A、D 判断错误。
    - 把 $F$ 和 $G$ 当成两个无关函数，没写出 $G(b)=F(\ln(1+b))$。
    - B 中忘了 $a>0$ 在非零支上推出 $b>0$。
    - C 只说“一定有解”，没有用连续性或具体零支构造支撑。
  similar_practice_query: 多选 同构函数 a/(e^a-1) ln(1+b)/b 零支 b=0 a=ln(1+b)
quality:
  confidence: high
  needs_review: false
  review_notes:
    - 已核对 page_0051/page_0052 页图；例 11 题头从 page_0051 开始，page_0052 顶部完成解析并给出 BC。
    - 源解默认分式化时未单列 $a=0$、$b=0$，本卡补充分支；该补充不改变答案，不列为用户拍板。
