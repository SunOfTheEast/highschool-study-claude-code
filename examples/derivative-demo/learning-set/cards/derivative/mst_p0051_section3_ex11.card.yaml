      - 指对复合结构
      - 复合函数与不动点结构
    evidence:
      - $\frac{\ln(1+b)}{b}=F(\ln(1+b))$，其中 $F(x)=\frac{x}{e^x-1}$。
      - 非零支由 $F(a)=F(\ln(1+b))$ 收缩到 $a=\ln(1+b)$。
      - 零支 $a=0$ 或 $b=0$ 对选项 A、D 的真假有决定作用。
    normalization_moves_used:
      - 先分离 $a=0$、$b=0$。
      - $ab=(e^a-1)\ln(1+b)\Rightarrow \frac{a}{e^a-1}=\frac{\ln(1+b)}{b}$（非零支）。
      - $\frac{\ln(1+b)}{b}=F(\ln(1+b))$。
      - $b<a+\frac{b^2}{2}\Rightarrow \frac{b^2}{2}-b+\ln(1+b)>0$。
  fallback:
    only_if_trace_shows:
      - 若学生一上来就除以 $b$ 或 $e^a-1$ 而漏掉零支，回补函数三要素与定义域。
      - 若学生不会由 $F(a)=F(\ln(1+b))$ 和单调性推出 $a=\ln(1+b)$，回补导数单调极值基础。
      - 若学生不会证明 $\frac{b^2}{2}-b+\ln(1+b)>0$，回补导数单调极值基础。
      - 若学生不能用连续性说明 $b-\ln(1+b)=\sqrt2$ 有解，回补函数性质与图像。
      - 若学生读不出 page_0051 图中同一高度对应的横向距离比较，回补函数性质与图像。
  detail_terms:
    - $ab=(e^a-1)\ln(1+b)$
    - $F(x)=\frac{x}{e^x-1}$
    - $G(x)=\frac{\ln(1+x)}{x}=F(\ln(1+x))$
    - $a=\ln(1+b)$
    - $\frac{b^2}{2}-b+\ln(1+b)>0$
    - $b=0$ 零支
