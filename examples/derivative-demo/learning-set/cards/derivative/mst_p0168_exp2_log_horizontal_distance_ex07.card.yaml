solution:
  source_solution_summary: |
    设 $f(x)=e^{2x}$ 的反函数为 $y=\frac{\ln x}{2}$，设
    $g(x)=\ln x+\frac12$ 的反函数为 $y=e^{x-\frac12}$。
    把原来的水平线 $y=a$ 转为反函数图像中的竖线 $x=a$，记交点为 $A',B'$，有
    \[
    |AB|=|A'B'|=e^{a-\frac12}-\frac{\ln a}{2}.
    \]
    令
    \[
    F(x)=e^{x-\frac12}-\frac{\ln x}{2}\quad (x>0),
    \]
    则
    \[
    F^{\prime}(x)=e^{x-\frac12}-\frac{1}{2x}=0
    \Rightarrow x=\frac12.
    \]
    源解据此取到最小值
    \[
    |AB|_{\min}=F\!\left(\frac12\right)=1+\frac{\ln2}{2},
    \]
    故选 B。
  key_steps:
    - step_id: step_1
      statement: 分别求两函数反函数并改用竖线 $x=a$ 表达对应距离。
      formula_trace:
        from: $f(x)=e^{2x},\ g(x)=\ln x+\frac12$ 与 $y=a$ 相交
        to: $f^{-1}(x)=\frac{\ln x}{2},\ g^{-1}(x)=e^{x-\frac12}$；且 $|AB|=|A'B'|$
        operation: 把函数换到反函数坐标后，$y=a$ 对应为 $x=a$。
        why: 把原问题转化为同一自变量下两函数值之差。
      source_ref: page_0168_ex07_solution
    - step_id: step_2
      statement: 把长度写成单变量函数。
      formula_trace:
        from: $|AB|=|A'B'|$
        to: $|AB|=e^{a-\frac12}-\frac{\ln a}{2}$
        operation: 代入两条反函数在 $x=a$ 处的函数值并作差。
        why: 最小距离问题归约为一元函数极值。
      source_ref: page_0168_ex07_solution
    - step_id: step_3
      statement: 求导找极值点。
      formula_trace:
        from: $F(x)=e^{x-\frac12}-\frac{\ln x}{2}$
        to: $F^{\prime}(x)=e^{x-\frac12}-\frac{1}{2x}=0\\Rightarrow x=\frac12$
        operation: 对 $F$ 求导并解驻点方程。
        why: 源解用导数法定位最小值点。
      source_ref: page_0168_ex07_solution
    - step_id: step_4
      statement: 代回驻点得到最小值并匹配选项。
      formula_trace:
        from: $x=\frac12$
        to: $|AB|_{\\min}=F\\!\\left(\\frac12\\right)=1+\\frac{\\ln2}{2}$
        operation: 把驻点代回目标函数。
        why: 得到选项 B。
      source_ref: page_0168_ex07_solution
teaching_card:
  student_title: 反函数横向差：把 |AB| 化成一元极值
  what_it_trains: 训练遇到“同一水平线截两函数”的距离题时，先做反函数同构，再把长度化为单变量函数求最小值。
  recognition_cues:
    - 题干是两函数与同一条 $y=a$ 的交点距离。
    - 一条是指数函数，另一条是对数平移函数。
    - 选项是常数型最小值。
  normalization_moves:
    - 先写出两条反函数。
    - 把 $y=a$ 换到反函数坐标下的 $x=a$。
    - 长度表达式统一为一个 $F(x)$。
    - 对 $F$ 求导、解驻点、代回取值。
  common_failures:
    - 把 $|AB|$ 直接按原图两点坐标硬算，忽略反函数同构。
    - 反函数求错：把 $e^{2x}$ 误反解成 $\\ln x$ 而漏掉 $\\frac12$。
    - 求导后漏掉 $-\\frac{1}{2x}$ 或漏写定义域 $x>0$。
  similar_practice_query: 反函数构造 水平线交点距离 e^{2x} lnx+1/2 最小值
