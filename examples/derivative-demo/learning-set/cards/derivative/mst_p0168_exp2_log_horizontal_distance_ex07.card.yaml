stem: |-
  （2024·晋江市五校联考 T8）已知函数 $f(x)=e^{2x}$，$g(x)=\ln x+\frac{1}{2}$ 分别与直线 $y=a$ 交于点 $A$，$B$，则 $|AB|$ 的最小值为（  ）
  A. $1-\frac{1}{2}\ln 2$
  B. $1+\frac{1}{2}\ln 2$
  C. $2-\frac{1}{2}\ln 2$
  D. $2+\frac{1}{2}\ln 2$
answer: |
  B

  设 $f(x)=e^{2x}$ 的反函数为 $y=\frac{\ln x}{2}$，设
  $g(x)=\ln x+\frac12$ 的反函数为 $y=e^{x-\frac12}$。
  把原来的水平线 $y=a$ 转为反函数图像中的竖线 $x=a$，记交点为 $A',B'$，有
  \[
  |AB|=|A'B'|=e^{a-\frac12}-\frac{\ln a}{2}.
  \]
  令
  \[
  F(x)=e^{x-\frac12}-\frac{\ln x}{2}\quad (x>0),
  \]
  则
  \[
  F^{\prime}(x)=e^{x-\frac12}-\frac{1}{2x}=0
  \Rightarrow x=\frac12.
  \]
  源解据此取到最小值
  \[
  |AB|_{\min}=F\!\left(\frac12\right)=1+\frac{\ln2}{2},
  \]
  故选 B。
