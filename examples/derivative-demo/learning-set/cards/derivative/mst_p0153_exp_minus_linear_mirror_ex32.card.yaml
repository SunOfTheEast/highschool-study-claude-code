teaching_card:
  student_title: 同构函数的左支反解排序
  what_it_trains: 训练把指数线性混合等式统一成同一函数等值，再用左右支单调性反推未知量顺序。
  recognition_cues:
    - 多组方程都形如 $e^u-e^k=e(u-k)$。
    - 题设附带“$\ne0$”限制，提示要排除某个显然解。
    - 目标是三个未知量的大小关系。
  normalization_moves:
    - 移项凑成 $e^u-eu=e^k-ek$。
    - 统一到 $f(u)=e^u-eu$。
    - 先判 $f(2),f(3),f(5)$，再用左支递减反推。
  common_failures:
    - 忽略“$\ne0$”，误把 $x=2,y=3,z=5$ 当作解。
    - 只判到 $f(2)<f(3)<f(5)$，忘记回到变量顺序会反向。
    - 把 $f^{\prime}(t)$ 符号区间写反。
  similar_practice_query: e^x-ex 同构函数 左支反解 比大小
