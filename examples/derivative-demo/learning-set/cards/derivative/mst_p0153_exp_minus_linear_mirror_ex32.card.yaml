stem: |-
  （2025·黑龙江·一模）已知实数 $x,y,z$ 满足 $e^x-e^2=e(x-2)\ne0$，$e^y-e^3=e(y-3)\ne0$，$e^z-e^5=e(z-5)\ne0$，其中 $e$ 为自然对数的底数。则 $x,y,z$ 的大小关系是（  ）
  A. $x<y<z$
  B. $y<x<z$
  C. $z<x<y$
  D. $z<y<x$
answer: |
  D

  设
  \[
  f(t)=e^t-et.
  \]
  则
  \[
  f^{\prime}(t)=e^t-e,
  \]
  所以 $f$ 在 $(-\infty,1)$ 上单调递减，在 $(1,+\infty)$ 上单调递增。

  由题设
  \[
  e^x-e^2=e(x-2),\ e^y-e^3=e(y-3),\ e^z-e^5=e(z-5)
  \]
  可化为
  \[
  e^x-ex=e^2-2e,\ e^y-ey=e^3-3e,\ e^z-ez=e^5-5e,
  \]
  即
  \[
  f(x)=f(2),\ f(y)=f(3),\ f(z)=f(5),
  \]
  且 $x\ne2,y\ne3,z\ne5$。因此 $x,y,z$ 取的是对应右侧点 $2,3,5$ 的左支反解，故 $x,y,z<1$。

  又因
  \[
  f(2)<f(3)<f(5),
  \]
  在左支（递减）上反解顺序反向，得到
  \[
  z<y<x.
  \]
  故选 D。
