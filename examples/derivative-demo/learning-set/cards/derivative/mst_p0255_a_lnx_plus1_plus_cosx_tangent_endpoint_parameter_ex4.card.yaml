stem: |-
  （2025 · 北京石景山 · 一模）已知函数 $f(x)=a\ln(x+1)+\cos x$，$a\in\mathbf{R}$。
  1. 若 $a=1$，求曲线 $y=f(x)$ 在点 $(0,f(0))$ 处的切线方程。
  2. 若 $a=1$，证明函数 $f(x)$ 在区间 $(-1,0)$ 上有且只有一个零点。
  3. 若实数 $a$ 使得 $f(x)\le2e^x-1$ 对 $x\in[0,\pi]$ 恒成立，求 $a$ 的取值范围。
answer: |-
  第(1)(i)问：$y=x+1$。第(1)(ii)问：$(-1,0)$ 上唯一零点。第(2)问：$a\le2$。

  第(1)(i)问在 $a=1$ 时，$f(0)=1$ 且 $f^\prime(0)=1$，切线为 $y=x+1$。第(1)(ii)问在 $(-1,0)$ 上有 $f^\prime(x)=\frac1{x+1}-\sin x>0$， 所以 $f$ 单调递增；又 $f(\frac1{e^2}-1)=-2+\cos(\frac1{e^2}-1)<0$， $f(0)=1>0$，故唯一零点存在。第(2)问令 $g_a(x)=2e^x-1-a\ln(1+x)-\cos x$，题设等价于 $g_a(x)\ge0$。由 $g_a(0)=0$ 和 $g_a^\prime(0)=2-a$ 得必要条件 $a\le2$。若 $a\le2$，因 $\ln(1+x)\ge0$，有 $g_a(x)\ge g_2(x)$。 对 $q(x)=g_2(x)$，$q(0)=q^\prime(0)=0$ 且 $q^{\prime\prime}(x)=2e^x+\cos x+\frac2{(1+x)^2}>0$， 所以 $q^\prime\ge0$、$q\ge0$。故 $a\le2$ 充分。
