original_problem:
  stem: （2025 · 北京石景山 · 一模）已知函数 $f(x)=a\ln(x+1)+\cos x$，$a\in\mathbf{R}$。
  parts: *a1
  choices: []
  answer: 第(1)(i)问：$y=x+1$。第(1)(ii)问：$(-1,0)$ 上唯一零点。第(2)问：$a\le2$。
  fidelity_notes:
    - 无选项。
    - 第(2)问 source 充分性证明按参数单调性修正。
solution:
  source_solution_summary: 第(1)(i)问在 $a=1$ 时，$f(0)=1$ 且 $f^\prime(0)=1$，切线为 $y=x+1$。第(1)(ii)问在 $(-1,0)$ 上有 $f^\prime(x)=\frac1{x+1}-\sin x>0$， 所以 $f$ 单调递增；又 $f(\frac1{e^2}-1)=-2+\cos(\frac1{e^2}-1)<0$， $f(0)=1>0$，故唯一零点存在。第(2)问令 $g_a(x)=2e^x-1-a\ln(1+x)-\cos x$，题设等价于 $g_a(x)\ge0$。由 $g_a(0)=0$ 和 $g_a^\prime(0)=2-a$ 得必要条件 $a\le2$。若 $a\le2$，因 $\ln(1+x)\ge0$，有 $g_a(x)\ge g_2(x)$。 对 $q(x)=g_2(x)$，$q(0)=q^\prime(0)=0$ 且 $q^{\prime\prime}(x)=2e^x+\cos x+\frac2{(1+x)^2}>0$， 所以 $q^\prime\ge0$、$q\ge0$。故 $a\le2$ 充分。
  key_steps:
    - step_id: step_1
      statement: 第(1)(i)问：求点值和斜率。
      formula_trace:
        from: $f(x)=\ln(1+x)+\cos x$
        to: $f(0)=1,\ f^\prime(0)=1$
        operation: 代入 $x=0$ 并求导。
        why: 切线方程由点和斜率确定。
      source_ref: page_0255_ex4_solution_start
    - step_id: step_2
      statement: 第(1)(i)问：写出切线。
      formula_trace:
        from: 点 $(0,1)$，斜率 $1$
        to: $y=x+1$
        operation: 套点斜式。
        why: 完成切线方程。
      source_ref: page_0255_ex4_solution_start
    - step_id: step_3
      statement: 第(1)(ii)问：证明 $(-1,0)$ 上单调递增。
      formula_trace:
        from: $f^\prime(x)=\frac1{x+1}-\sin x$
        to: $x\in(-1,0)\Rightarrow f^\prime(x)>0$
        operation: 利用 $\frac1{x+1}>0$ 且 $\sin x<0$。
        why: 单调性给出零点唯一性。
      source_ref: page_0255_ex4_solution_start
    - step_id: step_4
      statement: 第(1)(ii)问：用介值定理找零点。
      formula_trace:
        from: $f(\frac1{e^2}-1)<0,\ f(0)=1>0$
        to: 存在唯一 $x_0\in(\frac1{e^2}-1,0)$ 使 $f(x_0)=0$
        operation: 结合连续性和单调递增。
        why: 存在性与唯一性同时完成。
      source_ref: page_0256_ex4_solution_continuation
    - step_id: step_5
      statement: 第(2)问：从端点导数拿必要条件。
      formula_trace:
        from: $g_a(x)=2e^x-1-a\ln(1+x)-\cos x$，$g_a(0)=0$
        to: $g_a^\prime(0)=2-a\ge0$
        operation: 因为 $x=0$ 是区间端点且右侧必须不能先下降。
        why: 若 $a>2$，则小正数处 $g_a(x)<0$，题设失败。
      source_ref: page_0256_ex4_solution_continuation
    - step_id: step_6
      statement: 第(2)问：把充分性降到 $a=2$。
      formula_trace:
        from: $a\le2$，$\ln(1+x)\ge0$
        to: $g_a(x)\ge g_2(x)$
        operation: 按参数 $a$ 比较差函数。
        why: 避免 source 中对所有 $a\le2$ 直接断言 $g^{\prime\prime}>0$ 的问题。
      source_ref: page_0256_ex4_solution_continuation
    - step_id: step_7
      statement: 第(2)问：证明 $a=2$ 时成立。
      formula_trace:
        from: $q(x)=2e^x-1-2\ln(1+x)-\cos x$
        to: $q(0)=q^\prime(0)=0,\ q^{\prime\prime}(x)>0\Rightarrow q(x)\ge0$
        operation: 二阶导为正，逐级推出 $q^\prime\ge0$ 和 $q\ge0$。
        why: 完成 $a\le2$ 的充分性。
      source_ref: page_0256_ex4_solution_continuation
teaching_card:
  student_title: 先看端点导数，再把参数压到边界 $a=2$
  what_it_trains: 训练含参恒成立题的端点探路：端点取等时先看右导数拿必要条件，再用参数单调性把充分性压到边界值验证。
  recognition_cues:
    - 不等式在 $x=0$ 处左右两边相等。
    - 参数只乘在 $\ln(1+x)$ 上，而 $\ln(1+x)$ 在 $[0,\pi]$ 非负。
    - 源解出现 $g(0)=0$ 和 $g^\prime(0)=2-a$。
  normalization_moves:
    - 先构造差函数 $g_a(x)$，让目标变成 $g_a(x)\ge0$。
    - 端点取等先看 $g_a^\prime(0)$，不要直接全局求导硬打。
    - 证明充分性时固定最难的 $a=2$，其他 $a\le2$ 自动更大。
  common_failures:
    - 照抄 source 的 $g^{\prime\prime}>0$，没有发现它对很负的 $a$ 不成立。
    - 只得到 $a\le2$ 必要条件，没证明 $a=2$ 成立。
    - 第(1)(ii)只说有正有负，漏掉单调性保证唯一。
  similar_practice_query: 端点探路 参数范围 a ln(1+x)+cosx <= 2e^x-1 gprime0 参数单调比较
