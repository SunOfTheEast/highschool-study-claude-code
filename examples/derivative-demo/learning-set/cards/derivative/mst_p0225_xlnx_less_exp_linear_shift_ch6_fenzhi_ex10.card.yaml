stem: 证明：$x\ln x<e^x-(2-\ln2)x-1$。
answer: |-
  证明见解析。

  目标等价于 $e^x-(2-\ln2)x-1>x\ln x$。两边移项并除以 $x^2>0$，只需证明 $\frac{e^x-1}{x^2}>\frac{\ln x+2-\ln2}{x} =\frac{\ln(\frac{e^2}{2}x)}x$。右侧用 $\frac{\ln u}{u}\leqslant1/e$：令 $u=\frac{e^2}{2}x$，则 $\frac{\ln(\frac{e^2}{2}x)}x =\frac{e^2}{2}\frac{\ln u}{u}\leqslant e/2$，取等点 $x=2/e$。左侧构造 $g(x)=e^x-\frac e2x^2-1$， $g^{\prime}(x)=e^x-ex\geqslant0$，故 $g$ 在 $x>0$ 单调递增， $g(x)>g(0)=0$，即 $\frac{e^x-1}{x^2}>e/2$。所以左侧严格大于右侧， 原不等式成立。
