original_problem:
  stem: 证明：$x\ln x<e^x-(2-\ln2)x-1$。
  parts: *a1
  choices: []
  answer: 证明见解析。
  fidelity_notes:
    - 单问证明题，无选项。
    - 由 $\ln x$ 可知证明域为 $x>0$。
solution:
  source_solution_summary: 目标等价于 $e^x-(2-\ln2)x-1>x\ln x$。两边移项并除以 $x^2>0$，只需证明 $\frac{e^x-1}{x^2}>\frac{\ln x+2-\ln2}{x} =\frac{\ln(\frac{e^2}{2}x)}x$。右侧用 $\frac{\ln u}{u}\leqslant1/e$：令 $u=\frac{e^2}{2}x$，则 $\frac{\ln(\frac{e^2}{2}x)}x =\frac{e^2}{2}\frac{\ln u}{u}\leqslant e/2$，取等点 $x=2/e$。左侧构造 $g(x)=e^x-\frac e2x^2-1$， $g^{\prime}(x)=e^x-ex\geqslant0$，故 $g$ 在 $x>0$ 单调递增， $g(x)>g(0)=0$，即 $\frac{e^x-1}{x^2}>e/2$。所以左侧严格大于右侧， 原不等式成立。
  key_steps:
    - step_id: step_1
      statement: 把目标改成两侧分式比较。
      formula_trace:
        from: $x\ln x<e^x-(2-\ln2)x-1$
        to: $\frac{e^x-1}{x^2}>\frac{\ln x+2-\ln2}{x}$
        operation: 移项后两边除以 $x^2>0$。
        why: source 的考点是 $\frac{e^x-1}{x^2}$ 的放缩估值。
      source_ref: page_0225_ex10_solution
    - step_id: step_2
      statement: 把右侧配成 $\ln u/u$。
      formula_trace:
        from: $\frac{\ln x+2-\ln2}{x}$
        to: $\frac{e^2}{2}\cdot\frac{\ln(\frac{e^2}{2}x)}{\frac{e^2}{2}x}\leqslant\frac e2$
        operation: 令 $u=\frac{e^2}{2}x$ 并套用 $\ln u/u\leqslant1/e$。
        why: 给右侧统一上界。
      source_ref: page_0225_ex10_solution
    - step_id: step_3
      statement: 构造函数证明左侧超过 $e/2$。
      formula_trace:
        from: $\frac{e^x-1}{x^2}>\frac e2$
        to: $g(x)=e^x-\frac e2x^2-1>0$
        operation: 等价变形。
        why: 精确求 $\frac{e^x-1}{x^2}$ 的最小值困难，source 用可证明的下界替代。
      source_ref: page_0225_ex10_solution
    - step_id: step_4
      statement: 验证 $g(x)>0$。
      formula_trace:
        from: $g(x)=e^x-\frac e2x^2-1$
        to: $g^{\prime}(x)=e^x-ex\geqslant0$，$x>0$ 时 $g(x)>g(0)=0$
        operation: 求导并用 $e^x\geqslant ex$。
        why: 得到左侧严格下界。
      source_ref: page_0225_ex10_solution
    - step_id: step_5
      statement: 合并上下界。
      formula_trace:
        from: $\frac{e^x-1}{x^2}>\frac e2$ 且 $\frac{\ln x+2-\ln2}{x}\leqslant\frac e2$
        to: $x\ln x<e^x-(2-\ln2)x-1$
        operation: 用严格左界压住右侧上界，再还原目标。
        why: 完成证明。
      source_ref: page_0225_ex10_solution
