  what_it_trains: 训练函数变形后的分而治之：不求精确最值，而找够用的上下界。
  recognition_cues:
    - 题目有 $e^x-1$ 和 $x\ln x$，常数被设计成 $2-\ln2$。
    - 右侧可写出 $\ln(\frac{e^2}{2}x)$。
    - source 直接提示考点是 $(e^x-1)/x^2$ 的放缩估值。
  normalization_moves:
    - 把目标改写成 $(e^x-1)/x^2$ 与对数分式比较。
    - 右侧套 $\ln u/u$ 最大值。
    - 左侧构造 $e^x-\frac e2x^2-1$ 证明下界。
  common_failures:
    - 试图精确求 $(e^x-1)/x^2$ 的最小值，计算复杂且偏离 source。
    - 把右侧取等点 $x=2/e$ 漏掉，导致不清楚常数从哪里来。
    - 只证明 $\geqslant e/2$，没有注意左侧实际是严格 $>e/2$。
  similar_practice_query: xlnx < e^x linear shift (e^x-1)/x^2 e/2 放缩估值
