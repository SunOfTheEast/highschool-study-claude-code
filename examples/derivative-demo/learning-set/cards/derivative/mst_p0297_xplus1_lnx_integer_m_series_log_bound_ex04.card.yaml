stem: |-
  （2024 秋 · 上期中）已知函数 $f(x)=(x+1)\ln x-(m+1)x+2$，$m\in\mathbf{R}$。
  1. 当 $m=1$ 时，求 $f(x)$ 的单调区间。
  2. 若对任意 $x\in(1,+\infty)$，都有 $f(x)+5>0$ 恒成立，求 $m$ 的最大整数值。
  3. 对于任意的 $n\in\mathbf{N}^*$，证明：$\frac13+\frac17+\cdots+\frac1{4n-1}<\frac{\ln(4n+1)}4$。
answer: |-
  第(1)问 $f(x)$ 在 $(0,+\infty)$ 上单调递增，无单调递减区间；第(2)问 $m$ 的最大整数值为 $2$；第(3)问数列不等式成立。

  第(1)问当 $m=1$ 时， $f^\prime(x)=\ln x+\frac1x-1$。令 $g(x)=f^\prime(x)$， 则 $g^\prime(x)=\frac{x-1}{x^2}$，所以 $g$ 在 $(0,1)$ 上递减、 在 $(1,+\infty)$ 上递增，且 $g(1)=0$，故 $f^\prime(x)\ge0$，$f$ 在 $(0,+\infty)$ 上递增。第(2)问由 $f(x)+5>0$ 分离得 $m+1<h(x)=\left(1+\frac1x\right)\ln x+\frac7x$。再令 $t(x)=x-\ln x-6$，由 $t$ 递增且 $t(8)<0<t(\frac{17}{2})$，得唯一隐点 $x_0\in(8,\frac{17}{2})$。在该点 $h_{\min}=x_0+\frac1{x_0}-5$，它落在 $(3,4)$，所以 $m+1$ 最大整数值为 $3$，$m$ 最大整数值为 $2$。法二取 $x=e$ 得必要条件 $m<\frac8e\in(2,3)$，锁定候选 $m=2$ 后再验证。 第(3)问利用第(1)问中 $m=1$ 的函数在 $(1,+\infty)$ 上递增， 得 $(x+1)\ln x-2x+2>0$，即 $\ln x>\frac{2(x-1)}{x+1}$。令 $x=\frac{4n+1}{4n-3}=1+\frac4{4n-3}$，得到 $\ln(4n+1)-\ln(4n-3)>\frac4{4n-1}$，累加后得到目标不等式。
