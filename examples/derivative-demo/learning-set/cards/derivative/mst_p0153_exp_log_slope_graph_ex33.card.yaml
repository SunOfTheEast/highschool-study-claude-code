  recognition_cues:
    - 图中有多条过原点的比较射线。
    - 题目目标是三数顺序，不要求精确值。
    - 解析给出 $k_1,k_2,k_3$ 作为主比较对象。
  normalization_moves:
    - 先比斜率，再比比值。
    - 把中间基准写成 $1=\\frac{a}{a}$。
    - 最后再回到 $c,a,b$ 本体。
