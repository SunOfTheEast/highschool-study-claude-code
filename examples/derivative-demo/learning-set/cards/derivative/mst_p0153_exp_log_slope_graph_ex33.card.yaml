stem: |-
  已知 $a=e-2$，$b=1-\ln2$，$c=e^e-e^2$。则（  ）
  A. $c>b>a$
  B. $a>b>c$
  C. $a>c>b$
  D. $c>a>b$
answer: |
  D

  源解直接给出图像斜率链
  \[
  k_1>k_2>k_3
  \Longleftrightarrow
  \frac{c}{a}>\frac{a}{a}>\frac{b}{a},
  \]
  从而
  \[
  c>a>b.
  \]
  故选 D。

  这里 $a=e-2$ 是区间 $[2,e]$ 的横向长度，$b=1-\ln2$ 是
  $\ln x$ 在该区间上的纵向变化，$c=e^e-e^2$ 是 $e^x$ 在该区间上的纵向变化。
