solution:
  source_solution_summary: |
    由指数函数与对数函数单调性逐个判符号与区间：
    \[
    a=2^{0.7}>2^0=1;
    \]
    \[
    b=\left(\frac13\right)^{0.7}<\left(\frac13\right)^0=1,\ \text{且}\ b>0,\ \text{故}\ 0<b<1;
    \]
    \[
    c=\log_2\frac13<\log_2 1=0.
    \]
    因此
    \[
    a>b>c.
    \]
    故选 C。
  key_steps:
    - step_id: step_1
      statement: 利用底数大于1的指数函数增性判 $a$。
      formula_trace:
        from: $a=2^{0.7}$
        to: $a>2^0=1$
        operation: 比较指数 $0.7>0$。
        why: 先锁定 $a$ 在 1 的上方。
      source_ref: page_0143_solution
    - step_id: step_2
      statement: 利用底数在 $(0,1)$ 的指数函数减性判 $b$。
      formula_trace:
        from: $b=\\left(\\frac13\\right)^{0.7}$
        to: $0<b<1$
        operation: 由减函数得 $\\left(\\frac13\\right)^{0.7}<\\left(\\frac13\\right)^0=1$，且指数函数值恒正。
        why: 把 $b$ 定位到 0 与 1 之间。
      source_ref: page_0143_solution
    - step_id: step_3
      statement: 利用对数增性判 $c$ 的符号。
      formula_trace:
        from: $c=\\log_2\\frac13$
        to: $c<\\log_2 1=0$
        operation: 比较真数 $\\frac13<1$。
        why: 把 $c$ 放到 0 以下。
      source_ref: page_0143_solution
    - step_id: step_4
      statement: 按区间位置合并大小关系。
      formula_trace:
        from: $a>1,\\ 0<b<1,\\ c<0$
        to: $a>b>c$
        operation: 分层比较。
        why: 对应选项 C。
      source_ref: page_0143_solution
teaching_card:
  student_title: 先分符号层，再排顺序
  what_it_trains: 训练比大小中的“区间定位法”：把每个量先放到 $(1,+\\infty)$、$(0,1)$、$(-\\infty,0)$ 再统一排序。
  recognition_cues:
    - 题目里有不同底数的指数和一个对数值。
    - 指数都不是整指数，不适合硬算小数。
    - 选项只问大小顺序。
  normalization_moves:
    - 对每个量先找基准：1 或 0。
    - 用单调性替代近似值计算。
    - 按区间层次合并顺序。
  common_failures:
    - 把 $(\\frac13)^x$ 错判为增函数。
    - 把 $\\log_2\\frac13$ 误判为正数。
    - 直接估算数值导致次序翻车。
  similar_practice_query: 指数对数三数比较 跟1比 跟0比 单调性定位
