stem: |-
  （2022·天津）已知 $a=2^{0.7}$，$b=\\left(\\frac13\\right)^{0.7}$，$c=\\log_2\\frac13$，则（  ）
  A. $a>c>b$
  B. $b>c>a$
  C. $a>b>c$
  D. $c>a>b$
answer: |
  C

  由指数函数与对数函数单调性逐个判符号与区间：
  \[
  a=2^{0.7}>2^0=1;
  \]
  \[
  b=\left(\frac13\right)^{0.7}<\left(\frac13\right)^0=1,\ \text{且}\ b>0,\ \text{故}\ 0<b<1;
  \]
  \[
  c=\log_2\frac13<\log_2 1=0.
  \]
  因此
  \[
  a>b>c.
  \]
  故选 C。
