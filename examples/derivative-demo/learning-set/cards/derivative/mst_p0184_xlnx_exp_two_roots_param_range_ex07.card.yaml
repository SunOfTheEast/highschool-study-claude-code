stem: |-
  （2023 · 咸阳模拟 T8）若方程 $x\ln x+e^x+1-ax=0$ 有两个不等的实数根，则实数 $a$ 的取值范围是（  ）
  A. $(e,+\infty)$
  B. $(e+1,+\infty)$
  C. $(2e,+\infty)$
  D. $(e^{-1},+\infty)$
answer: |-
  B

  源解把方程改写为 $(x\ln x-x+1)+(e^x-ex)+(e+1-a)x=0$，并按“特殊点探路”取 $x=1$。其中前两项恒非负，所以若 $a\le e+1$，三项非负且不可能为零； 必须 $a>e+1$。反之当 $a>e+1$ 时， $F(x)=x\ln x+e^x+1-ax$ 满足 $F(0^+)=2>0,\ F(1)=e+1-a<0,\ F(+\infty)=+\infty$， 且 $F''(x)=\frac1x+e^x>0$，故零点至多两个并且由介值性至少两个， 最终恰有两个不等实根，范围为 $(e+1,+\infty)$，选 B。
