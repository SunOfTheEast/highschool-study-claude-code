solution:
  source_solution_summary: 源解把方程改写为 $(x\ln x-x+1)+(e^x-ex)+(e+1-a)x=0$，并按“特殊点探路”取 $x=1$。其中前两项恒非负，所以若 $a\le e+1$，三项非负且不可能为零； 必须 $a>e+1$。反之当 $a>e+1$ 时， $F(x)=x\ln x+e^x+1-ax$ 满足 $F(0^+)=2>0,\ F(1)=e+1-a<0,\ F(+\infty)=+\infty$， 且 $F''(x)=\frac1x+e^x>0$，故零点至多两个并且由介值性至少两个， 最终恰有两个不等实根，范围为 $(e+1,+\infty)$，选 B。
  key_steps:
    - step_id: step_1
      statement: 拆项并固定试探点。
      formula_trace:
        from: $x\ln x+e^x+1-ax=0$
        to: $(x\ln x-x+1)+(e^x-ex)+(e+1-a)x=0$
        operation: 配凑出两段经典非负结构并抽出参数项。
        why: 便于直接使用 $x=1$ 和基础不等式判符号。
      source_ref: page_0184
    - step_id: step_2
      statement: 给出参数必要条件。
      formula_trace:
        from: $x\ln x-x+1\ge0,\ e^x-ex\ge0$
        to: $a>e+1$
        operation: 在 $x>0$ 上判定三项符号；若 $a\le e+1$ 则左边无法为 0。
        why: 有两个实根首先要“有根”，故需排除 $a\le e+1$。
      source_ref: page_0184
    - step_id: step_3
      statement: 验证满足条件时恰有两根。
      formula_trace:
        from: $a>e+1$
        to: $F(0^+)>0,\ F(1)<0,\ F(+\infty)>0,\ F'(x)>0$
        operation: 用端点符号+凸性判断交轴次数。
        why: 连续凸函数先下后上，最多两次过零；介值定理给出至少两次。
      source_ref: page_0184
teaching_card:
  student_title: 先拆非负块再用固定点判参
  what_it_trains: 训练在“指对+参数线性”方程里，用固定点试探快速给出参数阈值，并补齐根个数判断。
  recognition_cues:
    - 题干出现 $x\ln x$ 与 $e^x$ 的和。
    - 问题问“有两个不等实根”的参数范围。
    - 表达式可配成 $x\ln x-x+1$ 与 $e^x-ex$ 两段。
  normalization_moves:
    - 先做 $(x\ln x-x+1)+(e^x-ex)$ 配凑。
    - 代 $x=1$ 看参数项符号。
    - 端点符号+凸性确认恰有两根。
  common_failures:
    - 只给出 $a>e+1$ 必要性，没说明“恰有两根”。
    - 把阈值误写成 $a>e$。
    - 忽略定义域 $x>0$。
