  key_steps:
    - step_id: step_1
      statement: 用指数下界先确定 $a>c$。
      formula_trace:
        from: $a=e^{-0.01}$
        to: $a>1-0.01=0.99=c$
        operation: 套用 $e^x>1+x$（取 $x=-0.01$）。
        why: 先固定 $a,c$ 的顺序。
      source_ref: page_0159_ex12_solution
    - step_id: step_2
      statement: 补充 $a$ 的上界，便于和 $b$ 的下界对接。
      formula_trace:
        from: $a=e^{-0.01}$
        to: $a<\frac{1}{1.01}\approx0.9901$
        operation: 套用 $e^x<\frac{1}{1-x}$（取 $x=-0.01$）。
        why: 为后续证明 $b>a$ 提供可比较数值。
      source_ref: page_0159_ex12_solution
    - step_id: step_3
      statement: 对 $b$ 用 $\ln(1+x)$ 下界。
      formula_trace:
        from: $b=\frac{\ln(1+0.01)}{0.01}$
        to: $b>\frac{2}{2.01}\approx0.995$
        operation: 由 $\ln(1+x)>\frac{2x}{x+2}$（$x=0.01$）代入并化简。
        why: 建立 $b$ 的明确下界并超过 $a$ 的上界。
      source_ref: page_0159_ex12_solution
    - step_id: step_4
      statement: 合并比较链并匹配选项。
      formula_trace:
        from: $b>a$ 且 $a>c$
        to: $b>a>c$，选 A
        operation: 传递不等式。
        why: 得到唯一正确顺序。
      source_ref: page_0159_ex12_solution
teaching_card:
  student_title: 指数上界接对数下界的三数排序
  what_it_trains: 训练微小量比大小时的“上下界拼接”：先压住指数项，再抬高对数项，最后传递比较。
  recognition_cues:
    - 题目同时出现 $e^{\pm\varepsilon}$ 与 $\frac{\ln(1+\varepsilon)}{\varepsilon}$。
    - 常数阈值接近 1，适合局部不等式。
    - 选项是三数全序。
  normalization_moves:
    - 先定 $a$ 与常数的关系。
    - 给 $a$ 上界、给 $b$ 下界。
    - 把两条链拼成 $b>a>c$。
  common_failures:
    - 只得到 $a>c$ 就停止，漏掉 $b$ 与 $a$。
    - 把 $\ln(1+x)$ 下界代入后分母处理错误。
    - 把 $e^{-0.01}$ 的上界方向写反。
  similar_practice_query: e^{-0.01} ln(1.01)/0.01 三数比较 夹逼
