stem: |-
  （2024·德化县月考）设 $a=e^{-0.01}$，$b=\frac{\ln1.01}{0.01}$，$c=0.99$，则（  ）
  A. $b>a>c$
  B. $c>b>a$
  C. $a>b>c$
  D. $a>c>b$
answer: |
  A

  先比较 $a,c$。由指数函数在 $0$ 点的常用下界，
  \[
  e^x>1+x,
  \]
  取 $x=-0.01$ 得
  \[
  a=e^{-0.01}>1-0.01=0.99=c.
  \]
  再给 $a$ 一个上界：
  \[
  e^x<\frac{1}{1-x}\ (x<1),
  \]
  取 $x=-0.01$ 得
  \[
  a=e^{-0.01}<\frac{1}{1.01}\approx0.9901.
  \]
  比较 $b$ 时，令 $x=0.01>0$，用
  \[
  \ln(1+x)>\frac{2x}{x+2}
  \]
  得
  \[
  b=\frac{\ln(1+0.01)}{0.01}
  >
  \frac{2\cdot0.01}{2.01\cdot0.01}
  =
  \frac{2}{2.01}
  \approx0.995.
  \]
  于是 $b>a$，再与 $a>c$ 合并，得
  \[
  b>a>c,
  \]
  选 A。
