solution:
  source_solution_summary: |
    构造
    \[
    g(x)=\frac{f(x)}{e^{2x}}.
    \]
    由
    \[
    f(x)+e^{4x}f(-x)=0
    \]
    两边同除以 $e^{2x}$ 得
    \[
    g(x)+g(-x)=0,
    \]
    故 $g$ 为奇函数。又当 $x\in[0,2)$ 时，
    \[
    g^{\prime}(x)=\frac{f^{\prime}(x)-2f(x)}{e^{2x}}>0,
    \]
    所以 $g$ 在 $[0,2)$ 单调递增；结合奇函数对称性，可用同一单调趋势处理
    $(-2,0]$。由 $f(1)=e^2$，得
    \[
    g(1)=\frac{f(1)}{e^2}=1.
    \]
    原不等式
    \[
    e^{2x}f(2-x)<e^4
    \]
    等价为
    \[
    \frac{f(2-x)}{e^{2(2-x)}}<1
    \iff g(2-x)<g(1).
    \]
    由单调比较需满足
    \[
    -2<2-x<2,\quad 2-x<1.
    \]
    解得 $1<x<4$，故选 C。
  key_steps:
    - step_id: step_1
      statement: 将指数系数吸收进归一化函数。
      formula_trace:
        from: $f(x)+e^{4x}f(-x)=0$
        to: $g(x)=\frac{f(x)}{e^{2x}},\; g(x)+g(-x)=0$
        operation: 同除 $e^{2x}$ 并定义新函数。
        why: 把原式化成标准奇函数关系。
      source_ref: page_0126
    - step_id: step_2
      statement: 由导数条件得到 g 的单调性。
      formula_trace:
        from: $x\in[0,2)$ 时 $f^{\prime}(x)>2f(x)$
        to: $g^{\prime}(x)=\frac{f^{\prime}(x)-2f(x)}{e^{2x}}>0$
        operation: 对归一化函数求导。
        why: 建立值比较所需的顺序关系。
      source_ref: page_0126
    - step_id: step_3
      statement: 把目标不等式改写成 g(2-x) 与 g(1) 比较。
      formula_trace:
        from: $e^{2x}f(2-x)<e^4$，$f(1)=e^2$
        to: $g(2-x)<1=g(1)$
        operation: 除以 $e^{2(2-x)}$ 并代入已知点值。
        why: 将题目转成单调函数比较题。
      source_ref: page_0126
    - step_id: step_4
      statement: 结合定义域与单调性解出 x 区间。
      formula_trace:
        from: $g(2-x)<g(1)$，且 $2-x\in(-2,2)$
        to: $\begin{cases}-2<2-x<2\\2-x<1\end{cases}\Rightarrow 1<x<4$
        operation: 参数替换后做区间联立。
        why: 得到唯一符合的选项C。
      source_ref: page_0126
teaching_card:
  student_title: 指数归一化后做奇函数单调比较
  what_it_trains: 训练将 $f(x)+e^{4x}f(-x)=0$ 这类混合关系归一化为奇函数模板，再结合导数条件解区间不等式。
  recognition_cues:
    - 题设有 $f(x)$ 与 $f(-x)$，且伴随指数幂。
    - 另给 $f^{\prime}(x)>2f(x)$，提示构造后判单调。
    - 目标中出现 $f(2-x)$，常需先设中间变量比较。
  normalization_moves:
    - 设 $g=\frac{f}{e^{2x}}$，把对称关系改成奇函数。
    - 由 $f^{\prime}-2f$ 得 $g^{\prime}>0$。
    - 用 $f(1)=e^2$ 定锚点 $g(1)=1$。
    - 把不等式化为 $g(2-x)<g(1)$ 并联立区间。
  common_failures:
    - 只利用奇函数结论，忽略单调条件。
    - 把 $g(2-x)<g(1)$ 直接写成 $2-x>1$（方向反了）。
    - 漏掉 $2-x\in(-2,2)$ 的定义域约束。
  similar_practice_query: 抽象函数 指数归一化 奇函数 单调性 不等式解集
