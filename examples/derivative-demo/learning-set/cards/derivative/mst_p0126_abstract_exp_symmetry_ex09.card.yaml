stem: |-
  （2024·东湖区月考）已知定义在 $(-2,2)$ 上的函数 $f(x)$ 满足 $f(x)+e^{4x}f(-x)=0$，$f(1)=e^2$，$f^{\prime}(x)$ 为 $f(x)$ 的导函数。当 $x\in[0,2)$ 时，$f^{\prime}(x)>2f(x)$，则不等式 $e^{2x}f(2-x)<e^4$ 的解集为（ ）
  A. $(-1,1)$
  B. $(-1,2)$
  C. $(1,4)$
  D. $(1,5)$
answer: |
  C

  构造
  \[
  g(x)=\frac{f(x)}{e^{2x}}.
  \]
  由
  \[
  f(x)+e^{4x}f(-x)=0
  \]
  两边同除以 $e^{2x}$ 得
  \[
  g(x)+g(-x)=0,
  \]
  故 $g$ 为奇函数。又当 $x\in[0,2)$ 时，
  \[
  g^{\prime}(x)=\frac{f^{\prime}(x)-2f(x)}{e^{2x}}>0,
  \]
  所以 $g$ 在 $[0,2)$ 单调递增；结合奇函数对称性，可用同一单调趋势处理
  $(-2,0]$。由 $f(1)=e^2$，得
  \[
  g(1)=\frac{f(1)}{e^2}=1.
  \]
  原不等式
  \[
  e^{2x}f(2-x)<e^4
  \]
  等价为
  \[
  \frac{f(2-x)}{e^{2(2-x)}}<1
  \iff g(2-x)<g(1).
  \]
  由单调比较需满足
  \[
  -2<2-x<2,\quad 2-x<1.
  \]
  解得 $1<x<4$，故选 C。
