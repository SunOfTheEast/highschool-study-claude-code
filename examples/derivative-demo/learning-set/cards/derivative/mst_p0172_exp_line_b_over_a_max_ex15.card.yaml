stem: |-
  （2023 · 商丘三模 T11）已知函数 $f(x)=ae^x$，$g(x)=2x+b$，若 $f(x)\geqslant g(x)$ 恒成立，则 $\frac{b}{a}$ 的最大值是 (  )
  A. $-1$
  B. $1$
  C. $2$
  D. $\sqrt{2}$
answer: |
  B

  由 $ae^x\ge2x+b$，法一先写成
  $e^{x+\ln a-\ln2}\ge x+\ln a-\ln2+1\ge x+\frac b2$，
  从而 $b\le2\ln\frac a2+2$。于是
  $\frac ba\le\left[2\frac{\ln(a/2)+1}{a}\right]_{\max}
  =\left[e\cdot\frac{\ln\frac{ea}{2}}{\frac{ea}{2}}\right]_{\max}=1$，
  且 $a=b=2$ 取等。法二令 $t=e^x$，得 $at-b\ge2\ln t$。
  当直线 $y=at-b$ 始终在 $y=2\ln t$ 上方时，其横截距
  $t_1=\frac ba$ 必在 $t_2=1$ 左侧，故 $\frac ba\le1$。
  两法一致，最大值为 1，选 B。
