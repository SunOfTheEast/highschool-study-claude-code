    - label: B
      text_raw: $1$
      text_latex: $1$
    - label: C
      text_raw: $2$
      text_latex: $2$
    - label: D
      text_raw: $\sqrt{2}$
      text_latex: $\sqrt{2}$
  answer: B
  fidelity_notes:
    - 题干与选项起于 page_0172，法二续解与“故选 B”在 page_0173 顶部。
    - 源解默认进入 $\ln a$ 表达，等价要求 $a>0$；若 $a\le0$，$ae^x$ 不可能对全体 $x$ 恒压住直线 $2x+b$。
solution:
  source_solution_summary: |
    由 $ae^x\ge2x+b$，法一先写成
    $e^{x+\ln a-\ln2}\ge x+\ln a-\ln2+1\ge x+\frac b2$，
    从而 $b\le2\ln\frac a2+2$。于是
    $\frac ba\le\left[2\frac{\ln(a/2)+1}{a}\right]_{\max}
    =\left[e\cdot\frac{\ln\frac{ea}{2}}{\frac{ea}{2}}\right]_{\max}=1$，
    且 $a=b=2$ 取等。法二令 $t=e^x$，得 $at-b\ge2\ln t$。
    当直线 $y=at-b$ 始终在 $y=2\ln t$ 上方时，其横截距
    $t_1=\frac ba$ 必在 $t_2=1$ 左侧，故 $\frac ba\le1$。
    两法一致，最大值为 1，选 B。
  key_steps:
    - step_id: step_1
      statement: 把不等式对齐到指数切线模板。
      formula_trace:
        from: $ae^x\ge2x+b$
        to: $e^{x+\ln a-\ln2}\ge x+\frac b2$
        operation: 两边除以 2，并把 $\frac{ae^x}{2}$ 写成 $e^{x+\ln a-\ln2}$。
        why: 把右侧一次项斜率统一成 1，便于直接使用 $e^u\ge u+1$。
      source_ref: page_0172
    - step_id: step_2
      statement: 用 $e^u\ge u+1$ 给出 $b$ 的上界。
      formula_trace:
        from: $e^{x+\ln a-\ln2}\ge x+\ln a-\ln2+1$
        to: $b\le2\ln\frac a2+2$
        operation: 由 $x+\ln a-\ln2+1\ge x+\frac b2$ 比较常数项。
        why: 要让不等式对任意 $x$ 恒成立，直线常数项不能超过切线常数项。
      source_ref: page_0172
    - step_id: step_3
      statement: 把 $\frac ba$ 化成单变量函数并求最大值。
      formula_trace:
        from: $\frac ba\le2\cdot\frac{\ln(a/2)+1}{a}$
        to: $\frac ba\le e\cdot\frac{\ln\frac{ea}{2}}{\frac{ea}{2}}\le1$
        operation: 设 $y=\frac{ea}{2}>0$，写成标准型 $\frac{\ln y}{y}$。
        why: $\frac{\ln y}{y}\le\frac1e$，可直接得到 $\frac ba$ 的统一上界。
      source_ref: page_0172
    - step_id: step_4
      statement: 给出取等参数与选项。
      formula_trace:
        from: $\frac{\ln y}{y}\le\frac1e$
        to: $\frac ba\le1$，且 $a=b=2$ 时取等
        operation: 等号在 $y=e$ 处取到，即 $\frac{ea}{2}=e\Rightarrow a=2$，再由上界式得 $b=2$。
        why: 不仅要算出最大值，还要验证可达。
      source_ref: page_0172
    - step_id: step_5
      statement: 续页法二用零点比大小复核结论。
      formula_trace:
        from: $ae^x\ge2x+b$
        to: $at-b\ge2\ln t,\ t=e^x>0,\ \frac ba=t_1\le t_2=1$
        operation: 换元后比较直线与对数曲线零点位置。
        why: 直线始终在曲线上方时，其横截距不能右移到对数函数零点右侧。
      source_ref: page_0173
teaching_card:
  student_title: 用指数切线和零点比较求 $\frac ba$ 最大值
  what_it_trains: 训练“指数函数恒压直线”题的双路线：切线放缩求最值 + 零点比大小复核。
  recognition_cues:
    - 已知 $ae^x\ge2x+b$ 对全体实数恒成立。
    - 目标是比值参数 $\frac ba$，不是单独求 $a,b$。
    - 出现斜率 2，通常先除以 2 对齐 $e^u\ge u+1$。
  normalization_moves:
    - 先把 $\frac{ae^x}{2}$ 改写成指数同构形。
    - 从切线常数项读出 $b$ 的上界。
    - 把 $\frac ba$ 配成 $\frac{\ln y}{y}$ 的标准最值型。
    - 换元 $t=e^x$ 后用零点位置判断方向。
  common_failures:
    - 不讨论 $a$ 的符号就直接写 $\ln a$。
    - 把“切线取等给上界”误当成任意 $b$ 都可取等。
    - 算出 $b\le2\ln\frac a2+2$ 后忘记再对 $a$ 做统一最值。
    - 零点比较时把“左侧/右侧”不等号方向写反。
  similar_practice_query: ae^x 恒成立 压直线 b/a 最大值 切线找点 零点比大小
