stem: |-
  (吉林省长春市五校 2024 学年高三上学期联合模拟考试 T11) 已知 $f(x)=(x+1)\ln x$，$g(x)=x(\mathrm{e}^x+1)$，则下列结论正确的是 (  )
  A. 函数 $f(x)=(x+1)\ln x$，在 $(0, +\infty)$ 上存在唯一极值点
  B. 任意 $x \in (0, +\infty)$，有 $f(x)<g(x)$ 恒成立
  C. 若对任意 $x \in (0, +\infty)$，不等式 $g(x^2+ax+a) \leqslant g(2\mathrm{e}^x)$ 恒成立，则实数 $a$ 的最大值为 2
  D. 若 $f(x_1)=g(x_2)=t$，$(t>0)$，则 $\frac{\ln t}{2x_2(x_1+1)}$ 的最大值为 $\frac{1}{2\mathrm{e}}$
answer: |-
  BCD

  A 中 $f'(x)=\ln x+1+1/x>0$，所以没有极值点。B 中 $f(x)=g(\ln x)$，且 $g$ 在实数域严格递增、$\ln x<x$，故 $f(x)<g(x)$。 C 中由 $g$ 的单调性把不等式化成 $x^2+ax+a\le2e^x$；令 $x\to0^+$ 得 $a\le2$，而 $a=2$ 时 $x^2+2x+2\le2e^x$。D 按题干变量重推：由 $f(x_1)=g(x_2)$ 和 $f(x)=g(\ln x)$ 得 $x_2=\ln x_1$，于是 $t=x_2(x_1+1)$，目标式为 $\ln t/(2t)\le1/(2e)$。
