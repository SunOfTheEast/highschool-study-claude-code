stem: |-
  （2025 · 临潭二中考前模拟 T8）已知函数 $f(x)=e^x+x^2+x+1$ 与 $g(x)=2x-3$，$P$、$Q$ 分别是函数 $f(x)$、$g(x)$ 图象上的动点，则 $|PQ|$ 的最小值为（  ）
  A. $\frac{\sqrt{5}}{5}$
  B. $\sqrt{5}$
  C. $\frac{2\sqrt{5}}{5}$
  D. $2\sqrt{5}$
answer: |-
  B

  把两图象上动点距离最小转成“曲线 $f(x)$ 在点 $P$ 处切线与直线 $g(x)=2x-3$ 平行”。由 $g$ 的斜率为 2，令 $f^{\prime}(x)=e^x+2x+1=2$，得 $x=0$，切点为 $P(0,2)$。 再把直线写成 $2x-y-3=0$，由点到直线距离公式得 $|PQ|_{\min}=|2\cdot0-2-3|/\sqrt{2^2+(-1)^2}=\sqrt5$，故选 B。
