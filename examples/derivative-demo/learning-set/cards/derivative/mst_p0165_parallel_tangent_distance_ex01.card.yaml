solution:
  source_solution_summary: 把两图象上动点距离最小转成“曲线 $f(x)$ 在点 $P$ 处切线与直线 $g(x)=2x-3$ 平行”。由 $g$ 的斜率为 2，令 $f^{\prime}(x)=e^x+2x+1=2$，得 $x=0$，切点为 $P(0,2)$。 再把直线写成 $2x-y-3=0$，由点到直线距离公式得 $|PQ|_{\min}=|2\cdot0-2-3|/\sqrt{2^2+(-1)^2}=\sqrt5$，故选 B。
  key_steps:
    - step_id: step_1
      statement: 把最短距离条件改写为平行切线条件。
      formula_trace:
        from: $g(x)=2x-3$ 的斜率为 $2$
        to: $f^{\prime}(x)=e^x+2x+1=2$
        operation: 令曲线切线斜率等于目标直线斜率。
        why: 曲线到直线的最短距离出现在与该直线平行的支撑切线处。
      source_ref: page_0165:line 32
    - step_id: step_2
      statement: 解出切点并定位最短距离对应点。
      formula_trace:
        from: $e^x+2x+1=2$
        to: $x=0,\ P(0,2)$
        operation: 解斜率方程并代回 $f(x)=e^x+x^2+x+1$。
        why: 距离公式需要具体点坐标。
      source_ref: page_0165:line 32
    - step_id: step_3
      statement: 套点到直线距离公式求最小值。
      formula_trace:
        from: $P(0,2),\ y=2x-3\Leftrightarrow 2x-y-3=0$
        to: $|PQ|_{\min}=\frac{|2\cdot0-2-3|}{\sqrt{4+1}}=\sqrt5$
        operation: 将切点坐标代入点到直线距离公式。
        why: 该切点对应全局最短距离。
      source_ref: page_0165:line 32
teaching_card:
  student_title: 平行切线法求两图象最短距离
  what_it_trains: 训练把“曲线点到直线（或到另一图象）的最短距离”先转成切线斜率条件，再用点线距离公式一把收尾。
  recognition_cues:
    - 题目问两图象上动点之间的最小距离。
    - 其中一条对象是斜率固定的直线。
    - 解析入口是“切线平行于给定直线”。
  normalization_moves:
    - 先读出目标直线斜率。
    - 令 $f^{\prime}(x)=k$ 求切点。
    - 把直线写成 $Ax+By+C=0$。
    - 代入点到直线距离公式。
  common_failures:
    - 直接在两条图象上设双参数硬算 $|PQ|$。
    - 求出切点后忘了回到距离公式。
    - 把 $2x-y-3=0$ 误写成 $2x+y-3=0$。
  similar_practice_query: e^x+x^2+x+1 与 2x-3 最短距离 平行切线 点到直线距离
