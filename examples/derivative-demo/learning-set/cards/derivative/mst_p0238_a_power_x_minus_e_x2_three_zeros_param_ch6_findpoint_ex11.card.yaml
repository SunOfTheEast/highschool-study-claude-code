stem: |-
  （2024 · 天津八校考前模拟 T20）已知函数 $f(x)=a^x-ex^2$，$a>0$ 且 $a\neq1$。
  1. 当 $a=e$ 时，求曲线 $y=f(x)$ 在 $x=1$ 处的切线方程。
  2. 若 $a>1$，且 $f(x)$ 存在三个零点 $x_1,x_2,x_3$，求实数 $a$ 的取值范围。
answer: |-
  第 (1) 问：$ex-e+y=0$；第 (2)(i) 问：$1<a<e^{2/\sqrt e}$。

  第 (1) 问当 $a=e$ 时，$f(x)=e^x-ex^2$，$f(1)=0$， $f'(1)=-e$，切线为 $ex-e+y=0$。第 (2)(i) 问在 $a>1$ 下， $a^x-ex^2=0$。因 $x=0$ 不是零点，取对数后分成 $x>0$ 时 $x\ln a-2\ln x-1=0$，$x<0$ 时 $x\ln a-2\ln(-x)-1=0$。负半轴方程单调递增，且在 $-1$ 与 $-1/\sqrt{ae}$ 之间有一个根。正半轴令 $h(x)=x\ln a-2\ln x-1$，其极小值点为 $2/\ln a$， $h_{\min}=1-2\ln(2/\ln a)$。要有两个正根，需要 $h_{\min}<0$，即 $1<a<e^{2/\sqrt e}$。在此范围内，用 $x=1/(e\sqrt a)$ 在极小值左侧取正值，用 $x=16/(e\ln^2a)$ 在极小值右侧取正值，配合极小值为负夹出两个 正根。因此一负二正共三个零点，参数范围为 $1<a<e^{2/\sqrt e}$。
