original_problem:
  stem: （2024 · 天津八校考前模拟 T20）已知函数 $f(x)=a^x-ex^2$，$a>0$ 且 $a\neq1$。
  parts: *a1
  choices: []
  answer: 第 (1) 问：$ex-e+y=0$；第 (2)(i) 问：$1<a<e^{2/\sqrt e}$。
  fidelity_notes:
    - 本页只给出第 (2) 问的 (i) 小问。
    - 函数定义域为 $\mathbf R$，但零点方程取对数后要分 $x>0$ 与 $x<0$。
solution:
  source_solution_summary: 第 (1) 问当 $a=e$ 时，$f(x)=e^x-ex^2$，$f(1)=0$， $f'(1)=-e$，切线为 $ex-e+y=0$。第 (2)(i) 问在 $a>1$ 下， $a^x-ex^2=0$。因 $x=0$ 不是零点，取对数后分成 $x>0$ 时 $x\ln a-2\ln x-1=0$，$x<0$ 时 $x\ln a-2\ln(-x)-1=0$。负半轴方程单调递增，且在 $-1$ 与 $-1/\sqrt{ae}$ 之间有一个根。正半轴令 $h(x)=x\ln a-2\ln x-1$，其极小值点为 $2/\ln a$， $h_{\min}=1-2\ln(2/\ln a)$。要有两个正根，需要 $h_{\min}<0$，即 $1<a<e^{2/\sqrt e}$。在此范围内，用 $x=1/(e\sqrt a)$ 在极小值左侧取正值，用 $x=16/(e\ln^2a)$ 在极小值右侧取正值，配合极小值为负夹出两个 正根。因此一负二正共三个零点，参数范围为 $1<a<e^{2/\sqrt e}$。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问代入 $a=e$ 写切线。
      formula_trace:
        from: $f(x)=e^x-ex^2$
        to: $f(1)=0,\ f^\prime(1)=-e$
        operation: 求导并代入 $x=1$。
        why: 切线方程为 $y=-e(x-1)$，即 $ex-e+y=0$。
      source_ref: page_0238_ex11_solution_start
    - step_id: step_2
      statement: 三零点方程要先按正负半轴拆开。
      formula_trace:
        from: $a^x-ex^2=0$
        to: $x\ln a-2\ln|x|-1=0$，且 $x\neq0$
        operation: 取对数并处理 $x^2$。
        why: $\ln x$ 只适用于正半轴，负半轴要写 $\ln(-x)$。
      source_ref: page_0238_ex11_solution_start
    - step_id: step_3
      statement: 负半轴总能夹出一个根。
      formula_trace:
        from: $y=x\ln a-2\ln(-x)-1$
        to: $y(-1)<0$，$y(-1/\sqrt{ae})>0$
        operation: 利用负半轴单调递增并代显点。
        why: 这给三零点中的一个负根。
      source_ref: page_0238_ex11_solution_start
    - step_id: step_4
      statement: 正半轴用单谷函数判断是否有两个根。
      formula_trace:
        from: $h(x)=x\ln a-2\ln x-1$
        to: $h^\prime(x)=\ln a-\frac2x$，极小值点 $x=\frac2{\ln a}$
        operation: 求导判号。
        why: 一降一升的正半轴函数最多两个正根。
      source_ref: page_0238_ex11_solution_start
    - step_id: step_5
      statement: 三零点的参数核心来自 $h_{\min}<0$。
      formula_trace:
        from: $h(\frac2{\ln a})=1-2\ln\frac2{\ln a}<0$
        to: $1<a<e^{2/\sqrt e}$
        operation: 解对数不等式。
        why: 负根已经存在，正半轴必须再有两个根。
      source_ref: page_0238_ex11_solution_start
    - step_id: step_6
      statement: 极小值左侧用缩小界限找正值点。
      formula_trace:
        from: $x<\frac12$
        to: $h(x)>-2\ln x-2-\frac12\ln a$，取 $x=\frac1{e\sqrt a}$
        operation: 用粗界把 $h(x)$ 下界化成可解式。
        why: 在极小值左侧找一个正值点，夹出第一个正根。
      source_ref: page_0238_ex11_solution_start
    - step_id: step_7
      statement: 极小值右侧用等效取点找正值点。
      formula_trace:
        from: $h(x)=x\ln a-2\ln x-1$
        to: $h(x)>\sqrt{x}(\sqrt{x}\ln a-\frac4{\sqrt e})$
        operation: 把右侧增长项改写成 $\sqrt{x}$ 尺度并用界。
        why: 右侧要证明函数能重新变正。
      source_ref: page_0238_ex11_solution_start
    - step_id: step_8
      statement: 取 $x=16/(e\ln^2a)$ 夹出第二个正根。
      formula_trace:
        from: $\sqrt{x}\ln a-\frac4{\sqrt e}=0$
        to: $x=\frac{16}{e\ln^2a}$，$x_3\in(\frac2{\ln a},\frac{16}{e\ln^2a})$
        operation: 解右侧取点方程。
        why: 配合极小值为负，正半轴右侧出现第二个根。
      source_ref: page_0238_ex11_solution_start
    - step_id: step_9
      statement: 合并负根和两个正根。
      formula_trace:
        from: 一负根 + 两正根
        to: $f(x)$ 有三个零点，$1<a<e^{2/\sqrt e}$
        operation: 汇总正负半轴根数。
        why: 三零点不是都在正半轴，负半轴根必须单独计入。
      source_ref: page_0239_ex11_continuation
teaching_card:
  student_title: $a^x-ex^2$ 三零点：先拆正负半轴，再让正半轴一谷两根
  what_it_trains: 训练指数和二次幂的三零点求参：负半轴先拿一个根，正半轴再用极小值和取点拿两个根。
  recognition_cues:
    - $x^2$ 允许负根，取对数时必须拆 $x>0$ 和 $x<0$。
    - $x>0$ 分支变成 $x\ln a-2\ln x-1$，是单谷函数。
    - 题目要三个零点，常是一负二正。
  normalization_moves:
    - 第 (1) 问先写切线。
    - 第 (2) 问把 $a^x=ex^2$ 取对数。
    - 负半轴用单调性和显点夹根。
    - 正半轴用 $h_{\min}<0$ 求参数范围。
    - 用 $1/(e\sqrt a)$ 和 $16/(e\ln^2a)$ 补充分性。
  common_failures:
    - 直接写 $\ln x$，把负根丢掉。
    - 把 $e^{2/\sqrt e}$ 误写成 $e^{2/e}$。
    - 只由极小值小于 0 得必要条件，没证明两侧正根存在。
  similar_practice_query: a^x-ex^2 三零点 正负半轴 xln a-2lnx e^(2/sqrt e) 16/(e ln^2 a)
