original_problem:
  stem: （2025 · 广东汕头 · 三模）已知函数 $f(x)=ax^2+(a-2)x-\ln x$。
  parts: *a1
  choices: []
  answer: 第(1)问 $f$ 在 $(0,1)$ 上递减，在 $(1,+\infty)$ 上递增；第(2)(i) $a\in(0,1)$；第(2)(ii) $x_0f^\prime(x_0)>-2$。
  fidelity_notes:
    - 无选项。
    - 题中 $f^\prime$ 是 $f$ 的导函数；第(2)(ii) 的 $x_0$ 是较小零点，不是极值点。
solution:
  source_solution_summary: 第(1)问当 $a=1$ 时， $f^\prime(x)=2x-1-\frac1x=\frac{(x-1)(2x+1)}x$， 因 $x>0$，导数符号由 $x-1$ 决定，故 $f$ 在 $(0,1)$ 上递减、 在 $(1,+\infty)$ 上递增。第(2)(i) 中 $f^\prime(x)=2ax+(a-2)-\frac1x=\frac{(ax-1)(2x+1)}x$。 若 $a\le0$，$f$ 至多一个零点；若 $a>0$，$f$ 在 $x=\frac1a$ 处取最小值，且 $f(\frac1a)=1-\frac1a+\ln a$。因 $x\to0^+$ 和 $x\to+\infty$ 时 $f(x)\to+\infty$，有两个零点等价于 $f(\frac1a)<0$。令 $g(a)=\ln a-\frac1a+1$，则 $g$ 在 $(0,+\infty)$ 上递增，$g(1)=0$，故 $a\in(0,1)$。第(2)(ii) 中， 由 $f(1)=2a-2<0$ 得较小零点 $0<x_0<1$。目标等价于 $(2x_0+1)(ax_0-1)>-2$。若 $0<x_0\le\frac12$，左侧展开后直接成立。 若 $\frac12<x_0<1$，由 $f(x_0)=0$ 得 $ax_0(x_0+1)=\ln x_0+2x_0$，代入目标后化为 $\ln x_0+x_0+\frac1{2x_0+1}>0$。设 $p(x)=\ln x+x+\frac1{2x+1}$，在 $(\frac12,1)$ 上 $p^\prime(x)>0$，故 $p(x)>p(\frac12)=1-\ln2>0$，得证。
  key_steps:
    - step_id: step_1
      statement: 第(1)问求导并因式分解。
      formula_trace:
        from: $f(x)=x^2-x-\ln x$
        to: $f^\prime(x)=\frac{(x-1)(2x+1)}x$
        operation: 代入 $a=1$ 后求导。
        why: 在 $x>0$ 上导数符号由 $x-1$ 决定。
      source_ref: page_0302_ex04_solution_start
    - step_id: step_2
      statement: 第(2)(i) 用导数形态判断能否有两个零点。
      formula_trace:
        from: $f^\prime(x)=2ax+(a-2)-\frac1x$
        to: $f^\prime(x)=\frac{(ax-1)(2x+1)}x$
        operation: 因式分解导函数。
        why: 当 $a>0$ 时唯一极小点为 $x=\frac1a$。
      source_ref: page_0302_ex04_solution_start
    - step_id: step_3
      statement: 把两个零点条件化成最小值为负。
      formula_trace:
        from: $x\to0^+,\ f(x)\to+\infty;\quad x\to+\infty,\ f(x)\to+\infty$
        to: $f(\frac1a)<0$
        operation: 利用单谷函数形态。
        why: 两端为正且中间最低点为负，才有两个零点。
      source_ref: page_0303_ex04_solution_end
    - step_id: step_4
      statement: 求出参数范围。
      formula_trace:
        from: $f(\frac1a)=1-\frac1a+\ln a<0$
        to: $a\in(0,1)$
        operation: 令 $g(a)=\ln a-\frac1a+1$，用单调性解不等式。
        why: 这是第(2)(ii) 中 $0<x_0<1$ 的基础。
      source_ref: page_0303_ex04_solution_end
    - step_id: step_5
      statement: 定位较小零点。
      formula_trace:
        from: $a\in(0,1),\quad f(1)=2a-2<0$
        to: $0<x_0<1$
        operation: 结合 $f(x)\to+\infty$ 当 $x\to0^+$ 与较小零点定义。
        why: 证明要按 $x_0$ 在 $(0,1)$ 内分段。
      source_ref: page_0303_ex04_solution_end
    - step_id: step_6
      statement: 把目标不等式改写。
      formula_trace:
        from: $x_0f^\prime(x_0)>-2$
        to: $ax_0(2x_0+1)>2x_0-1$
        operation: 代入 $f^\prime(x)=\frac{(ax-1)(2x+1)}x$。
        why: 这样可以按 $2x_0-1$ 的符号分段。
      source_ref: page_0303_ex04_solution_end
    - step_id: step_7
      statement: 处理 $0<x_0\le\frac12$。
      formula_trace:
        from: $ax_0(2x_0+1)>0,\quad 2x_0-1\le0$
        to: $x_0f^\prime(x_0)>-2$
        operation: 直接比较左右符号。
        why: 这一段不需要消参。
      source_ref: page_0303_ex04_solution_end
    - step_id: step_8
      statement: 处理 $\frac12<x_0<1$，用零点方程消参。
      formula_trace:
        from: $f(x_0)=0$
        to: $ax_0(x_0+1)=\ln x_0+2x_0$
        operation: 把参数项移到一侧。
        why: 用较小零点条件把 $a$ 消掉。
      source_ref: page_0303_ex04_solution_end
    - step_id: step_9
      statement: 把剩余问题化成单变量正性。
      formula_trace:
        from: $ax_0(2x_0+1)>2x_0-1$
        to: $\ln x_0+x_0+\frac1{2x_0+1}>0$
        operation: 代入 $ax_0(x_0+1)=\ln x_0+2x_0$ 并化简。
        why: 得到只含 $x_0$ 的对数不等式。
      source_ref: page_0303_ex04_solution_end
    - step_id: step_10
      statement: 用 $p$ 函数完成证明。
      formula_trace:
        from: $p(x)=\ln x+x+\frac1{2x+1}$
        to: $p(x)>p(\frac12)=1-\ln2>0$
        operation: 证明 $p^\prime(x)>0$ 在 $(\frac12,1)$ 上成立。
        why: 从而第(2)(ii) 的不等式成立。
      source_ref: page_0303_ex04_solution_end
teaching_card:
  student_title: 较小零点消参证明导数不等式
  what_it_trains: 训练先由两个零点确定参数范围，再用较小零点方程消参证明含导数的不等式。
  recognition_cues:
    - 题目先问两个零点下的参数范围，再问较小零点处的导数表达式。
    - $f^\prime(x)$ 可以因式分解成 $\frac{(ax-1)(2x+1)}x$。
    - $x_0$ 是零点，所以 $f(x_0)=0$ 比 $f^\prime(x_0)=0$ 更关键。
    - 目标里出现 $2x_0-1$，自然按 $x_0=\frac12$ 分段。
  normalization_moves:
    - 第(1)问是基础单调性，不压过第(2)问主线。
    - 第(2)(i) 先求 $a\in(0,1)$，用于定位 $x_0$。
    - 第(2)(ii) 不要把 $x_0$ 当极值点。
    - 用 $f(x_0)=0$ 把 $a$ 换成 $x_0$ 的表达式。
  common_failures:
    - 把 $x_0$ 误认为极值点，错误使用 $f^\prime(x_0)=0$。
    - 漏掉 $x\to0^+$ 时 $f(x)\to+\infty$。
    - 求 $a$ 范围时把 $g(a)$ 单调方向看反。
    - 在 $\frac12<x_0<1$ 时没有用零点方程消参。
  similar_practice_query: ax^2+(a-2)x-lnx 两个零点 较小零点 x0 fprime x0 隐零点消参
