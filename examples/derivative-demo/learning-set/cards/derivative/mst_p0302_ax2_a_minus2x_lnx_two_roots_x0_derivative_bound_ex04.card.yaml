stem: |-
  （2025 · 广东汕头 · 三模）已知函数 $f(x)=ax^2+(a-2)x-\ln x$。
  1. 当 $a=1$ 时，讨论 $f(x)$ 的单调性。
  2. 若 $f(x)$ 有两个零点，求实数 $a$ 的取值范围。
  3. 记 $f(x)$ 较小的一个零点为 $x_0$，证明：$x_0f^\prime(x_0)>-2$。
answer: |-
  第(1)问 $f$ 在 $(0,1)$ 上递减，在 $(1,+\infty)$ 上递增；第(2)(i) $a\in(0,1)$；第(2)(ii) $x_0f^\prime(x_0)>-2$。

  第(1)问当 $a=1$ 时， $f^\prime(x)=2x-1-\frac1x=\frac{(x-1)(2x+1)}x$， 因 $x>0$，导数符号由 $x-1$ 决定，故 $f$ 在 $(0,1)$ 上递减、 在 $(1,+\infty)$ 上递增。第(2)(i) 中 $f^\prime(x)=2ax+(a-2)-\frac1x=\frac{(ax-1)(2x+1)}x$。 若 $a\le0$，$f$ 至多一个零点；若 $a>0$，$f$ 在 $x=\frac1a$ 处取最小值，且 $f(\frac1a)=1-\frac1a+\ln a$。因 $x\to0^+$ 和 $x\to+\infty$ 时 $f(x)\to+\infty$，有两个零点等价于 $f(\frac1a)<0$。令 $g(a)=\ln a-\frac1a+1$，则 $g$ 在 $(0,+\infty)$ 上递增，$g(1)=0$，故 $a\in(0,1)$。第(2)(ii) 中， 由 $f(1)=2a-2<0$ 得较小零点 $0<x_0<1$。目标等价于 $(2x_0+1)(ax_0-1)>-2$。若 $0<x_0\le\frac12$，左侧展开后直接成立。 若 $\frac12<x_0<1$，由 $f(x_0)=0$ 得 $ax_0(x_0+1)=\ln x_0+2x_0$，代入目标后化为 $\ln x_0+x_0+\frac1{2x_0+1}>0$。设 $p(x)=\ln x+x+\frac1{2x+1}$，在 $(\frac12,1)$ 上 $p^\prime(x)>0$，故 $p(x)>p(\frac12)=1-\ln2>0$，得证。
