original_problem:
  stem: 求证：$e^x+\ln x>\cos x+\frac{\sin x-1}{x}$。
  parts: *a1
  choices: []
  answer: 当 $x>0$ 时，不等式成立。
  fidelity_notes:
    - 定义域由 $\ln x$ 与 $\frac1x$ 共同决定为 $x>0$。
    - source 仅给出思路拆项，本卡按该拆项补全标准放缩链。
solution:
  source_solution_summary: 由题设目标等价于 $e^x+\ln x-\cos x-\frac{\sin x-1}{x}>0$。 按 source 拆项： $e^x+\ln x-\cos x-\frac{\sin x-1}{x} =(e^x-x-1)+(1-\cos x)+(\ln x+\frac1x-1)+(1-\frac{\sin x}{x})$。 对 $x>0$，有 $e^x-x-1>0$， $1-\cos x\ge0$， $\ln x+\frac1x-1\ge0$（等价于 $\ln x\ge1-\frac1x$）， $1-\frac{\sin x}{x}\ge0$（由 $\sin x\le x$）。 四块相加得到严格正值，因此原不等式成立。
  key_steps:
    - step_id: step_1
      statement: 先把目标改写成“左减右大于 0”。
      formula_trace:
        from: $e^x+\ln x>\cos x+\frac{\sin x-1}{x}$
        to: $e^x+\ln x-\cos x-\frac{\sin x-1}{x}>0$
        operation: 移项同侧化。
        why: 便于做分块放缩。
      source_ref: page_0206_ex06_solution_hint
    - step_id: step_2
      statement: 按 source 给出的思路拆为四块。
      formula_trace:
        from: $e^x+\ln x-\cos x-\frac{\sin x-1}{x}$
        to: $(e^x-x-1)+(1-\cos x)+(\ln x+\frac1x-1)+(1-\frac{\sin x}{x})$
        operation: 加减 $x,1,\frac1x$ 并重组。
        why: 把混合表达式拆成可直接判号的标准块。
      source_ref: page_0206_ex06_solution_hint
    - step_id: step_3
      statement: 指数块与余弦块判号。
      formula_trace:
        from: $e^x-x-1,\ 1-\cos x$
        to: $e^x-x-1>0,\ 1-\cos x\ge0$
        operation: 用 $e^x>1+x\ (x>0)$ 与 $\cos x\le1$。
        why: 两块已可确定非负，且第一块严格正。
      source_ref: page_0206_ex06_solution_hint
    - step_id: step_4
      statement: 对数块与正弦比值块判号。
      formula_trace:
        from: $\ln x+\frac1x-1,\ 1-\frac{\sin x}{x}$
        to: $\ln x+\frac1x-1\ge0,\ 1-\frac{\sin x}{x}\ge0$
        operation: 分别用 $\ln x\ge1-\frac1x$ 与 $\sin x\le x\ (x>0)$。
        why: 补齐其余两块非负性。
      source_ref: page_0206_ex06_solution_hint
    - step_id: step_5
      statement: 四块并联求和得到严格不等式。
      formula_trace:
        from: step_3 与 step_4
        to: $e^x+\ln x-\cos x-\frac{\sin x-1}{x}>0$
        operation: 非负项求和，且含严格正项 $e^x-x-1$。
        why: 回代即原命题成立。
      source_ref: page_0206_ex06_solution_hint
