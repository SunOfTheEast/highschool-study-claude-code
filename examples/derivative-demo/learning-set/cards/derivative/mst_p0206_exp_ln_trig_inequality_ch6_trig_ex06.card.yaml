stem: 求证：$e^x+\ln x>\cos x+\frac{\sin x-1}{x}$。
answer: |-
  当 $x>0$ 时，不等式成立。

  由题设目标等价于 $e^x+\ln x-\cos x-\frac{\sin x-1}{x}>0$。 按 source 拆项： $e^x+\ln x-\cos x-\frac{\sin x-1}{x} =(e^x-x-1)+(1-\cos x)+(\ln x+\frac1x-1)+(1-\frac{\sin x}{x})$。 对 $x>0$，有 $e^x-x-1>0$， $1-\cos x\ge0$， $\ln x+\frac1x-1\ge0$（等价于 $\ln x\ge1-\frac1x$）， $1-\frac{\sin x}{x}\ge0$（由 $\sin x\le x$）。 四块相加得到严格正值，因此原不等式成立。
