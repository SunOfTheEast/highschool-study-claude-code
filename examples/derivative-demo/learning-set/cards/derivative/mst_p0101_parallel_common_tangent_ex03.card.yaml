solution:
  source_solution_summary: |
    设两条曲线的切点横坐标分别为 $x_1,x_2$。由导数几何意义，
    $k=\frac1{x_1}=\frac1{x_2+1}$，所以 $x_1=x_2+1$。切点在直线上，
    有 $kx_1+b=\ln x_1+2$ 与 $kx_2+b=\ln(x_2+1)$。两式相减并利用
    $x_1=x_2+1$，得到 $k(x_1-x_2)=2$，即 $k=2$。于是
    $x_1=\frac12$，代回 $kx_1+b=\ln x_1+2$，得
    $b=\ln\frac12+2-1=1-\ln2$。也可直接看平移：$y=\ln(x+1)$ 可看成
    $y=\ln x+2$ 向左 $1$、向下 $2$ 后得到的平行曲线，公切线斜率为 $2$。
  key_steps:
    - step_id: step_1
      statement: 设两条对数曲线的切点横坐标。
      formula_trace:
        from: |
          $y=\ln x+2$ 的切点 $x_1$，$y=\ln(x+1)$ 的切点 $x_2$
        to: |
          $k=\frac1{x_1}=\frac1{x_2+1},\qquad x_1=x_2+1$
        operation: 用导数的几何意义让两处切线斜率相等。
        why: 同一条公切线在两个切点处斜率相同。
      source_ref: page_0101
    - step_id: step_2
      statement: 把两个切点都代入同一直线。
      formula_trace:
        from: |
          $y=kx+b$ 经过 $(x_1,\ln x_1+2)$ 和 $(x_2,\ln(x_2+1))$
        to: |
          $\begin{cases}
          kx_1+b=\ln x_1+2\\
          kx_2+b=\ln(x_2+1)
          \end{cases}$
        operation: 用切点在切线上的条件列方程组。
        why: 仅有斜率相等还不能确定截距 $b$。
      source_ref: page_0101
    - step_id: step_3
      statement: 利用平移关系求出斜率。
      formula_trace:
        from: |
          $x_1=x_2+1,\qquad kx_1+b=\ln x_1+2,\qquad kx_2+b=\ln(x_2+1)$
        to: |
          $k(x_1-x_2)=2,\qquad k=2$
        operation: 两式相减，因 $\ln x_1=\ln(x_2+1)$，对数项抵消。
        why: 两曲线相差一个水平位移和竖直位移，公切线斜率由位移比确定。
      source_ref: page_0101
    - step_id: step_4
      statement: 代回第一条曲线切点求截距。
      formula_trace:
        from: |
          $k=2,\qquad k=\frac1{x_1}$
        to: |
          $x_1=\frac12,\qquad b=\ln\frac12+2-2\cdot\frac12=1-\ln2$
        operation: 由斜率求切点，再代入 $kx_1+b=\ln x_1+2$。
        why: 求 $b$ 需要使用切点坐标而不是只知道斜率。
      source_ref: page_0101
teaching_card:
  student_title: 平移曲线的公切线斜率先出来
  what_it_trains: 训练识别两条同形平移曲线，先由平移量确定公切线斜率，再用切点求截距。
  recognition_cues:
    - 两条曲线都是对数函数，只差水平平移和竖直平移。
    - 同一条直线同时相切，说明两个切点处导数相等。
    - 题目只问 $b$，斜率定出后还要回代切点。
  normalization_moves:
    - 设切点 $x_1,x_2$，由导数得 $x_1=x_2+1$。
    - 把两个切点代入 $y=kx+b$ 并相减，得到 $k=2$。
    - 由 $x_1=\frac12$ 求 $b=1-\ln2$。
  common_failures:
    - 只使用 $k=\frac{b}{a}$ 的形式，却没有说明本题平移量如何对应。
    - 得到 $k=2$ 后误把 $b$ 也当成 $2$。
    - 代入 $x_1=\frac12$ 时把 $\ln\frac12$ 写错。
  similar_practice_query: 平行曲线 公切线 对数函数 平移量 斜率 截距
quality:
  confidence: high
