stem: |-
  已知 $a=2^{-\frac12},\ b=\log_4 20,\ c=\log_3 12$，则（ ）
  A. $b<c<a$
  B. $a<c<b$
  C. $b<a<c$
  D. $a<b<c$
answer: |
  D

  先看 $a,b$：
  \[
  a=2^{-1/2}=\frac1{\sqrt2}<1,\qquad
  b=\frac{\ln20}{\ln4}>1,
  \]
  所以 $a<b$。
  再拆分
  \[
  b=1+\frac{\ln5}{\ln4},\qquad
  c=1+\frac{\ln4}{\ln3}.
  \]
  只需比较
  \[
  \frac{\ln5}{\ln4}\ \text{与}\ \frac{\ln4}{\ln3}.
  \]
  由糖水不等式
  \[
  \frac{\ln4}{\ln3}
  >
  \frac{\ln4+\ln\frac43}{\ln3+\ln\frac43}
  =
  \frac{\ln(16/3)}{\ln4}
  >
  \frac{\ln5}{\ln4},
  \]
  得 $b<c$。综合为 $a<b<c$，选 D。
