solution:
  source_solution_summary: |
    先看 $a,b$：
    \[
    a=2^{-1/2}=\frac1{\sqrt2}<1,\qquad
    b=\frac{\ln20}{\ln4}>1,
    \]
    所以 $a<b$。
    再拆分
    \[
    b=1+\frac{\ln5}{\ln4},\qquad
    c=1+\frac{\ln4}{\ln3}.
    \]
    只需比较
    \[
    \frac{\ln5}{\ln4}\ \text{与}\ \frac{\ln4}{\ln3}.
    \]
    由糖水不等式
    \[
    \frac{\ln4}{\ln3}
    >
    \frac{\ln4+\ln\frac43}{\ln3+\ln\frac43}
    =
    \frac{\ln(16/3)}{\ln4}
    >
    \frac{\ln5}{\ln4},
    \]
    得 $b<c$。综合为 $a<b<c$，选 D。
  key_steps:
    - step_id: step_1
      statement: 先用 1 作为参照，确定 $a<b$。
      formula_trace:
        from: $a=2^{-1/2},\ b=\log_4 20$
        to: $a<1<b$
        operation: 把 $a$ 写成倒数根式，把 $b$ 看成正数对数商。
        why: 先锁定最小项。
      source_ref: page_0148_ex17_solution
    - step_id: step_2
      statement: 把 $b,c$ 拆成“1+尾项”。
      formula_trace:
        from: $b=\log_4 20,\ c=\log_3 12$
        to: $b=1+\frac{\ln5}{\ln4},\ c=1+\frac{\ln4}{\ln3}$
        operation: 利用 $20=4\cdot5,\ 12=3\cdot4$。
        why: 比较目标缩成两个对数分式。
      source_ref: page_0148_ex17_solution
    - step_id: step_3
      statement: 糖水不等式给出尾项大小。
      formula_trace:
        from: $\frac{\ln4}{\ln3}$
        to: $\frac{\ln4}{\ln3}>\frac{\ln(16/3)}{\ln4}>\frac{\ln5}{\ln4}$
        operation: 分子分母同加 $\ln\frac43$，并用 $\frac{16}{3}>5$。
        why: 推出 $\frac{\ln4}{\ln3}>\frac{\ln5}{\ln4}$。
      source_ref: page_0148_ex17_solution
    - step_id: step_4
      statement: 回代得到 $b<c$ 并合并全序。
      formula_trace:
        from: $\frac{\ln4}{\ln3}>\frac{\ln5}{\ln4}$ 与 $a<b$
        to: $a<b<c$，选 D
        operation: 把尾项比较加回 1，再传递比较。
        why: 完成三数排序。
      source_ref: page_0148_ex17_solution
