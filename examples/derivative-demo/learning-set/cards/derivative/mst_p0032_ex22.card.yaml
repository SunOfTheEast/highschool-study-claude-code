stem: |-
  （2025 江苏卓越联盟月考 T8）若关于 $x$ 的不等式 $x^2+x\ln a-ae^x\ln x>0$ 对 $\forall x\in(0,1)$ 恒成立，则实数 $a$ 的取值范围为（ ）
  A. $\left(-\infty,\frac{1}{e}\right]$
  B. $\left(0,\frac{1}{e}\right]$
  C. $\left[\frac{1}{e},1\right)$
  D. $\left[\frac{1}{e},+\infty\right)$
answer: |-
  D，即 $a\in\left[\frac{1}{e},+\infty\right)$。

  先把 $x^2+x\ln a$ 合并成 $x\ln(ae^x)$，再除以正量 $xae^x$，转化为 $f(ae^x)>f(x)$，其中 $f(t)=\ln t/t$。由于 $0<x<1$ 时 $f(x)<0$ 且 $f$ 在 $(0,e)$ 上递增，恒成立等价于 $ae^x>x$ 对所有 $x\in(0,1)$ 成立，于是 $a\ge\sup_{0<x<1}x/e^x=1/e$。
