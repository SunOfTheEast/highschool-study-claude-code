solution:
  source_solution_summary: 因两条切线互相垂直，切点必在 $0<x_1<1$ 与 $x_2>1$ 两支上。 由 $k_{AM}=-1/x_1$、$k_{BN}=1/x_2$ 得 $x_1x_2=1$。 于是 $f(x_2)=|\ln(1/x_1)|=f(x_1)$，A 正确；切线截距给出 $|AM|=\sqrt{x_1^2+1}\in(1,\sqrt2)$，B 正确；两切线交点横坐标为 $2/(x_1+x_2)<1$，C 错误；$|AM||BN|=\sqrt{(x_1^2+1)(x_2^2+1)}>2$， D 正确。
  key_steps:
    - step_id: step_1
      statement: 确定切点所在分支并写出切线斜率。
      formula_trace:
        from: $f(x)=|\ln x|$
        to: $k_{AM}=-\frac1{x_1},\quad k_{BN}=\frac1{x_2}$
        operation: 分段求导：$0<x<1$ 时 $f'(x)=-1/x$，$x>1$ 时 $f'(x)=1/x$。
        why: 两条切线垂直要求斜率一正一负，结合 $x_1<x_2$ 可设 $0<x_1<1<x_2$。
      source_ref: page_0076:例3解析开头
    - step_id: step_2
      statement: 由垂直条件得到两个切点横坐标互为倒数。
      formula_trace:
        from: $k_{AM}k_{BN}=-1$
        to: $-\frac1{x_1}\cdot\frac1{x_2}=-1\Rightarrow x_1x_2=1$
        operation: 代入两切线斜率并化简。
        why: 垂直切线的斜率乘积为 $-1$。
      source_ref: page_0076:例3解析
    - step_id: step_3
      statement: 判断 A：互为倒数的两点函数值相等。
      formula_trace:
        from: $x_2=\frac1{x_1}$
        to: $f(x_2)=\left|\ln\frac1{x_1}\right|=|\ln x_1|=f(x_1)$
        operation: 把 $x_2$ 用 $1/x_1$ 替换。
        why: $|\ln x|$ 关于变换 $x\mapsto1/x$ 保持函数值不变。
      source_ref: page_0076:例3解析A
    - step_id: step_4
      statement: 判断 B：用切线与 y 轴交点算出 |AM|。
      formula_trace:
        from: $l_{AM}:y=-\frac1{x_1}x+1-\ln x_1$
        to: $M(0,1-\ln x_1),\quad |AM|=\sqrt{x_1^2+1}\in(1,\sqrt2)$
        operation: 令 $x=0$ 得截距，再用两点距离公式。
        why: $0<x_1<1$，所以 $x_1^2\in(0,1)$。
      source_ref: page_0076:例3解析B
    - step_id: step_5
      statement: 判断 C：联立两切线求交点横坐标。
      formula_trace:
        from: $-\frac1{x_1}x+1-\ln x_1=\frac1{x_2}x+\ln x_2-1$
        to: $x=\frac{2-(\ln x_1+\ln x_2)}{1/x_1+1/x_2}=\frac2{x_1+x_2}<1$
        operation: 联立直线方程，并用 $x_1x_2=1$ 与 AM-GM 化简比较。
        why: $\ln x_1+\ln x_2=0$，且 $x_1+x_2>2\sqrt{x_1x_2}=2$。
      source_ref: page_0076-page_0077:例3解析C
    - step_id: step_6
      statement: 判断 D：用倒数关系求两段长度乘积的下界。
      formula_trace:
        from: $|AM||BN|=\sqrt{(x_1^2+1)(x_2^2+1)}$
        to: $|AM||BN|=\sqrt{x_1^2+x_2^2+2}>\sqrt{2x_1x_2+2}=2$
        operation: 展开并用 $x_1x_2=1$、$x_1\ne x_2$ 比较。
        why: $0<x_1<1<x_2$，两数不相等，所以 $x_1^2+x_2^2>2x_1x_2$；当 $x_1\to1^-$ 时乘积趋近 2，范围为 $(2,+\infty)$。
      source_ref: page_0077:例3解析D
teaching_card:
  student_title: 把垂直切线化成倒数切点
  what_it_trains: 训练学生在 $|\\ln x|$ 的两支图像上用切线斜率建立 $x_1x_2=1$， 再用这个倒数关系统一处理函数值、截距、交点和长度范围。
  recognition_cues:
    - $|\ln x|$ 的两条切线互相垂直。
    - 一个切点在 $(0,1)$，另一个切点在 $(1,+\infty)$。
    - 题目同时问函数值、线段长度、交点横坐标和乘积范围。
  normalization_moves:
    - 先写 $f'(x)=-1/x$ 与 $f'(x)=1/x$ 两段导数。
    - 由斜率乘积 $-1$ 得 $x_1x_2=1$。
    - 把 $\ln x_2$ 改写成 $-\ln x_1$，把 $x_2$ 改写成 $1/x_1$。
    - 比较范围时用 $x_1+x_2>2$ 或 $x_1^2+x_2^2>2$。
  common_failures:
    - 默认两切点都在同一支上，导致斜率乘积为正。
    - 求 $M,N$ 时漏掉切线方程中的常数项。
    - 把 $2/(x_1+x_2)<1$ 误读成恒等于 1。
    - 只证明 $|AM||BN|>2$，没有说明下界 2 可以逼近。
  similar_practice_query: "|ln x| 垂直切线 倒数切点 y轴截距 长度范围 多选"
quality:
  confidence: high
  needs_review: false
  review_notes:
    - page_0076/page_0077 页图与 markdown 一致；未把 page_0076 顶部例 2 续页建卡。
