stem: |-
  （2024 长沙四大名校考前模拟多选 T10）已知函数 $f(x)=|\ln x|$，函数 $f(x)$ 的图象在点 $A(x_1,f(x_1))$ 和点 $B(x_2,f(x_2))$ 处的两条切线互相垂直， 且分别交 $y$ 轴于 $M,N$ 两点，若 $x_1<x_2$，则（  ）
  A. $f(x_1)=f(x_2)$
  B. $|AM|$ 的取值范围是 $(1,\sqrt{2})$
  C. 直线 $AM$ 与 $BN$ 的交点的横坐标恒为 1
  D. $|AM||BN|$ 的取值范围是 $(2,+\infty)$
answer: |-
  ABD

  因两条切线互相垂直，切点必在 $0<x_1<1$ 与 $x_2>1$ 两支上。 由 $k_{AM}=-1/x_1$、$k_{BN}=1/x_2$ 得 $x_1x_2=1$。 于是 $f(x_2)=|\ln(1/x_1)|=f(x_1)$，A 正确；切线截距给出 $|AM|=\sqrt{x_1^2+1}\in(1,\sqrt2)$，B 正确；两切线交点横坐标为 $2/(x_1+x_2)<1$，C 错误；$|AM||BN|=\sqrt{(x_1^2+1)(x_2^2+1)}>2$， D 正确。
