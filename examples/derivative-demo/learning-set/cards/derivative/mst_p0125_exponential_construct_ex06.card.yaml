stem: |-
  （24-25高二下·辽宁鞍山·期中）$f(x)$ 是定义在 $\mathbf{R}$ 上的奇函数。当 $x>0$ 时，$f'(x)-f(x)>x-1$，则下列说法中正确的是（  ）
  A. 令函数 $F(x)=\frac{f(x)-x}{e^x}$，则 $F(x)$ 在 $(0,+\infty)$ 上单调递增
  B. $ef(1)-f(2)<2-e$
  C. $ef(1)-f(2)<e-2$
  D. $ef(-1)+f(2)<e-2$
answer: |
  BC

  对选项 A，设
  \[
  F(x)=\frac{f(x)-x}{e^x},
  \]
  则
  \[
  F'(x)=\frac{f'(x)-f(x)+x-1}{e^x}>\frac{2(x-1)}{e^x}.
  \]
  由于 $0<x<1$ 时右端为负，不能推出 $F'(x)>0$，故 A 错。
  再构造
  \[
  H(x)=\frac{f(x)+x}{e^x},
  \]
  有
  \[
  H'(x)=\frac{f'(x)-f(x)-x+1}{e^x}>0,
  \]
  所以 $H$ 在 $(0,+\infty)$ 递增，故
  \[
  H(1)<H(2)\Rightarrow \frac{f(1)+1}{e}<\frac{f(2)+2}{e^2}\Rightarrow ef(1)-f(2)<2-e.
  \]
  因此 B 对；又 $2-e<e-2$，故 C 也对。
  因 $f$ 为奇函数，$f(1)=-f(-1)$，由 B 得
  \[
  ef(-1)+f(2)>e-2,
  \]
  与 D 相反，故 D 错。答案 BC。
