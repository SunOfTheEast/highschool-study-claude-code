solution:
  source_solution_summary: |
    对选项 A，设
    \[
    F(x)=\frac{f(x)-x}{e^x},
    \]
    则
    \[
    F'(x)=\frac{f'(x)-f(x)+x-1}{e^x}>\frac{2(x-1)}{e^x}.
    \]
    由于 $0<x<1$ 时右端为负，不能推出 $F'(x)>0$，故 A 错。
    再构造
    \[
    H(x)=\frac{f(x)+x}{e^x},
    \]
    有
    \[
    H'(x)=\frac{f'(x)-f(x)-x+1}{e^x}>0,
    \]
    所以 $H$ 在 $(0,+\infty)$ 递增，故
    \[
    H(1)<H(2)\Rightarrow \frac{f(1)+1}{e}<\frac{f(2)+2}{e^2}\Rightarrow ef(1)-f(2)<2-e.
    \]
    因此 B 对；又 $2-e<e-2$，故 C 也对。
    因 $f$ 为奇函数，$f(1)=-f(-1)$，由 B 得
    \[
    ef(-1)+f(2)>e-2,
    \]
    与 D 相反，故 D 错。答案 BC。
  key_steps:
    - step_id: step_1
      statement: 检验 A 的构造不足以判全区间递增。
      formula_trace:
        from: $F(x)=\frac{f(x)-x}{e^x}$
        to: $F'(x)=\frac{f'(x)-f(x)+x-1}{e^x}>\frac{2(x-1)}{e^x}$
        operation: 求导并代入 $f'(x)-f(x)>x-1$。
        why: 下界在 $(0,1)$ 为负，不能推出恒正。
      source_ref: page_0125
    - step_id: step_2
      statement: 改用与题设同向的指数商函数。
      formula_trace:
        from: $f'(x)-f(x)>x-1$
        to: $H(x)=\frac{f(x)+x}{e^x},\ H'(x)=\frac{f'(x)-f(x)-x+1}{e^x}>0$
        operation: 把 $x-1$ 移项后配成导数分子。
        why: 直接得到 $H$ 在 $(0,+\infty)$ 递增。
      source_ref: page_0125
    - step_id: step_3
      statement: 由 $H(1)<H(2)$ 推出 B。
      formula_trace:
        from: $\frac{f(1)+1}{e}<\frac{f(2)+2}{e^2}$
        to: $ef(1)-f(2)<2-e$
        operation: 两边乘 $e^2$ 并移项。
        why: 得到选项 B。
      source_ref: page_0125
    - step_id: step_4
      statement: 比较常数大小得到 C。
      formula_trace:
        from: $ef(1)-f(2)<2-e$
        to: $ef(1)-f(2)<e-2$
        operation: 利用 $2-e<e-2$。
        why: 小于更小值必小于更大值。
      source_ref: page_0125
    - step_id: step_5
      statement: 利用奇函数关系排除 D。
      formula_trace:
        from: $f(1)=-f(-1),\ ef(1)-f(2)<2-e$
        to: $ef(-1)+f(2)>e-2$
        operation: 代换并乘以负一反向。
        why: 与 D 的方向相反。
      source_ref: page_0125
