solution:
  source_solution_summary: |
    由 $f\left(\frac{3}{2}-2x\right)$ 为偶函数，得
    $f\left(\frac{3}{2}-2x\right)=f\left(\frac{3}{2}+2x\right)$，所以
    $f(x)$ 关于直线 $x=\frac{3}{2}$ 对称，即
    $f(x)=f(3-x)$，从而 C 正确。两边求导得
    $g(x)=-g(3-x)$，故 $g$ 关于点 $\left(\frac{3}{2},0\right)$ 对称。
    又 $g(2+x)$ 为偶函数，故 $g(2+x)=g(2-x)$，即
    $g$ 关于直线 $x=2$ 对称。由“一点一轴”可得 $g$ 的周期为
    $4\left|2-\frac{3}{2}\right|=2$，所以
    $g\left(-\frac12\right)=g\left(\frac32\right)=0$，B 正确。
    A、D 不具有必然性（源页法一给出
    $g(x)=\cos(\pi x),\ f(x)=\frac{1}{\pi}\sin(\pi x)+c$ 的反例），故选 BC。
  key_steps:
    - step_id: step_1
      statement: 把复合偶性还原为 f 的轴对称。
      formula_trace:
        from: $f\left(\frac{3}{2}-2x\right)$ 为偶函数
        to: $f\left(\frac{3}{2}-2x\right)=f\left(\frac{3}{2}+2x\right)\Rightarrow f(x)=f(3-x)$
        operation: 对“自变量关于0取反不变”做等值改写并消去线性变换。
        why: 得到 $f$ 关于 $x=\frac{3}{2}$ 的轴对称，直接判定 C。
      source_ref: page_0117
    - step_id: step_2
      statement: 由 f 的轴对称过渡到 g 的中心对称。
      formula_trace:
        from: $f(x)=f(3-x)$
        to: $f'(x)=-f'(3-x)$，即 $g(x)=-g(3-x)$
        operation: 对对称恒等式两边求导。
        why: 把“原函数轴对称”转成“导函数中心对称”，得到中心 $\left(\frac{3}{2},0\right)$。
      source_ref: page_0117
    - step_id: step_3
      statement: 由 g 的另一条轴对称与中心对称配出周期。
      formula_trace:
        from: $g(2+x)$ 为偶函数，且 $g(x)=-g(3-x)$
        to: $g(2+x)=g(2-x)$，$g$ 关于 $x=2$ 对称，周期 $T=2$，$g\left(-\frac12\right)=g\left(\frac32\right)=0$
        operation: 把偶性改写成关于 $x=2$ 的轴对称，再用一点一轴构造周期。
        why: 可直接判定 B 正确，并且给出 D 不是由周期必然推出的关系。
      source_ref: page_0117
    - step_id: step_4
      statement: 用特殊值反例排除 A、D。
      formula_trace:
        from: $g(x)=\cos(\pi x),\ f(x)=\frac{1}{\pi}\sin(\pi x)+c$
        to: 满足题设但 A、D 不恒成立
        operation: 构造一组满足两条偶性条件的具体函数对。
        why: 源页法一用于确认只剩 BC。
      source_ref: page_0117
teaching_card:
  student_title: 两条偶性条件，配出中心-对称轴-周期
  what_it_trains: 训练把复合偶性翻译为对称信息，再用“原函数/导函数对称对应 + 一点一轴”完成多选筛选。
  recognition_cues:
    - 题干同时给 $f(a+bx)$ 偶与 $g(c+x)$ 偶，通常要做对称还原。
    - 已给 $g=f'$，要立刻联想“原函数轴对称 ↔ 导函数中心对称”。
    - 题目出现两个不同对称参照点，常可构造周期。
  normalization_moves:
    - 先把 $f\left(\frac{3}{2}-2x\right)$ 偶改写为 $f(x)=f(3-x)$。
    - 对上式求导得到 $g(x)=-g(3-x)$。
    - 把 $g(2+x)$ 偶改写为 $g(2+x)=g(2-x)$。
    - 用一点一轴构造周期并检验选项。
    - 对剩余选项用特值函数做反例判伪。
  common_failures:
    - 把“$f(a+bx)$ 偶”误当成“$f$ 是偶函数”。
    - 对 $f(x)=f(3-x)$ 求导漏掉右侧链式负号。
    - 看到周期后误判 $g(-1)=g(2)$，忽略两点差不是周期整数倍。
    - 多选题只靠直觉，不做反例验证。
  similar_practice_query: 抽象函数 复合偶函数 导函数 对称中心 对称轴 周期 多选
