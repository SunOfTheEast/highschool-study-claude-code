    - label: C
      text_raw: $1+\ln2$
      text_latex: $1+\ln2$
    - label: D
      text_raw: $9-\ln2$
      text_latex: $9-\ln2$
  answer: D；$9-\ln2$
  fidelity_notes:
    - 题头和函数表达式在 page_0026 底部；选项与解析在 page_0027 顶部。
    - 由 $\ln(x+5)$ 有意义可知零点变量满足 $x>-5$。
solution:
  source_solution_summary: |
    由 $f(x)=0$ 得 $e^{2x+a}+\frac a2=5+\frac12\ln(x+5)$。两边加 $x$ 后，左侧是 $e^{2(x+a/2)}+x+\frac a2$，右侧是 $e^{\ln(x+5)}+\frac12\ln(x+5)$。令 $g(t)=e^{2t}+t$，其严格递增，于是 $g(x+\frac a2)=g(\frac12\ln(x+5))$，得到 $a=\ln(x+5)-2x$。在 $x>-5$ 上求 $h(x)=\ln(x+5)-2x$ 的最大值，$h'(x)=\frac1{x+5}-2$，最大点为 $x=-\frac92$，最大值 $9-\ln2$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把“有零点”翻译成存在 $x>-5$ 满足方程。
      formula_trace:
        from: $f(x)=e^{2x+a}-\frac12\ln(x+5)+\frac a2-5$ 有零点
        to: $\exists x>-5:\ e^{2x+a}+\frac a2=5+\frac12\ln(x+5)$
        operation: 令 $f(x)=0$，并把对数项和常数项移到右侧。
        why: 零点存在问题先转成含参数方程的可解性。
      source_ref: page_0027
    - step_id: step_2
      statement: 两边加 $x$，配出同构函数。
      formula_trace:
        from: $e^{2x+a}+\frac a2=5+\frac12\ln(x+5)$
        to: $e^{2(x+a/2)}+x+\frac a2=e^{\ln(x+5)}+\frac12\ln(x+5)$
        operation: 两边加 $x$；用 $2x+a=2(x+\frac a2)$，并用 $x+5=e^{\ln(x+5)}$。
        why: 左右两侧可分别写成 $g(x+\frac a2)$ 与 $g(\frac12\ln(x+5))$。
      source_ref: page_0027
    - step_id: step_3
      statement: 利用 $g(t)=e^{2t}+t$ 的单调性。
      formula_trace:
        from: $g\left(x+\frac a2\right)=g\left(\frac12\ln(x+5)\right)$
        to: $x+\frac a2=\frac12\ln(x+5)$
        operation: 因 $g$ 的导数 $2e^{2t}+1>0$，$g$ 在 $\mathbf R$ 上严格递增。
        why: 严格递增函数值相等，输入必须相等。
      source_ref: page_0027
    - step_id: step_4
      statement: 把参数表示成 $x$ 的函数。
      formula_trace:
        from: $x+\frac a2=\frac12\ln(x+5)$
        to: $a=\ln(x+5)-2x$
        operation: 两边乘以 2 后移项。
        why: 实数 $a$ 的最大值转化为单变量函数最大值。
      source_ref: page_0027
    - step_id: step_5
      statement: 求 $h(x)=\ln(x+5)-2x$ 在 $x>-5$ 上的最大值。
      formula_trace:
        from: $h$ 的导数为 $\frac1{x+5}-2$
        to: $x=-\frac92$ 时 $h$ 取最大值
        operation: 令导数为 0 得 $x+5=\frac12$；在 $(-5,-\frac92)$ 上导数大于 0，在 $(-\frac92,+\infty)$ 上导数小于 0。
        why: 导数由正变负，临界点是全局最大点。
      source_ref: page_0027
    - step_id: step_6
      statement: 计算最大值并选项。
      formula_trace:
        from: $h\left(-\frac92\right)=\ln\frac12-2\left(-\frac92\right)$
        to: $9-\ln2$
        operation: 用 $\ln\frac12=-\ln2$。
        why: 与选项 D 对应。
      source_ref: page_0027
teaching_card:
  student_title: 把零点方程配成同一个 $e^{2t}+t$
  what_it_trains: 训练把含参数零点条件改造成同一个单调函数的函数值相等，再把参数最大值化为单变量最值。
  recognition_cues:
    - 函数里有 $e^{2x+a}$ 和 $\frac12\ln(x+5)$。
    - 题目说“有零点”，目标问参数最大值。
    - 表达式中 $a/2$ 与指数 $2x+a$ 可以合成 $x+a/2$。
  normalization_moves:
    - 由 $f(x)=0$ 移项，两边加 $x$。
    - 把 $e^{2x+a}$ 写成 $e^{2(x+a/2)}$。
    - 把 $x+5$ 写成 $e^{\ln(x+5)}$。
    - 用 $g$ 单调性得到 $a=\ln(x+5)-2x$。
  common_failures:
    - 没有给零点变量加上定义域 $x>-5$。
    - 看不到两边加 $x$ 后的 $e^{2t}+t$。
    - 把 $a$ 当常数直接求导原函数，计算量会变大。
    - 求 $h$ 的临界点后漏算 $\ln\frac12=-\ln2$。
  similar_practice_query: 零点参数最大值 $e^{2x+a}$ $\ln(x+5)$ $e^{2t}+t$ 同构
