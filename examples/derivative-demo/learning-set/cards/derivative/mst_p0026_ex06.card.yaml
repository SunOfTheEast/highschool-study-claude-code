stem: |-
  （2025 河南二模 T7）已知函数 $f(x)=e^{2x+a}-\frac12\ln(x+5)+\frac a2-5$ 有零点，那么实数 $a$ 的最大值为（ ）

  A. $\frac12$
  B. $1$
  C. $1+\ln2$
  D. $9-\ln2$
answer: |
  D；$9-\ln2$

  由 $f(x)=0$ 得 $e^{2x+a}+\frac a2=5+\frac12\ln(x+5)$。两边加 $x$ 后，左侧是 $e^{2(x+a/2)}+x+\frac a2$，右侧是 $e^{\ln(x+5)}+\frac12\ln(x+5)$。令 $g(t)=e^{2t}+t$，其严格递增，于是 $g(x+\frac a2)=g(\frac12\ln(x+5))$，得到 $a=\ln(x+5)-2x$。在 $x>-5$ 上求 $h(x)=\ln(x+5)-2x$ 的最大值，$h'(x)=\frac1{x+5}-2$，最大点为 $x=-\frac92$，最大值 $9-\ln2$，选 D。
