stem: |-
  （2025·肇庆期末 T8）已知函数 $f(x)=\begin{cases} 2-x^2, & -2 \leqslant x \leqslant 0 \\ 1+\ln x, & 0 < x \leqslant e \end{cases}$，函数 $g(x)=f(x)-m-1$ 恰有两个不同的零点 $x_1,x_2(x_1<x_2)$，则 $x_1^2+x_2$ 的最大值和最小值的差是（  ）
  A. $2+e^{-3}$
  B. $4+e^{-3}$
  C. $2-e^{-3}$
  D. $4-e^{-3}$
answer: |
  A

  令 $g(x)=f(x)-m-1$ 有两个不同零点，等价于水平线 $y=m+1$ 与分段函数
  \[
  f(x)=\begin{cases}
  2-x^2,&-2\le x\le0,\\
  1+\ln x,&0<x\le e
  \end{cases}
  \]
  有两个交点。由图像可得恰两交点当且仅当
  \[
  -2\le m+1\le2\Longleftrightarrow -3\le m\le1.
  \]
  设交点横坐标分别为 $x_1<x_2$，则
  \[
  2-x_1^2=m+1,\quad 1+\ln x_2=m+1,
  \]
  得
  \[
  x_1^2=1-m,\quad x_2=e^m.
  \]
  所以
  \[
  x_1^2+x_2=e^m-m+1=:h(m),\quad m\in[-3,1].
  \]
  \[
  h^{\prime}(m)=e^m-1.
  \]
  故 $h$ 在 $[-3,0]$ 递减，在 $[0,1]$ 递增，最小值为
  \[
  h(0)=2.
  \]
  最大值取端点较大者：
  \[
  h(-3)=4+e^{-3},\quad h(1)=e,\quad h_{\max}=4+e^{-3}.
  \]
  所求差值
  \[
  h_{\max}-h_{\min}=(4+e^{-3})-2=2+e^{-3},
  \]
  选 A。
