solution:
  source_solution_summary: |
    令 $g(x)=f(x)-m-1$ 有两个不同零点，等价于水平线 $y=m+1$ 与分段函数
    \[
    f(x)=\begin{cases}
    2-x^2,&-2\le x\le0,\\
    1+\ln x,&0<x\le e
    \end{cases}
    \]
    有两个交点。由图像可得恰两交点当且仅当
    \[
    -2\le m+1\le2\Longleftrightarrow -3\le m\le1.
    \]
    设交点横坐标分别为 $x_1<x_2$，则
    \[
    2-x_1^2=m+1,\quad 1+\ln x_2=m+1,
    \]
    得
    \[
    x_1^2=1-m,\quad x_2=e^m.
    \]
    所以
    \[
    x_1^2+x_2=e^m-m+1=:h(m),\quad m\in[-3,1].
    \]
    \[
    h^{\prime}(m)=e^m-1.
    \]
    故 $h$ 在 $[-3,0]$ 递减，在 $[0,1]$ 递增，最小值为
    \[
    h(0)=2.
    \]
    最大值取端点较大者：
    \[
    h(-3)=4+e^{-3},\quad h(1)=e,\quad h_{\max}=4+e^{-3}.
    \]
    所求差值
    \[
    h_{\max}-h_{\min}=(4+e^{-3})-2=2+e^{-3},
    \]
    选 A。
  key_steps:
    - step_id: step_1
      statement: 把“两个零点”转为“水平线与分段曲线有两个交点”。
      formula_trace:
        from: $g(x)=f(x)-m-1$ 恰有两个不同零点
        to: $y=f(x)$ 与 $y=m+1$ 恰有两个交点
        operation: 等效零点：令 $g(x)=0\Leftrightarrow f(x)=m+1$。
        why: 参数 $m$ 通过水平线高度进入，便于用图像先锁定范围。
      source_ref: page_0181_ex02_solution
    - step_id: step_2
      statement: 由图像得到参数区间。
      formula_trace:
        from: $y=m+1$ 与两支曲线各交一次
        to: $-2\le m+1\le2\Rightarrow -3\le m\le1$
        operation: 读取左支值域 $[-2,2]$，并结合右支单调性。
        why: 后续最值需要明确自变量区间。
      source_ref: page_0181_ex02_solution
    - step_id: step_3
      statement: 代换两个交点坐标关系。
      formula_trace:
        from: $\begin{cases}2-x_1^2=m+1\\1+\ln x_2=m+1\end{cases}$
        to: $x_1^2=1-m,\ x_2=e^m$
        operation: 分别在二次支、对数支上解出 $x_1^2,x_2$。
        why: 把目标式化成只含 $m$ 的函数。
      source_ref: page_0181_ex02_solution
    - step_id: step_4
      statement: 构造单变量函数并判单调。
      formula_trace:
        from: $x_1^2+x_2=e^m-m+1=:h(m)$
        to: $h^{\prime}(m)=e^m-1,\ h_{\min}=h(0)=2$
        operation: 求导并按 $m=0$ 分段判增减。
        why: 最值差由区间极值点给出。
      source_ref: page_0181_ex02_solution
    - step_id: step_5
      statement: 比较端点值并收束答案。
      formula_trace:
        from: $h(-3)=4+e^{-3},\ h(1)=e$
        to: $h_{\max}-h_{\min}=2+e^{-3}$
        operation: 端点比较后减去最小值。
        why: 完成“最大值和最小值的差”计算。
      source_ref: page_0181_ex02_solution
teaching_card:
  student_title: 先看交点个数，再化成 $h(m)$ 最值
  what_it_trains: 训练分段函数零点题的标准流程：图像定参域、交点代换、单变量最值收束。
  recognition_cues:
    - 题目给“恰有两个零点”与分段函数。
    - 目标式同时含两个零点的不同函数形态。
    - 参数只以常数平移形式出现（$m+1$）。
  normalization_moves:
    - 把 $g(x)=0$ 改写成 $f(x)=m+1$。
    - 利用图像先定 $m$ 的可行区间。
    - 分别从两支函数求 $x_1^2,x_2$，再合并为 $h(m)$。
    - 对 $h(m)$ 做区间最值并求差。
  common_failures:
    - 把右支 $1+\ln x$ 误当成在全实数有定义。
    - 只求到 $m$ 的范围，忘了继续算目标式最值差。
    - 端点比较时把 $h(1)=e$ 错判为最大值。
  similar_practice_query: 分段函数 恰有两个零点 交点计数 x1^2+x2 最值差
