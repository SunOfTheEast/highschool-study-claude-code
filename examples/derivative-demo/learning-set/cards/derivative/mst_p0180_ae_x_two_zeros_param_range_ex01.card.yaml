solution:
  source_solution_summary: |
    由零点方程
    \[
    ae^x-x=0
    \]
    得
    \[
    a=\frac{x}{e^x}.
    \]
    令
    \[
    g(x)=\frac{x}{e^x}=xe^{-x},
    \]
    则“$f(x)=0$ 的解个数”就是“直线 $y=a$ 与曲线 $y=g(x)$ 的交点个数”。

    计算导数
    \[
    g^{\prime}(x)=\frac{1-x}{e^x}.
    \]
    所以 $g$ 在 $(-\infty,1)$ 递增，在 $(1,+\infty)$ 递减，且
    \[
    g(1)=\frac1e,\quad g(0)=0,\quad \lim_{x\to-\infty}g(x)=-\infty,\quad \lim_{x\to+\infty}g(x)=0^+.
    \]
    因而水平线 $y=a$ 与 $g$ 恰有两个交点当且仅当
    \[
    0<a<\frac1e.
    \]
    对应选项 A。
  key_steps:
    - step_id: step_1
      statement: 做参变分离，把零点个数问题转成交点个数问题。
      formula_trace:
        from: $ae^x-x=0$
        to: $a=\frac{x}{e^x}=:g(x)$
        operation: 移项并除以 $e^x$。
        why: 参数 $a$ 被写成常数线，方便做数形结合计数。
      source_ref: page_0180_ex01_solution_start
    - step_id: step_2
      statement: 求 $g(x)=\frac{x}{e^x}$ 的单调区间与峰值。
      formula_trace:
        from: $g(x)=xe^{-x}$
        to: $g^{\prime}(x)=\frac{1-x}{e^x},\ g_{\max}=g(1)=\frac1e$
        operation: 求导并由导数符号判单调。
        why: “恰有两个交点”需要知道函数是否单峰及最高点高度。
      source_ref: page_0180_ex01_solution_start
    - step_id: step_3
      statement: 结合端点极限与零点位置，锁定两交点对应的 $a$。
      formula_trace:
        from: $g(0)=0,\ \lim_{x\to+\infty}g(x)=0^+,\ \lim_{x\to-\infty}g(x)=-\infty$
        to: 直线 $y=a$ 与 $y=g(x)$ 恰有2个交点 $\Longleftrightarrow 0<a<\frac1e$
        operation: 读图像的值域分层并做水平线计数。
        why: 把“零点个数=2”精确翻译为参数区间。
      source_ref: page_0181_ex01_continuation
    - step_id: step_4
      statement: 回填选项。
      formula_trace:
        from: $0<a<\frac1e$
        to: 选 A
        operation: 与选项区间逐一匹配。
        why: 完成选择题输出。
      source_ref: page_0181_ex01_continuation
teaching_card:
  student_title: 先分离参数，再数水平线交点
  what_it_trains: 训练“零点个数题”的标准落法：参变分离成 $a=g(x)$，再用单峰图像读参数范围。
  recognition_cues:
    - 题干出现“恰有几个零点 + 求参数范围”。
    - 参数与 $e^x$ 同乘，适合直接移到等号一侧。
    - 选项是区间型答案。
  normalization_moves:
    - 把 $ae^x-x=0$ 变成 $a=\frac{x}{e^x}$。
    - 求 $g^{\prime}(x)$，锁定最大值 $\frac1e$ 与单峰结构。
    - 用水平线 $y=a$ 与曲线交点个数反推 $a$ 的区间。
  common_failures:
    - 把 $g^{\prime}(x)$ 误写成二阶导数或符号看反。
    - 漏掉 $a\le 0$ 时最多只有一个交点的分层判断。
    - 把端点 $a=0$ 或 $a=\frac1e$ 误算进“两交点”区间。
  similar_practice_query: ae^x-x 恰有两个零点 参数范围 参变分离 x/e^x
