solution:
  source_solution_summary: |
    由 $f'(x)=ke^x-x-2$，$f(x)$ 在 $\\mathbf R$ 上递增等价于 $ke^x-x-2\\ge0$ 对所有实数 $x$ 恒成立。法一把它化为 $k\\ge (x+2)/e^x$，令 $u=x+2$，则 $(x+2)/e^x=e^2 u/e^u\\le e$，等号在 $u=1$ 即 $x=-1$ 时取得，所以 $k\\ge e$。法二把 $ke^x=e^{x+\ln k}$，由 $e^u\\ge u+1$ 得只要 $x+\ln k+1\\ge x+2$，即 $\\ln k\\ge1$，并且取等点也说明下界必要。故选 B。
  key_steps:
    - step_id: step_1
      statement: 把增函数条件转成导数恒非负。
      formula_trace:
        from: $f(x)=ke^x-\frac12x^2-2x$
        to: $f'(x)=ke^x-x-2\ge0\quad (x\in\mathbf R)$
        operation: 求导，并使用函数在 $\mathbf R$ 上递增的充分必要条件。
        why: 参数 $k$ 只在导数中的指数项前出现，恒成立条件更容易处理。
      source_ref: page_0042
    - step_id: step_2
      statement: 分离参数得到一个标准最值。
      formula_trace:
        from: $ke^x-x-2\ge0$
        to: $k\ge\frac{x+2}{e^x}\quad (x\in\mathbf R)$
        operation: 两边移项并除以正数 $e^x$。
        why: 要让不等式对全体 $x$ 成立，$k$ 必须不小于右侧函数的最大值。
      source_ref: page_0042
    - step_id: step_3
      statement: 求 $\frac{x+2}{e^x}$ 的最大值。
      formula_trace:
        from: $\frac{x+2}{e^x}$
        to: $e^2\cdot\frac{x+2}{e^{x+2}}\le e$
        operation: 令 $u=x+2$，使用 $u/e^u$ 在 $u=1$ 处最大为 $1/e$。
        why: 这是源解的六大函数同构模板，直接给出参数下界。
      source_ref: page_0042
    - step_id: step_4
      statement: 用切线式解释同一下界。
      formula_trace:
        from: $ke^x-x-2\ge0$
        to: $e^{x+\ln k}\ge x+2$
        operation: 把 $ke^x$ 写成 $e^{x+\ln k}$。
        why: 可以套 $e^u\ge u+1$ 的指数切线放缩。
      source_ref: page_0042
    - step_id: step_5
      statement: 让指数切线的右端压过 $x+2$。
      formula_trace:
        from: $e^{x+\ln k}\ge x+\ln k+1$
        to: $x+\ln k+1\ge x+2\Rightarrow \ln k\ge1\Rightarrow k\ge e$
        operation: 比较两个一次式，并指数化。
        why: 当 $\ln k=1$ 时在 $x=-1$ 处取等，说明下界也是必要的。
      source_ref: page_0042
teaching_card:
  student_title: 把导数非负配成指数切线
  what_it_trains: 训练从“全实数上递增”出发，把导数恒非负改写成标准指数函数与直线的比较，并用切线取等点锁定参数下界。
  recognition_cues:
    - 题干说函数在 $\mathbf R$ 上为增函数。
    - 求导后出现 $ke^x-x-2$。
    - 常数 $2$ 可以和 $x$ 合成 $x+2$，对应 $u/e^u$ 或 $e^u\ge u+1$。
  normalization_moves:
    - 先求导得到 $ke^x-x-2\ge0$。
    - 路线一：分离成 $k\ge (x+2)/e^x$，再令 $u=x+2$。
    - 路线二：把 $ke^x$ 写成 $e^{x+\ln k}$，让切线式的右端不低于 $x+2$。
  common_failures:
    - 把递增误认为只要某一点导数非负，漏掉全体 $x$。
    - 求 $u/e^u$ 最大值时忽略 $u$ 可以为负，但最大值仍在 $u=1$。
    - 只证明 $k=e$ 可行，没有说明 $k<e$ 会在取等点附近失败。
  similar_practice_query: 导数增函数 恒成立参数 指数切线 ke^x-x-2
