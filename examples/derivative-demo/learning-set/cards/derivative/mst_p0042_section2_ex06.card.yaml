stem: |-
  （辽宁鞍山 2024 学年高三上学期第一次质量监测 T7）已知函数 $f(x)=ke^x-\frac{1}{2}x^2-2x$，若 $f(x)$ 为 $\mathbf{R}$ 上的增函数，则 $k$ 的取值范围为 (  )
  A. $\left[\frac{1}{\mathrm{e}}, +\infty\right)$
  B. $[\mathrm{e}, +\infty)$
  C. $[\mathrm{e}+1, +\infty)$
  D. $[2\mathrm{e}, +\infty)$
answer: |
  B

  由 $f'(x)=ke^x-x-2$，$f(x)$ 在 $\\mathbf R$ 上递增等价于 $ke^x-x-2\\ge0$ 对所有实数 $x$ 恒成立。法一把它化为 $k\\ge (x+2)/e^x$，令 $u=x+2$，则 $(x+2)/e^x=e^2 u/e^u\\le e$，等号在 $u=1$ 即 $x=-1$ 时取得，所以 $k\\ge e$。法二把 $ke^x=e^{x+\ln k}$，由 $e^u\\ge u+1$ 得只要 $x+\ln k+1\\ge x+2$，即 $\\ln k\\ge1$，并且取等点也说明下界必要。故选 B。
