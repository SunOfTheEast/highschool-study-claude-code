teaching_card:
  student_title: 奇函数配三角比值，单调一次判四项
  what_it_trains: 训练“导数线性组合→三角比值导数”的标准建模，并通过奇偶性把正负区间比较统一化。
  recognition_cues:
    - 题设核心是 $f^{\prime}(x)\sin x-f(x)\cos x$。
    - 已给 $f$ 是奇函数。
    - 选项全部是若干固定角度的值比较。
  normalization_moves:
    - 构造 $g=\frac{f}{\sin x}$ 并求 $g^{\prime}$。
    - 由奇函数得到 $g$ 偶，快速判两侧单调。
    - 将每个选项改写成 $g(\alpha)$ 与 $g(\beta)$ 比较。
    - 再回代三角函数常值化简系数。
  common_failures:
    - 将 $\left(\frac{f}{\sin x}\right)^{\prime}$ 分子符号写错。
    - 把“正半区递增”误推广到全区间同向递增。
    - 处理负角时遗漏 $\sin(-\theta)=-\sin\theta$。
  similar_practice_query: 三角构造 f'/sin 抽象函数 奇函数 单调 比较
