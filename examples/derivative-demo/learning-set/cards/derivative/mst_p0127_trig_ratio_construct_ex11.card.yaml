stem: |-
  （24-25高二下·山东泰安·阶段练习）已知函数 $y=f(x)$ 是奇函数，对于任意的 $x\in\left(0,\frac{\pi}{2}\right]$ 满足 $f^{\prime}(x)\sin x-f(x)\cos x>0$（其中 $f^{\prime}(x)$ 是函数 $f(x)$ 的导函数），则下列不等式成立的是（ ）
  A. $\sqrt{3}f\left(-\frac{\pi}{6}\right)<f\left(-\frac{\pi}{3}\right)$
  B. $f\left(\frac{\pi}{3}\right)<\sqrt{3}f\left(\frac{\pi}{6}\right)$
  C. $f\left(\frac{\pi}{4}\right)>-\sqrt{2}f\left(-\frac{\pi}{6}\right)$
  D. $\sqrt{2}f\left(-\frac{\pi}{4}\right)<-f\left(\frac{\pi}{2}\right)$
answer: |
  C

  构造
  \[
  g(x)=\frac{f(x)}{\sin x},\quad
  x\in\left[-\frac{\pi}{2},0\right)\cup\left(0,\frac{\pi}{2}\right].
  \]
  由 $f$ 为奇函数得
  \[
  g(-x)=\frac{f(-x)}{\sin(-x)}=\frac{-f(x)}{-\sin x}=g(x),
  \]
  所以 $g$ 为偶函数。再求导：
  \[
  g^{\prime}(x)=\frac{f^{\prime}(x)\sin x-f(x)\cos x}{\sin^2x}.
  \]
  题设在 $x\in\left(0,\frac{\pi}{2}\right]$ 上给出分子 $>0$，故
  $g^{\prime}(x)>0$，即 $g$ 在正半区单调递增；结合偶函数性质，$g$ 在
  $\left[-\frac{\pi}{2},0\right)$ 上单调递减。

  A：$-\frac{\pi}{3}<-\frac{\pi}{6}$，在负半区递减得
  \[
  \frac{f\left(-\frac{\pi}{3}\right)}{\sin\left(-\frac{\pi}{3}\right)}>
  \frac{f\left(-\frac{\pi}{6}\right)}{\sin\left(-\frac{\pi}{6}\right)}
  \Rightarrow
  \sqrt{3}f\left(-\frac{\pi}{6}\right)>f\left(-\frac{\pi}{3}\right),
  \]
  故A错。

  B：$\frac{\pi}{3}>\frac{\pi}{6}$，在正半区递增得
  \[
  \frac{f\left(\frac{\pi}{3}\right)}{\sin\frac{\pi}{3}}>
  \frac{f\left(\frac{\pi}{6}\right)}{\sin\frac{\pi}{6}}
  \Rightarrow
  f\left(\frac{\pi}{3}\right)>\sqrt{3}f\left(\frac{\pi}{6}\right),
  \]
  故B错。

  C：由 $\frac{\pi}{6}<\frac{\pi}{4}$，
  \[
  \frac{f\left(-\frac{\pi}{6}\right)}{\sin\left(-\frac{\pi}{6}\right)}
  =\frac{f\left(\frac{\pi}{6}\right)}{\sin\left(\frac{\pi}{6}\right)}
  <\frac{f\left(\frac{\pi}{4}\right)}{\sin\frac{\pi}{4}}
  \Rightarrow
  f\left(\frac{\pi}{4}\right)>-\sqrt{2}f\left(-\frac{\pi}{6}\right),
  \]
  C正确。

  D：由 $\frac{\pi}{4}<\frac{\pi}{2}$，
  \[
  \frac{f\left(-\frac{\pi}{4}\right)}{\sin\left(-\frac{\pi}{4}\right)}
  =\frac{f\left(\frac{\pi}{4}\right)}{\sin\left(\frac{\pi}{4}\right)}
  <\frac{f\left(\frac{\pi}{2}\right)}{\sin\frac{\pi}{2}}
  \Rightarrow
  \sqrt{2}f\left(-\frac{\pi}{4}\right)>-f\left(\frac{\pi}{2}\right),
  \]
  与D相反，故D错。综上选 C。
