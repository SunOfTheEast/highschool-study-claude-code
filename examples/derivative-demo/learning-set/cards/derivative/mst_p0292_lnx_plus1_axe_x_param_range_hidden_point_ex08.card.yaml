original_problem:
  stem: （2024 · 湖南模拟）已知函数 $f(x)=\ln(x+1)$，$g(x)=axe^x-2\ln a+3\ln2+3$。
  parts: *a1
  choices: []
  answer: 第(1)问不等式成立；第(2)问 $a\in(0,4\sqrt e]$。
  fidelity_notes:
    - 无选项。
    - 第(2)问由 $\ln a$ 可知 $a>0$。
solution:
  source_solution_summary: 第(1)问令 $\phi(x)=\ln(x+1)+\frac{x^2}{2}-x$，则 $\phi^\prime(x)=\frac1{x+1}+x-1=\frac{x^2}{x+1}>0$。 当 $x>0$ 时，原不等式等价于 $\phi(x)>0$，由 $\phi(x)>\phi(0)=0$ 成立；当 $-1<x<0$ 时，由于除以负数方向改变， 原不等式等价于 $\phi(x)<0$，由 $\phi(x)<\phi(0)=0$ 成立。 第(2)问构造 $h(x)=axe^x-\ln(x+1)-2\ln a+3\ln2+3$。有 $h^\prime(x)=ae^x(x+1)-\frac1{x+1}$， $h^{\prime\prime}(x)=a(x+2)e^x+\frac1{(x+1)^2}>0$，所以 $h^\prime$ 递增，$h$ 有唯一极小点 $x_0$。联立 $h^\prime(x_0)=0,h(x_0)=0$，可得 $a=e^{-x_0}/(x_0+1)^2$，即 $\ln a=-2\ln(x_0+1)-x_0$。代回后得到 $F(x_0)=\frac{x_0}{(x_0+1)^2}+3\ln[2(x_0+1)]+2x_0+3=0$。 source 通过 $F(-1/2)=0$ 且 $F^\prime(x)>0$ 得 $x_0=-1/2$。于是 $h(x)\ge h(-1/2)=-\frac{a}{2\sqrt e}-2\ln\frac a4+3$。 令 $t=a/(4\sqrt e)$，该式等价于 $2(1-t-\ln t)\ge0$， 所以 $0<a\le4\sqrt e$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问先构造辅助函数。
      formula_trace:
        from: $\frac{\ln(x+1)}x>-\frac12x+1$
        to: $\phi(x)=\ln(x+1)+\frac{x^2}{2}-x$
        operation: 把不等式移到一边。
        why: 正负区间里只需要判断 $\phi$ 相对 $\phi(0)$ 的大小。
      source_ref: page_0293_ex08_solution_end
    - step_id: step_2
      statement: 用 $\phi^\prime>0$ 分正负区间证明。
      formula_trace:
        from: $\phi^\prime(x)=\frac{x^2}{x+1}>0$
        to: $x>0$ 时 $\phi(x)>0$；$-1<x<0$ 时 $\phi(x)<0$
        operation: 利用 $\phi$ 在 $(-1,+\infty)$ 上递增。
        why: 除以负数时方向会反，所以必须分区间。
      source_ref: page_0293_ex08_solution_end
    - step_id: step_3
      statement: 第(2)问构造恒非负函数。
      formula_trace:
        from: $g(x)\ge f(x)$
        to: $h(x)=axe^x-\ln(x+1)-2\ln a+3\ln2+3\ge0$
        operation: 移项。
        why: 把参数范围问题转成 $h$ 的最小值问题。
      source_ref: page_0293_ex08_solution_end
    - step_id: step_4
      statement: 用二阶导保证只有一个极小点。
      formula_trace:
        from: $h^\prime(x)=ae^x(x+1)-\frac1{x+1}$
        to: $h^{\prime\prime}(x)=a(x+2)e^x+\frac1{(x+1)^2}>0$
        operation: 求导判凸。
        why: $h^\prime$ 递增，隐点探路才有唯一目标。
      source_ref: page_0293_ex08_solution_end
    - step_id: step_5
      statement: 联立隐点条件，消掉 $a$。
      formula_trace:
        from: $h^\prime(x_0)=0$
        to: $a=\frac{e^{-x_0}}{(x_0+1)^2},\quad \ln a=-2\ln(x_0+1)-x_0$
        operation: 由导数为零解参数。
        why: 把取等点方程改写成只含 $x_0$ 的方程。
      source_ref: page_0293_ex08_solution_end
    - step_id: step_6
      statement: 证明取等点是 $x_0=-1/2$。
      formula_trace:
        from: $F(x)=\frac{x}{(x+1)^2}+3\ln[2(x+1)]+2x+3$
        to: $F(-\frac12)=0,\quad F^\prime(x)>0,\quad x_0=-\frac12$
        operation: 构造单调函数锁定唯一零点。
        why: 这一步是 source 所说的“探路 + 证明”。
      source_ref: page_0293_ex08_solution_end
    - step_id: step_7
      statement: 把最终条件化成 $a$ 的范围。
      formula_trace:
        from: $h(-\frac12)=-\frac{a}{2\sqrt e}-2\ln\frac a4+3\ge0$
        to: $0<a\le4\sqrt e$
        operation: 令 $t=a/(4\sqrt e)$，化为 $1-t-\ln t\ge0$。
        why: 该不等式对 $0<t\le1$ 成立，给出参数上界。
      source_ref: page_0293_ex08_solution_end
teaching_card:
  student_title: 隐点落在 $x=-1/2$ 的参数题
  what_it_trains: 训练先用简单单调函数处理基础不等式，再用隐点条件把含 $a$ 的恒成立题压到一个特殊点。
  recognition_cues:
    - 第(1)问有 $\frac{\ln(x+1)}x$，必须注意 $x$ 的正负。
    - 第(2)问中 $a$ 同时在 $axe^x$ 和 $\ln a$ 里。
    - $h^{\prime\prime}>0$ 暗示可以找唯一极小点。
    - source 明确提示“探路 + 证明”，最后隐点是 $x=-1/2$。
  normalization_moves:
    - 第(1)问构造 $\phi(x)$ 并分区间。
    - 第(2)问先写 $h=g-f$。
    - 联立 $h=0,h^\prime=0$ 消去 $a$。
    - 把最终条件归一化成 $1-t-\ln t\ge0$。
  common_failures:
    - 第(1)问在 $x<0$ 时忘记不等号变向。
    - 把源文里错误的 $a$ 公式照抄，导致后面 $\ln a$ 对不上。
    - 只猜 $x_0=-1/2$，没有用 $F^\prime>0$ 证明唯一性。
    - 最后从 $h(-1/2)\ge0$ 解 $a$ 范围时卡住。
  similar_practice_query: ln(x+1)/x axe^x ln a 隐点 -1/2 4sqrt(e) 参数范围
