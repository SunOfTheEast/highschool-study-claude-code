stem: |-
  （2024 · 湖南模拟）已知函数 $f(x)=\ln(x+1)$，$g(x)=axe^x-2\ln a+3\ln2+3$。
  1. 当 $x\in(-1,0)\cup(0,+\infty)$ 时，求证：$\frac{f(x)}x>-\frac12x+1$。
  2. 若 $x\in(-1,+\infty)$ 时，$g(x)\ge f(x)$，求实数 $a$ 的取值范围。
answer: |-
  第(1)问不等式成立；第(2)问 $a\in(0,4\sqrt e]$。

  第(1)问令 $\phi(x)=\ln(x+1)+\frac{x^2}{2}-x$，则 $\phi^\prime(x)=\frac1{x+1}+x-1=\frac{x^2}{x+1}>0$。 当 $x>0$ 时，原不等式等价于 $\phi(x)>0$，由 $\phi(x)>\phi(0)=0$ 成立；当 $-1<x<0$ 时，由于除以负数方向改变， 原不等式等价于 $\phi(x)<0$，由 $\phi(x)<\phi(0)=0$ 成立。 第(2)问构造 $h(x)=axe^x-\ln(x+1)-2\ln a+3\ln2+3$。有 $h^\prime(x)=ae^x(x+1)-\frac1{x+1}$， $h^{\prime\prime}(x)=a(x+2)e^x+\frac1{(x+1)^2}>0$，所以 $h^\prime$ 递增，$h$ 有唯一极小点 $x_0$。联立 $h^\prime(x_0)=0,h(x_0)=0$，可得 $a=e^{-x_0}/(x_0+1)^2$，即 $\ln a=-2\ln(x_0+1)-x_0$。代回后得到 $F(x_0)=\frac{x_0}{(x_0+1)^2}+3\ln[2(x_0+1)]+2x_0+3=0$。 source 通过 $F(-1/2)=0$ 且 $F^\prime(x)>0$ 得 $x_0=-1/2$。于是 $h(x)\ge h(-1/2)=-\frac{a}{2\sqrt e}-2\ln\frac a4+3$。 令 $t=a/(4\sqrt e)$，该式等价于 $2(1-t-\ln t)\ge0$， 所以 $0<a\le4\sqrt e$。
