stem: |-
  已知函数 $f(x)=2ax+ax\cos x-\sin x\ (a\in\mathbf{R})$。
  (1) 当 $a=1$ 时，求 $f(x)$ 在点 $(0,f(0))$ 处的切线方程。
  (2) 若对任意 $x\geqslant 0$，都有 $f(x)\geqslant 0$，求实数 $a$ 的取值范围。
  (3) 证明：$\sum_{k=1}^n\sin\frac{1}{k+1}<\ln(n+1)$，$n\in\mathbf{N}^*$。
answer: |-
  (1) $2x-y=0$；(2) $a\in[\frac13,+\infty)$；(3) 结论成立。

  先求 $a=1$ 时 $f(0)=0,f'(0)=2$ 得切线 $2x-y=0$。恒成立参数由 $f(0)=0$ 推出必要条件 $f'(0)=3a-1\ge0$，再证明 $\sin x\le \frac13x(2+\cos x)$，于是当 $a\ge1/3$ 时 $f(x)=ax(2+\cos x)-\sin x\ge0$；若 $a<1/3$，0 右侧局部递减产生反例。最后用 $\sin(1/(k+1))<1/(k+1)<\ln((k+1)/k)$ 逐项求和，或用源页法二的 $-\ln(1-1/(k+1))$ 直接对齐 $\ln((k+1)/k)$。
rubric:
  max_score: 9
  criteria:
    - step_id: step_1
      description: 当 $a=1$ 时，$f(0)=0$，$f'(x)=2+\cos x-x\sin x-\cos x=2-x\sin x$，故 $f'(0)=2$，切线为 $y=2x$。
      max_score: 1
    - step_id: step_2
      description: 因为 $f(0)=0$ 且要求 $x\ge0$ 上 $f(x)\ge0$，0 必须是右端不下降起点，所以 $f'(0)=3a-1\ge0$，得到必要条件 $a\ge1/3$。
      max_score: 1
    - step_id: step_3
      description: 构造 $h(x)=\frac{\sin x}{2+\cos x}-\frac13x$，有 $h'(x)=-\frac{(\cos x-1)^2}{3(2+\cos x)^2}\le0$，所以 $h(x)\le h(0)=0$。
      max_score: 1
    - step_id: step_4
      description: 当 $a\ge1/3$ 时，$f(x)=ax(2+\cos x)-\sin x\ge\frac13x(2+\cos x)-\sin x\ge0$；当 $a<1/3$ 时由 $f'(0)<0$ 得局部反例。
      max_score: 1
    - step_id: step_5
      description: 对每个 $k\ge1$，由 $x>0$ 时 $\sin x<x$，得 $\sin\frac1{k+1}<\frac1{k+1}$。
      max_score: 1
    - step_id: step_6
      description: 把 $\ln(n+1)$ 展开为 $\sum_{k=1}^n\ln\frac{k+1}{k}$。
      max_score: 1
    - step_id: step_7
      description: 设 $F(x)=\ln x+\frac1x-1$，$x>1$，则 $F'(x)=\frac{x-1}{x^2}>0$，故 $F(x)>F(1)=0$，即 $\ln x>1-\frac1x$。
      max_score: 1
    - step_id: step_8
      description: 令 $x=\frac{k+1}{k}$，得 $\frac1{k+1}<\ln\frac{k+1}{k}$；与 step_5 逐项相连后求和，得到 $\sum_{k=1}^n\sin\frac1{k+1}<\ln(n+1)$。
      max_score: 1
    - step_id: step_9
      description: 源页法二也可把目标项直接对齐为 $\ln\frac{k+1}{k}=-\ln(1-\frac1{k+1})$，由 $\sin\frac1{k+1}<\frac1{k+1}<-\ln(1-\frac1{k+1})$ 得证。
      max_score: 1
graph:
  goal:
    primary: 不等式证明
    part_level:
      - part_id: "1"
        goal: 几何量求解
        target: 求切线方程
        result: $2x-y=0$
      - part_id: "2"
        goal: 求参数范围
        result: $a\in[\frac13,+\infty)$
      - part_id: "3"
        goal: 不等式证明
        result: $\sum_{k=1}^n\sin\frac1{k+1}<\ln(n+1)$
  method:
    primary: 切线放缩与凹凸性
    secondary:
      - 数列和转化
      - 充分/必要性探路
      - 拟合与夹逼
    subroute:
      - 右端点必要性：$f(0)=0$ 且 $f(x)\ge0$ on $[0,+\infty)$ implies $f'(0)\ge0$
      - 临界参数构造：证明 $\sin x\le\frac13x(2+\cos x)$ 后回代 $a\ge1/3$
      - 和式代换：$\ln(n+1)=\sum_{k=1}^n\ln((k+1)/k)$
      - 逐项夹逼：$\sin(1/(k+1))<1/(k+1)<\ln((k+1)/k)$
  structure:
    primary: 三角复合结构
    secondary:
      - 切线/公切线/切点量结构
      - 数列离散/递推结构
      - 不等式工具结构
    evidence:
      - $f(x)=ax(2+\cos x)-\sin x$ 将参数、线性 x、cos x、sin x 绑在一起。
      - $h(x)=\sin x/(2+\cos x)-x/3$ 是围绕切点 0 的临界放缩结构。
      - 第三问用 $k\mapsto \ln((k+1)/k)$ 的离散对数增量和左端三角项逐项配对。
    normalization_moves_used:
      - 将 $2ax+ax\cos x-\sin x$ 合并为 $ax(2+\cos x)-\sin x$。
      - 由 $f(0)=0$ 把恒成立参数问题转为右端点导数必要条件。
      - 将 $\sin x\le\frac13x(2+\cos x)$ 改写为 $\frac{\sin x}{2+\cos x}-\frac13x\le0$ 并求导。
      - 将 $\ln(n+1)$ 拆成 $\sum_{k=1}^n\ln\frac{k+1}{k}$。
      - 将 $\frac1{k+1}<\ln\frac{k+1}{k}$ 统一为 $\ln x>1-1/x$，其中 $x=(k+1)/k$。
      - 法二把 $\ln\frac{k+1}{k}$ 规范为 $-\ln(1-\frac1{k+1})$，与 $u<-\ln(1-u)$ 对齐。
  fallback:
    only_if_trace_shows:
      - 若学生不会从 $f(0)=0$ 和右侧恒非负推出 $f'(0)\ge0$，回补导数单调极值基础。
      - 若学生不会求切线方程，或不会求 $h'(x)$ 判定 $h(x)\le h(0)$，回补导数运算与几何意义。
      - 若学生不能把 $\ln(n+1)$ 拆成逐项对数和，回补数列基础。
      - 若学生不能证明 $\ln x>1-1/x$ 或 $u<-\ln(1-u)$，回补指数对数基础。
      - 若学生不知道 $\sin x<x$、逐项放缩或严格不等式传递，回补不等式工具基础。
      - 若学生对 $\sin x$、$\cos x$ 的基本求导和局部比较不稳，回补三角函数基础。
  detail_terms:
    - $\sin x<x$
    - $\ln x>1-1/x$
    - $u<-\ln(1-u)$
    - $\ln(n+1)=\sum_{k=1}^n\ln((k+1)/k)$
    - $h'(x)=-(\cos x-1)^2/[3(2+\cos x)^2]$
    - 和式代换
    - 逐项放缩
    - 右端点必要性
