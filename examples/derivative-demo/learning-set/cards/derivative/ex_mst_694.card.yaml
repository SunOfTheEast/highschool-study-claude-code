original_problem:
  stem: 已知函数 $f(x)=2ax+ax\cos x-\sin x\ (a\in\mathbf{R})$。
  parts: *a1
  choices: []
  answer: (1) $2x-y=0$；(2) $a\in[\frac13,+\infty)$；(3) 结论成立。
  fidelity_notes:
    - page_0458.png 与 markdown 一致：第三问求和下标为 k=1 到 n，正弦项为 1/(k+1)，右端为 ln(n+1)。
    - page_0459.png 确认第二问答案区间写作 [1/3,+infty)，第三问法一和法二均在同页完整呈现。
solution:
  source_solution_summary: 先求 $a=1$ 时 $f(0)=0,f'(0)=2$ 得切线 $2x-y=0$。恒成立参数由 $f(0)=0$ 推出必要条件 $f'(0)=3a-1\ge0$，再证明 $\sin x\le \frac13x(2+\cos x)$，于是当 $a\ge1/3$ 时 $f(x)=ax(2+\cos x)-\sin x\ge0$；若 $a<1/3$，0 右侧局部递减产生反例。最后用 $\sin(1/(k+1))<1/(k+1)<\ln((k+1)/k)$ 逐项求和，或用源页法二的 $-\ln(1-1/(k+1))$ 直接对齐 $\ln((k+1)/k)$。
  key_steps:
    - step_id: step_1
      statement: 当 $a=1$ 时，$f(0)=0$，$f'(x)=2+\cos x-x\sin x-\cos x=2-x\sin x$，故 $f'(0)=2$，切线为 $y=2x$。
      formula_trace:
        from: $f(x)=2x+x\cos x-\sin x$
        to: $y-f(0)=f'(0)(x-0)$，即 $2x-y=0$
        operation: 求导并代入切点 $x=0$
        why: 切线方程由切点函数值与导数斜率确定。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0458/page_0458.md:31-36
    - step_id: step_2
      statement: 因为 $f(0)=0$ 且要求 $x\ge0$ 上 $f(x)\ge0$，0 必须是右端不下降起点，所以 $f'(0)=3a-1\ge0$，得到必要条件 $a\ge1/3$。
      formula_trace:
        from: $f'(x)=2a+a\cos x-ax\sin x-\cos x$
        to: $f'(0)=3a-1\ge0$
        operation: 在右端点 $0$ 处取导数必要条件
        why: 若 $f'(0)<0$，则 0 右侧小区间内 $f(x)<f(0)=0$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0458/page_0458.md:37; mst26-full-marked-c20/pages/page_0459/page_0459.md:12
    - step_id: step_3
      statement: 构造 $h(x)=\frac{\sin x}{2+\cos x}-\frac13x$，有 $h'(x)=-\frac{(\cos x-1)^2}{3(2+\cos x)^2}\le0$，所以 $h(x)\le h(0)=0$。
      formula_trace:
        from: $h(x)=\frac{\sin x}{2+\cos x}-\frac13x$
        to: $\sin x\le\frac13x(2+\cos x)$
        operation: 对辅助函数求导判单调，再移项
        why: 把三角项压到与 $a=1/3$ 同形的线性-余弦表达。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0458/page_0458.md:37
    - step_id: step_4
      statement: 当 $a\ge1/3$ 时，$f(x)=ax(2+\cos x)-\sin x\ge\frac13x(2+\cos x)-\sin x\ge0$；当 $a<1/3$ 时由 $f'(0)<0$ 得局部反例。
      formula_trace:
        from: $a\ge\frac13$ 与 $\sin x\le\frac13x(2+\cos x)$
        to: $f(x)\ge0$ 对任意 $x\ge0$ 成立，范围为 $[\frac13,+\infty)$
        operation: 用临界参数的下界替换 $a$，再合并必要性
        why: 完成参数范围的充分必要性闭合。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0459/page_0459.md:12
    - step_id: step_5
      statement: 对每个 $k\ge1$，由 $x>0$ 时 $\sin x<x$，得 $\sin\frac1{k+1}<\frac1{k+1}$。
      formula_trace:
        from: $\sin x<x\ (x>0)$
        to: $\sum_{k=1}^n\sin\frac1{k+1}<\sum_{k=1}^n\frac1{k+1}$
        operation: 令 $x=1/(k+1)$ 后逐项求和
        why: 先把三角和降成可与对数增量比较的调和项。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0459/page_0459.md:14
    - step_id: step_6
      statement: 把 $\ln(n+1)$ 展开为 $\sum_{k=1}^n\ln\frac{k+1}{k}$。
      formula_trace:
        from: $\ln(n+1)=\ln\left(\frac21\cdot\frac32\cdots\frac{n+1}{n}\right)$
        to: $\ln(n+1)=\sum_{k=1}^n\ln\frac{k+1}{k}$
        operation: 乘积望远镜并把对数乘积化为对数和
        why: 让右端拆成与左端同下标的逐项比较对象。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0459/page_0459.md:15
    - step_id: step_7
      statement: 设 $F(x)=\ln x+\frac1x-1$，$x>1$，则 $F'(x)=\frac{x-1}{x^2}>0$，故 $F(x)>F(1)=0$，即 $\ln x>1-\frac1x$。
      formula_trace:
        from: $F'(x)=\frac1x-\frac1{x^2}$
        to: $\ln x>1-\frac1x\quad(x>1)$
        operation: 导数判单调并与 $x=1$ 的切点值比较
        why: 建立对数在切线 $1-1/x$ 上方的基础放缩。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0459/page_0459.md:16
    - step_id: step_8
      statement: 令 $x=\frac{k+1}{k}$，得 $\frac1{k+1}<\ln\frac{k+1}{k}$；与 step_5 逐项相连后求和，得到 $\sum_{k=1}^n\sin\frac1{k+1}<\ln(n+1)$。
      formula_trace:
        from: $\ln x>1-\frac1x$
        to: $\sin\frac1{k+1}<\frac1{k+1}<\ln\frac{k+1}{k}$
        operation: 代入 $x=(k+1)/k$ 并串联三角放缩
        why: 逐项严格小于可求和的对数增量，求和后右端望远镜。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0459/page_0459.md:16
    - step_id: step_9
      statement: 源页法二也可把目标项直接对齐为 $\ln\frac{k+1}{k}=-\ln(1-\frac1{k+1})$，由 $\sin\frac1{k+1}<\frac1{k+1}<-\ln(1-\frac1{k+1})$ 得证。
      formula_trace:
        from: $a_k=\ln\frac{k+1}{k}=-\ln(1-\frac1{k+1})$
        to: $\sin\frac1{k+1}<a_k$
        operation: 用切线方式比较 $u$ 与 $-\ln(1-u)$，其中 $u=1/(k+1)$
        why: 这是源页标注的和式代换法，避免另设 $F(x)$ 后再回代。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0459/page_0459.md:18-21
teaching_card:
  student_title: 把正弦小项配成对数增量
  what_it_trains: 训练从导数切线放缩得到可累加的不等式链，并把 $\ln(n+1)$ 拆成逐项对数增量来证明三角数列和不等式。
  recognition_cues:
    - 题目同时出现 $\sin\frac1{k+1}$ 和 $\ln(n+1)$。
    - 右端 $\ln(n+1)$ 可以写成 $\ln\frac21+\ln\frac32+\cdots+\ln\frac{n+1}{n}$。
    - 函数部分出现 $f(0)=0$、恒有 $f(x)\ge0$，提示先看 $f'(0)$ 的必要条件。
    - 参数临界值 $1/3$ 与 $2+\cos x$ 组合，提示构造 $\sin x/(2+\cos x)-x/3$。
  normalization_moves:
    - 先把 $f(x)$ 写成 $ax(2+\cos x)-\sin x$，看出临界放缩应控制 $\sin x/(2+\cos x)$。
    - 证明数列和时不要直接估整个和，先把右端拆成与 k 同步的 $\ln((k+1)/k)$。
    - 把 $\frac1{k+1}<\ln\frac{k+1}{k}$ 改写为标准式 $\ln x>1-1/x$。
    - 也可令 $u=1/(k+1)$，把目标项写成 $-\ln(1-u)$，使用 $u<-\ln(1-u)$。
  common_failures:
    - 只写 $\sin x<x$ 后停止，没有证明 $\sum 1/(k+1)<\ln(n+1)$。
    - 把 $\ln(n+1)$ 错拆成 $\sum\ln\frac{k+2}{k+1}$，导致下标与左端不配。
    - 第二问只由 $f'(0)\ge0$ 得 $a\ge1/3$，未证明充分性。
    - 构造 $h(x)$ 后求导符号错误，漏掉分母平方导致单调性判断失败。
    - 忽略 $x\ge0$ 是端点区间，把 $f'(0)=0$ 当成必要条件而不是 $f'(0)\ge0$。
  similar_practice_query: 三角函数 sin(1/(n+1)) 对数增量 ln((n+1)/n) 和式代换 导数切线放缩 参数恒成立
