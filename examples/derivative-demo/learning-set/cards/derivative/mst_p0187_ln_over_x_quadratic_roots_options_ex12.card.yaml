solution:
  source_solution_summary: |
    原方程
    \[
    2e^2\ln^2x-3ex\ln x+x^2=0
    \]
    等价于
    \[
    2e^2\left(\frac{\ln x}{x}\right)^2-3e\left(\frac{\ln x}{x}\right)+1=0.
    \]
    令
    \[
    t=\frac{\ln x}{x},
    \]
    得
    \[
    2e^2t^2-3et+1=0
    \iff (et-1)(2et-1)=0,
    \]
    所以
    \[
    t=\frac1e\quad\text{或}\quad t=\frac1{2e}.
    \]
    设
    \[
    f(x)=\frac{\ln x}{x}\ (x>0),\quad
    f^{\prime}(x)=\frac{1-\ln x}{x^2}.
    \]
    则 $f$ 在 $(0,e)$ 递增、在 $(e,+\infty)$ 递减，且
    \[
    f(e)=\frac1e,\quad f(1)=0.
    \]
    因此 $0<x<1$ 时 $f(x)<0$，而待求水平值 $\frac1e,\frac1{2e}$ 均为正，故 $(0,1)$ 无根，C 正确。又
    \[
    f(e)=\frac1e,
    \]
    所以 $x=e$ 是实根，A 正确。

    对 B：$2\ln3<3\ln2$ 等价于
    \[
    \frac{\ln3}{3}<\frac{\ln2}{2}=\frac{\ln4}{4}.
    \]
    但 $3,4>e$ 且 $f$ 在 $(e,+\infty)$ 递减，所以
    \[
    \frac{\ln3}{3}=f(3)>f(4)=\frac{\ln4}{4},
    \]
    即 $2\ln3>3\ln2$，故 B 错误。

    对 D：令 $t=\frac1{2e}$ 的两根为 $x_1<x_2$，由图像有 $1<x_1<e<x_2$。源解给出
    \[
    \frac{\ln x_1}{x_1}=\frac{\ln x_2}{x_2}
    =\frac{\ln x_2-\ln x_1}{x_2-x_1}
    =\frac1{2e}
    >\frac{2}{x_1+x_2},
    \]
    得
    \[
    x_1+x_2>4e.
    \]
    全部实根和为
    \[
    e+x_1+x_2>e+4e=5e>3e,
    \]
    故 D 正确。综上选 ACD。
  key_steps:
    - step_id: step_1
      statement: 除以 $x^2$ 并换元，把原方程降为关于 $t$ 的二次方程。
      formula_trace:
        from: $2e^2\ln^2x-3ex\ln x+x^2=0$
        to: $2e^2t^2-3et+1=0,\ t=\frac{\ln x}{x}$
        operation: 两边同除以 $x^2(>0)$ 后令 $t=\frac{\ln x}{x}$。
        why: 把指对混合方程转成可因式分解的二次式。
      source_ref: page_0187_ex12_solution_main
    - step_id: step_2
      statement: 解出两个目标水平值并建立函数模型。
      formula_trace:
        from: $2e^2t^2-3et+1=0$
        to: $t=\frac1e$ 或 $t=\frac1{2e}$，且设 $f(x)=\frac{\ln x}{x}$
        operation: 因式分解 $(et-1)(2et-1)=0$。
        why: 后续只需研究曲线 $y=f(x)$ 与两条水平线的交点。
      source_ref: page_0187_ex12_solution_main
    - step_id: step_3
      statement: 用导数判定 $f$ 的单峰性，并先判 A、C。
      formula_trace:
        from: $f^{\prime}(x)=\frac{1-\ln x}{x^2}$
        to: $f$ 在 $(0,e)$ 递增、$(e,+\infty)$ 递减，$f(e)=\frac1e,\ f(1)=0$
        operation: 根据 $1-\ln x$ 的符号分区间讨论。
        why: 由 $f(1)=0$ 得 $(0,1)$ 上 $f<0$（C 对）；由 $f(e)=1/e$ 得 $x=e$ 是根（A 对）。
      source_ref: page_0187_ex12_solution_main
    - step_id: step_4
      statement: 把 B 的对数不等式改写为 $f(3)$ 与 $f(4)$ 比较。
      formula_trace:
        from: $2\ln3<3\ln2$
        to: $\frac{\ln3}{3}<\frac{\ln4}{4}$
        operation: 等价变形并识别为 $f(3)$ 与 $f(4)$。
        why: $3,4>e$ 时 $f$ 递减，故应有 $f(3)>f(4)$，因此 B 错。
      source_ref: page_0187_ex12_solution_main
    - step_id: step_5
      statement: 对 $t=\frac1{2e}$ 的两根用 ALG 不等式估计和。
      formula_trace:
        from: $\frac{\ln x_2-\ln x_1}{x_2-x_1}=\frac1{2e}>\frac{2}{x_1+x_2}$
        to: $x_1+x_2>4e$
        operation: 由分式不等式交叉相乘（各量均为正）。
        why: 直接给出两根和下界。
      source_ref: page_0187_ex12_solution_main
    - step_id: step_6
      statement: 合并三根之和并收束多选答案。
      formula_trace:
        from: $x=e$ 与 $x_1+x_2>4e$
        to: $e+x_1+x_2>5e>3e$，故 D 对，答案 ACD
        operation: 相加比较并与选项对照。
        why: 完成 D 的真值判断并汇总最终选项。
      source_ref: page_0188_ex12_solution_tail
teaching_card:
  student_title: 先换元再看图：$\frac{\ln x}{x}$ 多选判真
  what_it_trains: 训练“指对混合方程 -> 换元二次 -> 单峰函数交点计数”的完整链路，并结合不等式估计根和。
  recognition_cues:
    - 方程同时出现 $\ln x$、$x$ 及二次组合，且可整体除以 $x^2$。
    - 选项混合了“是否为根”“区间有无根”“对数大小比较”“根和范围”。
    - 出现 $\frac{\ln x}{x}$ 这类常见单峰函数模型。
  normalization_moves:
    - 统一除以 $x^2$，设 $t=\frac{\ln x}{x}$。
    - 先解 $t$ 的二次方程，再回到函数 $f(x)$ 图像。
    - 把对数比较改写为同类函数值比较。
    - 对根和题先做两根和估计，再与总和目标比较。
  common_failures:
    - 把 $f(e)=1/e$ 误当成“对应两个 $x$”，忽略极大值点唯一性。
    - B 选项直接用数值近似却方向算反。
    - D 选项只得到 $x_1,x_2$ 存在，却没有完成和的下界推导。
  similar_practice_query: lnx/x 换元 二次方程 多选 根个数 根和不等式
