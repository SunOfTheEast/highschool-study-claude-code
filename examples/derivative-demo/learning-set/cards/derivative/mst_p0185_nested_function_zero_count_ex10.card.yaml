solution:
  source_solution_summary: |
    设外函数零点集先被“竖着”读出，再到内函数图像中“横着”作水平线数交点。
    对 A：$f[g(x)]=0$ 等价于 $g(x)$ 取到 $f$ 的三个零点值，故有 3 解；A 对。
    对 B：$g[f(x)]=0$ 等价于 $f(x)$ 取到 $g$ 的唯一零点值，图像只交 1 次；B 错。
    对 C：$f[f(x)]=0$ 需考察 $f(x)$ 取到 $f$ 的三个零点值，源图计数明显不是 9；C 错。
    对 D：$g[g(x)]=0$ 等价于 $g(x)$ 取到 $g$ 的唯一零点值，图像只交 1 次；D 对。
    故选 AD。
  key_steps:
    - step_id: step_1
      statement: 统一复合方程的计数规则：先找外函数零点，再在内函数图像上作对应水平线。
      formula_trace:
        from: $F(H(x))=0$
        to: $H(x)\in Z_F$（其中 $Z_F$ 为外函数 $F$ 的零点集）
        operation: 把“外层等于 0”转写成“内层取外层零点值”。
        why: 这一步把复合方程解个数问题转成图像交点计数问题。
      source_ref: page_0185_ex10_solution_A
    - step_id: step_2
      statement: 判断 A：$f[g(x)]=0$ 有且仅有三个解。
      formula_trace:
        from: $f[g(x)]=0\iff g(x)\in\{x_1,x_2,x_3\}$
        to: 在 $y=g(x)$ 上与 $y=x_1,y=x_2,y=x_3$ 共得到 3 个交点
        operation: 先取外函数 $f$ 的三个零点，再把三个零点值回代到内函数 $g$ 图像。
        why: 每条水平线与源图中的 $y=g(x)$ 对应一个交点，总数为 3。
      source_ref: page_0185_ex10_solution_A
    - step_id: step_3
      statement: 判断 B：$g[f(x)]=0$ 不是三个解。
      formula_trace:
        from: $g[f(x)]=0\iff f(x)=\xi$（$\xi$ 为 $g$ 的唯一零点）
        to: 水平线 $y=\xi$ 与 $y=f(x)$ 仅 1 个交点
        operation: 先取外函数 $g$ 的零点，再在内函数 $f$ 图像上数交点。
        why: 源图 3-4 给出唯一交点，因此 B 错。
      source_ref: page_0186_ex10_solution_BCD
    - step_id: step_4
      statement: 判断 C：$f[f(x)]=0$ 不可能有九个解。
      formula_trace:
        from: $f[f(x)]=0\iff f(x)\in\{x_1,x_2,x_3\}$
        to: 三条水平线与内函数图像的总交点数明显小于 9（源文指出仅 $y=x_2$ 给出 3 个交点）
        operation: 沿 A 的同一路线，把外函数 $f$ 的零点值回代到内函数图像继续计数。
        why: 只需判定“并非九解”即可否定 C。
      source_ref: page_0186_ex10_solution_BCD
    - step_id: step_5
      statement: 判断 D：$g[g(x)]=0$ 有且仅有一个解。
      formula_trace:
        from: $g[g(x)]=0\iff g(x)=\xi$（$\xi$ 为 $g$ 的唯一零点）
        to: 水平线 $y=\xi$ 与 $y=g(x)$ 仅 1 个交点
        operation: 外内同为 $g$，先取外零点，再回内图计数。
        why: 源图 7-8 显示唯一交点，所以 D 对。
      source_ref: page_0186_ex10_solution_BCD
    - step_id: step_6
      statement: 汇总真值：A 对，B 错，C 错，D 对。
      formula_trace:
        from: A 对，B 错，C 错，D 对
        to: 答案 AD
        operation: 多选题逐项真值合并。
        why: 与源页结论一致。
      source_ref: page_0186_ex10_solution_BCD
teaching_card:
  student_title: 复合方程先外后内数交点
  what_it_trains: 训练“外函数定零点、内函数作水平线”的嵌套函数零点计数套路，并在多选场景下快速逐项判真伪。
  recognition_cues:
    - 题干出现 $f(g(x))$、$g(f(x))$ 这类复合方程。
    - 已给函数图像且强调定义域/值域范围。
    - 问法是“有且仅有几个解”，本质是交点计数。
  normalization_moves:
    - 先把外函数零点读成若干目标水平值。
    - 再在内函数图像画这些水平线并数交点。
    - 四个选项复用同一模板，避免逐项重新发明方法。
  common_failures:
    - 把“先外后内”做反，直接在错误图像上数交点。
    - 忽略“有且仅有”中的“仅有”，只验证存在性不验证个数。
    - 看到 C 项数字大（9）就凭感觉判断，不回到图像计数。
  similar_practice_query: 嵌套函数 零点个数 先外后内 内函数横着走 外函数竖着走 多选
