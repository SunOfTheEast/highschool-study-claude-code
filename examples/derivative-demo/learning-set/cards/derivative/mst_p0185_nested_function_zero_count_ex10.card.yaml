stem: |-
  （多选）定义域和值域均为 $[-a,a]$（常数 $a>0$）的函数 $y=f(x)$ 和 $y=g(x)$ 的图象如图所示，下列四个命题中正确的结论是（  ）
  A. 方程 $f[g(x)]=0$ 有且仅有三个解
  B. 方程 $g[f(x)]=0$ 有且仅有三个解
  C. 方程 $f[f(x)]=0$ 有且仅有九个解
  D. 方程 $g[g(x)]=0$ 有且仅有一个解
answer: |
  AD

  设外函数零点集先被“竖着”读出，再到内函数图像中“横着”作水平线数交点。
  对 A：$f[g(x)]=0$ 等价于 $g(x)$ 取到 $f$ 的三个零点值，故有 3 解；A 对。
  对 B：$g[f(x)]=0$ 等价于 $f(x)$ 取到 $g$ 的唯一零点值，图像只交 1 次；B 错。
  对 C：$f[f(x)]=0$ 需考察 $f(x)$ 取到 $f$ 的三个零点值，源图计数明显不是 9；C 错。
  对 D：$g[g(x)]=0$ 等价于 $g(x)$ 取到 $g$ 的唯一零点值，图像只交 1 次；D 对。
  故选 AD。
