teaching_card:
  student_title: 两段模板拼成三数全序
  what_it_trains: 训练“对数先夹、三角再比、最后传递”的标准三步排序流程。
  recognition_cues:
    - 出现 $\ln2$ 与 $\sin1$ 的跨函数比较。
    - 另一个量是简单分数阈值（如 $\frac{2}{3}$）。
    - 选项是三数全序判断。
  normalization_moves:
    - 先把 $\ln2$ 夹在两个可算分数之间。
    - 再把 $\sin1$ 转成与 $\ln2$ 的直接比较。
    - 最后用传递律收尾。
  common_failures:
    - 把 $\ln x$ 双边不等式方向写错。
    - 只得到 $b>a$，漏掉 $c$ 与 $b$ 的比较。
    - 误把“局部不等式”当作数值近似公式随意代点。
