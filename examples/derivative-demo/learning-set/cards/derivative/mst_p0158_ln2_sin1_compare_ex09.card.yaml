    \[
    \frac{1}{2}\left(x-\frac{1}{x}\right)>\ln x>\frac{2(x-1)}{x+1}\quad(x>1),
    \]
    取 $x=2$ 得
    \[
    \frac{1}{2}\left(2-\frac{1}{2}\right)>\ln2>\frac{2(2-1)}{2+1},
    \]
    即
    \[
    \frac{3}{4}>b>\frac{2}{3}=a,
    \]
    所以 $b>a$。
    再比较 $c$ 与 $b$。利用
    \[
    \sin x>\ln(1+x)\quad(0<x<1),
    \]
    得
    \[
