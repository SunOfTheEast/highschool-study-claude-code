    - step_id: step_1
      statement: 代入 $x=2$，先定 $b$ 在 $(\frac{2}{3},\frac{3}{4})$ 内。
      formula_trace:
        from: $b=\ln2$
        to: $\frac{3}{4}>b>\frac{2}{3}=a$
