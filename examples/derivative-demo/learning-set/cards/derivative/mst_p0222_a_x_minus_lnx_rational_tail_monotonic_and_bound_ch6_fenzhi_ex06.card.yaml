stem: |-
  （2016 · 山东 T20）已知 $f(x)=a(x-\ln x)+\frac{2x-1}{x^2}$，$a\in\mathbf R$。
  1. 讨论 $f(x)$ 的单调性。
  2. 当 $a=1$ 时，证明 $f(x)>f^{\prime}(x)+\frac32$ 对于任意的 $x\in[1,2]$ 成立。
answer: |-
  （1）见解析分类；（2）证明见解析。

  求导得 $f^{\prime}(x)=a(1-\frac1x)+\frac{2-2x}{x^3} =\frac{(x-1)(ax^2-2)}{x^3}$，定义域 $x>0$。若 $a\leqslant0$，则 $ax^2-2<0$，所以 $(0,1)$ 增、$(1,+\infty)$ 减。 若 $0<a<2$，令 $r=\sqrt{2/a}>1$，则 $(0,1)$、$(r,+\infty)$ 增， $(1,r)$ 减。若 $a=2$，$f^{\prime}(x)\geqslant0$，在 $(0,+\infty)$ 上增。若 $a>2$，令 $r=\sqrt{2/a}<1$，则 $(0,r)$、$(1,+\infty)$ 增，$(r,1)$ 减。第二问当 $a=1$ 时， $F(x)=f(x)-f^{\prime}(x)-\frac32 =x-\ln x+\frac3x+\frac1{x^2}-\frac2{x^3}-\frac52$。 令 $g(x)=x-\ln x$，在 $[1,2]$ 上 $g(x)\geqslant g(1)=1$； 令 $h(x)=\frac2{x^3}-\frac1{x^2}-\frac3x+\frac52$，则 $F(x)=g(x)-h(x)$。取 $t=1/x\in[1/2,1]$ 后 $h(t)=2t^3-t^2-3t+\frac52$，source 判定 $h_{\max}=h(1/2)=1$， 即 $x=2$ 取最大。于是 $F(x)\geqslant1-1=0$，且 $g$ 与 $h$ 的取等点 分别为 $x=1$ 与 $x=2$，不能同时取等，所以 $F(x)>0$。
