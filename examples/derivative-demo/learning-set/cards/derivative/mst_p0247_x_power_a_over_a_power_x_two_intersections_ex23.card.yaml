original_problem:
  stem: （2021 · 甲卷第二问）已知 $a>0$ 且 $a\ne1$，函数 $f(x)=\frac{x^a}{a^x}(x>0)$。若曲线 $y=f(x)$ 与直线 $y=1$ 有且仅有两个交点，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\in(1,e)\cup(e,+\infty)$。
  fidelity_notes:
    - 单问参数范围题，无选项。
    - “两个交点”转化为方程 $x^a=a^x$ 在正数域内有两个不同根。
solution:
  source_solution_summary: 由 $f(x)=1$ 得 $x^a=a^x$，即 $a\ln x=x\ln a$，转成 $g(x)=\frac{\ln a}{a}x-\ln x=0$。当 $0<a<1$ 时， $g'(x)<0$，至多一个零点。故只需考虑 $a>1$。此时 $g$ 先减后增，极小值点为 $x=\frac a{\ln a}$，极小值 $1-\ln\frac a{\ln a}$。要有两个交点，需 $\frac a{\ln a}>e$。利用 $h(x)=\frac x{\ln x}$ 在 $(1,e)$ 递减、$(e,+\infty)$ 递增且最小值为 $e$，得到 $a\in(1,e)\cup(e,+\infty)$，排除 $a=e$ 的切点情形。
  key_steps:
    - step_id: step_1
      statement: 先把幂指数方程取对数。
      formula_trace:
        from: $\frac{x^a}{a^x}=1$
        to: $a\ln x=x\ln a$
        operation: 两边取对数。
        why: 把 $x$ 同时在底数和指数中的结构降成普通函数方程。
      source_ref: page_0247_ex23_main_solution
    - step_id: step_2
      statement: 化成熟悉的 $mx-\ln x$ 找点问题。
      formula_trace:
        from: $a\ln x=x\ln a$
        to: $g(x)=\frac{\ln a}{a}x-\ln x=0$
        operation: 除以 $a$ 并移项。
        why: 这是 source 点名的 $mx-\ln x$ 结构。
      source_ref: page_0247_ex23_main_solution
    - step_id: step_3
      statement: 排除 $0<a<1$。
      formula_trace:
        from: $g^\prime(x)=\frac{\ln a}{a}-\frac1x$
        to: $0<a<1\Rightarrow g^\prime(x)<0$
        operation: 按 $\ln a$ 的符号判导数。
        why: 单调函数不可能有两个不同零点。
      source_ref: page_0247_ex23_main_solution
    - step_id: step_4
      statement: 把两个零点条件转成极小值小于零。
      formula_trace:
        from: $x=\frac a{\ln a}$
        to: $g_{\min}=1-\ln\frac a{\ln a}<0$
        operation: 代入极小值点。
        why: 先减后增函数有两个零点，当且仅当谷底低于 $x$ 轴。
      source_ref: page_0247_ex23_main_solution
    - step_id: step_5
      statement: 用 $x/\ln x$ 的最小值解参数。
      formula_trace:
        from: $1-\ln\frac a{\ln a}<0$
        to: $\frac a{\ln a}>e$
        operation: 指数化并引入 $h(x)=x/\ln x$。
        why: 比较 $a$ 和 $e$ 两侧的参数区间。
      source_ref: page_0247_ex23_main_solution
teaching_card:
  student_title: 把 $x^a=a^x$ 变成 $mx-\ln x$
  what_it_trains: 训练把底数和指数互相含参的方程取对数，转成可求导的标准找点问题。
  recognition_cues:
    - 题目里同时出现 $x^a$ 和 $a^x$。
    - 问曲线和 $y=1$ 有两个交点。
    - 取对数后出现 $a\ln x=x\ln a$。
    - 核心函数是 $\frac{\ln a}{a}x-\ln x$。
  normalization_moves:
    - 先转方程 $x^a=a^x$。
    - 取对数降成 $mx-\ln x$。
    - 用极小值是否小于 0 判断两个交点。
    - 用 $x/\ln x$ 的最小值解参数。
  common_failures:
    - 忘记 $x>0$ 才能取对数。
    - 没有排除 $0<a<1$ 的单调情形。
    - 把 $a=e$ 的切点情形误算成两个交点。
  similar_practice_query: x^a=a^x 两个交点 取对数 mx-lnx x/lnx 参数范围
