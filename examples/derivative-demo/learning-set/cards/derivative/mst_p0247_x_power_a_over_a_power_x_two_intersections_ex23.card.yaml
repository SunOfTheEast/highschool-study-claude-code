stem: （2021 · 甲卷第二问）已知 $a>0$ 且 $a\ne1$，函数 $f(x)=\frac{x^a}{a^x}(x>0)$。若曲线 $y=f(x)$ 与直线 $y=1$ 有且仅有两个交点，求 $a$ 的取值范围。
answer: |-
  $a\in(1,e)\cup(e,+\infty)$。

  由 $f(x)=1$ 得 $x^a=a^x$，即 $a\ln x=x\ln a$，转成 $g(x)=\frac{\ln a}{a}x-\ln x=0$。当 $0<a<1$ 时， $g'(x)<0$，至多一个零点。故只需考虑 $a>1$。此时 $g$ 先减后增，极小值点为 $x=\frac a{\ln a}$，极小值 $1-\ln\frac a{\ln a}$。要有两个交点，需 $\frac a{\ln a}>e$。利用 $h(x)=\frac x{\ln x}$ 在 $(1,e)$ 递减、$(e,+\infty)$ 递增且最小值为 $e$，得到 $a\in(1,e)\cup(e,+\infty)$，排除 $a=e$ 的切点情形。
