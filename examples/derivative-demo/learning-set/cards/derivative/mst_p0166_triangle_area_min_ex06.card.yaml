stem: |-
  （2023 · 无为市月考 T12）已知直线 y=a 分别与直线 y=2x-2 和曲线 y=2e^x+x 相交于点 A，B，点 C 在直线 y=2x-2 上，且 BC ⟂ AB，则三角形 ABC 的面积最小值为（  ）
  A. (1/2)(3+ln2)^2
  B. (1/4)(3+ln2)^2
  C. (1/8)(3+ln2)^2
  D. 3+2ln2
answer: |-
  B

  法一：A,C 在 y=2x-2 上，而 AB 在 y=a 上为水平线，且 BC ⟂ AB， 故 BC 垂直、AB 水平，结合直线 AC 斜率 2 得 tan∠BAC=2=BC/AB， 即 BC=2AB。面积 S=AB*BC/2=BC^2/4，只需最小化 BC。设 B 的横坐标为 x， 则 BC=2e^x+x-(2x-2)=2e^x-x+2=:h(x)。h^{\prime}(x)=2e^x-1， h^{\prime}(x)=0 得 x=-ln2，h_min=3+ln2，所以 S_min=(1/4)(3+ln2)^2。法二用 y=2e^x+x=e^{x+ln2}+x>=2x+1+ln2 构造与 y=2x-2 平行的切线，也得到同一结果。故选 B。
