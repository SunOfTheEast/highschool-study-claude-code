solution:
  source_solution_summary: 法一：A,C 在 y=2x-2 上，而 AB 在 y=a 上为水平线，且 BC ⟂ AB， 故 BC 垂直、AB 水平，结合直线 AC 斜率 2 得 tan∠BAC=2=BC/AB， 即 BC=2AB。面积 S=AB*BC/2=BC^2/4，只需最小化 BC。设 B 的横坐标为 x， 则 BC=2e^x+x-(2x-2)=2e^x-x+2=:h(x)。h^{\prime}(x)=2e^x-1， h^{\prime}(x)=0 得 x=-ln2，h_min=3+ln2，所以 S_min=(1/4)(3+ln2)^2。法二用 y=2e^x+x=e^{x+ln2}+x>=2x+1+ln2 构造与 y=2x-2 平行的切线，也得到同一结果。故选 B。
  key_steps:
    - step_id: step_1
      statement: 把面积最小值转成 BC 的最小值。
      formula_trace:
        from: A,C 在 y=2x-2 上，AB 水平，BC ⟂ AB
        to: tan∠BAC=2=BC/AB => BC=2AB => S=(AB*BC)/2=BC^2/4
        operation: 用斜率和直角关系建立边长比例。
        why: S 与 BC 单调对应，只需优化一元量 BC。
      source_ref: page_0167:line 21
    - step_id: step_2
      statement: 写出 BC 的函数表达式。
      formula_trace:
        from: B 在 y=2e^x+x，C 在 y=2x-2，且 BC 竖直
        to: BC=2e^x+x-(2x-2)=2e^x-x+2=:h(x)
        operation: 同横坐标下取纵坐标差。
        why: 把几何量最值化为单变量函数最值。
      source_ref: page_0167:line 21
    - step_id: step_3
      statement: 求 h(x) 最小值。
      formula_trace:
        from: h(x)=2e^x-x+2
        to: h^{\prime}(x)=2e^x-1=0 => x=-ln2, h_min=3+ln2
        operation: 求导并在驻点处代值。
        why: BC 最小值直接决定面积最小值。
      source_ref: page_0167:line 21
    - step_id: step_4
      statement: 回代得到面积最小值。
      formula_trace:
        from: S=BC^2/4, BC_min=3+ln2
        to: S_min=(1/4)(3+ln2)^2
        operation: 把最小 BC 代入面积表达式。
        why: 得到选项对应数值。
      source_ref: page_0167:line 21
    - step_id: step_5
      statement: 法二用平行切线校验同一结果。
      formula_trace:
        from: 2e^x+x=e^{x+ln2}+x
        to: 2e^x+x>=2x+1+ln2，平行线距离法也给出 S_min=(1/4)(3+ln2)^2
        operation: 套 e^u>=u+1 并构造与 y=2x-2 平行的切线。
        why: 源页给出第二条独立路径，增强结论可靠性。
      source_ref: page_0167:line 23
teaching_card:
  student_title: 先把面积改成 BC^2/4，再最小化 2e^x-x+2
  what_it_trains: 训练把几何最值题降维：先用几何比例把面积写成单边函数，再用导数求单变量最小值； 同时能用平行切线法做交叉验证。
  recognition_cues:
    - 题目给出 AB 水平、BC 垂直和 AC 固定斜率。
    - 面积目标可先写成边长乘积。
    - 曲线 y=2e^x+x 与直线 y=2x-2 的纵向差自然出现。
  normalization_moves:
    - 由 tan∠BAC=2 得 BC=2AB。
    - 把 S 写成 BC^2/4。
    - 设 h(x)=2e^x-x+2 并求 h_min。
    - 可用平行切线 y=2x+1+ln2 做复核。
  common_failures:
    - 直接在 A,B,C 三点坐标上硬算面积，计算量过大。
    - 把 BC 误写成 2e^x+x-(2x+2) 等符号错误。
    - 求出 BC_min 后忘记还要平方再除以 4。
  similar_practice_query: 曲线直线 三角形面积最小值 BC 函数法 平行切线
