solution:
  source_solution_summary: 源解构造与 $f(x)$ 同零点的函数 $g(x)=x-\ln(ax)-\frac{e^{x-1}}{ax} =\ln\frac{e^x}{ax}-\frac1e\frac{e^x}{ax}$。令 $t=\frac{e^x}{ax}$，则 $g(t)=\ln t-\frac te$。 这个模块函数只有唯一零点 $t=e$，所以要使原函数有零点，只需 $\frac{e^x}{ax}=e$ 有解，即 $a=\frac{e^x}{ex}=\frac1e\frac{e^x}{x}$ 有解。 由于 $\frac{e^x}{x}$ 在 $x=1$ 处最小为 $e$，故 $a\ge1$，选 D。
  key_steps:
    - step_id: step_1
      statement: 构造同零点函数。
      formula_trace:
        from: $f(x)=x^2-x\ln(ax)-\frac{e^{x-1}}a$
        to: $g(x)=x-\ln(ax)-\frac{e^{x-1}}{ax}$
        operation: 在 $x>0$ 上除以 $x$，不改变零点。
        why: 降低幂次后能出现统一的指对比值。
      source_ref: page_0183
    - step_id: step_2
      statement: 把指对组合压成模块变量。
      formula_trace:
        from: $x-\ln(ax)-\frac{e^{x-1}}{ax}$
        to: $\ln\frac{e^x}{ax}-\frac1e\frac{e^x}{ax}$
        operation: 用 $x-\ln(ax)=\ln\frac{e^x}{ax}$，并整理指数项。
        why: 两个部分都依赖同一个 $t=\frac{e^x}{ax}$。
      source_ref: page_0183
    - step_id: step_3
      statement: 解模块零点并还原参数。
      formula_trace:
        from: $g(t)=\ln t-\frac te=0$
        to: $t=e,\quad a=\frac{e^x}{ex}\ge1$
        operation: 由模块函数唯一零点还原 $t=\frac{e^x}{ax}$。
        why: 参数范围由 $\frac{e^x}{ex}$ 的值域给出。
      source_ref: page_0183
teaching_card:
  student_title: 半分离后找同一个通配符
  what_it_trains: 训练在参数藏在对数和指数里的题中，先除掉公共正因子，再把两块表达式合成同一个变量。
  recognition_cues:
    - 题目只问“存在零点”。
    - 表达式有 $x\ln(ax)$ 和 $\frac{e^{x-1}}a$。
    - 源解出现“零点相同”和 $t=\frac{e^x}{ax}$。
  normalization_moves:
    - 先除以 $x$。
    - 把 $x-\ln(ax)$ 合成 $\ln\frac{e^x}{ax}$。
    - 令 $t=\frac{e^x}{ax}$。
  common_failures:
    - 直接对原函数求导，参数和指数对数混在一起。
    - 看不出 $x-\ln(ax)$ 的对数合并。
    - 还原 $a=\frac{e^x}{ex}$ 后漏掉最小值。
  similar_practice_query: 参变半分离 xln(ax) e^{x-1}/a 同零点 t=e^x/(ax)
