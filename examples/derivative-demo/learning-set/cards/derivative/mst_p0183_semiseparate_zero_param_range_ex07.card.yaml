stem: |-
  （2023 · 朔州应县一中高二期末 T7）函数 $f(x)=x^2-x\ln(ax)-\frac{e^{x-1}}{a}\ (a>0)$ 在 $(0,+\infty)$ 内存在零点，则实数 $a$ 的取值范围是（  ）
  A. $[e,+\infty)$
  B. $[1,e)$
  C. $(0,1]$
  D. $[1,+\infty)$
answer: |-
  D

  源解构造与 $f(x)$ 同零点的函数 $g(x)=x-\ln(ax)-\frac{e^{x-1}}{ax} =\ln\frac{e^x}{ax}-\frac1e\frac{e^x}{ax}$。令 $t=\frac{e^x}{ax}$，则 $g(t)=\ln t-\frac te$。 这个模块函数只有唯一零点 $t=e$，所以要使原函数有零点，只需 $\frac{e^x}{ax}=e$ 有解，即 $a=\frac{e^x}{ex}=\frac1e\frac{e^x}{x}$ 有解。 由于 $\frac{e^x}{x}$ 在 $x=1$ 处最小为 $e$，故 $a\ge1$，选 D。
