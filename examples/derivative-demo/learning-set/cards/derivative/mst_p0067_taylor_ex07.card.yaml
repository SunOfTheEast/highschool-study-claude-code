stem: |-
  在高等数学中，我们将 y=f(x) 在 x=x_0 处可以用一个多项式函数近似表示，具体形式为： f(x)=f(x_0)+f'(x_0)(x-x_0)+\frac{f''(x_0)}{2!}(x-x_0)^2+\cdots+ \frac{f^{(n)}(x_0)}{n!}(x-x_0)^n+\cdots（其中 f^{(n)}(x) 表示 f(x) 的 n 次导数，n\geqslant3，n\in\mathbf{N}^*），以上公式称为函数 f(x) 在 x=x_0 处的泰勒展开式。当 x_0=0 时泰勒展开式也称为麦克劳林公式。比如 e^x 在 x=0 处的麦克劳林公式为 e^x=1+x+\frac{1}{2!}x^2+\frac{1}{3!}x^3+\cdots+\frac{1}{n!}x^n+\cdots。 由此当 x\geqslant0 时，可以得到 e^x\geqslant1+x， e^x\geqslant1+x+\frac12x^2， e^x\geqslant1+x+\frac12x^2+\frac16x^3，\cdots。请利用上述公式和所学知识完成下列问题：
  (1). 写出 \sin x 在 x=0 处的泰勒展开式。
  (2). 根据泰勒公式估算 \cos\frac12 的值，精确到小数点后两位。
  (3). 若 \forall x\in\left(0,\frac32\right)，e^{a\sin x}>x+1 恒成立， 求 a 的范围。（参考数据 \ln\frac52\approx0.9）
answer: |-
  (1) \sin x=x-\frac{x^3}{3!}+\frac{x^5}{5!}+\cdots+ \frac{(-1)^{n-1}}{(2n-1)!}x^{2n-1}+\cdots； (2) \cos\frac12\approx0.88；(3) a\in[1,+\infty)。

  第 (1) 问由 \sin x、\cos x 的导数循环写出 \sin x=x-\frac{x^3}{3!}+\frac{x^5}{5!}-\cdots。第 (2) 问展开 \cos x=1-\frac{x^2}{2!}+\frac{x^4}{4!}-\cdots，交错估计得 0.875<\cos\frac12<0.878，所以精确到两位小数为 0.88。第 (3) 问先证 \sin x>x-\frac16x^3，再证 g(x)=x-\frac16x^3-\ln(x+1)>0 于 (0,\frac32) 恒成立；若 a\geq1， 则 a\sin x\geq\sin x>\ln(x+1)，从而 e^{a\sin x}>x+1。若 a<1， h(x)=a\sin x-\ln(x+1) 在 0 右侧因 h'(0)=a-1<0 而先小于 0， 与恒成立矛盾。故 a\in[1,+\infty)。
