original_problem:
  stem: 在高等数学中，我们将 y=f(x) 在 x=x_0 处可以用一个多项式函数近似表示，具体形式为： f(x)=f(x_0)+f'(x_0)(x-x_0)+\frac{f''(x_0)}{2!}(x-x_0)^2+\cdots+ \frac{f^{(n)}(x_0)}{n!}(x-x_0)^n+\cdots（其中 f^{(n)}(x) 表示 f(x) 的 n 次导数，n\geqslant3，n\in\mathbf{N}^*），以上公式称为函数 f(x) 在 x=x_0 处的泰勒展开式。当 x_0=0 时泰勒展开式也称为麦克劳林公式。比如 e^x 在 x=0 处的麦克劳林公式为 e^x=1+x+\frac{1}{2!}x^2+\frac{1}{3!}x^3+\cdots+\frac{1}{n!}x^n+\cdots。 由此当 x\geqslant0 时，可以得到 e^x\geqslant1+x， e^x\geqslant1+x+\frac12x^2， e^x\geqslant1+x+\frac12x^2+\frac16x^3，\cdots。请利用上述公式和所学知识完成下列问题：
  parts: *a1
