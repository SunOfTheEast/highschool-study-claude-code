original_problem:
  stem: （2025 · 新高考二卷）若 $x=2$ 是函数 $f(x)=(x-1)(x-2)(x-a)$ 的极值点，则 $f(0)=$________。
  parts: *a1
  choices: []
  answer: $-4$
  fidelity_notes:
    - 源题为空格填空题，无选项。
    - 源页题干只给出 $x=2$ 是极值点；解析使用必要条件 $f^{\prime}(2)=0$。
solution:
  source_solution_summary: |
    对 $f(x)=(x-1)(x-2)(x-a)$ 求导，得
    $f^{\prime}(x)=(x-1)(x-2)+(2x-3)(x-a)$。因为 $x=2$ 是极值点，所以必须有 $f^{\prime}(2)=0$，即 $2-a=0$，从而 $a=2$。代回原函数，$f(0)=(0-1)(0-2)(0-2)=-4$。
  key_steps:
    - step_id: step_1
      statement: 对三因式乘积求导。
      formula_trace:
        from: $f(x)=(x-1)(x-2)(x-a)$
        to: $f^{\prime}(x)=(x-1)(x-2)+(2x-3)(x-a)$
        operation: 把 $(x-1)(x-2)$ 看作一组，使用乘积求导。
        why: 极值点条件要落到导数为零上。
      source_ref: page_0056_ex15_solution
    - step_id: step_2
      statement: 由 $x=2$ 是极值点提取必要条件。
      formula_trace:
        from: $x=2\ \text{是极值点}$
        to: $f^{\prime}(2)=2-a=0$
        operation: 把 $x=2$ 代入导函数。
        why: 可导函数在内点取得极值时导数为零。
      source_ref: page_0056_ex15_solution
    - step_id: step_3
      statement: 求出参数并代回求 $f(0)$。
      formula_trace:
        from: $2-a=0$
        to: $a=2,\quad f(0)=(0-1)(0-2)(0-2)=-4$
        operation: 解一次方程后代入原函数。
        why: 题目最终要求的是函数值，不是参数本身。
      source_ref: page_0056_ex15_solution
teaching_card:
  student_title: 极值点先让导数等于零
  what_it_trains: 训练从“某点是极值点”中提取导数条件，先定参数再回到目标函数值。
  recognition_cues:
    - 题干给出一个具体极值点 $x=2$。
    - 函数含参数 $a$，但最终问的是 $f(0)$。
    - 原式保持因式分解形态，代入和求导都很快。
  normalization_moves:
    - 先求 $f^{\prime}(x)$。
    - 把 $x=2$ 代入导函数，得到关于 $a$ 的方程。
    - 用定出的 $a$ 计算 $f(0)$。
  common_failures:
    - 把 $f(2)=0$ 当成极值点条件，忽略 $f^{\prime}(2)=0$。
    - 展开三次式后求导出错。
    - 只答 $a=2$，没有计算题目要求的 $f(0)$。
  similar_practice_query: 三次函数 极值点 导数为零 定参 求函数值
