original_problem:
  stem: （2021 · 天津）已知 $a>0$，函数 $f(x)=ax-xe^x$。
  parts: *a1
  choices: []
  answer: 第(1)问：$y=(a-1)x$。第(2)问：存在唯一极值点。第(3)问：$b\ge-e$。
  fidelity_notes:
    - 无选项。
    - 第(3)问沿用 source 记号：同一个字母 $a$ 既是函数参数，也在“存在 $a$”中被选择；结论只求 $b$ 的范围。
solution:
  source_solution_summary: 第(1)问 $f(0)=0$，$f^\prime(x)=a-(x+1)e^x$，所以 $f^\prime(0)=a-1$，切线为 $y=(a-1)x$。第(2)问令 $\phi(x)=(x+1)e^x$，当 $x\le-1$ 时 $f^\prime(x)>0$；当 $x>-1$ 时，$\phi$ 从 0 严格增到 $+\infty$，故存在唯一 $x_0>-1$ 使 $\phi(x_0)=a$，于是 $f^\prime$ 由正变负， $f$ 存在唯一极大值点。第(3)问若存在 $a$ 使 $f(x)\le a+b$ 恒成立，代 $x=1$ 得 $a-e\le a+b$，故 $b\ge-e$。反过来取 $a=2e$，只需证 $F(x)=xe^x-2e(x-1)-e\ge0$；因 $F(1)=0$， $F^\prime(x)=(x+1)e^x-2e$ 在 $x=1$ 左负右正，所以 $F(x)\ge F(1)=0$，从而 $b\ge-e$ 均可行。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：写出切线。
      formula_trace:
        from: $f(x)=ax-xe^x$
        to: $f(0)=0$，$f^\prime(0)=a-1$，$y=(a-1)x$
        operation: 求导并代入切点。
        why: 切线方程由切点和切线斜率确定。
      source_ref: page_0265_ex5_solution_start
    - step_id: step_2
      statement: 第(2)问：把极值点转成导函数零点。
      formula_trace:
        from: $f^\prime(x)=a-(x+1)e^x$
        to: 求 $\phi(x)=(x+1)e^x$ 与水平线 $a$ 的交点
        operation: 等效零点方程。
        why: 证明唯一极值点，本质是证明 $f^\prime$ 只有一个变号零点。
      source_ref: page_0265_ex5_solution_start
    - step_id: step_3
      statement: 第(2)问：证明唯一变号。
      formula_trace:
        from: $x\le-1$ 与 $x>-1$ 分段
        to: $x\le-1$ 时 $f^\prime>0$；$x>-1$ 时 $\phi$ 严格递增且从 0 到 $+\infty$
        operation: 分段判号与单调性。
        why: $a>0$ 保证唯一交点 $x_0>-1$，因此 $f$ 只有一个极大值点。
      source_ref: page_0265_ex5_solution_start
    - step_id: step_4
      statement: 第(3)问：先用显点 $x=1$ 得必要条件。
      formula_trace:
        from: $f(1)=a-e\le a+b$
        to: $b\ge-e$
        operation: 代入显点。
        why: 恒成立问题先找能直接给出边界的显点。
      source_ref: page_0266_ex5_solution_continuation
    - step_id: step_5
      statement: 第(3)问：取切线参数回证充分性。
      formula_trace:
        from: $F(x)=xe^x-a(x-1)-e$，$F(1)=0$
        to: 令 $F^\prime(1)=0$ 得 $a=2e$
        operation: 已知点切线极点效应。
        why: 让 $x=1$ 成为 $F$ 的全局最小点，才能证明 $F\ge0$。
      source_ref: page_0266_ex5_solution_continuation
    - step_id: step_6
      statement: 第(3)问：证明 $a=2e$ 时 $F(x)\ge0$。
      formula_trace:
        from: $F^\prime(x)=(x+1)e^x-2e$，$F^\prime(1)=0$
        to: $x<1$ 时 $F^\prime<0$，$x>1$ 时 $F^\prime>0$，$F(x)\ge F(1)=0$
        operation: 判导函数单调并确定最小值。
        why: 完成 $b=-e$ 的充分性，进而得到所有 $b\ge-e$。
      source_ref: page_0266_ex5_solution_continuation
teaching_card:
  student_title: 双参数恒成立：先用显点卡住 $b$，再选切线参数回证
  what_it_trains: 训练双参数极点效应：一个参数用于构造切线接触，另一个参数由显点给出边界。
  recognition_cues:
    - 题目有 $f(x)=ax-xe^x$，同时又问“存在 $a$”使恒成立。
    - 第(3)问右侧是 $a+b$，代 $x=1$ 会直接抵消 $a$。
    - source 图像把 $xe^x$ 和直线 $a(x-1)$ 的切线距离作为核心。
  normalization_moves:
    - 第(2)问先证明导函数只有一个零点。
    - 第(3)问先代 $x=1$ 得 $b\ge-e$。
    - 再取 $a=2e$，让 $F(1)=F^\prime(1)=0$，证明 $F$ 全局非负。
  common_failures:
    - 把第(3)问的“存在 $a$”误读成对所有 $a>0$ 都成立。
    - 只得到 $b\ge-e$ 的必要性，没有构造 $a=2e$ 回证。
    - 证明唯一极值点时没有说明 $f^\prime$ 的唯一变号。
    - 把 $F^\prime$ 单调性说完后忘记转回 $F(x)\ge0$。
  similar_practice_query: 双参数极点效应 xe^x a(x-1) b范围 x=1 显点 a=2e
