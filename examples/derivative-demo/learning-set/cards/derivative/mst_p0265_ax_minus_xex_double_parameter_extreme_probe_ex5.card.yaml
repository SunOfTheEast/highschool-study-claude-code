stem: |-
  （2021 · 天津）已知 $a>0$，函数 $f(x)=ax-xe^x$。
  1. 求曲线 $f(x)$ 在点 $(0,f(0))$ 处的切线方程。
  2. 证明函数 $f(x)$ 存在唯一的极值点。
  3. 若 $\exists a$，使得 $f(x)\le a+b$ 对任意的 $x\in\mathbf{R}$ 恒成立，求实数 $b$ 的取值范围。
answer: |-
  第(1)问：$y=(a-1)x$。第(2)问：存在唯一极值点。第(3)问：$b\ge-e$。

  第(1)问 $f(0)=0$，$f^\prime(x)=a-(x+1)e^x$，所以 $f^\prime(0)=a-1$，切线为 $y=(a-1)x$。第(2)问令 $\phi(x)=(x+1)e^x$，当 $x\le-1$ 时 $f^\prime(x)>0$；当 $x>-1$ 时，$\phi$ 从 0 严格增到 $+\infty$，故存在唯一 $x_0>-1$ 使 $\phi(x_0)=a$，于是 $f^\prime$ 由正变负， $f$ 存在唯一极大值点。第(3)问若存在 $a$ 使 $f(x)\le a+b$ 恒成立，代 $x=1$ 得 $a-e\le a+b$，故 $b\ge-e$。反过来取 $a=2e$，只需证 $F(x)=xe^x-2e(x-1)-e\ge0$；因 $F(1)=0$， $F^\prime(x)=(x+1)e^x-2e$ 在 $x=1$ 左负右正，所以 $F(x)\ge F(1)=0$，从而 $b\ge-e$ 均可行。
