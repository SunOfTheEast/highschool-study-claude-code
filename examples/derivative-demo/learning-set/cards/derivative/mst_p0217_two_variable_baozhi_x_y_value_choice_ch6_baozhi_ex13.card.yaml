solution:
  source_solution_summary: |
    由题设不等式得 $x^2-\ln x+\frac{4}{y^2}+\ln y-1-\ln4\le0$。 按 source 的双变量保值性配凑，先提 $\frac12$ 并把对数升级到平方幂： \[ x^2-\ln x+\frac{4}{y^2}+\ln y-1-\ln4 =\frac12\!\left(2x^2-\ln x^2+\frac{8}{y^2}+\ln y^2-2-2\ln4\right). \] 继续写成 \[ \frac12\!\left[h(2x^2)+h\!\left(\frac{8}{y^2}\right)\right]\le0, \quad h(t)=t-\ln t-1\ge0. \] 因为两项都不小于 0，而其和不大于 0，故两项只能同时取 0： $2x^2=1,\ \frac{8}{y^2}=1$。再由 $x,y>0$ 得 $x=\frac{\sqrt2}{2},\ y=2\sqrt2$， 所以 $x+y=\frac{5\sqrt2}{2}$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把题设改写成“同侧和式小于等于 0”。
      formula_trace:
        from: $\ln x-x^2+1\ge\ln y+\frac4{y^2}-\ln4$
        to: $x^2-\ln x+\frac4{y^2}+\ln y-1-\ln4\le0$
        operation: 移项整理。
        why: 保值性同构通常从“某和式判号”切入。
      source_ref: page_0217_ex13_solution
    - step_id: step_2
      statement: 提 $\frac12$ 并升级对数幂次，统一到同构母式。
      formula_trace:
        from: $x^2-\ln x+\frac4{y^2}+\ln y-1-\ln4$
        to: $\frac12\left(2x^2-\ln x^2+\frac8{y^2}+\ln y^2-2-2\ln4\right)$
        operation: 把 $\ln x,\ln y$ 重写为 $\frac12\ln x^2,\frac12\ln y^2$。
        why: 让两变量部分都能写成 $t-\ln t-1$ 的标准形。
      source_ref: page_0217_ex13_solution
    - step_id: step_3
      statement: 构造保值函数并写成双变量同构和。
      formula_trace:
        from: $h(t)=t-\ln t-1$
        to: $\frac12\left[h(2x^2)+h\left(\frac8{y^2}\right)\right]\le0$
        operation: 加减常数并匹配 $\ln2,\ln4$ 常量项后归并。
        why: 把原题压缩为“两个非负项之和的符号”问题。
      source_ref: page_0217_ex13_solution
    - step_id: step_4
      statement: 由“非负和小于等于 0”触发同取等。
      formula_trace:
        from: $h(t)\ge0,\ h(2x^2)+h\left(\frac8{y^2}\right)\le0$
        to: $h(2x^2)=0,\ h\left(\frac8{y^2}\right)=0$
        operation: 利用两项同号判定：和为非正只能各自为 0。
        why: 直接锁定变量方程。
      source_ref: page_0217_ex13_solution
    - step_id: step_5
      statement: 解出正实根并回填选项。
      formula_trace:
        from: $2x^2=1,\ \frac8{y^2}=1,\ x,y>0$
        to: $x=\frac{\sqrt2}{2},\ y=2\sqrt2,\ x+y=\frac{5\sqrt2}{2}$
        operation: 由 $h(u)=0\Leftrightarrow u=1$，结合正实数条件取正根。
        why: 得到唯一和式并对应 D。
      source_ref: page_0217_ex13_solution
teaching_card:
  student_title: 双变量保值性：由同取等直接反求 $x+y$
  what_it_trains: 训练把双变量混合不等式同构为 $h(a)+h(b)$，再用“非负和的极限符号”快速锁定取等点。
  recognition_cues:
    - 题干给“存在正实数 $x,y$”并让你求固定数值。
    - 式子里同时有二次项、倒平方项与对数项，适合保值同构。
    - 解析中会出现“提 $\frac12$ 升级对数幂次”的动作。
  normalization_moves:
    - 先改写为单侧不等式 $\le0$。
    - 把两变量都配到 $h(t)=t-\ln t-1$。
    - 利用 $h\ge0$ 与“和非正”迫使两个同构项同取等。
    - 结合 $x,y>0$ 取正根并回填选项。
  common_failures:
    - 把题目中的“存在”误当作“任意”，导致判号逻辑跑偏。
    - 同构配凑时常数项（$\ln2,\ln4$）处理不干净。
    - 求出 $x^2,y^2$ 后忘记用正实数条件筛根。
  similar_practice_query: 双变量 保值性 h(x)=x-lnx-1 同取等 求x+y 选择题
