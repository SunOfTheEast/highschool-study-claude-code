original_problem:
  stem: 函数 f(x)=e^x-e^{-x}-a\sin x (x\in\mathbf{R})（e 是自然对数的底数， a>0）存在唯一的零点，则实数 a 的取值范围为（ ）
  parts: *a1
  choices:
    - label: A
      text_raw: (0,2]
      text_latex: $(0,2]$
    - label: B
      text_raw: (0,1]
      text_latex: $(0,1]$
    - label: C
      text_raw: (0,e]
      text_latex: $(0,e]$
    - label: D
      text_raw: (0,\pi)
      text_latex: $(0,\pi)$
  answer: A. (0,2]
  fidelity_notes:
    - 原题为选择题；f(0)=0 恒为零点，“唯一零点”指实数范围内只有 x=0。
    - 源解析中关于 2x>ax 的参数方向有口误，本卡按源结论、选项和数学判定记录。
solution:
  source_solution_summary: f 是奇函数且 f(0)=0，因此只需判断 x>0 时是否还有零点。若 0<a\leqslant2， 则 e^x-e^{-x}>2x 且 \sin x<x，进而 e^x-e^{-x}-a\sin x>0，故没有正零点；奇函数也没有负零点。若 a>2， 则 f'(0)=2-a<0，连续性保证 0 右侧足够近处 f(x)<0，而 x\to+\infty 时 f(x)\to+\infty，所以存在正零点，因奇性还存在负零点，不可能唯一。 因此 0<a\leqslant2，选 A。
  key_steps:
    - step_id: step_1
      statement: 先利用奇偶性把零点个数问题缩到 x>0。
      formula_trace:
        from: f(x)=e^x-e^{-x}-a\sin x
        to: f(-x)=-f(x),\quad f(0)=0
        operation: 分别检查 e^x-e^{-x} 与 \sin x 都是奇函数。
        why: 若 x>0 有一个非零零点，则 -x 也会是零点；唯一零点只能是 0。
      source_ref: page_0066_solution
    - step_id: step_2
      statement: 用 Taylor 放缩给出 0<a\leqslant2 的充分性。
      formula_trace:
        from: e^x-e^{-x}\geqslant2x,\quad \sin x\leqslant x\quad(x>0)
        to: f(x)=e^x-e^{-x}-a\sin x\geqslant2x-ax\geqslant0
        operation: 将双曲正弦下界和正弦上界代入 f(x)。
        why: 当 a\leqslant2 时，x>0 右侧非负；实际在 x>0 上严格为正，因此无正零点。
      source_ref: page_0066_solution
    - step_id: step_3
      statement: 用 0 点附近的首项排除 a>2。
      formula_trace:
        from: f'(x)=e^x+e^{-x}-a\cos x
        to: f'(0)=2-a<0\quad(a>2)
        operation: 对 f 求导并代入 x=0。
        why: 这等价于源页 Taylor 展开中的线性主项 (2-a)x；a>2 时 0 右侧函数先下降。
      source_ref: page_0066_solution
    - step_id: step_4
      statement: a>2 时由连续性推出额外正零点。
      formula_trace:
        from: \exists\varepsilon>0,\ f(\varepsilon)<0;\quad \lim_{x\to+\infty}f(x)=+\infty
        to: \exists x_0>0,\ f(x_0)=0
        operation: 在 (\varepsilon,+\infty) 上使用连续函数介值性。
        why: 出现正零点后，由奇函数性质还会出现负零点，违背“唯一零点”。
      source_ref: page_0066_solution
    - step_id: step_5
      statement: 合并充分性与必要性得到选项。
      formula_trace:
        from: 0<a\leqslant2 可行；a>2 不可行
        to: a\in(0,2]
        operation: 结合题设 a>0 和四个选项。
        why: 这是唯一保证实数范围内只有 x=0 一个零点的参数范围。
      source_ref: page_0066_solution
teaching_card:
  student_title: 用 0 点首项判断唯一零点的参数
  what_it_trains: 训练先看奇函数的零点对称性，再用 Taylor 主项和基础放缩判断参数临界值。
  recognition_cues:
    - 题干出现 e^x-e^{-x} 与 \sin x 的组合，并且问“唯一零点”。
    - f(0)=0 已经存在，关键不是找零点，而是排除其他正负零点。
    - 参数 a 乘在 \sin x 上，0 点附近要比较 2x 与 ax。
  normalization_moves:
    - 先写出 f(-x)=-f(x)，把问题转成 x>0 时 f(x)>0。
    - 用 e^x-e^{-x}\geqslant2x、\sin x\leqslant x 给 a\leqslant2 的充分性。
    - 对 a>2 展开到线性主项，构造 0 右侧反例。
  common_failures:
    - 只用 2x 与 ax 比较，却把 a 的方向写反。
    - 忘记 f(0)=0 已经是一个零点，把“存在唯一零点”误读成“有一个交点”。
    - 只证明 a\leqslant2 充分，没有说明 a>2 为什么会多出零点。
  similar_practice_query: 奇函数 e^x-e^{-x} 与三角函数组合的唯一零点参数题，使用 Taylor 首项和 0 点邻域反例。
