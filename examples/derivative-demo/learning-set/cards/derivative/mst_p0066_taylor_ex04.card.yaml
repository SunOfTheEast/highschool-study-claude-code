stem: |-
  函数 f(x)=e^x-e^{-x}-a\sin x (x\in\mathbf{R})（e 是自然对数的底数， a>0）存在唯一的零点，则实数 a 的取值范围为（ ）
  A. (0,2]
  B. (0,1]
  C. (0,e]
  D. (0,\pi)
answer: |-
  A. (0,2]

  f 是奇函数且 f(0)=0，因此只需判断 x>0 时是否还有零点。若 0<a\leqslant2， 则 e^x-e^{-x}>2x 且 \sin x<x，进而 e^x-e^{-x}-a\sin x>0，故没有正零点；奇函数也没有负零点。若 a>2， 则 f'(0)=2-a<0，连续性保证 0 右侧足够近处 f(x)<0，而 x\to+\infty 时 f(x)\to+\infty，所以存在正零点，因奇性还存在负零点，不可能唯一。 因此 0<a\leqslant2，选 A。
