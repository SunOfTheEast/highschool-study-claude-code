stem: |-
  已知实数 $a,b$ 满足 $a-1=\ln(4-a)$，$be^b=e^3$，其中 $e$ 是自然对数的底数，则 $a+b=$（ ）
  A. 2
  B. $e$
  C. 3
  D. 4
answer: |-
  D；$a+b=4$。

  由 $a-1=\ln(4-a)$ 得 $e^{a-1}=4-a$，所以 $e^{a-1}+a-1=3$。由 $be^b=e^3$ 得 $b>0$，取对数得 $\ln b+b=3$，即 $e^{\ln b}+\ln b=3$。函数 $\Phi(t)=e^t+t$ 严格递增，所以 $a-1=\ln b$，从而 $b=e^{a-1}=4-a$，故 $a+b=4$。
