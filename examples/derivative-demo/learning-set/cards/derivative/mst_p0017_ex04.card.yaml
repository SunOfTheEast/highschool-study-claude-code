original_problem:
  stem: 已知实数 $a,b$ 满足 $a-1=\ln(4-a)$，$be^b=e^3$，其中 $e$ 是自然对数的底数，则 $a+b=$（ ）
  parts: *a1
  choices:
    - label: A
      text_raw: "2"
      text_latex: $2$
    - label: B
      text_raw: $e$
      text_latex: $e$
    - label: C
      text_raw: "3"
      text_latex: $3$
    - label: D
      text_raw: "4"
      text_latex: $4$
  answer: D；$a+b=4$。
  fidelity_notes:
    - page_0017.png 已核对：$be^b=e^3$ 中指数为 $b$，不是 $b e^3$。
solution:
  source_solution_summary: 由 $a-1=\ln(4-a)$ 得 $e^{a-1}=4-a$，所以 $e^{a-1}+a-1=3$。由 $be^b=e^3$ 得 $b>0$，取对数得 $\ln b+b=3$，即 $e^{\ln b}+\ln b=3$。函数 $\Phi(t)=e^t+t$ 严格递增，所以 $a-1=\ln b$，从而 $b=e^{a-1}=4-a$，故 $a+b=4$。
  key_steps:
    - step_id: step_1
      statement: 把 $a$ 的条件化成 $e^t+t=3$。
      formula_trace:
        from: $a-1=\ln(4-a)$
        to: $e^{a-1}+a-1=3$
        operation: 两边取指数得 $e^{a-1}=4-a$，再把 $a-1$ 加到两边。
        why: 构造出 $\Phi(a-1)=3$，其中 $\Phi(t)=e^t+t$。
      source_ref: page_0017
    - step_id: step_2
      statement: 把 $b$ 的条件也化成 $e^t+t=3$。
      formula_trace:
        from: $be^b=e^3$
        to: $b+\ln b=3=e^{\ln b}+\ln b$
        operation: 由右侧为正得 $b>0$，取自然对数得到 $\ln b+b=3$。
        why: 这给出 $\Phi(\ln b)=3$。
      source_ref: page_0017
    - step_id: step_3
      statement: 用 $\Phi(t)=e^t+t$ 的单调性比较自变量。
      formula_trace:
        from: $e^{a-1}+a-1=e^{\ln b}+\ln b=3$
        to: $a-1=\ln b$
        operation: 对 $\Phi(t)$ 求导得 $e^t+1>0$，即 $\Phi(t)$ 严格递增。
        why: 同一个函数值只能对应同一个自变量。
      source_ref: page_0017
    - step_id: step_4
      statement: 回代求 $a+b$。
      formula_trace:
        from: $a-1=\ln b$ and $a-1=\ln(4-a)$
        to: $b=4-a,\quad a+b=4$
        operation: 由对数相等推出真数相等。
        why: 目标只问和，直接由 $b=4-a$ 得到。
      source_ref: page_0017
teaching_card:
  student_title: 把两个条件都凑成 $e^x+x$
  what_it_trains: 训练把一个对数方程和一个指数乘积方程，统一成同一个递增函数 $e^t+t$，再直接比较自变量。
  recognition_cues:
    - 题目同时出现 $a-1=\ln(4-a)$ 和 $be^b=e^3$。
    - 一个条件可以取指数，另一个条件可以取对数。
    - 目标是 $a+b$，若能得到 $b=4-a$ 就可立即结束。
  normalization_moves:
    - 把 $a-1=\ln(4-a)$ 改写成 $e^{a-1}+a-1=3$。
    - 把 $be^b=e^3$ 改写成 $b+\ln b=3$。
    - 把 $b$ 写作 $e^{\ln b}$，和 $e^{a-1}$ 对齐。
    - 用 $e^t+t$ 单调性得到 $a-1=\ln b$。
  common_failures:
    - 只对 $be^b=e^3$ 取对数，却没有把 $b$ 看成 $e^{\ln b}$。
    - 看见 $a-1=\ln(4-a)$ 后硬解 $a$，错过同构。
    - 忽略 $b>0$，导致取对数依据不完整。
  similar_practice_query: $a-1=\ln(4-a)$ $be^b=e^3$ $e^x+x$ 同构 数值求值
