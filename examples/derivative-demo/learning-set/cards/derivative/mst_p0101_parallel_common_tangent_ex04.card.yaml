stem: |-
  （2018 内蒙古包头市北重三中模拟 T16）若直线 $y=kx+b$ 与曲线 $C_1:y=3+e^x$ 和曲线 $C_2:y=e^{x+2}$ 同时相切，则 $b=$（  ）
  A. $\frac{9}{2}-\frac{3}{2}\ln\frac{3}{2}$
  B. $2-\ln2$
  C. $\frac{1}{2}-\ln\frac{1}{2}$
  D. $3-\ln3$
answer: |
  A

  曲线 $C_1:y=3+e^x$ 向下移动 $3$ 个单位并向左移动 $2$ 个单位，可得
  $C_2:y=e^{x+2}$，因此平行曲线的公切线斜率为
  $k=\frac{3}{2}$。设直线与 $C_2$ 的切点横坐标为 $x_2$，因为
  $C_2'(x)=e^{x+2}$，所以 $e^{x_2+2}=\frac32$，即
  $x_2=\ln\frac32-2$，切点为
  $\left(\ln\frac32-2,\frac32\right)$。代入 $y=kx+b$，
  $\frac32=\frac32\left(\ln\frac32-2\right)+b$，得
  $b=\frac92-\frac32\ln\frac32$，选 A。
