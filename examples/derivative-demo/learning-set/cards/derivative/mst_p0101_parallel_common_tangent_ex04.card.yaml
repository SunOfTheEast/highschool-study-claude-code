solution:
  source_solution_summary: |
    曲线 $C_1:y=3+e^x$ 向下移动 $3$ 个单位并向左移动 $2$ 个单位，可得
    $C_2:y=e^{x+2}$，因此平行曲线的公切线斜率为
    $k=\frac{3}{2}$。设直线与 $C_2$ 的切点横坐标为 $x_2$，因为
    $C_2'(x)=e^{x+2}$，所以 $e^{x_2+2}=\frac32$，即
    $x_2=\ln\frac32-2$，切点为
    $\left(\ln\frac32-2,\frac32\right)$。代入 $y=kx+b$，
    $\frac32=\frac32\left(\ln\frac32-2\right)+b$，得
    $b=\frac92-\frac32\ln\frac32$，选 A。
  key_steps:
    - step_id: step_1
      statement: 识别两条指数曲线的平移关系。
      formula_trace:
        from: |
          $C_1:\ y=3+e^x,\qquad C_2:\ y=e^{x+2}$
        to: |
          $C_2(x)=C_1(x+2)-3$
        operation: 把 $C_1$ 向左平移 $2$ 个单位、向下平移 $3$ 个单位。
        why: 平行曲线的公切线斜率可由水平和竖直平移量直接确定。
      source_ref: page_0101
    - step_id: step_2
      statement: 由平移量求公切线斜率。
      formula_trace:
        from: |
          $C_2(x)=C_1(x+2)-3$
        to: |
          $k=\frac{3}{2}$
        operation: 用平行曲线公切线规则 $k=\frac{b}{a}$，其中水平量为 $2$，竖直量为 $3$。
        why: 同形曲线平移后的公切线斜率等于两切点连线斜率。
      source_ref: page_0101
    - step_id: step_3
      statement: 在 $C_2$ 上找斜率为 $\frac32$ 的切点。
      formula_trace:
        from: |
          $C_2'(x)=e^{x+2},\qquad k=\frac32$
        to: |
          $e^{x_2+2}=\frac32,\qquad x_2=\ln\frac32-2,\qquad y_2=\frac32$
        operation: 令导数等于公切线斜率，再求切点坐标。
        why: 求截距 $b$ 需要一个确定的切点。
      source_ref: page_0102
    - step_id: step_4
      statement: 把切点代入直线求截距。
      formula_trace:
        from: |
          $y_2=\frac32,\qquad x_2=\ln\frac32-2,\qquad k=\frac32$
        to: |
          $\frac32=\frac32\left(\ln\frac32-2\right)+b,\qquad b=\frac92-\frac32\ln\frac32$
        operation: 代入 $y=kx+b$ 并移项。
        why: 截距由直线经过切点唯一确定。
      source_ref: page_0102
teaching_card:
  student_title: 平移指数曲线先定公切线斜率
  what_it_trains: 训练把两条指数曲线看成平移同形曲线，先用平移量确定公切线斜率，再找切点求截距。
  recognition_cues:
    - $3+e^x$ 和 $e^{x+2}$ 只差水平、竖直平移。
    - 题干问截距 $b$，不能只停在公切线斜率。
    - 选项都含对数，说明还要从 $e^{x+2}=\frac32$ 解切点。
  normalization_moves:
    - 写出 $C_2(x)=C_1(x+2)-3$。
    - 由平移量得到 $k=\frac32$。
    - 在 $C_2$ 上解 $e^{x_2+2}=\frac32$，再代入直线求 $b$。
  common_failures:
    - 把向左平移 2 看成向右平移 2，导致斜率符号或切点错误。
    - 求出 $k=\frac32$ 后直接选含 $\frac32$ 的式子，没有求截距。
    - 从 $x_2=\ln\frac32-2$ 代入时漏掉 $-2$ 贡献出的 $+3$。
  similar_practice_query: 指数函数 平行曲线 公切线 平移量 斜率 截距
