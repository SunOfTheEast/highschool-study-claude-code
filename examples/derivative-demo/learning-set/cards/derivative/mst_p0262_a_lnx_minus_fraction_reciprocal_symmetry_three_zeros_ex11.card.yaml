stem: （2025 · 北京朝阳 · 一模节选）已知函数 $f(x)=a\ln x-\frac{x-1}{x+1}$，$a\in\mathbf R$。若函数 $f(x)$ 有 3 个不同的零点，求 $a$ 的取值范围。
answer: |-
  $a\in(0,\frac12)$。

  本题先看倒数对称：$f(1)=0$，且 $f(x)+f(\frac1x)=0$，所以如果 $x>1$ 有一个额外零点， 就会配出一个 $0<x<1$ 的零点，连同 $x=1$ 得三个零点。 因而只需研究 $x>1$。当 $a\ge\frac12$ 时，可用 $\ln x\ge\frac{2(x-1)}{x+1}$ 得 $f(x)\ge0$，没有右侧额外零点。 当 $a\le0$ 时，右侧也不会产生所需穿越。只有 $0<a<\frac12$ 时，$f^\prime(1)=a-\frac12<0$， 但 $x\to+\infty$ 时 $a\ln x-1\to+\infty$，所以在 $(1,+\infty)$ 先降后升并有唯一零点，倒数对称给出三个零点。
