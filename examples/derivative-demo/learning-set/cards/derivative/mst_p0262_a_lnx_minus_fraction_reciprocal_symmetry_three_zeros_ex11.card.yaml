original_problem:
  stem: （2025 · 北京朝阳 · 一模节选）已知函数 $f(x)=a\ln x-\frac{x-1}{x+1}$，$a\in\mathbf R$。若函数 $f(x)$ 有 3 个不同的零点，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\in(0,\frac12)$。
  fidelity_notes:
    - 求参题，无选项、无分问。
    - 题头跨页，page_0263 页首给出最终结论。
solution:
  source_solution_summary: 本题先看倒数对称：$f(1)=0$，且 $f(x)+f(\frac1x)=0$，所以如果 $x>1$ 有一个额外零点， 就会配出一个 $0<x<1$ 的零点，连同 $x=1$ 得三个零点。 因而只需研究 $x>1$。当 $a\ge\frac12$ 时，可用 $\ln x\ge\frac{2(x-1)}{x+1}$ 得 $f(x)\ge0$，没有右侧额外零点。 当 $a\le0$ 时，右侧也不会产生所需穿越。只有 $0<a<\frac12$ 时，$f^\prime(1)=a-\frac12<0$， 但 $x\to+\infty$ 时 $a\ln x-1\to+\infty$，所以在 $(1,+\infty)$ 先降后升并有唯一零点，倒数对称给出三个零点。
  key_steps:
    - step_id: step_1
      statement: 识别 $x=1$ 是中间零点。
      formula_trace:
        from: $f(x)=a\ln x-\frac{x-1}{x+1}$
        to: $f(1)=0$
        operation: 代入 $x=1$。
        why: 三零点问题先抓中间显点。
      source_ref: page_0262_ex11_solution_start
    - step_id: step_2
      statement: 识别倒数反对称。
      formula_trace:
        from: $f(\frac1x)=a\ln\frac1x-\frac{\frac1x-1}{\frac1x+1}$
        to: $f(x)+f(\frac1x)=0$
        operation: 化简 $\ln\frac1x=-\ln x$ 和分式。
        why: 右侧零点会自动配出左侧零点。
      source_ref: page_0262_ex11_solution_start
    - step_id: step_3
      statement: 排除 $a\ge\frac12$。
      formula_trace:
        from: $a\ln x-\frac{x-1}{x+1}$，$x>1$
        to: $f(x)\ge\frac12(\ln x-\frac{2(x-1)}{x+1})\ge0$
        operation: 用 pade/经典不等式压住右侧。
        why: 右侧没有额外零点。
      source_ref: page_0263_ex11_solution_continuation
    - step_id: step_4
      statement: 排除 $a\le0$。
      formula_trace:
        from: $g(x)=a(x+1)^2-2x$
        to: $x>1$ 时 $g(x)<0$，右侧单调不产生额外穿越
        operation: 用导数符号排除。
        why: 非正参数不能形成三零点。
      source_ref: page_0263_ex11_solution_continuation
    - step_id: step_5
      statement: 证明 $0<a<\frac12$ 时可行。
      formula_trace:
        from: $f^\prime(1)=a-\frac12<0$，且 $a\ln x-1\to+\infty$
        to: $(1,+\infty)$ 有唯一额外零点
        operation: 先降后升，并用远处正值找点。
        why: 倒数对称再配出左侧零点，总共三个。
      source_ref: page_0263_ex11_solution_continuation
    - step_id: step_6
      statement: 合并参数范围。
      formula_trace:
        from: 只剩 $0<a<\frac12$ 可行
        to: $a\in(0,\frac12)$
        operation: 合并必要性和充分性。
        why: 完成三零点求参。
      source_ref: page_0263_ex11_solution_continuation
teaching_card:
  student_title: 用倒数对称把三个零点缩成右侧一个零点
  what_it_trains: 训练倒数型三零点：先锁 $x=1$，再用 $x$ 和 $\frac1x$ 的反对称把左右零点成对处理。
  recognition_cues:
    - 题目里有 $\ln x$ 和 $\frac{x-1}{x+1}$。
    - 代入 $x=1$ 直接为零。
    - 把 $x$ 换成 $\frac1x$ 后，函数值刚好变号。
    - 参数边界是 $a=\frac12$，对应右侧刚好不再穿越。
  normalization_moves:
    - 先证明 $f(x)+f(\frac1x)=0$。
    - 只在 $x>1$ 找一个零点。
    - 分段排除 $a\ge\frac12$ 和 $a\le0$，剩下 $0<a<\frac12$。
  common_failures:
    - 直接在全定义域找三个零点，漏掉倒数配对。
    - 把 $a=\frac12$ 边界误纳入答案。
    - 通分导数时把等号写成不等号，导致判号混乱。
  similar_practice_query: 倒数对称 a ln x (x-1)/(x+1) 三个零点 x=1 参数范围
