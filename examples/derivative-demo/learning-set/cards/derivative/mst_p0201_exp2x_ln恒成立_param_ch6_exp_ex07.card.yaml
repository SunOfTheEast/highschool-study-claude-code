stem: 已知函数 $f(x)=e^{2x}-(b+2)x\ (b\in\mathbf{R})$，$g(x)=\ln x+\ln 2e$，不等式 $f(x)\ge g(x)$ 对于一切 $x\in(0,+\infty)$ 恒成立，求 $b$ 的取值范围。
answer: |-
  $b\le2e-4$。

  由 $f(x)\ge g(x)$ 得 $e^{2x}-(b+2)x-\ln x-\ln 2e\ge0$，等价于 $e^{2x}-2ex+2x-1-\ln(2x)+(2e-4-b)x\ge0$。其中 $e^{2x}-2ex\ge0$（取 $u=2x-1$ 用 $e^u\ge1+u$）且 $2x-1-\ln(2x)\ge0$（用 $\ln t\le t-1$，$t=2x$），两者都在 $x=\frac12$ 取等。故当 $2e-4-b\ge0$ 时整体非负，得到充分条件 $b\le2e-4$。反之若 $b>2e-4$，代入 $x=\frac12$ 时前两块均为 0， 剩余项为 $\frac12(2e-4-b)<0$，与恒成立矛盾，故必要条件同样是 $b\le2e-4$。
