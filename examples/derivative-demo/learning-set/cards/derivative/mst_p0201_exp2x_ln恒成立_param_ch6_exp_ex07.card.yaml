original_problem:
  stem: 已知函数 $f(x)=e^{2x}-(b+2)x\ (b\in\mathbf{R})$，$g(x)=\ln x+\ln 2e$，不等式 $f(x)\ge g(x)$ 对于一切 $x\in(0,+\infty)$ 恒成立，求 $b$ 的取值范围。
  parts: *a1
  choices: []
  answer: $b\le2e-4$。
  fidelity_notes:
    - 源题为求参解答题，无选项。
    - 恒成立区间为 $(0,+\infty)$，已按原题保留。
solution:
  source_solution_summary: 由 $f(x)\ge g(x)$ 得 $e^{2x}-(b+2)x-\ln x-\ln 2e\ge0$，等价于 $e^{2x}-2ex+2x-1-\ln(2x)+(2e-4-b)x\ge0$。其中 $e^{2x}-2ex\ge0$（取 $u=2x-1$ 用 $e^u\ge1+u$）且 $2x-1-\ln(2x)\ge0$（用 $\ln t\le t-1$，$t=2x$），两者都在 $x=\frac12$ 取等。故当 $2e-4-b\ge0$ 时整体非负，得到充分条件 $b\le2e-4$。反之若 $b>2e-4$，代入 $x=\frac12$ 时前两块均为 0， 剩余项为 $\frac12(2e-4-b)<0$，与恒成立矛盾，故必要条件同样是 $b\le2e-4$。
  key_steps:
    - step_id: step_1
      statement: 把 $f-g$ 改写为“标准放缩块 + 参数项”。
      formula_trace:
        from: $e^{2x}-(b+2)x-\ln x-\ln 2e\ge0$
        to: $e^{2x}-2ex+2x-1-\ln2x+(2e-4-b)x\ge0$
        operation: 利用 $\ln2e=\ln2+1$，并加减 $2ex$ 与 $2x$。
        why: 为后续分块非负与参数分情形做准备。
      source_ref: page_0201_ex07_solution
    - step_id: step_2
      statement: 第一块：$e^{2x}-2ex\ge0$。
      formula_trace:
        from: $e^{2x}-2ex=e\bigl(e^{2x-1}-2x\bigr)$
        to: $e^{2x}-2ex\ge0$
        operation: 令 $u=2x-1$，用 $e^u\ge1+u$ 得 $e^{2x-1}\ge2x$。
        why: 把指数块压成标准切线下界。
      source_ref: page_0201_ex07_solution
    - step_id: step_3
      statement: 第二块：$2x-1-\ln2x\ge0$。
      formula_trace:
        from: $\ln t\le t-1\ (t>0)$
        to: $2x-1-\ln2x\ge0\ (x>0)$
        operation: 取 $t=2x$ 直接代入。
        why: 把对数块压成标准 0 线放缩。
      source_ref: page_0201_ex07_solution
    - step_id: step_4
      statement: 给出充分性：$b\le2e-4$ 时恒成立。
      formula_trace:
        from: $2e-4-b\ge0$
        to: 三块均非负 $\Rightarrow$ 原式对一切 $x>0$ 成立
        operation: step_2、step_3 与参数项同号合并。
        why: 得到参数上界作为充分条件。
      source_ref: page_0201_ex07_solution
    - step_id: step_5
      statement: 用 $x=\frac12$ 反证必要性。
      formula_trace:
        from: $b>2e-4$
        to: 代入 $x=\frac12$ 得 $\frac12(2e-4-b)<0$，与恒成立矛盾
        operation: 利用 step_2、step_3 在 $x=\frac12$ 同时取等。
        why: 排除全部 $b>2e-4$，锁定必要条件。
      source_ref: page_0201_ex07_solution
teaching_card:
  student_title: 两块取等同点，一代锁参数
  what_it_trains: 训练“恒成立求参”里最常见的三步：拆分标准非负块、先拿充分、再用共同取等点做必要性反证。
  recognition_cues:
    - 题干是“对一切 $x>0$ 恒成立”的求参。
    - 式中同时有 $e^{2x}$ 与 $\ln x$，通常可拆成指数块+对数块。
    - 解析里出现同一个取等点，意味着可直接一代打穿必要性。
  normalization_moves:
    - 先统一成 $e^{2x}-2ex$ 与 $2x-1-\ln2x$ 两块。
    - 先判参数项系数符号得到充分条件。
    - 再代共同取等点 $x=\frac12$ 排除其余参数。
  common_failures:
    - 变形时漏掉 $\ln2e$ 中的常数 1。
    - 只写“当 $b\le2e-4$ 时成立”，遗漏“反之不成立”的必要性。
    - 取等点代入后符号判断出错，把 $b>2e-4$ 误判为可行。
  similar_practice_query: e^{2x} 与 lnx 恒成立 求 b 取等点 x=1/2
