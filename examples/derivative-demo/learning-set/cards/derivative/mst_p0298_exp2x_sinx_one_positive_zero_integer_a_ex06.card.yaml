original_problem:
  stem: （2024 春 · 江北区校级期中）已知函数 $f(x)=e^{2x}+(a-2)e^x-a\sin x-\frac54$。
  parts: *a1
  choices: []
  answer: 第(1)问 $f$ 在 $(-\infty,0)$ 上单调递减，在 $(0,+\infty)$ 上单调递增；第(2)问满足条件的最大整数 $a$ 为 $1$。
  fidelity_notes:
    - 无选项。
    - 第(2)问只需要确定最大整数，不需要完整求出所有实数 $a$ 的范围。
solution:
  source_solution_summary: 第(1)问当 $a=0$ 时， $f(x)=e^{2x}-2e^x-\frac54$，$f^\prime(x)=2e^x(e^x-1)$。 因此 $x<0$ 时 $f^\prime(x)<0$，$x>0$ 时 $f^\prime(x)>0$， $f$ 在 $(-\infty,0)$ 上递减，在 $(0,+\infty)$ 上递增。第(2)问把 $f$ 改写成 $(e^x-1)^2+a(e^x-\sin x)-\frac94$。当 $a>0$ 时， $(e^x-1)^2$ 与 $a(e^x-\sin x)$ 在 $(0,+\infty)$ 上都递增， 所以 $f$ 在正半轴递增。又 $f(0)=a-\frac94$，若 $a\ge3$，则正半轴无零点，不合题意。检查整数候选： $a=2$ 时 $f(0)<0$，但 $f(-\frac\pi2)=e^{-\pi}+2-\frac54>0$，负半轴已有零点，不合题意。 $a=1$ 时 $f(x)=e^{2x}-e^x-\sin x-\frac54=(e^x-\frac12)^2-\sin x-\frac32$。 在正半轴，$f(0)<0$ 且 $f(1)>0$，结合正半轴递增，只有一个正零点； 在负半轴，$0<e^x<1$，所以 $(e^x-\frac12)^2<\frac14$，又 $-\sin x\le1$，故 $f(x)<0$ 恒成立。于是最大整数 $a=1$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问代入 $a=0$ 后求导。
      formula_trace:
        from: $f(x)=e^{2x}-2e^x-\frac54$
        to: $f^\prime(x)=2e^x(e^x-1)$
        operation: 求导并因式分解。
        why: 符号只由 $e^x-1$ 决定。
      source_ref: page_0299_ex06_solution
    - step_id: step_2
      statement: 得到第(1)问单调区间。
      formula_trace:
        from: $f^\prime(x)<0\ (x<0),\quad f^\prime(x)>0\ (x>0)$
        to: $f$ 在 $(-\infty,0)$ 递减，在 $(0,+\infty)$ 递增
        operation: 按导数符号判单调。
        why: 这是后面处理正半轴零点的基础。
      source_ref: page_0299_ex06_solution
    - step_id: step_3
      statement: 第(2)问先把式子拆成正半轴好判的两块。
      formula_trace:
        from: $e^{2x}+(a-2)e^x-a\sin x-\frac54$
        to: $(e^x-1)^2+a(e^x-\sin x)-\frac94$
        operation: 补出 $(e^x-1)^2$，把含 $a$ 的项并成 $a(e^x-\sin x)$。
        why: 这样 $x>0$ 时可以直接判断两块都递增。
      source_ref: page_0299_ex06_solution
    - step_id: step_4
      statement: 排除所有 $a\ge3$ 的整数。
      formula_trace:
        from: $f(0)=a-\frac94$
        to: $a\ge3$ 时正半轴无零点
        operation: 结合 $a>0$ 时正半轴单调递增。
        why: 若从 $x=0$ 起已经为正，正半轴不会出现所需零点。
      source_ref: page_0299_ex06_solution
    - step_id: step_5
      statement: 排除 $a=2$。
      formula_trace:
        from: $f(0)<0,\quad f(-\frac\pi2)=e^{-\pi}+2-\frac54>0$
        to: $(-\frac\pi2,0)$ 上有零点
        operation: 用介值定理找负半轴零点。
        why: 题目要求全实数上只有一个零点且它在正半轴，负半轴零点会直接失败。
      source_ref: page_0299_ex06_solution
    - step_id: step_6
      statement: 验证 $a=1$ 正半轴有唯一零点。
      formula_trace:
        from: $f(0)=-\frac54<0,\quad f(1)=(e-\frac12)^2-\sin1-\frac32>0$
        to: $(0,+\infty)$ 上有且只有一个零点
        operation: 用正半轴递增和变号。
        why: 递增性保证零点唯一。
      source_ref: page_0299_ex06_solution
    - step_id: step_7
      statement: 验证 $a=1$ 负半轴无零点。
      formula_trace:
        from: $f(x)=(e^x-\frac12)^2-\sin x-\frac32,\quad x<0$
        to: $f(x)<0$
        operation: 用 $(e^x-\frac12)^2<\frac14$ 与 $-\sin x\le1$。
        why: 排除负半轴零点后，$a=1$ 才真正满足全局条件。
      source_ref: page_0299_ex06_solution
teaching_card:
  student_title: 排除候选，留下唯一正零点
  what_it_trains: 训练带指数和正弦的零点个数题中，如何用整数候选、正半轴单调性和负半轴排除来确定最大整数。
  recognition_cues:
    - 题目要求全实数只有一个零点，而且零点必须在正半轴。
    - $e^{2x}-2e^x$ 可以补成 $(e^x-1)^2$。
    - $a=2$ 不是因为正半轴失败，而是负半轴冒出零点。
    - $a=1$ 要同时证明正半轴唯一、负半轴没有。
  normalization_moves:
    - 先讨论 $a=0$ 的单调性，不把它误当成第(2)问主线。
    - 第(2)问按整数候选验证：先排大数，再排 $2$，最后证 $1$。
    - 负半轴估计只需证明函数始终小于 $0$。
  common_failures:
    - 只看正半轴，忘记题目说的是在 $\mathbf R$ 上恰有一个零点。
    - 看到 $a=2$ 正半轴可能有零点就误判通过。
    - 不会把 $e^{2x}-2e^x$ 补成平方。
    - 验证 $a=1$ 时漏掉负半轴无零点。
  similar_practice_query: e^{2x} e^x sin x 恰有一个正零点 最大整数 a 负半轴排除
