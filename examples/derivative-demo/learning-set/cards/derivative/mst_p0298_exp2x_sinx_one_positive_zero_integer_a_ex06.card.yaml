stem: |-
  （2024 春 · 江北区校级期中）已知函数 $f(x)=e^{2x}+(a-2)e^x-a\sin x-\frac54$。
  1. 当 $a=0$ 时，讨论 $f(x)$ 的单调性。
  2. 若 $f(x)$ 在 $\mathbf R$ 上恰有一个零点 $x_0$，且 $x_0\in(0,+\infty)$，求满足条件的最大整数 $a$。
answer: |-
  第(1)问 $f$ 在 $(-\infty,0)$ 上单调递减，在 $(0,+\infty)$ 上单调递增；第(2)问满足条件的最大整数 $a$ 为 $1$。

  第(1)问当 $a=0$ 时， $f(x)=e^{2x}-2e^x-\frac54$，$f^\prime(x)=2e^x(e^x-1)$。 因此 $x<0$ 时 $f^\prime(x)<0$，$x>0$ 时 $f^\prime(x)>0$， $f$ 在 $(-\infty,0)$ 上递减，在 $(0,+\infty)$ 上递增。第(2)问把 $f$ 改写成 $(e^x-1)^2+a(e^x-\sin x)-\frac94$。当 $a>0$ 时， $(e^x-1)^2$ 与 $a(e^x-\sin x)$ 在 $(0,+\infty)$ 上都递增， 所以 $f$ 在正半轴递增。又 $f(0)=a-\frac94$，若 $a\ge3$，则正半轴无零点，不合题意。检查整数候选： $a=2$ 时 $f(0)<0$，但 $f(-\frac\pi2)=e^{-\pi}+2-\frac54>0$，负半轴已有零点，不合题意。 $a=1$ 时 $f(x)=e^{2x}-e^x-\sin x-\frac54=(e^x-\frac12)^2-\sin x-\frac32$。 在正半轴，$f(0)<0$ 且 $f(1)>0$，结合正半轴递增，只有一个正零点； 在负半轴，$0<e^x<1$，所以 $(e^x-\frac12)^2<\frac14$，又 $-\sin x\le1$，故 $f(x)<0$ 恒成立。于是最大整数 $a=1$。
