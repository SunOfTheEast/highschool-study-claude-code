solution:
  source_solution_summary: 由 $f(x)>0$ 得 $2x+1-(ax+1)e^x>0\iff g(x)<h(x)$，其中 $g(x)=e^x(ax+1),\ h(x)=2x+1$。且 $g^{\prime}(x)=(ax+1+a)e^x=a\left(x+\frac{a+1}{a}\right)e^x$， 所以 $g$ 在 $x=-1-\frac1a$ 处取最小值。按 source 图像分两种唯一整点情形： 图1（左侧唯一整点）要求 $\begin{cases}g(-1)<h(-1)\\g(-2)\ge h(-2)\end{cases}$， 即 $\begin{cases}(1-a)e^{-1}<-1\\e^{-2}(1-2a)\ge-3\end{cases}$， 得 $1+e<a\le\frac{1+3e^2}{2}$； 图2（右侧唯一整点）要求 $\begin{cases}g(1)<h(1)\\g(2)\ge h(2)\end{cases}$， 即 $\begin{cases}e(a+1)<3\\e^2(2a+1)\ge5\end{cases}$，并结合 $a>0$ 得 $0<a<\frac3e-1$。合并可得 $a\in\left(0,\frac3e-1\right)\cup\left(1+e,\frac{1+3e^2}{2}\right]$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把题目改写为“指数曲线在直线下方”的整点计数问题。
      formula_trace:
        from: $2x+1-(ax+1)e^x>0$
        to: $g(x)<h(x),\ g(x)=e^x(ax+1),\ h(x)=2x+1$
        operation: 移项并定义两函数。
        why: 唯一整数解可转化为两图像在整数横坐标处的上下关系。
      source_ref: page_0197_ex4_problem_start
    - step_id: step_2
      statement: 先定位 $g(x)$ 的谷底位置，确认可用两侧分类。
      formula_trace:
        from: $g^{\prime}(x)=(ax+1+a)e^x$
        to: $x=-1-\frac1a$ 处 $g$ 取最小值
        operation: 令 $g^{\prime}(x)=0$ 并做符号判断。
        why: 单谷结构决定“唯一整点”会落在谷底左侧或右侧的局部窗口。
      source_ref: page_0197_ex4_problem_start
    - step_id: step_3
      statement: 图1：左侧唯一整点判定。
      formula_trace:
        from: $g(-1)<h(-1),\ g(-2)\ge h(-2)$
        to: $1+e<a\le\frac{1+3e^2}{2}$
        operation: 代入 $x=-1,-2$ 联立不等式。
        why: 保证左侧只有一个整数满足 $g(x)<h(x)$。
      source_ref: page_0198_ex4_continuation
    - step_id: step_4
      statement: 图2：右侧唯一整点判定。
      formula_trace:
        from: $g(1)<h(1),\ g(2)\ge h(2),\ a>0$
        to: $0<a<\frac3e-1$
        operation: 代入 $x=1,2$ 联立并结合题设。
        why: 在右侧窗口锁定“仅一个整数点在直线下方”。
      source_ref: page_0198_ex4_continuation
    - step_id: step_5
      statement: 合并两类可行情形并对应选项。
      formula_trace:
        from: $1+e<a\le\frac{1+3e^2}{2}$ 与 $0<a<\frac3e-1$
        to: $a\in\left(0,\frac3e-1\right)\cup\left(1+e,\frac{1+3e^2}{2}\right]$
        operation: 取并集并对照选项 D。
        why: 题目只要求“存在唯一整数 $x_0$”，两种图形机制均可成立。
      source_ref: page_0198_ex4_solution
teaching_card:
  student_title: 单谷曲线配直线的整点双情形
  what_it_trains: 训练把“唯一整数解”拆成两种图形窗口，再用相邻整数的成立/排除条件联立求参数并集。
  recognition_cues:
    - 题干是“存在唯一整数 $x_0$”且含指数线性乘积。
    - 可写成 $g(x)<h(x)$ 的曲线-直线比较。
    - 解析出现图1/图2双分支。
  normalization_moves:
    - 先设 $g,h$ 并求 $g^{\prime}(x)$ 定位谷底。
    - 每个分支都写成“近点成立、邻点不成立”的二元条件组。
    - 最后把两段参数区间做并集。
  common_failures:
    - 只验证一个整数点成立，没排除邻点，导致不唯一。
    - 漏加题设 $a>0$，把无效区间带入答案。
    - 把两种图形情形误并为交集。
  similar_practice_query: 整点唯一 单谷函数 直曲分离 双情形分类 参数范围
