stem: |-
  （2024·中山市模拟）设函数 $f(x)=2x+1-(ax+1)e^x$，其中 $a>0$，若存在唯一的整数 $x_0$ 使得 $f(x_0)>0$，则实数 $a$ 的取值范围是（  ）
  A. $(0,\ 4]$
  B. $(0,\ \frac{1+3e^2}{2}]$
  C. $(e+1,\ 8]$
  D. $(0,\ \frac{3}{e}-1)\cup(e+1,\ \frac{1+3e^2}{2}]$
answer: |-
  D

  由 $f(x)>0$ 得 $2x+1-(ax+1)e^x>0\iff g(x)<h(x)$，其中 $g(x)=e^x(ax+1),\ h(x)=2x+1$。且 $g^{\prime}(x)=(ax+1+a)e^x=a\left(x+\frac{a+1}{a}\right)e^x$， 所以 $g$ 在 $x=-1-\frac1a$ 处取最小值。按 source 图像分两种唯一整点情形： 图1（左侧唯一整点）要求 $\begin{cases}g(-1)<h(-1)\\g(-2)\ge h(-2)\end{cases}$， 即 $\begin{cases}(1-a)e^{-1}<-1\\e^{-2}(1-2a)\ge-3\end{cases}$， 得 $1+e<a\le\frac{1+3e^2}{2}$； 图2（右侧唯一整点）要求 $\begin{cases}g(1)<h(1)\\g(2)\ge h(2)\end{cases}$， 即 $\begin{cases}e(a+1)<3\\e^2(2a+1)\ge5\end{cases}$，并结合 $a>0$ 得 $0<a<\frac3e-1$。合并可得 $a\in\left(0,\frac3e-1\right)\cup\left(1+e,\frac{1+3e^2}{2}\right]$，选 D。
