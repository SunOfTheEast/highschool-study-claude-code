stem: |-
  （2023 云南保山质检 T8）若函数 $f(x)=4\ln x+1$ 与函数 $g(x)=\frac1a x^2-2x\ (a>0)$ 的图象存在公切线，则实数 $a$ 的取值范围为（  ）
  A. $(0,\frac13]$
  B. $[\frac13,+\infty)$
  C. $[\frac23,1)$
  D. $[\frac13,\frac23]$
answer: |
  A

  源页把存在公切线转化为图像包住关系。对 $a>0$，若抛物线
  $g(x)=\frac1a x^2-2x$ 位于 $f(x)=4\ln x+1$ 的外侧，使两曲线形成
  一凹一凸内公切线模型，则需要
  $\frac1a x^2-2x\ge 4\ln x+1$ 对 $x>0$ 恒成立，即
  $\frac1a\ge h(x)=\frac{2x+4\ln x+1}{x^2}$。求导得
  $h'(x)=\frac{2-2x-8\ln x}{x^3}$。令
  $\varphi(x)=2-2x-8\ln x$，则 $\varphi'(x)=-2-\frac8x<0$，
  且 $\varphi(1)=0$，所以 $h$ 在 $(0,1)$ 上递增、在 $(1,+\infty)$ 上递减，
  最大值为 $h(1)=3$。于是 $\frac1a\ge3$，又 $a>0$，得
  $0<a\le\frac13$，故选 A。
