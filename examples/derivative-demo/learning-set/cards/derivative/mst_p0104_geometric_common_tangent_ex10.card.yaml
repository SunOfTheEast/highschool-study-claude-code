solution:
  source_solution_summary: |
    源页把存在公切线转化为图像包住关系。对 $a>0$，若抛物线
    $g(x)=\frac1a x^2-2x$ 位于 $f(x)=4\ln x+1$ 的外侧，使两曲线形成
    一凹一凸内公切线模型，则需要
    $\frac1a x^2-2x\ge 4\ln x+1$ 对 $x>0$ 恒成立，即
    $\frac1a\ge h(x)=\frac{2x+4\ln x+1}{x^2}$。求导得
    $h'(x)=\frac{2-2x-8\ln x}{x^3}$。令
    $\varphi(x)=2-2x-8\ln x$，则 $\varphi'(x)=-2-\frac8x<0$，
    且 $\varphi(1)=0$，所以 $h$ 在 $(0,1)$ 上递增、在 $(1,+\infty)$ 上递减，
    最大值为 $h(1)=3$。于是 $\frac1a\ge3$，又 $a>0$，得
    $0<a\le\frac13$，故选 A。
  key_steps:
    - step_id: step_1
      statement: 把公切线存在性转成外侧包裹的恒成立不等式。
      formula_trace:
        from: |
          $g(x)\ge f(x)$
        to: |
          $\frac1a x^2-2x\ge 4\ln x+1\quad (x>0)$
        operation: 根据源页图像，把抛物线在对数曲线外侧作为内公切线存在的判定条件。
        why: 一凹一凸且外侧相离时可类比内公切线模型。
      source_ref: page_0104
    - step_id: step_2
      statement: 分离参数。
      formula_trace:
        from: |
          $\frac1a x^2-2x\ge 4\ln x+1$
        to: |
          $\frac1a\ge \frac{2x+4\ln x+1}{x^2}=:h(x)$
        operation: 把含 $a$ 的系数移到左边，除以 $x^2>0$。
        why: 要对所有 $x>0$ 成立，只需控制右端函数的最大值。
      source_ref: page_0104
    - step_id: step_3
      statement: 求 $h(x)$ 的最大值。
      formula_trace:
        from: |
          $h(x)=\frac{2x+4\ln x+1}{x^2}$
        to: |
          $h'(x)=\frac{2-2x-8\ln x}{x^3}$
        operation: 对商式求导并整理。
        why: 源页通过导数符号判断 $h$ 的最大值位置。
      source_ref: page_0105
    - step_id: step_4
      statement: 判断导数符号并得到参数范围。
      formula_trace:
        from: |
          $\varphi(x)=2-2x-8\ln x,\quad \varphi'(x)=-2-\frac8x<0,\quad \varphi(1)=0$
        to: |
          $h_{\max}=h(1)=3,\qquad \frac1a\ge3,\qquad 0<a\le\frac13$
        operation: 由 $\varphi$ 单调递减得 $h^\prime$ 先正后负，再代入 $x=1$。
        why: 右端最大值是 3，左端 $\frac1a$ 至少要达到这个高度。
      source_ref: page_0105
teaching_card:
  student_title: 把对数曲线和含参抛物线公切线化成最大值
  what_it_trains: 训练先用图像判断公切线存在的包裹关系，再分离参数，把问题转成一个单变量函数最大值。
  recognition_cues:
    - 一条是对数曲线，一条是开口向上的含参抛物线，公切线存在常转成外侧相离。
    - 参数只在二次项系数 $\frac1a$ 中，适合分离参数。
    - 选项端点有 $\frac13$，提示要算某个辅助函数的最大值 3。
  normalization_moves:
    - 由图像写出 $\frac1a x^2-2x\ge4\ln x+1$。
    - 分离为 $\frac1a\ge h(x)$。
    - 求 $h^\prime$，用 $\varphi(x)=2-2x-8\ln x$ 判断最大值。
  common_failures:
    - 只凭“存在公切线”直接列两切点方程，算量变大。
    - 把 $\frac1a\ge3$ 误解成 $a\ge3$。
    - 求 $h^\prime(x)$ 时漏掉分母 $x^3$，导致单调性判断错误。
  similar_practice_query: 对数 含参抛物线 公切线 分离参数 最大值
