stem: |-
  （2024·米东区月考）定义在 $\mathbf{R}$ 上的可导函数 $f(x)$，其导函数记为 $f^{\prime}(x)$，满足 $f(x)+2x=f(2-x)+2$，且当 $x\leqslant1$ 时，恒有 $f^{\prime}(x)+2>x$。若 $f(m)-f(1-m)\geqslant\frac32-3m$，则实数 $m$ 的取值范围是（  ）
  A. $\left[\frac12,+\infty\right)$
  B. $(-\infty,1]$
  C. $[1,+\infty)$
  D. $\left(-\infty,\frac12\right]$
answer: |
  A

  由 $f(x)+2x=f(2-x)+2$ 可改写为
  $f(x)+x=f(2-x)+2-x$，说明 $f(x)+x$ 关于 $x=1$ 对称。
  按源解构造
  $g(x)=f(x)+2x-\frac12x^2$，则
  $g^{\prime}(x)=f^{\prime}(x)+2-x$。
  题设给出 $x\le1$ 时 $f^{\prime}(x)+2>x$，故
  $g^{\prime}(x)>0$ 在 $(-\infty,1]$ 恒成立，于是
  $g$ 在 $(-\infty,1]$ 递增。再由对称关系
  $f(x)+2x=f(2-x)+2$ 可验得 $g(2-x)=g(x)$，即
  $g$ 关于 $x=1$ 轴对称，因此在 $[1,+\infty)$ 递减。
  将条件
  $f(m)-f(1-m)\ge\frac32-3m$
  改写为
  $f(m)+2m-\frac12m^2\ge f(1-m)+2(1-m)-\frac12(1-m)^2$，
  即 $g(m)\ge g(1-m)$。在“以 $x=1$ 为轴对称且两侧单调”的结构下，
  这等价于 $|m-1|\le |(1-m)-1|=|m|$。
  解得 $m\ge\frac12$，故选 A。
