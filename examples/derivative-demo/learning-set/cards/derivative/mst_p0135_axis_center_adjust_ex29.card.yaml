solution:
  source_solution_summary: |
    由 $f(x)+2x=f(2-x)+2$ 可改写为
    $f(x)+x=f(2-x)+2-x$，说明 $f(x)+x$ 关于 $x=1$ 对称。
    按源解构造
    $g(x)=f(x)+2x-\frac12x^2$，则
    $g^{\prime}(x)=f^{\prime}(x)+2-x$。
    题设给出 $x\le1$ 时 $f^{\prime}(x)+2>x$，故
    $g^{\prime}(x)>0$ 在 $(-\infty,1]$ 恒成立，于是
    $g$ 在 $(-\infty,1]$ 递增。再由对称关系
    $f(x)+2x=f(2-x)+2$ 可验得 $g(2-x)=g(x)$，即
    $g$ 关于 $x=1$ 轴对称，因此在 $[1,+\infty)$ 递减。
    将条件
    $f(m)-f(1-m)\ge\frac32-3m$
    改写为
    $f(m)+2m-\frac12m^2\ge f(1-m)+2(1-m)-\frac12(1-m)^2$，
    即 $g(m)\ge g(1-m)$。在“以 $x=1$ 为轴对称且两侧单调”的结构下，
    这等价于 $|m-1|\le |(1-m)-1|=|m|$。
    解得 $m\ge\frac12$，故选 A。
  key_steps:
    - step_id: step_1
      statement: 由题设等式读出对称轴位置。
      formula_trace:
        from: $f(x)+2x=f(2-x)+2$
        to: $f(x)+x=f(2-x)+2-x$
        operation: 两侧各减 $x$，把输入配成 $x$ 与 $2-x$。
        why: 显示“关于 $x=1$ 的对称配对”结构。
      source_ref: page_0135_solution
    - step_id: step_2
      statement: 构造二次偏移函数，匹配导数条件。
      formula_trace:
        from: $g(x)=f(x)+2x-\frac12x^2$
        to: $g^{\prime}(x)=f^{\prime}(x)+2-x$
        operation: 按源解直接构造并求导。
        why: 可把题设 $f^{\prime}(x)+2>x$ 直接转成 $g^{\prime}(x)>0$。
      source_ref: page_0135_solution
    - step_id: step_3
      statement: 确定 $g$ 的“左增右减”单峰结构。
      formula_trace:
        from: $x\le1$ 时 $g^{\prime}(x)>0$，且 $g(2-x)=g(x)$
        to: $g$ 在 $(-\infty,1]$ 递增，在 $[1,+\infty)$ 递减
        operation: 先用导数得左侧递增，再由关于 $x=1$ 的轴对称延拓右侧递减。
        why: 后续可把函数值比较转成“离对称轴远近”比较。
      source_ref: page_0136_cont
    - step_id: step_4
      statement: 把目标不等式改写为 $g$ 值比较。
      formula_trace:
        from: $f(m)-f(1-m)\ge \frac32-3m$
        to: $g(m)\ge g(1-m)$
        operation: 将右侧常量与线性项配成二次差：$g(m)-g(1-m)=f(m)-f(1-m)+3m-\frac32$。
        why: 把原式降维到同一函数在两点的比较。
      source_ref: page_0136_cont
    - step_id: step_5
      statement: 在轴对称单峰结构中比较到中心的距离。
      formula_trace:
        from: $g(m)\ge g(1-m)$
        to: $|m-1|\le |(1-m)-1|=|m|$
        operation: 更靠近对称轴 $x=1$ 的输入对应更大函数值。
        why: 转成绝对值不等式后可直接解参。
      source_ref: page_0136_cont
    - step_id: step_6
      statement: 解出参数范围并对应选项。
      formula_trace:
        from: $|m-1|\le |m|$
        to: $(m-1)^2\le m^2\Rightarrow m\ge \frac12$
        operation: 两侧平方化简。
        why: 对应选项 A。
      source_ref: page_0136_cont
teaching_card:
  student_title: 围绕对称轴做二次偏移，再比离轴距离
  what_it_trains: 训练在“$x$ 与 $2-x$”型对称题中，把函数先调成便于判导数的形式，再用单峰轴对称结构把函数值比较转为绝对值比较。
  recognition_cues:
    - 题干出现 $f(x)$ 与 $f(2-x)$ 同时出现。
    - 导数条件只给到 $x\le1$，常需要配合对称轴补全右侧信息。
    - 目标式是 $f(m)-f(1-m)$，天然与中心 $x=\frac12$ 或轴 $x=1$ 的距离关系有关。
  normalization_moves:
    - 先锁轴：把等式改写成关于 $x=1$ 的成对输入。
    - 再偏移：构造 $g(x)=f(x)+2x-\frac12x^2$。
    - 将目标改写为 $g(m)\ge g(1-m)$，再转绝对值。
  common_failures:
    - 只用左侧导数结论，不借轴对称补右侧单调。
    - 配凑时把 $\frac32-3m$ 与二次项对应关系写错。
    - 从 $|m-1|\le|m|$ 解参时端点漏掉 $\frac12$。
  similar_practice_query: 对称轴锁定 二次偏移 导数条件 参数范围 跨页例题
