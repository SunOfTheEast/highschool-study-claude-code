solution:
  source_solution_summary: |
    由
    \[
    f(1+x)=f(1-x)
    \]
    且 $f(3)=2$，取 $x=2$ 得
    \[
    f(3)=f(-1)=2.
    \]
    又由
    \[
    (x-1)f^{\prime}(x)>0
    \]
    可知：当 $x<1$ 时 $f^{\prime}(x)<0$，当 $x>1$ 时 $f^{\prime}(x)>0$，
    所以 $f(x)$ 在 $(-\infty,1)$ 递减、在 $(1,+\infty)$ 递增。

    解不等式
    \[
    [f(x)-2]\ln x<0.
    \]
    先看定义域：$x>0$ 且 $x\neq 1$。

    1) 当 $0<x<1$ 时，$\ln x<0$，故需 $f(x)-2>0$，即 $f(x)>2=f(-1)$。
    但在 $(-\infty,1)$ 上 $f$ 递减，$f(x)>f(-1)$ 推得 $x<-1$，与 $0<x<1$ 矛盾，无解。

    2) 当 $x>1$ 时，$\ln x>0$，故需 $f(x)-2<0$，即 $f(x)<2=f(3)$。
    在 $(1,+\infty)$ 上 $f$ 递增，$f(x)<f(3)$ 推得 $x<3$，
    合并 $x>1$ 得 $1<x<3$。

    故解集为 $(1,3)$。
  key_steps:
    - step_id: step_1
      statement: 利用中心对称条件把已知点值搬到另一侧。
      formula_trace:
        from: $f(1+x)=f(1-x)$，$f(3)=2$
        to: $f(-1)=2$
        operation: 在对称关系中代 $x=2$。
        why: 为左侧区间比较提供已知锚点。
      source_ref: page_0132
    - step_id: step_2
      statement: 由 $(x-1)f^{\prime}(x)>0$ 判断两侧单调方向。
      formula_trace:
        from: $(x-1)f^{\prime}(x)>0$
        to: $x<1\\Rightarrow f^{\prime}(x)<0$；$x>1\\Rightarrow f^{\prime}(x)>0$
        operation: 按 $x-1$ 符号分段。
        why: 锁定“左减右增”是后续比较的核心。
      source_ref: page_0132
    - step_id: step_3
      statement: 按 $\\ln x$ 符号分区间，分别转化为 $f(x)$ 与2的比较。
      formula_trace:
        from: $[f(x)-2]\\ln x<0$
        to: $0<x<1\\Rightarrow f(x)>2$；$x>1\\Rightarrow f(x)<2$
        operation: 利用乘积异号条件。
        why: 把混合不等式拆成可用单调性处理的两段。
      source_ref: page_0133
    - step_id: step_4
      statement: 结合单调性完成区间筛选。
      formula_trace:
        from: $f(x)>f(-1)$（左段）与 $f(x)<f(3)$（右段）
        to: 左段无解，右段得 $1<x<3$
        operation: 递减/递增函数的值域比较反推自变量。
        why: 得到唯一有效区间。
      source_ref: page_0133
teaching_card:
  student_title: 先锁对称点，再按对数符号分两段
  what_it_trains: 把“中心对称 + 单调翻转 + 对数分段”整合成一条稳定解题链。
  recognition_cues:
    - 出现 $f(1+x)=f(1-x)$ 这类“同心偏移”条件。
    - 同时给出 $(x-a)f^{\prime}(x)>0$，提示中心点两侧单调不同。
    - 目标式含 $\\ln x$，必须分 $0<x<1$ 与 $x>1$。
  normalization_moves:
    - 从对称条件把已知点 $x=3$ 转到 $x=-1$。
    - 由 $(x-1)f^{\prime}(x)>0$ 写出左右单调性。
    - 按 $\\ln x$ 符号分段，把乘积不等式转为函数值比较。
  common_failures:
    - 忘记 $\\ln x$ 仅在 $x>0$ 定义。
    - 把“左减右增”方向写反。
    - 左段得到 $x<-1$ 后没有与 $0<x<1$ 交集筛选。
  similar_practice_query: 抽象函数 共对称中心 $(x-a)f^{\prime}(x)>0$ ln分段 不等式解集
