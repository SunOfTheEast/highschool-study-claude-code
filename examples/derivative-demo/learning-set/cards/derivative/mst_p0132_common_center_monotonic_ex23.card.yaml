stem: （2024·湖北月考）已知定义在 $\mathbf{R}$ 上的函数 $f(x)$ 的导函数为 $f^{\prime}(x)$，满足 $f(1+x)=f(1-x)$，$(x-1)f^{\prime}(x)>0$，$f(3)=2$，则不等式 $[f(x)-2]\ln x<0$ 的解集为______。
answer: |
  $(1,3)$

  由
  \[
  f(1+x)=f(1-x)
  \]
  且 $f(3)=2$，取 $x=2$ 得
  \[
  f(3)=f(-1)=2.
  \]
  又由
  \[
  (x-1)f^{\prime}(x)>0
  \]
  可知：当 $x<1$ 时 $f^{\prime}(x)<0$，当 $x>1$ 时 $f^{\prime}(x)>0$，
  所以 $f(x)$ 在 $(-\infty,1)$ 递减、在 $(1,+\infty)$ 递增。

  解不等式
  \[
  [f(x)-2]\ln x<0.
  \]
  先看定义域：$x>0$ 且 $x\neq 1$。

  1) 当 $0<x<1$ 时，$\ln x<0$，故需 $f(x)-2>0$，即 $f(x)>2=f(-1)$。
  但在 $(-\infty,1)$ 上 $f$ 递减，$f(x)>f(-1)$ 推得 $x<-1$，与 $0<x<1$ 矛盾，无解。

  2) 当 $x>1$ 时，$\ln x>0$，故需 $f(x)-2<0$，即 $f(x)<2=f(3)$。
  在 $(1,+\infty)$ 上 $f$ 递增，$f(x)<f(3)$ 推得 $x<3$，
  合并 $x>1$ 得 $1<x<3$。

  故解集为 $(1,3)$。
