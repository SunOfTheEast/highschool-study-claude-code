solution:
  source_solution_summary: |
    因为 $h(x)$ 是奇函数，所以 $h(x)=-h(-x)$ 且 $h(0)=0$。
    又 $h(2-x)=f(2-x)+f(x)=h(x)$，于是 $h(2-x)=-h(-x)$，
    即 $h(2+x)=-h(x)$。把 $x$ 换成 $x+2$，得
    $h(4+x)=-h(x+2)=h(x)$，所以 $4$ 是 $h$ 的一个周期。
    因此 $h(6)=h(2)=-h(0)=0$，展开得
    $f(6)+f(-4)=0$，B正确。

    对 $h(x)=-h(-x)$ 求导，得 $h^{\prime}(x)=h^{\prime}(-x)$；
    又 $h^{\prime}(x)=f^{\prime}(x)-f^{\prime}(2-x)$，所以
    $h^{\prime}(2-x)=-h^{\prime}(x)$。令 $x=1$ 得
    $h^{\prime}(1)=-h^{\prime}(1)$，即 $h^{\prime}(1)=0$，C正确。
    取 $f(x)=\frac12\sin\frac{\pi}{2}x$，则
    $h(x)=\sin\frac{\pi}{2}x$ 满足题设，但 $h(1)=1$，A错误；
    且 $h^{\prime}(6)=f^{\prime}(6)-f^{\prime}(-4)=-\frac{\pi}{2}$，
    所以 $f^{\prime}(6)\ne f^{\prime}(-4)$，D错误。故选BC。
  key_steps:
    - step_id: step_1
      statement: 先把 $h$ 的轴对称和奇性配成周期。
      formula_trace:
        from: $h(x)=-h(-x)$，$h(2-x)=h(x)$
        to: $h(2+x)=-h(x)$，进而 $h(x+4)=h(x)$
        operation: 用奇函数关系替换 $h(2-x)$ 中的右侧，再平移变量。
        why: 奇性加轴对称会生成周期，这是判断 B 的主线。
      source_ref: page_0122
    - step_id: step_2
      statement: 用周期计算 $h(6)$，再展开回 $f$。
      formula_trace:
        from: $h(6)=h(2)=-h(0)$，$h(0)=0$
        to: $f(6)+f(-4)=0$，即 $f(6)=-f(-4)$
        operation: 代入 $h(x)=f(x)+f(2-x)$。
        why: B项本质上是 $h(6)=0$ 的展开式。
      source_ref: page_0122
    - step_id: step_3
      statement: 对对称关系求导，锁定 $h^{\prime}(1)$。
      formula_trace:
        from: $h(x)=-h(-x)$，$h(2-x)=h(x)$
        to: $h^{\prime}(x)=h^{\prime}(-x)$，$h^{\prime}(2-x)=-h^{\prime}(x)$，$h^{\prime}(1)=0$
        operation: 分别求导，并在对称轴 $x=1$ 处代入。
        why: 导函数在这个点同时受到偶性和反对称约束，只能取零。
      source_ref: page_0122
    - step_id: step_4
      statement: 构造满足题设的函数反驳过强结论。
      formula_trace:
        from: $f(x)=\frac12\sin\frac{\pi}{2}x$
        to: $h(x)=\sin\frac{\pi}{2}x$，$h(1)=1$，$f^{\prime}(6)\ne f^{\prime}(-4)$
        operation: 代入具体函数验证题设并计算选项结论。
        why: A、D只要有一个合法反例就不能作为必然结论。
      source_ref: page_0122
teaching_card:
  student_title: 奇性加轴对称，先配出周期
  what_it_trains: 训练把抽象函数的中心对称、轴对称、周期和导函数关系串起来，并区分必然结论与反例可破的结论。
  recognition_cues:
    - 看到 $f(x)+f(2-x)$，先写出 $h(2-x)=h(x)$。
    - 题干又说 $h$ 是奇函数，提示“奇性 + 轴对称 = 周期”。
    - 选项问导数时，要对已有对称关系求导，而不是凭图像直觉判断。
  normalization_moves:
    - 写出 $h(x)=-h(-x)$ 和 $h(2-x)=h(x)$。
    - 推出 $h(2+x)=-h(x)$。
    - 再平移得到 $h(x+4)=h(x)$。
    - 对关系式求导后在 $x=1$ 代入。
  common_failures:
    - 只用奇函数，忘了 $h(2-x)=h(x)$ 这个隐藏轴对称。
    - 把 $h(2-x)$ 求导时负号写丢。
    - 把 $h^{\prime}(6)=f^{\prime}(6)-f^{\prime}(-4)$ 误读成 $f^{\prime}(6)=f^{\prime}(-4)$。
    - 看到 A、D 像对称结论就直接选，没有构造反例。
  similar_practice_query: 抽象函数 奇函数 轴对称 周期 h(2-x)=h(x) 导函数 对称 反例
