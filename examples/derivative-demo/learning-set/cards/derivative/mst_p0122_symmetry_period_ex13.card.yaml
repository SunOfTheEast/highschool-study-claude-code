stem: |-
  （2023 · 桃城区三模 · 多选）已知函数 $f(x)$ 的定义域为 $\mathbf{R}$，$h(x)=f(x)+f(2-x)$ 是奇函数，$h(x)$ 的导函数为 $h^{\prime}(x)$，则（  ）
  A. $h(1)=0$
  B. $f(6)=-f(-4)$
  C. $h^{\prime}(1)=0$
  D. $f^{\prime}(6)=f^{\prime}(-4)$
answer: |
  BC

  因为 $h(x)$ 是奇函数，所以 $h(x)=-h(-x)$ 且 $h(0)=0$。
  又 $h(2-x)=f(2-x)+f(x)=h(x)$，于是 $h(2-x)=-h(-x)$，
  即 $h(2+x)=-h(x)$。把 $x$ 换成 $x+2$，得
  $h(4+x)=-h(x+2)=h(x)$，所以 $4$ 是 $h$ 的一个周期。
  因此 $h(6)=h(2)=-h(0)=0$，展开得
  $f(6)+f(-4)=0$，B正确。

  对 $h(x)=-h(-x)$ 求导，得 $h^{\prime}(x)=h^{\prime}(-x)$；
  又 $h^{\prime}(x)=f^{\prime}(x)-f^{\prime}(2-x)$，所以
  $h^{\prime}(2-x)=-h^{\prime}(x)$。令 $x=1$ 得
  $h^{\prime}(1)=-h^{\prime}(1)$，即 $h^{\prime}(1)=0$，C正确。
  取 $f(x)=\frac12\sin\frac{\pi}{2}x$，则
  $h(x)=\sin\frac{\pi}{2}x$ 满足题设，但 $h(1)=1$，A错误；
  且 $h^{\prime}(6)=f^{\prime}(6)-f^{\prime}(-4)=-\frac{\pi}{2}$，
  所以 $f^{\prime}(6)\ne f^{\prime}(-4)$，D错误。故选BC。
