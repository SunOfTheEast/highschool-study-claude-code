stem: |-
  （2023·浙江期中）已知 $a=\left(\frac35\right)^{\frac25}$，$b=\left(\frac25\right)^{\frac35}$，$c=\left(\frac25\right)^5$，则（  ）
  A. $a<b<c$
  B. $c<b<a$
  C. $b<c<a$
  D. $c<a<b$
answer: |
  B

  法一：同幂化到 $\\frac15$ 次幂。
  $a=\\sqrt[5]{\\frac9{25}}$，
  $b=\\sqrt[5]{\\frac8{125}}$，
  $c=\\sqrt[5]{(\\frac25)^{25}}$。
  由于 $\\left(\\frac25\\right)^{25}<\\frac8{125}<\\frac9{25}$，
  且 $x^{1/5}$ 在 $(0,+\\infty)$ 上递增，
  得 $c<b<a$。
  法二：把前两项看成 $a^b$ 与 $b^a$ 型，
  取 $a_0=\\frac35,b_0=\\frac25$，满足 $e>a_0>b_0>0$，
  所以 $a_0^{b_0}>b_0^{a_0}$，即 $a>b$；
  又 $0<\\frac25<1$ 且 $\\frac35<5$，
  故 $\\left(\\frac25\\right)^{\\frac35}>\\left(\\frac25\\right)^5$，即 $b>c$。
  合并得 $c<b<a$，选 B。
