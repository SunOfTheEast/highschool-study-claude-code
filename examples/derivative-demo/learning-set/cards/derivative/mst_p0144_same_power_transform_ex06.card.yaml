solution:
  source_solution_summary: |
    法一：同幂化到 $\\frac15$ 次幂。
    $a=\\sqrt[5]{\\frac9{25}}$，
    $b=\\sqrt[5]{\\frac8{125}}$，
    $c=\\sqrt[5]{(\\frac25)^{25}}$。
    由于 $\\left(\\frac25\\right)^{25}<\\frac8{125}<\\frac9{25}$，
    且 $x^{1/5}$ 在 $(0,+\\infty)$ 上递增，
    得 $c<b<a$。
    法二：把前两项看成 $a^b$ 与 $b^a$ 型，
    取 $a_0=\\frac35,b_0=\\frac25$，满足 $e>a_0>b_0>0$，
    所以 $a_0^{b_0}>b_0^{a_0}$，即 $a>b$；
    又 $0<\\frac25<1$ 且 $\\frac35<5$，
    故 $\\left(\\frac25\\right)^{\\frac35}>\\left(\\frac25\\right)^5$，即 $b>c$。
    合并得 $c<b<a$，选 B。
  key_steps:
    - step_id: step_1
      statement: 法一先统一成同幂函数。
      formula_trace:
        from: $a=(\frac35)^{\frac25},\ b=(\frac25)^{\frac35},\ c=(\frac25)^5$
        to: $a=\sqrt[5]{\frac9{25}},\ b=\sqrt[5]{\frac8{125}},\ c=\sqrt[5]{(\frac25)^{25}}$
        operation: 把指数写成 $1/5$ 的形式。
        why: 转成同一递增函数 $x\mapsto x^{1/5}$ 的输入比较。
      source_ref: page_0144_ex06_solution
    - step_id: step_2
      statement: 比较三个被开方数。
      formula_trace:
        from: $(\frac25)^{25},\ \frac8{125},\ \frac9{25}$
        to: $(\frac25)^{25}<\frac8{125}<\frac9{25}\Rightarrow c<b<a$
        operation: 先比较真数，再用5次根函数保序。
        why: 直接得到目标次序。
      source_ref: page_0144_ex06_solution
    - step_id: step_3
      statement: 法二用 $a^b$ 与 $b^a$ 规则判 $a>b$。
      formula_trace:
        from: $a=(\frac35)^{\frac25},\ b=(\frac25)^{\frac35}$
        to: 令 $a_0=\frac35,b_0=\frac25$，$e>a_0>b_0>0\Rightarrow a_0^{b_0}>b_0^{a_0}$，故 $a>b$
        operation: 套用同构函数 $\ln x/x$ 对应的“大指小底”结论。
        why: 避免繁琐数值估算。
      source_ref: page_0144_ex06_solution
    - step_id: step_4
      statement: 同底比较得到 $b>c$。
      formula_trace:
        from: $b=(\frac25)^{\frac35},\ c=(\frac25)^5$
        to: 0<\frac25<1,\ \frac35<5\Rightarrow b>c$
        operation: 底数在 $(0,1)$ 时指数越大值越小。
        why: 与 step_3 合并可得全序。
      source_ref: page_0144_ex06_solution
    - step_id: step_5
      statement: 汇总结论。
      formula_trace:
        from: $a>b,\ b>c$
        to: $c<b<a$
        operation: 传递性合并。
        why: 对应选项 B。
      source_ref: page_0144_ex06_solution
teaching_card:
  student_title: 先同幂，再用口诀复核
  what_it_trains: 训练“幂比较优先做标准化”：把杂乱指数统一成同幂，再用一条递增性完成排序；同时学会用 $a^b$ 与 $b^a$ 规则做快速二次验证。
  recognition_cues:
    - 多个分数指数同时出现。
    - 出现互换结构 $(3/5)^{2/5}$ 与 $(2/5)^{3/5}$。
    - 其中一项是同底高次幂，便于直接判断。
  normalization_moves:
    - 把每一项都改写为5次根。
    - 先比较根号内，再回到原量。
    - 用同底 $q\in(0,1)$ 的指数规则收尾。
  common_failures:
    - 同幂化后把 $\frac9{25}$ 与 $\frac8{125}$ 比大小算错。
    - 把“大指小底”应用方向记反。
    - 忘记底数小于1时同底幂比较会反向。
  similar_practice_query: 同幂化 分数指数比较 a^b与b^a 底数小于1
