    - 把 $f(-x)=e^{2x}f(x)$ 写成 $F(-x)=F(x)$。
    - 把 $2f+f^{\prime}$ 乘 $e^{2x}$ 写成乘积导数。
    - 先定 $f(x)$ 再解 D，不要分开硬算。
  common_failures:
    - 把 $[f(-x)]^{\prime}$ 写成 $f^{\prime}(-x)$，漏掉负号。
    - 把 $f(x)=x(1-e^{-2x})$ 误抄成 $x(1+e^{-2x})$。
    - D 中忘记先化简，直接对复杂式求导。
