stem: |-
  （2023 · 包河区期末 · 多选）定义在 $\mathbf{R}$ 上的函数 $f(x)$ 的导函数为 $f^{\prime}(x)$，对于任意实数 $x$，都有 $f(-x)=e^{2x}f(x)$，且满足 $2f(x)+f^{\prime}(x)=2x+1-e^{-2x}$，则（  ）
  A. 函数 $F(x)=e^x f(x)$ 为偶函数
  B. $f(0)=0$
  C. $f(x)=x(1+e^{-2x})$
  D. 不等式 $e^x f(x)+\frac{x}{e^x}>e$ 的解集为 $(1,+\infty)$
answer: |
  ABD

  由 $f(-x)=e^{2x}f(x)$，两边同乘 $e^{-x}$ 得
  $F(-x)=e^{-x}f(-x)=e^x f(x)=F(x)$，故 A 正确。
  再由
  $2f(x)+f^{\prime}(x)=2x+1-e^{-2x}$，
  两边乘 $e^{2x}$ 得
  $2e^{2x}f(x)+e^{2x}f^{\prime}(x)=(2x+1)e^{2x}-1$，
  即 $[e^{2x}f(x)]^{\prime}=(2x+1)e^{2x}-1$。
  结合 $e^{2x}f(x)=f(-x)$，
  得 $-f^{\prime}(-x)=(2x+1)e^{2x}-1$，
  进而 $-f^{\prime}(x)=(1-2x)e^{-2x}-1$。
  代回可得
  $2f(x)=2x+1-e^{-2x}-f^{\prime}(x)=2x(1-e^{-2x})$，
  所以 $f(x)=x(1-e^{-2x})$，从而 $f(0)=0$，B 对、C 错。
  又
  $e^x f(x)+\frac{x}{e^x}
  =xe^x(1-e^{-2x})+\frac{x}{e^x}
  =xe^x$。
  令 $g(x)=xe^x$，则 $g^{\prime}(x)=(x+1)e^x$，在 $x>-1$ 上递增，且 $g(1)=e$。
  于是 $xe^x>e\iff x>1$，D 正确。答案 ABD。
