  student_title: 先做对称代换，再做整体微分
  what_it_trains: 训练把“$f(-x)$ 与 $f(x)$ 的指数关系”转成偶函数结构，再联立微分方程快速还原函数并完成多选判定。
  recognition_cues:
    - 题目同时给 $f(-x)$ 关系和 $2f+f^{\prime}$ 关系。
    - 选项里既有奇偶性也有显式表达和不等式解集。
    - 出现 $e^x f(x)+\frac{x}{e^x}$，常可整体化简。
