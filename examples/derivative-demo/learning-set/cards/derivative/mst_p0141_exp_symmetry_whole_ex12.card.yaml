solution:
  source_solution_summary: |
    由 $f(-x)=e^{2x}f(x)$，两边同乘 $e^{-x}$ 得
    $F(-x)=e^{-x}f(-x)=e^x f(x)=F(x)$，故 A 正确。
    再由
    $2f(x)+f^{\prime}(x)=2x+1-e^{-2x}$，
    两边乘 $e^{2x}$ 得
    $2e^{2x}f(x)+e^{2x}f^{\prime}(x)=(2x+1)e^{2x}-1$，
    即 $[e^{2x}f(x)]^{\prime}=(2x+1)e^{2x}-1$。
    结合 $e^{2x}f(x)=f(-x)$，
    得 $-f^{\prime}(-x)=(2x+1)e^{2x}-1$，
    进而 $-f^{\prime}(x)=(1-2x)e^{-2x}-1$。
    代回可得
    $2f(x)=2x+1-e^{-2x}-f^{\prime}(x)=2x(1-e^{-2x})$，
    所以 $f(x)=x(1-e^{-2x})$，从而 $f(0)=0$，B 对、C 错。
    又
    $e^x f(x)+\frac{x}{e^x}
    =xe^x(1-e^{-2x})+\frac{x}{e^x}
    =xe^x$。
    令 $g(x)=xe^x$，则 $g^{\prime}(x)=(x+1)e^x$，在 $x>-1$ 上递增，且 $g(1)=e$。
    于是 $xe^x>e\iff x>1$，D 正确。答案 ABD。
  key_steps:
    - step_id: step_1
      statement: 整体乘指数，直接得到偶函数。
      formula_trace:
        from: $f(-x)=e^{2x}f(x)$
        to: $F(x)=e^x f(x),\ F(-x)=e^{-x}f(-x)=e^x f(x)=F(x)$
        operation: 两边同乘 $e^{-x}$。
        why: A 项正是这个整体代换后的奇偶性。
      source_ref: page_0141_ex12_solution
    - step_id: step_2
      statement: 把微分方程与对称关系联立。
      formula_trace:
        from: $2f(x)+f^{\prime}(x)=2x+1-e^{-2x}$
        to: $[e^{2x}f(x)]^{\prime}=(2x+1)e^{2x}-1$
        operation: 两边乘 $e^{2x}$ 并识别乘积导数。
        why: 便于替换成 $f(-x)$ 的导数。
      source_ref: page_0141_ex12_solution
    - step_id: step_3
      statement: 由 $f(-x)$ 的导数关系求出 $f^{\prime}(x)$ 形式。
      formula_trace:
        from: $[e^{2x}f(x)]^{\prime}=[f(-x)]^{\prime}$
        to: $-f^{\prime}(-x)=(2x+1)e^{2x}-1\Rightarrow -f^{\prime}(x)=(1-2x)e^{-2x}-1$
        operation: 先写 $[f(-x)]^{\prime}=-f^{\prime}(-x)$，再做变量替换 $x\mapsto -x$。
        why: 为回代求 $f(x)$ 做准备。
      source_ref: page_0141_ex12_solution
    - step_id: step_4
      statement: 回代得到 $f(x)$，判断 B、C。
      formula_trace:
        from: $2f(x)=2x+1-e^{-2x}-f^{\prime}(x)$
        to: $f(x)=x(1-e^{-2x}),\ f(0)=0$
        operation: 把 step_3 的 $f^{\prime}(x)$ 表达式代入并化简。
        why: $f(0)=0$ 成立，且 C 里的“$+$”号错误。
      source_ref: page_0141_ex12_solution
    - step_id: step_5
      statement: 化简 D 的不等式为标准比较式。
      formula_trace:
        from: $e^x f(x)+\frac{x}{e^x}>e$
        to: $xe^x>e$
        operation: 代入 $f(x)=x(1-e^{-2x})$ 并约简。
        why: 把复杂表达转成单函数单调性判定。
      source_ref: page_0141_ex12_solution
    - step_id: step_6
      statement: 利用 $g(x)=xe^x$ 单调性解不等式并汇总。
      formula_trace:
        from: $g(x)=xe^x,\ g^{\prime}(x)=(x+1)e^x$
        to: $g(1)=e,\ g(x)>e\iff x>1$
        operation: 在 $x>-1$ 上用递增性比较到基准点 $x=1$。
        why: D 正确，合并得答案 ABD。
      source_ref: page_0141_ex12_solution
