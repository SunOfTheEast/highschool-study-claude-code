stem: (2023 安徽师大附中月考 T16) 已知 $a>e^{-\frac{2}{3}}$, 若对于任意的 $x\in\left[\frac{2}{3},+\infty\right)$, 不等式 $\ln\frac{2a}{3x}\geqslant-\frac{1}{ae^x}+\frac{2}{3x}-x$ 恒成立，则 $a$ 的最小值为______.
answer: |-
  $\frac{3}{2e}$

  把原不等式移项为 $\ln a+x+1/(ae^x)\ge -\ln(2/(3x))+2/(3x)$，即 $\ln(ae^x)+1/(ae^x)\ge\ln(3x/2)+2/(3x)$。设 $F(u)=\ln u+1/u$。由 $x\ge2/3$ 得 $3x/2\ge1$，由 $a>e^{-2/3}$ 得 $ae^x>1$；且 $F'(u)=(u-1)/u^2\ge0$，故 $F$ 在 $[1,+\infty)$ 递增。于是 $F(ae^x)\ge F(3x/2)$ 推出 $ae^x\ge3x/2$，即 $a\ge(3/2)x/e^x$。在 $x\in[2/3,+\infty)$ 上，$x/e^x$ 最大值为 $1/e$，所以 $a_{\min}=3/(2e)$。
