solution:
  source_solution_summary: |
    由 $f$ 为偶函数得 $f^{\prime}(x)=-f^{\prime}(-x)$。
    又 $f^{\prime}(x)+e^{-x}+x$ 为偶函数，所以
    $f^{\prime}(x)+e^{-x}+x=f^{\prime}(-x)+e^{x}-x$。
    联立两式：
    $2f^{\prime}(x)=e^x-e^{-x}-2x$，即
    $f^{\prime}(x)=\frac{e^x-e^{-x}}2-x=\sinh x-x$。
    积分可写
    $f(x)=\cosh x-\frac12x^2+C$，从而
    $f^{\prime\prime}(x)=\cosh x-1\ge0$，故 $f^{\prime}$ 在 $\mathbf{R}$ 上递增。
    且 $f^{\prime}(0)=0$，所以 $x>0$ 时 $f^{\prime}(x)>0$，即
    $f$ 在 $[0,+\infty)$ 递增。由 $f(2a-1)<f(a+1)$ 并结合偶性得
    $f(|2a-1|)<f(|a+1|)$，再由递增性得
    $|2a-1|<|a+1|$。解得 $a^2-2a<0$，
    即 $0<a<2$，故选 B。
  key_steps:
    - step_id: step_1
      statement: 把两个偶性条件联立成导函数方程。
      formula_trace:
        from: $f$ 为偶函数；$f^{\prime}(x)+e^{-x}+x$ 为偶函数
        to: $f^{\prime}(x)=-f^{\prime}(-x)$，且 $f^{\prime}(x)+e^{-x}+x=f^{\prime}(-x)+e^x-x$
        operation: 分别写出“函数偶/导函数奇”的等价式，再代入消元。
        why: 可直接求出 $f^{\prime}(x)$ 的显式表达。
      source_ref: page_0135_solution
    - step_id: step_2
      statement: 得到双曲函数型导数并积分。
      formula_trace:
        from: $2f^{\prime}(x)=e^x-e^{-x}-2x$
        to: $f^{\prime}(x)=\sinh x-x,\quad f(x)=\cosh x-\frac12x^2+C$
        operation: 把指数差写成双曲正弦，再做不定积分。
        why: 后续单调性和比较都要基于该表达。
      source_ref: page_0135_solution
    - step_id: step_3
      statement: 由二阶导判断半轴递增。
      formula_trace:
        from: $f^{\prime\prime}(x)=\cosh x-1$
        to: $f^{\prime\prime}(x)\ge0\Rightarrow f^{\prime}$ 递增，且 $f^{\prime}(0)=0\Rightarrow x>0$ 时 $f^{\prime}(x)>0$
        operation: 先判 $f^{\prime}$ 单调，再用零点定位符号。
        why: 确定 $f$ 在 $[0,+\infty)$ 递增。
      source_ref: page_0135_solution
    - step_id: step_4
      statement: 偶性改写输入并去掉函数号。
      formula_trace:
        from: $f(2a-1)<f(a+1)$
        to: $f(|2a-1|)<f(|a+1|)\Rightarrow |2a-1|<|a+1|$
        operation: 偶函数满足 $f(u)=f(|u|)$，再在非负轴上用递增保序。
        why: 最终化为代数不等式。
      source_ref: page_0135_solution
    - step_id: step_5
      statement: 解出参数区间。
      formula_trace:
        from: $|2a-1|<|a+1|$
        to: $(2a-1)^2<(a+1)^2\Rightarrow a^2-2a<0\Rightarrow 0<a<2$
        operation: 两侧平方并因式分解。
        why: 对应选项 B。
      source_ref: page_0135_solution
teaching_card:
  student_title: 偶性联立后，导数变成 $\sinh x-x$
  what_it_trains: 训练在“函数偶 + 导函数组合偶”的条件下做方程联立，先解出导函数显式，再回到单调性和绝对值比较求参。
  recognition_cues:
    - 题干同时给出 $f$ 偶性和含 $f^{\prime}$ 的偶性条件。
    - 表达式里有 $e^x,e^{-x}$，常导向双曲函数。
    - 结尾是不等式 $f(\cdot)<f(\cdot)$，适合做偶性绝对值化。
  normalization_moves:
    - 先写 $f^{\prime}(x)=-f^{\prime}(-x)$。
    - 将第二个偶性条件在 $x$ 与 $-x$ 处对照后消元。
    - 得到 $f$ 在非负轴递增后再去掉 $f$。
  common_failures:
    - 把“$f$ 偶”误写成“$f^{\prime}$ 偶”。
    - 联立时漏掉 $-x$ 项，导致 $f^{\prime}(x)$ 系数错误。
    - 从 $f(|u|)<f(|v|)$ 推输入关系时忘记依赖非负轴递增。
  similar_practice_query: 偶函数 导函数偶条件 双曲函数 求参数范围
