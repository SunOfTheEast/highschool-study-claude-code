stem: |-
  （2023·广州二模）已知偶函数 $f(x)$ 与其导函数 $f^{\prime}(x)$ 的定义域均为 $\mathbf{R}$，且 $f^{\prime}(x)+e^{-x}+x$ 也是偶函数。若 $f(2a-1)<f(a+1)$，则实数 $a$ 的取值范围是（  ）
  A. $(-\infty,2)$
  B. $(0,2)$
  C. $(2,+\infty)$
  D. $(-\infty,0)\cup(2,+\infty)$
answer: |
  B

  由 $f$ 为偶函数得 $f^{\prime}(x)=-f^{\prime}(-x)$。
  又 $f^{\prime}(x)+e^{-x}+x$ 为偶函数，所以
  $f^{\prime}(x)+e^{-x}+x=f^{\prime}(-x)+e^{x}-x$。
  联立两式：
  $2f^{\prime}(x)=e^x-e^{-x}-2x$，即
  $f^{\prime}(x)=\frac{e^x-e^{-x}}2-x=\sinh x-x$。
  积分可写
  $f(x)=\cosh x-\frac12x^2+C$，从而
  $f^{\prime\prime}(x)=\cosh x-1\ge0$，故 $f^{\prime}$ 在 $\mathbf{R}$ 上递增。
  且 $f^{\prime}(0)=0$，所以 $x>0$ 时 $f^{\prime}(x)>0$，即
  $f$ 在 $[0,+\infty)$ 递增。由 $f(2a-1)<f(a+1)$ 并结合偶性得
  $f(|2a-1|)<f(|a+1|)$，再由递增性得
  $|2a-1|<|a+1|$。解得 $a^2-2a<0$，
  即 $0<a<2$，故选 B。
