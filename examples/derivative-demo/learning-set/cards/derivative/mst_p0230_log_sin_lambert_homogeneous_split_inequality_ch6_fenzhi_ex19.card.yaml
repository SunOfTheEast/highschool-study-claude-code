original_problem:
  stem: （2021 · 江西红色七校联考 T21）已知函数 $f(x)=2\ln(x+1)+\sin x+1$，函数 $g(x)=ax-1-b\ln x$（$a,b\in\mathbf R$，$ab\neq0$）。
  parts: *a1
  choices: []
  answer: 第 (1) 问按 $a,b$ 符号分类给出单调区间；第 (2)(3) 问不等式成立。
  fidelity_notes:
    - 三问均无选项。
    - 第 (3) 问使用第 (1) 问中 $a=b=1$ 的特殊情形。
solution:
  source_solution_summary: $g$ 的定义域为 $(0,+\infty)$，$g'(x)=\frac{ax-b}{x}$。若 $a>0,b<0$，则 $g$ 在 $(0,+\infty)$ 递增；若 $a>0,b>0$，则 $g$ 在 $(0,b/a)$ 递减，在 $(b/a,+\infty)$ 递增；若 $a<0,b>0$，则 $g$ 在 $(0,+\infty)$ 递减；若 $a<0,b<0$，则 $g$ 在 $(0,b/a)$ 递增，在 $(b/a,+\infty)$ 递减。第 (2) 问令 $h(x)=f(x)-(3x+1)$，则 $h'(x)=\frac2{x+1}+\cos x-3\leqslant0$，且 $h(0)=0$，所以 $f(x)\leqslant3x+1$。第 (3) 问取 $a=b=1$，得 $g(t)=t-1-\ln t\geqslant0$。令 $t=e^{\sin x+2\ln(x+1)}=(x+1)^2e^{\sin x}$，则 $(x+1)^2e^{\sin x}\geqslant2\ln(x+1)+\sin x+1=f(x)$。又 $(x^2+2x+2)e^{\sin x}=((x+1)^2+1)e^{\sin x}>(x+1)^2e^{\sin x}$， 故 $f(x)<(x^2+2x+2)e^{\sin x}$。
  key_steps:
    - step_id: step_1
      statement: 先求 $g$ 的导数并按 $a,b$ 符号分类。
      formula_trace:
        from: $g(x)=ax-1-b\ln x$
        to: $g^\prime(x)=\frac{ax-b}{x}$
        operation: 求导并通分。
        why: $x>0$，导数符号由 $ax-b$ 决定。
      source_ref: page_0230_ex19_solution
    - step_id: step_2
      statement: 完成四种符号情形的单调性讨论。
      formula_trace:
        from: $g^\prime(x)=\frac{ax-b}{x}$
        to: $a>0,b<0$ 递增；$a>0,b>0$ 先减后增；$a<0,b>0$ 递减；$a<0,b<0$ 先增后减
        operation: 判断 $ax-b$ 在 $x>0$ 上的符号和零点 $x=b/a$。
        why: $b/a$ 为正时才落入定义域，且符号方向由 $a$ 决定。
      source_ref: page_0230_ex19_solution
    - step_id: step_3
      statement: 第 (2) 问构造差函数。
      formula_trace:
        from: $f(x)\leqslant3x+1$
        to: $h(x)=f(x)-(3x+1)\leqslant0$
        operation: 移项并构造 $h$。
        why: 证明上界常转为差函数单调递减。
      source_ref: page_0230_ex19_solution
    - step_id: step_4
      statement: 用导数上界证明 $h$ 单调递减。
      formula_trace:
        from: $h^\prime(x)=\frac2{x+1}+\cos x-3$
        to: $h^\prime(x)\leqslant0$
        operation: 用 $x\geqslant0$ 时 $\frac2{x+1}\leqslant2$、$\cos x\leqslant1$。
        why: 两个上界相加刚好不超过 3。
      source_ref: page_0230_ex19_solution
    - step_id: step_5
      statement: 取 $a=b=1$ 得到朗博同构母式。
      formula_trace:
        from: $g(x)=ax-1-b\ln x$
        to: $g(t)=t-1-\ln t\geqslant0\quad(t>0)$
        operation: 取 $a=b=1$，由第 (1) 问知最小值为 $g(1)=0$。
        why: 这就是 $t\geqslant1+\ln t$ 的同构放缩。
      source_ref: page_0230_ex19_solution
    - step_id: step_6
      statement: 把三角指数整体代入同构母式。
      formula_trace:
        from: $t=(x+1)^2e^{\sin x}=e^{\sin x+2\ln(x+1)}$
        to: $(x+1)^2e^{\sin x}\geqslant2\ln(x+1)+\sin x+1$
        operation: 把 $t$ 代入 $t-1-\ln t\geqslant0$。
        why: $\ln t=\sin x+2\ln(x+1)$，右侧正好等于 $f(x)$。
      source_ref: page_0230_ex19_solution
    - step_id: step_7
      statement: 用更大的指数系数完成严格不等式。
      formula_trace:
        from: $(x^2+2x+2)e^{\sin x}=((x+1)^2+1)e^{\sin x}$
        to: $(x^2+2x+2)e^{\sin x}>(x+1)^2e^{\sin x}\geqslant f(x)$
        operation: 利用 $e^{\sin x}>0$ 和多出的 $1\cdot e^{\sin x}$。
        why: 目标右侧严格大于同构下界对应的块。
      source_ref: page_0230_ex19_solution
teaching_card:
  student_title: 先从 $g$ 里取出朗博母式，再把三角指数整体塞进去
  what_it_trains: 训练朗博同构后的分而治之：先从参数函数中抽出 $t-1-\ln t\geqslant0$，再识别 $2\ln(x+1)+\sin x$ 是某个整体的对数。
  recognition_cues:
    - 题目先给 $g(x)=ax-1-b\ln x$，后面又要证明含 $\ln(x+1)$ 和 $e^{\sin x}$ 的不等式。
    - 第 (3) 问目标右边有 $e^{\sin x}$，说明可以把三角放到指数里做整体。
    - $2\ln(x+1)+\sin x$ 可以合成 $\ln((x+1)^2e^{\sin x})$。
  normalization_moves:
    - 先完整讨论 $g$ 的单调性，尤其记住 $a=b=1$ 时 $t-1-\ln t\geqslant0$。
    - 第 (2) 问直接做差函数上界。
    - 第 (3) 问令 $t=(x+1)^2e^{\sin x}$。
    - 得到 $(x+1)^2e^{\sin x}\geqslant f(x)$ 后，再用目标右边多出的 $e^{\sin x}$ 做严格放大。
  common_failures:
    - 第 (1) 问只机械讨论单调性，没有看出它给第 (3) 问准备了母式。
    - 看不出 $2\ln(x+1)+\sin x$ 可以合成一个对数。
    - 把 $(x^2+2x+2)$ 错看成 $(x+1)^2$，漏掉严格大于。
  similar_practice_query: 朗博同构 t-1-lnt 三角作为指数 2ln(x+1)+sinx e^{sinx} 分而治之
