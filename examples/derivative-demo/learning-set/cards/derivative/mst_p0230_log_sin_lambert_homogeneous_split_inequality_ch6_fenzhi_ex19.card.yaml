stem: |-
  （2021 · 江西红色七校联考 T21）已知函数 $f(x)=2\ln(x+1)+\sin x+1$，函数 $g(x)=ax-1-b\ln x$（$a,b\in\mathbf R$，$ab\neq0$）。
  1. 讨论 $g(x)$ 的单调性。
  2. 证明：当 $x\geqslant0$ 时，$f(x)\leqslant3x+1$。
  3. 证明：当 $x>-1$ 时，$f(x)<(x^2+2x+2)e^{\sin x}$。
answer: |-
  第 (1) 问按 $a,b$ 符号分类给出单调区间；第 (2)(3) 问不等式成立。

  $g$ 的定义域为 $(0,+\infty)$，$g'(x)=\frac{ax-b}{x}$。若 $a>0,b<0$，则 $g$ 在 $(0,+\infty)$ 递增；若 $a>0,b>0$，则 $g$ 在 $(0,b/a)$ 递减，在 $(b/a,+\infty)$ 递增；若 $a<0,b>0$，则 $g$ 在 $(0,+\infty)$ 递减；若 $a<0,b<0$，则 $g$ 在 $(0,b/a)$ 递增，在 $(b/a,+\infty)$ 递减。第 (2) 问令 $h(x)=f(x)-(3x+1)$，则 $h'(x)=\frac2{x+1}+\cos x-3\leqslant0$，且 $h(0)=0$，所以 $f(x)\leqslant3x+1$。第 (3) 问取 $a=b=1$，得 $g(t)=t-1-\ln t\geqslant0$。令 $t=e^{\sin x+2\ln(x+1)}=(x+1)^2e^{\sin x}$，则 $(x+1)^2e^{\sin x}\geqslant2\ln(x+1)+\sin x+1=f(x)$。又 $(x^2+2x+2)e^{\sin x}=((x+1)^2+1)e^{\sin x}>(x+1)^2e^{\sin x}$， 故 $f(x)<(x^2+2x+2)e^{\sin x}$。
