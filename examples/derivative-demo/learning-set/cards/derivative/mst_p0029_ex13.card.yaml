stem: |-
  (2016 · 四川 T21) 设函数 $f(x)=ax^2-a-\ln x$, $g(x)=\frac1x-\frac1{e^{x-1}}$, 其中 $a\in\mathbf{R}$, $e=2.718\cdots$ 为自然对数的底数。
  (1) 讨论 $f(x)$ 的单调性；
  (2) 证明：当 $x>1$ 时，$g(x)>0$；
  (3) 如果 $f(x)>g(x)$ 在区间 $(1,+\infty)$ 内恒成立，求实数 $a$ 的取值范围。
answer: |-
  (1) 当 $a\le0$ 时，$f(x)$ 在 $(0,+\infty)$ 上单调递减；当 $a>0$ 时，$f(x)$ 在 $(0,\sqrt{1/(2a)})$ 上递减，在 $(\sqrt{1/(2a)},+\infty)$ 上递增。(2) $x>1$ 时 $g(x)>0$。(3) $a\ge\frac12$。

  第 (1) 问，$f'(x)=2ax-1/x=(2ax^2-1)/x$。若 $a\le0$，则 $f'(x)<0$，$f$ 在 $(0,+\infty)$ 递减；若 $a>0$，正临界点为 $x=\sqrt{1/(2a)}$，其左侧 $f'<0$、右侧 $f'>0$。第 (2) 问，$g(x)>0$ 等价于 $1/x>e/e^x$，即 $e^x/x>e$；因 $G(x)=e^x/x$ 在 $x>1$ 上递增且 $G(1)=e$，故成立。第 (3) 问，$f(x)-g(x)=[e^{-(x-1)}+(x-1)]-(1/x+\ln x)+(x-1)(ax+a-1)$。令 $h(u)=u+e^{-u}$，$u>0$ 时递增；又 $x-1>\ln x$，所以 $h(x-1)>h(\ln x)$。若 $a\ge1/2$，则 $ax+a-1>0$，从而 $f(x)>g(x)$。反过来，$a\le0$ 时 $f(x)<0<g(x)$；$0<a<1/2$ 时取 $x_0=\sqrt{1/(2a)}>1$，有 $f(x_0)<f(1)=0<g(x_0)$，均矛盾。因此 $a\ge1/2$。
