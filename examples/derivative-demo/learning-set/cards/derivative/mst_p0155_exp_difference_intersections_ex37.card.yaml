solution:
  source_solution_summary: |
    先看
    \[
    4^b=6^a-2^a.
    \]
    比较
    \[
    y_1=4^x,\quad y_2=6^x-2^x.
    \]
    由
    \[
    4^1=6^1-2^1=4
    \]
    知交点为 $(1,4)$。并且图像上 $x>1$ 时 $y_2>y_1$，故同高比较得到两种可能：
    \[
    b>a>1 \quad\text{或}\quad 1>a>b.
    \]
    再看
    \[
    5^a=6^b-2^b.
    \]
    令
    \[
    y_3=5^x.
    \]
    有
    \[
    5^1>6^1-2^1,\qquad 5^2<6^2-2^2,
    \]
    所以 $y_3$ 与 $y_2$ 交点 $x_0\in(1,2)$；当 $x<x_0$ 时 $y_3>y_2$，当 $x>x_0$ 时 $y_3<y_2$。
    若落在 $x<1$ 区间，则由同高比较可得 $b>a$，与前一式在该区间给出的 $a>b$ 矛盾，故 $1>a>b$ 不可能。
    只能取
    \[
    b>a>1,
    \]
    即
    \[
    1<a<b.
    \]
    选 A。
  key_steps:
    - step_id: step_1
      statement: 由第一式对应两曲线交点，得到区间二分结论。
      formula_trace:
        from: $4^b=6^a-2^a$
        to: $b>a>1$ 或 $1>a>b$
        operation: 以 $(1,4)$ 为锚点做同高横坐标比较。
        why: 先把解空间压缩到两种顺序模式。
      source_ref: page_0155_ex37_solution
    - step_id: step_2
      statement: 由第二式锁定 $y_3=5^x$ 与 $y_2=6^x-2^x$ 的交点区间。
      formula_trace:
        from: $5^1>6^1-2^1,\ 5^2<6^2-2^2$
        to: $x_0\in(1,2)$，且 $x<x_0$ 时 $y_3>y_2$
        operation: 端点代值 + 连续性判交点。
        why: 为排除“全在 1 左侧”情形准备比较规则。
      source_ref: page_0155_ex37_solution
    - step_id: step_3
      statement: 在 $x<1$ 假设下出现顺序矛盾，排除第二种模式。
      formula_trace:
        from: $1>a>b$ 与 $5^a=6^b-2^b$
        to: 同高比较推出 $b>a$，矛盾
        operation: 把第二式的同高关系与第一式的候选顺序对撞。
        why: 实现必要性排除。
      source_ref: page_0155_ex37_solution
    - step_id: step_4
      statement: 保留唯一可行模式并对应选项。
      formula_trace:
        from: 只剩 $b>a>1$
        to: $1<a<b$，选 A
        operation: 改写为选项顺序。
        why: 得到最终答案。
      source_ref: page_0155_ex37_solution
teaching_card:
  student_title: 差函数双约束下的先分支后排除
  what_it_trains: 训练把两条方程拆成两次曲线同高比较，先得到候选顺序，再用第二个约束剔除矛盾分支。
  recognition_cues:
    - 同一差函数 $6^x-2^x$ 同时与两个指数函数配对。
    - 题目不是求值，而是区间与顺序判断。
    - 选项包含“是否大于 1”与“a,b 谁大”两层信息。
  normalization_moves:
    - 先用第一式在基准点 $x=1$ 处分区。
    - 再用第二式的交点 $x_0$ 做反证排除。
    - 只保留能同时满足两式的顺序模式。
  common_failures:
    - 只根据第一式就直接作答，未用第二式复核。
    - 知道 $x_0\in(1,2)$ 但不会转换成同高横坐标大小规律。
    - 把“$1>a>b$”误当可行，遗漏与第二式的矛盾。
  similar_practice_query: 6^x-2^x 与 4^x 5^x 双方程 同高交点 排除法
