solution:
  source_solution_summary: |
    因为 $y(1+\ln y)=(1+\ln y)e^{(1+\ln y)-1}$，且左侧 $xe^{x-1}>0$，所以 $1+\ln y>0$。设 $h(u)=ue^{u-1}$，在 $(0,+\infty)$ 上严格递增，由 $h(x)=h(1+\ln y)$ 得 $x=1+\ln y$。又 $\ln y\le y-1$，等号仅在 $y=1$ 取到，所以 $x=1+\ln y\le y$，且 $y\ne1$ 时 $x<y$。若 $y>1$，则 $x=1+\ln y>1$，得 $1<x<y$；若 $0<y<1$，则 $x<1$ 且 $x<y<1$。故选 AC。
  key_steps:
    - step_id: step_1
      statement: 把右侧写成同一个 $h(u)=ue^{u-1}$。
      formula_trace:
        from: |
          $y(1+\ln y)$
        to: |
          $(1+\ln y)e^{(1+\ln y)-1}$
        operation: 利用 $e^{\ln y}=y$，把 $y$ 写成 $e^{\ln y}$。
        why: 这样右侧与左侧 $xe^{x-1}$ 具有同一函数形式。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:47
    - step_id: step_2
      statement: 确认两个输入都在单调区间内。
      formula_trace:
        from: |
          $xe^{x-1}=y(1+\ln y),\quad x>0,\ y>0$
        to: |
          $xe^{x-1}>0\Rightarrow 1+\ln y>0$
        operation: 由于 $y>0$，右侧符号由 $1+\ln y$ 决定。
        why: $h(u)=ue^{u-1}$ 在 $u>0$ 上递增，需保证 $1+\ln y$ 也为正。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:47
    - step_id: step_3
      statement: 由同构函数值相等推出输入相等。
      formula_trace:
        from: |
          $h(x)=h(1+\ln y),\quad h(u)=ue^{u-1}$
        to: |
          $x=1+\ln y$
        operation: 用 $h'(u)=e^{u-1}(u+1)>0$ 说明 $h$ 在正数域上严格递增。
        why: 递增函数的同一函数值对应同一输入。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:47
    - step_id: step_4
      statement: 比较 $x$ 与 $y$。
      formula_trace:
        from: |
          $x=1+\ln y,\quad \ln y\le y-1$
        to: |
          $x\le y$，且 $y\ne1$ 时 $x<y$
        operation: 把基本不等式 $\ln y\le y-1$ 两边加 $1$。
        why: 先确定 $x$ 一定不大于 $y$，排除 $y<x$ 的选项。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:47
    - step_id: step_5
      statement: 按 $y$ 与 $1$ 的关系判断可能区间。
      formula_trace:
        from: |
          $x=1+\ln y,\quad x<y$
        to: |
          $y>1\Rightarrow 1<x<y;\quad 0<y<1\Rightarrow x<y<1$
        operation: 当 $y>1$ 时 $\ln y>0$；当 $0<y<1$ 时 $\ln y<0$。
        why: 两个分支分别对应选项 A 与 C。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0037/page_0037.md:15
teaching_card:
  student_title: 把 $y(1+\ln y)$ 改成 $h(1+\ln y)$
  what_it_trains: 看到 $xe^{x-1}$ 与 $y(1+\ln y)$ 对等时，把 $y$ 写成 $e^{\ln y}$，就能让两个变量落到同一个递增函数里，再用对数基本不等式判断大小。
  recognition_cues:
    - 左侧是标准的 $u e^{u-1}$。
    - 右侧有 $1+\\ln y$，而 $y=e^{\\ln y}$ 正好能补成指数。
    - 选项都在比较 $x,y,1$ 的顺序。
  normalization_moves:
    - 先把 $y(1+\\ln y)$ 写为 $(1+\\ln y)e^{(1+\\ln y)-1}$。
    - 确认 $1+\\ln y>0$ 后用 $h$ 的单调性。
    - 把 $x=1+\\ln y$ 与 $\\ln y\\le y-1$ 连起来。
  common_failures:
    - 把 $h(u)=ue^{u-1}$ 的单调区间写成全实数，忽略输入为正。
    - 只得到 $x<y$，忘记还要分 $y>1$ 和 $y<1$。
    - 认为只能选 A，漏掉 $0<y<1$ 时的 C。
  similar_practice_query: xe^{x-1} y(1+lny) 同构 ln y <= y-1 数值比较
