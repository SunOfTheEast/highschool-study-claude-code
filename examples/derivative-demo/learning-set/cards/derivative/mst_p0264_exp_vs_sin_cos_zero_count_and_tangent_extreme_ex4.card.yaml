stem: |-
  （2024 · 福州一中高考模拟）已知函数 $f(x)=e^x$，$g(x)=\sin x+\cos x$，其中 $e$ 为自然对数的底数。
  1. 证明：$x\ge0$ 时，$e^x-1\ge x\ge\sin x$。
  2. 求函数 $h(x)=f(x)-g(x)$ 在 $(-\frac54\pi,+\infty)$ 内的零点个数。
  3. 若 $f(x)+g(x)\ge ax+2$，求 $a$ 的取值范围。
answer: |-
  第(1)问：成立。第(2)问：零点个数为 1。第(3)问：$a=2$。

  第(1)问分别构造 $e^x-1-x$ 与 $x-\sin x$，在 $x\ge0$ 上用导数非负证明 $e^x-1\ge x\ge\sin x$。第(2)问 $h(x)=e^x-\sin x-\cos x$，$x>0$ 时由第(1)问得 $h>0$； $x=0$ 是一个零点；在 $(-\frac\pi4,0)$ 上用 $h^\prime<0$ 得 $h>0$；在 $(-\frac54\pi,-\frac\pi4]$ 上直接写成 $e^x-\sqrt2\sin(x+\frac\pi4)>0$，所以只有 1 个零点。第(3)问 令 $F=e^x+\sin x+\cos x-2-ax$，由 $F(0)=0$ 和恒非负得 $F^\prime(0)=2-a=0$，所以 $a=2$；再构造 $G=F/e^x$，用 $G^\prime=2(x-\sin x)/e^x$ 回证。
