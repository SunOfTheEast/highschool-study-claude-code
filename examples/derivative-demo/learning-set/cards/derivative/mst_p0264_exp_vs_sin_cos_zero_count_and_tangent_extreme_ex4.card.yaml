solution:
  source_solution_summary: 第(1)问分别构造 $e^x-1-x$ 与 $x-\sin x$，在 $x\ge0$ 上用导数非负证明 $e^x-1\ge x\ge\sin x$。第(2)问 $h(x)=e^x-\sin x-\cos x$，$x>0$ 时由第(1)问得 $h>0$； $x=0$ 是一个零点；在 $(-\frac\pi4,0)$ 上用 $h^\prime<0$ 得 $h>0$；在 $(-\frac54\pi,-\frac\pi4]$ 上直接写成 $e^x-\sqrt2\sin(x+\frac\pi4)>0$，所以只有 1 个零点。第(3)问 令 $F=e^x+\sin x+\cos x-2-ax$，由 $F(0)=0$ 和恒非负得 $F^\prime(0)=2-a=0$，所以 $a=2$；再构造 $G=F/e^x$，用 $G^\prime=2(x-\sin x)/e^x$ 回证。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：证明 $e^x-1\ge x$。
      formula_trace:
        from: $f_1(x)=e^x-1-x$
        to: $f_1^\prime(x)=e^x-1\ge0$，$f_1(x)\ge f_1(0)=0$
        operation: 构造差函数并判单调。
        why: 得到指数的基础下界。
      source_ref: page_0264_ex4_solution_start
    - step_id: step_2
      statement: 第(1)问：证明 $x\ge\sin x$。
      formula_trace:
        from: $f_2(x)=x-\sin x$
        to: $f_2^\prime(x)=1-\cos x\ge0$，$f_2(x)\ge0$
        operation: 构造差函数并判单调。
        why: 得到三角基础下界。
      source_ref: page_0264_ex4_solution_start
    - step_id: step_3
      statement: 第(2)问：排除 $x>0$ 的零点。
      formula_trace:
        from: $h(x)=e^x-\sin x-\cos x$
        to: $h(x)>x+1-\sin x-\cos x\ge0$
        operation: 套用第(1)问。
        why: 正半轴没有零点。
      source_ref: page_0264_ex4_solution_start
    - step_id: step_4
      statement: 第(2)问：负区间分段排除。
      formula_trace:
        from: $(-\frac54\pi,0)$
        to: $(-\frac\pi4,0)$ 与 $(-\frac54\pi,-\frac\pi4]$ 上均无零点
        operation: 分别用导数单调和三角合并式判正。
        why: 只剩 $x=0$ 一个零点。
      source_ref: page_0265_ex4_solution_continuation
    - step_id: step_5
      statement: 第(3)问：用极点效应锁 $a$。
      formula_trace:
        from: $F(x)=e^x+\sin x+\cos x-2-ax\ge0$，$F(0)=0$
        to: $F^\prime(0)=2-a=0$，$a=2$
        operation: 开区间内最小值点导数为 0。
        why: 恒非负且在 0 处取等，参数由切线条件确定。
      source_ref: page_0265_ex4_solution_continuation
    - step_id: step_6
      statement: 第(3)问：回证 $a=2$。
      formula_trace:
        from: $G(x)=1+\frac{\sin x+\cos x-2-2x}{e^x}$
        to: $G^\prime(x)=\frac{2(x-\sin x)}{e^x}$，$G(x)\ge G(0)=0$
        operation: 除以 $e^x$ 后用 $x-\sin x$ 判单调。
        why: 证明 $F(x)\ge0$ 全域成立。
      source_ref: page_0265_ex4_solution_continuation
teaching_card:
  student_title: 先用基础不等式排零点，再用极点效应锁参数
  what_it_trains: 训练指数与三角混合题的组合打法：先建立简单不等式，再分区间数零点，最后用取等点锁参数。
  recognition_cues:
    - 题目同时有 $e^x$、$\sin x$、$\cos x$。
    - 第(2)问区间从 $-\frac54\pi$ 开始，必须分负区间。
    - 第(3)问在 $x=0$ 处取等：$e^0+\sin0+\cos0=2$。
  normalization_moves:
    - 先证明 $e^x-1\ge x\ge\sin x$，后面直接复用。
    - 数零点时按 $x>0$、$x=0$、负区间分开。
    - 求 $a$ 时先令 $F^\prime(0)=0$，再回证 $a=2$。
  common_failures:
    - 第(2)问只看到 $x=0$，没有排除负区间零点。
    - 第(3)问只求出必要条件 $a=2$，没有回证恒成立。
    - 把 $G(x)\ge G(0)$ 的回证对象写混。
  similar_practice_query: 指数三角 e^x sinx cosx 零点个数 极点效应 a=2
