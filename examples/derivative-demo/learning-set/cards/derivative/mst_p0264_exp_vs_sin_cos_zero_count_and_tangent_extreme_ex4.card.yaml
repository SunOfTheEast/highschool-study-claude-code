original_problem:
  stem: （2024 · 福州一中高考模拟）已知函数 $f(x)=e^x$，$g(x)=\sin x+\cos x$，其中 $e$ 为自然对数的底数。
  parts: *a1
  choices: []
  answer: 第(1)问：成立。第(2)问：零点个数为 1。第(3)问：$a=2$。
  fidelity_notes:
