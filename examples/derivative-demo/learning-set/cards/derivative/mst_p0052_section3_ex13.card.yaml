    - $h(x)=\frac{x+1}{e^x}$
    - $u(x)=1-\frac1x-\ln x$
    - $g(x)=\ln x-\frac{x^2-1}{e^x}$
    - $p(x)=\frac{(x+1)^2}{2e^x}$
    - $\frac{2(x-1)}{x+1}$
