stem: |-
  （2023 · 河北月考 T21）已知函数 $f(x)=\frac{\ln x}{x-1}$。
  （1）求 $f(x)$ 的单调区间；
  （2）证明：$f(x)>\frac{x+1}{e^x}$（其中 $e$ 是自然对数的底数，$e=2.71828\cdots$）。
answer: |-
  （1）$f(x)$ 在 $(0,1)$ 上单调递减，在 $(1,+\infty)$ 上也单调递减；（2）对 $x\in(0,1)\cup(1,+\infty)$，有 $\frac{\ln x}{x-1}>\frac{x+1}{e^x}$。

  第 (1) 问求导得 $f^{\prime}(x)=\frac{1-\frac1x-\ln x}{(x-1)^2}$。令 $u(x)=1-\frac1x-\ln x$，则 $u^{\prime}(x)=\frac{1-x}{x^2}$，所以 $u$ 在 $(0,1)$ 递增、在 $(1,+\infty)$ 递减，且两侧均小于 $u(1)=0$，故 $f$ 在两个区间上均递减。第 (2) 问，$0<x<1$ 时由 $\ln x<x-1<0$ 得 $f(x)>1$，又 $e^x>x+1$ 得 $\frac{x+1}{e^x}<1$。当 $x>1$ 时，源解给出两法：构造 $g(x)=\ln x-\frac{x^2-1}{e^x}$ 证明 $g(x)>0$；或用 $\ln x\ge\frac{2(x-1)}{x+1}$ 和 $p(x)=\frac{(x+1)^2}{2e^x}<1$ 完成证明。
