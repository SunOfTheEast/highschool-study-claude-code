      - 若学生在 $0<x<1$ 时乘除负数忘记改变方向，回补代数恒等变形。
      - 若学生不能把 $x>1$ 的目标化成 $\ln x-\frac{x^2-1}{e^x}>0$，回补指数对数基础。
      - 若学生不知道 $\ln x$ 的帕德放缩 $\frac{2(x-1)}{x+1}$，回补不等式工具基础。
  detail_terms:
