    evidence:
      - $f^{\prime}(x)$ 的符号由 $1-\frac1x-\ln x$ 控制。
      - $x>1$ 时目标等价于 $\ln x-\frac{x^2-1}{e^x}>0$。
      - 帕德放缩把 $\ln x$ 与 $\frac{2(x-1)}{x+1}$ 联系起来。
