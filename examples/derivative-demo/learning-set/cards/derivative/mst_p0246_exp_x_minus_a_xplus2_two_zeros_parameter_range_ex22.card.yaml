original_problem:
  stem: （2020 · 新课标 I 文科第二问）已知函数 $f(x)=e^x-a(x+2)$。若 $f(x)$ 有两个零点，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\in\left(\frac1e,+\infty\right)$。
  fidelity_notes:
    - 单问求参数范围题，无选项。
    - 题目核心是“有两个零点”而不是直接证明不等式。
solution:
  source_solution_summary: 若 $a\le0$，则 $f^\prime(x)=e^x-a>0$ 恒成立，$f$ 单调递增，不可能有两个零点。 若 $a>0$，由 $f^\prime(x)=e^x-a$ 得极小值点 $x=\ln a$，最小值 $f(\ln a)=a-a(\ln a+2)=-a(1+\ln a)$。要有两个零点，必须 $f(\ln a)<0$，即 $a>\frac1e$。充分性上，左侧取 $x=-2$，有 $f(-2)=e^{-2}>0$；又极值点右偏，右侧可取 $x=2\ln a+2$，并验证 $f(2\ln a+2)=e^2a^2-2a(\ln a+2)>0$。于是极小值两侧各有一个零点， 所以 $a$ 的取值范围为 $(\frac1e,+\infty)$。
  key_steps:
    - step_id: step_1
      statement: 先排除 $a\le0$。
      formula_trace:
        from: $f^\prime(x)=e^x-a$
        to: $a\le0\Rightarrow f^\prime(x)>0$
        operation: 按参数符号判导数。
        why: 单调函数最多一个零点，不符合两个零点。
      source_ref: page_0246_ex22_solution_monotonicity
    - step_id: step_2
      statement: 当 $a>0$ 时找唯一极小值点。
      formula_trace:
        from: $e^x-a=0$
        to: $x=\ln a$
        operation: 解导数零点。
        why: 函数先减后增，两个零点必须围绕极小值点。
      source_ref: page_0246_ex22_solution_monotonicity
    - step_id: step_3
      statement: 必要条件来自极小值小于零。
      formula_trace:
        from: $f(\ln a)=a-a(\ln a+2)$
        to: $-a(1+\ln a)<0\Leftrightarrow a>\frac1e$
        operation: 代入极小值点并解不等式。
        why: 极小值不低于零时无法穿过 $x$ 轴两次。
      source_ref: page_0246_ex22_solution_monotonicity
    - step_id: step_4
      statement: 左侧用固定显点保证穿轴。
      formula_trace:
        from: $x=-2$
        to: $f(-2)=e^{-2}>0$
        operation: 代入左侧显点。
        why: 左端正值、极小值负值，中间必有左零点。
      source_ref: page_0246_ex22_solution_offset
    - step_id: step_5
      statement: 右侧利用极值点右偏取对称点。
      formula_trace:
        from: $x=-2$ 关于 $x=\ln a$ 的对称点
        to: $x=2\ln a+2$
        operation: 围绕极值点横坐标取对称点。
        why: 极值点右偏让右侧同距点函数值更高，适合作右侧正值点。
      source_ref: page_0246_ex22_solution_offset
    - step_id: step_6
      statement: 验证右侧显点为正。
      formula_trace:
        from: $f(2\ln a+2)$
        to: $e^2a^2\left(1-2\frac{\ln(e^2a)}{e^2a}\right)>0$
        operation: 代入并用 $a>\frac1e$ 下的指数对数估计。
        why: 右侧正值、极小值负值，中间必有右零点。
      source_ref: page_0246_ex22_solution_offset
teaching_card:
  student_title: 用极值点右偏给两个零点找边界
  what_it_trains: 训练先用极小值给参数必要条件，再用极值点偏移在左右两侧各找一个正值点，证明两个零点确实存在。
  recognition_cues:
    - 题目只问“两个零点”的参数范围。
    - $f^\prime(x)=e^x-a$，极值点能直接写成 $\ln a$。
    - 左边有固定点 $x=-2$ 让一次项消掉。
    - 右边自然取关于 $x=\ln a$ 对称的点 $2\ln a+2$。
  normalization_moves:
    - 先排除 $a\le0$。
    - 用极小值 $f(\ln a)<0$ 得到 $a>\frac1e$。
    - 左侧代 $x=-2$。
    - 右侧用极值点右偏取 $2\ln a+2$。
    - 用介值性说明左右各有一个零点。
  common_failures:
    - 只写必要条件 $a>\frac1e$，忘记证明充分性。
    - 不知道右侧显点为什么取 $2\ln a+2$。
    - 把极值点右偏误解成普通轴对称。
    - 没有先处理 $a\le0$ 的单调情形。
  similar_practice_query: e^x-a(x+2) 两个零点 参数范围 极值点右偏 2ln a+2
