stem: （2020 · 新课标 I 文科第二问）已知函数 $f(x)=e^x-a(x+2)$。若 $f(x)$ 有两个零点，求 $a$ 的取值范围。
answer: |-
  $a\in\left(\frac1e,+\infty\right)$。

  若 $a\le0$，则 $f^\prime(x)=e^x-a>0$ 恒成立，$f$ 单调递增，不可能有两个零点。 若 $a>0$，由 $f^\prime(x)=e^x-a$ 得极小值点 $x=\ln a$，最小值 $f(\ln a)=a-a(\ln a+2)=-a(1+\ln a)$。要有两个零点，必须 $f(\ln a)<0$，即 $a>\frac1e$。充分性上，左侧取 $x=-2$，有 $f(-2)=e^{-2}>0$；又极值点右偏，右侧可取 $x=2\ln a+2$，并验证 $f(2\ln a+2)=e^2a^2-2a(\ln a+2)>0$。于是极小值两侧各有一个零点， 所以 $a$ 的取值范围为 $(\frac1e,+\infty)$。
