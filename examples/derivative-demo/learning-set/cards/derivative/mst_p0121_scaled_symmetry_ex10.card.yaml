stem: |-
  （2024 · 安徽月考 · 多选）已知函数 $f(x)$ 为定义在 $\mathbf{R}$ 上的可导函数，$g(x)=f'(x)$，$f(x)-1$ 为奇函数，$f(2x)$ 的图像关于 $x=-\frac{1}{2}$ 对称，则（  ）
  A. $f(x)$ 的图象关于 $x=1$ 对称
  B. $g(x)$ 为偶函数
  C. $g(x)-g(x-2)=0$
  D. $y=f(x)-1$ 在 $[0,4]$ 上至少有 5 个零点
answer: |
  AB

  由 $f(2x)$ 关于 $x=-\frac12$ 轴对称，
  \[
    f(2x)=f(2(-1-x))=f(-2-2x),
  \]
  即 $f(x)=f(-2-x)$，故 $f$ 关于 $x=-1$ 轴对称。
  又因 $f(x)-1$ 为奇函数，$f$ 关于点 $(0,1)$ 中心对称。
  轴对称与中心对称叠加可得 $f$ 还关于 $x=1$ 轴对称，A 正确。
  由 $f(-x)-1=-f(x)+1$，求导得 $g(-x)=g(x)$，故 B 正确。
  同时由 $f(x)=f(-2-x)$ 求导得 $g(x)=-g(-2-x)$，配合偶性得到
  $g(x)=-g(2+x)$，并不能推出 $g(x)=g(x-2)$，故 C 错。
  取 $f(x)=1+\sin\frac{\pi}{2}x$ 满足题设，但
  $f(0)=f(2)=f(4)=1$，$f(x)-1$ 在 $[0,4]$ 仅 3 个零点，D 错。
  故选 AB。
