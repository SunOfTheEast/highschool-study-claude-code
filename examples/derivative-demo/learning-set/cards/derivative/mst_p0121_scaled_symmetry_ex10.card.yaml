solution:
  source_solution_summary: |
    由 $f(2x)$ 关于 $x=-\frac12$ 轴对称，
    \[
      f(2x)=f(2(-1-x))=f(-2-2x),
    \]
    即 $f(x)=f(-2-x)$，故 $f$ 关于 $x=-1$ 轴对称。
    又因 $f(x)-1$ 为奇函数，$f$ 关于点 $(0,1)$ 中心对称。
    轴对称与中心对称叠加可得 $f$ 还关于 $x=1$ 轴对称，A 正确。
    由 $f(-x)-1=-f(x)+1$，求导得 $g(-x)=g(x)$，故 B 正确。
    同时由 $f(x)=f(-2-x)$ 求导得 $g(x)=-g(-2-x)$，配合偶性得到
    $g(x)=-g(2+x)$，并不能推出 $g(x)=g(x-2)$，故 C 错。
    取 $f(x)=1+\sin\frac{\pi}{2}x$ 满足题设，但
    $f(0)=f(2)=f(4)=1$，$f(x)-1$ 在 $[0,4]$ 仅 3 个零点，D 错。
    故选 AB。
  key_steps:
    - step_id: step_1
      statement: 由 $f(2x)$ 的轴对称还原到 $f$ 的轴对称。
      formula_trace:
        from: $f(2x)$ 关于 $x=-\frac12$ 对称
        to: $f(2x)=f(-2-2x)\Rightarrow f(x)=f(-2-x)$
        operation: 使用轴对称点替换 $x\mapsto-1-x$，再回到原变量。
        why: 确定 $f$ 的第一条对称轴 $x=-1$。
      source_ref: page_0121
    - step_id: step_2
      statement: 由 $f(x)-1$ 奇性得到中心对称并推 A。
      formula_trace:
        from: $f(x)-1$ 为奇函数
        to: $f$ 关于 $(0,1)$ 中心对称，并进一步关于 $x=1$ 轴对称
        operation: 把奇函数关系转为图像中心对称，再与 step_1 配凑。
        why: 直接对应选项 A。
      source_ref: page_0121
    - step_id: step_3
      statement: 求导判奇偶与平移反对称，分别判断 B、C。
      formula_trace:
        from: |
          $f(-x)-1=-f(x)+1,\qquad f(x)=f(-2-x)$
        to: |
          $g(-x)=g(x),\qquad g(x)=-g(-2-x)$
        operation: 对两条函数恒等式分别求导。
        why: 前者给 B 正确；后者只给反对称关系，不能支持 C 的 2 周期等式。
      source_ref: page_0121
    - step_id: step_4
      statement: 用具体函数反例排除 D。
      formula_trace:
        from: $f(x)=1+\sin\frac{\pi}{2}x$
        to: $f(0)=f(2)=f(4)=1\Rightarrow f(x)-1 \text{ 在 }[0,4]\text{ 仅 3 个零点}$
        operation: 代入候选函数并直接计数零点。
        why: D 断言“至少 5 个零点”被单个反例否定。
      source_ref: page_0121
teaching_card:
  student_title: 缩放对称先还原，再和奇性拼出结论
  what_it_trains: 训练“复合自变量对称 -> 原函数对称 -> 导函数关系”的连续推理，并用反例处理过强结论。
  recognition_cues:
    - 题干同时给 $f(2x)$ 对称和 $f(x)-1$ 奇性。
    - 选项既有图像对称也有导函数等式与零点个数。
    - 出现“至少 5 个”时常需构造反例。
  normalization_moves:
    - 把 $f(2x)$ 的对称点映射写清。
    - 把奇函数改写成中心对称。
    - 对称关系求导，区分“偶性”与“反对称”。
    - 尝试标准三角函数反例。
  common_failures:
    - 把 $f(2x)$ 的对称轴直接误当成 $f(x)$ 的对称轴。
    - 由 $g(x)=-g(2+x)$ 误推 $g(x)=g(x-2)$。
    - 忽略 D 选项是“必然成立”而非“可能成立”。
    - 计算 $[0,4]$ 零点时漏记端点。
  similar_practice_query: 抽象函数 f(2x) 对称 奇函数 导函数偶性 反例 多选
