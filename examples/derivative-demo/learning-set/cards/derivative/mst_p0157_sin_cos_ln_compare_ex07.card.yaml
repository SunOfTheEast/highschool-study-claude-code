stem: |-
  （2025 · 广东中山 · 模拟预测）设 $a=\frac14$，$b=2\ln\left(\sin\frac18+\cos\frac18\right)$，$c=\frac54\ln\frac54$，则（  ）
  A. $a<b<c$
  B. $b<a<c$
  C. $b<a<c$
  D. $c<b<a$
answer: |
  源解析写作 B（且 B/C 文本重复）

  先改写
  \[
  b=2\ln\left(\sin\frac18+\cos\frac18\right)
   =\ln\left(\sin\frac18+\cos\frac18\right)^2
   =\ln\left(1+\sin\frac14\right).
  \]
  又
  \[
  c=\frac54\ln\frac54
   =\left(1+\frac14\right)\ln\left(1+\frac14\right).
  \]
  对 $b$，由
  \[
  \ln(1+\sin x)<\sin x<x
  \]
  取 $x=\frac14$，得
  \[
  b<\sin\frac14<\frac14=a,
  \]
  即 $b<a$。
  对 $c$，由 $x>0$ 时
  \[
  \ln(1+x)>1-\frac1{x+1}=\frac{x}{x+1},
  \]
  得
  \[
  (1+x)\ln(1+x)>x.
  \]
  代入 $x=\frac14$，得
  \[
  c>\frac14=a.
  \]
  所以 $b<a<c$，与重复选项 B/C 的文本一致；源页标注“选 B”。
