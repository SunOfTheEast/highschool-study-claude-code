original_problem:
  stem: （2025 · 天津卷压轴题节选）已知函数 $f(x)=ax-(\ln x)^2$。
  parts: *a1
  choices: []
  answer: 第 (1) 问：$y=x$；第 (2)(i) 问：$a\in(0,\frac4{e^2})$。
  fidelity_notes:
    - 本页只给出第 (2) 问的 (i) 小问。
    - 函数定义域为 $x>0$，换元 $t=\ln x$ 后 $t\in\mathbf R$。
solution:
  source_solution_summary: 第 (1) 问当 $a=1$ 时，$f(1)=1$，$f'(x)=1-\frac{2\ln x}{x}$， $f'(1)=1$，切线为 $y=x$。第 (2)(i) 问令 $\ln x=t$， $g(t)=ae^t-t^2$。若 $a\leqslant0$，至多一个零点，所以 $a>0$。 分解 $g(t)=(\sqrt a e^{t/2}+t)(\sqrt a e^{t/2}-t)$。当 $t<0$ 时， $k(t)=\sqrt a e^{t/2}-t>0$，零点只能来自 $z(t)=\sqrt a e^{t/2}+t$，且由 $z(0)>0$ 与 $z(-\sqrt a)<0$ 夹出一个负根。当 $t>0$ 时， $z(t)>0$，零点来自 $k(t)=\sqrt a e^{t/2}-t$。$k$ 的极小值点为 $t=2\ln(2/\sqrt a)$，要有两个正根，需 $k(2\ln(2/\sqrt a))<0$，即 $0<a<4/e^2$。在此范围内，左侧有 $k(0)>0$，右侧用取点法一 $k(t)>\sqrt a\frac{e^2}{16}t^2-t$，取 $t=16/(e^2\sqrt a)$ 夹出第二个正根。故 $f$ 有三个零点当且仅当 $a\in(0,4/e^2)$。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问直接求切线。
      formula_trace:
        from: $f(x)=x-(\ln x)^2$
        to: $f(1)=1,\ f^\prime(1)=1$
        operation: 代入 $a=1$ 并求导。
        why: 切线过 $(1,1)$ 且斜率为 1，所以 $y=x$。
      source_ref: page_0239_ex12_solution
    - step_id: step_2
      statement: 把 $x$ 域三零点换成 $t$ 域三零点。
      formula_trace:
        from: $f(x)=ax-(\ln x)^2$
        to: $t=\ln x,\ g(t)=ae^t-t^2$
        operation: 令 $x=e^t$。
        why: 把 $\ln x$ 的平方变成普通二次项。
      source_ref: page_0239_ex12_solution
    - step_id: step_3
      statement: 先排除 $a\leqslant0$。
      formula_trace:
        from: $g(t)=ae^t-t^2$
        to: $a\leqslant0$ 时 $g(t)\leqslant0$，至多一个零点
        operation: 观察 $ae^t$ 与 $-t^2$ 的符号。
        why: 三零点必须有 $a>0$。
      source_ref: page_0239_ex12_solution
    - step_id: step_4
      statement: 用平方差分解拆出正负半轴的不同因子。
      formula_trace:
        from: $ae^t-t^2$
        to: $(\sqrt a e^{t/2}+t)(\sqrt a e^{t/2}-t)$
        operation: 写成平方差。
        why: 负半轴和正半轴分别由不同因子产生零点。
      source_ref: page_0239_ex12_solution
    - step_id: step_5
      statement: 负半轴由 $z(t)$ 夹出一个根。
      formula_trace:
        from: $z(t)=\sqrt a e^{t/2}+t$
        to: $z(0)>0,\ z(-\sqrt a)<0$
        operation: 在 $t=0$ 和 $t=-\sqrt a$ 取值。
        why: $t<0$ 时另一个因子 $k(t)>0$，所以负根只来自 $z(t)$。
      source_ref: page_0239_ex12_solution
    - step_id: step_6
      statement: 正半轴由 $k(t)$ 决定是否有两个根。
      formula_trace:
        from: $k(t)=\sqrt a e^{t/2}-t$
        to: $k^\prime(t)=\frac{\sqrt a}{2}e^{t/2}-1$，极小值点 $2\ln\frac2{\sqrt a}$
        operation: 求导判号。
        why: 正半轴要再产生两个根，$k$ 的极小值必须低于 0。
      source_ref: page_0239_ex12_solution
    - step_id: step_7
      statement: 用 $k_{\min}<0$ 得参数范围。
      formula_trace:
        from: $k(2\ln\frac2{\sqrt a})<0$
        to: $a<\frac4{e^2}$
        operation: 代入极小值点并解不等式。
        why: 这给正半轴两根的核心条件。
      source_ref: page_0239_ex12_solution
    - step_id: step_8
      statement: 右侧取点补充分性。
      formula_trace:
        from: $k(t)>\sqrt a\frac{e^2}{16}t^2-t$
        to: $t=\frac{16}{e^2\sqrt a}$ 时 $k(t)>0$
        operation: 用取点法一给右侧正值点。
        why: 配合极小值负值，夹出第二个正根。
      source_ref: page_0239_ex12_solution
    - step_id: step_9
      statement: 合并一个负根和两个正根。
      formula_trace:
        from: 负半轴一个根，正半轴两个根
        to: $a\in(0,\frac4{e^2})$
        operation: 汇总根数条件。
        why: 三个 $t$ 根对应三个 $x=e^t$ 零点。
      source_ref: page_0239_ex12_solution
teaching_card:
  student_title: $ax-(\ln x)^2$ 三零点：换成 $ae^t-t^2$ 后拆平方差
  what_it_trains: 训练对数平方题的三零点求参：先换元，再把指数和二次项拆成两个因子。
  recognition_cues:
    - 题面有 $(\ln x)^2$，先想 $t=\ln x$。
    - $ae^t-t^2$ 可以写成平方差。
    - 三零点来自负半轴一个根、正半轴两个根。
  normalization_moves:
    - 第 (1) 问先写切线 $y=x$。
    - 第 (2) 问令 $t=\ln x$。
    - 排除 $a\leqslant0$。
    - 分解为 $(\sqrt a e^{t/2}+t)(\sqrt a e^{t/2}-t)$。
    - 用 $k_{\min}<0$ 得 $0<a<4/e^2$。
  common_failures:
    - 忘记 $t$ 与 $x$ 一一对应，根数可以直接对应。
    - 把正半轴分支误写成 $t<0$。
    - 只得到 $a<4/e^2$，没有说明 $a>0$。
    - 右侧取点法二容易漏掉 $4\ln$ 前面的 4。
  similar_practice_query: ax-(lnx)^2 三零点 ln x=t ae^t-t^2 平方差 4/e^2
