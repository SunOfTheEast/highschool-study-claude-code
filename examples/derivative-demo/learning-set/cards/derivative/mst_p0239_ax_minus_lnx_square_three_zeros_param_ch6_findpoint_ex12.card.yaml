stem: |-
  （2025 · 天津卷压轴题节选）已知函数 $f(x)=ax-(\ln x)^2$。
  1. $a=1$ 时，求 $f(x)$ 在点 $(1,f(1))$ 处的切线方程。
  2. $f(x)$ 有 3 个零点 $x_1,x_2,x_3$，且 $x_1<x_2<x_3$，求 $a$ 的取值范围。
answer: |-
  第 (1) 问：$y=x$；第 (2)(i) 问：$a\in(0,\frac4{e^2})$。

  第 (1) 问当 $a=1$ 时，$f(1)=1$，$f'(x)=1-\frac{2\ln x}{x}$， $f'(1)=1$，切线为 $y=x$。第 (2)(i) 问令 $\ln x=t$， $g(t)=ae^t-t^2$。若 $a\leqslant0$，至多一个零点，所以 $a>0$。 分解 $g(t)=(\sqrt a e^{t/2}+t)(\sqrt a e^{t/2}-t)$。当 $t<0$ 时， $k(t)=\sqrt a e^{t/2}-t>0$，零点只能来自 $z(t)=\sqrt a e^{t/2}+t$，且由 $z(0)>0$ 与 $z(-\sqrt a)<0$ 夹出一个负根。当 $t>0$ 时， $z(t)>0$，零点来自 $k(t)=\sqrt a e^{t/2}-t$。$k$ 的极小值点为 $t=2\ln(2/\sqrt a)$，要有两个正根，需 $k(2\ln(2/\sqrt a))<0$，即 $0<a<4/e^2$。在此范围内，左侧有 $k(0)>0$，右侧用取点法一 $k(t)>\sqrt a\frac{e^2}{16}t^2-t$，取 $t=16/(e^2\sqrt a)$ 夹出第二个正根。故 $f$ 有三个零点当且仅当 $a\in(0,4/e^2)$。
