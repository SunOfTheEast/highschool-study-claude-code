teaching_card:
  student_title: 用 $\frac{f}{x\ln x}$ 的递增性做三点倍数比较
  what_it_trains: 训练从导数不等式构造商函数单调，再把分式比较转回目标倍数链。
  recognition_cues:
    - 题设出现 $\frac{1+\ln x}{x}f(x)$。
    - 选项是固定点 2、4、8 的线性倍数比较。
  normalization_moves:
    - 同乘 $x$ 得到 $f^{\prime}(x)x\ln x-(1+\ln x)f(x)>0$。
    - 构造 $g=\frac{f}{x\ln x}$ 并判递增。
    - 先比 g(2),g(4),g(8)，再化为 f 的大小链。
  common_failures:
    - 忽略 $x=1$ 使分母为0，错误写成全区间单调。
    - 把 $g(2)<g(4)<g(8)$ 直接误抄成 $f(2)<f(4)<f(8)$。
    - 化简时把 $\ln4,\ln8$ 的系数弄错。
  similar_practice_query: 抽象函数 xlnx 作商 f/(xlnx) 单调 比较 12f(2) 3f(4) f(8)
