stem: |-
  （2023·九江模拟）定义在 $(0,+\infty)$ 上的函数 $f(x)$ 的导函数为 $f^{\prime}(x)$，且对 $\forall x\in(0,+\infty)$ 都有 $f^{\prime}(x)\ln x>\frac{1+\ln x}{x}f(x)$，则（  ）
  A. $12f(2)>3f(4)>f(8)$
  B. $3f(4)>12f(2)>f(8)$
  C. $f(8)>3f(4)>12f(2)$
  D. $f(8)>12f(2)>3f(4)$
answer: |
  C

  由
  \[
  f^{\prime}(x)\ln x>\frac{1+\ln x}{x}f(x)
  \]
  得
  \[
  f^{\prime}(x)x\ln x-(1+\ln x)f(x)>0.
  \]
  令
  \[
  g(x)=\frac{f(x)}{x\ln x},
  \]
  则
  \[
  g^{\prime}(x)=\frac{f^{\prime}(x)x\ln x-(1+\ln x)f(x)}{(x\ln x)^2}.
  \]
  对 $x\in(0,1)\cup(1,+\infty)$，分母平方恒正，且分子由题设大于0，所以
  $g^{\prime}(x)>0$，即 $g$ 在 $(0,1)$ 与 $(1,+\infty)$ 各自递增。
  因为 $2,4,8\in(1,+\infty)$，故
  \[
  g(2)<g(4)<g(8).
  \]
  即
  \[
  \frac{f(2)}{2\ln2}<\frac{f(4)}{4\ln4}<\frac{f(8)}{8\ln8}.
  \]
  代入 $\ln4=2\ln2,\ \ln8=3\ln2$ 化简得
  \[
  12f(2)<3f(4)<f(8),
  \]
  即 $f(8)>3f(4)>12f(2)$，选 C。
