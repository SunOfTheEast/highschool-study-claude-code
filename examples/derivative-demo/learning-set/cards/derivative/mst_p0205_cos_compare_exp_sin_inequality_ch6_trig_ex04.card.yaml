original_problem:
  stem: 已知 $x$ 为正实数。
  parts: *a1
  choices: []
  answer: (1) $\cos x\ge1-\frac12x^2$；(2) 不等式成立。
  fidelity_notes:
    - 源题为两问证明题，无选项。
    - 第(1)问给出的是全实数范围结论，题设“正实数”主要用于第(2)问中的指数与 $x-\sin x$ 下界。
solution:
  source_solution_summary: 第(1)问直接使用经典放缩 $\cos x\ge1-\frac12x^2\ (x\in\mathbf{R})$。 第(2)问把目标改写为 $e^x+\cos x-\sin x-2\ge0$，并按 source 拆成 $\left(e^x-\frac12x^2-x-1\right)+\left(\cos x+\frac12x^2-1\right)+(x-\sin x)\ge0$。 三项分别由 $e^x\ge1+x+\frac12x^2\ (x\ge0)$、 $\cos x\ge1-\frac12x^2\ (x\in\mathbf{R})$、 $x-\sin x\ge0\ (x\ge0)$ 保证非负，因此原不等式成立。
  key_steps:
    - step_id: step_1
      statement: 第(1)问直接给出余弦二次下界。
      formula_trace:
        from: $\cos x$ 与 $1-\frac12x^2$
        to: $\cos x\ge1-\frac12x^2\ (x\in\mathbf{R})$
        operation: 调用三角常见放缩模板。
        why: 得到比较结论并为第(2)问做铺垫。
      source_ref: page_0205_ex04_solution
    - step_id: step_2
      statement: 第(2)问先移项并拆成三块。
      formula_trace:
        from: $e^x+\cos x\ge\sin x+2$
        to: $e^x-\frac12x^2-x-1+\cos x+\frac12x^2-1+x-\sin x\ge0$
        operation: 加减 $\frac12x^2$ 与 $x$，把目标改成“三项非负和”。
        why: 便于并行调用指数、余弦、正弦三个标准不等式。
      source_ref: page_0205_ex04_solution
    - step_id: step_3
      statement: 指数块下界。
      formula_trace:
        from: $e^x-\frac12x^2-x-1$
        to: $e^x-\frac12x^2-x-1\ge0$
        operation: 使用 $e^x\ge1+x+\frac12x^2\ (x\ge0)$。
        why: 保证第一块非负。
      source_ref: page_0205_ex04_solution
    - step_id: step_4
      statement: 余弦块与正弦块下界。
      formula_trace:
        from: $\cos x+\frac12x^2-1,\ x-\sin x$
        to: $\cos x+\frac12x^2-1\ge0,\ x-\sin x\ge0$
        operation: 分别使用 $\cos x\ge1-\frac12x^2$ 与 $\sin x\le x$。
        why: 其余两块同样非负，和即非负。
      source_ref: page_0205_ex04_solution
    - step_id: step_5
      statement: 三块求和完成第(2)问。
      formula_trace:
        from: step_3 与 step_4
        to: $e^x+\cos x-\sin x-2\ge0$
        operation: 非负项相加。
        why: 回到原式即得 $e^x+\cos x\ge\sin x+2$。
      source_ref: page_0205_ex04_solution
teaching_card:
  student_title: 指数块+三角块三段拼接
  what_it_trains: 训练把混合函数不等式改写为三段标准非负块，并快速匹配各段对应的基础放缩模板。
  recognition_cues:
    - 同式里同时出现 $e^x,\cos x,\sin x$。
    - 题目给了一个“先比较、再证明”的两问结构。
    - 证明目标可改写成“差值非负”。
  normalization_moves:
    - 先写 $\cos x\ge1-\frac12x^2$ 作为第(1)问结论。
    - 第(2)问补加补减 $\frac12x^2$ 与 $x$。
    - 三条标准不等式分别压住三段，再求和。
  common_failures:
    - 漏写 $x-\sin x\ge0$，导致最后一步无法闭合。
    - 把 $\cos x\ge1-\frac12x^2$ 误写成反向不等式。
    - 拆项时常数项处理错误（$-2$ 漏拆成 $-1-1$）。
  similar_practice_query: e^x cosx sinx 不等式 拆项放缩 证明
