stem: |-
  已知 $x$ 为正实数。
  (1) 比较 $\cos x$ 与 $1-\frac{1}{2}x^2$ 的大小。
  (2) 求证：$e^x+\cos x \geqslant \sin x+2$。
answer: |-
  (1) $\cos x\ge1-\frac12x^2$；(2) 不等式成立。

  第(1)问直接使用经典放缩 $\cos x\ge1-\frac12x^2\ (x\in\mathbf{R})$。 第(2)问把目标改写为 $e^x+\cos x-\sin x-2\ge0$，并按 source 拆成 $\left(e^x-\frac12x^2-x-1\right)+\left(\cos x+\frac12x^2-1\right)+(x-\sin x)\ge0$。 三项分别由 $e^x\ge1+x+\frac12x^2\ (x\ge0)$、 $\cos x\ge1-\frac12x^2\ (x\in\mathbf{R})$、 $x-\sin x\ge0\ (x\ge0)$ 保证非负，因此原不等式成立。
