solution:
  source_solution_summary: 斜率为 1 的 e^x 切线来自 x=0，故 y=x+1，a=1； 斜率为 1 的 ln x+b 切线来自 x=1，故切线为 y=x-1+b。 与 y=x+1 相同得 b=2，所以 a+b=3。
  key_steps:
    - step_id: step_1
      statement: 对 e^x，有切线不等式 e^x>=x+1，等号在 x=0 取得。 因直线 y=x+a 的斜率也是 1，所以与 e^x 相切时 a=1。
      formula_trace:
        from: e^x>=x+1
        to: y=x+a=y=x+1, a=1
        operation: 识别指数函数斜率为 1 的切线
        why: e^x 的导数等于 1 时切点为 x=0。
      source_ref: page_0041:例5解析
    - step_id: step_2
      statement: 对 ln x，有 ln x<=x-1，故 ln x+2<=x+1。 若同一直线 y=x+1 与 ln x+b 相切，则 b=2。
      formula_trace:
        from: ln x<=x-1
        to: ln x+2<=x+1, b=2
        operation: 把对数函数斜率为 1 的切线平移 b
        why: ln x 在 x=1 处切线斜率为 1，切线为 y=x-1+b。
      source_ref: page_0041:例5解析
    - step_id: step_3
      statement: 因此 a+b=1+2=3，选择 D。
      formula_trace:
        from: a=1, b=2
        to: a+b=3
        operation: 代入求值并匹配选项
        why: 两次相切条件已唯一确定 a 与 b。
      source_ref: page_0041:例5解析
teaching_card:
  student_title: 斜率 1 同时切住 e^x 和 ln x+b
  what_it_trains: 训练学生遇到“斜率固定的切线”时，直接找切点：e^x 的斜率 1 切点在 0， ln x 的斜率 1 切点在 1，再用同一直线确定平移量。
  recognition_cues:
    - 直线 y=x+a 已经给出斜率 1。
    - 同时与 e^x 和 ln x+b 相切，说明两边都要使用斜率 1 的切线。
    - 选项只问 a+b，参数会被切线平移直接锁定。
  normalization_moves:
    - 把 e^x 的切线写成 y=x+1。
    - 把 ln x+b 的切线写成 y=x-1+b。
    - 令 x+1=x-1+b，得到 b=2。
  common_failures:
    - 把 e^x 的切点误认为 x=1。
    - 忘记 ln x+b 的 b 是整体上移，不改变切线斜率。
    - 只背 e^x>=x+1，却不会把 x+1 改写成 (x-1)+2 来读出 b。
  similar_practice_query: 固定斜率直线同时切 e^x 与 ln x 平移，求 a+b
