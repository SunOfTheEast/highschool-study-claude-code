stem: |-
  （山西省三晋名校联盟 2023 学年高三下学期顶尖计划联考 T7）若直线 y=x+a 与函数 f(x)=e^x 和 g(x)=ln x+b 的图象都相切，则 a+b=（ ）
  A. -1
  B. 0
  C. 1
  D. 3
answer: |-
  D，a+b=3

  斜率为 1 的 e^x 切线来自 x=0，故 y=x+1，a=1； 斜率为 1 的 ln x+b 切线来自 x=1，故切线为 y=x-1+b。 与 y=x+1 相同得 b=2，所以 a+b=3。
rubric:
  max_score: 3
  criteria:
    - step_id: step_1
      description: 对 e^x，有切线不等式 e^x>=x+1，等号在 x=0 取得。 因直线 y=x+a 的斜率也是 1，所以与 e^x 相切时 a=1。
      max_score: 1
    - step_id: step_2
      description: 对 ln x，有 ln x<=x-1，故 ln x+2<=x+1。 若同一直线 y=x+1 与 ln x+b 相切，则 b=2。
      max_score: 1
    - step_id: step_3
      description: 因此 a+b=1+2=3，选择 D。
      max_score: 1
