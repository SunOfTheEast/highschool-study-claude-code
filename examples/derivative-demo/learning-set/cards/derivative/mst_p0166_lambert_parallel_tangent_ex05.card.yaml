solution:
  source_solution_summary: 对 f(x)=axe^x-ln(ax)，源解先做朗博同构： f(x)=e^{x+ln(ax)}-ln(ax)=(e^{x+ln(ax)}-x-ln(ax)-1)+x+1>=x+1， 所以 y=x+1 是 f 的支撑切线。接着在 g(x)=2ln(x-1)/x 上构造斜率为 1 的切线，g^{\prime}(x)=((2x/(x-1))-2ln(x-1))/x^2，令 g^{\prime}(x)=1 得 x=2，且 g(2)=0，切线为 y=x-2。两条平行线 y=x+1 与 y=x-2 的距离 d=3/sqrt(2)=3sqrt(2)/2，因此恒有 |PQ|>=m 时必有 m<=d，故 m 的最大值是 3sqrt(2)/2，选 B。
  key_steps:
    - step_id: step_1
      statement: 用朗博同构把 f(x) 放缩到直线 y=x+1。
      formula_trace:
        from: f(x)=axe^x-ln(ax)
        to: f(x)=e^{x+ln(ax)}-ln(ax)=(e^{x+ln(ax)}-x-ln(ax)-1)+x+1>=x+1
        operation: 把 axe^x 写成 e^{x+ln(ax)}，再补出 e^t-t-1 模板。
        why: 得到参数 a 下统一的斜率 1 支撑线。
      source_ref: page_0166:line 34
    - step_id: step_2
      statement: 在 g(x) 上构造同斜率切线。
      formula_trace:
        from: g(x)=2ln(x-1)/x
        to: g^{\prime}(x)=((2x/(x-1))-2ln(x-1))/x^2=1 => x=2, 切线 y=x-2
        operation: 求导并令切线斜率等于 1；再代入点 (2,g(2))=(2,0)。
        why: 两条斜率同为 1 的切线给出可比较的最短间隔。
      source_ref: page_0166:line 34
    - step_id: step_3
      statement: 计算平行切线距离并给出 m 的上界。
      formula_trace:
        from: y=x+1 与 y=x-2
        to: d=|1-(-2)|/sqrt(2)=3/sqrt(2)=3sqrt(2)/2, 所以 m<=d
        operation: 用平行线距离公式。
        why: 任意 P,Q 的下界 m 不能超过这两条支撑线之间的距离。
      source_ref: page_0166:line 34
    - step_id: step_4
      statement: 转为“最大值”答案。
      formula_trace:
        from: m<=3sqrt(2)/2
        to: m_max=3sqrt(2)/2
        operation: 把恒成立条件改写为参数上界。
        why: 题目要的是 m 的最大可取值。
      source_ref: page_0166:line 34
teaching_card:
  student_title: 先做朗博同构，再用平行切线卡住 m
  what_it_trains: 训练“同构放缩 + 切线构造 + 平行线距离”三段式：先把复杂函数压到线性支撑线， 再在另一函数上找同斜率切线，最后把参数上界读成几何距离。
  recognition_cues:
    - 题目同时出现 xe^x 与 ln 结构，且问“对任意…恒成立”。
    - 目标量是动点距离下界 m。
    - 解析可自然走到 e^t-t-1 与平行切线。
  normalization_moves:
    - 把 axe^x 改写为 e^{x+ln(ax)}。
    - 先锁定 f 的支撑线 y=x+1。
    - 在 g 上令导数等于 1 找切线 y=x-2。
    - 由平行线距离得到 m 的上界并取最大值。
  common_failures:
    - 朗博同构时漏掉 -1+1，配不出标准模板。
    - 只求出 g^{\prime}(x)=1 的点，忘记写切线方程。
    - 算出 d 后直接当 m，而未先说明 m<=d 的逻辑。
  similar_practice_query: 朗博同构 平行切线 距离下界 m xe^x ln 参数最大值
