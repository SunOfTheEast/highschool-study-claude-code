stem: |-
  （2023 · 江西南昌八一中学三模 T12）在同一平面直角坐标系中，P，Q 分别是函数 f(x)=axe^x-ln(ax) 和 g(x)=2ln(x-1)/x 图象上的动点，若对任意 a>0，有 |PQ|>=m 恒成立，则实数 m 的最大值为（  ）
  A. sqrt(3)
  B. 3sqrt(2)/2
  C. sqrt(2)
  D. sqrt(5)/2
answer: |-
  B

  对 f(x)=axe^x-ln(ax)，源解先做朗博同构： f(x)=e^{x+ln(ax)}-ln(ax)=(e^{x+ln(ax)}-x-ln(ax)-1)+x+1>=x+1， 所以 y=x+1 是 f 的支撑切线。接着在 g(x)=2ln(x-1)/x 上构造斜率为 1 的切线，g^{\prime}(x)=((2x/(x-1))-2ln(x-1))/x^2，令 g^{\prime}(x)=1 得 x=2，且 g(2)=0，切线为 y=x-2。两条平行线 y=x+1 与 y=x-2 的距离 d=3/sqrt(2)=3sqrt(2)/2，因此恒有 |PQ|>=m 时必有 m<=d，故 m 的最大值是 3sqrt(2)/2，选 B。
