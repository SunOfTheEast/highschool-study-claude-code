solution:
  source_solution_summary: |
    先由导数在 0 点的取值得到三阶泰勒式 $g_1(x)=x-\frac16x^3,\ g_2(x)=1-\frac12x^2$。比较 $f_1(x)=\sin x$ 与 $g_1(x)$ 时，设 $h(x)=\sin x-x+\frac16x^3$，由 $h^{\prime\prime\prime}(x)=1-\cos x\ge0$ 推出 $h^{\prime}(x)\ge0$，再得 $h(x)$ 在 $\mathbf{R}$ 上单调递增且 $h(0)=0$，从而完成分段比较。再设 $\varphi(x)=\cos x-1+\frac12x^2$，由 $\varphi^{\prime\prime}(x)=1-\cos x\ge0$ 得 $\cos x\ge1-\frac12x^2$。结合已知 $e^x\ge1+x+\frac12x^2+\frac16x^3$ 与 $x\ge0$ 时 $\sin x\ge x-\frac16x^3$，三式相加后 $x^2,x^3$ 项抵消，得到 $e^x+\sin x+\cos x\ge2+2x$。
  key_steps:
    - step_id: step_1
      statement: 按 0 点导数写出 $\sin x,\cos x$ 的 3 阶泰勒展开式。
      formula_trace:
        from: $f_1(x)=\sin x,\ f_2(x)=\cos x$
        to: $g_1(x)=x-\frac16x^3,\ g_2(x)=1-\frac12x^2$
        operation: 计算到三阶导并代入 $x_0=0$ 的泰勒公式。
        why: 这是后续比较与放缩的基础近似式。
      source_ref: page_0208_ex08b_solution
    - step_id: step_2
      statement: 构造 $h(x)=\sin x-x+\frac16x^3$ 比较 $f_1(x)$ 与 $g_1(x)$。
      formula_trace:
        from: $h(x)=\sin x-x+\frac16x^3$
        to: 当 $x<0$ 时 $h(x)<0$，$x=0$ 时 $h(x)=0$，$x>0$ 时 $h(x)>0$
        operation: 由 $h^{\prime\prime\prime}(x)=1-\cos x\ge0$ 推得 $h^{\prime\prime}$ 递增、$h^{\prime}$ 在 0 处取最小值 0，故 $h$ 递增。
        why: 把函数比较转化为单函数符号判断。
      source_ref: page_0208_ex08b_solution
    - step_id: step_3
      statement: 构造 $\varphi(x)=\cos x-1+\frac12x^2$ 得到 $\cos x$ 下界。
      formula_trace:
        from: $\varphi(x)=\cos x-1+\frac12x^2$
        to: $\cos x\ge1-\frac12x^2$
        operation: 由 $\varphi^{\prime\prime}(x)=1-\cos x\ge0$ 与 $\varphi^{\prime}(0)=0$ 判定 $\varphi(x)\ge\varphi(0)=0$。
        why: 为第 (3) 问的三式并联放缩提供三角项下界。
      source_ref: page_0208_ex08b_solution
    - step_id: step_4
      statement: 调用材料中的指数函数 3 阶泰勒下界。
      formula_trace:
        from: $y=e^x$ 在 $x=0$ 的 3 阶泰勒展开
        to: $e^x\ge1+x+\frac12x^2+\frac16x^3$
        operation: 直接使用题设已知。
        why: 与 step_2、step_3 形成同阶项可抵消的组合。
      source_ref: page_0208_ex08b_solution
    - step_id: step_5
      statement: 把三条下界相加并在 $x\ge0$ 条件下收束为目标。
      formula_trace:
        from: $e^x\ge1+x+\frac12x^2+\frac16x^3,\ \sin x\ge x-\frac16x^3,\ \cos x\ge1-\frac12x^2$
        to: $e^x+\sin x+\cos x\ge2+2x\ (x\ge0)$
        operation: 逐项相加，$+\frac12x^2$ 与 $-\frac12x^2$、$+\frac16x^3$ 与 $-\frac16x^3$ 抵消。
        why: 直接闭合第 (3) 问目标不等式。
      source_ref: page_0208_ex08b_solution
teaching_card:
  student_title: 三阶泰勒并联放缩证明 $e^x+\sin x+\cos x$ 下界
  what_it_trains: 训练“先比较单函数余项符号，再把多函数下界拼接到目标不等式”的两段式证明习惯。
  recognition_cues:
    - 题目同时出现 $e^x,\sin x,\cos x$ 且给出泰勒材料。
    - 中间问先让你比较 $\sin x$ 与三阶多项式，暗示要做余项符号分析。
    - 终问目标是线性下界 $2+2x$，适合多项式阶次抵消。
  normalization_moves:
    - 围绕 0 点写出同阶泰勒式。
    - 差函数求导建立符号结论。
    - 将三条下界逐项相加并消去高阶项。
  common_failures:
    - 只写出展开式却不证明余项方向，导致比较结论无依据。
    - 把 $x\ge0$ 条件漏用到 $\sin x\ge x-\frac16x^3$。
    - 相加时漏掉 $x^2,x^3$ 抵消项，最终式子化简错误。
  similar_practice_query: 三阶泰勒 余项符号比较 sinx 与多项式 指数三角综合不等式
