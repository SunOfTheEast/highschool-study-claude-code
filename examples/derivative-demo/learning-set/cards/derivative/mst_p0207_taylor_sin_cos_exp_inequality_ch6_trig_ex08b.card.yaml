stem: |-
  （2021 · 吴江区校级月考 T20）给出高阶导数与泰勒展开的三段材料，利用材料完成三问。
  (1) 求出 $f_1(x)=\sin x$ 在点 $x=0$ 处的 3 阶泰勒展开式 $g_1(x)$，并直接写出 $f_2(x)=\cos x$ 在点 $x=0$ 处的 3 阶泰勒展开式 $g_2(x)$。
  (2) 比较 (1) 中 $f_1(x)$ 与 $g_1(x)$ 的大小。
  (3) 已知 $y=e^x$ 不小于其在点 $x=0$ 处的 3 阶泰勒展开式，证明：当 $x\geqslant0$ 时，$e^x+\sin x+\cos x\geqslant2+2x$。
answer: |
  (1) $g_1(x)=x-\frac16x^3,\ g_2(x)=1-\frac12x^2$；(2) 当 $x<0$ 时 $f_1(x)<g_1(x)$，$x=0$ 时相等，$x>0$ 时 $f_1(x)>g_1(x)$；(3) 结论成立。

  先由导数在 0 点的取值得到三阶泰勒式 $g_1(x)=x-\frac16x^3,\ g_2(x)=1-\frac12x^2$。比较 $f_1(x)=\sin x$ 与 $g_1(x)$ 时，设 $h(x)=\sin x-x+\frac16x^3$，由 $h^{\prime\prime\prime}(x)=1-\cos x\ge0$ 推出 $h^{\prime}(x)\ge0$，再得 $h(x)$ 在 $\mathbf{R}$ 上单调递增且 $h(0)=0$，从而完成分段比较。再设 $\varphi(x)=\cos x-1+\frac12x^2$，由 $\varphi^{\prime\prime}(x)=1-\cos x\ge0$ 得 $\cos x\ge1-\frac12x^2$。结合已知 $e^x\ge1+x+\frac12x^2+\frac16x^3$ 与 $x\ge0$ 时 $\sin x\ge x-\frac16x^3$，三式相加后 $x^2,x^3$ 项抵消，得到 $e^x+\sin x+\cos x\ge2+2x$。
