stem: |-
  （2017 · 新课标 I）已知函数 $f(x)=ae^{2x}+(a-2)e^x-x$。
  1. 讨论 $f(x)$ 的单调性。
  2. 若 $f(x)$ 有两个零点，求 $a$ 的取值范围。
answer: |-
  第(1)问：$a\le0$ 时在 $\mathbb R$ 上单调递减；$a>0$ 时在 $(-\infty,\ln\frac1a)$ 上递减，在 $(\ln\frac1a,+\infty)$ 上递增。第(2)问：$a\in(0,1)$。

  $f^\prime(x)=2ae^{2x}+(a-2)e^x-1=(2e^x+1)(ae^x-1)$。 当 $a\le0$ 时，$ae^x-1<0$，故 $f$ 在 $\mathbb R$ 上递减。 当 $a>0$ 时，导数零点为 $x=\ln\frac1a$，函数先减后增。若有两个零点， 先要求极小值 $f(\ln\frac1a)=1-\frac1a-\ln\frac1a<0$，令 $u=\frac1a$，由 $u+\ln u-1>0$ 得 $u>1$，即 $a\in(0,1)$。 充分性上，左侧可取 $x=-1$，直接代入得正值；右侧利用极值点右偏取 $x=2\ln\frac1a+1$，也可得到正值。于是极小值两侧各有一个零点。
