original_problem:
  stem: （2017 · 新课标 I）已知函数 $f(x)=ae^{2x}+(a-2)e^x-x$。
  parts: *a1
  choices: []
  answer: 第(1)问：$a\le0$ 时在 $\mathbb R$ 上单调递减；$a>0$ 时在 $(-\infty,\ln\frac1a)$ 上递减，在 $(\ln\frac1a,+\infty)$ 上递增。第(2)问：$a\in(0,1)$。
  fidelity_notes:
    - 两问综合题，无选项。
    - 第(2)问的充分性需要左右取点，不只写极小值条件。
solution:
  source_solution_summary: $f^\prime(x)=2ae^{2x}+(a-2)e^x-1=(2e^x+1)(ae^x-1)$。 当 $a\le0$ 时，$ae^x-1<0$，故 $f$ 在 $\mathbb R$ 上递减。 当 $a>0$ 时，导数零点为 $x=\ln\frac1a$，函数先减后增。若有两个零点， 先要求极小值 $f(\ln\frac1a)=1-\frac1a-\ln\frac1a<0$，令 $u=\frac1a$，由 $u+\ln u-1>0$ 得 $u>1$，即 $a\in(0,1)$。 充分性上，左侧可取 $x=-1$，直接代入得正值；右侧利用极值点右偏取 $x=2\ln\frac1a+1$，也可得到正值。于是极小值两侧各有一个零点。
  key_steps:
    - step_id: step_1
      statement: 把导数因式分解。
      formula_trace:
        from: $f^\prime(x)=2ae^{2x}+(a-2)e^x-1$
        to: $f^\prime(x)=(2e^x+1)(ae^x-1)$
        operation: 按 $e^x$ 分组因式分解。
        why: 导数符号只需看 $ae^x-1$。
      source_ref: page_0247_ex24_solution_start
    - step_id: step_2
      statement: 讨论单调性。
      formula_trace:
        from: $ae^x-1=0$
        to: $a>0$ 时 $x=\ln\frac1a$；$a\le0$ 时无导数零点
        operation: 按参数符号分类。
        why: 第(1)问直接由导数符号完成。
      source_ref: page_0248_ex24_continuation
    - step_id: step_3
      statement: 两个零点先要求极小值小于零。
      formula_trace:
        from: $f(\ln\frac1a)=1-\frac1a-\ln\frac1a$
        to: $1-\frac1a-\ln\frac1a<0$
        operation: 代入极小值点。
        why: 先减后增函数要穿轴两次，谷底必须低于 $x$ 轴。
      source_ref: page_0248_ex24_continuation
    - step_id: step_4
      statement: 解出必要参数区间。
      formula_trace:
        from: $1-\frac1a-\ln\frac1a<0$
        to: $a\in(0,1)$
        operation: 令 $u=\frac1a$，用 $u+\ln u-1$ 单调递增。
        why: 把含参不等式转成标准指对比较。
      source_ref: page_0248_ex24_continuation
    - step_id: step_5
      statement: 左侧取常数点。
      formula_trace:
        from: $x=-1$
        to: $f(-1)=1-\frac2e+a(\frac1{e^2}+\frac1e)>0$
        operation: 直接代入显点。
        why: 左侧正值、极小值负值，保证左零点存在。
      source_ref: page_0248_ex24_continuation
    - step_id: step_6
      statement: 右侧按极值点对称取点。
      formula_trace:
        from: $x=-1$ 关于 $x=\ln\frac1a$ 的对称点
        to: $x=2\ln\frac1a+1$
        operation: 极值点偏移取点。
        why: 减少右侧取点计算量，用偏移结构保证右侧能找到正值。
      source_ref: page_0248_ex24_continuation
teaching_card:
  student_title: 先分解导数，再用极值点右偏找两个零点
  what_it_trains: 训练含 $e^x$ 和 $e^{2x}$ 的导数因式分解，以及用极小值和左右取点证明两个零点。
  recognition_cues:
    - 导数是关于 $e^x$ 的二次式。
    - 第(2)问问“两个零点”的参数范围。
    - 极值点是 $\ln\frac1a$。
    - 右侧取点写成 $2\ln\frac1a+1$，来自围绕极值点对称。
  normalization_moves:
    - 先讨论 $a\le0$ 和 $a>0$ 的单调性。
    - 用极小值小于零得到候选区间。
    - 左侧取 $x=-1$ 直接验证。
    - 右侧用极值点右偏取对称点。
  common_failures:
    - 导数不会分解，导致分类复杂化。
    - 只得到 $a\in(0,1)$，没有证明充分性。
    - 照抄 source 的左侧不等式链，没有发现它不严。
    - 不知道 $2\ln\frac1a+1$ 是怎么来的。
  similar_practice_query: ae^{2x}+(a-2)e^x-x 两个零点 参数范围 极值点右偏 导数因式分解
