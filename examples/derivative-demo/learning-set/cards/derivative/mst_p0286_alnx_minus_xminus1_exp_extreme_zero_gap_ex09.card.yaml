stem: |-
  （2025 · 石家庄期中）已知函数 $f(x)=a\ln x-(x-1)e^{bx}$（$a,b$ 是常数，$e$ 是自然对数的底数）。
  1. 当 $a=1,b=0$ 时，求函数 $f(x)$ 的最大值。
  2. 当 $a>e,b=1$ 时，证明：函数 $f(x)$ 存在唯一的极值点 $\beta$。
  3. 若 $f(\alpha)=0$，且 $\alpha>\beta$，证明：$(\alpha-\beta)(2\beta+1)<3(\beta^2-1)$。
answer: |-
  第(1)问最大值为 $0$；第(2)问存在唯一极值点 $\beta$，且右侧零点 $\alpha$ 满足 $(\alpha-\beta)(2\beta+1)<3(\beta^2-1)$。

  第(1)问化为 $f(x)=\ln x-x+1$，由 $f^\prime(x)=\frac{1-x}{x}$ 得 $x=1$ 处取最大值 $0$。第(2)问令 $g(x)=a-e^x x^2$，因为 $g^\prime(x)=-e^x(x^2+2x)<0$， 且 $g(1)=a-e>0$、$g(\ln a)<0$，所以存在唯一 $\beta\in(1,\ln a)$ 使 $g(\beta)=0$，函数 $f$ 先增后减， $\beta$ 是唯一极大值点。接着用 $f(x)=(x-1)(\frac{a\ln x}{x-1}-e^x)$，在 $x=\ln a$ 处找到 $f(\ln a)<0$，结合 $f(1)=0$ 和 $\alpha>\beta$ 得 $\beta<\alpha<\ln a$。目标只需证明 $(\ln a-\beta)(2\beta+1)<3(\beta^2-1)$。由 $a=e^\beta\beta^2$ 得 $\ln a=\beta+2\ln\beta$，目标化为 $3\beta^2-2\ln\beta-4\beta\ln\beta-3>0$。source 给出两条结尾： 一是构造 $h(x)=3x^2-4x\ln x-2\ln x-3$ 并证明 $h$ 在 $x>1$ 单增；二是保值性拆成 $2\beta(\beta-\ln\beta-1)+2(\beta-\ln\beta-1)+\beta(\beta-\frac1\beta-2\ln\beta)>0$。
