original_problem:
  stem: （2025 · 石家庄期中）已知函数 $f(x)=a\ln x-(x-1)e^{bx}$（$a,b$ 是常数，$e$ 是自然对数的底数）。
  parts: *a1
  choices: []
  answer: 第(1)问最大值为 $0$；第(2)问存在唯一极值点 $\beta$，且右侧零点 $\alpha$ 满足 $(\alpha-\beta)(2\beta+1)<3(\beta^2-1)$。
  fidelity_notes:
