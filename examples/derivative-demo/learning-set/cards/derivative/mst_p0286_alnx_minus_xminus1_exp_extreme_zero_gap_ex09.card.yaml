    - 页图中的辅助图属于例9；页底例10另起，不纳入本卡。
solution:
  source_solution_summary: 第(1)问化为 $f(x)=\ln x-x+1$，由 $f^\prime(x)=\frac{1-x}{x}$ 得 $x=1$ 处取最大值 $0$。第(2)问令 $g(x)=a-e^x x^2$，因为 $g^\prime(x)=-e^x(x^2+2x)<0$， 且 $g(1)=a-e>0$、$g(\ln a)<0$，所以存在唯一 $\beta\in(1,\ln a)$ 使 $g(\beta)=0$，函数 $f$ 先增后减， $\beta$ 是唯一极大值点。接着用 $f(x)=(x-1)(\frac{a\ln x}{x-1}-e^x)$，在 $x=\ln a$ 处找到 $f(\ln a)<0$，结合 $f(1)=0$ 和 $\alpha>\beta$ 得 $\beta<\alpha<\ln a$。目标只需证明 $(\ln a-\beta)(2\beta+1)<3(\beta^2-1)$。由 $a=e^\beta\beta^2$ 得 $\ln a=\beta+2\ln\beta$，目标化为 $3\beta^2-2\ln\beta-4\beta\ln\beta-3>0$。source 给出两条结尾： 一是构造 $h(x)=3x^2-4x\ln x-2\ln x-3$ 并证明 $h$ 在 $x>1$ 单增；二是保值性拆成 $2\beta(\beta-\ln\beta-1)+2(\beta-\ln\beta-1)+\beta(\beta-\frac1\beta-2\ln\beta)>0$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问先处理基础最大值。
      formula_trace:
        from: $f(x)=\ln x-x+1$
        to: $f^\prime(x)=\frac{1-x}{x},\quad f(1)=0$
        operation: 求导判单调。
        why: $f$ 在 $(0,1)$ 上递增、在 $(1,+\infty)$ 上递减，所以最大值在 $x=1$。
      source_ref: page_0286_ex09_solution
    - step_id: step_2
      statement: 用导函数的分子给极值点 $\beta$ 找位置。
      formula_trace:
        from: $f^\prime(x)=\frac{a-e^x x^2}{x}$
        to: $g(x)=a-e^x x^2,\quad \beta\in(1,\ln a)$
        operation: 令 $g(x)=a-e^x x^2$，证明 $g$ 单调递减，并比较 $g(1)$ 与 $g(\ln a)$。
        why: 导函数零点不可显式求出，所以先用显点 $1,\ln a$ 把极值点夹住。
      source_ref: page_0286_ex09_solution
    - step_id: step_3
      statement: 用 $x=\ln a$ 控住右侧零点 $\alpha$。
      formula_trace:
        from: $f(x)=(x-1)(\frac{a\ln x}{x-1}-e^x)$
        to: $f(\ln a)<0,\quad \beta<\alpha<\ln a$
        operation: 利用 $x>1$ 时 $\frac{\ln x}{x-1}<1$，在 $x=\ln a$ 处取负值。
        why: 这样把未知零点 $\alpha$ 放到同一个右侧显点 $\ln a$ 之前。
      source_ref: page_0286_ex09_solution
    - step_id: step_4
      statement: 把目标换成只需要证明上界版本。
      formula_trace:
        from: $\beta<\alpha<\ln a$
        to: 只需证 $(\ln a-\beta)(2\beta+1)<3(\beta^2-1)$
        operation: 用 $\ln a$ 替代更小的 $\alpha$。
        why: $2\beta+1>0$，所以证明更强的上界即可。
      source_ref: page_0286_ex09_solution
    - step_id: step_5
      statement: 用极值点方程消去参数 $a$。
      formula_trace:
        from: $g(\beta)=0$
        to: $a=e^\beta\beta^2,\quad \ln a=\beta+2\ln\beta$
        operation: 由导函数零点关系取对数。
        why: 把含 $a$ 的显点 $\ln a$ 改写成只含 $\beta$ 的表达式。
      source_ref: page_0286_ex09_solution
    - step_id: step_6
      statement: 最后证明只含 $\beta$ 的不等式。
      formula_trace:
        from: $2\ln\beta(2\beta+1)<3(\beta^2-1)$
        to: $3\beta^2-2\ln\beta-4\beta\ln\beta-3>0$
        operation: 构造函数 $h$ 或用保值性拆项。
        why: 两种方法都把终点落到 $x>1$ 的基础对数不等式上。
      source_ref: page_0286_ex09_solution
teaching_card:
  student_title: 用 $\ln a$ 同时卡住极值点和零点
  what_it_trains: 训练遇到不可显式求出的极值点和零点时，先用显点 $\ln a$ 建立位置关系，再用极值点方程把参数消掉。
  recognition_cues:
    - 导函数零点 $\beta$ 求不出来，但可以用 $1$ 和 $\ln a$ 夹住。
    - 题目要比较右侧零点 $\alpha$ 和极值点 $\beta$ 的距离。
    - 函数里同时有 $a\ln x$ 和 $(x-1)e^x$，容易想到用 $x=\ln a$ 做右侧找点。
    - 最后目标含 $\alpha$，但解析先把 $\alpha$ 换成更大的上界 $\ln a$。
  normalization_moves:
    - 先把 $f^\prime(x)$ 写成 $\frac{a-e^x x^2}{x}$。
    - 用 $g(1)>0,g(\ln a)<0$ 找到 $\beta$。
    - 把 $f(x)$ 写成 $(x-1)(\frac{a\ln x}{x-1}-e^x)$，在 $x=\ln a$ 处判负。
    - 用 $g(\beta)=0$ 把 $\ln a$ 换成 $\beta+2\ln\beta$。
  common_failures:
    - 只会证明极值点唯一，但不知道为什么还要证明 $\alpha<\ln a$。
    - 把 $x=\ln a$ 当成机械取点，没有看出它同时服务于极值点和零点定位。
    - 直接在 $\alpha,\beta$ 之间硬代数，忽略 source 的共同上界路线。
    - 最后不会把 $3\beta^2-2\ln\beta-4\beta\ln\beta-3>0$ 收到基础对数不等式。
  similar_practice_query: a ln x minus (x-1)e^x 极值点 零点 beta alpha ln a 距离不等式 保值性
