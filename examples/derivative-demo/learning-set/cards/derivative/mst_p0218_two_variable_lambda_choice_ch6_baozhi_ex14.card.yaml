original_problem:
  stem: （2025 · 四川德阳质检 T8）对任意 $a,b\in\mathbf R$，都有 $(b-a)e^{b-a}\geqslant be^{-b}-\lambda a$ 恒成立，则实数 $\lambda$ 的值为 $(\quad)$。
  parts: *a1
  choices:
    - label: A
      text: $e$
    - label: B
      text: $1$
    - label: C
      text: $0$
    - label: D
      text: $-e$
  answer: B. $1$。
  fidelity_notes:
