stem: |-
  （2025 · 四川德阳质检 T8）对任意 $a,b\in\mathbf R$，都有 $(b-a)e^{b-a}\geqslant be^{-b}-\lambda a$ 恒成立，则实数 $\lambda$ 的值为 $(\quad)$。
  A. $e$
  B. $1$
  C. $0$
  D. $-e$
answer: |-
  B. $1$。

  法一取特殊值：$a=b=1$ 得 $\lambda\geqslant 1/e$，排除 C、D； 取 $b=0,a=-1/2$ 得 $\lambda\leqslant e^{1/2}$，排除 A，故只能选 B。法二将原不等式整理为 $(b-a)e^{b-a}-\lambda(b-a)+(-be^{-b})-\lambda(-b)\geqslant0$， 令 $h(x)=xe^x-\lambda x$，则需要 $h(b-a)+h(-b)\geqslant0$ 对任意 $a,b$ 成立。由于 $b-a$ 与 $-b$ 可独立取任意实数，这要求 $h(x)\geqslant0$ 恒成立。分类看 $x=0$、$x<0$、$x>0$，分别得到对 $\lambda$ 的夹逼，最终 $\lambda=1$。
