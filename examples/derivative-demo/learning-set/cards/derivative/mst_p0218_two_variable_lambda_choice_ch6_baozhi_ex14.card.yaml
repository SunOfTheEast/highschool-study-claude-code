solution:
  source_solution_summary: 法一取特殊值：$a=b=1$ 得 $\lambda\geqslant 1/e$，排除 C、D； 取 $b=0,a=-1/2$ 得 $\lambda\leqslant e^{1/2}$，排除 A，故只能选 B。法二将原不等式整理为 $(b-a)e^{b-a}-\lambda(b-a)+(-be^{-b})-\lambda(-b)\geqslant0$， 令 $h(x)=xe^x-\lambda x$，则需要 $h(b-a)+h(-b)\geqslant0$ 对任意 $a,b$ 成立。由于 $b-a$ 与 $-b$ 可独立取任意实数，这要求 $h(x)\geqslant0$ 恒成立。分类看 $x=0$、$x<0$、$x>0$，分别得到对 $\lambda$ 的夹逼，最终 $\lambda=1$。
  key_steps:
    - step_id: step_1
      statement: 用特殊值快速排除。
      formula_trace:
        from: $(b-a)e^{b-a}\geqslant be^{-b}-\lambda a$
        to: $a=b=1\Rightarrow \lambda\geqslant1/e$；$b=0,a=-1/2\Rightarrow \lambda\leqslant e^{1/2}$
        operation: 代入能直接限制 $\lambda$ 的点。
        why: 选择题先缩小候选，保留 source 的最快路径。
      source_ref: page_0218_ex14_solution
    - step_id: step_2
      statement: 把双变量式拆成同一个单变量函数的两项。
      formula_trace:
        from: $(b-a)e^{b-a}\geqslant be^{-b}-\lambda a$
        to: $(b-a)e^{b-a}-\lambda(b-a)+(-be^{-b})-\lambda(-b)\geqslant0$
        operation: 补出 $-\lambda(b-a)-\lambda(-b)=-\lambda a$。
        why: 把 $b-a$ 与 $-b$ 都装进同一个 $h(x)$。
      source_ref: page_0218_ex14_solution
    - step_id: step_3
      statement: 构造保值函数。
      formula_trace:
        from: $(b-a)e^{b-a}-\lambda(b-a)+(-be^{-b})-\lambda(-b)$
        to: $h(b-a)+h(-b)$，其中 $h(x)=xe^x-\lambda x$
        operation: 令 $x=b-a$ 与 $x=-b$ 分别进入 $h$。
        why: 若 $h(x)\geqslant0$ 恒成立，则两项之和自然非负。
      source_ref: page_0218_ex14_solution
    - step_id: step_4
      statement: 由任意性反推 $h(x)$ 本身必须非负。
      formula_trace:
        from: $h(b-a)+h(-b)\geqslant0$ 对任意 $a,b$ 成立
        to: $h(x)\geqslant0$ 对任意 $x\in\mathbf R$ 成立
        operation: 利用 $b-a$ 与 $-b$ 的自由度。
        why: 这是双变量保值性题的关键降维。
      source_ref: page_0218_ex14_solution
    - step_id: step_5
      statement: 按 $x$ 的正负分类锁定 $\lambda$。
      formula_trace:
        from: $h(x)=x(e^x-\lambda)\geqslant0$
        to: $x<0\Rightarrow \lambda\geqslant1$，$x>0\Rightarrow \lambda\leqslant1$，故 $\lambda=1$
        operation: 除以正负不同的 $x$，并取 $e^x$ 在正负半轴的极限/范围。
        why: 完成必要性和充分性，得到唯一答案。
      source_ref: page_0218_ex14_solution
teaching_card:
  student_title: 把双变量不等式拆成两个 $h(x)$
  what_it_trains: 训练双变量保值性：通过补项把两个变量组合拆成同一个单变量函数，再用符号分类夹住参数。
  recognition_cues:
    - 题目写着“对任意 $a,b$ 恒成立”，且有 $b-a$ 与 $be^{-b}$ 这种可改写成 $(-b)e^{-b}$ 的结构。
    - 参数项 $\lambda a$ 可以被拆成与 $b-a$、$-b$ 对应的两份。
    - 最后会落到 $x(e^x-\lambda)\geqslant0$ 这类正负半轴夹参。
  normalization_moves:
    - 先用特殊值排除明显选项。
    - 再补项构造 $h(b-a)+h(-b)$。
    - 最后分类 $x<0$ 与 $x>0$。
  common_failures:
    - 只代特殊值选出 B，但说不清为什么 B 必然可行。
    - 把 $be^{-b}$ 误看成 $h(b)$，漏掉应使用 $-b$。
    - 除以负数 $x$ 时不等号方向写反。
  similar_practice_query: 双变量 保值性 h(b-a)+h(-b) xe^x-lambda x 恒成立 求参数
