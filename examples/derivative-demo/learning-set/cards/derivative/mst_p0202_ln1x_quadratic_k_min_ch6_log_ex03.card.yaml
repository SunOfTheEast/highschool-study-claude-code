stem: 已知函数 $f(x)=x-\ln(x+1)$ 对任意 $x\in[0,+\infty)$ 有 $f(x)\leqslant kx^2$ 成立，则 $k$ 的最小值为______。
answer: |-
  $\frac12$

  由 $x-\ln(1+x)\le kx^2$ 得 $\ln(1+x)\ge x-kx^2$（$x\ge0$）。源解调用标准下界 $\ln(1+x)\ge x-\frac{x^2}{2}$，可知想让右端始终不高于 $\ln(1+x)$， 必须有 $x-kx^2\le x-\frac{x^2}{2}$，即 $k\ge\frac12$。当 $k=\frac12$ 时原不等式成立，所以最小值为 $\frac12$。
