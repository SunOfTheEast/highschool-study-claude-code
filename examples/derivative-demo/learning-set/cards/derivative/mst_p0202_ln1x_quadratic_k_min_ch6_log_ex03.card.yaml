solution:
  source_solution_summary: 由 $x-\ln(1+x)\le kx^2$ 得 $\ln(1+x)\ge x-kx^2$（$x\ge0$）。源解调用标准下界 $\ln(1+x)\ge x-\frac{x^2}{2}$，可知想让右端始终不高于 $\ln(1+x)$， 必须有 $x-kx^2\le x-\frac{x^2}{2}$，即 $k\ge\frac12$。当 $k=\frac12$ 时原不等式成立，所以最小值为 $\frac12$。
  key_steps:
    - step_id: step_1
      statement: 把原不等式改写为 $\ln(1+x)$ 下界形式。
      formula_trace:
        from: $x-\ln(1+x)\le kx^2$
        to: $\ln(1+x)\ge x-kx^2$
        operation: 移项整理。
        why: 与标准 $\ln(1+x)$ 放缩模板对齐。
      source_ref: page_0202_solution
    - step_id: step_2
      statement: 使用 $x\ge0$ 的对数二阶下界。
      formula_trace:
        from: $x\ge0$
        to: $\ln(1+x)\ge x-\frac{x^2}{2}$
        operation: 调用源页给出的已知不等式。
        why: 提供可比较的统一下界。
      source_ref: page_0202_solution
    - step_id: step_3
      statement: 比较二次项系数得到最小参数。
      formula_trace:
        from: $x-kx^2\le x-\frac{x^2}{2}$
        to: $k\ge\frac12$
        operation: 消去一次项后比较二次项系数。
        why: 确定“对任意 $x\ge0$”恒成立的最小 $k$。
      source_ref: page_0202_solution
teaching_card:
  student_title: 把恒成立变成对数下界比系数
  what_it_trains: 训练“参数最小值”题里先找可复用的函数下界，再把问题化成系数比较。
  recognition_cues:
    - 含 $\ln(1+x)$，区间是 $x\ge0$。
    - 目标是“$k$ 的最小值”。
    - 不需要复杂导数，依赖标准放缩式。
  normalization_moves:
    - 把不等式整理到 $\ln(1+x)\ge$ 某表达式。
    - 代入标准下界 $x-\frac{x^2}{2}$。
    - 比较二次项系数确定 $k_{\min}$。
  common_failures:
    - 把 $\ln(1+x)\ge x-\frac{x^2}{2}$ 误写成反向。
    - 漏写定义域 $x\ge0$ 就直接比较。
    - 只写 $k\ge\frac12$，未回答“最小值是 $\frac12$”。
  similar_practice_query: ln(1+x) >= x-kx^2 k最小值 对数放缩
