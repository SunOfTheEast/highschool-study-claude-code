solution:
  source_solution_summary: 先分段分析：对 $x<1$，$f(x)=x^2e^x$，有 $f^{\prime}(x)=x(x+2)e^x$，故在 $(-\infty,-2)$ 递增、在 $(-2,0)$ 递减、在 $(0,1)$ 递增，且极大值 $f(-2)=\frac4{e^2}$、$f(0)=0$、$f(1^-)=e$。对 $x\ge1$， $f(x)=\frac{e^x}{x^2}$，在 $(1,2)$ 递减、在 $(2,+\infty)$ 递增， 且最小值 $f(2)=\frac{e^2}{4}$，并有 $f(1)=e$。 方程 $[f(x)]^2-2af(x)=0$ 等价于 $f(x)=0$ 或 $f(x)=2a$。 其中 $f(x)=0$ 仅有 $x=0$ 一根。要使总根数为两个不同实根， 需 $f(x)=2a$ 恰有一根，即 $2a\in\left(\frac4{e^2},\frac{e^2}{4}\right)\cup(e,+\infty)$， 所以 $a\in\left(\frac2{e^2},\frac{e^2}{8}\right)\cup\left(\frac e2,+\infty\right)$。 因此 B 的 $\left[\frac e2,+\infty\right)$ 端点写错；C 的极大值点应为 $x=-2$；A 按 source 判为错误；D 由图像成立，故选 D。
  key_steps:
    - step_id: step_1
      statement: 完成分段函数的单调与极值分析。
      formula_trace:
        from: $f(x)=x^2e^x\ (x<1),\ f(x)=\frac{e^x}{x^2}\ (x\ge1)$
        to: $f(-2)=\frac4{e^2}$（左段极大），$f(2)=\frac{e^2}{4}$（右段极小）
        operation: 分别求导或按 source 的同构不等式判定两段走势。
        why: 后续 $f(x)=2a$ 的交点个数完全依赖这两个阈值。
      source_ref: page_0188-page_0189
    - step_id: step_2
      statement: 把原方程拆成两条水平线方程。
      formula_trace:
        from: $[f(x)]^2-2af(x)=0$
        to: $f(x)=0$ 或 $f(x)=2a$
        operation: 提取公因式 $f(x)$。
        why: “两个不同实根”可拆成固定根 + 可变根数。
      source_ref: page_0189
    - step_id: step_3
      statement: 利用图像判定 $f(x)=2a$ 恰有一根。
      formula_trace:
        from: $f(x)=0$ 仅有 $x=0$
        to: $2a\in\left(\frac4{e^2},\frac{e^2}{4}\right)\cup(e,+\infty)$
        operation: 在草图上读取水平线与曲线只交一次的高度区间。
        why: 与 $x=0$ 合并后正好得到两个不同实根。
      source_ref: page_0189
    - step_id: step_4
      statement: 回到选项逐项判定。
      formula_trace:
        from: $a\in\left(\frac2{e^2},\frac{e^2}{8}\right)\cup\left(\frac e2,+\infty\right)$
        to: B 错（端点 $\frac e2$ 不能取），C 错（极大点是 $-2$），D 对
        operation: 换元回 $a$ 并与选项文本比较。
        why: 完成单选判定链并得到答案 D。
      source_ref: page_0189
teaching_card:
  student_title: 分段草图下的“固定根+可变根”
  what_it_trains: 训练把 $f(x)$ 型方程先拆因式，再用分段图像控制第二条方程的根数，从而精确满足总根数条件。
  recognition_cues:
    - 方程可写成 $f(x)\cdot(\cdots)=0$。
    - 函数是分段指数型，题目同时考根数与极值性质。
    - 选项里有参数区间端点和极值点位置。
  normalization_moves:
    - 先定位分段阈值点（$-2,0,1,2$）与关键函数值。
    - 将总根数拆为 $f(x)=0$ 与 $f(x)=2a$ 的根数和。
    - 用水平线只交一次的高度区间反推参数范围。
  common_failures:
    - 把 $a=\frac e2$ 误判为可取，忽略此时 $f(x)=e$ 在右段有两根，导致总根数变成 3。
    - 把左段极大值点写成 $x=-3$。
    - 未先拆因式，直接在 $[f(x)]^2-2af(x)=0$ 上做无效代数分类。
  similar_practice_query: 分段函数 水平线 根数 两个不同实根 参数区间 端点开闭
