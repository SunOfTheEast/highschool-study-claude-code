stem: |-
  已知函数 $f(x)=\begin{cases}x^2e^x,&x<1\\ \frac{e^x}{x^2},&x\ge1\end{cases}$，方程 $[f(x)]^2-2af(x)=0\ (a\in\mathbf{R})$ 有两个不等实根，则下列选项正确的是（  ）
  A. 点 $(0,0)$ 是函数 $f(x)$ 的零点
  B. $a$ 的取值范围是 $\left(\frac{2}{e^2},\frac{e^2}{8}\right)\cup\left[\frac e2,+\infty\right)$
  C. $x=-3$ 是 $f(x)$ 的极大值点
  D. $\exists x_1\in(0,1),x_2\in(1,3)$，使 $f(x_1)>f(x_2)$
answer: |-
  D

  先分段分析：对 $x<1$，$f(x)=x^2e^x$，有 $f^{\prime}(x)=x(x+2)e^x$，故在 $(-\infty,-2)$ 递增、在 $(-2,0)$ 递减、在 $(0,1)$ 递增，且极大值 $f(-2)=\frac4{e^2}$、$f(0)=0$、$f(1^-)=e$。对 $x\ge1$， $f(x)=\frac{e^x}{x^2}$，在 $(1,2)$ 递减、在 $(2,+\infty)$ 递增， 且最小值 $f(2)=\frac{e^2}{4}$，并有 $f(1)=e$。 方程 $[f(x)]^2-2af(x)=0$ 等价于 $f(x)=0$ 或 $f(x)=2a$。 其中 $f(x)=0$ 仅有 $x=0$ 一根。要使总根数为两个不同实根， 需 $f(x)=2a$ 恰有一根，即 $2a\in\left(\frac4{e^2},\frac{e^2}{4}\right)\cup(e,+\infty)$， 所以 $a\in\left(\frac2{e^2},\frac{e^2}{8}\right)\cup\left(\frac e2,+\infty\right)$。 因此 B 的 $\left[\frac e2,+\infty\right)$ 端点写错；C 的极大值点应为 $x=-2$；A 按 source 判为错误；D 由图像成立，故选 D。
