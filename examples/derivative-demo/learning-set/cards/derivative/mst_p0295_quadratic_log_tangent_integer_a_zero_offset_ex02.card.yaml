stem: |-
  （2025 · 滨海新区校级三模）已知 $f(x)=\frac12x^2-2x-3\ln x$，$g(x)=\frac16x^3+x^2-a\ln x$。
  1. 求 $f(x)$ 在 $(1,f(1))$ 处的切线方程。
  2. 不等式 $xf^\prime(x)-g^\prime(x)>\frac13f(x)+\frac13x^2-\frac{10}{3}x+a-4$ 对任意 $x>1$ 成立，求 $a$ 的最大整数解。
  3. $F(x)=g(x)-\frac16x^3$ 的两个零点为 $x_1,x_2$（$x_1<x_2$），且 $x_0$ 为 $F(x)$ 的唯一极值点，求证：$x_1+3x_2>4x_0$。
answer: |-
  第(1)问切线方程为 $8x+2y-5=0$；第(2)问 $a$ 的最大整数解为 $3$；第(3)问 $x_1+3x_2>4x_0$ 成立。

  第(1)问由 $f^\prime(x)=x-2-\frac3x$ 得 $f^\prime(1)=-4$，且 $f(1)=-3/2$，所以切线方程为 $y+\frac32=-4(x-1)$，即 $8x+2y-5=0$。第(2)问把原不等式化为 $a<h(x)=\frac{x(1+\ln x)}{x-1}$ 对任意 $x>1$ 成立。令 $m(x)=x-2-\ln x$，则 $h^\prime(x)$ 与 $m(x)$ 同号， $m$ 在 $(1,+\infty)$ 上递增且在 $(3,4)$ 内有唯一零点 $x_0$。 因此 $h$ 先减后增，$h_{\min}=h(x_0)=x_0\in(3,4)$，最大整数解为 $3$。第(3)问中 $F(x)=x^2-a\ln x$。若有两个零点，则 $a>2e$，唯一极值点为 $x_0=\sqrt{a/2}$。设 $t=x_2/x_1>1$， 由两零点方程相减得 $x_1^2=\frac{a\ln t}{t^2-1}$。目标化为 $(3t+1)^2\ln t-8t^2+8>0$，source 通过两次求导证明该式在 $t>1$ 上递增且从 $0$ 起。法二更短：由 $\frac{(x_2-x_1)(x_2+x_1)}{\ln x_2-\ln x_1}=a$ 与对数均值估计， 得 $x_1+x_2>\sqrt{2a}=2x_0$，从而 $x_1+3x_2>2(x_1+x_2)>4x_0$。
