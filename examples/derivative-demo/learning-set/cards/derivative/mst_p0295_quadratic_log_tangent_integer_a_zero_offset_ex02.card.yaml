original_problem:
  stem: （2025 · 滨海新区校级三模）已知 $f(x)=\frac12x^2-2x-3\ln x$，$g(x)=\frac16x^3+x^2-a\ln x$。
  parts: *a1
  choices: []
  answer: 第(1)问切线方程为 $8x+2y-5=0$；第(2)问 $a$ 的最大整数解为 $3$；第(3)问 $x_1+3x_2>4x_0$ 成立。
  fidelity_notes:
    - 无选项。
    - 第(2)问严格不等式按最大整数解处理，最终整数答案稳定为 $3$。
solution:
  source_solution_summary: 第(1)问由 $f^\prime(x)=x-2-\frac3x$ 得 $f^\prime(1)=-4$，且 $f(1)=-3/2$，所以切线方程为 $y+\frac32=-4(x-1)$，即 $8x+2y-5=0$。第(2)问把原不等式化为 $a<h(x)=\frac{x(1+\ln x)}{x-1}$ 对任意 $x>1$ 成立。令 $m(x)=x-2-\ln x$，则 $h^\prime(x)$ 与 $m(x)$ 同号， $m$ 在 $(1,+\infty)$ 上递增且在 $(3,4)$ 内有唯一零点 $x_0$。 因此 $h$ 先减后增，$h_{\min}=h(x_0)=x_0\in(3,4)$，最大整数解为 $3$。第(3)问中 $F(x)=x^2-a\ln x$。若有两个零点，则 $a>2e$，唯一极值点为 $x_0=\sqrt{a/2}$。设 $t=x_2/x_1>1$， 由两零点方程相减得 $x_1^2=\frac{a\ln t}{t^2-1}$。目标化为 $(3t+1)^2\ln t-8t^2+8>0$，source 通过两次求导证明该式在 $t>1$ 上递增且从 $0$ 起。法二更短：由 $\frac{(x_2-x_1)(x_2+x_1)}{\ln x_2-\ln x_1}=a$ 与对数均值估计， 得 $x_1+x_2>\sqrt{2a}=2x_0$，从而 $x_1+3x_2>2(x_1+x_2)>4x_0$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问求切线。
      formula_trace:
        from: $f^\prime(x)=x-2-\frac3x,\quad f(1)=-\frac32$
        to: $y+\frac32=-4(x-1)$
        operation: 代入 $x=1$ 求斜率和点。
        why: 切线方程直接用点斜式。
      source_ref: page_0295_ex02_solution_start
    - step_id: step_2
      statement: 第(2)问把原不等式化成参数上界。
      formula_trace:
        from: $xf^\prime(x)-g^\prime(x)>\frac13f(x)+\frac13x^2-\frac{10}{3}x+a-4$
        to: $a<h(x)=\frac{x(1+\ln x)}{x-1}$
        operation: 代入 $f^\prime,g^\prime,f$ 并整理。
        why: 最大整数解问题转成右侧函数最小值问题。
      source_ref: page_0295_ex02_solution_start
    - step_id: step_3
      statement: 研究 $h$ 的最小值。
      formula_trace:
        from: $h^\prime(x)=\frac{x-2-\ln x}{(x-1)^2}$
        to: $x_0\in(3,4),\quad h_{\min}=h(x_0)=x_0$
        operation: 令 $m(x)=x-2-\ln x$，用单调性锁定零点。
        why: 隐零点 $x_0$ 不用求出，只要知道它在 $(3,4)$。
      source_ref: page_0295_ex02_solution_start
    - step_id: step_4
      statement: 由 $h_{\min}\in(3,4)$ 得最大整数解。
      formula_trace:
        from: $a<h_{\min}=x_0\in(3,4)$
        to: $a_{\max,\mathbf Z}=3$
        operation: 取整数。
        why: 严格上界仍允许整数 $3$，但排除 $4$。
      source_ref: page_0295_ex02_solution_start
    - step_id: step_5
      statement: 第(3)问先确定 $F$ 的形状和极值点。
      formula_trace:
        from: $F(x)=x^2-a\ln x$
        to: $a>0,\quad x_0=\sqrt{\frac a2},\quad a>2e$
        operation: 求导判先减后增，并用最小值为负保证两个零点。
        why: 两个零点分别在极小点两侧。
      source_ref: page_0295_ex02_solution_start
    - step_id: step_6
      statement: 用比值 $t=x_2/x_1$ 消掉 $x_1,x_2$ 的零点方程。
      formula_trace:
        from: $x_1^2=a\ln x_1,\quad x_2^2=a\ln x_2,\quad t=\frac{x_2}{x_1}$
        to: $x_1^2=\frac{a\ln t}{t^2-1}$
        operation: 两零点方程相减。
        why: 把两个零点的关系压成一个变量 $t>1$。
      source_ref: page_0296_ex02_solution_end
    - step_id: step_7
      statement: 把目标不等式化成只含 $t$ 的函数。
      formula_trace:
        from: $x_1+3x_2>4x_0$
        to: $(3t+1)^2\ln t-8t^2+8>0$
        operation: 代入 $x_2=tx_1$ 与 $x_1^2=\frac{a\ln t}{t^2-1}$。
        why: 这样可以只用 $t>1$ 的单调性完成证明。
      source_ref: page_0296_ex02_solution_end
    - step_id: step_8
      statement: 法二用割线斜率给更短证明。
      formula_trace:
        from: $\frac{(x_2-x_1)(x_2+x_1)}{\ln x_2-\ln x_1}=a$
        to: $x_1+x_2>\sqrt{2a}=2x_0$
        operation: 用对数函数斜率估计。
        why: 一旦 $x_1+x_2>2x_0$，就有 $x_1+3x_2>2(x_1+x_2)>4x_0$。
      source_ref: page_0296_ex02_solution_end
teaching_card:
  student_title: 最大整数解后接零点偏移
  what_it_trains: 训练同一题里先处理最大整数解，再用两个零点方程证明极值点偏移不等式。
  recognition_cues:
    - 第(2)问问最大整数解，右侧函数最小值只需定位在 $(3,4)$。
    - 第(3)问两个零点在唯一极值点两侧。
    - $F(x)=x^2-a\ln x$ 的两个零点方程可以相减。
    - 目标 $x_1+3x_2>4x_0$ 带明显偏移权重。
  normalization_moves:
    - 先求切线，不让第(1)问干扰后两问主线。
    - 第(2)问化成 $a<h(x)$。
    - 第(3)问先确定 $x_0=\sqrt{a/2}$。
    - 用 $t=x_2/x_1$ 或割线斜率处理两个零点。
  common_failures:
    - 第(2)问因为 $x_0$ 求不出来就卡住，其实只要 $x_0\in(3,4)$。
    - 把严格不等式误读成不能取 $a=3$。
    - 第(3)问不先判断 $a>0$ 和两个零点的位置。
    - 零点方程相减时忘记 $\ln x_2-\ln x_1=\ln t$。
  similar_practice_query: 二次对数 切线 最大整数解 x^2-a ln x 两零点 极值点偏移 x1+3x2>4x0
