original_problem:
  stem: "（江苏省卓越高中联盟 2024-2025 学年高三上学期 12 月月考 T12）已知直线 l: x-y+b=0 分别与曲线 y=e^{x+1}，y=-x^2+mx (m>0) 都相切，则 b-2m 的值为______。"
  parts: *a1
  choices: []
  answer: -4\sqrt{2}
  fidelity_notes: []
solution:
  source_solution_summary: 因为 l 的斜率为 1，先让 y=e^{x+1} 的切线斜率等于 1，得切点 x=-1， 从而切线为 y=x+2，所以 b=2。再让直线 y=x+2 与抛物线 y=-x^2+mx 相切， 方程 -x^2+mx=x+2 有重根，判别式为 0，结合 m>0 得 m=1+2\sqrt{2}， 最后 b-2m=-4\sqrt{2}。
  key_steps:
    - step_id: step_1
      statement: "由直线 l: x-y+b=0 看出切线斜率固定为 1。"
      formula_trace:
        from: x-y+b=0
        to: y=x+b,\quad k=1
        operation: 改写直线方程，读出斜率。
        why: 两条曲线都必须有一条斜率为 1 的切线。
      source_ref: page_0046_solution
    - step_id: step_2
      statement: 用指数曲线的切点确定 b。
      formula_trace:
        from: (e^{x+1})'=e^{x+1}=1
        to: x=-1,\quad y=e^0=1,\quad 1=-1+b,\quad b=2
        operation: 令切点处导数等于直线斜率，再代入 y=x+b。
        why: 指数曲线处的切线就是题设中的同一条直线。
      source_ref: page_0046_solution
    - step_id: step_3
      statement: 把与抛物线相切转化为二次方程有重根。
      formula_trace:
        from: -x^2+mx=x+2
        to: x^2+(1-m)x+2=0,\quad \Delta=(1-m)^2-8=0
        operation: 联立抛物线和直线，并令判别式为 0。
        why: 直线与抛物线相切时交点重合。
      source_ref: page_0046_solution
    - step_id: step_4
      statement: 结合 m>0 取正的参数值并计算目标量。
      formula_trace:
        from: (1-m)^2=8,\quad b=2
        to: m=1+2\sqrt{2},\quad b-2m=-4\sqrt{2}
        operation: 解判别式方程，舍去 m=1-2\sqrt{2}<0。
        why: 题设要求 m>0，目标量只需代回 b-2m。
      source_ref: page_0046_solution
teaching_card:
  student_title: 先用指数切点定直线，再让抛物线判别式为零
  what_it_trains: 训练把“同一条直线同时相切”拆成固定斜率、确定直线、再用重根条件求参数。
  recognition_cues:
    - 题干给出一条斜率已知的直线。
    - 同时切指数曲线和二次曲线。
    - 二次曲线相切可以联立后看判别式。
  normalization_moves:
    - 先把直线写成 y=x+b。
    - 用 e^{x+1}=1 找指数切点。
    - 联立抛物线并令 \Delta=0。
  common_failures:
    - 忘记 l 的斜率已经固定为 1。
    - 解出 m=1\pm2\sqrt{2} 后没有用 m>0 舍根。
    - 把 b-2m 误算成 2m-b。
  similar_practice_query: 已知直线同时与指数曲线和抛物线相切，先求切线再用判别式
