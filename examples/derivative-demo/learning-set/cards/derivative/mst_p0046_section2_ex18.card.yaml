stem: "（江苏省卓越高中联盟 2024-2025 学年高三上学期 12 月月考 T12）已知直线 l: x-y+b=0 分别与曲线 y=e^{x+1}，y=-x^2+mx (m>0) 都相切，则 b-2m 的值为______。"
answer: |-
  -4\sqrt{2}

  因为 l 的斜率为 1，先让 y=e^{x+1} 的切线斜率等于 1，得切点 x=-1， 从而切线为 y=x+2，所以 b=2。再让直线 y=x+2 与抛物线 y=-x^2+mx 相切， 方程 -x^2+mx=x+2 有重根，判别式为 0，结合 m>0 得 m=1+2\sqrt{2}， 最后 b-2m=-4\sqrt{2}。
