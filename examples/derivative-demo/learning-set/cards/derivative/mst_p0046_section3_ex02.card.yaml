stem: （河南省部分省示范高中 2024 届高三下学期 3 月联考 T19）已知函数 f(x)=\frac{\ln(x-1)}{x-2}。当 a\in(2,+\infty) 时，求函数 g(x)=f(x+1)-\frac{a}{x+1} 的零点个数。
answer: |-
  2 个。

  原零点方程可化为 H(x)=\ln x-\frac{a(x-1)}{x+1}=0。源解析利用 H(1/x)=-H(x) 与 H(1)=0，把零点关于 x=1 成倒数配对。对 x>1， H'(x)=\frac{(x+1)^2-2ax}{x(x+1)^2}；当 a>2 时，H 在 1 右侧先降后升， 且最小值小于 0，而 H(e^a)>0，所以 x>1 还有唯一一个零点；由倒数对称， (0,1) 中也有唯一一个零点。源解析再把 x=1 计入，得到 3 个零点； 但 x=1 不在原函数 g 的定义域内，是乘去 x-1 后产生的增根，因此最终按原函数计为 2 个零点。
