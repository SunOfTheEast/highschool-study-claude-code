  key_steps:
    - step_id: step_1
      statement: 对含 $x f^{\prime}(x)+f(x)-x f(x)$ 的结构做指数标准化。
      formula_trace:
        from: $x f^{\prime}(x)+f(x)<x f(x)$
        to: $g^{\prime}(x)=\\frac{f(x)+x f^{\prime}(x)-x f(x)}{e^x}<0$，$g(x)=\\frac{x f(x)}{e^x}$
        operation: 构造 $\\frac{x f(x)}{e^x}$ 并求导。
        why: 题设恰好对应该导数分子。
      source_ref: page_0132
    - step_id: step_2
      statement: 用奇函数条件锁定锚点 $x=-3$。
      formula_trace:
        from: $f(x-3)-\\frac1e$ 为奇函数
        to: $f(-3)=\\frac1e$，进而 $g(-3)=-3e^2$
        operation: 代 $x=0$ 得奇函数过原点，再代入 $g$。
        why: 为单调比较提供确切参照值。
      source_ref: page_0132
    - step_id: step_3
      statement: 把原不等式改写成 $g(x)$ 与 $g(-3)$ 的大小比较。
      formula_trace:
        from: $x f(x)+3e^{x+2}>0$
        to: $g(x)>-3e^2=g(-3)$
        operation: 提取 $e^x$ 并代入 $g$ 定义。
        why: 递减函数比较可直接还原到 $x$ 的区间。
      source_ref: page_0132
    - step_id: step_4
      statement: 由递减性得到解集方向。
      formula_trace:
        from: $g(x)>g(-3)$，$g$递减
        to: $x<-3$
        operation: 递减函数中函数值大对应自变量小。
        why: 确定唯一正确选项 B。
      source_ref: page_0132
