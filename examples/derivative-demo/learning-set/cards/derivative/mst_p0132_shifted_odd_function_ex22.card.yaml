    所以 $g(x)$ 在 $\mathbf{R}$ 上单调递减。

    又因
    \[
    y=f(x-3)-\frac1e
    \]
    是奇函数，代 $x=0$ 得
    \[
    f(-3)-\frac1e=0 \Rightarrow f(-3)=\frac1e.
    \]
    因此
    \[
    g(-3)=\frac{-3f(-3)}{e^{-3}}=\frac{-3\cdot \frac1e}{e^{-3}}=-3e^2.
    \]

    原不等式
    \[
    x f(x)+3e^{x+2}>0
    \]
    等价于
    \[
