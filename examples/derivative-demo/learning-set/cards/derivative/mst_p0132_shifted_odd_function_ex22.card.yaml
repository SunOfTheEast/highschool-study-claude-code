stem: |-
  （2023·徐州月考）已知定义在 $\mathbf{R}$ 上的可导函数 $f(x)$ 满足 $x f^{\prime}(x)+f(x)<x f(x)$，若 $y=f(x-3)-\frac{1}{e}$ 是奇函数，则不等式 $x f(x)+3e^{x+2}>0$ 的解集是（  ）
  A. $(-\infty,-2)$
  B. $(-\infty,-3)$
  C. $(-2,+\infty)$
  D. $(-3,+\infty)$
answer: |
  B

  设
  \[
  g(x)=\frac{x f(x)}{e^x},
  \]
  则
  \[
  g^{\prime}(x)=\frac{f(x)+x f^{\prime}(x)-x f(x)}{e^x}<0,
  \]
  所以 $g(x)$ 在 $\mathbf{R}$ 上单调递减。

  又因
  \[
  y=f(x-3)-\frac1e
  \]
  是奇函数，代 $x=0$ 得
  \[
  f(-3)-\frac1e=0 \Rightarrow f(-3)=\frac1e.
  \]
  因此
  \[
  g(-3)=\frac{-3f(-3)}{e^{-3}}=\frac{-3\cdot \frac1e}{e^{-3}}=-3e^2.
  \]

  原不等式
  \[
  x f(x)+3e^{x+2}>0
  \]
  等价于
  \[
  e^x g(x)+3e^{x+2}>0 \Rightarrow g(x)>-3e^2=g(-3).
  \]
  由于 $g$ 递减，$g(x)>g(-3)$ 当且仅当 $x<-3$。
  故解集为 $(-\infty,-3)$，选 B。
