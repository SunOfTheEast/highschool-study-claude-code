stem: |-
  （2025 · 内乡实验高级中学二模 T8）已知 $a>0$，$b\in\mathbf{R}$，若关于 $x$ 的不等式 $(ax-1)(x^2+bx-1)\geqslant0$ 在 $(0,+\infty)$ 上恒成立，则 $b+\frac{5}{a}$ 的最小值是（  ）
  A. 4
  B. 4\sqrt{2}
  C. 8
  D. 8\sqrt{2}
answer: |-
  A

  与例32同理，先由 $ax-1=0$ 得正零点 $x=\frac{1}{a}$，再按共零点关系令其也满足 $x^2+bx-1=0$，得到 $\frac{1}{a^2}+\frac{b}{a}-1=0$，即 $b=a-\frac{1}{a}$。代入目标：$b+\frac{5}{a}=a+\frac{4}{a}\ge2\sqrt{4}=4$。当 $a=2$ 时取等，此时 $b=2-\frac{1}{2}=\frac{3}{2}$，故最小值为 $4$，选 A。
