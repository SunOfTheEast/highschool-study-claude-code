solution:
  source_solution_summary: 与例32同理，先由 $ax-1=0$ 得正零点 $x=\frac{1}{a}$，再按共零点关系令其也满足 $x^2+bx-1=0$，得到 $\frac{1}{a^2}+\frac{b}{a}-1=0$，即 $b=a-\frac{1}{a}$。代入目标：$b+\frac{5}{a}=a+\frac{4}{a}\ge2\sqrt{4}=4$。当 $a=2$ 时取等，此时 $b=2-\frac{1}{2}=\frac{3}{2}$，故最小值为 $4$，选 A。
  key_steps:
    - step_id: step_1
      statement: 抓住显式零点 $x=\frac{1}{a}$。
      formula_trace:
        from: $ax-1=0,\ a>0$
        to: $x=\frac{1}{a}\in(0,+\infty)$
        operation: 解方程并判断区间位置。
        why: 为共零点代入做准备。
      source_ref: page_0178_ex33_solution
    - step_id: step_2
      statement: 代入二次因子得到参数关系。
      formula_trace:
        from: $x^2+bx-1=0$
        to: $\frac{1}{a^2}+\frac{b}{a}-1=0$
        operation: 令 $x=\frac{1}{a}$ 并整理。
        why: 把 $(a,b)$ 绑定到一条等式。
      source_ref: page_0178_ex33_solution
    - step_id: step_3
      statement: 消元后重写目标式。
      formula_trace:
        from: $\frac{1}{a^2}+\frac{b}{a}-1=0$
        to: $b=a-\frac{1}{a},\quad b+\frac{5}{a}=a+\frac{4}{a}$
        operation: 先解 $b$ 再回代。
        why: 把最值问题转为标准一元形式。
      source_ref: page_0178_ex33_solution
    - step_id: step_4
      statement: 应用基本不等式并给出取等点。
      formula_trace:
        from: $a+\frac{4}{a},\ a>0$
        to: $a+\frac{4}{a}\ge4$
        operation: 应用 $u+\frac{c}{u}\ge2\sqrt{c}$。
        why: 直接得到最小值和答案。
      source_ref: page_0178_ex33_solution
