original_problem:
  stem: 已知函数 $f(x)=a e^x-x-a$，当 $a\geqslant 1$ 时，证明 $f(x)>x(\ln x-1)-\cos x$。
  parts: *a1
  choices: []
  answer: 对任意 $x>0$，结论成立。
  fidelity_notes:
    - 源题未单写定义域，但右端含 $\ln x$，故按题意默认比较区间为 $x>0$。
    - 题面与解析同页完整，无跨页补题。
solution:
  source_solution_summary: |
    由 $a\ge 1$ 先降阶：$a e^x-x-a\ge e^x-x-1$，故只需证 $e^x-1-x\ln x+\cos x>0$。按源解拆成 $(e^x-x^2-1)+(x^2-x-x\ln x)+(x+\cos x)$。 三段分别用导数或经典对数不等式证明：第一段在 $x>0$ 上严格正， 第二段非负（$x=1$ 取等），第三段在 $x\ge0$ 递增且大于 0。 三段相加即得目标不等式成立。
  key_steps:
    - step_id: step_1
      statement: 由参数条件先把 $a$ 消去到最小情形。
      formula_trace:
        from: $f(x)=a e^x-x-a,\ a\ge1$
        to: $f(x)\ge e^x-x-1$，故只需证 $e^x-1-x\ln x+\cos x>0$
        operation: 用 $a\ge1$ 对 $a(e^x-1)$ 做下界替换并移项。
        why: 把参数不等式化为无参目标。
      source_ref: page_0203_ex06_solution
    - step_id: step_2
      statement: 按源解拆分目标式。
      formula_trace:
        from: $e^x-1-x\ln x+\cos x$
        to: $(e^x-x^2-1)+(x^2-x-x\ln x)+(x+\cos x)$
        operation: 加减同一个 $x^2$ 与 $x$。
        why: 把目标分成“指数段 + 指对段 + 三角线性段”三块。
      source_ref: page_0203_ex06_solution
    - step_id: step_3
      statement: 证明第一段 $e^x-x^2-1>0\ (x>0)$。
      formula_trace:
        from: $P(x)=e^x-x^2-1$
        to: $P^{\prime}(x)=e^x-2x>0,\ P(0)=0\Rightarrow P(x)>0\ (x>0)$
        operation: 先由 $e^x>1+x+\frac{x^2}{2}>2x$ 得 $P^{\prime}(x)>0$，再用单调性。
        why: 第一段需要严格正，提供主正量。
      source_ref: page_0203_ex06_solution
    - step_id: step_4
      statement: 证明第二段 $x^2-x-x\ln x\ge0\ (x>0)$。
      formula_trace:
        from: $x^2-x-x\ln x=x(x-1-\ln x)$
        to: $x-1-\ln x\ge0\Rightarrow x^2-x-x\ln x\ge0$
        operation: 设 $\phi(x)=x-1-\ln x$，$\phi^{\prime}(x)=1-\frac1x$，在 $x=1$ 处取最小值 0。
        why: 这是源解提示中的第二条基础不等式。
      source_ref: page_0203_ex06_solution
    - step_id: step_5
      statement: 证明第三段 $x+\cos x>0\ (x>0)$。
      formula_trace:
        from: $R(x)=x+\cos x$
        to: $R^{\prime}(x)=1-\sin x\ge0,\ R(0)=1\Rightarrow R(x)\ge1>0$
        operation: 导数判单调。
        why: 给出最后一段的显式正性。
      source_ref: page_0203_ex06_solution
    - step_id: step_6
      statement: 三段相加得到原命题。
      formula_trace:
        from: step_3、step_4、step_5
        to: $e^x-1-x\ln x+\cos x>0\Rightarrow f(x)>x(\ln x-1)-\cos x$
        operation: 逐段合并并回代 step_1 的等价变形。
        why: 完成证明闭环。
      source_ref: page_0203_ex06_solution
teaching_card:
  student_title: 三段分拆证明指对三角不等式
  what_it_trains: 训练把混合型不等式拆成可独立判号的三段，并把参数条件先降成无参数核心。
  recognition_cues:
    - 出现 $a e^x$ 与 $x\ln x,\ \cos x$ 的同题比较。
    - 题干给出参数下界 $a\ge1$。
    - 目标可以通过加减同项拆成多段。
  normalization_moves:
    - 先把 $a e^x-a$ 压到 $e^x-1$。
    - 对核心式做 $x^2,\ x$ 的配凑分拆。
    - 每段单独证明后求和。
  common_failures:
    - 只写“显然大于0”而不逐段证明。
    - 把 $\ln x\le x-1$ 用错方向导致第二段符号颠倒。
    - 忽略 $\ln x$ 的定义域，未说明比较区间是 $x>0$。
  similar_practice_query: a>=1 指数对数三角 不等式 三段分拆 导数判正
