solution:
  source_solution_summary: |
    设
    \[
    F(x)=\ln x\cdot f(x)\quad (x>0),
    \]
    则
    \[
    F^{\prime}(x)=\frac{1}{x}f(x)+\ln x\cdot f^{\prime}(x)<0.
    \]
    所以 $F$ 在 $(0,+\infty)$ 上递减，且 $F(1)=0$。
    因此：当 $x>1$ 时，$F(x)<0$ 且 $\ln x>0$，故 $f(x)<0$；
    当 $0<x<1$ 时，$F(x)>0$ 且 $\ln x<0$，仍有 $f(x)<0$。
    综上 $x>0$ 时 $f(x)<0$。又 $f$ 为奇函数，故 $f(0)=0$ 且 $x<0$ 时 $f(x)>0$。
    现在解 $(x-2)f(x)>0$：
    - $x<0$ 时，$(x-2)<0,f(x)>0$，乘积<0；
    - $0<x<2$ 时，$(x-2)<0,f(x)<0$，乘积>0；
    - $x>2$ 时，$(x-2)>0,f(x)<0$，乘积<0。
    故解集为 $(0,2)$，选 B。
  key_steps:
    - step_id: step_1
      statement: 把题设不等式识别为对数乘积导数构造。
      formula_trace:
        from: $\ln x\cdot f^{\prime}(x)+\frac{1}{x}f(x)<0$
        to: $F^{\prime}(x)<0$（$F(x)=\ln x\cdot f(x)$）
        operation: 定义 $F$ 并直接求导。
        why: 把条件转化为单调递减。
      source_ref: page_0130
    - step_id: step_2
      statement: 由 F(1)=0 与 ln x 符号判定 x>0 时 f(x) 的符号。
      formula_trace:
        from: $F$ 递减且 $F(1)=0$
        to: $x>0\Rightarrow f(x)<0$
        operation: 分 $x>1$ 与 $0<x<1$ 两段结合 $\ln x$ 正负判断。
        why: 为后续乘积不等式提供判号。
      source_ref: page_0130
    - step_id: step_3
      statement: 结合奇函数性质完成全实数判号。
      formula_trace:
        from: $f$ 为奇函数
        to: $x<0\Rightarrow f(x)>0$，$f(0)=0$
        operation: 使用 $f(-x)=-f(x)$。
        why: 补齐 $x<0$ 区间信息。
      source_ref: page_0130
    - step_id: step_4
      statement: 分区间解 $(x-2)f(x)>0$。
      formula_trace:
        from: $f(x)$ 在三段区间的符号
        to: $(x-2)f(x)>0\Rightarrow 0<x<2$
        operation: 按 $x<0,0<x<2,x>2$ 逐段判乘积符号。
        why: 对应选项 B（结论句续于 page_0131）。
      source_ref: page_0131
teaching_card:
  student_title: 先锁定 f 的符号，再解 $(x-2)f(x)>0$
  what_it_trains: 训练“导数构造判单调 + 奇偶性补全 + 区间判号”三步联动。
  recognition_cues:
    - 题设出现 $\ln x\cdot f^{\prime}(x)+\frac{1}{x}f(x)$。
    - 已给奇函数信息，通常用于把半轴结论扩展到全轴。
    - 目标是乘积不等式，最终要做分区间判号。
  normalization_moves:
    - 设 $F=\ln x\cdot f(x)$ 并判 $F^{\prime}<0$。
    - 用 $F(1)=0$ 判断 $x>0$ 时 $f(x)<0$。
    - 借奇函数得 $x<0$ 时 $f(x)>0$。
    - 分段解 $(x-2)f(x)>0$。
  common_failures:
    - 把“$F$ 递减”误读成“$f$ 递减”。
    - 在 $0<x<1$ 忽略 $\ln x<0$ 导致 f 的符号判反。
    - 把奇函数条件当成偶函数使用。
    - 错误把 $x=0$、$x=2$ 包进严格不等式解集。
  similar_practice_query: 奇函数 lnx f^{\prime}(x)+f(x)/x 判号 乘积不等式 解集
