original_problem:
  stem: （24-25 高二下 · 江苏盐城 · 期中）函数 $f(x)=x+a\ln x$，$a\in\mathbf R$。当 $x\ge1$ 时，不等式 $f(x)\ge(1+\ln x)^2$ 恒成立，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\ge4-e$。
  fidelity_notes:
    - 求参题，无选项、无分问。
    - source 的变量名混用按 $t=\ln x$ 统一修正。
solution:
  source_solution_summary: 令 $t=\ln x\ge0$，则 $x=e^t$，原不等式变为 $e^t+at\ge(1+t)^2$。当 $t=0$ 时自动成立；当 $t>0$ 时， 等价于 $2-a\le \frac{e^t}{t}-t-\frac1t$。令 $h(t)=\frac{e^t}{t}-t-\frac1t$，则 $h^\prime(t)=\frac{e^t(t-1)+1-t^2}{t^2}$。设 $k(t)=e^t(t-1)+1-t^2$，$k^\prime(t)=t(e^t-2)$， 可知 $k$ 先减后增，且 $k(0)=k(1)=0$，所以 $0<t<1$ 时 $h^\prime(t)<0$，$t>1$ 时 $h^\prime(t)>0$。 因此 $h(t)\ge h(1)=e-2$，从而 $2-a\le e-2$，即 $a\ge4-e$。
  key_steps:
    - step_id: step_1
      statement: 用 $t=\ln x$ 标准化自变量。
      formula_trace:
        from: $x\ge1$，$f(x)=x+a\ln x$
        to: $t=\ln x\ge0$，$e^t+at\ge(1+t)^2$
        operation: 令 $t=\ln x$。
        why: 把 $x$ 与 $\ln x$ 的混合结构变成 $e^t$ 与多项式结构。
      source_ref: page_0259_ex7_solution
    - step_id: step_2
      statement: 分开处理 $t=0$ 与 $t>0$。
      formula_trace:
        from: $e^t+at\ge(1+t)^2$
        to: $t=0$ 自动成立；$t>0$ 时可除以 $t$
        operation: 单独处理端点。
        why: 参变分离需要除以 $t$，不能把 $t=0$ 混进去。
      source_ref: page_0259_ex7_solution
    - step_id: step_3
      statement: 对 $t>0$ 参变分离。
      formula_trace:
        from: $e^t+at\ge(1+t)^2$
        to: $2-a\le h(t)=\frac{e^t}{t}-t-\frac1t$
        operation: 移项并除以 $t>0$。
        why: 求 $a$ 的下界转成求 $h$ 的最小值。
      source_ref: page_0259_ex7_solution
    - step_id: step_4
      statement: 求 $h^\prime$ 并设辅助分子。
      formula_trace:
        from: $h(t)=\frac{e^t}{t}-t-\frac1t$
        to: $h^\prime(t)=\frac{k(t)}{t^2}$，$k(t)=e^t(t-1)+1-t^2$
        operation: 求导并把分子单独设为 $k(t)$。
        why: $t^2>0$，$h^\prime$ 的符号由 $k$ 决定。
      source_ref: page_0259_ex7_solution
    - step_id: step_5
      statement: 用 $k(t)$ 判 $h$ 的最小值。
      formula_trace:
        from: $k^\prime(t)=t(e^t-2)$，$k(0)=k(1)=0$
        to: $h$ 在 $(0,1)$ 递减，在 $(1,+\infty)$ 递增
        operation: 先判 $k$ 的符号，再判 $h^\prime$。
        why: 得到 $h$ 的最小点 $t=1$。
      source_ref: page_0259_ex7_solution
    - step_id: step_6
      statement: 代入 $t=1$ 得参数范围。
      formula_trace:
        from: $h(t)\ge h(1)=e-2$
        to: $2-a\le e-2\Rightarrow a\ge4-e$
        operation: 取右侧最小值。
        why: 完成恒成立条件。
      source_ref: page_0259_ex7_solution
teaching_card:
  student_title: 把 $\ln x$ 换成 $t$，再分离参数
  what_it_trains: 训练对数恒成立题的标准化：先把 $\ln x$ 变成新变量，再把参数从不等式里分离出来。
  recognition_cues:
    - 题目同时出现 $x$ 和 $\ln x$，且 $x\ge1$。
    - 右侧是 $(1+\ln x)^2$，提示令 $t=\ln x$。
    - 端点 $t=0$ 自动成立，但真正限制来自 $t>0$。
  normalization_moves:
    - 先令 $t=\ln x$，不要直接对原式硬求导。
    - 处理 $t=0$ 后再除以 $t$。
    - 分离后找 $h(t)$ 的最小值，因为左边是 $2-a$。
  common_failures:
    - 忘记 $t=0$ 不能除，直接把端点丢掉。
    - 把 $h$ 的最小值方向看反，导致 $a$ 范围写错。
    - 变量从 $x$ 换成 $t$ 后又混用，判区间时出错。
  similar_practice_query: lnx换元 t=lnx x+a ln x 参数范围 端点效应失效 h最小值
