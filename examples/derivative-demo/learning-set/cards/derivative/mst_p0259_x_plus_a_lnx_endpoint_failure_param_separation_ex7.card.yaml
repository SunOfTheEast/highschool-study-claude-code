stem: （24-25 高二下 · 江苏盐城 · 期中）函数 $f(x)=x+a\ln x$，$a\in\mathbf R$。当 $x\ge1$ 时，不等式 $f(x)\ge(1+\ln x)^2$ 恒成立，求 $a$ 的取值范围。
answer: |-
  $a\ge4-e$。

  令 $t=\ln x\ge0$，则 $x=e^t$，原不等式变为 $e^t+at\ge(1+t)^2$。当 $t=0$ 时自动成立；当 $t>0$ 时， 等价于 $2-a\le \frac{e^t}{t}-t-\frac1t$。令 $h(t)=\frac{e^t}{t}-t-\frac1t$，则 $h^\prime(t)=\frac{e^t(t-1)+1-t^2}{t^2}$。设 $k(t)=e^t(t-1)+1-t^2$，$k^\prime(t)=t(e^t-2)$， 可知 $k$ 先减后增，且 $k(0)=k(1)=0$，所以 $0<t<1$ 时 $h^\prime(t)<0$，$t>1$ 时 $h^\prime(t)>0$。 因此 $h(t)\ge h(1)=e-2$，从而 $2-a\le e-2$，即 $a\ge4-e$。
