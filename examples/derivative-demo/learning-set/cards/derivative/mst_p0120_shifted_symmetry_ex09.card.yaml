stem: |-
  （2024 · 浙江月考 · 多选）已知连续函数 $f(x)$ 及其导函数 $f'(x)$ 的定义域均为 $\mathbf{R}$，记 $g(x)=f'(x)$，若 $g'\left(\frac{3}{2}-\frac{2}{3}x\right)$ 为奇函数，$f\left(\frac{3}{4}+2x\right)-2x$ 的图象关于 $y$ 轴对称，则（  ）
  A. $g'(3)=0$
  B. $g\left(\frac{3}{4}\right)=g'\left(\frac{3}{2}\right)$
  C. $g'(x)$ 在 $(0,4)$ 上至少有 2 个零点
  D. $\sum_{k=1}^{2024}\left[g\left(\frac{3}{4}k\right)+g'\left(\frac{3}{4}k\right)\right]=3036$
answer: |
  AC

  由 $f(\frac34+2x)-2x$ 关于 $y$ 轴对称，可写成
  $f(\frac34+x)-x=f(\frac34-x)+x$，求导得
  \[
    f'\!\left(\frac34+x\right)+f'\!\left(\frac34-x\right)=2.
  \]
  即 $g(x)=f'(x)$ 关于点 $(\frac34,1)$ 中心对称，故
  $g'$ 关于直线 $x=\frac34$ 轴对称。
  又由 $g'(\frac32-\frac23x)$ 为奇函数，可得
  $g'$ 关于点 $(\frac32,0)$ 中心对称，进而 $g$ 关于
  $x=\frac32$ 轴对称。两类对称叠加得到 $g,g'$ 的周期均为 $3$。
  于是 $g'(0)=g'(\frac32)=g'(3)=0$，A 正确；且
  $g(\frac34)=1\ne0=g'(\frac32)$，B 错。
  由 $g'$ 在 $(0,4)$ 内至少有 $\frac32,3$ 两个零点，C 正确。
  另由周期与对称可得
  $\sum_{k=1}^{2024}g'(\frac34k)=0$、
  $g(\frac34k)=1$，故总和为 $2024\ne3036$，D 错。
  故选 AC。
