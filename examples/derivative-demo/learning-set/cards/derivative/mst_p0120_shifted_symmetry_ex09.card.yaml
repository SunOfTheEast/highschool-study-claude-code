solution:
  source_solution_summary: |
    由 $f(\frac34+2x)-2x$ 关于 $y$ 轴对称，可写成
    $f(\frac34+x)-x=f(\frac34-x)+x$，求导得
    \[
      f'\!\left(\frac34+x\right)+f'\!\left(\frac34-x\right)=2.
    \]
    即 $g(x)=f'(x)$ 关于点 $(\frac34,1)$ 中心对称，故
    $g'$ 关于直线 $x=\frac34$ 轴对称。
    又由 $g'(\frac32-\frac23x)$ 为奇函数，可得
    $g'$ 关于点 $(\frac32,0)$ 中心对称，进而 $g$ 关于
    $x=\frac32$ 轴对称。两类对称叠加得到 $g,g'$ 的周期均为 $3$。
    于是 $g'(0)=g'(\frac32)=g'(3)=0$，A 正确；且
    $g(\frac34)=1\ne0=g'(\frac32)$，B 错。
    由 $g'$ 在 $(0,4)$ 内至少有 $\frac32,3$ 两个零点，C 正确。
    另由周期与对称可得
    $\sum_{k=1}^{2024}g'(\frac34k)=0$、
    $g(\frac34k)=1$，故总和为 $2024\ne3036$，D 错。
    故选 AC。
  key_steps:
    - step_id: step_1
      statement: 先把复合对称条件转成 $g$ 的中心对称。
      formula_trace:
        from: |
          $f\!\left(\frac34+2x\right)-2x\text{ 关于 }y\text{ 轴对称}$
        to: |
          $f'\!\left(\frac34+x\right)+f'\!\left(\frac34-x\right)=2$
        operation: 先把变量缩放统一为 $\frac34\pm x$，再求导。
        why: 和为常数的形式直接对应 $g$ 关于 $(\frac34,1)$ 中心对称。
      source_ref: page_0120
    - step_id: step_2
      statement: 由奇函数复合条件确定 $g'$ 的另一种对称。
      formula_trace:
        from: $g'\!\left(\frac32-\frac23x\right)\text{ 为奇函数}$
        to: $g'\text{ 关于点 }\left(\frac32,0\right)\text{ 中心对称}$
        operation: 将线性自变量变换为对称点坐标形式。
        why: 该结论与 step_1 的轴对称联立后可推出周期。
      source_ref: page_0120
    - step_id: step_3
      statement: 联立两种对称得到零点与 A、B、C。
      formula_trace:
        from: |
          $g''\text{ 关于 }x=\frac34\text{ 轴对称，且关于 }\left(\frac32,0\right)\text{ 中心对称}$
        to: |
          $T=3,\quad g'\!\left(\frac32\right)=0,\quad g'(0)=g'(3)=0$
        operation: 对称叠加得到周期与基准零点，再平移到目标点。
        why: 可直接判断 A 正确、B 错误，并支持 C 的“至少两个零点”。
      source_ref: page_0120
    - step_id: step_4
      statement: 计算等差采样和，判断 D。
      formula_trace:
        from: |
          $g\!\left(\frac34\right)=1,\quad T=3,\quad g'\!\left(\frac34\right)=t,\ g'\!\left(\frac94\right)=-t,\ g'(3)=0$
        to: |
          $\sum_{k=1}^{2024}g'\!\left(\frac34k\right)=0,\quad
          \sum_{k=1}^{2024}\left[g\!\left(\frac34k\right)+g'\!\left(\frac34k\right)\right]=2024$
        operation: 按一个对称周期内的符号配对求和。
        why: 与选项 D 的 3036 不符，故 D 错。
      source_ref: page_0120
teaching_card:
  student_title: 双对称锁周期：多选题里的快判模板
  what_it_trains: 训练把复合对称条件还原为函数图像对称，再用“轴 + 中心”迅速判断零点、周期和离散求和。
  recognition_cues:
    - 题干同时给 $f(\frac34+2x)-2x$ 的轴对称和 $g'(\cdot)$ 的奇性。
    - 选项包含导数零点、离散求和，典型依赖周期与对称。
    - 出现 $\frac34,\frac32$ 这类成倍中心点，常可配出固定周期。
  normalization_moves:
    - 先写出对称等式，再求导。
    - 把 $g'(\frac32-\frac23x)$ 奇性转成 $g'$ 的中心对称。
    - 由两种对称读出 $T=3$ 与关键零点。
    - 将求和按对称周期配对消去。
  common_failures:
    - 把“奇函数复合”误当 $g'$ 本身奇函数，中心点写错到原点。
    - 只用一个对称就下结论，遗漏周期信息。
    - 把 C 项中的 $g'$ 错看成 $g$。
    - 求和时未拆分 $g$ 与 $g'$ 两部分，导致 D 误判。
  similar_practice_query: 抽象函数 多选 对称配凑 周期 复合自变量 离散求和
