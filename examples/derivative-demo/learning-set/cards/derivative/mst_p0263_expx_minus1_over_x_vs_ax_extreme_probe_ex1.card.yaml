original_problem:
  stem: （2024 · 武汉四调节选）已知函数 $f(x)=\frac{e^x-1}{x}$。若 $f(x)>a^x$，其中 $a>0$ 且 $a\ne1$，求实数 $a$ 的值。
  parts: *a1
  choices: []
  answer: $a=\sqrt e$。
  fidelity_notes:
    - 求值题，无选项、无分问。
    - 函数 $f$ 在 $x=0$ 处未定义，source 使用 $x\to0$ 的极点效应。
solution:
  source_solution_summary: 令 $g(x)=\frac{e^x-1}{x}-a^x$。由于 $x\to0$ 时两边都趋近 $1$，要让严格不等式在 0 的两侧都成立，接触点的一阶项必须相等。 展开或按 source 的洛必达路线可得 $\lim_{x\to0}g^\prime(x)=\frac12-\ln a=0$，所以 $a=\sqrt e$。充分性可直接验证：当 $a=\sqrt e$ 时， $\frac{e^x-1}{x}>e^{x/2}$ 等价于 $\frac{2\sinh(x/2)}{x}>1$，对 $x\ne0$ 恒成立。
  key_steps:
    - step_id: step_1
      statement: 构造差函数并看 0 附近的接触。
      formula_trace:
        from: $\frac{e^x-1}{x}>a^x$
        to: $g(x)=\frac{e^x-1}{x}-a^x$，且 $x\to0$ 时 $g(x)\to0$
        operation: 移项构造差函数。
        why: 开区间极点效应先看接触点附近的一阶项。
      source_ref: page_0263_ex1_solution
    - step_id: step_2
      statement: 由极点效应确定参数。
      formula_trace:
        from: $\lim_{x\to0}g^\prime(x)=\frac12-\ln a$
        to: $\ln a=\frac12$，$a=\sqrt e$
        operation: 令极点处一阶项相等。
        why: 否则在 0 的一侧会穿破严格不等式。
      source_ref: page_0263_ex1_solution
    - step_id: step_3
      statement: 补全 $a=\sqrt e$ 的充分性。
      formula_trace:
        from: $\frac{e^x-1}{x}>e^{x/2}$
        to: $\frac{2\sinh(x/2)}{x}>1$
        operation: 同除 $e^{x/2}$ 并化成双曲正弦。
        why: $\sinh y/y>1$ 对 $y\ne0$ 成立，故严格不等式成立。
      source_ref: page_0263_ex1_solution
teaching_card:
  student_title: 开区间极点：让 0 附近的一阶项刚好贴住
  what_it_trains: 训练开区间极点效应：题目不让代 $x=0$，但两边都在 0 附近接触，参数由一阶项决定。
  recognition_cues:
    - $\frac{e^x-1}{x}$ 在 $x=0$ 没定义，但极限存在。
    - 右侧是 $a^x$，在 $x=0$ 附近也趋近 1。
    - 严格不等式要两侧都成立，必须一阶项刚好相等。
  normalization_moves:
    - 先构造差函数，不急着全局求导。
    - 用 $x\to0$ 锁出 $a=\sqrt e$。
    - 再补充分性证明，不能只停在必要条件。
  common_failures:
    - 把 $x=0$ 当作定义域内点直接代入。
    - 只得到 $a=\sqrt e$，没证明全体 $x\ne0$ 都成立。
    - 忽略严格不等式在 0 两侧的方向。
  similar_practice_query: 开区间极点 (e^x-1)/x a^x x趋于0 一阶项 sqrt(e)
