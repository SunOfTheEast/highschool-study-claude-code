stem: （2024 · 武汉四调节选）已知函数 $f(x)=\frac{e^x-1}{x}$。若 $f(x)>a^x$，其中 $a>0$ 且 $a\ne1$，求实数 $a$ 的值。
answer: |-
  $a=\sqrt e$。

  令 $g(x)=\frac{e^x-1}{x}-a^x$。由于 $x\to0$ 时两边都趋近 $1$，要让严格不等式在 0 的两侧都成立，接触点的一阶项必须相等。 展开或按 source 的洛必达路线可得 $\lim_{x\to0}g^\prime(x)=\frac12-\ln a=0$，所以 $a=\sqrt e$。充分性可直接验证：当 $a=\sqrt e$ 时， $\frac{e^x-1}{x}>e^{x/2}$ 等价于 $\frac{2\sinh(x/2)}{x}>1$，对 $x\ne0$ 恒成立。
