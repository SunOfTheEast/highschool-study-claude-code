stem: |-
  （2024·衡水月考）已知正数 $a,b,c\in(1,+\infty)$，满足 $\\frac{2a-1}{a-1}=2+\\log_2a$，$\\frac{3b-2}{b-1}=3+\\log_3b$，$\\frac{4c-3}{c-1}=4+\\log_4c$，则下列不等式成立的是（  ）
  A. $c<b<a$
  B. $a<b<c$
  C. $a<c<b$
  D. $c<a<b$
answer: |
  B

  先分别化简三式：
  \[
  \frac{2a-1}{a-1}=2+\log_2a
  \Rightarrow
  \frac1{a-1}=\log_2a,
  \]
  \[
  \frac{3b-2}{b-1}=3+\log_3b
  \Rightarrow
  \frac1{b-1}=\log_3b,
  \]
  \[
  \frac{4c-3}{c-1}=4+\log_4c
  \Rightarrow
  \frac1{c-1}=\log_4c.
  \]
  即 $a,b,c$ 分别是曲线
  \[
  y=\frac1{x-1}
  \]
  与
  \[
  y=\log_2x,\ y=\log_3x,\ y=\log_4x
  \]
  的交点横坐标。

  在 $x>1$ 上，$y=\frac1{x-1}$ 递减；且同一 $x$ 下
  \[
  \log_2x>\log_3x>\log_4x.
  \]
  底数越大，对数曲线越低，与递减双曲线的交点越靠右，所以
  \[
  a<b<c.
  \]
  故选 B。
