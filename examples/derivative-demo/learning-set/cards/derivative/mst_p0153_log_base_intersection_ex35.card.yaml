solution:
  source_solution_summary: |
    先分别化简三式：
    \[
    \frac{2a-1}{a-1}=2+\log_2a
    \Rightarrow
    \frac1{a-1}=\log_2a,
    \]
    \[
    \frac{3b-2}{b-1}=3+\log_3b
    \Rightarrow
    \frac1{b-1}=\log_3b,
    \]
    \[
    \frac{4c-3}{c-1}=4+\log_4c
    \Rightarrow
    \frac1{c-1}=\log_4c.
    \]
    即 $a,b,c$ 分别是曲线
    \[
    y=\frac1{x-1}
    \]
    与
    \[
    y=\log_2x,\ y=\log_3x,\ y=\log_4x
    \]
    的交点横坐标。

    在 $x>1$ 上，$y=\frac1{x-1}$ 递减；且同一 $x$ 下
    \[
    \log_2x>\log_3x>\log_4x.
    \]
    底数越大，对数曲线越低，与递减双曲线的交点越靠右，所以
    \[
    a<b<c.
    \]
    故选 B。
  key_steps:
    - step_id: step_1
      statement: 把三条分式条件统一为“倒数=对数”交点方程。
      formula_trace:
        from: $\\frac{2a-1}{a-1}=2+\\log_2a$ 等三式
        to: $\\frac1{a-1}=\\log_2a$，$\\frac1{b-1}=\\log_3b$，$\\frac1{c-1}=\\log_4c$
        operation: 移项并化简分式常数项。
        why: 将代数条件转成统一的图像交点模型。
      source_ref: page_0154_ex35_solution
    - step_id: step_2
      statement: 建立同一参考曲线下的三组交点。
      formula_trace:
        from: $\\frac1{x-1}=\\log_kx\\ (k=2,3,4)$
        to: $x$ 交点依次记为 $a,b,c$
        operation: 固定 $y=\\frac1{x-1}$，改变对数底数。
        why: 把问题转化为“哪条对数曲线交点更靠右”。
      source_ref: page_0154_ex35_solution
    - step_id: step_3
      statement: 由曲线相对高低判断交点横坐标顺序。
      formula_trace:
        from: $\\log_2x>\\log_3x>\\log_4x$（$x>1$）
        to: $a<b<c$
        operation: 递减双曲线下，曲线越低交点越靠右。
        why: 直接对应选项B。
      source_ref: page_0154_ex35_solution
teaching_card:
  student_title: 同参照曲线下比较不同底对数交点
  what_it_trains: 训练“代数方程先交点化，再用曲线相对位置判顺序”的数形结合路径。
  recognition_cues:
    - 多个式子都可整理成“分式 = 对数”。
    - 仅对数底数不同，结构高度统一。
    - 题目只问 $a,b,c$ 顺序。
  normalization_moves:
    - 先把每式化为 $\\frac1{x-1}=\\log_kx$。
    - 固定参考曲线 $y=\\frac1{x-1}$。
    - 按 $k=2,3,4$ 的曲线高低推交点左右。
  common_failures:
    - 把“底数越大，对数越小（$x>1$）”写反。
    - 没利用公共参照曲线，陷入逐项硬算。
    - 忽略题设 $a,b,c>1$ 带来的定义域限制。
  similar_practice_query: 1/(x-1)=log_k x 交点横坐标 比大小
