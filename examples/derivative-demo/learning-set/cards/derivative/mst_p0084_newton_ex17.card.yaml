stem: |-
  （2025 惠东县高二期中 T19）牛顿在《流数法》一书中给出了“牛顿切线法”求方程的近似解。具体步骤如下：设 $r$ 是函数 $y=f(x)$ 的一个零点，任意选取 $x_0$ 作为 $r$ 的初始近似值，曲线 $y=f(x)$ 在点 $(x_0,f(x_0))$ 处的切线为 $l_1$，设 $l_1$ 与 $x$ 轴交点的横坐标为 $x_1$，并称 $x_1$ 为 $r$ 的 1 次近似值；曲线 $y=f(x)$ 在点 $(x_1,f(x_1))$ 处的切线为 $l_2$，设 $l_2$ 与 $x$ 轴交点的横坐标为 $x_2$，称 $x_2$ 为 $r$ 的 2 次近似值。一般地，$y=f(x)$ 在点 $(x_n,f(x_n))(n\in \mathbf N)$ 处的切线为 $l_{n+1}$，记 $l_{n+1}$ 与 $x$ 轴交点的横坐标为 $x_{n+1}$，并称 $x_{n+1}$ 为 $r$ 的 $n+1$ 次近似值。重复以上操作，在一定精确度下，可取 $x_n$ 为 $f(x)=0$ 的近似解。求函数 $f(x)=x^2-2$ 的大于零的零点 $r$ 的近似值，取 $x_0=2$。

  (1). 求 $x_1$ 和 $x_2$。
  (2). 求 $x_n$ 和 $x_{n-1}$ 的关系并证明 $(n\in \mathbf N^*)$。
  (3). 证明：$\sqrt2 n<\sum_{i=1}^n x_i<\sqrt2 n+1\ (n\in \mathbf N^*)$。
answer: |
  (1) $x_1=\frac32,\ x_2=\frac{17}{12}$；(2) $x_n=\frac{x_{n-1}^2+2}{2x_{n-1}}=\frac12\left(x_{n-1}+\frac2{x_{n-1}}\right)$；(3) 由 $\sqrt2<x_i<\sqrt2+\frac1{2^i}$ 求和得 $\sqrt2 n<\sum_{i=1}^n x_i<\sqrt2 n+1$。

  先由 $f'(x)=2x$ 得第一条切线 $l_1:y-2=4(x-2)$，令 $y=0$ 得 $x_1=\frac32$；第二条切线为 $l_2:y-\frac14=3(x-\frac32)$，令 $y=0$ 得 $x_2=\frac{17}{12}$。一般地，第 $n$ 次切线写作 $l_n:y-(x_{n-1}^2-2)=2x_{n-1}(x-x_{n-1})$，令 $y=0$ 得 $x_n=\frac{x_{n-1}^2+2}{2x_{n-1}}$。由基本不等式得 $x_n>\sqrt2$，故求和下界成立；再由 $\sqrt2<x_n\le2$ 推出 $x_n^2-2<\frac14(x_{n-1}^2-2)<\cdots<\frac2{4^n}$，于是 $x_n<\sqrt{2+\frac2{4^n}}<\sqrt2+\frac1{2^n}$，求和得到上界。
