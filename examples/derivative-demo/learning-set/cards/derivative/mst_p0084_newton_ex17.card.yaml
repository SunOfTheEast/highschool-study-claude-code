solution:
  source_solution_summary: |
    先由 $f'(x)=2x$ 得第一条切线 $l_1:y-2=4(x-2)$，令 $y=0$ 得 $x_1=\frac32$；第二条切线为 $l_2:y-\frac14=3(x-\frac32)$，令 $y=0$ 得 $x_2=\frac{17}{12}$。一般地，第 $n$ 次切线写作 $l_n:y-(x_{n-1}^2-2)=2x_{n-1}(x-x_{n-1})$，令 $y=0$ 得 $x_n=\frac{x_{n-1}^2+2}{2x_{n-1}}$。由基本不等式得 $x_n>\sqrt2$，故求和下界成立；再由 $\sqrt2<x_n\le2$ 推出 $x_n^2-2<\frac14(x_{n-1}^2-2)<\cdots<\frac2{4^n}$，于是 $x_n<\sqrt{2+\frac2{4^n}}<\sqrt2+\frac1{2^n}$，求和得到上界。
  key_steps:
    - step_id: step_1
      statement: 写出前两次切线并求 $x_1,x_2$。
      formula_trace:
        from: |
          $f(x)=x^2-2,\quad x_0=2,\quad f'(x)=2x$
        to: |
          $l_1:y-2=4(x-2),\quad x_1=\frac32;\qquad
          l_2:y-\frac14=3\left(x-\frac32\right),\quad x_2=\frac{17}{12}$
        operation: 分别在 $x_0=2$ 与 $x_1=\frac32$ 处用点斜式写切线，再令 $y=0$ 求横截距。
        why: 牛顿切线法的下一次近似值就是当前切线与 $x$ 轴交点的横坐标。
      source_ref: page_0084
    - step_id: step_2
      statement: 推出一般递推式。
      formula_trace:
        from: |
          $l_n:y-(x_{n-1}^2-2)=2x_{n-1}(x-x_{n-1})$
        to: |
          $x_n=\frac{x_{n-1}^2+2}{2x_{n-1}}
          =\frac12\left(x_{n-1}+\frac2{x_{n-1}}\right)$
        operation: 令切线方程中的 $y=0$，解出横坐标 $x=x_n$。
        why: 把几何切线步骤改写成数列递推，后续才能做不等式估计。
      source_ref: page_0084
    - step_id: step_3
      statement: 用基本不等式给每一项的下界。
      formula_trace:
        from: |
          $x_n=\frac12\left(x_{n-1}+\frac2{x_{n-1}}\right)$
        to: |
          $x_n>\sqrt2,\qquad \sqrt2 n<\sum_{i=1}^n x_i$
        operation: 对正数 $x_{n-1}$ 和 $\frac2{x_{n-1}}$ 使用基本不等式，并结合迭代值不是精确根。
        why: $\sqrt2$ 是 $x^2-2=0$ 的正根，每个迭代值都在它的右侧，逐项求和给出下界。
      source_ref: page_0084
    - step_id: step_4
      statement: 把递推式平方，建立误差递推。
      formula_trace:
        from: |
          $x_n^2=\frac14\left(x_{n-1}^2+\frac4{x_{n-1}^2}+4\right),\qquad \sqrt2<x_{n-1}\le2$
        to: |
          $x_n^2<\frac14(x_{n-1}^2+6),\qquad
          x_n^2-2<\frac14(x_{n-1}^2-2)<\cdots<\frac2{4^n}$
        operation: 由 $x_{n-1}^2>2$ 得 $\frac4{x_{n-1}^2}<2$，再递推迭代误差 $x_n^2-2$。
        why: 平方误差每步至多缩小到原来的 $\frac14$，这给出足够强的上界。
      source_ref: page_0084,page_0085
    - step_id: step_5
      statement: 把单项误差上界求和。
      formula_trace:
        from: |
          $x_n^2<2+\frac2{4^n}$
        to: |
          $x_n<\sqrt{2+\frac2{4^n}}<\sqrt2+\frac1{2^n},\qquad
          \sum_{i=1}^n x_i<\sqrt2 n+\sum_{i=1}^n\frac1{2^i}<\sqrt2 n+1$
        operation: 由平方上界转成 $x_n$ 上界，再对等比数列余项求和。
        why: 逐项控制 $x_i-\sqrt2$，即可得到总和不超过 $\sqrt2 n+1$。
      source_ref: page_0085
teaching_card:
  student_title: 把牛顿切线法变成递推数列
  what_it_trains: 训练把切线求零点的几何操作写成递推式，再用基本不等式和误差递推证明迭代数列的求和夹逼。
  recognition_cues:
    - 题干反复描述“切线与 $x$ 轴交点的横坐标”为下一次近似值。
    - 函数是 $x^2-2$，正零点是 $\sqrt2$，递推式会出现 $x+\frac2x$。
    - 第 (3) 问要求 $\sum x_i$ 的上下界，需要先控制每个 $x_i$。
  normalization_moves:
    - 先令切线方程 $y=0$，把几何步骤变成 $x_n$ 递推。
    - 把递推式写成平均数形式 $\frac12(x_{n-1}+\frac2{x_{n-1}})$。
    - 把上界转成 $x_n^2-2$ 的误差缩小，再求等比和。
  common_failures:
    - 把第 $n$ 条切线的切点误写成 $x_n$，导致递推下标错位。
    - 只用基本不等式得到下界，忘记还要单独证明上界。
    - 平方后没有利用 $x_{n-1}^2>2$，卡在 $\frac4{x_{n-1}^2}$ 项。
    - 把 $\sum_{i=1}^n 2^{-i}$ 算成大于 1，无法得到严格上界。
  similar_practice_query: 牛顿迭代 $x^2-2$ 递推 基本不等式 平方误差 求和上界
quality:
  confidence: high
  needs_review: false
  review_notes:
