stem: |-
  （2023·岳阳平江高二期末 T8）若不等式 $e^{x+a}\geqslant \ln x-a$ 恒成立，则实数 $a$ 的取值范围是（  ）
  A. $[0,+\infty)$
  B. $[-1,+\infty)$
  C. $\left[-\frac{1}{e},+\infty\right)$
  D. $[-e,+\infty)$
answer: |
  B

  法一：构造
  \[
  F(u)=e^u+u,
  \]
  其在 $\mathbf{R}$ 上递增。由
  \[
  e^{x+a}\ge\ln x-a
  \]
  得
  \[
  e^{x+a}+a+x\ge \ln x+x=e^{\ln x}+\ln x.
  \]
  由 $F$ 递增可得
  \[
  x+a\ge \ln x\Longrightarrow a\ge \ln x-x\quad(x>0).
  \]
  令 $g(x)=\ln x-x$，则
  \[
  g^{\prime}(x)=\frac1x-1,
  \]
  在 $x=1$ 处取最大值 $g(1)=-1$，故 $a\ge-1$。

  法二：把不等式写为
  \[
  e^{x+a}+a\ge \ln x.
  \]
  源解按“凹凸性不同函数零点比大小”处理：左侧零点
  $x_1=\ln(-a)-a$，右侧零点 $x_2=1$，故 $x_1\le x_2$，即
  \[
  (-a)+\ln(-a)\le1.
  \]
  又 $x+\ln x$ 在 $(0,+\infty)$ 单调递增，推出 $-a\le1$，即
  \[
  a\ge-1.
  \]
  两法同结论，取值范围为 $[-1,+\infty)$，选 B。
