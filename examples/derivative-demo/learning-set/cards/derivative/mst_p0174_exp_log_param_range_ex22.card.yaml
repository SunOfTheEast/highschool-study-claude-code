solution:
  source_solution_summary: |
    法一：构造
    \[
    F(u)=e^u+u,
    \]
    其在 $\mathbf{R}$ 上递增。由
    \[
    e^{x+a}\ge\ln x-a
    \]
    得
    \[
    e^{x+a}+a+x\ge \ln x+x=e^{\ln x}+\ln x.
    \]
    由 $F$ 递增可得
    \[
    x+a\ge \ln x\Longrightarrow a\ge \ln x-x\quad(x>0).
    \]
    令 $g(x)=\ln x-x$，则
    \[
    g^{\prime}(x)=\frac1x-1,
    \]
    在 $x=1$ 处取最大值 $g(1)=-1$，故 $a\ge-1$。

    法二：把不等式写为
    \[
    e^{x+a}+a\ge \ln x.
    \]
    源解按“凹凸性不同函数零点比大小”处理：左侧零点
    $x_1=\ln(-a)-a$，右侧零点 $x_2=1$，故 $x_1\le x_2$，即
    \[
    (-a)+\ln(-a)\le1.
    \]
    又 $x+\ln x$ 在 $(0,+\infty)$ 单调递增，推出 $-a\le1$，即
    \[
    a\ge-1.
    \]
    两法同结论，取值范围为 $[-1,+\infty)$，选 B。
  key_steps:
    - step_id: step_1
      statement: 用递增模板 $e^u+u$ 把原不等式压缩为单参数条件。
      formula_trace:
        from: $e^{x+a}\ge\ln x-a$
        to: $e^{x+a}+a+x\ge e^{\ln x}+\ln x\Rightarrow x+a\ge\ln x$
        operation: 两侧同加 $a+x$ 并调用 $F(u)=e^u+u$ 递增。
        why: 把“恒成立”转成对所有 $x>0$ 的线性下界条件。
      source_ref: page_0174_ex22_solution
    - step_id: step_2
      statement: 转成函数上确界问题。
      formula_trace:
        from: $x+a\ge\ln x$
        to: $a\ge\ln x-x=:g(x)$
        operation: 移项后提取参数 $a$。
        why: 参数范围由 $g(x)$ 的最大值决定。
      source_ref: page_0174_ex22_solution
    - step_id: step_3
      statement: 求 $g(x)=\ln x-x$ 的最大值。
      formula_trace:
        from: $g^{\prime}(x)=\frac1x-1$
        to: $g_{\max}=g(1)=-1$
        operation: 用导数判增减：$(0,1)$ 增、$(1,+\infty)$ 减。
        why: 得到满足恒成立的必要且充分条件 $a\ge-1$。
      source_ref: page_0174_ex22_solution
    - step_id: step_4
      statement: 用零点比大小法做独立复核。
      formula_trace:
        from: $e^{x+a}+a\ge\ln x$
        to: $x_1=\ln(-a)-a\le x_2=1\Rightarrow (-a)+\ln(-a)\le1$
        operation: 比较两侧零点并调用 $x+\ln x$ 的单调性。
        why: 再次推出 $a\ge-1$，与法一一致。
      source_ref: page_0174_ex22_solution
    - step_id: step_5
      statement: 匹配选项。
      formula_trace:
        from: $a\ge-1$
        to: $a\in[-1,+\infty)$，选 B
        operation: 写成区间并对应选项。
        why: 完成题目要求。
      source_ref: page_0174_ex22_solution
teaching_card:
  student_title: 先变成 $a\ge\ln x-x$，再拿最大值
  what_it_trains: 训练指数-对数恒成立题的标准流程：先做同构加项，再把参数范围转成单函数极值。
  recognition_cues:
    - 题干形式是“$e^{(\cdot)}$ 与 $\ln x$ 的恒成立不等式”。
    - 参数 $a$ 同时出现在指数内部和线性项里。
    - 选项是参数区间。
  normalization_moves:
    - 同加 $a+x$，构造 $e^u+u$ 递增模板。
    - 得到 $a\ge\ln x-x$。
    - 求 $g(x)=\ln x-x$ 最大值锁定边界。
    - 可用零点比大小再做一次答案复核。
  common_failures:
    - 把 $g(x)=\ln x-x$ 的极值点误算成 $x=e$。
    - 忘记 $\ln x$ 的定义域 $x>0$。
    - 只验证“必要”不验证“充分”，导致区间端点漏写。
  similar_practice_query: e^{x+a} lnx-a 恒成立 参数范围 lnx-x 最大值
