stem: 讨论函数 $f(x)=\ln x-\frac ax$ 的零点个数。
answer: |-
  $a<-\frac1e$ 时无零点；$a=-\frac1e$ 或 $a\geqslant0$ 时有 1 个零点；$-\frac1e<a<0$ 时有 2 个零点。

  $f'(x)=\frac1x+\frac a{x^2}=\frac{x+a}{x^2}$。当 $a>0$ 时 $f'(x)>0$，$f$ 单调递增，且 $f(1)=-a<0$， $f(e^a)=a-a/e^a>0$，故有 1 个零点。当 $a=0$ 时， $f(x)=\ln x$，有 1 个零点 $x=1$。当 $a<0$ 时，临界点 $x=-a$，$f$ 在 $(0,-a)$ 递减，在 $(-a,+\infty)$ 递增， 最小值为 $\ln(-a)+1$。若 $a=-1/e$，恰有 1 个零点 $x=1/e$；若 $-1/e<a<0$，最小值小于 0，有 2 个零点，其中 右侧由 $f(1)>0$ 夹出，左侧用等效零点 $f(x)=\frac1{\sqrt{x}}(\sqrt{x}\ln x-a/\sqrt{x})$ 和 $\sqrt{x}\ln x\geqslant-2/e$ 取 $x=a^2$ 夹出；若 $a<-1/e$，最小值大于 0，无零点。
