original_problem:
  stem: （2024 秋 · 天津校级期中）已知函数 $f(x)=ax-1-\ln x$，$a\in\mathbf{R}$。
  parts: *a1
  choices: []
  answer: 第(1)问最大值为 $2e-2$，最小值为 $\ln2$；第(2)问不等式成立；第(3)问 $k$ 的最大整数值为 $3$。
  fidelity_notes:
    - 无选项。
    - 第(3)问原题是非严格不等式，source 用严格正证明，最终整数答案不受影响。
solution:
  source_solution_summary: 第(1)问当 $a=2$ 时，$f^\prime(x)=\frac{2x-1}{x}$， 在 $[\frac1e,\frac12]$ 上递减，在 $[\frac12,e]$ 上递增； 比较 $f(\frac12)=\ln2$、$f(\frac1e)=\frac2e$、 $f(e)=2e-2$，得最小值 $\ln2$，最大值 $2e-2$。第(2)问当 $a=1$ 时，令 $h(x)=x\ln x-f(x)=x\ln x-x+\ln x+1$， 则 $h^\prime(x)=\ln x+\frac1x>0$，所以 $x>1$ 时 $h(x)>h(1)=0$。第(3)问切线与 $x=1$ 垂直说明切线水平， $f^\prime(1)=0$，故 $a=1$。原不等式化为 $g(x)=x\ln x-(k-1)x+k\ge0$ 对 $x>1$ 恒成立。source 按更强的 $g(x)>0$ 处理：$g^\prime(x)=\ln x+2-k$。若 $k\le2$， 则 $g$ 在 $(1,+\infty)$ 上递增，满足条件；若 $k>2$， 最小点为 $x=e^{k-2}$，需 $k-e^{k-2}>0$。检验整数得 $k=3$ 成立，$k=4$ 不成立，$k\ge5$ 更不成立，所以最大整数为 $3$。法二先由 $g(e)>0$ 得 $k<\frac{2e}{e-1}\in(3,4)$， 再验证 $k=3$ 时 $g(x)=x\ln x-2x+3>0$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问求区间最值。
      formula_trace:
        from: $f(x)=2x-1-\ln x$
        to: $f^\prime(x)=\frac{2x-1}{x}$
        operation: 代入 $a=2$ 后求导。
        why: 区间最值先找单调分界点 $x=\frac12$。
      source_ref: page_0296_ex03_solution_start
    - step_id: step_2
      statement: 比较端点和驻点函数值。
      formula_trace:
        from: $f(\frac12)=\ln2,\quad f(\frac1e)=\frac2e,\quad f(e)=2e-2$
        to: $f_{\min}=\ln2,\quad f_{\max}=2e-2$
        operation: 比较区间端点和唯一极小点。
        why: 驻点给最小值，最大值仍需比较两个端点。
      source_ref: page_0296_ex03_solution_start
    - step_id: step_3
      statement: 第(2)问把待证不等式变成辅助函数正性。
      formula_trace:
        from: $x\ln x>f(x)$
        to: $h(x)=x\ln x-x+\ln x+1>0$
        operation: 代入 $a=1$ 并移项。
        why: 目标变成证明 $h$ 在 $x>1$ 上从 $0$ 往上走。
      source_ref: page_0296_ex03_solution_start
    - step_id: step_4
      statement: 用单调性完成第(2)问。
      formula_trace:
        from: $h^\prime(x)=\ln x+\frac1x>0\quad(x>1)$
        to: $h(x)>h(1)=0$
        operation: 求导判单调。
        why: 这是基础的对数正性证明。
      source_ref: page_0296_ex03_solution_start
    - step_id: step_5
      statement: 第(3)问先由几何条件确定 $a$。
      formula_trace:
        from: 切线与直线 $x=1$ 垂直
        to: $f^\prime(1)=0,\quad a=1$
        operation: 竖直线的垂线是水平线，故切线斜率为 $0$。
        why: 先把 $a$ 固定，后面只剩 $k$。
      source_ref: page_0296_ex03_solution_start
    - step_id: step_6
      statement: 把第(3)问转成 $k$ 参数函数正性。
      formula_trace:
        from: $f(x)+x\ln x+k\geqslant kx-1-\ln x$
        to: $g(x)=x\ln x-(k-1)x+k\ge0$
        operation: 代入 $f(x)=x-1-\ln x$ 并整理。
        why: 最大整数值问题转成 $g$ 在 $(1,+\infty)$ 上的最小值问题。
      source_ref: page_0296_ex03_solution_start
    - step_id: step_7
      statement: 法一按最小点是否进入区间分类。
      formula_trace:
        from: $g^\prime(x)=\ln x+2-k$
        to: $x=e^{k-2}$
        operation: 令导数为 $0$。
        why: $e^{k-2}\le1$ 与 $e^{k-2}>1$ 对应两种单调形态。
      source_ref: page_0297_ex03_solution_end
    - step_id: step_8
      statement: 检验整数边界。
      formula_trace:
        from: $g_{\min}=k-e^{k-2}$
        to: $k_{\max,\mathbf Z}=3$
        operation: 检验 $k=3,4$，并排除 $k\ge5$。
        why: $3>e$ 成立，$4>e^2$ 不成立，指数增长使更大整数不成立。
      source_ref: page_0297_ex03_solution_end
    - step_id: step_9
      statement: 法二先用特值 $x=e$ 锁定候选，再验证。
      formula_trace:
        from: $g(e)>0$
        to: $k<\frac{2e}{e-1}\in(3,4)$
        operation: 代入一个必要点。
        why: 最大整数只能是 $3$，剩下验证 $k=3$。
      source_ref: page_0297_ex03_solution_end
teaching_card:
  student_title: 切线定参后求最大整数
  what_it_trains: 训练先用切线几何条件把参数定下来，再把恒成立问题转成一个含整数参数的最小值问题。
  recognition_cues:
    - 题目说切线与 $x=1$ 垂直，本质是切线水平。
    - 第(3)问的 $k$ 同时出现在常数项和一次项里。
    - $x\ln x-(k-1)x+k$ 的导数零点是 $e^{k-2}$。
    - 问最大整数值时，可以先找必要点快速锁定候选。
  normalization_moves:
    - 第(1)问只按端点和驻点比较处理。
    - 第(2)问移项成辅助函数 $h(x)$。
    - 第(3)问先定 $a=1$，再集中处理 $k$。
    - 用 $x=e$ 做必要性探路时，后面仍要验证 $k=3$ 充分成立。
  common_failures:
    - 把竖直线的垂线也当成竖直线，导致 $f^\prime(1)$ 判断错误。
    - 第(1)问只看极小点，忘记最大值要比较两个端点。
    - 把 $g^\prime(x)=0$ 得到的 $e^{k-2}$ 直接当成一定在区间内。
    - 用 $g(e)>0$ 得到候选后忘记验证 $k=3$。
  similar_practice_query: ax-1-lnx 切线垂直 xlnx 最大整数 k e^{k-2} g(e) 必要性探路
