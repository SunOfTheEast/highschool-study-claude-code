stem: |-
  （2024 秋 · 天津校级期中）已知函数 $f(x)=ax-1-\ln x$，$a\in\mathbf{R}$。
  1. 若 $a=2$，求 $f(x)$ 在 $[\frac1e,e]$ 上的最大值和最小值。
  2. 若 $a=1$，当 $x>1$ 时，证明：$x\ln x>f(x)$ 恒成立。
  3. 若函数 $f(x)$ 在 $x=1$ 处的切线与直线 $l:x=1$ 垂直，且 $f(x)+x\ln x+k\geqslant kx-1-\ln x$ 对任意 $x\in(1,+\infty)$ 恒成立，求 $k$ 的最大整数值。
answer: |-
  第(1)问最大值为 $2e-2$，最小值为 $\ln2$；第(2)问不等式成立；第(3)问 $k$ 的最大整数值为 $3$。

  第(1)问当 $a=2$ 时，$f^\prime(x)=\frac{2x-1}{x}$， 在 $[\frac1e,\frac12]$ 上递减，在 $[\frac12,e]$ 上递增； 比较 $f(\frac12)=\ln2$、$f(\frac1e)=\frac2e$、 $f(e)=2e-2$，得最小值 $\ln2$，最大值 $2e-2$。第(2)问当 $a=1$ 时，令 $h(x)=x\ln x-f(x)=x\ln x-x+\ln x+1$， 则 $h^\prime(x)=\ln x+\frac1x>0$，所以 $x>1$ 时 $h(x)>h(1)=0$。第(3)问切线与 $x=1$ 垂直说明切线水平， $f^\prime(1)=0$，故 $a=1$。原不等式化为 $g(x)=x\ln x-(k-1)x+k\ge0$ 对 $x>1$ 恒成立。source 按更强的 $g(x)>0$ 处理：$g^\prime(x)=\ln x+2-k$。若 $k\le2$， 则 $g$ 在 $(1,+\infty)$ 上递增，满足条件；若 $k>2$， 最小点为 $x=e^{k-2}$，需 $k-e^{k-2}>0$。检验整数得 $k=3$ 成立，$k=4$ 不成立，$k\ge5$ 更不成立，所以最大整数为 $3$。法二先由 $g(e)>0$ 得 $k<\frac{2e}{e-1}\in(3,4)$， 再验证 $k=3$ 时 $g(x)=x\ln x-2x+3>0$。
