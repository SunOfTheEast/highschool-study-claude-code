solution:
  source_solution_summary: |
    先看 $c$：因为 $c=2^{0.1}>1$，而 $a=\log_6 3,\ b=\lg5$ 都在 $(0,1)$，所以 $c>a,\ c>b$。
    只需比较 $a,b$。

    法一：
    \[
    a=\log_6\frac62=1-\log_6 2,\quad
    b=\lg\frac{10}{2}=1-\lg2.
    \]
    又
    \[
    \log_6 2=\frac{1}{\log_2 6},\quad \lg2=\frac{1}{\log_2 10},
    \]
    且 $1<\log_2 6<\log_2 10$，故 $\log_6 2>\lg2$，从而 $a<b$。

    法二（糖水不等式）：
    \[
    a=\frac{\lg3}{\lg6}
    <\frac{\lg3+\lg\frac{10}{6}}{\lg6+\lg\frac{10}{6}}
    =\lg5=b.
    \]
    且 $b<1<c$，所以最终
    \[
    a<b<c.
    \]
    故选 A。
  key_steps:
    - step_id: step_1
      statement: 先剥离显著项 $c$。
      formula_trace:
        from: $a=\log_6 3,\ b=\lg5,\ c=2^{0.1}$
        to: $0<a<1,\ 0<b<1,\ c>1$
        operation: 用底数大于1时对数性质与幂函数基本性质。
        why: 先锁定 $c$ 最大，降维为比较 $a,b$。
      source_ref: page_0147_ex14_solution
    - step_id: step_2
      statement: 法一把 $a,b$ 改写成“1减去对数”。
      formula_trace:
        from: $a=\log_6 3,\ b=\lg5$
        to: $a=1-\log_6 2,\ b=1-\lg2$
        operation: 把3写成 $6/2$，5写成 $10/2$。
        why: 统一成同型表达便于比较。
      source_ref: page_0147_ex14_solution
    - step_id: step_3
      statement: 比较 $\log_6 2$ 与 $\lg2$。
      formula_trace:
        from: $\log_6 2=\frac{1}{\log_2 6},\ \lg2=\frac{1}{\log_2 10}$
        to: $1<\log_2 6<\log_2 10\Rightarrow \log_6 2>\lg2\Rightarrow a<b$
        operation: 同为正数取倒数，分母越小倒数越大。
        why: 得到 $a,b$ 的主比较。
      source_ref: page_0147_ex14_solution
    - step_id: step_4
      statement: 法二用糖水不等式复核。
      formula_trace:
        from: $a=\frac{\lg3}{\lg6}$
        to: $a<\frac{\lg3+\lg(10/6)}{\lg6+\lg(10/6)}=\lg5=b$
        operation: 对分式同时加同一正量，分子小于分母时比值增大。
        why: 给出与法一一致的独立路径。
      source_ref: page_0147_ex14_solution
    - step_id: step_5
      statement: 合并三项顺序并选项匹配。
      formula_trace:
        from: $a<b,\ c>a,\ c>b$
        to: $a<b<c$，选 A
        operation: 传递性合并。
        why: 完成作答。
      source_ref: page_0147_ex14_solution
teaching_card:
  student_title: 先抓最大项，再双路线比较对数
  what_it_trains: 训练“先粗分层、再细比较”的节奏，以及同一题目两种对数比较方法互证。
  recognition_cues:
    - 一项明显是 $>1$ 的幂值，另外两项是 $(0,1)$ 对数值。
    - 出现 $\log_6 3$ 与 $\lg5$ 这类不同底对数。
    - 题解常可同时走换底链与糖水不等式。
  normalization_moves:
    - 先把 $c$ 与1比较。
    - 把 $a,b$ 写成 $1-$某项后比较剩余部分。
    - 用糖水不等式做独立复核。
  common_failures:
    - 把 $2^{0.1}$ 误判为小于1。
    - 在 $\log_6 2=\frac1{\log_2 6}$ 与 $\lg2=\frac1{\log_2 10}$ 比较中倒数方向写反。
    - 糖水不等式中加量不一致，导致无效比较。
  similar_practice_query: log6 3 lg5 2^0.1 糖水不等式 对数比大小
