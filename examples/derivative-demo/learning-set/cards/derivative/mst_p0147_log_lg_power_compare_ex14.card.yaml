stem: |-
  （2024·广州期中）设 $a=\log_6 3,\ b=\lg 5,\ c=2^{0.1}$，则（  ）
  A. $a<b<c$
  B. $b<a<c$
  C. $c<b<a$
  D. $c<a<b$
answer: |
  A

  先看 $c$：因为 $c=2^{0.1}>1$，而 $a=\log_6 3,\ b=\lg5$ 都在 $(0,1)$，所以 $c>a,\ c>b$。
  只需比较 $a,b$。

  法一：
  \[
  a=\log_6\frac62=1-\log_6 2,\quad
  b=\lg\frac{10}{2}=1-\lg2.
  \]
  又
  \[
  \log_6 2=\frac{1}{\log_2 6},\quad \lg2=\frac{1}{\log_2 10},
  \]
  且 $1<\log_2 6<\log_2 10$，故 $\log_6 2>\lg2$，从而 $a<b$。

  法二（糖水不等式）：
  \[
  a=\frac{\lg3}{\lg6}
  <\frac{\lg3+\lg\frac{10}{6}}{\lg6+\lg\frac{10}{6}}
  =\lg5=b.
  \]
  且 $b<1<c$，所以最终
  \[
  a<b<c.
  \]
  故选 A。
