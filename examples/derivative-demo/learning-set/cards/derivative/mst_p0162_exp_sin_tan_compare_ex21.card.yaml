solution:
  source_solution_summary: |
    先比较 $b,a$。令
    \[
    g(x)=e^{2x}-1-2(e^x-1),
    \]
    则 $g(0)=0$，且当 $x>0$ 时
    \[
    g^{\prime}(x)=2e^{2x}-2e^x>0.
    \]
    所以 $g(x)$ 在 $(0,+\infty)$ 递增，故
    \[
    g\!\left(\frac14\right)>0
    \iff
    e^{1/2}-1-2\left(e^{1/4}-1\right)>0
    \iff
    b>a.
    \]
    再比较 $a,c$。源解用
    \[
    e^x>1+x+\frac{x^2}{2}\ (x>0),
    \]
    得
    \[
    a=2\left(e^{1/4}-1\right)>2\left(\frac14+\frac1{32}\right)>0.55.
    \]
    同时
    \[
    c=\sin\frac14+\tan\frac14<\sin\frac{\pi}{12}+\tan\frac{\pi}{12}<0.53.
    \]
    因而 $a>c$。综合
    \[
    b>a>c,
    \]
    选 A。
  key_steps:
    - step_id: step_1
      statement: 构造差函数，把 $b-a$ 转成符号判断。
      formula_trace:
        from: $b-a=e^{1/2}-1-2(e^{1/4}-1)$
        to: $b-a=g(1/4)$，其中 $g(x)=e^{2x}-1-2(e^x-1)$
        operation: 同构为单函数取值。
        why: 避免直接近似误差，改走单调性判号。
      source_ref: page_0162_ex21_solution
    - step_id: step_2
      statement: 用导数判 $g(1/4)>0$。
      formula_trace:
        from: $g^{\prime}(x)=2e^{2x}-2e^x>0\ (x>0)$
        to: $g(1/4)>g(0)=0\Rightarrow b>a$
        operation: 先证递增再代点。
        why: 完成 $b,a$ 顺序。
      source_ref: page_0162_ex21_solution
    - step_id: step_3
      statement: 用指数下界估计 $a$。
      formula_trace:
        from: $e^x>1+x+\frac{x^2}{2}$
        to: $a=2(e^{1/4}-1)>2(\frac14+\frac1{32})>0.55$
        operation: 把指数项转成可比下界。
        why: 给出 $a$ 的可量化下界。
      source_ref: page_0162_ex21_solution
    - step_id: step_4
      statement: 给 $c$ 建立上界。
      formula_trace:
        from: $c=\sin\frac14+\tan\frac14$
        to: $c<\sin\frac\pi{12}+\tan\frac\pi{12}<0.53$
        operation: 利用 $\frac14<\frac\pi{12}$ 与三角函数单调性、精确角值。
        why: 与 step_3 的 $a$ 下界直接对比。
      source_ref: page_0162_ex21_solution
    - step_id: step_5
      statement: 合并两段比较得到最终排序。
      formula_trace:
        from: $b>a$ 且 $a>c$
        to: $b>a>c$，选 A
        operation: 传递关系合并。
        why: 完成题目答案。
      source_ref: page_0162_ex21_solution
