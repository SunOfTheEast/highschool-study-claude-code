stem: |-
  （2023·鼓楼区校级模拟）设 $a=2\left(e^{\frac14}-1\right)$，$b=e^{\frac12}-1$，$c=\sin\frac14+\tan\frac14$，则（  ）
  A. $b>a>c$
  B. $b>c>a$
  C. $a>b>c$
  D. $a>c>b$
answer: |
  A

  先比较 $b,a$。令
  \[
  g(x)=e^{2x}-1-2(e^x-1),
  \]
  则 $g(0)=0$，且当 $x>0$ 时
  \[
  g^{\prime}(x)=2e^{2x}-2e^x>0.
  \]
  所以 $g(x)$ 在 $(0,+\infty)$ 递增，故
  \[
  g\!\left(\frac14\right)>0
  \iff
  e^{1/2}-1-2\left(e^{1/4}-1\right)>0
  \iff
  b>a.
  \]
  再比较 $a,c$。源解用
  \[
  e^x>1+x+\frac{x^2}{2}\ (x>0),
  \]
  得
  \[
  a=2\left(e^{1/4}-1\right)>2\left(\frac14+\frac1{32}\right)>0.55.
  \]
  同时
  \[
  c=\sin\frac14+\tan\frac14<\sin\frac{\pi}{12}+\tan\frac{\pi}{12}<0.53.
  \]
  因而 $a>c$。综合
  \[
  b>a>c,
  \]
  选 A。
