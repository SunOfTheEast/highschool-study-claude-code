original_problem:
  stem: （2020 · 新课标 I）已知函数 $f(x)=e^x-a(x+2)$。
  parts: *a1
  choices: []
  answer: 第 (1) 问：$f$ 在 $(-\infty,0)$ 单调递减，在 $(0,+\infty)$ 单调递增；第 (2) 问：$a\in(\frac1e,+\infty)$。
  fidelity_notes:
    - 两问均无选项。
    - 函数定义域为 $\mathbf R$。
solution:
  source_solution_summary: $f'(x)=e^x-a$。当 $a=1$ 时，导数零点为 $x=0$，所以 $f$ 在 $(-\infty,0)$ 递减，在 $(0,+\infty)$ 递增。第 (2) 问若 $a\leqslant0$，则 $f$ 递增，不可能有两个零点；若 $a>0$，极小值 点为 $x=\ln a$，$f(\ln a)=-a(1+\ln a)$。要有两个零点必须且只需 $a>1/e$。此时 $f(-2)=e^{-2}>0$，左侧有零点；右侧用等效零点 $f(x)=e^{x/2}[e^{x/2}-a(x+2)/e^{x/2}]$，并用 $\frac{x+2}{2e^{(x+2)/2}}\leqslant1/e$ 得 $f(x)\geqslant e^{x/2}(e^{x/2}-2a)$，取 $x=2\ln2a$，右侧可取到 非负点，故右侧也有零点。综上 $a>1/e$。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问直接用导数判单调。
      formula_trace:
        from: $f(x)=e^x-a(x+2)$，$a=1$
        to: $f^\prime(x)=e^x-1$
        operation: 求导并代入 $a=1$。
        why: 导数零点 $x=0$ 分开递减和递增区间。
      source_ref: page_0235_ex6_solution
    - step_id: step_2
      statement: 第 (2) 问先排除 $a\leqslant0$。
      formula_trace:
        from: $f^\prime(x)=e^x-a$
        to: $a\leqslant0$ 时 $f^\prime(x)>0$
        operation: 用 $e^x>0$。
        why: 单调递增时不可能有两个零点。
      source_ref: page_0235_ex6_solution
    - step_id: step_3
      statement: $a>0$ 时用极小值给必要条件。
      formula_trace:
        from: $x=\ln a$
        to: $f(\ln a)=-a(1+\ln a)<0\Leftrightarrow a>\frac1e$
        operation: 求极小值并要求低于 x 轴。
        why: 单极值函数有两个零点必须极小值为负。
      source_ref: page_0235_ex6_solution
    - step_id: step_4
      statement: 左侧零点由 $x=-2$ 夹出。
      formula_trace:
        from: $f(-2)=e^{-2}>0,\ f(\ln a)<0$
        to: $x_1\in(-2,\ln a)$
        operation: 介值定理。
        why: $a>1/e$ 时 $\ln a>-1$，所以 $-2<\ln a$。
      source_ref: page_0235_ex6_solution
    - step_id: step_5
      statement: 右侧用等效零点法。
      formula_trace:
        from: $f(x)=e^x-a(x+2)$
        to: $e^{x/2}[e^{x/2}-a(x+2)/e^{x/2}]$
        operation: 提出 $e^{x/2}$。
        why: 把线性客体转成可界定的 $\frac{x+2}{e^{x/2}}$。
      source_ref: page_0235_ex6_solution
    - step_id: step_6
      statement: 取右侧点完成充分性。
      formula_trace:
        from: $f(x)\geqslant e^{x/2}(e^{x/2}-2a)$
        to: $x=2\ln2a$，右侧有零点
        operation: 令 $e^{x/2}=2a$。
        why: 该点在 $\ln a$ 右侧，配合极小值负值夹出右零点。
      source_ref: page_0235_ex6_solution
teaching_card:
  student_title: 两零点先看极小值，再用 $e^{x/2}$ 找右侧点
  what_it_trains: 训练单极值双零点的求参：必要条件来自极小值，充分性要补左右取点。
  recognition_cues:
    - $f^\prime=e^x-a$，极值点是 $\ln a$。
    - 题目要“两零点”，必须证明左右都能过轴。
    - 右侧有 $e^x$ 和线性项 $x+2$，适合提出 $e^{x/2}$。
  normalization_moves:
    - 第 (1) 问先做 $a=1$ 的单调性。
    - 第 (2) 问用 $f_{\min}<0$ 得 $a>1/e$。
    - 用 $f(-2)>0$ 找左零点。
    - 用等效零点法找右零点。
  common_failures:
    - 只写 $f_{\min}<0$，没证明两侧真的有零点。
    - 忘记排除 $a\leqslant0$。
    - 右侧取点时没有说明 $2\ln2a$ 在 $\ln a$ 右侧。
  similar_practice_query: e^x-a(x+2) 两零点 a范围 单极值双零点 e^{x/2} 2ln2a
