stem: |-
  （2020 · 新课标 I）已知函数 $f(x)=e^x-a(x+2)$。
  1. 当 $a=1$ 时，讨论 $f(x)$ 的单调性。
  2. 若 $f(x)$ 有两个零点，求 $a$ 的取值范围。
answer: |-
  第 (1) 问：$f$ 在 $(-\infty,0)$ 单调递减，在 $(0,+\infty)$ 单调递增；第 (2) 问：$a\in(\frac1e,+\infty)$。

  $f'(x)=e^x-a$。当 $a=1$ 时，导数零点为 $x=0$，所以 $f$ 在 $(-\infty,0)$ 递减，在 $(0,+\infty)$ 递增。第 (2) 问若 $a\leqslant0$，则 $f$ 递增，不可能有两个零点；若 $a>0$，极小值 点为 $x=\ln a$，$f(\ln a)=-a(1+\ln a)$。要有两个零点必须且只需 $a>1/e$。此时 $f(-2)=e^{-2}>0$，左侧有零点；右侧用等效零点 $f(x)=e^{x/2}[e^{x/2}-a(x+2)/e^{x/2}]$，并用 $\frac{x+2}{2e^{(x+2)/2}}\leqslant1/e$ 得 $f(x)\geqslant e^{x/2}(e^{x/2}-2a)$，取 $x=2\ln2a$，右侧可取到 非负点，故右侧也有零点。综上 $a>1/e$。
