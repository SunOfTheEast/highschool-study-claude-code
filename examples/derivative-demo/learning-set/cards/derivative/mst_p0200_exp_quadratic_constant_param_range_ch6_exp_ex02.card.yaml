stem: |-
  （2024 · 利哥每日一题）已知不等式 $e^x-ax^2-x-1\ge0$ 恒成立，求实数 $a$ 的取值范围。
  1. 当 $x\ge0$ 时，求 $a$ 的取值范围。
  2. 当 $x\in\mathbf{R}$ 时，求 $a$ 的取值范围。
answer: |-
  （1）$a\le\frac12$；（2）$a\in(-\infty,0]$。

  第(1)问：由放缩 $e^x\ge\frac12x^2+x+1\ (x\ge0)$，若 $a\le\frac12$，则 $e^x-ax^2-x-1\ge\left(\frac12-a\right)x^2\ge0$，充分性成立。 若 $a>\frac12$，考察 $x\to0^+$ 时 $e^x-ax^2-x-1=\left(\frac12-a\right)x^2+o(x^2)<0$， 与恒成立矛盾，故第(1)问 $a\le\frac12$。第(2)问：先用 $e^x-x-1\ge0$，当 $a\le0$ 时 $e^x-ax^2-x-1=(e^x-x-1)+(-a)x^2\ge0$，恒成立。 当 $a>0$ 时，取 $x<-\frac1a$ 有 $e^x<1$ 而 $ax^2+x+1>1$，从而 $e^x-ax^2-x-1<0$，矛盾。故第(2)问 $a\in(-\infty,0]$。
