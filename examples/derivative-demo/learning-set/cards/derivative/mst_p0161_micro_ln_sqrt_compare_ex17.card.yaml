  student_title: ln 与根式混合比较：双法都落在局部展开
  what_it_trains: 训练“泰勒近似 + 微元导数阶次”双通道比较，避免仅靠数值近似导致误判。
  recognition_cues:
    - 题目给出 $1.01,1.02,1.04$ 这类接近 1 的数。
    - 同时出现 $\ln(1+\varepsilon)$ 与 $\sqrt{1+\varepsilon}$。
    - 选项是严格全序。
  normalization_moves:
    - 先用展开锁定粗顺序。
    - 再用同点导数阶次做严谨复核。
    - 对打平项继续升阶。
  common_failures:
    - 把 $c$ 的三阶项系数误写成 $\frac13$。
    - 只看二阶导相同就停下，漏比三阶导。
    - 把“数值接近”误当成“大小不可判”。
