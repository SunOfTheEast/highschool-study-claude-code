solution:
  source_solution_summary: |
    法一（泰勒）先比较 $a,b$：
    \[
    a=2\ln(1+0.01)\approx2\left(0.01-\frac{0.01^2}{2}+\frac{0.01^3}{3}\right),
    \]
    \[
    b=\ln(1+0.02)\approx0.02-\frac{0.02^2}{2}+\frac{0.02^3}{3},
    \]
    得 $a>b$。
    再估计
    \[
    c=\sqrt{1.04}-1=(1+0.04)^{1/2}-1
    \approx0.02-\frac{0.02^2}{2}+\frac{0.02^3}{2},
    \]
    可知 $c>b$，且与 $a$ 比较后有 $a>c$，所以 $a>c>b$。
    法二（微元）设
    \[
    A(x)=2\ln(1+x),\ B(x)=\ln(1+2x),\ C(x)=\sqrt{1+4x}-1.
    \]
    在 $x_0=0$ 有
    \[
    A^{\prime}(0)=B^{\prime}(0)=C^{\prime}(0)=2,
    \]
    \[
    A^{\prime\prime}(0)=-2>-4=B^{\prime\prime}(0)=C^{\prime\prime}(0),
    \]
    所以 $a$ 最大。再比较
    \[
    B^{\prime\prime\prime}(0)=16,\quad C^{\prime\prime\prime}(0)=24,
    \]
    得 $c>b$。故最终
    \[
    a>c>b,
    \]
    选 B。
  key_steps:
    - step_id: step_1
      statement: 用 $\ln(1+x)$ 展开先比较 $a,b$。
      formula_trace:
        from: $a=2\ln1.01,\ b=\ln1.02$
        to: 按三阶展开后 $a>b$
        operation: 统一到 $\ln(1+x)$ 近似并逐项比较。
        why: 先锁定 $a,b$ 的先后关系。
      source_ref: page_0161_ex17_solution_method1
    - step_id: step_2
      statement: 用根式展开估计 $c$ 并完成法一排序。
      formula_trace:
        from: $c=\sqrt{1.04}-1$
        to: $c\approx0.02-\frac{0.02^2}{2}+\frac{0.02^3}{2}$，得到 $a>c>b$
        operation: 套用 $(1+x)^{1/2}$ 展开后与 step_1 对照。
        why: 得到法一最终结论。
      source_ref: page_0161_ex17_solution_method1
    - step_id: step_3
      statement: 法二统一到同一点微元比较。
      formula_trace:
        from: $A(x),B(x),C(x)$ 在 $x_0=0$ 比较
        to: $A^{\prime}(0)=B^{\prime}(0)=C^{\prime}(0)=2$
        operation: 先对齐一阶导。
        why: 进入高阶导数比较。
      source_ref: page_0161_ex17_solution_method2
    - step_id: step_4
      statement: 二阶导先判 $a$ 最大。
      formula_trace:
        from: $A^{\prime\prime}(0),B^{\prime\prime}(0),C^{\prime\prime}(0)$
        to: $-2>-4=-4\Rightarrow a$ 对应增量最大
        operation: 二阶导直接比较。
        why: 把 $a$ 放在首位。
      source_ref: page_0161_ex17_solution_method2
    - step_id: step_5
      statement: 三阶导区分 $b,c$。
      formula_trace:
        from: $B^{\prime\prime}(0)=C^{\prime\prime}(0)$
        to: $B^{\prime\prime\prime}(0)=16<24=C^{\prime\prime\prime}(0)\Rightarrow c>b$
        operation: 二阶持平后比较三阶导。
        why: 完成全序 $a>c>b$，对应 B。
      source_ref: page_0161_ex17_solution_method2
