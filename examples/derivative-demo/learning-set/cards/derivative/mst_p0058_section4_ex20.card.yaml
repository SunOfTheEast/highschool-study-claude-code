stem: |-
  （2023 · 龙岩一模 T12）已知 $f(x)=x^3-3x+m$，在区间 $[0,2]$ 上任取三个数 $a,b,c$，均存在以 $f(a),f(b),f(c)$ 为边长的三角形，则 $m$ 的取值范围是（  ）
  A. $m>2$
  B. $m>4$
  C. $m>6$
  D. $m>8$
answer: |
  C

  在 $[0,2]$ 上，$f^{\prime}(x)=3x^2-3=3(x+1)(x-1)$，所以 $f$ 在 $[0,1]$ 上递减、在 $[1,2]$ 上递增，最小值为 $f(1)=m-2$，最大值为 $f(2)=m+2$。要让任取三个函数值都能成为三角形三边，只需检查最危险的组合：两条边都取最小值，一条边取最大值，即 $2(m-2)>m+2$。解得 $m>6$，故选 C。
