original_problem:
  stem: （2023 · 龙岩一模 T12）已知 $f(x)=x^3-3x+m$，在区间 $[0,2]$ 上任取三个数 $a,b,c$，均存在以 $f(a),f(b),f(c)$ 为边长的三角形，则 $m$ 的取值范围是（  ）
