    - label: D
      text_raw: $m>8$
      text_latex: $m>8$
  answer: C
  fidelity_notes:
    - 源页题意为“任取三个数 $a,b,c$”，所以必须让区间内任意三个函数值都能作三角形边长。
    - 源解只写出 $f(1)+f(1)>f(2)$；该条件给出 $m>6$，同时保证最小函数值 $m-2>0$，边长为正自动满足。
solution:
  source_solution_summary: |
    在 $[0,2]$ 上，$f^{\prime}(x)=3x^2-3=3(x+1)(x-1)$，所以 $f$ 在 $[0,1]$ 上递减、在 $[1,2]$ 上递增，最小值为 $f(1)=m-2$，最大值为 $f(2)=m+2$。要让任取三个函数值都能成为三角形三边，只需检查最危险的组合：两条边都取最小值，一条边取最大值，即 $2(m-2)>m+2$。解得 $m>6$，故选 C。
  key_steps:
    - step_id: step_1
      statement: 先求 $f$ 在 $[0,2]$ 上的单调性。
      formula_trace:
        from: $f(x)=x^3-3x+m$
        to: $f^{\prime}(x)=3x^2-3=3(x+1)(x-1)$
        operation: 对三次函数求导并分解导函数。
        why: 区间内函数值范围决定任取三边时的最坏情况。
      source_ref: page_0058_ex20_solution
    - step_id: step_2
      statement: 在闭区间上确定最小值和最大值。
      formula_trace:
        from: $x\in[0,2]$，临界点为 $x=1$
        to: $f(x)_{\min}=f(1)=m-2,\quad f(x)_{\max}=f(2)=m+2$
        operation: 由导数符号得 $[0,1]$ 递减、$[1,2]$ 递增，并比较端点值。
        why: $f(0)=m$ 介于 $m-2$ 与 $m+2$ 之间，所以最大值取在 $x=2$。
      source_ref: page_0058_ex20_solution
    - step_id: step_3
      statement: 把“任取三个函数值能作三角形”化成最小值与最大值的不等式。
      formula_trace:
        from: 任意 $u,v,w\in[m-2,m+2]$ 都要满足三角形不等式
        to: $2(m-2)>m+2$
        operation: 取两条边为最小值、一条边为最大值，这是三角形不等式最容易失败的组合。
        why: 若最小值加最小值仍大于最大值，则任意两边之和都大于第三边。
      source_ref: page_0058_ex20_solution
    - step_id: step_4
      statement: 解出参数范围并对应选项。
      formula_trace:
        from: $2(m-2)>m+2$
        to: $m>6$
        operation: 移项化简。
        why: $m>6$ 同时推出 $m-2>0$，满足三角形边长为正。
      source_ref: page_0058_ex20_solution
teaching_card:
  student_title: 任取三边先看最小值和最大值
  what_it_trains: 训练把“任取函数值都能作三角形”翻译成函数值范围里的最坏边长不等式。
  recognition_cues:
    - 题目说在一个区间内任取 $a,b,c$。
    - 函数值 $f(a),f(b),f(c)$ 被当作三角形边长。
    - 源函数是三次函数，区间端点和临界点都容易算。
  normalization_moves:
    - 先用导数找出 $[0,2]$ 上的函数值范围。
    - 再取“两条最短边加一条最长边”作为最严检验。
    - 最后解 $2(m-2)>m+2$，不要把正边长条件单独误当答案。
  common_failures:
    - 把“任取”看成“存在”，只找一组三角形。
    - 只检查 $f(x)>0$，漏掉两边之和大于第三边。
    - 没有比较 $f(0),f(1),f(2)$，直接把端点当最值。
  similar_practice_query: 三次函数 闭区间最值 任取函数值 三角形边长 参数范围
