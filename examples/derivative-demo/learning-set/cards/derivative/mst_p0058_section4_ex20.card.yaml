      - 任意三边成立归结为 $2f_{\min}>f_{\max}$。
    normalization_moves_used:
      - 先把函数值集合压缩成区间 $[m-2,m+2]$。
      - 把任意三角形条件转成“两个最小值大于一个最大值”。
      - 由 $m>6$ 自动补足边长为正。
