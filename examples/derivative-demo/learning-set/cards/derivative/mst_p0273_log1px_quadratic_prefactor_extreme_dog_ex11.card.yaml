original_problem:
  stem: （2018 · 新课标Ⅲ）已知函数 $f(x)=(2+x+ax^2)\ln(1+x)-2x$。
  parts: *a1
  choices: []
  answer: 第(1)问：成立。第(2)问：$a=-\frac16$。
  fidelity_notes:
    - 定义域为 $x>-1$。
    - source 同时给出直接高阶导法、对数单身狗法和泰勒背景解释。
solution:
  source_solution_summary: 第(1)问取 $a=0$，$f=(2+x)\ln(1+x)-2x$。 $f^\prime=\ln(1+x)-\frac{x}{1+x}$， $f^{\prime\prime}=\frac{x}{(1+x)^2}$，所以 $f^\prime$ 在 $(-1,0)$ 递减、在 $(0,+\infty)$ 递增， 且 $f^\prime(0)=0$，故 $f^\prime\ge0$，$f$ 全域递增。 又 $f(0)=0$，得到 0 左负右正。第(2)问直接法： $f^\prime=\frac{h(x)}{1+x}$，其中 $h=ax^2-x+(1+2ax)(1+x)\ln(1+x)$。要使 0 为极大值点， 需要 $h$ 在 0 左正右负；极点效应失效后令 $h^{\prime\prime}(0)=6a+1=0$，得 $a=-\frac16$，并验证其可行。 其他参数段会在 0 的某一侧让 $f$ 单调方向错误。对数单身狗法把 局部 $f(x)\le f(0)$ 转成 $\ln(1+x)-\frac{2x}{2+x+ax^2}\le0$，同样得到 $a=-\frac16$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：取 $a=0$ 并求导。
      formula_trace:
        from: $f(x)=(2+x)\ln(1+x)-2x$
        to: $f^\prime(x)=\ln(1+x)-\frac{x}{1+x}$，$f^{\prime\prime}(x)=\frac{x}{(1+x)^2}$
        operation: 代入 $a=0$ 后求导。
        why: 用 $f^\prime$ 的单调性判断 $f$ 在 0 两侧的符号。
      source_ref: page_0273_ex11_solution_start
    - step_id: step_2
      statement: 第(1)问：由 $f^\prime\ge0$ 得符号。
      formula_trace:
        from: $f^\prime$ 在 $(-1,0)$ 递减、在 $(0,+\infty)$ 递增，$f^\prime(0)=0$
        to: $f$ 在 $(-1,+\infty)$ 递增，且 $f(0)=0$
        operation: 单调性合并。
        why: 递增函数过原点，左侧负、右侧正。
      source_ref: page_0274_ex11_solution_continuation
    - step_id: step_3
      statement: 第(2)问：把 $f^\prime$ 写成分子 $h$。
      formula_trace:
        from: $f^\prime(x)$
        to: $f^\prime(x)=\frac{ax^2-x+(1+2ax)(1+x)\ln(1+x)}{1+x}$
        operation: 通分并定义 $h$ 为分子。
        why: 因为 $1+x>0$，$f^\prime$ 的符号由 $h$ 决定。
      source_ref: page_0274_ex11_solution_continuation
    - step_id: step_4
      statement: 第(2)问：用高阶局部条件锁定 $a$。
      formula_trace:
        from: $h^\prime(0)=0$，$h^{\prime\prime}(0)=6a+1$
        to: $6a+1=0$，$a=-\frac16$
        operation: 极点效应失效后继续看二阶导。
        why: 0 要成为 $h$ 的变号点，低阶非零项不能给错方向。
      source_ref: page_0274_ex11_solution_continuation
    - step_id: step_5
      statement: 第(2)问：验证 $a=-\frac16$。
      formula_trace:
        from: $a=-\frac16$
        to: $h^{\prime\prime}(x)>0$ on $(-1,0)$，$h^{\prime\prime}(x)<0$ on $(0,+\infty)$，故 $h$ 左正右负
        operation: 判 $h^{\prime\prime}$、$h^\prime$、$h$ 的单调链。
        why: 得到 $f^\prime$ 左正右负，所以 $x=0$ 是极大值点。
      source_ref: page_0274_ex11_solution_continuation
    - step_id: step_6
      statement: 第(2)问：排除 $-\frac16<a<0$ 和 $a<-\frac16$。
      formula_trace:
        from: $h^{\prime\prime}(0)$ 的正负
        to: 存在一侧小区间使 $f^\prime$ 符号与极大值要求相反
        operation: 找点证明错误变号。
        why: 说明 $a=-\frac16$ 是唯一值。
      source_ref: page_0274_ex11_solution_continuation
    - step_id: step_7
      statement: 对数单身狗路线：把极大值不等式改写。
      formula_trace:
        from: $(2+x+ax^2)\ln(1+x)-2x\le0$
        to: $\ln(1+x)-\frac{2x}{2+x+ax^2}\le0$
        operation: 局部除以正的 $2+x+ax^2$。
        why: 把对数单独拎出来，降低求导复杂度。
      source_ref: page_0274_ex11_solution_continuation
    - step_id: step_8
      statement: 泰勒背景：解释答案来源。
      formula_trace:
        from: $(2+x+ax^2)\ln(1+x)-2x$ 的 0 附近展开
        to: 三次项系数 $a-\frac12+\frac23=0$，四次项系数为 $-\frac1{12}<0$
        operation: 展开到四阶。
        why: 三次项必须消失，四次项为负才能在 0 处取极大值。
      source_ref: page_0275_ex11_solution_continuation
teaching_card:
  student_title: 把对数单独拎出来，少算一层导数
  what_it_trains: 训练极点效应失效后的高阶局部判断；对数单身狗只是第一眼破开式子的恒等变形，用来降低求导难度。
  recognition_cues:
    - 题面是 $(2+x+ax^2)\ln(1+x)-2x$。
    - 第(2)问只关心 $x=0$ 是否为极大值点。
    - 直接求导会出现复杂分子，高阶导很重，对数单身狗可以先把式子拆开。
  normalization_moves:
    - 第(1)问先证明 $a=0$ 时函数过 0 左负右正。
    - 第(2)问直接法：提取 $f^\prime$ 分子 $h$。
    - 先用恒等变形：把 $f\le f(0)$ 改成 $\ln(1+x)-\frac{2x}{2+x+ax^2}\le0$。
    - 用 0 附近最低阶项锁定 $a=-\frac16$。
  common_failures:
    - 只算出 $h^{\prime\prime}(0)=0$，没有排除其他 $a$。
    - 把 $2+x+ax^2$ 直接除掉时不说明局部为正。
    - 把 page_0275 的辅助条件误读成 $l^\prime(0)=0$。
    - 不会解释为什么对数单身狗不改变局部极值位置。
  similar_practice_query: 对数单身狗 (2+x+ax^2)ln(1+x)-2x 极大值 a=-1/6 泰勒
