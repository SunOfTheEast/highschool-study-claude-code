stem: |-
  （2018 · 新课标Ⅲ）已知函数 $f(x)=(2+x+ax^2)\ln(1+x)-2x$。
  1. 若 $a=0$，证明：当 $-1<x<0$ 时，$f(x)<0$；当 $x>0$ 时，$f(x)>0$。
  2. 若 $x=0$ 是 $f(x)$ 的极大值点，求 $a$ 的值。
answer: |-
  第(1)问：成立。第(2)问：$a=-\frac16$。

  第(1)问取 $a=0$，$f=(2+x)\ln(1+x)-2x$。 $f^\prime=\ln(1+x)-\frac{x}{1+x}$， $f^{\prime\prime}=\frac{x}{(1+x)^2}$，所以 $f^\prime$ 在 $(-1,0)$ 递减、在 $(0,+\infty)$ 递增， 且 $f^\prime(0)=0$，故 $f^\prime\ge0$，$f$ 全域递增。 又 $f(0)=0$，得到 0 左负右正。第(2)问直接法： $f^\prime=\frac{h(x)}{1+x}$，其中 $h=ax^2-x+(1+2ax)(1+x)\ln(1+x)$。要使 0 为极大值点， 需要 $h$ 在 0 左正右负；极点效应失效后令 $h^{\prime\prime}(0)=6a+1=0$，得 $a=-\frac16$，并验证其可行。 其他参数段会在 0 的某一侧让 $f$ 单调方向错误。对数单身狗法把 局部 $f(x)\le f(0)$ 转成 $\ln(1+x)-\frac{2x}{2+x+ax^2}\le0$，同样得到 $a=-\frac16$。
