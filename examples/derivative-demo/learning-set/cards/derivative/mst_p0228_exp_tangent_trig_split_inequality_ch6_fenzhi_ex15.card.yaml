stem: |-
  （2020 · 黄山一模 T21）已知曲线 $f(x)=\frac{mx-m}{e^x}$ 在点 $(1,f(1))$ 处的切线斜率为 $-\frac1e$。
  1. 求 $m$ 的值，并求函数 $f(x)$ 的极小值。
  2. 当 $x\in(0,\pi)$ 时，求证：$e^x\sin x-x+e^{x-2}+1>e^x x\cos x$。
answer: |-
  第 (1) 问：$m=-1$，$f(x)$ 的极小值为 $-\frac1{e^2}$；第 (2) 问不等式成立。

  $f(x)=m(x-1)e^{-x}$，求导得 $f'(x)=-\frac{m(x-2)}{e^x}$，所以 $f'(1)=m/e=-1/e$，得 $m=-1$。此时 $f(x)=\frac{1-x}{e^x}$，$f'(x)=\frac{x-2}{e^x}$，故 $x=2$ 处取得极小值 $-\frac1{e^2}$。第 (2) 问两边同除以 $e^x$， 只需证明 $\frac{1-x}{e^x}+\frac1{e^2}>x\cos x-\sin x$。左侧即 $f(x)+\frac1{e^2}\geqslant0$；右侧令 $g(x)=x\cos x-\sin x$， 则 $g'(x)=-x\sin x<0$，所以 $g(x)<g(0)=0$。因此左侧非负、 右侧为负，不等式成立。
