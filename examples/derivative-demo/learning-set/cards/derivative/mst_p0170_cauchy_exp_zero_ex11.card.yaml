stem: （2024 · 济宁一模 T16）已知函数 f(x)=a*sqrt(x^2-1/2)+sqrt(2)/2*b-e^x，若 f(x)=0 在 [e/3,e] 上有解，则 a^2+b^2 的最小值为 ________。
answer: |
  $e^2$

  设 m∈[e/3,e] 是 f 的零点，则 a*sqrt(m^2-1/2)+sqrt(2)/2*b=e^m。两边平方并用柯西不等式： e^{2m}=(a*sqrt(m^2-1/2)+sqrt(2)/2*b)^2 <=(a^2+b^2)((m^2-1/2)+1/2)=(a^2+b^2)m^2， 所以 a^2+b^2>=e^{2m}/m^2=:Q(m)。对 Q(m) 求导： ln Q(m)=2m-2ln m，故 (ln Q)^{\prime}=2-2/m， 即 Q 在 (0,1] 递减、在 [1,+∞) 递增。由于 [e/3,e] 包含 1， 可得 Q_min=Q(1)=e^2，因此 a^2+b^2 的最小值为 e^2。
