solution:
  source_solution_summary: |
    设 m∈[e/3,e] 是 f 的零点，则 a*sqrt(m^2-1/2)+sqrt(2)/2*b=e^m。两边平方并用柯西不等式： e^{2m}=(a*sqrt(m^2-1/2)+sqrt(2)/2*b)^2 <=(a^2+b^2)((m^2-1/2)+1/2)=(a^2+b^2)m^2， 所以 a^2+b^2>=e^{2m}/m^2=:Q(m)。对 Q(m) 求导： ln Q(m)=2m-2ln m，故 (ln Q)^{\prime}=2-2/m， 即 Q 在 (0,1] 递减、在 [1,+∞) 递增。由于 [e/3,e] 包含 1， 可得 Q_min=Q(1)=e^2，因此 a^2+b^2 的最小值为 e^2。
  key_steps:
    - step_id: step_1
      statement: 在零点处建立参数等式。
      formula_trace:
        from: f(x)=a*sqrt(x^2-1/2)+sqrt(2)/2*b-e^x，且 f(m)=0
        to: a*sqrt(m^2-1/2)+sqrt(2)/2*b=e^m
        operation: 代入零点 m 并移项。
        why: 把参数关系与区间变量 m 绑定。
      source_ref: page_0170_ex11_solution
    - step_id: step_2
      statement: 平方后套柯西得到 a^2+b^2 下界。
      formula_trace:
        from: e^{2m}=(a*sqrt(m^2-1/2)+sqrt(2)/2*b)^2
        to: e^{2m}<=(a^2+b^2)m^2
        operation: 把 (a,b) 与 (sqrt(m^2-1/2),sqrt(2)/2) 作柯西估计。
        why: 直接得到 a^2+b^2>=e^{2m}/m^2。
      source_ref: page_0170_ex11_solution
    - step_id: step_3
      statement: 转成单变量函数 Q(m)=e^{2m}/m^2 并取最小值。
      formula_trace:
        from: a^2+b^2>=Q(m)=e^{2m}/m^2
        to: Q 在 (0,1] 递减、[1,+∞) 递增，故 Q_min=Q(1)=e^2
        operation: 对 ln Q(m)=2m-2ln m 求导判断单调。
        why: m 的区间已知，最小值可直接读出。
      source_ref: page_0170_ex11_solution
    - step_id: step_4
      statement: 回到填空答案。
      formula_trace:
        from: a^2+b^2>=e^2
        to: 最小值为 e^2
        operation: 与题目目标量匹配。
        why: 题目要求的是最小值数值。
      source_ref: page_0170_ex11_solution
teaching_card:
  student_title: 零点代入后，柯西一夹就变单变量
  what_it_trains: 训练“零点代入 -> 柯西下界 -> 指数比值最小值”这一类双参数题的标准落法。
  recognition_cues:
    - 题干含 a,b 两参数，目标是 a^2+b^2 最小值。
    - 函数值为 0 的条件里有 e^x 与根式系数线性组合。
    - 落点变量有明确区间，方便做单变量最值。
  normalization_moves:
    - 先设零点 m，再把参数组合移到等号同侧。
    - 平方并套柯西得到 a^2+b^2 下界。
    - 把下界写成 Q(m)，对 ln Q 求导判最小值。
  common_failures:
    - 漏写 m 的区间，导致最小点判断错误。
    - 柯西配对时把 sqrt(m^2-1/2)^2 写错。
    - 直接把 source 文“m=e 取等”照抄，未检查与 Q(m) 单调是否一致。
  similar_practice_query: a^2+b^2 最小值 零点 柯西 e^x/m 结构
