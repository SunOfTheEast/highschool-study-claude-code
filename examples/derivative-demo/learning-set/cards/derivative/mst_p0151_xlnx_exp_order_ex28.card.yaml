stem: |-
  若 $a\ln a>b\ln b>c\ln c=1$，则（  ）
  A. $e^{b+c}\ln a>e^{a+c}\ln b>e^{a+b}\ln c$
  B. $e^{a+b}\ln c>e^{a+c}\ln b>e^{b+c}\ln a$
  C. $e^{a+c}\ln b>e^{b+c}\ln a>e^{a+b}\ln c$
  D. $e^{a+b}\ln c>e^{b+c}\ln a>e^{a+c}\ln b$
answer: |
  B

  先设
  \[
  g(x)=x\ln x.
  \]
  因 $x>\frac1e$ 时 $g$ 递增，且
  \[
  a\ln a>b\ln b>c\ln c=1,
  \]
  得
  \[
  a>b>c>1.
  \]
  再设
  \[
  f(x)=\frac{\ln x}{e^x},\quad
  f^{\prime}(x)=\frac{1-x\ln x}{xe^x}.
  \]
  由 $c\ln c=1$ 知 $x\ge c$ 时 $x\ln x\ge1$，于是 $f^{\prime}(x)\le0$，
  故在比较区间 $[c,+\infty)$ 上 $f$ 递减。
  因 $a>b>c$，所以
  \[
  \frac{\ln a}{e^a}<\frac{\ln b}{e^b}<\frac{\ln c}{e^c}.
  \]
  依次交叉相乘：
  \[
  e^a\ln b>e^b\ln a,\quad
  e^a\ln c>e^c\ln a,\quad
  e^b\ln c>e^c\ln b.
  \]
  再乘公共指数，得到
  \[
  e^{a+b}\ln c>e^{a+c}\ln b>e^{b+c}\ln a,
  \]
  选 B。
