solution:
  source_solution_summary: |
    先设
    \[
    g(x)=x\ln x.
    \]
    因 $x>\frac1e$ 时 $g$ 递增，且
    \[
    a\ln a>b\ln b>c\ln c=1,
    \]
    得
    \[
    a>b>c>1.
    \]
    再设
    \[
    f(x)=\frac{\ln x}{e^x},\quad
    f^{\prime}(x)=\frac{1-x\ln x}{xe^x}.
    \]
    由 $c\ln c=1$ 知 $x\ge c$ 时 $x\ln x\ge1$，于是 $f^{\prime}(x)\le0$，
    故在比较区间 $[c,+\infty)$ 上 $f$ 递减。
    因 $a>b>c$，所以
    \[
    \frac{\ln a}{e^a}<\frac{\ln b}{e^b}<\frac{\ln c}{e^c}.
    \]
    依次交叉相乘：
    \[
    e^a\ln b>e^b\ln a,\quad
    e^a\ln c>e^c\ln a,\quad
    e^b\ln c>e^c\ln b.
    \]
    再乘公共指数，得到
    \[
    e^{a+b}\ln c>e^{a+c}\ln b>e^{b+c}\ln a,
    \]
    选 B。
  key_steps:
    - step_id: step_1
      statement: 先由 $x\ln x$ 的单调性排出 $a,b,c$。
      formula_trace:
        from: |
          $a\ln a>b\ln b>c\ln c=1,\quad g(x)=x\ln x$
        to: |
          $a>b>c>1$
        operation: 利用 $g(x)$ 在 $x>\frac1e$ 上递增，把函数值比较转为自变量比较。
        why: 为后续在指数加权分母下比较 $\ln x$ 做顺序准备。
      source_ref: page_0151_ex28_solution_start
    - step_id: step_2
      statement: 构造 $f(x)=\ln x/e^x$ 并在 $[c,+\infty)$ 用导数判递减。
      formula_trace:
        from: |
          $f(x)=\frac{\ln x}{e^x},\quad f^{\prime}(x)=\frac{1-x\ln x}{xe^x},\quad c\ln c=1$
        to: |
          $x\ge c\Rightarrow x\ln x\ge1\Rightarrow f^{\prime}(x)\le0\Rightarrow
          \frac{\ln a}{e^a}<\frac{\ln b}{e^b}<\frac{\ln c}{e^c}$
        operation: 用 $c\ln c=1$ 锁定导数符号，再按 $a>b>c$ 应用递减性。
        why: 把目标式统一到“同一函数值”链式比较。
      source_ref: page_0152_ex28_continuation
    - step_id: step_3
      statement: 交叉相乘并拼接为目标顺序。
      formula_trace:
        from: |
          $\frac{\ln a}{e^a}<\frac{\ln b}{e^b}<\frac{\ln c}{e^c}$
        to: |
          $e^{a+b}\ln c>e^{a+c}\ln b>e^{b+c}\ln a$
        operation: 逐对交叉相乘后，再乘公共指数因子合并为三项比较。
        why: 直接对应选项 B。
      source_ref: page_0152_ex28_continuation
teaching_card:
  student_title: 先用 $x\ln x$ 排序，再用 $\ln x/e^x$ 反推选项
  what_it_trains: 训练“双同构”流程：第一层定 $a,b,c$ 顺序，第二层把目标式统一成可导函数值比较。
  recognition_cues:
    - 条件是 $a\ln a,b\ln b,c\ln c$ 的链式大小。
    - 选项形态是 $e^{(\cdot)}\ln(\cdot)$ 的三项排序。
    - 既有 $x\ln x$，又有指数权重，通常要分两层函数构造。
  normalization_moves:
    - 构造 $g(x)=x\ln x$ 先得 $a>b>c$。
    - 构造 $f(x)=\ln x/e^x$ 再得 $\ln a/e^a<\ln b/e^b<\ln c/e^c$。
    - 交叉相乘转回目标表达式链。
  common_failures:
    - 直接把 $a\ln a>b\ln b$ 误当成 $a>b$（未说明单调区间）。
    - 把 $f^{\prime}(x)$ 写成 $\frac{1-\ln x}{e^x}$ 漏掉乘积项。
    - 交叉相乘后遗漏同乘指数导致中间项次序错。
  similar_practice_query: xlnx lnx/e^x 双函数构造 指数加权 比大小
