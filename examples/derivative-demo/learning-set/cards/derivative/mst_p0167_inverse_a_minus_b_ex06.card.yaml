teaching_card:
  student_title: 把 $a-b$ 化成反函数差后直接压下界
  what_it_trains: 训练在“同值条件”里优先构造反函数差，并用标准不等式模板一步给出最小值。
  recognition_cues:
    - 题干出现 $f(a)=g(b)$ 且要求 $a-b$ 最值。
    - 一个函数是对数平移，另一个是指数平移。
    - 选项为常数型表达式。
  normalization_moves:
    - 设公共函数值，写出 $f^{-1},g^{-1}$。
    - 把 $a-b$ 拆成两段非负模板与常数项。
    - 检查等号点确保下界可达。
  common_failures:
    - 把 $g^{-1}(x)$ 误写成 $\\ln x+1$ 一类形式。
    - 拆分时忽略 $\\ln2/2$ 常数项。
    - 只证下界不证取等，导致答案不闭合。
