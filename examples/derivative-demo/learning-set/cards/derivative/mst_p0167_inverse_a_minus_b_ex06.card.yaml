stem: |-
  （2024·山东曲阜师大附中月考 T8）已知函数 $f(x)=\ln x+\frac12$，$g(x)=e^{2x-2}$，若 $f(a)=g(b)$ 成立，则 $a-b$ 的最小值为（  ）
  A. $1-\frac12\ln2$
  B. $\frac12$
  C. $\sqrt{e}-1$
  D. $\frac12\ln2$
answer: |
  D

  设公共函数值为 $x$，则
  \[
  a-b=f^{-1}(x)-g^{-1}(x).
  \]
  由
  \[
  f(x)=\ln x+\frac12\Rightarrow f^{-1}(x)=e^{x-\frac12},\qquad
  g(x)=e^{2x-2}\Rightarrow g^{-1}(x)=\frac{\ln x+2}{2},
  \]
  得
  \[
  a-b=e^{x-\frac12}-\frac{\ln x+2}{2}.
  \]
  按源解改写为
  \[
  a-b=\bigl(e^{x-\frac12}-(x-\frac12)-1\bigr)+\frac12(2x-\ln(2x)-1)+\frac{\ln2}{2}.
  \]
  由 $e^u\ge u+1$ 与 $v-\ln v-1\ge0\ (v>0)$，前两项非负，故
  \[
  a-b\ge\frac{\ln2}{2}.
  \]
  当 $x=\frac12$ 时两项同时取等，故
  \[
  (a-b)_{\min}=\frac12\ln2.
  \]
  选 D。
