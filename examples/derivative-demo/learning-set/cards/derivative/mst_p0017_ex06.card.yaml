      - 若学生不会把 $\ln x+\frac{k}{x}\ge2+\frac{1-e}{x}$ 同乘 $x$ 后整理，回补代数恒等变形。
      - 若学生不会把 $x\ln x-2x$ 写成 $e^2\frac{x}{e^2}\ln\frac{x}{e^2}$，回补指数对数基础。
      - 若学生不知道 $t\ln t$ 的最小值为 $-\frac1e$，回补导数单调极值基础。
      - 若学生把 $k\ge1$ 写成 $k>1$，回补不等式工具基础。
