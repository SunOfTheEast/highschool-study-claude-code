    normalization_moves_used:
      - 同乘 $x>0$ 消去分母。
      - $x\ln x-2x=x(\ln x-2)=e^2(x/e^2)\ln(x/e^2)$。
      - $t\ln t$ 最小值 $-1/e$ 乘以 $e^2$ 得 $-e$。
      - $1-e-k\le -e\Rightarrow k\ge1$。
  fallback:
