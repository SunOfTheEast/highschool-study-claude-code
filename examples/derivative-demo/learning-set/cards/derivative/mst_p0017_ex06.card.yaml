stem: |-
  已知函数 $f(x)=\ln x+\frac{k}{x}$，$k\in\mathbf{R}$，$g(x)=2+\frac{1-e}{x}$，若对任意 $x\in(0,+\infty)$，不等式 $f(x)\ge g(x)$ 恒成立，则实数 $k$ 的取值范围是（ ）
  A. $k>1$
  B. $k\ge 1$
  C. $k>3$
  D. $k\ge 3$
answer: |-
  B；$k\ge1$。

  由 $f(x)\ge g(x)$ 得 $\ln x+\frac{k}{x}\ge2+\frac{1-e}{x}$。同乘 $x>0$，得到 $x\ln x-2x\ge1-e-k$。将左侧写成 $e^2\cdot\frac{x}{e^2}\ln\frac{x}{e^2}$。因为 $t\ln t$ 在 $t=1/e$ 处最小值为 $-1/e$，所以 $x\ln x-2x$ 的最小值为 $-e$。要恒有左侧 $\ge1-e-k$，必须且只需 $1-e-k\le-e$，即 $k\ge1$。
