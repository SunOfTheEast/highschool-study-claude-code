solution:
  source_solution_summary: 由 $f(x)\ge g(x)$ 得 $\ln x+\frac{k}{x}\ge2+\frac{1-e}{x}$。同乘 $x>0$，得到 $x\ln x-2x\ge1-e-k$。将左侧写成 $e^2\cdot\frac{x}{e^2}\ln\frac{x}{e^2}$。因为 $t\ln t$ 在 $t=1/e$ 处最小值为 $-1/e$，所以 $x\ln x-2x$ 的最小值为 $-e$。要恒有左侧 $\ge1-e-k$，必须且只需 $1-e-k\le-e$，即 $k\ge1$。
  key_steps:
    - step_id: step_1
      statement: 把函数不等式移项并同乘 $x>0$。
      formula_trace:
        from: $\ln x+\frac{k}{x}\ge 2+\frac{1-e}{x}$
        to: $x\ln x-2x\ge 1-e-k$
        operation: 两边同乘正数 $x$，再把含 $k$ 的常数项移到右侧。
        why: 这样左侧成为只含 $x$ 的函数，右侧成为只含参数 $k$ 的常数。
      source_ref: page_0017
    - step_id: step_2
      statement: 把左侧标准化为 $t\ln t$。
      formula_trace:
        from: $x\ln x-2x$
        to: $e^2\cdot\frac{x}{e^2}\ln\frac{x}{e^2}$
        operation: 利用 $\ln(x/e^2)=\ln x-2$，所以 $e^2(x/e^2)\ln(x/e^2)=x(\ln x-2)$。
        why: 这正是源页 $x\ln x$ 模型的平移缩放形式。
      source_ref: page_0017
    - step_id: step_3
      statement: 求左侧全局最小值。
      formula_trace:
        from: $t\ln t\ge-\frac1e\quad(t>0)$
        to: $x\ln x-2x\ge -e$
        operation: 令 $t=x/e^2$，并把最小值乘以 $e^2$。
        why: 恒成立只需比较左侧函数的最小值与右侧常数。
      source_ref: page_0017
    - step_id: step_4
      statement: 由最小值闭合参数范围。
      formula_trace:
        from: $x\ln x-2x\ge -e$，且要求 $x\ln x-2x\ge1-e-k$ 对所有 $x>0$ 成立
        to: $1-e-k\le -e\quad\Rightarrow\quad k\ge1$
        operation: 要求右侧常数不超过左侧函数的全局最小值。
        why: 当 $k=1$ 时右侧等于 $-e$，可取等；所以是不严格的 $k\ge1$。
      source_ref: page_0017
teaching_card:
  student_title: 把 $x\ln x-2x$ 平移成标准 $x\ln x$
  what_it_trains: 训练把含参数分式的恒成立题，乘正数后分离参数，再识别 $x\ln x$ 平移缩放的最小值。
  recognition_cues:
    - 题干含 $\ln x$ 和 $\frac{k}{x}$，另一个函数也含 $\frac{1-e}{x}$。
    - 同乘 $x$ 后出现 $x\ln x-2x$。
    - 右侧变成关于 $k$ 的常数，说明要用左侧函数的最小值。
  normalization_moves:
    - 先乘以 $x>0$，不要改变不等号方向。
    - 把 $x\ln x-2x$ 写成 $x(\ln x-2)$。
    - 用 $\ln(x/e^2)=\ln x-2$，把它化为 $e^2(x/e^2)\ln(x/e^2)$。
    - 用最小值 $-e$ 与 $1-e-k$ 比较。
  common_failures:
    - 同乘 $x$ 后把 $1-e-k$ 的符号整理错。
    - 把 $g(x)$ 中的 $1-e$ 看成 $e-1$。
    - 把 $x\ln x$ 的最小值 $-1/e$ 直接套用，忘记外面的 $e^2$ 缩放。
    - 忽略等号可取，把答案错选为 $k>1$。
  similar_practice_query: $\ln x+k/x$ 恒成立 $x\ln x-2x$ $t\ln t$ 最小值 参数范围
