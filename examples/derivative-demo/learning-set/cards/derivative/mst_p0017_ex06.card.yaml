original_problem:
  stem: 已知函数 $f(x)=\ln x+\frac{k}{x}$，$k\in\mathbf{R}$，$g(x)=2+\frac{1-e}{x}$，若对任意 $x\in(0,+\infty)$，不等式 $f(x)\ge g(x)$ 恒成立，则实数 $k$ 的取值范围是（ ）
  parts: *a1
