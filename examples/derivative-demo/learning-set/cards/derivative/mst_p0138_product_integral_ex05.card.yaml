solution:
  source_solution_summary: |
    由题设
    \[
    f^{\prime}(x)g(x)+f(x)g^{\prime}(x)<3x^2=(x^3)^{\prime},
    \]
    得
    \[
    [f(x)g(x)]'<(x^3)'.
    \]
    构造
    \[
    h(x)=f(x)g(x)-x^3\quad (x>0),
    \]
    则
    \[
    h^{\prime}(x)=f^{\prime}(x)g(x)+f(x)g^{\prime}(x)-3x^2<0,
    \]
    所以 $h$ 在 $(0,+\infty)$ 单调递减，故
    \[
    h(1)>h(2).
    \]
    即
    \[
    f(1)g(1)-1>f(2)g(2)-8
    \Rightarrow
    f(2)g(2)-f(1)g(1)<7.
    \]
    在选项 $\{9,8,6,5\}$ 中，满足“小于 7”的只有 6 与 5，故选 CD。
  key_steps:
    - step_id: step_1
      statement: 把题设识别为乘积导数比较。
      formula_trace:
        from: $f^{\prime}(x)g(x)+f(x)g^{\prime}(x)<3x^2$
        to: $[f(x)g(x)]'<(x^3)'$
        operation: 套用乘积求导公式。
        why: 为构造差函数单调性做准备。
      source_ref: page_0138
    - step_id: step_2
      statement: 构造 h 并由导数符号得 h(1)>h(2)。
      formula_trace:
        from: $h(x)=f(x)g(x)-x^3$
        to: $h^{\prime}(x)<0\Rightarrow h(1)>h(2)$
        operation: 求导并在 $(0,+\infty)$ 上用单调递减。
        why: 把导数不等式转成两个定点函数值不等式。
      source_ref: page_0138
