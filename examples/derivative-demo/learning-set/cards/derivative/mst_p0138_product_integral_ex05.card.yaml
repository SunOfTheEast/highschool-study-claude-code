      statement: 化为目标差值上界并筛选选项。
      formula_trace:
        from: $h(1)>h(2)$
        to: $f(2)g(2)-f(1)g(1)<7$
        operation: 代入 $x=1,2$ 展开整理。
        why: “可能值”题只需与 7 比较。
      source_ref: page_0138
