stem: |-
  （2023·凤风县月考·多选）若函数 $f(x),g(x)$ 的导函数都存在，且 $f^{\prime}(x)g(x)+f(x)g^{\prime}(x)<3x^2$，则 $f(2)g(2)-f(1)g(1)$ 的值可能为（ ）
  A. 9
  B. 8
  C. 6
  D. 5
answer: |
  CD

  由题设
  \[
  f^{\prime}(x)g(x)+f(x)g^{\prime}(x)<3x^2=(x^3)^{\prime},
  \]
  得
  \[
  [f(x)g(x)]'<(x^3)'.
  \]
  构造
  \[
  h(x)=f(x)g(x)-x^3\quad (x>0),
  \]
  则
  \[
  h^{\prime}(x)=f^{\prime}(x)g(x)+f(x)g^{\prime}(x)-3x^2<0,
  \]
  所以 $h$ 在 $(0,+\infty)$ 单调递减，故
  \[
  h(1)>h(2).
  \]
  即
  \[
  f(1)g(1)-1>f(2)g(2)-8
  \Rightarrow
  f(2)g(2)-f(1)g(1)<7.
  \]
  在选项 $\{9,8,6,5\}$ 中，满足“小于 7”的只有 6 与 5，故选 CD。
