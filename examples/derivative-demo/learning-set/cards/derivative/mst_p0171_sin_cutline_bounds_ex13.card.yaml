solution:
  source_solution_summary: 由 $x>0$ 得 $a<\frac{\sin x}{x}<b$，令 $f(x)=\frac{\sin x}{x}$。求 $b-a$ 的最小值等价于看 $f$ 在 $(0,\frac{\pi}{2})$ 的上确界与下确界之差。源解令 $h(x)=x\cos x-\sin x$，有 $h^{\prime}(x)=-x\sin x<0$，故 $h(x)<h(0)=0$，进而 $f^{\prime}(x)=\frac{x\cos x-\sin x}{x^2}<0$，即 $f$ 递减。再由 $\lim_{x\to0^+}\frac{\sin x}{x}=1$ 与 $f(\frac{\pi}{2})=\frac{2}{\pi}$，得差值为 $1-\frac{2}{\pi}$。源页法二用割线放缩 $\sin x>\frac{2x}{\pi}$ 得到同结论，故选 D。
  key_steps:
    - step_id: step_1
      statement: 先除以正量 $x$，把参数夹逼转成函数值夹逼。
      formula_trace:
        from: $ax<\sin x<bx,\ x\in(0,\frac{\pi}{2})$
        to: $a<\frac{\sin x}{x}<b$
        operation: 因 $x>0$，同除以 $x$ 不改变不等号方向。
        why: 参数 $a,b$ 的可行范围由 $\frac{\sin x}{x}$ 的上下界决定。
      source_ref: page_0171
    - step_id: step_2
      statement: 构造 $f(x)=\frac{\sin x}{x}$ 并求导。
      formula_trace:
        from: $f(x)=\frac{\sin x}{x}$
        to: $f^{\prime}(x)=\frac{x\cos x-\sin x}{x^2}$
        operation: 商式求导。
        why: 需要判断 $f$ 在区间内的单调性。
      source_ref: page_0171
    - step_id: step_3
      statement: 用辅助函数判定 $f^{\prime}(x)<0$。
      formula_trace:
        from: $h(x)=x\cos x-\sin x$
        to: $h^{\prime}(x)=-x\sin x<0\Rightarrow h(x)<h(0)=0\Rightarrow f^{\prime}(x)<0$
        operation: 先证 $h$ 递减，再代回 $f^{\prime}$ 分子符号。
        why: $f$ 在 $(0,\frac{\pi}{2})$ 单调递减。
      source_ref: page_0171
    - step_id: step_4
      statement: 读取端点极限与端值。
      formula_trace:
        from: $f(x)$ 在 $(0,\frac{\pi}{2})$ 递减
        to: $\sup f=\lim_{x\to0^+}\frac{\sin x}{x}=1,\quad \inf f=f(\frac{\pi}{2})=\frac{2}{\pi}$
        operation: 左端用极限，右端代入。
        why: 题目要的最小差值是上下界之差。
      source_ref: page_0171
    - step_id: step_5
      statement: 得到 $b-a$ 的最小值。
      formula_trace:
        from: $a<\frac{\sin x}{x}<b$ 对所有 $x$ 成立
        to: $b-a\ge \sup f-\inf f=1-\frac{2}{\pi}$，最小值取为 $1-\frac{2}{\pi}$
        operation: 区间宽度至少覆盖函数值域宽度。
        why: 与选项 D 一致。
      source_ref: page_0171
    - step_id: step_6
      statement: 源页法二：用割线直接给下界。
      formula_trace:
        from: 连接 $(0,0)$ 与 $(\frac{\pi}{2},1)$
        to: $\sin x>\frac{2x}{\pi}\ (0<x<\frac{\pi}{2})$
        operation: 用图像上的割线放缩。
        why: 上界 $\sin x<x$ 与下界 $\sin x>\frac{2x}{\pi}$ 一起也可得 $b-a$ 的同一最小值。
      source_ref: page_0171
teaching_card:
  student_title: 先看 $\sin x/x$，再用割线补下界
  what_it_trains: 训练把“参数夹逼”改写为函数值域宽度问题，并结合导数单调与图像割线两种路径求最小差值。
  recognition_cues:
    - 不等式形态是 $ax<\sin x<bx$，变量只在乘法位置。
    - 区间给在 $(0,\frac{\pi}{2})$，典型对象是 $\sin x/x$。
    - 题问的是 $b-a$ 的最小值，常转为上下界差。
  normalization_moves:
    - 同除以 $x>0$，把参数挤压变成函数挤压。
    - 对 $\sin x/x$ 求导并用 $x\cos x-\sin x$ 判符号。
    - 端点用极限和代值拼出上下界。
    - 图像上补充割线 $y=\frac{2x}{\pi}$ 形成下界。
  common_failures:
    - 把 $\sin x<x$ 当成双边界，遗漏下界来源。
    - 计算 $f^{\prime}(x)$ 后没有进一步判断分子符号。
    - 把 $x\to0^+$ 极限误当成在开区间内可直接取到的函数值。
  similar_practice_query: sinx/x 单调 夹逼 b-a 最小值 割线放缩 0 到 pi/2
