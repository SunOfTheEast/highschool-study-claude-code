stem: |-
  (2023 · 惠州三调 T8) 已知 $x\in(0,\frac{\pi}{2})$, 且 $ax<\sin x<bx$ 恒成立, 则 $b-a$ 的最小值为 ( )
  A. 1
  B. $\frac{2}{\pi}$
  C. $\frac{2}{\pi}-1$
  D. $1-\frac{2}{\pi}$
answer: |-
  D

  由 $x>0$ 得 $a<\frac{\sin x}{x}<b$，令 $f(x)=\frac{\sin x}{x}$。求 $b-a$ 的最小值等价于看 $f$ 在 $(0,\frac{\pi}{2})$ 的上确界与下确界之差。源解令 $h(x)=x\cos x-\sin x$，有 $h^{\prime}(x)=-x\sin x<0$，故 $h(x)<h(0)=0$，进而 $f^{\prime}(x)=\frac{x\cos x-\sin x}{x^2}<0$，即 $f$ 递减。再由 $\lim_{x\to0^+}\frac{\sin x}{x}=1$ 与 $f(\frac{\pi}{2})=\frac{2}{\pi}$，得差值为 $1-\frac{2}{\pi}$。源页法二用割线放缩 $\sin x>\frac{2x}{\pi}$ 得到同结论，故选 D。
