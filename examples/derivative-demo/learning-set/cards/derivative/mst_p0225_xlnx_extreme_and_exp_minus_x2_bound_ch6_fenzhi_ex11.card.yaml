stem: |-
  （2020 广西来宾市考前模拟 T21）已知函数 $f(x)=x\ln x$。
  1. 若函数 $g(x)=\frac{f(x)}{x^2}-\frac1x$，求 $g(x)$ 的极值。
  2. 证明：$f(x)+1<e^x-x^2$。
answer: |-
  （1）$g(x)$ 在 $x=e^2$ 处取得极大值 $\frac1{e^2}$，无极小值；（2）证明见解析。

  第(1)问中 $g(x)=\frac{x\ln x}{x^2}-\frac1x=\frac{\ln x-1}{x}$。 求导 $g^{\prime}(x)=\frac{2-\ln x}{x^2}$，故 $g$ 在 $(0,e^2)$ 递增、$(e^2,+\infty)$ 递减，极大值 $g(e^2)=1/e^2$。第(2)问法一：要证 $e^x-x^2-x\ln x-1>0$。先由 $\ln x\leqslant x-1$ 得 $x\ln x\leqslant x(x-1)$，故只需证 $e^x-2x^2+x-1>0$，即 $\varphi(x)=\frac{2x^2-x+1}{e^x}<1$。求导 $\varphi^{\prime}(x)=\frac{-(2x-1)(x-2)}{e^x}$，最大值在 $x=2$，$\varphi_{\max}=7/e^2<1$，所以原式成立。法二： 要证 $\frac{e^x}{x^2}>\frac{\ln x}{x}+1+\frac1{x^2}$。由 $\ln x/x\leqslant1/e$，再证明 $e^x-\frac32x^2-1>0$，可得 $\frac{e^x-x^2-1}{x^2}>1/2>1/e$，命题得证。source 后续注意段给出 $e^x-\frac32x^2-1\geqslant0$ 的更细证明，使用 $h^{\prime}(x)=e^x-3x$、方程 $e^x/x=3$ 和泰勒放缩定位关键点。
