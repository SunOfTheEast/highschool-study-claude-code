stem: |-
  已知函数 $f(x)=x+\ln(x-1)$，$g(x)=x\ln x$，若 $f(x_1)=1+2\ln t$，$g(x_2)=t^2$，则 $(x_1x_2-x_2)\ln t$ 的取值可能是 ( )
  A. $-\frac{2}{e}$
  B. $-\frac{1}{2e^2}$
  C. $-\frac{1}{2e}$
  D. $-\frac{1}{e}$
answer: |-
  BC

  由 $f(x_1)=1+2\ln t$ 得 $x_1-1+\ln(x_1-1)=\ln t^2$，即 $t^2=e^{x_1-1}(x_1-1)$。又 $g(x_2)=x_2\ln x_2=t^2=e^{\ln x_2}\ln x_2$，且两边的自变量都在非负区间，利用 $u e^u$ 递增得 $x_1-1=\ln x_2$。于是目标式等于 $x_2\ln x_2\ln t=t^2\ln t=\frac12 t^2\ln t^2$。令 $s=t^2>0$，$\frac12 s\ln s\ge -\frac1{2e}$，所以可能值是所有不小于该最小值的数；选项 B、C 可能，A、D 不可能。
