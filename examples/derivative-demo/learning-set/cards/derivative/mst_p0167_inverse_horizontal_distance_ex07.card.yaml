solution:
  source_solution_summary: |
    设公共函数值为 $t$，则
    \[
    h^{-1}(t)=\ln t+1,\qquad g^{-1}(t)=\frac{e^{t-2}+1}{2}.
    \]
    因而
    \[
    t_2-t_1=g^{-1}(t)-h^{-1}(t)
    =\frac{e^{t-2}}{2}-\ln t-\frac12=:f(t).
    \]
    按源解拆分
    \[
    f(t)=\frac12\bigl(e^{t-2}-(t-2)-1\bigr)+\left(\frac t2-\ln\frac t2-1\right)-\ln2.
    \]
    由 $e^u\ge u+1$ 与 $x-\ln x-1\ge0\ (x>0)$，得前两项均非负，所以
    \[
    f(t)\ge-\ln2.
    \]
    当 $t=2$ 时两项同时取等，故
    \[
    (t_2-t_1)_{\min}=-\ln2.
    \]
    选 B。
  key_steps:
    - step_id: step_1
      statement: 把“函数值相等”转成反函数自变量差。
      formula_trace:
        from: $h(t_1)=g(t_2)$
        to: $t_2-t_1=g^{-1}(t)-h^{-1}(t)$
        operation: 设公共函数值为 $t$，并分别取反函数。
        why: 题目目标是两个自变量之差，反函数表达最直接。
      source_ref: page_0167_ex07_solution
    - step_id: step_2
      statement: 显式写出两个反函数。
      formula_trace:
        from: $h(t)=e^{t-1},\ g(t)=\ln(2t-1)+2$
        to: $h^{-1}(t)=\ln t+1,\ g^{-1}(t)=\\frac{e^{t-2}+1}{2}$
        operation: 分别解指数式与对数式。
        why: 得到差函数的解析式。
      source_ref: page_0167_ex07_solution
    - step_id: step_3
      statement: 构造并化简目标函数。
      formula_trace:
        from: $t_2-t_1=g^{-1}(t)-h^{-1}(t)$
        to: $f(t)=\\frac{e^{t-2}}{2}-\\ln t-\\frac12$
        operation: 代入并合并常数项。
        why: 把最小值问题统一为一元函数最值。
      source_ref: page_0167_ex07_solution
    - step_id: step_4
      statement: 拆成两段标准非负模板。
      formula_trace:
        from: $f(t)=\\frac{e^{t-2}}{2}-\\ln t-\\frac12$
        to: $f(t)=\\frac12(e^{t-2}-(t-2)-1)+\\left(\\frac t2-\\ln\\frac t2-1\\right)-\\ln2$
        operation: 加减同项并改写成 $e^u-u-1$ 与 $x-\\ln x-1$ 形式。
        why: 便于直接给出下界。
      source_ref: page_0167_ex07_solution
    - step_id: step_5
      statement: 给出下界并确定等号点。
      formula_trace:
        from: $e^u-u-1\\ge0$，$x-\\ln x-1\\ge0$
        to: $f(t)\\ge-\\ln2$，且 $t=2$ 取等
        operation: 两段非负项同时取等。
        why: 得到 $t_2-t_1$ 的最小值。
      source_ref: page_0167_ex07_solution
    - step_id: step_6
      statement: 匹配选项。
      formula_trace:
        from: $(t_2-t_1)_{\\min}=-\\ln2$
        to: 选 B
        operation: 对照选项字母。
        why: 完成作答。
      source_ref: page_0167_ex07_solution
