stem: |-
  （2023·湛江二模 T8）对于两个函数 $h(t)=e^{t-1}\ (t>\frac12)$ 与 $g(t)=\ln(2t-1)+2\ (t>\frac12)$，若这两个函数值相等时对应的自变量分别为 $t_1,t_2$，则 $t_2-t_1$ 的最小值为（  ）
  A. $-1$
  B. $-\ln 2$
  C. $1-\ln 3$
  D. $1-2\ln 2$
answer: |
  B

  设公共函数值为 $t$，则
  \[
  h^{-1}(t)=\ln t+1,\qquad g^{-1}(t)=\frac{e^{t-2}+1}{2}.
  \]
  因而
  \[
  t_2-t_1=g^{-1}(t)-h^{-1}(t)
  =\frac{e^{t-2}}{2}-\ln t-\frac12=:f(t).
  \]
  按源解拆分
  \[
  f(t)=\frac12\bigl(e^{t-2}-(t-2)-1\bigr)+\left(\frac t2-\ln\frac t2-1\right)-\ln2.
  \]
  由 $e^u\ge u+1$ 与 $x-\ln x-1\ge0\ (x>0)$，得前两项均非负，所以
  \[
  f(t)\ge-\ln2.
  \]
  当 $t=2$ 时两项同时取等，故
  \[
  (t_2-t_1)_{\min}=-\ln2.
  \]
  选 B。
