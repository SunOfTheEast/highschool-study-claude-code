  recognition_cues:
    - 题面出现“两函数值相等，对应自变量之差最值”。
    - 一个函数指数型、一个函数对数型。
    - 选项是常数表达式而非参数范围。
  normalization_moves:
    - 先设公共函数值并写反函数。
    - 把目标改写成 $g^{-1}-h^{-1}$。
    - 拆成 $e^u-u-1$ 与 $x-\\ln x-1$ 两段非负。
    - 用等号点确认最小值。
  common_failures:
    - 把 $t_2-t_1$ 写成原函数差而不是反函数差。
    - 拆分时漏掉常数 $-\\ln2$。
    - 只给出下界，不检查等号是否可取。
