solution:
  source_solution_summary: |
    由
    \[
    ax+b=0\Rightarrow x=-\frac ba,
    \]
    以及
    \[
    \ln(x+2)=0\Rightarrow x=-1.
    \]
    由源解的零点比大小模型，当直线 $ax+b$ 在定义域内恒压住 $\ln(x+2)$ 时，有
    \[
    -\frac ba\le -1,
    \]
    即
    \[
    \frac ba\ge1.
    \]
    所以
    \[
    \frac ba\in[1,+\infty),
    \]
    选 B。
  key_steps:
    - step_id: step_1
      statement: 求直线零点。
      formula_trace:
        from: $ax+b=0$
        to: $x=-\frac ba$
        operation: 一次方程求根。
        why: 零点位置承载参数比 $\frac ba$。
      source_ref: page_0173_ex17_solution
    - step_id: step_2
      statement: 求对数函数零点。
      formula_trace:
        from: $\ln(x+2)=0$
        to: $x=-1$
        operation: 令 $x+2=1$。
        why: 提供固定参照零点。
      source_ref: page_0173_ex17_solution
    - step_id: step_3
      statement: 用零点比大小建立不等式。
      formula_trace:
        from: $f(x)\ge g(x)\ (x>-2)$
        to: $-\frac ba\le -1$
        operation: 按源解使用零点比大小结论。
        why: 把函数包络关系转成参数不等式。
      source_ref: page_0173_ex17_solution
    - step_id: step_4
      statement: 整理为目标范围并匹配选项。
      formula_trace:
        from: $-\frac ba\le -1$
        to: $\frac ba\ge1\Rightarrow [1,+\infty)$
        operation: 同乘 $-1$ 改变不等号方向。
        why: 得到选项 B。
      source_ref: page_0173_ex17_solution
teaching_card:
  student_title: 先看零点，再读参数比
  what_it_trains: 训练“直线压对数曲线”的恒成立题里，用固定零点与参数零点做位置比较，快速拿到 $\frac ba$ 的范围。
  recognition_cues:
    - 题面给出 $ax+b$ 与 $\ln(x+2)$ 的全区间比较。
    - 目标量是 $\frac ba$。
    - 对数零点固定在 $x=-1$。
  normalization_moves:
    - 求出两边零点。
    - 按包络关系比较零点左右。
    - 把零点不等式转成参数比范围。
  common_failures:
    - 把 $\ln(x+2)=0$ 误写成 $x=1$。
    - 比较零点时方向写反。
    - 最后漏掉范围右侧 $+\infty$。
  similar_practice_query: ax+b 与 ln(x+2) 恒成立 b/a 范围 零点比大小
