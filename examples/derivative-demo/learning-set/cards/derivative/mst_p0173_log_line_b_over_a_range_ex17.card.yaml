stem: |-
  （2025 · 桃城区校级三模 T8）已知在函数 $f(x)=ax+b\ (a>0,b>0)$，$g(x)=\ln(x+2)$，若对 $\forall x>-2$，$f(x)\geqslant g(x)$ 恒成立，则实数 $\frac{b}{a}$ 的取值范围为（  ）
  A. $[0,+\infty)$
  B. $[1,+\infty)$
  C. $[2,+\infty)$
  D. $[e,+\infty)$
answer: |
  B

  由
  \[
  ax+b=0\Rightarrow x=-\frac ba,
  \]
  以及
  \[
  \ln(x+2)=0\Rightarrow x=-1.
  \]
  由源解的零点比大小模型，当直线 $ax+b$ 在定义域内恒压住 $\ln(x+2)$ 时，有
  \[
  -\frac ba\le -1,
  \]
  即
  \[
  \frac ba\ge1.
  \]
  所以
  \[
  \frac ba\in[1,+\infty),
  \]
  选 B。
