solution:
  source_solution_summary: |
    $f(x)=(x-1)^2(x-4)$，求导得
    $f^{\prime}(x)=2(x-1)(x-4)+(x-1)^2=3(x-1)(x-3)$。因此 $f$ 在 $(-\infty,1)$、$(3,+\infty)$ 上递增，在 $(1,3)$ 上递减，所以 $x=3$ 是极小值点，A 正确。若 $0<x<1$，则 $0<x^2<x<1$，而 $f$ 在 $(0,1)$ 上递增，所以 $f(x)>f(x^2)$，B 错误。若 $1<x<2$，则 $1<2x-1<3$，在递减区间上有 $f(1)>f(2x-1)>f(3)$，即 $0>f(2x-1)>-4$，C 正确。若 $-1<x<0$，则
    $f(2-x)-f(x)=(x-1)^2(2-2x)>0$，所以 D 正确。故选 ACD。源页法二还指出：$x=1$ 是偶回零点，$x=4$ 是奇穿零点，对称中心为 $(2,-2)$，图像也支持上述判断。
  key_steps:
    - step_id: step_1
      statement: 求导并确定单调区间。
      formula_trace:
        from: $f(x)=(x-1)^2(x-4)$
        to: $f^{\prime}(x)=2(x-1)(x-4)+(x-1)^2=3(x-1)(x-3)$
        operation: 对二重因子和一次因子乘积求导并提取公因式。
        why: 四个选项都可以由单调性、极值和函数值比较判断。
      source_ref: page_0058_ex19_solution
    - step_id: step_2
      statement: 判断 A：$x=3$ 是极小值点。
      formula_trace:
        from: $f^{\prime}(x)=3(x-1)(x-3)$
        to: $f\ \text{在}\ (1,3)\ \text{递减，在}\ (3,+\infty)\ \text{递增}$
        operation: 按导数符号判断 $x=3$ 两侧先减后增。
        why: 先减后增说明 $x=3$ 为极小值点。
      source_ref: page_0058_ex19_solution
    - step_id: step_3
      statement: 判断 B：比较 $x$ 与 $x^2$ 在 $(0,1)$ 内的函数值。
      formula_trace:
        from: $0<x<1$
        to: $0<x^2<x<1,\quad f(x)>f(x^2)$
        operation: 利用 $f$ 在 $(0,1)$ 上单调递增。
        why: 选项 B 写成 $f(x)<f(x^2)$，方向与单调性相反。
      source_ref: page_0058_ex19_solution
    - step_id: step_4
      statement: 判断 C：把 $2x-1$ 映到递减区间。
      formula_trace:
        from: $1<x<2$
        to: $1<2x-1<3,\quad f(1)>f(2x-1)>f(3)$
        operation: 用线性代换确定 $2x-1$ 的范围，再用 $(1,3)$ 上递减。
        why: $f(1)=0$，$f(3)=-4$，所以 $-4<f(2x-1)<0$。
      source_ref: page_0058_ex19_solution
    - step_id: step_5
      statement: 判断 D：直接比较 $f(2-x)$ 与 $f(x)$。
      formula_trace:
        from: $f(2-x)-f(x)$
        to: $(1-x)^2(-2-x)-(x-1)^2(x-4)=(x-1)^2(2-2x)>0$
        operation: 代入并提取公共因子 $(x-1)^2$。
        why: 当 $-1<x<0$ 时，平方因子为正且 $2-2x>0$，差值为正。
      source_ref: page_0058_ex19_solution
    - step_id: step_6
      statement: 用四段论图像复核整体结构。
      formula_trace:
        from: $f(x)=(x-1)^2(x-4)$
        to: $x=1\ \text{偶回},\quad x=4\ \text{奇穿},\quad \text{中心 }(2,-2)$
        operation: 读取二重零点、单根和三次函数对称中心。
        why: 图像显示 $x=1$ 为极大值点、$x=3$ 为极小值点，也解释 C、D 中的区间比较。
      source_ref: page_0058_ex19_solution
teaching_card:
  student_title: 二重根三次函数，用单调区间逐项判
  what_it_trains: 训练把已分解的三次函数转成导数符号表和草图，再逐项处理复合自变量、区间范围和函数值比较。
  recognition_cues:
    - 函数已经写成 $(x-1)^2(x-4)$，有二重零点和单根。
    - 选项中既有极值点，也有 $x^2$、$2x-1$、$2-x$ 这样的自变量变换。
    - 题目前刚讲“三次函数四段论”，适合用图像快速复核。
  normalization_moves:
    - 求 $f^{\prime}(x)$ 并画出增减：增、减、增。
    - 把每个选项的自变量范围先化到单调区间里。
    - 比较两个复杂函数值时，能作差就作差。
    - 用零点穿根图像检查结论方向。
  common_failures:
    - 把 $x=1$ 误认为极小值点，忽略它是二重零点处的极大值点。
    - 在 $0<x<1$ 时把 $x^2<x$ 看反。
    - 在递减区间 $(1,3)$ 内比较 $f(1)$、$f(2x-1)$、$f(3)$ 时不等号方向写错。
    - D 选项只靠图像直觉，没有用作差确认。
  similar_practice_query: 三次函数 二重根 多选 单调区间 函数值比较 四段论
