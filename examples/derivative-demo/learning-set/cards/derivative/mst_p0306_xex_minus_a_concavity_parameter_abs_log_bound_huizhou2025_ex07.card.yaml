original_problem:
  stem: （2025 · 惠州二模远方有梦陪跑课答疑）定义：记函数 $f(x)$ 的导函数为 $f^\prime(x)$，若 $f^\prime(x)$ 在区间 $I$ 上单调递增，则称 $f(x)$ 为区间 $I$ 上的凹函数；若 $f^\prime(x)$ 在区间 $I$ 上单调递减，则称 $f(x)$ 为区间 $I$ 上的凸函数。已知函数 $f(x)=xe^x-a$（$x>0$），$g(x)=\frac{f(x)}x$。
  parts: *a1
  choices: []
  answer: 第(1)问：按题设定义，$f$ 为 $(0,+\infty)$ 上的凹函数。第(2)问：$a\in[4e^2,+\infty)$。第(3)问：$a<e^{e+1}$ 时 $|g(x)|+a>a\ln x$。
  fidelity_notes:
    - 无选项。
    - 本题“凹函数/凸函数”使用题设定义；题卡不纠正为常规术语。
    - 第(3)问默认对 $x>0$ 成立，因为 $f,g$ 的定义域为 $x>0$。
solution:
  source_solution_summary: 第(1)问：$f^\prime(x)=(x+1)e^x$， $f^{\prime\prime}(x)=(x+2)e^x>0$，所以 $f^\prime$ 在 $(0,+\infty)$ 上递增，按题设定义 $f$ 为凹函数。第(2)问： $g(x)=e^x-\frac ax$，$g^\prime=e^x+\frac a{x^2}$， $g^{\prime\prime}=e^x-\frac{2a}{x^3}$。按题设定义，$g$ 在 $[1,2]$ 上为凸函数等价于 $g^\prime$ 单调递减，即 $g^{\prime\prime}\le0$，所以 $x^3e^x\le2a$ 在 $[1,2]$ 恒成立；$x^3e^x$ 在 $[1,2]$ 上递增，最大值为 $8e^2$， 故 $a\ge4e^2$。第(3)问：若 $a\le0$，可直接化成 $e^x-a(\frac1x-1-\ln\frac1x)>0$。若 $0<a<e^{e+1}$，则 $F(x)=xe^x-a$ 在正半轴递增，存在唯一 $x_0$ 使 $x_0e^{x_0}=a$，且 $0<x_0<e$。当 $0<x<x_0$ 时，$e^x-\frac ax<0$，不等式直接成立。当 $x\ge x_0$ 时，设 $G(x)=e^x-\frac ax-a\ln x+a$。令 $p(x)=x^2e^x+a-ax$，则 $G^\prime(x)=\frac{p(x)}{x^2}$。由 $p^{\prime\prime}(x)=(x^2+4x+2)e^x>0$，且 $p^\prime(x_0)=(x_0^2+2x_0)e^{x_0}-a=ax_0+a>0$， 得 $p$ 递增且 $p(x)\ge p(x_0)=a>0$。所以 $G$ 递增，$G(x)\ge G(x_0)=a(1-\ln x_0)>0$，因为 $x_0<e$。
  key_steps:
    - step_id: step_1
      statement: 按题设定义证明 $f$ 为凹函数。
      formula_trace:
        from: $f(x)=xe^x-a$
        to: $f^\prime(x)=(x+1)e^x,\quad f^{\prime\prime}(x)=(x+2)e^x>0$
        operation: 两次求导。
        why: $f^{\prime\prime}>0$ 表示 $f^\prime$ 单调递增，按题设定义就是凹函数。
      source_ref: page_0306_ex07_part1_part2
    - step_id: step_2
      statement: 把第(2)问转成参数下界。
      formula_trace:
        from: $g(x)=e^x-\frac ax,\quad g^{\prime\prime}(x)=e^x-\frac{2a}{x^3}$
        to: $x^3e^x\le2a\quad(1\le x\le2)$
        operation: 按题设凸函数定义要求 $g^\prime$ 单调递减，即 $g^{\prime\prime}\le0$。
        why: 这是求 $a$ 范围的核心转化。
      source_ref: page_0306_ex07_part1_part2
    - step_id: step_3
      statement: 求 $x^3e^x$ 在 $[1,2]$ 上的最大值。
      formula_trace:
        from: $m(x)=x^3e^x$
        to: $m_{\max}=m(2)=8e^2,\quad a\ge4e^2$
        operation: 求导 $m^\prime=x^2(x+3)e^x>0$。
        why: 恒成立参数下界由最坏点 $x=2$ 给出。
      source_ref: page_0306_ex07_part1_part2
    - step_id: step_4
      statement: 第(3)问先处理 $a\le0$。
      formula_trace:
        from: $|e^x-\frac ax|+a-a\ln x$
        to: $e^x-a(\frac1x-1-\ln\frac1x)>0$
        operation: 当 $a\le0$ 时绝对值内为正，整理对数余量。
        why: 这一路不需要隐零点。
      source_ref: page_0306_ex07_part3_start
    - step_id: step_5
      statement: 当 $0<a<e^{e+1}$ 时引入隐零点 $x_0$。
      formula_trace:
        from: $xe^x-a$ 单调递增
        to: $x_0e^{x_0}=a,\quad 0<x_0<e$
        operation: 由唯一零点定义 $x_0$，再由 $a<e^{e+1}$ 与 $xe^x$ 单增推出 $x_0<e$。
        why: 绝对值符号需要靠 $x_0$ 分段。
      source_ref: page_0306_ex07_part3_start
    - step_id: step_6
      statement: 在 $0<x<x_0$ 上直接判正。
      formula_trace:
        from: $xe^x-a<0$
        to: $\frac ax-e^x-a\ln x+a>0$
        operation: 展开绝对值并观察 $-a\ln x+a$ 的正性。
        why: 这一侧不需要构造新函数。
      source_ref: page_0306_ex07_part3_start
    - step_id: step_7
      statement: 在 $x\ge x_0$ 上构造 $G$。
      formula_trace:
        from: $e^x-\frac ax-a\ln x+a$
        to: $G^\prime(x)=\frac{x^2e^x+a-ax}{x^2}$
        operation: 设 $G(x)=e^x-\frac ax-a\ln x+a$ 并求导。
        why: 绝对值内变正后，目标就是证明 $G(x)>0$。
      source_ref: page_0307_ex07_part3_tail
    - step_id: step_8
      statement: 用两层单调性证明 $G$ 递增。
      formula_trace:
        from: $p(x)=x^2e^x+a-ax$
        to: $p(x)\ge p(x_0)=a>0,\quad G^\prime(x)>0$
        operation: 先证 $p^{\prime\prime}>0$，再证 $p^\prime(x_0)>0$，于是 $p$ 递增。
        why: 这是 $x\ge x_0$ 分支的核心。
      source_ref: page_0307_ex07_part3_tail
    - step_id: step_9
      statement: 用 $x_0<e$ 完成端点估计。
      formula_trace:
        from: $G(x)\ge G(x_0)=a(1-\ln x_0)$
        to: $G(x)>0$
        operation: 利用 $x_0<e$ 得 $1-\ln x_0>0$。
        why: 这把 $a<e^{e+1}$ 的条件真正用上。
      source_ref: page_0307_ex07_part3_tail
teaching_card:
  student_title: 用隐零点拆开绝对值和对数不等式
  what_it_trains: 训练先按题设定义翻译凹凸条件，再用 $xe^x-a$ 的隐零点处理含绝对值的不等式。
  recognition_cues:
    - 题目自己定义了凹函数和凸函数，不能按平时口径硬套。
    - $g(x)=\frac{f(x)}x$ 直接变成 $e^x-\frac ax$。
    - 第三问有 $|g(x)|$，需要先知道 $e^x-\frac ax$ 在哪里变号。
    - $a<e^{e+1}$ 是为了推出隐零点 $x_0<e$。
  normalization_moves:
    - 第(2)问把“凸函数”翻译成 $g^\prime$ 递减。
    - 第(3)问先分 $a\le0$ 和 $0<a<e^{e+1}$。
    - $0<a<e^{e+1}$ 时先找 $x_0e^{x_0}=a$。
    - $x\ge x_0$ 的难点不是继续放缩，而是构造 $G$ 后证明它递增。
  common_failures:
    - 忽略题设定义，把凹凸方向按常规术语反过来。
    - $g^{\prime\prime}\le0$ 后忘记取 $x^3e^x$ 在 $[1,2]$ 的最大值。
    - 第三问不先按 $x_0$ 分段，直接展开绝对值。
    - 用到 $a<e^{e+1}$ 却没有说明它推出 $x_0<e$。
    - 证明 $G^\prime>0$ 时只看分子，没有证明 $p(x)>0$。
  similar_practice_query: xe^x-a 凹凸定义 g=f/x 绝对值 对数 隐零点 x0e^x0=a
quality:
