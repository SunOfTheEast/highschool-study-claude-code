stem: |-
  （2025 · 惠州二模远方有梦陪跑课答疑）定义：记函数 $f(x)$ 的导函数为 $f^\prime(x)$，若 $f^\prime(x)$ 在区间 $I$ 上单调递增，则称 $f(x)$ 为区间 $I$ 上的凹函数；若 $f^\prime(x)$ 在区间 $I$ 上单调递减，则称 $f(x)$ 为区间 $I$ 上的凸函数。已知函数 $f(x)=xe^x-a$（$x>0$），$g(x)=\frac{f(x)}x$。
  1. 求证：$f(x)$ 为区间 $(0,+\infty)$ 上的凹函数。
  2. 若 $g(x)$ 为区间 $[1,2]$ 的凸函数，求实数 $a$ 的取值范围。
  3. 求证：当 $a<e^{e+1}$ 时，$|g(x)|+a>a\ln x$。
answer: |-
  第(1)问：按题设定义，$f$ 为 $(0,+\infty)$ 上的凹函数。第(2)问：$a\in[4e^2,+\infty)$。第(3)问：$a<e^{e+1}$ 时 $|g(x)|+a>a\ln x$。

  第(1)问：$f^\prime(x)=(x+1)e^x$， $f^{\prime\prime}(x)=(x+2)e^x>0$，所以 $f^\prime$ 在 $(0,+\infty)$ 上递增，按题设定义 $f$ 为凹函数。第(2)问： $g(x)=e^x-\frac ax$，$g^\prime=e^x+\frac a{x^2}$， $g^{\prime\prime}=e^x-\frac{2a}{x^3}$。按题设定义，$g$ 在 $[1,2]$ 上为凸函数等价于 $g^\prime$ 单调递减，即 $g^{\prime\prime}\le0$，所以 $x^3e^x\le2a$ 在 $[1,2]$ 恒成立；$x^3e^x$ 在 $[1,2]$ 上递增，最大值为 $8e^2$， 故 $a\ge4e^2$。第(3)问：若 $a\le0$，可直接化成 $e^x-a(\frac1x-1-\ln\frac1x)>0$。若 $0<a<e^{e+1}$，则 $F(x)=xe^x-a$ 在正半轴递增，存在唯一 $x_0$ 使 $x_0e^{x_0}=a$，且 $0<x_0<e$。当 $0<x<x_0$ 时，$e^x-\frac ax<0$，不等式直接成立。当 $x\ge x_0$ 时，设 $G(x)=e^x-\frac ax-a\ln x+a$。令 $p(x)=x^2e^x+a-ax$，则 $G^\prime(x)=\frac{p(x)}{x^2}$。由 $p^{\prime\prime}(x)=(x^2+4x+2)e^x>0$，且 $p^\prime(x_0)=(x_0^2+2x_0)e^{x_0}-a=ax_0+a>0$， 得 $p$ 递增且 $p(x)\ge p(x_0)=a>0$。所以 $G$ 递增，$G(x)\ge G(x_0)=a(1-\ln x_0)>0$，因为 $x_0<e$。
