stem: |-
  已知函数 $f(x)=\frac{1}{3}x^3+2x+e^x-\frac{1}{e^x}+3$，其中 e 是自然对数的底数，若 $f(2a-3)+f(a^2)\geqslant 6$，则实数 $a$ 的取值范围是 ( )
  A. $[-3,1]$
  B. $(-\infty,-3]$
  C. $[1,+\infty)$
  D. $(-\infty,-3]\cup[1,+\infty)$
answer: |
  D

  令 $g(x)=f(x)-3=\frac13x^3+2x+e^x-e^{-x}$。先验证 $g(-x)=-g(x)$，所以 $g$ 为奇函数；又 $\frac13x^3$、$2x$、$e^x-e^{-x}$ 在 $\mathbb R$ 上递增，所以 $g$ 递增。由 $f(2a-3)+f(a^2)\ge6$ 得 $g(2a-3)+g(a^2)\ge0$，即 $g(2a-3)\ge-g(a^2)=g(-a^2)$。由 $g$ 递增，推出 $2a-3\ge-a^2$，解得 $a\le-3$ 或 $a\ge1$，故选 D。
