solution:
  source_solution_summary: |
    令 $g(x)=f(x)-3=\frac13x^3+2x+e^x-e^{-x}$。先验证 $g(-x)=-g(x)$，所以 $g$ 为奇函数；又 $\frac13x^3$、$2x$、$e^x-e^{-x}$ 在 $\mathbb R$ 上递增，所以 $g$ 递增。由 $f(2a-3)+f(a^2)\ge6$ 得 $g(2a-3)+g(a^2)\ge0$，即 $g(2a-3)\ge-g(a^2)=g(-a^2)$。由 $g$ 递增，推出 $2a-3\ge-a^2$，解得 $a\le-3$ 或 $a\ge1$，故选 D。
  key_steps:
    - step_id: step_1
      statement: 平移函数，暴露奇函数结构。
      formula_trace:
        from: |
          $f(x)=\frac13x^3+2x+e^x-\frac1{e^x}+3$
        to: |
          $g(x)=f(x)-3=\frac13x^3+2x+e^x-e^{-x}$
        operation: 把常数 $3$ 去掉，并把 $1/e^x$ 改写为 $e^{-x}$。
        why: 题设右端是 $6=3+3$，两项各减 $3$ 后正好变成同一个 $g$ 的和。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:23
    - step_id: step_2
      statement: 验证 $g$ 是奇函数。
      formula_trace:
        from: |
          $g(-x)=\frac13(-x)^3+2(-x)+e^{-x}-e^x$
        to: |
          $g(-x)=-\frac13x^3-2x+e^{-x}-e^x=-g(x)$
        operation: 逐项代入 $-x$，奇次项和一次项变号，$e^x-e^{-x}$ 也整体变号。
        why: 奇函数给出 $-g(a^2)=g(-a^2)$，可以把“函数值相反数”转成“另一个输入”。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:23
    - step_id: step_3
      statement: 确认 $g$ 在实数集上递增。
      formula_trace:
        from: |
          $g(x)=\frac13x^3+2x+(e^x-e^{-x})$
        to: |
          $\frac13x^3,\ 2x,\ e^x-e^{-x}$ 均在 $\mathbb R$ 上递增，因此 $g$ 递增
        operation: 把 $g$ 拆成三个递增函数的和；其中 $(e^x-e^{-x})'=e^x+e^{-x}>0$。
        why: 后续要由 $g(u)\ge g(v)$ 反推 $u\ge v$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:23
    - step_id: step_4
      statement: 把原不等式转成输入比较。
      formula_trace:
        from: |
          $f(2a-3)+f(a^2)\ge6$
        to: |
          $g(2a-3)+g(a^2)\ge0\Rightarrow g(2a-3)\ge-g(a^2)=g(-a^2)$
        operation: 两项各减 $3$，再利用 $g$ 的奇性改写右侧。
        why: 把含函数值的不等式降为两个输入 $2a-3$ 与 $-a^2$ 的比较。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:23
    - step_id: step_5
      statement: 求出 $a$ 的范围并对应选项。
      formula_trace:
        from: |
          $g(2a-3)\ge g(-a^2)$
        to: |
          $2a-3\ge-a^2\Rightarrow a^2+2a-3\ge0\Rightarrow (a+3)(a-1)\ge0$
        operation: 用 $g$ 的递增性去掉函数符号，再移项因式分解。
        why: 解二次不等式得到 $a\le-3$ 或 $a\ge1$，对应选项 D。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:23
teaching_card:
  student_title: 把函数和先平移成奇增函数
  what_it_trains: 看到 $f(u)+f(v)$ 与常数 $6$ 对应函数中的两个 $+3$ 时，先减常数构造 $g=f-3$；只要 $g$ 是奇增函数，就能把函数值不等式直接转成输入不等式。
  recognition_cues:
    - 函数里有 $+3$，题设右端是 $6$，暗示两项各减 $3$。
    - 去掉常数后出现 $\frac13x^3+2x+e^x-e^{-x}$，每一部分都关于原点成奇性。
    - 条件是 $g(u)+g(v)\ge0$，适合改写为 $g(u)\ge g(-v)$。
  normalization_moves:
    - 先设 $g(x)=f(x)-3$，不要急着对原函数整体求导。
    - 用 $g(-x)=-g(x)$ 把 $-g(a^2)$ 改成 $g(-a^2)$。
    - 用递增性把函数值比较降成 $2a-3$ 与 $-a^2$ 的比较。
  common_failures:
    - 忘记减去常数 $3$，导致看不出奇函数。
    - 只验证奇性，却没有说明 $g$ 单调递增，无法合法去掉 $g$。
    - 把 $2a-3\ge-a^2$ 移项后解成区间 $[-3,1]$，方向取反。
  similar_practice_query: 奇增函数 同构 f(u)+f(v) 求参数范围 e^x-e^{-x}
