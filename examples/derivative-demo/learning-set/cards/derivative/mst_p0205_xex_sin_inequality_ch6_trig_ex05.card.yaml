stem: |-
  已知函数 $f(x)=2x^2+\cos2x-1$。
  当 $x\geqslant0$ 时，证明：$xe^x+\frac{1}{2}\sin2x\geqslant2\sin x+\sin^2x$。
answer: |-
  不等式成立。

  先用 $\frac12\sin2x=\sin x\cos x$，原式等价为 $xe^x\ge\sin x(2-\cos x)+\sin^2x$。 分两段： (i) 当 $x\ge\pi$，有 $xe^x\ge\pi e^\pi>4$；而右侧 $\sin x(2-\cos x)+\sin^2x\le4$，故成立。 (ii) 当 $0\le x<\pi$，由 $\cos x\ge1-\frac12x^2$ 得 $2-\cos x\le1+\frac12x^2$，故只需证 $xe^x\ge\sin x(1+\frac12x^2)+\sin^2x$。 再由 $x\ge\sin x\ (x\ge0)$（从而 $x^2\ge\sin^2x$）可进一步归约到 $xe^x\ge x(1+\frac12x^2)+x^2=\frac12x^3+x^2+x$。 续页给出收束：由 $e^x\ge1+x+\frac12x^2\ (x\ge0)$，乘以 $x$ 即得 $xe^x\ge x+x^2+\frac12x^3$，与目标一致，故原不等式成立。
