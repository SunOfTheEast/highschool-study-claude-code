solution:
  source_solution_summary: 先用 $\frac12\sin2x=\sin x\cos x$，原式等价为 $xe^x\ge\sin x(2-\cos x)+\sin^2x$。 分两段： (i) 当 $x\ge\pi$，有 $xe^x\ge\pi e^\pi>4$；而右侧 $\sin x(2-\cos x)+\sin^2x\le4$，故成立。 (ii) 当 $0\le x<\pi$，由 $\cos x\ge1-\frac12x^2$ 得 $2-\cos x\le1+\frac12x^2$，故只需证 $xe^x\ge\sin x(1+\frac12x^2)+\sin^2x$。 再由 $x\ge\sin x\ (x\ge0)$（从而 $x^2\ge\sin^2x$）可进一步归约到 $xe^x\ge x(1+\frac12x^2)+x^2=\frac12x^3+x^2+x$。 续页给出收束：由 $e^x\ge1+x+\frac12x^2\ (x\ge0)$，乘以 $x$ 即得 $xe^x\ge x+x^2+\frac12x^3$，与目标一致，故原不等式成立。
  key_steps:
    - step_id: step_1
      statement: 先把含 $\sin2x$ 的目标改写成 $xe^x$ 下界问题。
      formula_trace:
        from: $xe^x+\frac12\sin2x\ge2\sin x+\sin^2x$
        to: $xe^x\ge\sin x(2-\cos x)+\sin^2x$
        operation: 用 $\frac12\sin2x=\sin x\cos x$ 并移项。
        why: 把难点集中到一个“指数项 vs 三角项”比较。
      source_ref: page_0205_ex05_solution_head
    - step_id: step_2
      statement: 分段一：处理 $x\ge\pi$ 的粗界。
      formula_trace:
        from: $x\ge\pi$
        to: $xe^x\ge\pi e^\pi>4,\ \sin x(2-\cos x)+\sin^2x\le4$
        operation: 左侧用单调增长粗下界，右侧用三角函数有界性粗上界。
        why: 在大区间快速完成判定。
      source_ref: page_0205_ex05_solution_head
    - step_id: step_3
      statement: 分段二：$0\le x<\pi$ 先用余弦下界降低右侧。
      formula_trace:
        from: $\cos x\ge1-\frac12x^2$
        to: $\sin x(2-\cos x)+\sin^2x\le\sin x(1+\frac12x^2)+\sin^2x$
        operation: 由 $2-\cos x\le1+\frac12x^2$ 进行同向放缩。
        why: 把右侧变为“$\sin x$ 与 $x$”可进一步比较的形式。
      source_ref: page_0205_ex05_solution_head
    - step_id: step_4
      statement: 把三角项再压到多项式项。
      formula_trace:
        from: $\sin x(1+\frac12x^2)+\sin^2x$
        to: $x(1+\frac12x^2)+x^2=\frac12x^3+x^2+x$
        operation: 用 $x\ge\sin x$（$x\ge0$）与 $x^2\ge\sin^2x$。
        why: 右侧归约成与 $xe^x$ 可直接比较的多项式。
      source_ref: page_0205_ex05_solution_head
    - step_id: step_5
      statement: 跨页收尾：用指数二次下界闭合证明。
      formula_trace:
        from: $e^x\ge1+x+\frac12x^2\ (x\ge0)$
        to: $xe^x\ge x+x^2+\frac12x^3=\frac12x^3+x^2+x$
        operation: 两边乘以 $x\ge0$。
        why: 与 step_4 的目标右侧一致，故分段二成立，原式得证。
      source_ref: page_0206_ex05_solution_continuation
teaching_card:
  student_title: 先分段再并联放缩的 $xe^x$ 比较
  what_it_trains: 训练“粗界分段 + 细化放缩”的两层策略：大区间先秒判，小区间再用三角与指数模板做精确压缩。
  recognition_cues:
    - 目标同时含 $xe^x,\sin2x,\sin^2x$。
    - 存在天然阈值点（如 $\pi$）可做分段。
    - 小区间里能把三角项逐步压到 $x,x^2,x^3$ 多项式。
  normalization_moves:
    - 先用 $\sin2x$ 恒等变形统一结构。
    - 先判 $x\ge\pi$ 粗界，再做 $0\le x<\pi$ 的精细放缩。
    - 最后用 $e^x\ge1+x+\frac12x^2$ 一步闭环。
  common_failures:
    - 分段后只证明了一个区间。
    - 在 $0\le x<\pi$ 中把 $2-\cos x$ 放缩方向写反。
    - 忘记说明 $x\ge0$ 时乘以 $x$ 不改变不等号方向。
  similar_practice_query: xe^x 与 sin2x 不等式 分段 放缩 证明
