solution:
  source_solution_summary: |
    由
    \[
    \ln(3x)-ax^2-bx+1\le 0
    \]
    得
    \[
    \frac{\ln(3x)+1}{x}\le ax+b\quad (x>0).
    \]
    源解使用零点比大小：左侧
    \[
    \frac{\ln(3x)+1}{x}=0\Rightarrow x_1=\frac1{3e},
    \]
    右侧
    \[
    ax+b=0\Rightarrow x_2=-\frac ba.
    \]
    由模型关系 $x_2\le x_1$，得
    \[
    -\frac ba\le\frac1{3e}\Rightarrow \frac ba\ge-\frac1{3e}.
    \]
    故 $\frac ba$ 的最小值为 $-\frac1{3e}$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把原不等式改写成“函数上包络”形式。
      formula_trace:
        from: $\ln(3x)-ax^2-bx+1\le 0$
        to: $\frac{\ln(3x)+1}{x}\le ax+b$
        operation: 移项并按源解除以 $x$（定义域 $x>0$）。
        why: 把含二次项的参数式转为“分式函数与直线”可比较零点。
      source_ref: page_0173_ex16_solution
    - step_id: step_2
      statement: 写出左侧函数零点。
      formula_trace:
        from: $\frac{\ln(3x)+1}{x}=0$
        to: $x_1=\frac1{3e}$
        operation: 分子置零：$\ln(3x)+1=0$。
        why: 零点位置是零点比大小的核心量。
      source_ref: page_0173_ex16_solution
    - step_id: step_3
      statement: 写出右侧直线零点。
      formula_trace:
        from: $ax+b=0$
        to: $x_2=-\frac ba$
        operation: 一次方程求根。
        why: 与左侧零点比较即可得到参数比值界。
      source_ref: page_0173_ex16_solution
    - step_id: step_4
      statement: 零点比较并转回目标量。
      formula_trace:
        from: $x_2\le x_1$
        to: $-\frac ba\le\frac1{3e}\Rightarrow \frac ba\ge-\frac1{3e}$
        operation: 代入两个零点表达式并整理。
        why: 得到最小值边界并匹配选项 D。
      source_ref: page_0173_ex16_solution
