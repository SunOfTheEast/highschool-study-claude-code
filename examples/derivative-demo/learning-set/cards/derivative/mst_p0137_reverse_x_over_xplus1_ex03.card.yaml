stem: |-
  （2022 秋 · 龙凤区校级期末）定义在 $(0,+\infty)$ 上的函数 $f(x)$ 的导函数为 $f^{\prime}(x)$，且 $f(x)+(x^2+x)f^{\prime}(x)<0$ 恒成立，则（  ）
  A. $4f(2)<3f(1)$
  B. $8f(2)<9f(3)$
  C. $3f(3)>2f(1)$
  D. $15f(3)>16f(4)$
answer: |
  AD

  设
  \[
  g(x)=\frac{xf(x)}{x+1},\quad x>0.
  \]
  则
  \[
  g^{\prime}(x)=
  \frac{[f(x)+xf^{\prime}(x)](x+1)-xf(x)}{(x+1)^2}
  =\frac{f(x)+(x^2+x)f^{\prime}(x)}{(x+1)^2}.
  \]
  由题设 $f(x)+(x^2+x)f^{\prime}(x)<0$，得 $g^{\prime}(x)<0$，所以
  $g$ 在 $(0,+\infty)$ 递减，即
  \[
  g(1)>g(2)>g(3)>g(4).
  \]
  代入可得
  \[
  \frac{f(1)}{2}>\frac{2f(2)}{3}>\frac{3f(3)}{4}>\frac{4f(4)}{5}.
  \]
  因而
  \[
  4f(2)<3f(1)\quad(\text{A对}),
  \]
  \[
  8f(2)>9f(3)\quad(\text{B错}),
  \]
  \[
  3f(3)<2f(1)\quad(\text{C错}),
  \]
  \[
  15f(3)>16f(4)\quad(\text{D对}).
  \]
  故选 AD。
