  student_title: 把“$f+(x^2+x)f^{\prime}$”反构成 $\frac{xf}{x+1}$ 的递减链
  what_it_trains: 训练在分式反构题里识别 $x/(x+1)$ 模板，并通过固定点链快速完成多选判定。
  recognition_cues:
    - 题设直接给出 $f(x)+(x^2+x)f^{\prime}(x)$。
    - 选项集中比较 $f(1),f(2),f(3),f(4)$ 的线性组合。
    - 解析往往只需一次构造即可覆盖全选项。
  normalization_moves:
    - 先构造 $g=\frac{xf}{x+1}$ 并验导。
    - 用 $g^{\prime}<0$ 建立 $1,2,3,4$ 的递减链。
    - 按系数同乘回到选项表达。
  common_failures:
    - 把 $g^{\prime}(x)$ 分子整理错，漏掉 $-xf(x)$。
    - 从链式比较回代时把不等号方向翻转。
    - 忽略原图排版错误，误把末项写成 $f(5)$ 导致与 D 项冲突。
