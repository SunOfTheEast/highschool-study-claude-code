stem: |-
  （26陪跑课答疑，朱茜瑶）已知 $a=\log_6 2,\ b=\log_{12}3,\ c=\log_{40}5$，则 $a,b,c$ 的大小关系为（  ）
  A. $a<b<c$
  B. $b<a<c$
  C. $c<a<b$
  D. $a<c<b$
answer: |
  D

  先取倒数：
  \[
  \frac1a=\log_2 6=1+\frac{\ln3}{\ln2},\quad
  \frac1b=\log_3 12=1+\frac{\ln4}{\ln3},\quad
  \frac1c=\log_5 40=1+\frac{\ln8}{\ln5}.
  \]
  比较三个分式核心量：
  \[
  \frac{\ln3}{\ln2}
  >\frac{\ln3+\ln\frac32}{\ln2+\ln\frac32}
  >\frac{\ln4}{\ln3},
  \]
  且
  \[
  \frac{\ln4}{\ln3}
  =\frac{\ln64}{\ln27}
  <\frac{\ln64}{\ln25}
  =\frac{\ln8}{\ln5},
  \]
  同时
  \[
  \frac{\ln3}{\ln2}
  =\frac{\ln9}{\ln4}
  >\frac{\ln8}{\ln5}.
  \]
  所以
  \[
  \frac1a>\frac1c>\frac1b.
  \]
  三者均为正数，取倒数后不等号反向，得
  \[
  a<c<b.
  \]
  故选 D。
