solution:
  source_solution_summary: |
    先取倒数：
    \[
    \frac1a=\log_2 6=1+\frac{\ln3}{\ln2},\quad
    \frac1b=\log_3 12=1+\frac{\ln4}{\ln3},\quad
    \frac1c=\log_5 40=1+\frac{\ln8}{\ln5}.
    \]
    比较三个分式核心量：
    \[
    \frac{\ln3}{\ln2}
    >\frac{\ln3+\ln\frac32}{\ln2+\ln\frac32}
    >\frac{\ln4}{\ln3},
    \]
    且
    \[
    \frac{\ln4}{\ln3}
    =\frac{\ln64}{\ln27}
    <\frac{\ln64}{\ln25}
    =\frac{\ln8}{\ln5},
    \]
    同时
    \[
    \frac{\ln3}{\ln2}
    =\frac{\ln9}{\ln4}
    >\frac{\ln8}{\ln5}.
    \]
    所以
    \[
    \frac1a>\frac1c>\frac1b.
    \]
    三者均为正数，取倒数后不等号反向，得
    \[
    a<c<b.
    \]
    故选 D。
  key_steps:
    - step_id: step_1
      statement: 先倒数化，把对数底真数关系转成“1+分式”比较。
      formula_trace:
        from: $a=\log_6 2,\ b=\log_{12}3,\ c=\log_{40}5$
        to: $\frac1a=1+\frac{\ln3}{\ln2},\ \frac1b=1+\frac{\ln4}{\ln3},\ \frac1c=1+\frac{\ln8}{\ln5}$
        operation: 用 $\frac1{\log_m n}=\log_n m$ 并拆成 $1+$ 形式。
        why: 三项统一为同型分式，便于应用糖水不等式。
      source_ref: page_0147_ex15_solution
    - step_id: step_2
      statement: 用糖水不等式得到左段夹逼。
      formula_trace:
        from: $\frac{\ln3}{\ln2}$ 与 $\frac{\ln4}{\ln3}$
        to: $\frac{\ln3}{\ln2}>\frac{\ln3+\ln(3/2)}{\ln2+\ln(3/2)}>\frac{\ln4}{\ln3}$
        operation: 对比值同时加同一正量构造中间分式。
        why: 建立 $\frac{\ln3}{\ln2}$ 大于 $\frac{\ln4}{\ln3}$ 的稳定通路。
      source_ref: page_0147_ex15_solution
    - step_id: step_3
      statement: 比较 $\frac{\ln4}{\ln3}$ 与 $\frac{\ln8}{\ln5}$。
      formula_trace:
        from: $\frac{\ln4}{\ln3}$
        to: $\frac{\ln4}{\ln3}=\frac{\ln64}{\ln27}<\frac{\ln64}{\ln25}=\frac{\ln8}{\ln5}$
        operation: 同分子化后比较分母大小。
        why: 定位中间项与右项顺序。
      source_ref: page_0147_ex15_solution
    - step_id: step_4
      statement: 补齐 $\frac{\ln3}{\ln2}$ 与 $\frac{\ln8}{\ln5}$ 的直接关系。
      formula_trace:
        from: $\frac{\ln3}{\ln2}$
        to: $\frac{\ln3}{\ln2}=\frac{\ln9}{\ln4}>\frac{\ln8}{\ln5}$
        operation: 同构改写为“同序幂比值”再比较。
        why: 完成三项严格全序。
      source_ref: page_0147_ex15_solution
    - step_id: step_5
      statement: 回到原变量并选项匹配。
      formula_trace:
        from: $\frac1a>\frac1c>\frac1b$
        to: $a<c<b$，选 D
        operation: 对正数取倒数，不等号方向反转。
        why: 得到题目要求的 $a,b,c$ 顺序。
      source_ref: page_0147_ex15_solution
