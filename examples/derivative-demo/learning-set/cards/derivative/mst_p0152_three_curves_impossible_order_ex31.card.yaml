teaching_card:
  student_title: 三曲线同高截线下的必错顺序排除
  what_it_trains: 训练把多变量条件统一成“同函数值”后，先抓一个恒成立的必要关系做快速排除。
  recognition_cues:
    - 题干出现多个表达式“都等于同一个值”。
    - 选项是多个顺序链，问“哪项一定不成立”。
    - 题内附有指数/对数/双曲线同图。
  normalization_moves:
    - 先除去公共因子，得到同值参数 $m$。
    - 切换到同一水平线截交图像。
    - 先用恒成立关系筛掉矛盾选项。
  common_failures:
    - 忘记先约去 $x_3$，导致三式关系看不出同值结构。
    - 把“恒成立的必要关系”当成“完整全序”，过度推断。
    - 忽略定义域，误把 $x_2$ 放到非正区间。
  similar_practice_query: e^{-x} -lnx -1/x 同高截线 交点横坐标 排除法
