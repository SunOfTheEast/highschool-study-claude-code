stem: |-
  若 $e^{-x_1}\cdot x_3=-\ln x_2\cdot x_3=-1$，则下列不等式一定不成立的是（  ）
  A. $x_1<x_2<x_3$
  B. $x_3<x_1<x_2$
  C. $x_3<x_2<x_1$
  D. $x_1<x_3<x_2$
answer: |
  A

  由
  \[
  e^{-x_1}\cdot x_3=-\ln x_2\cdot x_3=-1
  \]
  且 $x_3\neq0$，可化为
  \[
  e^{-x_1}=-\ln x_2=-\frac{1}{x_3}=m.
  \]
  这表示同一水平线 $y=m$ 分别与
  \[
  y=e^{-x},\quad y=-\ln x,\quad y=-\frac1x
  \]
  的交点横坐标依次为 $x_1,x_2,x_3$。
  由源图与续页结论可知恒有
  \[
  x_2>x_3.
  \]
  因而选项 A 中 $x_1<x_2<x_3$ 与 $x_2>x_3$ 矛盾，A 一定不成立。
  故选 A。
