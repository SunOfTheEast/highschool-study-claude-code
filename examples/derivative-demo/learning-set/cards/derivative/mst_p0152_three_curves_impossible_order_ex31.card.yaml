    由
    \[
    e^{-x_1}\cdot x_3=-\ln x_2\cdot x_3=-1
    \]
    且 $x_3\neq0$，可化为
    \[
    e^{-x_1}=-\ln x_2=-\frac{1}{x_3}=m.
    \]
    这表示同一水平线 $y=m$ 分别与
    \[
    y=e^{-x},\quad y=-\ln x,\quad y=-\frac1x
    \]
    的交点横坐标依次为 $x_1,x_2,x_3$。
    由源图与续页结论可知恒有
    \[
    x_2>x_3.
    \]
    因而选项 A 中 $x_1<x_2<x_3$ 与 $x_2>x_3$ 矛盾，A 一定不成立。
    故选 A。
  key_steps:
    - step_id: step_1
      statement: 将条件除以 $x_3$，统一成同一函数值 $m$。
      formula_trace:
        from: $e^{-x_1}\cdot x_3=-\ln x_2\cdot x_3=-1$
        to: $e^{-x_1}=-\ln x_2=-1/x_3=m$
        operation: 利用 $x_3\neq0$ 约去公共因子 $x_3$。
        why: 把三未知量变成三条曲线在同一高度处的横坐标。
      source_ref: page_0152_ex31_problem
    - step_id: step_2
      statement: 将统一式解释为三条曲线与同一水平线的交点。
      formula_trace:
        from: $e^{-x}=m,\ -\ln x=m,\ -1/x=m$
        to: $x_1,x_2,x_3$ 分别是三曲线与 $y=m$ 的交点横坐标
        operation: 把代数等式转为图像交点语义。
        why: 便于直接读取必要顺序关系。
      source_ref: page_0152_ex31_figure
