original_problem:
  stem: 求证：
  parts: *a1
  choices: []
  answer: 三个不等式均成立，证明见解析。
  fidelity_notes:
    - 源文中的 ex 按惯例读作 e\cdot x，不是 e^x。
solution:
  source_solution_summary: 三问都用作商法，把右侧除以 e^x 后证明商不超过 1。第 (1) 问令 F_1(x)=\frac{x^2+1}{e^x}，则 F_1'(x)=-\frac{(x-1)^2}{e^x}\leqslant0， x\geqslant0 时最大值在 x=0，为 1。第 (2) 问令 F_2(x)=\frac{ex}{e^x}， 导数符号显示最大值在 x=1，为 1。第 (3) 问令 F_3(x)=\frac{ex+(x-1)^2}{e^x}，导数为 -\frac{(x-1)(x+e-3)}{e^x}； 在 x\geqslant0 上分段单调，且 F_3(0)=F_3(1)=1，所以 F_3(x)\leqslant1。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问把证明转成商函数不超过 1。
      formula_trace:
        from: e^x\geqslant x^2+1
        to: F_1(x)=\frac{x^2+1}{e^x}\leqslant1
        operation: 两边除以正数 e^x。
        why: 作商后导数中出现 2x-(x^2+1)=-(x-1)^2。
      source_ref: page_0047_solution
    - step_id: step_2
      statement: 用单调性证明第 (1) 问。
      formula_trace:
        from: F_1'(x)=\frac{2x-x^2-1}{e^x}
        to: F_1'(x)=-\frac{(x-1)^2}{e^x}\leqslant0,\quad F_1(0)=1
        operation: 因式分解导数分子，并在 x\geqslant0 上取左端最大值。
        why: F_1 单调递减，所以 \frac{x^2+1}{e^x}\leqslant1。
      source_ref: page_0047_solution
    - step_id: step_3
      statement: 第 (2) 问证明 e^x\geqslant e\cdot x。
      formula_trace:
        from: F_2(x)=\frac{ex}{e^x}
        to: F_2'(x)=\frac{e(1-x)}{e^x},\quad F_2(1)=1
        operation: 作商并求导，导数在 x=1 左正右负。
        why: F_2 的最大值为 1，所以 e^x\geqslant ex。
      source_ref: page_0048
    - step_id: step_4
      statement: 第 (3) 问继续把右侧整体作商。
      formula_trace:
        from: e^x\geqslant ex+(x-1)^2
        to: F_3(x)=\frac{ex+(x-1)^2}{e^x}\leqslant1
        operation: 两边除以 e^x，保留右侧两个贴着切点的项。
        why: 这个商的导数可以分解出两个临界点 3-e 与 1。
      source_ref: page_0048
    - step_id: step_5
      statement: 分析 F_3 的导数和端点值。
      formula_trace:
        from: F_3'(x)
        to: F_3'(x)=-\frac{(x-1)(x+e-3)}{e^x},\quad F_3(0)=F_3(1)=1
        operation: 求导并分解，得到 F_3 在 (0,3-e)、(1,+\infty) 递减，在 (3-e,1) 递增。
        why: x\geqslant0 上的最大值只在 0 或 1 处达到，均为 1。
      source_ref: page_0048
teaching_card:
  student_title: 把右侧除以 e^x，找指数函数的“基友”
  what_it_trains: 训练遇到 e^x 压多项式或切线型表达时，先作商，再让导数自动出现可分解的差式。
  recognition_cues:
    - 目标形如 e^x\geqslant 右侧函数。
    - 右侧在某个切点附近和 e^x 同值。
    - 直接相减求导不如除以 e^x 简洁。
  normalization_moves:
    - 把证明统一成 F(x)=右侧/e^x\leqslant1。
    - 求 F'(x) 并分解出平方或一次因子。
    - 用 F 的最大值等于 1 收尾。
  common_failures:
    - 把 e\cdot x 看成 e^x，导致第 (2)(3) 问完全变形。
    - 第 (1) 问没有利用 x\geqslant0，只知道导数非正却不取 F(0)。
    - 第 (3) 问漏掉临界点 3-e，单调区间写不全。
  similar_practice_query: e^x 证明大于多项式或切线表达，作商后用指数找基友
