stem: |-
  求证：
  (1). （2018 · 新课标 Ⅱ 卷）e^x\geqslant x^2+1 (x\geqslant0)。
  (2). e^x\geqslant ex。
  (3). e^x\geqslant ex+(x-1)^2 (x\geqslant0)。
answer: |-
  三个不等式均成立，证明见解析。

  三问都用作商法，把右侧除以 e^x 后证明商不超过 1。第 (1) 问令 F_1(x)=\frac{x^2+1}{e^x}，则 F_1'(x)=-\frac{(x-1)^2}{e^x}\leqslant0， x\geqslant0 时最大值在 x=0，为 1。第 (2) 问令 F_2(x)=\frac{ex}{e^x}， 导数符号显示最大值在 x=1，为 1。第 (3) 问令 F_3(x)=\frac{ex+(x-1)^2}{e^x}，导数为 -\frac{(x-1)(x+e-3)}{e^x}； 在 x\geqslant0 上分段单调，且 F_3(0)=F_3(1)=1，所以 F_3(x)\leqslant1。
