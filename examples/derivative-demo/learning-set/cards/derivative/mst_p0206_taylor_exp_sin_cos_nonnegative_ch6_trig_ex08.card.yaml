  student_title: 泰勒三问联动：估值到综合不等式
  what_it_trains: 训练“先用展开写项与估值，再把复杂不等式拆成标准非负块”的连贯处理能力。
  recognition_cues:
    - 题目先给泰勒材料，再给展开、估值、证明三连问。
    - 第(3)问含 $e^x,\sin x,\cos x$ 的综合式。
    - 可通过低阶展开与基础三角不等式快速收束。
  normalization_moves:
    - 围绕 $x=0$ 写出低阶展开。
    - 代入特定数值做截断近似。
    - 证明时先压指数，再拆三角差值并联判号。
  common_failures:
    - 把 $\frac1{1-x}$ 只写成有限多项式，漏“前4项”语义。
    - 估算 $\sin\frac12$ 时忽略交错级数的符号方向。
    - 第(3)问漏掉 $1-\cos x\ge0$ 这一块，导致链路不闭合。
