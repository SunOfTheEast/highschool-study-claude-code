stem: |-
  （2024 · 安徽合肥八中高二期中 T19）给出泰勒公式在 $x=0$ 的特殊形式（麦克劳林形式）及高阶导定义，完成下列三问。
  (1) 写出 $f(x)=\frac{1}{1-x}$ 的泰勒展开式（只需写前 4 项）。
  (2) 根据泰勒公式估算 $\sin\frac12$ 的值，精确到小数点后两位。
  (3) 证明：当 $x\geqslant0$ 时，$e^x-\frac{x^2}{2}-\sin x-\cos x\geqslant0$。
answer: |-
  (1) $1+x+x^2+x^3$；(2) $\sin\frac12\approx0.48$；(3) 不等式成立。

  第(1)问： $\frac1{1-x}=1+x+x^2+x^3+\cdots$，故前4项为 $1+x+x^2+x^3$。 第(2)问： $\sin x=x-\frac{x^3}{3!}+\frac{x^5}{5!}-\cdots$， 代 $x=\frac12$ 得 $\sin\frac12=\frac12-\frac1{48}+\cdots\approx0.48$。 第(3)问法一： $x\ge0$ 时 $e^x\ge1+x+\frac{x^2}{2}$， 因而 $e^x-\frac{x^2}{2}-\sin x-\cos x \ge1+x-\sin x-\cos x =(1-\cos x)+(x-\sin x)\ge0$。 source 还给出法二：构造 $G(x)=e^x-\frac{x^2}{2}-\sin x-\cos x$， 在 $[0,\frac{3\pi}{4})$ 与 $[\frac{3\pi}{4},+\infty)$ 分段，再以 $F(x)=e^x-\frac{x^2}{2}-2$ 收束，同样可证结论。
