    - 第(3)问 source 同时给出法一与法二；本卡主线采用法一，法二作为补充。
solution:
  source_solution_summary: 第(1)问： $\frac1{1-x}=1+x+x^2+x^3+\cdots$，故前4项为 $1+x+x^2+x^3$。 第(2)问： $\sin x=x-\frac{x^3}{3!}+\frac{x^5}{5!}-\cdots$， 代 $x=\frac12$ 得 $\sin\frac12=\frac12-\frac1{48}+\cdots\approx0.48$。 第(3)问法一： $x\ge0$ 时 $e^x\ge1+x+\frac{x^2}{2}$， 因而 $e^x-\frac{x^2}{2}-\sin x-\cos x \ge1+x-\sin x-\cos x =(1-\cos x)+(x-\sin x)\ge0$。 source 还给出法二：构造 $G(x)=e^x-\frac{x^2}{2}-\sin x-\cos x$， 在 $[0,\frac{3\pi}{4})$ 与 $[\frac{3\pi}{4},+\infty)$ 分段，再以 $F(x)=e^x-\frac{x^2}{2}-2$ 收束，同样可证结论。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：写出 $\frac1{1-x}$ 的前 4 项。
      formula_trace:
        from: $f(x)=\frac1{1-x}$
        to: $f(x)=1+x+x^2+x^3+\cdots$
        operation: 按 0 点泰勒/几何级数形式展开。
        why: 题目只要求前四项。
      source_ref: page_0207_ex08_solution
    - step_id: step_2
      statement: 第(2)问：代入 $\sin x$ 展开估值。
      formula_trace:
        from: $\sin x=x-\frac{x^3}{3!}+\frac{x^5}{5!}-\cdots$
        to: $\sin\frac12=\frac12-\frac1{48}+\cdots\approx0.48$
        operation: 取前两项近似并给出两位小数。
        why: 完成数值估算要求。
      source_ref: page_0207_ex08_solution
    - step_id: step_3
      statement: 第(3)问法一：先给指数下界。
      formula_trace:
        from: $e^x-\frac{x^2}{2}-\sin x-\cos x$
        to: $e^x-\frac{x^2}{2}-\sin x-\cos x\ge1+x-\sin x-\cos x$
        operation: 用 $e^x\ge1+x+\frac{x^2}{2}\ (x\ge0)$。
        why: 把指数项替换为低阶多项式便于并联判号。
      source_ref: page_0207_ex08_solution
    - step_id: step_4
      statement: 第(3)问法一：拆成两块并联非负。
      formula_trace:
        from: $1+x-\sin x-\cos x$
        to: $(1-\cos x)+(x-\sin x)\ge0$
        operation: 分别用 $1-\cos x\ge0$ 与 $x-\sin x\ge0\ (x\ge0)$。
        why: 直接得到目标不等式非负。
      source_ref: page_0207_ex08_solution
    - step_id: step_5
      statement: 补充：source 的法二分段思路。
      formula_trace:
        from: $G(x)=e^x-\frac{x^2}{2}-\sin x-\cos x$
        to: 在 $[0,\frac{3\pi}{4})$ 判 $G$ 单调，在 $[\frac{3\pi}{4},+\infty)$ 比较到 $F(x)=e^x-\frac{x^2}{2}-2$
        operation: 构造导函数与分段下界。
        why: 提供与法一不同的验证路径。
      source_ref: page_0207_ex08_solution
