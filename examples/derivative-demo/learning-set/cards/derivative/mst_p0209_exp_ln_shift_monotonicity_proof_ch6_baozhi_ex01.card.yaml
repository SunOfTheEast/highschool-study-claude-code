original_problem:
  stem: （2013 · 新课标II T21）已知函数 $f(x)=e^x-\ln(x+m)$。
  parts: *a1
  choices: []
  answer: (1) $m=1$，$f(x)$ 在 $(-1,0)$ 上单调递减、在 $(0,+\infty)$ 上单调递增；(2) 当 $m\leqslant2$ 时，恒有 $f(x)>0$。
  fidelity_notes:
    - 源题为两问解答题，无选项。
    - 第(2)问证明在 page_0209 起写，page_0210 顶部续完。
solution:
  source_solution_summary: 第(1)问先由极值点必要条件求参：$f^{\prime}(x)=e^x-\frac{1}{x+m}$， 代入 $x=0$ 得 $m=1$。随后在定义域 $(-1,+\infty)$ 上判号： $f^{\prime}(x)=\frac{e^x(x+1)-1}{x+1}$，令 $g(x)=e^x(x+1)-1$，有 $g^{\prime}(x)=e^x(x+2)>0$，且 $g(0)=0$，故 $f^{\prime}(x)$ 在 $(-1,0)$ 为负、在 $(0,+\infty)$ 为正，从而先减后增。第(2)问沿用法二， 令 $h(t)=e^t-t-1$，把 $f(x)=e^x-\ln(x+m)$ 改写为 $h(x)+h(\ln(x+m))+2-m$；其中前两项非负，且 $m\leqslant2$ 时 $2-m\geqslant0$。再由 source 的取等条件说明三项不能同时为零，故 $f(x)>0$。
  key_steps:
    - step_id: step_1
      statement: 用极值点必要条件确定参数 $m$。
      formula_trace:
        from: $f(x)=e^x-\ln(x+m),\ f^{\prime}(x)=e^x-\frac{1}{x+m},\ x=0$ 是极值点
        to: $f^{\prime}(0)=1-\frac{1}{m}=0\Rightarrow m=1$
        operation: 内点极值处令导数为零。
        why: 第(1)问先定参，后续单调区间才可判定。
      source_ref: page_0209_ex01_solution
    - step_id: step_2
      statement: 将导数判号转化为单调函数 $g(x)$ 的符号。
      formula_trace:
        from: $m=1,\ f^{\prime}(x)=e^x-\frac{1}{x+1}$
        to: $f^{\prime}(x)=\frac{e^x(x+1)-1}{x+1},\ g(x)=e^x(x+1)-1$
        operation: 通分并抽取分子函数。
        why: 在 $x>-1$ 时分母恒正，符号只由 $g(x)$ 决定。
      source_ref: page_0209_ex01_solution
    - step_id: step_3
      statement: 由 $g(x)$ 的单调性给出 $f(x)$ 的单调区间。
      formula_trace:
        from: $g^{\prime}(x)=e^x(x+2)>0,\ g(0)=0$
        to: $-1<x<0$ 时 $f^{\prime}(x)<0$，$x>0$ 时 $f^{\prime}(x)>0$
        operation: 先判 $g$ 在 $(-1,+\infty)$ 递增，再由过零点读符号。
        why: 导数符号分段对应“先减后增”。
      source_ref: page_0209_ex01_solution
    - step_id: step_4
      statement: 第(2)问做保值拆分并引入余量。
      formula_trace:
        from: $f(x)=e^x-\ln(x+m)$
        to: $f(x)=e^x-x-1+(x+m)-\ln(x+m)-1+2-m=h(x)+h(\ln(x+m))+2-m$
        operation: 加减 $x,1,m$ 并套入 $h(t)=e^t-t-1$。
        why: 把目标拆成两个标准非负块与一个参数余量。
      source_ref: page_0209_ex01_solution
    - step_id: step_5
      statement: 分别得到三项非负。
      formula_trace:
        from: $h(t)=e^t-t-1,\ m\leqslant2$
        to: $h(x)\geqslant0,\ h(\ln(x+m))\geqslant0,\ 2-m\geqslant0$
        operation: 前两项用指数/对数基础不等式，余量项用题设参数范围。
        why: 先建立非负和结构，再处理严格号。
      source_ref: page_0210_ex01_solution_cont
    - step_id: step_6
      statement: 用“不能同取零”收束到严格不等式。
      formula_trace:
        from: $f(x)=h(x)+h(\ln(x+m))+2-m$
        to: $f(x)>0$
        operation: 调用 source 的取等条件说明三项不可能同时为零。
        why: 避免仅得到 $f(x)\geqslant0$，完成题目要求的严格大于。
      source_ref: page_0210_ex01_solution_cont
teaching_card:
  student_title: 先定参判单调，再用余量锁死严格号
  what_it_trains: 训练同一道题内切换“导数判号链”和“保值拆分链”，并在最后一步处理“不能同取零”。
  recognition_cues:
    - 题干前问给极值点，后问给参数范围并要求严格不等式。
    - 函数主体是“指数项 - 对数项”，常见 $h(t)=e^t-t-1$ 模板。
    - 证明阶段出现“余量函数”字样或常数尾项。
  normalization_moves:
    - 先做 $f^{\prime}(0)=0$ 定参，再独立完成单调区间。
    - 把原式改写成 $h(\cdot)+h(\cdot)+$ 余量。
    - 最后显式检查等号是否可同时成立。
  common_failures:
    - 只求出 $m=1$，漏写第(1)问单调区间。
    - 第(2)问只证到 $f(x)\geqslant0$，没有补“严格大于”的同取零排除。
    - 忽略定义域 $x+m>0$，导致取等条件讨论失真。
  similar_practice_query: e^x-lnxm 极值点 定参 单调 保值性 余量函数 严格不等式
