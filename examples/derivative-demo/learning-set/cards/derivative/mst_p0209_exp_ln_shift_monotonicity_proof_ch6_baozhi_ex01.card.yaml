stem: |-
  （2013 · 新课标II T21）已知函数 $f(x)=e^x-\ln(x+m)$。
  (1). 设 $x=0$ 是 $f(x)$ 的极值点，求 $m$，并讨论 $f(x)$ 的单调性。
  (2). 当 $m\leqslant2$ 时，证明 $f(x)>0$。
answer: |-
  (1) $m=1$，$f(x)$ 在 $(-1,0)$ 上单调递减、在 $(0,+\infty)$ 上单调递增；(2) 当 $m\leqslant2$ 时，恒有 $f(x)>0$。

  第(1)问先由极值点必要条件求参：$f^{\prime}(x)=e^x-\frac{1}{x+m}$， 代入 $x=0$ 得 $m=1$。随后在定义域 $(-1,+\infty)$ 上判号： $f^{\prime}(x)=\frac{e^x(x+1)-1}{x+1}$，令 $g(x)=e^x(x+1)-1$，有 $g^{\prime}(x)=e^x(x+2)>0$，且 $g(0)=0$，故 $f^{\prime}(x)$ 在 $(-1,0)$ 为负、在 $(0,+\infty)$ 为正，从而先减后增。第(2)问沿用法二， 令 $h(t)=e^t-t-1$，把 $f(x)=e^x-\ln(x+m)$ 改写为 $h(x)+h(\ln(x+m))+2-m$；其中前两项非负，且 $m\leqslant2$ 时 $2-m\geqslant0$。再由 source 的取等条件说明三项不能同时为零，故 $f(x)>0$。
