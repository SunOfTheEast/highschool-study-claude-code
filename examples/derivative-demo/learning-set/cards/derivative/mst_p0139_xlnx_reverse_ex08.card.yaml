teaching_card:
  student_title: 反解 f 后，分三层判 A/B、C、D
  what_it_trains: 训练“先显式化，再按选项目标分构造”的多选题处理路径。
  recognition_cues:
    - 条件是 $xf^{\prime}+f=\text{含 }\ln x\text{ 的函数}$。
    - 选项同时涉及函数值、极值点、方程根与比例不等式。
  normalization_moves:
    - 先解出 $f(x)=\ln x+2/x$。
    - A/B 用 $f^{\prime}$ 判极值。
    - C 用 $y=f-x$，D 用 $g=f/x$。
  common_failures:
    - 把 $x=2$ 的极小值点误判为极大值点。
    - 对 C 只证“有根”但未证“唯一根”。
    - D 只在单点估计 k，未处理全体 x。
