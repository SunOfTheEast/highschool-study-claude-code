    - step_id: step_1
      statement: 先由 $(xf)'$ 模板还原出 f 的显式表达。
      formula_trace:
        from: $xf^{\prime}(x)+f(x)=1+\ln x$
        to: $f(x)=\ln x+\frac{2}{x}$
        operation: 积分 $ (xf)'=1+\ln x $ 并用 $f(1)=2$ 定常数。
