stem: |-
  （2023·常熟市月考·多选）已知函数 $f(x)$ 及其导函数 $f^{\prime}(x)$ 满足 $xf^{\prime}(x)+f(x)=1+\ln x$，$f(1)=2$，则下列说法正确的是（ ）
  A. $f(2)=1+\ln 2$
  B. $x=2$ 是函数 $f(x)$ 的极大值点
  C. 方程 $f(x)=x$ 有且只有一个实根
  D. 存在 $k>0$，使得 $f(x)>kx$ 恒成立
answer: |
  AC

  由
  \[
  xf^{\prime}(x)+f(x)=1+\ln x
  \]
  识别
  \[
  (xf(x))'=1+\ln x.
  \]
  积分得
  \[
  xf(x)=x\ln x+C,\quad f(x)=\ln x+\frac{C}{x}.
  \]
  由 $f(1)=2$ 得 $C=2$，即
  \[
  f(x)=\ln x+\frac{2}{x},\quad f^{\prime}(x)=\frac{x-2}{x^2}.
  \]
  所以 $x=2$ 为极小值点，且
  \[
  f(2)=1+\ln2,
  \]
  A 对、B 错。

  设
  \[
  y=f(x)-x=\frac{2}{x}+\ln x-x,
  \]
  则
  \[
  y^{\prime}=\frac{-x^2+x-2}{x^2}<0,
  \]
  故 $y$ 单调递减。又 $y(1)=1>0,\ y(e)=\frac2e+1-e<0$，故 $y=0$ 仅有一解，C 对。

  对 D：由 $f(x)>kx$ 得
  \[
  k<\frac{2}{x^2}+\frac{\ln x}{x}=:g(x).
  \]
  源页用
  \[
  g^{\prime}(x)=\frac{-4+x-x\ln x}{x^3},\ h(x)=-4+x-x\ln x,\ h'(x)=-\ln x
  \]
  判断 $g$ 在 $x>0$ 上递减且无正下界，从而不存在统一的 $k>0$，D 错。
  故选 AC。
