solution:
  source_solution_summary: |
    在 $x\in\left(0,\frac{\pi}{2}\right)$ 上有 $\sin x>0,\cos x>0$。
    由
    \[
    f(x)>f^{\prime}(x)\tan x=f^{\prime}(x)\frac{\sin x}{\cos x}
    \]
    得
    \[
    f(x)\cos x-f^{\prime}(x)\sin x>0.
    \]
    设
    \[
    F(x)=\frac{f(x)}{\sin x},
    \]
    则
    \[
    F^{\prime}(x)=\frac{f^{\prime}(x)\sin x-f(x)\cos x}{\sin^2x}<0,
    \]
    故 $F$ 在 $\left(0,\frac{\pi}{2}\right)$ 递减。

    对 A：
    \[
    F\!\left(\frac{\pi}{6}\right)>F\!\left(\frac{\pi}{4}\right)
    \Rightarrow
    \sqrt2 f\!\left(\frac{\pi}{6}\right)>f\!\left(\frac{\pi}{4}\right),
    \]
    与 A 相反，A 错。

    对 B：
    \[
    F\!\left(\frac{\pi}{4}\right)>F\!\left(\frac{\pi}{3}\right)
    \Rightarrow
    \sqrt6 f\!\left(\frac{\pi}{4}\right)>2f\!\left(\frac{\pi}{3}\right),
    \]
    与 B 相反，B 错。

    对 C：
    \[
    F\!\left(\frac{5\pi}{12}\right)<F\!\left(\frac{\pi}{6}\right),
    \]
    且
    \[
    \sin\frac{5\pi}{12}
    =\sin\!\left(\frac{\pi}{4}+\frac{\pi}{6}\right)
    =\frac{\sqrt6+\sqrt2}{4},
    \]
    化简得
    \[
    (\sqrt6-\sqrt2)f\!\left(\frac{5\pi}{12}\right)<2f\!\left(\frac{\pi}{6}\right),
    \]
    C 正确。

    对 D：
    \[
    F\!\left(\frac{\pi}{12}\right)>F\!\left(\frac{\pi}{6}\right),
    \]
    且
    \[
    \sin\frac{\pi}{12}
    =\sin\!\left(\frac{\pi}{4}-\frac{\pi}{6}\right)
    =\frac{\sqrt6-\sqrt2}{4},
    \]
    得
    \[
    (\sqrt6+\sqrt2)f\!\left(\frac{\pi}{12}\right)>2f\!\left(\frac{\pi}{6}\right),
    \]
    与 D 相反，D 错。故选 C。
  key_steps:
    - step_id: step_1
      statement: 把题设转为可构造的比值导数符号。
      formula_trace:
        from: $f(x)>f^{\\prime}(x)\\tan x$
        to: $f(x)\\cos x-f^{\\prime}(x)\\sin x>0$
        operation: 利用 $\\tan x=\\frac{\\sin x}{\\cos x}$ 且 $\\sin x,\\cos x>0$。
        why: 为构造 $F(x)=\\frac{f(x)}{\\sin x}$ 的导数做准备。
      source_ref: page_0129
    - step_id: step_2
      statement: 构造 $F$ 并判单调。
      formula_trace:
        from: $F(x)=\\frac{f(x)}{\\sin x}$
        to: $F^{\\prime}(x)=\\frac{f^{\\prime}(x)\\sin x-f(x)\\cos x}{\\sin^2x}<0$
        operation: 商法求导并代入 step_1 结果。
        why: 得到定义域内递减性，用于统一判项。
      source_ref: page_0129
    - step_id: step_3
      statement: 利用递减性直接排除 A、B。
      formula_trace:
        from: |
          $F\!\left(\frac{\pi}{6}\right)>F\!\left(\frac{\pi}{4}\right),\
          F\!\left(\frac{\pi}{4}\right)>F\!\left(\frac{\pi}{3}\right)$
        to: |
          $\sqrt2 f\!\left(\frac{\pi}{6}\right)>f\!\left(\frac{\pi}{4}\right),\
          \sqrt6 f\!\left(\frac{\pi}{4}\right)>2f\!\left(\frac{\pi}{3}\right)$
        operation: 代入 $\\sin\\frac{\\pi}{6},\\sin\\frac{\\pi}{4},\\sin\\frac{\\pi}{3}$ 化简。
        why: 与 A、B 方向均相反。
      source_ref: page_0129
    - step_id: step_4
      statement: 用和角公式完成 C 的化简。
      formula_trace:
        from: $F\\left(\\frac{5\\pi}{12}\\right)<F\\left(\\frac{\\pi}{6}\\right)$ 与 $\\sin\\frac{5\\pi}{12}=\\frac{\\sqrt6+\\sqrt2}{4}$
        to: $(\\sqrt6-\\sqrt2)f\\left(\\frac{5\\pi}{12}\\right)<2f\\left(\\frac{\\pi}{6}\\right)$
        operation: 把比值不等式代入正弦值并有理化。
        why: 得到与 C 完全一致的表达。
      source_ref: page_0130
    - step_id: step_5
      statement: 用差角公式反驳 D。
      formula_trace:
        from: $F\\left(\\frac{\\pi}{12}\\right)>F\\left(\\frac{\\pi}{6}\\right)$ 与 $\\sin\\frac{\\pi}{12}=\\frac{\\sqrt6-\\sqrt2}{4}$
        to: $(\\sqrt6+\\sqrt2)f\\left(\\frac{\\pi}{12}\\right)>2f\\left(\\frac{\\pi}{6}\\right)$
        operation: 同样代入正弦值并化简。
        why: 与 D 给出的“小于”相反。
      source_ref: page_0130
teaching_card:
  student_title: 用 $\\frac{f}{\\sin x}$ 的递减性筛选四个三角不等式
  what_it_trains: 训练把“$f$ 与 $f^{\\prime}\\tan x$ 的比较”翻译成比值函数单调，再结合和差角精确化简到选项系数。
  recognition_cues:
    - 题设右边是 $f^{\\prime}(x)\\tan x$。
    - 选项全是 $\\frac{\\pi}{12},\\frac{\\pi}{6},\\frac{\\pi}{4},\\frac{\\pi}{3},\\frac{5\\pi}{12}$ 等特殊角。
    - 后两项出现 $(\\sqrt6\\pm\\sqrt2)$，通常来自和差角正弦。
  normalization_moves:
    - 先构造 $F=\\frac{f}{\\sin x}$ 并判 $F^{\\prime}<0$。
    - 先用递减性排 A、B。
    - 再把 C、D 写成 $F$ 比较并代入 $\\sin\\frac{5\\pi}{12},\\sin\\frac{\\pi}{12}$。
  common_failures:
    - 乘以 $\\cos x$ 时忘记定义域内 $\\cos x>0$。
    - 把 $F^{\\prime}$ 分子写成 $f\\cos-f^{\\prime}\\sin$ 后没再带负号。
    - 和差角公式中 $\\sin\\left(\\frac{\\pi}{4}-\\frac{\\pi}{6}\\right)$ 号写错。
    - 有理化后把 $(\\sqrt6-\\sqrt2)$ 与 $(\\sqrt6+\\sqrt2)$ 对调。
  similar_practice_query: 三角函数基础构造 f/\\sin x 单调 特殊角 和差角 不等式判断
