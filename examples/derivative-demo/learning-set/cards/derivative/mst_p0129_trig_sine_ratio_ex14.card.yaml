stem: |-
  （24-25 高二下 · 重庆 · 阶段练习）定义在 $\\left(0,\\frac{\\pi}{2}\\right)$ 上的函数 $f(x)$ 的导函数为 $f^{\\prime}(x)$，且对任意 $x\\in\\left(0,\\frac{\\pi}{2}\\right)$ 都有 $f(x)>f^{\\prime}(x)\\tan x$，下列说法正确的是（  ）
  A. $\\sqrt{2}f\\left(\\frac{\\pi}{6}\\right)<f\\left(\\frac{\\pi}{4}\\right)$
  B. $\\sqrt{6}f\\left(\\frac{\\pi}{4}\\right)<2f\\left(\\frac{\\pi}{3}\\right)$
  C. $(\\sqrt{6}-\\sqrt{2})f\\left(\\frac{5\\pi}{12}\\right)<2f\\left(\\frac{\\pi}{6}\\right)$
  D. $(\\sqrt{6}+\\sqrt{2})f\\left(\\frac{\\pi}{12}\\right)<2f\\left(\\frac{\\pi}{6}\\right)$
answer: |
  C

  在 $x\in\left(0,\frac{\pi}{2}\right)$ 上有 $\sin x>0,\cos x>0$。
  由
  \[
  f(x)>f^{\prime}(x)\tan x=f^{\prime}(x)\frac{\sin x}{\cos x}
  \]
  得
  \[
  f(x)\cos x-f^{\prime}(x)\sin x>0.
  \]
  设
  \[
  F(x)=\frac{f(x)}{\sin x},
  \]
  则
  \[
  F^{\prime}(x)=\frac{f^{\prime}(x)\sin x-f(x)\cos x}{\sin^2x}<0,
  \]
  故 $F$ 在 $\left(0,\frac{\pi}{2}\right)$ 递减。

  对 A：
  \[
  F\!\left(\frac{\pi}{6}\right)>F\!\left(\frac{\pi}{4}\right)
  \Rightarrow
  \sqrt2 f\!\left(\frac{\pi}{6}\right)>f\!\left(\frac{\pi}{4}\right),
  \]
  与 A 相反，A 错。

  对 B：
  \[
  F\!\left(\frac{\pi}{4}\right)>F\!\left(\frac{\pi}{3}\right)
  \Rightarrow
  \sqrt6 f\!\left(\frac{\pi}{4}\right)>2f\!\left(\frac{\pi}{3}\right),
  \]
  与 B 相反，B 错。

  对 C：
  \[
  F\!\left(\frac{5\pi}{12}\right)<F\!\left(\frac{\pi}{6}\right),
  \]
  且
  \[
  \sin\frac{5\pi}{12}
  =\sin\!\left(\frac{\pi}{4}+\frac{\pi}{6}\right)
  =\frac{\sqrt6+\sqrt2}{4},
  \]
  化简得
  \[
  (\sqrt6-\sqrt2)f\!\left(\frac{5\pi}{12}\right)<2f\!\left(\frac{\pi}{6}\right),
  \]
  C 正确。

  对 D：
  \[
  F\!\left(\frac{\pi}{12}\right)>F\!\left(\frac{\pi}{6}\right),
  \]
  且
  \[
  \sin\frac{\pi}{12}
  =\sin\!\left(\frac{\pi}{4}-\frac{\pi}{6}\right)
  =\frac{\sqrt6-\sqrt2}{4},
  \]
  得
  \[
  (\sqrt6+\sqrt2)f\!\left(\frac{\pi}{12}\right)>2f\!\left(\frac{\pi}{6}\right),
  \]
  与 D 相反，D 错。故选 C。
