original_problem:
  stem: （2019 · 天津）设函数 $f(x)=\ln x-a(x-1)e^x$，其中 $a\in\mathbb R$。
  parts: *a1
  choices: []
  answer: 当 $a\le0$ 时，$f$ 在 $(0,+\infty)$ 单调递增；当 $0<a<\frac1e$ 时，$f$ 恰有两个零点，且右零点 $x_1$ 与极值点 $x_0$ 满足 $3x_0-x_1>2$。
  fidelity_notes:
    - 三问综合题，无选项。
    - 第(2)问的第二个零点指右侧零点，且题干已指定 $x_1>x_0$。
solution:
  source_solution_summary: $f^\prime(x)=\frac{1-ax^2e^x}{x}$。若 $a\le0$，则 $f^\prime(x)>0$，$f$ 在 $(0,+\infty)$ 上单调递增。若 $0<a<\frac1e$，先看导函数分子 $g(x)=1-ax^2e^x$，它在 $(0,+\infty)$ 上递减，且 $g(1)=1-ae>0$，$g(\ln\frac1a)=1-(\ln\frac1a)^2<0$，故 存在唯一极值点 $x_0\in(1,\ln\frac1a)$。又 $f(1)=0$， $f(x_0)>0$，并且 $f(x)=(x-1)(\frac{\ln x}{x-1}-ae^x)<(x-1)(1-ae^x)$，取 $x=\ln\frac1a$ 得 $f(\ln\frac1a)<0$，所以右侧有唯一零点 $x_1\in(x_0,\ln\frac1a)$。最后由 $f^\prime(x_0)=0$ 得 $a=\frac1{x_0^2e^{x_0}}$， 因而 $\ln\frac1a=2\ln x_0+x_0$。既然 $x_1<\ln\frac1a$，只需证 $3x_0>2+\ln\frac1a=2+2\ln x_0+x_0$，即 $x_0>\ln x_0+1$，这对 $x_0>1$ 成立。
  key_steps:
    - step_id: step_1
      statement: 先求导并处理 $a\le0$。
      formula_trace:
        from: $f(x)=\ln x-a(x-1)e^x$
        to: $f^\prime(x)=\frac{1-ax^2e^x}{x}$
        operation: 求导并通分。
        why: $a\le0$ 时分子大于 1，函数单调递增。
      source_ref: page_0249_ex26_solution_start
    - step_id: step_2
      statement: 用导函数分子的零点定位极值点。
      formula_trace:
        from: $g(x)=1-ax^2e^x$
        to: $x_0\in(1,\ln\frac1a)$
        operation: 证明 $g$ 递减，并用 $g(1)>0$、$g(\ln\frac1a)<0$ 夹出零点。
        why: 导函数零点就是原函数极值点。
      source_ref: page_0249_ex26_zero_of_derivative
    - step_id: step_3
      statement: 用显点 $x=1$ 得到第一个零点。
      formula_trace:
        from: $f(1)=0$
        to: 左侧零点为 $1$
        operation: 直接代入显点。
        why: 题目恰有两个零点，其中一个是显点。
      source_ref: page_0249_ex26_solution_start
    - step_id: step_4
      statement: 右侧用等效零点转化取点。
      formula_trace:
        from: $f(x)=(x-1)(\frac{\ln x}{x-1}-ae^x)$
        to: $f(\ln\frac1a)<0$
        operation: 用 $\frac{\ln x}{x-1}<1$ 放缩，并取 $x=\ln\frac1a$。
        why: 极值点处函数为正，右侧取到负值，保证第二个零点。
      source_ref: page_0250_ex26_continuation
    - step_id: step_5
      statement: 把 $a$ 用极值点 $x_0$ 表示。
      formula_trace:
        from: $f^\prime(x_0)=0$
        to: $a=\frac1{x_0^2e^{x_0}}$
        operation: 由导函数零点方程消去参数。
        why: 最后的不等式只需要转成关于 $x_0$ 的基础不等式。
      source_ref: page_0250_ex26_continuation
    - step_id: step_6
      statement: 用 $x_1<\ln\frac1a$ 降低证明目标。
      formula_trace:
        from: $x_1<\ln\frac1a$
        to: 只需证 $3x_0>2+\ln\frac1a$
        operation: 用右零点上界替代 $x_1$。
        why: 这样避开直接处理 $x_1$ 的隐式方程。
      source_ref: page_0250_ex26_continuation
    - step_id: step_7
      statement: 收束到 $x_0>\ln x_0+1$。
      formula_trace:
        from: $\ln\frac1a=2\ln x_0+x_0$
        to: $3x_0>2+2\ln x_0+x_0$
        operation: 代入 $a=\frac1{x_0^2e^{x_0}}$ 并化简。
        why: 等价于 $x_0>\ln x_0+1$，由 $x_0>1$ 成立。
      source_ref: page_0250_ex26_continuation
teaching_card:
  student_title: 显点、极值点、右零点连成一条链
  what_it_trains: 训练先抓住 $f(1)=0$ 这个显点，再找导函数隐零点和右侧零点，最后用极值点方程消参证明零点不等式。
  recognition_cues:
    - 题目给出 $\ln x-a(x-1)e^x$，显点 $x=1$ 会让两项同时归零。
    - 导函数分子是 $1-ax^2e^x$，极值点不可直接解。
    - 题目最后比较极值点 $x_0$ 和右零点 $x_1$。
    - 出现 $3x_0-x_1>2$，需要先给 $x_1$ 找上界。
  normalization_moves:
    - 先写 $f(1)=0$ 和 $f^\prime(1)>0$。
    - 用 $g(x)=1-ax^2e^x$ 夹出 $x_0$。
    - 用 $x=\ln\frac1a$ 夹出右零点。
    - 用 $f^\prime(x_0)=0$ 把 $a$ 换成 $x_0$。
    - 把目标化成 $x_0>\ln x_0+1$。
  common_failures:
    - 忽略 $f(1)=0$，把两个零点都当隐点处理。
    - 不会证明导函数零点 $x_0$ 存在且唯一。
    - 直接处理 $x_1$ 的方程，计算爆炸。
    - 忘记使用 $x_1<\ln\frac1a$ 这个关键上界。
  similar_practice_query: ln x - a(x-1)e^x 极隐零放 显点 f(1)=0 3x0-x1>2 极值点方程消参
