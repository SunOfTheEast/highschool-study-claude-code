stem: |-
  （2019 · 天津）设函数 $f(x)=\ln x-a(x-1)e^x$，其中 $a\in\mathbb R$。
  1. 若 $a\le0$，讨论 $f(x)$ 的单调性。
  2. 若 $0<a<\frac1e$，证明 $f(x)$ 恰有两个零点。
  3. 设 $x_0$ 为 $f(x)$ 的极值点，$x_1$ 为 $f(x)$ 的零点，且 $x_1>x_0$，证明：$3x_0-x_1>2$。
answer: |-
  当 $a\le0$ 时，$f$ 在 $(0,+\infty)$ 单调递增；当 $0<a<\frac1e$ 时，$f$ 恰有两个零点，且右零点 $x_1$ 与极值点 $x_0$ 满足 $3x_0-x_1>2$。

  $f^\prime(x)=\frac{1-ax^2e^x}{x}$。若 $a\le0$，则 $f^\prime(x)>0$，$f$ 在 $(0,+\infty)$ 上单调递增。若 $0<a<\frac1e$，先看导函数分子 $g(x)=1-ax^2e^x$，它在 $(0,+\infty)$ 上递减，且 $g(1)=1-ae>0$，$g(\ln\frac1a)=1-(\ln\frac1a)^2<0$，故 存在唯一极值点 $x_0\in(1,\ln\frac1a)$。又 $f(1)=0$， $f(x_0)>0$，并且 $f(x)=(x-1)(\frac{\ln x}{x-1}-ae^x)<(x-1)(1-ae^x)$，取 $x=\ln\frac1a$ 得 $f(\ln\frac1a)<0$，所以右侧有唯一零点 $x_1\in(x_0,\ln\frac1a)$。最后由 $f^\prime(x_0)=0$ 得 $a=\frac1{x_0^2e^{x_0}}$， 因而 $\ln\frac1a=2\ln x_0+x_0$。既然 $x_1<\ln\frac1a$，只需证 $3x_0>2+\ln\frac1a=2+2\ln x_0+x_0$，即 $x_0>\ln x_0+1$，这对 $x_0>1$ 成立。
