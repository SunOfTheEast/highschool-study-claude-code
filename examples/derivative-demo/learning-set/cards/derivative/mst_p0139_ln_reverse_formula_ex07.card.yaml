  key_steps:
    - step_id: step_1
      statement: 把题设改写成 $\left(\frac{f(x)}x\right)'$ 模板。
      formula_trace:
        from: $xf^{\prime}(x)-f(x)=x^2+x$
        to: $\left(\frac{f(x)}{x}\right)'=1+\frac1x$
        operation: 两边同除 $x^2$。
        why: 把未知函数关系转为可积分的一阶导数。
