stem: |-
  （2025·广东韶关北中月考）已知 $f(x)$ 的导函数 $f^{\prime}(x)$，若满足 $xf^{\prime}(x)-f(x)=x^2+x$，且 $f(1)\geqslant1$，则 $f(x)$ 的解析式可能是（ ）
  A. $x^2-x\ln x+x$
  B. $x^2-x\ln x-x$
  C. $x^2+x\ln x+x$
  D. $x^2+2x\ln x+x$
answer: |
  C

  由
  \[
  xf^{\prime}(x)-f(x)=x^2+x
  \]
  得
  \[
  \frac{xf^{\prime}(x)-f(x)}{x^2}=1+\frac1x
  \Rightarrow
  \left(\frac{f(x)}{x}\right)'=1+\frac1x.
  \]
  积分得
  \[
  \frac{f(x)}{x}=x+\ln x+C,
  \]
  所以
  \[
  f(x)=x^2+x\ln x+Cx.
  \]
  由 $f(1)\ge1$，
  \[
  1+C\ge1 \Rightarrow C\ge0.
  \]
  四个选项里与该族一致且常数满足条件的是
  \[
  x^2+x\ln x+x,
  \]
  即选 C。
