solution:
  source_solution_summary: |
    在 $x>0$ 上，把 $xe^x$ 写成 $e^{x+\ln x}$，令 $h(t)=e^t-t-1$。原式
    $xe^x-x-\ln x-a=e^{x+\ln x}-(x+\ln x)-1+1-a=h(x+\ln x)+1-a$。由于 $h(t)\\ge0$，且 $h(t)=0$ 当且仅当 $t=0$，又方程 $x+\ln x=0$ 在 $x>0$ 上有唯一解，所以原式的最小可能值为 $1-a$。恒成立等价于 $1-a\\ge0$，即 $a\\le1$。故选 C。
  key_steps:
    - step_id: step_1
      statement: 确认变量定义域。
      formula_trace:
        from: $\ln x$
        to: $x>0$
        operation: 由对数真数为正确定自然定义域。
        why: 后续 $x+\ln x=0$ 的取等点必须在这个定义域内。
      source_ref: page_0043
    - step_id: step_2
      statement: 把朗博项拿到指数里。
      formula_trace:
        from: $xe^x$
        to: $e^{x+\ln x}$
        operation: 用 $x=e^{\ln x}$，将乘积写成指数和。
        why: 这样能统一到 $e^t-t-1$ 的非负模板。
      source_ref: page_0043
    - step_id: step_3
      statement: 配出 $h(t)=e^t-t-1$。
      formula_trace:
        from: $xe^x-x-\ln x-a$
        to: $e^{x+\ln x}-(x+\ln x)-1+1-a=h(x+\ln x)+1-a
        operation: 把 $x+\ln x$ 作为整体，补出 $-1+1$。
        why: $h(t)\ge0$ 的等号点直接决定原式下界。
      source_ref: page_0043
    - step_id: step_4
      statement: 说明等号点可达。
      formula_trace:
        from: $x+\ln x=0$
        to: 存在唯一 $x_0>0$ 使 $h(x_0+\ln x_0)=0$
        operation: 函数 $x+\ln x$ 在 $(0,+\infty)$ 上严格递增，且极限从 $-\infty$ 到 $+\infty$。
        why: 只有等号点可达，才能把恒成立条件压到 $1-a\ge0$。
      source_ref: page_0043
    - step_id: step_5
      statement: 得到参数范围。
      formula_trace:
        from: $h(x+\ln x)+1-a\ge0$
        to: $1-a\ge0\Rightarrow a\le1$
        operation: 在取等点代入必要条件；反过来 $a\le1$ 时由 $h\ge0$ 保证恒成立。
        why: 必要性和充分性合在一起给出完整范围。
      source_ref: page_0043
teaching_card:
  student_title: 把 $xe^x$ 拿进指数，卡住 $a\le1$
  what_it_trains: 训练识别朗博型乘积 $xe^x$，把它改写成 $e^{x+\ln x}$ 后套 $e^t-t-1\ge0$，用等号点判断恒成立参数。
  recognition_cues:
    - 式子同时出现 $xe^x$、$x$、$\ln x$。
    - 结构正好能拼成 $e^{x+\ln x}-(x+\ln x)-1$。
    - 选项都是关于 $a$ 的上界。
  normalization_moves:
    - 先写出 $x>0$。
    - 把 $xe^x$ 改写为 $e^{x+\ln x}$。
    - 补 $-1+1$，配成 $h(x+\ln x)+1-a$。
    - 检查 $x+\ln x=0$ 的等号点存在。
  common_failures:
    - 把 $xe^x$ 当普通乘积求导硬做，错过 $e^t-t-1$ 模板。
    - 只用 $h\ge0$ 得 $a\le1$，忘记说明等号点确实能取到。
    - 误以为 $a$ 必须为正，排除掉正确答案中的负数。
  similar_practice_query: 朗博同构 xe^x x+lnx e^t-t-1 恒成立 参数上界
