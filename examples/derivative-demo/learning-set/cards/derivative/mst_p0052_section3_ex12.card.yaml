stem: |-
  （2025 厦门、泉州五校高二期中 T19）已知函数 $f(x)=e^x-\frac{1}{2}x^2-ax\ (a\in\mathbf{R})$。
  （1）若不等式 $f(x)\ge1$ 在 $x\in[0,+\infty)$ 上恒成立，求实数 $a$ 的取值范围；
  （2）若 $x>0$，求证：$\left(e^x-\frac{1}{2}x^2+1\right)\ln(x+1)>2x$。
answer: |-
  （1）$a\le1$；（2）对一切 $x>0$，不等式成立。

  第 (1) 问把 $f(x)\ge1$ 化成 $g(x)=e^x-\frac12x^2-ax-1\ge0$ 且 $g(0)=0$。必要性由端点效应得右导数条件 $g^{\prime}(0)=1-a\ge0$，即 $a\le1$；充分性用 $g^{\prime}(x)=e^x-x-a\ge1-a\ge0$ 得 $g$ 在 $[0,+\infty)$ 上递增，所以 $g(x)\ge0$。第 (2) 问用 $\ln(x+1)\ge\frac{2x}{x+2}$，再把目标化成 $e^x-\frac12x^2+1>x+2$，即第 (1) 问在 $a=1$ 时的严格情形。
