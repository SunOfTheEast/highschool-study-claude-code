original_problem:
  stem: （2025 厦门、泉州五校高二期中 T19）已知函数 $f(x)=e^x-\frac{1}{2}x^2-ax\ (a\in\mathbf{R})$。
  parts: *a1
  choices: []
  answer: （1）$a\le1$；（2）对一切 $x>0$，不等式成立。
  fidelity_notes:
    - 题干、两问和解析已与 page_0052 页图核对；本题没有选择项。
    - 端点效应法中的末句按数学语境校正为 $g(x_0)<g(0)=0$，原始异常已记入 source_discrepancies。
solution:
  source_solution_summary: 第 (1) 问把 $f(x)\ge1$ 化成 $g(x)=e^x-\frac12x^2-ax-1\ge0$ 且 $g(0)=0$。必要性由端点效应得右导数条件 $g^{\prime}(0)=1-a\ge0$，即 $a\le1$；充分性用 $g^{\prime}(x)=e^x-x-a\ge1-a\ge0$ 得 $g$ 在 $[0,+\infty)$ 上递增，所以 $g(x)\ge0$。第 (2) 问用 $\ln(x+1)\ge\frac{2x}{x+2}$，再把目标化成 $e^x-\frac12x^2+1>x+2$，即第 (1) 问在 $a=1$ 时的严格情形。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问：把恒成立不等式改成端点为零的函数非负问题。
      formula_trace:
        from: $f(x)\ge1,\quad x\in[0,+\infty)$
        to: $g(x)=e^x-\frac12x^2-ax-1\ge0,\quad g(0)=0$
        operation: 把右侧 $1$ 移到左侧，构造 $g(x)=f(x)-1$。
        why: 端点 $x=0$ 正好取到等号，参数限制可以从端点右侧行为读出。
      source_ref: page_0052_ex12_solution
    - step_id: step_2
      statement: 第 (1) 问：由端点效应得到必要条件。
      formula_trace:
        from: $g(x)\ge0,\quad g(0)=0$
        to: $g^{\prime}(0)=1-a\ge0\Rightarrow a\le1$
        operation: 在 $[0,+\infty)$ 的左端点取得最小值时，右导数不能为负。
        why: 若 $1-a<0$，则 $g$ 在 0 右侧会先下降到负值，和恒成立矛盾。
      source_ref: page_0052_ex12_solution
    - step_id: step_3
      statement: 第 (1) 问：证明 $a\le1$ 时条件充分。
      formula_trace:
        from: $g^{\prime}(x)=e^x-x-a$
        to: $g^{\prime}(x)\ge1-a\ge0,\quad g(x)\ge g(0)=0$
        operation: 用 $e^x-x\ge1$（$x\ge0$）控制 $g^{\prime}(x)$，再由 $g^{\prime}\ge0$ 得 $g$ 递增。
        why: 这说明 $a\le1$ 时，端点之后不会跌破 0。
      source_ref: page_0052_ex12_solution
    - step_id: step_4
      statement: 第 (2) 问：先把对数因子放小到有理式。
      formula_trace:
        from: $\ln(x+1)$
        to: $\ln(x+1)\ge\frac{2x}{x+2}\quad(x\ge0)$
        operation: 使用源解给出的对数放缩；也可令 $q(x)=\ln(x+1)-\frac{2x}{x+2}$ 验证 $q(0)=0$ 且 $q(x)>0$（$x>0$）。
        why: 右侧的 $\frac{2x}{x+2}$ 能与目标中的 $2x$ 直接约掉。
      source_ref: page_0052_ex12_solution
    - step_id: step_5
      statement: 第 (2) 问：把剩余部分化回第 (1) 问的 $a=1$ 情形。
      formula_trace:
        from: $\left(e^x-\frac12x^2+1\right)\frac{2x}{x+2}>2x$
        to: $e^x-\frac12x^2-x-1>0$
        operation: 因 $x>0$ 且 $x+2>0$，两边同除 $2x$ 并移项。
        why: 左侧正是第 (1) 问中 $g(x)$ 取 $a=1$ 的表达式。
      source_ref: page_0052_ex12_solution
    - step_id: step_6
      statement: 第 (2) 问：用第 (1) 问给出的端点结论补上严格性。
      formula_trace:
        from: $g_1(x)=e^x-\frac12x^2-x-1,\quad g_1(0)=0$
        to: $g_1(x)>0\quad(x>0)$
        operation: 由 $g_1^{\prime}(x)=e^x-x-1$ 且 $g_1^{\prime}(0)=0$、$g_1^{\prime\prime}(x)=e^x-1>0$（$x>0$）可知 $g_1$ 在 0 右侧严格增加；源解概括为“由 (1) 得成立”。
        why: 目标不等式是严格大于号，$x>0$ 时不能只停在非负结论。
      source_ref: page_0052_ex12_solution
teaching_card:
  student_title: 端点取等时，先看右侧会不会跌下去
  what_it_trains: 训练把端点取等的恒成立问题转成端点效应，再把后续证明题接回已经得到的参数结论。
  recognition_cues:
    - 恒成立区间从 $0$ 开始，且代入 $x=0$ 正好等号成立。
    - 导数里出现 $e^x-x-a$，可以用 $e^x-x\ge1$ 控制。
    - 第二问同时有 $\ln(x+1)$ 和目标 $2x$，提示先用 $\frac{2x}{x+2}$ 放缩。
  normalization_moves:
    - 先构造 $g=f-1$，把端点值固定成 $g(0)=0$。
    - 必要性看 $g^{\prime}(0)\ge0$，充分性看 $g^{\prime}(x)\ge0$。
    - 第二问先替换 $\ln(x+1)$，再把剩下的指数二次式识别成第 (1) 问 $a=1$。
  common_failures:
    - 只代入 $x=0$，没有检查 0 右侧的变化方向。
    - 证明充分性时忘记 $e^x-x$ 在 $x\ge0$ 的最小值是 1。
    - 把 $\ln(x+1)$ 的放缩方向写反，导致乘积不等式方向错误。
    - 第 (2) 问只得到 $\ge$，没有说明 $x>0$ 时严格大于。
  similar_practice_query: 端点效应 恒成立 a<=1 ln(x+1)>=2x/(x+2) 指数二次式不等式
