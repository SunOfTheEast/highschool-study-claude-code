      max_score: 1
    - step_id: step_5
      description: 第 (2) 问：把剩余部分化回第 (1) 问的 $a=1$ 情形。
      max_score: 1
    - step_id: step_6
      description: 第 (2) 问：用第 (1) 问给出的端点结论补上严格性。
      max_score: 1
