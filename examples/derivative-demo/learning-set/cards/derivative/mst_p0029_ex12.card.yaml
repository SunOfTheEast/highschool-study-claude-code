solution:
  source_solution_summary: 由 $x/3+3y-2=\ln x+\ln y$ 得 $x/3-\ln(x/3)-1+3y-\ln(3y)-1=0$。设 $f(t)=t-\ln t-1$，由切线不等式 $t-1\ge\ln t$ 知 $f(t)\ge0$，等号当且仅当 $t=1$。所以 $f(x/3)+f(3y)=0$ 只能是 $x/3=1$ 且 $3y=1$，即 $x=3,y=1/3$，从而 $x+y=10/3$。
  key_steps:
    - step_id: step_1
      statement: 把原方程改写成两个切线函数项的和。
      formula_trace:
        from: $\frac{x}{3}+3y-2=\ln x+\ln y$
        to: $\frac{x}{3}-\ln\frac{x}{3}-1+3y-\ln(3y)-1=0$
        operation: 移项后利用 $\ln(x/3)+\ln(3y)=\ln x+\ln y$，把对数分别配到 $x/3$ 与 $3y$。
        why: 这样每一组都成为 $t-\ln t-1$ 的形式。
      source_ref: page_0029_ex12_solution
    - step_id: step_2
      statement: 调用切线函数的非负性。
      formula_trace:
        from: $f(t)=t-\ln t-1$
        to: $f(t)\geqslant0,\quad t=1\text{ 时取等}$
        operation: 由 $\ln t\le t-1$ 得 $t-\ln t-1\ge0$。
        why: 两个非负数之和为 0，只能两个都等于 0。
      source_ref: page_0029_ex12_solution
    - step_id: step_3
      statement: 让两个同构项分别取等并求值。
      formula_trace:
        from: $f\left(\frac{x}{3}\right)+f(3y)=0$
        to: $\frac{x}{3}=1,\quad3y=1\Rightarrow x+y=3+\frac13=\frac{10}{3}$
        operation: 利用 $f(t)\ge0$ 且等号仅在 $t=1$ 取到。
        why: 方程没有其他正实数解，故选 D。
      source_ref: page_0029_ex12_solution
teaching_card:
  student_title: 把方程拆成两个 $t-\ln t-1$
  what_it_trains: 训练在二元对数方程中配出两个非负切线项，再用“非负和为零”直接锁定变量。
  recognition_cues:
    - 题干有 $x/3$ 和 $3y$，对数却是 $\ln x+\ln y$。
    - 常数正好是 $-2$，可以拆成两个 $-1$。
    - 问 $x+y$ 的确定值，说明方程很可能通过取等条件锁死。
  normalization_moves:
    - 把 $\ln x+\ln y$ 改写成 $\ln(x/3)+\ln(3y)$。
    - 把方程移成 $f(x/3)+f(3y)=0$。
    - 用 $f(t)\ge0$ 得 $x/3=1$、$3y=1$。
  common_failures:
    - 把 $\ln(x/3)+\ln(3y)$ 误以为改变了原式。
    - 只代选项而没有证明 $x,y$ 被唯一确定。
    - 忘记 $x,y>0$，没有说明对数与切线函数的定义域。
  similar_practice_query: x/3 3y ln x ln y t-ln t-1 非负和为零 求值
