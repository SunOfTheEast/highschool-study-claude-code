stem: |-
  (2025 广东省广州市三校期中 T8) 已知正实数 $x$, $y$ 满足 $\frac{x}{3}+3y-2=\ln x+\ln y$，则 $x+y=(\quad)$
  A. $2$
  B. $\frac{5}{2}$
  C. $\frac{1}{4}$
  D. $\frac{10}{3}$
answer: |-
  D. $\frac{10}{3}$

  由 $x/3+3y-2=\ln x+\ln y$ 得 $x/3-\ln(x/3)-1+3y-\ln(3y)-1=0$。设 $f(t)=t-\ln t-1$，由切线不等式 $t-1\ge\ln t$ 知 $f(t)\ge0$，等号当且仅当 $t=1$。所以 $f(x/3)+f(3y)=0$ 只能是 $x/3=1$ 且 $3y=1$，即 $x=3,y=1/3$，从而 $x+y=10/3$。
