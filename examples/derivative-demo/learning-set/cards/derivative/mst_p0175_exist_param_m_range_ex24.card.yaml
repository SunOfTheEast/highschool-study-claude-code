solution:
  source_solution_summary: 由 $f(x)\leqslant0$ 得 $e^{x+1}+x\leqslant a(m+e^x)$。令 $e^x=t>0$，左边变成 $et+\ln t$，右边是 $a(t+m)$。 左边零点为 $t_1=\frac1e$，右边零点为 $t_2=-m$。要存在 参数 $a$ 使直线压住左边曲线，按零点比大小需 $\frac1e\geqslant -m$，所以 $m\geqslant-\frac1e$，选 A。
  key_steps:
    - step_id: step_1
      statement: 把恒成立可行性改写到 $e^x=t$ 的零点比较模型。
      formula_trace:
        from: $(e-a)e^x-ma+x\leqslant0$
        to: $e^{x+1}+x\leqslant a(m+e^x)$
        operation: 移项并把 $e\cdot e^x$ 合并成 $e^{x+1}$。
        why: 右边出现 $a$ 乘以一条关于 $e^x$ 的线性表达式，便于做存在性判断。
      source_ref: page_0175:lines 5-30
    - step_id: step_2
      statement: 换元后读出两边零点。
      formula_trace:
        from: $e^x=t>0,\quad et+\ln t\leqslant a(t+m)$
        to: $t_1=\frac1e,\quad t_2=-m$
        operation: 分别令左边 $et+\ln t=0$ 与右边 $t+m=0$。
        why: 零点位置决定了是否存在一条参数直线完成整体压制。
      source_ref: page_0175:lines 26-30
    - step_id: step_3
      statement: 用零点比大小得到参数范围。
      formula_trace:
        from: $t_1=\frac1e,\quad t_2=-m$
        to: $\frac1e\geqslant -m\Rightarrow m\geqslant-\frac1e$
        operation: 比较左侧曲线零点和右侧线性因子零点。
        why: 这是源书“零点比大小”模型在存在参数题中的收束条件。
      source_ref: page_0175:lines 26-30
teaching_card:
  student_title: 用零点比大小判断参数可行性
  what_it_trains: 训练把“存在一个参数使恒成立”转成两条曲线的可压制关系，再用零点位置快速读出参数范围。
  recognition_cues:
    - 题目出现“存在实数 a，使得对任意 x 恒成立”。
    - 表达式里同时有 $e^x$ 和 $x$，参数又乘在 $e^x$ 的线性组合上。
    - 源解提示零点比大小或逆否命题。
  normalization_moves:
    - 先把不等式移项成 $e^{x+1}+x\leqslant a(m+e^x)$。
    - 令 $e^x=t$，把 $x$ 改写成 $\ln t$。
    - 分别找 $et+\ln t$ 与 $t+m$ 的零点。
  common_failures:
    - 直接对含两个参数的函数全量求导，计算膨胀。
    - 换元后忘记 $x=\ln t$。
    - 把 $\frac1e\geqslant -m$ 的方向写反。
  similar_practice_query: 存在参数 a 恒成立 e^x t 零点比大小 m+e^x
