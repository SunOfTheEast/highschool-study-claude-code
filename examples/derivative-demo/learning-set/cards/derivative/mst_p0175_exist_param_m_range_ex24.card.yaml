stem: |-
  （2024 · 重庆万州高二期末 T8）已知函数 $f(x)=(e-a)e^x-ma+x$（$m,a$ 为实数），若存在实数 $a$，使得 $f(x)\leqslant0$ 对任意 $x\in\mathbf{R}$ 恒成立，则实数 $m$ 的取值范围是（  ）
  A. $\left[-\frac{1}{e},+\infty\right)$
  B. $[-e,+\infty)$
  C. $\left[\frac{1}{e},e\right]$
  D. $\left[-e,-\frac{1}{e}\right]$
answer: |-
  A

  由 $f(x)\leqslant0$ 得 $e^{x+1}+x\leqslant a(m+e^x)$。令 $e^x=t>0$，左边变成 $et+\ln t$，右边是 $a(t+m)$。 左边零点为 $t_1=\frac1e$，右边零点为 $t_2=-m$。要存在 参数 $a$ 使直线压住左边曲线，按零点比大小需 $\frac1e\geqslant -m$，所以 $m\geqslant-\frac1e$，选 A。
