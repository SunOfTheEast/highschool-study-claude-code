stem: （2023 · 湖南模拟 T14）已知 $f(x)=xe^x-a(x+\ln x)\geqslant1$ 对于任意的 $x\in(0,+\infty)$ 恒成立，则 $a$ 的取值为______。
answer: |-
  $a=1$。

  令 $h(u)=e^u-u-1\geqslant0$，则 $f(x)-1=h(x+\ln x)+(1-a)(x+\ln x)$。设 $x_0+\ln x_0=0$（约 $x_0\approx0.6$），此时 $h(x_0+\ln x_0)=0$，且余量项也在同点为 0。 按 source 的完整证明，先求 $f^{\prime}(x)=\left(1+\frac1x\right)(e^{x+\ln x}-a)$，其中 $g(x)=e^{x+\ln x}-a$ 严格递增、零点唯一，且零点满足 $x+\ln x=\ln a$。分类： (i) $a=1$ 时零点与 $x_0$ 重合，$f$ 在 $x_0$ 处取最小值 1； (ii) $a>1$ 时在 $(x_0,x_1)$ 出现 $f(x)<1$； (iii) $0<a<1$ 时在 $(x_2,x_0)$ 出现 $f(x)<1$； (iv) $a\leqslant0$ 时 $f^{\prime}(x)>0$，在 $(0,x_0)$ 有 $f(x)<1$。后三种均与题设矛盾，故唯一可行参数是 $a=1$。
