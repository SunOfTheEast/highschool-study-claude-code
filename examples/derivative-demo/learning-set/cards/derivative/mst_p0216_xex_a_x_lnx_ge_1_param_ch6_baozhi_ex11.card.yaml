original_problem:
  stem: （2023 · 湖南模拟 T14）已知 $f(x)=xe^x-a(x+\ln x)\geqslant1$ 对于任意的 $x\in(0,+\infty)$ 恒成立，则 $a$ 的取值为______。
  parts: *a1
  choices: []
  answer: $a=1$。
  fidelity_notes:
    - 题型为求参数填空，无选项、无分问。
    - 由 $\ln x$ 可知定义域是 $x>0$。
    - source 先给“余量共零点”速解，再给可书写的导数分类证明。
solution:
  source_solution_summary: 令 $h(u)=e^u-u-1\geqslant0$，则 $f(x)-1=h(x+\ln x)+(1-a)(x+\ln x)$。设 $x_0+\ln x_0=0$（约 $x_0\approx0.6$），此时 $h(x_0+\ln x_0)=0$，且余量项也在同点为 0。 按 source 的完整证明，先求 $f^{\prime}(x)=\left(1+\frac1x\right)(e^{x+\ln x}-a)$，其中 $g(x)=e^{x+\ln x}-a$ 严格递增、零点唯一，且零点满足 $x+\ln x=\ln a$。分类： (i) $a=1$ 时零点与 $x_0$ 重合，$f$ 在 $x_0$ 处取最小值 1； (ii) $a>1$ 时在 $(x_0,x_1)$ 出现 $f(x)<1$； (iii) $0<a<1$ 时在 $(x_2,x_0)$ 出现 $f(x)<1$； (iv) $a\leqslant0$ 时 $f^{\prime}(x)>0$，在 $(0,x_0)$ 有 $f(x)<1$。后三种均与题设矛盾，故唯一可行参数是 $a=1$。
  key_steps:
    - step_id: step_1
      statement: 先把目标改写成保值块与余量项。
      formula_trace:
        from: $f(x)-1=xe^x-a(x+\ln x)-1$
        to: $f(x)-1=h(x+\ln x)+(1-a)(x+\ln x),\ h(u)=e^u-u-1$
        operation: 令 $u=x+\ln x$，并套入标准母函数。
        why: 将“恒成立求参”转化为“非负块 + 余量项”结构。
      source_ref: page_0216_ex11_solution
    - step_id: step_2
      statement: 识别共零点并给出速解直觉。
      formula_trace:
        from: $h(u)\geqslant0$，且 $h(u)=0\Leftrightarrow u=0$
        to: $x_0+\ln x_0=0$ 时 $h(x_0+\ln x_0)=0$，余量项也在该点取零
        operation: 对齐保值块与余量项的取等点。
        why: source 用“极点效应”说明若要全局非负，必须让余量不破坏该极点。
      source_ref: page_0216_ex11_solution
    - step_id: step_3
      statement: 写出导数并确定符号控制函数的单调性。
      formula_trace:
        from: $f(x)=xe^x-a(x+\ln x)$
        to: $f^{\prime}(x)=\left(1+\frac1x\right)(e^{x+\ln x}-a)$，$g(x)=e^{x+\ln x}-a$ 且 $g^{\prime}(x)>0$
        operation: 乘积求导后提取公因子，构造 $g(x)$。
        why: 要做参数分类，先锁定导数零点的唯一性。
      source_ref: page_0216_ex11_solution
    - step_id: step_4
      statement: 当 $a=1$ 时验证可行。
      formula_trace:
        from: $\ln a=0$
        to: $f^{\prime}(x_0)=0$，$f$ 在 $(0,x_0)$ 递减、$(x_0,+\infty)$ 递增，$f_{\min}=f(x_0)=1$
        operation: 由 $g$ 递增与零点位置读取 $f^{\prime}$ 符号分布。
        why: 给出充分性：$a=1$ 确实满足题设。
      source_ref: page_0216_ex11_solution
    - step_id: step_5
      statement: 当 $a>1$ 时反证。
      formula_trace:
        from: $\ln a>0,\ \exists x_1:x_1+\ln x_1=\ln a$
        to: $f^{\prime}(x_0)<0$，故 $x\in(x_0,x_1)$ 时 $f(x)<1$
        operation: 比较 $x_0$ 与 $x_1$ 处导数符号，得到局部下降区间。
        why: 出现违背“恒 $\geqslant1$”的区间，排除 $a>1$。
      source_ref: page_0216_ex11_solution
    - step_id: step_6
      statement: 当 $0<a<1$ 与 $a\leqslant0$ 时继续反证。
      formula_trace:
        from: $0<a<1$ 或 $a\leqslant0$
        to: $0<a<1$ 时在 $(x_2,x_0)$ 有 $f(x)<1$；$a\leqslant0$ 时在 $(0,x_0)$ 有 $f(x)<1$
        operation: 分别用零点位置与 $f^{\prime}(x)>0$ 判定单调区间，再与 $f(x_0)=1$ 比较。
        why: 排除全部其余情形，完成必要性。
      source_ref: page_0216_ex11_solution
    - step_id: step_7
      statement: 汇总参数。
      formula_trace:
        from: step_4 可行，step_5/6 不可行
        to: $a=1$
        operation: 保留唯一可行参数值。
        why: 完成求参结论。
      source_ref: page_0216_ex11_solution
teaching_card:
  student_title: 极点效应求参：$xe^x-a(x+\ln x)\geqslant1$
  what_it_trains: 训练“先同构保值，再用余量共零点与导数分类锁定唯一参数”的恒成立求参链路。
  recognition_cues:
    - 题目是“对任意 $x>0$ 恒成立”的单参数不等式。
    - 主式可压成 $e^u-u-1$ 母函数，且有明确取等点。
    - 解析中出现“余量函数”“共零点”“分类矛盾”关键词。
  normalization_moves:
    - 把目标写成 $h(u)+$ 余量的形式。
    - 先看共零点，再用导数零点位置做参数分类。
    - 逐段排除，最后只留唯一参数。
  common_failures:
    - 只写速解结论 $a=1$，未给出对 $a>1,0<a<1,a\leqslant0$ 的排除。
    - 把 $g(x)$ 的单调性写错，导致零点个数判断失真。
    - 忘记定义域 $x>0$，把不在定义域的点代入反证。
  similar_practice_query: xe^x a(x+lnx) 恒成立 求参 极点效应 余量函数
