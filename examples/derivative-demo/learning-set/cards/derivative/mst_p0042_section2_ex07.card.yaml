original_problem:
  stem: （2023 · 商丘三模 T11）已知函数 $f(x)=ae^x$，$g(x)=2x+b$，若 $f(x)\geqslant g(x)$ 恒成立，则 $\frac{b}{a}$ 的最大值是 (  )
  parts: *a1
  choices:
    - label: A
      text_raw: $-1$
      text_latex: $-1$
    - label: B
      text_raw: $1$
      text_latex: $1$
    - label: C
      text_raw: $2$
      text_latex: $2$
    - label: D
      text_raw: $\sqrt{2}$
      text_latex: $\sqrt{2}$
  answer: B
  fidelity_notes:
    - 题干未显式限制 $a,b$，源解排除 $a<0$；$a=0$ 时 $0\ge2x+b$ 不可能对全体 $x$ 成立，因此可行情形为 $a>0$。
    - 源解法一中写“当 $a>0$ 且 $b>0$”服务于最大值取等情形；最大值确在 $a=b=2$ 达到。
solution:
  source_solution_summary: |
    若 $a\\le0$，则 $ae^x$ 不可能始终压住值域为 $\\mathbf R$ 的直线 $2x+b$，所以只需考虑 $a>0$。由 $ae^x\\ge2x+b$ 得 $e^{x+\ln a-\ln2}\\ge x+b/2$。指数切线 $e^u\\ge u+1$ 给出 $e^{x+\ln a-\ln2}\\ge x+\ln(a/2)+1$，相切取最优时 $b/2=\\ln(a/2)+1$，于是 $b/a=2\ln(ae/2)/a=e\\cdot\\ln(ae/2)/(ae/2)\\le1$，等号在 $ae/2=e$ 即 $a=2,b=2$ 时取得。法二令 $t=e^x$，由 $at-b\\ge2\ln t$，直线零点 $b/a$ 不超过 $\\ln t$ 的零点 1，也得 $b/a\\le1$。故选 B。
  key_steps:
    - step_id: step_1
      statement: 先排除非正的 $a$。
      formula_trace:
        from: $ae^x\ge2x+b\quad (x\in\mathbf R)$
        to: $a>0$
        operation: 当 $a<0$ 时左侧为负且随 $x$ 减小，右侧值域为 $\mathbf R$；当 $a=0$ 时 $0\ge2x+b$ 也不可能恒成立。
        why: 后续需要使用 $\ln a$，也只有 $a>0$ 才可能有切线取等。
      source_ref: page_0042
    - step_id: step_2
      statement: 把斜率 2 归一到指数切线模板。
      formula_trace:
        from: $ae^x\ge2x+b$
        to: $e^{x+\ln a-\ln2}\ge x+\frac b2$
        operation: 两边除以 2，并把 $ae^x/2$ 写成 $e^{x+\ln a-\ln2}$。
        why: 这样右边一次项斜率为 1，可直接和 $e^u\ge u+1$ 对齐。
      source_ref: page_0042
    - step_id: step_3
      statement: 用指数切线给出最优一次下界。
      formula_trace:
        from: $e^{x+\ln a-\ln2}$
        to: $e^{x+\ln a-\ln2}\ge x+\ln\frac a2+1$
        operation: 令 $u=x+\ln a-\ln2$，套 $e^u\ge u+1$。
        why: 要让它压住 $x+b/2$，最大的 $b/2$ 来自切线右端的常数项。
      source_ref: page_0042
    - step_id: step_4
      statement: 把相切条件转成 $b/a$ 的函数。
      formula_trace:
        from: $\frac b2=\ln\frac a2+1$
        to: $\frac ba=\frac{2\ln\frac{ae}{2}}{a}=e\cdot\frac{\ln\frac{ae}{2}}{\frac{ae}{2}}$
        operation: 由 $\ln(a/2)+1=\ln(ae/2)$，再配成 $\ln y/y$，其中 $y=ae/2$。
        why: $\ln y/y$ 的最大值为 $1/e$，可直接锁定 $b/a$ 最大值。
      source_ref: page_0042
    - step_id: step_5
      statement: 求最大值并给出取等参数。
      formula_trace:
        from: $e\cdot\frac{\ln y}{y}$
        to: $\frac ba\le1$
        operation: 用 $\ln y/y\le1/e$，等号在 $y=e$ 取到。
        why: $y=e$ 对应 $a=2$，再由 $b/2=1$ 得 $b=2$，说明最大值 1 可取。
      source_ref: page_0042
    - step_id: step_6
      statement: 零点比大小路线给同一结论。
      formula_trace:
        from: $ae^x-b\ge2x$
        to: $at-b\ge2\ln t\quad (t=e^x>0)$
        operation: 令 $t=e^x$，则 $x=\ln t$。
        why: 直线 $at-b$ 在对数曲线上方时，其零点 $t_1=b/a$ 不超过 $\ln t$ 的零点 $t_2=1$。
      source_ref: page_0042
teaching_card:
  student_title: 把斜率 2 的直线改成指数切线
  what_it_trains: 训练把 $ae^x$ 压住直线的恒成立问题，先统一一次项斜率，再用指数切线取等点求参数比值的最值。
  recognition_cues:
    - 条件是 $ae^x\ge2x+b$ 对所有 $x$ 恒成立。
    - 目标不是直接求 $a,b$，而是求 $b/a$ 的最大值。
    - 斜率 2 提示先除以 2，让右侧变成 $x+b/2$。
  normalization_moves:
    - 先排除 $a\le0$。
    - 把 $ae^x/2$ 写成 $e^{x+\ln a-\ln2}$。
    - 用 $e^u\ge u+1$ 取相切常数。
    - 把 $b/a$ 配成 $e\cdot\ln y/y$。
  common_failures:
    - 忘记讨论 $a$ 的符号，导致 $\ln a$ 没有意义。
    - 把 $b/2=\ln(a/2)+1$ 当成任意条件，而不是最优取等条件。
    - 不会把 $2\ln(ae/2)/a$ 化成 $e\ln y/y$。
  similar_practice_query: ae^x 大于直线 恒成立 b/a 最大值 指数切线 零点比较
