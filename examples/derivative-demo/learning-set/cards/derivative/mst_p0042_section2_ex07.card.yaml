stem: |-
  （2023 · 商丘三模 T11）已知函数 $f(x)=ae^x$，$g(x)=2x+b$，若 $f(x)\geqslant g(x)$ 恒成立，则 $\frac{b}{a}$ 的最大值是 (  )
  A. $-1$
  B. $1$
  C. $2$
  D. $\sqrt{2}$
answer: |
  B

  若 $a\\le0$，则 $ae^x$ 不可能始终压住值域为 $\\mathbf R$ 的直线 $2x+b$，所以只需考虑 $a>0$。由 $ae^x\\ge2x+b$ 得 $e^{x+\ln a-\ln2}\\ge x+b/2$。指数切线 $e^u\\ge u+1$ 给出 $e^{x+\ln a-\ln2}\\ge x+\ln(a/2)+1$，相切取最优时 $b/2=\\ln(a/2)+1$，于是 $b/a=2\ln(ae/2)/a=e\\cdot\\ln(ae/2)/(ae/2)\\le1$，等号在 $ae/2=e$ 即 $a=2,b=2$ 时取得。法二令 $t=e^x$，由 $at-b\\ge2\ln t$，直线零点 $b/a$ 不超过 $\\ln t$ 的零点 1，也得 $b/a\\le1$。故选 B。
