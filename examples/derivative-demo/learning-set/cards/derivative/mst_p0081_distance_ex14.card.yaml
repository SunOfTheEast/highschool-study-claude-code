stem: （2024 雅安天立高级中学月考 T16）已知 $P$，$Q$ 分别是函数 $y=\frac12e^{2x}$，$y=\frac{\ln2+\ln x}{2}$ 图象上的动点，则 $|PQ|$ 的最小值为_______。
answer: |-
  $\frac{\sqrt2}{2}$

  由 $y=\frac12e^{2x}$ 反解得 $x=(\ln2+\ln y)/2$, 所以它与 $y=(\ln2+\ln x)/2$ 互为反函数, 图象关于 $y=x$ 对称。 因此两曲线间的最短距离可看成一侧曲线到对称轴 $y=x$ 的最短距离的 2 倍。 对 $y=\frac12e^{2x}$ 求导得 $y'=e^{2x}$, 令 $y'=1$ 得 $x=0$, 此时 $P=(0,1/2)$。点 $P$ 到 $y=x$ 的距离为 $|0-1/2|/\sqrt2=\sqrt2/4$, 所以 $|PQ|_{\min}=2d=\sqrt2/2$。
