stem: |-
  （2017 · 新课标 II）已知函数 $f(x)=ax^2-ax-x\ln x$，且 $f(x)\geqslant0$。
  1. 求 $a$。
  2. 证明：$f(x)$ 存在唯一的极大值点 $x_0$，且 $e^{-2}<f(x_0)<2^{-2}$。
answer: |-
  第(1)问 $a=1$；第(2)问存在唯一极大值点 $x_0$，且 $e^{-2}<f(x_0)<2^{-2}$。

  第(1)问将 $f(x)=x(ax-a-\ln x)$，因 $x>0$，题设等价于 $h(x)=ax-a-\ln x\ge0$。又 $h(1)=0$，所以 $h$ 在 $x=1$ 处取最小值，必要有 $h^\prime(1)=a-1=0$， 得 $a=1$。第(2)问此时 $f(x)=x^2-x-x\ln x$，$f^\prime(x)=2x-\ln x-2$。 令 $t(x)=2x-2-\ln x$，$t^\prime(x)=2-\frac1x$， $t$ 在 $(0,\frac12)$ 递减、$(\frac12,+\infty)$ 递增， 且 $t(\frac1{e^2})>0$、$t(\frac12)<0$，从而 $t$ 在 $(\frac1{e^2},\frac12)$ 有唯一零点 $x_0$， 它对应 $f$ 的唯一极大值点。由 $2x_0-2-\ln x_0=0$ 得 $f(x_0)=x_0^2-x_0-x_0\ln x_0=x_0-x_0^2$。 方案一用 $x_0\in(\frac1{e^2},\frac12)$ 得 $f(x_0)<\frac14$，并由原函数找点得 $f(x_0)>f(\frac1{e^2})=e^{-4}+e^{-2}>e^{-2}$。方案二进一步用 $x_0\in(\frac1{e^2},\frac1e)$，得 $f(x_0)>f(\frac1e)=e^{-2}$，且 $f(x_0)<\frac1e-\frac1{e^2}<\frac14$。source 注释强调： 对极大值点，下界用原函数找点，上界用隐零点关系改写极值点表达式。
