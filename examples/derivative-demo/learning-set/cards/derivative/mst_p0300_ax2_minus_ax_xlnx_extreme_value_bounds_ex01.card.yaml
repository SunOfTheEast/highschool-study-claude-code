original_problem:
  stem: （2017 · 新课标 II）已知函数 $f(x)=ax^2-ax-x\ln x$，且 $f(x)\geqslant0$。
  parts: *a1
  choices: []
  answer: 第(1)问 $a=1$；第(2)问存在唯一极大值点 $x_0$，且 $e^{-2}<f(x_0)<2^{-2}$。
  fidelity_notes:
    - 无选项。
    - 函数含 $x\ln x$，默认定义域为 $x>0$。
solution:
  source_solution_summary: 第(1)问将 $f(x)=x(ax-a-\ln x)$，因 $x>0$，题设等价于 $h(x)=ax-a-\ln x\ge0$。又 $h(1)=0$，所以 $h$ 在 $x=1$ 处取最小值，必要有 $h^\prime(1)=a-1=0$， 得 $a=1$。第(2)问此时 $f(x)=x^2-x-x\ln x$，$f^\prime(x)=2x-\ln x-2$。 令 $t(x)=2x-2-\ln x$，$t^\prime(x)=2-\frac1x$， $t$ 在 $(0,\frac12)$ 递减、$(\frac12,+\infty)$ 递增， 且 $t(\frac1{e^2})>0$、$t(\frac12)<0$，从而 $t$ 在 $(\frac1{e^2},\frac12)$ 有唯一零点 $x_0$， 它对应 $f$ 的唯一极大值点。由 $2x_0-2-\ln x_0=0$ 得 $f(x_0)=x_0^2-x_0-x_0\ln x_0=x_0-x_0^2$。 方案一用 $x_0\in(\frac1{e^2},\frac12)$ 得 $f(x_0)<\frac14$，并由原函数找点得 $f(x_0)>f(\frac1{e^2})=e^{-4}+e^{-2}>e^{-2}$。方案二进一步用 $x_0\in(\frac1{e^2},\frac1e)$，得 $f(x_0)>f(\frac1e)=e^{-2}$，且 $f(x_0)<\frac1e-\frac1{e^2}<\frac14$。source 注释强调： 对极大值点，下界用原函数找点，上界用隐零点关系改写极值点表达式。
  key_steps:
    - step_id: step_1
      statement: 第(1)问把 $f(x)\ge0$ 化成 $h(x)\ge0$。
      formula_trace:
        from: $f(x)=ax^2-ax-x\ln x$
        to: $h(x)=ax-a-\ln x\ge0$
        operation: 提出正因子 $x$。
        why: 定义域 $x>0$，所以不改变不等号方向。
      source_ref: page_0300_ex01_solution_start
    - step_id: step_2
      statement: 利用显点 $x=1$ 求参数。
      formula_trace:
        from: $h(1)=0,\quad h(x)\ge h(1)$
        to: $h^\prime(1)=a-1=0,\quad a=1$
        operation: 显点最小值处导数为 $0$。
        why: 题目给出的固定点 $1$ 是定参入口。
      source_ref: page_0300_ex01_solution_start
    - step_id: step_3
      statement: 第(2)问研究极大值点。
      formula_trace:
        from: $f^\prime(x)=2x-\ln x-2$
        to: $t(x)=2x-2-\ln x$
        operation: 把导函数记为 $t$ 并研究其零点。
        why: $f$ 的极值点来自 $t$ 的零点。
      source_ref: page_0300_ex01_solution_start
    - step_id: step_4
      statement: 锁定唯一极大值点 $x_0$。
      formula_trace:
        from: $t(\frac1{e^2})>0,\quad t(\frac12)<0$
        to: $x_0\in(\frac1{e^2},\frac12),\quad t(x_0)=0$
        operation: 用 $t$ 的单调性和变号。
        why: 这个较小零点对应 $f$ 的唯一极大值点。
      source_ref: page_0301_ex01_solution_end
    - step_id: step_5
      statement: 用隐零点关系改写 $f(x_0)$。
      formula_trace:
        from: $2x_0-2-\ln x_0=0$
        to: $f(x_0)=x_0-x_0^2$
        operation: 把 $\ln x_0$ 替换成 $2x_0-2$。
        why: 极值点表达式换成简单二次式后才能估上界。
      source_ref: page_0301_ex01_solution_end
    - step_id: step_6
      statement: 证明上界 $f(x_0)<2^{-2}$。
      formula_trace:
        from: $x_0\in(\frac1{e^2},\frac12),\quad f(x_0)=x_0-x_0^2$
        to: $f(x_0)<\frac14$
        operation: 用二次函数 $x-x^2$ 的最大值。
        why: 这个上界比极大值还大，不能直接在原函数上找点，必须改写极值点表达式。
      source_ref: page_0301_ex01_solution_end
    - step_id: step_7
      statement: 证明下界 $e^{-2}<f(x_0)$。
      formula_trace:
        from: $x_0$ 是极大值点
        to: $f(x_0)>f(\frac1e)=e^{-2}$
        operation: 在原函数上取点。
        why: 要证明一个比极大值小的下界，只需找一个函数值已经超过它的点。
      source_ref: page_0301_ex01_solution_end
teaching_card:
  student_title: 极大值点的上下界怎么分工
  what_it_trains: 训练极值点不等式里，什么时候在原函数上找点，什么时候必须用极值点方程消参。
  recognition_cues:
    - 题目要求估计的是 $f(x_0)$，其中 $x_0$ 是极值点。
    - 下界 $e^{-2}<f(x_0)$ 是比极大值小的数，可以找点。
    - 上界 $f(x_0)<2^{-2}$ 是比极大值大的控制，必须改写 $f(x_0)$。
    - $f^\prime(x_0)=0$ 给出 $\ln x_0=2x_0-2$。
  normalization_moves:
    - 第(1)问用 $x=1$ 显点定参。
    - 第(2)问先定位 $x_0$ 在小区间内。
    - 证明下界时直接比较 $f(\frac1e)$。
    - 证明上界时先把 $f(x_0)$ 化成 $x_0-x_0^2$。
  common_failures:
    - 把 $x=1$ 这个显点忽略，硬做参数讨论。
    - 以为上下界都要用同一种办法证明。
    - 没有用 $f^\prime(x_0)=0$ 消掉 $\ln x_0$。
    - 把 $x_0$ 的较小零点和 $x=1$ 这个另一零点混淆。
  similar_practice_query: 极值点不等式 原函数找点 隐零点消参 xlnx f(x0)=x0-x0^2
