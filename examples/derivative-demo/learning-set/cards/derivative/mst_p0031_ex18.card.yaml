original_problem:
  stem: 已知函数 $f(x)=xe^x$，$g(x)=-\frac{\ln x}{x}$，若 $f(x_1)=g(x_2)>0$，则 $\frac{x_1}{x_2}-x_1-\ln x_1$ 的最小值为 ______.
  parts: *a1
  choices: []
  answer: "1"
  fidelity_notes:
    - 由 $g(x_2)$ 隐含 $x_2>0$；由 $g(x_2)>0$ 得 $0<x_2<1$，由 $f(x_1)>0$ 得 $x_1>0$。
    - 源图与 markdown 一致。
solution:
  source_solution_summary: 由 $f(x_1)=g(x_2)>0$ 得 $x_1e^{x_1}=-\ln x_2/x_2=\ln(1/x_2)e^{\ln(1/x_2)}$。设 $h(u)=ue^u$，它在 $(0,+\infty)$ 上递增，而 $x_1>0$、$\ln(1/x_2)>0$，所以 $x_1=\ln(1/x_2)$，即 $x_2=e^{-x_1}$。目标式化为 $x_1e^{x_1}-(x_1+\ln x_1)=e^{x_1+\ln x_1}-(x_1+\ln x_1)$。令 $u=x_1+\ln x_1$，其值域为 $\mathbf R$，于是 $e^u-u\ge1$，最小值为 1。
  key_steps:
    - step_id: step_1
      statement: 把 $g(x_2)$ 改写成 $ue^u$。
      formula_trace:
        from: $-\frac{\ln x_2}{x_2}$
        to: $\frac1{x_2}\ln\frac1{x_2}=\ln\frac1{x_2}\,e^{\ln(1/x_2)}$
        operation: 用 $-\ln x_2=\ln(1/x_2)$ 和 $1/x_2=e^{\ln(1/x_2)}$。
        why: 这样右侧与 $x_1e^{x_1}$ 成为同一个 $ue^u$ 结构。
      source_ref: page_0031
    - step_id: step_2
      statement: 用 $h(u)=ue^u$ 的递增性锁定变量。
      formula_trace:
        from: $x_1e^{x_1}=\ln\frac1{x_2}\,e^{\ln(1/x_2)}$
        to: $x_1=\ln\frac1{x_2}=-\ln x_2$
        operation: 由 $f(x_1)=g(x_2)>0$ 得 $x_1>0$、$\ln(1/x_2)>0$；$h$ 在正区间递增。
        why: 同一个递增函数取同值，自变量相等。
      source_ref: page_0031
    - step_id: step_3
      statement: 把目标式只写成 $x_1$。
      formula_trace:
        from: $\frac{x_1}{x_2}-x_1-\ln x_1$
        to: $x_1e^{x_1}-(x_1+\ln x_1)$
        operation: 由 $x_1=\ln(1/x_2)$ 得 $1/x_2=e^{x_1}$。
        why: 目标中的 $x_2$ 被同构关系消去。
      source_ref: page_0031
    - step_id: step_4
      statement: 再把乘积指数化。
      formula_trace:
        from: $x_1e^{x_1}-(x_1+\ln x_1)$
        to: $e^{x_1+\ln x_1}-(x_1+\ln x_1)$
        operation: 用 $x_1=e^{\ln x_1}$，所以 $x_1e^{x_1}=e^{x_1+\ln x_1}$。
        why: 目标变成标准函数 $e^u-u$。
      source_ref: page_0031
    - step_id: step_5
      statement: 求 $e^u-u$ 的最小值。
      formula_trace:
        from: $u=x_1+\ln x_1\quad (x_1>0)$
        to: $u\in\mathbf R,\quad e^u-u\ge1$
        operation: $x+\ln x$ 在 $(0,+\infty)$ 上连续递增，值域为 $\mathbf R$；$e^u-u$ 在 $u=0$ 取最小值 1。
        why: 等号可由 $x_1+\ln x_1=0$ 取到。
      source_ref: page_0031
teaching_card:
  student_title: 把 $-\ln x/x$ 也变成 $xe^x$
  what_it_trains: 训练识别倒数和负对数中的隐藏变量 $\ln(1/x)$，把两个函数值同构后，再把复杂目标压成 $e^u-u$。
  recognition_cues:
    - 题干给出 $xe^x$ 和 $-\ln x/x$，后者可写成 $\ln(1/x)\cdot e^{\ln(1/x)}$。
    - 条件要求函数值大于 0，可以确定同构自变量都为正。
    - 目标式含 $x_1/x_2$，同构后 $1/x_2=e^{x_1}$。
  normalization_moves:
    - 把 $-\ln x_2/x_2$ 改写为 $\ln(1/x_2)e^{\ln(1/x_2)}$。
    - 推出 $x_1=\ln(1/x_2)$。
    - 把目标式化为 $e^{x_1+\ln x_1}-(x_1+\ln x_1)$。
  common_failures:
    - 没有从 $g(x_2)>0$ 得到 $0<x_2<1$。
    - 把 $xe^x$ 当作全实数递增来用；本题实际只在正区间使用。
    - 把 $x_1e^{x_1}$ 化成指数时漏掉 $\ln x_1$。
  similar_practice_query: xe^x -lnx/x 同构 ln(1/x) e^u-u 最小值
