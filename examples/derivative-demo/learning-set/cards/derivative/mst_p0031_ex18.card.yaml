stem: 已知函数 $f(x)=xe^x$，$g(x)=-\frac{\ln x}{x}$，若 $f(x_1)=g(x_2)>0$，则 $\frac{x_1}{x_2}-x_1-\ln x_1$ 的最小值为 ______.
answer: |-
  1

  由 $f(x_1)=g(x_2)>0$ 得 $x_1e^{x_1}=-\ln x_2/x_2=\ln(1/x_2)e^{\ln(1/x_2)}$。设 $h(u)=ue^u$，它在 $(0,+\infty)$ 上递增，而 $x_1>0$、$\ln(1/x_2)>0$，所以 $x_1=\ln(1/x_2)$，即 $x_2=e^{-x_1}$。目标式化为 $x_1e^{x_1}-(x_1+\ln x_1)=e^{x_1+\ln x_1}-(x_1+\ln x_1)$。令 $u=x_1+\ln x_1$，其值域为 $\mathbf R$，于是 $e^u-u\ge1$，最小值为 1。
