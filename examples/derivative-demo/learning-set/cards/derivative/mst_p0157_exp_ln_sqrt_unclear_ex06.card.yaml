teaching_card:
  student_title: 先认结构，再核对象是否闭合
  what_it_trains: 训练用指数、对数切线不等式建立三数比较链，并在源题错印时按解析链恢复对象。
  recognition_cues:
    - 出现 $e^{0.05}$、$\sqrt{1.1}$、$1+\ln\sqrt{1.1}$ 这类相邻小量。
    - 解析用 $e^x>x+1$ 与 $x>\ln x+1$ 串起比较链。
    - 目标是比较 $a,b,c$ 的严格顺序。
  normalization_moves:
    - 由 $e^{0.1}>1.1$ 开方得到 $e^{0.05}>\sqrt{1.1}$。
    - 由 $x>\ln x+1$ 得 $\sqrt{1.1}>1+\ln\sqrt{1.1}$。
    - 合并为 $a>c>b$。
  common_failures:
    - 把 $\sqrt{1.1}$ 和 $\ln\sqrt{1.1}+1$ 的顺序写反。
    - 只看到题干错印，不利用解析链恢复题意。
    - 忘记 $x>\ln x+1$ 中的 $+1$，导致 $b$ 重建错误。
  similar_practice_query: e^x>x+1 x>lnx+1 题干疑误 变量重复
