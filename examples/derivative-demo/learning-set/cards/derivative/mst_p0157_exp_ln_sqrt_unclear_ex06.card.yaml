stem: |-
  （2024 · 深圳月考）已知 $a=e^{0.05}$，$b=1+\ln\sqrt{1.1}$，$c=\sqrt{1.1}$，则（  ）
  A. $a>b>c$
  B. $c>b>a$
  C. $b>a>c$
  D. $a>c>b$
answer: |
  D

  源解链条为：
  \[
  e^x>x+1,\quad x>\ln x+1.
  \]
  先由 $x=0.1$ 得
  \[
  e^{0.1}>1.1\Longleftrightarrow e^{0.05}>\sqrt{1.1}.
  \]
  再由 $x=\sqrt{1.1}$ 得
  \[
  \sqrt{1.1}>\ln\sqrt{1.1}+1=\frac{\ln1.1}{2}+1.
  \]
  因而源文写出 $a>c>b$，选 D。

  因此重建题干为 $a=e^{0.05}$、$c=\sqrt{1.1}$、$b=1+\ln\sqrt{1.1}$，
  得 $a>c>b$，选 D。
