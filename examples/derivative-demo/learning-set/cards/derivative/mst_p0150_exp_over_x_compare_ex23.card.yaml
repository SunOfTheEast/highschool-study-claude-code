solution:
  source_solution_summary: |
    令
    \[
    f(x)=\frac{e^x}{x},\quad x\in(0,1).
    \]
    则
    \[
    f^{\prime}(x)=\frac{e^x(x-1)}{x^2}<0\quad (0<x<1),
    \]
    所以 $f$ 在 $(0,1)$ 上递减。
    由于
    \[
    \frac25<\frac34,
    \]
    有
    \[
    f\!\left(\frac25\right)>f\!\left(\frac34\right)
    \Rightarrow
    \frac{e^{\frac25}}{\frac25}>\frac{e^{\frac34}}{\frac34}
    \Rightarrow
    \frac34e^{\frac25}>\frac25e^{\frac34},
    \]
    即 $a>c$。
    再看
    \[
    c-b=\frac25e^{\frac34}-\frac25=\frac25\left(e^{\frac34}-1\right)>0,
    \]
    所以 $c>b$。
    综上
    \[
    b<c<a,
    \]
    选 A。
  key_steps:
    - step_id: step_1
      statement: 构造同构函数并判单调。
      formula_trace:
        from: $f(x)=\frac{e^x}{x}$
        to: $f^{\prime}(x)=\frac{e^x(x-1)}{x^2}<0\ (0<x<1)$
        operation: 求导并用区间符号判定。
        why: 把两项含指数系数的比较转成函数值比较。
      source_ref: page_0150_ex23_solution
    - step_id: step_2
      statement: 比较 $a$ 与 $c$。
      formula_trace:
        from: $\frac25<\frac34$
        to: $f\left(\frac25\right)>f\left(\frac34\right)\Rightarrow a>c$
        operation: 在递减函数上反向保序。
        why: 得到主顺序的上半段。
      source_ref: page_0150_ex23_solution
    - step_id: step_3
      statement: 比较 $c$ 与 $b$。
      formula_trace:
        from: $c-b=\frac25e^{\frac34}-\frac25$
        to: $c-b=\frac25(e^{\frac34}-1)>0\Rightarrow c>b$
        operation: 直接作差判号。
        why: 补全与 $b$ 的关系。
      source_ref: page_0150_ex23_solution
    - step_id: step_4
      statement: 合并排序并匹配选项。
      formula_trace:
        from: $a>c$ 与 $c>b$
        to: $b<c<a$，选 A
        operation: 传递性合并。
        why: 完成作答。
      source_ref: page_0150_ex23_solution
teaching_card:
  student_title: 先比同构项，再作差补第三项
  what_it_trains: 训练“函数同构比较 + 直接作差补链”的双段式比大小流程。
  recognition_cues:
    - 至少两项可写成“常数倍 $e^{\alpha}$”。
    - 出现明显分数参数（如 $\frac25,\frac34$）可作为同构自变量。
    - 第三项结构更简单，适合作差判号。
  normalization_moves:
    - 先把两项统一到 $\frac{e^x}{x}$。
    - 利用单调性完成主比较。
    - 作差确定剩余一项位置。
  common_failures:
    - 把递减函数上的比较方向写反。
    - 误把 $c-b$ 展开为 $\frac25(e^{\frac34}+1)$。
    - 只证 $a>c$ 就仓促选项。
  similar_practice_query: e^x/x 单调性 分数参数 比大小 作差判号
