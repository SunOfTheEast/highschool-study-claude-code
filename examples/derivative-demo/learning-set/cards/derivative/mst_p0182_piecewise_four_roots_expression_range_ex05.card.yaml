solution:
  source_solution_summary: $g(x)$ 有四个零点等价于水平线 $y=a$ 与 $f(x)$ 有四个交点。 左侧抛物线 $-x^2-2x$ 关于 $x=-1$ 对称，所以 $x_1+x_2=-2$；右侧 $|\log_2x|$ 的两支等高满足 $x_3x_4=1$。于是 $x_3(x_1+x_2)+\frac{1}{x_3^2x_4} =-2x_3+\frac1{x_3}$。由图中四交点条件可知 $\frac12<x_3<1$，而 $-2x+\frac1x$ 在该区间单调递减，所以 取值范围为 $(-1,1)$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把四个零点转成水平线四交点。
      formula_trace:
        from: $g(x)=f(x)-a$ 有四个零点
        to: $f(x)=a$ 有四个不同解 $x_1,x_2,x_3,x_4$
        operation: 移项并用水平线 $y=a$ 解释。
        why: 分段函数图象能直接给出根之间的对称关系。
      source_ref: page_0182-page_0183
    - step_id: step_2
      statement: 读出左右两侧的等高线关系。
      formula_trace:
        from: 左侧抛物线与右侧 $|\log_2x|$ 等高
        to: $x_1+x_2=-2,\quad x_3x_4=1$
        operation: 利用抛物线轴对称和对数绝对值的倒数对称。
        why: 这是化简目标表达式的核心。
      source_ref: page_0183
    - step_id: step_3
      statement: 化简目标并判单调范围。
      formula_trace:
        from: $x_3(x_1+x_2)+\frac{1}{x_3^2x_4}$
        to: $-2x_3+\frac1{x_3},\quad \frac12<x_3<1$
        operation: 代入 $x_1+x_2=-2$ 和 $x_3x_4=1$。
        why: 单变量表达式在给定区间上递减，端点开区间给出 $(-1,1)$。
      source_ref: page_0183
