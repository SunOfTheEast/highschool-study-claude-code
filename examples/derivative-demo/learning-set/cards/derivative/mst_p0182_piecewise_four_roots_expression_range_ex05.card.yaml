stem: |-
  （2025 · 锦州模拟 T8）已知 $f(x)=\begin{cases}-x^2-2x,&x\le0\\ |\log_2x|,&x>0\end{cases}$，函数 $g(x)=f(x)-a\ (a\in\mathbf{R})$，若 $g(x)$ 有四个不同零点 $x_1,x_2,x_3,x_4$，满足 $x_1<x_2<x_3<x_4$，则 $x_3(x_1+x_2)+\frac{1}{x_3^2x_4}$ 的范围是（  ）
  A. $(-1,+\infty)$
  B. $(0,\frac72)$
  C. $\left(-1,\frac72\right]$
  D. $(-1,1)$
answer: |-
  D

  $g(x)$ 有四个零点等价于水平线 $y=a$ 与 $f(x)$ 有四个交点。 左侧抛物线 $-x^2-2x$ 关于 $x=-1$ 对称，所以 $x_1+x_2=-2$；右侧 $|\log_2x|$ 的两支等高满足 $x_3x_4=1$。于是 $x_3(x_1+x_2)+\frac{1}{x_3^2x_4} =-2x_3+\frac1{x_3}$。由图中四交点条件可知 $\frac12<x_3<1$，而 $-2x+\frac1x$ 在该区间单调递减，所以 取值范围为 $(-1,1)$，选 D。
