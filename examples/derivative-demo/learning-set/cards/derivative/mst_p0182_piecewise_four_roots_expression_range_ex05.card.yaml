    - 题目给 $f(x)-a$ 的四个零点。
    - 左侧是有对称轴的二次函数，右侧是 $|\log_2x|$。
    - 目标表达式同时含 $x_1+x_2$ 和 $x_3x_4$。
  normalization_moves:
