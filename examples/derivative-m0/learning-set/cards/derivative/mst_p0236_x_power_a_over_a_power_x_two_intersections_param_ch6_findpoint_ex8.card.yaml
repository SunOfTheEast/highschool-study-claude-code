original_problem:
  stem: （2021 · 甲卷）已知 $a>0$ 且 $a\neq1$，函数 $f(x)=\frac{x^a}{a^x}$（$x>0$）。
  parts: *a1
  choices: []
  answer: 第 (1) 问：$f$ 在 $(0,\frac2{\ln2})$ 单调递增，在 $(\frac2{\ln2},+\infty)$ 单调递减；第 (2) 问：$a\in(1,e)\cup(e,+\infty)$。
  fidelity_notes:
    - 两问均无选项。
    - 函数定义域为 $x>0$。
solution:
  source_solution_summary: 第 (1) 问代入 $a=2$ 得 $f(x)=x^2/2^x$，由 $f'(x)=x(2-x\ln2)/2^x$ 得增区间 $(0,2/\ln2)$、减区间 $(2/\ln2,+\infty)$。第 (2) 问 $f(x)=1$ 等价于 $x^a=a^x$，即 $a\ln x=x\ln a$，再化为 $g(x)=\frac{\ln a}{a}x-\ln x=0$。当 $0<a<1$ 时只有一个零点。 当 $a>1$ 时，$g$ 在 $x=a/\ln a$ 处取最小值 $1-\ln(a/\ln a)$。令 $h(a)=a/\ln a$，知 $h$ 在 $a=e$ 处最小 为 $e$，所以 $a=e$ 时只有一个切点；$1<a<e$ 或 $a>e$ 时最小值 小于 0，有两个零点。右侧充分性用等效零点取点： $g(x)=\sqrt{x}(\frac{\ln a}{a}\sqrt{x}-\frac{\ln x}{\sqrt{x}})$， 由 $\frac{\ln x}{\sqrt{x}}\leqslant2/e$ 得右侧可取 $x=a^2/\ln^2a$。故答案为 $(1,e)\cup(e,+\infty)$。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问代入 $a=2$ 后求导判号。
      formula_trace:
        from: $f(x)=\frac{x^2}{2^x}$
        to: $f^\prime(x)=\frac{x(2-x\ln2)}{2^x}$
        operation: 求导并整理出导数符号。
        why: $x>0$，导数符号只看 $2-x\ln2$。
      source_ref: page_0236_ex8_part1_solution
    - step_id: step_2
      statement: 把交点问题转成指对等式的零点问题。
      formula_trace:
        from: $\frac{x^a}{a^x}=1$
        to: $g(x)=\frac{\ln a}{a}x-\ln x=0$
        operation: 取对数并除以 $a$。
        why: 把 $x^a=a^x$ 变成熟悉的 $mx-\ln x$。
      source_ref: page_0236_ex8_solution_param_case
    - step_id: step_3
      statement: $0<a<1$ 时排除两个交点。
      formula_trace:
        from: $g^\prime(x)=\frac{\ln a}{a}-\frac1x$，$\ln a<0$
        to: $g^\prime(x)<0$，至多一个零点
        operation: 用 $\ln a/a<0$ 判导数。
        why: 单调函数不可能与 0 有两个交点。
      source_ref: page_0236_ex8_solution_param_case
    - step_id: step_4
      statement: $a>1$ 时用最小值判断两个零点。
      formula_trace:
        from: $g^\prime(x)=\frac{\ln a}{a}-\frac1x=0$
        to: $x=\frac a{\ln a}$，$g_{\min}=1-\ln\frac a{\ln a}$
        operation: 求导数零点并代回。
        why: 凸函数两零点等价于最小值小于 0。
      source_ref: page_0236_ex8_solution_param_case
    - step_id: step_5
      statement: 用 $h(a)=a/\ln a$ 找参数临界值。
      formula_trace:
        from: $g_{\min}<0$
        to: $\frac a{\ln a}>e$
        operation: 移项取指数。
        why: 零点个数变成参数函数 $h(a)$ 的大小判断。
      source_ref: page_0236_ex8_solution_param_case
    - step_id: step_6
      statement: 排除 $a=e$ 的单切情形。
      formula_trace:
        from: $h(a)=\frac a{\ln a}$
        to: $h(e)=e$，$a=e$ 时 $g_{\min}=0$
        operation: 分析 $h^\prime(a)=\frac{\ln a-1}{(\ln a)^2}$。
        why: 最小值等于 0 时只有一个交点，不符合“仅有两个”。
      source_ref: page_0236_ex8_solution_param_case
    - step_id: step_7
      statement: 用等效零点补右侧存在性。
      formula_trace:
        from: $g(x)=\frac{\ln a}{a}x-\ln x$
        to: $\sqrt{x}(\frac{\ln a}{a}\sqrt{x}-\frac{\ln x}{\sqrt{x}})$
        operation: 提出 $\sqrt{x}$。
        why: 右侧要让正的线性主体压过 $\ln x$。
      source_ref: page_0236_ex8_solution_param_case
    - step_id: step_8
      statement: 合并得到参数范围。
      formula_trace:
        from: $1<a<e$ 或 $a>e$
        to: $a\in(1,e)\cup(e,+\infty)$
        operation: 去掉 $a=e$ 的单根临界点。
        why: 这些参数下曲线与 $y=1$ 恰有两个交点。
      source_ref: page_0236_ex8_solution_param_case
teaching_card:
  student_title: $x^a=a^x$ 先化成 $mx-\ln x$，再看 $a/\ln a$
  what_it_trains: 训练指对同构式交点求参：把 $x^a=a^x$ 变成单谷函数，再用参数函数判断两个交点。
  recognition_cues:
    - 题面出现 $x^a$ 和 $a^x$，先想到取对数。
    - 交点 $y=1$ 会变成 $a\ln x=x\ln a$。
    - 出现 $\frac{\ln a}{a}x-\ln x$，就是熟悉的 $mx-\ln x$ 找点。
  normalization_moves:
    - 先完成 $a=2$ 的单调区间。
    - 第 (2) 问把 $f(x)=1$ 化成 $g(x)=0$。
    - 分 $0<a<1$ 与 $a>1$。
    - 用 $h(a)=a/\ln a$ 判断最小值是否小于 0。
    - 排除 $a=e$ 的单切情形。
  common_failures:
    - 把 $0<a<1$ 也带入 $x=a/\ln a$ 当正临界点。
    - 只得到 $a/\ln a>e$，没有用 $h(a)$ 解回 $a$。
    - 忘记 $a=e$ 时只有一个交点。
  similar_practice_query: x^a=a^x x^a/a^x y=1 两交点 a/ln a mx-lnx 指对同构
quality:
  confidence: high
