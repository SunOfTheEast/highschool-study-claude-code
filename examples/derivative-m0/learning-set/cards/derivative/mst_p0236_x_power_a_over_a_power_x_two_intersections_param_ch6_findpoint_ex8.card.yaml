stem: |-
  （2021 · 甲卷）已知 $a>0$ 且 $a\neq1$，函数 $f(x)=\frac{x^a}{a^x}$（$x>0$）。
  1. 当 $a=2$ 时，求 $f(x)$ 的单调区间。
  2. 若曲线 $y=f(x)$ 与直线 $y=1$ 有且仅有两个交点，求 $a$ 的取值范围。
answer: |-
  第 (1) 问：$f$ 在 $(0,\frac2{\ln2})$ 单调递增，在 $(\frac2{\ln2},+\infty)$ 单调递减；第 (2) 问：$a\in(1,e)\cup(e,+\infty)$。

  第 (1) 问代入 $a=2$ 得 $f(x)=x^2/2^x$，由 $f'(x)=x(2-x\ln2)/2^x$ 得增区间 $(0,2/\ln2)$、减区间 $(2/\ln2,+\infty)$。第 (2) 问 $f(x)=1$ 等价于 $x^a=a^x$，即 $a\ln x=x\ln a$，再化为 $g(x)=\frac{\ln a}{a}x-\ln x=0$。当 $0<a<1$ 时只有一个零点。 当 $a>1$ 时，$g$ 在 $x=a/\ln a$ 处取最小值 $1-\ln(a/\ln a)$。令 $h(a)=a/\ln a$，知 $h$ 在 $a=e$ 处最小 为 $e$，所以 $a=e$ 时只有一个切点；$1<a<e$ 或 $a>e$ 时最小值 小于 0，有两个零点。右侧充分性用等效零点取点： $g(x)=\sqrt{x}(\frac{\ln a}{a}\sqrt{x}-\frac{\ln x}{\sqrt{x}})$， 由 $\frac{\ln x}{\sqrt{x}}\leqslant2/e$ 得右侧可取 $x=a^2/\ln^2a$。故答案为 $(1,e)\cup(e,+\infty)$。
