solution:
  source_solution_summary: |
    当 $k<0$ 时，$f(x)=\frac{k}{x}$ 在第二、四象限各有一支。源页先用图像说明：
    第四象限的 $f$ 分支与第一象限的 $g(x)=e^x$ 分支外离，并受渐近线限制，
    必有一条公切线。要共有三条公切线，还需第二象限里再出现两条外公切线。
    按同旁相交型模型，只需 $x<0$ 时 $f(x)=g(x)$ 有两个交点，即
    $\frac{k}{x}=e^x$，也就是 $k=xe^x(x<0)$ 有两个解。
    函数 $h(x)=xe^x$ 在 $x<0$ 上于 $x=-1$ 处取最小值 $-\frac1e$，
    且两侧值域都是 $\left(-\frac1e,0\right)$。因此要有两个交点，
    必须且只需 $-\frac1e<k<0$，故选 A。
  key_steps:
    - step_id: step_1
      statement: 先把已存在的一条公切线从总数中分离出来。
      formula_trace:
        from: |
          $k<0,\qquad f(x)=\frac{k}{x},\qquad g(x)=e^x$
        to: |
          f\text{ 的第四象限分支与 }g\text{ 的第一象限分支外离，已有一条公切线。}
        operation: 按源页图像把反比例函数的两支与指数函数的象限位置拆开。
        why: 题目要求三条公切线，先固定源页指出的必然一条，剩下只需再判断两条。
      source_ref: page_0106
    - step_id: step_2
      statement: 把另外两条公切线转成第二象限内两交点。
      formula_trace:
        from: |
          f(x)=g(x),\qquad x<0
        to: |
          \frac{k}{x}=e^x,\qquad k=xe^x\quad(x<0)
        operation: 在 $x<0$ 的同旁相交型模型下，把交点条件改写成参数方程。
        why: 源页右图说明第二象限要有两条外公切线，需要两曲线在该象限满足两交点位置关系。
      source_ref: page_0106
    - step_id: step_3
      statement: 求 $xe^x$ 在负半轴上的两解范围。
      formula_trace:
        from: |
          h(x)=xe^x,\qquad x<0,\qquad h'(x)=e^x(x+1)
        to: |
          h(-1)=-\frac1e,\qquad h((-\infty,-1))=\left(-\frac1e,0\right),\qquad
          h((-1,0))=\left(-\frac1e,0\right)
        operation: 求导判断单调性，并记录极小值与两侧值域。
        why: 水平线 $y=k$ 与 $h(x)$ 在 $x<0$ 有两个交点当且仅当 $k$ 位于两侧共同开值域内。
      source_ref: page_0106
    - step_id: step_4
      statement: 确定参数范围并对应选项。
      formula_trace:
        from: |
          k=xe^x\text{ 有两个负根}
        to: |
          -\frac1e<k<0,\qquad \text{选 A}
        operation: 把两交点条件翻译成 $k$ 的开区间。
        why: 端点 $k=-1/e$ 只有一个重交点，不能提供两条额外公切线；$k=0$ 又不符合 $k<0$。
      source_ref: page_0106
teaching_card:
  student_title: 先数固定公切线，再看 $xe^x$ 的两交点
  what_it_trains: 训练把反比例函数的两支按象限拆开，用图像位置关系把公切线条数转成参数方程的交点个数。
  recognition_cues:
    - $k<0$ 的 $\frac{k}{x}$ 有第二、四象限两支，不能只画一支。
    - 题目要求“三条公切线”，源图提示其中一条来自外离型，另外两条来自同旁相交型。
    - 出现 $e^x$ 与 $\frac{k}{x}$ 相交时，参数自然整理成 $k=xe^x$。
  normalization_moves:
    - 先确认第四象限反比例分支和第一象限指数分支已有一条公切线。
    - 再让第二象限两曲线有两个交点：$k=xe^x(x<0)$。
    - 求 $xe^x$ 在负半轴上的值域，得到 $-\frac1e<k<0$。
  common_failures:
    - 只研究 $x>0$，漏掉第二象限分支。
    - 把“已有一条”和“还需两条”混在一起，导致公切线数量多算或少算。
    - 求 $xe^x$ 值域时把 $x=-1$ 的端点取入，误以为 $k=-1/e$ 也可。
  similar_practice_query: 反比例 指数 公切线 三条 xe^x 负半轴 值域
quality:
  confidence: high
  needs_review: false
  review_notes:
