stem: |-
  （2024 泉州五中高二期中 T8）若曲线 $f(x)=\frac{k}{x}(k<0)$ 与 $g(x)=e^x$ 有三条公切线，则 $k$ 的取值范围为（  ）
  A. $\left(-\frac{1}{e},0\right)$
  B. $\left(-\infty,-\frac{1}{e}\right)$
  C. $\left(-\frac{2}{e},0\right)$
  D. $\left(-\infty,-\frac{2}{e}\right)$
answer: |
  A

  当 $k<0$ 时，$f(x)=\frac{k}{x}$ 在第二、四象限各有一支。源页先用图像说明：
  第四象限的 $f$ 分支与第一象限的 $g(x)=e^x$ 分支外离，并受渐近线限制，
  必有一条公切线。要共有三条公切线，还需第二象限里再出现两条外公切线。
  按同旁相交型模型，只需 $x<0$ 时 $f(x)=g(x)$ 有两个交点，即
  $\frac{k}{x}=e^x$，也就是 $k=xe^x(x<0)$ 有两个解。
  函数 $h(x)=xe^x$ 在 $x<0$ 上于 $x=-1$ 处取最小值 $-\frac1e$，
  且两侧值域都是 $\left(-\frac1e,0\right)$。因此要有两个交点，
  必须且只需 $-\frac1e<k<0$，故选 A。
