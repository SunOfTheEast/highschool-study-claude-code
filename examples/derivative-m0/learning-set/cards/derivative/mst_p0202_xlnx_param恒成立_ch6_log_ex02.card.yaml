solution:
  source_solution_summary: 由题设 $x(\ln x-ax)+a\le0$（$x\ge1$）得 $x\ln x\le a(x^2-1)$，即 $\ln x\le a\!\left(x-\frac1x\right)$。在 $x\ge1$ 上有飘带上界 $\ln x\le\frac12\left(x-\frac1x\right)$，故要使不等式对所有 $x\ge1$ 成立， 至少需 $a\ge\frac12$，且 $a\ge\frac12$ 时右端不小于飘带上界，恒成立。 因而参数范围为 $a\ge\frac12$。
  key_steps:
    - step_id: step_1
      statement: 把题设化成对数与线性组合的比较。
      formula_trace:
        from: $x(\ln x-ax)+a\le0$
        to: $\ln x\le a\left(x-\frac1x\right)\ (x\ge1)$
        operation: 移项并除以 $x>0$。
        why: 化成可直接套用飘带函数模板的形式。
      source_ref: page_0202_solution
    - step_id: step_2
      statement: 调用 $x\ge1$ 的飘带上界。
      formula_trace:
        from: $x\ge1$
        to: $\ln x\le\frac12\left(x-\frac1x\right)$
        operation: 使用源页给出的飘带函数不等式。
        why: 给出控制系数的基准下界 $\frac12$。
      source_ref: page_0202_solution
    - step_id: step_3
      statement: 比较系数并写出参数范围。
      formula_trace:
        from: $\ln x\le\frac12\left(x-\frac1x\right)$
        to: $a\ge\frac12$
        operation: 要让 $\ln x\le a(x-\frac1x)$ 对全区间成立，需 $a$ 不小于基准系数。
        why: 确定恒成立条件。
      source_ref: page_0202_solution
