stem: 已知函数 $f(x)=x(\ln x-ax)+a$，对任意的 $x\geqslant1$，都有 $f(x)\leqslant0$，则实数 $a$ 的取值范围是______。
answer: |-
  $a\geqslant\frac12$

  由题设 $x(\ln x-ax)+a\le0$（$x\ge1$）得 $x\ln x\le a(x^2-1)$，即 $\ln x\le a\!\left(x-\frac1x\right)$。在 $x\ge1$ 上有飘带上界 $\ln x\le\frac12\left(x-\frac1x\right)$，故要使不等式对所有 $x\ge1$ 成立， 至少需 $a\ge\frac12$，且 $a\ge\frac12$ 时右端不小于飘带上界，恒成立。 因而参数范围为 $a\ge\frac12$。
