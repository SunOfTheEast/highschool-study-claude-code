original_problem:
  stem: 已知函数 $f(x)=x(\ln x-ax)+a$，对任意的 $x\geqslant1$，都有 $f(x)\leqslant0$，则实数 $a$ 的取值范围是______。
  parts: *a1
  choices: []
  answer: $a\geqslant\frac12$
  fidelity_notes:
