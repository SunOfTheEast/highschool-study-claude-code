stem: 当 $a<0$ 时，讨论函数 $f(x)=\ln x-ax$ 的零点个数。
answer: |-
  $f(x)$ 有唯一零点，且零点 $x_1\in(e^a,1)$。

  $f'(x)=\frac1x-a>0$，所以 $f$ 在 $(0,+\infty)$ 上单调递增，至多 一个零点。又 $f(1)=-a>0$，需要在 $(0,1)$ 中找一个负值点。 因为 $a<0$，在 $0<x<1$ 时有 $0<-ax<-a$，所以 $f(x)=\ln x-ax<\ln x-a$。令 $\ln x-a=0$，取 $m=e^a$，则 $f(e^a)=a-ae^a=a(1-e^a)<0$。因此存在唯一 $x_1\in(e^a,1)$ 使 $f(x_1)=0$。
