original_problem:
  stem: 当 $a<0$ 时，讨论函数 $f(x)=\ln x-ax$ 的零点个数。
  parts: *a1
  choices: []
  answer: $f(x)$ 有唯一零点，且零点 $x_1\in(e^a,1)$。
  fidelity_notes:
    - 单问零点个数题，无选项。
    - 题设 $a<0$，所以 $0<e^a<1$。
solution:
  source_solution_summary: $f'(x)=\frac1x-a>0$，所以 $f$ 在 $(0,+\infty)$ 上单调递增，至多 一个零点。又 $f(1)=-a>0$，需要在 $(0,1)$ 中找一个负值点。 因为 $a<0$，在 $0<x<1$ 时有 $0<-ax<-a$，所以 $f(x)=\ln x-ax<\ln x-a$。令 $\ln x-a=0$，取 $m=e^a$，则 $f(e^a)=a-ae^a=a(1-e^a)<0$。因此存在唯一 $x_1\in(e^a,1)$ 使 $f(x_1)=0$。
  key_steps:
    - step_id: step_1
      statement: 先证明函数在定义域内递增。
      formula_trace:
        from: $f(x)=\ln x-ax$
        to: $f^\prime(x)=\frac1x-a>0$
        operation: 求导并用 $a<0$。
        why: 单调递增说明零点至多一个。
      source_ref: page_0232_ex2_solution
    - step_id: step_2
      statement: 用 $f(1)>0$ 锁定上界点。
      formula_trace:
        from: $f(1)=\ln1-a$
        to: $f(1)=-a>0$
        operation: 代入 $x=1$。
        why: 需要在 1 左侧找负值点。
      source_ref: page_0232_ex2_solution
    - step_id: step_3
      statement: 构造找小点的大函数。
      formula_trace:
        from: $f(x)=\ln x-ax$
        to: $f(x)<\ln x-a\quad(0<x<1)$
        operation: 用 $0<-ax<-a$。
        why: 递增函数找小点时，用更大的函数先变成 0。
      source_ref: page_0232_ex2_solution
    - step_id: step_4
      statement: 解可解方程并验证负值点。
      formula_trace:
        from: $\ln x-a=0$
        to: $m=e^a,\quad f(e^a)=a(1-e^a)<0$
        operation: 指数化解方程并代回。
        why: $a<0$ 使 $e^a<1$，同时 $a(1-e^a)<0$。
      source_ref: page_0232_ex2_solution
    - step_id: step_5
      statement: 由变号和单调性确定唯一零点。
      formula_trace:
        from: $f(e^a)<0,\ f(1)>0$
        to: $\exists! x_1\in(e^a,1),\ f(x_1)=0$
        operation: 介值定理加单调性。
        why: 存在性由变号，唯一性由递增。
      source_ref: page_0232_ex2_solution
teaching_card:
  student_title: 递增对数函数先锁住 1，再用 $\ln x-a=0$ 找左边点
  what_it_trains: 训练对数型零点取点：把客体变量 $-ax$ 锁成常数，转成可解的对数方程。
  recognition_cues:
    - $a<0$ 时 $\ln x-ax$ 在正半轴递增。
    - $f(1)>0$，所以要在 $(0,1)$ 找负值。
    - $-ax$ 在 $(0,1)$ 上被 $-a$ 控住，能构造 $\ln x-a=0$。
  normalization_moves:
    - 先判 $f^\prime(x)>0$。
    - 代 $x=1$ 得正值。
    - 用 $f(x)<\ln x-a$ 构造可解方程。
    - 取 $m=e^a$ 并夹出唯一零点。
  common_failures:
    - 忘记 $x>0$ 的定义域。
    - 不知道为什么要用 $\ln x-a=0$，只是机械猜 $e^a$。
    - 漏掉 $a(1-e^a)<0$ 的符号验证。
  similar_practice_query: lnx-ax a<0 零点个数 锁界 放缩取点 增反减同 e^a
