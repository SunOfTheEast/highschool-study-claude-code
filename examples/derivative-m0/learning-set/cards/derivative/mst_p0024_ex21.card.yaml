solution:
  source_solution_summary: 先由两函数都有最小值排除 $a\le 0$，再由最小值相等得到 $\ln a=(a-1)/(a+1)$ 并用单调函数证明 $a=1$。随后证明 $f-g$ 只有一个零点，取该公共交点对应的水平线，用 $x-\ln x=e^{\ln x}-\ln x$ 与 $e^x-x$ 的同构根关系推出 $x_1+x_3=2x_2$。
  key_steps:
    - step_id: step_1
      statement: 排除 $a\le 0$，确认两个函数存在最小值时必须有 $a>0$。
      formula_trace:
        from: |
          $f'(x)=\mathrm{e}^{x}-a,\quad g'(x)=a-\frac{1}{x}$
        to: $a>0$
        operation: |
          当 $a\le 0$ 时，$f'(x)>0$ 且 $g'(x)<0$，两个函数没有题设所需的最小值结构。
        why: 题设要求 $f$ 与 $g$ 有相同的最小值，必须先保证最小值存在。
      source_ref: page_0024
    - step_id: step_2
      statement: 在 $a>0$ 下求出两个最小值并列方程。
      formula_trace:
        from: |
          $f'(x)=0,\quad g'(x)=0$
        to: $f_{\min}=f(\ln a)=a-a\ln a,\quad g_{\min}=g\left(\frac1a\right)=1+\ln a$
        operation: 分别解 $\mathrm{e}^x=a$ 与 $a=1/x$，再代回原函数。
        why: 导数在临界点两侧变号，对应最小值。
      source_ref: page_0024
    - step_id: step_3
      statement: 把最小值相等转化为单调函数的唯一零点。
      formula_trace:
        from: $a-a\ln a=1+\ln a$
        to: $\ln a=\frac{a-1}{a+1},\quad a=1$
        operation: |
          移项得 $(a+1)\ln a=a-1$；令 $h(x)=\ln x-\frac{x-1}{x+1}$，则 $h'(x)=\frac{x^2+1}{x(x+1)^2}>0$ 且 $h(1)=0$。
        why: $h$ 在 $(0,+\infty)$ 上严格递增，所以零点唯一。
      source_ref: page_0024
    - step_id: step_4
      statement: 证明两曲线 $y=f(x)$ 与 $y=g(x)$ 只有一个公共点。
      formula_trace:
        from: $F(x)=f(x)-g(x)=\mathrm{e}^x+\ln x-2x$
        to: $F(x)$ 在 $(0,+\infty)$ 上有唯一零点 $x_2$
        operation: |
          用 $\mathrm{e}^x\ge x+1$ 得 $F'(x)=\mathrm{e}^x+\frac1x-2\ge x+\frac1x-1\ge 1$；再由 $F(\mathrm{e}^{-\mathrm{e}})<\mathrm{e}+\ln(\mathrm{e}^{-\mathrm{e}})=0$、$F(1)=\mathrm{e}-2>0$ 定位零点。
        why: 严格递增加上一正一负的函数值给出唯一交点。
      source_ref: page_0024
    - step_id: step_5
      statement: 取公共交点高度，得到水平线与两曲线共有三个不同交点。
      formula_trace:
        from: $b=f(x_2)=g(x_2)$
        to: $y=b$ 与 $y=f(x)$、$y=g(x)$ 的交点横坐标为 $x_1<x_2<x_3$
        operation: 由 $x_2\in(0,1)$ 得 $b>1$；$f(x)=\mathrm{e}^x-x$ 在 $0$ 处取最小值 $1$，$g(x)=x-\ln x$ 在 $1$ 处取最小值 $1$，所以水平线除公共点 $x_2$ 外还分别给出 $f$ 的左根 $x_1$ 与 $g$ 的右根 $x_3$。
        why: 三个交点的存在性来自极小值两侧的单调性与 $x_2$ 是唯一公共点。
      source_ref: page_0024
    - step_id: step_6
      statement: 用同构根关系证明三个横坐标成等差数列。
      formula_trace:
        from: $\mathrm{e}^{x_1}-x_1=b,\quad x_2-\ln x_2=b,\quad x_3-\ln x_3=b$
        to: $x_1=\ln x_2,\quad x_2=\ln x_3,\quad x_1+x_3=2x_2$
        operation: 把 $x-\ln x=b$ 写成 $\mathrm{e}^{\ln x}-\ln x=b$，与 $\mathrm{e}^t-t=b$ 的两根匹配；再由公共交点方程 $\mathrm{e}^{x_2}+\ln x_2=2x_2$，代入 $x_3=\mathrm{e}^{x_2}$ 与 $x_1=\ln x_2$。
        why: 同一水平线下的指对互换把根的坐标关系转化为等差条件。
      source_ref: page_0024
teaching_card:
  student_title: 用指对同构证明水平线三交点成等差
  what_it_trains: 训练从最小值条件确定参数，再把指数曲线与对数曲线的水平线交点统一到同一个方程中。
  recognition_cues:
    - 题干同时出现 $\mathrm{e}^x-a x$ 与 $a x-\ln x$。
    - 要求水平线与两条曲线的交点横坐标形成数列关系。
    - 解析中出现 $x$ 与 $\ln x$ 的互换。
  normalization_moves:
    - 先由最小值相等求出参数 $a$。
    - 令 $F=f-g$ 证明公共交点唯一。
    - 把 $x-\ln x$ 写成 $\mathrm{e}^{\ln x}-\ln x$，转入 $\mathrm{e}^t-t$。
  common_failures:
    - 忽略 $a\le 0$ 时函数没有最小值。
    - 只画图接受三交点，未证明公共交点唯一。
    - 看不出 $x_1=\ln x_2$ 与 $x_2=\ln x_3$ 的同构来源。
  similar_practice_query: 指对同构 水平线 三交点 横坐标 等差 $\mathrm{e}^x-x$ $x-\ln x$
