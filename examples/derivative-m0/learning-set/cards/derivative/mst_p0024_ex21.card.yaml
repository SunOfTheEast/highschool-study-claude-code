stem: |-
  （2022 · 新高考 1）已知函数 $f(x)=\mathrm{e}^{x}-a x$ 和 $g(x)=a x-\ln x$ 有相同的最小值.

  (1) 求 $a$;
  (2) 证明：存在直线 $y=b$，其与两条曲线 $y=f(x)$ 和 $y=g(x)$ 共有三个不同的交点，并且从左到右的三个交点的横坐标成等差数列.
answer: |-
  (1) $a=1$。
  (2) 设 $x_2$ 为 $f(x)=g(x)$ 的唯一交点横坐标，取 $b=f(x_2)=g(x_2)$。此时水平线 $y=b$ 与 $y=f(x)$、$y=g(x)$ 的三个不同交点横坐标可记为 $x_1<x_2<x_3$，且 $x_1=\ln x_2$、$x_2=\ln x_3$，从而 $x_1+x_3=2x_2$。


  先由两函数都有最小值排除 $a\le 0$，再由最小值相等得到 $\ln a=(a-1)/(a+1)$ 并用单调函数证明 $a=1$。随后证明 $f-g$ 只有一个零点，取该公共交点对应的水平线，用 $x-\ln x=e^{\ln x}-\ln x$ 与 $e^x-x$ 的同构根关系推出 $x_1+x_3=2x_2$。
