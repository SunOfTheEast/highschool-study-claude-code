solution:
  source_solution_summary: |
    设切点为 $(x_0,(x_0+1)e^{x_0})$，因为
    $f'(x)=(x+2)e^x$，将 $P(-1,a)$ 代入切线方程得
    $a=-(x_0+1)^2e^{x_0}$。令 $g(x)=-(x+1)^2e^x$，
    则 $g'(x)=-(x+1)(x+3)e^x$。所以 $g$ 在 $(-\infty,-3)$、
    $(-1,+\infty)$ 上递减，在 $(-3,-1)$ 上递增，且
    $g(-3)=-4/e^3$，$g(-1)=0$。由水平线 $y=a$ 与 $g$ 的交点数：
    $a>0$ 时无切线，$a=0$ 时 $n=1$，$-4/e^3<a<0$ 时 $n=3$，
    $a=-4/e^3$ 时 $n=2$，$a<-4/e^3$ 时 $n=1$。故 $n$ 最大为 3，
    A 错；因所有有切线时 $a\le0$，且 $a=0,n=1$，所以 $na$ 最大值为 0，
    B 对；距离问题中令切线斜率平行于 $2x-y-4=0$，即
    $(x_0+2)e^{x_0}=2$，唯一解 $x_0=0$，点为 $(0,1)$，
    距离为 $\frac{|2\cdot0-1-4|}{\sqrt5}=\sqrt5$，C 对；
    $n=1$ 正是 $a< -4/e^3$ 或 $a=0$，D 对。故选 BCD。
  key_steps:
    - step_id: step_1
      statement: 设切点并把外点代入切线方程。
      formula_trace:
        from: $f(x)=(x+1)e^x,\quad f^{\prime}(x)=(x+2)e^x$
        to: $y-(x_0+1)e^{x_0}=(x_0+2)e^{x_0}(x-x_0)$
        operation: 用切点坐标和导数斜率写切线点斜式。
        why: 过 $P(-1,a)$ 的切线条数由切点参数 $x_0$ 决定。
      source_ref: page_0097
    - step_id: step_2
      statement: 得到外点高度参数函数 $g(x)$。
      formula_trace:
        from: $a-(x_0+1)e^{x_0}=(x_0+2)e^{x_0}(-1-x_0)$
        to: $a=-(x_0+1)^2e^{x_0}=:g(x_0)$
        operation: 展开并合并含 $(x_0+1)$ 的项。
        why: 水平线 $y=a$ 与 $g$ 的交点数就是切线条数 $n$。
      source_ref: page_0097
    - step_id: step_3
      statement: 分析 $g$ 的单调性和极值。
      formula_trace:
        from: $g(x)=-(x+1)^2e^x$
        to: $g^{\prime}(x)=-(x+1)(x+3)e^x,\quad g(-3)=-\frac4{e^3},\quad g(-1)=0$
        operation: 求导并令 $g^{\prime}(x)=0$ 得 $x=-3,-1$。
        why: 两个临界高度 $-4/e^3$ 与 $0$ 决定水平线交点数变化。
      source_ref: page_0097
    - step_id: step_4
      statement: 按 $a$ 的位置数切线条数。
      formula_trace:
        from: $g(-3)=-\frac4{e^3},\quad g(-1)=0,\quad \lim_{x\to-\infty}g(x)=0,\quad \lim_{x\to+\infty}g(x)=-\infty$
        to: $a=0:n=1;\ -\frac4{e^3}<a<0:n=3;\ a=-\frac4{e^3}:n=2;\ a<-\frac4{e^3}:n=1$
        operation: 在 $(-\infty,-3)$、$(-3,-1)$、$(-1,+\infty)$ 三段分别数水平线交点。
        why: 这是判断 A、B、D 的核心计数表。
      source_ref: page_0098
    - step_id: step_5
      statement: 判断 A、B、D。
      formula_trace:
        from: $n_{\max}=3,\quad a\le0,\quad n=1\Leftrightarrow a<-\frac4{e^3}\text{ 或 }a=0$
        to: A 错误，B 正确，D 正确
        operation: 把计数表代入三个选项。
        why: 选项 A、B、D 都只依赖 $a$ 与切线条数 $n$ 的关系。
      source_ref: page_0098
    - step_id: step_6
      statement: 用平行切线求曲线上点到直线的最小距离。
      formula_trace:
        from: 直线 $2x-y-4=0$ 的斜率为 $2$，曲线切线斜率 $f^{\prime}(x_0)=(x_0+2)e^{x_0}$
        to: $(x_0+2)e^{x_0}=2,\quad x_0=0,\quad f(0)=1$
        operation: 令切线斜率与给定直线平行，并用 $h(x)=(x+2)e^x$ 的单调性确定唯一解。
        why: 曲线上到一条直线距离最小的点，其切线应与该直线平行。
      source_ref: page_0098
    - step_id: step_7
      statement: 计算最小距离并给出答案。
      formula_trace:
        from: 最近点 $(0,1)$，直线 $2x-y-4=0$
        to: $d=\frac{|2\cdot0-1-4|}{\sqrt{2^2+(-1)^2}}=\sqrt5$
        operation: 代入点到直线距离公式。
        why: 得到 C 正确，与源页答案 BCD 一致。
      source_ref: page_0098
teaching_card:
  student_title: 把 $P(-1,a)$ 的切线条数化成水平线数交点
  what_it_trains: 训练用切点参数函数统计过定点的切线条数，并把曲线到直线的最短距离转成平行切线条件。
  recognition_cues:
    - 外点固定在 $x=-1$ 上，只剩高度 $a$ 变化。
    - 切线条数随 $a$ 变化，适合建立 $a=g(x_0)$ 后数水平线交点。
    - 选项 C 问曲线动点到直线的距离最小值，提示最近点处切线与直线平行。
  normalization_moves:
    - 设切点 $x_0$，代入 $P(-1,a)$ 得 $a=-(x_0+1)^2e^{x_0}$。
    - 求 $g^{\prime}(x)$，用 $x=-3,-1$ 分出 $a=-4/e^3$ 与 $a=0$。
    - 令 $f^{\prime}(x_0)=2$ 找到最近点 $(0,1)$，再算点到直线距离。
  common_failures:
    - 把 $a=-4/e^3$ 当成只有一条切线，漏掉右支上的另一个切点。
    - 把 $a<-4/e^3$ 误数成两条切线；实际上只有右支一个交点。
    - 算距离时直接拿任意点代入，没先用平行切线确定最近点。
  similar_practice_query: $(x+1)e^x$ 过 $P(-1,a)$ 切线条数 $g(x)=-(x+1)^2e^x$
