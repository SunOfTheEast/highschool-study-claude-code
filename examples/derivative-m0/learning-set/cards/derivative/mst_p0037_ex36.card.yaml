solution:
  source_solution_summary: |
    设 $t=a+\ln b$，则 $b=e^{t-a}$。原条件 $abe^a+\ln b-1=0$ 化为 $ae^t+t-a-1=0$，即 $t+ae^t=a+1$。函数 $\phi(t)=t+ae^t$ 严格递增，且 $\phi(0)=a<a+1$、$\phi(1)=1+ae>a+1$，所以 $0<t<1$。于是 $a+\ln b=t>0$，得到 $e^a>1/b$，B 正确；$t<1$，C 正确。由 $t<1$ 得 $\ln b<1-a\le1/a$，A 错误。又 $ab=a e^{t-a}<a e^{1-a}=e\cdot a/e^a\le1$，且因 $t<1$ 为严格不等，故 $ab<1$，D 正确。故选 BCD。
  key_steps:
    - step_id: step_1
      statement: 把条件改写成关于 $t=a+\ln b$ 的单调方程。
      formula_trace:
        from: |
          $abe^a+\ln b-1=0,\quad t=a+\ln b$
        to: |
          $ae^t+t-a-1=0\Rightarrow t+ae^t=a+1$
        operation: 由 $b=e^{t-a}$ 得 $abe^a=a e^t$，并用 $\ln b=t-a$。
        why: 四个选项都可由 $t=a+\\ln b$ 的范围控制。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0038/page_0038.md:14-18
    - step_id: step_2
      statement: 确定 $t$ 的范围。
      formula_trace:
        from: |
          $\phi(t)=t+ae^t,\quad a>0$
        to: |
          $\phi'(t)=1+ae^t>0,\quad \phi(0)=a<a+1<1+ae=\phi(1)$
        operation: 用严格递增函数和介值比较定位方程解。
        why: 得到 $0<t<1$，也就是 $0<a+\ln b<1$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0038/page_0038.md:14-18
    - step_id: step_3
      statement: 判断 B 与 C。
      formula_trace:
        from: |
          $0<a+\ln b<1$
        to: |
          $a+\ln b>0\Rightarrow e^a>\frac1b,\quad a+\ln b<1$
        operation: 把 $a+\ln b>0$ 改写为 $a>-\ln b=\ln(1/b)$，再指数化。
        why: 分别对应选项 B、C。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0038/page_0038.md:14-16
    - step_id: step_4
      statement: 判断 A。
      formula_trace:
        from: |
          $a+\ln b<1$
        to: |
          $\ln b<1-a\le\frac1a$
        operation: 移项得上界；再用 $a+1/a\ge2$ 得 $1-a\le1/a$。
        why: 因此不可能有 $\\ln b>1/a$，A 错误。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0038/page_0038.md:17
    - step_id: step_5
      statement: 判断 D。
      formula_trace:
        from: |
          $t=a+\ln b<1,\quad ab=ae^{\ln b}=ae^{t-a}$
        to: |
          $ab<a e^{1-a}=e\cdot \frac a{e^a}\le1$
        operation: 用 $t<1$ 放大，再用函数 $a/e^a$ 在 $a>0$ 上的最大值 $1/e$。
        why: 严格小于来自 $t<1$，所以 D 正确。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0038/page_0038.md:18
teaching_card:
  student_title: 先夹出 $0<a+\ln b<1$ 再判四项
  what_it_trains: 多选题里四个式子都围着 $a+\ln b$ 和 $ab$ 转时，先把原条件压成一个单调方程，拿到 $0<a+\ln b<1$，再逐项翻译。
  recognition_cues:
    - 条件有 $abe^a$ 和 $\\ln b$，把 $a+\ln b$ 合成一个整体很自然。
    - B、C 直接对应 $a+\ln b$ 的正负和上界。
    - D 需要把 $ab$ 写成 $ae^{(a+\ln b)-a}$。
  normalization_moves:
    - 设 $t=a+\\ln b$，把 $b=e^{t-a}$ 代回条件。
    - 用 $\phi(0)$ 与 $\phi(1)$ 给 $t$ 定位。
    - 判断 A 时先由 $t<1$ 得 $\\ln b<1-a$。
    - 判断 D 时用 $a/e^a$ 的最大值。
  common_failures:
    - 只沿源解第一条同构证明 B，却没有得到足够清楚的统一范围。
    - 把 $a+\ln b>0$ 误读成 $\\ln b>1/a$。
    - 证明 $ab<1$ 时忘记 $t<1$ 是严格不等。
  similar_practice_query: abe^a+lnb-1=0 多选 同构 a+lnb ab<1
