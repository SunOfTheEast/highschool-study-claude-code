stem: |-
  函数 f(x)=x^2，g(x)=2\ln x+a 的图象有公共点，则实数 a 的取值范围为（ ）
  A. [e, +∞)
  B. (1, +∞)
  C. [1, +∞)
  D. (-∞, -1]
answer: |-
  C

  公共点等价于 x^2-2\ln x-a=0 在 x>0 有实根。令 h(x)=x^2-2\ln x-a，导数 h'(x)=2x-2/x，最小值在 x=1 处为 1-a，因此有实根需且只需 1-a\leqslant0，即 a\geqslant1。也可令 t=x^2，化为 t=\ln t+a，利用 t\geqslant\ln t+1 得同样结论。
