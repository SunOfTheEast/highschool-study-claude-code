solution:
  source_solution_summary: |
    法一：构造
    $f(x)=(16-x)\ln x\ (7\le x\le9)$，
    则
    $f^{\prime}(x)=-\ln x+\frac{16}{x}-1$。
    源解指出 $f^{\prime}(x)$ 递减，且
    $f^{\prime}(7)=\frac27-\ln\frac7e<0$，
    所以 $f^{\prime}(x)<0$，$f$ 在区间上递减，
    从而
    $f(9)<f(8)<f(7)$，
    即
    $7\ln9<8\ln8<9\ln7$，
    等价于
    $\ln9^7<\ln8^8<\ln7^9$，
    所以 $c<b<a$。
    法二：二项式展开
    $b=(7+1)^8<7\cdot7^8=7^9=a$，
    $c=(8+1)^7<8\cdot8^7=8^8=b$，
    亦得 $c<b<a$，选 D。
  key_steps:
    - step_id: step_1
      statement: 法一先构造同构函数。
      formula_trace:
        from: $a=7^9,\ b=8^8,\ c=9^7$
        to: 令 $f(x)=(16-x)\ln x$，比较 $f(7),f(8),f(9)$
        operation: 把幂比较转成“指数和底数系数”统一表达。
        why: 便于用导数一次性判断三项顺序。
      source_ref: page_0145_ex08_solution
    - step_id: step_2
      statement: 判 $f$ 递减。
      formula_trace:
        from: $f^{\prime}(x)=-\ln x+\frac{16}{x}-1$
        to: $f^{\prime}(x)\downarrow,\ f^{\prime}(7)<0\Rightarrow f^{\prime}(x)<0$
        operation: 利用导函数单调性与端点符号。
        why: 得到 $f(9)<f(8)<f(7)$。
      source_ref: page_0145_ex08_solution
    - step_id: step_3
      statement: 把函数值顺序还原成原幂顺序。
      formula_trace:
        from: $f(9)<f(8)<f(7)$
        to: $\ln9^7<\ln8^8<\ln7^9\Rightarrow c<b<a$
        operation: 展开 $f(k)$ 并利用对数函数单调性。
        why: 完成法一主结论。
      source_ref: page_0145_ex08_solution
    - step_id: step_4
      statement: 法二用二项式展开夹逼。
      formula_trace:
        from: $b=8^8,\ c=9^7$
        to: $b=(7+1)^8<7^9=a,\ c=(8+1)^7<8^8=b$
        operation: 展开后上界估计：省略的其余项均为正。
        why: 独立得到同一顺序 $c<b<a$。
      source_ref: page_0145_ex08_solution
    - step_id: step_5
      statement: 对应选项。
      formula_trace:
        from: $c<b<a$
        to: 选 D
        operation: 与选项匹配。
        why: 作答完成。
      source_ref: page_0145_ex08_solution
teaching_card:
  student_title: 顺子幂两招：同构 + 展开
  what_it_trains: 训练“顺子指数”题的双通路：一条是导数同构函数全局判序，一条是二项式展开逐级夹逼。
  recognition_cues:
    - 形如 $n^{m+2},(n+1)^{m+1},(n+2)^m$ 的互换结构。
    - 题目恰好位于二项式定理比较小节。
    - 选项给的是严格全序。
  normalization_moves:
    - 先尝试把三项写成 $(常数-x)\ln x$ 型。
    - 再用展开估计做平行验证。
    - 两条链一致时再定答案。
  common_failures:
    - 只凭“大指小底”直接猜顺序，忽略该题不适配单条口诀。
    - 展开时把“其余项均为正”漏写，导致不等式依据不足。
    - 函数法中未明确区间，导数判断不完整。
