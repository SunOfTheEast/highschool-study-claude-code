stem: |-
  （2023·辽宁模拟）已知 $a=7^9$，$b=8^8$，$c=9^7$，则 $a,b,c$ 的大小关系为（  ）
  A. $c<a<b$
  B. $b<c<a$
  C. $b<a<c$
  D. $c<b<a$
answer: |
  D

  法一：构造
  $f(x)=(16-x)\ln x\ (7\le x\le9)$，
  则
  $f^{\prime}(x)=-\ln x+\frac{16}{x}-1$。
  源解指出 $f^{\prime}(x)$ 递减，且
  $f^{\prime}(7)=\frac27-\ln\frac7e<0$，
  所以 $f^{\prime}(x)<0$，$f$ 在区间上递减，
  从而
  $f(9)<f(8)<f(7)$，
  即
  $7\ln9<8\ln8<9\ln7$，
  等价于
  $\ln9^7<\ln8^8<\ln7^9$，
  所以 $c<b<a$。
  法二：二项式展开
  $b=(7+1)^8<7\cdot7^8=7^9=a$，
  $c=(8+1)^7<8\cdot8^7=8^8=b$，
  亦得 $c<b<a$，选 D。
