stem: |-
  （2024 广州六中月考 T7）若直线 $y=kx+b$ 是曲线 $f(x)=e^{x-2023}$ 与 $g(x)=e^{x+2024}-2025$ 的公切线，则 $k=$ （  ）
  A. $\frac{1}{2025}$
  B. $\frac{2023}{2024}$
  C. $\frac{2025}{4047}$
  D. $\frac{2}{4047}$
answer: |
  C

  因为
  $g(x)=e^{x+2024}-2025=f(x+4047)-2025$，
  两曲线是水平相差 $4047$、竖直相差 $2025$ 的平行曲线。设公切线
  分别切于 $f$ 的 $x_1$ 和 $g$ 的 $x_2$，等斜率给出
  $e^{x_1-2023}=e^{x_2+2024}$，所以 $x_1-x_2=4047$。
  两切点纵坐标差为 $e^{x_1-2023}-(e^{x_2+2024}-2025)=2025$。
  公切线经过两个切点，故
  $k=\frac{\Delta y}{\Delta x}=\frac{2025}{4047}$，选 C。
