solution:
  source_solution_summary: |
    因为
    $g(x)=e^{x+2024}-2025=f(x+4047)-2025$，
    两曲线是水平相差 $4047$、竖直相差 $2025$ 的平行曲线。设公切线
    分别切于 $f$ 的 $x_1$ 和 $g$ 的 $x_2$，等斜率给出
    $e^{x_1-2023}=e^{x_2+2024}$，所以 $x_1-x_2=4047$。
    两切点纵坐标差为 $e^{x_1-2023}-(e^{x_2+2024}-2025)=2025$。
    公切线经过两个切点，故
    $k=\frac{\Delta y}{\Delta x}=\frac{2025}{4047}$，选 C。
  key_steps:
    - step_id: step_1
      statement: 识别两条指数曲线的平移关系。
      formula_trace:
        from: |
          $f(x)=e^{x-2023},\qquad g(x)=e^{x+2024}-2025$
        to: |
          $g(x)=f(x+4047)-2025$
        operation: 把 $x+2024$ 写成 $(x+4047)-2023$。
        why: 这说明两曲线是平行曲线，水平位移为 $4047$，竖直位移为 $2025$。
      source_ref: page_0102
    - step_id: step_2
      statement: 用切点参数核对水平位移。
      formula_trace:
        from: |
          $k=f'(x_1)=e^{x_1-2023}=g'(x_2)=e^{x_2+2024}$
        to: |
          $x_1-2023=x_2+2024,\qquad x_1-x_2=4047$
        operation: 等斜率后取指数的同底指数相等。
        why: 公切线在两条平行指数曲线上的切点横坐标相差固定值。
      source_ref: page_0102
    - step_id: step_3
      statement: 用两切点连线斜率得到公切线斜率。
      formula_trace:
        from: |
          $f(x_1)-g(x_2)=e^{x_1-2023}-(e^{x_2+2024}-2025)=2025,\quad x_1-x_2=4047$
        to: |
          $k=\frac{2025}{4047}$
        operation: 公切线通过两个切点，斜率等于两切点连线斜率。
        why: 平行曲线公切线的斜率由平移向量直接确定。
      source_ref: page_0102
teaching_card:
  student_title: 平移后的指数曲线，公切线斜率看位移
  what_it_trains: 训练从两个指数函数中识别平行曲线，把公切线斜率直接转成水平位移与竖直位移的比值。
  recognition_cues:
    - 两个函数都是同一个 $e^x$ 的平移。
    - 题目只问 $k$，没有问切点或截距，提示先看整体平移。
    - $2024$ 与 $2023$ 的差需要跨过指数内部，合成水平位移 $4047$。
  normalization_moves:
    - 把 $g(x)$ 改写成 $f(x+4047)-2025$。
    - 把两切点横差记为 $4047$，纵差记为 $2025$。
    - 用 $k=\Delta y/\Delta x$ 直接选 C。
  common_failures:
    - 只比较 $2024$ 和 $2023$，把水平位移误算成 $1$。
    - 忽略 $-2025$ 的竖直平移。
    - 平移方向说反后又把斜率写成负数。
  similar_practice_query: 平行曲线 公切线 指数平移 斜率
