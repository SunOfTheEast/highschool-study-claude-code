stem: |-
  (2023·安徽模拟 T8) 已知 $a>0$，$b>0$，且 $b[\sqrt{a^2+1}+\ln(ab)]>\sqrt{1+b^2}$，则 $a$，$b$ 的值不可能是（ ）

  A. $\begin{cases}a=2\\ b=\sin31^\circ\end{cases}$
  B. $\begin{cases}a=\log_2 5\\ b=\frac{\sqrt5}{4}\end{cases}$
  C. $\begin{cases}a=\log_4 3\\ b=\log_4 5\end{cases}$
  D. $\begin{cases}a=1\\ b=2\end{cases}$
answer: |
  C

  因为 $a,b>0$，原不等式除以 $b$ 并整理为 $\sqrt{a^2+1}+\ln a>\sqrt{\frac1{b^2}+1}+\ln\frac1b$。令 $h(x)=\sqrt{x^2+1}+\ln x$，它在 $x>0$ 上严格递增，所以 $h(a)>h(1/b)$ 等价于 $a>1/b$，即 $ab>1$。逐项检验：A 中 $2\sin31^\circ>1$，B 中 $\log_2 5\cdot\frac{\sqrt5}{4}>1$，D 中 $ab=2>1$，都可能；C 中 $\log_4 3\cdot\log_4 5<1$，不可能，故选 C。
