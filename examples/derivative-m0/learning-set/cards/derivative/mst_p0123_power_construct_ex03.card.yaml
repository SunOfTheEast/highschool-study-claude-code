stem: |-
  （2023 · 吉林期末）函数 $f(x)$ 是定义在区间 $(0,+\infty)$ 上可导函数，其导函数为 $f^{\prime}(x)$ 且满足 $x f^{\prime}(x)+2f(x)>0$，则不等式 $\frac{(x+2023)f(x+2023)}{5}<\frac{5f(5)}{x+2023}$ 的解集为（  ）
  A. $\{x\mid x>-2018\}$
  B. $\{x\mid -2023<x<-2018\}$
  C. $\{x\mid 0<x<2023\}$
  D. $\{x\mid x<-2023\}$
answer: |
  B

  由定义域可知原不等式中必须有 $x+2023>0$。设
  $g(t)=t^2f(t)$，$t>0$，则
  $g'(t)=t[2f(t)+t f'(t)]$。题设给出
  $t f'(t)+2f(t)>0$，且 $t>0$，所以 $g'(t)>0$，
  $g$ 在 $(0,+\infty)$ 上单调递增。原不等式两边乘以正数
  $5(x+2023)$，得
  $(x+2023)^2f(x+2023)<25f(5)$，即
  $g(x+2023)<g(5)$。由 $g$ 递增，得到
  $0<x+2023<5$，故 $-2023<x<-2018$，选 B。
