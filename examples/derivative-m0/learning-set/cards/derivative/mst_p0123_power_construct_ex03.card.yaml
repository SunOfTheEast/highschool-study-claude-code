solution:
  source_solution_summary: |
    由定义域可知原不等式中必须有 $x+2023>0$。设
    $g(t)=t^2f(t)$，$t>0$，则
    $g'(t)=t[2f(t)+t f'(t)]$。题设给出
    $t f'(t)+2f(t)>0$，且 $t>0$，所以 $g'(t)>0$，
    $g$ 在 $(0,+\infty)$ 上单调递增。原不等式两边乘以正数
    $5(x+2023)$，得
    $(x+2023)^2f(x+2023)<25f(5)$，即
    $g(x+2023)<g(5)$。由 $g$ 递增，得到
    $0<x+2023<5$，故 $-2023<x<-2018$，选 B。
  key_steps:
    - step_id: step_1
      statement: 先保留定义域限制。
      formula_trace:
        from: |
          $f(x+2023)$ 与分母 $x+2023$
        to: |
          $x+2023>0$
        operation: 由 $f$ 的定义域 $(0,+\infty)$ 和分母非零确定。
        why: 后面乘以 $x+2023$ 时需要知道它为正，不改变不等号方向。
      source_ref: page_0124
    - step_id: step_2
      statement: 用 $x f^{\prime}(x)+2f(x)$ 构造 $x^2f(x)$。
      formula_trace:
        from: |
          $t f'(t)+2f(t)>0,\qquad t>0$
        to: |
          $g(t)=t^2f(t),\quad g'(t)=t[2f(t)+t f'(t)]>0$
        operation: 乘上正因子 $t$，配成乘积导数。
        why: 这给出 $g$ 在 $(0,+\infty)$ 上递增，是比较函数值的核心。
      source_ref: page_0124
    - step_id: step_3
      statement: 把原不等式化为 $g$ 的函数值比较。
      formula_trace:
        from: |
          $\frac{(x+2023)f(x+2023)}{5}<\frac{5f(5)}{x+2023}$
        to: |
          $(x+2023)^2f(x+2023)<25f(5)$，即 $g(x+2023)<g(5)$
        operation: 两边乘以正数 $5(x+2023)$，再用 $g(t)=t^2f(t)$ 替换。
        why: 目标形式与辅助函数完全一致，便于用单调性解不等式。
      source_ref: page_0124
    - step_id: step_4
      statement: 由递增性解出自变量范围。
      formula_trace:
        from: |
          $g(x+2023)<g(5)$，且 $g$ 在 $(0,+\infty)$ 上递增
        to: |
          $0<x+2023<5,\qquad -2023<x<-2018$
        operation: 递增函数保序，并合并定义域约束。
        why: 这正对应选项 B。
      source_ref: page_0124
teaching_card:
  student_title: 把 $xf^{\prime}+2f$ 打包成 $x^2f$，再别忘定义域
  what_it_trains: 训练在幂函数乘法构造中同步处理定义域、正因子乘法和辅助函数单调比较。
  recognition_cues:
    - 条件中 $xf^{\prime}(x)+2f(x)$，提示构造 $x^2f(x)$。
    - 目标式里出现 $x+2023$ 和分母，先检查 $x+2023>0$。
    - 右侧含 $5f(5)$，提示比较点是 $g(5)$。
  normalization_moves:
    - 令 $t=x+2023$，先要求 $t>0$。
    - 设 $g(t)=t^2f(t)$，由 $g^{\prime}(t)>0$ 得递增。
    - 把原式乘成 $g(t)<g(5)$。
    - 用递增性得到 $0<t<5$，再平移回 $x$。
  common_failures:
    - 忘记 $x+2023$ 必须为正，直接把 $g(x+2023)<g(5)$ 解成 $x<-2018$。
    - 把 $xf^{\prime}+2f$ 错配成 $xf$ 或 $x^3f$。
    - 乘以 $x+2023$ 时没有说明不等号方向。
    - 只选 A，因为只看到 $x<-2018$，漏掉定义域下界。
  similar_practice_query: xf^{\prime}+2f x^2f 单调 定义域 平移 不等式解集
