stem: |-
  （2018 · 新课标 Ⅲ 卷 T21）已知函数 f(x)=(2+x+ax^2)\ln(1+x)-2x。
  (1). 若 a=0，证明：当 -1<x<0 时，f(x)<0；当 x>0 时，f(x)>0。
  (2). 若 x=0 是 f(x) 的极大值点，求 a 的值。
answer: |-
  (1) 证明见解析；(2) a=-\frac{1}{6}。

  第 (1) 问在 a=0 时，f(x)=(x+2)\left(\ln(1+x)-\frac{2x}{x+2}\right)， 因 x+2>0，只需看括号内函数 g。由 g'(x)=\frac{x^2}{(x+1)(x+2)^2}\geqslant0 且 g(0)=0，可得 f 的左右符号。第 (2) 问若 0 是 f 的极大值点，在 0 附近 2+x+ax^2>0，等价地 h(x)=\ln(1+x)-\frac{2x}{2+x+ax^2} 在 0 处取极大。 h'(x) 的符号由 t(x)=a^2x^2+4ax+6a+1 控制，要在 0 附近左正右负，必须 t(0)=0， 得 a=-1/6，再验算导数符号成立。
