stem: |-
  已知实数 $a,b,c$ 满足 $a=6^{\frac13}$，$b=\frac{\ln3}{\ln2}+\frac{2\ln2}{\ln2+\ln3}$，$5^b+12^b=13^c$，则 $a,b,c$ 的关系是（  ）
  A. $b>a>c$
  B. $c>b>a$
  C. $b>c>a$
  D. $c>a>b$
answer: |
  C

  先比较 $a$：
  \[
  a=6^{1/3}<8^{1/3}=2.
  \]
  再比较 $b$，令
  \[
  t=\frac{\ln3}{\ln2}>0,
  \]
  则
  \[
  b=\frac{\ln3}{\ln2}+\frac{2\ln2}{\ln2+\ln3}
  =t+\frac{2}{1+t}>2.
  \]
  作图比较
  \[
  y_1=5^x+12^x,\quad y_2=13^x.
  \]
  因
  \[
  5^2+12^2=13^2,
  \]
  两曲线交于 $(2,13^2)$，且当 $x>2$ 时 $y_1<y_2$。
  设
  \[
  y_0=5^b+12^b=13^c.
  \]
  由 $b>2$ 得 $y_0>13^2$，故 $c>2$。在交点右侧同一高度下，$y_1$ 的横坐标大于 $y_2$ 的横坐标，故 $b>c$。
  综上
  \[
  b>c>2>a,
  \]
  因而 $b>c>a$，选 C。
