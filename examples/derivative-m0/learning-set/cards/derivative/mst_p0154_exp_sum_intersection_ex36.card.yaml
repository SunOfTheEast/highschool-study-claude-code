solution:
  source_solution_summary: |
    先比较 $a$：
    \[
    a=6^{1/3}<8^{1/3}=2.
    \]
    再比较 $b$，令
    \[
    t=\frac{\ln3}{\ln2}>0,
    \]
    则
    \[
    b=\frac{\ln3}{\ln2}+\frac{2\ln2}{\ln2+\ln3}
    =t+\frac{2}{1+t}>2.
    \]
    作图比较
    \[
    y_1=5^x+12^x,\quad y_2=13^x.
    \]
    因
    \[
    5^2+12^2=13^2,
    \]
    两曲线交于 $(2,13^2)$，且当 $x>2$ 时 $y_1<y_2$。
    设
    \[
    y_0=5^b+12^b=13^c.
    \]
    由 $b>2$ 得 $y_0>13^2$，故 $c>2$。在交点右侧同一高度下，$y_1$ 的横坐标大于 $y_2$ 的横坐标，故 $b>c$。
    综上
    \[
    b>c>2>a,
    \]
    因而 $b>c>a$，选 C。
  key_steps:
    - step_id: step_1
      statement: 由立方根直接定出 $a<2$。
      formula_trace:
        from: $a=6^{1/3}$
        to: $a<8^{1/3}=2$
        operation: 用同指数幂函数单调性比较底数。
        why: 先锁定 $a$ 位于 2 左侧。
      source_ref: page_0155_ex36_solution
    - step_id: step_2
      statement: 利用源解析给出的 b 表达式定出 $b>2$。
      formula_trace:
        from: $b=\frac{\ln3}{\ln2}+\frac{2\ln2}{\ln2+\ln3}$
        to: $b=t+\frac{2}{1+t}>2\ (t=\frac{\ln3}{\ln2}>0)$
        operation: 换元整理成单变量函数形式。
        why: 确定水平线高度在交点 $(2,13^2)$ 之上。
      source_ref: page_0155_ex36_solution
    - step_id: step_3
      statement: 用勾股数确定两曲线基准交点。
      formula_trace:
        from: $y_1=5^x+12^x,\ y_2=13^x$
        to: $5^2+12^2=13^2\Rightarrow$ 交点 $x=2$
        operation: 代入特值建立比较锚点。
        why: 后续要在锚点右侧比较同高横坐标。
      source_ref: page_0155_ex36_solution
    - step_id: step_4
      statement: 同高读横坐标得到 $b>c$ 且 $c>2$。
      formula_trace:
        from: $y_0=5^b+12^b=13^c,\ b>2,\ x>2$ 时 $y_1<y_2$
        to: $c>2$ 且 $b>c$
        operation: 先判高度再做“开口差距”横向比较。
        why: 完成 $b,c$ 的顺序判定。
      source_ref: page_0155_ex36_solution
    - step_id: step_5
      statement: 合并三者顺序并对应选项。
      formula_trace:
        from: $a<2,\ c>2,\ b>c$
        to: $b>c>a$，选 C
        operation: 传递不等式。
        why: 得到唯一选项。
      source_ref: page_0155_ex36_solution
teaching_card:
  student_title: 用交点高度读出指数和与单指数的横坐标顺序
  what_it_trains: 训练先用代数估计锁定交点高度区间，再用两曲线同高横坐标比较完成三数排序。
  recognition_cues:
    - 出现 $u^x+v^x$ 与 $w^x$ 的对比，且含勾股数关系。
    - 未知量分别作为两条曲线达到同一函数值时的横坐标。
    - 题目目标是三变量顺序单选。
  normalization_moves:
    - 先比较常数定义量（如 $a$ 与 2）。
    - 换元整理复杂对数表达式（如 $b$）。
    - 用已知交点和同高横坐标完成 $b,c$ 比较。
  common_failures:
    - 忽略题干残缺直接照抄，导致推理链断裂。
    - 知道 $x>2$ 时 $y_1<y_2$，却不会转成同高下横坐标关系。
    - 只得到 $b>c$，遗漏 $c>2>a$ 造成选项误判。
  similar_practice_query: 5^x+12^x 与 13^x 交点 开口差距 同高横坐标 比大小
