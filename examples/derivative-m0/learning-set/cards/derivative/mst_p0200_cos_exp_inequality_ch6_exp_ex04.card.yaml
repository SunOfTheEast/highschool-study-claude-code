original_problem:
  stem: 求证：当 $x\in[0,+\infty)$ 时，$\cos x\ge x+2-e^x$。
  parts: *a1
  choices: []
  answer: 不等式成立。
  fidelity_notes:
    - 源题为证明题，无选项。
    - page_0201 顶部另解属于同一题的跨页续解，已并入本卡。
solution:
  source_solution_summary: 主解直接等价改写为 $e^x+\cos x-x-2\ge0$，并拆成 $\left(e^x-\frac12x^2-x-1\right)+\left(\cos x+\frac12x^2-1\right)\ge0$。 由 $x\ge0$ 时 $e^x\ge\frac12x^2+x+1$，以及任意实数 $\cos x\ge1-\frac12x^2$，两项均非负，故原不等式成立。 另解（续页）：令 $F(x)=e^x+\cos x-x-2$，则 $F^{\prime}(x)=e^x-\sin x-1=(e^x-x-1)+(x-\sin x)\ge0$， 所以 $F$ 在 $[0,+\infty)$ 上递增，且 $F(0)=0$，故 $F(x)\ge0$，原式得证。
  key_steps:
    - step_id: step_1
      statement: 先把原式改写为同侧和式。
      formula_trace:
        from: $\cos x\ge x+2-e^x$
        to: $e^x+\cos x-x-2\ge0$
        operation: 移项，把待证式改成“非负性”目标。
        why: 便于拼接标准放缩不等式。
      source_ref: page_0200_ex04_solution
    - step_id: step_2
      statement: 主解：用指数与余弦的二次下界拼接。
      formula_trace:
        from: $e^x+\cos x-x-2$
        to: $\left(e^x-\frac12x^2-x-1\right)+\left(\cos x+\frac12x^2-1\right)\ge0$
        operation: 分别代入 $e^x\ge\frac12x^2+x+1$ 与 $\cos x\ge1-\frac12x^2$。
        why: 两项各自非负，和即非负。
      source_ref: page_0200_ex04_solution
    - step_id: step_3
      statement: 另解：构造函数并求导。
      formula_trace:
        from: $F(x)=e^x+\cos x-x-2$
        to: $F^{\prime}(x)=e^x-\sin x-1=(e^x-x-1)+(x-\sin x)\ge0$
        operation: 把导数拆成两个已知非负量。
        why: 得到 $F$ 的单调递增性。
      source_ref: page_0201_ex04_alt_continuation
    - step_id: step_4
      statement: 利用端点值完成证明。
      formula_trace:
        from: $F^{\prime}(x)\ge0,\ x\ge0$
        to: $F(x)\ge F(0)=0$
        operation: 单调性 + 端点代值。
        why: 回到 $e^x+\cos x-x-2\ge0$，即原式成立。
      source_ref: page_0201_ex04_alt_continuation
teaching_card:
  student_title: 指数放缩 + 余弦放缩双拼证不等式
  what_it_trains: 训练把混合函数不等式拆成两块标准下界，并掌握构造函数单调性的备用证明。
  recognition_cues:
    - 式子同时含 $e^x$ 与 $\cos x$。
    - 证明区间是 $x\ge0$，适合调用指数与三角的二次模板。
    - 原式可一眼改写成 $e^x+\cos x-x-2\ge0$。
  normalization_moves:
    - 先移项统一到“目标非负”。
    - 主解分别代入指数、余弦二次下界并相加。
    - 另解构造 $F(x)$，拆导数成两个非负块。
  common_failures:
    - 放缩后没有保持同向不等式，符号混乱。
    - 只写 $F^{\prime}(x)\ge0$，漏写 $F(0)=0$ 的闭环。
    - 把 $\cos x\ge1-\frac12x^2$ 误用成上界。
  similar_practice_query: cosx 与 e^x 不等式 证明 构造函数 导数分拆
