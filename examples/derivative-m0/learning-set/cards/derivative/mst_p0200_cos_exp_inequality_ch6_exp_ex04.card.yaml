stem: 求证：当 $x\in[0,+\infty)$ 时，$\cos x\ge x+2-e^x$。
answer: |-
  不等式成立。

  主解直接等价改写为 $e^x+\cos x-x-2\ge0$，并拆成 $\left(e^x-\frac12x^2-x-1\right)+\left(\cos x+\frac12x^2-1\right)\ge0$。 由 $x\ge0$ 时 $e^x\ge\frac12x^2+x+1$，以及任意实数 $\cos x\ge1-\frac12x^2$，两项均非负，故原不等式成立。 另解（续页）：令 $F(x)=e^x+\cos x-x-2$，则 $F^{\prime}(x)=e^x-\sin x-1=(e^x-x-1)+(x-\sin x)\ge0$， 所以 $F$ 在 $[0,+\infty)$ 上递增，且 $F(0)=0$，故 $F(x)\ge0$，原式得证。
