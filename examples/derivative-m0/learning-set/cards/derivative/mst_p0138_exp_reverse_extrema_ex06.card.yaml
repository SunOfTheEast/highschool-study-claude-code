solution:
  source_solution_summary: |
    由
    \[
    f^{\prime}(x)-f(x)=2xe^x
    \]
    得
    \[
    \left(\frac{f(x)}{e^x}\right)'=\frac{f^{\prime}(x)-f(x)}{e^x}=2x.
    \]
    积分得
    \[
    \frac{f(x)}{e^x}=x^2+c,\quad f(x)=(x^2+c)e^x.
    \]
    由 $f(0)=0$ 得 $c=0$，故
    \[
    f(x)=x^2e^x,\quad f^{\prime}(x)=x(x+2)e^x.
    \]
    因 $e^x>0$，故
    \[
    f^{\prime}(x)>0\ (x<-2\ \text{或}\ x>0),\quad f^{\prime}(x)<0\ (-2<x<0).
    \]
    所以 $x=-2$ 为极大值点，$x=0$ 为极小值点，A 错；在 $(-3,0)$ 上先增后减，B 错。
    又
    \[
    f(-2)=4e^{-2},\quad f(0)=0.
    \]
    方程 $f(x)=m$ 有三个实根当且仅当
    \[
    0<m<4e^{-2},
    \]
    因而题面 C 的 $(0,4e^{-1})$ 错。
    最后，$f(x)\ge0$ 且在 $x=0$ 取到 0，D 正确。
    故错误项为 ABC。
  key_steps:
    - step_id: step_1
      statement: 把线性方程型导数关系改写为 $(f/e^x)'=2x$。
      formula_trace:
        from: $f^{\prime}(x)-f(x)=2xe^x$
        to: $\left(\frac{f(x)}{e^x}\right)'=2x$
        operation: 两边同除 $e^x$ 并识别商导数模板。
        why: 直接可积分还原显式函数。
      source_ref: page_0138
    - step_id: step_2
      statement: 由初值确定常数并求导判单调与极值点。
      formula_trace:
        from: $f(x)=(x^2+c)e^x,\ f(0)=0$
        to: $f(x)=x^2e^x,\ f^{\prime}(x)=x(x+2)e^x$
        operation: 代入初值求 $c=0$，再求导并做符号表。
        why: 可直接判 A、B。
      source_ref: page_0138
    - step_id: step_3
      statement: 用极值高度确定三根参数区间并核对 C。
      formula_trace:
        from: $f(-2)=4e^{-2},\ f(0)=0$
        to: $f(x)=m\text{ 有三根}\Leftrightarrow m\in(0,4e^{-2})$
        operation: 结合增减性与水平线交点个数。
        why: 与题面 C 的 $(0,4e^{-1})$ 比较即可判错。
      source_ref: page_0139
teaching_card:
  student_title: 先还原成 $x^2e^x$，再一口气判 A/B/C/D
  what_it_trains: 训练从线性导数关系逆向还原函数，并把单调、极值、根个数参数统一处理。
  recognition_cues:
    - 条件形如 $f^{\prime}-f=\text{(含 }e^x\text{)}$。
    - 选项同时考单调、极值点与“方程有三根”的参数。
  normalization_moves:
    - 构造 $(f/e^x)'$ 并积分。
    - 代初值定常数，得到显式函数。
    - 先做增减表，再做三根参数区间。
  common_failures:
    - 把极大值点与极小值点个数判成“唯一一个”。
    - 把三根区间上端点误写成 $4e^{-1}$。
    - 忽略 $f(x)=x^2e^x\ge0$ 导致 D 判断反向。
  similar_practice_query: f'-f=2xe^x 逆向还原 x^2e^x 多选 极值点 三根参数
