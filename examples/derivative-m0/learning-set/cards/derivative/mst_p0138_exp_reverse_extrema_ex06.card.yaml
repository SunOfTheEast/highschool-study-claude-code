stem: |-
  （2023·廊坊开学·多选）已知定义域为 $\mathbf{R}$ 的函数 $f(x)$ 的导函数为 $f^{\prime}(x)$，且 $f^{\prime}(x)-f(x)=2xe^x$，$f(0)=0$，则以下错误的有（ ）
  A. $f(x)$ 有唯一的极值点
  B. $f(x)$ 在 $(-3,0)$ 上单调递增
  C. 当关于 $x$ 的方程 $f(x)=m$ 有三个实数根时，实数 $m$ 的取值范围为 $(0,4e^{-1})$
  D. $f(x)$ 的最小值为 0
answer: |
  ABC

  由
  \[
  f^{\prime}(x)-f(x)=2xe^x
  \]
  得
  \[
  \left(\frac{f(x)}{e^x}\right)'=\frac{f^{\prime}(x)-f(x)}{e^x}=2x.
  \]
  积分得
  \[
  \frac{f(x)}{e^x}=x^2+c,\quad f(x)=(x^2+c)e^x.
  \]
  由 $f(0)=0$ 得 $c=0$，故
  \[
  f(x)=x^2e^x,\quad f^{\prime}(x)=x(x+2)e^x.
  \]
  因 $e^x>0$，故
  \[
  f^{\prime}(x)>0\ (x<-2\ \text{或}\ x>0),\quad f^{\prime}(x)<0\ (-2<x<0).
  \]
  所以 $x=-2$ 为极大值点，$x=0$ 为极小值点，A 错；在 $(-3,0)$ 上先增后减，B 错。
  又
  \[
  f(-2)=4e^{-2},\quad f(0)=0.
  \]
  方程 $f(x)=m$ 有三个实根当且仅当
  \[
  0<m<4e^{-2},
  \]
  因而题面 C 的 $(0,4e^{-1})$ 错。
  最后，$f(x)\ge0$ 且在 $x=0$ 取到 0，D 正确。
  故错误项为 ABC。
