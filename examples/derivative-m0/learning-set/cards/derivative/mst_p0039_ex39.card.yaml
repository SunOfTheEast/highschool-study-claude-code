stem: |-
  已知 $m,n$ 满足 $\frac{me^m}{4n^2}=\frac{\ln n+\ln2}{e^m}$，且 $e^{2m}=\frac1m$，则 ( )
  A. n=e^m/2
  B. mn^2=1
  C. m+n<7/5
  D. 1<2n-m^2<3/2
answer: |-
  ACD

  先把原式整理为 $h(m)=h(\ln 2n)$，其中 $h(t)=te^{2t}$，由单调性得 $m=\ln2n$。再用 $m<1/2$ 估计 $m+n$ 与 $2n-m^2$。
