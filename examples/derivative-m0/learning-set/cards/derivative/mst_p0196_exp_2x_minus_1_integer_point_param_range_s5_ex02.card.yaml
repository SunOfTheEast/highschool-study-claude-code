solution:
  source_solution_summary: 由 $f(x)<0$ 得 $e^x(2x-1)<ax-2a$，记 $h(x)=e^x(2x-1)$，直线 $y=ax-2a$ 过 $(2,0)$ 且斜率为 $a$。若 $a\le0$，在 $x<0$ 区域会产生无穷多个整点， 不满足“唯一整点”，故 $a>0$。题设给 $a<\frac12$。右侧当 $x>2$ 时， $h'(x)=e^x(2x+1)>\frac12$，增长快于斜率 $a<\frac12$ 的直线，右侧不再提供整点。 左侧临界取相邻整数：$x=0$ 需成立（给出 $a<\frac12$），$x=-1$ 需不成立（给出 $a\ge\frac1e$）。合并得 $\frac1e\le a<\frac12$，选 C。
  key_steps:
    - step_id: step_1
      statement: 先把题目改写为“定曲线 < 过定点直线”的整点条件。
      formula_trace:
        from: $e^x(2x-1)-ax+2a<0$
        to: $e^x(2x-1)<ax-2a$
        operation: 移项后把含参线性项放右侧。
        why: 便于采用直曲分离的整点计数框架。
      source_ref: page_0196_ex02_solution
    - step_id: step_2
      statement: 排除 $a\le0$。
      formula_trace:
        from: $a\le0$
        to: 在 $x<0$ 区域会出现无穷多个满足不等式的整点
        operation: 比较负半轴两侧函数值位置。
        why: 题设要求唯一整点，因此必须 $a>0$。
      source_ref: page_0196_ex02_solution
    - step_id: step_3
      statement: 右侧判空：$x>2$ 不可能提供整点。
      formula_trace:
        from: $h(x)=e^x(2x-1),\ h^{\prime}(x)=e^x(2x+1)$
        to: $x>2$ 时 $h^{\prime}(x)>\frac12>a$（由 $a<\frac12$）
        operation: 比较曲线局部增长率与直线斜率。
        why: 源解据此给出右侧无可保留整点。
      source_ref: page_0196_ex02_solution
    - step_id: step_4
      statement: 左侧临界：保留 $x=0$，排除 $x=-1$。
      formula_trace:
        from: $\begin{cases}-1<-2a\\-3e^{-1}\ge-3a\end{cases}$
        to: $\begin{cases}a<\frac12\\a\ge\frac1e\end{cases}$
        operation: 分别对应“$x=0$ 成立、$x=-1$ 不成立”。
        why: 相邻整点临界足以锁定“唯一整点”范围。
      source_ref: page_0196_ex02_solution
    - step_id: step_5
      statement: 合并区间得到最终参数范围。
      formula_trace:
        from: $a>0,\ a<\frac12,\ a\ge\frac1e$
        to: $\frac1e\le a<\frac12$
        operation: 交集化简。
        why: 与题设先验和整点临界条件共同确定唯一答案 C。
      source_ref: page_0196_ex02_solution
teaching_card:
  student_title: 过 $(2,0)$ 动直线的唯一整点筛选
  what_it_trains: 训练在整点参数题中先做直曲分离，再用“右侧判空 + 左侧相邻整点临界”锁定参数区间。
  recognition_cues:
    - 题干给“存在唯一整数 $x_0$”和线性参数项。
    - 可改写为 $e^x(2x-1)<a(x-2)$，直线过固定点 $(2,0)$。
    - 已给先验 $a<\frac12$，常用于斜率比较。
  normalization_moves:
    - 先改写不等式并识别定曲线/动直线。
    - 先排 $a\le0$（无穷整点）。
    - 右侧用导数与斜率比较判空。
    - 左侧用 $x=0$ 成立、$x=-1$ 不成立定界。
    - 与题设先验取交集。
  common_failures:
    - 漏用题设 $a<\frac12$，导致右侧判空失效。
    - 把“$x=-1$ 不成立”误写成成立，区间端点反向。
    - 只列出 $a\ge\frac1e$ 而漏掉上界 $a<\frac12$。
  similar_practice_query: e^x(2x-1) 过定点直线 唯一整点 参数范围
