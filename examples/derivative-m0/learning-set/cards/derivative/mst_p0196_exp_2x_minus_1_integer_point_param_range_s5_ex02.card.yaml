stem: |-
  若 $f(x)=e^x(2x-1)-ax+2a$，$a<\frac12$，若存在唯一的整数 $x_0$ 使得 $f(x_0)<0$，则实数 $a$ 的取值范围为（  ）
  A. $\left[-\frac{3}{2e^2},\frac{1}{2}\right)$
  B. $\left[-\frac{3}{2e},\frac{1}{4}\right)$
  C. $\left[\frac{1}{e},\frac{1}{2}\right)$
  D. $\left(\frac{1}{4},\frac{1}{e}\right]$
answer: |-
  C

  由 $f(x)<0$ 得 $e^x(2x-1)<ax-2a$，记 $h(x)=e^x(2x-1)$，直线 $y=ax-2a$ 过 $(2,0)$ 且斜率为 $a$。若 $a\le0$，在 $x<0$ 区域会产生无穷多个整点， 不满足“唯一整点”，故 $a>0$。题设给 $a<\frac12$。右侧当 $x>2$ 时， $h'(x)=e^x(2x+1)>\frac12$，增长快于斜率 $a<\frac12$ 的直线，右侧不再提供整点。 左侧临界取相邻整数：$x=0$ 需成立（给出 $a<\frac12$），$x=-1$ 需不成立（给出 $a\ge\frac1e$）。合并得 $\frac1e\le a<\frac12$，选 C。
