stem: |-
  （2023 · 长沙月考）已知函数 $f(x)$ 的定义域为 $\mathbf{R}$，设 $f(x)$ 的导函数是 $f^{\prime}(x)$，且 $f(x)\cdot f^{\prime}(x)+\sin x>0$ 恒成立，则（  ）
  A. $f\left(\frac{\pi}{2}\right)<f\left(-\frac{\pi}{2}\right)$
  B. $f\left(\frac{\pi}{2}\right)>f\left(-\frac{\pi}{2}\right)$
  C. $\left|f\left(\frac{\pi}{2}\right)\right|<\left|f\left(-\frac{\pi}{2}\right)\right|$
  D. $\left|f\left(\frac{\pi}{2}\right)\right|>\left|f\left(-\frac{\pi}{2}\right)\right|$
answer: |
  D

  构造辅助函数 $g(x)=f^2(x)-2\cos x$。由题设
  $f(x)f^{\prime}(x)+\sin x>0$，得
  $g^{\prime}(x)=2f(x)f^{\prime}(x)+2\sin x>0$，
  所以 $g$ 在 $\mathbf{R}$ 上递增。于是
  $g\!\left(\frac{\pi}{2}\right)>g\!\left(-\frac{\pi}{2}\right)$。
  又 $\cos\frac{\pi}{2}=\cos\!\left(-\frac{\pi}{2}\right)=0$，
  所以 $f^2\!\left(\frac{\pi}{2}\right)>f^2\!\left(-\frac{\pi}{2}\right)$，
  即 $\left|f\!\left(\frac{\pi}{2}\right)\right|>\left|f\!\left(-\frac{\pi}{2}\right)\right|$，
  选 D。
