solution:
  source_solution_summary: |
    构造辅助函数 $g(x)=f^2(x)-2\cos x$。由题设
    $f(x)f^{\prime}(x)+\sin x>0$，得
    $g^{\prime}(x)=2f(x)f^{\prime}(x)+2\sin x>0$，
    所以 $g$ 在 $\mathbf{R}$ 上递增。于是
    $g\!\left(\frac{\pi}{2}\right)>g\!\left(-\frac{\pi}{2}\right)$。
    又 $\cos\frac{\pi}{2}=\cos\!\left(-\frac{\pi}{2}\right)=0$，
    所以 $f^2\!\left(\frac{\pi}{2}\right)>f^2\!\left(-\frac{\pi}{2}\right)$，
    即 $\left|f\!\left(\frac{\pi}{2}\right)\right|>\left|f\!\left(-\frac{\pi}{2}\right)\right|$，
    选 D。
  key_steps:
    - step_id: step_1
      statement: 构造与题设同型的导数表达式。
      formula_trace:
        from: $f(x)f^{\prime}(x)+\sin x>0$
        to: $g(x)=f^2(x)-2\cos x,\quad g^{\prime}(x)=2f(x)f^{\prime}(x)+2\sin x>0$
        operation: 把 $f(x)f^{\prime}(x)$ 识别为 $\frac12[f^2(x)]^{\prime}$，把 $\sin x$ 识别为 $(-\cos x)^{\prime}$。
        why: 构造出全局单调函数后，可直接比较两个点的函数值。
      source_ref: page_0140_ex10_solution
    - step_id: step_2
      statement: 利用单调性比较端点。
      formula_trace:
        from: $g^{\prime}(x)>0\ (\forall x\in\mathbf{R})$
        to: $g\!\left(\frac{\pi}{2}\right)>g\!\left(-\frac{\pi}{2}\right)$
        operation: 递增函数在较大自变量处取值更大。
        why: $\frac{\pi}{2}>-\frac{\pi}{2}$。
      source_ref: page_0140_ex10_solution
    - step_id: step_3
      statement: 消去三角项，回到 $f$ 的绝对值。
      formula_trace:
        from: $g\!\left(\frac{\pi}{2}\right)>g\!\left(-\frac{\pi}{2}\right)$
        to: $f^2\!\left(\frac{\pi}{2}\right)>f^2\!\left(-\frac{\pi}{2}\right)$
        operation: 代入 $\cos(\pm\frac{\pi}{2})=0$。
        why: 两端三角项相同可抵消，保留平方比较。
      source_ref: page_0140_ex10_solution
    - step_id: step_4
      statement: 平方比较转为绝对值比较并确定选项。
      formula_trace:
        from: $f^2\!\left(\frac{\pi}{2}\right)>f^2\!\left(-\frac{\pi}{2}\right)$
        to: $\left|f\!\left(\frac{\pi}{2}\right)\right|>\left|f\!\left(-\frac{\pi}{2}\right)\right|$
        operation: 利用 $a^2>b^2\iff |a|>|b|$。
        why: 选项中与之对应的是 D。
      source_ref: page_0140_ex10_solution
teaching_card:
  student_title: 先造平方函数，再判绝对值
  what_it_trains: 训练把“函数乘导数 + 三角项”整体识别为导数，并通过单调性稳定完成绝对值比较。
  recognition_cues:
    - 题设含 $f(x)f^{\prime}(x)$ 与 $\sin x$ 的和。
    - 选项只问两点函数值或绝对值大小。
    - 出现 $\pm\frac{\pi}{2}$，常伴随 $\cos$ 项消去。
  normalization_moves:
    - 构造 $g(x)=f^2(x)-2\cos x$。
    - 由 $g^{\prime}(x)>0$ 先比较 $g(\frac{\pi}{2})$ 与 $g(-\frac{\pi}{2})$。
    - 利用 $\cos(\pm\frac{\pi}{2})=0$ 化简到 $f^2$。
    - 最后由平方关系落到绝对值。
  common_failures:
    - 直接猜 $f(\frac{\pi}{2})$ 与 $f(-\frac{\pi}{2})$ 的大小，忽略绝对值目标。
    - 把 $a^2>b^2$ 误判成 $a>b$。
    - 构造函数时漏掉 $-2\cos x$，导致导数不闭合。
  similar_practice_query: 抽象函数 乘导逆向构造 绝对值比较 平方函数 单调性
