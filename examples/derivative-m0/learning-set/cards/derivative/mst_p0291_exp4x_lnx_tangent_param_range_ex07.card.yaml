original_problem:
  stem: （2024 · 湖北金太阳）已知函数 $f(x)=e^{4x-1}-4a\ln(2x)$。
  parts: *a1
  choices: []
  answer: 第(1)问切线方程为 $y=(4e-8)x-e+4$；第(2)问 $a\in(0,\frac e2]$。
  fidelity_notes:
    - 无选项。
    - 第(2)问默认定义域 $x>0$。
solution:
  source_solution_summary: 第(1)问直接求导： $f^\prime(x)=4e^{4x-1}-\frac4x$，所以 $f^\prime(1/2)=4e-8$，$f(1/2)=e$，切线方程为 $y-e=(4e-8)(x-\frac12)$，即 $y=(4e-8)x-e+4$。 第(2)问令 $F(x)=e^{4x-1}-4a\ln(2x)-a-a\ln(2a)$。法一把 $F$ 拆成 $h(4x-\ln2a-1)+h(\ln2x)+\frac32-\frac32\ln2a$， 其中 $h(t)=e^t-t-1\ge0$。若 $\frac32-\frac32\ln2a\ge0$，即 $a\le e/2$，则 $F(x)\ge0$； 等号在 $x=1/2,a=e/2$ 同时达到。若 $a>e/2$，取 $x=1/2$ 得 $F(1/2)=\frac12(\frac ea-\ln(2ae))<0$，矛盾。 法二从分而治之角度同除 $(2x)^2$，让 $e^{4x-1}$ 和 $\ln(2x)$ 都变成二次量；法三用隐点效应也探出取等点 $x_0=1/2$。因此 $a\in(0,e/2]$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问求切线方程。
      formula_trace:
        from: $f(x)=e^{4x-1}-4\ln(2x)$
        to: $f^\prime(1/2)=4e-8,\quad f(1/2)=e$
        operation: 求导并代入切点。
        why: 切线方程由点斜式直接得到。
      source_ref: page_0291_ex07_solution_start
    - step_id: step_2
      statement: 第(2)问构造恒非负目标函数。
      formula_trace:
        from: $f(x)\ge a+a\ln(2a)$
        to: $F(x)=e^{4x-1}-4a\ln(2x)-a-a\ln(2a)\ge0$
        operation: 移项。
        why: 把求参问题变成证明 $F$ 恒非负。
      source_ref: page_0291_ex07_solution_start
    - step_id: step_3
      statement: 法一：朗博同构加保值拆解。
      formula_trace:
        from: $F(x)$
        to: $h(4x-\ln2a-1)+h(\ln2x)+\frac32-\frac32\ln2a$
        operation: 构造 $h(t)=e^t-t-1$，让一次项抵消。
        why: 两个 $h$ 都非负，剩下只看常数项。
      source_ref: page_0292_ex07_solution_end
    - step_id: step_4
      statement: 由常数项给充分性。
      formula_trace:
        from: $\frac32-\frac32\ln2a\ge0$
        to: $0<a\le\frac e2$
        operation: 解 $\ln(2a)\le1$。
        why: 此时 $F(x)$ 被两个非负项和非负常数压住。
      source_ref: page_0292_ex07_solution_end
    - step_id: step_5
      statement: 用 $x=1/2$ 排除 $a>e/2$。
      formula_trace:
        from: $a>\frac e2$
        to: $F(1/2)=\frac12(\frac ea-\ln(2ae))<0$
        operation: 代入显点 $x=1/2$。
        why: 出现负值就与恒成立矛盾，给必要性。
      source_ref: page_0292_ex07_solution_end
    - step_id: step_6
      statement: 法二：分而治之解释为什么除以 $(2x)^2$。
      formula_trace:
        from: $e^{4x-1}\ge4a\ln(2x)+a+a\ln(2a)$
        to: $\frac1e(\frac{e^{2x}}{2x})^2$ 与 $\frac{2a\ln(4x^2\sqrt{2ae})}{4x^2}$ 比较
        operation: 两边同除 $(2x)^2$ 并做尺度平衡。
        why: source 解释四次指数和对数之间要先降到同一二次尺度。
      source_ref: page_0292_ex07_solution_end
    - step_id: step_7
      statement: 法三：隐点效应探出 $x_0=1/2$。
      formula_trace:
        from: $f(x_0)=a+a\ln(2a),\quad f^\prime(x_0)=0$
        to: $x_0=\frac12$
        operation: 用导数取等和参变分离消去 $a$。
        why: 隐点路线解释为什么切点 $1/2$ 同时是第二问的关键显点。
      source_ref: page_0292_ex07_solution_end
teaching_card:
  student_title: 用朗博保值锁住 $a\le e/2$
  what_it_trains: 训练把指数和对数的恒成立不等式拆成两个非负的朗博项，并理解为什么切线点 $1/2$ 会成为第二问的取等点。
  recognition_cues:
    - 第一问已经给了 $x=1/2$ 处切线，第二问还出现 $2x$。
    - 目标右侧是 $a+a\ln(2a)$，暗示 $a=e/2$ 可能取等。
    - 指数是 $e^{4x-1}$，对数是 $\ln(2x)$，尺度差很大。
    - source 同时给出朗博保值、分而治之、隐点效应三条路线。
  normalization_moves:
    - 先把恒成立式写成 $F(x)\ge0$。
    - 用 $h(t)=e^t-t-1$ 造两个非负块。
    - 检查常数项 $\frac32-\frac32\ln(2a)$。
    - 用 $x=1/2$ 反证排除 $a>e/2$。
  common_failures:
    - 只会第(1)问切线，没看出切点是第(2)问的提示。
    - 朗博拆项时一次项没有抵消干净。
    - 分治路线里随便除，没看出必须除以 $(2x)^2$ 才平衡。
    - 法三中被 source 末尾的参数导数笔误干扰。
  similar_practice_query: e^{4x-1}-4a ln(2x) a+a ln(2a) e/2 朗博 保值 分而治之
