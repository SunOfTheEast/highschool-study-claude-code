stem: |-
  （2024 · 湖北金太阳）已知函数 $f(x)=e^{4x-1}-4a\ln(2x)$。
  1. 当 $a=1$ 时，求曲线 $y=f(x)$ 在点 $(\frac12,f(\frac12))$ 处的切线方程。
  2. 当 $a>0$ 时，若关于 $x$ 的不等式 $f(x)\ge a+a\ln(2a)$ 恒成立，求实数 $a$ 的取值范围。
answer: |-
  第(1)问切线方程为 $y=(4e-8)x-e+4$；第(2)问 $a\in(0,\frac e2]$。

  第(1)问直接求导： $f^\prime(x)=4e^{4x-1}-\frac4x$，所以 $f^\prime(1/2)=4e-8$，$f(1/2)=e$，切线方程为 $y-e=(4e-8)(x-\frac12)$，即 $y=(4e-8)x-e+4$。 第(2)问令 $F(x)=e^{4x-1}-4a\ln(2x)-a-a\ln(2a)$。法一把 $F$ 拆成 $h(4x-\ln2a-1)+h(\ln2x)+\frac32-\frac32\ln2a$， 其中 $h(t)=e^t-t-1\ge0$。若 $\frac32-\frac32\ln2a\ge0$，即 $a\le e/2$，则 $F(x)\ge0$； 等号在 $x=1/2,a=e/2$ 同时达到。若 $a>e/2$，取 $x=1/2$ 得 $F(1/2)=\frac12(\frac ea-\ln(2ae))<0$，矛盾。 法二从分而治之角度同除 $(2x)^2$，让 $e^{4x-1}$ 和 $\ln(2x)$ 都变成二次量；法三用隐点效应也探出取等点 $x_0=1/2$。因此 $a\in(0,e/2]$。
