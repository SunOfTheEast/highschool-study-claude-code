original_problem:
  stem: （2018 · 新课标卷 I T21）已知函数 $f(x)=ae^x-\ln x-1$。
  parts: *a1
  choices: []
  answer: (1) $a=\frac1{2e^2}$，$f(x)$ 在 $(0,2)$ 上单调递减，在 $(2,+\infty)$ 上单调递增；(2) 当 $a\ge1/e$ 时 $f(x)\ge0$。
  fidelity_notes:
    - 由于含 $\ln x$，函数定义域为 $x>0$。
    - 第 (2) 问源解没有单独讨论等号；由证明可知临界情形 $a=1/e,\ x=1$ 取等。
solution:
  source_solution_summary: 定义域为 x>0，f'(x)=ae^x-1/x。由 x=2 为极值点得 ae^2-1/2=0，所以 a=1/(2e^2)。此时 f'(x) 的符号等价于比较 xe^x 与 2e^2，而 xe^x 在 x>0 上递增，故 0<x<2 时递减， x>2 时递增。证明部分先用 a>=1/e 得 f(x)>=e^x/e-ln x-1；只需证明 (ln x+1)/e^x<=1/e。 令 g(x)=(ln x+1)/e^x，借 h(x)=1/x-1-ln x 的单调性判断 g' 在 x=1 前正后负，所以 g(x)<=g(1)=1/e。
  key_steps:
    - step_id: step_1
      statement: 用极值点必要条件求参数。
      formula_trace:
        from: $f^{\prime}(x)=ae^x-\frac1x,\quad f^{\prime}(2)=0$
        to: $ae^2-\frac12=0,\quad a=\frac1{2e^2}$
        operation: 对 f 求导并代入 x=2。
        why: x=2 是定义域内部极值点，导数必须为 0。
      source_ref: page_0048
    - step_id: step_2
      statement: 判断第 (1) 问的单调区间。
      formula_trace:
        from: $f^{\prime}(x)=\frac{e^x}{2e^2}-\frac1x$
        to: $\operatorname{sgn} f^{\prime}(x)=\operatorname{sgn}(xe^x-2e^2)$
        operation: 同乘正数 $2e^2x$。
        why: $xe^x$ 在 $x>0$ 上递增，且 x=2 时等号成立。
      source_ref: page_0048
    - step_id: step_3
      statement: 把第 (2) 问降到临界参数。
      formula_trace:
        from: $a\ge\frac1e,\quad f(x)=ae^x-\ln x-1$
        to: $f(x)\ge\frac{e^x}{e}-\ln x-1$
        operation: 用 $e^x>0$ 保序替换参数下界。
        why: 若临界函数非负，则更大的 a 也非负。
      source_ref: page_0049
    - step_id: step_4
      statement: 把非负性证明改写成一个最大值问题。
      formula_trace:
        from: $\frac{e^x}{e}-\ln x-1\ge0$
        to: $\frac{\ln x+1}{e^x}\le\frac1e$
        operation: 移项并除以正数 $e^x$。
        why: 目标变为证明 $g(x)$ 的最大值不超过 $1/e$。
      source_ref: page_0049
    - step_id: step_5
      statement: 证明 $g(x)=(\ln x+1)/e^x$ 的最大值在 x=1。
      formula_trace:
        from: $g^{\prime}(x)=\frac{1/x-1-\ln x}{e^x}$
        to: $g(x)\le g(1)=\frac1e$
        operation: 令 $h(x)=1/x-1-\ln x$，由 $h^{\prime}(x)=-1/x^2-1/x<0$ 判定 $g^{\prime}$ 先正后负。
        why: g 在 $(0,1)$ 增、在 $(1,+\infty)$ 减，所以 x=1 取最大值。
      source_ref: page_0049
teaching_card:
  student_title: 把参数压到临界，再求比例最大值
  what_it_trains: 训练含 $ae^x-\ln x$ 的极值点与不等式证明：先用导数必要条件定位参数，再把参数下界转为一个指对比例函数的最大值。
  recognition_cues:
    - 题干给出 $x=2$ 是极值点。
    - 证明条件是 $a\ge1/e$，参数乘在正的 $e^x$ 前。
    - 移项后自然出现 $(\ln x+1)/e^x$。
  normalization_moves:
    - 先写定义域 $x>0$ 和导数 $ae^x-1/x$。
    - 用 $f^{\prime}(2)=0$ 求出 $a$。
    - 证明时先取临界参数 $a=1/e$。
    - 把非负目标改写成 $g(x)\le1/e$。
  common_failures:
    - 极值点求出 a 后直接说 x=2 左右变号，未说明导数符号依据。
    - 证明第 (2) 问时把 $a\ge1/e$ 误用成 $a=1/e$，但没有说明下界关系。
    - 求 $g^{\prime}$ 后不知道如何处理 $1/x-1-\ln x$ 的符号。
  similar_practice_query: ae^x - ln x - 1 极值点 参数下界 证明非负
