stem: |-
  （2018 · 新课标卷 I T21）已知函数 $f(x)=ae^x-\ln x-1$。
  (1). 设 $x=2$ 是 $f(x)$ 的极值点，求 $a$，并求 $f(x)$ 的单调区间。
  (2). 证明：当 $a\ge\frac1e$ 时，$f(x)\ge0$。
answer: |-
  (1) $a=\frac1{2e^2}$，$f(x)$ 在 $(0,2)$ 上单调递减，在 $(2,+\infty)$ 上单调递增；(2) 当 $a\ge1/e$ 时 $f(x)\ge0$。

  定义域为 x>0，f'(x)=ae^x-1/x。由 x=2 为极值点得 ae^2-1/2=0，所以 a=1/(2e^2)。此时 f'(x) 的符号等价于比较 xe^x 与 2e^2，而 xe^x 在 x>0 上递增，故 0<x<2 时递减， x>2 时递增。证明部分先用 a>=1/e 得 f(x)>=e^x/e-ln x-1；只需证明 (ln x+1)/e^x<=1/e。 令 g(x)=(ln x+1)/e^x，借 h(x)=1/x-1-ln x 的单调性判断 g' 在 x=1 前正后负，所以 g(x)<=g(1)=1/e。
