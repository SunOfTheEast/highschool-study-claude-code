original_problem:
  stem: 已知实数 $x_1$、$x_2$ 满足 $e^{x_1}+x_1=6$，$\ln\sqrt[5]{5x_2+3}+x_2=\frac35$，则 $x_1+5x_2=$ ______.
  parts: *a1
  choices: []
  answer: "3"
  fidelity_notes:
    - 源图确认根号为五次根，根内为 $5x_2+3$。
    - 定义域由 $\ln\sqrt[5]{5x_2+3}$ 隐含 $5x_2+3>0$。
solution:
  source_solution_summary: 将 $\ln\sqrt[5]{5x_2+3}+x_2=3/5$ 乘 5 得 $\ln(5x_2+3)+5x_2=3$，再加 3 得 $\ln(5x_2+3)+5x_2+3=6$，即 $e^{\ln(5x_2+3)}+\ln(5x_2+3)=6$。设 $f(x)=e^x+x$，由严格递增和 $f(x_1)=f(\ln(5x_2+3))=6$ 得 $x_1=\ln(5x_2+3)$，所以 $x_1+5x_2=3$。
  key_steps:
    - step_id: step_1
      statement: 去掉五次根带来的系数。
      formula_trace:
        from: $\ln\sqrt[5]{5x_2+3}+x_2=\frac35$
        to: $\ln(5x_2+3)+5x_2=3$
        operation: 利用 $5\ln\sqrt[5]{5x_2+3}=\ln(5x_2+3)$，并把方程两边乘以 5。
        why: 把根式对数清成普通对数，目标式中的 $5x_2$ 同时出现。
      source_ref: page_0021
    - step_id: step_2
      statement: 配出与第一个方程相同的 $e^u+u=6$。
      formula_trace:
        from: $\ln(5x_2+3)+5x_2=3$
        to: $e^{\ln(5x_2+3)}+\ln(5x_2+3)=6$
        operation: 两边加 3，并用 $e^{\ln(5x_2+3)}=5x_2+3$。
        why: 这样第二个条件就成为 $f(\ln(5x_2+3))=6$。
      source_ref: page_0021
    - step_id: step_3
      statement: 利用 $f(x)=e^x+x$ 的单调性。
      formula_trace:
        from: $f(x_1)=6,\quad f(\ln(5x_2+3))=6$
        to: $x_1=\ln(5x_2+3)$
        operation: 由 $f'(x)=e^x+1>0$ 得 $f$ 严格递增。
        why: 同一个严格递增函数取同一个值，输入必须相同。
      source_ref: page_0021
    - step_id: step_4
      statement: 回到目标式。
      formula_trace:
        from: $x_1=\ln(5x_2+3)$ 与 $\ln(5x_2+3)+5x_2=3$
        to: $x_1+5x_2=3$
        operation: 把 $x_1$ 替换进已整理的第二个方程。
        why: 目标式正好是第二个方程整理后的左端。
      source_ref: page_0021
teaching_card:
  student_title: 五次根先清掉，再配同一个 $e^x+x$
  what_it_trains: 训练把根式对数方程清理成 $\ln(5x_2+3)+5x_2=3$，再补出 $e^{\ln(5x_2+3)}$，与 $e^{x_1}+x_1=6$ 同构求值。
  recognition_cues:
    - 第一个方程已经是 $e^x+x=6$。
    - 第二个方程含 $\ln\sqrt[5]{5x_2+3}$，乘 5 后会出现 $\ln(5x_2+3)+5x_2$。
    - 根内的 $5x_2+3$ 可以写成 $e^{\ln(5x_2+3)}$，刚好把右端补到 6。
  normalization_moves:
    - 先乘 5 去掉五次根的 $1/5$ 系数。
    - 给 $\ln(5x_2+3)+5x_2=3$ 两边加 3，左端变成 $\ln(5x_2+3)+(5x_2+3)$。
    - 把 $5x_2+3$ 看成 $e^{\ln(5x_2+3)}$，套 $e^x+x$ 的单调性。
  common_failures:
    - 漏乘 5，导致目标里的 $5x_2$ 配不出来。
    - 忘记加 3，把第二个方程停在 $\ln(5x_2+3)+5x_2=3$，看不到 $e^u+u=6$。
    - 把 $\sqrt[5]{5x_2+3}$ 的对数展开错误。
    - 没有用单调性说明 $x_1=\ln(5x_2+3)$。
  similar_practice_query: e^x+x 同构 ln 五次根 5x2+3 x1+5x2 数值求值
