stem: 已知实数 $x_1$、$x_2$ 满足 $e^{x_1}+x_1=6$，$\ln\sqrt[5]{5x_2+3}+x_2=\frac35$，则 $x_1+5x_2=$ ______.
answer: |-
  3

  将 $\ln\sqrt[5]{5x_2+3}+x_2=3/5$ 乘 5 得 $\ln(5x_2+3)+5x_2=3$，再加 3 得 $\ln(5x_2+3)+5x_2+3=6$，即 $e^{\ln(5x_2+3)}+\ln(5x_2+3)=6$。设 $f(x)=e^x+x$，由严格递增和 $f(x_1)=f(\ln(5x_2+3))=6$ 得 $x_1=\ln(5x_2+3)$，所以 $x_1+5x_2=3$。
