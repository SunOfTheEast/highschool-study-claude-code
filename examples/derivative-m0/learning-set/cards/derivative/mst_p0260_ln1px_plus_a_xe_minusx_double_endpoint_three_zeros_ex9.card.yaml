stem: |-
  （2022 · 乙卷理科）已知函数 $f(x)=\ln(1+x)+axe^{-x}$。
  1. 当 $a=1$ 时，求曲线 $y=f(x)$ 在点 $(0,f(0))$ 处的切线方程。
  2. 若 $f(x)$ 在区间 $(-1,0)$、$(0,+\infty)$ 各恰有一个零点，求 $a$ 的取值范围。
answer: |-
  第(1)问：$y=2x$。第(2)问：$a\in(-\infty,-1)$。

  第(1)问当 $a=1$ 时， $f^\prime(x)=\frac1{1+x}+(1-x)e^{-x}$，所以 $f^\prime(0)=2$，且 $f(0)=0$，切线为 $y=2x$。第(2)问 $f^\prime(x)=\frac{e^x-ax^2+a}{(1+x)e^x}$，设 $g(x)=e^x-ax^2+a$。若 $a\ge0$，左侧 $f^\prime>0$， $(-1,0)$ 无零点；若 $-1\le a<0$，右侧 $g$ 递增且 $g(0)=1+a\ge0$，$(0,+\infty)$ 无零点。因此必须 $a<-1$。当 $a<-1$ 时，左侧 $g(-1)>0$、$g(0)<0$， 使 $f$ 在 $(-1,0)$ 先增后减并从负到正再回到 0，存在唯一零点； 右侧 $g(0)<0$、$g(1)>0$，使 $f$ 在 $(0,+\infty)$ 先减后增， 再由远处找点得到唯一零点。
