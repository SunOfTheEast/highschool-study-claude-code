original_problem:
  stem: （2022 · 乙卷理科）已知函数 $f(x)=\ln(1+x)+axe^{-x}$。
  parts: *a1
  choices: []
  answer: 第(1)问：$y=2x$。第(2)问：$a\in(-\infty,-1)$。
  fidelity_notes:
    - 无选项。
    - 题目第(2)问是两侧各一个零点，不包括中间显点 $x=0$。
solution:
  source_solution_summary: 第(1)问当 $a=1$ 时， $f^\prime(x)=\frac1{1+x}+(1-x)e^{-x}$，所以 $f^\prime(0)=2$，且 $f(0)=0$，切线为 $y=2x$。第(2)问 $f^\prime(x)=\frac{e^x-ax^2+a}{(1+x)e^x}$，设 $g(x)=e^x-ax^2+a$。若 $a\ge0$，左侧 $f^\prime>0$， $(-1,0)$ 无零点；若 $-1\le a<0$，右侧 $g$ 递增且 $g(0)=1+a\ge0$，$(0,+\infty)$ 无零点。因此必须 $a<-1$。当 $a<-1$ 时，左侧 $g(-1)>0$、$g(0)<0$， 使 $f$ 在 $(-1,0)$ 先增后减并从负到正再回到 0，存在唯一零点； 右侧 $g(0)<0$、$g(1)>0$，使 $f$ 在 $(0,+\infty)$ 先减后增， 再由远处找点得到唯一零点。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：求 $x=0$ 处切线。
      formula_trace:
        from: $a=1$，$f(x)=\ln(1+x)+xe^{-x}$
        to: $f(0)=0,\ f^\prime(0)=2$
        operation: 代入并求导。
        why: 切线斜率和切点都已确定。
      source_ref: page_0261_ex9_solution_continuation
    - step_id: step_2
      statement: 第(2)问：把导数符号交给 $g(x)$。
      formula_trace:
        from: $f^\prime(x)=\frac1{1+x}+\frac{a(1-x)}{e^x}$
        to: $f^\prime(x)=\frac{g(x)}{(1+x)e^x}$，$g(x)=e^x-ax^2+a$
        operation: 通分整理。
        why: 在定义域上分母为正，所以 $f^\prime$ 的符号由 $g$ 决定。
      source_ref: page_0260_ex9_analysis_start
    - step_id: step_3
      statement: 排除 $a\ge0$。
      formula_trace:
        from: $a\ge0$，$-1<x<0$
        to: $f^\prime(x)>0$，所以 $f(x)<f(0)=0$
        operation: 直接判两项导数都为正。
        why: $(-1,0)$ 没有零点，不合题意。
      source_ref: page_0261_ex9_solution_continuation
    - step_id: step_4
      statement: 排除 $-1\le a<0$。
      formula_trace:
        from: $0>a\ge-1$，$x>0$
        to: $g^\prime(x)>0$ 且 $g(x)>g(0)=1+a\ge0$
        operation: 用 $g^\prime(x)=e^x-2ax>0$ 判 $g$ 递增。
        why: 右侧 $f^\prime>0$，$(0,+\infty)$ 没有零点。
      source_ref: page_0261_ex9_solution_continuation
    - step_id: step_5
      statement: 当 $a<-1$ 时，左侧先找导数零点。
      formula_trace:
        from: $g(-1)=\frac1e>0,\ g(0)=1+a<0$
        to: 存在 $n\in(-1,0)$，使 $g(n)=0$
        operation: 结合 $g^\prime$ 在左侧先减后增。
        why: 得到 $f$ 在左侧先增后减，峰值在 0 左侧。
      source_ref: page_0261_ex9_solution_continuation
    - step_id: step_6
      statement: 当 $a<-1$ 时，左侧用估计找函数零点。
      formula_trace:
        from: $xe^{-x}\in(-e,0)$，$a<0$
        to: $f(e^{ae}-1)<0$，且 $f(n)>0$
        operation: 用 $axe^{-x}< -ae$ 构造一个负值点。
        why: 配合单调性得到 $(-1,0)$ 唯一零点。
      source_ref: page_0261_ex9_solution_continuation
    - step_id: step_7
      statement: 当 $a<-1$ 时，右侧同理找唯一零点。
      formula_trace:
        from: $g(0)<0,\ g(1)=e>0$
        to: 存在 $m\in(0,1)$，$f$ 在 $(0,m)$ 递减、$(m,+\infty)$ 递增
        operation: 用 $g$ 的零点控制 $f^\prime$ 符号。
        why: 右侧最小值低于 0，远处再找正值点。
      source_ref: page_0261_ex9_solution_continuation
    - step_id: step_8
      statement: 合并参数范围。
      formula_trace:
        from: 必须 $a<-1$，且 $a<-1$ 可行
        to: $a\in(-\infty,-1)$
        operation: 必要性和充分性合并。
        why: 完成两侧各一个零点的求参。
      source_ref: page_0261_ex9_solution_continuation
teaching_card:
  student_title: 中间零点在 $0$，两边各找一个零点
  what_it_trains: 训练双端点效应里的三零点分析：先抓住已知零点 $x=0$，再用导数分子控制左右两侧的单调形状。
  recognition_cues:
    - 题目要求 $(-1,0)$ 和 $(0,+\infty)$ 各一个零点。
    - 函数天然有 $f(0)=0$，这个零点不计入两个区间。
    - 导数通分后出现 $g(x)=e^x-ax^2+a$。
    - 关键阈值来自 $f^\prime(0)=1+a$。
  normalization_moves:
    - 先算 $f(0)$ 和 $f^\prime(0)$。
    - 再用 $g(x)$ 判断 $f^\prime$ 在左右两侧的零点。
    - 参数分段时先排除 $a\ge0$ 和 $-1\le a<0$。
  common_failures:
    - 把 $x=0$ 当成题目要求的零点之一。
    - 只证明存在零点，没有用单调性证明唯一。
    - 忽略左侧定义域是 $x>-1$。
  similar_practice_query: 双端点效应 ln(1+x) axe^{-x} 中间零点 x=0 两侧各一个零点 参数范围
