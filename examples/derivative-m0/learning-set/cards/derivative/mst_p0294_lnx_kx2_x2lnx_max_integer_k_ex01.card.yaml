stem: |-
  （2025 春 · 浙江月考）已知函数 $f(x)=2\ln x+8kx^2+1$，$g(x)=3x^2\ln x+8x$（$k\in\mathbf R$）。
  1. 讨论函数 $f(x)$ 的单调性。
  2. 当 $f(x)<g(x)$ 时，求 $k$ 的最大整数解。
answer: |-
  当 $k\ge0$ 时，$f$ 在 $(0,+\infty)$ 上递增；当 $k<0$ 时，$f$ 在 $(0,-\frac{\sqrt{-2k}}{4k})$ 上递增，在 $(-\frac{\sqrt{-2k}}{4k},+\infty)$ 上递减。第(2)问按全域不等式理解时，$k$ 的最大整数解为 $0$。

  第(1)问中，$f^\prime(x)=\frac{16kx^2+2}{x}$。当 $k\ge0$， 导数恒正；当 $k<0$，导数在 $x=-\frac{\sqrt{-2k}}{4k}$ 处变号，先正后负。第(2)问法一： 令差函数 $G(x)=3x^2\ln x+8x-2\ln x-8kx^2-1$，由 $x=1$ 得 $G(1)=7-8k$，所以整数候选最大只能是 $0$；再验证 $k=0$ 时 $G(x)=\frac32x^2\ln x^2+2x-2\ln x-2+1+6x>-\frac{3}{2e}+1>0$。 法二是完整分参：把条件化为 $8k<h(x)=3\ln x+\frac8x-\frac{2\ln x}{x^2}-\frac1{x^2}$。 研究 $h$ 的最小值，令 $w(x)=3x^2-8x+4\ln x$，有 $w^\prime>0$， 且 $w(2)<0,w(3)>0$，所以唯一零点 $x_0\in(2,3)$。利用 $w(x_0)=0$ 化简 $h(x_0)$，设 $t=x_0+\frac2{3x_0}$，得到 $h_{\min}=y\in(17/36,25/4)$，因此 $\frac18h_{\min}\in(17/288,25/32)$，最大整数解仍为 $0$。
