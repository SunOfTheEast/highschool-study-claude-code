solution:
  source_solution_summary: |
    先做法一同构：原式除以 $a(>0)$ 后整理为 $e^{x-\ln a-1}-(x-\ln a)+x-\ln x-1+2-2\ln a\geqslant0$。 令 $h(t)=e^t-t-1$，得 $h(x-\ln a-1)+h(\ln x)+2-2\ln a\geqslant0$， 由 $h(\cdot)\geqslant0$ 得上界条件 $a\leqslant e$。 法二把原式写成 $g(x)\ge h(x)$，其中 $g(x)=\frac{1}{a}\frac{e^x}{x}$，$h(x)=a\frac{\ln\frac{ax}{e}}{\frac{ax}{e}}$， 得 $g_{\min}=e/a,\ h_{\max}=a/e$，故仍需 $a\leqslant e$。 源页两图说明：$a=e$ 时两端极值点错位（左图），$a=e^2$ 时明显违背 $g\ge h$（右图，且代 $x=1$ 有 $1-e^2<0$），因此最大值为 $e$，选 C。
  key_steps:
    - step_id: step_1
      statement: 法一：把原式改写为保值母函数加余量。
      formula_trace:
        from: $e^{x-1}-a\ln(ax)+a\geqslant0$
        to: $h(x-\ln a-1)+h(\ln x)+2-2\ln a\geqslant0,\ h(t)=e^t-t-1$
        operation: 先除以 $a$，再通过加减配凑转成两个 $h(\cdot)$ 项。
        why: 把题目压成“标准非负块 + 参数余量”的结构。
      source_ref: page_0214_ex08_solution_method1
    - step_id: step_2
      statement: 由保值性读取参数上界。
      formula_trace:
        from: $h(x-\ln a-1)\geqslant0,\ h(\ln x)\geqslant0$
        to: $2-2\ln a\geqslant0\Rightarrow a\leqslant e$
        operation: 余量项必须不破坏全局非负。
        why: 题问“最大值”，先得到上界是关键。
      source_ref: page_0214_ex08_solution_method1
    - step_id: step_3
      statement: 法二：转成 $g_{\min}$ 与 $h_{\max}$ 比较，复核同一上界。
      formula_trace:
        from: $e^{x-1}\geqslant a\ln\frac{ax}{e}$
        to: $g_{\min}=\frac{e}{a},\ h_{\max}=\frac{a}{e},\ g_{\min}\geqslant h_{\max}\Rightarrow a\leqslant e$
        operation: 把两侧分别写成六大同构函数极值模板。
        why: 第二条路线与法一互证。
      source_ref: page_0214_ex08_solution_method2
    - step_id: step_4
      statement: 结合两图与反例确认选项。
      formula_trace:
        from: 左图标注 $a=e$；右图标注 $a=e^2$
        to: 最大值为 $e$；当 $a=e^2,x=1$ 时原式为 $1-e^2<0$，故 D 不可
        operation: 读图判断可行性并用代入反例排除超界选项。
        why: 把“上界不等式”落到具体选项判定。
      source_ref: page_0214_ex08_figure_right
teaching_card:
  student_title: 保值余量 + 极值错位锁定参数上界
  what_it_trains: 训练“同构保值上界”和“分而治之极值比较”双路线互证，并用图像解释边界点的错位取等。
  recognition_cues:
    - 题干是“对任意正实数恒成立，求参数最大值”。
    - 式子同时含 $e^{x-1}$ 与 $\ln(ax)$，可配到 $e^t-t-1$。
    - 源解给出两幅 $g/h$ 图，说明极值比较是关键证据。
  normalization_moves:
    - 先做同构配凑得到“两个 $h$ + 余量”。
    - 再做 $g_{\min}\ge h_{\max}$ 复核参数区间。
    - 最后回到选项，用图像与代入反例筛除超界项。
  common_failures:
    - 把 $h(x-\ln a-1)$ 配凑时漏掉常数项，导致余量写错。
    - 只写出 $a\le e$ 却不回到选项验证。
    - 把“边界可行”误写成“必有同点取等”。
  similar_practice_query: e^{x-1}-aln(ax)+a 恒成立 参数最大值 保值性 分而治之
