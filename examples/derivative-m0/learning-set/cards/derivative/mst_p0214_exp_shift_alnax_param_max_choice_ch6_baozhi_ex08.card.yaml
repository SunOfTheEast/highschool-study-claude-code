stem: |-
  （2023 · 浙江精诚联盟高二月考 T8）已知 $a,x$ 均为正实数，不等式 $e^{x-1}-a\ln(ax)+a\geqslant0$ 恒成立，则 $a$ 的最大值为（  ）
  A. 1
  B. $\sqrt{e}$
  C. $e$
  D. $e^2$
answer: |
  C

  先做法一同构：原式除以 $a(>0)$ 后整理为 $e^{x-\ln a-1}-(x-\ln a)+x-\ln x-1+2-2\ln a\geqslant0$。 令 $h(t)=e^t-t-1$，得 $h(x-\ln a-1)+h(\ln x)+2-2\ln a\geqslant0$， 由 $h(\cdot)\geqslant0$ 得上界条件 $a\leqslant e$。 法二把原式写成 $g(x)\ge h(x)$，其中 $g(x)=\frac{1}{a}\frac{e^x}{x}$，$h(x)=a\frac{\ln\frac{ax}{e}}{\frac{ax}{e}}$， 得 $g_{\min}=e/a,\ h_{\max}=a/e$，故仍需 $a\leqslant e$。 源页两图说明：$a=e$ 时两端极值点错位（左图），$a=e^2$ 时明显违背 $g\ge h$（右图，且代 $x=1$ 有 $1-e^2<0$），因此最大值为 $e$，选 C。
