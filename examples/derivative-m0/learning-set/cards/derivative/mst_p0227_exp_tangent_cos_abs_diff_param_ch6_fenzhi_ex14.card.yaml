stem: |-
  （2019 · 河南商开大联考期末 T21）已知函数 $f(x)=a(x-1)e^x(a>0)$，$g(x)=-\cos x$。
  1. 求函数 $f(x)$ 的单调区间。
  2. 若对于任意的实数 $x_1,x_2\in[0,\frac{\pi}{2}]$（其中 $x_1\neq x_2$），都有 $|f(x_1)-f(x_2)|>|g(x_1)-g(x_2)|$ 恒成立，求实数 $a$ 的取值范围。
answer: |-
  第 (1) 问：$f$ 在 $(-\infty,0)$ 单调递减，在 $(0,+\infty)$ 单调递增；第 (2) 问：$a\geqslant1$。

  $f'(x)=a[e^x+(x-1)e^x]=axe^x$。因 $a>0,e^x>0$，所以 $x<0$ 时 $f'(x)<0$，$x>0$ 时 $f'(x)>0$，故 $f$ 在 $(-\infty,0)$ 递减，在 $(0,+\infty)$ 递增。第 (2) 问不妨设 $x_1<x_2$。在 $[0,\pi/2]$ 上，$g(x)=-\cos x$ 递增，且由第 (1) 问 $f$ 递增， 于是绝对差不等式等价于 $f(x_2)-g(x_2)>f(x_1)-g(x_1)$，即 $h(x)=f(x)-g(x)=a(x-1)e^x+\cos x$ 在区间上递增。故需要 $h'(x)=axe^x-\sin x\geqslant0$。当 $x>0$ 时等价于 $ae^x\geqslant\sin x/x$；而 $e^x$ 最小值为 1， $\sin x/x$ 在 $[0,\pi/2]$ 上递减、最大极限为 1，所以充要条件为 $a\geqslant1$。
