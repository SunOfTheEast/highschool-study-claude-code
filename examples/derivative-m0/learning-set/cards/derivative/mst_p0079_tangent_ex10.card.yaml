  parts: *a1
  choices: []
  answer: (1) $\frac1e$；(2) 结论成立；(3) $\frac{2a-x_2-x_1}{x_2-x_1}\in \left[\frac{e^2-1}{e^2+1},1\right)$。
  fidelity_notes:
