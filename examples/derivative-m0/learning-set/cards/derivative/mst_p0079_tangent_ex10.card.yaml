stem: |-
  （2025 · 北京卷 T20）函数 $f(x)$ 的定义域为 $(-1,+\infty)$， 且 $f(0)=0$，$f^{\prime}(x)=\frac{\ln(x+1)}{x+1}$， $f(x)$ 在 $A(a,f(a))$ 处的切线为 $l_1$。
  (1). 求 $f^{\prime}(x)$ 的最大值。
  (2). 证：当 $-1<a<0$ 时，除切点 $A$ 外，$y=f(x)$ 均在 $l_1$ 上方。
  (3). 当 $a>0$ 时，直线 $l_2$ 过 $A$ 点且与 $l_1$ 垂直，$l_1,l_2$ 与 $x$ 轴的交点横坐标分别为 $x_1,x_2$，求 $\frac{2a-x_2-x_1}{x_2-x_1}$ 的取值范围。
answer: |-
  (1) $\frac1e$；(2) 结论成立；(3) $\frac{2a-x_2-x_1}{x_2-x_1}\in \left[\frac{e^2-1}{e^2+1},1\right)$。

  (1) 令 $t=x+1>0$，$f^{\prime}(x)=\ln t/t$，其最大值为 $1/e$。 (2) 固定 $-1<a<0$，设 $H(x)=f(x)-f(a)-f^{\prime}(a)(x-a)$，则 $H^{\prime}(x)=f^{\prime}(x)-f^{\prime}(a)$。因为 $f^{\prime}(x)=\ln(x+1)/(x+1)$ 在 $(-1,0)$ 上递增且其值小于 $x>0$ 时的正值，故 $x<a$ 时 $H^{\prime}<0$，$x>a$ 时 $H^{\prime}>0$，所以 $H$ 在 $x=a$ 处取最小值 0，除切点外图像在 $l_1$ 上方。(3) 设 $m=f^{\prime}(a)>0$， $l_1:y-f(a)=m(x-a)$，$l_2:y-f(a)=-\frac1m(x-a)$， 令 $y=0$ 得 $x_1=a-\frac{f(a)}m$、$x_2=a+mf(a)$。于是目标式化为 $\frac{1-m^2}{1+m^2}$。当 $a>0$ 时 $m=f^{\prime}(a)\in(0,1/e]$，代入得到范围 $\left[\frac{e^2-1}{e^2+1},1\right)$。
