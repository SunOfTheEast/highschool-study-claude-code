solution:
  source_solution_summary: (1) 令 $t=x+1>0$，$f^{\prime}(x)=\ln t/t$，其最大值为 $1/e$。 (2) 固定 $-1<a<0$，设 $H(x)=f(x)-f(a)-f^{\prime}(a)(x-a)$，则 $H^{\prime}(x)=f^{\prime}(x)-f^{\prime}(a)$。因为 $f^{\prime}(x)=\ln(x+1)/(x+1)$ 在 $(-1,0)$ 上递增且其值小于 $x>0$ 时的正值，故 $x<a$ 时 $H^{\prime}<0$，$x>a$ 时 $H^{\prime}>0$，所以 $H$ 在 $x=a$ 处取最小值 0，除切点外图像在 $l_1$ 上方。(3) 设 $m=f^{\prime}(a)>0$， $l_1:y-f(a)=m(x-a)$，$l_2:y-f(a)=-\frac1m(x-a)$， 令 $y=0$ 得 $x_1=a-\frac{f(a)}m$、$x_2=a+mf(a)$。于是目标式化为 $\frac{1-m^2}{1+m^2}$。当 $a>0$ 时 $m=f^{\prime}(a)\in(0,1/e]$，代入得到范围 $\left[\frac{e^2-1}{e^2+1},1\right)$。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问：同构到 $\ln t/t$ 求最大值。
      formula_trace:
        from: $f^{\prime}(x)=\frac{\ln(x+1)}{x+1}$，令 $t=x+1>0$。
        to: $f^{\prime}(x)=\frac{\ln t}{t}\le\frac1e$，等号在 $t=e$ 即 $x=e-1$ 处取得。
        operation: 对 $\ln t/t$ 求导或调用同构函数最大值。
        why: 这是源解所说“由同构函数”得到的最大值。
      source_ref: page_0080
    - step_id: step_2
      statement: 第 (2) 问：构造图像到切线的竖直差。
      formula_trace:
        from: $H(x)=f(x)-f(a)-f^{\prime}(a)(x-a)$。
        to: $H^{\prime}(x)=\frac{\ln(x+1)}{x+1} -\frac{\ln(a+1)}{a+1}$。
        operation: 用函数值减去切线函数值。
        why: $H(x)>0$ 就表示曲线在切线 $l_1$ 上方。
      source_ref: page_0080
    - step_id: step_3
      statement: 第 (2) 问：证明切点处是唯一最小点。
      formula_trace:
        from: $-1<a<0$，且 $q(x)=\frac{\ln(x+1)}{x+1}$ 满足 $x<a$ 时 $q(x)<q(a)$，$x>a$ 时 $q(x)>q(a)$。
        to: $H$ 在 $(-1,a)$ 上递减、在 $(a,+\infty)$ 上递增， $H_{\min}=H(a)=0$。
        operation: 比较 $H^{\prime}(x)$ 的正负。
        why: 切线剩余函数以切点为谷底，因此除切点外曲线都在切线上方。
      source_ref: page_0080
    - step_id: step_4
      statement: 第 (3) 问：写两条垂直直线并求 x 轴截距。
      formula_trace:
        from: $m=f^{\prime}(a)>0$， $l_1:y-f(a)=m(x-a)$， $l_2:y-f(a)=-\frac1m(x-a)$。
        to: 令 $y=0$ 得 $x_1=a-\frac{f(a)}m$，$x_2=a+mf(a)$。
        operation: 用垂直斜率互为负倒数，再令 $y=0$。
        why: 目标式只涉及两个截距，先把截距写成 $a,f(a),m$。
      source_ref: page_0080
    - step_id: step_5
      statement: 第 (3) 问：把目标式化成只含斜率 $m$。
      formula_trace:
        from: $x_1=a-\frac{f(a)}m$，$x_2=a+mf(a)$。
        to: $\frac{2a-x_2-x_1}{x_2-x_1} =\frac{f(a)(\frac1m-m)}{f(a)(m+\frac1m)} =\frac{1-m^2}{1+m^2}$。
        operation: 代入并约去公共因子 $f(a)$；当 $a>0$ 时 $f(a)=\frac12\ln^2(1+a)>0$。
        why: 源页最终范围只取决于 $f^{\prime}(a)$，与 $f(a)$ 的具体值无关。
      source_ref: page_0080
    - step_id: step_6
      statement: 第 (3) 问：由 $m$ 的范围推出目标式范围。
      formula_trace:
        from: $a>0$ 时 $m=\frac{\ln(a+1)}{a+1}\in(0,\frac1e]$。
        to: $\frac{1-m^2}{1+m^2}\in \left[\frac{1-\frac1{e^2}}{1+\frac1{e^2}},1\right) =\left[\frac{e^2-1}{e^2+1},1\right)$。
        operation: 函数 $(1-m^2)/(1+m^2)$ 在 $m>0$ 上递减。
        why: $m$ 可等于 $1/e$，但只能趋近 0，不能取 0。
      source_ref: page_0080
teaching_card:
  student_title: 把切线和垂线截距都化成斜率
  what_it_trains: 训练在综合切线题中先抓住 $f^{\prime}(x)$ 的同构母函数，再用 “函数减切线”证明图像位置，最后把几何截距化成一个斜率参数求范围。
  recognition_cues:
    - $f^{\prime}(x)=\ln(x+1)/(x+1)$，看到 $x+1$ 就令 $t=x+1$。
    - 要证曲线在切线上方，构造 $f(x)-$切线函数。
    - 出现一条切线和一条过切点的垂线，先设 $m=f^{\prime}(a)$。
    - 目标式只含 $x_1,x_2,a$，适合用截距公式统一消元。
  normalization_moves:
    - 把 $f^{\prime}$ 写成 $\ln t/t$。
    - 用 $H(x)=f(x)-f(a)-f^{\prime}(a)(x-a)$ 表示竖直差。
    - 把 $l_2$ 的斜率写成 $-1/f^{\prime}(a)$。
    - 先求 $x_1,x_2$，再整体代入目标式。
  common_failures:
    - 第 (2) 问只说“切线放缩”，没有写出差函数的单调性。
    - 第 (3) 问把垂线斜率写成 $-f^{\prime}(a)$。
    - 化简目标式时符号错，得到大于 1 的表达式。
    - 把 $f^{\prime}(a)$ 的范围写成开区间，漏掉 $a=e-1$。
  similar_practice_query: 切线方程 垂直直线 x轴截距 ln(x+1)/(x+1) 图像在切线上方 斜率参数
