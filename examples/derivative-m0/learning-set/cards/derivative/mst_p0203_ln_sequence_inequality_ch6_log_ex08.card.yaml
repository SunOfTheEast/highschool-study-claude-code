solution:
  source_solution_summary: |
    (1) 令 $g(x)=\left(\frac12x^2-\frac{x}{e^x}\right)-\ln x =\frac12x^2-\frac12\ln x^2-\frac{x}{e^x}$。 用 $t-\ln t\ge1\ (t>0)$ 取 $t=x^2$ 得前两项下界 $\frac12$， 再用 $\frac{x}{e^x}\le\frac1e$，故 $g(x)\ge\frac12-\frac1e>0$，结论成立。 (2)(i) 令 $h(x)=a\ln x-2[\ln(x+1)-\ln2]$， $h^{\prime}(x)=\frac{(a-2)x+a}{x(x+1)}$，故在 $x_0=\frac{a}{2-a}$ 处取最大值， $m(a)=a\ln\frac{a}{2-a}+2\ln(2-a)$。 续页化简得 $m^{\prime}(a)=\ln\frac{a}{2-a}$，从而 $m(a)$ 在 $(0,1)$ 递减、在 $(1,2)$ 递增，极小值 $m(1)=0$。 (2)(ii) 将目标改写为 $\prod_{k=1}^{2n-1}\left(\frac{k}{n}\right)^k>1$ 的对数形式 $\sum_{k=1}^{2n-1}k\ln\frac{k}{n}>0$。 由 (2)(i) 的 $m(a)\ge0$，取 $a=\frac{k}{n}\ (k=1,\dots,n-1)$ 得 $\frac{k}{n}\ln\frac{k}{n}+\frac{2n-k}{n}\ln\frac{2n-k}{n}>0$， 累加即得目标对数和大于 0，指数化后结论成立。
  key_steps:
    - step_id: step_1
      statement: 第一问按 source 构造差函数并拆成“同构项 + 指数项”。
      formula_trace:
        from: $\frac12x^2-\frac{x}{e^x}-\ln x$
        to: $g(x)=\frac12x^2-\frac12\ln x^2-\frac{x}{e^x}$
        operation: 把 $\ln x$ 改写为 $\frac12\ln x^2$。
        why: 便于调用 $t-\ln t$ 的标准下界。
      source_ref: page_0203_ex08_solution_head
    - step_id: step_2
      statement: 完成第一问下界估计。
      formula_trace:
        from: $g(x)=\frac12(x^2-\ln x^2)-\frac{x}{e^x}$
        to: $g(x)\ge\frac12-\frac1e>0$
        operation: 用 $x^2-\ln x^2\ge1$ 与 $\frac{x}{e^x}\le\frac1e$。
        why: 直接得到 $f(x)<\frac12x^2-\frac{x}{e^x}$。
      source_ref: page_0203_ex08_solution_head
    - step_id: step_3
      statement: 第二问 (i) 先求 $h(x)$ 的最大值表达式。
      formula_trace:
        from: $h(x)=a\ln x-2[\ln(x+1)-\ln2]$
        to: $x_0=\frac{a}{2-a},\ m(a)=h(x_0)=a\ln\frac{a}{2-a}+2\ln(2-a)$
        operation: 求导并按 $a\in(0,2)$ 判定先增后减。
        why: 把“关于 $x$ 的极值”转为“关于 $a$ 的函数”。
      source_ref: page_0203_ex08_solution_head
    - step_id: step_4
      statement: 跨页完成 $m(a)$ 极小值。
      formula_trace:
        from: $m(a)=a\ln\frac{a}{2-a}+2\ln(2-a)$
        to: $m^{\prime}(a)=\ln\frac{a}{2-a}$，故 $m_{\min}=m(1)=0$
        operation: 续页化简导数并用 $m^{\prime}(1)=0$ 与单调性分段判断。
        why: 得到后续数列不等式需要的统一下界 $m(a)\ge0$。
      source_ref: page_0204_ex08_continuation
    - step_id: step_5
      statement: 把乘积不等式改写为对数和不等式。
      formula_trace:
        from: $2^2\cdot3^3\cdots(2n-1)^{2n-1}>n^{2n^2-n}$
        to: $\sum_{k=1}^{2n-1}k\ln\frac{k}{n}>0$
        operation: 先补入 $1^1$（值为 1）写成整段乘积，再取对数。
        why: 目标转成可与 $m(a)\ge0$ 对接的可加结构。
      source_ref: page_0204_ex08_continuation
    - step_id: step_6
      statement: 由 $m(a)\ge0$ 构造配对项。
      formula_trace:
        from: $m(a)\ge0,\ a\in(0,2)$
        to: $\frac{k}{n}\ln\frac{k}{n}+\frac{2n-k}{n}\ln\frac{2n-k}{n}>0\ (k=1,\dots,n-1)$
        operation: 代入 $a=\frac{k}{n}$。
        why: 得到与目标对数和完全同构的“首尾配对”正项。
      source_ref: page_0204_ex08_continuation
    - step_id: step_7
      statement: 累加配对项得到总和为正。
      formula_trace:
        from: step_6 的 $k=1,\dots,n-1$
        to: $\sum_{k=1}^{2n-1}k\ln\frac{k}{n}>0$
        operation: 按 $(k,2n-k)$ 配对累加，且中项 $k=n$ 为 $n\ln1=0$。
        why: 完成与 step_5 的目标对接。
      source_ref: page_0204_ex08_continuation
    - step_id: step_8
      statement: 指数化回原式，得到 (2)(ii)。
      formula_trace:
        from: $\sum_{k=1}^{2n-1}k\ln\frac{k}{n}>0$
        to: $2^2\times3^3\times\cdots\times(2n-1)^{2n-1}>n^{2n^2-n}$
        operation: 对数不等式指数化，并去掉 $1^1$。
        why: 得到题设要求的乘积比较。
      source_ref: page_0204_ex08_continuation
teaching_card:
  student_title: 由参数极值反推加权对数和
  what_it_trains: 训练“函数极值结论反哺数列不等式”的双层迁移：先拿到 $m(a)\ge0$，再离散代入并配对累加。
  recognition_cues:
    - 题目先给函数极值，再要求数列乘积比较。
    - 出现 $a\in(0,2)$ 与 $n$ 的离散参数。
    - 目标乘积指数是 $1,2,\dots,2n-1$ 的加权型。
  normalization_moves:
    - 先把第一问和第二问 (i) 做成稳定下界工具。
    - 把乘积比较改写为对数和比较。
    - 将 $a$ 离散化为 $k/n$，制造首尾配对正项。
  common_failures:
    - 只证明 $m(a)\ge0$，却不知道如何代入 $a=k/n$ 连接到数列。
    - 取对数后漏掉权重 $k$。
    - 未说明补入 $1^1$ 只是等价改写，导致式子前后不一致。
  similar_practice_query: 参数函数最小值 代入k/n 加权对数和 首尾配对 乘积不等式
