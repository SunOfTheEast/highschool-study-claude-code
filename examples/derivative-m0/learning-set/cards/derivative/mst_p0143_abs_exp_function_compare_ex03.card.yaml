solution:
  source_solution_summary: |
    先看奇偶性：
    \[
    f(-x)=-x\cdot e^{|-x|}=-x\cdot e^{|x|}=-f(x),
    \]
    所以 $f$ 是奇函数，进而
    \[
    b=-f\left(\log_3\frac12\right)=f(\log_3 2).
    \]
    再看正半轴单调性：当 $x>0$ 时，$|x|=x$，故
    \[
    f(x)=xe^x,\quad f^{\prime}(x)=e^x(x+1)>0,
    \]
    所以 $f$ 在 $(0,+\infty)$ 上单调递增。
    由
    \[
    \log_3 2<\log_3\sqrt5<1<\ln3
    \]
    得
    \[
    f(\log_3 2)<f(\log_3\sqrt5)<f(\ln3).
    \]
    即
    \[
    b<a<c\quad\Longleftrightarrow\quad c>a>b.
    \]
    故选 D。
  key_steps:
    - step_id: step_1
      statement: 由绝对值结构判定 $f$ 为奇函数。
      formula_trace:
        from: $f(x)=x\\cdot e^{|x|}$
        to: $f(-x)=-f(x)$
        operation: 代入 $-x$ 并利用 $|-x|=|x|$。
        why: 用于把含负参数的 $b$ 转成正半轴函数值比较。
      source_ref: page_0143_solution
    - step_id: step_2
      statement: 把 $b$ 改写为同一函数在正半轴的取值。
      formula_trace:
        from: $b=-f\\left(\\log_3\\frac12\\right)$
        to: $b=f(\\log_3 2)$
        operation: 利用 $\\log_3\\frac12=-\\log_3 2$ 与奇函数关系。
        why: 三项统一成 $f(\\cdot)$ 后可直接按自变量顺序比较。
      source_ref: page_0143_solution
    - step_id: step_3
      statement: 确定 $f$ 在 $(0,+\\infty)$ 上递增。
      formula_trace:
        from: $x>0$ 时 $f(x)=xe^x$
        to: $f^{\\prime}(x)=e^x(x+1)>0$
        operation: 求导判号。
        why: 把“自变量大小规律”转成“函数值大小规律”。
      source_ref: page_0144_cont
    - step_id: step_4
      statement: 按续页给出的参数链排序。
      formula_trace:
        from: $\\log_3 2<\\log_3\\sqrt5<1<\\ln3$
        to: $f(\\log_3 2)<f(\\log_3\\sqrt5)<f(\\ln3)$
        operation: 在递增函数上保序。
        why: 直接得到 $b<a<c$。
      source_ref: page_0144_cont
    - step_id: step_5
      statement: 回写到选项表达。
      formula_trace:
        from: $b<a<c$
        to: $c>a>b$
        operation: 等价改写。
        why: 对应选项 D。
      source_ref: page_0144_cont
teaching_card:
  student_title: 先用奇偶性消负号，再在正半轴排顺序
  what_it_trains: 训练含绝对值指数函数的比较套路：先做对称化归约，再用单调性比较三个正参数函数值。
  recognition_cues:
    - 函数形如 $x\\cdot e^{|x|}$，天然有奇偶性信息。
    - 某个量前面带负号，且参数是负对数。
    - 候选顺序都可转成同一函数的取值比较。
  normalization_moves:
    - 先证奇函数，把 $b$ 改写为 $f(\\log_3 2)$。
    - 在 $x>0$ 时改写为 $xe^x$ 并判增。
    - 按参数链直接比较函数值。
  common_failures:
    - 把 $-f(\\log_3\\frac12)$ 误写成 $-f(\\log_3 2)$。
    - 未区分 $x>0$ 与全实数区间就直接套 $xe^x$。
    - 忽略 $1<\\ln3$ 造成中间次序错位。
  similar_practice_query: 绝对值指数函数 奇偶性 比大小 对数参数排序
