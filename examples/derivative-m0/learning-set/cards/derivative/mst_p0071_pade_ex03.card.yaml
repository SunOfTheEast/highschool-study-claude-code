stem: 求 $f(x)=\ln(x+1)$ 的 $[2,2]$ 阶帕德逼近。
answer: |-
  $R_{2,2}(x)=\frac{x+\frac{1}{2}x^2}{1+x+\frac{1}{6}x^2} =\frac{3x^2+6x}{x^2+6x+6}$。

  设 $R_{2,2}(x)=\frac{a_0+a_1x+a_2x^2}{1+b_1x+b_2x^2}$。 因为分子、分母各 2 阶，需让它与 $\ln(1+x)$ 的泰勒展开匹配到 4 阶。 交叉相乘并比较 $x^0$ 到 $x^4$ 的系数，解得 $a_0=0,a_1=1,a_2=\frac12,b_1=1,b_2=\frac16$，代回即得最终逼近式。
