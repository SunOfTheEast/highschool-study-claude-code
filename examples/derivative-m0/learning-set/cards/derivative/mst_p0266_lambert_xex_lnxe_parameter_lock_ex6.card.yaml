original_problem:
  stem: （2024 · 山东济宁高三模拟）已知函数 $f(x)=a\ln x-2x+\frac12x^2$。若不等式 $f(x)\le x(e^x+\frac12x-a-2)-1$ 恒成立，求实数 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a=1$。
  fidelity_notes:
    - 定义域为 $x>0$。
    - 题目问取值范围，但 source 结论为唯一值 $a=1$。
solution:
  source_solution_summary: 将不等式 $a\ln x-2x+\frac12x^2\le x(e^x+\frac12x-a-2)-1$ 整理为 $a(\ln x+x)\le xe^x-1$，即 $xe^x-a\ln(xe^x)-1\ge0$。令 $t=xe^x$，由于 $x>0$ 时 $t$ 从 0 单调增到 $+\infty$，问题化为 $h(t)=t-a\ln t-1\ge0$ 对 $t>0$ 恒成立。又 $h(1)=0$， 所以 $t=1$ 必须是极小值点，$h^\prime(1)=1-a=0$， 得 $a=1$。当 $a=1$ 时，$h(t)=t-\ln t-1\ge0$， 等价于 $e^u-u-1\ge0$，其中 $u=x+\ln x$；故 $a=1$ 成立。
  key_steps:
    - step_id: step_1
      statement: 整理原不等式。
      formula_trace:
        from: $a\ln x-2x+\frac12x^2\le x(e^x+\frac12x-a-2)-1$
        to: $a(\ln x+x)\le xe^x-1$
        operation: 展开右侧并合并同类项。
        why: 把参数 $a$ 收到同一个括号里，暴露 $\ln x+x$。
      source_ref: page_0266_ex6_solution
    - step_id: step_2
      statement: 识别朗博同构结构。
      formula_trace:
        from: $\ln x+x$
        to: $\ln(xe^x)$
        operation: 对数合并。
        why: $xe^x$ 与 $\ln(xe^x)$ 可以统一成同一个变量。
      source_ref: page_0266_ex6_solution
    - step_id: step_3
      statement: 换元成单变量标准不等式。
      formula_trace:
        from: $xe^x-a\ln(xe^x)-1\ge0$
        to: $h(t)=t-a\ln t-1\ge0$，$t=xe^x>0$
        operation: 令 $t=xe^x$。
        why: $t$ 在 $x>0$ 上覆盖 $(0,+\infty)$，不丢范围。
      source_ref: page_0266_ex6_solution
    - step_id: step_4
      statement: 由极点效应锁定 $a$。
      formula_trace:
        from: $h(1)=0$，$h(t)\ge0$
        to: $h^\prime(1)=1-a=0$，$a=1$
        operation: 全域非负且取等点导数为 0。
        why: 若 $t=1$ 不是极小值点，就会在附近破坏恒成立。
      source_ref: page_0266_ex6_solution
    - step_id: step_5
      statement: 回证 $a=1$。
      formula_trace:
        from: $xe^x-\ln(xe^x)-1$
        to: $e^{x+\ln x}-(x+\ln x)-1\ge0$
        operation: 令 $u=x+\ln x$，套 $e^u-u-1\ge0$。
        why: 证明必要条件 $a=1$ 也是充分条件。
      source_ref: page_0266_ex6_solution
teaching_card:
  student_title: 朗博同构：看见 $x+\ln x$，就尝试挂到 $xe^x$
  what_it_trains: 训练把 $xe^x$ 与 $x+\ln x$ 识别为同一个变量的两种语言，从而把复杂恒成立降成 $t-a\ln t-1\ge0$。
  recognition_cues:
    - 题面同时出现 $xe^x$ 和 $\ln x+x$。
    - 参数 $a$ 乘在 $\ln x+x$ 上。
    - 整理后能出现 $xe^x-a\ln(xe^x)-1$。
  normalization_moves:
    - 先展开并整理，不急着对原式求导。
    - 把 $\ln x+x$ 看成 $\ln(xe^x)$。
    - 令 $t=xe^x$ 后用取等点 $t=1$ 锁参。
  common_failures:
    - 直接对原式求导，表达式变复杂后看不出结构。
    - 换元 $t=xe^x$ 后忘记说明 $t$ 覆盖 $(0,+\infty)$。
    - 只由 $h^\prime(1)=0$ 得 $a=1$，但没有回证充分性。
  similar_practice_query: 朗博同构 xe^x x+lnx ln(xe^x t-a ln t-1 a=1
