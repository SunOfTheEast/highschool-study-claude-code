stem: （2024 · 山东济宁高三模拟）已知函数 $f(x)=a\ln x-2x+\frac12x^2$。若不等式 $f(x)\le x(e^x+\frac12x-a-2)-1$ 恒成立，求实数 $a$ 的取值范围。
answer: |-
  $a=1$。

  将不等式 $a\ln x-2x+\frac12x^2\le x(e^x+\frac12x-a-2)-1$ 整理为 $a(\ln x+x)\le xe^x-1$，即 $xe^x-a\ln(xe^x)-1\ge0$。令 $t=xe^x$，由于 $x>0$ 时 $t$ 从 0 单调增到 $+\infty$，问题化为 $h(t)=t-a\ln t-1\ge0$ 对 $t>0$ 恒成立。又 $h(1)=0$， 所以 $t=1$ 必须是极小值点，$h^\prime(1)=1-a=0$， 得 $a=1$。当 $a=1$ 时，$h(t)=t-\ln t-1\ge0$， 等价于 $e^u-u-1\ge0$，其中 $u=x+\ln x$；故 $a=1$ 成立。
