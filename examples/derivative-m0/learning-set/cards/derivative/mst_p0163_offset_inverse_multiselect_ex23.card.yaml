solution:
  source_solution_summary: |
    设
    \[
    g(x)=\frac{e^x}{x+1},\qquad
    f(x)=\frac{x+1}{e^x},
    \]
    则
    \[
    g(a)=g(b)=\frac{101}{100},\qquad
    f(-c)=f(-d)=\frac{99}{100},\qquad
    \frac1{f(x)}=g(x).
    \]

    对 A：源解给出
    \[
    g'(x)=\frac{xe^x}{(x+1)^2},\quad
    g''(x)=\frac{(1-x)e^x}{(x+1)^3},\quad
    g'''(x)=\frac{(2x-4)e^x}{(x+1)^4}<0\ \text{(在 }(-2,2)\text{)}.
    \]
    因 $g$ 的极小值点左偏，且 $g(a)=g(b)$、$a>b$，得
    \[
    a+b>0.
    \]
    A 正确。

    对 B：源解给出
    \[
    f'(x)=\frac{-x}{e^x},\quad
    f''(x)=\frac{x-1}{e^x},\quad
    f'''(x)=\frac{2-x}{e^x}>0\ \text{(在 }(-2,2)\text{)}.
    \]
    因 $f$ 的极大值点左偏，且 $f(-c)=f(-d)$、$c>d$，得
    \[
    -c+(-d)>0\iff c+d<0.
    \]
    所以 B 错。

    对 C：由
    \[
    g(a)+f(-d)=\frac1{f(a)}+f(-d)=2<\frac1{f(a)}+f(a)
    \]
    得 $f(-d)<f(a)$。又 $f$ 在 $(0,+\infty)$ 递减，故
    \[
    -d>a\iff a+d<0.
    \]
    所以 C 错。

    对 D：同理
    \[
    g(b)+f(-c)=\frac1{f(b)}+f(-c)=2<\frac1{f(b)}+f(b)
    \]
    得 $f(-c)<f(b)$。又 $f$ 在 $(-\infty,0)$ 递增，故
    \[
