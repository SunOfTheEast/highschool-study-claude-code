  key_steps:
    - step_id: step_1
      statement: 建立互倒同构函数并对齐等值条件。
      formula_trace:
        from: $\\frac{e^a}{a+1}=\\frac{e^b}{b+1}=1.01$，$(1-c)e^c=(1-d)e^d=0.99$
        to: $g(a)=g(b)=\\frac{101}{100}$，$f(-c)=f(-d)=\\frac{99}{100}$，且 $\\frac1{f(x)}=g(x)$
        operation: 定义 $g(x)=\\frac{e^x}{x+1},\\ f(x)=\\frac{x+1}{e^x}$ 并代入。
        why: 把两组条件放进同一套可互换模型。
      source_ref: page_0163_ex23_solution
    - step_id: step_2
      statement: 用 $g$ 的极小值点左偏判 A。
      formula_trace:
        from: $g(a)=g(b)$ 且 $a>b$
        to: $a+b>0$
        operation: 结合 $g^{\prime\prime\prime}(x)<0$ 的偏移结论。
        why: 直接判定 A 正确。
      source_ref: page_0163_ex23_solution
    - step_id: step_3
      statement: 用 $f$ 的极大值点左偏判 B。
      formula_trace:
        from: $f(-c)=f(-d)$ 且 $c>d$
        to: $c+d<0$
        operation: 由 $f^{\prime\prime\prime}(x)>0$ 得偏移方向，再换回 $c,d$。
        why: B 要求 $c+d>0$，故 B 错。
      source_ref: page_0163_ex23_solution
    - step_id: step_4
      statement: 组合不等式判 C。
      formula_trace:
        from: $g(a)+f(-d)=2<\\frac1{f(a)}+f(a)$
        to: $f(-d)<f(a)$
        operation: 消去同项 $\\frac1{f(a)}$。
        why: 把 C 的真假转成 $f$ 在正区间上的单调比较。
      source_ref: page_0163_ex23_solution
    - step_id: step_5
      statement: 利用 $f$ 在 $(0,+\\infty)$ 递减完成 C。
      formula_trace:
        from: $f(-d)<f(a)$
        to: $-d>a\\iff a+d<0$
        operation: 递减函数反向保序。
        why: C 命题为 $a+d>0$，故 C 错。
      source_ref: page_0163_ex23_solution
    - step_id: step_6
      statement: 同理判 D。
      formula_trace:
        from: $g(b)+f(-c)=2<\\frac1{f(b)}+f(b)$
        to: $f(-c)<f(b)\\Rightarrow -c<b\\Rightarrow b+c>0$
        operation: 在 $(-\\infty,0)$ 递增区做保序比较。
        why: D 正确。
      source_ref: page_0163_ex23_solution
    - step_id: step_7
      statement: 汇总多选。
      formula_trace:
        from: A 对，B 错，C 错，D 对
        to: 选 AD
        operation: 逐项汇总。
        why: 完成作答。
      source_ref: page_0163_ex23_solution
teaching_card:
  student_title: 互倒双函数下的偏移多选
  what_it_trains: 训练在“等值 + 互倒”结构里，把偏移结论和单调区间组合起来分项判真伪。
  recognition_cues:
    - 同时出现 $\\frac{e^x}{x+1}$ 与 $(1-x)e^x$ 这类互倒痕迹。
    - 题干给出两组等值常数并要求判 A-D。
    - 选项都在比较线性和的正负。
  normalization_moves:
    - 先定义互倒函数 $f,g$，把两组条件对齐。
    - A/B 先用偏移方向判整体和。
    - C/D 再用 $\\frac1f+f$ 组合与单调性判。
  common_failures:
    - 把 $f$ 的递增区与递减区混淆，导致 C/D 方向反。
    - 只记住“左偏”口号，但不会转成 $a+b$ 或 $c+d$ 的符号。
    - 忽略 $\\frac1{f(x)}=g(x)$，看不出 C/D 的同构入口。
  similar_practice_query: e^x/(x+1) (x+1)/e^x 多选 极值偏移 互倒函数
