original_problem:
  stem: 证明：$e^x+\sin x+\cos x-2-2x\geqslant0,\ x\in\mathbf{R}$。
  parts: *a1
  choices: []
  answer: 对任意 $x\in\mathbf{R}$，不等式成立。
  fidelity_notes:
    - 源题为证明题，无子问与选项。
    - 题面与解析均在 page_0204 同页闭合。
solution:
  source_solution_summary: 将原不等式改写为 $h(x)=\frac{2x+2-\sin x-\cos x}{e^x}\le1$。 由 source 给出 $h^{\prime}(x)=\frac{2(\sin x-x)}{e^x}<0$，所以 $h(x)$ 单调递减， 从而对任意 $x\in\mathbf{R}$ 有 $h(x)\le h(0)=1$，等价回代即得 $e^x+\sin x+\cos x-2-2x\ge0$。
  key_steps:
    - step_id: step_1
      statement: 将目标改写为有界函数判定。
      formula_trace:
        from: $e^x+\sin x+\cos x-2-2x\ge0$
        to: $h(x)=\frac{2x+2-\sin x-\cos x}{e^x}\le1$
        operation: 移项并除以 $e^x>0$。
        why: 将原式转成“函数上界”后可用单调性收束。
      source_ref: page_0204_ex01_solution
    - step_id: step_2
      statement: 求导并建立判号表达式。
      formula_trace:
        from: $h(x)=\frac{2x+2-\sin x-\cos x}{e^x}$
        to: $h^{\prime}(x)=\frac{2(\sin x-x)}{e^x}$
        operation: 按商式求导并整理同类项。
        why: 单调性判断依赖导数符号。
      source_ref: page_0204_ex01_solution
    - step_id: step_3
      statement: 由三角放缩确定单调性。
      formula_trace:
        from: $h^{\prime}(x)=\frac{2(\sin x-x)}{e^x}$
        to: $h^{\prime}(x)\le0$，且 $x\ne0$ 时 $h^{\prime}(x)<0$
        operation: 用 $\sin x\le x$ 与 $e^x>0$ 判号。
        why: 得到 $h(x)$ 在 $\mathbf{R}$ 上单调递减。
      source_ref: page_0204_ex01_solution
    - step_id: step_4
      statement: 代入锚点值完成证明。
      formula_trace:
        from: $h(x)$ 单调递减
        to: $h(x)\le h(0)=1$
        operation: 以 $x=0$ 为比较点。
        why: 回到 step_1 的等价目标即可得到原不等式。
      source_ref: page_0204_ex01_solution
teaching_card:
  student_title: 比值改写法证明指数三角不等式
  what_it_trains: 训练把混合型不等式改写成函数上界问题，再通过导数判号与锚点值完成全局证明。
  recognition_cues:
    - 目标式同时出现 $e^x,\sin x,\cos x$ 且要求“对任意实数成立”。
    - 式子可整理成“某表达式除以 $e^x$”的结构。
    - 可直接调用 $\sin x\le x$ 做导数判号。
  normalization_moves:
    - 先改写为 $h(x)\le1$。
    - 求 $h^{\prime}(x)$ 并降到基础不等式判号。
    - 用 $x=0$ 计算锚点值并收束。
  common_failures:
    - 把 $\sin x\le x$ 误当作只对 $x\ge0$ 成立。
    - 忘记说明 $e^x>0$，直接除法导致论证缺口。
    - 只写“单调递减”但未给出比较点 $h(0)$。
  similar_practice_query: e^x sinx cosx 不等式 比值改写 导数单调性
