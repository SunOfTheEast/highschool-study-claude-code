stem: 证明：$e^x+\sin x+\cos x-2-2x\geqslant0,\ x\in\mathbf{R}$。
answer: |-
  对任意 $x\in\mathbf{R}$，不等式成立。

  将原不等式改写为 $h(x)=\frac{2x+2-\sin x-\cos x}{e^x}\le1$。 由 source 给出 $h^{\prime}(x)=\frac{2(\sin x-x)}{e^x}<0$，所以 $h(x)$ 单调递减， 从而对任意 $x\in\mathbf{R}$ 有 $h(x)\le h(0)=1$，等价回代即得 $e^x+\sin x+\cos x-2-2x\ge0$。
