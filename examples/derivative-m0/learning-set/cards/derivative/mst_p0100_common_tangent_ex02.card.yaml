solution:
  source_solution_summary: |
    $f'(x)=1-\frac1a e^{x/a}$，所以在 $x=0$ 处斜率为 $1-\frac1a$，切点为
    $(0,-1)$，切线为 $y=(1-\frac1a)x-1$。若它与 $y=e^x$ 相切，设切点横坐标
    为 $x_0$，则切线斜率和过切点条件给出
    $e^{x_0}=1-\frac1a=(1-\frac1a)x_0-1$。消去 $a$ 得
    $e^{x_0}=e^{x_0}x_0-1$，即 $h(x_0)=x_0e^{x_0}-e^{x_0}-1=0$。
    因 $h'(x)=xe^x$，$h$ 在 $(-\infty,0)$ 上递减、在 $(0,+\infty)$ 上递增，
    且 $h(x)\to-1\ (x\to-\infty)$，$h(x)\to+\infty\ (x\to+\infty)$，
    故唯一零点在 $(0,+\infty)$，从而 $e^{x_0}>1$。但 $a>0$ 时
    $1-\frac1a<1$，与 $e^{x_0}=1-\frac1a$ 矛盾，所以不存在这样的切线，选 A。
  key_steps:
    - step_id: step_1
      statement: 写出 $f(x)$ 在 $x=0$ 处的切线。
      formula_trace:
        from: |
          $f(x)=x-e^{x/a},\qquad f'(x)=1-\frac1a e^{x/a},\qquad f(0)=-1$
        to: |
          $f'(0)=1-\frac1a,\qquad l:\ y=\left(1-\frac1a\right)x-1$
        operation: 求导后代入 $x=0$，用点斜式写切线。
        why: 切线 $l$ 的斜率只由参数 $a$ 控制。
      source_ref: page_0100
    - step_id: step_2
      statement: 设 $y=e^x$ 上的隐藏切点并列出相切必要条件。
      formula_trace:
        from: |
          $y=e^x,\qquad l:\ y=\left(1-\frac1a\right)x-1,\qquad x=x_0$
        to: |
          $e^{x_0}=1-\frac1a,\qquad e^{x_0}=\left(1-\frac1a\right)x_0-1$
        operation: 用 $e^x$ 的导数等于切线斜率，并要求切点在直线上。
        why: 同一条直线与 $e^x$ 相切时，斜率和点都必须匹配。
      source_ref: page_0100
    - step_id: step_3
      statement: 消去参数，判断隐藏切点的位置。
      formula_trace:
        from: |
          $e^{x_0}=1-\frac1a=\left(1-\frac1a\right)x_0-1$
        to: |
          $e^{x_0}=e^{x_0}x_0-1,\qquad h(x)=xe^x-e^x-1,\qquad h'(x)=xe^x$
        operation: 用斜率等式替换 $1-\frac1a$，构造单变量函数。
        why: 先判断必要的切点是否可能，再回看参数限制。
      source_ref: page_0100
    - step_id: step_4
      statement: 由单调性得到矛盾。
      formula_trace:
        from: |
          $h'(x)=xe^x,\quad h(x)\to-1\ (x\to-\infty),\quad h(x)\to+\infty\ (x\to+\infty)$
        to: |
          $h(x)=0$ 的唯一解在 $(0,+\infty)$，所以 $e^{x_0}>1$；但 $a>0$ 时 $1-\frac1a<1$
        operation: 用导数判定 $h$ 的增减并比较斜率范围。
        why: 相切要求 $e^{x_0}=1-\frac1a$，两边范围冲突。
      source_ref: page_0100
teaching_card:
  student_title: 先写切线族，再用斜率范围排除
  what_it_trains: 训练用相切的必要条件建立隐藏切点方程，并用单调性和参数范围判断是否存在。
  recognition_cues:
    - 题干说 $x=0$ 处的切线，说明这条线可以先直接写出。
    - 还要与 $e^x$ 相切，需要另设 $e^x$ 上的切点 $x_0$。
    - 问“符合情况的切线有几条”，可能需要证明不存在。
  normalization_moves:
    - 由 $f^\prime(0)$ 写出 $l:\ y=(1-\frac1a)x-1$。
    - 对 $e^x$ 设切点 $x_0$，列 $e^{x_0}=1-\frac1a$ 和点在线上。
    - 消去 $a$ 得 $h(x)=0$，再用范围矛盾排除。
  common_failures:
    - 把 $x=0$ 当成 $e^x$ 的切点。
    - 只列斜率相等，忘记切点还要在直线上。
    - 看到 $h$ 有一个零点就直接认为有一条切线，忽略 $a>0$ 造成的斜率范围限制。
  similar_practice_query: 已知一点切线 与指数函数相切 隐藏切点 斜率范围 矛盾
