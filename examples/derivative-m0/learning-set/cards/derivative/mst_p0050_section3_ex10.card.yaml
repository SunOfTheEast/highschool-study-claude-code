      - 若学生不会把乘积目标化为 $\frac{x}{e^x-1}\le\frac{\ln(1+x)}{x}$，回补代数恒等变形。
      - 若学生看不出 $F(x)$ 与 $F(e^x-1)$ 是同一母函数的两个输入，回补指数对数基础。
  detail_terms:
