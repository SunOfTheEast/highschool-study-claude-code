      max_score: 1
    - step_id: step_5
      description: 用同构母函数给出第二种证明。
      max_score: 1
    - step_id: step_6
      description: 证明 $F(t)=\frac{\ln(1+t)}{t}$ 单调递减并比较输入。
      max_score: 1
