      - 把乘积不等式改写为 $\frac{x}{e^x-1}\le\frac{\ln(1+x)}{x}$。
  fallback:
    only_if_trace_shows:
      - 若学生不知道为什么要在 $x=0$ 两侧分段，回补函数三要素与定义域。
