      description: 抓住 $x=0$ 的共零点，按两侧符号分段。
      max_score: 1
    - step_id: step_2
      description: 在 $x\ge0$ 上先放缩对数，把问题压成指数二次不等式。
      max_score: 1
    - step_id: step_3
      description: 用辅助函数证明指数二次放缩。
      max_score: 1
