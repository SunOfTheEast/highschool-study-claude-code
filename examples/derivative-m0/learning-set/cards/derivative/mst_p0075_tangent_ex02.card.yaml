stem: |-
  （2023 株洲二中高三月考 T11）已知函数 $f(x)=|e^x-1|$，$x_1<0$，$x_2>0$，函数 $f(x)$ 的图象在点 $A(x_1,f(x_1))$ 和点 $B(x_2,f(x_2))$ 处的两条切线互相垂直，且分别交 $y$ 轴于 $M$，$N$ 两点，则下列结论正确的有 (  )

  A. 函数 $f(x)$ 只有一个极值
  B. 若函数 $g(x)=f(x)-a$ 有且只有一个零点，则实数 $a$ 的取值范围是 $[1,+\infty)$
  C. $x_1+x_2=0$
  D. $\frac{|AM|}{|BN|}$ 的取值范围是 $(0,1)$
answer: |
  ACD

  先由 $f(x)=|e^x-1|$ 的图像判断原点处只有一个极值点，所以 A 正确。若 $g(x)=f(x)-a$ 只有一个零点，等价于水平线 $y=a$ 与图像只有一个交点，范围应为 $\{0\}\cup[1,+\infty)$，故 B 错误。再分段写出 $f(x)=1-e^x\ (x<0)$、$f(x)=e^x-1\ (x\ge0)$，两侧切线斜率分别为 $-e^{x_1}$、$e^{x_2}$；垂直得 $-e^{x_1}e^{x_2}=-1$，所以 $x_1+x_2=0$，C 正确。最后求切线与 $y$ 轴交点，得到 $|AM|=\sqrt{1+e^{2x_1}}|x_1|$、$|BN|=\sqrt{1+e^{2x_2}}|x_2|$，代入 $x_2=-x_1$ 后比值为 $e^{x_1}\in(0,1)$，D 正确。
