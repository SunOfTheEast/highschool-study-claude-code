solution:
  source_solution_summary: |
    先由 $f(x)=|e^x-1|$ 的图像判断原点处只有一个极值点，所以 A 正确。若 $g(x)=f(x)-a$ 只有一个零点，等价于水平线 $y=a$ 与图像只有一个交点，范围应为 $\{0\}\cup[1,+\infty)$，故 B 错误。再分段写出 $f(x)=1-e^x\ (x<0)$、$f(x)=e^x-1\ (x\ge0)$，两侧切线斜率分别为 $-e^{x_1}$、$e^{x_2}$；垂直得 $-e^{x_1}e^{x_2}=-1$，所以 $x_1+x_2=0$，C 正确。最后求切线与 $y$ 轴交点，得到 $|AM|=\sqrt{1+e^{2x_1}}|x_1|$、$|BN|=\sqrt{1+e^{2x_2}}|x_2|$，代入 $x_2=-x_1$ 后比值为 $e^{x_1}\in(0,1)$，D 正确。
  key_steps:
    - step_id: step_1
      statement: 用绝对值指数函数的图像判断极值个数。
      formula_trace:
        from: |
          $f(x)=|e^x-1|$
        to: |
          $x=0$ 处取得唯一极小值 $0$
        operation: 结合 $e^x-1$ 在 $0$ 处变号，把图像看作左侧 $1-e^x$ 与右侧 $e^x-1$ 拼接。
        why: 左侧随 $x$ 增大下降到 $0$，右侧随 $x$ 增大从 $0$ 上升，因此只有原点一个极值点。
      source_ref: page_0076
    - step_id: step_2
      statement: 用水平线交点个数修正 B 选项。
      formula_trace:
        from: |
          $g(x)=f(x)-a$ 有且只有一个零点
        to: |
          $a\in\{0\}\cup[1,+\infty)$
        operation: 把零点个数转化为水平线 $y=a$ 与 $y=|e^x-1|$ 的交点个数。
        why: $a=0$ 时只有 $x=0$ 一个交点；$0<a<1$ 时左右两支各一个交点；$a\ge1$ 时只有右支一个交点。
      source_ref: page_0076
    - step_id: step_3
      statement: 分段去绝对值并写出两侧切线斜率。
      formula_trace:
        from: |
          $f(x)=|e^x-1|$
        to: |
          $f(x)=\begin{cases}1-e^x,&x<0\\ e^x-1,&x\ge0\end{cases},\quad
          f^{\prime}(x)=\begin{cases}-e^x,&x<0\\ e^x,&x\ge0\end{cases}$
        operation: 按 $x<0$ 与 $x\ge0$ 去掉绝对值，并分别求导。
        why: $x_1<0$、$x_2>0$ 分别落在左右两支，切线斜率要分支计算。
      source_ref: page_0076
    - step_id: step_4
      statement: 由两条切线互相垂直推出 $x_1+x_2=0$。
      formula_trace:
        from: |
          $k_{AM}=-e^{x_1},\quad k_{BN}=e^{x_2},\quad k_{AM}k_{BN}=-1$
        to: |
          $-e^{x_1}e^{x_2}=-1,\quad e^{x_1+x_2}=1,\quad x_1+x_2=0$
        operation: 使用两直线垂直时斜率乘积为 $-1$，再取指数函数的一一性。
        why: 指数函数恒正且 $e^t=1$ 当且仅当 $t=0$。
      source_ref: page_0076
    - step_id: step_5
      statement: 写出左侧切线与 $y$ 轴交点，并求 $|AM|$。
      formula_trace:
        from: |
          $A(x_1,1-e^{x_1}),\quad k_{AM}=-e^{x_1}$
        to: |
          $y-1+e^{x_1}=-e^{x_1}(x-x_1),\quad
          M(0,e^{x_1}x_1-e^{x_1}+1),\quad
          |AM|=\sqrt{1+e^{2x_1}}\,|x_1|$
        operation: 写出点斜式切线，令 $x=0$ 得 $M$，再用两点距离公式。
        why: $A$ 到 $M$ 的横向距离为 $|x_1|$，纵向差为 $|e^{x_1}x_1|$。
      source_ref: page_0076
    - step_id: step_6
      statement: 同理求右侧长度并化简比值范围。
      formula_trace:
        from: |
          $|BN|=\sqrt{1+e^{2x_2}}\,|x_2|,\quad x_2=-x_1$
        to: |
          $\frac{|AM|}{|BN|}
          =\frac{\sqrt{1+e^{2x_1}}|x_1|}{\sqrt{1+e^{2x_2}}|x_2|}
          =\frac{\sqrt{1+e^{2x_1}}}{\sqrt{1+e^{-2x_1}}}=e^{x_1}\in(0,1)$
        operation: 代入 $x_2=-x_1$，约去 $|x_1|=|x_2|$，再把根式比值化成指数。
        why: $x_1<0$，所以 $0<e^{x_1}<1$。
      source_ref: page_0076
teaching_card:
  student_title: 把绝对值两侧切线配成互相垂直
  what_it_trains: 训练先分段求两侧导数，再用垂直斜率乘积把两个切点联系起来，最后把截距长度比化成单变量范围。
  recognition_cues:
    - 题干给出 $x_1<0$、$x_2>0$，说明两个切点分居绝对值尖点两侧。
    - “两条切线互相垂直”通常立刻写 $k_1k_2=-1$。
    - 交 $y$ 轴于 $M,N$，长度比可以用切线方程求截距点。
    - 选项含“只有一个零点”，应改看水平线与函数图像的交点数。
  normalization_moves:
    - 先把 $|e^x-1|$ 化为左右两支。
    - 由 $-e^{x_1}\cdot e^{x_2}=-1$ 得 $x_2=-x_1$。
    - 把 $|AM|$ 和 $|BN|$ 都写成 $\sqrt{1+k^2}$ 乘横向距离。
    - 用 $x_1<0$ 判定 $e^{x_1}$ 的范围。
  common_failures:
    - 漏掉 $a=0$ 时 $g(x)=f(x)-a$ 只有一个零点，误判 B。
    - 分段求导时把左支斜率写成 $e^{x_1}$，导致垂直条件符号错误。
    - 求 $M,N$ 时只算截距，不用两点距离公式处理线段长度。
    - 得到 $x_1+x_2=0$ 后没有继续代入长度比消元。
  similar_practice_query: 绝对值指数函数 两侧切线互相垂直 截距长度比 $|e^x-1|$
