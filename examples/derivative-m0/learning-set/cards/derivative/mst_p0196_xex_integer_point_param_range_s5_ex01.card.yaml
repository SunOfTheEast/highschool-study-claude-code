stem: |-
  若 $f(x)=xe^x-ax+a$，若存在唯一的整数 $x_0$ 使得 $f(x_0)<0$，则实数 $a$ 的取值范围为（  ）
  A. $\left[-\frac{2}{3e^2},\frac{1}{2e}\right)$
  B. $\left[\frac{2}{3e^2},\frac{1}{2e}\right)\cup\left(2e^2,\frac{3}{2}e^3\right]$
  C. $\left[-\frac{1}{e^2},\frac{1}{e}\right)$
  D. $\left[\frac{1}{e^2},\frac{1}{e}\right)\cup\left(2e^2,\frac{3}{2}e^3\right]$
answer: |-
  B

  由 $f(x)<0$ 得 $xe^x<ax-a$，转成曲线 $y=xe^x$ 与直线 $y=ax-a$ 的上下关系， 其中直线恒过 $(1,0)$。若 $a\le0$，则在 $x<0$ 区域不等式会给出无穷多个整点， 不满足“唯一整点”，故 $a>0$。右侧若有整点，只可能由 $x=2$ 成立且 $x=3$ 不成立，得 $2e^2<a\le\frac{3}{2}e^3$。左侧若有整点，只可能由 $x=-1$ 成立且 $x=-2$ 不成立，得 $\frac{2}{3e^2}\le a<\frac{1}{2e}$。并集为 $\left[\frac{2}{3e^2},\frac{1}{2e}\right)\cup\left(2e^2,\frac{3}{2}e^3\right]$， 选 B。
