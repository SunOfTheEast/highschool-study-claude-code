solution:
  source_solution_summary: 由 $f(x)<0$ 得 $xe^x<ax-a$，转成曲线 $y=xe^x$ 与直线 $y=ax-a$ 的上下关系， 其中直线恒过 $(1,0)$。若 $a\le0$，则在 $x<0$ 区域不等式会给出无穷多个整点， 不满足“唯一整点”，故 $a>0$。右侧若有整点，只可能由 $x=2$ 成立且 $x=3$ 不成立，得 $2e^2<a\le\frac{3}{2}e^3$。左侧若有整点，只可能由 $x=-1$ 成立且 $x=-2$ 不成立，得 $\frac{2}{3e^2}\le a<\frac{1}{2e}$。并集为 $\left[\frac{2}{3e^2},\frac{1}{2e}\right)\cup\left(2e^2,\frac{3}{2}e^3\right]$， 选 B。
  key_steps:
    - step_id: step_1
      statement: 先做参数分离，改写为“曲线 < 直线”的整点判定。
      formula_trace:
        from: $xe^x-ax+a<0$
        to: $xe^x<ax-a$
        operation: 移项后把含参项放到右边。
        why: 便于固定曲线、移动直线做数形判断。
      source_ref: page_0196_ex01_solution
    - step_id: step_2
      statement: 排除 $a\le0$。
      formula_trace:
        from: $a\le0$
        to: 在 $x<0$ 时 $xe^x<ax-a$ 恒成立，整点无穷多个
        operation: 比较左侧负值与右侧非负值。
        why: 题设要求“唯一整点”，故必须 $a>0$。
      source_ref: page_0196_ex01_solution
    - step_id: step_3
      statement: 右侧分支：保留 $x=2$，排除 $x=3$。
      formula_trace:
        from: $\begin{cases}2e^2<a\\3e^3\ge2a\end{cases}$
        to: $2e^2<a\le\frac{3}{2}e^3$
        operation: 由“$x=2$ 成立、$x=3$ 不成立”联立不等式。
        why: 源解用增长速度判定右侧至多出现这一个整点。
      source_ref: page_0196_ex01_solution
    - step_id: step_4
      statement: 左侧分支：保留 $x=-1$，排除 $x=-2$。
      formula_trace:
        from: $\begin{cases}-e^{-1}<-2a\\-2e^{-2}\ge-3a\end{cases}$
        to: $\frac{2}{3e^2}\le a<\frac{1}{2e}$
        operation: 由“$x=-1$ 成立、$x=-2$ 不成立”联立并化简。
        why: 源解左侧整点临界正是这两个相邻整数。
      source_ref: page_0196_ex01_solution
    - step_id: step_5
      statement: 合并两支范围得到答案。
      formula_trace:
        from: $a\in\left(2e^2,\frac{3}{2}e^3\right]$ 或 $a\in\left[\frac{2}{3e^2},\frac{1}{2e}\right)$
        to: $a\in\left[\frac{2}{3e^2},\frac{1}{2e}\right)\cup\left(2e^2,\frac{3}{2}e^3\right]$
        operation: 取并集并对应选项。
        why: 唯一整点可能落在左支或右支。
      source_ref: page_0196_ex01_solution
teaching_card:
  student_title: 过 $(1,0)$ 动直线的整点唯一判定
  what_it_trains: 训练把含参不等式变成“定曲线与动直线”后，用左右分区+相邻整点临界锁范围。
  recognition_cues:
    - 题目给“存在唯一整数 $x_0$”且含参数直线项。
    - 可改写为 $xe^x<a(x-1)$，直线过固定点。
    - 选项是参数区间并集，提示左右分支讨论。
  normalization_moves:
    - 先做参变量分离：$xe^x<ax-a$。
    - 先排除 $a\le0$ 的无穷整点情形。
    - 右支用 $x=2$ 成立、$x=3$ 不成立。
    - 左支用 $x=-1$ 成立、$x=-2$ 不成立。
    - 并集合并对应选项。
  common_failures:
    - 忘记先排除 $a\le0$，导致“唯一整点”条件被破坏。
    - 只算一侧（只看正半轴或负半轴）漏掉并集。
    - 代入负整数后不等式方向处理错误。
  similar_practice_query: xe^x 过定点直线 唯一整点 参数范围
