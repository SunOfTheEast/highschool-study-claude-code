stem: |-
  （2023 · 河南模拟）已知函数 $y=f(x)$ 对任意 $x\\in\\left(-\\frac{\\pi}{2},\\frac{\\pi}{2}\\right)$ 满足 $f^{\\prime}(x)\\cos x+f(x)\\sin x>0$，则下列不等式成立的是（  ）
  A. $\\sqrt{2}f\\left(-\\frac{\\pi}{3}\\right)<f\\left(-\\frac{\\pi}{4}\\right)$
  B. $\\sqrt{2}f\\left(\\frac{\\pi}{3}\\right)<f\\left(\\frac{\\pi}{4}\\right)$
  C. $f(0)>2f\\left(\\frac{\\pi}{3}\\right)$
  D. $f(0)>\\sqrt{2}f\\left(\\frac{\\pi}{4}\\right)$
answer: |
  A

  构造
  \[
  g(x)=\frac{f(x)}{\cos x},
  \]
  则
  \[
  g^{\prime}(x)=\frac{f^{\prime}(x)\cos x-f(x)(\cos x)^{\prime}}{\cos^2 x}
  =\frac{f^{\prime}(x)\cos x+f(x)\sin x}{\cos^2 x}>0.
  \]
  因而 $g(x)$ 在 $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$ 上递增。

  由 $-\frac{\pi}{3}<-\frac{\pi}{4}$，得
  \[
  g\!\left(-\frac{\pi}{3}\right)<g\!\left(-\frac{\pi}{4}\right)
  \Rightarrow
  \frac{f\!\left(-\frac{\pi}{3}\right)}{\frac12}
  <
  \frac{f\!\left(-\frac{\pi}{4}\right)}{\frac{\sqrt2}{2}}
  \Rightarrow
  \sqrt2 f\!\left(-\frac{\pi}{3}\right)<f\!\left(-\frac{\pi}{4}\right),
  \]
  所以 A 正确。

  又 $\frac{\pi}{3}>\frac{\pi}{4}$，故
  $g\!\left(\frac{\pi}{3}\right)>g\!\left(\frac{\pi}{4}\right)$，得到
  $\sqrt2 f\!\left(\frac{\pi}{3}\right)>f\!\left(\frac{\pi}{4}\right)$，B 错。
  由 $0<\frac{\pi}{3},\frac{\pi}{4}$，有
  $g(0)<g\!\left(\frac{\pi}{3}\right),g\!\left(\frac{\pi}{4}\right)$，
  分别推出
  $f(0)<2f\!\left(\frac{\pi}{3}\right)$ 与
  $f(0)<\sqrt2 f\!\left(\frac{\pi}{4}\right)$，
  所以 C、D 都错。答案 A。
