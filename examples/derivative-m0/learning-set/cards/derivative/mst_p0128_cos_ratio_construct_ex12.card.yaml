solution:
  source_solution_summary: |
    构造
    \[
    g(x)=\frac{f(x)}{\cos x},
    \]
    则
    \[
    g^{\prime}(x)=\frac{f^{\prime}(x)\cos x-f(x)(\cos x)^{\prime}}{\cos^2 x}
    =\frac{f^{\prime}(x)\cos x+f(x)\sin x}{\cos^2 x}>0.
    \]
    因而 $g(x)$ 在 $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$ 上递增。

    由 $-\frac{\pi}{3}<-\frac{\pi}{4}$，得
    \[
    g\!\left(-\frac{\pi}{3}\right)<g\!\left(-\frac{\pi}{4}\right)
    \Rightarrow
    \frac{f\!\left(-\frac{\pi}{3}\right)}{\frac12}
    <
    \frac{f\!\left(-\frac{\pi}{4}\right)}{\frac{\sqrt2}{2}}
    \Rightarrow
    \sqrt2 f\!\left(-\frac{\pi}{3}\right)<f\!\left(-\frac{\pi}{4}\right),
    \]
    所以 A 正确。

    又 $\frac{\pi}{3}>\frac{\pi}{4}$，故
    $g\!\left(\frac{\pi}{3}\right)>g\!\left(\frac{\pi}{4}\right)$，得到
    $\sqrt2 f\!\left(\frac{\pi}{3}\right)>f\!\left(\frac{\pi}{4}\right)$，B 错。
    由 $0<\frac{\pi}{3},\frac{\pi}{4}$，有
    $g(0)<g\!\left(\frac{\pi}{3}\right),g\!\left(\frac{\pi}{4}\right)$，
    分别推出
    $f(0)<2f\!\left(\frac{\pi}{3}\right)$ 与
    $f(0)<\sqrt2 f\!\left(\frac{\pi}{4}\right)$，
    所以 C、D 都错。答案 A。
  key_steps:
    - step_id: step_1
      statement: 把题设导数不等式配成商函数导数。
      formula_trace:
        from: $f^{\prime}(x)\\cos x+f(x)\\sin x>0$
        to: $g(x)=\\frac{f(x)}{\\cos x},\\ g^{\\prime}(x)=\\frac{f^{\\prime}(x)\\cos x+f(x)\\sin x}{\\cos^2 x}>0$
        operation: 利用 $(\\cos x)^{\\prime}=-\\sin x$ 进行逆向构造。
        why: 把抽象不等式转成可直接判单调的导数形式。
      source_ref: page_0128
    - step_id: step_2
      statement: 由 $g$ 递增判断 A。
      formula_trace:
        from: $-\\frac{\\pi}{3}< -\\frac{\\pi}{4}$
        to: $\\sqrt2 f\\left(-\\frac{\\pi}{3}\\right)<f\\left(-\\frac{\\pi}{4}\\right)$
        operation: 先比较 $g$ 值，再代入余弦值化简。
        why: A 与递增方向一致。
      source_ref: page_0128
    - step_id: step_3
      statement: 由 $g$ 递增反驳 B。
      formula_trace:
        from: $\\frac{\\pi}{3}>\\frac{\\pi}{4}$
        to: $\\sqrt2 f\\left(\\frac{\\pi}{3}\\right)>f\\left(\\frac{\\pi}{4}\\right)$
        operation: 比较 $g\\left(\\frac{\\pi}{3}\\right)$ 与 $g\\left(\\frac{\\pi}{4}\\right)$。
        why: 选项 B 给出相反方向。
      source_ref: page_0128
    - step_id: step_4
      statement: 比较 $0$ 与 $\\frac{\\pi}{3}$，排除 C。
      formula_trace:
        from: $0<\\frac{\\pi}{3}$
        to: $f(0)<2f\\left(\\frac{\\pi}{3}\\right)$
        operation: 由 $g(0)<g\\left(\\frac{\\pi}{3}\\right)$ 代入 $\\cos0=1,\\cos\\frac{\\pi}{3}=\\frac12$。
        why: 与 C 的不等号方向冲突。
      source_ref: page_0128
    - step_id: step_5
      statement: 比较 $0$ 与 $\\frac{\\pi}{4}$，排除 D。
      formula_trace:
        from: $0<\\frac{\\pi}{4}$
        to: $f(0)<\\sqrt2 f\\left(\\frac{\\pi}{4}\\right)$
        operation: 由 $g(0)<g\\left(\\frac{\\pi}{4}\\right)$ 代入余弦值。
        why: 与 D 的方向相反。
      source_ref: page_0128
teaching_card:
  student_title: 把 $f^{\prime}\\cos+f\\sin$ 反向构造成 $\\frac{f}{\\cos}$
  what_it_trains: 训练把抽象导数不等式快速配成三角比值函数，再用单调性做四个选项的方向筛查。
  recognition_cues:
    - 题设出现 $f^{\\prime}(x)\\cos x+f(x)\\sin x$。
    - 定义域是 $\\left(-\\frac{\\pi}{2},\\frac{\\pi}{2}\\right)$，提示 $\\cos x$ 不变号。
    - 选项全部是特殊角点值不等式。
  normalization_moves:
    - 先设 $g=\\frac{f}{\\cos}$。
    - 由 $g^{\\prime}>0$ 得递增。
    - 按自变量大小比较 $g$，再代入 $\\cos\\frac{\\pi}{3},\\cos\\frac{\\pi}{4},\\cos0$。
  common_failures:
    - 把 $(\\cos x)^{\\prime}$ 的符号写错。
    - 负角比较顺序出错，导致 A 方向翻转。
    - 把“递增”误用成“角越大函数越小”。
    - 化简时把 $\\frac{1}{\\cos\\frac{\\pi}{3}}$ 和 $\\frac{1}{\\cos\\frac{\\pi}{4}}$ 混淆。
  similar_practice_query: 三角函数基础构造 f^{\\prime}cos+f sin 比值函数 单调 比较
