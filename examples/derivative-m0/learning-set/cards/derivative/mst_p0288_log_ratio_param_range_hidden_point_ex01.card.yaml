stem: |-
  （24-25 高二下 · 浙江绍兴 · 阶段练习）设函数 $f(x)=e^x-ax^2-x-1$，$a\in\mathbf R$。设 $g(x)=\ln\frac{me^x-x^2}{x+1}$（$x>0$），若 $g(x)-1\ge x+x^2-me^x$ 恒成立，求 $m$ 的取值范围。
  1. 求使 $g(x)-1\ge x+x^2-me^x$ 在 $x>0$ 恒成立的 $m$ 的取值范围。
answer: |-
  $m\ge\frac3e$。

  法一是参变分离。把 $g(x)-1\ge x+x^2-me^x$ 移项，得到 $\ln\frac{me^x-x^2}{x+1}+me^x-x-x^2-1\ge0$，即 $\ln(me^x-x^2)+(me^x-x^2)\ge\ln(x+1)+(x+1)$。由于 $y=\ln x+x$ 在正半轴单调递增，所以只需 $me^x-x^2\ge x+1$ 恒成立，即 $m\ge\frac{x^2+x+1}{e^x}$ 恒成立。令 $p(x)=\frac{x^2+x+1}{e^x}$，有 $p^\prime(x)=\frac{-x^2+x}{e^x}$，因此 $p$ 在 $(0,1)$ 上递增、 在 $(1,+\infty)$ 上递减，最大值为 $p(1)=3/e$。法二是极点效应： 由 $h(x)=me^x-x^2-x-1$ 的取等探路得到候选点 $x=1$ 和 必要条件 $m\ge3/e$。充分性可取 $m=3/e$，证明 $h(x)\ge q(x)=3e^{x-1}-x^2-x-1\ge0$，其中 $q(0)=q(1)=0$， 通过二阶导形状证明 $q(x)\ge0$ 恒成立。
