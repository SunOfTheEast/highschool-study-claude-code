solution:
  source_solution_summary: 法一是参变分离。把 $g(x)-1\ge x+x^2-me^x$ 移项，得到 $\ln\frac{me^x-x^2}{x+1}+me^x-x-x^2-1\ge0$，即 $\ln(me^x-x^2)+(me^x-x^2)\ge\ln(x+1)+(x+1)$。由于 $y=\ln x+x$ 在正半轴单调递增，所以只需 $me^x-x^2\ge x+1$ 恒成立，即 $m\ge\frac{x^2+x+1}{e^x}$ 恒成立。令 $p(x)=\frac{x^2+x+1}{e^x}$，有 $p^\prime(x)=\frac{-x^2+x}{e^x}$，因此 $p$ 在 $(0,1)$ 上递增、 在 $(1,+\infty)$ 上递减，最大值为 $p(1)=3/e$。法二是极点效应： 由 $h(x)=me^x-x^2-x-1$ 的取等探路得到候选点 $x=1$ 和 必要条件 $m\ge3/e$。充分性可取 $m=3/e$，证明 $h(x)\ge q(x)=3e^{x-1}-x^2-x-1\ge0$，其中 $q(0)=q(1)=0$， 通过二阶导形状证明 $q(x)\ge0$ 恒成立。
  key_steps:
    - step_id: step_1
      statement: 把原不等式改写成 $\ln A+A\ge\ln B+B$。
      formula_trace:
        from: $g(x)-1\ge x+x^2-me^x$
        to: $\ln(me^x-x^2)+(me^x-x^2)\ge\ln(x+1)+(x+1)$
        operation: 移项并拆开对数。
        why: 这样能使用 $y=\ln x+x$ 的单调性。
      source_ref: page_0288_ex01_solution_start
    - step_id: step_2
      statement: 用同构单调性把不等式降成代数不等式。
      formula_trace:
        from: $\ln A+A\ge\ln B+B$
        to: $me^x-x^2\ge x+1$
        operation: 利用 $y=\ln x+x$ 在正半轴递增。
        why: 高等函数被转成一个关于参数 $m$ 的显式不等式。
      source_ref: page_0288_ex01_solution_start
    - step_id: step_3
      statement: 参变量分离，求一个函数的最大值。
      formula_trace:
        from: $me^x-x^2\ge x+1$
        to: $m\ge p(x)=\frac{x^2+x+1}{e^x}$
        operation: 把 $m$ 分离到一边。
        why: 恒成立求参数范围转为 $m$ 不小于右侧最大值。
      source_ref: page_0288_ex01_solution_start
    - step_id: step_4
      statement: 求 $p(x)$ 在 $x>0$ 上的最大值。
      formula_trace:
        from: $p(x)=\frac{x^2+x+1}{e^x}$
        to: $p^\prime(x)=\frac{-x^2+x}{e^x},\quad p_{\max}=p(1)=\frac3e$
        operation: 求导判单调。
        why: 这给出必要且充分的参数下界。
      source_ref: page_0289_ex01_solution_end
    - step_id: step_5
      statement: 极点效应给同一个候选值。
      formula_trace:
        from: $h(x)=me^x-x^2-x-1$
        to: $h(1)=em-3\ge0,\quad m\ge\frac3e$
        operation: 用取等点和导数为零探路。
        why: 这是本章想训练的隐点效应：先猜临界取等点，再回到试卷书写证明充分性。
      source_ref: page_0289_ex01_solution_end
    - step_id: step_6
      statement: 证明 $m=3/e$ 时下界函数非负。
      formula_trace:
        from: $h(x)\ge q(x)=3e^{x-1}-x^2-x-1$
        to: $q(x)\ge0$
        operation: 研究 $q^\prime,q^{\prime\prime}$ 的形状，结合 $q(0)=q(1)=0$。
        why: 这一步补齐充分性，防止只靠草稿探路。
      source_ref: page_0289_ex01_solution_end
teaching_card:
  student_title: 把 $\ln A+A$ 降成参变量分离
  what_it_trains: 训练看到 $\ln$ 和原式同时出现时，先识别 $\ln A+A$ 的同构单调性，再把恒成立问题变成求一个函数最大值。
  recognition_cues:
    - 不等式里同时出现 $\ln\frac{me^x-x^2}{x+1}$ 和 $me^x-x^2$。
    - 移项后能凑出 $\ln(me^x-x^2)+(me^x-x^2)$ 与 $\ln(x+1)+(x+1)$。
    - 目标是求 $m$ 的取值范围，适合分离成 $m\ge p(x)$。
    - 本章还要求看懂极点效应：草稿里先用取等点锁定候选值。
  normalization_moves:
    - 先移项，别急着求导。
    - 把左右两边整理成 $\ln A+A$ 的形式。
    - 利用 $y=\ln x+x$ 单调，把问题降到 $me^x-x^2\ge x+1$。
    - 分离 $m$ 后求 $p(x)$ 最大值。
  common_failures:
    - 没有看出 $\ln A+A$，直接对原式硬求导，计算量会变大。
    - 分离参数后忘记取右侧最大值。
    - 把草稿里的极点效应当作完整证明，漏掉充分性。
    - 被 source 中重复使用的 $g(x)$ 记号干扰。
  similar_practice_query: ln A + A 同构 参变量分离 me^x-x^2 x+1 m范围 极点效应
