original_problem:
  stem: （2025 · 长郡 20 校联盟 17 题节选）已知函数 $f(x)=axe^x-(a+1)e^x+x$，当 $a<0$ 时，$f(x)$ 有两个零点，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\in(-\infty,-1)$。
  fidelity_notes:
    - 单问求参题，无选项。
    - 函数定义域为 $\mathbf R$，题设额外限定 $a<0$。
solution:
  source_solution_summary: $f'(x)=(ax-1)e^x+1$，$f''(x)=(ax-1+a)e^x$。当 $a<0$ 时， $f'$ 先增后减，且 $f'(0)=0$。进一步，$x<0$ 时 $f'(x)=axe^x-e^x+1>1-e^x>0$，所以 $f$ 在负半轴递增；$x>0$ 时 $f'(x)<f'(0)=0$，所以 $f$ 在正半轴递减，最大值为 $f(0)=-a-1$。若要两个零点，必须且只需 $f(0)>0$，即 $a<-1$。 充分性：正半轴有 $f(1)=1-e<0$，与 $f(0)>0$ 夹出 $x_1\in(0,1)$；负半轴用 $f(x)<axe^x-(a+1)+x<-\frac ae-a-1+x$，取 $x=\frac ae+a+1<0$，与 $f(0)>0$ 夹出负根。故答案 $a<-1$。
  key_steps:
    - step_id: step_1
      statement: 先求一阶和二阶导数。
      formula_trace:
        from: $f(x)=axe^x-(a+1)e^x+x$
        to: $f^\prime(x)=(ax-1)e^x+1,\ f^{\prime\prime}(x)=(ax-1+a)e^x$
        operation: 逐项求导并整理。
        why: 本题先通过导函数形状判断 $f$ 的整体单峰结构。
      source_ref: page_0240_ex14_solution_start
    - step_id: step_2
      statement: 在 $x<0$ 上，$f$ 单调递增。
      formula_trace:
        from: $a<0,\ x<0$
        to: $f^\prime(x)=axe^x-e^x+1>1-e^x>0$
        operation: 利用 $ax>0$ 和 $x<0$。
        why: 负半轴至多一个零点。
      source_ref: page_0240_ex14_solution_start
    - step_id: step_3
      statement: 在 $x>0$ 上，$f$ 单调递减。
      formula_trace:
        from: $f^\prime(0)=0$ 与 $f^\prime$ 的形状
        to: $x>0$ 时 $f^\prime(x)<0$
        operation: 由二阶导数先增后减的分析确定导数符号。
        why: 正半轴也至多一个零点。
      source_ref: page_0240_ex14_solution_start
    - step_id: step_4
      statement: 两个零点的必要条件是最大值为正。
      formula_trace:
        from: $f_{\max}=f(0)$
        to: $f(0)=-a-1>0\Rightarrow a<-1$
        operation: 代入 $x=0$。
        why: 左右两侧各至多一个零点，最高点必须高于 x 轴。
      source_ref: page_0241_ex14_continuation
    - step_id: step_5
      statement: 正半轴用 $x=1$ 夹出一个零点。
      formula_trace:
        from: $f(0)>0,\ f(1)=1-e<0$
        to: $x_1\in(0,1)$
        operation: 介值定理。
        why: 正半轴单调递减，所以这个根唯一。
      source_ref: page_0241_ex14_continuation
    - step_id: step_6
      statement: 负半轴用放缩找负值点。
      formula_trace:
        from: $x<0$
        to: $f(x)<-\frac ae-a-1+x$
        operation: 用 $xe^x\leqslant1/e$ 的变形和 $e^x<1$ 控制指数项。
        why: 要在负半轴找一个 $f<0$ 的显点。
      source_ref: page_0241_ex14_continuation
    - step_id: step_7
      statement: 取 $x=\frac ae+a+1$ 夹出负根。
      formula_trace:
        from: $-\frac ae-a-1+x=0$
        to: $x=\frac ae+a+1<0$，$x_2\in(\frac ae+a+1,0)$
        operation: 解线性上界的零点。
        why: 配合 $f(0)>0$ 和负半轴单调递增，得到唯一负根。
      source_ref: page_0241_ex14_continuation
    - step_id: step_8
      statement: 合并必要性和充分性。
      formula_trace:
        from: $a<-1$
        to: $f$ 有两个零点
        operation: 左右半轴各夹出一个根。
        why: 单调性保证不会多出根。
      source_ref: page_0241_ex14_continuation
teaching_card:
  student_title: $axe^x-(a+1)e^x+x$ 两零点：先看 $f(0)$，再左右各找一点
  what_it_trains: 训练含参指数三项式的两零点求参：先用导数确认左右各最多一根，再用最大值和显点完成必要充分。
  recognition_cues:
    - 题设 $a<0$，函数含 $axe^x$ 和 $-(a+1)e^x$。
    - $f^\prime(0)=0$，最高点落在 $x=0$。
    - 两个零点就是负半轴一个、正半轴一个。
  normalization_moves:
    - 先求 $f^\prime$ 和 $f^{\prime\prime}$。
    - 证明 $x<0$ 时递增、$x>0$ 时递减。
    - 用 $f(0)>0$ 得 $a<-1$。
    - 正半轴用 $f(1)<0$。
    - 负半轴取 $x=a/e+a+1$。
  common_failures:
    - 只写 $f(0)>0$，没有补左右取点。
    - 把负半轴根的区间误写成 $(0,1)$。
    - 没有处理 $a+1$ 的符号，导致负半轴放缩方向不稳。
  similar_practice_query: axe^x-(a+1)e^x+x a<0 两零点 f(0)=-a-1 负半轴取点 a/e+a+1
