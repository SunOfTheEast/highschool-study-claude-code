stem: （2025 · 长郡 20 校联盟 17 题节选）已知函数 $f(x)=axe^x-(a+1)e^x+x$，当 $a<0$ 时，$f(x)$ 有两个零点，求 $a$ 的取值范围。
answer: |-
  $a\in(-\infty,-1)$。

  $f'(x)=(ax-1)e^x+1$，$f''(x)=(ax-1+a)e^x$。当 $a<0$ 时， $f'$ 先增后减，且 $f'(0)=0$。进一步，$x<0$ 时 $f'(x)=axe^x-e^x+1>1-e^x>0$，所以 $f$ 在负半轴递增；$x>0$ 时 $f'(x)<f'(0)=0$，所以 $f$ 在正半轴递减，最大值为 $f(0)=-a-1$。若要两个零点，必须且只需 $f(0)>0$，即 $a<-1$。 充分性：正半轴有 $f(1)=1-e<0$，与 $f(0)>0$ 夹出 $x_1\in(0,1)$；负半轴用 $f(x)<axe^x-(a+1)+x<-\frac ae-a-1+x$，取 $x=\frac ae+a+1<0$，与 $f(0)>0$ 夹出负根。故答案 $a<-1$。
