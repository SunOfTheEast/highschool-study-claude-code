stem: |-
  已知 $x, y \in \mathbf{R}$，若 $x\cdot(e^x+\ln x+x)=1$，$y\cdot[2\ln y+\ln(\ln y)]=1$，其中 $\mathrm{e}=2.71828\cdots$ 是自然对数的底数，则 ( )
  A. 0<x<1
  B. xy=2
  C. y-x>1
  D. y-x<3/2
answer: |-
  ACD

  把两条方程都同构到 $h(t)=e^t+t$，用单调性推出 $x=\ln(1/x)$、$\ln y=1/y$，从而 $y=1/x$，再用 $x$ 的夹逼判断各选项。
