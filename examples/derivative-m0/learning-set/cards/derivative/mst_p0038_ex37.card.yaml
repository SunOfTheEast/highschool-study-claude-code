    - step_id: step_3
      description: 第二条方程同构后给出 $y$ 与 $x$ 的关系，判断 B。
      max_score: 1
    - step_id: step_4
      description: 把第二条的根与第一条的根合并，得到 $xy$。
      max_score: 1
    - step_id: step_5
      description: 用 $x$ 的粗定位判断 C、D。
      max_score: 1
