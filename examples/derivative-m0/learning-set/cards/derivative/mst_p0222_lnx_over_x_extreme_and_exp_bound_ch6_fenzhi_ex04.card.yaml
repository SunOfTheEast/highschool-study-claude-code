original_problem:
  stem: （2019 · 济南考前模拟 T21）已知函数 $f(x)=\frac{1+\ln x}{x}$。
  parts: *a1
  choices: []
  answer: （1）$x=1$ 时取得极大值 $1$，无极小值；（2）证明见解析。
  fidelity_notes:
    - 两问解答题，无选项。
    - 定义域为 $(0,+\infty)$。
solution:
  source_solution_summary: 对 $f(x)=\frac{1+\ln x}{x}$ 求导， $f^{\prime}(x)=-\frac{\ln x}{x^2}$。当 $0<x<1$ 时 $f^{\prime}(x)>0$，当 $x>1$ 时 $f^{\prime}(x)<0$，所以 $f$ 在 $x=1$ 取得极大值 $f(1)=1$，无极小值。第二问中 $a\geqslant1$，故 $ae^x\geqslant e^x$，只需证明 $e^x>\left(1+\frac1x\right)(1+\ln x)$。等价于 $\frac{e^x}{1+x}>\frac{1+\ln x}{x}$。令 $g(x)=\frac{e^x}{1+x}$，则 $g^{\prime}(x)=\frac{xe^x}{(x+1)^2}>0$，所以 $g(x)>g(0)=1$； 又由第一问 $\frac{1+\ln x}{x}\leqslant1$，故 $\frac{e^x}{1+x}>\frac{1+\ln x}{x}$，命题成立。
  key_steps:
    - step_id: step_1
      statement: 求 $f$ 的导数并判号。
      formula_trace:
        from: $f(x)=\frac{1+\ln x}{x}$
        to: $f^{\prime}(x)=-\frac{\ln x}{x^2}$
        operation: 商式求导。
        why: 极值和第二问的上界都依赖 $f(x)\leqslant1$。
      source_ref: page_0222_ex04_solution
    - step_id: step_2
      statement: 得到极值结论。
      formula_trace:
        from: $f^{\prime}(x)>0\ (0<x<1)$，$f^{\prime}(x)<0\ (x>1)$
        to: $f_{\max}=f(1)=1$，无极小值
        operation: 导数号变从正到负。
        why: 完成第一问，并为第二问提供下函数上界。
      source_ref: page_0222_ex04_solution
    - step_id: step_3
      statement: 用 $a\geqslant1$ 降到更强不等式。
      formula_trace:
        from: $ae^x>\left(1+\frac1x\right)(1+\ln x)$
        to: 只需证 $e^x>\left(1+\frac1x\right)(1+\ln x)$
        operation: 利用 $ae^x\geqslant e^x$。
        why: 把参数从证明中剥离。
      source_ref: page_0222_ex04_solution
    - step_id: step_4
      statement: 转成上下函数比较。
      formula_trace:
        from: $e^x>\left(1+\frac1x\right)(1+\ln x)$
        to: $\frac{e^x}{1+x}>\frac{1+\ln x}{x}$
        operation: 两边除以正数 $1+x$ 并整理。
        why: 右侧正好是第一问的 $f(x)$。
      source_ref: page_0222_ex04_solution
    - step_id: step_5
      statement: 左侧严格大于 1，右侧不超过 1。
      formula_trace:
        from: $g(x)=\frac{e^x}{1+x}$，$f(x)=\frac{1+\ln x}{x}$
        to: $g(x)>1\geqslant f(x)$
        operation: 求 $g^{\prime}(x)>0$，并调用第一问结论。
        why: 完成严格不等式证明。
      source_ref: page_0222_ex04_solution
teaching_card:
  student_title: 先求 $\frac{1+\ln x}{x}$ 的顶，再拿来压右边
  what_it_trains: 训练“前一问极值结论服务后一问证明”的分而治之思路。
  recognition_cues:
    - 第一问刚求出 $\frac{1+\ln x}{x}$ 的最大值，第二问右边正好含它。
    - 题中 $a\geqslant1$，可以先证明更强的 $a=1$ 情形。
    - 目标乘积可除成 $\frac{e^x}{1+x}$ 与 $\frac{1+\ln x}{x}$。
  normalization_moves:
    - 先做第一问极值，不要跳过。
    - 第二问先把 $a$ 去掉。
    - 把右边拆成 $(1+x)(1+\ln x)/x$，再两边除以 $1+x$。
  common_failures:
    - 把第二问当成独立不等式硬求导，浪费第一问结论。
    - 忘记 $g(x)>g(0)=1$ 是严格大于，不是大于等于。
    - 没有说明 $x>0$，导致分式整理不严谨。
  similar_practice_query: lnx over x 极值 e^x/(1+x) 上下函数 分而治之 不等式证明
