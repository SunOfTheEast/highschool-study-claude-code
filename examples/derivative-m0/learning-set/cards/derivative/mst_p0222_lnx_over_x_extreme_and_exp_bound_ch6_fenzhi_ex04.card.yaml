stem: |-
  （2019 · 济南考前模拟 T21）已知函数 $f(x)=\frac{1+\ln x}{x}$。
  1. 求函数 $f(x)$ 的极值。
  2. 若 $a\geqslant1$，求证：$ae^x>\left(1+\frac1x\right)(1+\ln x)$。
answer: |-
  （1）$x=1$ 时取得极大值 $1$，无极小值；（2）证明见解析。

  对 $f(x)=\frac{1+\ln x}{x}$ 求导， $f^{\prime}(x)=-\frac{\ln x}{x^2}$。当 $0<x<1$ 时 $f^{\prime}(x)>0$，当 $x>1$ 时 $f^{\prime}(x)<0$，所以 $f$ 在 $x=1$ 取得极大值 $f(1)=1$，无极小值。第二问中 $a\geqslant1$，故 $ae^x\geqslant e^x$，只需证明 $e^x>\left(1+\frac1x\right)(1+\ln x)$。等价于 $\frac{e^x}{1+x}>\frac{1+\ln x}{x}$。令 $g(x)=\frac{e^x}{1+x}$，则 $g^{\prime}(x)=\frac{xe^x}{(x+1)^2}>0$，所以 $g(x)>g(0)=1$； 又由第一问 $\frac{1+\ln x}{x}\leqslant1$，故 $\frac{e^x}{1+x}>\frac{1+\ln x}{x}$，命题成立。
