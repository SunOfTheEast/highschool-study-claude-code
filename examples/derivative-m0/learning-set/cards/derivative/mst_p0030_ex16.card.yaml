original_problem:
  stem: 若对任意 $x\in(1,+\infty)$，不等式 $(\ln a+x-1)e^{x-1}>\frac{x}{a}\ln x$ 恒成立，则 $a$ 的范围是 ( )
  parts: *a1
  choices:
    - label: A
      text_raw: $(0,1)$
      text_latex: $(0,1)$
    - label: B
      text_raw: $(0,1]$
      text_latex: $(0,1]$
    - label: C
      text_raw: $[1,+\infty)$
      text_latex: $[1,+\infty)$
    - label: D
      text_raw: $(1,+\infty)$
      text_latex: $(1,+\infty)$
  answer: C
  fidelity_notes:
    - 由 $\ln a$ 与 $1/a$ 隐含 $a>0$。
    - 源图局部把 $g(ae^{x-1})$ 误印成 $g(a^{x-1})$；本卡保留 discrepancy 并按上下文修正。
solution:
  source_solution_summary: 由定义域得 $a>0$。把 $\ln a+x-1$ 合成 $\ln(ae^{x-1})$，原不等式乘以 $a$ 后得到 $ae^{x-1}\ln(ae^{x-1})>x\ln x$。令 $g(u)=u\ln u$，右侧在 $x>1$ 为正，所以必须 $ae^{x-1}>1$；再由 $g$ 在 $(1,+\infty)$ 上递增，得到 $ae^{x-1}>x$。恒成立等价于 $a>x/e^{x-1}$ 对所有 $x>1$ 成立，而 $x/e^{x-1}$ 在 $(1,+\infty)$ 上递减，开端点上确界为 1；因此 $a\ge1$，选 C。
  key_steps:
    - step_id: step_1
      statement: 确定参数定义域并合成对数。
      formula_trace:
        from: $(\ln a+x-1)e^{x-1}>\frac{x}{a}\ln x$
        to: $e^{x-1}\ln(ae^{x-1})>\frac{x}{a}\ln x$
        operation: 由 $a>0$，把 $\ln a+x-1$ 写成 $\ln a+\ln e^{x-1}=\ln(ae^{x-1})$。
        why: 合成后的 $ae^{x-1}$ 可以作为 $u\ln u$ 的自变量。
      source_ref: page_0030
    - step_id: step_2
      statement: 两边乘 $a$ 制造 $u\ln u$。
      formula_trace:
        from: $e^{x-1}\ln(ae^{x-1})>\frac{x}{a}\ln x$
        to: $ae^{x-1}\ln(ae^{x-1})>x\ln x$
        operation: 乘以正数 $a$。
        why: 左边成为 $g(ae^{x-1})$，右边成为 $g(x)$。
      source_ref: page_0030
    - step_id: step_3
      statement: 先排除 $ae^{x-1}\le1$ 的情况。
      formula_trace:
        from: $g(ae^{x-1})>g(x),\quad x>1$
        to: $ae^{x-1}>1$
        operation: 若 $0<ae^{x-1}\le1$，则 $g(ae^{x-1})\le0$；而 $x>1$ 时 $g(x)=x\ln x>0$。
        why: 左端非正不可能大于右端正数。
      source_ref: page_0030
    - step_id: step_4
      statement: 在递增区间比较自变量。
      formula_trace:
        from: $g(ae^{x-1})>g(x)$
        to: $ae^{x-1}>x$
        operation: 利用 $g(u)=u\ln u$ 在 $(1,+\infty)$ 上严格递增。
        why: 两个自变量都在大于 1 的区间内，函数值不等式可转为自变量不等式。
      source_ref: page_0030
    - step_id: step_5
      statement: 把恒成立条件转成 $a$ 的下界。
      formula_trace:
        from: $ae^{x-1}>x\quad (x>1)$
        to: $a>\frac{x}{e^{x-1}}\quad (x>1)$
        operation: 除以正数 $e^{x-1}$。
        why: 参数 $a$ 要压过函数 $x/e^{x-1}$ 在开区间上的所有值。
      source_ref: page_0030
    - step_id: step_6
      statement: 处理开端点带来的等号。
      formula_trace:
        from: $\frac{x}{e^{x-1}}=e\frac{x}{e^x}$
        to: $\sup_{x>1}\frac{x}{e^{x-1}}=1，且 $a=1$ 可行
        operation: 对 $x/e^{x-1}$ 求导得 $e^{1-x}(1-x)<0$，在 $(1,+\infty)$ 递减，确界为 $x\to1^+$ 时的 1；$a=1$ 时 $e^{x-1}>x$。
        why: 虽然源解写最大值为 1，严格地说开区间上是确界；这使答案包含 1。
      source_ref: page_0030
    - step_id: step_7
      statement: 选出答案。
      formula_trace:
        from: $a\ge1$
        to: 选 C：$[1,+\infty)$
        operation: 与选项比对。
        why: 这是恒成立的完整参数范围。
      source_ref: page_0030
teaching_card:
  student_title: 把 $\ln a+x-1$ 合成 $x\ln x$ 同构
  what_it_trains: 训练把含参对数指数不等式合成为 $u\ln u$ 的函数值比较，并正确处理开区间恒成立中的端点参数。
  recognition_cues:
    - 题干出现 $\ln a+x-1$ 与 $e^{x-1}$，可以合成 $\ln(ae^{x-1})$。
    - 右端是 $x\ln x/a$，乘 $a$ 后可和 $u\ln u$ 对齐。
    - 变量区间是 $x>1$，正好是 $x\ln x$ 的递增区间。
  normalization_moves:
    - 先写明 $a>0$。
    - 把左侧化为 $ae^{x-1}\ln(ae^{x-1})$。
    - 用 $g(ae^{x-1})>g(x)$ 推出 $ae^{x-1}>x$。
    - 求 $x/e^{x-1}$ 在 $x>1$ 上的确界。
  common_failures:
    - 照抄源图中局部误印的 $g(a^{x-1})$，导致后续不成立。
    - 没有先排除 $ae^{x-1}\le1$，直接套 $x\ln x$ 的递增性。
    - 因不等号是严格的就误选 $(1,+\infty)$，没有检查 $a=1$ 在开区间内可行。
  similar_practice_query: ln a+x-1 ae^{x-1} xlnx 同构 参数范围 开区间
