stem: |-
  若对任意 $x\in(1,+\infty)$，不等式 $(\ln a+x-1)e^{x-1}>\frac{x}{a}\ln x$ 恒成立，则 $a$ 的范围是 ( )
  A. $(0,1)$
  B. $(0,1]$
  C. $[1,+\infty)$
  D. $(1,+\infty)$
answer: |-
  C

  由定义域得 $a>0$。把 $\ln a+x-1$ 合成 $\ln(ae^{x-1})$，原不等式乘以 $a$ 后得到 $ae^{x-1}\ln(ae^{x-1})>x\ln x$。令 $g(u)=u\ln u$，右侧在 $x>1$ 为正，所以必须 $ae^{x-1}>1$；再由 $g$ 在 $(1,+\infty)$ 上递增，得到 $ae^{x-1}>x$。恒成立等价于 $a>x/e^{x-1}$ 对所有 $x>1$ 成立，而 $x/e^{x-1}$ 在 $(1,+\infty)$ 上递减，开端点上确界为 1；因此 $a\ge1$，选 C。
