    - step_id: step_1
      statement: 将题设化为 $\left(\frac{f(x)}x\right)'=\frac{\ln x}{x}$。
      formula_trace:
        from: $f^{\prime}(x)-\frac{f(x)}x=\ln x$
        to: $\left(\frac{f(x)}{x}\right)'=\frac{\ln x}{x}$
        operation: 通分后识别商导数模板。
