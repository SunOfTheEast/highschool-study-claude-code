stem: |-
  （2023·宁乡市月考·多选）设函数 $f^{\prime}(x)$ 是函数 $f(x)$ 的导函数，且满足 $f^{\prime}(x)-\frac{f(x)}{x}=\ln x$，$f\!\left(\frac1e\right)=\frac1e$，则（ ）
  A. $f(x)$ 有极大值
  B. $4f(2)<3f(4)$
  C. $f(1)>f^{\prime}(e)$
  D. $f^{\prime}(1)>\frac1e$
answer: |
  BD

  由
  \[
  f^{\prime}(x)-\frac{f(x)}{x}=\ln x
  \]
  得
  \[
  \frac{xf^{\prime}(x)-f(x)}{x^2}=\frac{\ln x}{x}
  \Rightarrow
  \left(\frac{f(x)}{x}\right)'=\frac{\ln x}{x}.
  \]
  积分设
  \[
  \frac{f(x)}{x}=\frac12(\ln x)^2+b,\quad x>0,
  \]
  即
  \[
  f(x)=\frac12x(\ln x)^2+bx.
  \]
  由
  \[
  f\!\left(\frac1e\right)=\frac1e
  \]
  得
  \[
  \frac{1+2b}{2e}=\frac1e \Rightarrow b=\frac12.
  \]
  所以
  \[
  f(x)=\frac12x(\ln x)^2+\frac12x,\quad
  f^{\prime}(x)=\frac12(\ln x+1)^2\ge0.
  \]
  故 $f$ 在 $(0,+\infty)$ 递增，无极大值，A 错。
  又
  \[
  f(1)=\frac12,\quad f^{\prime}(e)=2,\quad f(1)<f^{\prime}(e),
  \]
  C 错。
  并且
  \[
  f^{\prime}(1)=\frac12>\frac1e,
  \]
  D 对。
  计算
  \[
  f(2)=(\ln2)^2+1,\quad f(4)=8(\ln2)^2+2,
  \]
  得
  \[
  4f(2)=4(\ln2)^2+4<24(\ln2)^2+6=3f(4),
  \]
  所以 B 对。故选 BD。
