teaching_card:
  student_title: 把 $f^{\prime}-f/x$ 反构成 $f/x$，再用平方导数一键判单调
  what_it_trains: 训练 $\ln x/x$ 型反向积分模板，以及多选题中“先定表达式再分项代点”流程。
  recognition_cues:
    - 条件是 $f^{\prime}(x)-\frac{f(x)}x=\ln x$。
    - 给定了特殊点值 $f(1/e)$。
    - 选项同时有单调判断与具体数值比较。
  normalization_moves:
    - 先写 $\left(\frac{f}{x}\right)'=\frac{\ln x}{x}$。
    - 积分并用 $f(1/e)$ 定常数。
    - 求导后化成平方项，再逐项代点判定。
  common_failures:
    - 把 $\int \frac{\ln x}{x}dx$ 漏写为 $\ln x$。
    - 求 $f^{\prime}(x)$ 时漏掉乘积法则中的 $\ln x$ 项。
    - 在 B 项里把 $\ln4$ 与 $\ln2$ 的系数关系算错。
  similar_practice_query: f'-f/x=lnx 反向积分 lnx/x 多选 判单调 4f(2) 3f(4)
