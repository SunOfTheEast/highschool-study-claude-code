solution:
  source_solution_summary: 先把题设移项化为 $(n+1)e^m>me^{n+1}$，直接得到选项 A。再构造 $f(x)=e^x/x$，由其在 $(1,+\infty)$ 上递增推出 $m>n+1$。这个强关系一方面让 B 的指数比较反向，另一方面支撑 C 的基本不等式下界和 D 的 $m+n>3$。
  key_steps:
    - step_id: step_1
      statement: 由题设直接整理出选项 A。
      formula_trace:
        from: $e^m>me^{n+1}-ne^m$
        to: $(n+1)e^m>me^{n+1}$，即 $\frac{e^m}{m}>\frac{e^{n+1}}{n+1}$
        operation: 两边加 $ne^m$，再除以正数 $m(n+1)$。
        why: $m>1,n>1$ 保证除法不改变不等号，所得正是 A。
      source_ref: page_0032
    - step_id: step_2
      statement: 用 $e^x/x$ 的单调性把函数值比较转成自变量比较。
      formula_trace:
        from: $f(x)=\frac{e^x}{x}\quad(x>1)$
        to: |
          $f'(x)=\frac{e^x(x-1)}{x^2}>0$，故 $f(m)>f(n+1)\Rightarrow m>n+1$。
        operation: 求导判定 $f$ 在 $(1,+\infty)$ 上严格递增，并注意 $m>1,\ n+1>2$。
        why: 严格递增函数的函数值大小可以等价转化为自变量大小。
      source_ref: page_0032
    - step_id: step_3
      statement: 判断选项 B 的指数不等式方向。
      formula_trace:
        from: $m>n+1$
        to: $m-1>n$，所以 $\left(\frac12\right)^{m-1}<\left(\frac12\right)^n$
        operation: 两边减 1，再利用 $y=(1/2)^x$ 单调递减。
        why: 选项 B 写成 $>$，与递减函数给出的方向相反。
      source_ref: page_0032
    - step_id: step_4
      statement: 用 $m>n+1$ 和基本不等式证明选项 C。
      formula_trace:
        from: $m>n+1$
        to: $2^{m-4}+2^{-n}>2^{n-3}+2^{-n}\ge2\sqrt{2^{n-3}\cdot2^{-n}}=\frac{\sqrt2}{2}$
        operation: 由 $m-4>n-3$ 得 $2^{m-4}>2^{n-3}$，再对 $2^{n-3}$ 与 $2^{-n}$ 用基本不等式。
        why: 先把第一项压到只含 $n$ 的更小量，再用积为 $2^{-3}$ 的两项给出统一下界。
      source_ref: page_0032
    - step_id: step_5
      statement: 由 $m>n+1$ 判断选项 D。
      formula_trace:
        from: $m>n+1,\quad n>1$
        to: $m+n>2n+1>3$，故 $\log_3(m+n)>1$
        operation: 把 $m$ 用更小的 $n+1$ 替代作下界，再利用底数 $3>1$ 的对数单调性。
        why: $m+n>3$ 与 $\log_3(m+n)>1$ 等价。
      source_ref: page_0032
teaching_card:
  student_title: 用 $e^x/x$ 单调性锁住 $m>n+1$
  what_it_trains: 训练从指数不等式中拆出 $e^x/x$ 的同构比较，再用一个强大小关系连续判断多项选择。
  recognition_cues:
    - 题设含 $e^m$、$e^{n+1}$，并能整理成 $\frac{e^m}{m}$ 与 $\frac{e^{n+1}}{n+1}$。
    - 变量条件 $m>1,n>1$ 正好匹配 $e^x/x$ 在 $x>1$ 的递增区间。
    - 选项都可由 $m>n+1$ 继续推出或否定。
  normalization_moves:
    - 把题设移项为 $(n+1)e^m>me^{n+1}$。
    - 构造 $f(x)=e^x/x$，由函数值比较推出 $m>n+1$。
    - 选项 C 中先用 $2^{m-4}>2^{n-3}$，再用基本不等式。
  common_failures:
    - 只得到选项 A，忘记继续用单调性推出 $m>n+1$。
    - 判断 B 时忽略底数 $1/2$ 小于 1，导致不等号方向错误。
    - 选项 C 直接估 $2^{m-4}+2^{-n}$，没有先替换成只含 $n$ 的可控下界。
  similar_practice_query: e^x/x 单调 m n 多选 指数不等式 基本不等式
