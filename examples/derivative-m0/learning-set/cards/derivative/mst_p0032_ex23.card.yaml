stem: |-
  （2023 · 邯郸开学 T11）已知 $m>1,\ n>1$，若 $e^m>me^{n+1}-ne^m$，则（ ）
  A. $\frac{e^m}{m}>\frac{e^{n+1}}{n+1}$
  B. $\left(\frac{1}{2}\right)^{m-1}>\left(\frac{1}{2}\right)^n$
  C. $2^{m-4}+2^{-n}>\frac{\sqrt2}{2}$
  D. $\log_3(m+n)>1$
answer: |-
  ACD。

  先把题设移项化为 $(n+1)e^m>me^{n+1}$，直接得到选项 A。再构造 $f(x)=e^x/x$，由其在 $(1,+\infty)$ 上递增推出 $m>n+1$。这个强关系一方面让 B 的指数比较反向，另一方面支撑 C 的基本不等式下界和 D 的 $m+n>3$。
