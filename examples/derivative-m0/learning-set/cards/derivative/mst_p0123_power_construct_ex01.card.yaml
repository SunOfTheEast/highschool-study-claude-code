solution:
  source_solution_summary: |
    当 $x>0$ 时，
    $\frac{x f'(x)-f(x)}{x^2}=\left[\frac{f(x)}{x}\right]'<0$，
    所以 $\frac{f(x)}{x}$ 在 $(0,+\infty)$ 上单调递减。又 $f$ 是奇函数且
    $f(-1)=0$，故 $f(1)=0$，即 $\frac{f(1)}{1}=0$。
    因此当 $x>1$ 时，$\frac{f(x)}{x}<0$，得 $f(x)<0$；
    当 $0<x<1$ 时，$\frac{f(x)}{x}>0$，得 $f(x)>0$。
    再由奇函数对称性，负半轴上 $f(x)>0$ 对应 $x<-1$。
    故解集为 $(-\infty,-1)\cup(0,1)$，选 A。
  key_steps:
    - step_id: step_1
      statement: 识别 $x f^{\prime}(x)-f(x)$ 对应的除法构造。
      formula_trace:
        from: |
          $x f'(x)-f(x)<0,\qquad x>0$
        to: |
          $\left[\frac{f(x)}{x}\right]'=\frac{x f'(x)-f(x)}{x^2}<0$
        operation: 两边除以正数 $x^2$，写成商函数导数。
        why: 这样把导数不等式转化为 $\frac{f(x)}{x}$ 的单调性。
      source_ref: page_0123
    - step_id: step_2
      statement: 利用奇函数给出的零点定位正半轴符号。
      formula_trace:
        from: |
          $f(-1)=0,\qquad f(-x)=-f(x)$
        to: |
          $f(1)=0,\qquad \frac{f(1)}{1}=0$
        operation: 由奇函数对称把 $-1$ 处零点映到 $1$。
        why: 单调函数 $\frac{f(x)}{x}$ 需要一个已知比较点来判定符号。
      source_ref: page_0123
    - step_id: step_3
      statement: 在正半轴上解出 $f(x)>0$。
      formula_trace:
        from: |
          $\frac{f(x)}{x}$ 在 $(0,+\infty)$ 上递减，且 $\frac{f(1)}{1}=0$
        to: |
          $0<x<1$ 时 $f(x)>0$；$x>1$ 时 $f(x)<0$
        operation: 按 $x$ 与 $1$ 的大小比较单调函数值，并利用 $x>0$ 不改变符号。
        why: 题目要求的是 $f(x)$ 的正值区间。
      source_ref: page_0123
    - step_id: step_4
      statement: 用奇函数图象补全负半轴。
      formula_trace:
        from: |
          $0<t<1$ 时 $f(t)>0$，$t>1$ 时 $f(t)<0$
        to: |
          $-1<x<0$ 时 $f(x)<0$，$x<-1$ 时 $f(x)>0$
        operation: 令 $x=-t$，用 $f(-t)=-f(t)$。
        why: 导数条件只给出 $x>0$，负半轴必须靠奇性延拓。
      source_ref: page_0123
teaching_card:
  student_title: 看到 $x f^{\prime}-f$，先构造 $\frac{f}{x}$
  what_it_trains: 训练把幂函数除法型导数不等式转化为辅助函数单调性，再结合奇函数求原函数正值区间。
  recognition_cues:
    - 条件是 $x f^{\prime}(x)-f(x)$，这是 $\left(\frac{f(x)}{x}\right)^{\prime}$ 的分子。
    - 导数条件只在 $x>0$，先做正半轴，再由奇函数处理负半轴。
    - 题干给 $f(-1)=0$，奇函数会把它变成正半轴比较点 $f(1)=0$。
  normalization_moves:
    - 写出 $\left[\frac{f(x)}{x}\right]^{\prime}=\frac{x f^{\prime}(x)-f(x)}{x^2}$。
    - 判断 $\frac{f(x)}{x}$ 在 $(0,+\infty)$ 上递减。
    - 用 $f(1)=0$ 分出 $(0,1)$ 与 $(1,+\infty)$。
    - 用奇函数对称补出 $(-\infty,-1)$。
  common_failures:
    - 把 $x f^{\prime}(x)-f(x)$ 误构造成 $x f(x)$ 的导数。
    - 在负半轴也直接除以 $x^2$ 使用条件，忽略条件只给 $x>0$。
    - 比较 $\frac{f(x)}{x}$ 后忘记 $x>0$ 才能保持同号。
    - 把 $f(-1)=0$ 错当成正半轴零点。
  similar_practice_query: xf^{\prime}-f 小于0 f(x)/x 单调 奇函数 正值区间
