solution:
  source_solution_summary: 先求导：$f^\prime(x)=(x-1)(e^x+2a)$。当 $a\ge0$ 时， $e^x+2a>0$，所以 $f$ 在 $(-\infty,1)$ 减、$(1,+\infty)$ 增。 当 $a<0$ 时，另一个驻点是 $\ln(-2a)$，再按它与 1 的位置分三段： $a=-\frac e2$ 时全域递增；$a<-\frac e2$ 时 $(-\infty,1)$、$(\ln(-2a),+\infty)$ 增，$(1,\ln(-2a))$ 减； $-\frac e2<a<0$ 时 $(-\infty,\ln(-2a))$、$(1,+\infty)$ 增， $(\ln(-2a),1)$ 减。第(2)问用显点 $x=1$：$f(1)=-e$。 若 $a>0$，这是唯一极小值，右侧 $f(2)=a>0$，左侧由 $(x-2)e^x\in(-e,0)$ 和取点 $x=1-\sqrt{e/a}$ 得正值，所以两侧各有一个零点。 若 $a=0$，只有零点 $x=2$。若 $a<0$，两处极值都小于 0，不可能有两个零点。
  key_steps:
    - step_id: step_1
      statement: 求导并分出显点 $x=1$。
      formula_trace:
        from: $f(x)=(x-2)e^x+a(x-1)^2$
        to: $f^\prime(x)=(x-1)(e^x+2a)$
        operation: 求导并提取公共因子 $x-1$。
        why: $x=1$ 是固定显点，另一个驻点由 $e^x+2a=0$ 决定。
      source_ref: page_0279_ex03_monotonicity
    - step_id: step_2
      statement: 按 $a$ 与 $-\frac e2$ 的关系讨论单调性。
      formula_trace:
        from: $x=1,\quad x=\ln(-2a)$
        to: $a\ge0$；$a=-\frac e2$；$a<-\frac e2$；$-\frac e2<a<0$
        operation: 比较 $\ln(-2a)$ 与 1 的位置。
        why: 极值个数和位置决定后面能否有两个零点。
      source_ref: page_0279_ex03_monotonicity
    - step_id: step_3
      statement: 当 $a>0$，用显点值判断曲线有机会两侧穿轴。
      formula_trace:
        from: $a>0,\quad f(1)=-e<0,\quad f(2)=a>0$
        to: $\exists x_2\in(1,2),\ f(x_2)=0$
        operation: 利用右侧单调递增和介值定理。
        why: 显点 $x=1$ 是唯一极小点，右侧找到正值就有唯一右零点。
      source_ref: page_0279_ex03_visible_point
    - step_id: step_4
      statement: 当 $a>0$，左侧用取点补出第二个零点。
      formula_trace:
        from: $(x-2)e^x\in(-e,0),\quad x<1$
        to: $f(x)>-e+a(x-1)^2$，取 $x=1-\sqrt{\frac ea}$ 得 $f(x)>0$
        operation: 用指数项范围给下界，再让二次下界取 0。
        why: 左侧单调递减，且 $f(1)<0$、左侧某点 $>0$，所以左侧唯一穿轴。
      source_ref: page_0280_ex03_continuation
    - step_id: step_5
      statement: 排除 $a=0$ 和 $a<0$。
      formula_trace:
        from: $a=0$ 或 $a<0$
        to: $a=0$ 只有零点 $2$；$a<0$ 两个极值都小于 0
        operation: 分别代入或计算 $f(\ln(-2a))=a[\ln^2(-2a)-4\ln(-2a)+5]$。
        why: 这两类都不能满足“有两个零点”。
      source_ref: page_0280_ex03_continuation
    - step_id: step_6
      statement: 合并得到参数范围。
      formula_trace:
        from: $a>0$ 可行；$a\le0$ 不可
        to: $a\in(0,+\infty)$
        operation: 分类合并。
        why: 只有正参数时显点两侧都能穿轴。
      source_ref: page_0280_ex03_continuation
teaching_card:
  student_title: 用显点 $x=1$ 判断什么时候有两个零点
  what_it_trains: 训练显点探路：固定极值点 $x=1$ 已经给出负值，参数为正时只要在左右两边各找一个正值，就能锁定两个零点。
  recognition_cues:
    - 导数能分解成 $(x-1)(e^x+2a)$，其中 $x=1$ 是固定点。
    - 题目要求“有两个零点”，核心是看极小值两侧是否都能穿轴。
    - $a>0$ 时只有一个极小值，图像最容易判断。
    - $a<0$ 时多一个隐点 $\ln(-2a)$，但两个极值高度都小于 0。
  normalization_moves:
    - 先做完整单调性分类。
    - 把 $f(1)=-e$ 当成显点高度。
    - 右侧直接看 $f(2)=a$。
    - 左侧用 $x=1-\sqrt{e/a}$ 补出正值。
  common_failures:
    - 只看到 $f(2)=a>0$，忘记还要证明左侧也有一个零点。
    - 把 $a=0$ 混进答案，但此时只有 $x=2$ 一个零点。
    - 认为 $a<0$ 有两个极值就可能有两个零点，忽略两个极值都在 $x$ 轴下方。
    - 把左侧取点当成主方法，没看出显点 $x=1$ 才是组织全题的核心。
  similar_practice_query: 显点 x=1 (x-2)e^x+a(x-1)^2 两个零点 a>0
