stem: |-
  （2016 · 新课标 I）已知函数 $f(x)=(x-2)e^x+a(x-1)^2$。
  1. 讨论 $f(x)$ 的单调性。
  2. 若 $f(x)$ 有两个零点，求 $a$ 的取值范围（文）。
answer: |-
  (2) $a\in(0,+\infty)$。

  先求导：$f^\prime(x)=(x-1)(e^x+2a)$。当 $a\ge0$ 时， $e^x+2a>0$，所以 $f$ 在 $(-\infty,1)$ 减、$(1,+\infty)$ 增。 当 $a<0$ 时，另一个驻点是 $\ln(-2a)$，再按它与 1 的位置分三段： $a=-\frac e2$ 时全域递增；$a<-\frac e2$ 时 $(-\infty,1)$、$(\ln(-2a),+\infty)$ 增，$(1,\ln(-2a))$ 减； $-\frac e2<a<0$ 时 $(-\infty,\ln(-2a))$、$(1,+\infty)$ 增， $(\ln(-2a),1)$ 减。第(2)问用显点 $x=1$：$f(1)=-e$。 若 $a>0$，这是唯一极小值，右侧 $f(2)=a>0$，左侧由 $(x-2)e^x\in(-e,0)$ 和取点 $x=1-\sqrt{e/a}$ 得正值，所以两侧各有一个零点。 若 $a=0$，只有零点 $x=2$。若 $a<0$，两处极值都小于 0，不可能有两个零点。
