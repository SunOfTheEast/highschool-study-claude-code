stem: |-
  （2023 · 甲卷理）已知 $f(x)=ax-\frac{\sin x}{\cos^3 x}$，$x\in(0,\frac{\pi}{2})$。
  1. 若 $a=8$，讨论 $f(x)$ 的单调性。
  2. 若 $f(x)<\sin2x$ 恒成立，求 $a$ 的取值范围。
answer: |-
  第(1)问：$f$ 在 $(0,\frac\pi4)$ 单调递增，在 $(\frac\pi4,\frac\pi2)$ 单调递减。第(2)问：$a\in(-\infty,3]$。

  第(1)问在 $a=8$ 时求导，得到 $f^\prime(x)=\frac{(4\cos^2x+3)(2\cos^2x-1)}{\cos^4x}$， 因此以 $x=\frac\pi4$ 为分界先增后减。第(2)问构造 $g(x)=ax-\frac{\sin x}{\cos^3x}-\sin2x$，把 $g^\prime(x)$ 写成 $h(t)=a+2-4t+\frac2t-\frac3{t^2}$， 其中 $t=\cos^2x\in(0,1)$。因为 $h^\prime(t)=-\frac{2(t-1)(2t^2+2t+3)}{t^3}>0$， 所以 $h(t)<h(1)=a-3$。当 $a\le3$ 时 $g^\prime<0$，从而 $g(x)<g(0)=0$；当 $a>3$ 时 $h(1)>0$ 且 $t\to0$ 时 $h(t)\to-\infty$，于是靠近 $0$ 的一段有 $g^\prime>0$， 导致 $g(x)>0$，矛盾。
