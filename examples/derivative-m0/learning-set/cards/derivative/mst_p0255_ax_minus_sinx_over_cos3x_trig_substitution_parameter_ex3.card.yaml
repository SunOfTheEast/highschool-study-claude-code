original_problem:
  stem: （2023 · 甲卷理）已知 $f(x)=ax-\frac{\sin x}{\cos^3 x}$，$x\in(0,\frac{\pi}{2})$。
  parts: *a1
  choices: []
  answer: 第(1)问：$f$ 在 $(0,\frac\pi4)$ 单调递增，在 $(\frac\pi4,\frac\pi2)$ 单调递减。第(2)问：$a\in(-\infty,3]$。
  fidelity_notes:
    - 无选项。
    - source 第(2)问换元符号按公式链修正为 $t=\cos^2x$。
solution:
  source_solution_summary: 第(1)问在 $a=8$ 时求导，得到 $f^\prime(x)=\frac{(4\cos^2x+3)(2\cos^2x-1)}{\cos^4x}$， 因此以 $x=\frac\pi4$ 为分界先增后减。第(2)问构造 $g(x)=ax-\frac{\sin x}{\cos^3x}-\sin2x$，把 $g^\prime(x)$ 写成 $h(t)=a+2-4t+\frac2t-\frac3{t^2}$， 其中 $t=\cos^2x\in(0,1)$。因为 $h^\prime(t)=-\frac{2(t-1)(2t^2+2t+3)}{t^3}>0$， 所以 $h(t)<h(1)=a-3$。当 $a\le3$ 时 $g^\prime<0$，从而 $g(x)<g(0)=0$；当 $a>3$ 时 $h(1)>0$ 且 $t\to0$ 时 $h(t)\to-\infty$，于是靠近 $0$ 的一段有 $g^\prime>0$， 导致 $g(x)>0$，矛盾。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：把导数因式分解。
      formula_trace:
        from: $f(x)=8x-\frac{\sin x}{\cos^3x}$
        to: $f^\prime(x)=\frac{(4\cos^2x+3)(2\cos^2x-1)}{\cos^4x}$
        operation: 求导并整理成可判号的因式。
        why: 只剩 $2\cos^2x-1$ 决定导数符号。
      source_ref: page_0255_ex3_solution
    - step_id: step_2
      statement: 第(1)问：用 $\cos x=\frac{\sqrt2}{2}$ 分段。
      formula_trace:
        from: $2\cos^2x-1$
        to: $0<x<\frac\pi4$ 时 $f^\prime>0$，$\frac\pi4<x<\frac\pi2$ 时 $f^\prime<0$
        operation: 在 $(0,\frac\pi2)$ 上按 $\cos x$ 大小判号。
        why: 得到单调区间。
      source_ref: page_0255_ex3_solution
    - step_id: step_3
      statement: 第(2)问：把目标不等式改成 $g(x)<0$。
      formula_trace:
        from: $f(x)<\sin2x$
        to: $g(x)=ax-\frac{\sin x}{\cos^3x}-\sin2x<0$
        operation: 移项构造差函数。
        why: 恒成立求参转为控制差函数符号。
      source_ref: page_0255_ex3_solution
    - step_id: step_4
      statement: 第(2)问：用 $t=\cos^2x$ 化简导函数。
      formula_trace:
        from: $g^\prime(x)=a-\frac{3-2\cos^2x}{\cos^4x}-2\cos2x$
        to: $h(t)=a+2-4t+\frac2t-\frac3{t^2}$
        operation: 令 $t=\cos^2x$，并用 $\cos2x=2t-1$。
        why: 三角复合导数被压成一个有理函数。
      source_ref: page_0255_ex3_solution
    - step_id: step_5
      statement: 第(2)问：用 $h(t)$ 的单调性卡住 $a$。
      formula_trace:
        from: $h^\prime(t)=-\frac{2(t-1)(2t^2+2t+3)}{t^3}>0$
        to: $a\le3$ 时 $g^\prime<0$；$a>3$ 时靠近 $0$ 有 $g(x)>0$
        operation: 比较 $h(t)$ 与 $h(1)$，再用端点趋势反证。
        why: 边界 $a=3$ 由 $h(1)$ 精确给出。
      source_ref: page_0255_ex3_solution
teaching_card:
  student_title: 把三角导函数换成 $t=\cos^2x$ 来卡参数
  what_it_trains: 训练看到 $\sin x/\cos^3x$ 和 $\sin2x$ 后，把导函数统一到 $\cos^2x$，再用一个有理函数的单调性完成求参。
  recognition_cues:
    - 题目同时出现 $\frac{\sin x}{\cos^3x}$ 与 $\sin2x$。
    - 导数里出现 $\cos^2x$、$\cos^4x$ 和 $\cos2x$。
    - 参数边界来自 $t=1$，而反例来自 $t\to0$。
  normalization_moves:
    - 第(1)问先把导数整理成因式，不要只看复杂分式。
    - 第(2)问统一用 $t=\cos^2x$，不要误把 $\cos2x$ 当作换元变量。
    - 求出 $h^\prime(t)>0$ 后，立刻比较 $h(t)$ 与 $h(1)$。
  common_failures:
    - 把 source 中的 $\cos2x=t$ 照抄，导致后面公式对不上。
    - 只证明 $a\le3$ 充分，漏掉 $a>3$ 时靠近 $0$ 的反例。
    - 第(1)问忘记 $x\in(0,\frac\pi2)$，把 $\cos x$ 判号搞反。
  similar_practice_query: 三角复合 cos^2x换元 sinx/cos3x sin2x 参数范围 端点探路
