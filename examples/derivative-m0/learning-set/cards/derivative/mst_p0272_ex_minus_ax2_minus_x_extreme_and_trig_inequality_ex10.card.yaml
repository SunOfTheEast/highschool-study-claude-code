original_problem:
  stem: （2024 · 济南模拟）已知函数 $f(x)=e^x-ax^2-x$，$f^\prime(x)$ 为 $f(x)$ 的导数。
  parts: *a1
  choices: []
  answer: 第(1)问：$a\le0$ 时 $f^\prime$ 在 $\mathbf{R}$ 上递增；$a>0$ 时 $f^\prime$ 在 $(-\infty,\ln 2a)$ 上递减，在 $(\ln 2a,+\infty)$ 上递增。第(2)问：$a>\frac12$。第(3)问：成立。
  fidelity_notes:
    - 第(3)问题头在 page_0273 页首。
    - 第(3)问证明依赖第(2)问的 $a=1$ 特例。
solution:
  source_solution_summary: 第(1)问 $f^\prime(x)=e^x-2ax-1$，令 $g=f^\prime$， $g^\prime=e^x-2a$。若 $a\le0$，$g^\prime>0$，所以 $f^\prime$ 全域递增；若 $a>0$，$g^\prime=0$ 得 $x=\ln2a$，于是 $f^\prime$ 先减后增。第(2)问 $f^\prime(0)=0$，$f^{\prime\prime}(0)=1-2a$。 要使 $x=0$ 为极大值点，需要 $a>\frac12$；source 再按 $a\le0$、$0<a<\frac12$、$a=\frac12$、$a>\frac12$ 用第(1)问验证。第(3)问把目标拆成 $e^{\sin\theta-1}+\ln\sin\theta<\sin^2\theta$ 与 $e^{\cos\theta-1}+\ln\cos\theta<\cos^2\theta$，只需证明 $0<x<1$ 时 $e^{x-1}+\ln x<x^2$。令 $u=x-1\in(-1,0)$， 用第(2)问 $a=1$ 得 $e^u<u^2+u+1$，再用 $\ln(1+u)<u$，相加得到目标。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：把 $f^\prime$ 的单调性转给 $g^\prime$。
      formula_trace:
        from: $f^\prime(x)=e^x-2ax-1$
        to: $g^\prime(x)=e^x-2a$
        operation: 令 $g=f^\prime$ 并求导。
        why: 讨论导函数的单调性，等价于看二阶导符号。
      source_ref: page_0273_ex10_solution
    - step_id: step_2
      statement: 第(1)问：按 $a$ 的符号讨论。
      formula_trace:
        from: $g^\prime(x)=e^x-2a$
        to: $a\le0$ 全域递增；$a>0$ 在 $\ln2a$ 前减后增
        operation: 解 $g^\prime=0$ 并判号。
        why: 指数函数单调，只有 $a>0$ 时出现临界点。
      source_ref: page_0273_ex10_solution
    - step_id: step_3
      statement: 第(2)问：用局部二阶信息锁方向。
      formula_trace:
        from: $f^\prime(0)=0$，$f^{\prime\prime}(0)=1-2a$
        to: $1-2a<0$，即 $a>\frac12$
        operation: 极大值点要求 0 附近左增右减。
        why: 最低偶次项系数为负，才可能在 0 处取极大值。
      source_ref: page_0273_ex10_solution
    - step_id: step_4
      statement: 第(2)问：用第(1)问验证 $a>\frac12$。
      formula_trace:
        from: $a>\frac12$，$\ln2a>0$，且 $f^\prime(0)=0$
        to: $x<0$ 时 $f^\prime>0$，$0<x<\ln2a$ 时 $f^\prime<0$
        operation: 套用 $f^\prime$ 先减后增的形态。
        why: 确认 $x=0$ 是极大值点，而不是只靠必要条件。
      source_ref: page_0273_ex10_solution
    - step_id: step_5
      statement: 第(3)问：把三角不等式降成一元模板。
      formula_trace:
        from: $e^{\sin\theta-1}+e^{\cos\theta-1}+\ln(\sin\theta\cos\theta)<1$
        to: $0<x<1$ 时 $e^{x-1}+\ln x<x^2$
        operation: 分别令 $x=\sin\theta$ 与 $x=\cos\theta$。
        why: $\sin^2\theta+\cos^2\theta=1$，可以逐项证明。
      source_ref: page_0273_ex10_solution
    - step_id: step_6
      statement: 第(3)问：回用第(2)问的 $a=1$ 特例。
      formula_trace:
        from: $u=x-1\in(-1,0)$
        to: $e^u<u^2+u+1$ 且 $\ln(1+u)<u$
        operation: 用 $a=1$ 时 $e^u-u^2-u<1$，再加对数基础不等式。
        why: 两式相加得到 $e^u+\ln(1+u)<(1+u)^2$。
      source_ref: page_0273_ex10_solution
teaching_card:
  student_title: 前问不是白做：用极大值结论证明三角不等式
  what_it_trains: 训练综合题的前后问联动：先界定极大值参数，再把第三问降成可以直接调用前问的指数对数模板。
  recognition_cues:
    - 第(2)问得到的是 $a>\frac12$，所以 $a=1$ 是可用特例。
    - 第(3)问同时出现 $\sin\theta$、$\cos\theta$ 和 $\ln(\sin\theta\cos\theta)$。
    - 目标右侧是 1，可以拆成 $\sin^2\theta+\cos^2\theta$。
  normalization_moves:
    - 第(1)问先把 $f^\prime$ 的单调性完整讨论出来。
    - 第(2)问用 $f^{\prime\prime}(0)=1-2a$ 锁住 $a>\frac12$。
    - 第(3)问把三角不等式拆成同一个一元模板。
    - 用 $a=1$ 时 $x<0$ 的极大值结论提供指数上界。
  common_failures:
    - 第(3)问另起炉灶，不回用第(2)问。
    - 只证明 $e^{x-1}<x^2$，漏掉 $\ln x$ 项。
    - 忘记 $\sin\theta,\cos\theta$ 都在 $(0,1)$。
    - 第(2)问把 $a=\frac12$ 错误纳入答案。
  similar_practice_query: e^x-ax^2-x 极大值 a>1/2 sin cos 指数对数不等式 前问回用
