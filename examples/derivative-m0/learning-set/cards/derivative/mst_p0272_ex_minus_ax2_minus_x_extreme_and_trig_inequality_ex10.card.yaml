stem: |-
  （2024 · 济南模拟）已知函数 $f(x)=e^x-ax^2-x$，$f^\prime(x)$ 为 $f(x)$ 的导数。
  1. 讨论 $f^\prime(x)$ 的单调性。
  2. 若 $x=0$ 是 $f(x)$ 的极大值点，求 $a$ 的取值范围。
  3. 若 $\theta\in(0,\frac\pi2)$，证明：$e^{\sin\theta-1}+e^{\cos\theta-1}+\ln(\sin\theta\cos\theta)<1$。
answer: |-
  第(1)问：$a\le0$ 时 $f^\prime$ 在 $\mathbf{R}$ 上递增；$a>0$ 时 $f^\prime$ 在 $(-\infty,\ln 2a)$ 上递减，在 $(\ln 2a,+\infty)$ 上递增。第(2)问：$a>\frac12$。第(3)问：成立。

  第(1)问 $f^\prime(x)=e^x-2ax-1$，令 $g=f^\prime$， $g^\prime=e^x-2a$。若 $a\le0$，$g^\prime>0$，所以 $f^\prime$ 全域递增；若 $a>0$，$g^\prime=0$ 得 $x=\ln2a$，于是 $f^\prime$ 先减后增。第(2)问 $f^\prime(0)=0$，$f^{\prime\prime}(0)=1-2a$。 要使 $x=0$ 为极大值点，需要 $a>\frac12$；source 再按 $a\le0$、$0<a<\frac12$、$a=\frac12$、$a>\frac12$ 用第(1)问验证。第(3)问把目标拆成 $e^{\sin\theta-1}+\ln\sin\theta<\sin^2\theta$ 与 $e^{\cos\theta-1}+\ln\cos\theta<\cos^2\theta$，只需证明 $0<x<1$ 时 $e^{x-1}+\ln x<x^2$。令 $u=x-1\in(-1,0)$， 用第(2)问 $a=1$ 得 $e^u<u^2+u+1$，再用 $\ln(1+u)<u$，相加得到目标。
