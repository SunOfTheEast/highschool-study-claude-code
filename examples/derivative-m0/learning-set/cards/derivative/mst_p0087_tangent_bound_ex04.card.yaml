solution:
  source_solution_summary: 设切点为 $(x_0,x_0\ln x_0)$，其中 $x_0>0$。因为 $(x\ln x)'=\ln x+1$，过 $A(a,0)$ 的切线条件为 $-x_0\ln x_0=(\ln x_0+1)(a-x_0)$，整理得 $a=\frac{x_0}{1+\ln x_0}$。记 $T(x)=\frac{x}{1+\ln x}$。在 $(0,\frac1e)$ 上 $T(x)<0$， 对每个 $a<0$ 只有一个切点；在 $(\frac1e,1)$ 上 $T$ 从 $+\infty$ 降到 1，在 $(1,+\infty)$ 上 $T$ 从 1 增到 $+\infty$。因此 $0<a<1$ 无切线，$a=1$ 只有一条切线， $a>1$ 有两条切线。故选 B。
  key_steps:
    - step_id: step_1
      statement: 设切点并写出过 $A(a,0)$ 的切线条件。
      formula_trace:
        from: |
          $f(x)=x\ln x,\qquad f'(x_0)=\ln x_0+1$
        to: |
          $0-x_0\ln x_0=(\ln x_0+1)(a-x_0)$
        operation: 用切点 $(x_0,x_0\ln x_0)$ 写切线方程，再代入点 $A(a,0)$。
        why: 从定点能作几条切线，等价于切点横坐标方程有几个正解。
      source_ref: page_0087
    - step_id: step_2
      statement: 把切线条数转成参数函数 $T(x)$ 的解数。
      formula_trace:
        from: |
          $-x_0\ln x_0=(\ln x_0+1)(a-x_0)$
        to: |
          $a=\frac{x_0}{1+\ln x_0}\quad (x_0>0,\ x_0\ne 1/e)$
        operation: 展开并把含 $a$ 的项单独移到一侧。
        why: 固定 $a$ 时，切线条数就是水平线 $y=a$ 与 $T(x)=\frac{x}{1+\ln x}$ 的交点数。
      source_ref: page_0087
    - step_id: step_3
      statement: 分析 $T(x)$ 的单调性和边界。
      formula_trace:
        from: |
          $T(x)=\frac{x}{1+\ln x}$
        to: |
          $T'(x)=\frac{\ln x}{(1+\ln x)^2}$
        operation: 对 $T(x)$ 求导。
        why: 导数符号由 $\ln x$ 决定，且 $x=1/e$ 是竖直间断边界，$x=1$ 是最小交汇边界。
      source_ref: page_0087
    - step_id: step_4
      statement: 按 $a$ 的位置统计切点个数。
      formula_trace:
        from: |
          $T:(0,1/e)\to(-\infty,0),\quad
          T:(1/e,1]\to[1,+\infty),\quad
          T:[1,+\infty)\to[1,+\infty)$
        to: |
          $a<0$ 一条；$0<a<1$ 零条；$a=1$ 一条；$a>1$ 两条
        operation: 把水平线 $y=a$ 与三段图像的交点数逐段统计。
        why: 只有 $a>1$ 时，$x_0$ 在 $(1/e,1)$ 和 $(1,+\infty)$ 各给一个切点。
      source_ref: page_0087
teaching_card:
  student_title: 把过 x 轴点的切线数化成 a 的水平线
  what_it_trains: 训练学生把从 $A(a,0)$ 引切线的问题转成切点参数函数 $T(x)=\frac{x}{1+\ln x}$ 的解数，并用分区图像判断什么时候有两条。
  recognition_cues:
    - 外点在 $x$ 轴上，横坐标是待求参数 $a$。
    - $y=x\ln x$ 的导数是 $\ln x+1$，会出现 $1+\ln x_0$ 的分母。
    - 选项都是 $a$ 的区间，说明关键是统计切点个数随 $a$ 的变化。
  normalization_moves:
    - 设切点 $x_0>0$，代入 $A(a,0)$。
    - 整理出 $a=T(x_0)$，把 $a$ 看成水平线高度。
    - 用 $1/e$ 和 1 把 $T$ 分成负值支、正值下降支、正值上升支。
  common_failures:
    - 只看源图直接选 $a>1$，但说不出 $a=1$ 为什么只有一条。
    - 整理切线条件时把 $a$ 和 $x_0$ 混同。
    - 漏掉 $x_0=1/e$ 附近的竖直分界，导致误选 $(1/e,+\infty)$。
    - 把“有且仅有两条”误判成“至少一条”。
  similar_practice_query: xlnx 过点 A(a,0) 两条切线 切点参数 a=x/(1+lnx)
