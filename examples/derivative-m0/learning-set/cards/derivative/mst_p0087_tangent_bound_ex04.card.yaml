stem: |-
  （2023 山西晋中名校高二月考 T7）已知过点 $A(a,0)$ 作曲线 $y=x\ln x$ 的切线有且仅有两条，则实数 $a$ 的取值范围为（  ）
  A. $(0,+\infty)$
  B. $(1,+\infty)$
  C. $(\frac1e,+\infty)$
  D. $(e,+\infty)$
answer: |-
  B

  设切点为 $(x_0,x_0\ln x_0)$，其中 $x_0>0$。因为 $(x\ln x)'=\ln x+1$，过 $A(a,0)$ 的切线条件为 $-x_0\ln x_0=(\ln x_0+1)(a-x_0)$，整理得 $a=\frac{x_0}{1+\ln x_0}$。记 $T(x)=\frac{x}{1+\ln x}$。在 $(0,\frac1e)$ 上 $T(x)<0$， 对每个 $a<0$ 只有一个切点；在 $(\frac1e,1)$ 上 $T$ 从 $+\infty$ 降到 1，在 $(1,+\infty)$ 上 $T$ 从 1 增到 $+\infty$。因此 $0<a<1$ 无切线，$a=1$ 只有一条切线， $a>1$ 有两条切线。故选 B。
