stem: |-
  (江苏省扬州中学 2023 届高三下学期高考前保温练 T8) 已知正方形 $ABCD$ 的中心在坐标原点，
  四个顶点都在函数 $f(x)=x^3+bx$ 的图象上。若正方形 $ABCD$ 唯一确定，则实数 $b$ 的值为 (    )
  A. $-\sqrt{2}$
  B. $-2$
  C. $-2\sqrt{2}$
  D. $-4$
answer: |-
  C. $-2\sqrt{2}$

  法一从正方形中心在原点出发，令两条对角线分别为
  $y=kx(k>0)$ 与 $y=-\frac1k x$。当 $b\ge0$ 时，曲线单调递增，
  与负斜率对角线只有原点交点，不合题意。当 $b<0$ 时，联立两条对角线与
  $y=x^3+bx$，得到 $x_1^2=k-b$、$x_2^2=-\frac1k-b$。由
  $OA=OB$ 整理为
  $\left(k-\frac1k\right)^2-b\left(k-\frac1k\right)+2=0$。
  设 $t=k-\frac1k$，它在 $(0,+\infty)$ 上单调递增且值域为 $\mathbb R$，
  所以正方形唯一对应二次方程 $t^2-bt+2=0$ 有重根，即
  $b^2-8=0$；又 $b<0$，故 $b=-2\sqrt2$，选 C。
  法二用 $A(r\cos\theta,r\sin\theta)$、$B(-r\sin\theta,r\cos\theta)$
  得到 $b=-(\frac{2}{\tan2\theta}+\tan2\theta)\le-2\sqrt2$，唯一性也在等号处取得。
rubric:
  max_score: 7
  criteria:
    - step_id: step_1
      description: 把中心在原点的正方形转化为两条过原点且互相垂直的对角线。
      max_score: 1
    - step_id: step_2
      description: 先排除 $b\ge0$，因为此时无法在负斜率对角线上得到所需的非零顶点。
      max_score: 1
    - step_id: step_3
      description: 在 $b<0$ 时分别联立两条对角线与曲线，写出两个顶点横坐标的平方。
      max_score: 1
    - step_id: step_4
      description: 用 $OA=OB$ 把几何等距条件转成一个关于 $k$ 的方程。
      max_score: 1
    - step_id: step_5
      description: 引入 $t=k-\frac1k$，把唯一正方形问题化为二次方程根数问题。
      max_score: 1
    - step_id: step_6
      description: 唯一确定要求二次方程有重根，再结合 $b<0$ 选出答案。
      max_score: 1
    - step_id: step_7
      description: 源页法二用角度参数给出同一临界值，作为另一条验证路径。
      max_score: 1
