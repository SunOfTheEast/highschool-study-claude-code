  structure:
    primary: 对称结构
    secondary:
      - 三次/高次函数结构
    evidence:
      - $f(x)=x^3+bx$ 为奇函数，正方形中心在原点，顶点自然成中心对称对。
      - 两条互相垂直的对角线把四点共曲线问题化为 $t=k-\frac1k$ 的二次方程。
    normalization_moves_used:
      - 用对角线斜率 $k>0$ 表示正方形的旋转自由度。
      - 用非零交点方程去掉中心点，只保留顶点。
      - 用 $t=k-\frac1k$ 把含 $k$ 与 $\frac1k$ 的式子统一成单变量二次方程。
      - 用判别式为零表达“唯一确定”。
  fallback:
    only_if_trace_shows:
      - 若学生不会把正方形中心条件转成两条过原点且斜率互为负倒数的直线，回补几何关系基础中的对角线垂直平分与斜率关系。
      - 若学生把“唯一确定”只理解为选一个选项，回补方程根分布与韦达，用 $t(k)=k-\frac1k$ 的单调性说明二次方程根数如何对应正方形个数。
      - 若学生在联立曲线和直线时保留了原点作为顶点，回补函数性质与图像中“中心点不是正方形顶点”的交点筛选。
  detail_terms:
    - 奇函数中心对称
    - 正方形对角线
    - 斜率互为负倒数
    - $t=k-\frac1k$
    - 判别式为零
