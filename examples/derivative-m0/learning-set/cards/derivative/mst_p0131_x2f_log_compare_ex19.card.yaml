stem: |-
  （2025·浙江杭州·模拟预测）定义在 $(0,+\infty)$ 上的可导函数 $f(x)$，满足 $f^{\prime}(x)+\frac{2f(x)}{x}=\frac{\ln x}{x^2}$，且 $f(e)=\frac{1}{2e}$，若 $a=f(3),\ b=f(2),\ c=f(e)$，则 $a,b,c$ 的大小关系是（  ）
  A. $a>b>c$
  B. $a>c>b$
  C. $b>c>a$
  D. $c>b>a$
answer: |
  C

  由题设
  \[
  f^{\prime}(x)+\frac{2f(x)}{x}=\frac{\ln x}{x^2}
  \]
  得
  \[
  x^2f^{\prime}(x)+2xf(x)=\ln x.
  \]
  令
  \[
  g(x)=x^2f(x),
  \]
  则
  \[
  g^{\prime}(x)=x^2f^{\prime}(x)+2xf(x)=\ln x.
  \]
  又
  \[
  f^{\prime}(x)=\frac{xg^{\prime}(x)-2g(x)}{x^3}
  =\frac{x\ln x-2g(x)}{x^3}.
  \]
  再令
  \[
  h(x)=x\ln x-2g(x),
  \]
  则
  \[
  h^{\prime}(x)=1+\ln x-2g^{\prime}(x)=1-\ln x.
  \]
  所以 $h$ 在 $(0,e)$ 递增，在 $(e,+\infty)$ 递减，故 $h(x)\le h(e)$。
  由 $f(e)=\frac{1}{2e}$ 得
  \[
  h(e)=e-2g(e)=e-2e^2f(e)=0.
  \]
  因而 $h(x)\le0$，即
  \[
  f^{\prime}(x)=\frac{h(x)}{x^3}\le0\quad (x>0),
  \]
  所以 $f$ 在 $(0,+\infty)$ 上递减。又 $2<e<3$，故
  \[
  f(2)>f(e)>f(3),
  \]
  即 $b>c>a$，选 C。
