solution:
  source_solution_summary: |
    由题设
    \[
    f^{\prime}(x)+\frac{2f(x)}{x}=\frac{\ln x}{x^2}
    \]
    得
    \[
    x^2f^{\prime}(x)+2xf(x)=\ln x.
    \]
    令
    \[
    g(x)=x^2f(x),
    \]
    则
    \[
    g^{\prime}(x)=x^2f^{\prime}(x)+2xf(x)=\ln x.
    \]
    又
    \[
    f^{\prime}(x)=\frac{xg^{\prime}(x)-2g(x)}{x^3}
    =\frac{x\ln x-2g(x)}{x^3}.
    \]
    再令
    \[
    h(x)=x\ln x-2g(x),
    \]
    则
    \[
    h^{\prime}(x)=1+\ln x-2g^{\prime}(x)=1-\ln x.
    \]
    所以 $h$ 在 $(0,e)$ 递增，在 $(e,+\infty)$ 递减，故 $h(x)\le h(e)$。
    由 $f(e)=\frac{1}{2e}$ 得
    \[
    h(e)=e-2g(e)=e-2e^2f(e)=0.
    \]
    因而 $h(x)\le0$，即
    \[
    f^{\prime}(x)=\frac{h(x)}{x^3}\le0\quad (x>0),
    \]
    所以 $f$ 在 $(0,+\infty)$ 上递减。又 $2<e<3$，故
    \[
    f(2)>f(e)>f(3),
    \]
    即 $b>c>a$，选 C。
  key_steps:
    - step_id: step_1
      statement: 先用 $x^2$ 乘方程，构造幂乘函数 g。
      formula_trace:
        from: $f^{\prime}(x)+\frac{2f(x)}{x}=\frac{\ln x}{x^2}$
        to: $g^{\prime}(x)=\ln x$（$g=x^2f$）
        operation: 同乘 $x^2$ 后识别积的导数。
        why: 把含 $f^{\prime},f$ 的线性组合简化为单一导数。
      source_ref: page_0131
    - step_id: step_2
      statement: 把 f^{\prime} 写成辅助函数 h 的符号问题。
      formula_trace:
        from: $f^{\prime}(x)=\frac{x\ln x-2g(x)}{x^3}$
        to: $f^{\prime}(x)=\frac{h(x)}{x^3}$（$h=x\ln x-2g$）
        operation: 定义 $h$ 作为分子。
        why: 只需判断 h 的正负即可判断 f 单调。
      source_ref: page_0131
    - step_id: step_3
      statement: 用 h^{\prime}(x)=1-\ln x 锁定 h 的全局上界。
      formula_trace:
        from: $h^{\prime}(x)=1-\ln x$，$f(e)=\frac{1}{2e}$
        to: $h(x)\le h(e)=0$
        operation: 判 h 在 e 处取最大并代入条件算 h(e)。
        why: 得到 $f^{\prime}(x)\le0$ 的关键。
      source_ref: page_0131
    - step_id: step_4
      statement: 由 f 递减和 2<e<3 还原 a,b,c 排序。
      formula_trace:
        from: $f^{\prime}(x)\le0$，$2<e<3$
        to: $f(2)>f(e)>f(3)$
        operation: 应用单调递减函数的自变量顺序。
        why: 换元即得 $b>c>a$。
      source_ref: page_0131
teaching_card:
  student_title: 两次构造锁定单调，再比较 2、e、3 三点
  what_it_trains: 训练线性微分关系下的分层构造思路：先消去组合项，再用辅助函数判导数符号。
  recognition_cues:
    - 题设是 $f^{\prime}(x)+\frac{2f(x)}{x}$ 这类“导数+函数”线性组合。
    - 给了特定点值 $f(e)$，常用于确定辅助函数常数或极值高度。
    - 最终只比较三个函数值，核心是先拿到单调性。
  normalization_moves:
    - 构造 $g=x^2f$，把方程变成 $g^{\prime}=\ln x$。
    - 再构造 $h=x\ln x-2g$，改判 $h$ 的正负。
    - 由 $h(e)=0$ 与极值性推出 $f^{\prime}\le0$。
    - 用 $2<e<3$ 还原排序。
  common_failures:
    - 把 $g^{\prime}(x)$ 误写成 $x^2f^{\prime}(x)$，漏掉 $2xf(x)$。
    - 求 $h^{\prime}(x)$ 时漏写 $-2g^{\prime}(x)$。
    - 由 $h(x)\le0$ 推 $f^{\prime}(x)\ge0$ 方向写反。
    - 混淆 $a,b,c$ 与 $f(3),f(2),f(e)$ 的对应关系。
  similar_practice_query: x^2f 构造 h(x)=xlnx-2g 判 f^{\prime}(x)<=0 比较 f(2) f(e) f(3)
