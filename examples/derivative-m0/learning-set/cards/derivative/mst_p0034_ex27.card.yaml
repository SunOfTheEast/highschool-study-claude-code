original_problem:
  stem: 设 $a>0,b>0$，且满足 $\frac{\ln b}{a-1}=\frac{a+1}{a}$，则下列判断正确的是 ( )
  parts: *a1
  choices:
    - label: A
      text_raw: $a^2>b$
