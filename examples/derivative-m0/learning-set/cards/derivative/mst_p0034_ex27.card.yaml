    - label: C
      text_raw: $\log_a b<2$
      text_latex: $\log_a b<2$
    - label: D
      text_raw: $\log_a b>2$
      text_latex: $\log_a b>2$
  answer: D
  fidelity_notes:
    - 已核对 page_0034 原图，条件分母为 $a-1$，选项 C、D 均为以 $a$ 为底的对数。
    - 题设写 $a>0$ 但表达式要求 $a\ne1$；源解正是分 $0<a<1$ 与 $1<a$ 两种情况。
solution:
  source_solution_summary: |
    由 $\frac{\ln b}{a-1}=\frac{a+1}{a}$ 得 $\ln b=\frac{a^2-1}{a}=a-\frac1a$，所以 $\ln b-\ln a^2=a-\frac1a-2\ln a$。令 $f(x)=x-\frac1x-2\ln x$，则 $f'(x)=\frac{(x-1)^2}{x^2}\ge0$，$f$ 在 $(0,+\infty)$ 上递增且 $f(1)=0$。当 $0<a<1$ 时，$\ln b-\ln a^2<0$，故 $b<a^2$，但因 $\ln a<0$，得到 $\log_a b>2$；当 $a>1$ 时，$\ln b-\ln a^2>0$，故 $b>a^2$，且因 $\ln a>0$，仍有 $\log_a b>2$。因此只有 D 一定正确。
  key_steps:
    - step_id: step_1
      statement: 先把题设等式整理成 $\ln b-\ln a^2$。
      formula_trace:
        from: |
          $\frac{\ln b}{a-1}=\frac{a+1}{a}$
        to: |
          $\ln b=\frac{(a-1)(a+1)}a=\frac{a^2-1}a=a-\frac1a$
        operation: 因 $a\ne1$，两边同乘 $a-1$，再展开分子。
        why: 要与 $2\ln a=\ln a^2$ 比较，从而判断 $b$ 与 $a^2$ 以及 $\log_a b$ 与 2。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:41
    - step_id: step_2
      statement: 构造对数飘带型函数。
      formula_trace:
        from: |
          $\ln b-\ln a^2=a-\frac1a-2\ln a$
        to: |
          $\ln b-\ln a^2=f(a),\quad f(x)=x-\frac1x-2\ln x$
        operation: 把 $a$ 看作函数输入 $x$，将右侧统一成 $f(a)$。
        why: 源页开头已经提示 $x-\frac1x-2\ln x$ 是常用递增结构。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:41
    - step_id: step_3
      statement: 判断 $f(a)$ 的符号。
      formula_trace:
        from: |
          $f(x)=x-\frac1x-2\ln x$
        to: |
          $f'(x)=1+\frac1{x^2}-\frac2x=\frac{(x-1)^2}{x^2}\ge0,\quad f(1)=0$
        operation: 求导并配成平方，得到 $f$ 在 $(0,+\infty)$ 上递增。
        why: 因此 $0<a<1$ 时 $f(a)<0$，$a>1$ 时 $f(a)>0$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:41
    - step_id: step_4
      statement: 分类判断 $b$ 与 $a^2$。
      formula_trace:
        from: |
          $\ln b-\ln a^2=f(a)$
        to: |
          $0<a<1\Rightarrow b<a^2;\quad a>1\Rightarrow b>a^2$
        operation: 利用自然对数的递增性，把 $\ln b-\ln a^2$ 的符号转成 $b/a^2$ 与 1 的比较。
        why: A、B 会随 $a$ 在 1 的两侧改变，所以都不是一定正确。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:41
    - step_id: step_5
      statement: 判断 $\log_a b$ 与 2，注意底数小于 1 时不等号反向。
      formula_trace:
        from: |
          $\ln b-\ln a^2=\ln b-2\ln a$
        to: |
          $0<a<1:\ \ln b<2\ln a,\ \ln a<0\Rightarrow \frac{\ln b}{\ln a}>2;\quad a>1:\ \ln b>2\ln a,\ \ln a>0\Rightarrow \frac{\ln b}{\ln a}>2$
        operation: 分别按 $\ln a$ 的正负同除，并在 $0<a<1$ 时改变不等号方向。
        why: 两种情况都得到 $\log_a b>2$，故 D 一定正确，C 错误。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:41
teaching_card:
  student_title: 用 $x-1/x-2\ln x$ 判断对数比值
  what_it_trains: 条件里同时有 $\ln b$ 和 $a\pm1$ 时，先把 $\ln b$ 解出来，再主动减去 $2\ln a$；这样 $b$ 与 $a^2$、$\log_a b$ 与 2 都由同一个函数 $x-1/x-2\ln x$ 的符号决定。
  recognition_cues:
    - 题干给出 $\ln b/(a-1)=(a+1)/a$，乘开后会出现 $(a^2-1)/a$。
    - 选项同时比较 $a^2$ 与 $b$、$\log_a b$ 与 2，暗示看 $\ln b-2\ln a$。
    - $a$ 可能在 1 的两侧，底数为 $a$ 的对数需要分情况。
  normalization_moves:
    - 先由题设得到 $\ln b=a-1/a$。
    - 再减 $2\ln a$，凑成 $f(a)=a-1/a-2\ln a$。
    - 用 $f'(x)=((x-1)^2)/(x^2)$ 和 $f(1)=0$ 判断 $f(a)$ 的正负。
    - 判断 $\log_a b$ 时先看 $\ln a$ 的正负，再决定是否翻转不等号。
  common_failures:
    - 忽略 $a=1$ 处分母不存在。
    - 只由 $b<a^2$ 推断 $\log_a b<2$，忘记 $0<a<1$ 时对数函数递减。
    - 把 A 或 B 当作一定正确，没有注意 $a$ 可以在 1 的两侧。
    - 求导时把 $-1/x$ 的导数写成 $-1/x^2$。
  similar_practice_query: 对数飘带 x-1/x-2lnx log_a b 比较 a^2 b
