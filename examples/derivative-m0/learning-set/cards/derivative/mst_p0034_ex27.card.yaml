stem: |-
  设 $a>0,b>0$，且满足 $\frac{\ln b}{a-1}=\frac{a+1}{a}$，则下列判断正确的是 ( )
  A. $a^2>b$
  B. $a^2<b$
  C. $\log_a b<2$
  D. $\log_a b>2$
answer: |
  D

  由 $\frac{\ln b}{a-1}=\frac{a+1}{a}$ 得 $\ln b=\frac{a^2-1}{a}=a-\frac1a$，所以 $\ln b-\ln a^2=a-\frac1a-2\ln a$。令 $f(x)=x-\frac1x-2\ln x$，则 $f'(x)=\frac{(x-1)^2}{x^2}\ge0$，$f$ 在 $(0,+\infty)$ 上递增且 $f(1)=0$。当 $0<a<1$ 时，$\ln b-\ln a^2<0$，故 $b<a^2$，但因 $\ln a<0$，得到 $\log_a b>2$；当 $a>1$ 时，$\ln b-\ln a^2>0$，故 $b>a^2$，且因 $\ln a>0$，仍有 $\log_a b>2$。因此只有 D 一定正确。
