stem: |-
  （2023 · 昆明高二期末 T8）已知关于 $x$ 的不等式 $(a+1)x\geqslant\ln x+b$ 恒成立，则 $ae^{b-1}$ 的最小值为（  ）
  A. $-1$
  B. $-\frac{1}{2}$
  C. $-\frac{1}{4}$
  D. $-\frac{1}{8}$
answer: |-
  C

  由题意在 $x>0$ 上有 $(a+1)x\geqslant\ln x+b$。利用 $\ln((a+1)x)\leqslant(a+1)x-1$，化成 $\ln x\leqslant(a+1)x-1-\ln(a+1)$。与题设比较得 $-\ln(a+1)-1\leqslant-b$，即 $e^{b-1}\leqslant a+1$，并知 $a+1>0$。分情形：若 $a\geqslant0$，则 $ae^{b-1}\geqslant0$；若 $-1<a<0$，因乘负数不等号反向， 有 $ae^{b-1}\geqslant a(a+1)$，且该下界在 $e^{b-1}=a+1$ 可达。于是只需最小化 $a(a+1)=\left(a+\frac12\right)^2-\frac14$，得全局最小值 $-\frac14$，故选 C。
