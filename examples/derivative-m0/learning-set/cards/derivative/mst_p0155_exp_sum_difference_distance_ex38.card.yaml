solution:
  source_solution_summary: |
    由定义可得
    \[
    2^b+3^b=5^a,\qquad 3^c=5^b-2^b.
    \]
    先比较相对位置。源解用
    \[
    2^2+3^2<5^2,\qquad 3^2<5^2-2^2
    \]
    得出
    \[
    c\ge b\ge a>1.
    \]
    因而在数轴上
    \[
    |a-c|\ge|b-c|.
    \]
    再把两式相减消去 $2^b$：
    \[
    5^a-5^b=3^b-3^c.
    \]
    该式表示“底数更大的指数函数 $5^x$ 与底数较小的指数函数 $3^x$ 在两侧产生等高差分”。由于 $5^x$ 增长更快，要产生同样的函数值差，所需横向间隔更短，故
    \[
    |a-b|\le|b-c|.
    \]
    与上式合并可得
    \[
    |a-c|\ge|b-c|,\quad |a-b|\le|b-c|,
    \]
    选 B。
    源法二在 page_0156 顶部以“交点越高开口越小，交点越低开口越大”的三图直观结论再次验证同一结果。
  key_steps:
    - step_id: step_1
      statement: 由题设对指数和、指数差的比较先确定 $a,b,c$ 大致顺序。
      formula_trace:
        from: $2^b+3^b=5^a,\ 3^c=5^b-2^b$
        to: $c\ge b\ge a>1$
        operation: 利用源解给出的 $x=2$ 基准比较并结合单调性。
        why: 先固定三点在数轴上的左右位置。
      source_ref: page_0155_ex38_solution_start
    - step_id: step_2
      statement: 先得到第一条绝对值关系。
      formula_trace:
        from: $c\ge b\ge a$
        to: $|a-c|\ge|b-c|$
        operation: 同一端点 $c$ 下比较两段距离。
        why: 直接锁定四个选项中的第一半真假。
      source_ref: page_0155_ex38_solution_start
    - step_id: step_3
      statement: 相减消元，把第二条关系转成“等差分”比较。
      formula_trace:
        from: $2^b+3^b=5^a,\ 3^c=5^b-2^b$
        to: $5^a-5^b=3^b-3^c$
        operation: 两式同减 $2^b$。
        why: 把问题转成两类指数函数在不同区间的差分长度比较。
      source_ref: page_0155_ex38_solution_start
    - step_id: step_4
      statement: 用增长率与开口差距判断第二条绝对值关系。
      formula_trace:
        from: $5^a-5^b=3^b-3^c$，且 $5^x$ 比 $3^x$ 增长更快
        to: $|a-b|\le|b-c|$
        operation: 同差分下“快函数区间更短、慢函数区间更长”。
        why: 完成选项第二半判定。
      source_ref: page_0156_ex38_solution_cont
    - step_id: step_5
      statement: 合并两条结论并对应选项。
      formula_trace:
        from: $|a-c|\ge|b-c|$ 且 $|a-b|\le|b-c|$
        to: 选 B
        operation: 与 A-D 逐项匹配。
        why: 得到唯一正确项。
      source_ref: page_0156_ex38_solution_cont
teaching_card:
  student_title: 指数和差同差分下的距离比较
  what_it_trains: 训练把混合对数定义统一成指数方程后，通过消元与增长率差异比较三段数轴距离。
  recognition_cues:
    - 未知量出现在 $\log$ 的真数与底数对应的指数位置。
    - 选项直接比较绝对值距离。
    - 题内给了多幅指数函数对比图。
  normalization_moves:
    - 先还原为 $2^b+3^b=5^a,\ 3^c=5^b-2^b$。
    - 先定顺序，再相减消元。
    - 把函数差分比较转成横向距离比较。
  common_failures:
    - 只用 $c\ge b\ge a$ 就草率判定两条绝对值关系都同向。
    - 相减后得到等式但不会解释成“同差分下区间长短”。
    - 忽略 page_0156 顶部续句，漏掉法二最终结论。
  similar_practice_query: log_5(2^b+3^b) log_3(5^b-2^b) 绝对值距离 指数差分
