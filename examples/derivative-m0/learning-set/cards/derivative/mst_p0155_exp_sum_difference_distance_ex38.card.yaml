stem: |-
  （2023·四省联考）已知 $a,b,c$ 满足 $a=\log_5(2^b+3^b)$，$c=\log_3(5^b-2^b)$，则（  ）
  A. $|a-c|\ge|b-c|,\ |a-b|\ge|b-c|$
  B. $|a-c|\ge|b-c|,\ |a-b|\le|b-c|$
  C. $|a-c|\le|b-c|,\ |a-b|\ge|b-c|$
  D. $|a-c|\le|b-c|,\ |a-b|\le|b-c|$
answer: |
  B

  由定义可得
  \[
  2^b+3^b=5^a,\qquad 3^c=5^b-2^b.
  \]
  先比较相对位置。源解用
  \[
  2^2+3^2<5^2,\qquad 3^2<5^2-2^2
  \]
  得出
  \[
  c\ge b\ge a>1.
  \]
  因而在数轴上
  \[
  |a-c|\ge|b-c|.
  \]
  再把两式相减消去 $2^b$：
  \[
  5^a-5^b=3^b-3^c.
  \]
  该式表示“底数更大的指数函数 $5^x$ 与底数较小的指数函数 $3^x$ 在两侧产生等高差分”。由于 $5^x$ 增长更快，要产生同样的函数值差，所需横向间隔更短，故
  \[
  |a-b|\le|b-c|.
  \]
  与上式合并可得
  \[
  |a-c|\ge|b-c|,\quad |a-b|\le|b-c|,
  \]
  选 B。
  源法二在 page_0156 顶部以“交点越高开口越小，交点越低开口越大”的三图直观结论再次验证同一结果。
