stem: |-
  （2024 · 贵阳模拟 T21）已知函数 $f(x)=e^{x-1}-\ln(x+a)+1$。
  1. 设 $x=1$ 是 $f(x)$ 的极值点，求 $a$，并求 $f(x)$ 的单调区间。
  2. 当 $a\leqslant3$ 时，证明 $f(x)>-1$。
answer: |-
  （1）$a=0$，$f(x)$ 在 $(0,1)$ 上单调递减，在 $(1,+\infty)$ 上单调递增；（2）证明见解析。

  第一问求导 $f^{\prime}(x)=e^{x-1}-\frac1{x+a}$。因 $x=1$ 是极值点，$f^{\prime}(1)=0$，即 $1-\frac1{1+a}=0$，所以 $a=0$。此时 $f(x)=e^{x-1}-\ln x+1$，定义域 $(0,+\infty)$， 且 $f^{\prime}(x)=e^{x-1}-\frac1x$ 在 $(0,+\infty)$ 上单调递增， $f^{\prime}(1)=0$，故 $(0,1)$ 递减、$(1,+\infty)$ 递增。 第二问当 $a\leqslant3$ 且 $x>-a$ 时，有 $0<x+a\leqslant x+3$，因此只需证明 $e^{x-1}\geqslant\ln\frac{x+3}{e^2}$。source 用分而治之将左侧 与 $e^{x+3}/(x+3)$ 的最小值、右侧与 $\ln((x+3)/e^2)/((x+3)/e^2)$ 的最大值比较；左边取等点 $x=-2$，右边取等点 $x=e^3-3$，取等不一致，所以得到严格不等式 $f(x)>-1$。
