stem: |-
  （2024 · 河南漯河高级中学考前模拟 T7）已知函数 $f(x)=e^x-\frac{1}{2(a+1)}x^2-bx$（$a,b\in\mathbf{R}$）没有极值点，则 $\frac{b}{a+1}$ 的最大值为（  ）
  A. $\frac{\sqrt e}{2}$
  B. $\frac e2$
  C. $e$
  D. $\frac{e^2}{2}$
answer: |-
  B

  由题意“没有极值点”，source 直接写成 $f^{\prime}(x)=e^x-\frac{1}{a+1}x-b=0$ 无解，并取 $f^{\prime}(x)\geqslant0$ 恒成立，即 $e^x\geqslant\frac{1}{a+1}x+b$。对 $x>0$ 用 基本不等式： $\frac{1}{a+1}x+b\geqslant2\sqrt{\frac{b}{a+1}x}$， 得 $\frac{e^{2x}}{4x}\geqslant\frac{b}{a+1}$。再用 $\frac{e^{2x}}{4x}\geqslant\frac e2$（最小值在 $x=\frac12$ 取到）， 得 $\frac{b}{a+1}\leqslant\frac e2$。当 $x=\frac12,\ \frac{1}{a+1}=\sqrt e,\ b=\frac{\sqrt e}{2}$ 时取等， 所以最大值是 $\frac e2$，选 B。
