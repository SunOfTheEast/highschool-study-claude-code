solution:
  source_solution_summary: 由题意“没有极值点”，source 直接写成 $f^{\prime}(x)=e^x-\frac{1}{a+1}x-b=0$ 无解，并取 $f^{\prime}(x)\geqslant0$ 恒成立，即 $e^x\geqslant\frac{1}{a+1}x+b$。对 $x>0$ 用 基本不等式： $\frac{1}{a+1}x+b\geqslant2\sqrt{\frac{b}{a+1}x}$， 得 $\frac{e^{2x}}{4x}\geqslant\frac{b}{a+1}$。再用 $\frac{e^{2x}}{4x}\geqslant\frac e2$（最小值在 $x=\frac12$ 取到）， 得 $\frac{b}{a+1}\leqslant\frac e2$。当 $x=\frac12,\ \frac{1}{a+1}=\sqrt e,\ b=\frac{\sqrt e}{2}$ 时取等， 所以最大值是 $\frac e2$，选 B。
  key_steps:
    - step_id: step_1
      statement: 把“无极值点”转成导函数恒不变号约束。
      formula_trace:
        from: $f(x)=e^x-\frac{1}{2(a+1)}x^2-bx$
        to: $f^{\prime}(x)=e^x-\frac{1}{a+1}x-b$，并取 $f^{\prime}(x)\geqslant0$
        operation: 求导并按 source 路线改写为恒成立不等式。
        why: 目标比值 $\frac{b}{a+1}$ 要通过线性项系数联动得到上界。
      source_ref: page_0176:line 43
    - step_id: step_2
      statement: 用基本不等式把线性表达压成乘积根式。
      formula_trace:
        from: $e^x\geqslant\frac{1}{a+1}x+b$
        to: $e^x\geqslant2\sqrt{\frac{b}{a+1}x}$
        operation: 对 $\frac{1}{a+1}x$ 与 $b$ 施加 $u+v\geqslant2\sqrt{uv}$。
        why: 可把两个参数合并成单个目标量 $\frac{b}{a+1}$。
      source_ref: page_0176:line 43
    - step_id: step_3
      statement: 转成单变量上界模板。
      formula_trace:
        from: $e^x\geqslant2\sqrt{\frac{b}{a+1}x}$
        to: $\frac{e^{2x}}{4x}\geqslant\frac{b}{a+1}$
        operation: 两边平方并除以 $4x$（$x>0$）。
        why: 左侧成为可直接求最小值的函数。
      source_ref: page_0176:line 43
    - step_id: step_4
      statement: 取最值得到最大比值与选项。
      formula_trace:
        from: $\frac{e^{2x}}{4x}\geqslant\frac e2$
        to: $\frac{b}{a+1}\leqslant\frac e2$（取等时选 B）
        operation: 利用 $x=\frac12$ 处取到下界并回代参数。
        why: 题目要的是 $\frac{b}{a+1}$ 的最大值与可达性。
      source_ref: page_0176:line 43
teaching_card:
  student_title: “无极值点”题先看导函数恒成立
  what_it_trains: 训练把“无极值点”快速转成导函数压界，再用基本不等式一次性合并参数比值。
  recognition_cues:
    - 原函数是“指数项 - 二次项 - 一次项”。
    - 问题问的是参数比值最大值。
    - source 会把导函数写成“指数函数 vs 一次函数”的恒成立模型。
  normalization_moves:
    - 先求 $f^{\prime}(x)$ 并写成恒成立不等式。
    - 用 $u+v\geqslant2\sqrt{uv}$ 聚焦到 $\frac{b}{a+1}$。
    - 再由 $\frac{e^{2x}}{4x}$ 的最小值给出最终上界。
  common_failures:
    - 把导函数恒成立误写成只在某个点成立。
    - 配 AM-GM 时忘记 $x>0$ 条件，导致除以 $x$ 出错。
    - 只算出上界不验取等参数。
  similar_practice_query: 无极值点 导函数恒成立 b/(a+1) 最大值 e^{2x}/x
