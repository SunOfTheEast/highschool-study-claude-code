stem: |-
  （2023 烟台期末·多选 T12）关于曲线 $f(x)=\ln x$ 和 $g(x)=\frac{a}{x}(a\neq0)$ 的公切线，下列说法正确的有（  ）
  A. 无论 $a$ 取何值，两曲线都有公切线
  B. 若两曲线恰有两条公切线，则 $a=-\frac{1}{e}$
  C. 若 $a<-1$，则两曲线只有一条公切线
  D. 若 $-\frac{1}{e^2}<a<0$，则两曲线有三条公切线
answer: |
  BCD

  当 $a>0$ 时，源页图示说明 $f(x)=\ln x$ 与 $g(x)=\frac{a}{x}$ 一个递增、一个递减，
  没有公切线，因此 A 错。下面只需看 $a<0$。这时 $g$ 的第二象限分支与
  $f$ 的第一象限部分先存在一条公切线；其余公切线由 $g$ 的第四象限分支与
  $f$ 的交点情况决定。若 $f(x)>g(x)$ 恒成立，则
  $\ln x>\frac{a}{x}$，即 $x\ln x\ge -\frac1e>a$，两曲线只有这一条公切线；
  因为 $a<-1$ 一定满足 $a<-\frac1e$，C 正确。若临界
  $x\ln x\ge -\frac1e=a$，两曲线恰有两条公切线，B 正确。若
  $f(x)=g(x)$ 有两个交点，即 $a=x\ln x$ 在负值区间有两个解，则
  $-\frac1e<a<0$，总共有三条公切线；而
  $\left(-\frac1{e^2},0\right)\subset\left(-\frac1e,0\right)$，所以 D 正确。
  故选 BCD。
