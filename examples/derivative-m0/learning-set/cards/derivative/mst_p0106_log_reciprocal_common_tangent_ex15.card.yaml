solution:
  source_solution_summary: |
    当 $a>0$ 时，源页图示说明 $f(x)=\ln x$ 与 $g(x)=\frac{a}{x}$ 一个递增、一个递减，
    没有公切线，因此 A 错。下面只需看 $a<0$。这时 $g$ 的第二象限分支与
    $f$ 的第一象限部分先存在一条公切线；其余公切线由 $g$ 的第四象限分支与
    $f$ 的交点情况决定。若 $f(x)>g(x)$ 恒成立，则
    $\ln x>\frac{a}{x}$，即 $x\ln x\ge -\frac1e>a$，两曲线只有这一条公切线；
    因为 $a<-1$ 一定满足 $a<-\frac1e$，C 正确。若临界
    $x\ln x\ge -\frac1e=a$，两曲线恰有两条公切线，B 正确。若
    $f(x)=g(x)$ 有两个交点，即 $a=x\ln x$ 在负值区间有两个解，则
    $-\frac1e<a<0$，总共有三条公切线；而
    $\left(-\frac1{e^2},0\right)\subset\left(-\frac1e,0\right)$，所以 D 正确。
    故选 BCD。
  key_steps:
    - step_id: step_1
      statement: 先用 $a>0$ 情形否定 A。
      formula_trace:
        from: |
          a>0,\qquad f(x)=\ln x,\qquad g(x)=\frac{a}{x}\quad(x>0)
        to: |
          f\text{ 递增},\quad g\text{ 递减},\quad \text{两曲线没有公切线}
        operation: 按源页左图和单调性判断图像位置。
        why: A 说“无论 $a$ 取何值”都有公切线，只要 $a>0$ 反例成立即可排除。
      source_ref: page_0106
    - step_id: step_2
      statement: 在 $a<0$ 时先固定一条跨象限公切线。
      formula_trace:
        from: |
          a<0,\qquad g(x)=\frac{a}{x}
        to: |
          f\text{ 第一象限部分与 }g\text{ 第二象限分支存在一条公切线}
        operation: 利用源页右图的跨象限位置关系。
        why: 后续只需统计 $g$ 第四象限分支与 $f$ 的交点带来的额外公切线。
      source_ref: page_0106
    - step_id: step_3
      statement: 用 $x\ln x$ 的最小值判断无交点和临界相切。
      formula_trace:
        from: |
          \ln x\ge \frac{a}{x}\quad(x>0)
        to: |
          x\ln x\ge -\frac1e,\qquad a\le -\frac1e
        operation: 两边乘以 $x>0$，再用 $x\ln x$ 的最小值 $-\frac1e$。
        why: 当 $a<-\frac1e$ 时第四象限无交点，总数只有固定的一条；当 $a=-\frac1e$ 时临界相切，总数恰为两条。
      source_ref: page_0107
    - step_id: step_4
      statement: 判断 C、B 两项。
      formula_trace:
        from: |
          a<-1<-\frac1e,\qquad a=-\frac1e
        to: |
          C\text{ 正确},\qquad B\text{ 正确}
        operation: 把选项中的具体条件与交点分类对应。
        why: $a<-1$ 落在无额外交点区间；$a=-1/e$ 是一条额外切线的临界。
      source_ref: page_0107
    - step_id: step_5
      statement: 判断两交点区间并验证 D。
      formula_trace:
        from: |
          f(x)=g(x),\qquad \ln x=\frac{a}{x}
        to: |
          a=x\ln x\text{ 有两个交点}\Longleftrightarrow -\frac1e<a<0
        operation: 用 $x\ln x$ 在 $(0,1)$ 上先降后升、最小值为 $-\frac1e$ 的图像。
        why: 两交点会带来两条额外公切线，再加固定一条，共三条；$(-1/e^2,0)$ 是该区间的子集。
      source_ref: page_0107
teaching_card:
  student_title: 把对数和反比例的公切线数交给 $x\ln x$
  what_it_trains: 训练按参数正负和象限分支统计公切线条数，再用 $x\ln x$ 的最小值判断选项真假。
  recognition_cues:
    - 题干是多选“说法正确”，要逐项对应公切线条数。
    - $g(x)=a/x$ 的分支随 $a$ 正负改变位置，先分 $a>0$、$a<0$。
    - 出现 $\ln x=\frac{a}{x}$ 时，立刻整理成 $a=x\ln x$。
  normalization_moves:
    - 用 $a>0$ 时无公切线排除 A。
    - 在 $a<0$ 时先保留一条跨象限固定公切线。
    - 用 $x\ln x$ 的最小值 $-\frac1e$ 区分无交点、临界、两交点。
    - 把 D 的 $-\frac1{e^2}<a<0$ 看作三条公切线区间的子区间。
  common_failures:
    - 忽略 $a>0$ 的反例，误选 A。
    - 把 $a<-1$ 误认为比 $-\frac1e$ 更靠近 0。
    - 只看 $f$ 与 $g$ 的交点，漏掉 $a<0$ 时先存在的一条跨象限公切线。
  similar_practice_query: lnx a/x 公切线 多选 xlnx 最小值 三条公切线
quality:
  confidence: high
  needs_review: false
  review_notes:
