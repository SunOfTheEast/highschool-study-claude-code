stem: |-
  （2023 浙江北斗星联盟五月联考 T12）已知 $a,b\in\mathbf R$， $f(x)=e^x-ax$，$g(x)=b\sqrt{x^2+1}$，则（ ）
  A. 对于任意的实数 $a$，存在 $b$，使得 $f(x)$ 与 $g(x)$ 有互相平行的切线。
  B. 对于给定的实数 $x_0$，存在 $a,b$，使得 $g(x_0)\geqslant f(x_0)$ 成立。
  C. $y=f(x)-g(x)$ 在 $[0,+\infty)$ 上的最小值为 0，则 $a+\sqrt5b$ 的最大值为 $2\sqrt e$。
  D. 存在 $a,b$，使得 $|f(x)-g(x)|\leqslant e^2+2$ 对于任意 $x\in\mathbf R$ 恒成立。
answer: |-
  ABC

  源解先把 $g(x)=b\sqrt{x^2+1}$ 看成双曲线的一支，渐近线为 $y=\pm bx$，切线斜率范围在 $(-|b|,|b|)$ 内；而 $f^{\prime}(x)=e^x-a$ 的斜率范围为 $(-a,+\infty)$，因此对任意 $a$ 可取足够大的 $|b|$ 让两者有相同斜率，A 对。给定 $x_0$ 时， 只要调大 $b$ 或配合调整 $a$，即可使 $b\sqrt{x_0^2+1}\ge e^{x_0}-ax_0$，B 对。D 因 $x\to+\infty$ 时 $e^x-ax-bx\to+\infty$，不可能被常数界住，故错。 C 中由 $F(x)=f(x)-g(x)\ge0$ 在 $[0,+\infty)$ 恒成立，代入 $x=\frac12$ 得 $a+\sqrt5b\le2\sqrt e$；取 $a=\frac34\sqrt e$、$b=\frac{\sqrt{5e}}4$ 时， $F(\frac12)=F^{\prime}(\frac12)=0$ 且 $F^{\prime\prime}(x)>0$， 上界可取，故最大值为 $2\sqrt e$。故选 ABC。
