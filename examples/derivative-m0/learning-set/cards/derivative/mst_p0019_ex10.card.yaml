stem: |-
  (湖北省十一校 2024 学年高三下学期第二次联考 T8) 若对于任意正数 $x,y$， 不等式 $x(1+\ln x)\ge x\ln y-ay$ 恒成立，则实数 $a$ 的取值范围是 ( )
  A. $\left(0,\frac1{\mathrm e}\right]$
  B. $\left[\frac1{\mathrm e^3},\frac1{\mathrm e}\right]$
  C. $\left[\frac1{\mathrm e^2},+\infty\right)$
  D. $\left[\frac1{\mathrm e^3},+\infty\right)$
answer: |-
  C. $\left[\frac1{\mathrm e^2},+\infty\right)$

  因 $y>0$，将原不等式移项并除以 y，得到 $a\ge \frac{x\ln y-x(1+\ln x)}{y}=\frac{x}{y}\ln\frac{y}{x}-\frac{x}{y}$。 令 $t=y/x>0$，右端为 $\frac{\ln t-1}{t}$。再写成 $\frac1e\frac{\ln(t/e)}{t/e}$，由 $\ln u/u$ 的最大值 $1/e$ 得右端最大值 $1/e^2$。恒成立要求 $a\ge1/e^2$，选 C。
