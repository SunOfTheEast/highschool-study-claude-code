  method:
    primary: 参变量分离
    secondary:
      - 同构变形与换元法
      - 自由度与主元
    subroute:
      - y/x 比值换元
      - ln(t/e)/(t/e) 最大值
  structure:
    primary: 多变量与不等式结构
    secondary:
      - 同构结构
      - 指对复合结构
    evidence:
      - 原双变量表达式经移项后只含比值 $t=y/x$。
      - $(\ln t-1)/t$ 同构为 $\frac1e\ln(t/e)/(t/e)$。
    normalization_moves_used:
      - 正变量除法：因 $y>0$ 可同向除以 y。
      - 尺度降元：令 $t=y/x$。
      - 对数合并：$\ln y-\ln x=\ln(y/x)$。
      - 平移同构：$\ln t-1=\ln(t/e)$。
  fallback:
    only_if_trace_shows:
      - 若学生移项除以 y 时不确认 $y>0$，回补函数三要素与定义域。
      - 若学生不会把 $\ln y-\ln x$ 合成 $\ln(y/x)$，回补指数对数基础。
      - 若学生看不出表达式只依赖 $y/x$，回补代数恒等变形。
      - 若学生不知道恒成立要压住右端最大值，回补不等式工具基础。
      - 若学生不会求 $\ln u/u$ 的最大值，回补导数单调极值基础。
  detail_terms:
    - for all positive x,y
    - parameter range
    - t=y/x
    - (ln t-1)/t
    - ln(t/e)/(t/e)
