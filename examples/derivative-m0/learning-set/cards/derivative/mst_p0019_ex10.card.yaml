original_problem:
  stem: (湖北省十一校 2024 学年高三下学期第二次联考 T8) 若对于任意正数 $x,y$， 不等式 $x(1+\ln x)\ge x\ln y-ay$ 恒成立，则实数 $a$ 的取值范围是 ( )
  parts: *a1
  choices:
    - label: A
      text: $\left(0,\frac1{\mathrm e}\right]$
    - label: B
      text: $\left[\frac1{\mathrm e^3},\frac1{\mathrm e}\right]$
    - label: C
      text: $\left[\frac1{\mathrm e^2},+\infty\right)$
    - label: D
      text: $\left[\frac1{\mathrm e^3},+\infty\right)$
  answer: C. $\left[\frac1{\mathrm e^2},+\infty\right)$
  fidelity_notes:
    - 题头、题干和完整解析均在 page_0019。
    - 源图与 markdown 对选项 B、C、D 中 e 的指数一致。
solution:
  source_solution_summary: 因 $y>0$，将原不等式移项并除以 y，得到 $a\ge \frac{x\ln y-x(1+\ln x)}{y}=\frac{x}{y}\ln\frac{y}{x}-\frac{x}{y}$。 令 $t=y/x>0$，右端为 $\frac{\ln t-1}{t}$。再写成 $\frac1e\frac{\ln(t/e)}{t/e}$，由 $\ln u/u$ 的最大值 $1/e$ 得右端最大值 $1/e^2$。恒成立要求 $a\ge1/e^2$，选 C。
  key_steps:
    - step_id: step_1
      statement: 把恒成立不等式分离出参数 a。
      formula_trace:
        from: $x(1+\ln x)\ge x\ln y-ay,\quad x>0,\ y>0$
        to: $a\ge\frac{x\ln y-x(1+\ln x)}{y}$
        operation: 把含 a 的项移到左侧，再除以正数 y。
        why: 参数范围由右端表达式对所有正 x,y 的最大值决定。
      source_ref: page_0019_solution
    - step_id: step_2
      statement: 把双变量降成比值变量。
      formula_trace:
        from: $\frac{x\ln y-x(1+\ln x)}{y}$
        to: $\frac{x}{y}\ln\frac{y}{x}-\frac{x}{y}=\frac{\ln t-1}{t},\quad t=\frac yx>0$
        operation: 把 $\ln y-\ln x$ 合成 $\ln(y/x)$，再令 $t=y/x$。
        why: 原式对尺度同时放大不敏感，只依赖 y 与 x 的比值。
      source_ref: page_0019_solution
    - step_id: step_3
      statement: 同构到 $\ln u/u$ 并取最大值。
      formula_trace:
        from: $\frac{\ln t-1}{t}$
        to: $\frac1e\cdot\frac{\ln(t/e)}{t/e}\le\frac1e\cdot\frac1e=\frac1{e^2}$
        operation: 用 $\ln t-1=\ln(t/e)$，令 $u=t/e$，套用 $\max \ln u/u=1/e$。
        why: 恒成立需要 a 不小于右端的最大可能值。
      source_ref: page_0019_solution
    - step_id: step_4
      statement: 写出闭区间答案。
      formula_trace:
        from: $a\ge\max_{t>0}\frac{\ln t-1}{t}=\frac1{e^2}$
        to: $a\in\left[\frac1{e^2},+\infty\right)$
        operation: 最大值可取到，所以端点用闭括号。
        why: 当 $t=e^2$ 时右端达到 $1/e^2$，等号允许。
      source_ref: page_0019_solution
teaching_card:
  student_title: 双变量恒成立：先看比例 $t=\frac yx$
  what_it_trains: 训练把含两个正变量的恒成立不等式分离参数，再用比值换元降成一个 $\ln u/u$ 最大值问题。
  recognition_cues:
    - 题干说“任意正数 x,y”，并且对数里同时有 $\ln x$、$\ln y$。
    - 移项后出现 $\ln y-\ln x$，提示合成 $\ln(y/x)$。
    - 选项端点含 $1/e^2$、$1/e^3$，提示要从 $\ln u/u$ 的最大值来。
  normalization_moves:
    - 先把 a 分离出来，保留“右端最大值”的意识。
    - 把 $\frac{x}{y}$ 写成 $1/t$，把 $\ln y-\ln x$ 写成 $\ln t$。
    - 把 $\ln t-1$ 改成 $\ln(t/e)$。
  common_failures:
    - 分别固定 x 或 y 讨论，错过比例换元。
    - 把恒成立的方向做反，误求右端最小值。
    - 端点写成开区间，忘记最大值在 $t=e^2$ 可以取到。
  similar_practice_query: 任意正数 x y 恒成立 参数范围 y/x 换元 ln t over t
quality:
  confidence: high
  needs_review: false
  review_notes:
