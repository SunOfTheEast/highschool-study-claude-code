solution:
  source_solution_summary: |
    先求 $f'(x)=e^x-x$、$f''(x)=e^x-1$。$f'$ 在 $(-\infty,0)$ 上递减、在 $(0,+\infty)$ 上递增，且 $f'(0)=1$，所以 $f'(x)\ge1$，$f$ 在 $\mathbb R$ 上递增且 $f(0)=0$。若 $a+b>0$，则 $a>-b$，从而 $f(a)>f(-b)$，B 正确。再算 $f(b)+f(-b)=e^b+e^{-b}-b^2-2$，令 $h(b)$ 为该式，可证 $h(b)\ge0$，所以 $f(a)+f(b)>0$，A 正确。若 $f(a)+f(b)<0$，则 $f(a)<-f(b)\le f(-b)$，由单调性得 $a<-b$，D 正确。选 $b\ne0$，令 $f(c)=-f(b)$，取 $c<a<-b$，则 $f(a)+f(b)>0$ 但 $a+b<0$，C 错误。
  key_steps:
    - step_id: step_1
      statement: 先证明 $f$ 在全体实数上递增。
      formula_trace:
        from: |
          $f(x)=e^x-\frac12x^2-1$
        to: |
          $f'(x)=e^x-x,\quad f''(x)=e^x-1$
        operation: 连续求一阶、二阶导数。
        why: 后续要把 $a>-b$ 与 $f(a)>f(-b)$ 相互连接。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:23
    - step_id: step_2
      statement: 用二阶导判断一阶导的最小值。
      formula_trace:
        from: |
          $f''(x)<0\ (x<0),\quad f''(x)>0\ (x>0)$
        to: |
          $f'(x)\ge f'(0)=1>0$
        operation: $f'$ 在 $(-\infty,0)$ 上递减、在 $(0,+\infty)$ 上递增，所以 $x=0$ 处为最小值点。
        why: 得到 $f$ 严格递增且 $f(0)=0$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:23
    - step_id: step_3
      statement: 证明 B。
      formula_trace:
        from: |
          $a+b>0$
        to: |
          $a>-b\Rightarrow f(a)>f(-b)\Rightarrow f(a)-f(-b)>0$
        operation: 移项得到输入大小，再用 $f$ 递增保序。
        why: 这正是选项 B 的结论。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:23
    - step_id: step_4
      statement: 证明对称和 $f(b)+f(-b)$ 非负。
      formula_trace:
        from: |
          $f(b)+f(-b)=e^b+e^{-b}-b^2-2$
        to: |
          $h(b)=e^b+e^{-b}-b^2-2\ge h(0)=0$
        operation: 设 $h(b)$，有 $h'(b)=e^b-e^{-b}-2b$、$h''(b)=e^b+e^{-b}-2\ge0$，故 $h'$ 以 0 为零点，$h$ 在 $(-\infty,0)$ 上递减、在 $(0,+\infty)$ 上递增。
        why: 对称点 $b,-b$ 的函数值之和非负，是证明 A、D 的关键。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:23-24
    - step_id: step_5
      statement: 证明 A。
      formula_trace:
        from: |
          $a+b>0,\quad f(b)+f(-b)\ge0$
        to: |
          $f(a)+f(b)=[f(a)-f(-b)]+[f(b)+f(-b)]>0$
        operation: 把 $f(a)+f(b)$ 拆成一项严格正和一项非负。
        why: 选项 A 的结论成立。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:24
    - step_id: step_6
      statement: 证明 D。
      formula_trace:
        from: |
          $f(a)+f(b)<0$
        to: |
          $f(a)<-f(b)\le f(-b)\Rightarrow a<-b\Rightarrow a+b<0$
        operation: 由 $f(b)+f(-b)\ge0$ 得 $-f(b)\le f(-b)$，再用 $f$ 递增反推输入。
        why: 选项 D 的逆向判断成立。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:25
    - step_id: step_7
      statement: 构造反例否定 C。
      formula_trace:
        from: |
          $f(c)=-f(b),\quad c<a<-b$
        to: |
          $f(a)>f(c)=-f(b)\Rightarrow f(a)+f(b)>0,\quad a+b<0$
        operation: 因 $f$ 严格递增且两端极限分别为 $-\infty,+\infty$，可取唯一 $c$ 使 $f(c)=-f(b)$；取 $b\ne0$ 时 $f(b)+f(-b)>0$，故 $c<-b$，再在 $(c,-b)$ 中选 $a$。
        why: 存在 $f(a)+f(b)>0$ 但 $a+b<0$ 的情形，所以 C 不一定成立。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:26
teaching_card:
  student_title: 把 $a+b$ 的条件转到 $a$ 和 $-b$
  what_it_trains: 遇到 $a+b$ 的符号与 $f(a)+f(b)$ 的符号联动时，先把 $a+b>0$ 改成 $a>-b$，再补上对称量 $f(b)+f(-b)$；这比直接猜 $f(a)+f(b)$ 的符号稳得多。
  recognition_cues:
    - 题干中同时出现 $a+b$、$f(a)+f(b)$ 和 $f(-b)$。
    - $f(x)=e^x-\frac12x^2-1$ 满足 $f(0)=0$，且可证明全局递增。
    - 选项 C、D 是类似逆命题的判断，需要特别检查能否反推。
  normalization_moves:
    - 先证明 $f$ 递增：$f'(x)=e^x-x$，$f''(x)=e^x-1$。
    - 把 $f(b)+f(-b)$ 单独算出并设为 $h(b)$。
    - 证明 A 时拆成 $f(a)-f(-b)$ 与 $f(b)+f(-b)$。
    - 否定 C 时构造 $f(c)=-f(b)$，再在 $c$ 与 $-b$ 之间取 $a$。
  common_failures:
    - 只证明了 B，就直接认为 A 也成立，漏掉 $f(b)+f(-b)\ge0$。
    - 把 A 的逆命题 C 当作自然成立。
    - 证明 $h(b)\ge0$ 时只写 $h'(b)$，没有说明 $h'$ 的符号如何确定。
    - 构造 C 的反例时忘记要同时满足 $a+b<0$。
  similar_practice_query: 对称化 f(a)+f(b) f(b)+f(-b) 多选 判断命题
quality:
  confidence: high
