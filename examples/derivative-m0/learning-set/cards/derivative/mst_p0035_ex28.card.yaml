stem: |-
  已知函数 $f(x)=e^x-\frac12x^2-1$，对于任意的实数 $a,b$，下列结论一定成立的有 (   )
  A. 若 $a+b>0$，则 $f(a)+f(b)>0$
  B. 若 $a+b>0$，则 $f(a)-f(-b)>0$
  C. 若 $f(a)+f(b)>0$，则 $a+b>0$
  D. 若 $f(a)+f(b)<0$，则 $a+b<0$
answer: |
  ABD

  先求 $f'(x)=e^x-x$、$f''(x)=e^x-1$。$f'$ 在 $(-\infty,0)$ 上递减、在 $(0,+\infty)$ 上递增，且 $f'(0)=1$，所以 $f'(x)\ge1$，$f$ 在 $\mathbb R$ 上递增且 $f(0)=0$。若 $a+b>0$，则 $a>-b$，从而 $f(a)>f(-b)$，B 正确。再算 $f(b)+f(-b)=e^b+e^{-b}-b^2-2$，令 $h(b)$ 为该式，可证 $h(b)\ge0$，所以 $f(a)+f(b)>0$，A 正确。若 $f(a)+f(b)<0$，则 $f(a)<-f(b)\le f(-b)$，由单调性得 $a<-b$，D 正确。选 $b\ne0$，令 $f(c)=-f(b)$，取 $c<a<-b$，则 $f(a)+f(b)>0$ 但 $a+b<0$，C 错误。
