stem: 已知实数 $x_1$，$x_2$ 满足：$x_1+e^{x_1}=2$，$\frac{e}{x_2}-\ln x_2=1$，则 $x_1+\frac{e}{x_2}$ 的值是 ______.
answer: |-
  2

  由 $\frac e{x_2}-\ln x_2=1$ 得 $\frac e{x_2}+\ln\frac e{x_2}=2$，即 $e^{\ln(e/x_2)}+\ln(e/x_2)=2$。设 $f(x)=x+e^x$，它严格递增；又 $f(x_1)=2=f(\ln(e/x_2))$，所以 $x_1=\ln(e/x_2)$，进而 $e^{x_1}=e/x_2$，故 $x_1+e/x_2=x_1+e^{x_1}=2$。
rubric:
  max_score: 4
  criteria:
    - step_id: step_1
      description: 把第二个方程改写成 $u+e^u=2$ 的形式。
      max_score: 1
