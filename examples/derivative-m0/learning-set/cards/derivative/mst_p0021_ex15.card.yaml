original_problem:
  stem: 已知实数 $x_1$，$x_2$ 满足：$x_1+e^{x_1}=2$，$\frac{e}{x_2}-\ln x_2=1$，则 $x_1+\frac{e}{x_2}$ 的值是 ______.
  parts: *a1
  choices: []
  answer: "2"
  fidelity_notes:
    - 源图使用 $\mathrm e$；本卡统一写作 $e$，数学含义不变。
    - $x_2$ 由 $\ln x_2$ 与 $e/x_2$ 隐含满足 $x_2>0$。
solution:
  source_solution_summary: 由 $\frac e{x_2}-\ln x_2=1$ 得 $\frac e{x_2}+\ln\frac e{x_2}=2$，即 $e^{\ln(e/x_2)}+\ln(e/x_2)=2$。设 $f(x)=x+e^x$，它严格递增；又 $f(x_1)=2=f(\ln(e/x_2))$，所以 $x_1=\ln(e/x_2)$，进而 $e^{x_1}=e/x_2$，故 $x_1+e/x_2=x_1+e^{x_1}=2$。
  key_steps:
    - step_id: step_1
      statement: 把第二个方程改写成 $u+e^u=2$ 的形式。
      formula_trace:
        from: $\frac e{x_2}-\ln x_2=1$
        to: $\frac e{x_2}+\ln\frac e{x_2}=2$
        operation: 使用 $\ln\frac e{x_2}=1-\ln x_2$，两边加上 1 的对数形式。
        why: 这样第二个方程就能和 $x+e^x$ 的结构对齐。
      source_ref: page_0021
    - step_id: step_2
      statement: 把 $\frac e{x_2}$ 写成指数形式。
      formula_trace:
        from: $\frac e{x_2}+\ln\frac e{x_2}=2$
        to: $e^{\ln(e/x_2)}+\ln\frac e{x_2}=2$
        operation: 利用 $e^{\ln y}=y$，其中 $y=e/x_2>0$。
        why: 令 $u=\ln(e/x_2)$ 后，左边就是 $e^u+u$。
      source_ref: page_0021
    - step_id: step_3
      statement: 利用 $f(x)=x+e^x$ 的严格递增性锁定变量相等。
      formula_trace:
        from: $f(x_1)=2,\quad f(\ln(e/x_2))=2$
        to: $x_1=\ln\frac e{x_2}$
        operation: 由 $f'(x)=1+e^x>0$ 得 $f$ 一一对应。
        why: 同一个严格递增函数取同一个值，自变量必须相同。
      source_ref: page_0021
    - step_id: step_4
      statement: 回代求目标值。
      formula_trace:
        from: $x_1=\ln\frac e{x_2}$
        to: $\frac e{x_2}=e^{x_1},\quad x_1+\frac e{x_2}=x_1+e^{x_1}=2$
        operation: 两边取指数，并使用第一个已知方程。
        why: 目标式正好变回第一个方程左端。
      source_ref: page_0021
teaching_card:
  student_title: 把第二个方程藏成同一个 $x+e^x$
  what_it_trains: 训练把看似不同的两个方程都改写成同一个递增函数 $f(u)=u+e^u$ 的函数值，从而直接锁定变量关系并求值。
  recognition_cues:
    - 一个条件是 $x_1+e^{x_1}=2$，另一个条件含 $e/x_2$ 和 $\ln x_2$。
    - $1-\ln x_2$ 可以合成 $\ln(e/x_2)$。
    - 目标式 $x_1+e/x_2$ 与第一个条件左端高度相似。
  normalization_moves:
    - 把 $e/x_2-\ln x_2=1$ 改写为 $e/x_2+\ln(e/x_2)=2$。
    - 将 $e/x_2$ 看作 $e^{\ln(e/x_2)}$。
    - 用 $f$ 单调递增得到 $x_1=\ln(e/x_2)$，再让目标式回到第一个方程。
  common_failures:
    - 只把第二个方程移项，没有想到合成 $\ln(e/x_2)$。
    - 把 $e/x_2$ 和 $e^{x_1}$ 的关系漏掉，导致目标式无法回代。
    - 没有说明 $x+e^x$ 严格递增，直接写两个自变量相等。
  similar_practice_query: e^x+x 同构 x1 e/x2 ln(e/x2) 数值求值
quality:
  confidence: high
