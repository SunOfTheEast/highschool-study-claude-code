      description: 把 $\frac e{x_2}$ 写成指数形式。
      max_score: 1
    - step_id: step_3
      description: 利用 $f(x)=x+e^x$ 的严格递增性锁定变量相等。
      max_score: 1
    - step_id: step_4
      description: 回代求目标值。
      max_score: 1
