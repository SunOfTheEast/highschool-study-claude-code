solution:
  source_solution_summary: |
    换底得
    \[
    a=\frac{\ln3}{\ln5},\quad b=\frac{\ln5}{\ln8},\quad c=\frac{\ln8}{\ln13}.
    \]
    先比 $a,b$：由糖水不等式
    \[
    \frac{\ln3}{\ln5}
    <
    \frac{\ln3+\ln\frac85}{\ln5+\ln\frac85}
    =
    \frac{\ln\frac{24}{5}}{\ln8}
    <
    \frac{\ln5}{\ln8},
    \]
    故 $a<b$。
    再比 $b,c$：由 $5^5<8^4$ 得
    \[
    \frac{\ln5}{\ln8}<\frac45;
    \]
    由 $13^4<8^5$ 得
    \[
    \frac{\ln8}{\ln13}>\frac45.
    \]
    所以 $b<c$。综合得 $a<b<c$，选 A。
  key_steps:
    - step_id: step_1
      statement: 统一换底，转成对数分式。
      formula_trace:
        from: $a=\log_5 3,\ b=\log_8 5,\ c=\log_{13}8$
        to: $a=\frac{\ln3}{\ln5},\ b=\frac{\ln5}{\ln8},\ c=\frac{\ln8}{\ln13}$
        operation: 使用换底公式。
        why: 三者同构后可做分式比较。
      source_ref: page_0148_ex16_solution
    - step_id: step_2
      statement: 用糖水不等式比较 $a,b$。
      formula_trace:
        from: $\frac{\ln3}{\ln5}$ 与 $\frac{\ln5}{\ln8}$
        to: $\frac{\ln3}{\ln5}<\frac{\ln(24/5)}{\ln8}<\frac{\ln5}{\ln8}$
        operation: 在分子分母同时加 $\ln\frac85$。
        why: 构造中间比值并利用 $\frac{24}{5}<5$。
      source_ref: page_0148_ex16_solution
    - step_id: step_3
      statement: 由题设幂不等式给出 $b,c$ 的同一阈值比较。
      formula_trace:
        from: $5^5<8^4,\ 13^4<8^5$
        to: $b=\frac{\ln5}{\ln8}<\frac45<\frac{\ln8}{\ln13}=c$
        operation: 两条幂不等式分别取对数并整理。
        why: 把 $b,c$ 压到同一个中间值 $\frac45$ 两侧。
      source_ref: page_0148_ex16_solution
    - step_id: step_4
      statement: 合并结论并对应选项。
      formula_trace:
        from: $a<b$ 且 $b<c$
        to: $a<b<c$，选 A
        operation: 传递比较。
        why: 得到唯一顺序。
      source_ref: page_0148_ex16_solution
teaching_card:
  student_title: 换底后用一条阈值线串起三数比较
  what_it_trains: 训练把不同底对数比值统一成可加可夹的分式，再利用题设幂关系建立中间阈值。
  recognition_cues:
    - 多个对数底数不同但都可换底。
    - 题干额外给了两条幂不等式。
    - 目标是三数全序单选。
  normalization_moves:
    - 先全部换成自然对数比。
    - 先做一段糖水夹逼，再做一段阈值夹逼。
    - 最后传递合并。
  common_failures:
    - 只比较出 $a,b$，忽略 $b,c$ 还需第二段。
    - 把 $13^4<8^5$ 整理方向写反。
    - 中间分式构造后不验证大小链。
  similar_practice_query: 换底 糖水不等式 对数比值 三数比较
