stem: |-
  （2020·新课标Ⅲ）已知 $5^5<8^4$，$13^4<8^5$，设 $a=\log_5 3$，$b=\log_8 5$，$c=\log_{13}8$，则（ ）
  A. $a<b<c$
  B. $b<a<c$
  C. $b<c<a$
  D. $c<a<b$
answer: |
  A

  换底得
  \[
  a=\frac{\ln3}{\ln5},\quad b=\frac{\ln5}{\ln8},\quad c=\frac{\ln8}{\ln13}.
  \]
  先比 $a,b$：由糖水不等式
  \[
  \frac{\ln3}{\ln5}
  <
  \frac{\ln3+\ln\frac85}{\ln5+\ln\frac85}
  =
  \frac{\ln\frac{24}{5}}{\ln8}
  <
  \frac{\ln5}{\ln8},
  \]
  故 $a<b$。
  再比 $b,c$：由 $5^5<8^4$ 得
  \[
  \frac{\ln5}{\ln8}<\frac45;
  \]
  由 $13^4<8^5$ 得
  \[
  \frac{\ln8}{\ln13}>\frac45.
  \]
  所以 $b<c$。综合得 $a<b<c$，选 A。
