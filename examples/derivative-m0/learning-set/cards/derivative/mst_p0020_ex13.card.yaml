stem: |-
  已知函数 $f(x)=\sqrt{x}-\ln x-m$ 有零点，则实数 $m$ 的范围为 ( )
  A. $(-\infty, \sqrt{2}-\ln 2]$
  B. $(-\infty, 2-2\ln 2]$
  C. $[\sqrt{2}-\ln 2, +\infty)$
  D. $[2-2\ln 2, +\infty)$
answer: |-
  D

  有零点等价于存在 $x>0$ 使 $m=\sqrt{x}-\ln x$。令 $t=\sqrt{x}>0$，则 $m=t-\ln t^2=\ln(e^t/t^2)=2\ln\bigl(\frac12\cdot\frac{e^{t/2}}{t/2}\bigr)$。由 $e^u/u\ge e$（$u>0$，等号 $u=1$）得 $m\ge 2\ln(e/2)=2-2\ln2$，故选 D。
