    - 定义域来自 $\sqrt{x}$ 与 $\ln x$ 的交集：$x>0$。
solution:
  source_solution_summary: 有零点等价于存在 $x>0$ 使 $m=\sqrt{x}-\ln x$。令 $t=\sqrt{x}>0$，则 $m=t-\ln t^2=\ln(e^t/t^2)=2\ln\bigl(\frac12\cdot\frac{e^{t/2}}{t/2}\bigr)$。由 $e^u/u\ge e$（$u>0$，等号 $u=1$）得 $m\ge 2\ln(e/2)=2-2\ln2$，故选 D。
  key_steps:
    - step_id: step_1
      statement: 把零点存在转成参数 $m$ 的值域问题。
      formula_trace:
        from: $f(x)=\sqrt{x}-\ln x-m$ 有零点
        to: $m=\sqrt{x}-\ln x,\quad x>0$
        operation: 令 $f(x)=0$ 并移项。
        why: 实数 $m$ 的范围就是函数 $\sqrt{x}-\ln x$ 在 $x>0$ 上的值域。
      source_ref: page_0020
    - step_id: step_2
      statement: 用根式换元清理表达式。
      formula_trace:
        from: $m=\sqrt{x}-\ln x$
        to: $m=t-\ln t^2,\quad t=\sqrt{x}>0$
        operation: 令 $t=\sqrt{x}$，则 $x=t^2$。
        why: 根式与对数的自变量被统一到同一个正变量 $t$。
      source_ref: page_0020
    - step_id: step_3
      statement: 把 $t-2\ln t$ 写成可套用 $e^u/u$ 最小值的形式。
      formula_trace:
        from: $t-\ln t^2$
        to: $\ln\frac{e^t}{t^2}=2\ln\left(\frac12\cdot\frac{e^{t/2}}{t/2}\right)$
        operation: 指数对数互化，并令内部出现 $u=t/2$ 的 $e^u/u$。
        why: 源页后文总结的标准模型是 $e^x/x^n$ 最值。
      source_ref: page_0020
    - step_id: step_4
      statement: 调用 $e^u/u$ 在 $u=1$ 处取最小值 $e$。
      formula_trace:
        from: $\frac{e^{t/2}}{t/2}\ge e$
        to: $m\ge 2\ln\frac e2=2-2\ln2$
        operation: 在 $u=t/2>0$ 上应用最值，再代回对数表达式。
        why: 得到 $m$ 的最小值，且等号在 $t=2$ 时取得。
      source_ref: page_0020
    - step_id: step_5
      statement: 确定选项。
      formula_trace:
        from: $m\ge 2-2\ln2$
        to: $m\in[2-2\ln2,+\infty)$
        operation: 把值域写成区间并对照选项。
        why: 与选项 D 完全一致。
      source_ref: page_0020
teaching_card:
  student_title: 根号换元后套 $e^u/u$ 的最小值
  what_it_trains: 训练把“函数有零点”改成参数值域，再用 $t=\sqrt{x}$ 把根式对数混合式化成 $e^u/u$ 的标准最值。
  recognition_cues:
    - 题干问 $f(x)=\sqrt{x}-\ln x-m$ 有零点时 $m$ 的范围。
    - 表达式里同时有 $\sqrt{x}$ 和 $\ln x$，提示令 $t=\sqrt{x}$。
    - 换元后出现 $t-2\ln t$，可看成 $\ln(e^t/t^2)$。
  normalization_moves:
    - 先移项得到 $m=\sqrt{x}-\ln x$。
    - 用 $t=\sqrt{x}$ 把根号去掉，同时把 $\ln x$ 变成 $2\ln t$。
    - 把 $e^t/t^2$ 拆成含 $e^{t/2}/(t/2)$ 的平方，直接读最小值。
  common_failures:
    - 把“有零点”误当成判别式问题，没有转成值域。
    - 令 $t=\sqrt{x}$ 后忘记 $t>0$。
    - 把最小值误算成 $\sqrt2-\ln2$，对应选项 A/C 的干扰项。
    - 用 $e^u/u$ 最值时漏掉外面的 $2\ln$。
  similar_practice_query: sqrt x ln x m 有零点 参数范围 t=sqrt x e^x/x^2 最值
quality:
  confidence: high
  needs_review: false
  review_notes:
