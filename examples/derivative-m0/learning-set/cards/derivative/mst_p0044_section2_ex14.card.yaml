stem: |-
  已知直线 y=k_1x 与 y=k_2x(k_1>k_2) 是曲线 y=ax+2\ln|x|(a\in\mathbf{R}) 的两条切线，则 k_1-k_2=（  ）
  A. 4/e
  B. 2a
  C. 4
  D. 无法确定
answer: |-
  A

  两条切线都是 y=kx，必过原点。x>0 时曲线为 y=ax+2\ln x，过原点切线斜率为 a+2/e；x<0 时曲线为 y=ax+2\ln(-x)，由对称性得到斜率 a-2/e。两斜率差为 4/e。
