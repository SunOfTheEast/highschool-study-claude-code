solution:
  source_solution_summary: 两条切线都是 y=kx，必过原点。x>0 时曲线为 y=ax+2\ln x，过原点切线斜率为 a+2/e；x<0 时曲线为 y=ax+2\ln(-x)，由对称性得到斜率 a-2/e。两斜率差为 4/e。
  key_steps:
    - step_id: step_1
      statement: 把曲线按 x 的正负拆成两支。
      formula_trace:
        from: y=ax+2\ln|x|
        to: "x>0: y=ax+2\\ln x；x<0: y=ax+2\\ln(-x)"
        operation: 按 |x| 的定义分类。
        why: 两条过原点切线分别来自正半轴与负半轴。
      source_ref: page_0044_solution
    - step_id: step_2
      statement: 正半轴上求过原点切线的斜率。
      formula_trace:
        from: y=ax+2\ln x
        to: y=\left(a+\frac{2}{e}\right)x
        operation: 对 2\ln x 使用过原点切点 x=e，切线贡献斜率 2/e，再叠加 ax。
        why: 线性项 ax 只把切线斜率整体加 a。
      source_ref: page_0044_solution
    - step_id: step_3
      statement: 负半轴上由对称性求另一条切线。
      formula_trace:
        from: y=ax+2\ln(-x)
        to: y=\left(a-\frac{2}{e}\right)x
        operation: 2\ln(-x) 的过原点切线是 -2x/e，再叠加 ax。
        why: 正负两支的对数切线斜率相反，a 项相同。
      source_ref: page_0044_solution
    - step_id: step_4
      statement: 相同的 a 项相消，得到斜率差。
      formula_trace:
        from: k_1=a+\frac{2}{e},\quad k_2=a-\frac{2}{e}
        to: k_1-k_2=\frac{4}{e}
        operation: 用 k_1>k_2 确认顺序并相减。
        why: 题目只问两条切线斜率差，和参数 a 无关。
      source_ref: page_0044_solution
teaching_card:
  student_title: 把 ax 当共同斜率，求 \ln|x| 两支切线差
  what_it_trains: 训练从过原点切线识别对数切点，并看出线性项 ax 对两条斜率的贡献会相消。
  recognition_cues:
    - 两条直线都是 y=kx。
    - 曲线含 ax+2\ln|x|。
    - 题目问 k_1-k_2 而不是分别求 k_1、k_2。
  normalization_moves:
    - 拆成 x>0 与 x<0。
    - 先记 2\ln|x| 的两条过原点切线斜率为 \pm2/e。
    - 最后再叠加共同的 a。
  common_failures:
    - 误选 2a，以为两条切线只由 ax 决定。
    - 只算正半轴，漏掉负半轴切线。
    - 把 k_1、k_2 顺序弄反。
  similar_practice_query: 含 ax+ln|x| 的过原点切线斜率差，利用正负支对称
