solution:
  source_solution_summary: |
    对 $y=x+1+\ln x$ 求导得 $y'=1+\frac{1}{x}$，在 $x=1$ 处斜率为 $2$，
    过点 $A(1,2)$ 的切线为 $y-2=2(x-1)$，即 $y=2x$。令二次函数与这条直线
    相切，设
    $g(x)=ax^2+(a+2)x+1-2x=ax^2+ax+1$。相切意味着存在 $x_0$ 使
    $g(x_0)=0$ 且 $g'(x_0)=0$。由 $g'(x_0)=2ax_0+a=0$ 得 $x_0=-\frac12$，
    再代入 $g(x_0)=0$ 得 $a=4$，选 D。
  key_steps:
    - step_id: step_1
      statement: 先由已知切点写出切线 $l$。
      formula_trace:
        from: |
          $y=x+1+\ln x,\qquad y'=1+\frac{1}{x},\qquad A(1,2)$
        to: |
          $k=y'(1)=2,\qquad y-2=2(x-1),\qquad l:\ y=2x$
        operation: 求导并代入切点斜率，用点斜式写切线方程。
        why: 后面只需判断同一条直线是否与二次函数相切。
      source_ref: page_0100
    - step_id: step_2
      statement: 把“直线与二次函数相切”转成差函数重根。
      formula_trace:
        from: |
          $y=ax^2+(a+2)x+1,\qquad l:\ y=2x$
        to: |
          $g(x)=ax^2+(a+2)x+1-2x=ax^2+ax+1$
        operation: 用二次函数减去直线，公共点变成 $g(x)=0$ 的根。
        why: 相切对应交点为重根，也就是 $g(x_0)=0,\ g^\prime(x_0)=0$。
      source_ref: page_0100
    - step_id: step_3
      statement: 用极点效应求切点横坐标和参数。
      formula_trace:
        from: |
          $g(x_0)=ax_0^2+ax_0+1=0,\qquad g'(x_0)=2ax_0+a=0$
        to: |
          $x_0=-\frac12,\qquad a\cdot\frac14-a\cdot\frac12+1=0,\qquad a=4$
        operation: 先由导数为零确定重根位置，再代回函数值为零。
        why: 二次函数和直线在同一点相交且斜率相等，正是相切条件。
      source_ref: page_0100
teaching_card:
  student_title: 先定已知切线，再让二次函数重根
  what_it_trains: 训练把一条已经确定的切线代入另一条曲线，用差函数重根条件求参数。
  recognition_cues:
    - 题干给出明确切点 $A(1,2)$，提示先写出这条固定切线。
    - 另一条曲线是二次函数，和直线相切时差函数应有重根。
    - 选项是单个 $a$ 值，通常由重根方程直接算出。
  normalization_moves:
    - 求 $y=x+1+\ln x$ 在 $x=1$ 处的切线 $y=2x$。
    - 构造 $g(x)=ax^2+(a+2)x+1-2x$。
    - 联立 $g(x_0)=0$ 与 $g^\prime(x_0)=0$ 求出 $a=4$。
  common_failures:
    - 只算出切线斜率 $2$，忘记写完整直线 $y=2x$。
    - 把“相切”当作只有一个交点却没有用重根条件。
    - 从 $2ax_0+a=0$ 得到 $x_0=-\frac12$ 后忘记代回 $g(x_0)=0$。
  similar_practice_query: 已知切点切线 二次函数相切 差函数重根 求参数
