stem: （MST 陪跑课答疑）已知 $a>0$，$x>0$，$f(x)=a(x+1)e^x-1-\frac1x$，判断 $f(x)$ 的零点个数。
answer: |-
  $f(x)$ 有唯一零点。

  $f'(x)=a(x+2)e^x+\frac1{x^2}>0$，所以 $f$ 在 $(0,+\infty)$ 上 单调递增，最多一个零点。法一按 $f(1)=2ae-2$ 分界：若 $a>1/e$，则 $f(1)>0$，在 $(0,1)$ 中用 $f(x)<2ae-1-\frac1x$，取 $x=1/(2ae-1)$ 得左侧负值点；若 $a<1/e$，则 $f(1)<0$，在 $(1,+\infty)$ 中用 $f(x)>2ae^x-2$，取 $x=\ln(1/a)$ 得右侧正值点；若 $a=1/e$， $x=1$ 即零点。故总是唯一零点。法二则取远右点 $x=e^{1/a}$， 用 $ae^{1/a}>1$ 构造正值点，再由左侧负值点夹根。
