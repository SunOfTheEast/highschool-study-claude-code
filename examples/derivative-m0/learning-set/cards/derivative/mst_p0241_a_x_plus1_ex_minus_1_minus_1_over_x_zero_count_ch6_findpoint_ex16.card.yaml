original_problem:
  stem: （MST 陪跑课答疑）已知 $a>0$，$x>0$，$f(x)=a(x+1)e^x-1-\frac1x$，判断 $f(x)$ 的零点个数。
  parts: *a1
  choices: []
  answer: $f(x)$ 有唯一零点。
  fidelity_notes:
    - 单问零点个数题，无选项。
    - 函数定义域为 $x>0$。
solution:
  source_solution_summary: $f'(x)=a(x+2)e^x+\frac1{x^2}>0$，所以 $f$ 在 $(0,+\infty)$ 上 单调递增，最多一个零点。法一按 $f(1)=2ae-2$ 分界：若 $a>1/e$，则 $f(1)>0$，在 $(0,1)$ 中用 $f(x)<2ae-1-\frac1x$，取 $x=1/(2ae-1)$ 得左侧负值点；若 $a<1/e$，则 $f(1)<0$，在 $(1,+\infty)$ 中用 $f(x)>2ae^x-2$，取 $x=\ln(1/a)$ 得右侧正值点；若 $a=1/e$， $x=1$ 即零点。故总是唯一零点。法二则取远右点 $x=e^{1/a}$， 用 $ae^{1/a}>1$ 构造正值点，再由左侧负值点夹根。
  key_steps:
    - step_id: step_1
      statement: 先确认函数严格递增。
      formula_trace:
        from: $f(x)=a(x+1)e^x-1-\frac1x$
        to: $f^\prime(x)=a(x+2)e^x+\frac1{x^2}>0$
        operation: 求导并用 $a>0,x>0$ 判号。
        why: 严格递增保证零点至多一个。
      source_ref: page_0241_ex16_solution
    - step_id: step_2
      statement: 用 $f(1)$ 作为分界。
      formula_trace:
        from: $f(1)=2ae-2$
        to: $a>1/e,\ a=1/e,\ a<1/e$ 三种情况
        operation: 判断 $f(1)$ 的符号。
        why: 没有明显定号点时，用中间点分界最直接。
      source_ref: page_0241_ex16_solution
    - step_id: step_3
      statement: $a>1/e$ 时在左侧找负值点。
      formula_trace:
        from: $x\in(0,1)$
        to: $f(x)<2ae-1-\frac1x$，取 $x=\frac1{2ae-1}$
        operation: 用 $x+1<2$、$e^x<e$ 放大正项。
        why: 配合 $f(1)>0$ 夹出唯一零点。
      source_ref: page_0241_ex16_solution
    - step_id: step_4
      statement: $a<1/e$ 时在右侧找正值点。
      formula_trace:
        from: $x\in(1,+\infty)$
        to: $f(x)>2ae^x-2$，取 $x=\ln\frac1a$
        operation: 用 $x+1>2$ 和 $-1-\frac1x>-2$。
        why: 配合 $f(1)<0$ 夹出唯一零点。
      source_ref: page_0241_ex16_solution
    - step_id: step_5
      statement: $a=1/e$ 时零点就是 $x=1$。
      formula_trace:
        from: $a=1/e$
        to: $f(1)=0$
        operation: 代入分界值。
        why: 边界情形不需要另找点。
      source_ref: page_0241_ex16_solution
    - step_id: step_6
      statement: 远点法用 $x=e^{1/a}$ 消掉参数影响。
      formula_trace:
        from: $x=e^{1/a}$
        to: $ae^{1/a}>1$
        operation: 利用 $e^u>u$。
        why: 远离零点时更容易构造确定正值点。
      source_ref: page_0241_ex16_solution
teaching_card:
  student_title: 没有明显定号点时，用 $f(1)$ 分界找唯一零点
  what_it_trains: 训练单调函数零点计数：先证明最多一个，再按中间点符号去两侧找异号点。
  recognition_cues:
    - $f$ 在 $x>0$ 上明显递增。
    - $f(1)=2ae-2$ 正好给出 $a=1/e$ 分界。
    - 右侧远点可以取 $e^{1/a}$，用指数增长压住参数。
  normalization_moves:
    - 先求导证明递增。
    - 看 $f(1)$ 的符号。
    - $a>1/e$ 在 $(0,1)$ 找点。
    - $a<1/e$ 在 $(1,+\infty)$ 找点。
    - $a=1/e$ 直接得到 $x=1$。
  common_failures:
    - 只说递增，没有证明存在零点。
    - 把 $f(1)$ 算成 $ae-2$。
    - $a<1/e$ 时取 $\ln(1/a)$ 前忘记它大于 1。
  similar_practice_query: a(x+1)e^x-1-1/x 零点个数 f(1) 1/e e^(1/a)
