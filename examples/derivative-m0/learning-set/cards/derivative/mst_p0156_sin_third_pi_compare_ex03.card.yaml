solution:
  source_solution_summary: |
    先有
    \[
    a=\frac13>\frac1\pi=c.
    \]
    又
    \[
    b=\cos\left(\frac13-\frac\pi2\right)=\sin\frac13.
    \]
    设
    \[
    f(x)=x-\sin x\quad(0<x<1),
    \]
    则 $f^{\prime}(x)=1-\cos x>0$，故 $f(x)>f(0)=0$，即 $x>\sin x$，从而
    \[
    a=\frac13>b.
    \]
    为比较 $b,c$，设
    \[
    g(x)=\sin x-x+\frac{x^3}{6},\quad
    g^{\prime}(x)=\cos x-1+\frac{x^2}{2}=\varphi(x).
    \]
    又
    \[
    \varphi^{\prime}(x)=-\sin x+x>0,
    \]
    所以 $\varphi(x)>0$，进而 $g^{\prime}(x)>0$、$g(x)>0$，即
    \[
    \sin x>x-\frac{x^3}{6}\quad(0<x<1).
    \]
    代入 $x=\frac13$：
    \[
    b=\sin\frac13>\frac13-\frac{(1/3)^3}{6}=\frac{53}{162}\approx0.327>\frac1\pi\approx0.318=c.
    \]
    综上 $a>b>c$，选 A。
  key_steps:
    - step_id: step_1
      statement: 先完成直接比较和三角化简。
      formula_trace:
        from: $a=\frac13,\ b=\cos\left(\frac13-\frac\pi2\right),\ c=\frac1\pi$
        to: $a>c,\ b=\sin\frac13$
        operation: 用 $\frac13>\frac1\pi$ 与余弦差角恒等式。
        why: 把问题降为比较 $\frac13,\sin\frac13,\frac1\pi$。
      source_ref: page_0156_ex03_solution_start
    - step_id: step_2
      statement: 证明 $a>b$。
      formula_trace:
        from: $f(x)=x-\sin x,\ f^{\prime}(x)=1-\cos x>0$
        to: $x>\sin x\ (0<x<1)\Rightarrow \frac13>\sin\frac13$
        operation: 由 $f$ 在 $(0,1)$ 上递增且 $f(0)=0$。
        why: 得到第一条关键顺序 $a>b$。
      source_ref: page_0156_ex03_solution_start
    - step_id: step_3
      statement: 建立 $\sin x$ 的下界。
      formula_trace:
        from: $g(x)=\sin x-x+\frac{x^3}{6},\ \varphi(x)=g^{\prime}(x)$
        to: $\sin x>x-\frac{x^3}{6}\ (0<x<1)$
        operation: 先证 $\varphi^{\prime}(x)=-\sin x+x>0$，再得 $\varphi>0,\ g^{\prime}>0,\ g>0$。
        why: 这是判断 $b$ 与 $c$ 的核心估值式。
      source_ref: page_0157_ex03_solution_cont
    - step_id: step_4
      statement: 数值落点判定 $b>c$。
      formula_trace:
        from: $\sin\frac13>\frac13-\frac{(1/3)^3}{6}$
        to: $b>\frac{53}{162}\approx0.327>\frac1\pi\approx0.318=c$
        operation: 按源解把下界与 $\frac1\pi$ 的近似值对比。
        why: 补齐第二条关键顺序。
      source_ref: page_0157_ex03_solution_cont
    - step_id: step_5
      statement: 合并顺序并匹配选项。
      formula_trace:
        from: $a>b$ 且 $b>c$
        to: $a>b>c$
        operation: 传递比较。
        why: 对应选项 A。
      source_ref: page_0157_ex03_solution_cont
teaching_card:
  student_title: 先证 $x>\sin x$，再补一阶泰勒下界
  what_it_trains: 训练对同一三角点位同时做上界和下界控制，再与代数常数完成稳定排序。
  recognition_cues:
    - 含 $\cos(\cdot-\frac\pi2)$ 可先改写为 $\sin$。
    - 目标是常数与三角值混合排序。
    - 源解出现两次“设函数并求导”，说明要走导数判号链。
  normalization_moves:
    - 把 $b$ 全部改写成 $\sin\frac13$。
    - 用 $x-\sin x$ 先给 $\sin x$ 上界。
    - 用 $\sin x-x+\frac{x^3}{6}$ 再给 $\sin x$ 下界。
  common_failures:
    - 只证出 $a>b$ 就停止，漏掉 $b$ 与 $c$。
    - 把 $\sin x>x-\frac{x^3}{6}$ 的适用区间忽略成全体实数。
    - 近似值比较时把 $1/\pi$ 粗算成 0.33 导致误判。
  similar_practice_query: sin(1/3) 与 1/pi 比较 泰勒下界 导数判号
