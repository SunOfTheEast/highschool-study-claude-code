original_problem:
  stem: （2025 · 广东高二期末考试节选）已知 $f(x)=e^x-ax$，当 $a=2$ 时，若关于 $f(x)=t$ 的方程有两个实数根 $x_1<x_2$，求证：$x_2-x_1<3t-1$。
  parts: *a1
  choices: []
  answer: $x_2-x_1<3t-1$。
  fidelity_notes:
    - 单问不等式证明题，无选项。
    - 本题在 $a=2$ 下讨论水平线 $f(x)=t$ 的两个交点。
solution:
  source_solution_summary: 当 $a=2$ 时，$f(x)=e^x-2x$，$f'(x)=e^x-2$，在 $x=\ln2$ 处取最小值 $2-2\ln2$。若 $f(x)=t$ 有两个根，则 $t>2-2\ln2$。左侧用 $x=0$ 处切线 $y=1-x$，且 $1-x\le e^x-2x$，令 $t=1-x$ 得左侧参考点 $x'=1-t$，所以 $x_1>1-t$。若能证 $x_2<2t$，则 $x_2-x_1<2t-(1-t)=3t-1$。右侧代入 $2t$： $f(2t)=e^{2t}-4t$，要使 $f(2t)>t$，只需 $e^{2t}>5t$，由 $e^{2t}>2et>5t$ 得证。法二用切割线 $y=x/2$ 作右侧夹线，也得到 $x_2<2t$。
  key_steps:
    - step_id: step_1
      statement: 先确定曲线单谷结构。
      formula_trace:
        from: $f(x)=e^x-2x$
        to: $f^\prime(x)=e^x-2$，极小值点 $x=\ln2$
        operation: 求导判号。
        why: 两个交点来自水平线高于极小值。
      source_ref: page_0243_ex20_solution_start
    - step_id: step_2
      statement: 左侧用切线给根的下界。
      formula_trace:
        from: $y=1-x$
        to: $1-x\le e^x-2x$
        operation: 用 $x=0$ 处切线作下界。
        why: 水平线 $y=t$ 与切线交于 $1-t$，曲线左根在其右侧。
      source_ref: page_0244_ex20_continuation
    - step_id: step_3
      statement: 把原目标拆成左右两个界。
      formula_trace:
        from: $x_1>1-t$
        to: 只需证明 $x_2<2t$
        operation: 用 $x_2-x_1<2t-(1-t)$。
        why: 这样目标正好变成 $3t-1$。
      source_ref: page_0244_ex20_continuation
    - step_id: step_4
      statement: 右侧代入 $x=2t$。
      formula_trace:
        from: $f(2t)=e^{2t}-4t$
        to: $f(2t)>t \Leftarrow e^{2t}>5t$
        operation: 代入右侧候选点。
        why: 若 $f(2t)>t$，右根必须在 $2t$ 左侧。
      source_ref: page_0244_ex20_continuation
    - step_id: step_5
      statement: 用指数粗界完成右侧。
      formula_trace:
        from: $e^{2t}>2et$
        to: $e^{2t}>5t$
        operation: 用 $2e>5$。
        why: 这是 source 给出的快速收尾。
      source_ref: page_0244_ex20_continuation
    - step_id: step_6
      statement: 法二可理解为右侧切割线夹。
      formula_trace:
        from: $y=\frac x2$
        to: $e^x-2x>\frac x2$
        operation: 构造过原点斜率 $1/2$ 的切割线。
        why: 这同样让水平线 $y=t$ 对应右侧参考点 $x=2t$。
      source_ref: page_0244_ex20_continuation
teaching_card:
  student_title: 切割线夹两根距离：左边用切线，右边用斜线
  what_it_trains: 训练用辅助直线夹住曲线交点，把两根距离拆成左右两个显点界。
  recognition_cues:
    - $e^x-2x$ 是单谷函数，水平线可能有两个交点。
    - 目标 $3t-1$ 可以拆成 $2t-(1-t)$。
    - 左侧自然想到 $x=0$ 处切线 $y=1-x$。
    - 右侧自然想到过原点的线 $y=x/2$。
  normalization_moves:
    - 先写出单调性和极小值。
    - 用左切线得到 $x_1>1-t$。
    - 把目标改成证明 $x_2<2t$。
    - 代入 $2t$ 或用 $y=x/2$ 夹右侧。
  common_failures:
    - 直接估 $x_2-x_1$，没有拆成左右两个点。
    - 不知道 $3t-1$ 来自 $2t-(1-t)$。
    - 只画图不证明 $x_2<2t$。
  similar_practice_query: e^x-2x f(x)=t 两根距离 切割线夹 y=1-x y=x/2 x2<2t
