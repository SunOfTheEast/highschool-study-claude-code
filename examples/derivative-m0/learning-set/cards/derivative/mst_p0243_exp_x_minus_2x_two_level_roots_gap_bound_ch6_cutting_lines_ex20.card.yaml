stem: （2025 · 广东高二期末考试节选）已知 $f(x)=e^x-ax$，当 $a=2$ 时，若关于 $f(x)=t$ 的方程有两个实数根 $x_1<x_2$，求证：$x_2-x_1<3t-1$。
answer: |-
  $x_2-x_1<3t-1$。

  当 $a=2$ 时，$f(x)=e^x-2x$，$f'(x)=e^x-2$，在 $x=\ln2$ 处取最小值 $2-2\ln2$。若 $f(x)=t$ 有两个根，则 $t>2-2\ln2$。左侧用 $x=0$ 处切线 $y=1-x$，且 $1-x\le e^x-2x$，令 $t=1-x$ 得左侧参考点 $x'=1-t$，所以 $x_1>1-t$。若能证 $x_2<2t$，则 $x_2-x_1<2t-(1-t)=3t-1$。右侧代入 $2t$： $f(2t)=e^{2t}-4t$，要使 $f(2t)>t$，只需 $e^{2t}>5t$，由 $e^{2t}>2et>5t$ 得证。法二用切割线 $y=x/2$ 作右侧夹线，也得到 $x_2<2t$。
