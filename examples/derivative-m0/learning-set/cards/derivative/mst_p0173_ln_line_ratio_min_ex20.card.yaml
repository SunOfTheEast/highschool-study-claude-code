stem: |-
  （2025 · 浙江月考 T8）已知函数 $f(x)=\ln x$，$g(x)=(a-e)x+2b$。若不等式 $f(x)\leqslant g(x)$ 在 $x\in(0,+\infty)$ 上恒成立，则 $\frac{2e\cdot b}{a}$ 的最小值为（  ）
  A. $-1$
  B. $1$
  C. $-e$
  D. $e$
answer: |
  A

  由
  \[
  \ln x\le (a-e)x+2b
  \]
  得
  \[
  ex+\ln x\le ax+2b.
  \]
  记
  \[
  y_1=ex+\ln x,\qquad y_2=ax+2b.
  \]
  上页给出 $y_1$ 的零点
  \[
  x_{1}=\frac1e,
  \]
  续页补全 $y_2$ 的零点
  \[
  x_{2}=-\frac{2b}{a}.
  \]
  源解按“凹凸性与零点比大小”得到
  \[
  \frac1e\ge-\frac{2b}{a},
  \]
  即
  \[
  \frac{2eb}{a}\ge-1.
  \]
  因而 $\frac{2eb}{a}$ 的最小值为 $-1$，选 A。
