solution:
  source_solution_summary: |
    由
    \[
    \ln x\le (a-e)x+2b
    \]
    得
    \[
    ex+\ln x\le ax+2b.
    \]
    记
    \[
    y_1=ex+\ln x,\qquad y_2=ax+2b.
    \]
    上页给出 $y_1$ 的零点
    \[
    x_{1}=\frac1e,
    \]
    续页补全 $y_2$ 的零点
    \[
    x_{2}=-\frac{2b}{a}.
    \]
    源解按“凹凸性与零点比大小”得到
    \[
    \frac1e\ge-\frac{2b}{a},
    \]
    即
    \[
    \frac{2eb}{a}\ge-1.
    \]
    因而 $\frac{2eb}{a}$ 的最小值为 $-1$，选 A。
  key_steps:
    - step_id: step_1
      statement: 把原不等式改写成同斜率比较模型。
      formula_trace:
        from: $\ln x\le (a-e)x+2b$
        to: $ex+\ln x\le ax+2b$
        operation: 两边同加 $ex$。
        why: 得到“非线性函数 vs 直线”的零点比较形态。
      source_ref: page_0173_ex20_solution_part1
    - step_id: step_2
      statement: 读取两侧零点。
      formula_trace:
        from: $y_1=ex+\ln x,\ y_2=ax+2b$
        to: $x_1=\frac1e,\ x_2=-\frac{2b}{a}$
        operation: $y_1=0$ 在 $x=1/e$；$y_2=0$ 解一次方程。
        why: 参数比值直接嵌在 $x_2$ 中。
      source_ref: page_0173_ex20_solution_part1 + page_0174_ex20_solution_part2
    - step_id: step_3
      statement: 用凹凸性与零点比大小给出位置关系。
      formula_trace:
        from: $y_1\le y_2$（源解模型）
        to: $\frac1e\ge-\frac{2b}{a}$
        operation: 按源页结论比较两零点位置。
        why: 把函数不等式转成参数不等式。
      source_ref: page_0174_ex20_solution_part2
    - step_id: step_4
      statement: 整理到目标表达式。
      formula_trace:
        from: $\frac1e\ge-\frac{2b}{a}$
        to: $\frac{2eb}{a}\ge-1$
        operation: 同乘 $e$ 并移项。
        why: 直接得到最小值边界与选项 A。
      source_ref: page_0174_ex20_solution_part2
teaching_card:
  student_title: 先平移出 $ex+\ln x$，再比零点
  what_it_trains: 训练处理“对数函数被直线上包络”的参数最值：通过同加线性项形成零点模型，再从零点位置直接读出参数比下界。
  recognition_cues:
    - 题干是 $\ln x$ 与一次函数在 $(0,+\infty)$ 上恒比较。
    - 目标是含 $\frac{b}{a}$ 的线性分式。
    - 解析会出现 $ex+\ln x$ 的固定零点 $1/e$。
  normalization_moves:
    - 两边同加 $ex$。
    - 写出两边零点并比较。
    - 将零点不等式整理成 $\frac{2eb}{a}$ 下界。
  common_failures:
    - 把 $y_2$ 零点误写成 $-b/a$，漏掉系数 2。
    - 从 $1/e\ge-2b/a$ 整理时符号翻错。
    - 遗漏这是跨页题，导致解析链条不完整。
  similar_practice_query: lnx ≤ (a-e)x+2b 恒成立 2eb/a 最小值 零点比大小
