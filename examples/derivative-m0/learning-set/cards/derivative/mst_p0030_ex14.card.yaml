stem: 若 $ae^{ax-1}\geqslant 1+\ln x$ 在 $(0,+\infty)$ 上恒成立，则 $a$ 的取值范围是 ______.
answer: |-
  $[1,+\infty)$

  先由大 $x$ 情形排除 $a\le0$。把 $1+\ln x$ 写成 $\ln(ex)$，并两边乘以 $ex$，得到 $axe^{ax}\ge e^{\ln(ex)}\ln(ex)$。若 $\ln(ex)\le0$，右端非正而左端为正，不等式自动成立；若 $\ln(ex)>0$，用 $g(t)=te^t$ 在 $(0,+\infty)$ 上递增，推出 $ax\ge\ln(ex)$，即 $a\ge (1+\ln x)/x$。在 $x>1/e$ 上，$e\ln(ex)/(ex)$ 的最大值为 1，故 $a\ge1$，答案为 $[1,+\infty)$。
