solution:
  source_solution_summary: |
    两条曲线都减去 1，不影响是否有公切线，所以问题转为
    $f(x)=x^2$ 与 $g(x)=a\ln x$ 的关系。题设 $a>0$ 时，$g$ 在
    $(0,+\infty)$ 上递增；在 $0<x<1$ 时 $a\ln x<0<x^2$，只需考虑
    $x>1$。源页用内公切线模型判断：只要 $x^2\ge a\ln x$ 恒成立，
    两曲线就存在公切线。因此
    $a\le\left(\frac{x^2}{\ln x}\right)_{\min}$。令
    $q(x)=\frac{x^2}{\ln x}$，则
    $q'(x)=\frac{x(2\ln x-1)}{(\ln x)^2}$，在 $x=\sqrt e$ 处取最小值
    $q(\sqrt e)=2e$。故 $0<a\le2e$，选项 A、B、D 符合，C 中
    $5.6>2e$ 不符合。故选 ABD。
  key_steps:
    - step_id: step_1
      statement: 去掉共同的纵向平移。
      formula_trace:
        from: |
          $y=x^2-1,\qquad y=a\ln x-1$
        to: |
          $y=x^2,\qquad y=a\ln x$
        operation: 两条曲线同时上移 1。
        why: 共同平移不改变公切线存在性，只改变切线截距。
      source_ref: page_0105
    - step_id: step_2
      statement: 把公切线存在性转成函数大小关系。
      formula_trace:
        from: |
          $x^2\ge a\ln x\quad (x>0)$
        to: |
          $a\le \frac{x^2}{\ln x}\quad (x>1)$
        operation: 在 $x>1$ 上除以 $\ln x>0$；$0<x<1$ 时不构成约束。
        why: 源页内公切线模型要求二次曲线在对数曲线外侧。
      source_ref: page_0105
    - step_id: step_3
      statement: 求 $\frac{x^2}{\ln x}$ 的最小值。
      formula_trace:
        from: |
          $q(x)=\frac{x^2}{\ln x}\quad (x>1)$
        to: |
          $q'(x)=\frac{x(2\ln x-1)}{(\ln x)^2},\quad x=\sqrt e,\quad q_{\min}=2e$
        operation: 求导并令 $2\ln x-1=0$。
        why: 恒成立约束由右端最小值决定。
      source_ref: page_0105
    - step_id: step_4
      statement: 结合选项筛选。
      formula_trace:
        from: |
          $0<a\le2e,\qquad 2e\approx5.436$
        to: |
          $1.2,4,2e\text{ 可取};\quad 5.6\text{ 不可取}$
        operation: 把选项数值与阈值 $2e$ 比较。
        why: 题目问“可能取值”，多选要逐项判断。
      source_ref: page_0105
teaching_card:
  student_title: 把二次和对数公切线变成 $a\le2e$
  what_it_trains: 训练识别共同平移后的二次-对数公切线模型，用比值函数的最小值筛选参数选项。
  recognition_cues:
    - 两条曲线都有 $-1$，先整体平移掉。
    - 题干给 $a$ 为正实数，且是多选“可能取值”，通常先求完整范围再选。
    - 出现 $2e$ 选项，提示 $\frac{x^2}{\ln x}$ 的最小值。
  normalization_moves:
    - 把问题转成 $y=x^2$ 与 $y=a\ln x$。
    - 写出 $x^2\ge a\ln x$，在 $x>1$ 上分离参数。
    - 求 $q(x)=\frac{x^2}{\ln x}$ 的最小值 $2e$。
  common_failures:
    - 漏掉共同平移，误以为 $-1$ 会影响斜率。
    - 在 $\ln x<0$ 的区间分离参数时方向混乱。
    - 把 $5.6$ 看成小于 $2e$，导致误选 C。
  similar_practice_query: 二次 对数 公切线 共同平移 x^2/lnx 最小值 2e
