original_problem:
  stem: （2018·新课标I）已知函数 $f(x)=ae^x-\ln x-1$。
  parts: *a1
  choices: []
  answer: (1) $a=\frac1{2e^2}$，$f(x)$ 在 $(0,2)$ 单调递减，在 $(2,+\infty)$ 单调递增；(2) $a\ge\frac1e$ 时恒有 $f(x)\ge0$。
  fidelity_notes:
    - 源题为两问解答题，无选项。
    - 题干含 $\ln x$，默认定义域为 $x>0$。
solution:
  source_solution_summary: 第(1)问：由 $f^{\prime}(x)=ae^x-\frac1x$ 与极值点必要条件 $f^{\prime}(2)=0$ 求得 $a=\frac1{2e^2}$；再把 $f^{\prime}(x)$ 的符号化为 $xe^x-2e^2$ 的符号，用 $xe^x$ 在 $(0,+\infty)$ 严格递增得到单调区间。 第(2)问：把 $f(x)$ 拆为 $(e^{x-1}-x)+(x-\ln x-1)+\left(a-\frac1e\right)e^x$，其中前两项分别由 $e^t\ge1+t$ 与 $\ln x\le x-1$ 保证非负，第三项在 $a\ge\frac1e$ 时非负，故 $f(x)\ge0$。
  key_steps:
    - step_id: step_1
      statement: 由极值点必要条件确定参数 $a$。
      formula_trace:
        from: $f(x)=ae^x-\ln x-1,\ f^{\prime}(x)=ae^x-\frac1x,\ f^{\prime}(2)=0$
        to: $ae^2-\frac12=0\Rightarrow a=\frac1{2e^2}$
        operation: 在定义域内部极值点处令导数为零。
        why: 第(1)问先定参才能继续判单调。
      source_ref: page_0201_ex06_solution
    - step_id: step_2
      statement: 把导数符号比较转成 $xe^x$ 与常数比较。
      formula_trace:
        from: $f^{\prime}(x)=\frac{e^x}{2e^2}-\frac1x$
        to: $\mathrm{sign}\,f^{\prime}(x)=\mathrm{sign}\,(xe^x-2e^2)$
        operation: 同乘正数 $2e^2x$。
        why: $xe^x$ 在 $x>0$ 上严格递增且 $x=2$ 时等号成立。
      source_ref: page_0201_ex06_solution
    - step_id: step_3
      statement: 得到第(1)问单调区间。
      formula_trace:
        from: $xe^x<2e^2\ (0<x<2),\ xe^x>2e^2\ (x>2)$
        to: $f^{\prime}(x)<0\ (0<x<2),\ f^{\prime}(x)>0\ (x>2)$
        operation: 由 step_2 的同号关系读出导数符号。
        why: 导数符号决定函数先减后增。
      source_ref: page_0201_ex06_solution
    - step_id: step_4
      statement: 把第(2)问拆成三项非负之和。
      formula_trace:
        from: $ae^x-\ln x-1$
        to: $(e^{x-1}-x)+(x-\ln x-1)+\left(a-\frac1e\right)e^x$
        operation: 加减 $x$ 与 $\frac1e e^x$。
        why: 便于分别调用指数与对数基础不等式。
      source_ref: page_0201_ex06_solution
    - step_id: step_5
      statement: 分别证明三项非负并合并结论。
      formula_trace:
        from: $e^{x-1}-x,\ x-\ln x-1,\ \left(a-\frac1e\right)e^x$
        to: $e^{x-1}-x\ge0,\ x-\ln x-1\ge0,\ \left(a-\frac1e\right)e^x\ge0$
        operation: 用 $e^t\ge1+t$（$t=x-1$）与 $\ln x\le x-1$，再用 $a\ge\frac1e$。
        why: 三项同为非负，故 $f(x)\ge0$。
      source_ref: page_0201_ex06_solution
teaching_card:
  student_title: 极值点先定参，证明题再拆三块
  what_it_trains: 训练在同题里切换“导数判单调”和“临界参数放缩”两条链路，避免把证明题写成只给结论。
  recognition_cues:
    - 题目前半给“某点是极值点”，后半给“$a\ge$某阈值”。
    - 导数含 $ae^x-\frac1x$，常用 $xe^x$ 统一符号判断。
    - 证明式含指数+对数，通常可拆为 $e^t-(1+t)$ 与 $x-\ln x-1$。
  normalization_moves:
    - 先用 $f^{\prime}(2)=0$ 立即定出 $a$。
    - 判号时先同乘正量，改成单调函数比较。
    - 证明时把 $f(x)$ 拆成三项非负并逐项落地。
  common_failures:
    - 第(1)问只求出 $a$，漏掉单调区间。
    - 第(2)问把 $a\ge\frac1e$ 直接代成等号，缺失“$\ge$”传递。
    - 把 $x-\ln x-1\ge0$ 的适用域写错（应为 $x>0$）。
  similar_practice_query: ae^x-lnx-1 极值点 求参 单调 证明 a>=1/e
