stem: |-
  （2018·新课标I）已知函数 $f(x)=ae^x-\ln x-1$。
  (1). 设 $x=2$ 是 $f(x)$ 的极值点，求 $a$，并求 $f(x)$ 的单调区间。
  (2). 证明：当 $a\ge\frac1e$ 时，$f(x)\ge0$。
answer: |-
  (1) $a=\frac1{2e^2}$，$f(x)$ 在 $(0,2)$ 单调递减，在 $(2,+\infty)$ 单调递增；(2) $a\ge\frac1e$ 时恒有 $f(x)\ge0$。

  第(1)问：由 $f^{\prime}(x)=ae^x-\frac1x$ 与极值点必要条件 $f^{\prime}(2)=0$ 求得 $a=\frac1{2e^2}$；再把 $f^{\prime}(x)$ 的符号化为 $xe^x-2e^2$ 的符号，用 $xe^x$ 在 $(0,+\infty)$ 严格递增得到单调区间。 第(2)问：把 $f(x)$ 拆为 $(e^{x-1}-x)+(x-\ln x-1)+\left(a-\frac1e\right)e^x$，其中前两项分别由 $e^t\ge1+t$ 与 $\ln x\le x-1$ 保证非负，第三项在 $a\ge\frac1e$ 时非负，故 $f(x)\ge0$。
