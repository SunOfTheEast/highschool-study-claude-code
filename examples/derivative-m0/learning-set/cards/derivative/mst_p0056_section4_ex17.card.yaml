original_problem:
  stem: （广东省中山市第一中学 2025 学年高二 4 月月考 T14）设 $f^{\prime}(x)$ 是函数 $f(x)$ 的导数，$f^{\prime\prime}(x)$ 是函数 $f^{\prime}(x)$ 的导数，若方程 $f^{\prime\prime}(x)=0$ 有实数解 $x_0$，则称点 $(x_0,f(x_0))$ 为函数 $f(x)$ 的拐点。某同学经过探究发现：任何一个三次函数 $f(x)=ax^3+bx^2+cx+d\ (a\ne0)$ 都有拐点，任何一个三次函数都有对称中心，且拐点就是对称中心。设函数 $g(x)=x^3-3x^2+4x+2$，利用上述探究结果计算：$g\left(\frac1{2025}\right)+g\left(\frac2{2025}\right)+\cdots+g\left(\frac{4048}{2025}\right)+g\left(\frac{4049}{2025}\right)=$________。
  parts: *a1
  choices: []
  answer: "16196"
  fidelity_notes:
    - 源题为空格填空题，无选项。
