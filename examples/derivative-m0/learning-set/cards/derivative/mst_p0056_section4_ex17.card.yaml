solution:
  source_solution_summary: |
    求导得 $g^{\prime}(x)=3x^2-6x+4$，再求二阶导 $g^{\prime\prime}(x)=6x-6$。令 $g^{\prime\prime}(x)=0$ 得 $x=1$，且 $g(1)=4$，所以 $(1,4)$ 是 $g(x)$ 的拐点，也就是对称中心。于是关于 $x=1$ 对称的两个自变量满足 $g(x)+g(2-x)=8$。在
    $\frac1{2025},\frac2{2025},\ldots,\frac{4049}{2025}$ 中，除 $\frac{2025}{2025}=1$ 外，其余 4048 项两两配成 2024 对，每对和为 8，中间项为 4，所以总和为 $8\times2024+4=16196$。
  key_steps:
    - step_id: step_1
      statement: 求二阶导定位三次函数的拐点横坐标。
      formula_trace:
        from: $g(x)=x^3-3x^2+4x+2$
        to: $g^{\prime}(x)=3x^2-6x+4,\quad g^{\prime\prime}(x)=6x-6$
        operation: 连续求两次导。
        why: 题干把 $g^{\prime\prime}(x)=0$ 的解定义为拐点横坐标。
      source_ref: page_0056_ex17_solution
    - step_id: step_2
      statement: 得到对称中心。
      formula_trace:
        from: $g^{\prime\prime}(x)=6x-6=0$
        to: $x=1,\quad g(1)=4,\quad \text{中心为 }(1,4)$
        operation: 解方程并代入原函数。
        why: 源题给出三次函数的拐点就是对称中心。
      source_ref: page_0056_ex17_solution
    - step_id: step_3
      statement: 把对称中心翻译成函数值配对关系。
      formula_trace:
        from: 中心为 $(1,4)$
        to: $g(x)+g(2-x)=8$
        operation: 横坐标关于 1 对称，纵坐标关于 4 对称。
        why: 每一对对称点的函数值平均数为 4。
      source_ref: page_0056_ex17_solution
    - step_id: step_4
      statement: 对求和项两两配对并保留中心项。
      formula_trace:
        from: $\frac{k}{2025}+\frac{4050-k}{2025}=2\quad(k=1,\ldots,2024)$
        to: $2024\cdot8+g(1)=2024\cdot8+4=16196$
        operation: 将 $\frac{k}{2025}$ 与 $\frac{4050-k}{2025}$ 配成关于 1 对称的一对。
        why: 共有 2024 对对称项，另有中心项 $\frac{2025}{2025}=1$。
      source_ref: page_0056_ex17_solution
