  what_it_trains: 训练把三次函数的拐点转成中心对称关系，再把一长串函数值按自变量对称配对。
  recognition_cues:
    - 题干特别说明“三次函数拐点就是对称中心”。
    - 求和自变量从 $\frac1{2025}$ 到 $\frac{4049}{2025}$，围绕 1 对称。
