    - 把 $\frac{k}{2025}$ 与 $\frac{4050-k}{2025}$ 配对。
  common_failures:
    - 只找到 $x=1$，忘记还要算中心纵坐标 $g(1)$。
    - 把每对和写成 4，而不是 $2\times4=8$。
    - 把 4049 项误配成 2024 对后漏掉中间项。
