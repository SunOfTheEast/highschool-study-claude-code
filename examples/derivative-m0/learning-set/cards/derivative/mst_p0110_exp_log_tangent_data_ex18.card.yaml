original_problem:
  stem: （2023 景德镇模拟 T16）若曲线 $y=\ln x$ 在点 $P(x_1,y_1)$ 处的切线与曲线 $y=e^x$ 相切于点 $Q(x_2,y_2)$，则 $\frac{2}{x_1-1}+x_2=$ ______.
  parts: *a1
