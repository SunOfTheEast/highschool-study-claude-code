solution:
  source_solution_summary: |
    $y=\ln x$ 在 $P(x_1,\ln x_1)$ 处的切线为
    $y-\ln x_1=\frac1{x_1}(x-x_1)$，即
    $y=\frac1{x_1}x-1+\ln x_1$；$y=e^x$ 在
    $Q(x_2,e^{x_2})$ 处的切线为
    $y-e^{x_2}=e^{x_2}(x-x_2)$，即
    $y=e^{x_2}x+e^{x_2}(1-x_2)$。两条切线重合，所以
    $\frac1{x_1}=e^{x_2}$ 且
    $\ln x_1-1=e^{x_2}(1-x_2)$。由第一式得
    $x_2=-\ln x_1$，代回第二式得
    $\ln x_1-1=\frac1{x_1}(1+\ln x_1)$，即
    $\ln x_1-1=\frac2{x_1-1}$。于是
    $\frac2{x_1-1}+x_2=\ln x_1-1-\ln x_1=-1$。
  key_steps:
    - step_id: step_1
      statement: 分别写出两条曲线在指定切点处的切线方程。
      formula_trace:
        from: $P(x_1,\ln x_1),\quad Q(x_2,e^{x_2})$
        to: $y=\frac1{x_1}x-1+\ln x_1,\quad y=e^{x_2}x+e^{x_2}(1-x_2)$
        operation: 用导数斜率 $1/x_1$、$e^{x_2}$ 写点斜式，再整理成斜截式。
        why: 公切线相同意味着斜率和截距同时相同。
      source_ref: page_0110_ex18_solution
    - step_id: step_2
      statement: 匹配斜率和截距，得到切点数据方程组。
      formula_trace:
        from: $y=\frac1{x_1}x-1+\ln x_1$ 与 $y=e^{x_2}x+e^{x_2}(1-x_2)$ 重合
        to: $\frac1{x_1}=e^{x_2},\quad \ln x_1-1=e^{x_2}(1-x_2)$
        operation: 比较一次函数的 $x$ 系数和常数项。
        why: 这是把“同一条切线”转成代数关系的核心。
      source_ref: page_0110_ex18_solution
    - step_id: step_3
      statement: 由斜率关系把 $x_2$ 化为 $x_1$ 的对数。
      formula_trace:
        from: $\frac1{x_1}=e^{x_2}$
        to: $x_2=-\ln x_1$
        operation: 两边取自然对数。
        why: 目标式同时含 $x_1$ 和 $x_2$，先用同一变量表示。
      source_ref: page_0110_ex18_solution
    - step_id: step_4
      statement: 把截距关系化成目标式中的 $\frac2{x_1-1}$。
      formula_trace:
        from: $\ln x_1-1=\frac1{x_1}(1+\ln x_1)$
        to: $\ln x_1-1=\frac2{x_1-1}$
        operation: 两边乘以 $x_1$ 后移项，得到 $(x_1-1)\ln x_1=x_1+1$。
        why: 目标式中的分式正好等于 $\ln x_1-1$。
      source_ref: page_0110_ex18_solution
    - step_id: step_5
      statement: 代入目标式求值。
      formula_trace:
        from: $\frac2{x_1-1}=\ln x_1-1,\quad x_2=-\ln x_1$
        to: $\frac2{x_1-1}+x_2=-1$
        operation: 直接相加并消去 $\ln x_1$。
        why: 公切线条件使原本复杂的切点量组合变成定值。
      source_ref: page_0110_ex18_solution
teaching_card:
  student_title: 用同一条切线锁住两个切点
  what_it_trains: 训练把指对公切线题转成“斜率相同、截距相同”的两个方程，再消去切点变量求定值。
  recognition_cues:
    - 题干说一条切线既切 $y=\ln x$，又切 $y=e^x$。
    - 目标式含两个切点横坐标，优先用斜率关系把它们绑在一起。
    - 出现 $\frac2{x_1-1}$ 时，要从截距方程整理出同样的分式。
  normalization_moves:
    - 先写 $y=\frac1{x_1}x-1+\ln x_1$ 和 $y=e^{x_2}x+e^{x_2}(1-x_2)$。
    - 由斜率相同得到 $x_2=-\ln x_1$。
    - 由截距相同推出 $\ln x_1-1=\frac2{x_1-1}$。
  common_failures:
    - 只比较斜率，忘记同一条直线还要比较截距。
    - 把 $Q(x_2,y_2)$ 的纵坐标误写成 $\ln x_2$。
    - 代数整理时把 $\ln x_1-1$ 和 $\frac2{x_1-1}$ 的关系弄反。
  similar_practice_query: e^x ln x 公切线 切点数据 定值
