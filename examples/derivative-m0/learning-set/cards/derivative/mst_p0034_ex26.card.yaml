solution:
  source_solution_summary: |
    构造 $F(t)=e^t-e^{-t}+\sin2t$。由 $F'(t)=e^t+e^{-t}+2\cos2t\ge2+2\cos2t=4\cos^2t\ge0$，且无平区间，$F$ 在 $\mathbb R$ 上严格递增。原不等式等价于 $F(ax)>F(\ln x)$ 对一切 $x>0$ 成立，于是等价于 $ax>\ln x$ 对一切 $x>0$ 成立。即 $a>\frac{\ln x}{x}$ 对一切 $x>0$ 成立；而 $\frac{\ln x}{x}$ 的最大值为 $1/e$，所以 $a>1/e$，选 B。
  key_steps:
    - step_id: step_1
      statement: 构造能同时包住指数差和正弦项的同构函数。
      formula_trace:
        from: |
          $e^{ax}-x+\sin2ax>\frac1{e^{ax}}-\frac1x+\sin(\ln x^2)$
        to: |
          $e^{ax}-e^{-ax}+\sin2ax>x-\frac1x+\sin(\ln x^2)$
        operation: 把 $\frac1{e^{ax}}$ 移到左侧，把 $x$ 移到右侧，并把 $\frac1{e^{ax}}$ 写成 $e^{-ax}$。
        why: 左侧形成 $e^t-e^{-t}+\sin2t$ 中的 $t=ax$ 部分。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:31
    - step_id: step_2
      statement: 把右侧也统一成同一个函数的输入。
      formula_trace:
        from: |
          $x-\frac1x+\sin(\ln x^2)$
        to: |
          $e^{\ln x}-e^{-\ln x}+\sin(2\ln x)=F(\ln x)$
        operation: 用 $x=e^{\ln x}$、$1/x=e^{-\ln x}$、$\ln x^2=2\ln x$。
        why: 原不等式就能写成 $F(ax)>F(\ln x)$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:31
    - step_id: step_3
      statement: 证明 $F$ 单调递增。
      formula_trace:
        from: |
          $F'(t)=e^t+e^{-t}+2\cos2t$
        to: |
          $F'(t)\ge2+2\cos2t=4\cos^2t\ge0$
        operation: 用 $e^t+e^{-t}\ge2$，再用 $1+\cos2t=2\cos^2t$。
        why: 单调性允许把 $F(ax)>F(\ln x)$ 转成输入大小 $ax>\ln x$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:31
    - step_id: step_4
      statement: 把恒成立条件化为 $a$ 与 $\ln x/x$ 的比较。
      formula_trace:
        from: |
          $F(ax)>F(\ln x)\quad (x>0)$
        to: |
          $ax>\ln x\quad (x>0)\Rightarrow a>\frac{\ln x}{x}\quad (x>0)$
        operation: 利用 $F$ 严格递增，并因为 $x>0$ 可同除以 $x$。
        why: 求 $a$ 的最小下界变成求 $\frac{\ln x}{x}$ 的最大值。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:31
    - step_id: step_5
      statement: 求辅助函数最大值并处理严格不等号。
      formula_trace:
        from: |
          $\phi(x)=\frac{\ln x}{x}$
        to: |
          $\phi'(x)=\frac{1-\ln x}{x^2}$，最大值 $\phi(e)=\frac1e$
        operation: 求导得 $x<e$ 时增、$x>e$ 时减，最大点为 $x=e$。
        why: 因为原题是严格大于，$a$ 必须满足 $a>1/e$，对应选项 B。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0034/page_0034.md:31
teaching_card:
  student_title: 把两边统一成同一个 $e^t-e^{-t}+\sin2t$
  what_it_trains: 含 $e^{ax}$、$1/e^{ax}$、$x$、$1/x$ 和 $\sin(\ln x^2)$ 的不等式，不要逐项硬比；把右边的 $x$ 看成 $e^{\ln x}$，两边就变成同一个递增函数的两个输入。
  recognition_cues:
    - 一边出现 $e^{ax}$ 与 $1/e^{ax}$，另一边出现 $x$ 与 $1/x$。
    - $\sin2ax$ 与 $\sin(\ln x^2)$ 共享“二倍输入”结构。
    - 题目问 $a$ 的恒成立范围，最后常常落到 $a$ 与 $\ln x/x$ 的最大值比较。
  normalization_moves:
    - 把 $1/e^{ax}$ 写成 $e^{-ax}$。
    - 把 $x$、$1/x$ 写成 $e^{\ln x}$、$e^{-\ln x}$。
    - 把 $\ln x^2$ 写成 $2\ln x$。
    - 用 $e^t+e^{-t}\ge2$ 和 $1+\cos2t=2\cos^2t$ 证明外层函数递增。
  common_failures:
    - 只看到指数项，没有把 $x$ 统一成 $e^{\ln x}$。
    - 把 $\sin(\ln x^2)$ 误当成 $\sin^2(\ln x)$。
    - 求出 $a\ge1/e$ 后忘记原题是严格大于。
    - 在导数估计中停在 $2+2\cos2t$，没有化成 $4\cos^2t\ge0$。
  similar_practice_query: 双曲正弦 三角同构 恒成立 求参数 ln x / x 最大值
quality:
  confidence: high
  needs_review: false
  review_notes:
    - page_0034 原图确认例 26 导数估计处有连续加号式排版问题；已按 $2+2\cos2t=4\cos^2t\ge0$ 修正，数学含义明确，不需要人工决策。
    - 严格区间为 $(1/e,+\infty)$；$a=1/e$ 在 $x=e$ 处无法满足严格大于。
