stem: |-
  （2017 · 新课标 I）已知函数 $f(x)=ae^{2x}+(a-2)e^x-x$。
  1. 讨论 $f(x)$ 的单调性。
  2. 若 $f(x)$ 有两个零点，求 $a$ 的取值范围。
answer: |-
  第 (1) 问：当 $a\leqslant0$ 时，$f$ 在 $\mathbf R$ 上单调递减；当 $a>0$ 时，$f$ 在 $(-\infty,\ln\frac1a)$ 单调递减，在 $(\ln\frac1a,+\infty)$ 单调递增。第 (2) 问：$a\in(0,1)$。

  $f'(x)=2ae^{2x}+(a-2)e^x-1$。当 $a=0$ 时， $f'(x)=-2e^x-1<0$；当 $a<0$ 时， $f'(x)=2a(e^x+\frac12)(e^x-\frac1a)<0$，所以 $a\leqslant0$ 时 $f$ 在 $\mathbf R$ 上递减。当 $a>0$ 时， $f'(x)=(2e^x+1)(ae^x-1)$，临界点为 $x=\ln(1/a)$，先减后增。若 $f$ 有两个零点，则必须 $a>0$ 且 $f(\ln(1/a))=1-\frac1a-\ln\frac1a<0$。令 $g(u)=u+\ln u-1$，则 $g$ 单调递增且 $g(1)=0$，所以 $g(1/a)>0$ 等价于 $1/a>1$，即 $0<a<1$。充分性方面，左侧可用 $f(-1)>0$，或按主体客体分析取 $x=(a-2)/a$，夹出左零点；右侧把 $f(x)$ 写成 $e^x(ae^x+a-2-x/e^x)$，用 $x/e^x\leqslant1/e$，取 $x=\ln((3-a)/a)$，夹出右零点。故答案为 $(0,1)$。
