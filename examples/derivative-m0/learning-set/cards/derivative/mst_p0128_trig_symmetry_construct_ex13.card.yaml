solution:
  source_solution_summary: |
    由
    \[
    f^{\prime}(x)\sin2x+f(x)\cos2x<f(x)
    \]
    得
    \[
    f^{\prime}(x)\sin2x+f(x)(\cos2x-1)<0.
    \]
    代入 $\sin2x=2\sin x\cos x,\ \cos2x-1=-2\sin^2x$，化为
    \[
    2\sin x\,[f^{\prime}(x)\cos x-f(x)\sin x]<0.
    \]
    在 $x\in\left(0,\frac{\pi}{2}\right)$ 内 $\sin x>0$，故
    \[
    f^{\prime}(x)\cos x-f(x)\sin x<0.
    \]
    构造
    \[
    g(x)=f(x)\cos x,\qquad g^{\prime}(x)=f^{\prime}(x)\cos x-f(x)\sin x<0,
    \]
    所以 $g$ 在 $\left(0,\frac{\pi}{2}\right)$ 递减。

    又因 $f$ 在 $(0,\pi)$ 关于 $x=\frac{\pi}{2}$ 对称，任取 $x_1+x_2=\pi$ 有
    $f(x_1)=f(x_2)$，且 $\cos x_1=-\cos x_2$，故
    \[
    g(x_1)=f(x_1)\cos x_1=-f(x_2)\cos x_2=-g(x_2).
    \]
    即 $g$ 关于 $\left(\frac{\pi}{2},0\right)$ 中心对称，从而在
    $\left(\frac{\pi}{2},\pi\right)$ 也递减。

    于是
    \[
    g\!\left(\frac{\pi}{3}\right)<g\!\left(\frac{\pi}{4}\right)
    \Rightarrow
    f\!\left(\frac{\pi}{3}\right)<\sqrt2f\!\left(\frac{\pi}{4}\right),
    \]
    A 错；
    \[
    g\!\left(\frac{5\pi}{6}\right)<g\!\left(\frac{3\pi}{4}\right)
    \Rightarrow
    \sqrt3f\!\left(\frac{5\pi}{6}\right)>\sqrt2f\!\left(\frac{3\pi}{4}\right),
    \]
    B 错；
    \[
    g\!\left(\frac{5\pi}{6}\right)<g\!\left(\frac{2\pi}{3}\right)
    \Rightarrow
    3f\!\left(\frac{5\pi}{6}\right)>\sqrt3f\!\left(\frac{2\pi}{3}\right),
    \]
    C 错。
    再由对称性 $f\!\left(\frac{5\pi}{6}\right)=f\!\left(\frac{\pi}{6}\right)$，得
    \[
    \sqrt3f\!\left(\frac{\pi}{6}\right)>f\!\left(\frac{2\pi}{3}\right),
    \]
    D 正确。故选 D。
  key_steps:
    - step_id: step_1
      statement: 把题设不等式化为一阶线性组合。
      formula_trace:
        from: $f^{\\prime}(x)\\sin2x+f(x)\\cos2x<f(x)$
        to: $2\\sin x\\,[f^{\\prime}(x)\\cos x-f(x)\\sin x]<0$
        operation: 移项并用 $\\sin2x,\\cos2x-1$ 的恒等式化简。
        why: 为构造 $g(x)=f(x)\\cos x$ 的导数做准备。
      source_ref: page_0128
    - step_id: step_2
      statement: 先在 $(0,\\frac{\\pi}{2})$ 上判 $g$ 递减。
      formula_trace:
        from: $f^{\\prime}(x)\\cos x-f(x)\\sin x<0$
        to: $g(x)=f(x)\\cos x,\\ g^{\\prime}(x)<0$
        operation: 直接对应乘积求导结构。
        why: 把抽象函数约束落到单调性。
      source_ref: page_0129
    - step_id: step_3
      statement: 用关于 $x=\\frac{\\pi}{2}$ 的对称关系延展到 $(\\frac{\\pi}{2},\\pi)$。
      formula_trace:
        from: $f(x_1)=f(x_2),\\ x_1+x_2=\\pi,\\ \\cos x_1=-\\cos x_2$
        to: $g(x_1)=-g(x_2)$，故 $g$ 关于 $\\left(\\frac{\\pi}{2},0\\right)$ 中心对称并在 $(\\frac{\\pi}{2},\\pi)$ 递减
        operation: 把函数轴对称与余弦中心对称配凑。
        why: 后两项比较点都在 $(\\frac{\\pi}{2},\\pi)$。
      source_ref: page_0129
    - step_id: step_4
      statement: 按递减性判 A、B、C 全错。
      formula_trace:
        from: |
          $g\!\left(\frac{\pi}{3}\right)<g\!\left(\frac{\pi}{4}\right),\
          g\!\left(\frac{5\pi}{6}\right)<g\!\left(\frac{3\pi}{4}\right),\
          g\!\left(\frac{5\pi}{6}\right)<g\!\left(\frac{2\pi}{3}\right)$
        to: |
          $f\!\left(\frac{\pi}{3}\right)<\sqrt2f\!\left(\frac{\pi}{4}\right),\
          \sqrt3f\!\left(\frac{5\pi}{6}\right)>\sqrt2f\!\left(\frac{3\pi}{4}\right),\
          3f\!\left(\frac{5\pi}{6}\right)>\sqrt3f\!\left(\frac{2\pi}{3}\right)$
        operation: 代入对应余弦值并注意负号翻转。
        why: 直接反驳 A、B、C。
      source_ref: page_0129
    - step_id: step_5
      statement: 用对称性把 C 的结论转成 D。
      formula_trace:
        from: $f\\left(\\frac{5\\pi}{6}\\right)=f\\left(\\frac{\\pi}{6}\\right)$ 且 $\\sqrt3f\\left(\\frac{5\\pi}{6}\\right)>f\\left(\\frac{2\\pi}{3}\\right)$
        to: $\\sqrt3f\\left(\\frac{\\pi}{6}\\right)>f\\left(\\frac{2\\pi}{3}\\right)$
        operation: 用轴对称点替换函数值。
        why: 得到唯一必真选项 D。
      source_ref: page_0129
teaching_card:
  student_title: 先构造 $f\\cos x$，再用对称把单调性跨过 $\\frac{\\pi}{2}$
  what_it_trains: 训练“导数构造 + 对称配凑”联动：先在半区间判单调，再借轴对称/中心对称覆盖整段比较。
  recognition_cues:
    - 题设含 $f^{\\prime}(x)\\sin2x+f(x)\\cos2x$。
    - 额外给出“图像关于 $x=\\frac{\\pi}{2}$ 对称”。
    - 选项比较点同时出现在 $(0,\\frac{\\pi}{2})$ 和 $(\\frac{\\pi}{2},\\pi)$。
  normalization_moves:
    - 化简到 $f^{\\prime}(x)\\cos x-f(x)\\sin x<0$。
    - 设 $g=f\\cos x$，判 $(0,\\frac{\\pi}{2})$ 递减。
    - 用 $x_1+x_2=\\pi$ 得 $g(x_1)=-g(x_2)$，延展右半区单调性。
    - 逐项比较并利用对称替换锁定 D。
  common_failures:
    - 把 $\\cos2x-1$ 误写成 $1-\\cos2x$ 导致符号反。
    - 只证明左半区递减，没有处理右半区选项。
    - 负余弦参与比较时忘记翻转方向。
    - 知道 $f\\left(\\frac{5\\pi}{6}\\right)=f\\left(\\frac{\\pi}{6}\\right)$ 却没回代到 D。
