solution:
  source_solution_summary: |
    将三条等式解释为交点横坐标：
    \[
    e^a=-\ln a \Rightarrow a \text{ 是 } y=e^x \text{ 与 } y=-\ln x \text{ 的交点横坐标};
    \]
    \[
    e^{-b}=\ln b \Rightarrow b \text{ 是 } y=e^{-x} \text{ 与 } y=\ln x \text{ 的交点横坐标};
    \]
    \[
    e^{-c}=-\ln c \Rightarrow c \text{ 是 } y=e^{-x} \text{ 与 } y=-\ln x \text{ 的交点横坐标}.
    \]
    在同一坐标系作出四条曲线后，按图像读得交点横坐标顺序
    \[
    a<c<b.
    \]
    故选 B。
  key_steps:
    - step_id: step_1
      statement: 把每个等式转写成两条函数曲线的交点条件。
      formula_trace:
        from: $e^a=-\ln a,\ e^{-b}=\ln b,\ e^{-c}=-\ln c$
        to: $a,c,b$ 分别对应三组交点横坐标
        operation: 把“左式=右式”解释为“同一 $x$ 处两函数值相等”。
        why: 统一到“交点横坐标比较”这一可视化目标。
      source_ref: page_0152_ex30_problem
    - step_id: step_2
      statement: 在同一坐标系放置四条曲线并读取交点位置。
      formula_trace:
        from: $y=e^x,\ y=e^{-x},\ y=\ln x,\ y=-\ln x$
        to: $a<c<b$
        operation: 数形结合读取 x 轴上三个交点的先后位置。
        why: 图像直接给出所求顺序。
      source_ref: page_0152_ex30_figure
    - step_id: step_3
      statement: 对应选项。
      formula_trace:
        from: $a<c<b$
        to: 选 B
        operation: 与选项对照。
        why: 完成作答。
      source_ref: page_0152_ex30_solution
teaching_card:
  student_title: 四条指数对数曲线同图读交点顺序
  what_it_trains: 训练把“方程定义变量”转成“交点横坐标”后，用一张图完成多变量比大小。
  recognition_cues:
    - 条件全是“某指数式=某对数式”。
    - 未知量出现在函数自变量位置。
    - 题型是三数排序单选。
  normalization_moves:
    - 先给每个未知量配一对交点曲线。
    - 把所有曲线放到同一坐标系。
    - 按 x 轴位置一次性读出顺序。
  common_failures:
    - 把 $e^{-b}=\ln b$ 误画成 $e^b=\ln b$。
    - 忽略 $\ln x$ 只在 $x>0$ 有定义，导致错判交点。
    - 分开比较两两关系，遗漏全序链。
  similar_practice_query: 指数对数 交点横坐标 四曲线同图 比大小
