stem: |-
  （2023·小店区月考）若 $e^a=-\ln a$，$e^{-b}=\ln b$，$e^{-c}=-\ln c$，则（  ）
  A. $a<b<c$
  B. $a<c<b$
  C. $b<c<a$
  D. $b<a<c$
answer: |
  B

  将三条等式解释为交点横坐标：
  \[
  e^a=-\ln a \Rightarrow a \text{ 是 } y=e^x \text{ 与 } y=-\ln x \text{ 的交点横坐标};
  \]
  \[
  e^{-b}=\ln b \Rightarrow b \text{ 是 } y=e^{-x} \text{ 与 } y=\ln x \text{ 的交点横坐标};
  \]
  \[
  e^{-c}=-\ln c \Rightarrow c \text{ 是 } y=e^{-x} \text{ 与 } y=-\ln x \text{ 的交点横坐标}.
  \]
  在同一坐标系作出四条曲线后，按图像读得交点横坐标顺序
  \[
  a<c<b.
  \]
  故选 B。
