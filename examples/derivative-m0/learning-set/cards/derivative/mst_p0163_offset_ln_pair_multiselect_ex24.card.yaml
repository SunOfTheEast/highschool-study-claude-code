solution:
  source_solution_summary: |
    先由
    \[
    \frac1{2.86}\approx0.3497
    \]
    令
    \[
    f(x)=\frac{\ln x}{x}\quad(x>1).
    \]
    则
    \[
    \frac{\ln a}{a}=\frac{\ln b}{b}=0.3497.
    \]
    若 $f(a)=f(b)$ 且 $a<b$，源解得
    \[
    1<a<e<b,
    \]
    并据“极大值点左偏”推出
    \[
    a+b>2e.
    \]
    所以 A（$a+b<2e$）错误。

    再设
    \[
    g(x)=x\ln x=-\frac{\ln(1/x)}{1/x}=-f\!\left(\frac1x\right)\quad(0<x<1).
    \]
    由
    \[
    c\ln c=d\ln d=-0.35,\ c<d
    \]
    得
    \[
    0<c<\frac1e<d<1,
    \]
    且源解据“极小值点左偏”得到
    \[
    c+d>\frac2e.
    \]
    故 B 正确。

    对 C：由 $-f(1/d)=g(d)$ 以及源解给出的比较
    \[
    -f\!\left(\frac1d\right)+f(a)<0
    \Rightarrow
    f\!\left(\frac1d\right)>f(a).
    \]
    又 $f$ 在 $(1,e)$ 递增，故
    \[
    \frac1d>a\Rightarrow ad<1.
    \]
    C 正确。

    对 D：由 $-f(1/c)=g(c)=-0.35$ 与源解比较
    \[
    -f\!\left(\frac1c\right)+f(b)<0
    \Rightarrow
    f(b)<f\!\left(\frac1c\right).
    \]
    且 $b>e,\ \frac1c>e$，$f$ 在 $(e,+\infty)$ 递减，所以
    \[
    \frac1c<b\Rightarrow bc>1.
    \]
    D 正确。

    综上选 BCD。
  key_steps:
    - step_id: step_1
      statement: 把 $a,b$ 条件统一到 $f(x)=\\frac{\\ln x}{x}$。
      formula_trace:
        from: $\\frac{a}{\\ln a}=\\frac{b}{\\ln b}=2.86$
        to: $f(a)=f(b)=\\frac1{2.86}\\approx0.3497$
        operation: 取倒数并定义 $f$。
        why: 引入“同值点 + 峰值偏移”主框架。
      source_ref: page_0164_ex24_solution
    - step_id: step_2
      statement: 用偏移结论判 A。
      formula_trace:
        from: $f(a)=f(b)$ 且 $a<b$
        to: $1<a<e<b$ 且 $a+b>2e$
        operation: 按源解使用 $f$ 在峰值点附近的偏移判定。
        why: A 命题与该结论相反，因此 A 错。
      source_ref: page_0164_ex24_solution
    - step_id: step_3
      statement: 把 $c,d$ 条件统一到 $g(x)=x\\ln x$。
      formula_trace:
        from: $c\\ln c=d\\ln d=-0.35$
        to: $g(c)=g(d)$，其中 $g(x)=x\\ln x=-f(1/x)$
        operation: 定义互换函数并代入。
        why: 把第二组条件转为同值点偏移比较。
      source_ref: page_0164_ex24_solution
    - step_id: step_4
      statement: 用偏移结论判 B。
      formula_trace:
        from: $0<c<\\frac1e<d<1$ 且 $g(c)=g(d)$
        to: $c+d>\\frac2e$
        operation: 按源解使用极小值点左偏结论。
        why: B 正确。
      source_ref: page_0164_ex24_solution
    - step_id: step_5
      statement: 比较 $f(1/d)$ 与 $f(a)$ 判 C。
      formula_trace:
        from: $-f(1/d)+f(a)<0$
        to: $f(1/d)>f(a)\\Rightarrow 1/d>a\\Rightarrow ad<1$
        operation: 先代数移项，再用 $(1,e)$ 递增保序。
        why: 得到 C 正确。
      source_ref: page_0164_ex24_solution
    - step_id: step_6
      statement: 比较 $f(1/c)$ 与 $f(b)$ 判 D。
      formula_trace:
        from: $-f(1/c)+f(b)<0$
        to: $f(b)<f(1/c)\\Rightarrow 1/c<b\\Rightarrow bc>1$
        operation: 在 $(e,+\\infty)$ 递减区做反向保序。
        why: 得到 D 正确。
      source_ref: page_0164_ex24_solution
    - step_id: step_7
      statement: 汇总多选结论。
      formula_trace:
        from: A 错，B 对，C 对，D 对
        to: 选 BCD
        operation: 逐项合并。
        why: 完成作答。
      source_ref: page_0164_ex24_solution
teaching_card:
  student_title: 双同值点偏移：先判和，再判乘积
  what_it_trains: 训练在多选题里把两组同值条件统一到偏移模型，再分区间用单调性落地到乘积结论。
  recognition_cues:
    - 题干同时出现 $\\frac{x}{\\ln x}$ 与 $x\\ln x$ 两类等值条件。
    - 给出 $a<b,c<d$，通常对应“同值点左右位置”信息。
    - 选项既有和比较也有乘积比较。
  normalization_moves:
    - 先统一函数：$f(x)=\\frac{\\ln x}{x}$。
    - 再用 $g(x)=x\\ln x=-f(1/x)$ 连接第二组条件。
    - 最后按区间单调性分别判 C、D。
  common_failures:
    - 把 A 的方向看反（应为 $a+b>2e$）。
    - 忘记 $0<c<1/e<d<1$，导致 C、D 比较基点错位。
    - 在 $(e,+\\infty)$ 递减区仍按“自变量大函数值大”处理。
  similar_practice_query: lnx/x xlnx 同值点 偏移 多选 ad<1 bc>1
