original_problem:
  stem: (2024 金凤区三模 T8) 若函数 $f(x)=x^2\ln x+ax$ 存在减区间，则 $a$ 的取值范围为 ( )
  parts: *a1
  choices:
    - label: A
      text: $(\mathrm{e}^{-\frac32},+\infty)$
    - label: B
      text: $(2\mathrm{e}^{-\frac32},+\infty)$
    - label: C
      text: $(-\infty,\mathrm{e}^{-\frac32})$
    - label: D
      text: $(-\infty,2\mathrm{e}^{-\frac32})$
  answer: D. $(-\infty,2\mathrm{e}^{-\frac32})$
  fidelity_notes:
    - 题头、题干和完整解析均在 page_0019。
    - 源图与 markdown 对 $2\mathrm{e}^{-3/2}$ 和开区间端点一致。
solution:
  source_solution_summary: 函数定义域为 $x>0$。由 $f'(x)=2x\ln x+x+a$，存在减区间等价于 $f'(x)<0$ 对某个 $x>0$ 有解，即 $a<-2x\ln x-x$ 有解。将右端化为 $-\frac{2}{\sqrt e}(\sqrt e x\ln(\sqrt e x))$。令 $u=\sqrt e x$， 因 $u\ln u$ 的最小值为 $-1/e$，右端最大值为 $2e^{-3/2}$，故 $a<2e^{-3/2}$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把存在减区间转为导数小于 0 有解。
      formula_trace:
        from: $f(x)=x^2\ln x+ax$
        to: $f'(x)=2x\ln x+x+a,\quad f'(x)<0\ \text{有解}$
        operation: 对 $x^2\ln x$ 和 $ax$ 求导，并使用减区间的导数判据。
        why: 只要某处导数为负，就存在局部减区间。
      source_ref: page_0019_solution
    - step_id: step_2
      statement: 分离参数，得到 a 必须小于某个可变上界。
      formula_trace:
        from: $2x\ln x+x+a<0$
        to: $a<-2x\ln x-x=-2x\left(\ln x+\frac12\right)$
        operation: 把 a 移到一边，并把 $x$ 合并为 $2x\cdot\frac12$。
        why: 存在性问题转为求右端函数的最大可取值。
      source_ref: page_0019_solution
    - step_id: step_3
      statement: 把右端同构成 $u\ln u$。
      formula_trace:
        from: $-2x\left(\ln x+\frac12\right)$
        to: $-2x\ln(\sqrt e x)=-\frac2{\sqrt e}\left(\sqrt e x\ln(\sqrt e x)\right)$
        operation: 用 $\ln x+\frac12=\ln(\sqrt e x)$，再令 $u=\sqrt e x$。
        why: $u\ln u$ 的最小值是熟悉模型，乘负系数后给出最大值。
      source_ref: page_0019_solution
    - step_id: step_4
      statement: 由最大门槛确定开区间。
      formula_trace:
        from: $\min_{u>0}u\ln u=-\frac1e$
        to: $\max_{x>0}\left[-\frac2{\sqrt e}u\ln u\right]=\frac2{e^{3/2}},\quad a<2e^{-3/2}$
        operation: 负倍数把最小值转为最大值；存在解要求 a 严格小于该最大值。
        why: 当 a 等于最大门槛时，导数最小值为 0，不会出现 $f'(x)<0$ 的减区间。
      source_ref: page_0019_solution
teaching_card:
  student_title: 存在减区间：让导数真的小于 0，再找参数门槛
  what_it_trains: 训练把存在性条件转成导数负值有解，并把含 $\ln x+\frac12$ 的表达式同构到 $u\ln u$ 求临界值。
  recognition_cues:
    - 题干说“存在减区间”，不是“恒单调递减”。
    - 求导后出现 $2x\ln x+x+a$，可以把 a 分离出来。
    - 表达式 $\ln x+\frac12$ 暗示配成 $\ln(\sqrt e x)$。
  normalization_moves:
    - 先写 $f'(x)<0$ 有解。
    - 把不等式变成 $a<-2x\ln x-x$。
    - 把右端配成负倍数的 $u\ln u$，注意取最大值时用 $u\ln u$ 的最小值。
  common_failures:
    - 把边界写成 $a\le2e^{-3/2}$，忽略等号时没有负导数。
    - 把 $u\ln u$ 的最小值误记为 $1/e$。
    - 配系数时漏掉 $1/\sqrt e$，导致边界少一个 $e^{-1/2}$。
  similar_practice_query: 存在减区间 参数范围 x^2lnx+ax ulnu 最值
