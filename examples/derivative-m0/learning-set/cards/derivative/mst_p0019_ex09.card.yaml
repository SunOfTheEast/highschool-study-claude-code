stem: |-
  (2024 金凤区三模 T8) 若函数 $f(x)=x^2\ln x+ax$ 存在减区间，则 $a$ 的取值范围为 ( )
  A. $(\mathrm{e}^{-\frac32},+\infty)$
  B. $(2\mathrm{e}^{-\frac32},+\infty)$
  C. $(-\infty,\mathrm{e}^{-\frac32})$
  D. $(-\infty,2\mathrm{e}^{-\frac32})$
answer: |-
  D. $(-\infty,2\mathrm{e}^{-\frac32})$

  函数定义域为 $x>0$。由 $f'(x)=2x\ln x+x+a$，存在减区间等价于 $f'(x)<0$ 对某个 $x>0$ 有解，即 $a<-2x\ln x-x$ 有解。将右端化为 $-\frac{2}{\sqrt e}(\sqrt e x\ln(\sqrt e x))$。令 $u=\sqrt e x$， 因 $u\ln u$ 的最小值为 $-1/e$，右端最大值为 $2e^{-3/2}$，故 $a<2e^{-3/2}$，选 D。
