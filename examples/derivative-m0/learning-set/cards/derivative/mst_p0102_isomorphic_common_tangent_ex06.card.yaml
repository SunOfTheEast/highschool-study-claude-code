solution:
  source_solution_summary: |
    设公切线分别切于
    $A(x_1,x_1^2-(a+1))$ 与 $B(x_2,a\ln x_2-1)$。由导数相等和
    两切点连线斜率等于切线斜率，
    $k=2x_1=\frac{a}{x_2}
    =\frac{x_1^2-(a+1)-a\ln x_2+1}{x_1-x_2}$。
    由 $2x_1=\frac{a}{x_2}$ 得 $x_1=\frac{a}{2x_2}$，代回并整理：
    $\frac{a^2}{4x_2^2}=-a\ln x_2$，
    所以 $a=-4x_2^2\ln x_2=-2x_2^2\ln x_2^2$。
    令 $t=x_2^2>0$，则 $a=-2t\ln t\le\frac2e$，
    等号在 $t=e^{-1}$ 即 $x_2=e^{-1/2}$ 时取到，故选 A。
  key_steps:
    - step_id: step_1
      statement: 设两条曲线上的切点并写斜率关系。
      formula_trace:
        from: |
          $y=x^2-(a+1),\quad y'=2x;\qquad y=a\ln x-1,\quad y'=\frac{a}{x}$
        to: |
          $k=2x_1=\frac{a}{x_2}$
        operation: 分别对两条曲线求导，并令公切线在两个切点处斜率相同。
        why: 公切线的同一斜率要同时等于两条曲线在各自切点处的导数。
      source_ref: page_0102
    - step_id: step_2
      statement: 把同一条直线经过两个切点写成连线斜率。
      formula_trace:
        from: |
          $A(x_1,x_1^2-(a+1)),\quad B(x_2,a\ln x_2-1)$
        to: |
          $2x_1=\frac{x_1^2-(a+1)-a\ln x_2+1}{x_1-x_2}$
        operation: 用两切点纵差除以横差表示公切线斜率。
        why: 同一条切线既切于两点，也经过两切点。
      source_ref: page_0102
    - step_id: step_3
      statement: 消去 $x_1$，把参数 $a$ 化成只含 $x_2$ 的式子。
      formula_trace:
        from: |
          $x_1=\frac{a}{2x_2},\quad
          \frac{a}{x_2}=\frac{\frac{a^2}{4x_2^2}-a-a\ln x_2}{\frac{a}{2x_2}-x_2}$
        to: |
          $\frac{a^2}{2x_2^2}-a=\frac{a^2}{4x_2^2}-a-a\ln x_2,\qquad
          \frac{a^2}{4x_2^2}=-a\ln x_2$
        operation: 代入 $x_1$ 后交叉相乘并整理同类项。
        why: 先降到一个切点变量，后面才能做单变量最值。
      source_ref: page_0102
    - step_id: step_4
      statement: 同构到 $-t\ln t$ 求最大值。
      formula_trace:
        from: |
          $\frac{a^2}{4x_2^2}=-a\ln x_2$
        to: |
          $a=-4x_2^2\ln x_2=-2x_2^2\ln x_2^2=-2t\ln t\le\frac2e$
        operation: 令 $t=x_2^2>0$，调用 $-t\ln t$ 在 $t=e^{-1}$ 处取最大值 $1/e$。
        why: 源页把公切线问题归到六大同构函数的最值。
      source_ref: page_0102
teaching_card:
  student_title: 把二次和对数的公切线化成 $-t\ln t$
  what_it_trains: 训练用两个切点写公切线条件，再把参数最大值压缩成一个熟悉的同构函数最值。
  recognition_cues:
    - 题目说同一条直线分别是两条曲线的切线，不一定在同一点相切。
    - 一条是二次函数，一条是含 $a\ln x$，常会整理出 $x^2\ln x$ 型同构。
    - 问 $a$ 的最大值，说明要把 $a$ 表成一个正变量的函数。
  normalization_moves:
    - 分别设两个切点 $x_1,x_2$。
    - 用 $2x_1=\frac{a}{x_2}$ 先消去 $x_1$。
    - 把 $a$ 写成 $-2t\ln t$ 后直接取最大值。
  common_failures:
    - 误把公切线理解成公共点处的切线，少设一个切点。
    - 两切点连线斜率的纵差中漏掉常数 $-(a+1)$ 与 $-1$ 的抵消。
    - 从 $-4x_2^2\ln x_2$ 到 $-2x_2^2\ln x_2^2$ 时漏掉系数 $2$。
  similar_practice_query: 二次函数 对数函数 公切线 $-t\\ln t$ 参数最大值
quality:
