solution:
  source_solution_summary: 将 $y=|\ln x|$ 写成左支 $-\ln x$ 与右支 $\ln x$。设 $P_1(x_1,-\ln x_1)$，$0<x_1<1$，$P_2(x_2,\ln x_2)$，$x_2>1$。 两条切线斜率分别为 $-1/x_1$ 与 $1/x_2$，垂直给出 $x_1x_2=1$。 写出两条切线并联立，得 $x_P=\frac{2x_1x_2}{x_1+x_2}=\frac{2}{x_1+1/x_1}\in(0,1)$。 y 轴截距为 $A(0,1-\ln x_1)$、$B(0,\ln x_2-1)$，所以 $|AB|=2$，面积 $S=\frac12|AB|\cdot x_P=x_P\in(0,1)$。续页再算： 纵坐标积为 $\ln^2x_1$，不为定值；$P_1P_2$ 的斜率为 $-\ln(x_1x_2)/(x_1-x_2)=0$，为定值。故选 BCD。
  key_steps:
    - step_id: step_1
      statement: 把绝对值对数拆成左右两支并设切点。
      formula_trace:
        from: $y=|\ln x|=\begin{cases}-\ln x,&0<x<1\\ \ln x,&x\ge1\end{cases}$
        to: $P_1(x_1,-\ln x_1)$，$0<x_1<1$； $P_2(x_2,\ln x_2)$，$x_2>1$。
        operation: 按 $x=1$ 分支设两个不重合切点。
        why: 互相垂直的一负一正斜率自然来自绝对值函数的左右两支。
      source_ref: page_0078
    - step_id: step_2
      statement: 用垂直切线把两个横坐标绑定。
      formula_trace:
        from: $k_{l_1}=-\frac1{x_1}$，$k_{l_2}=\frac1{x_2}$， $l_1\perp l_2$。
        to: $-\frac1{x_1}\cdot\frac1{x_2}=-1\Rightarrow x_1x_2=1$。
        operation: 切线斜率乘积为 -1。
        why: 这是后面所有“定值”的核心约束。
      source_ref: page_0078
    - step_id: step_3
      statement: 写切线方程，求交点 P 的横坐标。
      formula_trace:
        from: $l_1:y+\ln x_1=-\frac1{x_1}(x-x_1)$， $l_2:y-\ln x_2=\frac1{x_2}(x-x_2)$。
        to: $x_P=\frac{2x_1x_2}{x_1+x_2} =\frac{2}{x_1+1/x_1}\in(0,1)$。
        operation: 联立两条切线，并代入 $x_1x_2=1$。
        why: P 到 y 轴的距离就是后面三角形面积的高。
      source_ref: page_0078
    - step_id: step_4
      statement: 求 y 轴截距并得到 $AB$ 和面积。
      formula_trace:
        from: $A(0,1-\ln x_1)$，$B(0,\ln x_2-1)$。
        to: $|AB|=|1-\ln x_1-(\ln x_2-1)| =|2-\ln(x_1x_2)|=2$， $S_{\triangle ABP}=\frac12|AB|\cdot x_P=x_P\in(0,1)$。
        operation: 在切线方程中令 $x=0$，再用 $x_1x_2=1$。
        why: C 的定长和 D 的面积范围都由同一个参数 $x_P$ 控制。
      source_ref: page_0078
    - step_id: step_5
      statement: 续页判断 A、B 两个“定值”命题。
      formula_trace:
        from: 纵坐标积 $(-\ln x_1)(\ln x_2)$，直线 $P_1P_2$ 斜率 $\frac{-\ln x_1-\ln x_2}{x_1-x_2}$。
        to: $(-\ln x_1)(\ln x_2)=\ln^2x_1$ 不为定值； $\frac{-\ln(x_1x_2)}{x_1-x_2}=0$ 为定值。
        operation: 把 $x_2=1/x_1$ 代入两个表达式。
        why: 纵坐标积仍随 $x_1$ 变，而两切点连线水平。
      source_ref: page_0079
teaching_card:
  student_title: 两条垂直切线把切点乘积锁成 1
  what_it_trains: 训练在绝对值对数曲线中按分支设切点，用垂直关系消掉一个参数，再把截距、 斜率和面积都转成同一个变量判断。
  recognition_cues:
    - 题干出现 $|\ln x|$，要先拆成 $0<x<1$ 与 $x\ge1$。
    - 两条切线互相垂直，一条斜率负、一条斜率正。
    - 选项集中问“定值”和“面积范围”，提示先找不变量。
  normalization_moves:
    - 设 $P_1(x_1,-\ln x_1)$、$P_2(x_2,\ln x_2)$。
    - 用 $k_1k_2=-1$ 得 $x_1x_2=1$。
    - 令切线方程中 $x=0$ 求 A、B。
    - 用 $x_P$ 表示三角形面积。
  common_failures:
    - 把两个切点都设在同一支，导致斜率不可能垂直。
    - 求 B 点截距时把 $-1$ 写成 $+1$。
    - 只算出 $|AB|=2$，却忘了面积高是 $x_P$。
    - 看到 $\ln^2x_1$ 误以为是常数。
  similar_practice_query: 绝对值对数 垂直切线 切点乘积 截距定值 面积范围
