stem: |-
  （2023 南通二模 · 多选 T12）过平面内一点 $P$ 作曲线 $y=|\ln x|$ 两条互相垂直的切线 $l_1$、$l_2$，切点为 $P_1$、$P_2$ （$P_1$、$P_2$ 不重合），设直线 $l_1$、$l_2$ 分别与 $y$ 轴交于点 $A$、$B$，则（  ）
  A. $P_1$、$P_2$ 两点的纵坐标之积为定值。
  B. 直线 $P_1P_2$ 的斜率为定值。
  C. 线段 $AB$ 的长度为定值。
  D. $\triangle ABP$ 面积的取值范围为 $(0,1)$。
answer: |-
  BCD

  将 $y=|\ln x|$ 写成左支 $-\ln x$ 与右支 $\ln x$。设 $P_1(x_1,-\ln x_1)$，$0<x_1<1$，$P_2(x_2,\ln x_2)$，$x_2>1$。 两条切线斜率分别为 $-1/x_1$ 与 $1/x_2$，垂直给出 $x_1x_2=1$。 写出两条切线并联立，得 $x_P=\frac{2x_1x_2}{x_1+x_2}=\frac{2}{x_1+1/x_1}\in(0,1)$。 y 轴截距为 $A(0,1-\ln x_1)$、$B(0,\ln x_2-1)$，所以 $|AB|=2$，面积 $S=\frac12|AB|\cdot x_P=x_P\in(0,1)$。续页再算： 纵坐标积为 $\ln^2x_1$，不为定值；$P_1P_2$ 的斜率为 $-\ln(x_1x_2)/(x_1-x_2)=0$，为定值。故选 BCD。
