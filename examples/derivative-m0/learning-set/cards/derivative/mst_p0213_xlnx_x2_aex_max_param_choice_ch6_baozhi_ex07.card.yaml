solution:
  source_solution_summary: 由 $x\ln x-x^2-x-ae^x\ge0$（$x>0$）两边除以 $x$，得 $-a\frac{e^x}{x}-(x-\ln x)-1\ge0$，即 $-ae^{x-\ln x}-(x-\ln x)-1\ge0$。设 $t=x-\ln x$，则 $t\ge1$，问题化为 $-ae^t-t-1\ge0\ (t\ge1)$。source 在续页给出两种等价处理： 一是写成 $e^{t-1}-(t-1)-1-1+(-ae-1)e^{t-1}\ge0$，利用 $e^{t-1}-(t-1)-1\ge0$ 并在取等点 $t=1$ 处卡出 $-1+(-ae-1)\ge0$；二是直接变形为 $-a\ge\frac{t+1}{e^t}=h(t)$，且 $h^{\prime}(t)=-\frac{t}{e^t}<0$，故 $h(t)\le h(1)=\frac2e$。两路均得 $-a\ge\frac2e$，即 $a\le-\frac2e$，所以最大值为 $-\frac2e$，选 A。
  key_steps:
    - step_id: step_1
      statement: 先除以正数 $x$，把变量聚焦到 $x-\\ln x$。
      formula_trace:
        from: $x\ln x-x^2-x-ae^x\ge0\ (x>0)$
        to: $-ae^{x-\ln x}-(x-\ln x)-1\ge0$
        operation: 两边同除以 $x$，并用 $\frac{e^x}{x}=e^{x-\ln x}$。
        why: 将混合项统一为单一同构变量。
      source_ref: page_0213_ex07_solution_start
    - step_id: step_2
      statement: 作换元 $t=x-\\ln x$，把原题转为单变量恒成立。
      formula_trace:
        from: $x-\ln x\ge1$
        to: $-ae^t-t-1\ge0\quad(t\ge1)$
        operation: 设 $t=x-\ln x$，用其定义域下界 $1$。
        why: “对任意 $x>0$”转化为“对任意 $t\ge1$”。
      source_ref: page_0214_ex07_solution_continuation
    - step_id: step_3
      statement: 用 $h(t)=\frac{t+1}{e^t}$ 的单调性得到必要上界。
      formula_trace:
        from: $-ae^t-t-1\ge0$
        to: $-a\ge h(t)=\frac{t+1}{e^t},\ h^{\prime}(t)=-\frac{t}{e^t}<0,\ h(1)=\frac2e$
        operation: 移项除以 $e^t>0$，再求导判 $h$ 递减。
        why: 把参数条件转化成对区间最大值的比较。
      source_ref: page_0214_ex07_solution_continuation
    - step_id: step_4
      statement: 取区间上确界得到参数界。
      formula_trace:
        from: $-a\ge h(t)$ 对所有 $t\ge1$ 成立
        to: $-a\ge h(1)=\frac2e\Rightarrow a\le-\frac2e$
        operation: 利用递减函数在左端点取最大值。
        why: 得到恒成立所需且充分的参数上界。
      source_ref: page_0214_ex07_solution_continuation
    - step_id: step_5
      statement: 读出“最大值”并对应选项。
      formula_trace:
        from: $a\le-\frac2e$
        to: $a_{\max}=-\frac2e$，选 A
        operation: 在可行区间上取最大端点。
        why: 题目问的是最大值而非全区间。
      source_ref: page_0214_ex07_solution_continuation
teaching_card:
  student_title: 先换元再看单调：恒成立题的最大参数
  what_it_trains: 训练“恒成立求最大参数”中最稳的路线：变量同构换元、参数分离、区间最值比较。
  recognition_cues:
    - 题干有“对任意 $x>0$ 恒成立 + 求参数最大值”。
    - 式中同时出现 $x\ln x$ 与 $ae^x$，适合先除以 $x$。
    - 解析会落到 $x-\ln x$ 与 $e^t$ 的组合。
  normalization_moves:
    - 先做 $\div x$，把式子统一到 $x-\ln x$。
    - 设 $t=x-\ln x$，把定义域收成 $t\ge1$。
    - 改写成 $-a\ge h(t)$，用 $h$ 的单调性读出端点值。
  common_failures:
    - 忘记 $x>0$ 就直接除以 $x$，导致等价性说明不完整。
    - 把 $h^{\prime}(t)$ 号判断错，误把最大值放到 $t\to+\infty$。
    - 求出 $a\le-\frac2e$ 后误填成“最小值”而非“最大值”。
  similar_practice_query: xlnx-x^2-x-ae^x 恒成立 参数最大值 x-lnx 换元
