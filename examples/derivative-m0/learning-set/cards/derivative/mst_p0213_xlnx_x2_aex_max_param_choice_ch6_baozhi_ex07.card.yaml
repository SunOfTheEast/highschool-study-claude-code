stem: |-
  （2023 · 江西乐安二中高二期末 T8）不等式 $x\ln x-x^2-x-ae^x\geqslant0$ 对任意 $x>0$ 都成立，则实数 $a$ 的最大值为（  ）
  A. $-\frac2e$
  B. $-\frac{3}{2e}$
  C. $-\frac1e$
  D. $-1$
answer: |-
  A；$a_{\max}=-\frac2e$。

  由 $x\ln x-x^2-x-ae^x\ge0$（$x>0$）两边除以 $x$，得 $-a\frac{e^x}{x}-(x-\ln x)-1\ge0$，即 $-ae^{x-\ln x}-(x-\ln x)-1\ge0$。设 $t=x-\ln x$，则 $t\ge1$，问题化为 $-ae^t-t-1\ge0\ (t\ge1)$。source 在续页给出两种等价处理： 一是写成 $e^{t-1}-(t-1)-1-1+(-ae-1)e^{t-1}\ge0$，利用 $e^{t-1}-(t-1)-1\ge0$ 并在取等点 $t=1$ 处卡出 $-1+(-ae-1)\ge0$；二是直接变形为 $-a\ge\frac{t+1}{e^t}=h(t)$，且 $h^{\prime}(t)=-\frac{t}{e^t}<0$，故 $h(t)\le h(1)=\frac2e$。两路均得 $-a\ge\frac2e$，即 $a\le-\frac2e$，所以最大值为 $-\frac2e$，选 A。
