solution:
  source_solution_summary: |
    先把三式整理到同一模板：
    \[
    a-\ln(a+1)=2-\ln3,\quad
    b-\ln(b+1)=3-\ln4,\quad
    c-\ln(c+1)=1-\ln2.
    \]
    令
    \[
    f(x)=x-\ln(x+1)\ (x>-1),
    \]
    则
    \[
    f(a)=f(2),\ f(b)=f(3),\ f(c)=f(1).
    \]
    又
    \[
    f^{\prime}(x)=1-\frac{1}{x+1}=\frac{x}{x+1},
    \]
    所以 $f$ 在 $(-1,0)$ 递减，在 $(0,+\infty)$ 递增，故
    \[
    f(1)<f(2)<f(3).
    \]
    由于 $a,b,c<0$，三者都落在 $(-1,0)$ 上，且该区间内函数递减，
    \[
    f(c)<f(a)<f(b)\Rightarrow c>a>b\Rightarrow b<a<c.
    \]
    故选 A。
  key_steps:
    - step_id: step_1
      statement: 把三条已知方程统一改写为 $x-\ln(x+1)=\text{常数}$。
      formula_trace:
        from: $a=\ln\frac{a+1}{3}+2,\ b=\ln\frac{b+1}{4}+3,\ c=2e^{c-1}-1$
        to: $a-\ln(a+1)=2-\ln3,\ b-\ln(b+1)=3-\ln4,\ c-\ln(c+1)=1-\ln2$
        operation: 移项并对 $c+1=2e^{c-1}$ 取对数。
        why: 三项可并入同一个函数模板。
      source_ref: page_0152_ex29_solution
    - step_id: step_2
      statement: 定义同构函数并建立函数值对应。
      formula_trace:
        from: $f(x)=x-\ln(x+1)$
        to: $f(a)=f(2),\ f(b)=f(3),\ f(c)=f(1)$
        operation: 把右端常数分别识别为 $f(2),f(3),f(1)$。
        why: 把未知量比较转成同一函数在不同点的比较。
      source_ref: page_0152_ex29_solution
    - step_id: step_3
      statement: 用导数判定 $f$ 的分段单调性。
      formula_trace:
        from: $f^{\prime}(x)=\frac{x}{x+1}$
        to: $(-1,0)$ 递减，$(0,+\infty)$ 递增
        operation: 按分子分母符号分区间判号。
        why: 后续要结合 $a,b,c<0$ 只取负半轴结论。
      source_ref: page_0152_ex29_solution
    - step_id: step_4
      statement: 在负半轴分支上把函数值顺序反推自变量顺序。
      formula_trace:
        from: $f(1)<f(2)<f(3)$ 与 $a,b,c<0$
        to: $f(c)<f(a)<f(b)\Rightarrow c>a>b\Rightarrow b<a<c$
        operation: 利用 $(-1,0)$ 上递减函数“值大则自变量小”。
        why: 得到题目所需的三数顺序。
      source_ref: page_0152_ex29_figure
    - step_id: step_5
      statement: 对应选项。
      formula_trace:
        from: $b<a<c$
        to: 选 A
        operation: 与四个选项匹配。
        why: 完成作答。
      source_ref: page_0152_ex29_solution
