  recognition_cues:
    - 多个未知量都由“线性项-对数项”隐式定义。
    - 题干显式给出 $a,b,c<0$。
    - 选项是纯顺序判断。
  normalization_moves:
    - 统一到 $f(x)=x-\ln(x+1)$。
    - 先算 $f^{\prime}(x)$，明确负半轴递减。
    - 把 $f(c),f(a),f(b)$ 与 $f(1),f(2),f(3)$ 对齐后反推。
  common_failures:
    - 把 $f(1)<f(2)<f(3)$ 直接写成 $c<a<b$，忘了负半轴递减。
    - 忽略定义域 $x>-1$，对负值范围判断混乱。
    - 只凭直觉看图，不写同构等式链。
