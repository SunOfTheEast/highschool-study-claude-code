stem: |-
  （2023·安阳二模）已知 $a,b,c$ 均为负实数，且 $a=\ln\frac{a+1}{3}+2$，$b=\ln\frac{b+1}{4}+3$，$c=2e^{c-1}-1$，则（  ）
  A. $b<a<c$
  B. $c<b<a$
  C. $a<b<c$
  D. $a<c<b$
answer: |
  A

  先把三式整理到同一模板：
  \[
  a-\ln(a+1)=2-\ln3,\quad
  b-\ln(b+1)=3-\ln4,\quad
  c-\ln(c+1)=1-\ln2.
  \]
  令
  \[
  f(x)=x-\ln(x+1)\ (x>-1),
  \]
  则
  \[
  f(a)=f(2),\ f(b)=f(3),\ f(c)=f(1).
  \]
  又
  \[
  f^{\prime}(x)=1-\frac{1}{x+1}=\frac{x}{x+1},
  \]
  所以 $f$ 在 $(-1,0)$ 递减，在 $(0,+\infty)$ 递增，故
  \[
  f(1)<f(2)<f(3).
  \]
  由于 $a,b,c<0$，三者都落在 $(-1,0)$ 上，且该区间内函数递减，
  \[
  f(c)<f(a)<f(b)\Rightarrow c>a>b\Rightarrow b<a<c.
  \]
  故选 A。
