stem: |
  （2023·陕西一模 T15）已知不等式 $e^x-1\geqslant kx+\ln x$，对于任意的 $x\in(0,+\infty)$ 恒成立，则 $k$ 的最大值________。
answer: |
  $e-1$

  令 $h(t)=e^t+t$。原不等式可写成 $h(x)\ge h(\ln(ex))+(k+1-e)x$。因为 $x\ge1+\ln x=\ln(ex)$，且 $h$ 严格递增，所以 $h(x)\ge h(\ln(ex))$，等号在 $x=1$ 处取到；于是必须且只需 $k+1-e\le0$，得 $k\le e-1$。代入 $x=1$ 也给出必要条件 $k\le e-1$。法二等价于求 $\frac{e^x}{x}-\frac{1+\ln x}{x}$ 的下界，利用两项分别在 $x=1$ 同时取等，同样得最大值 $e-1$。
