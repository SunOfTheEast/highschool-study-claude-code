solution:
  source_solution_summary: |
    由 $f(2+x)-f(2-x)=4x$ 求导得
    $f'(2+x)+f'(2-x)=4$。代入 $g(x)=f'(x+1)$ 可写成
    $g(x+1)+g(-x+1)=4$。又 $g(x+3)$ 为偶函数，故
    $g(-x+3)=g(x+3)$。先令 $x=0$ 得 $2g(1)=4$，即 $g(1)=2$。
    再把关系平移为
    $g(-x)+g(x+2)=4$ 与 $g(-x)=g(x+6)$，联立得
    $g(x+6)+g(x+2)=4$，进而可化出
    $g(x+4)+g(x)=4$，再平移一次得到
    $g(x+8)+g(x+4)=4$，相减得 $g(x+8)=g(x)$，
    因此 $g(25)=g(1)=2$。
    对 $g(-x)+g(x+2)=4$ 求导得
    $-g'(-x)+g'(x+2)=0$；对 $g(-x)=g(x+6)$ 求导得
    $-g'(-x)=g'(x+6)$，所以 $g'(x+6)+g'(x+2)=0$。
    令 $x=1$，得 $g'(7)=-g'(3)$。再令 $x=-3$ 于
    $-g'(-x)=g'(x+6)$ 中，得 $-g'(3)=g'(3)$，故 $g'(3)=0$，
    从而 $g'(7)=0$。最终
    $g'(7)-g(25)=0-2=-2$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把题设关系全部改写成 g 的函数方程。
      formula_trace:
        from: $f(2+x)-f(2-x)=4x$，$g(x)=f'(x+1)$，$g(x+3)$ 偶
        to: $g(x+1)+g(-x+1)=4$，$g(-x+3)=g(x+3)$
        operation: 先对第一式求导，再用 $g(x)=f'(x+1)$ 换元；第二式由偶性直接改写。
        why: 后续周期与导数都在 g 的框架内处理最直接。
      source_ref: page_0117
    - step_id: step_2
      statement: 先求基准值 $g(1)$，再配出周期8并算 $g(25)$。
      formula_trace:
        from: $g(x+1)+g(-x+1)=4$，$g(-x+3)=g(x+3)$
        to: $g(1)=2$，$g(x+8)=g(x)$，$g(25)=2$
        operation: 令 $x=0$ 得基准值；平移改写成 $g(-x)+g(x+2)=4$ 与 $g(-x)=g(x+6)$ 后联立消元。
        why: 目标式含 $g(25)$，必须先拿到周期与基准点。
      source_ref: page_0117
    - step_id: step_3
      statement: 由导数方程求出 $g'(7)=0$。
      formula_trace:
        from: $g(-x)+g(x+2)=4$，$g(-x)=g(x+6)$
        to: $g'(x+6)+g'(x+2)=0$，$g'(7)=-g'(3)$，$g'(3)=0$，故 $g'(7)=0$
        operation: 分别求导并联立；再代入特值 $x=1$ 与 $x=-3$。
        why: 这一段正是page_0118首行补全的截断部分。
      source_ref: page_0118
    - step_id: step_4
      statement: 代回目标式得到最终选项。
      formula_trace:
        from: $g'(7)=0$，$g(25)=2$
        to: $g'(7)-g(25)=-2$
        operation: 直接代数代入。
        why: 与源页结论一致，故选D。
      source_ref: page_0118
teaching_card:
  student_title: 两条平移对称方程，先周期后导数
  what_it_trains: 训练把“差式 + 复合偶性”抽象题改写为同一函数方程组，通过平移联立同时拿下函数值与导数值。
  recognition_cues:
    - 题干给 $g(x)=f'(x+1)$，且同时出现 $f(2+x)-f(2-x)$ 与 $g(x+3)$ 偶。
    - 目标是 $g'(7)-g(25)$，通常要分成“函数值块 + 导数值块”。
    - 选项是常数，优先找周期和特值点。
  normalization_moves:
    - 对 $f(2+x)-f(2-x)=4x$ 先求导，再一口气换成 g。
    - 把偶性写成 $g(-x+3)=g(x+3)$，再平移成 $g(-x)=g(x+6)$。
    - 先令 $x=0$ 取到 $g(1)$，再用平移联立构造周期8。
    - 复用同一方程对求导，直接得到 $g'(7)$。
  common_failures:
    - 把 $\frac{d}{dx}f(2-x)$ 写成 $f'(2-x)$，漏掉负号。
    - 只求出周期却忘记先找基准值，导致 $g(25)$ 无法落地。
    - 把 $g(-x)=g(x+6)$ 误判为周期6。
    - 求出 $g'(x+6)+g'(x+2)=0$ 后代点不对应，错过 $x=1$ 与 $x=-3$。
  similar_practice_query: 抽象函数 平移偶性 周期构造 导数方程 g'(7)-g(25)
