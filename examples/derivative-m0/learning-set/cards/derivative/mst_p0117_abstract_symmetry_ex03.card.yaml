stem: |-
  （2023·盐城三模）（2025春·荔湾区校级期中）已知函数 $f(x)$ 及其导函数 $f'(x)$ 的定义域均为 $\mathbf{R}$，记 $g(x)=f'(x+1)$，且 $f(2+x)-f(2-x)=4x$，$g(x+3)$ 为偶函数，则 $g'(7)-g(25)=$（ ）
  A. 0
  B. 1
  C. $-1$
  D. $-2$
answer: |
  D

  由 $f(2+x)-f(2-x)=4x$ 求导得
  $f'(2+x)+f'(2-x)=4$。代入 $g(x)=f'(x+1)$ 可写成
  $g(x+1)+g(-x+1)=4$。又 $g(x+3)$ 为偶函数，故
  $g(-x+3)=g(x+3)$。先令 $x=0$ 得 $2g(1)=4$，即 $g(1)=2$。
  再把关系平移为
  $g(-x)+g(x+2)=4$ 与 $g(-x)=g(x+6)$，联立得
  $g(x+6)+g(x+2)=4$，进而可化出
  $g(x+4)+g(x)=4$，再平移一次得到
  $g(x+8)+g(x+4)=4$，相减得 $g(x+8)=g(x)$，
  因此 $g(25)=g(1)=2$。
  对 $g(-x)+g(x+2)=4$ 求导得
  $-g'(-x)+g'(x+2)=0$；对 $g(-x)=g(x+6)$ 求导得
  $-g'(-x)=g'(x+6)$，所以 $g'(x+6)+g'(x+2)=0$。
  令 $x=1$，得 $g'(7)=-g'(3)$。再令 $x=-3$ 于
  $-g'(-x)=g'(x+6)$ 中，得 $-g'(3)=g'(3)$，故 $g'(3)=0$，
  从而 $g'(7)=0$。最终
  $g'(7)-g(25)=0-2=-2$，选 D。
