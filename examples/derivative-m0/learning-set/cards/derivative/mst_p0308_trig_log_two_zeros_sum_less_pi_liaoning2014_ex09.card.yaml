stem: |-
  （2014 · 辽宁）已知函数 $f(x)=(\cos x-x)(\pi+2x)-\frac83(\sin x+1)$，$g(x)=3(x-\pi)\cos x-4(1+\sin x)\ln(3-\frac{2x}{\pi})$。
  1. 证明：存在唯一 $x_0\in(0,\frac\pi2)$，使 $f(x_0)=0$。
  2. 证明：存在唯一 $x_1\in(\frac\pi2,\pi)$，使 $g(x_1)=0$，且对 (1) 中的 $x_0$，有 $x_0+x_1<\pi$。
answer: |-
  存在唯一 $x_0\in(0,\frac\pi2)$ 和唯一 $x_1\in(\frac\pi2,\pi)$，且 $x_0+x_1<\pi$。

  第(1)问：在 $(0,\frac\pi2)$ 上， $f^\prime(x)=-(1+\sin x)(\pi+2x)-2x-\frac23\cos x<0$， 所以 $f$ 递减。又 $f(0)=\pi-\frac83>0$， $f(\frac\pi2)=-\pi^2-\frac{16}3<0$，故存在唯一 $x_0$。第(2)问法一：把 $g(x)=(1+\sin x)h(x)$，再令 $t=\pi-x$， $u(t)=h(\pi-t)$。计算得到 $u^\prime(t)=\frac{3f(t)}{(\pi+2t)(1+\sin t)}$， 因而 $u$ 在 $(0,x_0)$ 上增，在 $(x_0,\frac\pi2)$ 上减； 又 $u(0)=0$，$u(x_0)>0$，$u(\frac\pi2)=-4\ln2<0$， 所以存在唯一 $t_1\in(x_0,\frac\pi2)$ 使 $u(t_1)=0$。 令 $x_1=\pi-t_1$，则 $x_1\in(\frac\pi2,\pi)$， 且 $g(x_1)=0$，并且 $x_0+x_1=\pi-(t_1-x_0)<\pi$。 法二用 $\ln(1+\frac{2x}{\pi})\le\frac{2x}{\pi}$ 构造 $p(x)=-4(1+\sin x)+\frac{3\pi}{2}\cos x$，证明 $h(x)>p(x)>\frac32 f(x)$，从图像和零点顺序也得到 $x_0<\pi-x_1$。
