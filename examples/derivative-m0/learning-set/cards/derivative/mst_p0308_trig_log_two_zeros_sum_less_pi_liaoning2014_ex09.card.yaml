      max_score: 1
    - step_id: step_3
      description: 把 $u^\prime$ 与 $f$ 绑定。
      max_score: 1
    - step_id: step_4
      description: 由 $u$ 的增减得到 $t_1>x_0$。
      max_score: 1
    - step_id: step_5
      description: 回到 $x_1$ 并完成主结论。
      max_score: 1
    - step_id: step_6
      description: 法二用插值函数做几何夹逼。
      max_score: 1
