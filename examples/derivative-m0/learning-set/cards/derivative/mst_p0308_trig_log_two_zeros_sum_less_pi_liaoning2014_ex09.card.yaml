original_problem:
  stem: （2014 · 辽宁）已知函数 $f(x)=(\cos x-x)(\pi+2x)-\frac83(\sin x+1)$，$g(x)=3(x-\pi)\cos x-4(1+\sin x)\ln(3-\frac{2x}{\pi})$。
  parts: *a1
  choices: []
  answer: 存在唯一 $x_0\in(0,\frac\pi2)$ 和唯一 $x_1\in(\frac\pi2,\pi)$，且 $x_0+x_1<\pi$。
  fidelity_notes:
    - 无选项。
    - 第(2)问法一为主线，法二为插值放缩的替代路线。
    - page_0310 顶部图是法二图示。
solution:
  source_solution_summary: 第(1)问：在 $(0,\frac\pi2)$ 上， $f^\prime(x)=-(1+\sin x)(\pi+2x)-2x-\frac23\cos x<0$， 所以 $f$ 递减。又 $f(0)=\pi-\frac83>0$， $f(\frac\pi2)=-\pi^2-\frac{16}3<0$，故存在唯一 $x_0$。第(2)问法一：把 $g(x)=(1+\sin x)h(x)$，再令 $t=\pi-x$， $u(t)=h(\pi-t)$。计算得到 $u^\prime(t)=\frac{3f(t)}{(\pi+2t)(1+\sin t)}$， 因而 $u$ 在 $(0,x_0)$ 上增，在 $(x_0,\frac\pi2)$ 上减； 又 $u(0)=0$，$u(x_0)>0$，$u(\frac\pi2)=-4\ln2<0$， 所以存在唯一 $t_1\in(x_0,\frac\pi2)$ 使 $u(t_1)=0$。 令 $x_1=\pi-t_1$，则 $x_1\in(\frac\pi2,\pi)$， 且 $g(x_1)=0$，并且 $x_0+x_1=\pi-(t_1-x_0)<\pi$。 法二用 $\ln(1+\frac{2x}{\pi})\le\frac{2x}{\pi}$ 构造 $p(x)=-4(1+\sin x)+\frac{3\pi}{2}\cos x$，证明 $h(x)>p(x)>\frac32 f(x)$，从图像和零点顺序也得到 $x_0<\pi-x_1$。
  key_steps:
    - step_id: step_1
      statement: 证明 $f$ 在左区间唯一过零。
      formula_trace:
        from: $f(x)=(\cos x-x)(\pi+2x)-\frac83(\sin x+1)$
        to: $f^\prime(x)<0,\quad f(0)>0,\quad f(\frac\pi2)<0$
        operation: 求导判递减，再用端点异号。
        why: 第(2)问要借用这个唯一零点 $x_0$。
      source_ref: page_0308_ex09_part1_start
    - step_id: step_2
      statement: 把 $g$ 的右区间零点转成 $u(t)$ 的左区间零点。
      formula_trace:
        from: $h(x)=\frac{3(x-\pi)\cos x}{1+\sin x}-4\ln(3-\frac2\pi x)$
        to: $u(t)=h(\pi-t)$
        operation: 令 $t=\pi-x$。
        why: 这样可以和第(1)问的 $f(t)$ 放在同一区间比较。
      source_ref: page_0309_ex09_method1
    - step_id: step_3
      statement: 把 $u^\prime$ 与 $f$ 绑定。
      formula_trace:
        from: $u(t)=\frac{3t\cos t}{1+\sin t}-4\ln(1+\frac2\pi t)$
        to: $u^\prime(t)=\frac{3f(t)}{(\pi+2t)(1+\sin t)}$
        operation: 直接求导并整理。
        why: 这一步让第(1)问的零点 $x_0$ 控制 $u$ 的增减。
      source_ref: page_0309_ex09_method1
    - step_id: step_4
      statement: 由 $u$ 的增减得到 $t_1>x_0$。
      formula_trace:
        from: $u(0)=0,\quad u(x_0)>0,\quad u(\frac\pi2)=-4\ln2<0$
        to: $\exists!t_1\in(x_0,\frac\pi2),\ u(t_1)=0$
        operation: 使用 $u$ 先增后减和端点符号。
        why: 这是 $x_0+x_1<\pi$ 的核心。
      source_ref: page_0309_ex09_method1
    - step_id: step_5
      statement: 回到 $x_1$ 并完成主结论。
      formula_trace:
        from: $x_1=\pi-t_1,\quad t_1>x_0$
        to: $x_0+x_1<\pi$
        operation: 代回变量。
        why: 右区间零点的距离关系转成左区间 $t_1$ 与 $x_0$ 的大小关系。
      source_ref: page_0309_ex09_method1
    - step_id: step_6
      statement: 法二用插值函数做几何夹逼。
      formula_trace:
        from: $\ln(1+\frac{2x}{\pi})\le\frac{2x}{\pi}$
        to: $h(x)>p(x)>\frac32f(x)$
        operation: 构造 $p(x)=-4(1+\sin x)+\frac{3\pi}{2}\cos x$。
        why: 这给出图像上的中间零点，解释 $x_0<\pi-x_1$。
      source_ref: page_0309_ex09_method2
teaching_card:
  student_title: 把右侧零点折回左侧比较
  what_it_trains: 训练三角对称区间里的隐零点比较：用 $t=\pi-x$ 折回同一区间，再用已知零点控制新函数。
  recognition_cues:
    - 两个零点分别在 $(0,\frac\pi2)$ 和 $(\frac\pi2,\pi)$。
    - 目标是 $x_0+x_1<\pi$，天然提示令 $t=\pi-x$。
    - $g$ 里有正因子 $1+\sin x$，可以先剥离。
    - 法二的图里有 $h,p,\frac32f$ 三条曲线。
  normalization_moves:
    - 第(1)问的 $f$ 不是孤立小问，它是第(2)问导数符号的工具。
    - 先把 $g$ 改成同零点的 $h$。
    - 再用 $t=\pi-x$ 把右区间映射到左区间。
    - 看见 $\ln(1+u)$ 时可以插入 $u$ 做上界。
  common_failures:
    - 只证明 $g$ 有零点，忘记唯一性。
    - 把 $t_1>x_0$ 和 $x_0+x_1<\pi$ 的方向换反。
    - 忽略 $1+\sin x>0$，没有说明 $g,h$ 零点一致。
    - 法二里把 $p$ 和 $\frac32f$ 的夹逼方向写反。
  similar_practice_query: 三角对数 隐零点 比大小 x0+x1<pi t=pi-x 插值放缩
quality:
  confidence: high
  needs_review: false
  review_notes: []
