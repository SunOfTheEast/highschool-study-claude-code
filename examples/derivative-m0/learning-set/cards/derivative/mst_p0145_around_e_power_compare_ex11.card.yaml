stem: |-
  （2024·金太阳模拟）已知 $a=(e-0.1)^{e+0.1}$，$b=e^e$，$c=(e+0.1)^{e-0.1}$，则（  ）
  A. $c<a<b$
  B. $a<c<b$
  C. $a<b<c$
  D. $c<b<a$
answer: |
  B

  构造
  $f(x)=(2e-x)\ln x$。
  则
  $\ln a=f(e-0.1)$，
  $\ln b=f(e)=e$，
  $\ln c=f(e+0.1)$。
  源解给出
  $f^{\prime}(x)=\frac{2e}{x}-1-\ln x$，
  且 $f^{\prime}(x)$ 递减，$f^{\prime}(e)=0$，
  所以 $f(x)\le f(e)=e$，即 $b$ 最大。
  再比较 $a,c$：微元法把
  $f^{\prime}(e-0.1)$ 与 $f^{\prime}(e+0.1)$ 相加，得到
  $\frac{\ln c-\ln a}{0.1}>0$，
  因此 $\ln c>\ln a$。
  也可以用源解的极值点偏移法：
  $f^{\prime\prime}(x)<0$，$f^{\prime\prime\prime}(x)>0$，
  极大值点左偏，所以右侧近点函数值更高。
  综上 $b>c>a$，即 $a<c<b$，选 B。
