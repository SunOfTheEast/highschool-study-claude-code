solution:
  source_solution_summary: |
    构造
    $f(x)=(2e-x)\ln x$。
    则
    $\ln a=f(e-0.1)$，
    $\ln b=f(e)=e$，
    $\ln c=f(e+0.1)$。
    源解给出
    $f^{\prime}(x)=\frac{2e}{x}-1-\ln x$，
    且 $f^{\prime}(x)$ 递减，$f^{\prime}(e)=0$，
    所以 $f(x)\le f(e)=e$，即 $b$ 最大。
    再比较 $a,c$：微元法把
    $f^{\prime}(e-0.1)$ 与 $f^{\prime}(e+0.1)$ 相加，得到
    $\frac{\ln c-\ln a}{0.1}>0$，
    因此 $\ln c>\ln a$。
    也可以用源解的极值点偏移法：
    $f^{\prime\prime}(x)<0$，$f^{\prime\prime\prime}(x)>0$，
    极大值点左偏，所以右侧近点函数值更高。
    综上 $b>c>a$，即 $a<c<b$，选 B。
  key_steps:
    - step_id: step_1
      statement: 构造统一函数。
      formula_trace:
        from: $a=(e-0.1)^{e+0.1},\ b=e^e,\ c=(e+0.1)^{e-0.1}$
        to: $\ln a=f(e-0.1),\ \ln b=f(e),\ \ln c=f(e+0.1)$，其中 $f(x)=(2e-x)\ln x$
        operation: 对数化并把底数位置设为自变量。
        why: 三项都变成同一函数在 $e$ 附近三点的函数值。
      source_ref: page_0145_ex11_solution_start
    - step_id: step_2
      statement: 先证明 $b$ 最大。
      formula_trace:
        from: $f^{\prime}(x)=\frac{2e}{x}-1-\ln x,\ f^{\prime}(e)=0$
        to: $f(x)\le f(e)=e$
        operation: 用 $f^{\prime}$ 递减确认 $e$ 为极大值点。
        why: 得到 $\ln b$ 大于等于左右两侧函数值。
      source_ref: page_0146_ex11_continuation
    - step_id: step_3
      statement: 再比较左右两点。
      formula_trace:
        from: $f^{\prime}(e-0.1)+f^{\prime}(e+0.1)>0$
        to: $\frac{\ln c-\ln a}{0.1}>0\Rightarrow \ln c>\ln a$
        operation: 用微元斜率近似比较左右两侧下降幅度。
        why: 判定 $c>a$。
      source_ref: page_0146_ex11_continuation
    - step_id: step_4
      statement: 用极值点偏移作直观解释。
      formula_trace:
        from: $f^{\prime\prime}(x)<0,\ f^{\prime\prime\prime}(x)>0$
        to: 极大值点左偏，故 $f(e+0.1)>f(e-0.1)$
        operation: 用三阶导符号判断峰值偏移。
        why: 解释为什么右侧近点 $c$ 高于左侧近点 $a$。
      source_ref: page_0146_ex11_continuation
    - step_id: step_5
      statement: 合并排序并选项匹配。
      formula_trace:
        from: $b>c>a$
        to: $a<c<b$，选 B
        operation: 转写成选项顺序。
        why: 作答完成。
      source_ref: page_0146_ex11_continuation
teaching_card:
  student_title: $e$ 附近的幂比较：看峰值偏向哪边
  what_it_trains: 训练把左右对称外壳下的幂比较转成函数值比较，并用极值点偏移判断左右谁更大。
  recognition_cues:
    - 出现 $e-0.1,e,e+0.1$ 这种围绕 $e$ 的三项。
    - 底数和指数一增一减，形如 $(a-x)^{a+x}$ 与 $(a+x)^{a-x}$。
    - 选项需要判断左右两侧谁离峰值更“高”。
  normalization_moves:
    - 先取对数。
    - 构造 $f(x)=(2e-x)\ln x$。
    - 先定中间项最大，再判左右偏移。
  common_failures:
    - 误以为左右 $0.1$ 对称，所以 $a=c$。
    - 只证明 $b$ 最大，没有继续比较 $a,c$。
    - 把极大值左偏理解成“左边函数值更大”，方向反了。
  similar_practice_query: (e-0.1)^(e+0.1) e^e (e+0.1)^(e-0.1) 极值点偏移 比大小
