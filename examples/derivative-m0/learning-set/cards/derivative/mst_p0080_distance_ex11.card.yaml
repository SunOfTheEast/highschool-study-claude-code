stem: （2024 · 湖南模拟 T15）函数 $f(x)=\ln x$ 图象上一点 $P$ 到直线 $y=2x$ 的最短距离为______。
answer: |-
  $\frac{(1+\ln 2)\sqrt{5}}{5}$

  曲线 $y=\ln x$ 上到直线 $y=2x$ 距离最短的位置, 其切线应与 $y=2x$ 平行。由 $f'(x)=1/x=2$ 得切点横坐标 $x=1/2$, 切点为 $(1/2,-\ln2)$。把点代入直线 $2x-y=0$ 的距离公式, 得 $d=(1+\ln2)/\sqrt5=(1+\ln2)\sqrt5/5$。
