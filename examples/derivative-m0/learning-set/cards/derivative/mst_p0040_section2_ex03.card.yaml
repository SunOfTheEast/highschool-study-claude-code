stem: |-
  （2024 · 新乡模拟 T21）已知函数 f(x)=e^x-k(ln x+1)。
  (1). 设 x=3 是 f(x) 的极值点，求 k 的值，并求 f(x) 的单调区间。
  (2). 证明：当 0<k<e 时，f(x)>0。
answer: |-
  (1) k=3e^3，f(x) 在 (0,3) 上单调递减，在 (3,+infty) 上单调递增； (2) 对 x>0 且 0<k<e，有 f(x)>0。

  先用 f'(3)=0 求 k=3e^3，再因 f''(x)>0 使 f' 递增而判断单调区间。 对 0<k<e 的证明，源页给出主元法和链式放缩两条路线；卡片主线采用主元法， 并补入法二作为识别线索。
rubric:
  max_score: 6
  criteria:
    - step_id: step_1
      description: f'(x)=e^x-k/x，由 f'(3)=0 得 e^3-k/3=0，所以 k=3e^3。
      max_score: 1
    - step_id: step_2
      description: 当 k=3e^3 时，f'(x)=e^x-3e^3/x，且 f''(x)=e^x+3e^3/x^2>0； f' 在 x>0 上递增并在 x=3 处为 0，所以 f 在 (0,3) 上递减，在 (3,+infty) 上递增。
      max_score: 1
    - step_id: step_3
      description: 若 0<x<=1/e，则 ln x+1<=0，且 0<k<e，所以 f(x)=e^x-k(ln x+1)>=e^x>0。
      max_score: 1
    - step_id: step_4
      description: 若 x>1/e，则把 f(x) 看成关于 k 的函数 g(k)=e^x-k(ln x+1)。 因 g'(k)=-ln x-1<0，且 k<e，所以 g(k)>g(e)。
      max_score: 1
    - step_id: step_5
      description: g(e)=e^x-e(ln x+1)=e(e^{x-1}-ln x-1) >=e(x-1-ln x)>=0；结合 k<e 的严格比较，可得 f(x)>0。
      max_score: 1
    - step_id: step_6
      description: 源页法二还可写作：f(x)>0 等价于 e^{x-ln k}>ln x+1； 由 0<k<e 得 e^{x-ln k}>e^{x-1}，再接 e^{x-1}>=x>=ln x+1。
      max_score: 1
