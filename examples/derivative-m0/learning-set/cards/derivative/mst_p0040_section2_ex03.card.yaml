original_problem:
  stem: （2024 · 新乡模拟 T21）已知函数 f(x)=e^x-k(ln x+1)。
  parts: *a1
  choices: []
  answer: (1) k=3e^3，f(x) 在 (0,3) 上单调递减，在 (3,+infty) 上单调递增； (2) 对 x>0 且 0<k<e，有 f(x)>0。
  fidelity_notes:
    - 题干含 ln x，定义域为 x>0。
    - 源页续解编号写作“(3)”，按内容判定为第 (2) 问证明。
solution:
  source_solution_summary: 先用 f'(3)=0 求 k=3e^3，再因 f''(x)>0 使 f' 递增而判断单调区间。 对 0<k<e 的证明，源页给出主元法和链式放缩两条路线；卡片主线采用主元法， 并补入法二作为识别线索。
  key_steps:
    - step_id: step_1
      statement: f'(x)=e^x-k/x，由 f'(3)=0 得 e^3-k/3=0，所以 k=3e^3。
      formula_trace:
        from: f'(3)=e^3-k/3=0
        to: k=3e^3
        operation: 代入极值点导数为 0 的必要条件
        why: x=3 是定义域内部极值点。
      source_ref: page_0040:例3解析(1)
    - step_id: step_2
      statement: 当 k=3e^3 时，f'(x)=e^x-3e^3/x，且 f''(x)=e^x+3e^3/x^2>0； f' 在 x>0 上递增并在 x=3 处为 0，所以 f 在 (0,3) 上递减，在 (3,+infty) 上递增。
      formula_trace:
        from: f'(x)=e^x-3e^3/x, f'(3)=0
        to: x<3 => f'(x)<0; x>3 => f'(x)>0
        operation: 用 f' 递增和唯一零点判断导函数符号
        why: f''(x)>0 保证 f' 单调递增。
      source_ref: page_0040:例3解析(1)
    - step_id: step_3
      statement: 若 0<x<=1/e，则 ln x+1<=0，且 0<k<e，所以 f(x)=e^x-k(ln x+1)>=e^x>0。
      formula_trace:
        from: ln x+1<=0
        to: e^x-k(ln x+1)>=e^x>0
        operation: 按 ln x+1 的符号分段
        why: 负数乘 -k 变为正数，再加 e^x>0。
      source_ref: page_0041:例3续解主元法
    - step_id: step_4
      statement: 若 x>1/e，则把 f(x) 看成关于 k 的函数 g(k)=e^x-k(ln x+1)。 因 g'(k)=-ln x-1<0，且 k<e，所以 g(k)>g(e)。
      formula_trace:
        from: g'(k)=-ln x-1<0, k<e
        to: g(k)>g(e)=e^x-e(ln x+1)
        operation: 固定 x，以 k 为主元比较到端点 e
        why: g(k) 随 k 递减，较小的 k 给出更大的函数值。
      source_ref: page_0041:例3续解主元法
    - step_id: step_5
      statement: g(e)=e^x-e(ln x+1)=e(e^{x-1}-ln x-1) >=e(x-1-ln x)>=0；结合 k<e 的严格比较，可得 f(x)>0。
      formula_trace:
        from: e^x-e(ln x+1)
        to: e(e^{x-1}-ln x-1)>=e(x-1-ln x)>=0
        operation: 用 e^{x-1}>=x 和 x-1>=ln x 两次切线放缩
        why: 指数函数和对数函数的切线不等式给出非负下界。
      source_ref: page_0041:例3续解主元法
    - step_id: step_6
      statement: 源页法二还可写作：f(x)>0 等价于 e^{x-ln k}>ln x+1； 由 0<k<e 得 e^{x-ln k}>e^{x-1}，再接 e^{x-1}>=x>=ln x+1。
      formula_trace:
        from: e^x-k(ln x+1)>0
        to: e^{x-ln k}>ln x+1
        operation: 除以正数 k 后把 1/k 写成 e^{-ln k}
        why: 把参数 k 吸收入指数平移，变成切线找点链式比较。
      source_ref: page_0041:例3续解法二
teaching_card:
  student_title: 把 k 当主元推到端点 e
  what_it_trains: 训练学生在含参数的指对不等式中，不急着对 x 求导，而是先观察参数只线性出现， 固定 x 后把 k 当作主元比较到最难端点。
  recognition_cues:
    - 参数 k 只出现在 -k(ln x+1) 中。
    - 条件 0<k<e 给出明确端点 e。
    - ln x+1 的正负决定 k 越大函数越小还是直接为正。
  normalization_moves:
    - 先分 x<=1/e 与 x>1/e。
    - 在 x>1/e 时设 g(k)=e^x-k(ln x+1)。
    - 比较到 g(e)，再用 e^{x-1}>=x 与 x-1>=ln x 收尾。
    - 备用路线：把 1/k 写入指数，得到 e^{x-ln k}。
  common_failures:
    - 忘记 ln x 的定义域 x>0。
    - 把 g'(k)<0 的比较方向写反。
    - 只证明 g(e)>=0，却没有利用 k<e 带来的严格大于。
  similar_practice_query: 0<参数<端点 的 e^x-k(ln x+常数) 主元法证明正性
quality:
  confidence: high
  needs_review: false
  review_notes:
