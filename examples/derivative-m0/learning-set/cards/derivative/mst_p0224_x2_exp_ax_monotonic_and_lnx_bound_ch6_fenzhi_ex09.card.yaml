stem: |-
  （2020 · 衡水中学月考 T21）已知函数 $f(x)=x^2e^{ax}-1$。
  1. 讨论函数 $f(x)$ 的单调性。
  2. 当 $a>\frac13e$ 时，求证：$f(x)>\ln x$。
answer: |-
  （1）当 $a=0$ 时，$f$ 在 $(-\infty,0)$ 上单调递减，在 $(0,+\infty)$ 上单调递增；当 $a<0$ 时，$f$ 在 $(-\infty,0)$、$(-2/a,+\infty)$ 上单调递减，在 $(0,-2/a)$ 上单调递增；当 $a>0$ 时，$f$ 在 $(-\infty,-2/a)$、$(0,+\infty)$ 上单调递增，在 $(-2/a,0)$ 上单调递减。（2）证明见解析。

  $f^{\prime}(x)=2xe^{ax}+ax^2e^{ax}=x(ax+2)e^{ax}$。当 $a=0$ 时，$f(x)=x^2-1$，在 $(-\infty,0)$ 递减、$(0,+\infty)$ 递增。当 $a<0$ 时，$-2/a>0$，导数在 $x<0$ 或 $x>-2/a$ 时为负，在 $0<x<-2/a$ 时为正，所以对应区间递减、递增、 递减。当 $a>0$ 时，$-2/a<0$，导数在 $x<-2/a$ 或 $x>0$ 时为正， 在 $-2/a<x<0$ 时为负。第二问只考虑 $x>0$。由 $f(x)>\ln x$ 得 $x^2e^{ax}>\ln x+1$，即 $\frac{e^{ax}}x>\frac{\ln x+1}{x^3}$。令 $g(x)=\frac{\ln x+1}{x^3}$，则 $g^{\prime}(x)=-\frac{3\ln x+2}{x^4}$，最大值在 $x=e^{-2/3}$ 处取得，$g_{\max}=\frac13e^2$。令 $h(x)=\frac{e^{ax}}x$，则 $h^{\prime}(x)=\frac{(ax-1)e^{ax}}{x^2}$，最小值在 $x=1/a$， $h_{\min}=ae$。因 $a>\frac13e$，故 $ae>\frac13e^2$，于是 $\frac{e^{ax}}x>\frac{\ln x+1}{x^3}$，从而 $f(x)>\ln x$。
