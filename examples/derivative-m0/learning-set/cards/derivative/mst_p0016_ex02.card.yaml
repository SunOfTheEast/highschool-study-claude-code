original_problem:
  stem: 已知实数 $\alpha$，$\beta$ 满足 $\alpha e^\alpha=e^3$，$\beta(\ln\beta-1)=e^4$，则 $\alpha\beta=$_______。
  parts: *a1
  choices: []
  answer: $e^4$
  fidelity_notes:
    - page_0016.png 已核对：第二个条件为 $\beta(\ln\beta-1)=e^4$，括号内是 $\ln\beta-1$。
solution:
  source_solution_summary: 由 $\alpha e^\alpha=e^3>0$ 得 $\alpha>0$，由 $\ln\beta$ 存在且 $\beta(\ln\beta-1)=e^4>0$ 得 $\beta>0$ 且 $\ln\beta-1>0$。设 $F(t)=te^t$，第二式可写成 $(\ln\beta-1)e^{\ln\beta-1}=e^3$，即 $F(\ln\beta-1)=F(\alpha)$。因为两边自变量都为正，$F$ 在 $(0,+\infty)$ 上递增，所以 $\alpha=\ln\beta-1$，从而 $\alpha\beta=\beta(\ln\beta-1)=e^4$。
  key_steps:
    - step_id: step_1
      statement: 确认同构自变量位于递增区间。
      formula_trace:
        from: $\alpha e^\alpha=e^3,\quad \beta(\ln\beta-1)=e^4$
        to: $\alpha>0,\quad \beta>0,\quad \ln\beta-1>0$
        operation: 利用右侧为正数，以及 $\beta>0$ 是对数定义域条件。
        why: $F(t)=te^t$ 在正区间递增，后续才能由函数值相等推出自变量相等。
      source_ref: page_0016
    - step_id: step_2
      statement: 把第二个条件写成同一个 $F(t)=te^t$。
      formula_trace:
        from: $\beta(\ln\beta-1)=e^4$
        to: $(\ln\beta-1)e^{\ln\beta-1}=e^3$
        operation: 用 $\beta=e^{\ln\beta}$，并把等式两边同除以 $e$。
        why: 这样第二式也成为 $te^t=e^3$ 的形式。
      source_ref: page_0016
    - step_id: step_3
      statement: 由同构函数值相等推出自变量相等。
      formula_trace:
        from: $\alpha e^\alpha=e^3,\quad (\ln\beta-1)e^{\ln\beta-1}=e^3$
        to: $\alpha=\ln\beta-1$
        operation: 令 $F(t)=te^t$，在 $(0,+\infty)$ 上使用单调性。
        why: 两个正自变量对应同一个函数值，必须相等。
      source_ref: page_0016
    - step_id: step_4
      statement: 回代求目标乘积。
      formula_trace:
        from: $\alpha=\ln\beta-1$
        to: $\alpha\beta=\beta(\ln\beta-1)=e^4$
        operation: 将 $\alpha$ 替换为 $\ln\beta-1$，直接使用题设第二式。
        why: 题目只问乘积，不需要单独解出 $\alpha$ 或 $\beta$。
      source_ref: page_0016
teaching_card:
  student_title: 把 $\beta(\ln\beta-1)$ 变成 $xe^x$
  what_it_trains: 训练把含 $\ln\beta$ 的乘积改写成同一个 $te^t$，再用单调性直接读出等量关系。
  recognition_cues:
    - 一个式子是 $\alpha e^\alpha$，另一个式子含 $\beta(\ln\beta-1)$。
    - 题目问 $\alpha\beta$，而题设已有 $\beta(\ln\beta-1)$。
    - 看到 $\beta$ 与 $\ln\beta-1$ 相乘，考虑把 $\beta$ 写成 $e^{\ln\beta}$。
  normalization_moves:
    - 把 $\beta$ 改写成 $e^{\ln\beta}$。
    - 把指数中的 $\ln\beta$ 下移成 $\ln\beta-1$，同时右侧从 $e^4$ 除到 $e^3$。
    - 得到 $\alpha=\ln\beta-1$ 后，立刻回到 $\alpha\beta$。
  common_failures:
    - 没有检查 $\ln\beta$ 的定义域和正区间单调性。
    - 把 $(\ln\beta-1)e^{\ln\beta-1}$ 误写成 $(\ln\beta)e^{\ln\beta}-1$。
    - 推出 $\alpha=\ln\beta-1$ 后继续求 $\beta$，反而绕远。
  similar_practice_query: $\alpha e^\alpha$ $\beta(\ln\beta-1)$ 填空 $xe^x$ 同构 乘积求值
