stem: 已知实数 $\alpha$，$\beta$ 满足 $\alpha e^\alpha=e^3$，$\beta(\ln\beta-1)=e^4$，则 $\alpha\beta=$_______。
answer: |-
  $e^4$

  由 $\alpha e^\alpha=e^3>0$ 得 $\alpha>0$，由 $\ln\beta$ 存在且 $\beta(\ln\beta-1)=e^4>0$ 得 $\beta>0$ 且 $\ln\beta-1>0$。设 $F(t)=te^t$，第二式可写成 $(\ln\beta-1)e^{\ln\beta-1}=e^3$，即 $F(\ln\beta-1)=F(\alpha)$。因为两边自变量都为正，$F$ 在 $(0,+\infty)$ 上递增，所以 $\alpha=\ln\beta-1$，从而 $\alpha\beta=\beta(\ln\beta-1)=e^4$。
