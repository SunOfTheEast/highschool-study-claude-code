stem: |-
  $e$ 是自然对数的底数，$m,n\in\mathbf R$，已知 $me^m+\ln n>n\ln n+m$，则下列结论一定正确的是 ( )
  A. 若 $m>0$，则 $m-n>0$
  B. 若 $m>0$，则 $e^m-n>0$
  C. 若 $m<0$，则 $m+\ln n<0$
  D. 若 $m<0$，则 $e^m+n>2$
answer: |-
  BC

  原不等式等价于 $me^m-m>n\ln n-\ln n$，即 $f(m)>f(\ln n)$，其中 $f(x)=xe^x-x$。由 $f'(x)=e^x(x+1)-1$ 得 $f$ 在 $(-\infty,0)$ 递减，在 $(0,+\infty)$ 递增。A 用 $m=n=e$ 可反例；B 当 $m>0$ 时，若 $n\le1$ 则 $e^m>1\ge n$，若 $n>1$ 则 $m,\ln n>0$，由递增性得 $m>\ln n$，所以 $e^m>n$。C 当 $m<0$ 时，若 $n\le1$ 显然；若 $n>1$，用 $f(x)-f(-x)=x(e^x+e^{-x}-2)$ 在 $x<0$ 时小于 0，得 $f(m)<f(-m)$，结合 $f(m)>f(\ln n)$ 与正区间递增性推出 $\ln n<-m$。D 用 $m=-2,n=1/e$ 构造反例。故选 BC。
