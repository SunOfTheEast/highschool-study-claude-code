stem: 已知函数 $f(x)=ae^x+2x-1$。证明：对任意的 $a\ge1$，当 $x>0$ 时，$f(x)\ge(x+ae)x$。
answer: |-
  结论成立；等号在 $x=1$ 时成立（当 $a\ge1$）。

  把目标改写为 $a(e^x-ex)-(x-1)^2\ge0$，再拆成 $(a-1)(e^x-ex)+\bigl(e^x-ex-(x-1)^2\bigr)$。因 $a-1\ge0$，只需分别证明 $e^x-ex\ge0$ 与 $e^x-ex-(x-1)^2\ge0$。前者可由导数或切线不等式得到；后者可设 $t=x-1$ 后用 $e^t\ge1+t+\frac12t^2$ 给出下界，从而原不等式成立。
