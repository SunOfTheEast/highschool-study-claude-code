original_problem:
  stem: 已知函数 $f(x)=ae^x+2x-1$。证明：对任意的 $a\ge1$，当 $x>0$ 时，$f(x)\ge(x+ae)x$。
  parts: *a1
  choices: []
  answer: 结论成立；等号在 $x=1$ 时成立（当 $a\ge1$）。
  fidelity_notes:
    - 源题为证明题，无选项。
    - 题干的量词条件“$a\ge1$、$x>0$”已完整保留。
solution:
  source_solution_summary: 把目标改写为 $a(e^x-ex)-(x-1)^2\ge0$，再拆成 $(a-1)(e^x-ex)+\bigl(e^x-ex-(x-1)^2\bigr)$。因 $a-1\ge0$，只需分别证明 $e^x-ex\ge0$ 与 $e^x-ex-(x-1)^2\ge0$。前者可由导数或切线不等式得到；后者可设 $t=x-1$ 后用 $e^t\ge1+t+\frac12t^2$ 给出下界，从而原不等式成立。
  key_steps:
    - step_id: step_1
      statement: 先把原命题化成指数项与二次项的比较。
      formula_trace:
        from: $ae^x+2x-1\ge (x+ae)x$
        to: $a(e^x-ex)-(x-1)^2\ge0$
        operation: 移项并整理同类项。
        why: 得到可按参数与纯 $x$ 项拆分的标准形。
      source_ref: page_0201_ex05_solution
    - step_id: step_2
      statement: 按 $a\ge1$ 拆出“非负系数 × 非负项”的结构。
      formula_trace:
        from: $a(e^x-ex)-(x-1)^2$
        to: $(a-1)(e^x-ex)+\bigl(e^x-ex-(x-1)^2\bigr)$
        operation: 加减同项并因式分解。
        why: 可把证明归结为两条与参数分离的不等式。
      source_ref: page_0201_ex05_solution
    - step_id: step_3
      statement: 证明 $e^x-ex\ge0$（$x>0$）。
      formula_trace:
        from: $u(x)=e^x-ex$
        to: $u^{\prime}(x)=e^x-e,\ u(1)=0,\ u(x)\ge0$
        operation: 求导判极小值（等价于用 $e^{x-1}\ge x$）。
        why: 该项是第一块的核心非负因子。
      source_ref: page_0201_ex05_solution
    - step_id: step_4
      statement: 证明 $e^x-ex-(x-1)^2\ge0$。
      formula_trace:
        from: $e^x-ex-(x-1)^2$
        to: $e\!\left(e^t-1-t\right)-t^2\ge \left(\frac e2-1\right)t^2\ge0\ (t=x-1)$
        operation: 换元 $t=x-1$，再用 $e^t\ge1+t+\frac12t^2$。
        why: 得到第二块的显式非负下界。
      source_ref: page_0201_ex05_solution
    - step_id: step_5
      statement: 合并两块，完成证明。
      formula_trace:
        from: $(a-1)(e^x-ex)\ge0$ 且 $e^x-ex-(x-1)^2\ge0$
        to: $a(e^x-ex)-(x-1)^2\ge0$
        operation: 两项非负相加。
        why: 与 step_1 等价回代即得原命题。
      source_ref: page_0201_ex05_solution
teaching_card:
  student_title: 先拆参数，再证两条标准放缩
  what_it_trains: 训练把含参数证明题改写成“非负系数 + 基础放缩块”的和，并用指数函数切线不等式稳定收束。
  recognition_cues:
    - 题干是“对任意 $a\ge1$”的恒成立证明。
    - 结论右侧含 $ae\cdot x$，提示把 $e^x-ex$ 拎出来。
    - 出现 $(x-1)^2$，常对应在 $x=1$ 取等的切线放缩。
  normalization_moves:
    - 先移项化为 $a(e^x-ex)-(x-1)^2\ge0$。
    - 写成 $(a-1)(e^x-ex)+\bigl(e^x-ex-(x-1)^2\bigr)$。
    - 分别证明两块非负，再相加回代。
  common_failures:
    - 只证明 $e^x-ex\ge0$，漏掉 $e^x-ex-(x-1)^2\ge0$。
    - 把 $a\ge1$ 用成 $a=1$，导致论证不完整。
    - 等号点不核对，遗漏 $x=1$ 的取等信息。
  similar_practice_query: a(e^x-ex) 与 (x-1)^2 放缩 证明 恒成立
