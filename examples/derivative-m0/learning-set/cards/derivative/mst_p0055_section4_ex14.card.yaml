stem: |-
  （2021 · 乙卷）设 $a\ne0$，若 $x=a$ 为函数 $f(x)=a(x-a)^2(x-b)$ 的极大值点，则（  ）
  A. $a<b$
  B. $a>b$
  C. $ab<a^2$
  D. $ab>a^2$
answer: |
  D

  由 $f(x)=a(x-a)^2(x-b)$ 可知 $x=a$ 是二重零点，$x=b$ 是另一零点。源解用三次函数图像分 $a$ 的正负讨论：当 $a>0$ 时，三次函数右端向上，要让二重零点 $x=a$ 成为极大值点，草图给出 $0<a<b$；当 $a<0$ 时，右端向下，草图给出 $b<a<0$。两种情形都等价于 $ab>a^2$，故选 D。代数上也可复核：在 $x=a$ 附近，$f(x)=a(a-b)(x-a)^2+O((x-a)^3)$，极大值点要求二次项系数 $a(a-b)<0$，即同样得到 $ab>a^2$。
