solution:
  source_solution_summary: |
    由
    \[
    \ln x^{3x}f^{\prime}(x)>3f(x)
    \]
    得
    \[
    3x\ln x\,f^{\prime}(x)-3f(x)>0
    \Rightarrow
    \ln x\,f^{\prime}(x)-\frac{f(x)}{x}>0.
    \]
    令
    \[
    F(x)=\frac{f(x)}{\ln x}\quad (x>1),
    \]
    则
    \[
    F^{\prime}(x)=\frac{f^{\prime}(x)\ln x-\frac{f(x)}{x}}{(\ln x)^2}>0.
    \]
    所以 $F$ 在 $(1,+\infty)$ 上递增，故
    \[
    F(e)<F(e^2)
    \Rightarrow
    \frac{f(e)}{\ln e}<\frac{f(e^2)}{\ln e^2}
    \Rightarrow
    f(e)<\frac{f(e^2)}{2}.
    \]
    即 $2f(e)<f(e^2)$，选 C。
  key_steps:
    - step_id: step_1
      statement: 把题设化为“对数项乘导数减商”的标准形。
      formula_trace:
        from: $\ln x^{3x}f^{\prime}(x)>3f(x)$
        to: $\ln x\,f^{\prime}(x)-\frac{f(x)}{x}>0$
        operation: 用 $\ln x^{3x}=3x\ln x$ 并同除 $3x$（$x>0$）。
        why: 对应分式构造导数模板。
      source_ref: page_0131
    - step_id: step_2
      statement: 构造 F=f/lnx 并判其递增。
      formula_trace:
        from: $\ln x\,f^{\prime}(x)-\frac{f(x)}{x}>0$
        to: $F^{\prime}(x)>0$（$F=\frac{f}{\ln x}$）
        operation: 求导并利用 $(\ln x)^2>0$（$x>1$）。
        why: 获得可直接比较函数值的单调性。
      source_ref: page_0131
    - step_id: step_3
      statement: 代入 e 与 e^2 完成目标比较。
      formula_trace:
        from: $F(e)<F(e^2)$
        to: $2f(e)<f(e^2)$
        operation: 代入并用 $\ln e=1,\ln e^2=2$。
        why: 直接对应选项 C。
      source_ref: page_0131
