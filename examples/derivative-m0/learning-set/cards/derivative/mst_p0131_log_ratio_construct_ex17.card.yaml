stem: |-
  （22-23高二下·贵州·阶段练习）函数 $f(x)$ 的导函数 $f^{\prime}(x)$，对任意 $x\in(0,+\infty)$，$\ln x^{3x}f^{\prime}(x)>3f(x)$，则（  ）
  A. $2f(e)>f(e^2)$
  B. $2f(e)=f(e^2)$
  C. $2f(e)<f(e^2)$
  D. $2f(e)$ 与 $f(e^2)$ 的大小不确定
answer: |
  C

  由
  \[
  \ln x^{3x}f^{\prime}(x)>3f(x)
  \]
  得
  \[
  3x\ln x\,f^{\prime}(x)-3f(x)>0
  \Rightarrow
  \ln x\,f^{\prime}(x)-\frac{f(x)}{x}>0.
  \]
  令
  \[
  F(x)=\frac{f(x)}{\ln x}\quad (x>1),
  \]
  则
  \[
  F^{\prime}(x)=\frac{f^{\prime}(x)\ln x-\frac{f(x)}{x}}{(\ln x)^2}>0.
  \]
  所以 $F$ 在 $(1,+\infty)$ 上递增，故
  \[
  F(e)<F(e^2)
  \Rightarrow
  \frac{f(e)}{\ln e}<\frac{f(e^2)}{\ln e^2}
  \Rightarrow
  f(e)<\frac{f(e^2)}{2}.
  \]
  即 $2f(e)<f(e^2)$，选 C。
