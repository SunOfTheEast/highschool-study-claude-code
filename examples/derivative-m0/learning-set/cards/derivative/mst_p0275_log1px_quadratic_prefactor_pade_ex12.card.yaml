stem: （2018 · 新课标Ⅲ）已知函数 $f(x)=(2+x+ax^2)\ln(1+x)-2x$。若 $x=0$ 是 $f(x)$ 的极大值点，求 $a$ 的值，试用帕德逼近原理解释。
answer: |-
  $a=-\frac16$。帕德解释：$\ln(1+x)$ 在 $x=0$ 的 $[1,2]$ 阶帕德逼近为 $\frac{12x}{-x^2+6x+12}$，与 $\frac{2x}{2+x+ax^2}$ 匹配时 $a=-\frac16$。

  题目等价于比较 $\ln(1+x)$ 与 $\frac{2x}{2+x+ax^2}$ 在 $x=0$ 附近的局部贴合。source 给出 $\ln(1+x)$ 的 $[1,2]$ 阶帕德逼近 $R_{1,2}(x)=\frac{12x}{-x^2+6x+12}$。若 $\frac{2x}{2+x+ax^2}$ 要成为这个帕德逼近，则分母只差同倍数： $\frac{2x}{2+x+ax^2}=\frac{12x}{12+6x+6ax^2}$，要与 $\frac{12x}{-x^2+6x+12}$ 一致，就有 $6a=-1$，即 $a=-\frac16$。此时 $h(x)=\ln(1+x)-\frac{12x}{-x^2+6x+12}$ 的图像说明 0 附近的符号 正好对应 $f$ 在 $x=0$ 取极大值。
