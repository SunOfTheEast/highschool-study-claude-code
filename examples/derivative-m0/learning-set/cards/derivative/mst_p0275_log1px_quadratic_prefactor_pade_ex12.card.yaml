  choices: []
  answer: $a=-\frac16$。帕德解释：$\ln(1+x)$ 在 $x=0$ 的 $[1,2]$ 阶帕德逼近为 $\frac{12x}{-x^2+6x+12}$，与 $\frac{2x}{2+x+ax^2}$ 匹配时 $a=-\frac16$。
