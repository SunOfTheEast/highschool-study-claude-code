solution:
  source_solution_summary: 题目等价于比较 $\ln(1+x)$ 与 $\frac{2x}{2+x+ax^2}$ 在 $x=0$ 附近的局部贴合。source 给出 $\ln(1+x)$ 的 $[1,2]$ 阶帕德逼近 $R_{1,2}(x)=\frac{12x}{-x^2+6x+12}$。若 $\frac{2x}{2+x+ax^2}$ 要成为这个帕德逼近，则分母只差同倍数： $\frac{2x}{2+x+ax^2}=\frac{12x}{12+6x+6ax^2}$，要与 $\frac{12x}{-x^2+6x+12}$ 一致，就有 $6a=-1$，即 $a=-\frac16$。此时 $h(x)=\ln(1+x)-\frac{12x}{-x^2+6x+12}$ 的图像说明 0 附近的符号 正好对应 $f$ 在 $x=0$ 取极大值。
  key_steps:
    - step_id: step_1
      statement: 把极大值问题转成对数和有理式的比较。
      formula_trace:
        from: $(2+x+ax^2)\ln(1+x)-2x$
        to: $\ln(1+x)-\frac{2x}{2+x+ax^2}$
        operation: 局部除以正的 $2+x+ax^2$。
        why: 帕德逼近解释的是 $\ln(1+x)$ 与有理式的高阶贴合。
      source_ref: page_0275_ex12_solution_start
    - step_id: step_2
      statement: 写出 $\ln(1+x)$ 的 $[1,2]$ 阶帕德逼近。
      formula_trace:
        from: $g(x)=\ln(1+x)$
        to: $R_{1,2}(x)=\frac{12x}{-x^2+6x+12}$
        operation: 套用 source 给出的帕德逼近式。
        why: 这是让有理函数尽可能贴合 $\ln(1+x)$ 的局部模型。
      source_ref: page_0275_ex12_solution_start
    - step_id: step_3
      statement: 匹配分母，锁定 $a$。
      formula_trace:
        from: $\frac{2x}{2+x+ax^2}=\frac{12x}{12+6x+6ax^2}$
        to: $12+6x+6ax^2=12+6x-x^2$，$a=-\frac16$
        operation: 同乘 6 后比较二次项系数。
        why: 只有这个 $a$ 能让题目中的有理式成为 $[1,2]$ 阶帕德逼近。
      source_ref: page_0275_ex12_solution_start
    - step_id: step_4
      statement: 用图像解释极大值位置。
      formula_trace:
        from: $h(x)=\ln(1+x)-\frac{12x}{-x^2+6x+12}$
        to: $f(x)=(2+x-\frac16x^2)\ln(1+x)-2x$ 的极大值与 $h$ 的符号形态等价
        operation: 把同号正因子移回原函数。
        why: page_0276 图像说明 0 附近有正确的左正右负/极大值形态。
      source_ref: page_0276_ex12_solution_continuation
teaching_card:
  student_title: 用帕德逼近看出 $a=-\\frac16$
  what_it_trains: 训练帕德逼近视角：把 $\ln(1+x)$ 用有理函数贴住，参数就是分母二次项的匹配结果。
  recognition_cues:
    - 题面和例11同源，但明确要求“帕德逼近原理解释”。
    - 原函数能改写成 $\ln(1+x)-\frac{2x}{2+x+ax^2}$。
    - $[1,2]$ 阶帕德逼近的分母正好是二次式。
  normalization_moves:
    - 先把 $\ln(1+x)$ 单独拿出来。
    - 写出 source 给出的 $R_{1,2}(x)$。
    - 把题目里的有理式同乘 6，再比较 $x^2$ 系数。
    - 用 $h=\ln(1+x)-R_{1,2}$ 的图像解释极大值。
  common_failures:
    - 把本题当成例11的重复题，只写高阶导而不解释帕德。
    - 忘记 $\frac{2x}{2+x+ax^2}$ 需要先同乘 6 才能和 $R_{1,2}$ 比。
    - 只给 $a=-\frac16$，没有说明为什么这就是 $[1,2]$ 阶逼近。
    - 把帕德逼近当成泰勒展开，没有突出有理函数分母匹配。
  similar_practice_query: 帕德逼近 ln(1+x) [1,2] 12x/(-x^2+6x+12) a=-1/6
