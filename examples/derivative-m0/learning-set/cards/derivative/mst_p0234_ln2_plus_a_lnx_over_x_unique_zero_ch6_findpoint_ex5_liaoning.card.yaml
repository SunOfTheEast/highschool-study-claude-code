stem: |-
  （2024 · 辽宁五校高二期末 T18）已知函数 $f(x)=\ln^2x+\frac{a(\ln x+1)}x$，$a>0$。
  1. 求证：$x>0$，$e^x>x^2$。
  2. 讨论 $f(x)$ 单调性。
  3. 求证：$\forall a>0$，$f(x)$ 有唯一零点。
answer: |-
  第 (1) 问不等式成立；第 (2) 问按 $a=2$、$0<a<2$、$a>2$ 分类；第 (3) 问 $f$ 有唯一零点，且零点位于 $(e^{-1/a-1},1)$。

  第 (1) 问由同构函数可得 $e^x\geqslant\frac{e^2}{4}x^2>x^2$。第 (2) 问 $f'(x)=\frac{2\ln x}{x}+\frac{a(-\ln x)}{x^2} =\frac{(2x-a)\ln x}{x^2}$。当 $a=2$ 时，导数非负，$f$ 在 $(0,+\infty)$ 上递增；当 $0<a<2$ 时，$f$ 在 $(0,a/2)$ 和 $(1,+\infty)$ 上递增，在 $(a/2,1)$ 上递减；当 $a>2$ 时，$f$ 在 $(0,1)$ 和 $(a/2,+\infty)$ 上递增，在 $(1,a/2)$ 上递减。 第 (3) 问 $f(1)=a>0$，$f(a/2)>0$，且 $x>1$ 时 $f(x)>0$。在 $0<x<1$ 上， $f(x)=\frac1x[x\ln^2x+a(\ln x+1)]$。由 $x\ln^2x\leqslant4/e^2<1$，取 $x=e^{-1/a-1}$ 时 $a(\ln x+1)=-1$，故 $f(x)<0$。结合单调性和正值点，得到唯一 零点位于 $(e^{-1/a-1},1)$。
