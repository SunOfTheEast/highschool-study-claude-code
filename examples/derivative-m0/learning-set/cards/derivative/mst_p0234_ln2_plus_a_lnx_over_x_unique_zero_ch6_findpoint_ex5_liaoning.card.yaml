original_problem:
  stem: （2024 · 辽宁五校高二期末 T18）已知函数 $f(x)=\ln^2x+\frac{a(\ln x+1)}x$，$a>0$。
  parts: *a1
  choices: []
  answer: 第 (1) 问不等式成立；第 (2) 问按 $a=2$、$0<a<2$、$a>2$ 分类；第 (3) 问 $f$ 有唯一零点，且零点位于 $(e^{-1/a-1},1)$。
  fidelity_notes:
    - 三问均无选项。
    - 函数定义域为 $x>0$。
solution:
  source_solution_summary: 第 (1) 问由同构函数可得 $e^x\geqslant\frac{e^2}{4}x^2>x^2$。第 (2) 问 $f'(x)=\frac{2\ln x}{x}+\frac{a(-\ln x)}{x^2} =\frac{(2x-a)\ln x}{x^2}$。当 $a=2$ 时，导数非负，$f$ 在 $(0,+\infty)$ 上递增；当 $0<a<2$ 时，$f$ 在 $(0,a/2)$ 和 $(1,+\infty)$ 上递增，在 $(a/2,1)$ 上递减；当 $a>2$ 时，$f$ 在 $(0,1)$ 和 $(a/2,+\infty)$ 上递增，在 $(1,a/2)$ 上递减。 第 (3) 问 $f(1)=a>0$，$f(a/2)>0$，且 $x>1$ 时 $f(x)>0$。在 $0<x<1$ 上， $f(x)=\frac1x[x\ln^2x+a(\ln x+1)]$。由 $x\ln^2x\leqslant4/e^2<1$，取 $x=e^{-1/a-1}$ 时 $a(\ln x+1)=-1$，故 $f(x)<0$。结合单调性和正值点，得到唯一 零点位于 $(e^{-1/a-1},1)$。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问用同构界证明 $e^x>x^2$。
      formula_trace:
        from: $e^x$ 与 $x^2$
        to: $e^x\geqslant\frac{e^2}{4}x^2>x^2$
        operation: 使用同构函数界。
        why: 这是后续控制 $x\ln^2x$ 的基础不等式背景。
      source_ref: page_0234_ex5_liaoning_solution
    - step_id: step_2
      statement: 求导并提取两个关键因子。
      formula_trace:
        from: $f(x)=\ln^2x+\frac{a(\ln x+1)}x$
        to: $f^\prime(x)=\frac{(2x-a)\ln x}{x^2}$
        operation: 求导并合并。
        why: 导数符号只由 $2x-a$ 与 $\ln x$ 决定。
      source_ref: page_0234_ex5_liaoning_solution
    - step_id: step_3
      statement: 按 $a$ 与 2 的关系讨论单调性。
      formula_trace:
        from: $f^\prime(x)=\frac{(2x-a)\ln x}{x^2}$
        to: $a=2$ 递增；$0<a<2$ 增减增；$a>2$ 增减增
        operation: 比较 $a/2$ 与 1 的位置。
        why: 两个导数零点候选是 $x=a/2$ 与 $x=1$。
      source_ref: page_0234_ex5_liaoning_solution
    - step_id: step_4
      statement: 先排除 $x\geqslant1$ 侧的零点。
      formula_trace:
        from: $f(1)=a,\quad f(a/2)>0,\quad x>1$
        to: $x\geqslant1$ 侧 $f(x)>0$
        operation: 结合 source 的正值点和单调性。
        why: 唯一零点只能出现在 $(0,1)$。
      source_ref: page_0234_ex5_liaoning_solution
    - step_id: step_5
      statement: 在 $(0,1)$ 内构造负值点。
      formula_trace:
        from: $f(x)=\frac1x[x\ln^2x+a(\ln x+1)]$
        to: $x=e^{-1/a-1}$ 时 $f(x)<0$
        operation: 用 $x\ln^2x<1$ 与 $a(\ln x+1)=-1$。
        why: 这给出左侧负值点。
      source_ref: page_0234_ex5_liaoning_solution
    - step_id: step_6
      statement: 由单调结构和变号确定唯一零点。
      formula_trace:
        from: $f(e^{-1/a-1})<0,\ f(1)>0$
        to: $\exists! x_0\in(e^{-1/a-1},1),\ f(x_0)=0$
        operation: 结合第 (2) 问单调性。
        why: source 结论为唯一零点。
      source_ref: page_0234_ex5_liaoning_solution
teaching_card:
  student_title: 先看 $(2x-a)\ln x$ 的单调分段，再在 $(0,1)$ 里取负值点
  what_it_trains: 训练含参导数题的双因子判号和零点取点：单调性解决唯一性，构造点解决存在性。
  recognition_cues:
    - 导数能提成 $(2x-a)\ln x$，两个零点候选是 $a/2$ 和 1。
    - 唯一零点不能只靠图像，要证明一侧恒正、一侧变号。
    - $a(\ln x+1)$ 适合用 $x=e^{-1/a-1}$ 精准打成 $-1$。
  normalization_moves:
    - 先证明或引用 $e^x>x^2$。
    - 求导并按 $a=2,0<a<2,a>2$ 分类。
    - 证明 $x\geqslant1$ 侧没有零点。
    - 在 $(0,1)$ 取 $x=e^{-1/a-1}$，得到负值。
  common_failures:
    - 把 $a/2$ 和 1 的顺序分错。
    - 只证明有零点，没有证明唯一。
    - 照抄 source 的 $1/e^2$ 界而不校验。
  similar_practice_query: ln^2x a(lnx+1)/x 唯一零点 (2x-a)lnx e^{-1/a-1} xln^2x
