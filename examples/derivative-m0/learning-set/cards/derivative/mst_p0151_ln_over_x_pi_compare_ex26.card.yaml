solution:
  source_solution_summary: |
    令
    \[
    f(x)=\frac{\ln x}{x},\quad x\ge e.
    \]
    则
    \[
    f^{\prime}(x)=\frac{1-\ln x}{x^2}<0,
    \]
    所以 $f$ 在 $(e,+\infty)$ 上单调递减。
    因 $4<5$，可比得
    \[
    \frac{\pi\ln4}{4}>\frac{\pi\ln5}{5}
    \Rightarrow
    5\ln4^{\pi}>4\ln5^{\pi},
    \]
    即 $b>a$。
    又 $e<\pi<4$，故
    \[
    \frac{\ln\pi}{\pi}>\frac{\ln4}{4}
    \Rightarrow
    \pi^4>4^{\pi}
    \Rightarrow
    5\ln\pi^4>5\ln4^{\pi},
    \]
    即 $c>b$。综上 $a<b<c$，选 B。
  key_steps:
    - step_id: step_1
      statement: 统一到同一比较函数并判单调。
      formula_trace:
        from: |
          $a=4\ln5^{\pi},\ b=5\ln4^{\pi},\ c=5\ln\pi^4$
        to: |
          $f(x)=\frac{\ln x}{x},\quad f^{\prime}(x)=\frac{1-\ln x}{x^2}<0\ (x\ge e)$
        operation: 把含幂对数项改写为“常数倍乘以 $\frac{\ln x}{x}$”并求导。
        why: 同构后可直接用 $f$ 的单调性完成大小判断。
      source_ref: page_0151_ex26_solution
    - step_id: step_2
      statement: 先比较 $b$ 与 $a$。
      formula_trace:
        from: |
          $\frac{\pi\ln4}{4}\ \text{与}\ \frac{\pi\ln5}{5}$
        to: |
          $\frac{\pi\ln4}{4}>\frac{\pi\ln5}{5}
          \Rightarrow
          5\ln4^{\pi}>4\ln5^{\pi}
          \Rightarrow b>a$
        operation: 在 $(e,+\infty)$ 上用 $f$ 递减性比较 $4,5$ 两点。
        why: 锁定前两项相对次序。
      source_ref: page_0151_ex26_solution
    - step_id: step_3
      statement: 再比较 $c$ 与 $b$ 并合并排序。
      formula_trace:
        from: |
          $e<\pi<4,\ \frac{\ln\pi}{\pi}\ \text{与}\ \frac{\ln4}{4}$
        to: |
          $\frac{\ln\pi}{\pi}>\frac{\ln4}{4}
          \Rightarrow \pi^4>4^{\pi}
          \Rightarrow c>b
          \Rightarrow a<b<c$
        operation: 仍用 $f$ 的递减性比较 $\pi,4$。
        why: 完成三项链式比较并匹配选项 B。
      source_ref: page_0151_ex26_solution
teaching_card:
  student_title: 先同构成 $\ln x/x$，再一口气比较 $a,b,c$
  what_it_trains: 训练把“系数+对数幂”统一成同一单调函数值比较，避免逐项硬算。
  recognition_cues:
    - 三项都含“常数 × 对数幂”，且只问大小次序。
    - 可自然出现 $\frac{\ln x}{x}$ 这一同构模板。
    - 选项是纯排序题，适合先定单调再链式判断。
  normalization_moves:
    - 提取公共结构，构造 $f(x)=\ln x/x$。
    - 用 $f^{\prime}(x)$ 判 $x\ge e$ 上递减。
    - 按 $b>a$、$c>b$ 合并成 $a<b<c$。
  common_failures:
    - 忽略定义域条件，误把全区间都当递减。
    - 把 $\pi^4$ 与 $4^{\pi}$ 的比较方向写反。
    - 分别算近似值导致符号误差。
  similar_practice_query: lnx/x 单调性 对数幂 比大小 a<b<c
