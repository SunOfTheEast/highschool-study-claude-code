stem: |-
  （2024 春·江阴市校级月考）已知 $a=4\ln 5^{\pi}$，$b=5\ln 4^{\pi}$，$c=5\ln \pi^{4}$，则 $a,b,c$ 的大小关系是（  ）
  A. $c<a<b$
  B. $a<b<c$
  C. $a<c<b$
  D. $c<b<a$
answer: |
  B

  令
  \[
  f(x)=\frac{\ln x}{x},\quad x\ge e.
  \]
  则
  \[
  f^{\prime}(x)=\frac{1-\ln x}{x^2}<0,
  \]
  所以 $f$ 在 $(e,+\infty)$ 上单调递减。
  因 $4<5$，可比得
  \[
  \frac{\pi\ln4}{4}>\frac{\pi\ln5}{5}
  \Rightarrow
  5\ln4^{\pi}>4\ln5^{\pi},
  \]
  即 $b>a$。
  又 $e<\pi<4$，故
  \[
  \frac{\ln\pi}{\pi}>\frac{\ln4}{4}
  \Rightarrow
  \pi^4>4^{\pi}
  \Rightarrow
  5\ln\pi^4>5\ln4^{\pi},
  \]
  即 $c>b$。综上 $a<b<c$，选 B。
