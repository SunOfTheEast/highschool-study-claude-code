solution:
  source_solution_summary: |
    设切点横坐标为 $t$，指数曲线在 $(t,e^t)$ 处的切线为 $y-e^t=e^t(x-t)$。切线过 $(a,b)$，所以 $b=e^t(a+1-t)$。令 $F(t)=e^t(a+1-t)$，则 $F'(t)=e^t(a-t)$，$F(t)$ 在 $(-\infty,a)$ 上递增、在 $(a,+\infty)$ 上递减，最大值为 $F(a)=e^a$，且左端趋向 $0$。要使水平线 $b$ 与该函数有两个交点，必须且只需 $0<b<e^a$，故选 D。图像法同样说明点 $P(a,b)$ 要在 $x$ 轴上方且在曲线下方。
  key_steps:
    - step_id: step_1
      statement: 设切点参数，写出过点条件。
      formula_trace:
        from: |
          $y-e^t=e^t(x-t),\qquad (a,b)\text{ 在切线上}$
        to: |
          $b-e^t=e^t(a-t),\qquad b=e^t(a+1-t)$
        operation: 用切点 $(t,e^t)$ 和斜率 $e^t$ 写点斜式，再代入外点坐标。
        why: 过同一点能作几条切线，等价于切点参数方程有几个实数解。
      source_ref: page_0085
    - step_id: step_2
      statement: 分析切点参数函数的单调性。
      formula_trace:
        from: |
          $F(t)=e^t(a+1-t)$
        to: |
          $F'(t)=e^t(a-t),\quad F(t)\nearrow(-\infty,a),\quad F(t)\searrow(a,+\infty),\quad F(a)=e^a$
        operation: 对 $F(t)$ 求导，并按 $t<a$、$t>a$ 判断导数符号。
        why: 方程 $F(t)=b$ 的解的个数由 $F$ 的单峰形状决定。
      source_ref: page_0085
    - step_id: step_3
      statement: 由两个切点解得到参数区域。
      formula_trace:
        from: |
          $F(t)=b$ 有两个不同实数解
        to: |
          $0<b<e^a$
        operation: 利用 $F(t)$ 左端趋近 $0$、峰值为 $e^a$、右端降到负值的图像。
        why: 只有当水平线高度介于 $0$ 与最大值 $e^a$ 之间时，左右两侧各有一个切点。
      source_ref: page_0085
    - step_id: step_4
      statement: 用图像区域复核选项。
      formula_trace:
        from: |
          $P(a,b)$ 在 $y=e^x$ 的下方且在 $x$ 轴上方
        to: |
          $0<b<e^a$
        operation: 根据指数曲线 $y>0$ 和下凸曲线外点引两切线的区域判断。
        why: 点在曲线上只有一条切线，点在曲线上方没有切线，点在曲线下方且 $b>0$ 时有两条切线。
      source_ref: page_0085
teaching_card:
  student_title: 用切点参数判断指数曲线两条切线
  what_it_trains: 训练把“过一点能作几条切线”转化为切点参数方程的解个数，并用凹凸图像确认点所在区域。
  recognition_cues:
    - 题干说“过点可以作两条切线”，切点未知，适合设切点横坐标。
    - $y=e^x$ 的切线斜率仍是 $e^t$，代入外点后会得到单峰函数。
    - 选项里出现 $e^a$，提示比较点的纵坐标 $b$ 与曲线上同横坐标的高度。
  normalization_moves:
    - 设切点为 $(t,e^t)$，写 $y-e^t=e^t(x-t)$。
    - 代入 $(a,b)$，把问题化为 $b=F(t)$ 的交点数。
    - 用 $F$ 的最大值 $e^a$ 与左端界 $0$ 得到 $0<b<e^a$。
  common_failures:
    - 把外点横坐标 $a$ 误当成切点横坐标。
    - 只判断 $b<e^a$，漏掉 $b>0$ 才能有左侧切点。
    - 看到点在曲线下方就选 $b<e^a$，没有排除 $x$ 轴下方只有一条切线的情形。
  similar_practice_query: 指数函数 过点两条切线 切点参数 $b=e^t(a+1-t)$
