original_problem:
  stem: （2022 · 乙卷文科）已知函数 $f(x)=ax-\frac{1}{x}-(a+1)\ln x$。
  parts: *a1
  choices: []
  answer: (1) $f_{\max}=-1$；(2) $a\in(0,+\infty)$。
  fidelity_notes:
    - 无选项。
    - source 对 $a>1$ 与 $0<a<1$ 的取点证明写在 page_0277 顶部。
solution:
  source_solution_summary: 当 $a=0$ 时，$f(x)=-\frac1x-\ln x$，最大值在 $x=1$ 处取得，值为 $-1$。第二问先求导： $f^\prime(x)=\frac{(ax-1)(x-1)}{x^2}$。这里 $x=1$ 是显点， $x=\frac1a$ 是隐点。$a\le0$ 时最大值仍小于 0，没有零点； $a=1$ 时单调递增且 $f(1)=0$，恰有一个零点。$a>1$ 时， $x=\frac1a$ 在 $1$ 左边，显点 $x=1$ 处为极小值且 $f(1)>0$， 再由 page_0277 的取点 $x=\frac1{(a+2)^2}$ 证左侧有负值， 因而只在左侧穿一次。$0<a<1$ 时，显点 $x=1$ 处为极大值且 $f(1)<0$，再由取点 $x=\left(\frac{a+2}{a}\right)^2$ 证右侧有正值， 因而只在右侧穿一次。综上 $a>0$。
  key_steps:
    - step_id: step_1
      statement: 先解决 $a=0$ 的最大值。
      formula_trace:
        from: $f(x)=ax-\frac1x-(a+1)\ln x$
        to: $a=0,\ f(x)=-\frac1x-\ln x,\ f_{\max}=f(1)=-1$
        operation: 代入 $a=0$ 后按源解读出最大值点 $x=1$。
        why: 第一问是基础极值，给第二问的显点 $x=1$ 做铺垫。
      source_ref: page_0276_ex01_solution_start
    - step_id: step_2
      statement: 求导并识别一显一隐两个驻点。
      formula_trace:
        from: $f(x)=ax-\frac1x-(a+1)\ln x$
        to: $f^\prime(x)=\frac{(ax-1)(x-1)}{x^2}$
        operation: 求导并因式分解。
        why: $x=1$ 是显点，$x=\frac1a$ 是隐点，零点个数由两处极值高度控制。
      source_ref: page_0276_ex01_solution_start
    - step_id: step_3
      statement: 排除 $a\le0$，并处理 $a=1$。
      formula_trace:
        from: $a\le0$ 或 $a=1$
        to: $a\le0$ 无零点；$a=1$ 时仅 $f(1)=0$
        operation: 用显点值 $f(1)=a-1$ 和单调性判断。
        why: $a\le0$ 时整体峰值小于 0；$a=1$ 时两个驻点重合，单调递增，只穿一次。
      source_ref: page_0276_ex01_solution_start
    - step_id: step_4
      statement: 当 $a>1$，用左侧取点补出唯一零点。
      formula_trace:
        from: $a>1,\quad 0<\frac1a<1,\quad f(1)=a-1>0$
        to: $f\left(\frac1{(a+2)^2}\right)<0,\ \exists x_1\in\left(\frac1{(a+2)^2},\frac1a\right),\ f(x_1)=0$
        operation: 按 source 的放缩取点证明左侧存在负值。
        why: 两个极值都在 $x$ 轴上方时，只要左端附近找到负值，就能锁定唯一穿轴点。
      source_ref: page_0277_ex01_solution_continuation
    - step_id: step_5
      statement: 当 $0<a<1$，用右侧取点补出唯一零点。
      formula_trace:
        from: $0<a<1,\quad 1<\frac1a,\quad f(1)=a-1<0$
        to: $f\left(\left(\frac{a+2}{a}\right)^2\right)>0,\ \exists x_2\in\left(\frac1a,\left(\frac{a+2}{a}\right)^2\right),\ f(x_2)=0$
        operation: 按 source 的对称放缩取点证明右侧存在正值。
        why: 两个极值都在 $x$ 轴下方时，只要右端附近找到正值，就能锁定唯一穿轴点。
      source_ref: page_0277_ex01_solution_continuation
    - step_id: step_6
      statement: 合并参数范围。
      formula_trace:
        from: $a=1$、$a>1$、$0<a<1$ 均可；$a\le0$ 不可
        to: $a\in(0,+\infty)$
        operation: 分类合并。
        why: 所有正参数都恰有一个零点，非正参数不满足。
      source_ref: page_0277_ex01_solution_continuation
teaching_card:
  student_title: 用显点 $x=1$ 找出唯一零点的参数范围
  what_it_trains: 训练显点探路：导数里有一个看得见的驻点 $x=1$，另一个隐点 $1/a$ 跟它换位置，零点个数就由两处极值高度和两端取点决定。
  recognition_cues:
    - 导数能分解出 $(ax-1)(x-1)$，其中 $x=1$ 不随参数动。
    - 题目问“恰有一个零点”，不是单纯求极值。
    - $a>1$ 与 $0<a<1$ 时，显点和隐点的位置正好互换。
    - 源页配了两张图，核心是看曲线只在一侧穿过 $x$ 轴。
  normalization_moves:
    - 先求导并因式分解，别急着硬解 $f(x)=0$。
    - 把 $x=1$ 叫显点，把 $x=1/a$ 叫隐点。
    - 用 $f(1)=a-1$ 先排除和分段。
    - 最后才用 source 的特殊取点证明确实穿轴。
  common_failures:
    - 直接解 $ax-\frac1x-(a+1)\ln x=0$，会陷入超越方程。
    - 只看到 $x=1$，忘了另一个驻点 $x=\frac1a$。
    - 把放缩取点当成主方法，反而看不出零点个数由极值位置控制。
    - 没有分清 $a>1$ 和 $0<a<1$ 时 $1$ 与 $\frac1a$ 的左右顺序。
    - 认为 $a\le0$ 也可能有一个零点，忽略最大值小于 0。
  similar_practice_query: 显点 x=1 隐点 1/a 恰有一个零点 ax-1/x-(a+1)lnx
