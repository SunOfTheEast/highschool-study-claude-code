stem: |-
  （2022 · 乙卷文科）已知函数 $f(x)=ax-\frac{1}{x}-(a+1)\ln x$。
  1. 当 $a=0$ 时，求 $f(x)$ 的最大值。
  2. 若 $f(x)$ 恰有一个零点，求 $a$ 的取值范围。
answer: |-
  (1) $f_{\max}=-1$；(2) $a\in(0,+\infty)$。

  当 $a=0$ 时，$f(x)=-\frac1x-\ln x$，最大值在 $x=1$ 处取得，值为 $-1$。第二问先求导： $f^\prime(x)=\frac{(ax-1)(x-1)}{x^2}$。这里 $x=1$ 是显点， $x=\frac1a$ 是隐点。$a\le0$ 时最大值仍小于 0，没有零点； $a=1$ 时单调递增且 $f(1)=0$，恰有一个零点。$a>1$ 时， $x=\frac1a$ 在 $1$ 左边，显点 $x=1$ 处为极小值且 $f(1)>0$， 再由 page_0277 的取点 $x=\frac1{(a+2)^2}$ 证左侧有负值， 因而只在左侧穿一次。$0<a<1$ 时，显点 $x=1$ 处为极大值且 $f(1)<0$，再由取点 $x=\left(\frac{a+2}{a}\right)^2$ 证右侧有正值， 因而只在右侧穿一次。综上 $a>0$。
