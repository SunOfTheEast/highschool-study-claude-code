stem: 求函数 $f(x)=2x^2-1$ 的稳定点。
answer: |-
  $-\frac12,\ 1,\ \frac{-1+\sqrt5}{4},\ \frac{-1-\sqrt5}{4}$

  稳定点满足 $f(f(x))=x$。对 $f(x)=2x^2-1$， $f(f(x))=2(2x^2-1)^2-1$，所以 $2(2x^2-1)^2-1=x$，即 $8x^4-8x^2-x+1=0$。不动点一定是稳定点，而 $2x^2-1=x$ 的两个不动点为 $x=-\frac12,1$，因此四次多项式含因式 $(x-1)(2x+1)$。继续分解得 $(x-1)(2x+1)(4x^2+2x-1)=0$，所以另外两个稳定点为 $\frac{-1\pm\sqrt5}{4}$。稳定点总共是 $-\frac12,1,\frac{-1+\sqrt5}{4},\frac{-1-\sqrt5}{4}$。
