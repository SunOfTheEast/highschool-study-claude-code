original_problem:
  stem: 求函数 $f(x)=2x^2-1$ 的稳定点。
  parts: *a1
  choices: []
  answer: $-\frac12,\ 1,\ \frac{-1+\sqrt5}{4},\ \frac{-1-\sqrt5}{4}$
  fidelity_notes:
    - 源题为概念例题，无选项。
    - 题目前 exposition 定义了不动点与稳定点，是本卡必要上下文。
solution:
  source_solution_summary: 稳定点满足 $f(f(x))=x$。对 $f(x)=2x^2-1$， $f(f(x))=2(2x^2-1)^2-1$，所以 $2(2x^2-1)^2-1=x$，即 $8x^4-8x^2-x+1=0$。不动点一定是稳定点，而 $2x^2-1=x$ 的两个不动点为 $x=-\frac12,1$，因此四次多项式含因式 $(x-1)(2x+1)$。继续分解得 $(x-1)(2x+1)(4x^2+2x-1)=0$，所以另外两个稳定点为 $\frac{-1\pm\sqrt5}{4}$。稳定点总共是 $-\frac12,1,\frac{-1+\sqrt5}{4},\frac{-1-\sqrt5}{4}$。
  key_steps:
    - step_id: step_1
      statement: 按定义写出稳定点方程。
      formula_trace:
        from: $f(x)=2x^2-1$
        to: $f(f(x))=2(2x^2-1)^2-1=x$
        operation: 把 $f(x)$ 再代入一次 $f$。
        why: 稳定点的定义就是 $f(f(x))=x$。
      source_ref: page_0191
    - step_id: step_2
      statement: 展开为四次方程。
      formula_trace:
        from: $2(2x^2-1)^2-1=x$
        to: $8x^4-8x^2-x+1=0$
        operation: 展开并移项。
        why: 需要把稳定点求解转成代数方程。
      source_ref: page_0191
    - step_id: step_3
      statement: 用不动点降阶分解。
      formula_trace:
        from: $2x^2-1=x$
        to: $x=-\frac12,\ 1$ 是稳定点，四次式含 $(x-1)(2x+1)$
        operation: 先解不动点方程，再用“不动点必为稳定点”找因式。
        why: 避免盲目硬分解四次方程。
      source_ref: page_0191
    - step_id: step_4
      statement: 分解剩余二次因式得到全部稳定点。
      formula_trace:
        from: $8x^4-8x^2-x+1$
        to: $(x-1)(2x+1)(4x^2+2x-1)=0$
        operation: 多项式因式分解并解 $4x^2+2x-1=0$。
        why: 剩余两个根是稳定点但不是不动点。
      source_ref: page_0191
teaching_card:
  student_title: 用不动点帮稳定点方程降阶
  what_it_trains: 训练把复合函数稳定点转成方程后，不硬拆四次式，而是先用不动点找出已知因式。
  recognition_cues:
    - 题目问稳定点，定义是 $f(f(x))=x$。
    - 函数是二次函数，复合后会出现四次方程。
    - 不动点一定是稳定点，可以先拿来降阶。
  normalization_moves:
    - 先写 $f(f(x))=x$。
    - 再解 $f(x)=x$ 找不动点。
    - 用不动点作为因式分解四次方程。
  common_failures:
    - 只求不动点，漏掉非不动点的稳定点。
    - 直接展开四次后不会分解。
    - 把 $\frac{-1\pm\sqrt5}{4}$ 误判成不动点。
  similar_practice_query: 稳定点 f(f(x))=x 不动点 因式分解 2x^2-1
