solution:
  source_solution_summary: |
    法一设
    \[
    A(x)=e^x-1,\quad B(x)=\ln(1+x),\quad C(x)=\frac{x}{1+x},\quad D(x)=\sqrt{1+x}-1.
    \]
    在同一点 $x_0=0$、同增量 $\Delta x=0.02$ 比较。
    先看一阶导：
    \[
    A^{\prime}(0)=B^{\prime}(0)=C^{\prime}(0)=1>D^{\prime}(0)=\frac12,
    \]
    得 $d$ 最小。再看二阶导：
    \[
    A^{\prime\prime}(0)=1,\quad B^{\prime\prime}(0)=-1,\quad C^{\prime\prime}(0)=-2,
    \]
    得 $a>b>c$。综合
    \[
    a>b>c>d.
    \]
    所以 A、C、D 正确，B 错误。
    法二数值夹逼也支持该顺序：
    \[
    0.02<a<0.0202,\quad 0.0196<b<0.02,\quad c=\frac1{51}\approx0.0196,\quad d<0.01.
    \]
  key_steps:
    - step_id: step_1
      statement: 把四个量统一成同点同增量函数值比较。
      formula_trace:
        from: $a,b,c,d$ 的定义
        to: $A,B,C,D$ 在 $x_0=0,\ \Delta x=0.02$ 下比较
        operation: 同构映射并统一比较框架。
        why: 可直接用导数阶次判细微大小。
      source_ref: page_0161_ex20_solution_start
    - step_id: step_2
      statement: 一阶导先判 $d$ 最小。
      formula_trace:
        from: $A^{\prime}(0)=B^{\prime}(0)=C^{\prime}(0)=1,\ D^{\prime}(0)=\frac12$
        to: $d$ 对应函数增量最小
        operation: 同增量下先比较一阶导大小。
        why: 先把最小项锁定。
      source_ref: page_0162_ex20_solution_continuation
    - step_id: step_3
      statement: 二阶导确定 $a,b,c$ 的顺序。
      formula_trace:
        from: $A^{\prime\prime}(0)=1,\ B^{\prime\prime}(0)=-1,\ C^{\prime\prime}(0)=-2$
        to: $a>b>c$
        operation: 一阶同值时用二阶导排序。
        why: 完成前三项大小关系。
      source_ref: page_0162_ex20_solution_continuation
    - step_id: step_4
      statement: 合并得到总序并映射到多选。
      formula_trace:
        from: $a>b>c$ 且 $c>d$
        to: $a>b>c>d\Rightarrow A,C,D$ 正确
        operation: 链式传递比较。
        why: 直接判断四个选项真伪。
      source_ref: page_0162_ex20_solution_continuation
    - step_id: step_5
      statement: 用法二区间估计做数值复核。
      formula_trace:
        from: $0.02<a<0.0202,\ 0.0196<b<0.02,\ c\approx0.0196,\ d<0.01$
        to: $a>b>c>d$ 与法一一致
        operation: 夹逼估值。
        why: 验证选择 ACD 的稳定性。
      source_ref: page_0162_ex20_solution_continuation
teaching_card:
  student_title: 四函数同增量：先锁最小，再排其余
  what_it_trains: 训练多选排序题的稳健流程：同构成四个标准函数后，用一阶和二阶导分层判真伪。
  recognition_cues:
    - 题目变量都靠近 1，且含 $e^x,\ln(1+x),\sqrt{1+x}$。
    - 选项是若干二元比较式的真假判断。
    - 题干显式给小增量数值（如 0.02）。
  normalization_moves:
    - 把每一项写成 $x=0$ 邻域增量。
    - 一阶导先分出明显小项。
    - 其余项再靠二阶导细分。
    - 最后回到选项逐条判真。
  common_failures:
    - 把 $d$ 与其他项混在一起比较，丢掉一阶导优势。
    - 法二小数位误抄导致 $b,c$ 顺序误判。
    - 明明得到总序，却在多选映射时漏选 C 或 D。
  similar_practice_query: e^0.02 ln1.02 1/51 sqrt1.02-1 多选 比大小 微元法
