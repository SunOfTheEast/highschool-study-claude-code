stem: |-
  （2023·清远期末·多选）设 $a=e^{0.02}-1$，$b=\ln1.02$，$c=\frac{1}{51}$，$d=\sqrt{1.02}-1$，则（  ）
  A. $b<a$
  B. $b<c$
  C. $d<b$
  D. $d<c$
answer: |
  ACD

  法一设
  \[
  A(x)=e^x-1,\quad B(x)=\ln(1+x),\quad C(x)=\frac{x}{1+x},\quad D(x)=\sqrt{1+x}-1.
  \]
  在同一点 $x_0=0$、同增量 $\Delta x=0.02$ 比较。
  先看一阶导：
  \[
  A^{\prime}(0)=B^{\prime}(0)=C^{\prime}(0)=1>D^{\prime}(0)=\frac12,
  \]
  得 $d$ 最小。再看二阶导：
  \[
  A^{\prime\prime}(0)=1,\quad B^{\prime\prime}(0)=-1,\quad C^{\prime\prime}(0)=-2,
  \]
  得 $a>b>c$。综合
  \[
  a>b>c>d.
  \]
  所以 A、C、D 正确，B 错误。
  法二数值夹逼也支持该顺序：
  \[
  0.02<a<0.0202,\quad 0.0196<b<0.02,\quad c=\frac1{51}\approx0.0196,\quad d<0.01.
  \]
