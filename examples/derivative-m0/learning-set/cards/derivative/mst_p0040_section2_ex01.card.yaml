original_problem:
  stem: （2013 · 新课标 II T21）已知函数 f(x)=e^x-\ln(x+m)。
  parts: *a1
  choices: []
  answer: (1) m=1，f(x) 在 (-1,0) 上单调递减，在 (0,+infty) 上单调递增； (2) 对定义域内的 x，f(x)>0。
  fidelity_notes:
    - 题中对数要求 x+m>0；当 m=1 时第 (1) 问定义域为 (-1,+infty)。
solution:
  source_solution_summary: 先由 f'(0)=0 求出 m=1，再把 f(x) 表成 h(x)+h(ln(x+1))+1 来判断单调性； 第 (2) 问用同一个 h(t)=e^t-t-1>=0 拆成两个非负同构项和 2-m，并检查取等条件不能同时成立。
  key_steps:
    - step_id: step_1
      statement: 求导得 f'(x)=e^x-1/(x+m)。由 x=0 是极值点，f'(0)=1-1/m=0，所以 m=1。
      formula_trace:
        from: f'(0)=1-1/m=0
        to: m=1
        operation: 用极值点的必要条件 f'(0)=0 解参数
        why: x=0 在定义域内部且为极值点，导数必须为 0。
      source_ref: page_0040:例1解析(1)
    - step_id: step_2
      statement: 令 h(t)=e^t-t-1，则 h'(t)=e^t-1，h(t) 在 (-infty,0) 上递减、 在 (0,+infty) 上递增，且 h(t)>=0。
      formula_trace:
        from: h'(t)=e^t-1
        to: h(t)>=0, equality only at t=0
        operation: 用导数单调性确定 h 的全局最小值
        why: h'(t) 在 0 左负右正，h(0)=0。
      source_ref: page_0040:例1解析(1)-(2)
    - step_id: step_3
      statement: m=1 时，f(x)=h(x)+h(ln(x+1))+1；其中 h(x) 与 h(ln(x+1)) 在 (-1,0) 上都随 x 递减，在 (0,+infty) 上都随 x 递增。
      formula_trace:
        from: e^x-ln(x+1)
        to: h(x)+h(ln(x+1))+1
        operation: 补出 e^x-x-1 与 x+1-ln(x+1)-1 两个 h 型
        why: e^{ln(x+1)}=x+1，可把指数项和对数项放到同一个 h 结构中。
      source_ref: page_0040:例1解析(1)
    - step_id: step_4
      statement: 一般 m<=2 时， e^x-ln(x+m)=h(x)+h(ln(x+m))+2-m。前两项非负，2-m 非负； 若 m=2，h(x)=0 要求 x=0，而 h(ln(x+2))=0 要求 x=-1，不能同时成立， 所以 f(x)>0。
      formula_trace:
        from: e^x-ln(x+m)
        to: h(x)+h(ln(x+m))+2-m
        operation: 加减 x+1 与 x+m-1，拆成两个 h 非负项
        why: 同构拆分后只需比较非负项，并用取等条件排除等号。
      source_ref: page_0040:例1解析(2)
teaching_card:
  student_title: 把 e^x 和 ln(x+m) 拆成两个同构非负项
  what_it_trains: 训练学生看到 e^x-\ln(x+m) 时，主动补出 h(x)=e^x-x-1 和 h(ln(x+m))=(x+m)-ln(x+m)-1，用同一个切线不等式完成单调性与证明。
  recognition_cues:
    - 同时出现 e^x 与 ln(x+m)。
    - 参数条件 m<=2 正好能留下 2-m 这个非负常数。
    - 要证明严格大于 0，需要检查多个非负项的取等条件。
  normalization_moves:
    - 设 h(t)=e^t-t-1，把指数切线不等式标准化。
    - 把 ln(x+m) 的对象 x+m 写成 e^{ln(x+m)}。
    - 拆完后单独检查 h(x)=0 与 h(ln(x+m))=0 是否能同时成立。
  common_failures:
    - 只写 h(t)>=0，却忘记说明为什么等号不能出现。
    - 忽略定义域 x+m>0。
    - 把 h(ln(x+m)) 误写成 h(x+m)，导致结构错位。
  similar_practice_query: e^x 与 ln(x+a) 的同构拆分证明不等式，检查取等条件
