stem: |-
  （2013 · 新课标 II T21）已知函数 f(x)=e^x-\ln(x+m)。
  (1). 设 x=0 是 f(x) 的极值点，求 m，并讨论 f(x) 的单调性。
  (2). 当 m<=2 时，证明 f(x)>0。
answer: |-
  (1) m=1，f(x) 在 (-1,0) 上单调递减，在 (0,+infty) 上单调递增； (2) 对定义域内的 x，f(x)>0。

  先由 f'(0)=0 求出 m=1，再把 f(x) 表成 h(x)+h(ln(x+1))+1 来判断单调性； 第 (2) 问用同一个 h(t)=e^t-t-1>=0 拆成两个非负同构项和 2-m，并检查取等条件不能同时成立。
rubric:
  max_score: 4
  criteria:
    - step_id: step_1
      description: 求导得 f'(x)=e^x-1/(x+m)。由 x=0 是极值点，f'(0)=1-1/m=0，所以 m=1。
      max_score: 1
    - step_id: step_2
      description: 令 h(t)=e^t-t-1，则 h'(t)=e^t-1，h(t) 在 (-infty,0) 上递减、 在 (0,+infty) 上递增，且 h(t)>=0。
      max_score: 1
    - step_id: step_3
      description: m=1 时，f(x)=h(x)+h(ln(x+1))+1；其中 h(x) 与 h(ln(x+1)) 在 (-1,0) 上都随 x 递减，在 (0,+infty) 上都随 x 递增。
      max_score: 1
    - step_id: step_4
      description: 一般 m<=2 时， e^x-ln(x+m)=h(x)+h(ln(x+m))+2-m。前两项非负，2-m 非负； 若 m=2，h(x)=0 要求 x=0，而 h(ln(x+2))=0 要求 x=-1，不能同时成立， 所以 f(x)>0。
      max_score: 1
