stem: 若直线 y=kx+b 既是曲线 y=\ln x+2 的切线，又是曲线 y=\ln(x+3) 的切线，则 b=______。
answer: |-
  1+\ln\frac{3}{2}

  设公切线分别切于 x_1 与 x_2。两处斜率相同给出 1/x_1=1/(x_2+3)，即 x_1=x_2+3；两条切线的截距相同给出 1+\ln x_1=-x_2/(x_2+3)+\ln(x_2+3)。解得 x_1=3/2、x_2=-3/2、k=2/3，再代入第一条曲线切点，得到 b=1+\ln(3/2)。
