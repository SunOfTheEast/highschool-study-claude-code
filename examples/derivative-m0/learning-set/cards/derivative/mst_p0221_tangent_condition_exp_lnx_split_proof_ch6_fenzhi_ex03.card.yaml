stem: |-
  （2014 · 新课标 I T21）设函数 $f(x)=ae^x\ln x+\frac{be^{x-1}}x$，曲线 $y=f(x)$ 在点 $(1,f(1))$ 处的切线方程为 $y=e(x-1)+2$。
  1. 求 $a$ 和 $b$ 的值。
  2. 证明：$f(x)>1$。
answer: |-
  （1）$a=1,b=2$；（2）证明见解析。

  由切线方程 $y=e(x-1)+2$，得 $f(1)=2$、$f^{\prime}(1)=e$。 对 $f(x)=ae^x\ln x+\frac{be^{x-1}}x$ 求导： $f^{\prime}(x)=ae^x\ln x+\frac{a}{x}e^x -\frac{b}{x^2}e^{x-1}+\frac{b}{x}e^{x-1}$。代入 $x=1$， $f(1)=b=2$，$f^{\prime}(1)=ae=e$，所以 $a=1,b=2$。 第二问变为证明 $e^x\ln x+\frac2x e^{x-1}>1$。source 将其等价变形为 $x\ln x>xe^{-x}-\frac2e$。令 $g(x)=x\ln x$，则 $g_{\min}=g(1/e)=-1/e$；令 $h(x)=xe^{-x}-2/e$，则 $h_{\max}=h(1)=-1/e$。虽然数值相等，但左侧取等点 $1/e$ 与右侧取等点 $1$ 不同，因此对任意 $x>0$ 有 $g(x)>h(x)$，即 $f(x)>1$。
