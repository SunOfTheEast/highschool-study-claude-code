stem: |-
  (2020·新课标ⅠT12) 若 $2^a+\log_2 a=4^b+2\log_4 b$ 则 (  )

  A. $a>2b$
  B. $a<2b$
  C. $a>b^2$
  D. $a<b^2$
answer: |-
  B

  把右侧 $4^b+2\log_4 b$ 改写为 $2^{2b}+\log_2 b$，再与 $2^{2b}+\log_2(2b)$ 比较。令 $f(x)=2^x+\log_2 x$，由其在 $(0,+\infty)$ 上单调递增，得到 $f(a)<f(2b)$，所以 $a<2b$，选 B。
