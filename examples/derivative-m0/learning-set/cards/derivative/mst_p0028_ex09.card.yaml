solution:
  source_solution_summary: A 中 $f(\ln x)=x-\ln x=g(x)$，但 $g$ 在 $(0,1)$ 递减、在 $(1,+\infty)$ 递增，所以 A 错。B 中 $g(e^x)=e^x-x=h(x)$，$h$ 在 $(0,+\infty)$ 递增，所以 B 对。C 中 $x>1$ 时 $ax>0$、$\ln x^2>0$，由 $f'(u)=e^u-1>0$ 得 $f$ 在正区间递增，故 $f(ax)\ge f(\ln x^2)$ 等价推出 $a\ge 2\ln x/x$，其最大值为 $2/e$。D 中由 $x_1-\ln x_1=x_2-\ln x_2$ 得 $(x_2-x_1)/(\ln x_2-\ln x_1)=1$，ALG 不等式给出 $1<(x_1+x_2)/2$，所以 $x_1+x_2>2$，D 错。
  key_steps:
    - step_id: step_1
      statement: 判断 A：把复合函数还原成 $g(x)$。
      formula_trace:
        from: $f(\ln x)$
        to: $e^{\ln x}-\ln x=x-\ln x=g(x)$
        operation: 把 $\ln x$ 代入 $f(u)=e^u-u$，并用 $e^{\ln x}=x$。
        why: $g(x)=x-\ln x$ 在 $(0,1)$ 递减、在 $(1,+\infty)$ 递增，所以不能说在整个 $(0,+\infty)$ 上递增。
      source_ref: page_0028_ex09_solution
    - step_id: step_2
      statement: 判断 B：把 $g(e^x)$ 识别为已知递增模型。
      formula_trace:
        from: $g(e^x)$
        to: $e^x-\ln(e^x)=e^x-x$
        operation: 代入 $g(u)=u-\ln u$，并用 $\ln(e^x)=x$。
        why: 源页把它视为 $h(x)$ 型函数，且在 $(0,+\infty)$ 单调递增。
      source_ref: page_0028_ex09_solution
    - step_id: step_3
      statement: 判断 C：用 $f$ 的正区间单调性把函数值比较转成输入比较。
      formula_trace:
        from: $f(ax)\geqslant f(\ln x^2),\quad x>1, a>0
        to: $ax\geqslant \ln x^2=2\ln x$
        operation: 由 $ax>0$、$\ln x^2>0$，且 $f'(u)=e^u-1>0$ 在 $u>0$ 恒成立，使用 $f$ 在 $(0,+\infty)$ 上递增。
        why: 恒成立的函数值不等式被化为参数下界不等式。
      source_ref: page_0028_ex09_solution
    - step_id: step_4
      statement: 继续判断 C：求参数最小值。
      formula_trace:
        from: $ax\geqslant2\ln x\quad(x>1)$
        to: $a\geqslant\left(\frac{2\ln x}{x}\right)_{\max}=\frac2e$
        operation: 同除以 $x>0$，再用 $\ln x/x$ 在 $x=e$ 处取最大值 $1/e$。
        why: 对所有 $x>1$ 成立时，$a$ 至少要压住右侧最大值。
      source_ref: page_0028_ex09_solution
    - step_id: step_5
      statement: 判断 D：把两根关系转成对数平均数。
      formula_trace:
        from: $x_1-\ln x_1=x_2-\ln x_2$
        to: $\frac{x_2-x_1}{\ln x_2-\ln x_1}=1<\frac{x_1+x_2}{2}$
        operation: 移项得 $x_2-x_1=\ln x_2-\ln x_1$，再套用对数平均数小于算术平均数的 ALG 不等式。
        why: 由 $1<(x_1+x_2)/2$ 得 $x_1+x_2>2$，与选项 D 的 $x_1+x_2<2$ 相反。
      source_ref: page_0028_ex09_solution
teaching_card:
  student_title: 把复合输入还原成六大函数
  what_it_trains: 训练在多选题中逐项把 $\ln x$、$e^x$、$ax$ 这些输入代回原函数，借已知单调性和平均数不等式快速判定。
  recognition_cues:
    - 题干给出两个函数 $e^x-x$ 与 $x-\ln x$，选项又出现 $\ln x$、$e^x$ 作为输入。
    - 恒成立选项中同时有 $ax$ 和 $\ln x^2$，提示用 $f$ 的递增性比较输入。
    - 两根满足 $x-\ln x$ 取同一值，提示移项成对数平均数。
  normalization_moves:
    - 先把 $f(\ln x)$ 算成 $x-\ln x$，再看它的实际单调区间。
    - 把 $g(e^x)$ 算成 $e^x-x$，直接调用正区间递增性。
    - 把 $f(ax)\ge f(\ln x^2)$ 化成 $a\ge2\ln x/x$。
    - 把 $x_1-\ln x_1=x_2-\ln x_2$ 改写成对数平均数等于 1。
  common_failures:
    - 只看 $x-\ln x$ 在 $x>1$ 递增，忘了 A 的定义域是整个 $(0,+\infty)$。
    - C 中没有先确认 $ax$ 与 $\ln x^2$ 都在 $f$ 的递增区间。
    - 把 $\max 2\ln x/x$ 算成 $1/e$，漏掉系数 2。
    - D 中由 $1<(x_1+x_2)/2$ 反推出了错误方向。
  similar_practice_query: e^x-x x-ln x 复合函数 单调性 恒成立 ln x/x ALG 对数平均数
