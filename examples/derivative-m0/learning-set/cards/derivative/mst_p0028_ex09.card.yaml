stem: |-
  (2023 丹阳月考多选 T12) 函数 $f(x)=e^x-x$, $g(x)=x-\ln x$, 则下列正确的是 (  )
  A. $f(\ln x)$ 在 $(0,+\infty)$ 上是增函数
  B. $g(e^x)$ 在 $(0,+\infty)$ 上是增函数
  C. $\forall x>1$, 不等式 $f(ax)\geqslant f(\ln x^2)$ 恒成立，则正实数 $a$ 的最小值为 $\frac{2}{e}$
  D. 若 $g(x)=t$ 有两个零点 $x_1$, $x_2$, 则 $x_1+x_2<2$
answer: |-
  BC

  A 中 $f(\ln x)=x-\ln x=g(x)$，但 $g$ 在 $(0,1)$ 递减、在 $(1,+\infty)$ 递增，所以 A 错。B 中 $g(e^x)=e^x-x=h(x)$，$h$ 在 $(0,+\infty)$ 递增，所以 B 对。C 中 $x>1$ 时 $ax>0$、$\ln x^2>0$，由 $f'(u)=e^u-1>0$ 得 $f$ 在正区间递增，故 $f(ax)\ge f(\ln x^2)$ 等价推出 $a\ge 2\ln x/x$，其最大值为 $2/e$。D 中由 $x_1-\ln x_1=x_2-\ln x_2$ 得 $(x_2-x_1)/(\ln x_2-\ln x_1)=1$，ALG 不等式给出 $1<(x_1+x_2)/2$，所以 $x_1+x_2>2$，D 错。
