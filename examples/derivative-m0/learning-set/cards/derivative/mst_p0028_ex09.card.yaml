  structure:
    primary: 同构结构
    secondary:
      - 指对复合结构
      - 不等式工具结构
    evidence:
      - $f(\ln x)=g(x)$，$g(e^x)=e^x-x$，都是把复合输入还原到已知单调函数。
      - $f(ax)\ge f(\ln x^2)$ 在正区间转成 $ax\ge2\ln x$。
      - $x_1-\ln x_1=x_2-\ln x_2$ 转成对数平均数。
    normalization_moves_used:
      - $e^{\ln x}=x$，把 $f(\ln x)$ 化成 $x-\ln x$。
      - $\ln(e^x)=x$，把 $g(e^x)$ 化成 $e^x-x$。
      - $\ln x^2=2\ln x$，分离出 $a\ge2\ln x/x$。
      - 把两根等式移项成 $(x_2-x_1)/(\ln x_2-\ln x_1)=1$。
  fallback:
    only_if_trace_shows:
      - 若学生把 $g(x)$ 误认为在整个 $(0,+\infty)$ 上递增，回补导数单调极值基础。
      - 若学生不会由 $f(ax)\ge f(\ln x^2)$ 利用单调性推出 $ax\ge\ln x^2$，回补函数性质与图像。
      - 若学生不知道 $\ln x/x$ 的最大值为 $1/e$，回补导数单调极值基础。
      - 若学生不能识别对数平均数不等式，回补不等式工具基础。
  detail_terms:
