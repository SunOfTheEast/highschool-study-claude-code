solution:
  source_solution_summary: 第(1)问 $a=0$ 时，$\frac{f(x)}x=e^x>x+1$。第(2)问要求 $xe^x+a\sin x>0$ 在 $(0,\pi)$ 恒成立。若 $a\ge-1$， $f''(x)=(x+2)e^x-a\sin x>0$，所以 $f'$ 递增，且 $f'(0)=1+a\ge0$，于是 $f$ 递增，$f(x)>f(0)=0$。若 $a<-1$，则 $f'(0)=1+a<0$，而 $f'(\pi/2)>0$，存在唯一 $x_2\in(0,\pi/2)$ 使 $f'(x_2)=0$，从而 $f$ 先减后增，会在 $(x_2,\pi)$ 出现零点并导致前段为负，矛盾；所以 $a\ge-1$。 第(3)问由存在零点推出 $a<-1$，联立 $x_1e^{x_1}+a\sin x_1=0$ 与 $(x_2+1)e^{x_2}+a\cos x_2=0$。普通消参只能得到一个不易判断的比值， 所以 source 改为看 $f(2x_2)$。代入 $a=-\frac{(x_2+1)e^{x_2}}{\cos x_2}$， 得 $f(2x_2)=2e^{x_2}(x_2e^{x_2}-\sin x_2(x_2+1))>0$。结合第(2)问中 $a<-1$ 时的单调性和零点位置，可得 $x_1<2x_2$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问直接调用指数基本不等式。
      formula_trace:
        from: $a=0,\quad f(x)=xe^x$
        to: $\frac{f(x)}x=e^x>x+1$
        operation: 使用 $e^x>x+1$（$x\ne0$ 时严格）。
        why: 这是后续指三角复合题里的基础放缩入口。
      source_ref: page_0285_ex08_solution
    - step_id: step_2
      statement: 第(2)问先证明 $a\ge-1$ 充分。
      formula_trace:
        from: $f'(x)=(x+2)e^x-a\sin x$
        to: $a\ge-1\Rightarrow f'(x)>0,\ f^\prime(0)=1+a\ge0,\ f(x)>0$
        operation: 用二阶导控制 $f^\prime$，再由 $f(0)=0$ 得恒正。
        why: 这是从单调性出发证明全区间恒正。
      source_ref: page_0285_ex08_solution
    - step_id: step_3
      statement: 第(2)问排除 $a<-1$。
      formula_trace:
        from: $a<-1,\quad f^\prime(0)=1+a<0,\quad f^\prime(\frac\pi2)>0$
        to: 存在唯一 $x_2\in(0,\frac\pi2)$，并导致 $f$ 在前段取负
        operation: 用 $f^\prime$ 的单调性和介值判断。
        why: 这说明恒正不可能成立。
      source_ref: page_0285_ex08_solution
    - step_id: step_4
      statement: 第(3)问先尝试消参，但发现比值不好判断。
      formula_trace:
        from: $f(x_1)=0,\quad f^\prime(x_2)=0$
        to: $e^{x_1-2x_2}<\frac{x_2+1}{e^{x_2}\cos x_2}$
        operation: 消去参数 $a$。
        why: source 明确指出这个比值和 1 的大小关系不确定，所以常规消参失效。
      source_ref: page_0285_ex08_solution
    - step_id: step_5
      statement: 改用找点思想，判断 $f(2x_2)$。
      formula_trace:
        from: $a=-\frac{(x_2+1)e^{x_2}}{\cos x_2}$
        to: $f(2x_2)=2e^{x_2}(x_2e^{x_2}-\sin x_2(x_2+1))>0$
        operation: 把 $f^\prime(x_2)=0$ 得到的 $a$ 代入 $f(2x_2)$。
        why: 若 $f(2x_2)>0$，结合单调性可知零点 $x_1$ 在 $2x_2$ 左侧。
      source_ref: page_0285_ex08_solution
teaching_card:
  student_title: 常规消参失败时，改看 $f(2x_2)$
  what_it_trains: 训练极值点偏移题里的找点思路：直接消参比不出来，就把目标点代回原函数，用单调性判断零点在它左边。
  recognition_cues:
    - 题目给 $f(x_1)=0$ 和 $f^\prime(x_2)=0$。
    - 目标是不等式 $x_1<2x_2$，天然提示去看 $2x_2$。
    - 消参后出现 $\frac{x_2+1}{e^{x_2}\cos x_2}$，大小不好判断。
    - source 明确说“常规消参失效，判断 $f(2x_2)$”。
  normalization_moves:
    - 第(2)问先拿到 $a\ge-1$。
    - 第(3)问由存在零点推出 $a<-1$。
    - 用 $f^\prime(x_2)=0$ 解出 $a$。
    - 把 $a$ 代入 $f(2x_2)$，再结合单调性。
  common_failures:
    - 把 $f^\prime(0)$ 误写成 $1-a$，导致 $a<-1$ 的判断错。
    - 在消参比值处硬算，忽略 source 已经提示大小关系不可控。
    - 只证明 $f(2x_2)>0$，没有回到单调性说明 $x_1<2x_2$。
    - 忘记 $x_2\in(0,\frac\pi2)$，导致三角符号判断混乱。
  similar_practice_query: xe^x+a sinx f(x1)=0 fprime(x2)=0 x1<2x2 极值点偏移
