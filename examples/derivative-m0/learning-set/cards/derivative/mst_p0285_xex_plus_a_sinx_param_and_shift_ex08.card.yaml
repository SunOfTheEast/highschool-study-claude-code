stem: |-
  （江苏盐城二模 18）已知函数 $f(x)=xe^x+a\sin x$。
  1. 当 $a=0$ 时，求证：$\frac{f(x)}x>x+1$。
  2. 若 $f(x)>0$ 对于 $x\in(0,\pi)$ 恒成立，求 $a$ 的取值范围。
  3. 若存在 $x_1,x_2\in(0,\pi)$，使得 $f(x_1)=f^\prime(x_2)=0$，求证：$x_1<2x_2$。
answer: |-
  (2) $a\ge-1$；(3) $x_1<2x_2$。

  第(1)问 $a=0$ 时，$\frac{f(x)}x=e^x>x+1$。第(2)问要求 $xe^x+a\sin x>0$ 在 $(0,\pi)$ 恒成立。若 $a\ge-1$， $f''(x)=(x+2)e^x-a\sin x>0$，所以 $f'$ 递增，且 $f'(0)=1+a\ge0$，于是 $f$ 递增，$f(x)>f(0)=0$。若 $a<-1$，则 $f'(0)=1+a<0$，而 $f'(\pi/2)>0$，存在唯一 $x_2\in(0,\pi/2)$ 使 $f'(x_2)=0$，从而 $f$ 先减后增，会在 $(x_2,\pi)$ 出现零点并导致前段为负，矛盾；所以 $a\ge-1$。 第(3)问由存在零点推出 $a<-1$，联立 $x_1e^{x_1}+a\sin x_1=0$ 与 $(x_2+1)e^{x_2}+a\cos x_2=0$。普通消参只能得到一个不易判断的比值， 所以 source 改为看 $f(2x_2)$。代入 $a=-\frac{(x_2+1)e^{x_2}}{\cos x_2}$， 得 $f(2x_2)=2e^{x_2}(x_2e^{x_2}-\sin x_2(x_2+1))>0$。结合第(2)问中 $a<-1$ 时的单调性和零点位置，可得 $x_1<2x_2$。
