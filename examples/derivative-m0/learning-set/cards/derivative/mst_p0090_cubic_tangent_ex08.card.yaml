stem: |-
  （2023 汕头市月考 T7）若过点 $(m,n)\ (m>0)$ 可作曲线 $y=x^3-3x$ 三条切线，则（ ）
  A. $n<-3m$
  B. $n>m^3-3m$
  C. $n=m^3-3m$ 或 $n=-3m$
  D. $-3m<n<m^3-3m$
answer: |-
  D

  对 $f(x)=x^3-3x$，有 $f'(x)=3x^2-3$， $f''(x)=6x$，故拐点为 $(0,0)$，拐点处切线为 $y=-3x$。 当外点横坐标 $m>0$ 时，曲线上对应高度为 $m^3-3m$， 拐点切线上的对应高度为 $-3m$。根据本页三次函数切线条数图像， 在拐点右侧，点位于拐点切线之上、曲线之下的外弧区域时， 可作三条切线，所以应有 $-3m<n<m^3-3m$，故选 D。
