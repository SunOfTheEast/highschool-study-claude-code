solution:
  source_solution_summary: 对 $f(x)=x^3-3x$，有 $f'(x)=3x^2-3$， $f''(x)=6x$，故拐点为 $(0,0)$，拐点处切线为 $y=-3x$。 当外点横坐标 $m>0$ 时，曲线上对应高度为 $m^3-3m$， 拐点切线上的对应高度为 $-3m$。根据本页三次函数切线条数图像， 在拐点右侧，点位于拐点切线之上、曲线之下的外弧区域时， 可作三条切线，所以应有 $-3m<n<m^3-3m$，故选 D。
  key_steps:
    - step_id: step_1
      statement: 先找三次函数的拐点和拐点切线。
      formula_trace:
        from: |
          $f(x)=x^3-3x,\quad f'(x)=3x^2-3,\quad f''(x)=6x$
        to: |
          $f''(x)=0\Rightarrow x=0,\quad (0,f(0))=(0,0),\quad y=f'(0)x=-3x$
        operation: 求二阶导确定拐点，再用一阶导写拐点处切线。
        why: 三次函数过点切线条数的分区边界正是曲线和拐点切线。
      source_ref: page_0090
    - step_id: step_2
      statement: 把外点 $(m,n)$ 与两条边界比较。
      formula_trace:
        from: |
          $m>0,\quad y_{\text{切线}}=-3m,\quad y_{\text{曲线}}=m^3-3m$
        to: |
          在横坐标 $m$ 处，三切线区域对应 $-3m<n<m^3-3m$
        operation: 在同一横坐标下比较外点纵坐标、拐点切线高度和曲线高度。
        why: 右侧外弧区域位于拐点切线上方、曲线下方。
      source_ref: page_0090
    - step_id: step_3
      statement: 由三切线区域锁定选项。
      formula_trace:
        from: |
          过外弧区域内点作三次函数切线有 3 条
        to: |
          $-3m<n<m^3-3m$，选 D
        operation: 套用本页“三次函数切线条数”的区域结论。
        why: 选项 A、B 落在边界之外，选项 C 是边界点，均不是三条切线区域。
      source_ref: page_0090
teaching_card:
  student_title: 用拐点切线框住三次函数三切线区域
  what_it_trains: 训练看到“三次函数过点作三条切线”时，先找拐点切线， 再用曲线与拐点切线夹出的区域读参数范围。
  recognition_cues:
    - 题干只给外点 $(m,n)$，问能作几条切线，适合先判外点所在区域。
    - $y=x^3-3x$ 的拐点在原点，拐点切线很快得到 $y=-3x$。
    - 选项都在比较 $n$ 与 $-3m$、$m^3-3m$，提示同横坐标看上下边界。
  normalization_moves:
    - 求 $f''(x)=0$，定位拐点。
    - 写拐点切线 $y=-3x$。
    - 在 $x=m$ 处比较 $n$ 与两条边界高度。
  common_failures:
    - 把曲线下方所有点都当成三切线区域，漏掉拐点切线这一边界。
    - 把 $n=m^3-3m$ 或 $n=-3m$ 的边界点误算成三条切线。
    - 忘记使用 $m>0$，导致左右两侧区域方向混淆。
  similar_practice_query: 三次函数 拐点切线 外弧区域 过点三条切线 参数范围
