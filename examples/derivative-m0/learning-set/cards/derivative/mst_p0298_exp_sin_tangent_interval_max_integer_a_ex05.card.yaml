stem: |-
  （2023 · 张店区校级三模）已知函数 $f(x)=e^x\sin x-2x$。
  1. 求曲线 $y=f(x)$ 在点 $(0,f(0))$ 处的切线方程。
  2. 求 $f(x)$ 在区间 $[-1,1]$ 上的最大值。
  3. 设实数 $a$ 使得 $f(x)+x>ae^x$ 对 $x\in\mathbf{R}$ 恒成立，写出 $a$ 的最大整数值，并说明理由。
answer: |-
  第(1)问切线方程为 $y=-x$；第(2)问最大值为 $2-\frac{\sin1}{e}$；第(3)问 $a$ 的最大整数值为 $-2$。

  第(1)问由 $f^\prime(x)=e^x(\sin x+\cos x)-2$，$f^\prime(0)=-1$， $f(0)=0$，得切线 $y=-x$。第(2)问令 $g(x)=f^\prime(x)=e^x(\sin x+\cos x)-2$，则 $g^\prime(x)=2e^x\cos x$。在 $[-1,1]$ 上，$g^\prime(x)>0$， 且 $g(0)<0<g(1)$，所以存在唯一 $x_0\in(0,1)$ 使 $f^\prime(x_0)=0$，$f$ 先减后增，最大值在端点取得。 比较 $f(1)=e\sin1-2<e-2<1$ 与 $f(-1)=2-\frac{\sin1}{e}>1$，得最大值为 $2-\frac{\sin1}{e}$。第(3)问化为 $a<\varphi(x)=\sin x-\frac{x}{e^x}$ 对全体实数成立。 当 $x\le0$，有 $-\frac{x}{e^x}\ge0$，所以 $\varphi(x)>-1$；当 $x>0$，有 $0>-\frac{x}{e^x}>-\frac1e$，所以 $\varphi(x)>-1-\frac1e>-2$，故 $a=-2$ 充分。再取 $x=\frac{3\pi}{2}$ 得 $\varphi(x)<-1$，排除 $a=-1$，所以最大整数为 $-2$。
