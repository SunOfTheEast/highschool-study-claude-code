solution:
  source_solution_summary: 第(1)问由 $f^\prime(x)=e^x(\sin x+\cos x)-2$，$f^\prime(0)=-1$， $f(0)=0$，得切线 $y=-x$。第(2)问令 $g(x)=f^\prime(x)=e^x(\sin x+\cos x)-2$，则 $g^\prime(x)=2e^x\cos x$。在 $[-1,1]$ 上，$g^\prime(x)>0$， 且 $g(0)<0<g(1)$，所以存在唯一 $x_0\in(0,1)$ 使 $f^\prime(x_0)=0$，$f$ 先减后增，最大值在端点取得。 比较 $f(1)=e\sin1-2<e-2<1$ 与 $f(-1)=2-\frac{\sin1}{e}>1$，得最大值为 $2-\frac{\sin1}{e}$。第(3)问化为 $a<\varphi(x)=\sin x-\frac{x}{e^x}$ 对全体实数成立。 当 $x\le0$，有 $-\frac{x}{e^x}\ge0$，所以 $\varphi(x)>-1$；当 $x>0$，有 $0>-\frac{x}{e^x}>-\frac1e$，所以 $\varphi(x)>-1-\frac1e>-2$，故 $a=-2$ 充分。再取 $x=\frac{3\pi}{2}$ 得 $\varphi(x)<-1$，排除 $a=-1$，所以最大整数为 $-2$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问求在点切线。
      formula_trace:
        from: $f^\prime(x)=e^x(\sin x+\cos x)-2,\quad f(0)=0$
        to: $f^\prime(0)=-1,\quad y=-x$
        operation: 代入 $x=0$ 求斜率和点。
        why: 在点切线直接用点斜式。
      source_ref: page_0298_ex05_solution
    - step_id: step_2
      statement: 第(2)问先研究 $f^\prime$ 的零点。
      formula_trace:
        from: $g(x)=f^\prime(x)=e^x(\sin x+\cos x)-2$
        to: $g^\prime(x)=2e^x\cos x>0\quad(x\in[-1,1])$
        operation: 再求一次导。
        why: 直接求 $f^\prime=0$ 不方便，但 $f^\prime$ 本身单调。
      source_ref: page_0298_ex05_solution
    - step_id: step_3
      statement: 用 $f^\prime$ 的唯一零点确定最大值位置。
      formula_trace:
        from: $g(0)<0,\quad g(1)>0$
        to: $\exists x_0\in(0,1),\ f^\prime(x_0)=0$
        operation: 用单调性和零点存在性。
        why: $f$ 先减后增，所以最大值只能在端点取。
      source_ref: page_0298_ex05_solution
    - step_id: step_4
      statement: 比较端点。
      formula_trace:
        from: $f(1)=e\sin1-2,\quad f(-1)=2-\frac{\sin1}{e}$
        to: $f_{\max}=2-\frac{\sin1}{e}$
        operation: 用 $f(1)<1<f(-1)$ 比较。
        why: 避开不可显式求出的极小点。
      source_ref: page_0298_ex05_solution
    - step_id: step_5
      statement: 第(3)问分离参数。
      formula_trace:
        from: $f(x)+x>ae^x$
        to: $a<\varphi(x)=\sin x-\frac{x}{e^x}$
        operation: 代入 $f$ 并除以 $e^x>0$。
        why: 最大整数值转成 $\varphi$ 的全局下界问题。
      source_ref: page_0298_ex05_solution
    - step_id: step_6
      statement: 分段给出充分下界。
      formula_trace:
        from: $\varphi(x)=\sin x-\frac{x}{e^x}$
        to: $\varphi(x)>-2\quad(x\in\mathbf R)$
        operation: 分别处理 $x\le0$ 和 $x>0$。
        why: 证明 $a=-2$ 对全体实数都成立。
      source_ref: page_0298_ex05_solution
    - step_id: step_7
      statement: 排除下一个整数 $a=-1$。
      formula_trace:
        from: $x=\frac{3\pi}{2}$
        to: $\varphi(x)=-1-\frac{x}{e^x}<-1$
        operation: 选正弦取到 $-1$ 的点。
        why: 最大整数必须同时证明 $-1$ 不满足。
      source_ref: page_0298_ex05_solution
teaching_card:
  student_title: 指数三角函数里的最大整数
  what_it_trains: 训练指数三角混合函数中，先用导函数零点处理区间最大值，再用全局下界和反例点确定最大整数。
  recognition_cues:
    - $e^x\sin x$ 求导后会出现 $\sin x+\cos x$。
    - 区间 $[-1,1]$ 上 $\cos x>0$，所以 $f^\prime$ 本身单调。
    - 恒成立问最大整数时，要先分离成 $a<\varphi(x)$。
    - $\sin x$ 的最低点可以用来排除 $a=-1$。
  normalization_moves:
    - 第(1)问只作为切线计算。
    - 第(2)问不求出 $x_0$，只用它说明最大值在端点。
    - 第(3)问先证明 $a=-2$ 充分，再用一个点排除 $a=-1$。
  common_failures:
    - 把第(2)问的隐零点当成最大值点，其实它是极小点。
    - 只证明 $\varphi(x)>-2$，忘记说明 $a=-1$ 为什么不行。
    - 误以为 $\sin x>-1$ 对所有实数都成立；它会取到 $-1$。
    - 分离参数时忘记 $e^x>0$，不等号方向不变。
  similar_practice_query: e^x sin x 区间最大值 导函数零点 最大整数 a sin x - x/e^x
