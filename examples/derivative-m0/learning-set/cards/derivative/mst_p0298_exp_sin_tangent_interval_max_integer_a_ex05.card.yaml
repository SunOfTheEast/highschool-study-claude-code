original_problem:
  stem: （2023 · 张店区校级三模）已知函数 $f(x)=e^x\sin x-2x$。
  parts: *a1
  choices: []
  answer: 第(1)问切线方程为 $y=-x$；第(2)问最大值为 $2-\frac{\sin1}{e}$；第(3)问 $a$ 的最大整数值为 $-2$。
