stem: |-
  （2024 福建泉州四校期末 T8）已知直线 $y=kx+b$ 是曲线 $y=x^2-(a+1)$ 的切线，也是曲线 $y=a\ln x-1$ 的切线，则 $a$ 的最大值是（  ）
  A. $\frac2e$
  B. $\frac4e$
  C. $2e$
  D. $4e$
answer: |
  A

  同一条直线同时切于 $y=x^2-(a+1)$ 与 $y=a\ln x-1$。把第一条曲线整体上移
  $a+1$，公切线也上移 $a+1$，问题等价于 $y=x^2$ 与
  $y=a\ln x+a=a(\ln x+1)$ 存在公切线。源页用一凹一凸的公切线模型转成
  $a(\ln x+1)\le x^2$。求最大 $a$ 时只需考虑 $\ln x+1>0$ 的部分，
  得
  $a\le\frac{x^2}{\ln x+1}=\frac{x^2}{\ln(ex)}$。
  令 $s(x)=\frac{x^2}{\ln(ex)}$，则
  $s'(x)=\frac{x(2\ln(ex)-1)}{(\ln(ex))^2}$，最小值在
  $x=e^{-1/2}$ 处取得，$s_{\min}=2/e$。因此 $a$ 的最大值为
  $\frac2e$，故选 A。
