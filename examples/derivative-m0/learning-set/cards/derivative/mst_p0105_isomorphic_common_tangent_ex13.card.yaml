solution:
  source_solution_summary: |
    同一条直线同时切于 $y=x^2-(a+1)$ 与 $y=a\ln x-1$。把第一条曲线整体上移
    $a+1$，公切线也上移 $a+1$，问题等价于 $y=x^2$ 与
    $y=a\ln x+a=a(\ln x+1)$ 存在公切线。源页用一凹一凸的公切线模型转成
    $a(\ln x+1)\le x^2$。求最大 $a$ 时只需考虑 $\ln x+1>0$ 的部分，
    得
    $a\le\frac{x^2}{\ln x+1}=\frac{x^2}{\ln(ex)}$。
    令 $s(x)=\frac{x^2}{\ln(ex)}$，则
    $s'(x)=\frac{x(2\ln(ex)-1)}{(\ln(ex))^2}$，最小值在
    $x=e^{-1/2}$ 处取得，$s_{\min}=2/e$。因此 $a$ 的最大值为
    $\frac2e$，故选 A。
  key_steps:
    - step_id: step_1
      statement: 把两条原曲线转成同构比较模型。
      formula_trace:
        from: |
          $y=x^2-(a+1),\qquad y=a\ln x-1$
        to: |
          $y=x^2,\qquad y=a(\ln x+1)$
        operation: 把切线和两条曲线同时做纵向平移，消去常数差。
        why: 平移不改变切点斜率，公切线存在性可转成两个标准函数的比较。
      source_ref: page_0105
    - step_id: step_2
      statement: 由公切线模型写出恒成立不等式。
      formula_trace:
        from: |
          $y=x^2$ 与 $y=a(\ln x+1)$ 存在公切线
        to: |
          $a(\ln x+1)\le x^2$
        operation: 按源页同构公切线模型，把对数曲线放在二次曲线下方。
        why: 一凹一凸且外侧包裹时存在公切线；最大 $a$ 出现在相切临界。
      source_ref: page_0105
    - step_id: step_3
      statement: 分离参数并求临界最小值。
      formula_trace:
        from: |
          $a(\ln x+1)\le x^2$
        to: |
          $a\le s(x)=\frac{x^2}{\ln x+1}=\frac{x^2}{\ln(ex)}$
        operation: 在 $\ln x+1>0$ 的约束区间分离 $a$。
        why: 最大允许参数由右端比值函数的最小值决定。
      source_ref: page_0105
    - step_id: step_4
      statement: 计算 $s_{\min}=\frac2e$。
      formula_trace:
        from: |
          $s(x)=\frac{x^2}{\ln(ex)}$
        to: |
          $s'(x)=\frac{x(2\ln(ex)-1)}{(\ln(ex))^2},\quad x=e^{-1/2},\quad s_{\min}=\frac2e$
        operation: 求导令 $2\ln(ex)-1=0$；等价于源页同构式 $\left(\frac{2(ex)^2}{e^2\ln(ex)^2}\right)_{\min}$。
        why: 这个最小值就是 $a$ 的最大上界。
      source_ref: page_0105
    - step_id: step_5
      statement: 确定选项。
      formula_trace:
        from: |
          $a_{\max}=\frac2e$
        to: |
          $\text{选 A}$
        operation: 与 A-D 选项逐项对应。
        why: 题目问最大值，不是所有取值范围。
      source_ref: page_0105
teaching_card:
  student_title: 平移成 $x^2$ 和 $a(\ln x+1)$ 后求最大 $a$
  what_it_trains: 训练把带常数平移的两条切线曲线化成同构比较，再用比值函数最小值求参数最大值。
  recognition_cues:
    - 两条曲线分别带 $-(a+1)$ 和 $-1$，说明可以通过纵向平移整理。
    - 目标是 $a$ 的最大值，常常落在两曲线临界相切的位置。
    - 出现 $\frac2e$、$\frac4e$ 选项，提示要算 $\frac{x^2}{\ln(ex)}$ 的最小值。
  normalization_moves:
    - 把原问题改写为 $y=x^2$ 与 $y=a(\ln x+1)$ 的公切线。
    - 写出 $a(\ln x+1)\le x^2$。
    - 分离为 $a\le\frac{x^2}{\ln(ex)}$。
    - 求导得到最小值 $\frac2e$。
  common_failures:
    - 没有做平移同构，直接列切点方程导致计算复杂。
    - 把 $\ln x+1$ 当成恒正，忽略有效约束区间。
    - 把例 11 的 $2e$ 机械套用到本题，漏掉 $\ln x+1$ 带来的尺度变化。
  similar_practice_query: x^2-(a+1) a lnx-1 公切线 同构 平移 2/e
