stem: |-
  （2012 · 新课标）已知函数 $f(x)$ 满足 $f(x)=f^{\prime}(1)e^{x-1}-f(0)x+\frac{1}{2}x^2$。
  1. 求 $f(x)$ 的解析式及单调区间。
  2. 若 $f(x)\geqslant\frac{1}{2}x^2+ax+b$，求 $(a+1)b$ 的最大值。
answer: |-
  （1）$f(x)=e^x-x+\frac{1}{2}x^2$，单调递减区间 $(-\infty,0)$，单调递增区间 $(0,+\infty)$；（2）$(a+1)b_{\max}=\frac{e}{2}$。

  对定义式求导得 $f^{\prime}(x)=f^{\prime}(1)e^{x-1}-f(0)+x$。代 $x=1$ 得 $f(0)=1$，再代 $x=0$ 得 $f^{\prime}(1)e^{-1}=1$，故 $f^{\prime}(1)=e$，进而 $f(x)=e^x-x+\frac{1}{2}x^2$。令 $g(x)=f^{\prime}(x)=e^x-1+x$，有 $g^{\prime}(x)=e^x+1>0$，且 $g(0)=0$，所以 $f$ 在 $(-\infty,0)$ 递减、在 $(0,+\infty)$ 递增。第(2)问由 $f(x)\geqslant\frac{1}{2}x^2+ax+b$ 化为 $e^x\geqslant(a+1)x+b$，利用切线意义得 $b=-(a+1)\ln\frac{a+1}{e}$（极值情形取等），于是 $(a+1)b=-(a+1)^2\ln\frac{a+1}{e}$。同构令 $h(u)=-u\ln u$，取 $u=\frac{(a+1)^2}{e^2}$，有 $(a+1)b=\frac{e^2}{2}h(u)\leqslant\frac{e^2}{2}\cdot\frac{1}{e} =\frac{e}{2}$，故最大值为 $\frac{e}{2}$。
