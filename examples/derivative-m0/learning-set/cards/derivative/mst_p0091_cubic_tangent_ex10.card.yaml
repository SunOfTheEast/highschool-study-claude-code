stem: |-
  （2025 银川一中月考 T11）已知函数 $f(x)=ax^3-3ax^2+b$，其中实数 $a>0$，$b\in\mathbf{R}$， 则下列结论正确的是（ ）
  A. $f(x)$ 在 $(0,+\infty)$ 上单调递增
  B. 当 $f(x)$ 有且仅有 3 个零点时，$b$ 的取值范围是 $(0,4a)$
  C. 若直线 $l$ 与曲线 $y=f(x)$ 有 3 个不同的交点 $A(x_1,y_1)$，$B(x_2,y_2)$，$C(x_3,y_3)$，且 $|AB|=|AC|$，则 $x_1+x_2+x_3=3$
  D. 当 $5a<b<6a$ 时，过点 $A(2,a)$ 可以作曲线 $y=f(x)$ 的 3 条切线
answer: |-
  BCD

  $f'(x)=3ax(x-2)$，所以 $f$ 在 $(-\infty,0)$ 与 $(2,+\infty)$ 上递增，在 $(0,2)$ 上递减，A 错。 三次函数要有 3 个零点，需极大值 $f(0)=b>0$ 且极小值 $f(2)=b-4a<0$，即 $0<b<4a$，B 正确。 若直线 $y=kx+c$ 与曲线有三个交点，则交点横坐标满足 $ax^3-3ax^2-kx+(b-c)=0$，由韦达定理 $x_1+x_2+x_3=3$；这也与源解“对称中心”判断一致，C 正确。 当 $5a<b<6a$ 时，对点 $A(2,a)$ 有 $b-5a<a<b-4a$，即它位于拐点切线和曲线之间的外弧区域， 可作 3 条切线，D 正确。
