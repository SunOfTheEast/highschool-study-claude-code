solution:
  source_solution_summary: $f'(x)=3ax(x-2)$，所以 $f$ 在 $(-\infty,0)$ 与 $(2,+\infty)$ 上递增，在 $(0,2)$ 上递减，A 错。 三次函数要有 3 个零点，需极大值 $f(0)=b>0$ 且极小值 $f(2)=b-4a<0$，即 $0<b<4a$，B 正确。 若直线 $y=kx+c$ 与曲线有三个交点，则交点横坐标满足 $ax^3-3ax^2-kx+(b-c)=0$，由韦达定理 $x_1+x_2+x_3=3$；这也与源解“对称中心”判断一致，C 正确。 当 $5a<b<6a$ 时，对点 $A(2,a)$ 有 $b-5a<a<b-4a$，即它位于拐点切线和曲线之间的外弧区域， 可作 3 条切线，D 正确。
  key_steps:
    - step_id: step_1
      statement: 判断 A：导数符号显示 $(0,+\infty)$ 上并非全递增。
      formula_trace:
        from: |
          $f'(x)=3ax^2-6ax=3ax(x-2),\quad a>0$
        to: |
          $f'(x)>0$ 当 $x<0$ 或 $x>2$；
          $f'(x)<0$ 当 $0<x<2$
        operation: 解导数不等式并划分单调区间。
        why: 在 $(0,2)$ 上函数递减，所以不能说在 $(0,+\infty)$ 上单调递增。
      source_ref: page_0091
    - step_id: step_2
      statement: 判断 B：三零点对应极大值在 $x$ 轴上方、极小值在 $x$ 轴下方。
      formula_trace:
        from: |
          极大点 $x=0$，极小点 $x=2$；
          $f(0)=b,\quad f(2)=8a-12a+b=b-4a$
        to: |
          $f(0)f(2)<0\Longleftrightarrow b(b-4a)<0\Longleftrightarrow 0<b<4a$
        operation: 用三次函数两个极值点夹住 $x$ 轴，转成端值异号。
        why: 首项系数 $a>0$ 时，极大值为正且极小值为负才有三个不同零点。
      source_ref: page_0091
    - step_id: step_3
      statement: 判断 C：直线与三次曲线三交点的横坐标和固定为 3。
      formula_trace:
        from: |
          $y=kx+c$ 与 $y=f(x)$ 交于三点
        to: |
          $ax^3-3ax^2-kx+(b-c)=0$，
          所以 $x_1+x_2+x_3=-\frac{-3a}{a}=3$
        operation: 把交点横坐标看成三次方程的三个根，使用韦达定理。
        why: 二次项系数固定为 $-3a$，因此三根和固定为对称中心横坐标的三倍。
      source_ref: page_0091
    - step_id: step_4
      statement: 判断 D：外点 $A(2,a)$ 落在三切线外弧区域。
      formula_trace:
        from: |
          对称中心 $(1,b-2a)$，拐点切线斜率 $-3a$；
          $l_{\text{拐点}}(2)=b-5a,\quad f(2)=b-4a$
        to: |
          $5a<b<6a\Rightarrow b-5a<a<b-4a$，
          过 $A(2,a)$ 可作 3 条切线
        operation: 在 $x=2$ 处用高度夹逼判定点所在区域。
        why: 三次函数外弧区域内的点可引 3 条切线。
      source_ref: page_0091
teaching_card:
  student_title: 一条三次函数同时看单调、零点和三切线
  what_it_trains: 训练把同一个三次函数结构反复使用：导数看单调和极值， 韦达看三交点横坐标和，拐点切线分区看外点切线条数。
  recognition_cues:
    - 函数仍是 $ax^3-3ax^2+b$，导数零点固定在 $0,2$。
    - 选项 B 提到 3 个零点，要立刻看极大值 $f(0)$ 和极小值 $f(2)$。
    - 选项 C 提到直线与三次曲线 3 个交点，适合写交点方程用韦达。
    - 选项 D 与例 9 同型，仍比较 $b-5a,a,b-4a$。
  normalization_moves:
    - 用 $f'(x)=3ax(x-2)$ 先建立单调表。
    - 用 $f(0)>0,\ f(2)<0$ 得出三零点范围。
    - 把直线交点横坐标写成三次方程的根。
    - 用拐点切线和曲线夹出外弧区域。
  common_failures:
    - 看到 $x>2$ 递增，就误判整个 $(0,+\infty)$ 递增。
    - 三零点条件写成 $b(b-4a)\le0$，把重根也算进去。
    - C 项只盯着 $|AB|=|AC|$，忘了三次交点方程的根和本来就固定。
    - D 项只比较点和曲线，漏掉拐点切线这一条边界。
  similar_practice_query: 三次函数 极值零点 韦达根和 拐点切线 外弧区域 多选
