stem: |-
  （2023 · 浙江稽阳模拟 T7）已知 $\ln x-a x^2-b\leqslant0$ 在 $(0,+\infty)$ 上恒成立，$a+2b$ 的最小值是（  ）
  A. 0
  B. $-1$
  C. $-\ln4$
  D. $-\ln2$
answer: |-
  D

  恒成立等价于 $ax^2+b\geqslant\ln x$。要最小化 $a+2b$， 观察 $a+2b=2(\frac a2+b)$，所以选择让 $x^2=\frac12$ 的点 $x=\frac{\sqrt2}{2}$。由恒成立得 $\frac a2+b\geqslant\ln\frac{\sqrt2}{2}=-\frac12\ln2$， 因此 $a+2b\geqslant-\ln2$，选 D。
