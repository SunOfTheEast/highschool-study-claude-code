solution:
  source_solution_summary: 恒成立等价于 $ax^2+b\geqslant\ln x$。要最小化 $a+2b$， 观察 $a+2b=2(\frac a2+b)$，所以选择让 $x^2=\frac12$ 的点 $x=\frac{\sqrt2}{2}$。由恒成立得 $\frac a2+b\geqslant\ln\frac{\sqrt2}{2}=-\frac12\ln2$， 因此 $a+2b\geqslant-\ln2$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把恒成立式改写成上界切点模型。
      formula_trace:
        from: $\ln x-a x^2-b\leqslant0$
        to: $a x^2+b\geqslant\ln x$
        operation: 移项。
        why: 左侧 $a x^2+b$ 是要压住 $\ln x$ 的参数表达式。
      source_ref: page_0175:lines 32-42
    - step_id: step_2
      statement: 用目标 $a+2b$ 反推代入点。
      formula_trace:
        from: $a+2b=2(\frac a2+b)$
        to: 取 $x^2=\frac12,\ x=\frac{\sqrt2}{2}$
        operation: 让恒成立不等式中的 $a x^2+b$ 对齐目标线性组合。
        why: 这样一次代入就能直接给出 $a+2b$ 的下界。
      source_ref: page_0175:lines 39-42
    - step_id: step_3
      statement: 代入切点得到最小值。
      formula_trace:
        from: $\frac a2+b\geqslant\ln\frac{\sqrt2}{2}$
        to: $a+2b\geqslant-\ln2$
        operation: 两边乘以 2，并化简 $\ln\frac{\sqrt2}{2}=-\frac12\ln2$。
        why: 该点就是源书“切点比大小”给出的取等点。
      source_ref: page_0175:lines 39-42
teaching_card:
  student_title: 用目标组合反推切点
  what_it_trains: 训练在双参数恒成立题中，不先解完整参数域，而是从目标组合倒推出最省力的代入点。
  recognition_cues:
    - 题目给双参数恒成立，最后问 $a+2b$ 这类线性组合最值。
    - 恒成立式中有 $a x^2+b$。
    - 目标组合能被写成 $2(\frac a2+b)$。
  normalization_moves:
    - 先把不等式移成 $a x^2+b\geqslant\ln x$。
    - 让 $x^2$ 等于目标组合里 $a$ 的系数。
    - 代入后再还原目标组合。
  common_failures:
    - 全量求导求参数域，算得很重。
    - 选错代入点，导致拿不到目标组合。
    - 忽略取等条件，只写必要下界。
  similar_practice_query: ln x ax^2 b 恒成立 a+2b 切点比大小
