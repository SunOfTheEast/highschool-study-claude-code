stem: |-
  （2025 贵阳一中高三月考 T14）牛顿在《流数法》一书中，给出了高次代数方程的一种数值解法——牛顿法。如图，$r$ 是函数 $f(x)$ 的零点，牛顿用“作切线”的方法找到了一串逐步逼近 $r$ 的实数 $x_0,x_1,\cdots,x_{n-1},x_n$。在横坐标为 $x_0$ 的点处作 $f(x)$ 的切线，则 $f(x)$ 在 $x=x_0$ 处的切线与 $x$ 轴交点的横坐标是 $x_1$，同理继续下去，得到数列 $\{x_n\}$。令 $f(x)=(x-1)^3$。当 $x_0=2$ 时，用牛顿法可求出方程 $f(x)=0$ 的近似解 $x_1=$_______；当 $x_0=2$，且 $x_n>1\ (n\in\mathbf N^*)$ 时，数列 $\{x_n\}$ 的通项公式为_______。
  求第一次牛顿迭代得到的 $x_1$。
  在 $x_0=2$ 且 $x_n>1$ 的条件下求 $\{x_n\}$ 的通项公式。
answer: |-
  $x_1=\frac53$；$x_n=\left(\frac23\right)^n+1$。

  牛顿法给出 $x_{n+1}=x_n-\frac{f(x_n)}{f'(x_n)}$。当 $f(x)=(x-1)^3$、$x_0=2$ 时, $f(2)=1$, $f'(x)=3(x-1)^2$, $f'(2)=3$。 切线 $y-1=3(x-2)$ 与 $x$ 轴交于 $x_1=5/3$。一般地, $x_{n+1}=x_n-\frac{(x_n-1)^3}{3(x_n-1)^2} =\frac23x_n+\frac13$, 所以 $x_{n+1}-1=\frac23(x_n-1)$。 又 $x_0-1=1$, 故 $x_n-1=(2/3)^n$, 即 $x_n=(2/3)^n+1$。
