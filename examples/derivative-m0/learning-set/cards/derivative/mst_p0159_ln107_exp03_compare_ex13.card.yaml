stem: |-
  （2024·西安月考）已知 $a=\ln10-\ln7$，$b=0.3e^{0.3}$，$c=\frac37$，则 $a,b,c$ 的大小关系为（  ）
  A. $c>b>a$
  B. $c>a>b$
  C. $b>c>a$
  D. $a>b>c$
answer: |
  A

  先化简
  \[
  a=\ln10-\ln7=\ln\frac{10}{7}.
  \]
  对 $x>0$ 用
  \[
  \frac{2(x-1)}{x+1}<\ln x<\frac12\left(x-\frac1x\right),
  \]
  取 $x=\frac{10}{7}$ 得
  \[
  \frac6{17}<a<\frac{51}{140},
  \]
  从而
  \[
  a<\frac{51}{140}<\frac37=c.
  \]
  再看
  \[
  b=0.3e^{0.3}.
  \]
  由
  \[
  1+x<e^x<\frac{1}{1-x}\quad (0<x<1),
  \]
  取 $x=0.3$ 得
  \[
  0.39=0.3(1+0.3)<b<0.3\cdot\frac{1}{0.7}=\frac37=c.
  \]
  又
  \[
  0.39>\frac{51}{140},
  \]
  故 $b>a$。综合得
  \[
  a<b<c,
  \]
  对应选项 A（$c>b>a$）。
