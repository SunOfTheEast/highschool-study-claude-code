teaching_card:
  student_title: 双边估值后用中间阈值连成全序
  what_it_trains: 训练“各自夹逼 + 跨链桥接”的三数比较套路，避免只做单段不等式。
  recognition_cues:
    - 一项是 $\ln$ 差，一项是 $e^x$ 乘系数。
    - 题目给出显式分数阈值 $\frac37$。
    - 源解出现连续区间估计。
  normalization_moves:
    - 先把差对数并成单个 $\ln$。
    - 分别给 $a,b$ 做上下界。
    - 选取可比的公共数值桥接。
  common_failures:
    - 只得到 $a<c$ 和 $b<c$，但没比较 $a,b$。
    - 把 $e^x$ 上界条件 $x<1$ 忽略。
    - 比较 $0.39$ 与 $\frac{51}{140}$ 时算错小数。
  similar_practice_query: ln(10/7) 0.3e^0.3 3/7 比大小 双边估值
