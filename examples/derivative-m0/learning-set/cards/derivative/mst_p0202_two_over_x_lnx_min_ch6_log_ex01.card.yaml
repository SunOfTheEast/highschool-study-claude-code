stem: （2024 · 定州市月考）函数 $g(x)=\frac{2}{x}+\ln x$ 的最小值为______。
answer: |-
  $1+\ln 2$

  源解把 $g(x)$ 改写为 $g(x)=\frac{2}{x}-\ln\frac{2}{x}+\ln2$。设 $t=\frac{2}{x}>0$，则 $t-\ln t\ge1$，故 $g(x)\ge1+\ln2$。当且仅当 $t=1$（即 $x=2$）取等， 因而最小值是 $1+\ln2$。
