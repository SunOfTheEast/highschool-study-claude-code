solution:
  source_solution_summary: 源解把 $g(x)$ 改写为 $g(x)=\frac{2}{x}-\ln\frac{2}{x}+\ln2$。设 $t=\frac{2}{x}>0$，则 $t-\ln t\ge1$，故 $g(x)\ge1+\ln2$。当且仅当 $t=1$（即 $x=2$）取等， 因而最小值是 $1+\ln2$。
  key_steps:
    - step_id: step_1
      statement: 把对数项改写成同构模板。
      formula_trace:
        from: $g(x)=\frac{2}{x}+\ln x$
        to: $g(x)=\frac{2}{x}-\ln\frac{2}{x}+\ln2$
        operation: 利用 $\ln x=-\ln\frac1x=-\ln\frac2x+\ln2$。
        why: 转成 $t-\ln t$ 的标准放缩结构。
      source_ref: page_0202_solution
    - step_id: step_2
      statement: 应用切线放缩得到下界。
      formula_trace:
        from: $t=\frac2x>0$
        to: $t-\ln t\ge1$
        operation: 用 $\ln t\le t-1$。
        why: 直接给出最小值下界。
      source_ref: page_0202_solution
    - step_id: step_3
      statement: 回代并给出最小值。
      formula_trace:
        from: $g(x)=t-\ln t+\ln2$
        to: $g(x)\ge1+\ln2$
        operation: 把步骤2结论加上常数 $\ln2$。
        why: 得到题目所求最小值。
      source_ref: page_0202_solution
teaching_card:
  student_title: 先配成 $t-\ln t$ 再求最小值
  what_it_trains: 训练把“分式+对数”最值题改写为同构模板，并用切线放缩一步给出下界与取等点。
  recognition_cues:
    - 出现 $\frac{c}{x}+\ln x$ 型。
    - 目标是求最小值且无复杂导数运算。
    - 可自然凑出 $t-\ln t$。
  normalization_moves:
    - 把 $\ln x$ 写成 $-\ln\frac{c}{x}+\ln c$。
    - 代换 $t=\frac{c}{x}$。
    - 用 $\ln t\le t-1$ 得下界并回代。
  common_failures:
    - 把 $\ln x$ 误写成 $\ln\frac2x+\ln2$（符号错）。
    - 只写“最小值”不写对应取等条件。
  similar_practice_query: 2/x+lnx 最小值 t-lnt 放缩
