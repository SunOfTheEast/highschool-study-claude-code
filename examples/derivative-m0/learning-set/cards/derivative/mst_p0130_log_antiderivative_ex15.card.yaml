stem: |-
  （24-25高二下·黑龙江·期中）已知定义在 $(0,+\infty)$ 上的函数 $f(x)$ 的导函数 $f^{\prime}(x)$ 满足 $f^{\prime}(x)>\ln x$，则（  ）
  A. $f(2)-f(1)<\ln 2$
  B. $f(2)-f(1)>\ln 2$
  C. $f(e)-f(1)<1$
  D. $f(e)-f(1)>1$
answer: |
  D

  设
  \[
  h(x)=f(x)-x\ln x+x,
  \]
  则
  \[
  h^{\prime}(x)=f^{\prime}(x)-\ln x>0.
  \]
  所以 $h(x)$ 在 $(0,+\infty)$ 上递增。
  对 AB：由 $h(2)>h(1)$ 得
  \[
  f(2)-2\ln2+2>f(1)+1
  \Rightarrow f(2)-f(1)>2\ln2-1.
  \]
  该下界不足以判定与 $\ln2$ 的大小关系，AB无法判断。
  对 CD：由 $h(e)>h(1)$ 得
  \[
  f(e)-e\ln e+e>f(1)+1
  \Rightarrow f(e)-f(1)>1.
  \]
  故 C 错、D 对，选 D。
