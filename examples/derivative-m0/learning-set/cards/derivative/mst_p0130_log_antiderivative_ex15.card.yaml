solution:
  source_solution_summary: |
    设
    \[
    h(x)=f(x)-x\ln x+x,
    \]
    则
    \[
    h^{\prime}(x)=f^{\prime}(x)-\ln x>0.
    \]
    所以 $h(x)$ 在 $(0,+\infty)$ 上递增。
    对 AB：由 $h(2)>h(1)$ 得
    \[
    f(2)-2\ln2+2>f(1)+1
    \Rightarrow f(2)-f(1)>2\ln2-1.
    \]
    该下界不足以判定与 $\ln2$ 的大小关系，AB无法判断。
    对 CD：由 $h(e)>h(1)$ 得
    \[
    f(e)-e\ln e+e>f(1)+1
    \Rightarrow f(e)-f(1)>1.
    \]
    故 C 错、D 对，选 D。
  key_steps:
    - step_id: step_1
      statement: 把题设导数比较改写成可直接判单调的构造。
      formula_trace:
        from: $f^{\prime}(x)>\ln x$
        to: $h^{\prime}(x)=f^{\prime}(x)-\ln x>0$
        operation: 设 $h(x)=f(x)-x\ln x+x$ 并求导。
        why: 将原条件变成“某函数导数恒正”。
      source_ref: page_0130
    - step_id: step_2
      statement: 利用 h(2)>h(1) 得到 AB 的可得边界。
      formula_trace:
        from: $h(2)>h(1)$
        to: $f(2)-f(1)>2\ln2-1$
        operation: 代入 $x=2,1$ 展开化简。
        why: 只得到下界，不能唯一判 A/B。
      source_ref: page_0130
    - step_id: step_3
      statement: 利用 h(e)>h(1) 直接锁定 CD。
      formula_trace:
        from: $h(e)>h(1)$
        to: $f(e)-f(1)>1$
        operation: 代入 $x=e,1$，并用 $\ln e=1$。
        why: 可直接判 D 真、C 假。
      source_ref: page_0130
teaching_card:
  student_title: 先构造递增函数，再分开判断 AB 与 CD
  what_it_trains: 训练把导数不等式变成单调构造，并区分“能比较”和“不能比较”的选项。
  recognition_cues:
    - 题设形如 $f^{\prime}(x)$ 与 $\ln x$ 比较。
    - 选项涉及 $f(2)-f(1)$、$f(e)-f(1)$ 这类差值。
  normalization_moves:
    - 设 $h=f-x\ln x+x$。
    - 先证 $h$ 递增，再比较 $h(2),h(1),h(e)$。
    - 把 $e$ 点比较转回 $f(e)-f(1)$。
  common_failures:
    - 误把 $f(2)-f(1)>2\ln2-1$ 当成能直接判 B。
    - 在求 $h^{\prime}(x)$ 时漏写 $(-x\ln x+x)^{\prime}=-\ln x$。
    - 忽略 $\ln e=1$ 导致 CD 判断出错。
  similar_practice_query: 抽象函数 导数大于lnx 构造h(x) 单调 比较f(e)-f(1)
