original_problem:
  stem: （24-25高二下·黑龙江·期中）已知定义在 $(0,+\infty)$ 上的函数 $f(x)$ 的导函数 $f^{\prime}(x)$ 满足 $f^{\prime}(x)>\ln x$，则（  ）
  parts: *a1
