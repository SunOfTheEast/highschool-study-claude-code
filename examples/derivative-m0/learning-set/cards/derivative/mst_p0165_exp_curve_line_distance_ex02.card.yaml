stem: |-
  （2024 · 大余县期中 T4）曲线 $y=e^x$ 上的点到直线 $y=x-2$ 的最短距离是（  ）
  A. $\sqrt{2}$
  B. 2
  C. 1
  D. $\frac{3\sqrt{2}}{2}$
answer: |-
  D

  直线 $y=x-2$ 的斜率是 1。曲线 $y=e^x$ 在最短距离对应点的切线应与该直线平行， 故令 $y^{\prime}=e^x=1$，得 $x=0$，切点为 $(0,1)$。再将直线写为 $x-y-2=0$，点到直线距离 $d=\frac{|0-1-2|}{\sqrt{1^2+(-1)^2}}=\frac{3}{\sqrt2}=\frac{3\sqrt2}{2}$， 故选 D。
