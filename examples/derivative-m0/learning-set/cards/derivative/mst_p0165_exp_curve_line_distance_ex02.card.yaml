solution:
  source_solution_summary: 直线 $y=x-2$ 的斜率是 1。曲线 $y=e^x$ 在最短距离对应点的切线应与该直线平行， 故令 $y^{\prime}=e^x=1$，得 $x=0$，切点为 $(0,1)$。再将直线写为 $x-y-2=0$，点到直线距离 $d=\frac{|0-1-2|}{\sqrt{1^2+(-1)^2}}=\frac{3}{\sqrt2}=\frac{3\sqrt2}{2}$， 故选 D。
  key_steps:
    - step_id: step_1
      statement: 用平行切线条件建立斜率方程。
      formula_trace:
        from: $y=e^x,\ y=x-2$ 的斜率为 $1$
        to: $y^{\prime}=e^x=1$
        operation: 令曲线切线斜率等于给定直线斜率。
        why: 曲线到直线最短距离处，连线垂直直线，故切线平行直线。
      source_ref: page_0165:line 41
    - step_id: step_2
      statement: 确定切点坐标。
      formula_trace:
        from: $e^x=1$
        to: $x=0,\ P(0,1)$
        operation: 解指数方程并代回 $y=e^x$。
        why: 需要具体点坐标来计算距离。
      source_ref: page_0165:line 41
    - step_id: step_3
      statement: 计算切点到直线的距离并化简。
      formula_trace:
        from: $P(0,1),\ y=x-2\Leftrightarrow x-y-2=0$
        to: $d=\frac{|0-1-2|}{\sqrt2}=\frac{3\sqrt2}{2}$
        operation: 套点到直线距离公式并有理化。
        why: 该切点给出的距离就是全局最短距离。
      source_ref: page_0165:line 41
teaching_card:
  student_title: 指数曲线到直线距离的切线定位
  what_it_trains: 训练学生在“曲线点到直线最短距离”题中，先把几何最短性翻译成斜率相等，再用标准距离公式完成数值收束。
  recognition_cues:
    - 题面出现“曲线上点到给定直线的最短距离”。
    - 目标直线斜率容易直接读出。
    - 曲线是可导且导数表达式简洁（如 $e^x$）。
  normalization_moves:
    - 读出给定直线斜率。
    - 令导数等于该斜率求切点。
    - 改写直线标准式并套距离公式。
  common_failures:
    - 把最短距离当成两点间任意距离去设参硬算。
    - 切点找到后误把距离写成 $|x_0-y_0|$。
    - 距离分母把 $\sqrt{1^2+1^2}$ 误算成 2。
  similar_practice_query: y=e^x 到 y=x-2 最短距离 平行切线 点到直线距离
