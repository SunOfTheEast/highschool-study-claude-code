solution:
  source_solution_summary: |
    由 $f(x)+g^{\prime}(x-2)=\cos x$，把 $x$ 换成 $-x$ 得
    $f(-x)+g^{\prime}(-x-2)=\cos x$。因为 $f(x)=f(-x)$，
    所以 $g^{\prime}(x-2)=g^{\prime}(-x-2)$，即
    $g^{\prime}$ 关于直线 $x=-2$ 对称，A正确。
    设 $G(x)=g(x-2)+g(-x-2)$，则
    $G^{\prime}(x)=g^{\prime}(x-2)-g^{\prime}(-x-2)=0$，
    故 $G$ 为常数。又 $G(0)=2g(-2)=0$，所以
    $g(x-2)+g(-x-2)=0$，即 $g$ 关于点 $(-2,0)$ 对称，B正确。
    因为 $f$ 是偶函数，所以 $f^{\prime}$ 是奇函数，
    $y=x-f^{\prime}(x)$ 也是奇函数。由
    $f^{\prime}(x-2)+g(x)=x-2$ 得
    $g(x)=(x-2)-f^{\prime}(x-2)$，所以 $g$ 关于点 $(2,0)$ 对称。
    $g$ 同时有中心 $(-2,0)$ 和 $(2,0)$，推出周期 $8$，
    因而 $g^{\prime}$ 也是周期函数，C正确。
    令 $x=6$ 代入 $f^{\prime}(x-2)+g(x)=x-2$，得
    $f^{\prime}(4)+g(6)=4$。由周期和 $g(-2)=0$ 得 $g(6)=0$，
    所以 $f^{\prime}(4)=4$，D错误。故选ABC。
  key_steps:
    - step_id: step_1
      statement: 利用偶性和 $\cos x$ 偶性锁定 $g^{\prime}$ 的轴对称。
      formula_trace:
        from: $f(x)+g^{\prime}(x-2)=\cos x$，$f(x)=f(-x)$
        to: $g^{\prime}(x-2)=g^{\prime}(-x-2)$
        operation: 把 $x$ 换成 $-x$ 后与原式相减。
        why: 这直接给出A项。
      source_ref: page_0122
    - step_id: step_2
      statement: 由导函数轴对称积分出 $g$ 的中心对称。
      formula_trace:
        from: $g^{\prime}(x-2)=g^{\prime}(-x-2)$，$g(-2)=0$
        to: $g(x-2)+g(-x-2)=0$
        operation: 构造 $G(x)=g(x-2)+g(-x-2)$ 并求导为0，再代 $x=0$ 定常数。
        why: 这给出B项。
      source_ref: page_0122
    - step_id: step_3
      statement: 用第二个方程找到另一个对称中心。
      formula_trace:
        from: $f^{\prime}(x-2)+g(x)=x-2$，$f^{\prime}$ 是奇函数
        to: $g(x)=(x-2)-f^{\prime}(x-2)$ 关于点 $(2,0)$ 对称
        operation: 把 $g$ 写成奇函数 $y=x-f^{\prime}(x)$ 的平移。
        why: 两个中心相距4，产生周期8。
      source_ref: page_0122
    - step_id: step_4
      statement: 用周期求 $g(6)$，再判断D。
      formula_trace:
        from: $g(x+8)=g(x)$，$g(-2)=0$，$f^{\prime}(4)+g(6)=4$
        to: $g(6)=0$，$f^{\prime}(4)=4$
        operation: 令 $x=6$ 代入第二个方程，并用周期回到 $-2$。
        why: D项声称 $f^{\prime}(4)=0$，与计算矛盾。
      source_ref: page_0122
teaching_card:
  student_title: 偶函数锁住导函数，再用双中心打出周期
  what_it_trains: 训练在双函数方程中先锁定导函数对称，再积分回原函数对称，最后由两个中心推出周期。
  recognition_cues:
    - 方程右侧是 $\cos x$，天然适合和 $f$ 的偶性联动。
    - 题干给 $g(-2)=0$，说明要用它定积分常数或对称中心。
    - 第二个方程含 $x-2$，提示另一个中心在 $x=2$。
  normalization_moves:
    - 对第一式做 $x\mapsto -x$。
    - 构造 $g(x-2)+g(-x-2)$。
    - 把第二式整理为 $g(x)=(x-2)-f^{\prime}(x-2)$。
    - 用周期把 $g(6)$ 拉回 $g(-2)$。
  common_failures:
    - 只判断出 $g^{\prime}$ 的对称，忘记用 $g(-2)=0$ 定出 $g$ 的中心。
    - 把“导函数轴对称”和“原函数中心对称”混成同一种图像。
    - 没有发现第二个中心 $(2,0)$。
    - 误选D，忽略 $f^{\prime}(4)=4$。
  similar_practice_query: 双函数 偶函数 cos 导函数 对称 中心 周期 g(-2)
