      - 若学生不会从 $e^t=1/s$ 得到 $s=e^{-t}$，回补指数对数基础。
      - 若学生在 $A(t)=1+t+(1-t)e^t$ 的解数判断中卡住，回补导数单调极值基础。
      - 若学生误以为距离题必须求精确最小值才能判错，回补不等式工具基础。
  detail_terms:
