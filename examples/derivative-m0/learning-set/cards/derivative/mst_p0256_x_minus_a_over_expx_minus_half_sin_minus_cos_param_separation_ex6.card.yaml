original_problem:
  stem: 已知函数 $f(x)=x-\frac{a}{e^x}-\frac12(\sin x-\cos x)$。
  parts: *a1
  choices: []
  answer: 第(1)问：$f$ 在 $\mathbf R$ 上单调递增。第(2)问：$a\in(-\infty,-\frac12]$。
  fidelity_notes:
    - 题头跨页，page_0256 给出函数，page_0257 给出两问和解析。
solution:
  source_solution_summary: 第(1)问当 $a=0$ 时， $f^\prime(x)=1-\frac12(\cos x+\sin x) =1-\frac{\sqrt2}{2}\sin(x+\frac\pi4)>0$，所以 $f$ 在 $\mathbf R$ 上递增。第(2)问由 $f(x)\ge1$ 得 $a\le (x-1-\frac12\sin x+\frac12\cos x)e^x$ 对任意 $x$ 恒成立。令右侧为 $g(x)$，则 $g^\prime(x)=(x-\sin x)e^x$。设 $\varphi(x)=x-\sin x$， $\varphi^\prime(x)=1-\cos x\ge0$ 且 $\varphi(0)=0$，故 $g$ 在 $(-\infty,0)$ 递减、在 $(0,+\infty)$ 递增，最小值 $g(0)=-\frac12$，所以 $a\le-\frac12$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：直接求导判单调。
      formula_trace:
        from: $f(x)=x-\frac12(\sin x-\cos x)$
        to: $f^\prime(x)=1-\frac{\sqrt2}{2}\sin(x+\frac\pi4)>0$
        operation: 合并 $\cos x+\sin x$。
        why: 导数全正，所以全域递增。
      source_ref: page_0257_ex6_solution
    - step_id: step_2
      statement: 第(2)问：参变分离。
      formula_trace:
        from: $x-\frac{a}{e^x}-\frac12(\sin x-\cos x)\ge1$
        to: $a\le (x-1-\frac12\sin x+\frac12\cos x)e^x$
        operation: 把含 $a$ 的项移到一侧，再乘以 $e^x$。
        why: 求参数范围转为求右侧函数的全局最小值。
      source_ref: page_0257_ex6_solution
    - step_id: step_3
      statement: 第(2)问：构造右侧函数并求导。
      formula_trace:
        from: $g(x)=(x-1-\frac12\sin x+\frac12\cos x)e^x$
        to: $g^\prime(x)=(x-\sin x)e^x$
        operation: 乘积求导并合并三角项。
        why: 导数被化成简单的 $x-\sin x$。
      source_ref: page_0257_ex6_solution
    - step_id: step_4
      statement: 第(2)问：用 $x-\sin x$ 判极值。
      formula_trace:
        from: $\varphi(x)=x-\sin x,\ \varphi^\prime(x)=1-\cos x\ge0,\ \varphi(0)=0$
        to: $g$ 在 $0$ 处取全局最小值
        operation: 先判 $\varphi$ 的符号，再判 $g^\prime$ 的符号。
        why: 右侧函数的最低点给出 $a$ 的上界。
      source_ref: page_0257_ex6_solution
    - step_id: step_5
      statement: 第(2)问：代入最小值。
      formula_trace:
        from: $g(0)=-\frac12$
        to: $a\le-\frac12$
        operation: 取右侧函数全局最小值。
        why: 要让 $a\le g(x)$ 对任意 $x$ 成立，必须且只需 $a$ 不超过最小值。
      source_ref: page_0257_ex6_solution
teaching_card:
  student_title: 把 $a/e^x$ 乘回去，转成右侧函数求最小值
  what_it_trains: 训练全域恒成立里的参变分离：参数挂在 $e^{-x}$ 上时，先乘回 $e^x$，再研究剩下函数的最小值。
  recognition_cues:
    - 题目要求 $f(x)\ge1$ 对任意实数成立。
    - 参数以 $-\frac a{e^x}$ 的形式出现，适合乘以 $e^x$ 分离。
    - 求导后出现非常干净的 $x-\sin x$。
  normalization_moves:
    - 第(1)问直接用 $\sin x+\cos x$ 的最大值控导数。
    - 第(2)问先参变分离，不要先对原函数硬分类。
    - 看到 $x-\sin x$，用导数 $1-\cos x\ge0$ 判符号。
  common_failures:
    - 移项时忘记 $e^x>0$，把不等号方向弄乱。
    - 把 $a$ 的范围误写成 $a\ge-\frac12$。
    - 只找到 $x=0$，没有证明它是全局最小点。
  similar_practice_query: 参变分离 a/e^x sinx-cosx x-sinx 全局最小值 参数范围
