stem: |-
  已知函数 $f(x)=x-\frac{a}{e^x}-\frac12(\sin x-\cos x)$。
  1. 当 $a=0$ 时，判断函数 $f(x)$ 的单调性。
  2. 已知 $f(x)\ge1$ 对任意 $x\in\mathbf R$ 恒成立，求 $a$ 的取值范围。
answer: |-
  第(1)问：$f$ 在 $\mathbf R$ 上单调递增。第(2)问：$a\in(-\infty,-\frac12]$。

  第(1)问当 $a=0$ 时， $f^\prime(x)=1-\frac12(\cos x+\sin x) =1-\frac{\sqrt2}{2}\sin(x+\frac\pi4)>0$，所以 $f$ 在 $\mathbf R$ 上递增。第(2)问由 $f(x)\ge1$ 得 $a\le (x-1-\frac12\sin x+\frac12\cos x)e^x$ 对任意 $x$ 恒成立。令右侧为 $g(x)$，则 $g^\prime(x)=(x-\sin x)e^x$。设 $\varphi(x)=x-\sin x$， $\varphi^\prime(x)=1-\cos x\ge0$ 且 $\varphi(0)=0$，故 $g$ 在 $(-\infty,0)$ 递减、在 $(0,+\infty)$ 递增，最小值 $g(0)=-\frac12$，所以 $a\le-\frac12$。
