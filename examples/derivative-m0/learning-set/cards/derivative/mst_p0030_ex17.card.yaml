stem: |-
  设函数 $f(x)=x(e^x+1)$，$g(x)=(x+1)\ln x$，若存在实数 $x_1,x_2$，使得 $f(x_1)=g(x_2)$，则 $|x_1-x_2|$ 的最小值为 ( )
  A. $e$
  B. 2
  C. 1
  D. $\frac{1}{e}$
answer: |-
  C

  把 $g(x_2)=(x_2+1)\ln x_2$ 写成 $\ln x_2(e^{\ln x_2}+1)=f(\ln x_2)$。又 $f'(x)=e^x(x+1)+1\ge 1-1/e^2>0$，所以 $f$ 在实数集上严格递增。由 $f(x_1)=f(\ln x_2)$ 得 $x_1=\ln x_2$，于是 $|x_1-x_2|=|\ln x_2-x_2|=x_2-\ln x_2\ge1$，当 $x_2=1$ 取等，故选 C。
