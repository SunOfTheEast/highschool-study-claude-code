stem: （2023 · 福州期末 T16）已知 $f(x)=|xe^x|$，关于 $x$ 的方程 $f^2(x)+af(x)+2=0\ (a\in\mathbf{R})$ 有四个不同的实数根，则 $a$ 的取值范围为______。
answer: |-
  $\left(-\infty,-\frac{2e^2+1}{e}\right)$

  把 $f(x)=|xe^x|$ 写成分段后可知：在 $x\ge0$ 单调递增；在 $x<0$ 侧先增后减，且在 $x=-1$ 取极大值 $\frac1e$。 因而方程 $f(x)=t$ 的解个数为：$0<t<\frac1e$ 有 3 解， $t=\frac1e$ 有 2 解，$t>\frac1e$ 或 $t=0$ 有 1 解。 原方程等价于 $t^2+at+2=0$（$t=f(x)\ge0$）。要得到 $x$ 的四个不同实根， 必须让该二次方程在 $\left(0,\frac1e\right)$ 与 $\left(\frac1e,+\infty\right)$ 各有一根。令 $g(t)=t^2+at+2$，由 $g(0)=2>0$ 且抛物线开口向上， 充要条件是 $g(\frac1e)<0$，即 $\frac1{e^2}+\frac{a}{e}+2<0$，解得 $a<-\frac{2e^2+1}{e}$。
