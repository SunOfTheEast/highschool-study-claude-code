solution:
  source_solution_summary: 把 $f(x)=|xe^x|$ 写成分段后可知：在 $x\ge0$ 单调递增；在 $x<0$ 侧先增后减，且在 $x=-1$ 取极大值 $\frac1e$。 因而方程 $f(x)=t$ 的解个数为：$0<t<\frac1e$ 有 3 解， $t=\frac1e$ 有 2 解，$t>\frac1e$ 或 $t=0$ 有 1 解。 原方程等价于 $t^2+at+2=0$（$t=f(x)\ge0$）。要得到 $x$ 的四个不同实根， 必须让该二次方程在 $\left(0,\frac1e\right)$ 与 $\left(\frac1e,+\infty\right)$ 各有一根。令 $g(t)=t^2+at+2$，由 $g(0)=2>0$ 且抛物线开口向上， 充要条件是 $g(\frac1e)<0$，即 $\frac1{e^2}+\frac{a}{e}+2<0$，解得 $a<-\frac{2e^2+1}{e}$。
  key_steps:
    - step_id: step_1
      statement: 分析 $f(x)=|xe^x|$ 的形状与关键高度。
      formula_trace:
        from: $f(x)=\begin{cases}xe^x,&x\ge0\\-xe^x,&x<0\end{cases}$
        to: $f(-1)=\frac1e$，且 $0<t<\frac1e$ 时 $f(x)=t$ 有 3 解
        operation: 分段求导并结合极值点统计水平线交点数。
        why: 后续“四根”条件完全由每个 $t$ 层的交点数决定。
      source_ref: page_0188
    - step_id: step_2
      statement: 把原方程改写为关于 $t=f(x)$ 的二次方程。
      formula_trace:
        from: $[f(x)]^2+af(x)+2=0$
        to: $t^2+at+2=0,\ t=f(x)\ge0$
        operation: 设中间变量 $t$。
        why: 把“函数值层”与“自变量根数”分离。
      source_ref: page_0188
    - step_id: step_3
      statement: 用区间判根匹配“四个不同实根”。
      formula_trace:
        from: $0<t<\frac1e$ 对应 3 解，$t>\frac1e$ 对应 1 解
        to: $t^2+at+2=0$ 在 $\left(0,\frac1e\right)$ 与 $\left(\frac1e,+\infty\right)$ 各有一根
        operation: 按每个 $t$ 层贡献的 $x$ 解数做组合。
        why: 3+1=4 是唯一满足“四个不同实根”的配型。
      source_ref: page_0188
    - step_id: step_4
      statement: 转成抛物线在 $t=\frac1e$ 处的符号条件。
      formula_trace:
        from: $g(t)=t^2+at+2$
        to: $g(\frac1e)=\frac1{e^2}+\frac{a}{e}+2<0\Rightarrow a<-\frac{2e^2+1}{e}$
        operation: 利用 $g(0)>0$、开口向上与区间各一根的等价条件。
        why: 直接得到参数范围。
      source_ref: page_0188
teaching_card:
  student_title: 先数层再判根的四根参数题
  what_it_trains: 训练“函数值分层 + 参数二次判根”的两层联动思路，快速处理零点个数反推参数范围。
  recognition_cues:
    - 题目是 $F(f(x),a)=0$ 且问“有若干不同实根”。
    - 内层函数带绝对值与指数，图像有明显极值高度。
    - source 中出现 $t=f(x)$ 与两幅示意图。
  normalization_moves:
    - 先求内层函数关键高度（这里是 $\frac1e$）。
    - 统计每个 $t$ 对应的 $x$ 解个数。
    - 再对 $t$ 方程做区间判根。
  common_failures:
    - 忽略 $t=f(x)\ge0$ 的约束。
    - 把 $t=\frac1e$ 的 2 解误记成 3 解。
    - 直接判别式分类，遗漏“根落区间”的必要条件。
  similar_practice_query: 绝对值指数函数 四个不同实根 t分层 参数范围
