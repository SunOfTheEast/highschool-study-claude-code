stem: |-
  （2023 江西九江高二期末 · 多选 T10）关于切线，下列结论正确的是（  ）
  A. 过点 $\left(-\frac{1}{2}, \frac{\sqrt{3}}{2}\right)$ 且与圆 $x^2+y^2=1$ 相切的直线方程为 $x-\sqrt{3}y+2=0$。
  B. 过点 $(1,2)$ 且与抛物线 $y^2=4x$ 相切的直线方程为 $x-y+1=0$。
  C. 过点 $(0,-1)$ 且与曲线 $f(x)=x\ln x$ 相切的直线 $l$ 的方程为 $x-y+1=0$。
  D. 曲线 $y=\frac{2x-1}{x+2}$ 在点 $(-1,-3)$ 处的切线方程为 $5x-y+2=0$。
answer: |-
  ABD

  A 中给定点在圆上，半径斜率与切线斜率乘积为 -1，得切线 $x-\sqrt3y+2=0$。B 中设抛物线切点为 $(x_0,y_0)$，用 $yy_0=2(x+x_0)$ 且 $x_0=y_0^2/4$，代入 $(1,2)$ 得 $y_0=2$，切线为 $x-y+1=0$。C 中设切点 $(x_0,x_0\ln x_0)$，由过点 $(0,-1)$ 的割线斜率等于 $\ln x_0+1$，解得 $x_0=1$，实际切线为 $x-y-1=0$，故 C 错。 D 中求导得 $y'=5/(x+2)^2$，在 $(-1,-3)$ 处斜率为 5，切线为 $5x-y+2=0$。故选 ABD。
