solution:
  source_solution_summary: A 中给定点在圆上，半径斜率与切线斜率乘积为 -1，得切线 $x-\sqrt3y+2=0$。B 中设抛物线切点为 $(x_0,y_0)$，用 $yy_0=2(x+x_0)$ 且 $x_0=y_0^2/4$，代入 $(1,2)$ 得 $y_0=2$，切线为 $x-y+1=0$。C 中设切点 $(x_0,x_0\ln x_0)$，由过点 $(0,-1)$ 的割线斜率等于 $\ln x_0+1$，解得 $x_0=1$，实际切线为 $x-y-1=0$，故 C 错。 D 中求导得 $y'=5/(x+2)^2$，在 $(-1,-3)$ 处斜率为 5，切线为 $5x-y+2=0$。故选 ABD。
  key_steps:
    - step_id: step_1
      statement: A：圆上一点的切线由半径垂直确定。
      formula_trace:
        from: 点 $\left(-\frac12,\frac{\sqrt3}{2}\right)$ 在 $x^2+y^2=1$ 上， 半径斜率为 $\frac{\frac{\sqrt3}{2}-0}{-\frac12-0}=-\sqrt3$。
        to: $-\sqrt3\cdot k=-1\Rightarrow k=\frac{\sqrt3}{3}$， $y-\frac{\sqrt3}{2}=\frac{\sqrt3}{3}\left(x+\frac12\right)$， 即 $x-\sqrt3y+2=0$。
        operation: 用半径与切线垂直，代入点斜式整理。
        why: 圆上一点切线的斜率由半径斜率唯一确定。
      source_ref: page_0078
    - step_id: step_2
      statement: B：过外部给定点时先设抛物线切点。
      formula_trace:
        from: 抛物线 $y^2=4x$ 的切线公式为 $yy_0=2(x+x_0)$，且 $x_0=\frac{y_0^2}{4}$。
        to: 代入 $(1,2)$ 得 $2y_0=2\left(1+\frac{y_0^2}{4}\right)$， 解得 $y_0=2$，切线 $2y=2(x+1)$，即 $x-y+1=0$。
        operation: 把切点参数带入切线公式，再用已知点落在切线上解参数。
        why: 题目给的是过点的切线，不是给定点处的切线，切点需要先求出。
      source_ref: page_0078
    - step_id: step_3
      statement: C：对 $x\ln x$ 设切点并检验选项符号。
      formula_trace:
        from: $f^{\prime}(x)=\ln x+1$，切点设为 $(x_0,x_0\ln x_0)$，过 $(0,-1)$ 的切线满足 $\ln x_0+1=\frac{x_0\ln x_0+1}{x_0}$。
        to: $x_0=1$，切点 $(1,0)$，斜率 $1$，切线 $y=x-1$，即 $x-y-1=0$。
        operation: 令导数斜率等于切点到给定点的斜率。
        why: 实际切线与选项 $x-y+1=0$ 差一个常数项符号，所以 C 错。
      source_ref: page_0078
    - step_id: step_4
      statement: D：给定曲线上点，直接求导写切线。
      formula_trace:
        from: $y=\frac{2x-1}{x+2}$，$y^{\prime}=\frac{5}{(x+2)^2}$。
        to: $k=y^{\prime}(-1)=5$， $y+3=5(x+1)$，即 $5x-y+2=0$。
        operation: 对分式函数求导，并代入点斜式。
        why: 点 $(-1,-3)$ 在曲线上，切线斜率就是该点导数值。
      source_ref: page_0078
teaching_card:
  student_title: 切线题先分清“在点处”还是“过点”
  what_it_trains: 训练在切线方程判断题中先判断点是不是切点：已知切点就直接求斜率， 只是“过点”就要另设切点。
  recognition_cues:
    - 选项里同时出现“过点”和“在点处”。
    - 给定点不一定在曲线上，不能直接把它当切点。
    - 选项 C 的曲线 $x\ln x$ 带定义域，切点必须满足 $x_0>0$。
  normalization_moves:
    - 先代入检查给定点是否在曲线上。
    - 过定点切线统一设切点 $(x_0,f(x_0))$。
    - 用导数斜率等于切点到定点的斜率。
    - 最后把点斜式整理成选项中的一般式。
  common_failures:
    - 把“过点 $(1,2)$”误看成抛物线在 $(1,2)$ 处切线。
    - C 选项只算出斜率 1，却没有核对常数项。
    - 分式求导漏掉分母平方。
  similar_practice_query: 切线方程 过定点 切点参数 圆 抛物线 xlnx 分式函数
