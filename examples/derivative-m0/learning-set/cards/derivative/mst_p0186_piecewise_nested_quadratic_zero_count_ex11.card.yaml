stem: |-
  （江苏苏州常熟中学 2024 高三阶段性抽测 T8）已知函数 $f(x)=\begin{cases} -x^2-2x, & x \leqslant 0 \\ |\log_{\frac{1}{2}}x|, & x > 0 \end{cases}$，$g(x)=2[f(x)]^2-mf(x)+1$，若 $m \in (2\sqrt{2}, 3)$，则 $g(x)$ 零点的个数为（  ）
  A. 2
  B. 4
  C. 6
  D. 8
answer: |-
  D

  令 t=f(x)，则 g(x)=0 等价于 h(t)=2t^2-mt+1=0。由 m∈(2√2,3) 得 Δ=m^2-8>0，且对称轴 t=m/4 满足 0<t<1，再由 h(1)=3-m>0 可知 两根满足 0<t1<t2<1。于是只需分别统计 f(x)=t1 与 f(x)=t2 的解数。 对任意 t∈(0,1)：左支 -x^2-2x=t 在 x≤0 给出两个解，右支 |log_{1/2}x|=t 在 x>0 也给出两个解，所以每个 t 对应 4 个 x 解。 故 f(x)=t1 有 4 解、f(x)=t2 有 4 解，总零点数 8，选 D。
