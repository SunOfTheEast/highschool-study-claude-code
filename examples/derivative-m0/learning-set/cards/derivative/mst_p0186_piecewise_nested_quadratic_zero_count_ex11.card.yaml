solution:
  source_solution_summary: 令 t=f(x)，则 g(x)=0 等价于 h(t)=2t^2-mt+1=0。由 m∈(2√2,3) 得 Δ=m^2-8>0，且对称轴 t=m/4 满足 0<t<1，再由 h(1)=3-m>0 可知 两根满足 0<t1<t2<1。于是只需分别统计 f(x)=t1 与 f(x)=t2 的解数。 对任意 t∈(0,1)：左支 -x^2-2x=t 在 x≤0 给出两个解，右支 |log_{1/2}x|=t 在 x>0 也给出两个解，所以每个 t 对应 4 个 x 解。 故 f(x)=t1 有 4 解、f(x)=t2 有 4 解，总零点数 8，选 D。
  key_steps:
    - step_id: step_1
      statement: 把复合零点问题改写为外层二次函数根问题。
      formula_trace:
        from: $g(x)=2[f(x)]^2-mf(x)+1=0$
        to: $h(t)=2t^2-mt+1=0,\ t=f(x)$
        operation: 设 t=f(x) 做同构换元。
        why: 先定位外函数零点 t1,t2，再回到内函数统计原像个数。
      source_ref: page_0187_ex11_solution_continue
    - step_id: step_2
      statement: 由参数区间确定外函数两根落在 (0,1)。
      formula_trace:
        from: $m\in(2\sqrt{2},3)$
        to: $0<t_1<t_2<1$
        operation: 用 Δ=m^2-8>0 得两实根；用对称轴 t=\frac{m}{4}\in(0,1) 及 h(1)=3-m>0 锁定两根都在 0 与 1 之间。
        why: 后续只需统计 f(x)=t 在 0<t<1 的交点个数。
      source_ref: page_0187_ex11_solution_continue
    - step_id: step_3
      statement: 统计分段函数在 0<t<1 时的原像个数。
      formula_trace:
        from: $f(x)=\begin{cases}-x^2-2x,&x\le0\\ |\log_{\frac12}x|,&x>0\end{cases}=t,\ 0<t<1$
        to: 左支 2 解 + 右支 2 解 = 4 解
        operation: 左支解 -x^2-2x=t 得 x=-1\pm\sqrt{1-t}（均 ≤0）；右支 |\log_{\frac12}x|=t 得 x=(\frac12)^t 与 x=2^t。
        why: 每个 t∈(0,1) 都对应 4 个不同 x。
      source_ref: page_0186_ex11_solution_start
    - step_id: step_4
      statement: 合并两层根计数得到最终零点数。
      formula_trace:
        from: $f(x)=t_1$ 有 4 解，$f(x)=t_2$ 有 4 解
        to: $g(x)$ 零点个数 $=8$
        operation: 按 t1、t2 分层计数后相加。
        why: t1≠t2，两个原像集合互不重合。
      source_ref: page_0187_ex11_solution_continue
teaching_card:
  student_title: 先解外层二次，再数内层四交点
  what_it_trains: 训练“复合零点=外层根 + 内层原像计数”的两层拆解，并在分段图像上稳定完成交点计数。
  recognition_cues:
    - 题目形态是 $g(x)=\Phi(f(x))$ 的复合零点计数。
    - 给出 m 的区间，常用于先定外层方程根区间。
    - 内函数是分段二次+对数绝对值，天然适合水平线法。
  normalization_moves:
    - 设 t=f(x)，先解 h(t)=0。
    - 用判别式与函数值把 t 根压到具体区间。
    - 对每个 t 根分别统计 f(x)=t 的解数。
    - 最后将两层计数相加。
  common_failures:
    - 只算出 t1,t2 就直接报 2 个零点，忘记回代原像。
    - 把 0<t<1 时左支二次方程误判成 1 解。
    - 在 |log_{1/2}x|=t 中漏掉 x=2^t 或 x=(1/2)^t。
    - 把 t=1 当作根并误引入边界。
  similar_practice_query: 复合函数 g(x)=h(f(x)) 零点个数 分段函数 水平线法
