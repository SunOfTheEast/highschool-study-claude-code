solution:
  source_solution_summary: |
    A：$f^{\prime}(x)=2(x+1)$，$f^{\prime\prime}(x)=2\ne0$，无拐点。
    B：$f^{\prime\prime}(x)=6x+4$，在 $x=-\frac23$ 处为 0，且左右由负变正，所以有唯一拐点。
    C：$f^{\prime\prime}(x)=(x+2)e^x$，由于 $e^x>0$，只在 $x=-2$ 处变号，所以有唯一拐点。
    D：$f^{\prime\prime}(x)=-\frac1{x^2}+2-\sin x$，源解由 $f^{\prime\prime}(\frac12)<0$、$f^{\prime\prime}(1)>0$ 得存在拐点；进一步在 $(0,1)$ 上有 $(f^{\prime\prime})^{\prime}(x)=\frac2{x^3}-\cos x>0$，而 $x\ge1$ 时 $f^{\prime\prime}(x)\ge1-\frac1{x^2}\ge0$ 且 $f^{\prime\prime}(1)>0$，故零点唯一并发生变号。故选 BCD。
  key_steps:
    - step_id: step_1
      statement: A 项二阶导恒正，不能形成拐点。
      formula_trace:
        from: $f(x)=(x+1)^2$
        to: $f^{\prime}(x)=2(x+1),\quad f^{\prime\prime}(x)=2\ne0$
        operation: 连续求导。
        why: 没有 $f^{\prime\prime}=0$ 的点，更不可能有二阶导变号。
      source_ref: page_0089_ex07_solution
    - step_id: step_2
      statement: B 项三次函数有一个二阶导变号零点。
      formula_trace:
        from: $f(x)=x^3+2x^2+3x$
        to: $f^{\prime\prime}(x)=6x+4=0\Longleftrightarrow x=-\frac23$
        operation: 求二阶导并解一次方程。
        why: $6x+4$ 在 $-\frac23$ 左负右正，因此该点是唯一拐点横坐标。
      source_ref: page_0089_ex07_solution
    - step_id: step_3
      statement: C 项用指数因子恒正锁定唯一变号点。
      formula_trace:
        from: $f(x)=xe^x$
        to: $f^{\prime}(x)=(x+1)e^x,\quad f^{\prime\prime}(x)=(x+2)e^x$
        operation: 乘积求导并提取恒正因子 $e^x$。
        why: $e^x>0$，二阶导符号只由 $x+2$ 决定，故在 $x=-2$ 唯一变号。
      source_ref: page_0089_ex07_solution
    - step_id: step_4
      statement: D 项先按源解证明至少存在一个拐点。
      formula_trace:
        from: $f(x)=\ln x+x^2+\sin x,\quad x>0$
        to: $f^{\prime\prime}(x)=-\frac1{x^2}+2-\sin x,\quad f^{\prime\prime}\left(\frac12\right)<0,\quad f^{\prime\prime}(1)>0$
        operation: 求二阶导并取 $\frac12,1$ 两点比较符号。
        why: $f^{\prime\prime}$ 连续，所以 $(\frac12,1)$ 内至少有一个变号候选零点。
      source_ref: page_0089_ex07_solution
    - step_id: step_5
      statement: 补充 D 项唯一性。
      formula_trace:
        from: $q(x)=f^{\prime\prime}(x)=-\frac1{x^2}+2-\sin x$
        to: $q^{\prime}(x)=\frac2{x^3}-\cos x>0\ (0<x<1),\quad q(x)>0\ (x\ge1)$
        operation: 在 $(0,1)$ 用 $\frac2{x^3}>2$、$\cos x<1$ 得严格递增；在 $x\ge1$ 用 $2-\sin x\ge1$ 得下界。
        why: $q(0^+)=-\infty$ 且 $(0,1)$ 严格递增，只能穿过 0 一次；$x\ge1$ 不再有零点。
      source_ref: page_0089_ex07_solution
    - step_id: step_6
      statement: 汇总符合“唯一拐点”的选项。
      formula_trace:
        from: A 无拐点；B、C、D 各有且仅有一个二阶导变号零点
        to: 答案为 BCD
        operation: 按多选题逐项取真。
        why: 题干问“具有唯一拐点”的函数。
      source_ref: page_0089_ex07_solution
teaching_card:
  student_title: 唯一拐点要证明“有且只有”
  what_it_trains: 训练多选题中逐项用二阶导变号判拐点，并在复杂选项里补上唯一性证明。
  recognition_cues:
    - 题干给出完整拐点定义，关键词是 $f^{\prime\prime}=0$ 和左右异号。
    - 选项包含多项式、指数乘积、对数三角复合函数，难度集中在 D 的唯一性。
    - 多选题问“具有唯一拐点”，不能只证明“存在拐点”。
  normalization_moves:
    - 每个选项先求 $f^{\prime\prime}$。
    - 线性二阶导直接看一次变号。
    - 指数乘积先剥离恒正因子。
    - D 项把 $f^{\prime\prime}$ 记为 $q$，分 $(0,1)$ 与 $[1,+\infty)$ 控制零点。
  common_failures:
    - 把 A 的二阶导恒正误判为“凸函数所以有拐点”。
    - C 项求导时漏掉乘积法则。
    - D 项只用 $q(\frac12)<0,q(1)>0$ 得到存在，没证明唯一。
    - 忘记 D 项定义域排除了 $x\le0$。
  similar_practice_query: 拐点 二阶导 变号 唯一性 多选 函数凹凸性
