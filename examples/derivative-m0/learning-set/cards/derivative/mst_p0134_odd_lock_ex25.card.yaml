stem: |-
  （2023·成都期末）已知定义在 $\mathbf{R}$ 上的可导函数 $f(x)$，对于任意实数 $x$ 都有 $f(-x)+f(x)=x^2$，且当 $x\in(0,+\infty)$ 时都有 $f^{\prime}(x)>x$。若 $f(1-a)\geqslant f(a)+\frac12-a$，则实数 $a$ 的取值范围为（  ）
  A. $\left(-\infty,\frac12\right]$
  B. $\left[\frac12,+\infty\right)$
  C. $(-\infty,2]$
  D. $[2,+\infty)$
answer: |
  A

  令 $F(x)=f(x)-\frac12x^2$，由 $f(-x)+f(x)=x^2$ 得
  $F(-x)=f(-x)-\frac12x^2=-F(x)$，故 $F$ 为奇函数。
  又题设给 $x>0$ 时 $f^{\prime}(x)>x$，于是
  $F^{\prime}(x)=f^{\prime}(x)-x>0$（在 $x>0$ 上）。再由
  $F$ 奇性可得 $F^{\prime}$ 偶性，从而 $F^{\prime}(x)>0$ 在全体实数成立，
  即 $F$ 在 $\mathbf{R}$ 上递增。把条件
  $f(1-a)\ge f(a)+\frac12-a$ 改写为
  $f(1-a)-\frac12(1-a)^2\ge f(a)-\frac12a^2$，即
  $F(1-a)\ge F(a)$。由递增性得 $1-a\ge a$，解得
  $a\le\frac12$，故选 A。
