solution:
  source_solution_summary: |
    令 $F(x)=f(x)-\frac12x^2$，由 $f(-x)+f(x)=x^2$ 得
    $F(-x)=f(-x)-\frac12x^2=-F(x)$，故 $F$ 为奇函数。
    又题设给 $x>0$ 时 $f^{\prime}(x)>x$，于是
    $F^{\prime}(x)=f^{\prime}(x)-x>0$（在 $x>0$ 上）。再由
    $F$ 奇性可得 $F^{\prime}$ 偶性，从而 $F^{\prime}(x)>0$ 在全体实数成立，
    即 $F$ 在 $\mathbf{R}$ 上递增。把条件
    $f(1-a)\ge f(a)+\frac12-a$ 改写为
    $f(1-a)-\frac12(1-a)^2\ge f(a)-\frac12a^2$，即
    $F(1-a)\ge F(a)$。由递增性得 $1-a\ge a$，解得
    $a\le\frac12$，故选 A。
  key_steps:
    - step_id: step_1
      statement: 平移去掉偶函数部分，锁定奇函数骨架。
      formula_trace:
        from: $f(-x)+f(x)=x^2$
        to: $F(x)=f(x)-\frac12x^2,\quad F(-x)=-F(x)$
        operation: 两边减去同一偶函数 $\frac12x^2$，把“和式约束”改写成奇性约束。
        why: 后续可把函数值不等式转成输入比较。
      source_ref: page_0134_solution
    - step_id: step_2
      statement: 用导数条件建立全轴递增。
      formula_trace:
        from: $x>0$ 时 $f^{\prime}(x)>x$
        to: $F^{\prime}(x)=f^{\prime}(x)-x>0$，且由奇性推出 $F^{\prime}$ 为偶函数
        operation: 先在半轴上求导比较，再用奇函数导数为偶函数把结论延拓到全轴。
        why: 得到 $F$ 在 $\mathbf{R}$ 上递增。
      source_ref: page_0134_solution
    - step_id: step_3
      statement: 把题设不等式改写成 $F$ 的比较。
      formula_trace:
        from: $f(1-a)\ge f(a)+\frac12-a$
        to: $f(1-a)-\frac12(1-a)^2\ge f(a)-\frac12a^2$
        operation: 利用恒等式 $\frac12(1-a)^2-\frac12a^2=\frac12-a$。
        why: 左右两侧正好对应 $F(1-a)$ 与 $F(a)$。
      source_ref: page_0134_solution
    - step_id: step_4
      statement: 由单调性反推参数范围。
      formula_trace:
        from: $F(1-a)\ge F(a)$
        to: $1-a\ge a\Rightarrow a\le\frac12$
        operation: 对递增函数应用保序性，去掉函数符号。
        why: 直接对应选项 A。
      source_ref: page_0134_solution
teaching_card:
  student_title: 先锁奇函数，再比输入大小
  what_it_trains: 训练把“$f(-x)+f(x)$ 已知”这类题先做去偶构造，形成奇函数并用导数条件拿到单调性，再把函数值不等式降维成输入不等式。
  recognition_cues:
    - 题干出现 $f(-x)+f(x)=\text{偶函数}$。
    - 附带给出 $f^{\prime}(x)$ 与简单函数的比较，适合构造导数可控的辅助函数。
    - 最终问参数范围，常见终点是线性不等式。
  normalization_moves:
    - 先设 $F(x)=f(x)-\frac12x^2$。
    - 把常数项配成平方差，写成 $F(1-a)\ge F(a)$。
    - 用递增性把函数值比较改成输入比较。
  common_failures:
    - 只做奇偶拆分，不补单调性依据。
    - 把 $\frac12-a$ 配错成 $\frac12(1-a)^2+\frac12a^2$。
    - 从 $F(1-a)\ge F(a)$ 推错为 $1-a\le a$。
  similar_practice_query: 奇函数锁定 去偶留奇 参数范围 抽象函数
