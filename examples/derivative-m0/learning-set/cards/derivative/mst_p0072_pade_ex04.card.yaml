stem: |-
  （2024 山东德州高二期末 T19）两个正整数 m,n，函数 f(x) 在 x=0 处的 [m,n] 阶帕德近似定义为：R(x)=\frac{a_0+a_1x+\cdots+a_mx^m}{1+b_1x+\cdots+b_nx^n}， 且满足：f(0)=R(0), f'(0)=R'(0), f''(0)=R''(0), \cdots, f^{(m+n)}(0)=R^{(m+n)}(0)。已知函数 f(x)=\ln(x+1)。
  (1). 求函数 f(x)=\ln(x+1) 在 x=0 处的 [1,1] 阶帕德近似 R(x)。
  (2). 在 (1) 的条件下，求证：\frac{R(x)}{\ln(x+1)}<1。
  (3). 已知 g(x)=e^x 在 x=0 处的 [2,2] 阶帕德近似为 R(x)=\frac{x^2+6x+12}{x^2-6x+12}，依据帕德近似公式 e^x\approx\frac{x^2+6x+12}{x^2-6x+12}；若 f(x)=\ln(x+1) 在 x=0 处的 [2,2] 阶帕德近似为 R(x)=\frac{a+bx+\frac12x^2}{1+x+\frac16x^2}，设 p=0.1e^{0.1}, q=\frac19, r=-\ln0.9，试比较 p,q,r 的大小。
answer: |-
  (1) R(x)=\frac{x}{1+\frac12x}=\frac{2x}{x+2}。 (2) 在 x\in(-1,0)\cup(0,+\infty) 上有 \frac{R(x)}{\ln(x+1)}<1。 (3) a=0,b=1，\ln(x+1) 的 [2,2] 阶帕德近似为 R(x)=\frac{x+\frac12x^2}{1+x+\frac16x^2} =\frac{3x^2+6x}{x^2+6x+6}；按源页估算，r<p<q。

  第 (1) 问设 [1,1] 阶帕德近似 R(x)=\frac{a_0+a_1x}{1+b_1x}， 由 f(0),f'(0),f''(0) 与 R 对应相等得到 a_0=0,a_1=1,b_1=\frac12， 故 R(x)=2x/(x+2)。第 (2) 问令 F(x)=2x/(x+2)-\ln(x+1)，求得 F'(x)=-x^2/((x+1)(x+2)^2)<0，再按 x\in(-1,0) 与 x>0 分别利用 \ln(x+1) 的符号证明比值小于 1。第 (3) 问先由给定 [2,2] 形式求得 a=0,b=1，再代入 x=0.1 估算 p，代入 x=-0.1 估算 -\ln0.9，最后与 q=1/9 比较。
