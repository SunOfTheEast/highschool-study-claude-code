solution:
  source_solution_summary: 定义域为 $x>-b$。源解按穿根原理先对齐零点：$2a-x=0$ 的零点是 $x=2a$，$\ln(x+b)=0$ 的零点是 $x=1-b$，故 $2a=1-b$，即 $b=1-2a$。\n于是\n$ a^2+b^2=a^2+(2a-1)^2$。\n再用柯西不等式：\n$[a^2+(2a-1)^2]\,[(-2)^2+1^2]\ge[-2a+(2a-1)]^2=1$，\n得到 $a^2+b^2\ge\frac{1}{5}$。当 $(a,2a-1)$ 与 $(-2,1)$ 同向时取等，解得 $a=\frac{2}{5},\ b=\frac{1}{5}$，故最小值为 $\frac{1}{5}$，选 A。
  key_steps:
    - step_id: step_1
      statement: 提取定义域和两个零点。
      formula_trace:
        from: $f(x)=(2a-x)\ln(x+b)$
        to: 定义域 $x>-b$；$2a-x=0\Rightarrow x=2a$；$\ln(x+b)=0\Rightarrow x=1-b$
        operation: 分别解线性与对数零点方程。
        why: 为穿根建立参数关系。
      source_ref: page_0178_ex35_solution
    - step_id: step_2
      statement: 按穿根原理写出约束。
      formula_trace:
        from: $f(x)\le0$
        to: $2a=1-b$
        operation: 令两因子过零位置对齐。
        why: 源页给出的核心消参关系。
      source_ref: page_0178_ex35_solution
    - step_id: step_3
      statement: 目标式化为单参数二次型。
      formula_trace:
        from: $2a=1-b$
        to: $b=1-2a,\quad a^2+b^2=a^2+(2a-1)^2$
        operation: 代换消去 $b$。
        why: 将最值问题转化为标准二次型估计。
      source_ref: page_0178_ex35_solution
    - step_id: step_4
      statement: 套柯西不等式给下界。
      formula_trace:
        from: $a^2+(2a-1)^2$
        to: $[a^2+(2a-1)^2]\cdot5\ge[-2a+(2a-1)]^2=1$
        operation: 向量 $(a,2a-1)$ 与 $(-2,1)$ 做内积估计。
        why: 直接得到常数下界 $\frac{1}{5}$。
      source_ref: page_0178_ex35_solution
    - step_id: step_5
      statement: 写出取等点并对应选项。
      formula_trace:
        from: 等号条件 $(a,2a-1)\parallel(-2,1)$ 且 $2a=1-b$
        to: $a=\frac{2}{5},\ b=\frac{1}{5},\ a^2+b^2=\frac{1}{5}$
        operation: 联立比例关系与穿根关系。
        why: 确认下界可达，锁定 A。
      source_ref: page_0178_ex35_solution
teaching_card:
  student_title: 穿根后用二次型一把压下去
  what_it_trains: 训练从“乘积恒号”先定零点关系，再把参数平方和压成一个可直接套不等式的二次型。
  recognition_cues:
    - 题干是线性项与对数项的乘积恒号。
    - 问的是 $a^2+b^2$ 最小值。
    - 线性零点和对数零点都易显式写出。
  normalization_moves:
    - 先做穿根得到 $2a=1-b$。
    - 把目标改成 $a^2+(2a-1)^2$。
    - 用柯西不等式直接打出常数下界。
    - 最后补取等点核对选项。
  common_failures:
    - 把 $2a=1-b$ 写成 $2a=b-1$ 后未同步修正后续公式。
    - 直接对 $5a^2-4a+1$ 配方时算错常数项。
    - 柯西中向量选取不当，无法得到常数 1。
  similar_practice_query: 穿根原理 柯西不等式 参数平方和最小值 对数乘积
