stem: |-
  （2024 · 武汉江汉区月考 T8）设函数 $f(x)=(2a-x)\ln(x+b)$，若 $f(x)\leqslant0$，则 $a^2+b^2$ 的最小值为（  ）
  A. \frac{1}{5}
  B. \frac{\sqrt{5}}{5}
  C. \frac{1}{2}
  D. \frac{\sqrt{2}}{2}
answer: |-
  A

  定义域为 $x>-b$。源解按穿根原理先对齐零点：$2a-x=0$ 的零点是 $x=2a$，$\ln(x+b)=0$ 的零点是 $x=1-b$，故 $2a=1-b$，即 $b=1-2a$。\n于是\n$ a^2+b^2=a^2+(2a-1)^2$。\n再用柯西不等式：\n$[a^2+(2a-1)^2]\,[(-2)^2+1^2]\ge[-2a+(2a-1)]^2=1$，\n得到 $a^2+b^2\ge\frac{1}{5}$。当 $(a,2a-1)$ 与 $(-2,1)$ 同向时取等，解得 $a=\frac{2}{5},\ b=\frac{1}{5}$，故最小值为 $\frac{1}{5}$，选 A。
