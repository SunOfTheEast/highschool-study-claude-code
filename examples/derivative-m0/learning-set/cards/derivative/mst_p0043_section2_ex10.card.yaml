stem: 若 $x>0$ 时，恒有 $x^2e^{3x}-(k+3)x-2\ln x-1\geqslant0$ 成立，则实数 $k$ 的取值范围是 ______。
answer: |
  $k\leqslant0$

  因 $x>0$，有 $x^2e^{3x}=e^{2\\ln x+3x}$。原式整理为
  $e^{2\\ln x+3x}-(2\\ln x+3x)-1-kx\\ge0$，即 $g(2\\ln x+3x)-kx\\ge0$，其中 $g(t)=e^t-t-1\\ge0$，等号当 $t=0$。方程 $2\\ln x+3x=0$ 在 $x>0$ 内有解 $x_0$，在该点不等式变为 $-kx_0\\ge0$，所以必要条件为 $k\\le0$；若 $k\\le0$，则 $g(2\\ln x+3x)\\ge0$ 且 $-kx\\ge0$，恒成立。故答案为 $k\\le0$。
