stem: |-
  （2024 · 哈尔滨期末）已知函数 $f(x)=\ln x+ax-\frac1x$，$g(x)=x\ln x+(a-1)x+\frac1x$。
  1. 讨论 $f(x)$ 的单调性。
  2. 当 $a>1$ 时，记 $f(x)$ 的零点为 $x_0$，$g(x)$ 的极小值点为 $x_1$，判断 $x_0$ 与 $x_1$ 的大小关系，并说明理由。
answer: |-
  第(1)问：$a\ge0$ 时 $f$ 在 $(0,+\infty)$ 上递增；$a<0$ 时，设 $\alpha=\frac{-1-\sqrt{1-4a}}{2a}>0$，$f$ 在 $(0,\alpha)$ 上递增，在 $(\alpha,+\infty)$ 上递减。第(2)问：$x_0>x_1$。

  第(1)问：$f^\prime(x)=\frac1x+a+\frac1{x^2} =\frac{ax^2+x+1}{x^2}$。若 $a\ge0$，则 $f^\prime>0$， $f$ 在正半轴递增。若 $a<0$，方程 $ax^2+x+1=0$ 只有一个正根 $\alpha=\frac{-1-\sqrt{1-4a}}{2a}$，所以 $f$ 在 $(0,\alpha)$ 上递增，在 $(\alpha,+\infty)$ 上递减。 第(2)问：当 $a>1$，$f$ 递增，且 $f(1)=a-1>0$，$f(\frac1{\sqrt a})=-\frac12\ln a<0$， 故唯一零点 $x_0\in(\frac1{\sqrt a},1)$。又 $g^\prime(x)=\ln x-\frac1{x^2}+a$ 严格递增， $g^\prime(1)>0$，$g^\prime(\frac1{\sqrt a})<0$， 所以极小值点 $x_1\in(\frac1{\sqrt a},1)$。由 $g^\prime(x_1)=0$ 得 $a=\frac1{x_1^2}-\ln x_1$，代入 $f(x_1)=\ln x_1+ax_1-\frac1{x_1} =(1-x_1)\ln x_1<0$。因为 $f(x_0)=0$ 且 $f$ 递增， 所以 $x_0>x_1$。另一种方法用 $x\ln x\ge x-1\ge\ln x$ 插值，构造 $h(x)=x\ln x+ax-\frac1x$，并取 $x_2=\frac{1+\sqrt{5+4a}}{2+2a}$，得到 $x_1\in(\frac1{\sqrt a},x_2)$、$x_0\in(x_2,1)$， 也得 $x_0>x_2>x_1$。
