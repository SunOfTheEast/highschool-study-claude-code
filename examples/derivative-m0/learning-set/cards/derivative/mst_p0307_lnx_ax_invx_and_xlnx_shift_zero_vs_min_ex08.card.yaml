original_problem:
  stem: （2024 · 哈尔滨期末）已知函数 $f(x)=\ln x+ax-\frac1x$，$g(x)=x\ln x+(a-1)x+\frac1x$。
  parts: *a1
  choices: []
  answer: 第(1)问：$a\ge0$ 时 $f$ 在 $(0,+\infty)$ 上递增；$a<0$ 时，设 $\alpha=\frac{-1-\sqrt{1-4a}}{2a}>0$，$f$ 在 $(0,\alpha)$ 上递增，在 $(\alpha,+\infty)$ 上递减。第(2)问：$x_0>x_1$。
  fidelity_notes:
    - 无选项。
    - 第(2)问源解给出两条路线：法一代回 $f(x_1)$；法二插值取点。
solution:
  source_solution_summary: 第(1)问：$f^\prime(x)=\frac1x+a+\frac1{x^2} =\frac{ax^2+x+1}{x^2}$。若 $a\ge0$，则 $f^\prime>0$， $f$ 在正半轴递增。若 $a<0$，方程 $ax^2+x+1=0$ 只有一个正根 $\alpha=\frac{-1-\sqrt{1-4a}}{2a}$，所以 $f$ 在 $(0,\alpha)$ 上递增，在 $(\alpha,+\infty)$ 上递减。 第(2)问：当 $a>1$，$f$ 递增，且 $f(1)=a-1>0$，$f(\frac1{\sqrt a})=-\frac12\ln a<0$， 故唯一零点 $x_0\in(\frac1{\sqrt a},1)$。又 $g^\prime(x)=\ln x-\frac1{x^2}+a$ 严格递增， $g^\prime(1)>0$，$g^\prime(\frac1{\sqrt a})<0$， 所以极小值点 $x_1\in(\frac1{\sqrt a},1)$。由 $g^\prime(x_1)=0$ 得 $a=\frac1{x_1^2}-\ln x_1$，代入 $f(x_1)=\ln x_1+ax_1-\frac1{x_1} =(1-x_1)\ln x_1<0$。因为 $f(x_0)=0$ 且 $f$ 递增， 所以 $x_0>x_1$。另一种方法用 $x\ln x\ge x-1\ge\ln x$ 插值，构造 $h(x)=x\ln x+ax-\frac1x$，并取 $x_2=\frac{1+\sqrt{5+4a}}{2+2a}$，得到 $x_1\in(\frac1{\sqrt a},x_2)$、$x_0\in(x_2,1)$， 也得 $x_0>x_2>x_1$。
  key_steps:
    - step_id: step_1
      statement: 讨论 $f$ 的单调性。
      formula_trace:
        from: $f(x)=\ln x+ax-\frac1x$
        to: $f^\prime(x)=\frac{ax^2+x+1}{x^2}$
        operation: 求导并把分母变成正量。
        why: 单调性只看二次分子 $ax^2+x+1$ 的符号。
      source_ref: page_0307_ex08_part1
    - step_id: step_2
      statement: 当 $a>1$ 时先定位 $x_0$。
      formula_trace:
        from: $f(1)=a-1>0,\quad f(\frac1{\sqrt a})=-\frac12\ln a<0$
        to: $x_0\in(\frac1{\sqrt a},1)$
        operation: 利用 $f$ 在正半轴递增和异号取点。
        why: 比较 $x_0,x_1$ 前先把两者放进同一区间。
      source_ref: page_0308_ex08_method1
    - step_id: step_3
      statement: 定位 $g$ 的极小值点 $x_1$。
      formula_trace:
        from: $g^\prime(x)=\ln x-\frac1{x^2}+a$
        to: $x_1\in(\frac1{\sqrt a},1)$
        operation: 证明 $g^\prime$ 递增，再用 $g^\prime(1)>0$ 与 $g^\prime(\frac1{\sqrt a})<0$。
        why: $x_1$ 是 $g^\prime$ 的唯一零点。
      source_ref: page_0308_ex08_method1
    - step_id: step_4
      statement: 把 $g^\prime(x_1)=0$ 代回 $f(x_1)$。
      formula_trace:
        from: $g^\prime(x_1)=\ln x_1-\frac1{x_1^2}+a=0$
        to: $f(x_1)=(1-x_1)\ln x_1<0$
        operation: 解出 $a=\frac1{x_1^2}-\ln x_1$ 并代入 $f(x_1)$。
        why: 只要 $f(x_1)<0=f(x_0)$，就能由 $f$ 递增推出 $x_1<x_0$。
      source_ref: page_0308_ex08_method1
    - step_id: step_5
      statement: 用插值法给出第二条路线。
      formula_trace:
        from: $x\ln x\ge x-1\ge\ln x$
        to: $x\ln x+ax-\frac1x\ge x-1+ax-\frac1x\ge f(x)$
        operation: 在 $x\ln x$ 与 $\ln x$ 之间插入 $x-1$。
        why: 插值函数的零点夹在 $x_1$ 与 $x_0$ 中间。
      source_ref: page_0308_ex08_method2
    - step_id: step_6
      statement: 取插值函数零点完成夹逼。
      formula_trace:
        from: $(a+1)x^2-x-1=0$
        to: $x_2=\frac{1+\sqrt{5+4a}}{2+2a},\quad x_1<x_2<x_0$
        operation: 取正根作为插值取点。
        why: 这给出 $x_0>x_1$ 的结构化解释。
      source_ref: page_0308_ex08_method2
teaching_card:
  student_title: 用插值函数比较零点和极小值点
  what_it_trains: 训练不同函数的隐点比较：先把两个隐点放到同一区间，再用代回或插值取点证明谁在左谁在右。
  recognition_cues:
    - 一个点来自 $f(x)=0$，另一个点来自 $g^\prime(x)=0$。
    - 两条方程都能整理出 $\frac1x-ax$。
    - 题目里同时出现 $\ln x$ 和 $x\ln x$。
    - $x\ln x\ge x-1\ge\ln x$ 是天然插值链。
  normalization_moves:
    - 第(1)问先把单调性讨论清楚，后面才可比较零点位置。
    - 法一不要硬解 $x_1$，只把 $g^\prime(x_1)=0$ 代回 $f(x_1)$。
    - 法二的核心是找中间函数，不是记忆根式。
    - 最终要证明的是 $x_1<x_0$，中间点 $x_2$ 只是桥。
  common_failures:
    - 把 $a<0$ 时的正根和负根混掉。
    - 把 $g$ 的极小值点误认为 $g$ 的零点。
    - 代回 $f(x_1)$ 时漏掉 $x_1$ 乘法。
    - 插值链方向写反。
    - 取 $x_2$ 时误取负根。
  similar_practice_query: 插值放缩 不同函数隐零点比较 xlnx lnx x-1 x0 x1
quality:
