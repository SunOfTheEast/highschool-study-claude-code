stem: |-
  已知函数 $f(x)=\frac{1}{2}x^2+m\ln(1-x)$，其中 $m\in\mathbf{R}$.
  1. 求函数 $f(x)$ 的单调区间。
  2. 若函数 $f(x)$ 存在两个极值点 $x_1,x_2$，且 $x_1<x_2$，证明：$\frac{1}{4}-\frac{1}{2}\ln2<\frac{f(x_1)}{x_2}<0$.
answer: |-
  第 (1) 问按 m 分类给出单调区间；第 (2) 问结论为 $\frac{1}{4}-\frac{1}{2}\ln2<\frac{f(x_1)}{x_2}<0$。

  先由定义域 x<1 和导数 $f'(x)=\frac{x^2-x+m}{x-1}$ 分类讨论单调性。若有两个极值点，则必须 $0<m<1/4$，且 $0<x_1<1/2<x_2<1$、$x_1+x_2=1$、$x_1x_2=m$。把 $f(x_1)/x_2$ 中的 $m$ 与 $1-x_1$ 分别替换为 $x_1x_2$ 与 $x_2$，再令 $t=x_2$，得到 $g(t)=\frac12(t+\frac1t-2)+(1-t)\ln t$。利用 $-\ln t>1-t$ 或等价的 $-\ln t>-(t-1)$ 证明 $g'(t)>0$，于是 $g(t)$ 夹在端点极限 $g(1/2)=1/4-1/2\ln2$ 与 $g(1)=0$ 之间。
