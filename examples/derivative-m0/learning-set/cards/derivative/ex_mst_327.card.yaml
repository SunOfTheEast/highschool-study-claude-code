  structure:
    primary: 极值点偏移结构
    secondary:
      - 对称结构
      - 非齐次结构
    evidence:
      - 两个极值点来自同一个二次方程 $x^2-x+m=0$。
      - 韦达关系给出 $x_1+x_2=1$，极值点关于 $1/2$ 对称。
      - 目标不是 $f(x_1)-f(x_2)$，而是 $f(x_1)/x_2$，需要比值归一化。
    normalization_moves_used:
      - 定义域先行：$x<1$ 使 $x-1<0$，导数符号与分子符号相反。
      - 韦达替参：$m=x_1x_2$，$x_1+x_2=1$。
      - 主元选择：取 $t=x_2\in(1/2,1)$，把 $x_1$ 改写为 $1-t$。
      - 对数端点化：$\ln(1-x_1)=\ln x_2=\ln t$。
      - 导数放缩：用 $\ln t<t-1$ 得 $g'(t)>0$。
  fallback:
    only_if_trace_shows:
      - 若学生忘记先写定义域 $x<1$，或因此把 $x-1<0$ 的导数符号看反，回补函数三要素与定义域。
      - 若学生不能根据 $f'(x)$ 的符号分类写出单调区间和两个极值点条件，回补导数单调极值基础。
      - 若学生不能从 $x^2-x+m=0$ 得到 $x_1+x_2=1$、$x_1x_2=m$，回补方程根分布与韦达。
      - 若学生不能把 $\ln(1-x_1)$ 借 $1-x_1=x_2$ 化为 $\ln x_2$，回补指数对数基础。
      - 若学生在 $\frac{f(x_1)}{x_2}$ 化成 $g(t)$ 的代数整理中断裂，回补代数恒等变形。
  detail_terms:
    - ln(1-x)
    - 两个极值点
    - x_1+x_2=1
    - x_1x_2=m
    - f(x_1)/x_2
    - t in (1/2,1)
    - ln t < t-1
