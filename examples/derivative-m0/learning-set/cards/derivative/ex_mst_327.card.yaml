      description: 将目标比值改写成只含 $x_2$ 的函数值。
      max_score: 1
    - step_id: step_5
      description: 构造 $g(t)$ 并证明它在开区间上递增。
      max_score: 1
    - step_id: step_6
      description: 由端点值得到严格夹逼。
      max_score: 1
