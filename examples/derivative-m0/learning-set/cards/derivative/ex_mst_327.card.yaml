      - part_id: "2"
        goal: 不等式证明
        notes: 证明含两个极值点的比值范围。
  method:
    primary: 对称化与偏移
    secondary:
      - 自由度与主元
      - 拟合与夹逼
    subroute:
      - 极值点方程韦达化
      - 用 x_1+x_2=1 将 ln(1-x_1) 变成 ln x_2
