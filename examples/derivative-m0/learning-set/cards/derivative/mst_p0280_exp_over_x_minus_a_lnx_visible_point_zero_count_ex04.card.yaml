stem: |-
  （2024 · 广州模拟）已知函数 $f(x)=\frac{e^x-a}{x}-a\ln x$。
  1. 若 $f(x)$ 在 $x=1$ 处取得极小值，求实数 $a$ 的取值范围。
  2. 讨论 $f(x)$ 的零点个数。
answer: |-
  (1) $a<e$；(2) 当 $a\le1$ 时无零点，当 $a>1$ 时只有一个零点。

  定义域为 $(0,+\infty)$，求导得 $f^\prime(x)=\frac{(x-1)(e^x-a)}{x^2}$。第(1)问看 $x=1$ 处导数是否从负到正： $a\le1$ 时符合；$1<a<e$ 时另一个驻点 $\ln a<1$，$x=1$ 仍为极小值； $a=e$ 时函数单调递增，不算在 $x=1$ 处取得极小值；$a>e$ 时 $x=1$ 变成极大值。 所以 $a<e$。第(2)问：$a\le1$ 时最小值 $f(1)=e-a>0$，无零点。 $1<a<e$ 时 $f(1)>0$、$f(\ln a)>0$，但靠近 0 有负值；source 用过 $(0,1)$ 与 $(\ln a,a)$ 的割线和小正点 $x=\left(\frac{a-1}{2e-1}\right)^2$ 证明左侧存在唯一零点。 $a=e$ 时单调递增且 $f(1)=0$，只有一个零点。$a>e$ 时两个极值都小于 0， 再取 $x=2\ln(4a)$ 证右侧出现正值，因此只在 $(\ln a,2\ln(4a))$ 有一个零点。
