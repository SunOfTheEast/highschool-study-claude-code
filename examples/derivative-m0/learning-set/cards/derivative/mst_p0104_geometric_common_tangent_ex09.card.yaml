solution:
  source_solution_summary: |
    令 $f(x)=e^x+2$，$g(x)=\ln(e^2x)=2+\ln x$。在 $x>0$ 上有
    $e^x>\ln x$，所以 $f(x)>g(x)$，两条曲线没有交点；同时 $f$ 上凸、
    $g$ 下凹，属于源页所说的外离型一凹一凸公切线模型，因此有两条内公切线。
    若用切点参数复核，设 $f$ 的切点横坐标为 $u$，则斜率 $k=e^u$；
    $g$ 的切点横坐标为 $v=e^{-u}$。两条切线截距相等给出
    $F(u)=1+u+(1-u)e^u=0$，且 $F'(u)=1-ue^u$，函数先增后减，
    结合两端符号可知有两个实根，所以有两个不同斜率。故选 C。
  key_steps:
    - step_id: step_1
      statement: 把第二条曲线化简，并判断两曲线相离。
      formula_trace:
        from: |
          $g(x)=\ln(e^2x)$
        to: |
          $g(x)=2+\ln x,\qquad f(x)-g(x)=e^x-\ln x>0\quad (x>0)$
        operation: 展开对数，再用 $e^x>\ln x$ 比较上下位置。
        why: 源页的公切线模型先看两曲线是否相交；相离才对应外离型两内公切线。
      source_ref: page_0104
    - step_id: step_2
      statement: 识别一凹一凸的外离型公切线模型。
      formula_trace:
        from: |
          $f''(x)=e^x>0,\qquad g''(x)=-\frac1{x^2}<0$
        to: |
          $f$ 与 $g$ 一凸一凹且无交点，类比外离圆弧，有两条内公切线
        operation: 用二阶导数确认凹凸性，再调用源页几何类比。
        why: 这正是 page_0104 顶部“外离型有两条内公切线”的应用。
      source_ref: page_0104
    - step_id: step_3
      statement: 用切点参数复核斜率个数。
      formula_trace:
        from: |
          $k=e^u=\frac1v,\quad b_f=2+e^u(1-u),\quad b_g=1+\ln v$
        to: |
          $v=e^{-u},\quad 2+e^u(1-u)=1-u,\quad F(u)=1+u+(1-u)e^u=0$
        operation: 分别写两条曲线在切点处的切线斜率和截距，并令它们相等。
        why: 公切线条数等价于切点参数方程的实根个数，且 $k=e^u$ 与 $u$ 一一对应。
      source_ref: page_0104
    - step_id: step_4
      statement: 判定参数方程有两个实根。
      formula_trace:
        from: |
          $F(u)=1+u+(1-u)e^u,\qquad F'(u)=1-ue^u$
        to: |
          $F$ 在 $(-\infty,W(1))$ 上递增、在 $(W(1),+\infty)$ 上递减；
          $F(u)\to-\infty\ (u\to-\infty),\ F(0)=2,\ F(u)\to-\infty\ (u\to+\infty)$
        operation: 用导数和端点符号数零点。
        why: 两个零点对应两条公切线，也对应两个不同的斜率 $k$。
      source_ref: page_0104
teaching_card:
  student_title: 看相离的一凸一凹曲线有几条公切线
  what_it_trains: 训练用曲线相对位置和凹凸性快速判断公切线条数，并能用切点参数方程复核图像结论。
  recognition_cues:
    - 题干问同一直线同时与指数曲线和对数曲线相切，本质是公切线计数。
    - $\ln(e^2x)$ 可先化成 $2+\ln x$，方便比较。
    - 一条曲线上凸、一条曲线下凹且相离，正对应源页外离型模型。
  normalization_moves:
    - 化简 $g(x)=2+\ln x$。
    - 用 $e^x-\ln x>0$ 判定两曲线无交点。
    - 用凹凸性和外离型模型得到两条公切线。
    - 必要时设切点参数，把截距相等化成 $F(u)=0$。
  common_failures:
    - 只看 $e^x$ 与 $\ln x$ 的增长速度，忘了两条曲线都平移了 2。
    - 把“相离”误读成没有公切线，漏掉内公切线模型。
    - 没有检查斜率是否不同，把两条公切线混成一条。
  similar_practice_query: 指数 对数 相离 一凹一凸 公切线条数
