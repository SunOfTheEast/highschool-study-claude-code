solution:
  source_solution_summary: 第(1)问：$f^{\prime}(x)=a-\frac1x=\frac{ax-1}{x}$。当 $a\le0$ 时， $f^{\prime}(x)<0$，故在 $(0,+\infty)$ 单调递减；当 $a>0$ 时， 在 $\left(0,\frac1a\right)$ 上 $f^{\prime}(x)<0$、在 $\left(\frac1a,+\infty\right)$ 上 $f^{\prime}(x)>0$，故先减后增。 第(2)问：$g(x)=e^2x-\ln x=e^2x-\ln(e^2x)+2\ge3$，当且仅当 $e^2x=1$ 取等，即 $x=\frac1{e^2}$，所以 $g_{\min}=3$。 第(3)问：设 $\varphi(x)=\frac{\ln x}{x}+\frac52$，在 $(0,e]$ 上 $\frac{\ln x}{x}\le\frac1e$，故 $\varphi(x)<\frac1e+\frac52<3$。结合第(2)问 $e^2x-\ln x\ge3$， 得 $e^2x-\ln x-\frac{\ln x}{x}>\frac52$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问先求导并按参数分段判号。
      formula_trace:
        from: $f(x)=ax-\ln x$
        to: $f^{\prime}(x)=a-\frac1x=\frac{ax-1}{x}$
        operation: 对 $\ln x$ 求导并通分。
        why: 单调区间由导数符号决定。
      source_ref: page_0203_solution
    - step_id: step_2
      statement: 第(1)问写出两类参数下的单调区间。
      formula_trace:
        from: $a\le0$ 或 $a>0$
        to: 单调递减区间/递增区间分段结论
        operation: 分别解 $f^{\prime}(x)>0$ 与 $f^{\prime}(x)<0$。
        why: 参数符号改变临界点是否落在定义域内。
      source_ref: page_0203_solution
    - step_id: step_3
      statement: 第(2)问同构改写并给出下界。
      formula_trace:
        from: $g(x)=e^2x-\ln x$
        to: $g(x)=e^2x-\ln(e^2x)+2\ge3$
        operation: 把 $\ln x$ 合并为 $\ln(e^2x)-2$，再用 $t-\ln t\ge1$。
        why: 直接得到最小值及取等点。
      source_ref: page_0203_solution
    - step_id: step_4
      statement: 第(3)问控制 $\frac{\ln x}{x}$ 的上界。
      formula_trace:
        from: $x\in(0,e]$
        to: $\frac{\ln x}{x}\le\frac1e$
        operation: 使用同构函数 $\frac{\ln x}{x}$ 在 $x=e$ 处取最大值。
        why: 把待证式拆成“第(2)问下界 - 可控上界”。
      source_ref: page_0203_solution
    - step_id: step_5
      statement: 联立步骤3与步骤4完成第(3)问。
      formula_trace:
        from: $e^2x-\ln x\ge3,\ \frac{\ln x}{x}+\frac52<3$
        to: $e^2x-\ln x-\frac{\ln x}{x}>\frac52$
        operation: 将两式相减。
        why: 得到严格不等式目标。
      source_ref: page_0203_solution
