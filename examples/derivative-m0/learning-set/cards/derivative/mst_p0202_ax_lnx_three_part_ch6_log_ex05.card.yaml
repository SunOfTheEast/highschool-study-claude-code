stem: |-
  （2024 · 青铜峡市模拟 T21）已知函数 $f(x)=ax-\ln x$，$a\in\mathbf R$。
  1. 求函数 $f(x)$ 的单调区间。
  2. 当 $x\in(0,e]$ 时，求 $g(x)=e^2x-\ln x$ 的最小值。
  3. 当 $x\in(0,e]$ 时，证明：$e^2x-\ln x-\frac{\ln x}{x}>\frac52$。
answer: |-
  (1) 当 $a\le0$ 时，$f(x)$ 在 $(0,+\infty)$ 上单调递减；当 $a>0$ 时， 递减区间为 $\left(0,\frac1a\right)$，递增区间为 $\left(\frac1a,+\infty\right)$。 (2) 最小值为 $3$（在 $x=\frac1{e^2}$ 处取到）。 (3) 对任意 $x\in(0,e]$，有 $e^2x-\ln x-\frac{\ln x}{x}>\frac52$。

  第(1)问：$f^{\prime}(x)=a-\frac1x=\frac{ax-1}{x}$。当 $a\le0$ 时， $f^{\prime}(x)<0$，故在 $(0,+\infty)$ 单调递减；当 $a>0$ 时， 在 $\left(0,\frac1a\right)$ 上 $f^{\prime}(x)<0$、在 $\left(\frac1a,+\infty\right)$ 上 $f^{\prime}(x)>0$，故先减后增。 第(2)问：$g(x)=e^2x-\ln x=e^2x-\ln(e^2x)+2\ge3$，当且仅当 $e^2x=1$ 取等，即 $x=\frac1{e^2}$，所以 $g_{\min}=3$。 第(3)问：设 $\varphi(x)=\frac{\ln x}{x}+\frac52$，在 $(0,e]$ 上 $\frac{\ln x}{x}\le\frac1e$，故 $\varphi(x)<\frac1e+\frac52<3$。结合第(2)问 $e^2x-\ln x\ge3$， 得 $e^2x-\ln x-\frac{\ln x}{x}>\frac52$。
