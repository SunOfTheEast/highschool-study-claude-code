stem: （2023 · 乙卷第三问）已知函数 $f(x)=\left(\frac1x+a\right)\ln(1+x)$。若 $f(x)$ 在 $(0,+\infty)$ 存在极值，求 $a$ 的取值范围。
answer: |-
  $a\in(0,\frac12)$。

  先求导并把分子设为辅助函数： $f^\prime(x)=\frac{-\ln(x+1)+\frac{ax^2+x}{x+1}}{x^2}=\frac{h(x)}{x^2}$， 其中 $h(x)=-\ln(x+1)+\frac{ax^2+x}{x+1}$， $h^\prime(x)=\frac{[ax+(2a-1)]x}{(x+1)^2}$。若 $a\ge\frac12$，则 $h$ 递增且 $h(0)=0$，所以 $h>0$，$f$ 单调递增； 若 $a\le0$，则 $h$ 递减或恒不正，$f$ 单调递减。若 $0<a<\frac12$，则 $h$ 先减后增，且 $h(0)=0$，最低点小于 0；又 $h(x)\sim ax-\ln x\to+\infty$，所以 $h$ 在右侧有唯一零点。于是 $f^\prime$ 由负变正，$f$ 在 $(0,+\infty)$ 存在极小值。故参数范围是 $(0,\frac12)$。
