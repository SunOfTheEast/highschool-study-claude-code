solution:
  source_solution_summary: |
    设 $f(x)=x^3-x+1$，则 $f^{\prime}(x)=3x^2-1$。由导数符号可知函数在 $(-\infty,-\frac{\sqrt3}{3})$ 和 $(\frac{\sqrt3}{3},+\infty)$ 上递增，在 $(-\frac{\sqrt3}{3},\frac{\sqrt3}{3})$ 上递减；又 $f(-2)<0$、$f(-1)>0$，并结合极值点处函数值为正，可知唯一实根 $r\in(-2,-1)$，A 正确。从 $x_0=-1$ 出发，第一条切线给 $x_1=-\frac32$；在 $x_1$ 处 $f^{\prime}(-\frac32)=\frac{23}{4}$、$f(-\frac32)=-\frac78$，切线化为 $23x-4y+31=0$，B 正确。再令该切线 $y=0$ 得 $x_2=-\frac{31}{23}$；按正确导数继续算可得 $|x_3-x_2|<\frac18$，所以 C 错误。一般切点 $(x_n,x_n^3-x_n+1)$ 的切线令 $y=0$，化简得 $x_{n+1}=\frac{2x_n^3-1}{3x_n^2-1}$，D 正确。故选 ABD。
  key_steps:
    - step_id: step_1
      statement: 求导并划分 $f(x)=x^3-x+1$ 的单调区间。
      formula_trace:
        from: |
          $f(x)=x^3-x+1$
        to: |
          $f^{\prime}(x)=3x^2-1$
        operation: 对三次函数逐项求导。
        why: 判断根所在区间前，先要知道函数在各区间的增减性。
      source_ref: page_0083
    - step_id: step_2
      statement: 由导数符号确定增减区间。
      formula_trace:
        from: |
          $3x^2-1>0\iff x\in(-\infty,-\frac{\sqrt3}{3})\cup(\frac{\sqrt3}{3},+\infty)$
        to: |
          增区间为 $(-\infty,-\frac{\sqrt3}{3})$、$(\frac{\sqrt3}{3},+\infty)$，
          减区间为 $(-\frac{\sqrt3}{3},\frac{\sqrt3}{3})$
        operation: 解 $f^{\prime}(x)$ 的正负并翻译成单调性。
        why: 这能排除额外实根，并支持 A 选项的根区间判断。
      source_ref: page_0083
    - step_id: step_3
      statement: 用符号变化和极值点函数值判断根区间。
      formula_trace:
        from: |
          $f(-2)=-5<0,\quad f(-1)=1>0,\quad
          f(\frac{\sqrt3}{3})=\frac{\sqrt3}{9}-\frac{\sqrt3}{3}+1>0$
        to: |
          $r\in(-2,-1)$
        operation: 在 $(-2,-1)$ 上用零点存在性确定有根，并结合右侧极小值仍为正排除其他根。
        why: 三次函数在 $(-\infty,-\frac{\sqrt3}{3})$ 上递增且跨过 $0$，后续区间没有再跨过 $0$。
      source_ref: page_0083
    - step_id: step_4
      statement: 从 $x_0=-1$ 作第一条切线并求 $x_1$。
      formula_trace:
        from: |
          $f(-1)=1,\quad f^{\prime}(-1)=2$
        to: |
          $y=2(x+1)+1,\quad y=0\Rightarrow x_1=-\frac32$
        operation: 写出 $x_0=-1$ 处切线，令纵坐标为 $0$ 求交点横坐标。
        why: 牛顿迭代中第一条切线与 $x$ 轴交点给 $x_1$。
      source_ref: page_0084
    - step_id: step_5
      statement: 在 $x_1=-\frac32$ 处写第二条切线。
      formula_trace:
        from: |
          $f^{\prime}(-\frac32)=\frac{23}{4},\quad f(-\frac32)=-\frac78$
        to: |
          $y=\frac{23}{4}(x+\frac32)-\frac78$
        operation: 把切点坐标和斜率代入点斜式。
        why: $l_2$ 是过 $(x_1,f(x_1))$ 的曲线切线。
      source_ref: page_0084
    - step_id: step_6
      statement: 把 $l_2$ 化为选项中的一般式。
      formula_trace:
        from: |
          $y=\frac{23}{4}(x+\frac32)-\frac78$
        to: |
          $4y=23x+31,\quad 23x-4y+31=0$
        operation: 两边乘 $4$ 并移项。
        why: 所得方程与选项 B 完全一致。
      source_ref: page_0084
    - step_id: step_7
      statement: 由第二条切线交点求 $x_2$。
      formula_trace:
        from: |
          $23x-4y+31=0$
        to: |
          $y=0\Rightarrow x_2=-\frac{31}{23}$
        operation: 令切线纵坐标为 $0$。
        why: $x_2$ 是 $l_2$ 与 $x$ 轴交点的横坐标。
      source_ref: page_0084
    - step_id: step_8
      statement: 用正确导数继续计算 $x_3$ 并判断 C。
      formula_trace:
        from: |
          $x_2=-\frac{31}{23},\quad
          f^{\prime}(-\frac{31}{23})=\frac{2354}{529},\quad
          f(-\frac{31}{23})=-\frac{1225}{12167}$
        to: |
          $x_3=x_2-\frac{f(x_2)}{f^{\prime}(x_2)}
          =-\frac{71749}{54142}$
        operation: 把 $x_2$ 代入牛顿公式并约分前保留精确分数。
        why: 判断 $|x_3-x_2|$ 需要第三次近似值；此处按正确导数修正源页斜率印刷错误。
      source_ref: page_0084
    - step_id: step_9
      statement: 比较 $|x_3-x_2|$ 与 $\frac18$。
      formula_trace:
        from: |
          $x_3=-\frac{71749}{54142},\quad x_2=-\frac{31}{23}$
        to: |
          $|x_3-x_2|=\frac{1225}{54142}<\frac18$
        operation: 通分相减并与 $\frac18$ 交叉相乘比较。
        why: $8\cdot1225=9800<54142$，所以 C 中“大于 $\frac18$”错误。
      source_ref: page_0084
    - step_id: step_10
      statement: 从一般切点推出牛顿迭代递推式。
      formula_trace:
        from: |
          $(x_n,x_n^3-x_n+1),\quad k=3x_n^2-1$
        to: |
          $y=(3x_n^2-1)(x-x_n)+x_n^3-x_n+1$
        operation: 用导数作为切线斜率，写出切点处的点斜式切线。
        why: 递推式来自第 $n+1$ 条切线与 $x$ 轴的交点。
      source_ref: page_0084
    - step_id: step_11
      statement: 令 $y=0$ 化简出 D 选项。
      formula_trace:
        from: |
          $0=(3x_n^2-1)(x_{n+1}-x_n)+x_n^3-x_n+1$
        to: |
          $x_{n+1}=x_n-\frac{x_n^3-x_n+1}{3x_n^2-1}
          =\frac{2x_n^3-1}{3x_n^2-1}$
        operation: 解出 $x_{n+1}$，再通分合并分子。
        why: 这正是选项 D 给出的牛顿迭代通式。
      source_ref: page_0084
teaching_card:
  student_title: 把三次方程的牛顿迭代算成递推式
  what_it_trains: 训练在具体三次函数上连续写切线、求交点、比较迭代差，同时用导数单调性确认根所在区间。
  recognition_cues:
    - 题干指定 $x_0=-1$，说明前几项可以直接按切线公式算。
    - 选项 B 给出 $l_2$，要先求 $x_1$，再在 $x_1$ 处写切线。
    - 选项 C 比较 $|x_3-x_2|$，必须继续求到第三个迭代点。
    - 选项 D 要求通式，不能只代具体数字，要保留 $x_n$。
  normalization_moves:
    - 先求 $f^{\prime}(x)=3x^2-1$，用它同时服务单调性和切线斜率。
    - 每一步切线都按“切点坐标 + 斜率”写点斜式。
    - 令 $y=0$ 得交点横坐标，再命名为下一次近似值。
    - 通式推导中把 $x_n-\frac{x_n^3-x_n+1}{3x_n^2-1}$ 通分成选项形式。
  common_failures:
    - 把 $l_2$ 误写成在 $x_0$ 处的第一条切线。
    - 求 $f(-\frac32)$ 时符号出错，导致 $l_2$ 常数项不对。
    - 看到源页 C 解析中的斜率印刷不一致后直接照抄，造成 $x_3$ 与导数不相容。
    - 推 D 时漏掉分母 $3x_n^2-1$ 不能为零这一隐含前提。
  similar_practice_query: 牛顿迭代 三次方程 x^3-x+1 切线方程 递推式 相邻迭代差
