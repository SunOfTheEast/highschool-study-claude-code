stem: |-
  （2023 芜湖五月质检·多选 T11）牛顿在《流数法》一书中，给出了高次代数方程根的一种解法。具体步骤如下：设 $r$ 是函数 $y=f(x)$ 的一个零点，任意选取 $x_0$ 作为 $r$ 的初始近似值，过点 $(x_0,f(x_0))$ 作曲线 $y=f(x)$ 的切线 $l_1$，设 $l_1$ 与 $x$ 轴交点的横坐标为 $x_1$，并称 $x_1$ 为 $r$ 的 1 次近似值；过点 $(x_1,f(x_1))$ 作曲线 $y=f(x)$ 的切线 $l_2$，设 $l_2$ 与 $x$ 轴交点的横坐标为 $x_2$，称 $x_2$ 为 $r$ 的 2 次近似值。一般地，过点 $(x_n,f(x_n))(n\in\mathbf{N}^*)$ 作曲线 $y=f(x)$ 的切线 $l_{n+1}$，记 $l_{n+1}$ 与 $x$ 轴交点的横坐标为 $x_{n+1}$，并称 $x_{n+1}$ 为 $r$ 的 $n+1$ 次近似值。对于方程 $x^3-x+1=0$，记方程的根为 $r$，取初始近似值为 $x_0=-1$，下列说法正确的是 (  )

  A. $r\in(-2,-1)$
  B. $l_2:23x-4y+31=0$
  C. $|x_3-x_2|>\frac18$
  D. $x_{n+1}=\frac{2x_n^3-1}{3x_n^2-1}$
answer: |
  ABD

  设 $f(x)=x^3-x+1$，则 $f^{\prime}(x)=3x^2-1$。由导数符号可知函数在 $(-\infty,-\frac{\sqrt3}{3})$ 和 $(\frac{\sqrt3}{3},+\infty)$ 上递增，在 $(-\frac{\sqrt3}{3},\frac{\sqrt3}{3})$ 上递减；又 $f(-2)<0$、$f(-1)>0$，并结合极值点处函数值为正，可知唯一实根 $r\in(-2,-1)$，A 正确。从 $x_0=-1$ 出发，第一条切线给 $x_1=-\frac32$；在 $x_1$ 处 $f^{\prime}(-\frac32)=\frac{23}{4}$、$f(-\frac32)=-\frac78$，切线化为 $23x-4y+31=0$，B 正确。再令该切线 $y=0$ 得 $x_2=-\frac{31}{23}$；按正确导数继续算可得 $|x_3-x_2|<\frac18$，所以 C 错误。一般切点 $(x_n,x_n^3-x_n+1)$ 的切线令 $y=0$，化简得 $x_{n+1}=\frac{2x_n^3-1}{3x_n^2-1}$，D 正确。故选 ABD。
