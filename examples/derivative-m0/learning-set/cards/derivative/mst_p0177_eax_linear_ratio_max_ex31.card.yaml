solution:
  source_solution_summary: 由恒成立条件得 $e^{ax}\geqslant2x+b$ 对任意实数成立，令 $t=ax$，转为 $e^t\geqslant\frac{2}{a}t+b$。源解法一把 $e^t=e^{t-\ln\frac{2}{a}}\cdot\frac{2}{a}$ 与 $e^u\geqslant u+1$ 配合，得到可取上界 $b\leqslant\frac{2}{a}\left(1-\ln\frac{2}{a}\right)$，进而 $\frac{b}{ea}\leqslant\frac{1}{4}$。法二用 $\frac{e^{2t}}{2t}\geqslant e$ 与基本不等式同样推出 $\frac{b}{ea}\leqslant\frac{1}{4}$。当 $t=\frac{1}{2},a=\frac{2}{\sqrt e},b=\frac{\sqrt e}{2}$ 取等，所以最大值为 $\frac{1}{4}$，选 A。
  key_steps:
    - step_id: step_1
      statement: 把“对任意 $x$ 恒成立”改写成单变量含参直线比较。
      formula_trace:
        from: $e^{ax}-2x-b\geqslant0,\ \forall x\in\mathbf{R}$
        to: $e^t\geqslant\frac{2}{a}t+b,\ \forall t\in\mathbf{R}$
        operation: 令 $t=ax$（隐含 $a>0$）。
        why: 把参数放到斜率与截距，便于用切线或最值模板压上界。
      source_ref: page_0177:lines 28-29
    - step_id: step_2
      statement: 用指数函数切线不等式给出 $b$ 的可达上界。
      formula_trace:
        from: $e^u\geqslant u+1$
        to: $b\leqslant\frac{2}{a}\left(1-\ln\frac{2}{a}\right)$
        operation: 取 $u=t-\ln\frac{2}{a}$，化为 $e^t\geqslant\frac{2}{a}t+\frac{2}{a}\!\left(1-\ln\frac{2}{a}\right)$。
        why: 同斜率直线下，切线给出最大允许截距。
      source_ref: page_0177:line 30
    - step_id: step_3
      statement: 把目标比值写成标准 $\ln z/z$ 形并取上界。
      formula_trace:
        from: $\frac{b}{ea}\leqslant\frac{2}{ea^2}\ln\frac{ea}{2}$
        to: $\frac{b}{ea}\leqslant\frac{1}{4}$
        operation: 令 $z=\frac{e^2a^2}{4}>0$，用 $\frac{\ln z}{z}\leqslant\frac{1}{e}$。
        why: 把含参最值转成单峰标准函数最值。
      source_ref: page_0177:line 30
    - step_id: step_4
      statement: 用法二核验并给出等号条件。
      formula_trace:
        from: $e^t\geqslant\frac{2}{a}t+b$
        to: $\frac{b}{ea}\leqslant\frac{1}{4}$
        operation: 用基本不等式与 $\min_{t>0}\frac{e^{2t}}{2t}=e$，并在 $t=\frac{1}{2},a=\frac{2}{\sqrt e},b=\frac{\sqrt e}{2}$ 取等。
        why: 确认上界可达，得到最大值。
      source_ref: page_0177:line 32
teaching_card:
  student_title: 同斜率切线截距上界
  what_it_trains: 训练把含参恒成立不等式转成“指数曲线与直线”的全局比较，再用切线模板锁定可达最值。
  recognition_cues:
    - 出现 $e^{ax}$ 与一次项并要求“解集为 $\mathbf{R}$”。
    - 目标是含参比值 $\frac{b}{ea}$ 的最大值。
    - 源解显式给出“令 $ax=t$”。
  normalization_moves:
    - 先做 $t=ax$ 把参数集中。
    - 匹配 $e^u\geqslant u+1$ 求最大截距。
    - 把比值改写为 $\ln z/z$ 结构求上界。
    - 最后核验等号点保证“最大值”可取。
  common_failures:
    - 把 $b$ 的上界误写成等式条件，漏掉“先上界后取等”的逻辑。
    - 忽略 $a$ 的取值约束，导致换元域判断混乱。
    - 算出上界后未检查是否可达。
  similar_practice_query: e^{ax}-mx-b 恒成立 参变分离 切线截距 最值
