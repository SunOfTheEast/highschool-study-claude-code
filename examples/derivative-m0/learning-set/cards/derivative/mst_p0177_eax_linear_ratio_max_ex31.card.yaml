stem: |-
  （2024 · 先铁一中月考 T12）关于 $x$ 的不等式 $e^{ax}-2x-b\geqslant0$ 的解集为 $\mathbf{R}$，则 $\frac{b}{ea}$ 的最大值是（  ）
  A. $\frac{1}{4}$
  B. $\frac{e^2-6}{3e}$
  C. $\frac{e-1}{2e}$
  D. $\frac{e+2}{5e}$
answer: |-
  A

  由恒成立条件得 $e^{ax}\geqslant2x+b$ 对任意实数成立，令 $t=ax$，转为 $e^t\geqslant\frac{2}{a}t+b$。源解法一把 $e^t=e^{t-\ln\frac{2}{a}}\cdot\frac{2}{a}$ 与 $e^u\geqslant u+1$ 配合，得到可取上界 $b\leqslant\frac{2}{a}\left(1-\ln\frac{2}{a}\right)$，进而 $\frac{b}{ea}\leqslant\frac{1}{4}$。法二用 $\frac{e^{2t}}{2t}\geqslant e$ 与基本不等式同样推出 $\frac{b}{ea}\leqslant\frac{1}{4}$。当 $t=\frac{1}{2},a=\frac{2}{\sqrt e},b=\frac{\sqrt e}{2}$ 取等，所以最大值为 $\frac{1}{4}$，选 A。
