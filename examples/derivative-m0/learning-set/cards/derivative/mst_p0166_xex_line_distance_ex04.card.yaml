stem: |-
  （2024 · 山东临沂一中考前模拟 T5）若 x, y ∈ R，则 sqrt((x-y)^2+(xe^x-y+1)^2) 的最小值为（  ）
  A. sqrt(2)/2
  B. sqrt(2)
  C. 1/2
  D. sqrt(2)/e
answer: |-
  A

  设 A(x,xe^x) 在曲线 y=xe^x 上，B(y,y-1) 在直线 y=x-1 上，则题设根式就是 |AB|。 要使曲线点到直线距离最小，曲线在最近点处切线与直线平行。对 f(x)=xe^x 有 f^{\prime}(x)=(x+1)e^x，令 f^{\prime}(x)=1 得 x=0， 切点是 (0,0)，该处切线为 y=x。于是最小距离是平行线 y=x 与 y=x-1 的距离 d=|1|/sqrt(2)=sqrt(2)/2，故选 A。
