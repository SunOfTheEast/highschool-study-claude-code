solution:
  source_solution_summary: 设 A(x,xe^x) 在曲线 y=xe^x 上，B(y,y-1) 在直线 y=x-1 上，则题设根式就是 |AB|。 要使曲线点到直线距离最小，曲线在最近点处切线与直线平行。对 f(x)=xe^x 有 f^{\prime}(x)=(x+1)e^x，令 f^{\prime}(x)=1 得 x=0， 切点是 (0,0)，该处切线为 y=x。于是最小距离是平行线 y=x 与 y=x-1 的距离 d=|1|/sqrt(2)=sqrt(2)/2，故选 A。
  key_steps:
    - step_id: step_1
      statement: 把根式表达式改写成两点距离。
      formula_trace:
        from: sqrt((x-y)^2+(xe^x-y+1)^2)
        to: 曲线 y=xe^x 上点 A 与直线 y=x-1 上点 B 的距离 |AB|
        operation: 把两项分别识别为横纵坐标差。
        why: 目标从代数最小值转成几何最短距离。
      source_ref: page_0166:line 23
    - step_id: step_2
      statement: 用平行切线条件定位最近点。
      formula_trace:
        from: f(x)=xe^x, 目标直线斜率为 1
        to: f^{\prime}(x)=(x+1)e^x=1 => x=0
        operation: 令曲线切线斜率等于目标直线斜率。
        why: 曲线到直线最短距离点的切线与该直线平行。
      source_ref: page_0166:line 23
    - step_id: step_3
      statement: 计算两条平行线之间的距离。
      formula_trace:
        from: 切线 y=x 与直线 y=x-1
        to: d=|1|/sqrt(2)=sqrt(2)/2
        operation: 用平行线距离公式。
        why: 该距离就是题设表达式的最小值。
      source_ref: page_0166:line 23
teaching_card:
  student_title: 把根式最小值改写成点到直线最短距离
  what_it_trains: 训练把二元根式最小值转成几何距离问题，再用“最近点切线平行于目标直线” 快速锁定切点并收尾计算。
  recognition_cues:
    - 表达式是 sqrt((Δx)^2+(Δy)^2) 形式。
    - 其中一部分可识别为曲线 y=xe^x，另一部分可识别为直线 y=x-1。
    - 题目问最小值，适合平行切线路线。
  normalization_moves:
    - 先把代数式翻译成曲线点到直线点的距离。
    - 令 f^{\prime}(x)=1 找最近点。
    - 算两条平行线 y=x 与 y=x-1 的距离。
  common_failures:
    - 直接对二元式硬求极值，忽略距离几何意义。
    - 把 y=xe^x 误看成 y=e^x 导致切点错误。
    - 距离公式分母忘记除以 sqrt(2)。
  similar_practice_query: xe^x 到 y=x-1 最短距离 平行切线 点到直线距离
