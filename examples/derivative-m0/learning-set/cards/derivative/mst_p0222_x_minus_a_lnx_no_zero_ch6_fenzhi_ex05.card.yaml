stem: |-
  （2019 · 雅安三诊 T21）设函数 $f(x)=x-a\ln x$，其中 $e$ 为自然对数的底数。
  1. 若 $a=1$，求 $f(x)$ 的单调区间。
  2. 若 $g(x)=f(x)-x+e^{x-1}$，$0\leqslant a\leqslant e$，求证：$g(x)$ 无零点。
answer: |-
  （1）$f(x)$ 在 $(0,1)$ 上单调递减，在 $(1,+\infty)$ 上单调递增；（2）证明见解析，$g(x)>0$，故无零点。

  若 $a=1$，$f(x)=x-\ln x$， $f^{\prime}(x)=1-\frac1x=\frac{x-1}{x}$，故 $f$ 在 $(0,1)$ 单调递减，在 $(1,+\infty)$ 单调递增。第二问 $g(x)=f(x)-x+e^{x-1}=e^{x-1}-a\ln x$。要证明 $g$ 无零点，只需证 $e^{x-1}>a\ln x$ 恒成立。对 $x>0$，转成 $\frac{e^{x-1}}x>a\frac{\ln x}{x}$。左侧 $\frac{e^{x-1}}x=\frac1e\frac{e^x}{x}\geqslant1$，在 $x=1$ 取等； 右侧 $a\frac{\ln x}{x}\leqslant a/e\leqslant1$，在 $x=e$ 取最大。 即使 $a=e$，两侧取等点也不一致，故严格大于，$g(x)>0$，无零点。
