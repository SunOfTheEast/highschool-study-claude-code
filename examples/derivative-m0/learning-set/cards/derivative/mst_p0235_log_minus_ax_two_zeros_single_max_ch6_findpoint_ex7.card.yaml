stem: 当 $0<a<\frac1e$ 时，讨论函数 $f(x)=\ln x-ax$ 的零点个数。
answer: |-
  $f(x)$ 有两个零点，且可取 $x_1\in(1,\frac1a)$、$x_2\in(\frac1a,\frac1{a^2})$。

  $f'(x)=\frac1x-a$，所以 $f$ 在 $(0,1/a)$ 上递增，在 $(1/a,+\infty)$ 上递减，最大值为 $f(1/a)=\ln(1/a)-1$。当 $0<a<1/e$ 时最大值为正，故有两个零点。 左侧由 $f(1)=-a<0$ 与 $f(1/a)>0$ 得 $x_1\in(1,1/a)$。右侧需要取 $m>1/a$ 使 $f(m)<0$，用等效零点 $f(x)=\sqrt{x}(\frac{\ln x}{\sqrt{x}}-a\sqrt{x})$，并由 $\frac{\ln x}{\sqrt{x}}\leqslant2/e$ 得 $f(x)<\sqrt{x}(\frac2e-a\sqrt{x})$。先取 $m=\frac4{a^2e^2}$，再取整为 $m=\frac1{a^2}$，得到 $x_2\in(1/a,1/a^2)$。
