solution:
  source_solution_summary: 第一问中 $x>0$，令 $t=x+\ln x$，则 $f(x)=e^t-t\ge1$（即 $e^t-t-1\ge0$），故最小值为 $1$，当 $x+\ln x=0$ 取到。第二问令 $u=x-\ln x$，则 $g(x)=e^u-u$。又由 $\ln x\le x-1$ 得 $u\ge1$，并且 $\phi(u)=e^u-u-1$ 在 $u\ge1$ 上递增，因此 $g(x)\ge e-1$，当 $u=1$（即 $x-\ln x=1$）时取等，最小值为 $e-1$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问先做同构换元。
      formula_trace:
        from: $f(x)=xe^x-x-\ln x$
        to: $f(x)=e^{x+\ln x}-(x+\ln x)$
        operation: 把 $xe^x$ 写成 $e^{x+\ln x}$，统一成 $e^t-t$ 结构。
        why: 直接套用指数切线模板的最小值结论。
      source_ref: page_0200_ex01_solution
    - step_id: step_2
      statement: 第(1)问调用 $e^t-t\ge1$ 得最小值。
      formula_trace:
        from: $f(x)=e^t-t,\ t=x+\ln x\in\mathbf{R}$
        to: $f(x)\ge1$
        operation: 应用 $e^t-t-1\ge0$，并由 $x+\ln x=0$ 给取等。
        why: 得到第一问数值答案。
      source_ref: page_0200_ex01_solution
    - step_id: step_3
      statement: 第(2)问继续同构并锁定定义域下界。
      formula_trace:
        from: $g(x)=\frac{e^x}{x}-x+\ln x$
        to: $g(x)=e^{x-\ln x}-(x-\ln x),\ x-\ln x\ge1$
        operation: 把 $\frac{e^x}{x}$ 写成 $e^{x-\ln x}$，再用 $\ln x\le x-1$。
        why: 把第二问转成“$u\ge1$ 上的 $e^u-u$ 最小值”。
      source_ref: page_0200_ex01_solution
    - step_id: step_4
      statement: 第(2)问在 $u\ge1$ 上判最小值。
      formula_trace:
        from: $\phi(u)=e^u-u-1,\ u\ge1$
        to: $g(x)\ge e-1$
        operation: 用 $\phi^{\prime}(u)=e^u-1>0$ 判递增，最小值在 $u=1$。
        why: 得到第二问数值答案。
      source_ref: page_0200_ex01_solution
teaching_card:
  student_title: 两问同构到 $e^t-t$ 求最小值
  what_it_trains: 训练把指数与对数混合式改写成同一个模板，再按变量范围读最小值。
  recognition_cues:
    - 题干里同时出现 $xe^x$、$\frac{e^x}{x}$ 与 $\ln x$。
    - 目标是“最小值”，且式子可重写成 $e^{(\cdot)}-(\cdot)$。
    - 一问在全实变量上取最小，一问有额外下界条件。
  normalization_moves:
    - 先把乘除结构写成指数加减：$xe^x\to e^{x+\ln x}$。
    - 统一识别模板：$e^t-t$。
    - 第二问先证 $x-\ln x\ge1$ 再取最小。
  common_failures:
    - 把定义域 $x>0$ 漏掉，导致换元范围写错。
    - 第二问只写 $e^u-u\ge1$，忽略了 $u\ge1$ 的更强下界。
    - 取等条件只写结论，不写 $x+\ln x=0$ 或 $x-\ln x=1$。
  similar_practice_query: xe^x lnx 最小值 同构 e^t-t x-lnx>=1
