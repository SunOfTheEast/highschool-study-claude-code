stem: |-
  （2024 · 利哥每日一题）求下列函数的最小值。
  1. 函数 $f(x)=xe^x-x-\ln x$ 的最小值。
  2. 函数 $g(x)=\frac{e^x}{x}-x+\ln x$ 的最小值。
answer: |-
  （1）最小值为 $1$；（2）最小值为 $e-1$。

  第一问中 $x>0$，令 $t=x+\ln x$，则 $f(x)=e^t-t\ge1$（即 $e^t-t-1\ge0$），故最小值为 $1$，当 $x+\ln x=0$ 取到。第二问令 $u=x-\ln x$，则 $g(x)=e^u-u$。又由 $\ln x\le x-1$ 得 $u\ge1$，并且 $\phi(u)=e^u-u-1$ 在 $u\ge1$ 上递增，因此 $g(x)\ge e-1$，当 $u=1$（即 $x-\ln x=1$）时取等，最小值为 $e-1$。
