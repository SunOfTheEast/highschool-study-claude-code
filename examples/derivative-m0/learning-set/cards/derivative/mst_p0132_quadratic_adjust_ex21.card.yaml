teaching_card:
  student_title: 加一个 $x^2$，把题目变成增函数比较
  what_it_trains: 训练“补项构造单调函数”的稳定套路，并把复杂不等式压缩成线性自变量比较。
  recognition_cues:
    - 已知里出现 $f^{\prime}(x)+$ 线性项。
    - 待求式里出现 $f(\text{线性式})$ 的对比。
  normalization_moves:
    - 识别并设 $g=f+x^2$。
    - 把原式左右配成 $g(2x-1),g(1-x)$。
    - 由 $g$ 递增直接比较 $2x-1$ 与 $1-x$。
  common_failures:
    - 把 $3x^2$ 误配成 $x^2+(1-x)^2$。
    - 忘记 $g$ 在全实数上递增。
    - 最后把严格不等式误写成含端点。
  similar_practice_query: 抽象函数 补项构造 单调性 g(2x-1)>g(1-x) 解集
