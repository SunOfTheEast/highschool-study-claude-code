    \]
  key_steps:
    - step_id: step_1
      statement: 先把已知导数不等式识别成“某函数导数大于0”。
      formula_trace:
        from: $f^{\prime}(x)+2x>0$
        to: $[f(x)+x^2]^{\prime}>0$
        operation: 观察并补出 $x^2$ 的导数项。
        why: 为构造全局单调函数做准备。
      source_ref: page_0132
    - step_id: step_2
      statement: 把原式改写成 $g$ 在两个点的函数值比较。
      formula_trace:
        from: $f(2x-1)+3x^2>f(1-x)+2x$
        to: $g(2x-1)>g(1-x)$
        operation: 分别配成 $(2x-1)^2$ 与 $(1-x)^2$。
