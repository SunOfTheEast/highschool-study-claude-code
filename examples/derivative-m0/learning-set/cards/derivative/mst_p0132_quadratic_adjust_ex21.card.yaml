stem: （2023·怀仁市期中）已知函数 $f(x)$ 的导函数 $f^{\prime}(x)$ 满足 $f^{\prime}(x)+2x>0$ 在 $\mathbf{R}$ 上恒成立，则不等式 $f(2x-1)+3x^2>f(1-x)+2x$ 的解集是______。
answer: |
  $(\frac{2}{3},+\infty)$

  因为
  \[
  f^{\prime}(x)+2x=[f(x)+x^2]^{\prime}>0,
  \]
  令
  \[
  g(x)=f(x)+x^2,
  \]
  则 $g(x)$ 在 $\mathbf{R}$ 上单调递增。
  原不等式
  \[
  f(2x-1)+3x^2>f(1-x)+2x
  \]
  可改写为
  \[
  f(2x-1)+(2x-1)^2>f(1-x)+(1-x)^2,
  \]
  即
  \[
  g(2x-1)>g(1-x).
  \]
  由 $g$ 递增可得
  \[
  2x-1>1-x.
  \]
  解得
  \[
  x>\frac{2}{3}.
  \]
  故解集为
  \[
  \left(\frac{2}{3},+\infty\right).
  \]
