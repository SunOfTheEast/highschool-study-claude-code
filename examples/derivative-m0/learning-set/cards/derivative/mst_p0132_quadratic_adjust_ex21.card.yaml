solution:
  source_solution_summary: |
    因为
    \[
    f^{\prime}(x)+2x=[f(x)+x^2]^{\prime}>0,
    \]
    令
    \[
    g(x)=f(x)+x^2,
    \]
    则 $g(x)$ 在 $\mathbf{R}$ 上单调递增。
    原不等式
    \[
    f(2x-1)+3x^2>f(1-x)+2x
    \]
    可改写为
    \[
    f(2x-1)+(2x-1)^2>f(1-x)+(1-x)^2,
    \]
    即
    \[
    g(2x-1)>g(1-x).
    \]
    由 $g$ 递增可得
    \[
    2x-1>1-x.
    \]
    解得
    \[
    x>\frac{2}{3}.
    \]
    故解集为
    \[
