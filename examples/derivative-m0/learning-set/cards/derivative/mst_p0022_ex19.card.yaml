stem: |-
  （河北省衡水中学 2024 高三三调 T12）函数 $f(x)=\frac{e^x}{x}-m(x>0)$，$g(x)=\frac{x}{\ln x}-m(x>1)$， 则 (  )
  A. 若函数 $f(x) \geqslant 0$ 恒成立，则 $m \leqslant 1$
  B. 若函数 $g(x)$ 有两个不同的零点，记为 $x_1$，$x_2$，则 $x_1+x_2 > 2e$
  C. 若函数 $f(x)$ 和 $g(x)$ 共有两个不同的零点，则 $m=e$
  D. 若函数 $f(x)$ 和 $g(x)$ 共有三个不同的零点，记为 $x_1$，$x_2$，$x_3$，且 $x_1 < x_2 < x_3$，则 $x_1 \cdot x_3 = x_2^2$
answer: |-
  BCD

  令 $h(x)=e^x/x$、$\varphi(x)=x/\ln x$。A 中 $f(x)\ge0$ 恒成立应得到 $m\le h_{\min}=e$，不是 $m\le1$。B 中若 $\varphi(x)=m$ 有两根， 则 $m>e$，由 $x_i=m\ln x_i$ 得 $m=(x_2-x_1)/(\ln x_2-\ln x_1)<(x_1+x_2)/2$，所以 $x_1+x_2>2e$。C 用两条曲线相同最小值 $e$ 判断。D 用 $h(x)=\varphi(e^x)$ 推出 $e^{x_1}=x_2$、$e^{x_2}=x_3$，再由 $h(x_1)=\varphi(x_3)$ 得 $x_1x_3=x_2^2$。
