stem: （2024 衡阳县四中高三期中考试 T14）“以直代曲”是微积分中最基本、最朴素的数学思想方法。 在切点附近，用曲线在该点处的切线近似代替曲线就是这一思想的典型应用。 曲线 $y=\ln x$ 在 $(1,0)$ 处的切线方程为_______，已知 $|\\sqrt[2024]{e}-1|<0.0005$，利用上述“切线近似代替曲线”的思想计算 $\\sqrt[2024]{e}$ 所得的结果为_______。（结果用分数表示）
answer: |-
  $y=x-1$；$\frac{2025}{2024}$

  对 $y=\ln x$ 求导得 $y'=1/x$，在 $(1,0)$ 处斜率为 1，因此切线为 $y=x-1$。因为 $\sqrt[2024]{e}$ 与 1 很接近，在 $x=1$ 附近可取 $\ln x\approx x-1$。令 $x=\sqrt[2024]{e}=e^{1/2024}$，则 $1/2024=\ln x\approx x-1$，所以 $x\approx1+1/2024=2025/2024$。
