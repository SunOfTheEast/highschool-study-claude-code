stem: |-
  （重庆市沙坪坝区第七中学校 2024 届高三上学期 12 月月考 T8）已知函数 $f(x)=\frac{\ln x}{x}$，$g(x)=\frac{x}{e^x}$，若存在 $x_1 \in (0, +\infty)$，$x_2 \in \mathbf{R}$，使得 $f(x_1)=g(x_2)=k(k<0)$ 成立，则下列结论正确的是 (  )
  A. $x_1+x_2 > 1$
  B. $\ln(-x_2)=-x_1$
  C. $\left(\frac{x_2}{x_1}\right)^2 \cdot e^k$ 的最大值为 $\frac{4}{e^2}$
  D. $\left(\frac{x_2}{x_1}\right)^2 \cdot e^k$ 的最大值为 $\frac{1}{e^2}$
answer: |-
  C

  把 $\frac{\ln x_1}{x_1}$ 写成 $\ln x_1\cdot e^{-\ln x_1}$， 与 $x_2e^{-x_2}$ 同构；由 $k<0$ 得 $\ln x_1=x_2$。于是 $\frac{x_2}{x_1}=k$，目标量化为 $k^2e^k=4((k/2)e^{k/2})^2$， 用 $xe^x$ 在负半轴的最小值推出最大值为 $4/e^2$，并排除 A、B、D。
rubric:
  max_score: 3
  criteria:
    - step_id: step_1
      description: 把两个等值条件统一到 $u e^{-u}$，确定 $x_2=\ln x_1$。
      max_score: 1
