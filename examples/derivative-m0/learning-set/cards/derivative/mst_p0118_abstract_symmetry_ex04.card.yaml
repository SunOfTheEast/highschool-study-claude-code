solution:
  source_solution_summary: |
    由 $y=f(x+1)$ 是奇函数，得
    $f(x+1)=-f(-x+1)$，即 $f$ 关于点 $(1,0)$ 中心对称，
    所以 A 说的 $(-1,0)$ 错误。对
    $f(-x+1)=-f(x+1)$ 求导，
    得 $f'(-x+1)=f'(x+1)$，故 $f'(x)$
    图象关于直线 $x=1$ 对称，B 正确。
    又 $g'(x)=\cos(\pi x)$，
    积分得 $g(x)=\frac{1}{\pi}\sin(\pi x)+C$，
    其对称轴为 $x=\frac12+k$，故 C 正确。
    源页按 $f,g$ 交点关于 $(1,0)$ 对称配对求和，
    得 $\sum_{i=1}^{m}(x_i+y_i)=m$，D 正确。
    故选 BCD。
  key_steps:
    - step_id: step_1
      statement: 由 $f(x+1)$ 奇性确定 $f$ 的对称中心，先判 A。
      formula_trace:
        from: $f(x+1)=-f(-x+1)$
        to: $f(x)$ 关于点 $(1,0)$ 中心对称
        operation: 把“平移后的奇函数”还原到原函数图象。
        why: 对称中心是 $(1,0)$ 而不是 $(-1,0)$，A 必错。
      source_ref: page_0118
    - step_id: step_2
      statement: 对对称关系求导，判 B。
      formula_trace:
        from: $f(-x+1)=-f(x+1)$
        to: $-f'(-x+1)=-f'(x+1)\\Rightarrow f'(-x+1)=f'(x+1)$
        operation: 链式求导并整理。
        why: $f'(x)$ 关于 $x=1$ 轴对称，B 正确。
      source_ref: page_0118
    - step_id: step_3
      statement: 由 $g'(x)$ 反推 $g(x)$ 的对称轴，判 C。
      formula_trace:
        from: $g'(x)=\\cos(\\pi x)$
        to: $g(x)=\\frac{1}{\\pi}\\sin(\\pi x)+C$，对称轴 $x=\\frac12+k$
        operation: 积分并读取正弦函数轴对称位置。
        why: $x=\\frac12$ 是其一条对称轴，C 正确。
      source_ref: page_0118
    - step_id: step_4
      statement: 利用交点成对对称求和，判 D。
      formula_trace:
        from: $\\{(x_i,y_i)\\}$ 关于 $(1,0)$ 配对
        to: $\\sum x_i=\\frac m2\\cdot2=m,\\ \\sum y_i=0\\Rightarrow \\sum(x_i+y_i)=m$
        operation: 把对称点配对后分别求横纵坐标和。
        why: 配对后每组横坐标和为 2、纵坐标和为 0。
      source_ref: page_0118
teaching_card:
  student_title: 平移奇函数先还原，再用导数读对称
  what_it_trains: 训练从“平移后的奇偶性”还原原函数对称中心，再与导函数、交点和式联动判定多选。
  recognition_cues:
    - 出现 $f(x+a)$ 奇偶性，通常先把图象平移还原。
    - 题目把 $f$ 与 $f'$、$g'$、交点求和放在一起，核心是同一套对称信息复用。
    - 含三角导数关系时，优先识别原函数的对称轴/中心。
  normalization_moves:
    - 先定 $f$ 的中心 $(1,0)$。
    - 再对函数关系求导判 $f'$ 的轴对称。
    - 由 $g'$ 积分得到 $g$ 的正弦型轴对称。
    - 交点按中心对称配对，拆分和式。
  common_failures:
    - 把 $(x+1)$ 的平移量方向看反，误判成 $(-1,0)$。
    - 链式求导时漏掉 $-x+1$ 的负号。
    - 只写出 $g(x)$ 形式，不继续读对称轴位置。
    - 求和时不配对，直接逐项硬算。
  similar_practice_query: 抽象函数 平移奇函数 导函数对称 交点和式 多选
