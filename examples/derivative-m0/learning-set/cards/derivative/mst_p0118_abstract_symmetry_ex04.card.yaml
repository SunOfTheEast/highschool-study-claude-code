stem: |-
  （2025 · 长沙市一中月考）已知函数 $f(x)$，$g(x)$ 的定义域均为 $\\mathbf{R}$，它们的导函数分别为 $f'(x)$，$g'(x)$。若 $y=f(x+1)$ 是奇函数，$g'(x)=\\cos(\\pi x)$，$f(x)$ 与 $g(x)$ 图象的交点为 $(x_1, y_1)$，$(x_2, y_2)$，$\\cdots$，$(x_m, y_m)$，则（  ）
  A. $f(x)$ 的图象关于点 $(-1,0)$ 对称
  B. $f'(x)$ 的图象关于直线 $x=1$ 对称
  C. $g(x)$ 的图象关于直线 $x=\\frac{1}{2}$ 对称
  D. $\\sum_{i=1}^{m}(x_i+y_i)=m$
answer: |
  BCD

  由 $y=f(x+1)$ 是奇函数，得
  $f(x+1)=-f(-x+1)$，即 $f$ 关于点 $(1,0)$ 中心对称，
  所以 A 说的 $(-1,0)$ 错误。对
  $f(-x+1)=-f(x+1)$ 求导，
  得 $f'(-x+1)=f'(x+1)$，故 $f'(x)$
  图象关于直线 $x=1$ 对称，B 正确。
  又 $g'(x)=\cos(\pi x)$，
  积分得 $g(x)=\frac{1}{\pi}\sin(\pi x)+C$，
  其对称轴为 $x=\frac12+k$，故 C 正确。
  源页按 $f,g$ 交点关于 $(1,0)$ 对称配对求和，
  得 $\sum_{i=1}^{m}(x_i+y_i)=m$，D 正确。
  故选 BCD。
