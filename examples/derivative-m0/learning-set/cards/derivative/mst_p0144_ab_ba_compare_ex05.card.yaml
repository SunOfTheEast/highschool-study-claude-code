stem: |-
  （20-21高三下·河北衡水·阶段练习）已知函数 $f(x)=e^x\ln|x|$，$a=f(-\ln3)$，$b=f(\ln3)$，$c=f(3^e)$，$d=f(e^3)$，则 $a,b,c,d$ 的大小顺序为（  ）
  A. $a>b>c>d$
  B. $d>c>b>a$
  C. $c>d>b>a$
  D. $c>d>a>b$
answer: |
  B

  先代入定义：
  $a=e^{-\ln3}\ln(\ln3)=\frac{\ln(\ln3)}3$，
  $b=e^{\ln3}\ln(\ln3)=3\ln(\ln3)$，
  所以 $a<b$。再看
  $f(x)=e^x\ln|x|$ 在 $(0,+\infty)$ 上递增，
  且 $\ln3<3^e,e^3$，故在 $b,c,d$ 里 $b$ 最小。
  只需比 $c,d$：
  $c=f(3^e)$ 与 $d=f(e^3)$ 的底层比较可化为
  $e\ln3$ 与 $3\ln e$，再化为
  $\frac{\ln3}{3}$ 与 $\frac{\ln e}{e}$。
  由同构函数 $\ln x/x$ 在 $x>e$ 递减，得
  $\frac{\ln3}{3}<\frac1e$，即 $e^3>3^e$，
  从而 $d>c$。综上 $d>c>b>a$，选 B。
