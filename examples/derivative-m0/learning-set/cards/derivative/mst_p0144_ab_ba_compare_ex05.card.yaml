solution:
  source_solution_summary: |
    先代入定义：
    $a=e^{-\ln3}\ln(\ln3)=\frac{\ln(\ln3)}3$，
    $b=e^{\ln3}\ln(\ln3)=3\ln(\ln3)$，
    所以 $a<b$。再看
    $f(x)=e^x\ln|x|$ 在 $(0,+\infty)$ 上递增，
    且 $\ln3<3^e,e^3$，故在 $b,c,d$ 里 $b$ 最小。
    只需比 $c,d$：
    $c=f(3^e)$ 与 $d=f(e^3)$ 的底层比较可化为
    $e\ln3$ 与 $3\ln e$，再化为
    $\frac{\ln3}{3}$ 与 $\frac{\ln e}{e}$。
    由同构函数 $\ln x/x$ 在 $x>e$ 递减，得
    $\frac{\ln3}{3}<\frac1e$，即 $e^3>3^e$，
    从而 $d>c$。综上 $d>c>b>a$，选 B。
  key_steps:
    - step_id: step_1
      statement: 先把 $a,b$ 直接化简。
      formula_trace:
        from: $a=f(-\ln3),\ b=f(\ln3)$
        to: $a=\frac{\ln(\ln3)}3,\ b=3\ln(\ln3),\ a<b$
        operation: 按定义代入 $f(x)=e^x\ln|x|$ 并整理系数。
        why: 先固定一对明显可比的量。
      source_ref: page_0144_ex05_solution
    - step_id: step_2
      statement: 用单调性定位 $b$。
      formula_trace:
        from: $f(x)$ 在 $(0,+\infty)$ 递增
        to: $\ln3<3^e,e^3\Rightarrow b=f(\ln3)<f(3^e),f(e^3)$
        operation: 比较三个输入点的大小并用递增函数保序。
        why: 得到 $b$ 在 $b,c,d$ 中最小。
      source_ref: page_0144_ex05_solution
    - step_id: step_3
      statement: 把 $c$ 与 $d$ 转成指数比较。
      formula_trace:
        from: $c=f(3^e),\ d=f(e^3)$
        to: 比较 $3^e$ 与 $e^3$，等价比较 $e\ln3$ 与 $3\ln e$
        operation: 对指数式取对数并提取系数。
        why: 把“大数幂比较”转成同构函数值比较。
      source_ref: page_0144_ex05_solution
    - step_id: step_4
      statement: 使用 $\ln x/x$ 判定 $3^e$ 与 $e^3$。
      formula_trace:
        from: $e\ln3\ ?\ 3\ln e$
        to: $\frac{\ln3}{3}<\frac{\ln e}{e}=\frac1e\Rightarrow e^3>3^e$
        operation: 改写为 $\ln x/x$ 在 $x=3,e$ 的函数值比较。
        why: 得到 $d=f(e^3)>f(3^e)=c$。
      source_ref: page_0144_ex05_solution
    - step_id: step_5
      statement: 汇总全序。
      formula_trace:
        from: $a<b,\ b<c,\ d>c$
        to: $d>c>b>a$
        operation: 合并各子比较结论。
        why: 对应选项 B。
      source_ref: page_0144_ex05_solution
teaching_card:
  student_title: 先分层，再同构
  what_it_trains: 训练“四元比较先拆层”的执行习惯：先用直代得到一组关系，再用函数单调性压出最小元，最后把剩余难点交给同构函数。
  recognition_cues:
    - 同一函数 $f(\cdot)$ 作用在四个不同输入。
    - 出现 $3^e$、$e^3$ 这类经典互换指数。
    - 选项是完整全序，不需要求具体数值。
  normalization_moves:
    - 先算 $a,b$，别一上来四个量混比。
    - 把 $b,c,d$ 放回 $f$ 的输入点比较。
    - 单独处理 $3^e$ 与 $e^3$。
  common_failures:
    - 把 $a,b$ 的系数 $3$ 与 $1/3$ 写反。
    - 忘记先用递增性定位 $b$，导致比较路径过长。
    - 只记口诀不写出 $\ln x/x$ 的依据链。
  similar_practice_query: 四元大小比较 同构函数lnx/x 3^e和e^3
