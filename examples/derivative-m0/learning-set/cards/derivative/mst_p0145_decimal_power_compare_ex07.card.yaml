stem: |-
  （2023·浙江期中）记 $a=0.2^{0.1}$，$b=0.1^{0.2}$，$c=(\sqrt2)^{-0.5}$，则（  ）
  A. $a>b>c$
  B. $b>c>a$
  C. $a>c>b$
  D. $c>a>b$
answer: |
  C

  把三项统一到 $0.1$ 次幂：
  $a=0.2^{0.1}$，
  $b=0.1^{0.2}=(0.1^2)^{0.1}=0.01^{0.1}$，
  $c=(\sqrt2)^{-0.5}=[(\sqrt2)^{-5}]^{0.1}=(\frac{\sqrt2}{8})^{0.1}$。
  因为 $x^{0.1}$ 在 $(0,+\infty)$ 上递增，
  只比真数：
  $0.2>\frac{\sqrt2}{8}>0.01$，
  所以 $a>c>b$，选 C。
  源页法二用“大指小底”先得 $a>b$，再把 $c$ 化成
  $(\\frac{\\sqrt2}{8})^{0.1}$ 与 $a,b$ 一起比较，结论同样是 $a>c>b$。
