solution:
  source_solution_summary: |
    把三项统一到 $0.1$ 次幂：
    $a=0.2^{0.1}$，
    $b=0.1^{0.2}=(0.1^2)^{0.1}=0.01^{0.1}$，
    $c=(\sqrt2)^{-0.5}=[(\sqrt2)^{-5}]^{0.1}=(\frac{\sqrt2}{8})^{0.1}$。
    因为 $x^{0.1}$ 在 $(0,+\infty)$ 上递增，
    只比真数：
    $0.2>\frac{\sqrt2}{8}>0.01$，
    所以 $a>c>b$，选 C。
    源页法二用“大指小底”先得 $a>b$，再把 $c$ 化成
    $(\\frac{\\sqrt2}{8})^{0.1}$ 与 $a,b$ 一起比较，结论同样是 $a>c>b$。
  key_steps:
    - step_id: step_1
      statement: 统一幂指数。
      formula_trace:
        from: $a=0.2^{0.1},\ b=0.1^{0.2},\ c=(\sqrt2)^{-0.5}$
        to: $a=0.2^{0.1},\ b=0.01^{0.1},\ c=(\frac{\sqrt2}{8})^{0.1}$
        operation: $b$ 写成 $(0.1^2)^{0.1}$，$c$ 写成 $[(\sqrt2)^{-5}]^{0.1}$。
        why: 化为同一幂函数后可直接比较真数。
      source_ref: page_0145_ex07_solution
    - step_id: step_2
      statement: 调用同幂函数的递增性。
      formula_trace:
        from: $y=x^{0.1}$ 在 $(0,+\infty)$ 递增
        to: 比较 $0.2,\ \frac{\sqrt2}{8},\ 0.01$
        operation: 将输出比较转为输入比较。
        why: 避免直接算小数幂值。
      source_ref: page_0145_ex07_solution
    - step_id: step_3
      statement: 比较三个真数。
      formula_trace:
        from: $0.2=\frac15,\ \frac{\sqrt2}{8},\ 0.01=\frac1{100}$
        to: $0.2>\frac{\sqrt2}{8}>0.01$
        operation: 数值估计：$\sqrt2\approx1.414$，故 $\sqrt2/8\approx0.1768$。
        why: 推出函数值次序 $a>c>b$。
      source_ref: page_0145_ex07_solution
    - step_id: step_4
      statement: 对应选项。
      formula_trace:
        from: $a>c>b$
        to: 选 C
        operation: 与选项逐一匹配。
        why: 完成作答。
      source_ref: page_0145_ex07_solution
teaching_card:
  student_title: 幂比较先统一指数
  what_it_trains: 训练“遇到分散指数先同幂化”的标准动作，把复杂幂式比较降成直观的真数比较。
  recognition_cues:
    - 指数里有 $0.1,0.2,-0.5$ 等不统一小数。
    - 出现根号和负指数，适合先去负号再统一幂。
    - 选项是纯顺序判断。
  normalization_moves:
    - 先把每项都写成 $\cdot^{0.1}$。
    - 再比较括号内数值，不急着算幂。
    - 用递增性一次性回推。
  common_failures:
    - 把 $(\sqrt2)^{-0.5}$ 误写成 $(\sqrt2/2)^{0.1}$ 等错误形式。
    - 认为底数小于1会改变同幂比较方向（这是同底比较才会发生）。
    - 真数比较时把 $\sqrt2/8$ 的数量级估错。
  similar_practice_query: 小数幂比较 同幂化 根号负指数 0.1次幂
