original_problem:
  stem: （2023 · 广州模拟）设函数 $f(x)=\frac{x+1}{e^x}+ax^2$，其中 $a\in\mathbf{R}$。
  parts: *a1
  choices: []
  answer: 当存在两个极值点时，$x_0-x_1\ge\ln2$；等号情形来自 source 的 $a=\frac{e^2}{4}$、$x_1=-2$。
  fidelity_notes:
    - 无选项。
    - source 的左侧取点证明存在错误，已替换为极限 + 导数结构证明。
solution:
  source_solution_summary: 先求导：$f^\prime(x)=\frac{x}{e^x}(2ae^x-1)$。当 $a\le0$ 时， $f$ 在 $(-\infty,0)$ 增、$(0,+\infty)$ 减。当 $a>0$ 时， 另一个驻点为 $\ln\frac1{2a}$：$a=\frac12$ 时全域增； $0<a<\frac12$ 时 $x_0=0$ 是极大值点； $a>\frac12$ 时 $x_0=\ln\frac1{2a}$ 是极大值点。 第(2)问需要先知道零点 $x_1<-1$。source 用取点 $x=-1-\frac ae$ 来证明这一点，但该取点不成立；改用 $f(-\infty)=-\infty$、$f(-1)=a>0$ 和导数结构说明左侧唯一零点在 $-1$ 左侧。 若 $0<a<\frac12$，$x_0=0$，于是 $x_0-x_1>1>\ln2$。 若 $a>\frac12$，$x_0=\ln\frac1{2a}$，要证 $x_1\le\ln\frac1{4a}$； source 法一计算 $f(\ln\frac1{4a})=a(\ln\frac1{4a}+2)^2\ge0$， 法二由 $f(x_1)=0$ 和 $2ae^{x_0}=1$ 化为 $e^{x_0-x_1}=-\frac{x_1^2}{2(x_1+1)}\ge2$，即 $(x_1+2)^2\ge0$。
  key_steps:
    - step_id: step_1
      statement: 求导并找驻点。
      formula_trace:
        from: $f(x)=\frac{x+1}{e^x}+ax^2$
        to: $f^\prime(x)=\frac{x}{e^x}(2ae^x-1)$
        operation: 求导并提取 $x/e^x$。
        why: 极值点只可能是 $x=0$ 和 $x=\ln\frac1{2a}$。
      source_ref: page_0281_ex05_solution_start
    - step_id: step_2
      statement: 按 $a$ 讨论单调性。
      formula_trace:
        from: $x=0,\quad x=\ln\frac1{2a}$
        to: $a\le0$、$0<a<\frac12$、$a=\frac12$、$a>\frac12$
        operation: 比较 $\ln\frac1{2a}$ 与 0 的位置。
        why: 两个极值点存在当且仅当 $a>0$ 且 $a\ne\frac12$。
      source_ref: page_0282_ex05_monotonicity_and_gap
    - step_id: step_3
      statement: 定位零点 $x_1$ 在 $-1$ 左侧。
      formula_trace:
        from: $f(-\infty)=-\infty,\quad f(-1)=a>0$
        to: $x_1<-1$
        operation: 用连续性和导数结构定位左侧唯一零点，替换 source 的错误取点。
        why: 后续 $x_0-x_1$ 的下界需要先知道零点在 $-1$ 左侧。
      source_ref: page_0282_ex05_monotonicity_and_gap
    - step_id: step_4
      statement: 当 $0<a<\frac12$，极大值点是 $0$。
      formula_trace:
        from: $x_0=0,\quad x_1<-1$
        to: $x_0-x_1>1>\ln2$
        operation: 直接比较距离。
        why: 这一段不需要复杂代数，只靠零点位置。
      source_ref: page_0282_ex05_monotonicity_and_gap
    - step_id: step_5
      statement: 当 $a>\frac12$，用中间点锁定零点左界。
      formula_trace:
        from: $x_0=\ln\frac1{2a}$
        to: $f\left(\ln\frac1{4a}\right)=a\left(\ln\frac1{4a}+2\right)^2\ge0$
        operation: 在目标距离对应的位置代入函数。
        why: 若该点函数值非负，唯一左零点就在它左侧，从而 $x_0-x_1\ge\ln2$。
      source_ref: page_0282_ex05_monotonicity_and_gap
    - step_id: step_6
      statement: 法二把距离不等式化成平方恒成立。
      formula_trace:
        from: $f(x_1)=0,\quad 2ae^{x_0}=1$
        to: $e^{x_0-x_1}=-\frac{x_1^2}{2(x_1+1)}\ge2\Longleftrightarrow (x_1+2)^2\ge0$
        operation: 消去参数 $a$，把指数距离转成零点代数式。
        why: 这是 source 给出的第二条证明路线，等号对应 $x_1=-2$。
      source_ref: page_0283_ex05_closure
teaching_card:
  student_title: 用极值点和零点的位置证明距离不小于 $\\ln2$
  what_it_trains: 训练把“极大值点到零点的距离”转成一个可代入验证的位置，再用零点方程把参数消掉。
  recognition_cues:
    - 题目给了极大值点 $x_0$ 和零点 $x_1$，目标是两者距离。
    - 导数分解出 $x$ 和 $e^x-\frac1{2a}$，两个极值点位置明确。
    - $a>\frac12$ 时目标点自然变成 $\ln\frac1{4a}$。
    - 法二里 $f(x_1)=0$ 和 $2ae^{x_0}=1$ 可以消掉 $a$。
  normalization_moves:
    - 先判断什么时候有两个极值点。
    - 先确认零点 $x_1$ 在 $-1$ 左边。
    - $0<a<\frac12$ 直接用 $x_0=0$。
    - $a>\frac12$ 用 $\ln\frac1{4a}$ 或零点方程消参。
  common_failures:
    - 没有先证明两个极值点存在的参数范围。
    - 把 $x_0$ 在两个参数段的位置弄反。
    - 不知道为什么要看 $\ln\frac1{4a}$。
    - 消参时忘记 $x_1+1<0$，导致不等式方向混乱。
    - 直接沿用 source 的 $x=-1-\frac ae$ 取点，可能得到错误的负值判断。
  similar_practice_query: 极值点 零点 距离 x0-x1 ln2 (x+1)/e^x + ax^2
quality:
  confidence: high
