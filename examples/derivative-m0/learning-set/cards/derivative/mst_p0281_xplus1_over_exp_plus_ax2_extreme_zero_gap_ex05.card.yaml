stem: |-
  （2023 · 广州模拟）设函数 $f(x)=\frac{x+1}{e^x}+ax^2$，其中 $a\in\mathbf{R}$。
  1. 讨论 $f(x)$ 的单调性。
  2. 若 $f(x)$ 存在两个极值点，设极大值点为 $x_0$，$x_1$ 为 $f(x)$ 的零点，求证：$x_0-x_1\ge\ln2$。
answer: |-
  当存在两个极值点时，$x_0-x_1\ge\ln2$；等号情形来自 source 的 $a=\frac{e^2}{4}$、$x_1=-2$。

  先求导：$f^\prime(x)=\frac{x}{e^x}(2ae^x-1)$。当 $a\le0$ 时， $f$ 在 $(-\infty,0)$ 增、$(0,+\infty)$ 减。当 $a>0$ 时， 另一个驻点为 $\ln\frac1{2a}$：$a=\frac12$ 时全域增； $0<a<\frac12$ 时 $x_0=0$ 是极大值点； $a>\frac12$ 时 $x_0=\ln\frac1{2a}$ 是极大值点。 第(2)问需要先知道零点 $x_1<-1$。source 用取点 $x=-1-\frac ae$ 来证明这一点，但该取点不成立；改用 $f(-\infty)=-\infty$、$f(-1)=a>0$ 和导数结构说明左侧唯一零点在 $-1$ 左侧。 若 $0<a<\frac12$，$x_0=0$，于是 $x_0-x_1>1>\ln2$。 若 $a>\frac12$，$x_0=\ln\frac1{2a}$，要证 $x_1\le\ln\frac1{4a}$； source 法一计算 $f(\ln\frac1{4a})=a(\ln\frac1{4a}+2)^2\ge0$， 法二由 $f(x_1)=0$ 和 $2ae^{x_0}=1$ 化为 $e^{x_0-x_1}=-\frac{x_1^2}{2(x_1+1)}\ge2$，即 $(x_1+2)^2\ge0$。
