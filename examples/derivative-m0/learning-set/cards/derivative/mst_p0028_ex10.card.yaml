    evidence:
      - $xe^x-x-\ln x=f(x+\ln x)$。
      - $x^{a-1}-(a-1)\ln x=f((a-1)\ln x)$。
      - 最终范围由 $x/\ln x$ 的最小值控制。
    normalization_moves_used:
      - 把 $(a-2)\ln x$ 拆配成左侧 $-\ln x$ 与右侧 $-(a-1)\ln x$。
      - 用 $e^{x+\ln x}=xe^x$ 配出 $f(x+\ln x)$。
      - 用 $x^{a-1}=e^{(a-1)\ln x}$ 配出 $f((a-1)\ln x)$。
      - 由 $x>(a-2)\ln x$ 化为 $a-2<x/\ln x$。
  fallback:
    only_if_trace_shows:
      - 若学生看不出 $xe^x=e^{x+\ln x}$，回补指数对数基础。
      - 若学生不能把 $x^{a-1}$ 写成 $e^{(a-1)\ln x}$，回补指数对数基础。
      - 若学生不会用 $f'(u)=e^u-1$ 判断 $f(u)=e^u-u$ 在 $u>0$ 递增，回补导数单调极值基础。
      - 若学生把严格不等式误写成 $a\le e+2$，回补不等式工具基础。
