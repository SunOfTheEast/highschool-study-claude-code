stem: (2024 湖北武汉高二月考 T14) 若 $a>1$, 不等式 $xe^x-x+(a-2)\ln x-x^{a-1}>0$ 在 $(1,+\infty)$ 上恒成立，则实数 $a$ 的取值范围是______.
answer: |-
  $(1,e+2)$

  设 $f(u)=e^u-u$，在 $u>0$ 上递增。原不等式等价于 $xe^x-x-\ln x>x^{a-1}-(a-1)\ln x$，即 $f(x+\ln x)>f((a-1)\ln x)$。因为 $x>1$、$a>1$ 时两个输入均为正，由 $f$ 递增得 $x+\ln x>(a-1)\ln x$，也就是 $x>(a-2)\ln x$。再化为 $a-2<x/\ln x$ 对任意 $x>1$ 成立，而 $x/\ln x$ 在 $x=e$ 处取最小值 $e$，故 $a-2<e$。结合 $a>1$，得 $a\in(1,e+2)$。
rubric:
  max_score: 4
  criteria:
    - step_id: step_1
      description: 把原不等式整理成两个 $f(u)=e^u-u$ 的比较。
      max_score: 1
    - step_id: step_2
      description: 识别同构函数的两个输入。
      max_score: 1
    - step_id: step_3
      description: 由单调性得到参数不等式。
      max_score: 1
    - step_id: step_4
      description: 取 $x/\ln x$ 的最小值确定范围。
      max_score: 1
