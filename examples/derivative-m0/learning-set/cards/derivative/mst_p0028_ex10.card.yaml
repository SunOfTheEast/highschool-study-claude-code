original_problem:
  stem: (2024 湖北武汉高二月考 T14) 若 $a>1$, 不等式 $xe^x-x+(a-2)\ln x-x^{a-1}>0$ 在 $(1,+\infty)$ 上恒成立，则实数 $a$ 的取值范围是______.
  parts: *a1
  choices: []
  answer: $(1,e+2)$
  fidelity_notes:
    - page_0028.png 已核对：题干为严格大于 $0$，区间为 $(1,+\infty)$，前置条件为 $a>1$。
solution:
  source_solution_summary: 设 $f(u)=e^u-u$，在 $u>0$ 上递增。原不等式等价于 $xe^x-x-\ln x>x^{a-1}-(a-1)\ln x$，即 $f(x+\ln x)>f((a-1)\ln x)$。因为 $x>1$、$a>1$ 时两个输入均为正，由 $f$ 递增得 $x+\ln x>(a-1)\ln x$，也就是 $x>(a-2)\ln x$。再化为 $a-2<x/\ln x$ 对任意 $x>1$ 成立，而 $x/\ln x$ 在 $x=e$ 处取最小值 $e$，故 $a-2<e$。结合 $a>1$，得 $a\in(1,e+2)$。
  key_steps:
    - step_id: step_1
      statement: 把原不等式整理成两个 $f(u)=e^u-u$ 的比较。
      formula_trace:
        from: $xe^x-x+(a-2)\ln x-x^{a-1}>0
        to: $xe^x-x-\ln x>x^{a-1}-(a-1)\ln x
        operation: 把 $x^{a-1}$ 移到右侧，并从左侧的 $(a-2)\ln x$ 中拆出 $-\ln x$，右侧对应拆出 $-(a-1)\ln x$。
        why: 这样左右两边分别可以写成 $f(x+\ln x)$ 与 $f(\ln x^{a-1})$。
      source_ref: page_0028_ex10_solution
    - step_id: step_2
      statement: 识别同构函数的两个输入。
      formula_trace:
        from: $xe^x-x-\ln x>x^{a-1}-(a-1)\ln x
        to: $f(x+\ln x)>f(\ln x^{a-1})
        operation: 用 $e^{x+\ln x}=xe^x$，以及 $e^{\ln x^{a-1}}=x^{a-1}$、$\ln x^{a-1}=(a-1)\ln x$。
        why: $f(u)=e^u-u$ 在正区间递增，可把函数值比较降为输入比较。
      source_ref: page_0028_ex10_solution
    - step_id: step_3
      statement: 由单调性得到参数不等式。
      formula_trace:
        from: $f(x+\ln x)>f((a-1)\ln x)$
        to: $x+\ln x>(a-1)\ln x\iff x>(a-2)\ln x
        operation: 因 $x>1$、$a>1$，两个输入都大于 0；用 $f'(u)=e^u-1>0$。
        why: 恒成立条件转成 $a-2$ 与 $x/\ln x$ 的比较。
      source_ref: page_0028_ex10_solution
    - step_id: step_4
      statement: 取 $x/\ln x$ 的最小值确定范围。
      formula_trace:
        from: $x>(a-2)\ln x\quad(x>1)$
        to: $a-2<\left(\frac{x}{\ln x}\right)_{\min}=e$
        operation: 同除以 $\ln x>0$，得到 $a-2<x/\ln x$，再用 $x/\ln x$ 在 $x=e$ 处取最小值 $e$。
        why: 严格大于要求右端点不能取到；结合题设 $a>1$ 得 $(1,e+2)$。
      source_ref: page_0028_ex10_solution
teaching_card:
  student_title: 把 $xe^x$ 和 $x^{a-1}$ 都装进 $e^u-u$
  what_it_trains: 训练把含参数恒成立不等式拆成同一个函数的两个输入比较，再由 $x/\ln x$ 的最小值给出参数范围。
  recognition_cues:
    - 式子里同时出现 $xe^x$、$x^{a-1}$ 和多项 $\ln x$。
    - 有 $a-1$ 与 $a-2$，提示把 $\ln x$ 重新分配到左右两边。
    - 区间是 $x>1$，所以 $\ln x>0$，适合转成 $x/\ln x$。
  normalization_moves:
    - 先把原式整理成 $xe^x-x-\ln x>x^{a-1}-(a-1)\ln x$。
    - 把左侧识别为 $f(x+\ln x)$，右侧识别为 $f((a-1)\ln x)$。
    - 用 $f$ 在正区间递增，转成 $x>(a-2)\ln x$。
    - 最后用 $x/\ln x\ge e$，并注意严格不等式。
  common_failures:
    - 直接对原式求导导致参数和指数幂纠缠在一起。
    - 配 $f(u)=e^u-u$ 时漏掉左侧的 $-\ln x$。
    - 把 $\ln x^{a-1}$ 忘记化成 $(a-1)\ln x$。
    - 把 $a=e+2$ 误放进答案。
  similar_practice_query: xe^x x^{a-1} ln x 恒成立 e^x-x 同构 x/ln x 最小值 参数范围
quality:
  confidence: high
  needs_review: false
  review_notes:
