solution:
  source_solution_summary: 先在定义域 $(0,2)$ 上计算 $f(2-x)+f(x)=2a$，得到图像关于 $(1,a)$ 中心对称。第(2)问由“$f(x)>-2$ 当且仅当 $1<x<2$”和连续性确定边界点 $f(1)=-2$，即 $a=-2$；再令 $t=x-1$，把不等式化为 $\ln\frac{1+t}{1-t}-2t+b t^3>0$，用对数泰勒加强式和 $t\to0^+$ 的三次项极限得到 $b\ge-\frac23$。
  key_steps:
    - step_id: step_1
      statement: 确认定义域并证明中心对称。
      formula_trace:
        from: $f(x)=\ln\frac{x}{2-x}+a x+b(x-1)^3,\quad x\in(0,2)$
        to: $f(2-x)+f(x)=2a$
        operation: 把 $x$ 与 $2-x$ 配对：对数项互为相反数，三次项 $(1-x)^3$ 与 $(x-1)^3$ 互相抵消，线性项相加为 $2a$。
        why: $f(2-x)+f(x)=2a$ 表示图像关于点 $(1,a)$ 中心对称。
      source_ref: page_0064
    - step_id: step_2
      statement: 由“当且仅当”条件确定对称中心纵坐标。
      formula_trace:
        from: $f(x)>-2\ \Longleftrightarrow\ 1<x<2,\quad f(1)=a$
        to: $a=-2$
        operation: 利用 $f$ 在 $(0,2)$ 上连续，分界点 $x=1$ 处必须取临界值 $-2$。
        why: 若 $f(1)$ 高于或低于 $-2$，在 $x=1$ 的一侧都会与“当且仅当”区间矛盾。
      source_ref: page_0064
    - step_id: step_3
      statement: 把第(2)问转成关于 $t=x-1$ 的奇函数符号问题。
      formula_trace:
        from: $\ln\frac{x}{2-x}-2(x-1)+b(x-1)^3>0$
        to: $\Phi(t)=\ln\frac{1+t}{1-t}-2t+b t^3>0,\quad t=x-1\in(-1,1)$
        operation: 令 $t=x-1$，则 $x=1+t$、$2-x=1-t$；并注意 $\Phi(-t)=-\Phi(t)$。
        why: 原条件等价于 $\Phi(t)>0$ 当且仅当 $t>0$，所以只需控制 $0<t<1$ 的符号。
      source_ref: page_0064
    - step_id: step_4
      statement: 用对数泰勒加强式给出 $b\ge-\frac23$ 的充分性。
      formula_trace:
        from: |
          $\ln(1+t)\ge t-\frac{t^2}{2}+\frac{t^3}{3}-\frac{t^4}{4}$，
          $\ln(1-t)\le -t-\frac{t^2}{2}-\frac{t^3}{3}-\frac{t^4}{4}$
        to: $\ln\frac{1+t}{1-t}\ge2t+\frac23t^3\quad(0<t<1)$
        operation: 两式相减，偶次项抵消，留下 $2t+\frac23t^3$ 的三次下界。
        why: 若 $b\ge-\frac23$，则 $\Phi(t)\ge(b+\frac23)t^3$；实际余量在 $0<t<1$ 为正，边界值 $b=-\frac23$ 也满足严格大于。
      source_ref: page_0064
    - step_id: step_5
      statement: 用 $t\to0^+$ 的三次项极限证明必要性。
      formula_trace:
        from: $\Phi(t)=\ln\frac{1+t}{1-t}-2t+b t^3$
        to: $\lim_{t\to0^+}\frac{\Phi(t)}{t^3}=b+\frac23$
        operation: 由 $\ln\frac{1+t}{1-t}=2t+\frac23t^3+O(t^5)$，取三次主项系数。
        why: 若 $b<-\frac23$，则 $t>0$ 足够小时 $\Phi(t)<0$，与 $1<x<2$ 时 $f(x)>-2$ 矛盾。
      source_ref: page_0064
teaching_card:
  student_title: 把对称对数题化到 $x=1$ 附近看三次项
  what_it_trains: 训练先用中心对称确定临界点，再用对数泰勒展开读出参数的三次项门槛。
  recognition_cues:
    - 题干出现 $\ln\frac{x}{2-x}$ 和 $(x-1)^3$，天然围绕 $x=1$ 对称。
    - 条件写成 “$f(x)>-2$ 当且仅当 $1<x<2$”，提示 $x=1$ 是分界点。
    - 源页前文正在讲 $\ln(1+x)$ 与 $\ln x$ 的泰勒展开。
  normalization_moves:
    - 先算 $f(2-x)+f(x)$，确认中心对称点。
    - 用连续性把 $a$ 固定为 $-2$。
    - 令 $t=x-1$，把对数比值写成 $\ln\frac{1+t}{1-t}$。
    - 比较 $\ln\frac{1+t}{1-t}$ 与 $2t+\frac23t^3$。
  common_failures:
    - 忽略定义域，只说“关于 $x=1$ 对称”而没有证明图像中心。
    - 没有从 $f(1)=-2$ 得到 $a=-2$，直接讨论 $b$。
    - 用泰勒展开只证明充分性，漏掉 $b<-\frac23$ 时在 $x=1$ 右侧会失败。
  similar_practice_query: 中心对称 $\ln\frac{x}{2-x}$ 泰勒展开 三次项 参数范围 $b\ge-\frac23$
quality:
  confidence: high
  needs_review: false
  review_notes:
    - page_0064 的 “$x>0$” 已按本题变量 $t=x-1\in(0,1)$ 解释为局部泰勒应用域，属于可数学补全的源页简写。
    - 源页只直接写出 $b\ge-\frac23$ 的结论；本卡补入 $t\to0^+$ 的必要性说明，避免把严格当且仅当条件只做成充分性。
