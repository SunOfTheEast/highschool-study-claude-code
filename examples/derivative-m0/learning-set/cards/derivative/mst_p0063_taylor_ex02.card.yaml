stem: |-
  （2024 · 新高考 Ⅰ）已知函数 $f(x)=\ln\frac{x}{2-x}+a x+b(x-1)^3$。

  (1) 证明：曲线 $y=f(x)$ 是中心对称图形；
  (2) 若 $f(x)>-2$ 当且仅当 $1<x<2$，求 $b$ 的取值范围。
answer: |-
  (1) 曲线 $y=f(x)$ 关于点 $(1,a)$ 中心对称。
  (2) 条件迫使 $a=-2$，且 $b\ge-\frac23$。


  先在定义域 $(0,2)$ 上计算 $f(2-x)+f(x)=2a$，得到图像关于 $(1,a)$ 中心对称。第(2)问由“$f(x)>-2$ 当且仅当 $1<x<2$”和连续性确定边界点 $f(1)=-2$，即 $a=-2$；再令 $t=x-1$，把不等式化为 $\ln\frac{1+t}{1-t}-2t+b t^3>0$，用对数泰勒加强式和 $t\to0^+$ 的三次项极限得到 $b\ge-\frac23$。
