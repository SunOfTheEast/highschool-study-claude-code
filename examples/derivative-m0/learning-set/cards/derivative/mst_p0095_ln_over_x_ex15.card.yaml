stem: |-
  （2023 辽宁高二期末 T8）已知过点 $A(0,b)$ 作曲线 $y=\frac{\ln x}{x}$ 的切线有且仅有两条，则 $b$ 的取值范围为 (  )
  A. $\left(0,\frac{1}{e}\right)$
  B. $\left(0,\frac{2}{e}\right)$
  C. $(0,e)$
  D. $\left(0,\frac{2}{e^{\frac{3}{2}}}\right)$
answer: |
  D

  对 $f(x)=\frac{\ln x}{x}$ 求导，得
  $f'(x)=\frac{1-\ln x}{x^2}$，
  $f''(x)=\frac{2\ln x-3}{x^3}$。拐点满足 $x=e^{3/2}$，此处切线斜率为
  $-\frac{1}{2e^3}$，切线方程为
  $y=-\frac{x}{2e^3}+\frac{2}{e^{3/2}}$，与 $y$ 轴交于
  $\left(0,\frac{2}{e^{3/2}}\right)$。由于 $y$ 轴是函数的渐近线，
  当 $0<b<\frac{2}{e^{3/2}}$ 时，从 $A(0,b)$ 可引一条近切线和一条远切线；
  等于端点时切线合并，超出端点时不是两条，故选 D。
