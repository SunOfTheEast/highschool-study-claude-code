solution:
  source_solution_summary: |
    对 $f(x)=\frac{\ln x}{x}$ 求导，得
    $f'(x)=\frac{1-\ln x}{x^2}$，
    $f''(x)=\frac{2\ln x-3}{x^3}$。拐点满足 $x=e^{3/2}$，此处切线斜率为
    $-\frac{1}{2e^3}$，切线方程为
    $y=-\frac{x}{2e^3}+\frac{2}{e^{3/2}}$，与 $y$ 轴交于
    $\left(0,\frac{2}{e^{3/2}}\right)$。由于 $y$ 轴是函数的渐近线，
    当 $0<b<\frac{2}{e^{3/2}}$ 时，从 $A(0,b)$ 可引一条近切线和一条远切线；
    等于端点时切线合并，超出端点时不是两条，故选 D。
  key_steps:
    - step_id: step_1
      statement: 求一阶、二阶导数并定位拐点。
      formula_trace:
        from: |
          $f(x)=\frac{\ln x}{x}\quad(x>0)$
        to: |
          $f'(x)=\frac{1-\ln x}{x^2},\qquad f''(x)=\frac{2\ln x-3}{x^3},\qquad x=e^{3/2}$
        operation: 对商式求导，再令 $f'(x)=0$。
        why: 源页用拐点切线作为过 $y$ 轴点两切线区域的边界。
      source_ref: page_0095
    - step_id: step_2
      statement: 求拐点处切线及其 $y$ 轴截距。
      formula_trace:
        from: |
          $x_0=e^{3/2},\quad f(x_0)=\frac{3}{2e^{3/2}},\quad f'(x_0)=-\frac{1}{2e^3}$
        to: |
          $y-\frac{3}{2e^{3/2}}=-\frac{1}{2e^3}(x-e^{3/2}),\qquad
          y=-\frac{x}{2e^3}+\frac{2}{e^{3/2}}$
        operation: 把拐点坐标和斜率代入点斜式切线。
        why: 该切线与 $y$ 轴的交点给出两切线区域的上边界。
      source_ref: page_0095
    - step_id: step_3
      statement: 由区域边界得到 $b$ 的范围。
      formula_trace:
        from: |
          $\text{拐点切线与 }y\text{ 轴交点为 }\left(0,\frac{2}{e^{3/2}}\right)$
        to: |
          $0<b<\frac{2}{e^{3/2}}$
        operation: 结合 $y$ 轴渐近线和源图的近切线/远切线区域判断。
        why: 此开区间内有一条拐点左侧近切线和一条拐点右侧远切线；端点处不再是两条。
      source_ref: page_0095
    - step_id: step_4
      statement: 用切线截距函数复核两解条件。
      formula_trace:
        from: |
          $A(0,b)\text{ 在 }x=u\text{ 处切线上},\quad b=f(u)-u f'(u)$
        to: |
          $b=\frac{2\ln u-1}{u},\qquad \left(\frac{2\ln u-1}{u}\right)'=\frac{3-2\ln u}{u^2}$
        operation: 把切线代入 $x=0$，得到切线在 $y$ 轴上的截距函数并求导。
        why: 截距函数在 $u=e^{3/2}$ 处取最大值 $2/e^{3/2}$，水平值 $b$ 介于 $0$ 与最大值之间时有两个切点。
      source_ref: page_0095
teaching_card:
  student_title: 用拐点切线截距锁定两条切线的 $b$
  what_it_trains: 训练对带渐近线的对数商函数，用拐点切线和截距函数判断外点可引几条切线。
  recognition_cues:
    - 外点在 $y$ 轴上，而函数定义域是 $x>0$，说明 $y$ 轴渐近线会参与切线条数判断。
    - 题目问“有且仅有两条”，要找到切线条数变化的边界。
    - 选项都以 $0$ 为左端点，提示下边界来自渐近线和切线截距的正负。
  normalization_moves:
    - 先求 $f'$、$f''$，找到拐点 $x=e^{3/2}$。
    - 写拐点切线并取其 $y$ 轴截距 $2/e^{3/2}$。
    - 判断 $b$ 在 $0$ 与该截距之间时有两条切线。
  common_failures:
    - 把最大值 $1/e$ 当成切线截距边界。
    - 忽略 $y$ 轴是渐近线，把 $b<0$ 的情形也算入。
    - 在 $b=2/e^{3/2}$ 时仍算两条，漏掉拐点处切线合并。
  similar_practice_query: $\ln x/x$ 过 $A(0,b)$ 两条切线 拐点切线 截距
