solution:
  source_solution_summary: |
    条件
    \[
    \forall x_1\in[1,2],\ \exists x_2\in[1,3],\ f(x_1)\ge g(x_2)
    \]
    在源解中改写为
    \[
    f(x)_{\min}\ge g(x)_{\min}.
    \]
    先看
    \[
    f(x)=xe^x+2a,\quad f^{\prime}(x)=e^x(x+1)>0\ (x\in[1,2]),
    \]
    故
    \[
    f(x)_{\min}=f(1)=e+2a.
    \]
    再看
    \[
    g(x)=\frac{e\ln x}{x},\quad
    g^{\prime}(x)=\frac{e(1-\ln x)}{x^2}.
    \]
    在 $[1,e]$ 上 $g^{\prime}(x)>0$，在 $(e,3]$ 上 $g^{\prime}(x)<0$，故最小值出现在端点比较处：
    \[
    g(1)=0,\quad g(3)=\frac{e\ln3}{3}>0
    \Rightarrow g(x)_{\min}=0.
    \]
    所以
    \[
    e+2a\ge0\Rightarrow a\ge-\frac e2.
    \]
    故选 C。
  key_steps:
    - step_id: step_1
      statement: 把“$\forall x_1\exists x_2$”压缩为最小值比较。
      formula_trace:
        from: $\forall x_1\in[1,2],\ \exists x_2\in[1,3],\ f(x_1)\ge g(x_2)$
        to: $f_{\min}\ge g_{\min}$
        operation: 存在量词使右端可取到区间下界。
        why: 参数条件只需比较两个固定最小值。
      source_ref: page_0169_ex08_solution
    - step_id: step_2
      statement: 求 $f$ 在 $[1,2]$ 的最小值。
      formula_trace:
        from: $f^{\prime}(x)=e^x(x+1)>0$
        to: $f_{\min}=f(1)=e+2a$
        operation: 单调递增函数取左端点。
        why: 得到含参数的一侧下界。
      source_ref: page_0169_ex08_solution
    - step_id: step_3
      statement: 求 $g$ 在 $[1,3]$ 的最小值。
      formula_trace:
        from: $g^{\prime}(x)=\frac{e(1-\ln x)}{x^2}$
        to: $g_{\min}=0$
        operation: 分段判单调后比较端点 $g(1),g(3)$。
        why: 把不等式右端变成常数 0。
      source_ref: page_0169_ex08_solution
    - step_id: step_4
      statement: 联立下界得到参数范围。
      formula_trace:
        from: $e+2a\ge0$
        to: $a\ge-\frac e2$
        operation: 一次不等式求解。
        why: 对应选项 C。
      source_ref: page_0169_ex08_solution
teaching_card:
  student_title: “任意-存在”先化最小值比较
  what_it_trains: 训练含量词参数题的第一反应：把条件翻译成可计算的区间最值，再做导数与端点判定。
  recognition_cues:
    - 条件里同时出现“任意”“存在”。
    - 两侧函数定义区间不同。
    - 问法是参数区间。
  normalization_moves:
    - 把量词语句改写成最值不等式。
    - 对每个区间先看导数符号，再落端点值。
    - 把最值约束变成一次参数不等式。
  common_failures:
    - 把 $\forall x_1\exists x_2$ 误当成“同一个 $x$”比较。
    - 只看驻点，不比较端点 $g(1),g(3)$。
    - 漏掉 $2a$ 常数项，导致参数结果偏移。
  similar_practice_query: 任意存在 量词 最小值比较 xe^x e lnx/x 参数范围
