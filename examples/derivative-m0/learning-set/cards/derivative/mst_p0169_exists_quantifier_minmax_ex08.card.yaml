stem: |-
  （2023·贵州“3+3+3”模拟 T10）已知函数 $f(x)=xe^x+2a$，$g(x)=\frac{e\ln x}{x}$，任意 $x_1 \in [1, 2]$，$\exists x_2 \in [1, 3]$，都有不等式 $f(x_1) \geqslant g(x_2)$ 成立，则 $a$ 的取值范围是（  ）
  A. $[-e^2, +\infty)$
  B. $\left[\frac{1-e}{2}, +\infty\right)$
  C. $\left[-\frac{e}{2}, +\infty\right)$
  D. $\left[\frac{1}{2}-e^2, +\infty\right)$
answer: |
  C

  条件
  \[
  \forall x_1\in[1,2],\ \exists x_2\in[1,3],\ f(x_1)\ge g(x_2)
  \]
  在源解中改写为
  \[
  f(x)_{\min}\ge g(x)_{\min}.
  \]
  先看
  \[
  f(x)=xe^x+2a,\quad f^{\prime}(x)=e^x(x+1)>0\ (x\in[1,2]),
  \]
  故
  \[
  f(x)_{\min}=f(1)=e+2a.
  \]
  再看
  \[
  g(x)=\frac{e\ln x}{x},\quad
  g^{\prime}(x)=\frac{e(1-\ln x)}{x^2}.
  \]
  在 $[1,e]$ 上 $g^{\prime}(x)>0$，在 $(e,3]$ 上 $g^{\prime}(x)<0$，故最小值出现在端点比较处：
  \[
  g(1)=0,\quad g(3)=\frac{e\ln3}{3}>0
  \Rightarrow g(x)_{\min}=0.
  \]
  所以
  \[
  e+2a\ge0\Rightarrow a\ge-\frac e2.
  \]
  故选 C。
