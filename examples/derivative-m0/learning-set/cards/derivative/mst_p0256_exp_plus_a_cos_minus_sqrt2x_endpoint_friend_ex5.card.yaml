stem: |-
  已知函数 $f(x)=e^x+a\cos x-\sqrt2x-2$，$f^\prime(x)$ 为 $f(x)$ 的导函数。
  1. 讨论 $f^\prime(x)$ 在区间 $(0,\frac{\pi}{2})$ 内极值点的个数。
  2. 若 $x\in[-\frac{\pi}{2},0]$ 时，$f(x)\ge0$ 恒成立，求实数 $a$ 的取值范围。
answer: |-
  第(1)问：当 $a\le1$ 时无极值点；当 $a>1$ 时有 1 个极小值点、无极大值点。第(2)问：$a\ge1$。

  第(1)问令 $g(x)=f^\prime(x)=e^x-a\sin x-\sqrt2$， 则 $g^\prime(x)=e^x-a\cos x$。当 $a\le1$ 时， $g^\prime(x)>0$，所以 $f^\prime$ 无极值点；当 $a>1$ 时， $g^{\prime\prime}(x)=e^x+a\sin x>0$，$g^\prime$ 递增且从负到正， 因而 $g$ 有 1 个极小值点。第(2)问先由 $f(0)=a-1\ge0$ 得 $a\ge1$。当 $a\ge1$ 时，$(a-1)\cos x\ge0$，只需证 $e^x+\cos x-\sqrt2x-2\ge0$。令 $u(x)=1+\frac{\cos x-\sqrt2x-2}{e^x}$，则 $u(0)=0$，$u^\prime(x)=\frac{t(x)}{e^x}$， $t(x)=-\sin x-\cos x+\sqrt2x+2-\sqrt2$。在 $[-\frac\pi2,0]$ 上 $t^\prime(x)\ge0$ 且 $t(0)<0$， 所以 $u^\prime<0$，从而 $u(x)\ge u(0)=0$。
