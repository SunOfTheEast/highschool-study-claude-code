original_problem:
  stem: 已知函数 $f(x)=e^x+a\cos x-\sqrt2x-2$，$f^\prime(x)$ 为 $f(x)$ 的导函数。
  parts: *a1
  choices: []
  answer: 第(1)问：当 $a\le1$ 时无极值点；当 $a>1$ 时有 1 个极小值点、无极大值点。第(2)问：$a\ge1$。
  fidelity_notes:
    - 无选项。
    - 第(2)问导数符号按直接计算修正。
solution:
  source_solution_summary: 第(1)问令 $g(x)=f^\prime(x)=e^x-a\sin x-\sqrt2$， 则 $g^\prime(x)=e^x-a\cos x$。当 $a\le1$ 时， $g^\prime(x)>0$，所以 $f^\prime$ 无极值点；当 $a>1$ 时， $g^{\prime\prime}(x)=e^x+a\sin x>0$，$g^\prime$ 递增且从负到正， 因而 $g$ 有 1 个极小值点。第(2)问先由 $f(0)=a-1\ge0$ 得 $a\ge1$。当 $a\ge1$ 时，$(a-1)\cos x\ge0$，只需证 $e^x+\cos x-\sqrt2x-2\ge0$。令 $u(x)=1+\frac{\cos x-\sqrt2x-2}{e^x}$，则 $u(0)=0$，$u^\prime(x)=\frac{t(x)}{e^x}$， $t(x)=-\sin x-\cos x+\sqrt2x+2-\sqrt2$。在 $[-\frac\pi2,0]$ 上 $t^\prime(x)\ge0$ 且 $t(0)<0$， 所以 $u^\prime<0$，从而 $u(x)\ge u(0)=0$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问：把 $f^\prime$ 当作新函数 $g$。
      formula_trace:
        from: $f^\prime(x)=e^x-a\sin x-\sqrt2$
        to: $g^\prime(x)=e^x-a\cos x$
        operation: 继续求导判断 $f^\prime$ 的极值点。
        why: $f^\prime$ 的极值点就是 $g$ 的极值点。
      source_ref: page_0256_ex5_solution
    - step_id: step_2
      statement: 第(1)问：按 $a$ 与 $1$ 的大小分情况。
      formula_trace:
        from: $g^\prime(x)=e^x-a\cos x$
        to: $a\le1$ 无极值点；$a>1$ 有 1 个极小值点
        operation: 用 $e^x>1$、$0<\cos x<1$ 与 $g^{\prime\prime}>0$ 判号。
        why: 极值点个数由 $g^\prime$ 的零点个数决定。
      source_ref: page_0256_ex5_solution
    - step_id: step_3
      statement: 第(2)问：先用端点得到必要条件。
      formula_trace:
        from: $f(0)=a-1$
        to: $a\ge1$
        operation: 代入区间端点 $0$。
        why: 恒成立必须先满足端点。
      source_ref: page_0256_ex5_solution
    - step_id: step_4
      statement: 第(2)问：把参数项剥离出去。
      formula_trace:
        from: $f(x)=(a-1)\cos x+e^x+\cos x-\sqrt2x-2$
        to: 只需证 $e^x+\cos x-\sqrt2x-2\ge0$
        operation: 利用 $a\ge1$ 且 $\cos x\ge0$。
        why: 把含参部分变成非负项。
      source_ref: page_0256_ex5_solution
    - step_id: step_5
      statement: 第(2)问：除以 $e^x$ 做指数找基友。
      formula_trace:
        from: $e^x+\cos x-\sqrt2x-2\ge0$
        to: $u(x)=1+\frac{\cos x-\sqrt2x-2}{e^x}\ge0$
        operation: 把指数项变成常数 1。
        why: 这样求导后指数不会干扰零点判断。
      source_ref: page_0256_ex5_solution
    - step_id: step_6
      statement: 第(2)问：证明 $u(x)\ge0$。
      formula_trace:
        from: $u^\prime(x)=\frac{-\sin x-\cos x+\sqrt2x+2-\sqrt2}{e^x}$
        to: $u^\prime(x)<0$，$u(x)\ge u(0)=0$
        operation: 令分子为 $t(x)$，用 $t^\prime\ge0$ 和 $t(0)<0$ 判号。
        why: 在 $[-\frac\pi2,0]$ 上，向右递减意味着左侧函数值不低于 $0$。
      source_ref: page_0256_ex5_solution
teaching_card:
  student_title: 指数和三角混在一起时，先找能消掉指数的同伴
  what_it_trains: 训练“端点探路 + 指数找基友”：先由端点锁参数方向，再把指数项除掉，让剩下的三角线性组合可判号。
  recognition_cues:
    - 函数里有 $e^x$、$\cos x$ 和线性项 $\sqrt2x$。
    - 第(2)问的区间是 $[-\frac\pi2,0]$，$\cos x$ 非负，适合剥离 $(a-1)\cos x$。
    - 解析把 $e^x+\cos x-\sqrt2x-2$ 改成 $1+\frac{\cos x-\sqrt2x-2}{e^x}$。
  normalization_moves:
    - 第(1)问要数的是 $f^\prime$ 的极值点，所以要继续对 $f^\prime$ 求导。
    - 第(2)问先代 $x=0$，不要上来就全局求最小值。
    - 看到 $e^x+\text{其他项}$，可以考虑除以 $e^x$。
  common_failures:
    - 把 $f$ 的极值点和 $f^\prime$ 的极值点混在一起。
    - 忽略 $\cos x\ge0$，没有把参数项剥离出来。
    - 导数分子里 $\sin x$ 符号抄错。
  similar_practice_query: 端点探路 指数找基友 e^x cosx sqrt2x 参数范围 fprime极值点
