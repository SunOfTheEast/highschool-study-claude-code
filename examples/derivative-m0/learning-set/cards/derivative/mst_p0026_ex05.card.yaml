original_problem:
  stem: |
    （2025 天津市河东区质检 T15）设函数 $f(x)=x+\ln x$，$g(x)=x+e^x$，若存在 $x_1$，$x_2$，使得 $g(x_1)=f(x_2)$，则 $|x_1-x_2|$ 的最小值为________。
  parts: *a1
  choices: []
  answer: $1$
  fidelity_notes:
    - 题干和解析完整在 page_0026；由 $f(x_2)$ 有意义可知 $x_2>0$。
solution:
  source_solution_summary: 由 $g(x_1)=f(x_2)$ 得 $e^{x_1}+x_1=x_2+\ln x_2=e^{\ln x_2}+\ln x_2$。令 $g(t)=e^t+t$，其严格递增，所以 $g(x_1)=g(\ln x_2)$ 推出 $x_1=\ln x_2$。于是 $|x_1-x_2|=|x_2-\ln x_2|$；对 $x_2>0$，$x_2-\ln x_2\ge1$，等号在 $x_2=1$，故最小值为 1。
  key_steps:
    - step_id: step_1
      statement: 先确认 $x_2$ 的定义域。
      formula_trace:
        from: $f(x_2)=x_2+\ln x_2$ 有意义
        to: $x_2>0$
        operation: 对数真数必须大于 0。
        why: 后续才能使用 $\ln x_2$ 并讨论 $x_2-\ln x_2$ 的最小值。
      source_ref: page_0026
    - step_id: step_2
      statement: 把 $f(x_2)$ 写成 $g$ 的函数值。
      formula_trace:
        from: $x_2+\ln x_2$
        to: $e^{\ln x_2}+\ln x_2=g(\ln x_2)$
        operation: 用 $x_2=e^{\ln x_2}$。
        why: 这样 $g(x_1)=f(x_2)$ 变成同一个函数 $g$ 的函数值相等。
      source_ref: page_0026
    - step_id: step_3
      statement: 利用 $g$ 单调性确定 $x_1$。
      formula_trace:
        from: $g(x_1)=g(\ln x_2),\quad g(t)=e^t+t$
        to: $x_1=\ln x_2$
        operation: 直接由 $g$ 的导数 $e^t+1>0$，故 $g$ 在 $\mathbf R$ 上严格递增。
        why: 严格递增函数一一对应，函数值相等则输入相等。
      source_ref: page_0026
    - step_id: step_4
      statement: 把距离转成单变量最值。
      formula_trace:
        from: $|x_1-x_2|$
        to: $|x_2-\ln x_2|=x_2-\ln x_2$
        operation: 代入 $x_1=\ln x_2$；对 $x_2>0$ 有 $x_2-\ln x_2\ge1>0$。
        why: 原来的两变量距离被降成一个标准函数的最小值。
      source_ref: page_0026
    - step_id: step_5
      statement: 求 $x-\ln x$ 的最小值。
      formula_trace:
        from: $\phi(x)=x-\ln x,\quad x>0$
        to: $\phi(x)\ge\phi(1)=1$
        operation: $\phi$ 的导数为 $1-\frac1x$，在 $(0,1)$ 负、在 $(1,+\infty)$ 正。
        why: 唯一极小点为 $x=1$，可取到最小值 1。
      source_ref: page_0026
teaching_card:
  student_title: 把 $f(x_2)$ 改写成 $g(\ln x_2)$
  what_it_trains: 训练把两个函数值相等的问题转成同一个递增函数的输入相等，再把距离问题降成单变量最值。
  recognition_cues:
    - $f(x)=x+\ln x$ 与 $g(x)=x+e^x$ 同时出现。
    - 条件是 $g(x_1)=f(x_2)$。
    - 目标是 $|x_1-x_2|$ 的最小值。
  normalization_moves:
    - 用 $x_2=e^{\ln x_2}$ 把 $f(x_2)$ 写成 $g(\ln x_2)$。
    - 由 $g$ 单调得到 $x_1=\ln x_2$。
    - 把 $|x_1-x_2|$ 化为 $x_2-\ln x_2$。
  common_failures:
    - 没有把 $x_2$ 改成 $e^{\ln x_2}$，看不出同构。
    - 误以为“存在 $x_1,x_2$”需要先解出具体数值。
    - 求 $x-\ln x$ 最小时漏掉定义域 $x>0$。
  similar_practice_query: $x+\ln x$ $x+e^x$ 函数值相等 距离最小 同构
