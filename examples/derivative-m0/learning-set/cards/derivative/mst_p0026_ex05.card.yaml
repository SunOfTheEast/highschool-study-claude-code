stem: |
  （2025 天津市河东区质检 T15）设函数 $f(x)=x+\ln x$，$g(x)=x+e^x$，若存在 $x_1$，$x_2$，使得 $g(x_1)=f(x_2)$，则 $|x_1-x_2|$ 的最小值为________。
answer: |-
  $1$

  由 $g(x_1)=f(x_2)$ 得 $e^{x_1}+x_1=x_2+\ln x_2=e^{\ln x_2}+\ln x_2$。令 $g(t)=e^t+t$，其严格递增，所以 $g(x_1)=g(\ln x_2)$ 推出 $x_1=\ln x_2$。于是 $|x_1-x_2|=|x_2-\ln x_2|$；对 $x_2>0$，$x_2-\ln x_2\ge1$，等号在 $x_2=1$，故最小值为 1。
