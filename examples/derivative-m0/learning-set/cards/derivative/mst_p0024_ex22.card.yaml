stem: |-
  （上海市嘉定区 2024 届高三一模 T21）已知 $f(x)=\frac{x}{\mathrm{e}^{x}}, \ g(x)=\frac{\ln x}{x}$.

  (1) 求函数 $y=f(x)$、$y=g(x)$ 的单调区间和极值;
  (2) 请严格证明曲线 $y=f(x)$、$y=g(x)$ 有唯一交点;
  (3) 对于常数 $a \in\left(0, \frac{1}{\mathrm{e}}\right)$，若直线 $y=a$ 和曲线 $y=f(x)$、$y=g(x)$ 共有三个不同交点 $\left(x_{1}, a\right)$、$\left(x_{2}, a\right)$、$\left(x_{3}, a\right)$，其中 $x_{1}<x_{2}<x_{3}$，求证：$x_{1}$、$x_{2}$、$x_{3}$ 成等比数列.
answer: |-
  (1) $f(x)=x\mathrm{e}^{-x}$ 在 $(-\infty,1)$ 上递增，在 $(1,+\infty)$ 上递减，极大值为 $f(1)=1/\mathrm{e}$；$g(x)=\ln x/x$ 在 $(0,\mathrm{e})$ 上递增，在 $(\mathrm{e},+\infty)$ 上递减，极大值为 $g(\mathrm{e})=1/\mathrm{e}$。
  (2) 两曲线有唯一交点，其横坐标 $x_2\in(1,\mathrm{e})$。
  (3) 在题设三交点情形下，$x_1=\ln x_2$、$x_2=\ln x_3$，且由公共交点方程得 $x_1x_3=x_2^2$，故 $x_1,x_2,x_3$ 成等比数列。


  先用导数给出 $x/\mathrm{e}^x$ 与 $\ln x/x$ 的极大值结构；再令 $h(x)=\mathrm{e}^x\ln x-x^2$ 证明两曲线唯一交点。第三问中，三交点条件迫使中间点为两曲线公共点，于是用 $f(x_1)=g(x_2)$、$f(x_2)=g(x_3)$ 的指对同构得到 $x_1=\ln x_2$、$x_2=\ln x_3$，最后由 $h(x_2)=0$ 推出 $x_1x_3=x_2^2$。
