solution:
  source_solution_summary: 先用导数给出 $x/\mathrm{e}^x$ 与 $\ln x/x$ 的极大值结构；再令 $h(x)=\mathrm{e}^x\ln x-x^2$ 证明两曲线唯一交点。第三问中，三交点条件迫使中间点为两曲线公共点，于是用 $f(x_1)=g(x_2)$、$f(x_2)=g(x_3)$ 的指对同构得到 $x_1=\ln x_2$、$x_2=\ln x_3$，最后由 $h(x_2)=0$ 推出 $x_1x_3=x_2^2$。
  key_steps:
    - step_id: step_1
      statement: 求两个函数的单调区间和极值。
      formula_trace:
        from: $f(x)=x\mathrm{e}^{-x},\quad g(x)=\frac{\ln x}{x}$
        to: |
          $f'(x)=\mathrm{e}^{-x}(1-x),\quad g'(x)=\frac{1-\ln x}{x^2}$
        operation: 直接求导并按 $1-x$、$1-\ln x$ 判号。
        why: 导数符号决定单调区间，导数变号点给出极大值。
      source_ref: page_0024
    - step_id: step_2
      statement: 把两曲线交点转化为一个零点方程。
      formula_trace:
        from: $\frac{x}{\mathrm{e}^x}=\frac{\ln x}{x}$
        to: $h(x)=\mathrm{e}^{x}\ln x-x^2=0$
        operation: 在 $x>0$ 上两边乘以 $x\mathrm{e}^x$，再移项。
        why: 交点唯一性可转化为 $h$ 的零点唯一性。
      source_ref: page_0024
    - step_id: step_3
      statement: 证明 $h$ 只有一个零点。
      formula_trace:
        from: |
          $h'(x)=\mathrm{e}^{x}\left(\ln x+\frac1x\right)-2x$
        to: $h(x)$ 在 $(1,+\infty)$ 上严格递增，且唯一零点 $x_2\in(1,\mathrm{e})$
        operation: |
          当 $0<x<1$ 时 $\ln x<0$，故 $h(x)<0$；当 $x>1$ 时，$h'(x)>\mathrm{e}^x-2x>0$；再用 $h(1)=-1<0$、$h(\mathrm{e})=\mathrm{e}^{\mathrm{e}}-\mathrm{e}^2>0$。
        why: 负区间无根，正区间严格递增并出现变号，所以只有一个交点。
      source_ref: page_0024
    - step_id: step_4
      statement: 从三交点条件识别中间点为两曲线公共点。
      formula_trace:
        from: $y=a$ 与两曲线共有三个不同交点 $x_1<x_2<x_3$
        to: $f(x_1)=f(x_2)=g(x_2)=g(x_3),\quad 0<x_1<1<x_2<x_3$
        operation: 利用 $f$ 在正半轴上先增后减、$g$ 在 $(0,+\infty)$ 上先增后减，且两曲线只有一个公共点。
        why: 若总交点数为三个，则一个交点必须由两曲线共享，且只能是唯一公共点 $x_2$。
      source_ref: page_0025
    - step_id: step_5
      statement: 用同构关系得到 $x_1=\ln x_2$ 与 $x_2=\ln x_3$。
      formula_trace:
        from: $f(x_1)=g(x_2),\quad f(x_2)=g(x_3)$
        to: $x_1=\ln x_2,\quad x_2=\ln x_3$
        operation: 把 $g(u)=\ln u/u$ 写成 $f(\ln u)=\ln u/\mathrm{e}^{\ln u}=\ln u/u$，再用 $f$ 在相应单调区间上的唯一性匹配横坐标。
        why: $f$ 与 $g$ 通过 $u=\mathrm{e}^t$ 形成同构。
      source_ref: page_0025
    - step_id: step_6
      statement: 推出三个横坐标成等比数列。
      formula_trace:
        from: $x_1=\ln x_2,\quad x_3=\mathrm{e}^{x_2},\quad h(x_2)=0$
        to: $x_1x_3=\mathrm{e}^{x_2}\ln x_2=x_2^2$
        operation: 由 $x_2=\ln x_3$ 得 $x_3=\mathrm{e}^{x_2}$；由公共交点方程 $h(x_2)=0$ 得 $\mathrm{e}^{x_2}\ln x_2=x_2^2$。
        why: $x_1x_3=x_2^2$ 正是三正数成等比数列的判定式。
      source_ref: page_0025
teaching_card:
  student_title: $x/e^x$ 与 $\ln x/x$ 的三交点等比
  what_it_trains: 训练把互为指对替换的两条曲线通过同构函数连接起来，并把交点关系转化为数列关系。
  recognition_cues:
    - 同时出现 $x/\mathrm{e}^x$ 和 $\ln x/x$。
    - 水平线与两曲线共有三个交点。
    - 结论要求横坐标成等比数列。
  normalization_moves:
    - 用 $h(x)=\mathrm{e}^x\ln x-x^2$ 证明曲线唯一交点。
    - 将 $g(u)$ 改写为 $f(\ln u)$。
    - 用公共交点方程补上乘积 $x_1x_3=x_2^2$。
  common_failures:
    - 把三交点误认为两曲线各自都有两个不同交点而忽略公共点。
    - 未证明唯一交点，直接用图像下结论。
    - 只得到 $x_1=\ln x_2$、$x_2=\ln x_3$，忘记调用 $h(x_2)=0$。
  similar_practice_query: x/e^x ln x/x 唯一交点 水平线 三交点 等比
quality:
  confidence: medium
  needs_review: false
  review_notes:
    - Reviewer confirmed $f(x)=x/e^x$ has natural domain $\\mathbb{R}$ in part (1); keeping $(-\\infty,1)$ and $(1,+\\infty)$ is appropriate.
    - 第三问解析跨 page_0024/page_0025，已按图片核对续接处。
    - Reviewer changed goal from `几何性质证明` to `数列关系证明`; the target is proving intersection abscissas form a geometric progression.
    - Reviewer removed `局部逼近与找点` and `极值点偏移结构`; this route uses unique intersection and $x\\leftrightarrow\\ln x$ matching, not local approximation or extremal-point offset.
