stem: |-
  （2021 · 清华自招）已知函数 $f(x)=e^{x-1}-a\ln x+a\ln a$。
  1. 当 $a=1$ 时，讨论 $f(x)$ 的单调性。
  2. 当 $a>0$ 时，证明：$f(x)\geqslant a$。
answer: |-
  （1）$a=1$ 时，$f(x)$ 在 $(0,1)$ 上单调递减，在 $(1,+\infty)$ 上单调递增；（2）证明见解析，等号当且仅当 $a=1,x=1$ 取得。

  当 $a=1$ 时，$f(x)=e^{x-1}-\ln x$， $f^{\prime}(x)=e^{x-1}-\frac1x$， $f^{\prime\prime}(x)=e^{x-1}+\frac1{x^2}>0$，故 $f^{\prime}$ 单调递增且 $f^{\prime}(1)=0$，于是 $f$ 在 $(0,1)$ 递减，在 $(1,+\infty)$ 递增。第二问要证 $f(x)\geqslant a$。法一拆成两个保值块： $e^{x-1}-x\geqslant0$ 等价于 $e^{x-1}-(x-1)-1\geqslant0$，在 $x=1$ 取等；同时 $\frac xa-1-\ln\frac xa\geqslant0$，在 $x=a$ 取等，所以 $e^{x-1}-x+a(\frac xa-1-\ln\frac xa)\geqslant0$，等号要求 $x=1$ 且 $x=a$，即 $a=1,x=1$。法二将目标改写为 $e^{x-1}\geqslant a\ln\frac{ex}{a}$，再比较 $\frac{a}{e^2}\frac{e^x}{x}$ 与 $a\frac{\ln(ex/a)}{ex/a}$，左右最优值均为 $a/e$，取等条件分别为 $x=1$ 与 $x=a$，最终同样得到不等式成立。
