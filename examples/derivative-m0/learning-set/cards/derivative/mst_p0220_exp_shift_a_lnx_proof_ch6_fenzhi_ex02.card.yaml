original_problem:
  stem: （2021 · 清华自招）已知函数 $f(x)=e^{x-1}-a\ln x+a\ln a$。
  parts: *a1
  choices: []
  answer: （1）$a=1$ 时，$f(x)$ 在 $(0,1)$ 上单调递减，在 $(1,+\infty)$ 上单调递增；（2）证明见解析，等号当且仅当 $a=1,x=1$ 取得。
  fidelity_notes:
    - 两问解答题，无选项。
    - 第二问 source 同时给出同构保值性和分而治之两种证明。
solution:
  source_solution_summary: 当 $a=1$ 时，$f(x)=e^{x-1}-\ln x$， $f^{\prime}(x)=e^{x-1}-\frac1x$， $f^{\prime\prime}(x)=e^{x-1}+\frac1{x^2}>0$，故 $f^{\prime}$ 单调递增且 $f^{\prime}(1)=0$，于是 $f$ 在 $(0,1)$ 递减，在 $(1,+\infty)$ 递增。第二问要证 $f(x)\geqslant a$。法一拆成两个保值块： $e^{x-1}-x\geqslant0$ 等价于 $e^{x-1}-(x-1)-1\geqslant0$，在 $x=1$ 取等；同时 $\frac xa-1-\ln\frac xa\geqslant0$，在 $x=a$ 取等，所以 $e^{x-1}-x+a(\frac xa-1-\ln\frac xa)\geqslant0$，等号要求 $x=1$ 且 $x=a$，即 $a=1,x=1$。法二将目标改写为 $e^{x-1}\geqslant a\ln\frac{ex}{a}$，再比较 $\frac{a}{e^2}\frac{e^x}{x}$ 与 $a\frac{\ln(ex/a)}{ex/a}$，左右最优值均为 $a/e$，取等条件分别为 $x=1$ 与 $x=a$，最终同样得到不等式成立。
  key_steps:
    - step_id: step_1
      statement: 第一问用二阶导确认 $f^{\prime}$ 单调。
      formula_trace:
        from: $a=1,\ f(x)=e^{x-1}-\ln x$
        to: $f^{\prime}(x)=e^{x-1}-\frac1x,\ f^{\prime\prime}(x)=e^{x-1}+\frac1{x^2}>0$
        operation: 求一阶、二阶导。
        why: 用 $f^{\prime}$ 单调递增和 $f^{\prime}(1)=0$ 判定 $f$ 的单调性。
      source_ref: page_0220_ex02_solution_start
    - step_id: step_2
      statement: 读出第一问单调区间。
      formula_trace:
        from: $f^{\prime}$ 递增且 $f^{\prime}(1)=0$
        to: $x\in(0,1)$ 时 $f^{\prime}(x)<0$，$x\in(1,+\infty)$ 时 $f^{\prime}(x)>0$
        operation: 按导数零点分区间判号。
        why: 得到先减后增。
      source_ref: page_0220_ex02_solution_start
    - step_id: step_3
      statement: 法一把第二问拆成两个非负母函数。
      formula_trace:
        from: $f(x)-a=e^{x-1}-a\ln x+a\ln a-a$
        to: $e^{x-1}-x+a(\frac xa-1-\ln\frac xa)$
        operation: 加减 $x$，并把 $a\ln a-a\ln x$ 合成 $-a\ln(x/a)$。
        why: 制造指数母函数和对数母函数的非负块。
      source_ref: page_0221_ex02_continuation
    - step_id: step_4
      statement: 用取等点说明不等式成立。
      formula_trace:
        from: $e^{x-1}-x\geqslant0$ 与 $\frac xa-1-\ln\frac xa\geqslant0$
        to: $f(x)-a\geqslant0$，等号要求 $x=1$ 且 $x=a$
        operation: 分别套 $e^u-u-1\geqslant0$ 与 $t-1-\ln t\geqslant0$。
        why: 两个非负块相加，且取等条件可同时读出。
      source_ref: page_0221_ex02_continuation
    - step_id: step_5
      statement: 法二改写为上下函数比较。
      formula_trace:
        from: $f(x)\geqslant a$
        to: $e^{x-1}\geqslant a(\ln x-\ln a+1)=a\ln\frac{ex}{a}$
        operation: 移项并把常数 1 写进对数。
        why: 进入 $\frac{e^x}{x}$ 与 $\frac{\ln x}{x}$ 的分而治之模型。
      source_ref: page_0221_ex02_continuation
    - step_id: step_6
      statement: 比较上下函数最值。
      formula_trace:
        from: $\frac{e^{x-1}}{ex/a}$ 与 $a\frac{\ln(ex/a)}{ex/a}$
        to: 左边 $\geqslant a/e$（$x=1$ 取等），右边 $\leqslant a/e$（$x=a$ 取等）
        operation: 套用 $e^u/u$ 的最小值与 $\ln u/u$ 的最大值。
        why: source 的第二种证法显示同一题也可用分而治之。
      source_ref: page_0221_ex02_continuation
teaching_card:
  student_title: 同一道题的两种保值：拆非负块或做上下函数
  what_it_trains: 训练指对不等式的两条等价思路：直接拆成标准非负块，或者构造上下函数比较最值。
  recognition_cues:
    - 题中有 $e^{x-1}$、$\ln x$、$a\ln a$，天然提示 $x/a$。
    - 要证 $f(x)\geqslant a$，等号点很可能要求 $x=1$ 与 $x=a$ 同时成立。
    - 解析同时出现“同构保值性”和“分而治之”。
  normalization_moves:
    - 先把 $f(x)-a$ 写出来。
    - 尝试加减 $x$，拆出 $e^{x-1}-x$。
    - 把剩余对数项统一成 $x/a-1-\ln(x/a)$。
  common_failures:
    - 把两个不同的非负母函数混成同一个 $h$，导致公式不对。
    - 只会用导数硬求最小值，没看出 $x/a$ 的同构。
    - 用分而治之时忘记左右取等点分别是 $x=1$ 与 $x=a$。
  similar_practice_query: e^{x-1}-a ln x+a ln a >= a 同构保值性 x/a 分而治之
