solution:
  source_solution_summary: |
    先把 $g(x)$ 改写为 $f(1+\ln x)$，令 $t=1+\ln x_2$，于是问题变成 $f(x_1)=f(t)$。不用二阶导，直接求导得 $f'(x)=e^{x-1}(x-1)/x^2$，所以 $f$ 在 $(-\infty,0)$ 与 $(0,1)$ 上递减、在 $(1,+\infty)$ 上递增。按 $t<0$、$0<t<1$、$t=1$、$t>1$ 分段列出等值点位置，即可判断 A、B、C。若 $x_1,x_2>1$，则只能落在右侧递增分支，$x_1=1+\ln x_2$，从而 $|x_2-x_1|=x_2-\ln x_2-1$ 随 $x_2$ 增大而增大，D 正确。
  key_steps:
    - step_id: step_1
      statement: 把 $g$ 改写成 $f$ 的平移对数输入。
      formula_trace:
        from: $g(x)=\frac{x}{1+\ln x}$
        to: $g(x)=\frac{e^{\ln(ex)-1}}{\ln(ex)}=f(1+\ln x)$
        operation: 用 $\ln(ex)=1+\ln x$，且 $e^{\ln(ex)-1}=e^{\ln x}=x$。
        why: 这样 $f(x_1)=g(x_2)$ 就变成同一函数 $f$ 的等值问题。
      source_ref: page_0033
    - step_id: step_2
      statement: 求出 $f$ 的分支单调结构。
      formula_trace:
        from: $f(x)=\frac{e^{x-1}}{x}$
        to: |
          $f'(x)=\frac{e^{x-1}(x-1)}{x^2}$；$f$ 在 $(-\infty,0)$、$(0,1)$ 上递减，在 $(1,+\infty)$ 上递增，且 $f(1)=1$。
        operation: 对商式求导，并按 $x-1$ 与定义域断点 $x=0$ 分区间判号。
        why: 等值方程 $f(x_1)=f(t)$ 的解数和位置完全由这些分支决定。
      source_ref: page_0033
    - step_id: step_3
      statement: 讨论 $t=1+\ln x_2<0$ 的情形。
      formula_trace:
        from: $t=1+\ln x_2<0$，即 $0<x_2<\frac1e$，且 $f(x_1)=f(t)$
        to: $x_1=t=1+\ln x_2<x_2$
        operation: 此时 $f(t)<0$，所以 $x_1<0$；又 $f$ 在 $(-\infty,0)$ 上严格递减，等值点唯一，故 $x_1=t$。
        why: 负分支上没有第二个等值点，且 $1+\ln x_2<x_2$。
      source_ref: page_0033
    - step_id: step_4
      statement: 讨论 $0<t<1$ 的情形。
      formula_trace:
        from: $0<1+\ln x_2<1$，即 $\frac1e<x_2<1$
        to: 等值点为 $x_1=t=1+\ln x_2<x_2<1$，或另一个 $x_1>1>x_2$
        operation: 因 $f(t)>1$，在 $(0,1)$ 的递减分支上有一个解 $x_1=t$，在 $(1,+\infty)$ 的递增分支上还有一个对应解。
        why: 这一段同时给出 $x_1<x_2$ 的小分支和 $x_1>x_2$ 的大分支。
      source_ref: page_0033
    - step_id: step_5
      statement: 讨论 $t=1$ 的情形。
      formula_trace:
        from: $1+\ln x_2=1$
        to: $x_2=1,\quad f(x_1)=f(1)$ 只有 $x_1=1$，所以 $x_1=x_2=1$
        operation: 解 $\ln x_2=0$ 得 $x_2=1$，再用 $f$ 在正半轴的最小值点唯一性。
        why: 这直接证明选项 C 的存在性。
      source_ref: page_0033
    - step_id: step_6
      statement: 讨论 $t>1$ 的情形。
      formula_trace:
        from: $1+\ln x_2>1$，即 $x_2>1$
        to: 等值点为 $x_1\in(0,1)$，或 $x_1=t=1+\ln x_2<x_2$
        operation: 右侧递增分支给出解 $x_1=t$，左侧 $(0,1)$ 递减分支给出另一个正解；由 $x_2>1$ 得 $1+\ln x_2<x_2$。
        why: 当 $x_2>1$ 时不会出现 $x_1>x_2$，但会出现 $x_1<x_2$ 且 $x_1>1$ 的反例。
      source_ref: page_0033
    - step_id: step_7
      statement: 汇总分段结论判断 A、B、C。
      formula_trace:
        from: 四段情况中的 $x_1,x_2$ 位置关系
        to: 若 $x_1>x_2$ 则只能在 $\frac1e<x_2<1$ 的大分支，故 $x_2<1$；当 $x_2>1$ 且 $x_1=1+\ln x_2$ 时有 $x_1<x_2$ 但 $x_1>1$，故 B 错；$x_1=x_2=1$ 存在
        operation: 按条件筛选分支，分别验证或构造反例。
        why: 选项 A、B、C 都是等值点分支位置的直接读出。
      source_ref: page_0033
    - step_id: step_8
      statement: 在右侧大分支上证明距离随变量增大而增大。
      formula_trace:
        from: $x_1>1,\ x_2>1,\ f(x_1)=f(1+\ln x_2)$
        to: |
          $x_1=1+\ln x_2,\quad |x_2-x_1|=x_2-\ln x_2-1$，且 $\left(x-\ln x-1\right)'=1-\frac1x>0\ (x>1)$。
        operation: 取 $x_0=1$，由 $f$ 在 $(1,+\infty)$ 上严格递增得到 $x_1=1+\ln x_2$；再对 $h(x)=x-\ln x-1$ 求导。
        why: 当 $x_2>1$ 增大时，$x_1=1+\ln x_2$ 也增大，而距离 $h(x_2)$ 严格增大。
      source_ref: page_0033
teaching_card:
  student_title: 把 $x/(1+\ln x)$ 变成同一个 $f$ 的等值点
  what_it_trains: 训练把两个看似不同的函数化成同一个函数的不同输入，再用单调分支判断变量位置和距离变化。
  recognition_cues:
    - 一个函数是 $e^{x-1}/x$，另一个是 $x/(1+\ln x)$。
    - 题目只给 $f(x_1)=g(x_2)$，要求判断 $x_1,x_2$ 的相对位置。
    - 图像都围绕 $x=1$ 的最小值和两侧等值点展开。
  normalization_moves:
    - 把 $g(x)$ 写成 $f(1+\ln x)$。
    - 设 $t=1+\ln x_2$，按 $t$ 落在负半轴、$(0,1)$、$1$、$(1,+\infty)$ 分类。
    - 当 $x_1,x_2>1$ 时，用 $x_1=1+\ln x_2$ 化出距离 $x_2-\ln x_2-1$。
  common_failures:
    - 只看 $x\ge1+\ln x$，误以为可以直接比较 $f(x)$ 与 $f(1+\ln x)$。
    - 忘记 $f$ 在负半轴和正半轴被 $x=0$ 分开，导致第①类情况漏解。
    - 把 B 当成 A 的对称命题，忽略 $x_2>1$ 时 $x_1=1+\ln x_2>1$ 仍小于 $x_2$。
  similar_practice_query: e^(x-1)/x x/(1+ln x) 同构 等值点 分支 距离
quality:
  confidence: medium
  needs_review: false
  review_notes:
    - page_0033 图像已核对；例24不跨页。
    - 源解析有三个可由数学确认的小瑕疵：$f(x)\ge f(1+\ln x)$ 的概括不全局成立、第①类中等式误写为差小于零、$x_2$ 下界应为 $>0$。本卡按等值方程和导数分支重建，结论仍为 ACD。
    - reviewer 修正：choices 统一为 label/text_raw/text_latex 结构；goal 改为抽象函数性质；结构标签从极值点偏移改为 Max/Min 与绝对值结构。
