original_problem:
  stem: （2023 · 大荔县一模 T14）已知函数 $f(x)=\frac{e^x}{x}+a(x-\ln x)$（$e$ 为自然对数的底数）。若函数 $f(x)$ 在 $x\in\left(\frac12,2\right)$ 上有三个不同的极值点，则实数 $a$ 的取值范围为________。
  parts: *a1
  choices: []
  answer: $(-2\sqrt e,-e)$
  fidelity_notes:
    - 源题为填空题，无选项。
solution:
  source_solution_summary: 源解先求导并因式分解： $f^{\prime}(x)=\frac{(x-1)(e^x+ax)}{x^2}$。 题设“有三个不同极值点”等价于 $f^{\prime}(x)=0$ 在 $(\frac12,2)$ 有三个不同根； 其中固定根是 $x=1$，因此 $e^x+ax=0$ 需在该区间再给出两个不同根。 令 $g(x)=-\frac{e^x}{x}$，则 $a=g(x)$。由 $g^{\prime}(x)=-\frac{e^x(x-1)}{x^2}$， $g$ 在 $(\frac12,1)$ 递增、在 $(1,2)$ 递减， 且 $g(1)=-e,\ g(\frac12)=-2\sqrt e,\ g(2)=-\frac12e^2$。 要在左右两侧各交一次，需 $-2\sqrt e<a<-e$，故答案为 $(-2\sqrt e,-e)$。
  key_steps:
    - step_id: step_1
      statement: 把三极值条件转成三零点条件。
      formula_trace:
        from: $f(x)=\frac{e^x}{x}+a(x-\ln x)$
        to: $f^{\prime}(x)=\frac{(x-1)(e^x+ax)}{x^2}$
        operation: 求导并通分因式分解。
        why: 极值点来自 $f^{\prime}(x)=0$ 的变号零点。
      source_ref: page_0184
    - step_id: step_2
      statement: 拆出固定零点与变化零点。
      formula_trace:
        from: $f^{\prime}(x)=0$ 在 $(\frac12,2)$ 有三个不同根
        to: $x=1$ 为固定根，且 $e^x+ax=0$ 在 $(\frac12,2)$ 另有两根
        operation: 利用因子 $(x-1)$。
        why: 题设三根中一个已知，参数只影响其余两个。
      source_ref: page_0184
    - step_id: step_3
      statement: 由 $a=-\frac{e^x}{x}$ 的图像值域取参。
      formula_trace:
        from: $a=g(x),\ g(x)=-\frac{e^x}{x}$
        to: $-2\sqrt e<a<-e$
        operation: 用单调性与端点/极值点函数值判交点个数。
        why: 要左右两段各有一个解且不与固定根重合。
      source_ref: page_0184
teaching_card:
  student_title: 一根固定，两根看参数曲线
  what_it_trains: 训练把“三极值”转成“导数三零点”，再用固定零点拆出参数控制的两根。
  recognition_cues:
    - 题目给的是“有三个不同极值点”。
    - 导数可分解出显式因子 $(x-1)$。
    - 参数只在线性项 $ax$ 里出现。
  normalization_moves:
    - 先因式分解导函数。
    - 固定根单独拿出。
    - 把 $a$ 改写成函数值并看左右各一交。
  common_failures:
    - 把 $a=-e$ 误包含，导致与固定根重合。
    - 把 $x=\frac12$ 当作可取根，忽略开区间。
    - 只看 $(1,2)$ 一侧，漏掉左侧根条件。
  similar_practice_query: 定零点 变化零点 三极值 导函数分解 a=-e^x/x
