stem: （2023 · 大荔县一模 T14）已知函数 $f(x)=\frac{e^x}{x}+a(x-\ln x)$（$e$ 为自然对数的底数）。若函数 $f(x)$ 在 $x\in\left(\frac12,2\right)$ 上有三个不同的极值点，则实数 $a$ 的取值范围为________。
answer: |-
  $(-2\sqrt e,-e)$

  源解先求导并因式分解： $f^{\prime}(x)=\frac{(x-1)(e^x+ax)}{x^2}$。 题设“有三个不同极值点”等价于 $f^{\prime}(x)=0$ 在 $(\frac12,2)$ 有三个不同根； 其中固定根是 $x=1$，因此 $e^x+ax=0$ 需在该区间再给出两个不同根。 令 $g(x)=-\frac{e^x}{x}$，则 $a=g(x)$。由 $g^{\prime}(x)=-\frac{e^x(x-1)}{x^2}$， $g$ 在 $(\frac12,1)$ 递增、在 $(1,2)$ 递减， 且 $g(1)=-e,\ g(\frac12)=-2\sqrt e,\ g(2)=-\frac12e^2$。 要在左右两侧各交一次，需 $-2\sqrt e<a<-e$，故答案为 $(-2\sqrt e,-e)$。
