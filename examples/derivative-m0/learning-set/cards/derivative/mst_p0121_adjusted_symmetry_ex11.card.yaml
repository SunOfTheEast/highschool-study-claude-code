solution:
  source_solution_summary: |
    因为 $f(x+1)$ 是奇函数，令 $x=0$ 得 $f(1)=0$，A正确。
    由 $f(1-x)=-f(1+x)$ 求导，得
    $f^{\prime}(1+x)=f^{\prime}(1-x)$，B正确。
    又 $g(x)=(x-1)f(x)$，于是
    $g(1+x)=x f(1+x)$，$g(1-x)=-x f(1-x)=x f(1+x)$，
    所以 $g(1+x)=g(1-x)$，即 $g$ 关于 $x=1$ 轴对称。
    对这个轴对称关系求导应得
    $g^{\prime}(1+x)=-g^{\prime}(1-x)$，所以C错误。
    由于 $g$ 关于 $x=1$ 对称，且在 $(-\infty,1]$ 上递增，
    所以在 $(1,+\infty)$ 上递减，并且 $g(x)\le g(1)=0$，
    等号只在 $x=1$ 处取到。由
    $e^{0.1}>1+\ln1.1$，可得
    $2-e^{0.1}<1-\ln1.1<1$。又由轴对称
    $g(e^{0.1})=g(2-e^{0.1})$，而 $g$ 在 $(-\infty,1]$
    上递增，所以
    $g(e^{0.1})<g(1-\ln1.1)<0$，D正确。
  key_steps:
    - step_id: step_1
      statement: 由平移奇函数得到中心值和导函数轴对称。
      formula_trace:
        from: $f(x+1)$ 是奇函数
        to: $f(1)=0$，$f^{\prime}(1+x)=f^{\prime}(1-x)$
        operation: 令 $x=0$，并对 $f(1-x)=-f(1+x)$ 求导。
        why: 直接判断 A、B。
      source_ref: page_0121
    - step_id: step_2
      statement: 两个同中心对象相乘，得到 $g$ 的轴对称。
      formula_trace:
        from: $g(x)=(x-1)f(x)$，$f(1-x)=-f(1+x)$
        to: $g(1+x)=g(1-x)$
        operation: 将 $x=1\pm t$ 代入并利用奇性抵消负号。
        why: 这是判断 $g$ 单调延拓和 C 项导数关系的核心。
      source_ref: page_0121
    - step_id: step_3
      statement: 对轴对称函数求导，排除 C。
      formula_trace:
        from: $g(1+x)=g(1-x)$
        to: $g^{\prime}(1+x)=-g^{\prime}(1-x)$
        operation: 两边对 $x$ 求导，右侧出现链式负号。
        why: C 少了负号，因此不成立。
      source_ref: page_0121
    - step_id: step_4
      statement: 先把右侧点关于 $x=1$ 翻回左侧，再比较。
      formula_trace:
        from: $g$ 关于 $x=1$ 对称且左侧递增
        to: $g(e^{0.1})=g(2-e^{0.1})<g(1-\ln1.1)<0$
        operation: 用 $e^{0.1}>1+\ln1.1$ 得 $2-e^{0.1}<1-\ln1.1$，再在左侧递增区间比较。
        why: D项的两个输入分居对称轴两侧，必须先翻折再比较。
      source_ref: page_0121
teaching_card:
  student_title: 同中心相乘，会把中心对称变成轴对称
  what_it_trains: 训练识别对称中心相同的两个因子相乘后形成轴对称，并用轴对称翻折单调性。
  recognition_cues:
    - 题干同时出现 $f(x+1)$ 奇函数和因子 $x-1$。
    - $g(x)=(x-1)f(x)$ 是围绕 $x=1$ 的乘积构造。
    - 选项问 $g^{\prime}(1+x)$ 与 $g^{\prime}(1-x)$，要警惕链式负号。
  normalization_moves:
    - 先把中心点统一到 $x=1$。
    - 写 $g(1+x)$、$g(1-x)$。
    - 由 $g$ 的轴对称推导右侧单调性。
    - 再比较指数、对数输入位置。
  common_failures:
    - 只看到 $f$ 的奇性，没有把 $(x-1)$ 也看成同中心对象。
    - 把 $g$ 的轴对称导成 $g^{\prime}(1+x)=g^{\prime}(1-x)$。
    - 对称轴右侧单调方向没有反过来。
    - 直接在右侧比较 $e^{0.1}$ 和 $1-\ln1.1$，忘记先用轴对称翻回左侧。
  similar_practice_query: f(x+1) 奇函数 (x-1)f(x) 对称性调整 单调性 指数对数比较
quality:
  confidence: medium
  needs_review: false
  review_notes:
    - D项需要先利用 $g$ 关于 $x=1$ 的轴对称，将 $e^{0.1}$ 翻折为 $2-e^{0.1}$，再与 $1-\ln1.1$ 在左侧递增区间比较。
