stem: |-
  （2023 · 厦门月考 · 多选）已知函数 $f(x)$ 定义域为 $\mathbf{R}$，$f(x+1)$ 是奇函数，$g(x)=(x-1)f(x)$，$f^{\prime}(x)$，$g^{\prime}(x)$ 分别是函数 $f(x)$，$g(x)$ 的导函数，函数 $g(x)$ 在区间 $(-\infty,1]$ 上单调递增，则（  ）
  A. $f(1)=0$
  B. $f^{\prime}(1+x)=f^{\prime}(1-x)$
  C. $g^{\prime}(1+x)=g^{\prime}(1-x)$
  D. $g(e^{0.1})<g(1-\ln1.1)<0$
answer: |
  ABD

  因为 $f(x+1)$ 是奇函数，令 $x=0$ 得 $f(1)=0$，A正确。
  由 $f(1-x)=-f(1+x)$ 求导，得
  $f^{\prime}(1+x)=f^{\prime}(1-x)$，B正确。
  又 $g(x)=(x-1)f(x)$，于是
  $g(1+x)=x f(1+x)$，$g(1-x)=-x f(1-x)=x f(1+x)$，
  所以 $g(1+x)=g(1-x)$，即 $g$ 关于 $x=1$ 轴对称。
  对这个轴对称关系求导应得
  $g^{\prime}(1+x)=-g^{\prime}(1-x)$，所以C错误。
  由于 $g$ 关于 $x=1$ 对称，且在 $(-\infty,1]$ 上递增，
  所以在 $(1,+\infty)$ 上递减，并且 $g(x)\le g(1)=0$，
  等号只在 $x=1$ 处取到。由
  $e^{0.1}>1+\ln1.1$，可得
  $2-e^{0.1}<1-\ln1.1<1$。又由轴对称
  $g(e^{0.1})=g(2-e^{0.1})$，而 $g$ 在 $(-\infty,1]$
  上递增，所以
  $g(e^{0.1})<g(1-\ln1.1)<0$，D正确。
