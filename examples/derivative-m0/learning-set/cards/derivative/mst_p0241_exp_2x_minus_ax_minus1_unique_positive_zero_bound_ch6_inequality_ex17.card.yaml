original_problem:
  stem: （2025 · 黑龙江六校高三期末 T17）已知函数 $f(x)=e^{2x}-ax-1$。
  parts: *a1
  choices: []
  answer: 第 (1) 问：若 $a\leqslant0$，$f$ 在 $\mathbf R$ 单调递增；若 $a>0$，$f$ 在 $(-\infty,\frac12\ln\frac a2)$ 单调递减，在 $(\frac12\ln\frac a2,+\infty)$ 单调递增。第 (2) 问：$x_0<a-2$。
  fidelity_notes:
    - 两问均无选项。
    - 第 (2) 问条件只在 $(0,+\infty)$ 上唯一零点。
solution:
  source_solution_summary: $f'(x)=2e^{2x}-a$。若 $a\leqslant0$，则 $f'(x)>0$，全域递增。 若 $a>0$，临界点为 $x=\frac12\ln(a/2)$，左减右增。第 (2) 问， 由 $f(x_0)=0$ 得 $a=(e^{2x_0}-1)/x_0$。要证 $x_0<a-2$，只需证 $e^{2x_0}-(x_0+1)^2>0$。令 $h(x)=e^{2x}-(x+1)^2$，通过 $h'(x)=2e^{2x}-2(x+1)$ 和继续求导， 得 $h$ 在 $x>0$ 上递增且 $h(0)=0$，所以成立。法二从唯一正零点 推出 $a>2$，再用 $e^{2x}>1+2x+2x^2$ 得 $f(x)>2x^2+(2-a)x$，从而 $x_0<(a-2)/2<a-2$。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问先求导。
      formula_trace:
        from: $f(x)=e^{2x}-ax-1$
        to: $f^\prime(x)=2e^{2x}-a$
        operation: 逐项求导。
        why: 单调区间由 $2e^{2x}$ 与 $a$ 的比较决定。
      source_ref: page_0242_ex17_continuation
    - step_id: step_2
      statement: 按 $a$ 的符号分类单调性。
      formula_trace:
        from: $f^\prime(x)=2e^{2x}-a$
        to: $a\leq0$ 全增；$a>0$ 时临界点 $\frac12\ln\frac a2$
        operation: 解 $f^\prime(x)=0$。
        why: 这是第 (1) 问完整结论。
      source_ref: page_0242_ex17_continuation
    - step_id: step_3
      statement: 法一先用零点方程分离参数。
      formula_trace:
        from: $f(x_0)=e^{2x_0}-ax_0-1=0$
        to: $a=\frac{e^{2x_0}-1}{x_0}$
        operation: 解出 $a$。
        why: 目标 $x_0<a-2$ 中同时有 $a$ 和 $x_0$，先消掉 $a$。
      source_ref: page_0242_ex17_continuation
    - step_id: step_4
      statement: 把目标转成纯 $x_0$ 不等式。
      formula_trace:
        from: $x_0<\frac{e^{2x_0}-1}{x_0}-2$
        to: $e^{2x_0}-(x_0+1)^2>0$
        operation: 移项整理。
        why: 剩下只需要证明一个标准指数不等式。
      source_ref: page_0242_ex17_continuation
    - step_id: step_5
      statement: 用导数证明 $e^{2x}>(x+1)^2$。
      formula_trace:
        from: $h(x)=e^{2x}-(x+1)^2$
        to: $h(x)>h(0)=0$ for $x>0$
        operation: 证明 $h^\prime(x)>0$。
        why: 这直接完成法一。
      source_ref: page_0242_ex17_continuation
    - step_id: step_6
      statement: 法二用放缩直接定位零点上界。
      formula_trace:
        from: $e^{2x}>1+2x+2x^2$
        to: $f(x)>2x^2+(2-a)x$
        operation: 用指数展开的下界。
        why: 在正半轴找到一个比零点更右的正值点。
      source_ref: page_0242_ex17_continuation
    - step_id: step_7
      statement: 由法二得到更强结论。
      formula_trace:
        from: $2x^2+(2-a)x=0$
        to: $x_0<\frac{a-2}{2}<a-2$
        operation: 解二次下界的正根。
        why: 这给出比题目要求更强的上界。
      source_ref: page_0242_ex17_continuation
