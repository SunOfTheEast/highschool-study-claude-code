stem: |-
  （2025 · 黑龙江六校高三期末 T17）已知函数 $f(x)=e^{2x}-ax-1$。
  1. 讨论 $f(x)$ 的单调区间。
  2. 若 $f(x)$ 在区间 $(0,+\infty)$ 上存在唯一零点 $x_0$，证明：$x_0<a-2$。
answer: |-
  第 (1) 问：若 $a\leqslant0$，$f$ 在 $\mathbf R$ 单调递增；若 $a>0$，$f$ 在 $(-\infty,\frac12\ln\frac a2)$ 单调递减，在 $(\frac12\ln\frac a2,+\infty)$ 单调递增。第 (2) 问：$x_0<a-2$。

  $f'(x)=2e^{2x}-a$。若 $a\leqslant0$，则 $f'(x)>0$，全域递增。 若 $a>0$，临界点为 $x=\frac12\ln(a/2)$，左减右增。第 (2) 问， 由 $f(x_0)=0$ 得 $a=(e^{2x_0}-1)/x_0$。要证 $x_0<a-2$，只需证 $e^{2x_0}-(x_0+1)^2>0$。令 $h(x)=e^{2x}-(x+1)^2$，通过 $h'(x)=2e^{2x}-2(x+1)$ 和继续求导， 得 $h$ 在 $x>0$ 上递增且 $h(0)=0$，所以成立。法二从唯一正零点 推出 $a>2$，再用 $e^{2x}>1+2x+2x^2$ 得 $f(x)>2x^2+(2-a)x$，从而 $x_0<(a-2)/2<a-2$。
