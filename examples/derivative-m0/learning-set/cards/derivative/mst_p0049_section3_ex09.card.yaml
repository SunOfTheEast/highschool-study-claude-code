stem: |-
  （2025 春 · 静安区高二期末 T17）设函数 $f(x)=e^x-ax$，$a\in\mathbf R$。
  (1). 讨论 $y=f(x)$ 的单调性。
  (2). 当 $x\ge0$ 时，$f(x)\ge(x+1)^2$ 恒成立，求 $a$ 的取值范围。
answer: |-
  (1) 当 $a\le0$ 时，$f(x)$ 在 $\mathbf R$ 上单调递增；当 $a>0$ 时，$f(x)$ 在 $(-\infty,\ln a)$ 上单调递减，在 $(\ln a,+\infty)$ 上单调递增。 (2) $a\le e-4$。

  f'(x)=e^x-a。若 a<=0，则 f'(x)>0，函数在 R 上递增； 若 a>0，则 f'(x)=0 给 x=ln a，x<ln a 时导数为负， x>ln a 时导数为正，所以先减后增。第 (2) 问设 g(x)=e^x-ax-(x+1)^2。因 g(0)=0，只需在 x>0 上保证 g(x)>=0。写成 g(x)=x([(e^x-(x+1)^2)/x]-a)，令 h(x)=(e^x-(x+1)^2)/x。计算 h'(x)=((e^x-x-1)(x-1))/x^2；由于 x>0 时 e^x-x-1>0， h 在 (0,1) 减、在 (1,+infty) 增，最小值 h(1)=e-4。 因而恒成立等价于 a<=e-4。
