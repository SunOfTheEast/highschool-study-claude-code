stem: |-
  （2024 广东深圳外国语一调 · 多选 T12）已知函数 $f(x)=a^x\ln a$，$g(x)=a\ln(x-1)$，其中 $a>0$，且 $a\ne1$。若函数 $h(x)=f(x)-g(x)$，则下列结论正确的是（  ）
  A. 当 $0<a<1$ 时，$h(x)$ 有且只有一个零点
  B. 当 $1<a<e^{\frac{1}{e}}$ 时，$h(x)$ 有两个零点
  C. 当 $a>e^{\frac{1}{e}}$ 时，曲线 $y=f(x)$ 与曲线 $y=g(x)$ 有且只有两条公切线
  D. 若 $h(x)$ 为单调函数，则 $e^{-e}<a<1$
answer: |
  BC

  由 $f(x)=g(x)$ 得
  $a^x\ln a=a\ln(x-1)$，即
  $a^{x-1}=\log_a(x-1)$。令 $t=x-1>0$，问题转为比较
  $y=a^t$ 与 $y=\log_a t$。当 $a>1$ 时，临界来自
  $a^t$ 与直线 $y=t$ 的切触：
  $a^t>t\iff t\ln a>\ln t$，而
  $\max_{t>0}\frac{\ln t}{t}=\frac1e$。所以
  $a>e^{1/e}$ 时两函数无交点并出现两条公切线，C 正确；
  $1<a<e^{1/e}$ 时有两个交点，即 $h$ 有两个零点，B 正确。
  当 $0<a<1$ 时，临界相切满足两曲线同过 $y=t$ 且斜率为 $-1$：
  $\frac1{t_0\ln a}=-1$，$a^{t_0}=t_0$，解得
  $t_0=1/e$，$a=e^{-e}$。源页据此判定 A 错，并用拟合类比说明
  单调时应落在 $e^{-e}<a<1$，故源页答案为 BCD。
  严格复核 D 项：令 $r=-\ln a>0$，则
  $h^\prime$ 的符号由 $r^2te^{-rt}-1$ 决定；函数 $r^2te^{-rt}$
  的最大值为 $r/e$。所以当 $r\le e$，即 $a\ge e^{-e}$ 时，
  $h^\prime\le0$，函数单调递减；当 $r>e$ 时，导数变号，函数不单调。
  因此标准单调口径下单调区间应为 $e^{-e}\le a<1$，D 项严格写
  $e^{-e}<a<1$ 少了边界，应判错，最终答案为 BC。
