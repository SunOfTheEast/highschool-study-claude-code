stem: |-
  （多选）若实数 $t\ge2$，则下列不等式一定成立的是（  ）
  A. $(t+3)\ln(t+2)>(t+2)\ln(t+3)$
  B. $(t+1)^{t+2}>(t+2)^{t+1}$
  C. $1+\frac1t>\log_t(t+1)$
  D. $\log_{t+1}(t+2)>\log_{t+2}(t+3)$
answer: |
  ABD

  构造
  \[
  g(x)=\frac{\ln x}{x}.
  \]
  有 $g$ 在 $(0,e)$ 递增、在 $(e,+\infty)$ 递减。

  对 A：
  \[
  (t+3)\ln(t+2)>(t+2)\ln(t+3)
  \Longleftrightarrow
  \frac{\ln(t+2)}{t+2}>\frac{\ln(t+3)}{t+3}
  \Longleftrightarrow
  g(t+2)>g(t+3).
  \]
  由于 $t\ge2\Rightarrow t+2\ge4>e$，在递减区间上有 $g(t+2)>g(t+3)$，故 A 对。

  对 B：取对数后
  \[
  (t+2)\ln(t+1)>(t+1)\ln(t+2)
  \Longleftrightarrow
  \frac{\ln(t+1)}{t+1}>\frac{\ln(t+2)}{t+2}
  \Longleftrightarrow
  g(t+1)>g(t+2).
  \]
  且 $t+1\ge3>e$，故 B 对。

  对 C：
  \[
  1+\frac1t>\log_t(t+1)
  \Longleftrightarrow
  (t+1)\ln t>t\ln(t+1)
  \Longleftrightarrow
  g(t)>g(t+1).
  \]
  该比较不恒成立：如 $t=2$ 时不成立，而 $t=4$ 时成立，因此 C 不是“必然成立”。

  对 D：
  \[
  \log_{t+1}(t+2)>\log_{t+2}(t+3)
  \Longleftrightarrow
  [\ln(t+2)]^2>\ln(t+1)\ln(t+3).
  \]
  源解给出
  \[
  \ln(t+1)\ln(t+3)
  <\left[\frac{\ln(t+1)+\ln(t+3)}{2}\right]^2
  =\left[\frac{\ln((t+1)(t+3))}{2}\right]^2
  <\ln^2(t+2),
  \]
  从而 D 对。

  所以正确选项为 ABD。
