  student_title: 四选项同框：先统一到 $\frac{\ln x}{x}$
  what_it_trains: 训练“必然成立”型多选中，先统一结构、再分类判真假的策略。
  recognition_cues:
    - 多选题，关键词是“对任意 $t\ge2$ 恒成立”。
    - 选项混合出现幂式、对数式、乘积式。
    - 存在明显可换底/可对数化入口。
  normalization_moves:
    - 优先尝试 $g(x)=\frac{\ln x}{x}$。
    - 把幂比较先取对数。
    - 对“恒成立”选项用反例快速验伪。
  common_failures:
    - 把“某些 $t$ 成立”误当“对所有 $t$ 成立”。
    - 换底后漏掉分母正值条件，方向判断混乱。
    - D项只凭直觉比较对数底数，未做严格变形。
