original_problem:
  stem: （2024 · 重庆江北区模拟）设 $a>0$，$f(x)=e^{x-1}+x^2+\frac{x}{a^2}$，$g(x)=\frac{a(\ln x+2)}{x}+2\sqrt{x}$。若 $\frac ax f(x)\ge g(x)$ 对任意 $x\in(0,+\infty)$ 恒成立，求 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\in(0,\frac12]$。
  fidelity_notes:
    - 无选项。
    - 题设已给 $a>0$，所以令 $m=\frac1a$ 后最终要把 $m\ge2$ 翻译为 $0<a\le\frac12$。
solution:
  source_solution_summary: 原不等式等价于 $\frac1{a^2}-\frac{2\sqrt x}{a}+x\ge\frac1x(\ln x-e^{x-1}+2)$。 令 $m=\frac1a$，化为 $h(x)=x(\sqrt x-m)^2-(\ln x-e^{x-1}+2)\ge0$。临界边界按隐点探路列 $h(x_0)=0,h^\prime(x_0)=0$，由 $h^\prime(x_0)=2x_0-3m\sqrt{x_0}+m^2-\frac1{x_0}+e^{x_0-1}=0$ 表示 $m$，代回 $h(x_0)=0$ 后得到关于 $x_0$ 的方程，探得 $x_0=1$， 从而 $m\ge2$，即 $0<a\le\frac12$。充分性证明再固定 $m\ge2$： 令 $t(x)=\ln x-e^{x-1}+2$，$t$ 在 $(0,1)$ 递增、在 $(1,+\infty)$ 递减。若 $x\ge2$，则 $t(x)\le t(2)<0$，$h(x)\ge0$。若 $0<x<2$， 因 $(\sqrt x-m)^2$ 对 $m\in[2,+\infty)$ 递增，只需证明 $x(\sqrt x-2)^2\ge \ln x-e^{x-1}+2$。令 $F(x)=x^2-4x\sqrt x+4x-\ln x+e^{x-1}-2$，分 $(0,1)$ 与 $(1,2)$ 证明 $F$ 先减后增，且 $F(1)=0$，故 $F(x)\ge0$。综上 $a\in(0,\frac12]$。
  key_steps:
    - step_id: step_1
      statement: 先把原式整理成一个恒成立不等式。
      formula_trace:
        from: $\frac ax\left(e^{x-1}+x^2+\frac{x}{a^2}\right)\ge\frac{a(\ln x+2)}x+2\sqrt x$
        to: $\frac1{a^2}-\frac{2\sqrt x}{a}+x\ge\frac1x(\ln x-e^{x-1}+2)$
        operation: 移项并同除正量 $\frac ax$。
        why: 把参数项、根式项、指对项分到便于配方的位置。
      source_ref: page_0312_ex11_normalization
    - step_id: step_2
      statement: 令 $m=\frac1a$，把参数配成平方。
      formula_trace:
        from: $m^2-2m\sqrt x+x\ge\frac1x(\ln x-e^{x-1}+2)$
        to: $h(x)=x(\sqrt x-m)^2-(\ln x-e^{x-1}+2)\ge0$
        operation: 同乘 $x>0$，并把 $m^2-2m\sqrt x+x$ 写成 $(\sqrt x-m)^2$。
        why: 平方结构给后面的 $m\ge2$ 和充分性单调比较留下入口。
      source_ref: page_0312_ex11_normalization
    - step_id: step_3
      statement: 用双重接触点探路边界。
      formula_trace:
        from: $h(x_0)=0,\quad h^\prime(x_0)=0$
        to: $x_0=1,\quad m\ge2$
        operation: 由 $h^\prime(x_0)=0$ 表示 $m$，代回 $h(x_0)=0$ 后探得 $x_0=1$。
        why: 恒成立的临界参数常由函数图像刚好接触零线给出。
      source_ref: page_0313_ex11_hidden_point_explore
    - step_id: step_4
      statement: 把必要边界翻译回 $a$。
      formula_trace:
        from: $m=\frac1a,\quad m\ge2,\quad a>0$
        to: $0<a\le\frac12$
        operation: 正数取倒数。
        why: 原题问的是 $a$ 的取值范围。
      source_ref: page_0313_ex11_hidden_point_explore
    - step_id: step_5
      statement: 证明 $m\ge2$ 时充分。
      formula_trace:
        from: $t(x)=\ln x-e^{x-1}+2,\quad t^\prime(x)=\frac1x-e^{x-1}$
        to: $x\ge2$ 时 $t(x)\le t(2)=2+\ln2-e<0$
        operation: 分析 $t$ 在 $1$ 左右的单调性。
        why: $x\ge2$ 时右侧指对项已经为负，平方项自然压住它。
      source_ref: page_0313_ex11_sufficiency_t
    - step_id: step_6
      statement: 在 $0<x<2$ 用最小的 $m=2$ 降维。
      formula_trace:
        from: $x(\sqrt x-m)^2\ge x(\sqrt x-2)^2$
        to: $F(x)=x^2-4x\sqrt x+4x-\ln x+e^{x-1}-2\ge0$
        operation: 利用 $(\sqrt x-m)^2$ 对 $m\ge2$ 递增，把问题压到边界 $m=2$。
        why: 参数已经只剩边界值，证明量降成单变量不等式。
      source_ref: page_0313_ex11_sufficiency_F
    - step_id: step_7
      statement: 分 $(0,1)$ 与 $(1,2)$ 证明 $F(x)\ge0$。
      formula_trace:
        from: $F^\prime(x)=2x-6\sqrt x+4-\frac1x+e^{x-1}$
        to: $F(x)>F(1)=0$
        operation: 在 $(0,1)$ 用 $e^{x-1}<1$ 得 $F^\prime<0$；在 $(1,2)$ 用 $e^{x-1}>x$ 得 $F^\prime>0$。
        why: $F$ 以 $x=1$ 为谷底，完成充分性。
      source_ref: page_0313_ex11_sufficiency_F
teaching_card:
  student_title: 把参数配成平方，再探临界点
  what_it_trains: 训练含根式、指数、对数的恒成立求参：先把参数整理成平方结构，用临界接触点找边界，再回头证明充分。
  recognition_cues:
    - 题目要求对所有 $x>0$ 恒成立。
    - 原式同时含 $a$、$\frac1{a^2}$、$\sqrt x$、$\ln x$、$e^{x-1}$。
    - 整理后能出现 $m^2-2m\sqrt x+x$。
    - 临界点很可能落在 $x=1$，因为 $\ln1=0$、$e^0=1$。
  normalization_moves:
    - 先不要硬求原函数最值。
    - 把 $a$ 换成 $m=1/a$。
    - 把 $m^2-2m\sqrt x+x$ 配成 $(\sqrt x-m)^2$。
    - 用 $h=0,h^\prime=0$ 探边界。
    - 拿到边界后必须证明充分性。
  common_failures:
    - 只会移项，没看出平方结构。
    - 把 $x_0=1$ 当成猜答案，缺少双重接触解释。
    - 得到 $m\ge2$ 后忘记换回 $a$。
    - 只做必要条件，没有证明 $m\ge2$ 都成立。
    - 在 $0<x<2$ 的充分性里不会把 $m$ 压到边界 $m=2$。
  similar_practice_query: 重庆江北 2024 根式 指数对数 恒成立 m=1/a 平方结构 隐点探路 x0=1
quality:
  confidence: high
