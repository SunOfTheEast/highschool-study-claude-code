stem: |-
  （2024 · 重庆江北区模拟）设 $a>0$，$f(x)=e^{x-1}+x^2+\frac{x}{a^2}$，$g(x)=\frac{a(\ln x+2)}{x}+2\sqrt{x}$。若 $\frac ax f(x)\ge g(x)$ 对任意 $x\in(0,+\infty)$ 恒成立，求 $a$ 的取值范围。
  1. 求 $a$ 的取值范围。
answer: |-
  $a\in(0,\frac12]$。

  原不等式等价于 $\frac1{a^2}-\frac{2\sqrt x}{a}+x\ge\frac1x(\ln x-e^{x-1}+2)$。 令 $m=\frac1a$，化为 $h(x)=x(\sqrt x-m)^2-(\ln x-e^{x-1}+2)\ge0$。临界边界按隐点探路列 $h(x_0)=0,h^\prime(x_0)=0$，由 $h^\prime(x_0)=2x_0-3m\sqrt{x_0}+m^2-\frac1{x_0}+e^{x_0-1}=0$ 表示 $m$，代回 $h(x_0)=0$ 后得到关于 $x_0$ 的方程，探得 $x_0=1$， 从而 $m\ge2$，即 $0<a\le\frac12$。充分性证明再固定 $m\ge2$： 令 $t(x)=\ln x-e^{x-1}+2$，$t$ 在 $(0,1)$ 递增、在 $(1,+\infty)$ 递减。若 $x\ge2$，则 $t(x)\le t(2)<0$，$h(x)\ge0$。若 $0<x<2$， 因 $(\sqrt x-m)^2$ 对 $m\in[2,+\infty)$ 递增，只需证明 $x(\sqrt x-2)^2\ge \ln x-e^{x-1}+2$。令 $F(x)=x^2-4x\sqrt x+4x-\ln x+e^{x-1}-2$，分 $(0,1)$ 与 $(1,2)$ 证明 $F$ 先减后增，且 $F(1)=0$，故 $F(x)\ge0$。综上 $a\in(0,\frac12]$。
