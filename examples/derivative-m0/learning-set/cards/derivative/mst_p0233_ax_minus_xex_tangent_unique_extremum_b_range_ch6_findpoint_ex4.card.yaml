stem: |-
  （2021 · 天津）已知 $a>0$，函数 $f(x)=ax-xe^x$。
  1. 求曲线 $f(x)$ 在点 $(0,f(0))$ 处的切线方程。
  2. 证明函数 $f(x)$ 存在唯一的极值点。
  3. 若 $\exists a$，使得 $f(x)\leqslant a+b$ 对任意的 $x\in\mathbf R$ 恒成立，求实数 $b$ 的取值范围。
answer: |-
  第 (1) 问：$y=(a-1)x$；第 (2) 问：$f$ 存在唯一极值点；第 (3) 问：$b\geqslant-e$。

  $f(0)=0$，$f'(x)=a-(x+1)e^x$，所以切线斜率为 $a-1$，切线方程 为 $y=(a-1)x$。第 (2) 问中，当 $x\leqslant-1$ 时 $f'(x)>0$； 当 $x>-1$ 时，$f''(x)=-(x+2)e^x<0$，故 $f'$ 递减，且 $f'(-1)>0$。为找右侧负值点，方案一 $f'(x)=(x+1)(a/(x+1)-e^x)$ 不能锁定 $a/(x+1)$；方案二 $f'(x)=e^x(a/e^x-x-1)<e^x(a/e^{-1}-x-1)$，取 $x=ea-1$ 得 $f'(ea-1)<0$，故存在唯一 $x_0\in(-1,ea-1)$ 使 $f'(x_0)=0$，从而 $f$ 有唯一极值点。第 (3) 问把恒成立改写为 $h(x)=xe^x-a(x-1)+b\geqslant0$，其导数与第 (2) 问同型，设唯一 极小值点为 $x_0$，则 $a=(x_0+1)e^{x_0}$，进而 $b\geqslant(x_0^2-x_0-1)e^{x_0}$。令 $t(x)=(x^2-x-1)e^x$，在 $x>-1$ 上最小值为 $t(1)=-e$，故 $b\geqslant-e$。
