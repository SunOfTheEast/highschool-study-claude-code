stem: |-
  （2024 · 广州二模）设函数 $f(x)=a\frac{x+1}{e^x}+x^2$，其中 $a\in\mathbf{R}$。
  1. 讨论 $f(x)$ 零点个数。
  2. 若 $f(x)$ 存在两个极值点，设极大值点为 $x_0$，$x_1$ 为 $f(x)$ 的零点，求证：$x_0-2x_1>2$。
answer: |-
  (1) $a<0$ 时两个零点，$a=0$ 时一个零点，$a>0$ 时一个零点；(2) $x_0-2x_1>2$。

  先求导： $f^\prime(x)=\frac{x}{e^x}(-a+2e^x)$。当 $a<0$ 时， $x=0$ 是唯一极小点，且 $f(0)=a<0$，左右各能找到正值，所以有两个零点。 当 $a=0$ 时，只有零点 $x=0$。当 $a>0$ 时，另一个驻点是 $\ln\frac a2$；source 通过极值高度和左侧取点证明只有一个零点，并定位 $x_1\in(-\frac{a+1}{a},-1)$。第(2)问中，两个极值点存在时 $a\in(0,2)\cup(2,+\infty)$。若 $a>2$，极大值点 $x_0=0$， 由 $x_1<-1$ 得 $x_0-2x_1>2$。若 $0<a<2$， $x_0=\ln\frac a2$。由 $f(x_1)=0$ 和 $a=2e^{x_0}$ 消参， 目标化为证明 $e^{x_0}>e^{2x_1+2}$。因为 $x_1+1<0$， 可等价转为 $x_1^2+2(x_1+1)e^{x_1+2}>0$，再用 $e^{x_1+2}>x_1+3$ 化成 $3x_1^2+8x_1+6>0$。
