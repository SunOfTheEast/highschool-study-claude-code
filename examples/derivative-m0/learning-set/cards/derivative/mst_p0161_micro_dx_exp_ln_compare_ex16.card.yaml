stem: |-
  （2022 新课标 I 卷）设 $a=0.1e^{0.1}$，$b=\frac{1}{9}$，$c=-\ln0.9$，则（  ）
  A. $a<b<c$
  B. $c<b<a$
  C. $c<a<b$
  D. $a<c<b$
answer: |
  C

  设
  \[
  A(x)=xe^x,\quad B(x)=\frac{x}{1-x},\quad C(x)=-\ln(1-x).
  \]
  三个量对应同一点 $x_0=0$、同增量 $\Delta x=0.1$ 的函数增量比较。
  首先
  \[
  A^{\prime}(0)=B^{\prime}(0)=C^{\prime}(0)=1.
  \]
  再看二阶导：
  \[
  A^{\prime\prime}(0)=2,\quad B^{\prime\prime}(0)=2,\quad C^{\prime\prime}(0)=1,
  \]
  得 $a>c$。
  再比较 $A,B$ 的三阶导：
  \[
  A^{\prime\prime\prime}(x)=(x+3)e^x,\ A^{\prime\prime\prime}(0)=3;\quad
  B^{\prime\prime\prime}(x)=\frac{6}{(x-1)^4},\ B^{\prime\prime\prime}(0)=6,
  \]
  所以 $b>a$。综合得
  \[
  b>a>c \iff c<a<b,
  \]
  选 C。法二泰勒展开也给出同结论。
