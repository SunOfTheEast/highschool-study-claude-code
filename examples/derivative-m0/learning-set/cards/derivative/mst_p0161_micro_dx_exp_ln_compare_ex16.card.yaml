solution:
  source_solution_summary: |
    设
    \[
    A(x)=xe^x,\quad B(x)=\frac{x}{1-x},\quad C(x)=-\ln(1-x).
    \]
    三个量对应同一点 $x_0=0$、同增量 $\Delta x=0.1$ 的函数增量比较。
    首先
    \[
    A^{\prime}(0)=B^{\prime}(0)=C^{\prime}(0)=1.
    \]
    再看二阶导：
    \[
    A^{\prime\prime}(0)=2,\quad B^{\prime\prime}(0)=2,\quad C^{\prime\prime}(0)=1,
    \]
    得 $a>c$。
    再比较 $A,B$ 的三阶导：
    \[
    A^{\prime\prime\prime}(x)=(x+3)e^x,\ A^{\prime\prime\prime}(0)=3;\quad
    B^{\prime\prime\prime}(x)=\frac{6}{(x-1)^4},\ B^{\prime\prime\prime}(0)=6,
    \]
    所以 $b>a$。综合得
    \[
    b>a>c \iff c<a<b,
    \]
    选 C。法二泰勒展开也给出同结论。
  key_steps:
    - step_id: step_1
      statement: 把三个数写成同一点同增量下的函数增量比较。
      formula_trace:
        from: $a=0.1e^{0.1},\ b=\frac{1}{9},\ c=-\ln0.9$
        to: $A(x)=xe^x,\ B(x)=\frac{x}{1-x},\ C(x)=-\ln(1-x)$ 且比较点都在 $x_0=0,\ \Delta x=0.1$
        operation: 同构改写并统一比较坐标。
        why: 把异构表达式转换为同一微元框架。
      source_ref: page_0161_ex16_solution
    - step_id: step_2
      statement: 一阶导在 $x_0=0$ 相同，进入二阶导比较。
      formula_trace:
        from: $A^{\prime}(0)=B^{\prime}(0)=C^{\prime}(0)=1$
        to: $A^{\prime\prime}(0)=B^{\prime\prime}(0)=2>1=C^{\prime\prime}(0)$
        operation: 同阶导相同则升阶比较。
        why: 先确定 $a,c$ 顺序为 $a>c$。
      source_ref: page_0161_ex16_solution
    - step_id: step_3
      statement: 在 $A,B$ 间继续比较三阶导。
      formula_trace:
        from: $A^{\prime\prime}(0)=B^{\prime\prime}(0)$
        to: $A^{\prime\prime\prime}(0)=3<6=B^{\prime\prime\prime}(0)$
        operation: 二阶持平后升到三阶判大小。
        why: 得到 $b>a$。
      source_ref: page_0161_ex16_solution
    - step_id: step_4
      statement: 合并比较结果对应选项。
      formula_trace:
        from: $b>a$ 且 $a>c$
        to: $b>a>c\iff c<a<b$
        operation: 传递比较并回写选项序。
        why: 完成答案匹配。
      source_ref: page_0161_ex16_solution
teaching_card:
  student_title: 同增量先看二阶，不够再看三阶
  what_it_trains: 训练把混合表达式统一成同一点微元比较，再按导数阶次逐层分出大小。
  recognition_cues:
    - 多个量都可写成某函数在 0 附近的小增量。
    - 出现指数、分式、对数组合且数值很接近。
    - 题目给的是排序选项，不要求精算。
  normalization_moves:
    - 先统一比较点与增量。
    - 同阶导若打平，就继续升一阶。
    - 最后把比较结论回写为选项顺序。
  common_failures:
    - 只看一阶导就直接下结论。
    - 忽略 $A,B$ 二阶导相同，导致 $a,b$ 顺序判错。
    - 把题干的 $c=-\ln0.9$ 误抄成 $\ln0.9$。
  similar_practice_query: 同增量 微元法 二阶三阶导 比大小
