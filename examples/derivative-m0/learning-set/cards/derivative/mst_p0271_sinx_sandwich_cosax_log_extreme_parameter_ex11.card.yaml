original_problem:
  stem: （2023 · 新高考Ⅱ）
  parts: *a1
  choices: []
  answer: 第(1)问：成立。第(2)问：$a\in(-\infty,-\sqrt2)\cup(\sqrt2,+\infty)$。
  fidelity_notes:
    - 无选项。
    - 第(2)问函数定义域为 $(-1,1)$。
solution:
  source_solution_summary: 第(1)问分别证明两边：设 $g=x-x^2-\sin x$，则 $g^{\prime\prime}=-2+\sin x<0$， $g^\prime<g^\prime(0)=0$，从而 $g<g(0)=0$，得 $x-x^2<\sin x$；再设 $h=x-\sin x$， $h^\prime=1-\cos x>0$，得 $\sin x<x$。第(2)问 $f^\prime(x)=-a\sin ax+\frac{2x}{1-x^2}$， $f^{\prime\prime}(0)=2-a^2$。若 $2-a^2>0$，则 0 右侧 $f$ 会递增，不能是极大值；若 $2-a^2<0$，则 0 附近左增右减， 满足极大值；若 $2-a^2=0$，由偶性只看 $a=\sqrt2$， 此时 $0<x<1$ 上 $f^\prime(x)>-2x+\frac{2x}{1-x^2}>0$， 仍与极大值矛盾。因此 $|a|>\sqrt2$。
  key_steps:
    - step_id: step_1
      statement: 证明左侧不等式 $x-x^2<\sin x$。
      formula_trace:
        from: $g(x)=x-x^2-\sin x$
        to: $g^{\prime\prime}(x)=-2+\sin x<0$，$g(x)<g(0)=0$
        operation: 二次求导判单调。
        why: 证明 $g$ 在 $(0,1)$ 上为负。
      source_ref: page_0271_ex11_solution_start
    - step_id: step_2
      statement: 证明右侧不等式 $\sin x<x$。
      formula_trace:
        from: $h(x)=x-\sin x$
        to: $h^\prime(x)=1-\cos x>0$，$h(x)>h(0)=0$
        operation: 构造差函数并判单调。
        why: 证明 $x-\sin x$ 为正。
      source_ref: page_0271_ex11_solution_start
    - step_id: step_3
      statement: 第(2)问：计算极值点的二阶信息。
      formula_trace:
        from: $f(x)=\cos ax-\ln(1-x^2)$
        to: $f^\prime(0)=0$，$f^{\prime\prime}(0)=2-a^2$
        operation: 求导并代入 0。
        why: 极大值点的局部形态由最低非零偶次项决定。
      source_ref: page_0271_ex11_solution_start
    - step_id: step_4
      statement: 排除 $2-a^2>0$。
      formula_trace:
        from: $-\sqrt2<a<\sqrt2$
        to: 存在 $t_1>0$，$0<x<t_1$ 时 $f^\prime(x)>0$
        operation: 由 $f^{\prime\prime}(0)>0$ 推出右侧递增。
        why: 右侧递增与 $x=0$ 为极大值点矛盾。
      source_ref: page_0272_ex11_solution_continuation
    - step_id: step_5
      statement: 保留 $2-a^2<0$。
      formula_trace:
        from: $a<-\sqrt2$ 或 $a>\sqrt2$
        to: 0 附近 $f^\prime$ 单调递减，左侧 $f^\prime>0$，右侧 $f^\prime<0$
        operation: 用二阶导负控制一阶导局部单调。
        why: 这正是 $x=0$ 为极大值点的局部形态。
      source_ref: page_0272_ex11_solution_continuation
    - step_id: step_6
      statement: 排除边界 $a=\pm\sqrt2$。
      formula_trace:
        from: $a=\sqrt2$ 时 $f^\prime(x)=-\sqrt2\sin(\sqrt2x)+\frac{2x}{1-x^2}$
        to: $0<x<1$ 时 $f^\prime(x)>-2x+\frac{2x}{1-x^2}>0$
        operation: 用 $\sin u<u$ 估计边界情形。
        why: 边界时右侧仍递增，不是极大值；由偶性排除 $-\sqrt2$。
      source_ref: page_0272_ex11_solution_continuation
teaching_card:
  student_title: 极大值先看二阶，边界再用夹逼排掉
  what_it_trains: 训练极大值参数界定：二阶导负给出主体范围，二阶导为零的边界必须单独检查。
  recognition_cues:
    - 题目明确说 $x=0$ 是极大值点。
    - $f^\prime(0)=0$ 自动成立，关键是 $f^{\prime\prime}(0)=2-a^2$。
    - 边界 $a=\pm\sqrt2$ 时二阶导为 0，不能直接收进答案。
  normalization_moves:
    - 先证明并保存 $x-x^2<\sin x<x$。
    - 第(2)问先用二阶导分三类。
    - 对 $|a|>\sqrt2$ 证明局部左增右减。
    - 对 $|a|=\sqrt2$ 用三角夹逼排除。
  common_failures:
    - 把 $f^{\prime\prime}(0)<0$ 当成充要，忘记检查 $f^{\prime\prime}(0)=0$。
    - 把边界 $a=\pm\sqrt2$ 错误纳入答案。
    - 第(1)问证明完没有在第(2)问边界分析中回用。
    - 忽略 $f(x)$ 关于 $a$ 的偶性，重复处理两个边界。
  similar_practice_query: cos ax ln(1-x^2) 极大值 二阶导 a^2>2 边界 sqrt2 sinx夹逼
