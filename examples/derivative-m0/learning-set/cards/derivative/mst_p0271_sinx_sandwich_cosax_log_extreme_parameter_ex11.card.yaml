stem: |-
  （2023 · 新高考Ⅱ）
  1. 证明：当 $0<x<1$ 时，$x-x^2<\sin x<x$。
  2. 已知函数 $f(x)=\cos ax-\ln(1-x^2)$，若 $x=0$ 为 $f(x)$ 的极大值点，求 $a$ 的取值范围。
answer: |-
  第(1)问：成立。第(2)问：$a\in(-\infty,-\sqrt2)\cup(\sqrt2,+\infty)$。

  第(1)问分别证明两边：设 $g=x-x^2-\sin x$，则 $g^{\prime\prime}=-2+\sin x<0$， $g^\prime<g^\prime(0)=0$，从而 $g<g(0)=0$，得 $x-x^2<\sin x$；再设 $h=x-\sin x$， $h^\prime=1-\cos x>0$，得 $\sin x<x$。第(2)问 $f^\prime(x)=-a\sin ax+\frac{2x}{1-x^2}$， $f^{\prime\prime}(0)=2-a^2$。若 $2-a^2>0$，则 0 右侧 $f$ 会递增，不能是极大值；若 $2-a^2<0$，则 0 附近左增右减， 满足极大值；若 $2-a^2=0$，由偶性只看 $a=\sqrt2$， 此时 $0<x<1$ 上 $f^\prime(x)>-2x+\frac{2x}{1-x^2}>0$， 仍与极大值矛盾。因此 $|a|>\sqrt2$。
