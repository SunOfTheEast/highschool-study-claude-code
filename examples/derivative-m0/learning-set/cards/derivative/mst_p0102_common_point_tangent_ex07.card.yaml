solution:
  source_solution_summary: |
    设公共切点为 $A(x_0,y_0)$。因为在公共点处切线相同，所以函数值相等且导数相等：
    $ae^{x_0}=2x_0^2-m$，$ae^{x_0}=4x_0$。
    整理得 $4x_0=2x_0^2-m$，又第一象限给出 $x_0>0$，题设 $m>0$，
    所以 $m=2x_0^2-4x_0=2x_0(x_0-2)>0$，从而 $x_0>2$。
    由 $ae^{x_0}=4x_0$ 得 $a=\frac{4x_0}{e^{x_0}}$。
    令 $h(x)=\frac{4x}{e^x}$，则
    $h'(x)=\frac{4(1-x)}{e^x}<0$ 在 $(2,+\infty)$ 上恒成立，
    故 $h$ 在该区间单调递减，且
    $0<h(x)<h(2)=\frac8{e^2}$。所以
    $a\in(0,\frac8{e^2})$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把“公共点处切线相同”翻译为函数值与导数同时相等。
      formula_trace:
        from: |
          $f(x)=ae^x,\quad g(x)=2x^2-m,\quad f'(x)=ae^x,\quad g'(x)=4x$
        to: |
          $\begin{cases}
          ae^{x_0}=2x_0^2-m,\\
          ae^{x_0}=4x_0
          \end{cases}$
        operation: 在公共切点 $x_0$ 处分别令函数值相等、导数值相等。
        why: 题目明确是两个图象在同一个第一象限公共点处共用切线。
      source_ref: page_0102
    - step_id: step_2
      statement: 由 $m>0$ 推出切点横坐标的范围。
      formula_trace:
        from: |
          $4x_0=2x_0^2-m,\quad x_0>0,\quad m>0$
        to: |
          $m=2x_0^2-4x_0=2x_0(x_0-2)>0,\qquad x_0>2$
        operation: 把 $m$ 用 $x_0$ 表示，再结合 $x_0>0$ 解不等式。
        why: 切点横坐标的开区间决定 $a$ 的取值端点是否能取到。
      source_ref: page_0103
    - step_id: step_3
      statement: 把 $a$ 化成单变量函数。
      formula_trace:
        from: |
          $ae^{x_0}=4x_0$
        to: |
          $a=\frac{4x_0}{e^{x_0}},\qquad x_0>2$
        operation: 两边除以 $e^{x_0}$。
        why: 当 $m$ 变化时，$x_0$ 在 $(2,+\infty)$ 上变化，问题转为求该函数值域。
      source_ref: page_0103
    - step_id: step_4
      statement: 研究 $h(x)=4x/e^x$ 在 $(2,+\infty)$ 上的值域。
      formula_trace:
        from: |
          $h(x)=\frac{4x}{e^x},\qquad h'(x)=\frac{4(1-x)}{e^x}$
        to: |
          $x>2\Rightarrow h'(x)<0,\qquad 0<h(x)<h(2)=\frac8{e^2}$
        operation: 求导判断单调递减，并取开区间端点极限。
        why: 由于 $x_0>2$ 是严格不等式，上端 $\frac8{e^2}$ 不能取到。
      source_ref: page_0103
teaching_card:
  student_title: 公共点共切，把参数交给切点
  what_it_trains: 训练同一点相切时同时列函数值方程和导数方程，再用切点横坐标控制参数范围。
  recognition_cues:
    - 题干说“在该点处的切线相同”，说明两个函数在同一个 $x_0$ 处既同值又同斜率。
    - 题目让 $m$ 变化求 $a$ 的范围，提示先用 $m>0$ 限制 $x_0$。
    - 最后出现 $e^2$，通常来自 $x_0=2$ 这个端点。
  normalization_moves:
    - 设公共切点 $A(x_0,y_0)$。
    - 由 $m=2x_0^2-4x_0>0$ 得 $x_0>2$。
    - 研究 $a=4x_0/e^{x_0}$ 在 $x_0>2$ 上的值域。
  common_failures:
    - 把公共点公切线误做成两个不同切点的公切线。
    - 只由 $ae^{x_0}=4x_0$ 写出 $a$，漏用 $m>0$。
    - 把 $x_0=2$ 代入后误认为 $\frac8{e^2}$ 可以取到。
  similar_practice_query: 公共点公切线 指数 二次 参数范围 $4x/e^x$
