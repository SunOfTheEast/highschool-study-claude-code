stem: |-
  （2020 五岳三月考前模拟 T12）已知函数 $f(x)=ae^x\ (a>0)$ 与 $g(x)=2x^2-m\ (m>0)$ 的图象在第一象限有公共点，且在该点处的切线相同，当实数 $m$ 变化时，实数 $a$ 的取值范围为 （  ）
  A. $\left(\frac{4}{e^2},+\infty\right)$
  B. $\left(\frac{8}{e^2},+\infty\right)$
  C. $\left(0,\frac{4}{e^2}\right)$
  D. $\left(0,\frac{8}{e^2}\right)$
answer: |
  D

  设公共切点为 $A(x_0,y_0)$。因为在公共点处切线相同，所以函数值相等且导数相等：
  $ae^{x_0}=2x_0^2-m$，$ae^{x_0}=4x_0$。
  整理得 $4x_0=2x_0^2-m$，又第一象限给出 $x_0>0$，题设 $m>0$，
  所以 $m=2x_0^2-4x_0=2x_0(x_0-2)>0$，从而 $x_0>2$。
  由 $ae^{x_0}=4x_0$ 得 $a=\frac{4x_0}{e^{x_0}}$。
  令 $h(x)=\frac{4x}{e^x}$，则
  $h'(x)=\frac{4(1-x)}{e^x}<0$ 在 $(2,+\infty)$ 上恒成立，
  故 $h$ 在该区间单调递减，且
  $0<h(x)<h(2)=\frac8{e^2}$。所以
  $a\in(0,\frac8{e^2})$，选 D。
