solution:
  source_solution_summary: |
    对 $f(x)=\frac{x+1}{e^{x-1}}-ax-1$ 求导，得 $f^{\prime}(x)=-\frac{x}{e^{x-1}}-a$。A 中要让 $f$ 在 $\mathbf R$ 上递增，需 $-a\geqslant \max \frac{x}{e^{x-1}}=1$，故 $a\leqslant-1$，A 正确。B 中 $f(x)>a-1$ 等价于 $\frac{x+1}{e^{x-1}}>a(x+1)$；当 $a\in(1,2)$ 时，$h(1)=2<p(1)=2a$，源页据此判 B 错，也可化成解集 $(-1,1-\ln a)$，长度 $2-\ln a<2$。C 中极值点对应方程 $-a=\frac{x}{e^{x-1}}$ 的两个正根；临界条件 $x_2=2x_1$ 给出 $x_1=\ln2$、$-a=\frac{e\ln2}{2}$，要 $x_2>2x_1$ 则 $0<-a<\frac{e\ln2}{2}$，即 $-\frac{e\ln2}{2}<a<0$，C 正确。D 中令 $a=1$，源页由拐点 $(1,0)$ 和切线 $y=-2x+2$ 的图像判断过 $(0,3)$ 仅一条切线；直接切点方程也只有一个解，故 D 正确。答案 ACD。
  key_steps:
    - step_id: step_1
      statement: 先求导并抽出核心函数 $g(x)=\frac{x}{e^{x-1}}$。
      formula_trace:
        from: $f(x)=\frac{x+1}{e^{x-1}}-ax-1$
        to: $f^{\prime}(x)=-\frac{x}{e^{x-1}}-a$
        operation: 对 $(x+1)e^{1-x}$ 求导，再对 $-ax-1$ 求导。
        why: A、C 两项都转化为水平线 $y=-a$ 与 $g(x)=\frac{x}{e^{x-1}}$ 的关系。
      source_ref: page_0099_ex20_solution
    - step_id: step_2
      statement: 判断 A：全体实数上单调递增对应导函数恒非负。
      formula_trace:
        from: $f^{\prime}(x)\geqslant0\ \forall x\in\mathbf R$
        to: $-a\geqslant \left(\frac{x}{e^{x-1}}\right)_{\max}=1,\quad a\leqslant-1$
        operation: 把参数移到一侧，并用 $g(x)$ 在 $x=1$ 处取最大值 $1$。
        why: 要对所有 $x$ 成立，必须压住 $g(x)$ 的最大值。
      source_ref: page_0099_ex20_solution
    - step_id: step_3
      statement: 判断 B：把不等式解集长度直接算出，看到反例区间。
      formula_trace:
        from: $f(x)>a-1$
        to: $(x+1)\left(e^{1-x}-a\right)>0$，当 $0<a<2$ 时解集为 $(-1,1-\ln a)$
        operation: 移项后提取因子 $x+1$，再解 $e^{1-x}>a$。
        why: 解集长度为 $n-m=(1-\ln a)-(-1)=2-\ln a$；取 $1<a<2$ 时长度小于 $2$。
      source_ref: page_0099_ex20_solution
    - step_id: step_4
      statement: 判断 C：用两个极值点对应的两个交点做临界比较。
      formula_trace:
        from: $-\!a=\frac{x_1}{e^{x_1-1}}=\frac{x_2}{e^{x_2-1}},\quad x_2=2x_1$
        to: $x_1=\ln2,\quad -a=\frac{\ln2}{e^{\ln2-1}}=\frac{e\ln2}{2}$
        operation: 代入 $x_2=2x_1$，约去正的 $x_1$ 并解指数方程。
        why: 这是 $x_2>2x_1$ 与 $x_2<2x_1$ 的分界水平线。
      source_ref: page_0099_ex20_solution
    - step_id: step_5
      statement: 由临界水平线推出 C 的参数范围。
      formula_trace:
        from: $y=-a$ 与 $g(x)=\frac{x}{e^{x-1}}$ 有两个交点，且 $x_2>2x_1$
        to: $0<-a<\frac{e\ln2}{2}$，即 $-\frac{e\ln2}{2}<a<0$
        operation: 结合 $g(x)$ 先增后减的图像和临界值比较。
        why: 水平线越低，左根越靠近 $0$、右根越向右，因而更容易满足 $x_2>2x_1$。
      source_ref: page_0099_ex20_solution
    - step_id: step_6
      statement: 判断 D：先按源页找 $a=1$ 时的拐点切线。
      formula_trace:
        from: $a=1,\quad f(x)=\frac{x+1}{e^{x-1}}-x-1$
        to: $f^{\prime}(x)=-\frac{x}{e^{x-1}}-1,\quad f^{\prime\prime}(x)=\frac{x-1}{e^{x-1}},\quad \text{拐点 }(1,0),\quad y=-2x+2$
        operation: 求一、二阶导，取 $x=1$ 得拐点和拐点切线。
        why: 源图用拐点切线与 $y$ 轴交于 $(0,2)$，判断点 $(0,3)$ 的切线条数。
      source_ref: page_0099_ex20_solution
    - step_id: step_7
      statement: 用切点方程核实过 $(0,3)$ 只有一条切线。
      formula_trace:
        from: 切点为 $t$ 时，$3=f(t)-t f^{\prime}(t)$
        to: $(t^2+t+1)e^{1-t}=4$，该方程只有一个负根
        operation: 代入 $a=1$ 的 $f(t)$ 与 $f^{\prime}(t)$，并观察左侧在 $(-\infty,0)$ 单调递减、在 $(0,1)$ 增、在 $(1,+\infty)$ 减，最大正侧值为 $3<4$。
        why: 这把源页的图像判断落实为切点个数判断，确认 D 正确。
      source_ref: page_0099_ex20_solution
    - step_id: step_8
      statement: 汇总正确选项。
      formula_trace:
        from: A 正确，B 错误，C 正确，D 正确
        to: 答案 ACD
        operation: 逐项合并多选结果。
        why: 源页结论为 ACD。
      source_ref: page_0099_ex20_solution
teaching_card:
  student_title: 把参数藏进一条水平线里
  what_it_trains: 训练把含参数导函数、极值点和切线条数问题统一到核心图像，再逐项验证多选命题。
  recognition_cues:
    - 导函数里出现 $-\frac{x}{e^{x-1}}-a$。
    - 题目同时问单调、解集长度、两个极值点和过点切线条数。
    - 条件 $x_2>2x_1$ 暗示先做等号临界 $x_2=2x_1$。
  normalization_moves:
    - 先设 $g(x)=\frac{x}{e^{x-1}}$，把参数 $a$ 变成水平线 $y=-a$。
    - 对 B 不只看源图，也把不等式提成 $(x+1)(e^{1-x}-a)>0$。
    - 对 C 先令 $x_2=2x_1$ 找临界参数，再用图像判断方向。
    - 对 D 先找拐点切线，再用切点方程确认只有一个切点。
  common_failures:
    - A 中只令某一点导数非负，没有取 $\frac{x}{e^{x-1}}$ 的最大值。
    - B 中看到 $0<a<2$ 就默认长度大于 $2$，漏掉 $a>1$ 的反例。
    - C 中把 $x_2>2x_1$ 的方向判反，得到 $a<-\frac{e\ln2}{2}$。
    - D 中只记拐点切线 $y=-2x+2$，没有核实过 $(0,3)$ 的切点个数。
  similar_practice_query: 指数分式 含参数导函数 水平线交点 极值点距离 过定点切线 多选
