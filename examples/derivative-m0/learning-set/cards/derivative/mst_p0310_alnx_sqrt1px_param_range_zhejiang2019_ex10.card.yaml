original_problem:
  stem: （2019 · 浙江）已知实数 $a\ne0$，设函数 $f(x)=a\ln x+\sqrt{1+x}$，$x>0$。
  parts: *a1
  choices: []
  answer: 第(1)问：递减区间 $(0,3)$，递增区间 $(3,+\infty)$。第(2)问：$a\in(0,\frac{\sqrt2}{4}]$。
  fidelity_notes:
    - 无选项。
    - 第(2)问因为右侧含 $\frac1a$，最终范围必须有 $a>0$。
solution:
  source_solution_summary: 第(1)问直接求导： $f^\prime(x)=-\frac{3}{4x}+\frac1{2\sqrt{1+x}} =\frac{(\sqrt{1+x}-2)(2\sqrt{1+x}+1)}{4x\sqrt{1+x}}$， 导数符号由 $\sqrt{1+x}-2$ 决定，故在 $(0,3)$ 上递减， 在 $(3,+\infty)$ 上递增。第(2)问令 $m=\frac1a$，原不等式等价于 $h(x)=m^2\sqrt x-2m\sqrt{1+x}-2\ln x\ge0$。按极点效应列 $h(x_0)=0,h^\prime(x_0)=0$，消去后探得 $x_0=1$，从而必要条件 $h(1)=m^2-2\sqrt2m\ge0$，结合题意取 $m\ge2\sqrt2$，即 $0<a\le\frac{\sqrt2}{4}$。充分性方面，source 给出多条证明： 一条以 $m$ 为主元，把 $h(x)=\sqrt x(m-\sqrt{1+\frac1x})^2-\frac{1+x}{\sqrt x}-2\ln x$， 分 $x\ge\frac17$ 与 $x\in[\frac1{e^2},\frac17)$ 证明非负； 另一条用保值性/以 $x$ 为主元，结合 $\ln x$ 的放缩、飘带和柯西， 证明 $m\ge2\sqrt2$ 时 $h(x)\ge0$。综上 $a$ 的范围为 $(0,\frac{\sqrt2}{4}]$。
  key_steps:
    - step_id: step_1
      statement: 第(1)问求导并因式分解。
      formula_trace:
        from: $f(x)=-\frac34\ln x+\sqrt{1+x}$
        to: $f^\prime(x)=\frac{(\sqrt{1+x}-2)(2\sqrt{1+x}+1)}{4x\sqrt{1+x}}$
        operation: 通分并按 $\sqrt{1+x}$ 因式分解。
        why: 导数符号只剩 $\sqrt{1+x}-2$。
      source_ref: page_0310_ex10_part1
    - step_id: step_2
      statement: 第(2)问把参数换成 $m=\frac1a$。
      formula_trace:
        from: $a\ln x+\sqrt{1+x}\le\frac{\sqrt x}{2a}$
        to: $m^2\sqrt x-2m\sqrt{1+x}-2\ln x\ge0$
        operation: 令 $m=\frac1a$ 并同乘正量。
        why: 把含 $a$ 的不等式变成关于 $m$ 的二次结构。
      source_ref: page_0310_ex10_part2_explore
    - step_id: step_3
      statement: 用极点效应探路参数边界。
      formula_trace:
        from: $h(x_0)=0,\quad h^\prime(x_0)=0$
        to: $x_0=1,\quad m\ge2\sqrt2$
        operation: 消元探路并代回 $h(1)$。
        why: 恒成立临界通常由相切/双重接触点给出。
      source_ref: page_0310_ex10_part2_explore
    - step_id: step_4
      statement: 把 $m\ge2\sqrt2$ 翻译回 $a$。
      formula_trace:
        from: $m=\frac1a,\quad m\ge2\sqrt2$
        to: $0<a\le\frac{\sqrt2}{4}$
        operation: 取倒数并保留 $a>0$。
        why: 若 $a<0$，右侧与原不等式方向不符合最终必要条件。
      source_ref: page_0310_ex10_part2_explore
    - step_id: step_5
      statement: 充分性路线一：以 $m$ 为主元分段证明。
      formula_trace:
        from: $h(x)=m^2\sqrt x-2m\sqrt{1+x}-2\ln x$
        to: $h(x)\ge0\quad (x\in[\frac1{e^2},+\infty),\ m\ge2\sqrt2)$
        operation: 把 $h$ 配成关于 $m$ 的平方，分 $x\ge\frac17$ 与 $x<\frac17$ 处理。
        why: 这是 source 的主充分性证明。
      source_ref: page_0311_ex10_sufficiency_main_m
    - step_id: step_6
      statement: 充分性路线二：用保值性和以 $x$ 为主元补强。
      formula_trace:
        from: $m\sqrt x-\frac{2\ln x}{m}\ge2\sqrt{1+x}$
        to: $h(x)\ge0$
        operation: 用基本不等式、飘带/帕德对数放缩和柯西估计。
        why: source 用这条路线解释端点探路和主元切换。
      source_ref: page_0312_ex10_baozhi_and_x_main
teaching_card:
  student_title: 先探出临界点，再证明恒成立
  what_it_trains: 训练复杂含参恒成立：先用双重接触点探出参数边界，再分主元证明充分性。
  recognition_cues:
    - 题目要求对一整段 $x$ 恒成立。
    - 参数同时出现在 $\ln x$ 系数和右侧分母里。
    - 换成 $m=1/a$ 后出现关于 $m$ 的二次式。
    - source 明确提示复杂含参要两头凑、先猜后证。
  normalization_moves:
    - 不要直接对原式求导硬冲。
    - 先把不等式整理成 $h(x)\ge0$。
    - 临界恒成立常看 $h=0,h^\prime=0$。
    - 探得范围后必须回头证充分性。
  common_failures:
    - 忘记 $a$ 的正负限制。
    - 把探路得到的 $x_0=1$ 当成无需证明的经验。
    - 只得到必要条件，没有证明充分性。
    - 充分性证明中主元混乱，在 $m$ 和 $x$ 之间来回跳。
  similar_practice_query: 2019浙江 根式对数 恒成立 m=1/a 极点效应 x0=1 主元
