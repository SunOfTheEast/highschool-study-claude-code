stem: |-
  （2019 · 浙江）已知实数 $a\ne0$，设函数 $f(x)=a\ln x+\sqrt{1+x}$，$x>0$。
  1. 当 $a=-\frac34$ 时，求函数 $f(x)$ 的单调区间。
  2. 对任意 $x\in[\frac1{e^2},+\infty)$ 均有 $f(x)\le\frac{\sqrt x}{2a}$，求 $a$ 的取值范围。
answer: |-
  第(1)问：递减区间 $(0,3)$，递增区间 $(3,+\infty)$。第(2)问：$a\in(0,\frac{\sqrt2}{4}]$。

  第(1)问直接求导： $f^\prime(x)=-\frac{3}{4x}+\frac1{2\sqrt{1+x}} =\frac{(\sqrt{1+x}-2)(2\sqrt{1+x}+1)}{4x\sqrt{1+x}}$， 导数符号由 $\sqrt{1+x}-2$ 决定，故在 $(0,3)$ 上递减， 在 $(3,+\infty)$ 上递增。第(2)问令 $m=\frac1a$，原不等式等价于 $h(x)=m^2\sqrt x-2m\sqrt{1+x}-2\ln x\ge0$。按极点效应列 $h(x_0)=0,h^\prime(x_0)=0$，消去后探得 $x_0=1$，从而必要条件 $h(1)=m^2-2\sqrt2m\ge0$，结合题意取 $m\ge2\sqrt2$，即 $0<a\le\frac{\sqrt2}{4}$。充分性方面，source 给出多条证明： 一条以 $m$ 为主元，把 $h(x)=\sqrt x(m-\sqrt{1+\frac1x})^2-\frac{1+x}{\sqrt x}-2\ln x$， 分 $x\ge\frac17$ 与 $x\in[\frac1{e^2},\frac17)$ 证明非负； 另一条用保值性/以 $x$ 为主元，结合 $\ln x$ 的放缩、飘带和柯西， 证明 $m\ge2\sqrt2$ 时 $h(x)\ge0$。综上 $a$ 的范围为 $(0,\frac{\sqrt2}{4}]$。
