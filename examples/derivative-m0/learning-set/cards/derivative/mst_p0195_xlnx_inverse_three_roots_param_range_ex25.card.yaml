stem: 已知方程 $x^2\ln x=a\ln a-a\ln x$ 有 3 个实根，则实数 $a$ 的取值范围是_______。
answer: |-
  $0<a<\frac{1}{e^2}$

  设 $\varphi(t)=t\ln t\ (t>0)$，原方程可化为 $\varphi(x)=\varphi\!\left(\frac{a}{x}\right)$，并得 $a>0$。源解按图像分段： 当 $x>1$ 时，$\varphi(x)>0$，只能在 $x=\frac{a}{x}$（即 $x=\sqrt a$）处给出一根， 不可能单靠该区间得到三根；当 $0<x<1$ 时，$\varphi$ 在 $x=\frac1e$ 处有极小值，临界为两曲线在 $x=\frac1e$ 相切，对应 $a=\frac1{e^2}$。要出现“三根”必须越过该临界并保持两侧各一交点， 即 $0<a<\frac1{e^2}$。因此方程恰有 3 个实根当且仅当 $a\in\left(0,\frac1{e^2}\right)$。
