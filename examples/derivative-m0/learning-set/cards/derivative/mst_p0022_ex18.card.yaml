stem: |-
  （江苏省百校联考 2023-2024 学年高三上学期第一次考试 T7）已知函数 $f(x)=xe^x$，$g(x)=-\frac{\ln x}{x}$，若 $f(x_1)=g(x_2)=t(>0)$，则 $\frac{x_1}{x_2 e^t}$ 的最大值为 (  )
  A. $e$
  B. $1$
  C. $\frac{1}{e}$
  D. $\frac{1}{e^2}$
answer: |-
  C

  由 $t>0$ 得 $x_1>0$ 且 $0<x_2<1$。把 $-\frac{\ln x_2}{x_2}$ 写为 $\ln\frac1{x_2}e^{\ln(1/x_2)}$，与 $x_1e^{x_1}$ 同构，推出 $x_1=\ln\frac1{x_2}$ 和 $x_2e^{x_1}=1$。目标式转成 $t/e^t$，最大值为 $1/e$。
