solution:
  source_solution_summary: 令 $k=a+1$。由 $e^x-(a+1)x-b\geqslant0$ 得 $e^x\geqslant kx+b$。指数函数斜率为 $k$ 的支撑切线给出 $b\leqslant k(1-\ln k)$，故 $(a+1)b=kb\leqslant k^2(1-\ln k)=-k^2\ln\frac{k}{e}$。写成 $-\frac{e^2}{2}u\ln u$（$u=\frac{k^2}{e^2}>0$），由 $-u\ln u\leqslant\frac1e$ 得 $(a+1)b\leqslant\frac e2$。当 $k=\sqrt e$、 $b=\frac{\sqrt e}{2}$ 时取等，故最大值是 $\frac e2$，对应 C。
  key_steps:
    - step_id: step_1
      statement: 把恒成立不等式写成指数函数压住一次函数。
      formula_trace:
        from: $e^x-(a+1)x-b\geqslant0$
        to: $e^x\geqslant kx+b,\quad k=a+1$
        operation: 移项并记斜率参数。
        why: 后续可直接套指数切线斜率找点模板。
      source_ref: page_0176:lines 28-35
    - step_id: step_2
      statement: 用指数切线模板给出截距上界。
      formula_trace:
        from: $e^x\geqslant kx+b$
        to: $b\leqslant k(1-\ln k)$
        operation: 令切点 $x_0=\ln k$，代入切线式。
        why: 在固定斜率 $k$ 下，切线给出最大可行截距。
      source_ref: page_0176:lines 20-25, 34-35
    - step_id: step_3
      statement: 把目标写成同构最值型。
      formula_trace:
        from: $(a+1)b=kb\leqslant k^2(1-\ln k)$
        to: $(a+1)b\leqslant-\frac{e^2}{2}\,u\ln u,\ u=\frac{k^2}{e^2}$
        operation: 把 $k^2\ln(k/e)$ 改写为 $u\ln u$ 标准型。
        why: 可直接调用 $-u\ln u$ 的最大值结论。
      source_ref: page_0176:line 34
    - step_id: step_4
      statement: 取最值得到选项。
      formula_trace:
        from: $-u\ln u\leqslant\frac1e$
        to: $(a+1)b\leqslant\frac e2$（等号在 $k=\sqrt e$ 取到）
        operation: 代回并验证取等参数。
        why: 最大值不仅要算出，还要验证可达。
      source_ref: page_0176:lines 34-35
teaching_card:
  student_title: 用指数切线斜率直接卡住参数乘积
  what_it_trains: 训练“指数函数恒压直线”里，把目标乘积转成斜率-截距并同构到 $-x\ln x$ 最值模板。
  recognition_cues:
    - 题干形如 $e^x\geqslant$ 一次函数并要求参数乘积最值。
    - 可把一次函数看成“待定斜率 + 待定截距”的切线比较。
    - 解链里会自然出现 $\ln(a+1)$ 或 $\ln\frac{a+1}{e}$。
  normalization_moves:
    - 先设 $k=a+1$，统一写成 $e^x\geqslant kx+b$。
    - 由切线斜率找点得 $b\leqslant k(1-\ln k)$。
    - 把 $kb$ 写成 $-u\ln u$ 型后取最值。
  common_failures:
    - 只算出 $b$ 的范围，忘了再乘上 $a+1$ 做二次优化。
    - 把 $-u\ln u$ 的极值点写错成 $u=1$。
    - 未核对“故选”与数值是否一致，直接抄错标号。
  similar_practice_query: e^x >= kx+b 参数乘积最大值 指数切线斜率找点
