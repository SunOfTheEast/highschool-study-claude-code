stem: |-
  （2025 · 湘潭期末 T8）若关于 $x$ 的不等式 $e^x-(a+1)x-b\geqslant 0$（$e$ 为自然对数的底数）在 $\mathbf{R}$ 上恒成立，则 $(a+1)b$ 的最大值为（  ）
  A. $e+1$
  B. $e+\frac{1}{2}$
  C. $\frac{e}{2}$
  D. $\frac{e}{4}$
answer: |-
  C

  令 $k=a+1$。由 $e^x-(a+1)x-b\geqslant0$ 得 $e^x\geqslant kx+b$。指数函数斜率为 $k$ 的支撑切线给出 $b\leqslant k(1-\ln k)$，故 $(a+1)b=kb\leqslant k^2(1-\ln k)=-k^2\ln\frac{k}{e}$。写成 $-\frac{e^2}{2}u\ln u$（$u=\frac{k^2}{e^2}>0$），由 $-u\ln u\leqslant\frac1e$ 得 $(a+1)b\leqslant\frac e2$。当 $k=\sqrt e$、 $b=\frac{\sqrt e}{2}$ 时取等，故最大值是 $\frac e2$，对应 C。
