original_problem:
  stem: 求证：(1) $\frac{\ln(x+1)}{\sqrt{x}}<2$，(2) $\frac{\ln(x+1)}{\sqrt{x}}<1$。
  parts: *a1
  choices: []
  answer: 两问均成立。
  fidelity_notes:
    - 源题题干未显写 $x>0$；由于有 $\sqrt{x}$ 作分母，且源解多处写明 $(x>0)$，本卡按隐含定义域 $x>0$ 处理。
    - 第 (2) 问本身强于第 (1) 问，但源解仍分别展示两类证明思路，本卡保留这种教学结构。
solution:
  source_solution_summary: |
    对第 (1) 问，源解调用 $\ln(1+u)<u\ (u>0)$，先得 $\ln(1+\sqrt{x})/\sqrt{x}<1$，再由 $(1+\sqrt{x})^2>x+1$ 推出
    \[
      2>\frac{2\ln(1+\sqrt{x})}{\sqrt{x}}
       =\frac{\ln(1+\sqrt{x})^2}{\sqrt{x}}
       >\frac{\ln(1+x)}{\sqrt{x}}.
    \]
    对第 (2) 问，法一令 $t=\sqrt{x}$，把问题化为 $e^t>t^2+1$，再证 $h(t)=(t^2+1)/e^t<1$；法二直接证明
    $h(x)=\sqrt{x}-\ln(x+1)>0$，因 $h'(x)=\frac{(\sqrt{x}-1)^2}{2\sqrt{x}(x+1)}\ge0$，且 $h(0)=0$，故对 $x>0$ 成立。
  key_steps:
    - step_id: step_1
      statement: 调用基础对数不等式，为第 (1) 问准备上界。
      formula_trace:
        from: $\ln(1+u)<u\quad(u>0)$
        to: $\frac{\ln(1+\sqrt{x})}{\sqrt{x}}<1\quad(x>0)$
        operation: 在 $\ln(1+u)<u$ 中令 $u=\sqrt{x}$ 并除以正数 $\sqrt{x}$。
        why: 源解用 $f(u)=\ln(1+u)/u<1$ 作为第 (1) 问的起点。
      source_ref: page_0054_solution
    - step_id: step_2
      statement: 把 $2\ln(1+\sqrt{x})$ 合并成一个对数，再与 $\ln(1+x)$ 比较。
      formula_trace:
        from: $2>\frac{2\ln(1+\sqrt{x})}{\sqrt{x}}=\frac{\ln(1+\sqrt{x})^2}{\sqrt{x}}$
        to: $\frac{\ln(1+x)}{\sqrt{x}}<2$
        operation: 由 $(1+\sqrt{x})^2=x+1+2\sqrt{x}>x+1$ 及 $\ln x$ 递增，得到 $\ln(1+\sqrt{x})^2>\ln(1+x)$。
        why: 分母为正，比较对数真数即可完成第 (1) 问。
      source_ref: page_0054_solution
    - step_id: step_3
      statement: 法一把第 (2) 问换元成指数不等式。
      formula_trace:
        from: $\frac{\ln(1+x)}{\sqrt{x}}<1,\quad t=\sqrt{x}$
        to: $t>\ln(t^2+1)\Longleftrightarrow e^t>t^2+1$
        operation: 令 $t=\sqrt{x}>0$，再对两边取指数。
        why: 这是源解标注的“指数找基友”：把对数比较改为指数函数压住二次式。
      source_ref: page_0054_solution
    - step_id: step_4
      statement: 构造商函数证明 $e^t>t^2+1$。
      formula_trace:
        from: $h(t)=\frac{t^2+1}{e^t}$
        to: $h^{\prime}(t)=-\frac{(t-1)^2}{e^t}\le0,\quad h(t)<h(0)=1\ (t>0)$
        operation: 求导判断 $h(t)$ 在 $[0,+\infty)$ 上不增，并利用 $t>0$ 时相对端点严格变小。
        why: 得到 $(t^2+1)/e^t<1$，即 $e^t>t^2+1$。
      source_ref: page_0054_solution
    - step_id: step_5
      statement: 法二直接证明 $\sqrt{x}$ 比 $\ln(1+x)$ 大。
      formula_trace:
        from: $h(x)=\sqrt{x}-\ln(x+1)$
        to: $h^{\prime}(x)=\frac{1}{2\sqrt{x}}-\frac{1}{x+1}=\frac{(\sqrt{x}-1)^2}{2\sqrt{x}(x+1)}\ge0,\quad h(x)>h(0)=0$
        operation: 求导并化成平方非负形式，再由 $h$ 在 $(0,+\infty)$ 上递增且右端极限为 $0$ 得结论。
        why: 这对应源页“对数单身狗”路线，直接推出 $\ln(x+1)/\sqrt{x}<1$。
      source_ref: page_0054_solution
teaching_card:
  student_title: 给 $\ln(1+x)/\sqrt{x}$ 找指数搭档
  what_it_trains: 训练遇到 $\ln(1+x)$ 和 $\sqrt{x}$ 夹在一起时，先把 $\sqrt{x}$ 换成新变量，再在对数式、指数式和导数单调之间切换。
  recognition_cues:
    - 分母是 $\sqrt{x}$，题目要求证明对数比它小。
    - 令 $t=\sqrt{x}$ 后出现 $\ln(1+t^2)$。
    - 要证明 $\ln(1+t^2)<t$，可以改成 $e^t>t^2+1$。
  normalization_moves:
    - 第 (1) 问先用 $\ln(1+u)<u$，再比较 $(1+\sqrt{x})^2$ 与 $x+1$。
    - 第 (2) 问路线一：令 $t=\sqrt{x}$，构造 $(t^2+1)/e^t$。
    - 第 (2) 问路线二：直接看 $\sqrt{x}-\ln(x+1)$ 的导数。
  common_failures:
    - 忘记 $x>0$，直接把 $x=0$ 代入分式。
    - 把 $(1+\sqrt{x})^2>x+1$ 漏掉，导致第 (1) 问比较链断开。
    - 构造 $h(t)=(t^2+1)/e^t$ 后只写 $h^{\prime}(t)\le0$，没有说明 $t>0$ 时 $h(t)<1$。
  similar_practice_query: ln(1+x)/sqrtx 不等式 令t=sqrtx 指数找基友 对数单身狗
