stem: |-
  （2019 · 新课标 I T20）已知函数 $f(x)=2\sin x-x\cos x-x$，$f^\prime(x)$ 为 $f(x)$ 的导数。
  1. 证明：$f^\prime(x)$ 在区间 $(0,\pi)$ 存在唯一零点。
  2. 若 $x\in[0,\pi]$ 时，$f(x)\geqslant ax$，求 $a$ 的取值范围。
answer: |-
  第 (1) 问唯一零点存在；第 (2) 问 $a\in(-\infty,0]$。

  求导得 $f'(x)=\cos x+x\sin x-1$。令 $g(x)=\cos x+x\sin x-1$，则 $g'(x)=x\cos x$，所以 $g$ 在 $(0,\pi/2)$ 上递增，在 $(\pi/2,\pi)$ 上递减。又 $g(0)=0$，$g(\pi/2)=\pi/2-1>0$，$g(\pi)=-2$，因此 $g$ 在 $(0,\pi)$ 上有且仅有一个零点，即 $f'(x)$ 有唯一零点 $x_0$。 于是 $f$ 先增后减，且 $f(0)=f(\pi)=0$，所以 $f(x)\geqslant0$。 若 $a\leqslant0$，则 $ax\leqslant0$，故 $f(x)\geqslant ax$； 反过来代 $x=\pi$ 得 $0=f(\pi)\geqslant a\pi$，所以 $a\leqslant0$。 故 $a\in(-\infty,0]$。
