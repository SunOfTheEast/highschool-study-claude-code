original_problem:
  stem: （2019 · 新课标 I T20）已知函数 $f(x)=2\sin x-x\cos x-x$，$f^\prime(x)$ 为 $f(x)$ 的导数。
  parts: *a1
  choices: []
  answer: 第 (1) 问唯一零点存在；第 (2) 问 $a\in(-\infty,0]$。
  fidelity_notes:
    - 两问均为证明/求参，无选项。
    - 图 11-2-1 是第 (2) 问判断斜率方向的辅助图。
solution:
  source_solution_summary: 求导得 $f'(x)=\cos x+x\sin x-1$。令 $g(x)=\cos x+x\sin x-1$，则 $g'(x)=x\cos x$，所以 $g$ 在 $(0,\pi/2)$ 上递增，在 $(\pi/2,\pi)$ 上递减。又 $g(0)=0$，$g(\pi/2)=\pi/2-1>0$，$g(\pi)=-2$，因此 $g$ 在 $(0,\pi)$ 上有且仅有一个零点，即 $f'(x)$ 有唯一零点 $x_0$。 于是 $f$ 先增后减，且 $f(0)=f(\pi)=0$，所以 $f(x)\geqslant0$。 若 $a\leqslant0$，则 $ax\leqslant0$，故 $f(x)\geqslant ax$； 反过来代 $x=\pi$ 得 $0=f(\pi)\geqslant a\pi$，所以 $a\leqslant0$。 故 $a\in(-\infty,0]$。
  key_steps:
    - step_id: step_1
      statement: 把 $f^\prime(x)$ 写成一个三角整体函数。
      formula_trace:
        from: $f(x)=2\sin x-x\cos x-x$
        to: $f^\prime(x)=\cos x+x\sin x-1$
        operation: 逐项求导，对 $-x\cos x$ 求导得 $-\cos x+x\sin x$。
        why: 导函数正好形成 $\cos x+x\sin x-1$，便于再求导判号。
      source_ref: page_0227_ex13_solution
    - step_id: step_2
      statement: 构造 $g(x)$ 并确定它的单调结构。
      formula_trace:
        from: $g(x)=\cos x+x\sin x-1$
        to: $g^\prime(x)=x\cos x$
        operation: 求导后抵消 $-\sin x+\sin x$。
        why: $x\cos x$ 在 $(0,\pi/2)$ 与 $(\pi/2,\pi)$ 上符号相反。
      source_ref: page_0227_ex13_solution
    - step_id: step_3
      statement: 用端点和峰值证明唯一零点。
      formula_trace:
        from: $g(0)=0,\ g(\pi/2)=\pi/2-1>0,\ g(\pi)=-2$
        to: $g(x)$ 在 $(0,\pi)$ 上有唯一零点
        operation: 结合先增后减和介值定理。
        why: 左半段从 0 增到正值，不能在开区间左半段再过零；右半段从正值降到负值，只过一次零。
      source_ref: page_0227_ex13_solution
    - step_id: step_4
      statement: 由 $f^\prime(x)$ 的唯一零点得到 $f$ 的单峰和非负性。
      formula_trace:
        from: $f^\prime(x)>0$ 于 $(0,x_0)$，$f^\prime(x)<0$ 于 $(x_0,\pi)$
        to: $f(0)=f(\pi)=0$ 且 $f(x)\geqslant0$
        operation: 导数判单调，端点同值。
        why: 函数先增后减，两个端点同为 0，内部不低于端点。
      source_ref: page_0227_ex13_solution
    - step_id: step_5
      statement: 把 $f(x)\geqslant ax$ 的充分性和必要性收口。
      formula_trace:
        from: $f(x)\geqslant0$ 与 $x\in[0,\pi]$
        to: $a\leqslant0$
        operation: 充分性看 $ax\leqslant0$；必要性代 $x=\pi$。
        why: $x=\pi$ 时 $f(\pi)=0$，必须有 $0\geqslant a\pi$。
      source_ref: page_0227_ex13_solution
teaching_card:
  student_title: 三角整体先定单峰，再用端点压住直线斜率
  what_it_trains: 训练三角体系中的分而治之：先把导函数变成可判号的三角整体，再把求参转成端点和图象关系。
  recognition_cues:
    - 题干里有 $2\sin x-x\cos x-x$，求导后会出现 $\cos x+x\sin x-1$。
    - 再求导能化成 $x\cos x$，区间自然被 $\pi/2$ 分开。
    - $f(0)=f(\pi)=0$，内部单峰，说明直线 $ax$ 不能向上穿出。
  normalization_moves:
    - 先求 $f^\prime(x)$，命名为 $g(x)$。
    - 对 $g$ 再求导，利用 $x\cos x$ 判断 $g$ 的单调。
    - 用 $g(0),g(\pi/2),g(\pi)$ 证明唯一零点。
    - 用 $f(0)=f(\pi)=0$ 和 $x=\pi$ 得到 $a\leqslant0$。
  common_failures:
    - 只证明存在零点，没有用先增后减排除多个零点。
    - 把 $f^\prime(x)$ 与 $g^\prime(x)$ 的符号层级混淆。
    - 只看图说 $a\leqslant0$，没有补 $x=\pi$ 的必要性。
  similar_practice_query: 三角整体 xcosx 判号 导函数唯一零点 端点同值 天各一方 ax 参数范围
