solution:
  source_solution_summary: 由题意 $f$ 在定义域内单调递增，故可用不动点定理： $f(f(x))=x$ 有解等价于 $f(x)=x$ 有解。题目给“存在 $b\in[0,1]$ 使 $f(f(b))=b$”，等价于 $f(x)=x$ 在 $[0,1]$ 内有解。由 $x=\sqrt{e^x+x-a}$ 得 $a=e^x-x^2+x=:g(x)$（$x\in[0,1]$）。于是 $g^{\prime}(x)=e^x-2x+1\ge0$，故 $g$ 在 $[0,1]$ 单调递增， $a$ 的可取值就是 $g([0,1])=[g(0),g(1)]=[1,e]$。
  key_steps:
    - step_id: step_1
      statement: 把稳定点条件转成不动点条件。
      formula_trace:
        from: 存在 $b\in[0,1]$ 使 $f(f(b))=b$
        to: $f(x)=x$ 在 $[0,1]$ 有解
        operation: 应用“单调增函数下 $f(f(x))=x$ 与 $f(x)=x$ 等价”的结论。
        why: 降低复合方程难度，便于分离参数。
      source_ref: page_0192_ex21_solution
    - step_id: step_2
      statement: 由 $f(x)=x$ 分离参数。
      formula_trace:
        from: $x=\sqrt{e^x+x-a}$
        to: $a=e^x-x^2+x=:g(x)$
        operation: 平方并整理到参数一侧。
        why: 把“是否有解”改写成“参数属于函数值域”。
      source_ref: page_0192_ex21_solution
    - step_id: step_3
      statement: 在 $[0,1]$ 上求 $g$ 的值域。
      formula_trace:
        from: $g^{\prime}(x)=e^x-2x+1$
        to: $g$ 递增，$g([0,1])=[g(0),g(1)]=[1,e]$
        operation: 导数判单调，端点取值。
        why: 参数范围由对应自变量区间内的函数值域确定。
      source_ref: page_0192_ex21_solution
teaching_card:
  student_title: 复合不动点先降阶，再分离参数
  what_it_trains: 训练“先把复合方程降到不动点，再把参数改写为区间值域问题”的通用流程。
  recognition_cues:
    - 题干出现 $f(f(\cdot))$ 且函数单调。
    - 目标是求参数范围。
    - 可把方程改写成“参数 = 只含 $x$ 的表达式”。
  normalization_moves:
    - 先判是否可用不动点等价。
    - 再分离参数形成 $a=g(x)$。
    - 最后在给定区间上求 $g$ 的值域。
  common_failures:
    - 未使用等价定理，直接硬算复合方程。
    - 平方后漏掉整理，参数没有被单独提出。
    - 只算导数不回到端点值，导致范围不完整。
  similar_practice_query: 单调函数 f(f(x))=x 等价 f(x)=x 参数范围 分离参数 g(x)
