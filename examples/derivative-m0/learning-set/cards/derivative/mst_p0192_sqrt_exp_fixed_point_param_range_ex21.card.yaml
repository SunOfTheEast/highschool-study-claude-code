stem: （2013·四川文）设函数 $f(x)=\sqrt{e^x+x-a}\ (a\in\mathbf{R})$，若存在 $b\in[0,1]$ 使 $f(f(b))=b$ 成立，则 $a$ 的取值范围是______。
answer: |-
  $[1,e]$

  由题意 $f$ 在定义域内单调递增，故可用不动点定理： $f(f(x))=x$ 有解等价于 $f(x)=x$ 有解。题目给“存在 $b\in[0,1]$ 使 $f(f(b))=b$”，等价于 $f(x)=x$ 在 $[0,1]$ 内有解。由 $x=\sqrt{e^x+x-a}$ 得 $a=e^x-x^2+x=:g(x)$（$x\in[0,1]$）。于是 $g^{\prime}(x)=e^x-2x+1\ge0$，故 $g$ 在 $[0,1]$ 单调递增， $a$ 的可取值就是 $g([0,1])=[g(0),g(1)]=[1,e]$。
