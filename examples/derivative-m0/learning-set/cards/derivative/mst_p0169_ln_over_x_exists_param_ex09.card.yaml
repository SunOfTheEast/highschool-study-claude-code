stem: |-
  （2022·哈三中期末 T7）已知函数 $f(x)=\frac{\ln x}{x}$，$g(x)=\ln(x+1)-ax^2$，若 $\forall x_1 \in [1, e]$，$\exists x_2 \in (0, 1]$ 使得 $f(x_1) > g(x_2)$ 成立，则实数 $a$ 的取值范围是（  ）
  A. $a > \ln 2$
  B. $a \geqslant \ln 2$
  C. $a > \frac{1}{e}$
  D. $a \geqslant \frac{1}{e}-\ln 2$
answer: |
  A

  先处理
  \[
  f(x)=\frac{\ln x}{x},\quad
  f^{\prime}(x)=\frac{1-\ln x}{x^2}.
  \]
  在 $[1,e]$ 上有 $f^{\prime}(x)\ge0$，故 $f$ 单调递增，最小值为
  \[
  f_{\min}=f(1)=0.
  \]
  原条件
  \[
  \forall x_1\in[1,e],\ \exists x_2\in(0,1],\ f(x_1)>g(x_2)
  \]
  由源解改写为存在 $x\in(0,1]$ 使
  \[
  g(x)=\ln(x+1)-ax^2<0
  \iff a>\frac{\ln(x+1)}{x^2}.
  \]
  设
  \[
  h(x)=\frac{\ln(x+1)}{x^2},\quad x\in(0,1],
  \]
  则需
  \[
  a>h_{\min}.
  \]
  计算
  \[
  h^{\prime}(x)=\frac{\frac{x}{x+1}-2\ln(x+1)}{x^3},
  \]
  设
  \[
  \varphi(x)=\frac{x}{x+1}-2\ln(x+1),
  \]
  有
  \[
  \varphi^{\prime}(x)=\frac{-2x-1}{(x+1)^2}<0,
  \]
  所以 $\varphi(x)<\varphi(0)=0$，进而 $h^{\prime}(x)<0$，即 $h$ 在 $(0,1]$ 单调递减。
  因而
  \[
  h_{\min}=h(1)=\ln2.
  \]
  故
  \[
  a>\ln2.
  \]
  选 A。
