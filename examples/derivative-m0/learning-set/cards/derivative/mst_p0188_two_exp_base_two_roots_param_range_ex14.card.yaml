stem: （2025 · 河南模拟 T14）若关于 $x$ 的方程 $(2^x-ae^x)2^x=-2e^{2x}$ 存在两个不等实根，则实数 $a$ 的取值范围是______。
answer: |-
  $(2\sqrt2,+\infty)$

  原方程等价于 $a=\left(\frac2e\right)^x+2\left(\frac e2\right)^x$。令 $t=\left(\frac e2\right)^x>0$，则 $\left(\frac2e\right)^x=\frac1t$，从而 $a=\frac1t+2t$。由 AM-GM（或对勾函数最小值）得 $\frac1t+2t\ge2\sqrt2$，当且仅当 $t=\frac1{\sqrt2}$ 取等。此时对应唯一 $x$，只产生一个实根； 要有两个不等实根，必须严格大于最小值，故 $a\in(2\sqrt2,+\infty)$。
