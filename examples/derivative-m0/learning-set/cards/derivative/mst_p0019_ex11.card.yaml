      - 不等式工具结构
    evidence:
      - $\frac{2ex}{1+\ln2x}=g(1+\ln2x)$，$\frac{e^{2x}}{2x}=g(2x)$。
      - 两个输入围绕 g 的极小点 1 分区讨论。
    normalization_moves_used:
      - 两边除以 $2x$，配出 $g(u)=e^u/u$。
      - 用 $e^{1+\ln2x}=2ex$ 识别左侧。
      - 用 $z-1\ge\ln z$ 比较 $1+\ln2x$ 与 $2x$。
      - 按 $x<1/2$ 和 $x>1/2$ 判断两个输入位于 g 的哪段单调区间。
  fallback:
    only_if_trace_shows:
      - 若学生不会把 $\frac{2ex}{1+\ln2x}$ 识别为 $g(1+\ln2x)$，回补指数对数基础。
      - 若学生忘记要求 $1+\ln2x>0$ 才能进入 $g(u)=e^u/u$ 的正定义域，回补函数三要素与定义域。
      - 若学生不知道 $e^u/u$ 在 $(0,1)$ 递减、在 $(1,+\infty)$ 递增，回补导数单调极值基础。
      - 若学生不能由 $z-1\ge\ln z$ 推出 $1+\ln2x\le2x$，回补不等式工具基础。
      - 若学生在 $x<1/2$ 与 $x>1/2$ 两段中把 g 的单调方向用反，回补函数性质与图像。
  detail_terms:
