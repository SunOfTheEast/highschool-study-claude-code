stem: |-
  (2024 港口区月考 T8) 已知函数 $f(x)=\frac{4\mathrm e x^2}{1+\ln 2x}$， 则不等式 $f(x)>\mathrm e^{2x}$ 的解集是 ( )
  A. $(0,1)$
  B. $\left(\frac1{2\mathrm e},\frac14\right)$
  C. $\left(\frac1{\mathrm e},1\right)$
  D. $\left(\frac1{2\mathrm e},\frac12\right)$
answer: |-
  D. $\left(\frac1{2\mathrm e},\frac12\right)$

  原不等式可化为 $\frac{2ex}{1+\ln2x}>\frac{e^{2x}}{2x}$。令 $g(u)=e^u/u$，则左侧为 $g(1+\ln2x)$，右侧为 $g(2x)$。由 $z-1\ge\ln z$ 得 $1+\ln2x\le2x$，等号仅在 $x=1/2$。当 $1/(2e)<x<1/2$ 时，$0<1+\ln2x<2x<1$，而 $g$ 在 $(0,1)$ 递减， 所以 $g(1+\ln2x)>g(2x)$。当 $x>1/2$ 时，两输入都大于 1 且 $1+\ln2x<2x$，$g$ 递增，原不等式不成立。故解集为 $(1/(2e),1/2)$，选 D。
