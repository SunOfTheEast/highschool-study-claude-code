original_problem:
  stem: (2024 港口区月考 T8) 已知函数 $f(x)=\frac{4\mathrm e x^2}{1+\ln 2x}$， 则不等式 $f(x)>\mathrm e^{2x}$ 的解集是 ( )
  parts: *a1
  choices:
    - label: A
      text: $(0,1)$
    - label: B
      text: $\left(\frac1{2\mathrm e},\frac14\right)$
    - label: C
      text: $\left(\frac1{\mathrm e},1\right)$
    - label: D
      text: $\left(\frac1{2\mathrm e},\frac12\right)$
  answer: D. $\left(\frac1{2\mathrm e},\frac12\right)$
  fidelity_notes:
    - 题头、题干和完整解析均在 page_0019。
    - 源图与 markdown 对题干分母 $1+\ln 2x$、选项 B 的 $1/4$、选项 D 的 $1/2$ 一致。
    - 解析末段关于 $x>1/2$ 的输入大小关系疑似印刷错误，本卡按切线不等式修正逻辑并保留 review 标记。
solution:
  source_solution_summary: 原不等式可化为 $\frac{2ex}{1+\ln2x}>\frac{e^{2x}}{2x}$。令 $g(u)=e^u/u$，则左侧为 $g(1+\ln2x)$，右侧为 $g(2x)$。由 $z-1\ge\ln z$ 得 $1+\ln2x\le2x$，等号仅在 $x=1/2$。当 $1/(2e)<x<1/2$ 时，$0<1+\ln2x<2x<1$，而 $g$ 在 $(0,1)$ 递减， 所以 $g(1+\ln2x)>g(2x)$。当 $x>1/2$ 时，两输入都大于 1 且 $1+\ln2x<2x$，$g$ 递增，原不等式不成立。故解集为 $(1/(2e),1/2)$，选 D。
  key_steps:
    - step_id: step_1
      statement: 把原不等式改写成同一个函数 g 的两个输入比较。
      formula_trace:
        from: $\frac{4ex^2}{1+\ln2x}>e^{2x}$
        to: $\frac{2ex}{1+\ln2x}>\frac{e^{2x}}{2x}$
        operation: 两边同除以正数 $2x$，并把左侧预留成 $e^{1+\ln2x}/(1+\ln2x)$。
        why: 这样能把两边分别识别为 $g(1+\ln2x)$ 与 $g(2x)$。
      source_ref: page_0019_solution
    - step_id: step_2
      statement: 定义同构函数并确定单调性。
      formula_trace:
        from: $g(u)=\frac{e^u}{u}$
        to: $g(1+\ln2x)>g(2x),\quad g\ \text{在 }(0,1)\text{递减，在 }(1,+\infty)\text{递增}$
        operation: 用 $e^{1+\ln2x}=2ex$ 将左侧写为 $g(1+\ln2x)$。
        why: 比较 g 值要先判断两个输入落在 1 的哪一侧。
      source_ref: page_0019_solution
    - step_id: step_3
      statement: 用切线不等式比较两个输入。
      formula_trace:
        from: $z-1\ge\ln z\quad(z>0)$
        to: $1+\ln2x\le2x$
        operation: 令 $z=2x$，得到 $2x-1\ge\ln2x$。
        why: 输入大小决定在同一单调区间内哪一个 g 值更大。
      source_ref: page_0019_solution
    - step_id: step_4
      statement: 讨论两个输入都落在 (0,1) 的情况。
      formula_trace:
        from: $0<x<\frac12,\quad 1+\ln2x>0$
        to: $\frac1{2e}<x<\frac12,\quad 0<1+\ln2x<2x<1$
        operation: 由 $1+\ln2x>0$ 得 $x>1/(2e)$，再结合 $1+\ln2x<2x$。
        why: 在 $(0,1)$ 上 g 递减，较小输入给出较大函数值，所以原不等式成立。
      source_ref: page_0019_solution
    - step_id: step_5
      statement: 排除 x 大于 1/2 的情况并写出答案。
      formula_trace:
        from: $x>\frac12,\quad 1<1+\ln2x<2x$
        to: $g(1+\ln2x)<g(2x)$，原不等式不成立；解集为 $\left(\frac1{2e},\frac12\right)$
        operation: 利用 g 在 $(1,+\infty)$ 上递增，输入小则函数值小。
        why: 严格不等式排除 $x=1/2$，而 $x\le1/(2e)$ 时 $1+\ln2x\le0$ 不在 g 的正定义域且原不等式不成立。
      source_ref: page_0019_solution
teaching_card:
  student_title: 把两边都看成 $g(u)=\frac{e^u}{u}$ 的函数值
  what_it_trains: 训练把复杂指数对数不等式改写成同一函数的两个输入比较，并按极小点两侧的单调性解区间。
  recognition_cues:
    - 左侧有 $1+\ln2x$ 在分母，右侧有 $e^{2x}$，容易配成 $e^u/u$。
    - 出现 $1+\ln2x$ 与 $2x$，提示使用 $z-1\ge\ln z$。
    - 选项端点含 $1/(2e)$ 和 $1/2$，分别来自 $1+\ln2x=0$ 与 $2x=1$。
  normalization_moves:
    - 先除以 $2x$，把右侧写成 $g(2x)$。
    - 用 $e^{1+\ln2x}=2ex$，把左侧写成 $g(1+\ln2x)$。
    - 先保证两个输入为正，再按是否小于 1 分段。
  common_failures:
    - 直接交叉相乘而没有注意 $1+\ln2x$ 的符号。
    - 把 $g$ 在 $(0,1)$ 上的递减性用成递增。
    - 在 $x>1/2$ 段误写 $1+\ln2x>2x$，与切线不等式矛盾。
    - 把端点 $x=1/2$ 放入答案，忽略原不等式为严格大于。
  similar_practice_query: e^x/x 同构 1+ln2x 2x 切线不等式 解集
quality:
