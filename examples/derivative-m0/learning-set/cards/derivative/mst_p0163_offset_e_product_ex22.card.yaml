solution:
  source_solution_summary: |
    设
    \[
    g(x)=\frac{e^2x}{e^x},
    \]
    则
    \[
    g'(x)=\frac{e^2(1-x)}{e^x},\quad
    g''(x)=\frac{e^2(x-2)}{e^x},\quad
    g'''(x)=\frac{e^2(3-x)}{e^x}>0\ \text{(在 }(-3,3)\text{)}.
    \]
    源解据此使用“极值点左偏”结论：若 $g(x_1)=g(x_2)$，则有 $x_1+x_2>2$。

    令 $g(1.1)=g(m)$，则
    \[
    m+1.1>2=0.9+1.1,
    \]
    且由函数单峰位置可得 $1>m>0.9$，于是
    \[
    g(1.1)=g(m)>g(0.9)
    \Rightarrow
    1.1e^{0.9}>0.9e^{1.1}.
    \]
    再由
    \[
    e^{0.1}>1.1
    \Rightarrow
    0.9e^{1.1}>0.99e.
    \]
    合并得
    \[
    a>c>b,
    \]
    选 D。
  key_steps:
    - step_id: step_1
      statement: 把 $a,c$ 的比较统一到同一指数函数模型。
      formula_trace:
        from: $a=1.1e^{0.9},\ c=0.9e^{1.1}$
        to: 构造 $g(x)=\\frac{e^2x}{e^x}$，则 $g(1.1)=a,\ g(0.9)=c$
        operation: 把“系数×指数”改写为同一 $g(x)$ 在两点的函数值。
        why: 把代数比较转成函数值比较。
      source_ref: page_0163_ex22_solution
    - step_id: step_2
      statement: 利用三阶导符号触发极值点左偏。
      formula_trace:
        from: $g^{\prime\prime\prime}(x)=\\frac{e^2(3-x)}{e^x}>0$（在相关区间）
        to: 若 $g(x_1)=g(x_2)$，则 $x_1+x_2>2$
        operation: 调用源页“极值偏移”结论。
        why: 为后续从等值点反推位置关系做准备。
      source_ref: page_0163_ex22_solution
    - step_id: step_3
      statement: 通过等值点 $m$ 得到 $a>c$。
      formula_trace:
        from: $g(1.1)=g(m)$ 且 $m+1.1>2=0.9+1.1$
        to: $1>m>0.9\\Rightarrow g(1.1)=g(m)>g(0.9)$
        operation: 先定位 $m$ 落在 $(0.9,1)$，再用该段单调性比较函数值。
        why: 得到 $1.1e^{0.9}>0.9e^{1.1}$，即 $a>c$。
      source_ref: page_0163_ex22_solution
    - step_id: step_4
      statement: 再比较 $c$ 与 $b$。
      formula_trace:
        from: $e^{0.1}>1.1$
        to: $0.9e^{1.1}>0.99e$
        operation: 两侧同乘 $0.9e$。
        why: 得到 $c>b$。
      source_ref: page_0163_ex22_solution
    - step_id: step_5
      statement: 合并顺序并匹配选项。
      formula_trace:
        from: $a>c$ 且 $c>b$
        to: $a>c>b$，选 D
        operation: 链式合并。
        why: 得到唯一正确项。
      source_ref: page_0163_ex22_solution
