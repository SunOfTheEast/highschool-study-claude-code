stem: |-
  设 $a=1.1e^{0.9}$，$b=0.99e$，$c=0.9e^{1.1}$，则（  ）
  A. $c>a>b$
  B. $c>b>a$
  C. $a>b>c$
  D. $a>c>b$
answer: |
  D

  设
  \[
  g(x)=\frac{e^2x}{e^x},
  \]
  则
  \[
  g'(x)=\frac{e^2(1-x)}{e^x},\quad
  g''(x)=\frac{e^2(x-2)}{e^x},\quad
  g'''(x)=\frac{e^2(3-x)}{e^x}>0\ \text{(在 }(-3,3)\text{)}.
  \]
  源解据此使用“极值点左偏”结论：若 $g(x_1)=g(x_2)$，则有 $x_1+x_2>2$。

  令 $g(1.1)=g(m)$，则
  \[
  m+1.1>2=0.9+1.1,
  \]
  且由函数单峰位置可得 $1>m>0.9$，于是
  \[
  g(1.1)=g(m)>g(0.9)
  \Rightarrow
  1.1e^{0.9}>0.9e^{1.1}.
  \]
  再由
  \[
  e^{0.1}>1.1
  \Rightarrow
  0.9e^{1.1}>0.99e.
  \]
  合并得
  \[
  a>c>b,
  \]
  选 D。
