original_problem:
  stem: 若 f(x)=x\ln x，若 f(x)\geqslant ax^2+\frac{2}{a} (a\neq0) 在 x\in(0,+\infty) 上恒成立，求 a 的最小值。
  parts: *a1
  choices: []
  answer: -e^3
  fidelity_notes: []
solution:
  source_solution_summary: 因为 x>0，原不等式等价于 g(x)=\ln x-ax-\frac{2}{ax}\geqslant0 恒成立。 若 a>0，取 x=1 得 g(1)=-a-\frac{2}{a}<0，不合题意。若 a<0， g 的唯一正临界点是 x=-1/a，且那里为最小值；由 g(-1/a)=\ln(-1/a)+3\geqslant0 得 -1/a\geqslant e^{-3}， 即 -e^3\leqslant a<0，所以 a 的最小值为 -e^3。
  key_steps:
    - step_id: step_1
      statement: 先把 x 提出来，只留下一个单独的 \ln x。
      formula_trace:
        from: x\ln x-ax^2-\frac{2}{a}\geqslant0
        to: x\left(\ln x-ax-\frac{2}{ax}\right)\geqslant0
        operation: 利用 x>0 提取公因式 x。
        why: 恒成立问题可转成研究括号内函数的最小值，导数中不再出现 x\ln x 的乘积。
      source_ref: page_0046_solution
    - step_id: step_2
      statement: 定义辅助函数并写出等价条件。
      formula_trace:
        from: x\left(\ln x-ax-\frac{2}{ax}\right)\geqslant0,\quad x>0
        to: g(x)=\ln x-ax-\frac{2}{ax}\geqslant0,\quad x>0
        operation: 因 x 为正数，直接除去 x。
        why: 只需保证 g(x) 的最小值不小于 0。
      source_ref: page_0046_solution
    - step_id: step_3
      statement: 排除 a>0 的情形。
      formula_trace:
        from: g(1)=-a-\frac{2}{a}
        to: g(1)<0\quad(a>0)
        operation: 代入 x=1 检验恒成立的必要条件。
        why: 只要存在一个 x 使 g(x)<0，原不等式就不能恒成立。
      source_ref: page_0046_solution
    - step_id: step_4
      statement: 对 a<0 求 g 的最小值位置。
      formula_trace:
        from: g'(x)=\frac{-a^2(x+\frac{1}{a})(x-\frac{2}{a})}{ax^2}
        to: g(x)_{\min}=g\left(-\frac{1}{a}\right)
        operation: 分析 a<0 时导数符号，正的临界点为 -1/a。
        why: g 在 (0,-1/a) 递减，在 (-1/a,+\infty) 递增。
      source_ref: page_0046_solution
    - step_id: step_5
      statement: 由最小值不小于 0 解出 a 的范围。
      formula_trace:
        from: g\left(-\frac{1}{a}\right)=\ln\left(-\frac{1}{a}\right)+3\geqslant0
        to: -e^3\leqslant a<0
        operation: 化为 -1/a\geqslant e^{-3}，再在 a<0 下变形。
        why: 这是原不等式对所有 x>0 成立的充要范围。
      source_ref: page_0046_solution
teaching_card:
  student_title: 把 x\ln x 提出 x 后再求参数最小值
  what_it_trains: 训练在含 x\ln x 的恒成立题中先清掉对数前的变量因子，再用导数和参数正负分类找最小值。
  recognition_cues:
    - 不等式含 x\ln x、ax^2 和常数除以 a。
    - 定义域给出 x>0。
    - 直接求导会留下 \ln x，结构比较复杂。
  normalization_moves:
    - 先写成 x(\ln x-ax-\frac{2}{ax})。
    - a>0 用特值 x=1 快速排除。
    - a<0 时只研究 g 在 -1/a 处的最小值。
  common_failures:
    - 直接研究 F'(x)=\ln x+1-2ax，陷入二次求导。
    - 忘记 a>0 时 x=1 已经使不等式失败。
    - 由 -1/a\geqslant e^{-3} 推 a 范围时方向写反。
  similar_practice_query: x ln x 与 ax^2 加常数的恒成立题，提取 x 后做对数单身狗
