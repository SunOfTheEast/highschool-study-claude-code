stem: 若 f(x)=x\ln x，若 f(x)\geqslant ax^2+\frac{2}{a} (a\neq0) 在 x\in(0,+\infty) 上恒成立，求 a 的最小值。
answer: |-
  -e^3

  因为 x>0，原不等式等价于 g(x)=\ln x-ax-\frac{2}{ax}\geqslant0 恒成立。 若 a>0，取 x=1 得 g(1)=-a-\frac{2}{a}<0，不合题意。若 a<0， g 的唯一正临界点是 x=-1/a，且那里为最小值；由 g(-1/a)=\ln(-1/a)+3\geqslant0 得 -1/a\geqslant e^{-3}， 即 -e^3\leqslant a<0，所以 a 的最小值为 -e^3。
