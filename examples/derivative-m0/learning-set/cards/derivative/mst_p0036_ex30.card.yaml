stem: 已知函数 $f(x)=a\ln x-2x(a\neq 0)$，若不等式 $x^a \geqslant 2e^{2x}f(x)+e^{2x}\cos(f(x))$ 对 $x>0$ 恒成立，则实数 $a$ 的取值范围为 ______。
answer: |
  $(0,2e]$

  将原式两边同除以 $e^{2x}$，得 $e^{a\ln x-2x}-2f(x)-\cos f(x)\ge0$，即令 $t=f(x)$ 后要有 $g(t)=e^t-2t-\cos t\ge0$。源解分析 $g'(t)=e^t-2+\sin t$，得到 $g(0)=0$，且 $g$ 在正数侧会先下降到负值，所以若要 $g(f(x))\ge0$ 对所有 $x>0$ 成立，只能让 $f(x)\le0$ 恒成立。若 $a<0$，$f(x)$ 的值域为 $\mathbb R$，会取到使 $g<0$ 的值，不合题意。若 $a>0$，$f$ 在 $x=a/2$ 处取最大值 $a\ln(a/2)-a$，要求该最大值不超过 $0$，即 $\ln(a/2)\le1$，得 $0<a\le2e$。
