original_problem:
  stem: 已知函数 $f(x)=a\ln x-2x(a\neq 0)$，若不等式 $x^a \geqslant 2e^{2x}f(x)+e^{2x}\cos(f(x))$ 对 $x>0$ 恒成立，则实数 $a$ 的取值范围为 ______。
  parts: *a1
  choices: []
  answer: $(0,2e]$
  fidelity_notes:
    - 已核对 page_0036 原图，题干中右侧为 $2e^{2x}f(x)+e^{2x}\\cos(f(x))$，条件为对 $x>0$ 恒成立。
    - 源页图像含 $y=e^t-2t-\\cos t$ 与 $t=a\\ln x-2x$ 两幅示意图；卡片保留其“外层函数有负值区、内层需不取正值”的作用。
solution:
  source_solution_summary: |
    将原式两边同除以 $e^{2x}$，得 $e^{a\ln x-2x}-2f(x)-\cos f(x)\ge0$，即令 $t=f(x)$ 后要有 $g(t)=e^t-2t-\cos t\ge0$。源解分析 $g'(t)=e^t-2+\sin t$，得到 $g(0)=0$，且 $g$ 在正数侧会先下降到负值，所以若要 $g(f(x))\ge0$ 对所有 $x>0$ 成立，只能让 $f(x)\le0$ 恒成立。若 $a<0$，$f(x)$ 的值域为 $\mathbb R$，会取到使 $g<0$ 的值，不合题意。若 $a>0$，$f$ 在 $x=a/2$ 处取最大值 $a\ln(a/2)-a$，要求该最大值不超过 $0$，即 $\ln(a/2)\le1$，得 $0<a\le2e$。
  key_steps:
    - step_id: step_1
      statement: 把原不等式除去公共指数因子，露出 $f(x)$ 的同构形式。
      formula_trace:
        from: |
          $x^a \ge 2e^{2x}f(x)+e^{2x}\cos(f(x))$
        to: |
          $e^{a\ln x-2x}-2f(x)-\cos(f(x))\ge0$
        operation: 两边同除以正数 $e^{2x}$，并把 $x^a/e^{2x}$ 写成 $e^{a\ln x-2x}$。
        why: 因为 $a\ln x-2x=f(x)$，原式可以变成只含 $f(x)$ 的外层函数。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:16
    - step_id: step_2
      statement: 设 $t=f(x)$，分析外层函数的非负区域。
      formula_trace:
        from: |
          $e^{f(x)}-2f(x)-\cos(f(x))\ge0$
        to: |
          $g(t)=e^t-2t-\cos t,\quad g(t)\ge0$
        operation: 令 $t=f(x)$，用 $g'(t)=e^t-2+\sin t$ 判断 $g$ 先降后升，且 $g(0)=0$。
        why: 图像和单调性显示 $t>0$ 附近会出现 $g(t)<0$，所以内层 $f(x)$ 不能取正值。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:16-23
    - step_id: step_3
      statement: 排除 $a<0$。
      formula_trace:
        from: |
          $f(x)=a\ln x-2x,\quad a<0$
        to: |
          $\lim_{x\to0^+}f(x)=+\infty,\quad \lim_{x\to+\infty}f(x)=-\infty$
        operation: 利用 $\ln x\to-\infty$ 且 $a<0$，并观察 $-2x$ 在无穷远处占主导。
        why: $f(x)$ 可取遍包含正数附近的值，会命中 $g(t)<0$ 的区域。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:25
    - step_id: step_4
      statement: 对 $a>0$ 求 $f$ 的最大值。
      formula_trace:
        from: |
          $f'(x)=\frac ax-2$
        to: |
          $f$ 在 $(0,a/2)$ 递增，在 $(a/2,+\infty)$ 递减，$f_{\max}=f(a/2)=a\ln\frac a2-a$
        operation: 由 $f'(x)>0\Leftrightarrow0<x<a/2$，$f'(x)<0\Leftrightarrow x>a/2$ 判断单调性。
        why: 要让 $f(x)\le0$ 恒成立，只需最大值不超过 $0$。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:27
    - step_id: step_5
      statement: 解最大值不超过零的参数条件。
      formula_trace:
        from: |
          $a\ln\frac a2-a\le0,\quad a>0$
        to: |
          $\ln\frac a2\le1\Rightarrow 0<a\le2e$
        operation: 两边除以正数 $a$，再指数化。
        why: 得到使 $f(x)\le0$ 恒成立的全部参数。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0036/page_0036.md:27
teaching_card:
  student_title: 把恒成立拆成外层 $g(t)$ 和内层值域
  what_it_trains: 遇到 $x^a$、$e^{2x}$、$f(x)$ 混在一起的恒成立题，先把指数统一成 $e^{f(x)}$，再看外层函数允许内层 $f(x)$ 取哪些值。
  recognition_cues:
    - 题干同时出现 $x^a$ 与 $e^{2x}$，而 $f(x)=a\\ln x-2x$ 正好是指数的幂。
    - 化简后只剩 $e^{f(x)}-2f(x)-\\cos f(x)$。
    - 外层函数图像在 $t=0$ 右侧下探到负值，内层必须被压在 $t\\le0$。
  normalization_moves:
    - 先除以 $e^{2x}$，不要直接对原式硬求导。
    - 令 $t=f(x)$，单独分析 $g(t)=e^t-2t-\\cos t$。
    - 把 $f(x)\\le0$ 恒成立转成 $a>0$ 时的最大值条件。
  common_failures:
    - 忘记 $x^a=e^{a\\ln x}$，看不出 $e^{f(x)}$。
    - 只算 $g(0)=0$，没有注意 $g$ 在正数侧有负值。
    - 把源解里的导数笔误照抄成 $0<x<a/2$ 时 $f'(x)<0$。
    - 解 $a\ln(a/2)-a\le0$ 时忘记前提 $a>0$。
  similar_practice_query: 复合嵌套函数 恒成立 e^{f(x)}-2f(x)-cosf(x) a ln x - 2x
