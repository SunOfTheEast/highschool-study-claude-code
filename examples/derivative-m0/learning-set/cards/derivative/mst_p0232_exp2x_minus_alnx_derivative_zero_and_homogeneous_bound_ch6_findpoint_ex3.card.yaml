original_problem:
  stem: （2015 · 新课标 I）设函数 $f(x)=e^{2x}-a\ln x$。
  parts: *a1
  choices: []
  answer: 第 (1) 问：当 $a\leqslant0$ 时 $f^\prime(x)$ 无零点；当 $a>0$ 时 $f^\prime(x)$ 有唯一零点。第 (2) 问不等式成立，等号在 $x=\frac12,\ a=e$ 时取到。
  fidelity_notes:
    - 两问均无选项。
    - 函数定义域为 $x>0$。
solution:
  source_solution_summary: $f'(x)=2e^{2x}-\frac ax$。当 $a\leqslant0$ 时 $f'(x)>0$，无零点。 当 $a>0$ 时 $f''(x)>0$，所以 $f'$ 单调递增。找大点时用 $e^{2x}>1$ 得 $f'(x)>2(1-\frac a{2x})$，取 $x=a/2$ 得 $f'(a/2)>0$。找小点时在 $(0,a/2)$ 内有 $f'(x)<2e^a-\frac ax$，取 $x=\frac a{2e^a}$ 得 $f'(x)<0$， 所以唯一零点位于 $(\frac a{2e^a},\frac a2)$。第 (2) 问令 $h(t)=e^t-t-1\geqslant0$，则 $f(x)-2a-a\ln\frac2a =a h(2x-\ln a)+a h(\ln 2x)\geqslant0$，等号要求 $2x-\ln a=0$ 且 $\ln2x=0$，即 $x=1/2,\ a=e$。
  key_steps:
    - step_id: step_1
      statement: 写出导函数并处理 $a\leqslant0$。
      formula_trace:
        from: $f(x)=e^{2x}-a\ln x$
        to: $f^\prime(x)=2e^{2x}-\frac ax$
        operation: 求导。
        why: $a\leqslant0$ 时 $-\frac ax\geqslant0$，所以无零点。
      source_ref: page_0232_ex3_solution_start
    - step_id: step_2
      statement: $a>0$ 时先确定 $f^\prime$ 单调递增。
      formula_trace:
        from: $f^\prime(x)=2e^{2x}-\frac ax$
        to: $f^{\prime\prime}(x)>0$
        operation: 再求导。
        why: 单调递增后，只需找一负一正两个点。
      source_ref: page_0232_ex3_solution_start
    - step_id: step_3
      statement: 用小函数找大点。
      formula_trace:
        from: $f^\prime(x)=2(e^{2x}-\frac a{2x})$
        to: $f^\prime(\frac a2)>0$
        operation: 用 $e^{2x}>1$，解 $1-\frac a{2x}=0$ 得 $x=a/2$。
        why: 这是找右侧正值点。
      source_ref: page_0233_ex3_continuation
    - step_id: step_4
      statement: 用大函数找小点。
      formula_trace:
        from: $0<x<\frac a2$
        to: $f^\prime(x)<2e^a-\frac ax$
        operation: 用 $2e^{2x}<2e^a$。
        why: 要让原函数导数为负，先让一个更大的函数为 0。
      source_ref: page_0233_ex3_continuation
    - step_id: step_5
      statement: 取小点并夹出唯一零点。
      formula_trace:
        from: $2e^a-\frac ax=0$
        to: $x=\frac a{2e^a},\quad x_1\in(\frac a{2e^a},\frac a2)$
        operation: 解可解方程，结合 $f^\prime$ 单调递增和两端变号。
        why: 这给出导函数唯一零点的位置。
      source_ref: page_0233_ex3_continuation
    - step_id: step_6
      statement: 第 (2) 问使用 $h(t)=e^t-t-1\geqslant0$。
      formula_trace:
        from: $h(t)=e^t-t-1$
        to: $h(t)\geqslant0$
        operation: 由导数或基本指数不等式证明。
        why: 目标差要拆成两个 $h$ 的和。
      source_ref: page_0233_ex3_continuation
    - step_id: step_7
      statement: 把目标差拆成两个同构保值块。
      formula_trace:
        from: $f(x)-2a-a\ln\frac2a$
        to: $a h(2x-\ln a)+a h(\ln2x)$
        operation: 整理为 $(e^{2x-\ln a}-2x+\ln a-1)+(2x-\ln2x-1)$ 后乘 $a$。
        why: 两个 $h$ 都非负，且 $a>0$。
      source_ref: page_0233_ex3_continuation
    - step_id: step_8
      statement: 记录等号条件。
      formula_trace:
        from: $2x-\ln a=0,\ \ln2x=0$
        to: $x=\frac12,\ a=e$
        operation: 联立两个 $h$ 同时取等。
        why: source 明确给出等号成立条件。
      source_ref: page_0233_ex3_continuation
teaching_card:
  student_title: 先给 $f^\prime$ 两边取点，再把下界拆成两个 $e^t-t-1$
  what_it_trains: 训练找点体系的升级版：导函数零点靠锁界取点，不等式下界靠同构保值性拆块。
  recognition_cues:
    - $f^\prime(x)=2e^{2x}-a/x$ 同时有指数正项和反比例负项。
    - $a>0$ 时 $f^\prime$ 递增，找一个负点和一个正点即可。
    - 目标 $2a+a\ln(2/a)$ 暗示把表达式拆成两个 $e^t-t-1$。
  normalization_moves:
    - 先分 $a\leqslant0$ 与 $a>0$。
    - $a>0$ 时用 $a/2$ 找正点，用 $a/(2e^a)$ 找负点。
    - 第 (2) 问设 $h(t)=e^t-t-1$。
    - 把目标差整理为 $a h(2x-\ln a)+a h(\ln2x)$。
  common_failures:
    - 只知道 $f^\prime$ 递增，却不知道如何证明它真的有零点。
    - 找小点时放缩方向错，把需要的大函数写成小函数。
    - 第 (2) 问看不出两个 $h$ 的拆法，只做机械展开。
  similar_practice_query: e^{2x}-a lnx 导函数零点 找点 锁界 a/(2e^a) a/2 同构保值性 e^t-t-1
