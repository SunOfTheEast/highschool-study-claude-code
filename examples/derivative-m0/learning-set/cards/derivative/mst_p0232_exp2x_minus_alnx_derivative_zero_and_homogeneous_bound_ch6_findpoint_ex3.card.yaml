stem: |-
  （2015 · 新课标 I）设函数 $f(x)=e^{2x}-a\ln x$。
  1. 讨论 $f(x)$ 的导函数 $f^\prime(x)$ 零点的个数。
  2. 证明：当 $a>0$ 时，$f(x)\geqslant2a+a\ln\frac2a$。
answer: |-
  第 (1) 问：当 $a\leqslant0$ 时 $f^\prime(x)$ 无零点；当 $a>0$ 时 $f^\prime(x)$ 有唯一零点。第 (2) 问不等式成立，等号在 $x=\frac12,\ a=e$ 时取到。

  $f'(x)=2e^{2x}-\frac ax$。当 $a\leqslant0$ 时 $f'(x)>0$，无零点。 当 $a>0$ 时 $f''(x)>0$，所以 $f'$ 单调递增。找大点时用 $e^{2x}>1$ 得 $f'(x)>2(1-\frac a{2x})$，取 $x=a/2$ 得 $f'(a/2)>0$。找小点时在 $(0,a/2)$ 内有 $f'(x)<2e^a-\frac ax$，取 $x=\frac a{2e^a}$ 得 $f'(x)<0$， 所以唯一零点位于 $(\frac a{2e^a},\frac a2)$。第 (2) 问令 $h(t)=e^t-t-1\geqslant0$，则 $f(x)-2a-a\ln\frac2a =a h(2x-\ln a)+a h(\ln 2x)\geqslant0$，等号要求 $2x-\ln a=0$ 且 $\ln2x=0$，即 $x=1/2,\ a=e$。
