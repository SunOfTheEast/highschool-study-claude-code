original_problem:
  stem: （2025 · 河南安阳 · 一模）已知函数 $f(x)=\frac{x+1}{e^x}$。若当 $x>-1$ 时，$f(x)\ge1-ax^2$，求实数 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $a\ge1$。
  fidelity_notes:
    - 无选项。
    - 定义域条件是 $x>-1$；source 的 $g(-1)$ 是端点极限探路。
solution:
  source_solution_summary: 设 $g(x)=\frac{x+1}{e^x}-1+ax^2$，题目要求 $g(x)\ge0$ 对 $x>-1$ 恒成立。$a\le0$ 时右侧二次项方向不可能支撑 正无穷处的恒成立，所以先有 $a>0$。又 $g(0)=0$， $g^\prime(x)=-xe^{-x}+2ax$，$g^\prime(0)=0$，此处极点效应失效， 局部至少要 $g^{\prime\prime}(0)=2a-1\ge0$，得 $a\ge\frac12$。但还要检查左端点，$x\to-1^+$ 时 $g(x)\to a-1$，故 $a\ge1$。反过来若 $a\ge1$， $g(x)\ge (x+1)e^{-x}-1+x^2 =(x+1)(x-1+e^{-x})=(x+1)(e^{-x}-1-(-x))\ge0$， 因为 $x+1>0$ 且 $e^u\ge1+u$。
  key_steps:
    - step_id: step_1
      statement: 构造差函数。
      formula_trace:
        from: $\frac{x+1}{e^x}\ge1-ax^2$
        to: $g(x)=\frac{x+1}{e^x}-1+ax^2\ge0$
        operation: 移项。
        why: 恒成立问题转成差函数非负。
      source_ref: page_0269_ex9_solution_start
    - step_id: step_2
      statement: 检查 $x=0$ 的局部形态。
      formula_trace:
        from: $g(0)=0$，$g^\prime(x)=-xe^{-x}+2ax$
        to: $g^\prime(0)=0$，继续看 $g^{\prime\prime}(0)$
        operation: 求导并代入接触点。
        why: 一阶信息自动为 0，说明普通极点探路不足。
      source_ref: page_0269_ex9_solution_start
    - step_id: step_3
      statement: 局部必要条件。
      formula_trace:
        from: $g^{\prime\prime}(x)=(x-1)e^{-x}+2a$
        to: $g^{\prime\prime}(0)=2a-1\ge0$，$a\ge\frac12$
        operation: 二阶局部判定。
        why: 否则 0 附近会低于 0。
      source_ref: page_0270_ex9_solution_continuation
    - step_id: step_4
      statement: 端点探路给出更强必要条件。
      formula_trace:
        from: $\lim_{x\to-1^+}g(x)=a-1$
        to: $a\ge1$
        operation: 取左端点极限。
        why: 定义域开端点虽然不能代入，但极限不能为负。
      source_ref: page_0270_ex9_solution_continuation
    - step_id: step_5
      statement: 证明 $a\ge1$ 的充分性。
      formula_trace:
        from: $g(x)\ge\frac{x+1}{e^x}-1+x^2$
        to: $(x+1)(e^{-x}-1-(-x))\ge0$
        operation: 用 $a\ge1$ 降到 $a=1$ 并因式分解。
        why: $x+1>0$，且指数基础不等式 $e^{-x}\ge1-x$ 成立。
      source_ref: page_0270_ex9_solution_continuation
teaching_card:
  student_title: 极点失效时看端点：局部只给半步，端点给最终答案
  what_it_trains: 训练极点效应失效后的处理：不能只盯 $x=0$ 的切触，还要检查定义域端点。
  recognition_cues:
    - $g(0)=0$ 且 $g^\prime(0)=0$ 自动成立。
    - 二阶局部条件只推出 $a\ge\frac12$，不够最终。
    - 定义域是 $x>-1$，左端点虽然开着，但极限会卡住参数。
  normalization_moves:
    - 先构造 $g=f-(1-ax^2)$。
    - 看 $g^{\prime\prime}(0)$ 得局部必要条件。
    - 再看 $x\to-1^+$ 得 $a\ge1$。
    - 最后用 $a=1$ 的基准式回证所有 $a\ge1$。
  common_failures:
    - 只看到 $g^{\prime\prime}(0)\ge0$，误答 $a\ge\frac12$。
    - 因为 $x=-1$ 不在定义域，就完全忽略端点极限。
    - 充分性证明时没有把 $a\ge1$ 降到 $a=1$。
    - 不会把 $\frac{x+1}{e^x}-1+x^2$ 化成 $(x+1)(e^{-x}-1+x)$。
  similar_practice_query: (x+1)/e^x 1-ax^2 极点效应失效 端点探路 a>=1
