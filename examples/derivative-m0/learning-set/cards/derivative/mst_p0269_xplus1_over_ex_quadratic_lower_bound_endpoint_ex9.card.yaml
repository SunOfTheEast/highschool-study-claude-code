stem: （2025 · 河南安阳 · 一模）已知函数 $f(x)=\frac{x+1}{e^x}$。若当 $x>-1$ 时，$f(x)\ge1-ax^2$，求实数 $a$ 的取值范围。
answer: |-
  $a\ge1$。

  设 $g(x)=\frac{x+1}{e^x}-1+ax^2$，题目要求 $g(x)\ge0$ 对 $x>-1$ 恒成立。$a\le0$ 时右侧二次项方向不可能支撑 正无穷处的恒成立，所以先有 $a>0$。又 $g(0)=0$， $g^\prime(x)=-xe^{-x}+2ax$，$g^\prime(0)=0$，此处极点效应失效， 局部至少要 $g^{\prime\prime}(0)=2a-1\ge0$，得 $a\ge\frac12$。但还要检查左端点，$x\to-1^+$ 时 $g(x)\to a-1$，故 $a\ge1$。反过来若 $a\ge1$， $g(x)\ge (x+1)e^{-x}-1+x^2 =(x+1)(x-1+e^{-x})=(x+1)(e^{-x}-1-(-x))\ge0$， 因为 $x+1>0$ 且 $e^u\ge1+u$。
