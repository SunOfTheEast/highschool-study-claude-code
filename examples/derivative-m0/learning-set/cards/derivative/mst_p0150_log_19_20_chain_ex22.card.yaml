solution:
  source_solution_summary: |
    由
    \[
    19^x=20,\quad 20^y=21
    \]
    得
    \[
    x=\log_{19}20=\frac{\lg20}{\lg19},\qquad y=\log_{20}21=\frac{\lg21}{\lg20}.
    \]
    按源解插入同增量
    \[
    x=\frac{\lg20}{\lg19}
    >\frac{\lg20+\lg\frac{20}{19}}{\lg19+\lg\frac{20}{19}}
    =\frac{\lg\frac{400}{19}}{\lg20}
    >\frac{\lg21}{\lg20}=y,
    \]
    所以 $x>y$。
    又由“大指小底”：
    \[
    19^{20}>20^{19}\Rightarrow 19^{\frac{20}{19}}>20
    \Rightarrow \frac{20}{19}>\log_{19}20=x.
    \]
    由
    \[
    \log_{\frac{20}{19}}z=\frac{21}{20}
    \]
    得
    \[
    z=\left(\frac{20}{19}\right)^{\frac{21}{20}}>\frac{20}{19}>x.
    \]
    综上
    \[
    z>x>y,
    \]
    选 C。
  key_steps:
    - step_id: step_1
      statement: 把三个未知量改写成可比较的对数/幂表达。
      formula_trace:
        from: $19^x=20,\ 20^y=21,\ \log_{\frac{20}{19}}z=\frac{21}{20}$
        to: $x=\frac{\lg20}{\lg19},\ y=\frac{\lg21}{\lg20},\ z=\left(\frac{20}{19}\right)^{\frac{21}{20}}$
        operation: 分别作换底与对数定义反解。
        why: 统一到“分式比较 + 幂大小”两条线。
      source_ref: page_0150_ex22_solution
    - step_id: step_2
      statement: 先比较 $x$ 与 $y$。
      formula_trace:
        from: $x=\frac{\lg20}{\lg19}$
        to: $x>\frac{\lg\frac{400}{19}}{\lg20}>\frac{\lg21}{\lg20}=y$
        operation: 按源解在分子分母同时加 $\lg\frac{20}{19}$ 后再比较分子大小。
        why: 锁定 $x>y$。
      source_ref: page_0150_ex22_solution
    - step_id: step_3
      statement: 用“大指小底”给出 $x$ 的上界。
      formula_trace:
        from: $19^{20}>20^{19}$
        to: $\frac{20}{19}>\log_{19}20=x$
        operation: 幂不等式改写为同底对数比较。
        why: 为比较 $z$ 与 $x$ 提供中间锚点。
      source_ref: page_0150_ex22_solution
    - step_id: step_4
      statement: 比较 $z$ 与中间锚点。
      formula_trace:
        from: $z=\left(\frac{20}{19}\right)^{\frac{21}{20}}$
        to: $z>\frac{20}{19}>x$
        operation: 利用底数大于1且指数 $\frac{21}{20}>1$。
        why: 得到 $z>x$。
      source_ref: page_0150_ex22_solution
    - step_id: step_5
      statement: 合并链式关系并对应选项。
      formula_trace:
        from: $x>y$ 与 $z>x$
        to: $z>x>y$，选 C
        operation: 传递性合并。
        why: 完成作答。
      source_ref: page_0150_ex22_solution
teaching_card:
  student_title: 先造中间锚点，再串三者顺序
  what_it_trains: 训练“指数定义量 + 对数定义量”混合比较时的统一表达与链式合并能力。
  recognition_cues:
    - 题中同时出现 $a^x=b$ 与 $\log_a z=\text{常数}$。
    - 选项给的是三变量全序。
    - 可自然构造底数分数作比较锚点。
  normalization_moves:
    - 先换底把 $x,y$ 写成同类分式。
    - 再用“大指小底”找 $x$ 的可比上界。
    - 最后把 $z$ 写成同底幂并并链。
  common_failures:
    - 把 $\log_{\frac{20}{19}}z=\frac{21}{20}$ 误解成 $z=\frac{21}{20}$。
    - 只得到 $x>y$ 就直接选项，漏比较 $z$。
    - 忽略底数大于1导致幂函数单调方向判断错误。
  similar_practice_query: 19^x=20 20^y=21 log_{20/19}z=21/20 比大小
