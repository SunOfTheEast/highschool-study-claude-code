stem: |-
  （2023·山东月考·多选）若 $a=\ln1.1$，$b=\frac{1}{11}$，$c=\sin0.1$，$d=\frac{21}{220}$，则（  ）
  A. $a<b$
  B. $b<c$
  C. $a<d$
  D. $c<d$
answer: |
  BC

  先比 $a$ 与 $b$。有
  \[
  b=\frac1{11}=1-\frac1{1.1},
  \]
  且
  \[
  \ln x>1-\frac1x\quad(x>1),
  \]
  取 $x=1.1$ 得
  \[
  a=\ln1.1>b.
  \]
  再比 $a$ 与 $d$。注意
  \[
  d=\frac{21}{220}
    =\frac{1.1}{2}-\frac1{2\times1.1}
    =\frac12\left(1.1-\frac1{1.1}\right),
  \]
  且
  \[
  \ln x<\frac12\left(x-\frac1x\right)\quad(x>1),
  \]
  取 $x=1.1$ 得 $a<d$。
  再比较 $c$ 与 $d$：
  \[
  0.1-\frac{0.1^3}{6}<\sin0.1<0.1
  \]
  即
  \[
  0.099833\cdots<\sin0.1<0.1.
  \]
  而
  \[
  d=\frac{21}{220}\approx0.09545<0.0998<\sin0.1,
  \]
  所以 $d<c$。综上
  \[
  b<a<d<c.
  \]
  故 A 错、B 对、C 对、D 错，选 BC。
