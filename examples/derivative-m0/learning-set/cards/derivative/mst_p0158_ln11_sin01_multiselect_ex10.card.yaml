teaching_card:
  student_title: 四项多选先连成一条序链
  what_it_trains: 训练“模板改写 + 局部界 + 一次性全序”来高效处理真假混合选项。
  recognition_cues:
    - 含 $\ln(1+\varepsilon)$、$\sin\varepsilon$ 与多个分数常量。
    - 选项是若干局部不等式判断（A-D）。
    - 常见策略是先做全序再回填。
  normalization_moves:
    - 把常量改写成熟悉模板值。
    - 对每个函数量给可比上/下界。
    - 拼成单链后逐项核对选项真假。
  common_failures:
    - 把 $d$ 的模板改写写错（尤其分母）。
    - 把 $\sin0.1$ 下界计算成大于 $0.1$ 的错误值。
    - 逐选项分散判断，导致逻辑重复且易漏。
  similar_practice_query: ln1.1 sin0.1 多选 BC 比大小 b<a<d<c
