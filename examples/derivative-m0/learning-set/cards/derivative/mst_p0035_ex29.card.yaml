solution:
  source_solution_summary: |
    先把条件移项为 $e^\alpha-\frac1{2\alpha+\sin\alpha}>e^\beta-\frac1{2\beta+\sin\beta}$。构造 $F(x)=e^x-\frac1{2x+\sin x}$，$x>0$。因 $q(x)=2x+\sin x$ 满足 $q'(x)=2+\cos x>0$，且 $q(x)>0$，所以 $-1/q(x)$ 递增，$e^x$ 也递增，故 $F$ 在 $(0,+\infty)$ 上递增。由 $F(\alpha)>F(\beta)$ 得 $\alpha>\beta>0$。A 中 $(1/\alpha+1/\beta)(\alpha+\beta)=2+\alpha/\beta+\beta/\alpha>4$，所以 A 反向；B 因 $\alpha-\beta+1>1$ 成立；C 因 $\ln\alpha+\alpha>\ln\beta+\beta$ 反向；D 因 $1/e^\alpha<1/e^\beta$ 且 $1/\alpha<1/\beta$ 成立。故选 BD。
  key_steps:
    - step_id: step_1
      statement: 把题设整理成同一个函数的函数值比较。
      formula_trace:
        from: |
          $e^\alpha-e^\beta>\frac1{2\alpha+\sin\alpha}-\frac1{2\beta+\sin\beta}$
        to: |
          $e^\alpha-\frac1{2\alpha+\sin\alpha}>e^\beta-\frac1{2\beta+\sin\beta}$
        operation: 把含 $\alpha$ 的分式移到左侧，把 $e^\beta$ 移到右侧。
        why: 两边都变成 $F(x)=e^x-\frac1{2x+\sin x}$ 的形式。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:36
    - step_id: step_2
      statement: 证明构造函数递增。
      formula_trace:
        from: |
          $q(x)=2x+\sin x,\quad x>0$
        to: |
          $q'(x)=2+\cos x>0,\quad q(x)>q(0)=0$
        operation: 求导判断 $q$ 递增，并利用 $x>0$ 得分母为正。
        why: 分母正且递增时，$1/q(x)$ 递减，$-1/q(x)$ 递增。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:36
    - step_id: step_3
      statement: 由函数值比较推出变量大小。
      formula_trace:
        from: |
          $F(x)=e^x-\frac1{2x+\sin x}$
        to: |
          $F$ 在 $(0,+\infty)$ 上递增，$F(\alpha)>F(\beta)\Rightarrow \alpha>\beta>0$
        operation: 把递增的 $e^x$ 与递增的 $-1/(2x+\sin x)$ 相加，得到 $F$ 递增。
        why: 所有选项都只需要 $\alpha>\beta>0$ 这个顺序信息。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:36
    - step_id: step_4
      statement: 判断 A 的方向。
      formula_trace:
        from: |
          $\left(\frac1\alpha+\frac1\beta\right)(\alpha+\beta)$
        to: |
          $2+\frac\alpha\beta+\frac\beta\alpha>2+2\sqrt{\frac\alpha\beta\cdot\frac\beta\alpha}=4$
        operation: 展开乘积，并用基本不等式；因 $\alpha>\beta$，两比值不相等，所以严格大于。
        why: 同除以正数 $\alpha+\beta$ 得 $\frac1\alpha+\frac1\beta>\frac4{\alpha+\beta}$，A 错误。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:36
    - step_id: step_5
      statement: 判断 B。
      formula_trace:
        from: |
          $\alpha>\beta>0$
        to: |
          $\alpha-\beta+1>1\Rightarrow 2^{\alpha-\beta+1}>2^1=2$
        operation: 由 $\alpha-\beta>0$ 得指数大于 1，再用底数 $2>1$ 的指数函数递增性。
        why: B 正确。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:37
    - step_id: step_6
      statement: 判断 C。
      formula_trace:
        from: |
          $\alpha>\beta>0$
        to: |
          $\ln\alpha>\ln\beta,\quad \alpha>\beta\Rightarrow \ln\alpha+\alpha>\ln\beta+\beta$
        operation: 分别用对数函数和一次函数在正数域上的递增性，再相加。
        why: C 给出的方向是小于，故 C 错误。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:38
    - step_id: step_7
      statement: 判断 D。
      formula_trace:
        from: |
          $\alpha>\beta>0$
        to: |
          $e^\alpha>e^\beta\Rightarrow \frac1{e^\alpha}<\frac1{e^\beta},\quad \frac1\alpha<\frac1\beta$
        operation: 正数取倒数会反向；两个严格小于的不等式相加。
        why: 得到 $\frac1{e^\alpha}+\frac1\alpha<\frac1{e^\beta}+\frac1\beta$，D 正确。
      source_ref: materials/math/derivative/source/mst26-full-marked-c20/pages/page_0035/page_0035.md:39
teaching_card:
  student_title: 先构造单调函数推出 $\alpha>\beta$
  what_it_trains: 双变量条件看起来复杂时，先把所有含同一个变量的项收在同一边，构造一个递增函数；只要推出 $\alpha>\beta>0$，四个选项就会变成常规的指数、对数、倒数比较。
  recognition_cues:
    - 条件中 $e^\alpha,e^\beta$ 与两个同形分式成对出现。
    - 分母是 $2x+\sin x$，导数 $2+\cos x$ 恒正，适合做单调性。
    - 选项都是由 $\alpha$ 与 $\beta$ 的大小关系触发的简单不等式。
  normalization_moves:
    - 先移项，把条件写成 $F(\alpha)>F(\beta)$。
    - 设 $q(x)=2x+\sin x$，证明 $q$ 正且递增。
    - 由 $q$ 正递增推出 $-1/q$ 递增，再与 $e^x$ 相加。
    - 拿到 $\alpha>\beta>0$ 后逐项判断，不要回到原复杂条件。
  common_failures:
    - 没有移项构造函数，直接在原条件里硬比四个选项。
    - 只说 $2x+\sin x$ 递增，却忘了说明分母为正，无法判断倒数单调。
    - A 中基本不等式方向写反，把应为 $>$ 的结论看成 $<$。
    - D 中忘记正数取倒数会改变不等号方向。
  similar_practice_query: 构造单调同构函数 双变量不等式 2x+sinx 倒数比较
quality:
