      text_latex: $\frac1{e^\alpha}+\frac1\alpha<\frac1{e^\beta}+\frac1\beta$
  answer: BD
  fidelity_notes:
    - 已核对 page_0035 原图，条件右侧是两个分式之差，分母分别为 $2\alpha+\sin\alpha$ 与 $2\beta+\sin\beta$。
