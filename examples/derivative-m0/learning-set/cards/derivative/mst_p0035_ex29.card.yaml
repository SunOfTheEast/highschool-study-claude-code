      text_latex: $\frac1\alpha+\frac1\beta<\frac4{\alpha+\beta}$
    - label: B
      text_raw: $2^{\alpha-\beta+1}>2$
      text_latex: $2^{\alpha-\beta+1}>2$
    - label: C
      text_raw: $\ln\alpha+\alpha<\ln\beta+\beta$
      text_latex: $\ln\alpha+\alpha<\ln\beta+\beta$
    - label: D
