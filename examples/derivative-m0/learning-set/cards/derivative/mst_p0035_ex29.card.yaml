original_problem:
  stem: 已知正数 $\alpha,\beta$ 满足 $e^\alpha-e^\beta>\frac{1}{2\alpha+\sin\alpha}-\frac{1}{2\beta+\sin\beta}$，则下列不等式正确的是 (   )
  parts: *a1
  choices:
