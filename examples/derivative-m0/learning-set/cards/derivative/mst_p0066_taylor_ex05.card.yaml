stem: |-
  已知函数 f(x)=ax+\frac{a}{x}-(\ln x)^2 (a\in\mathbf{R}，且 e 为自然对数的底数)。
  (1). 当 a\geqslant1 时，求 f(x) 的最小值。
  (2). 若关于 x 的不等式 e^x+e^{-x}-2\ln x\geqslant b，求整数 b 的最大值。
answer: |-
  (1) f(x)_{\min}=2a；(2) 整数 b 的最大值为 3。

  对 f 求导并设 g(x)=ax-\frac{a}{x}-2\ln x。a\geqslant1 时， ax^2-2x+a\geqslant(x-1)^2，所以 g 递增且 g(1)=0，进而 f 在 (0,1) 减、(1,+\infty) 增，最小值为 2a。第 (2) 问取 a=1 得 t+\frac1t-(\ln t)^2\geqslant2，令 t=e^x 得 e^x+e^{-x}-x^2\geqslant2。于是 e^x+e^{-x}-2\ln x>(x^2-2\ln x)+2\geqslant3；另一方面 x=1 时值为 e+e^{-1}\in(3,4)，故能保证的不等式整数最大为 b=3。
