original_problem:
  stem: 已知函数 f(x)=ax+\frac{a}{x}-(\ln x)^2 (a\in\mathbf{R}，且 e 为自然对数的底数)。
  parts: *a1
  choices: []
  answer: (1) f(x)_{\min}=2a；(2) 整数 b 的最大值为 3。
  fidelity_notes:
    - 原题无选择项；第 (2) 问中的 x 由 \ln x 确定定义域为 x>0。
    - 源解第 (2) 问把 a=1 的第 (1) 问结论用于 t=e^x，从而得到 e^x+e^{-x}-x^2\geqslant2。
solution:
  source_solution_summary: 对 f 求导并设 g(x)=ax-\frac{a}{x}-2\ln x。a\geqslant1 时， ax^2-2x+a\geqslant(x-1)^2，所以 g 递增且 g(1)=0，进而 f 在 (0,1) 减、(1,+\infty) 增，最小值为 2a。第 (2) 问取 a=1 得 t+\frac1t-(\ln t)^2\geqslant2，令 t=e^x 得 e^x+e^{-x}-x^2\geqslant2。于是 e^x+e^{-x}-2\ln x>(x^2-2\ln x)+2\geqslant3；另一方面 x=1 时值为 e+e^{-1}\in(3,4)，故能保证的不等式整数最大为 b=3。
  key_steps:
    - step_id: step_1
      statement: 第 (1) 问先把 f'(x) 写成 g(x) 的符号。
      formula_trace:
        from: f(x)=ax+\frac{a}{x}-(\ln x)^2
        to: f'(x)=a-\frac{a}{x^2}-\frac{2\ln x}{x} =\frac1x\left(ax-\frac{a}{x}-2\ln x\right)
        operation: 对 f 求导，并提出正因子 \frac1x。
        why: x>0 时 f'(x) 的符号由 g(x)=ax-\frac{a}{x}-2\ln x 决定。
      source_ref: page_0066_solution
    - step_id: step_2
      statement: 证明 g 在定义域上递增。
      formula_trace:
        from: g'(x)=a+\frac{a}{x^2}-\frac2x=\frac{ax^2-2x+a}{x^2}
        to: a\geqslant1\Rightarrow ax^2-2x+a\geqslant x^2-2x+1\geqslant0
        operation: 用 a\geqslant1 放缩二次式分子。
        why: 分母 x^2>0，因此 g'(x)\geqslant0，g 单调递增。
      source_ref: page_0066_solution
    - step_id: step_3
      statement: 由 g(1)=0 判定 f 的单调性并求最小值。
      formula_trace:
        from: g(1)=0,\quad g \text{ 递增}
        to: x<1\Rightarrow f'(x)<0,\quad x>1\Rightarrow f'(x)>0,\quad f_{\min}=f(1)=2a
        operation: 用 g 的符号代回 f'(x)。
        why: f 先减后增，所以唯一谷底在 x=1。
      source_ref: page_0066_solution
    - step_id: step_4
      statement: 把第 (1) 问 a=1 的结论转成指数下界。
      formula_trace:
        from: t+\frac1t-(\ln t)^2\geqslant2\quad(t>0)
        to: e^x+e^{-x}-x^2\geqslant2\quad(x\in\mathbf{R})
        operation: 令 t=e^x，使 \ln t=x。
        why: 目标式含 e^x+e^{-x}，需要把第 (1) 问的 t+\frac1t 同构过去。
      source_ref: page_0066_solution
    - step_id: step_5
      statement: 将目标式拆成两个已知非负结构。
      formula_trace:
        from: e^x+e^{-x}-2\ln x
        to: \left(e^x+e^{-x}-x^2\right)+\left(x^2-2\ln x\right)
        operation: 加减 x^2。
        why: 第一括号由 step_4 给出不小于 2，第二括号可用 u-\ln u-1\geqslant0。
      source_ref: page_0066_solution
    - step_id: step_6
      statement: 证明目标式严格大于 3。
      formula_trace:
        from: h(x)=x^2-2\ln x+2=x^2-\ln x^2-1+3
        to: h(x)\geqslant3,\quad e^x+e^{-x}-2\ln x>3
        operation: 对 u=x^2 使用 u-\ln u-1\geqslant0，并注意两个等号条件不能同时在 x>0 发生。
        why: e^x+e^{-x}-x^2=2 的等号在 x=0，而 \ln x 要求 x>0；因此目标式在定义域内严格大于 3。
      source_ref: page_0066_solution
    - step_id: step_7
      statement: 用一个取值把整数上界压到 3。
      formula_trace:
        from: x=1:\quad e^x+e^{-x}-2\ln x=e+e^{-1}
        to: 3<\inf\left(e^x+e^{-x}-2\ln x\right)<4
        operation: 代入 x=1，并用源页给出的 e+e^{-1}\in(3,4)。
        why: 若 b 是整数且不等式对所有 x>0 成立，则最大整数只能是 3。
      source_ref: page_0066_solution
teaching_card:
  student_title: 把第 (1) 问的最小值搬到指数式里
  what_it_trains: 训练把一个已证最小值改造成后续恒成立不等式，再用整数参数要求做夹逼。
  recognition_cues:
    - 前一问的函数含 x+\frac1x-(\ln x)^2，后一问含 e^x+e^{-x}。
    - 目标中同时出现 e^x、e^{-x} 和 \ln x，适合加减 x^2 分拆。
    - b 是整数，通常不需要精确最小值，只要把下确界夹在两个相邻整数之间。
  normalization_moves:
    - 令 t=e^x，把 t+\frac1t-(\ln t)^2\geqslant2 变成 e^x+e^{-x}-x^2\geqslant2。
    - 加减 x^2，把目标式拆为双曲指数部分和对数基本不等式部分。
    - 用 x=1 的取值证明整体不能保证达到 4。
  common_failures:
    - 第 (1) 问求完 2a 后没有想到取 a=1 复用。
    - 把 e^x+e^{-x}-x^2\geqslant2 的等号点 x=0 误放到目标定义域 x>0 内。
    - 忽略 b 为整数，去求一个并不需要的精确最小值。
  similar_practice_query: 前问最值结论复用到后问恒成立，指数对数混合式加减 x^2 求最大整数参数。
