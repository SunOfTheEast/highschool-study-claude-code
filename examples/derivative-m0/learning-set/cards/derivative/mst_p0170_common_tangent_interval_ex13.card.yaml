stem: |-
  （2023 · 邢台月考 · 多选 T12）关于 x 的不等式 2x^2-3x-xlnx+1>=ax+b+(x-2)^2>=0 在 [1,+∞) 上恒成立，则（  ）
  A. a=-2
  B. a=2
  C. b=-3
  D. b=3
answer: |
  BC（a=2，b=-3）

  由 2x^2-3x-xlnx+1>=ax+b+(x-2)^2>=0，移项得 x^2+x-xlnx-3>=ax+b，且 ax+b>=-x^2+4x-4。 记 f(x)=x^2+x-xlnx-3，g(x)=-x^2+4x-4，则需 f(x)>=ax+b>=g(x)（x>=1）。再令 h(x)=f(x)-g(x)=2x^2-3x-xlnx+1。 有 h^{\prime}(x)=4x-lnx-4，令 k(x)=4x-lnx-4，则 k^{\prime}(x)=4-1/x>0（x>=1），故 h^{\prime}(x) 递增且 h^{\prime}(1)=0，从而 h^{\prime}(x)>=0，h(x) 在 [1,+∞) 递增， 且 h(1)=0，所以 f(x)>=g(x) 且仅在 x=1 处贴合。 要让一条直线 ax+b 在全区间被 f、g 夹住，必要且充分地取 x=1 处公切线：a=f^{\prime}(1)=g^{\prime}(1)=2，且 b=f(1)-a=-1-2=-3。故选 B、C。
