solution:
  source_solution_summary: |
    由 2x^2-3x-xlnx+1>=ax+b+(x-2)^2>=0，移项得 x^2+x-xlnx-3>=ax+b，且 ax+b>=-x^2+4x-4。 记 f(x)=x^2+x-xlnx-3，g(x)=-x^2+4x-4，则需 f(x)>=ax+b>=g(x)（x>=1）。再令 h(x)=f(x)-g(x)=2x^2-3x-xlnx+1。 有 h^{\prime}(x)=4x-lnx-4，令 k(x)=4x-lnx-4，则 k^{\prime}(x)=4-1/x>0（x>=1），故 h^{\prime}(x) 递增且 h^{\prime}(1)=0，从而 h^{\prime}(x)>=0，h(x) 在 [1,+∞) 递增， 且 h(1)=0，所以 f(x)>=g(x) 且仅在 x=1 处贴合。 要让一条直线 ax+b 在全区间被 f、g 夹住，必要且充分地取 x=1 处公切线：a=f^{\prime}(1)=g^{\prime}(1)=2，且 b=f(1)-a=-1-2=-3。故选 B、C。
  key_steps:
    - step_id: step_1
      statement: 把原双侧不等式改写为“直线夹在两曲线之间”。
      formula_trace:
        from: 2x^2-3x-xlnx+1>=ax+b+(x-2)^2>=0
        to: f(x)>=ax+b>=g(x)，其中 f=x^2+x-xlnx-3，g=-x^2+4x-4
        operation: 按源解移项并命名上下边界函数。
        why: 把含参数不等式转成几何夹线问题。
      source_ref: page_0171_ex13_solution
    - step_id: step_2
      statement: 比较上边界与下边界：证明 f>=g 且在 x=1 相贴。
      formula_trace:
        from: h(x)=f(x)-g(x)=2x^2-3x-xlnx+1
        to: k^{\prime}(x)=4-1/x>0=>h^{\prime}(x)>=0，h(1)=0=>f(x)>=g(x)
        operation: 先判 h^{\prime} 的单调，再由 h^{\prime}(1)=0 推全区间非负。
        why: 确定夹线存在时唯一贴合点在 x=1。
      source_ref: page_0171_ex13_solution
    - step_id: step_3
      statement: 用贴合点构造公切线，解出 a,b。
      formula_trace:
        from: x=1 处 f(1)=g(1)=-1，且 f^{\prime}(1)=g^{\prime}(1)=2
        to: a=2，b=-3
        operation: 令 ax+b 为两函数在 x=1 处公共切线 y=2x-3。
        why: 只有公切线才能在全区间保持“上压下托”的恒成立夹线关系。
      source_ref: page_0171_ex13_solution
    - step_id: step_4
      statement: 对照选项判定。
      formula_trace:
        from: a=2，b=-3
        to: B、C 正确，A、D 错误
        operation: 逐项匹配。
        why: 题型为多选。
      source_ref: page_0171_ex13_solution
teaching_card:
  student_title: 先证上下边界贴合，再读公切线参数
  what_it_trains: 训练把恒成立双侧不等式转成“上下函数夹一条线”，再用贴合点公切线一次性读出参数。
  recognition_cues:
    - 题干是“表达式>=ax+b+(...)>=0”的双侧恒成立。
    - 中间只有一次项 ax+b，典型是“线在两曲线之间”。
    - 最终选项直接给 a,b 的具体值。
  normalization_moves:
    - 先拆成 f>=ax+b>=g。
    - 做 h=f-g，找贴合点与贴合方式。
    - 在贴合点用公切线条件定 a,b。
  common_failures:
    - 只验证 f>=g，不继续落实“line 必须是公切线”。
    - 把 f^{\prime}(x)=2x-lnx 误写成 2x+lnx。
    - 由 f(1)=g(1)=-1 算 b 时符号出错。
  similar_practice_query: 双侧恒成立 夹线 公切线 a b 参数 多选
