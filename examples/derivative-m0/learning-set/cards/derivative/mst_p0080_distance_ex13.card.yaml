solution:
  source_solution_summary: 对 $f(x)=xe^x+1$ 求导得 $f'(x)=(1+x)e^x$, 在 $A(0,1)$ 处斜率为 1, 切线为 $y=x+1$。对 $g(x)=\ln x/x$ 求导得 $g'(x)=(1-\ln x)/x^2$, 在 $B(1,0)$ 处斜率为 1, 切线为 $y=x-1$。 两条切线平行, 且 $AB$ 的斜率为 -1, 正好与它们垂直。两条平行线 $x-y+1=0$ 与 $x-y-1=0$ 的距离为 $|-1-1|/\sqrt2=\sqrt2$, 所以 $|PQ|_{\min}=\sqrt2$。
  key_steps:
    - step_id: step_1
      statement: 找到第一条曲线在 $A(0,1)$ 处的切线。
      formula_trace:
        from: $f(x)=xe^x+1$
        to: $f'(x)=(1+x)e^x,\quad f'(0)=1,\quad y=x+1$
        operation: 求导并代入 $x=0$, 写出过 $A(0,1)$ 的切线方程。
        why: 源图中最短连线端点对应的切线斜率为 1。
      source_ref: page_0080:line 46; page_0081:line 12
    - step_id: step_2
      statement: 找到第二条曲线在 $B(1,0)$ 处的平行切线。
      formula_trace:
        from: $g(x)=\frac{\ln x}{x}$
        to: $g'(x)=\frac{1-\ln x}{x^2},\quad g'(1)=1,\quad y=x-1$
        operation: 求导并代入 $x=1$, 写出过 $B(1,0)$ 的切线方程。
        why: 两端切线平行时, 连接两端点的最短线段应与切线垂直。
      source_ref: page_0081:line 12
    - step_id: step_3
      statement: 确认 $AB$ 是两条平行切线之间的垂直距离。
      formula_trace:
        from: $A(0,1),\quad B(1,0)$
        to: $k_{AB}=\frac{1-0}{0-1}=-1$
        operation: 计算连线斜率。
        why: $k_{AB}\cdot 1=-1$, 因此 $AB$ 垂直于两条斜率为 1 的切线。
      source_ref: page_0081:line 12
    - step_id: step_4
      statement: 计算两条平行切线之间的距离。
      formula_trace:
        from: $y=x+1,\quad y=x-1$
        to: $|PQ|_{\min}=\frac{|-1-1|}{\sqrt{1^2+(-1)^2}}=\sqrt2$
        operation: 把两直线写成 $x-y+1=0$ 与 $x-y-1=0$, 用平行线距离公式。
        why: 两曲线分别由这两条支撑切线夹开, 垂直间距即为可达到的最短距离。
      source_ref: page_0081:lines 12-13
teaching_card:
  student_title: 找两条平行切线夹出的最短距离
  what_it_trains: "训练学生处理两条曲线之间的最短距离: 先从图像和导数找出两端点的平行切线, 再用公法线和平行线距离完成计算。"
  recognition_cues:
    - 题目问两条函数图象上动点之间的最短距离。
    - 图中已经标出 $A(0,1)$、$B(1,0)$ 和两条斜率相同的切线。
    - 两条切线是 $y=x+1$ 与 $y=x-1$, 之间距离容易算。
  normalization_moves:
    - 分别求两条曲线在 $A$、$B$ 处的导数。
    - 写出两条平行切线。
    - 用 $AB$ 的斜率确认它是公法线方向。
    - 算两条平行线的距离。
  common_failures:
    - 只算 $AB$ 的长度, 没有说明它为什么对应最短距离。
    - 把 $g'(x)$ 误求成 $1/x^2$ 或漏掉 $1-\ln x$。
    - 把两条切线的常数项差看成 2 后忘记除以 $\sqrt2$。
  similar_practice_query: 两曲线最短距离 平行切线 xe^x+1 ln x / x y=x+1 y=x-1
