stem: （2024 云南师大附中高三适应性 T16）已知点 $P$ 在函数 $f(x)=xe^x+1$ 的图象上，点 $Q$ 在函数 $g(x)=\frac{\ln x}{x}$ 的图象上，则 $|PQ|$ 的最小值为______。
answer: |-
  $\sqrt2$

  对 $f(x)=xe^x+1$ 求导得 $f'(x)=(1+x)e^x$, 在 $A(0,1)$ 处斜率为 1, 切线为 $y=x+1$。对 $g(x)=\ln x/x$ 求导得 $g'(x)=(1-\ln x)/x^2$, 在 $B(1,0)$ 处斜率为 1, 切线为 $y=x-1$。 两条切线平行, 且 $AB$ 的斜率为 -1, 正好与它们垂直。两条平行线 $x-y+1=0$ 与 $x-y-1=0$ 的距离为 $|-1-1|/\sqrt2=\sqrt2$, 所以 $|PQ|_{\min}=\sqrt2$。
