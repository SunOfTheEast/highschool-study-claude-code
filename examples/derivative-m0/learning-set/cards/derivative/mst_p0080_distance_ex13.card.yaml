original_problem:
  stem: （2024 云南师大附中高三适应性 T16）已知点 $P$ 在函数 $f(x)=xe^x+1$ 的图象上，点 $Q$ 在函数 $g(x)=\frac{\ln x}{x}$ 的图象上，则 $|PQ|$ 的最小值为______。
  parts: *a1
  choices: []
  answer: $\sqrt2$
  fidelity_notes:
    - 源题为填空题, 无分问和选项。
