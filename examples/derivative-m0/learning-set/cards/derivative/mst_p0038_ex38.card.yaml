stem: |-
  若实数 $x,y,z$ 满足 $2+\log_2 x=3+\log_3 y=5+\log_5 z$，则 $x,y,z$ 的大小关系不可能是 ( )
  A. x>y>z
  B. x>z>y
  C. y>x>z
  D. y>z>x
answer: |-
  B

  设公共值为 $k$，把比较 $x,y,z$ 转成比较三条直线 $(k-2)\ln2$、$(k-3)\ln3$、$(k-5)\ln5$。特值可实现 A、C、D；交点顺序排除 B。
