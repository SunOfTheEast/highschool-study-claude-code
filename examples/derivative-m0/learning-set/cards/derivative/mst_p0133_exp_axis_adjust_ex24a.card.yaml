solution:
  source_solution_summary: |
    设
    \[
    g(x)=\frac{f(x)}{e^x},
    \quad
    g^{\prime}(x)=\frac{f^{\prime}(x)-f(x)}{e^x}.
    \]
    由
    \[
    (x-1)[f^{\prime}(x)-f(x)]>0
    \]
    知：当 $x<1$ 时 $g^{\prime}(x)<0$，当 $x>1$ 时 $g^{\prime}(x)>0$，
    即 $g$ 在 $(-\infty,1)$ 递减，在 $(1,+\infty)$ 递增。

    又由
    \[
    f(2-x)=f(x)e^{2-2x}
    \]
    得
    \[
    \frac{f(2-x)}{e^{2-x}}=\frac{f(x)}{e^x}
    \Rightarrow g(2-x)=g(x),
    \]
    所以 $g$ 关于 $x=1$ 对称。

    A: 由左侧递减，$g(1)<g(0)$，即 $\frac{f(1)}{e}<f(0)$，故 $f(1)<e f(0)$，A正确。
    B: 对称给出 $g(2)=g(0)$，即 $f(2)=e^2 f(0)$，并非“>”，B错误。
    C: $g(3)>g(2)=g(0)$，故 $f(3)>e^3 f(0)$，C正确。
    D: $g(4)>g(2)=g(0)$，故 $f(4)>e^4 f(0)$，与选项“<”相反，D错误。

    不正确的是 B、D，故选 BD。
  key_steps:
    - step_id: step_1
      statement: 先构造指数商函数统一两条题设。
      formula_trace:
        from: $(x-1)[f^{\prime}(x)-f(x)]>0$，$f(2-x)=f(x)e^{2-2x}$
        to: $g(x)=\\frac{f(x)}{e^x}$，$g^{\prime}(x)=\\frac{f^{\prime}(x)-f(x)}{e^x}$，$g(2-x)=g(x)$
        operation: 除以 $e^x$ 并代入对称条件。
        why: 单调和对称都能落在同一个 $g$ 上处理。
      source_ref: page_0133
    - step_id: step_2
      statement: 判定 $g$ 在对称轴两侧的单调性。
      formula_trace:
        from: $(x-1)[f^{\prime}(x)-f(x)]>0$
        to: $x<1\\Rightarrow g^{\prime}(x)<0$；$x>1\\Rightarrow g^{\prime}(x)>0$
        operation: 按 $x-1$ 的符号分段。
        why: 后续比较 $g(0),g(1),g(2),g(3),g(4)$ 都依赖该结论。
      source_ref: page_0133
    - step_id: step_3
      statement: 用 $g(2-x)=g(x)$ 锁定对称点等值。
      formula_trace:
        from: $g(2-x)=g(x)$
        to: $g(2)=g(0)$
        operation: 代 $x=0$。
        why: B、C、D 都以 $g(2)=g(0)$ 为比较基准。
      source_ref: page_0133
    - step_id: step_4
      statement: 逐项回译到 $f$ 的形式并判错。
      formula_trace:
        from: $g(1)<g(0)$，$g(3)>g(2)=g(0)$，$g(4)>g(2)=g(0)$
        to: A对，B错，C对，D错
        operation: 乘回 $e^x$ 并与选项比较符号。
        why: 题目问“不正确”，故取错误项 B、D。
      source_ref: page_0133
