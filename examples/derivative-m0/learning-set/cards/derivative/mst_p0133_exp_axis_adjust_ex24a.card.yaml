stem: |-
  （2023·南岗区三模·多选）已知函数 $f(x)$ 在 $\mathbf{R}$ 上可导，其导函数为 $f^{\prime}(x)$，若 $f(x)$ 满足：$(x-1)[f^{\prime}(x)-f(x)]>0$，$f(2-x)=f(x)e^{2-2x}$，则下列判断不正确的是（  ）
  A. $f(1)<e f(0)$
  B. $f(2)>e^2 f(0)$
  C. $f(3)>e^3 f(0)$
  D. $f(4)<e^4 f(0)$
answer: |
  BD

  设
  \[
  g(x)=\frac{f(x)}{e^x},
  \quad
  g^{\prime}(x)=\frac{f^{\prime}(x)-f(x)}{e^x}.
  \]
  由
  \[
  (x-1)[f^{\prime}(x)-f(x)]>0
  \]
  知：当 $x<1$ 时 $g^{\prime}(x)<0$，当 $x>1$ 时 $g^{\prime}(x)>0$，
  即 $g$ 在 $(-\infty,1)$ 递减，在 $(1,+\infty)$ 递增。

  又由
  \[
  f(2-x)=f(x)e^{2-2x}
  \]
  得
  \[
  \frac{f(2-x)}{e^{2-x}}=\frac{f(x)}{e^x}
  \Rightarrow g(2-x)=g(x),
  \]
  所以 $g$ 关于 $x=1$ 对称。

  A: 由左侧递减，$g(1)<g(0)$，即 $\frac{f(1)}{e}<f(0)$，故 $f(1)<e f(0)$，A正确。
  B: 对称给出 $g(2)=g(0)$，即 $f(2)=e^2 f(0)$，并非“>”，B错误。
  C: $g(3)>g(2)=g(0)$，故 $f(3)>e^3 f(0)$，C正确。
  D: $g(4)>g(2)=g(0)$，故 $f(4)>e^4 f(0)$，与选项“<”相反，D错误。

  不正确的是 B、D，故选 BD。
