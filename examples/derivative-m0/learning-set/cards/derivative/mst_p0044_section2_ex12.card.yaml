original_problem:
  stem: 已知 f(x)=xe^{ax}-\ln x-ax，若存在 x_0>0，使得 f(x_0)=1，则实数 a 的取值范围是（  ）
  parts: *a1
  choices:
    - label: A
      text_raw: (-∞, 1/e)
      text_latex: \left(-\infty, \frac{1}{e}\right)
    - label: B
      text_raw: "[-1/e, +∞)"
      text_latex: \left[-\frac{1}{e}, +\infty\right)
    - label: C
      text_raw: (-1/e, 0)
      text_latex: \left(-\frac{1}{e}, 0\right)
    - label: D
      text_raw: (0, 1/e]
      text_latex: \left(0, \frac{1}{e}\right]
  answer: B
  fidelity_notes:
    - 源文写 x_0\in\mathbf{R}；用户已拍板按定义域校正为 x_0>0。
solution:
  source_solution_summary: 把 xe^{ax} 改写为 e^{ax+\ln x}，令 t=ax+\ln x，则 f(x)-1=e^t-t-1。由于 e^t-t-1\geqslant0 且等号在 t=0 取得，存在 f(x)=1 等价于存在 x>0 使 ax+\ln x=0，即 a=-\ln x/x。利用 \ln x/x\leqslant1/e 得 a\geqslant-1/e。
  key_steps:
    - step_id: step_1
      statement: 先把同一个变量中的指数项与对数项合成一个量。
      formula_trace:
        from: xe^{ax}-\ln x-ax=1
        to: e^{ax+\ln x}-(ax+\ln x)-1=0
        operation: 用 x=e^{\ln x}（x>0）把 xe^{ax} 写成 e^{ax+\ln x}，并把 \ln x+ax 合并为同一个 t。
        why: 这样能直接套用 e^t-t-1\geqslant0 的等号条件。
      source_ref: page_0044_solution
    - step_id: step_2
      statement: 利用 e^t-t-1 的最小值判定方程何时能取到 0。
      formula_trace:
        from: e^{ax+\ln x}-(ax+\ln x)-1=0
        to: ax+\ln x=0
        operation: 令 t=ax+\ln x，由 e^t-t-1\geqslant0 且仅在 t=0 取等。
        why: 原方程有解必须也只需 t=0 可达到。
      source_ref: page_0044_solution
    - step_id: step_3
      statement: 把存在性转成 a 的取值范围。
      formula_trace:
        from: ax+\ln x=0
        to: a=-\frac{\ln x}{x}\geqslant-\frac{1}{e}
        operation: 分离参数，并用 \frac{\ln x}{x}\leqslant\frac{1}{e}（x>0，等号 x=e）取范围。
        why: x 在正数范围内变化时，-\ln x/x 的最小值是 -1/e。
      source_ref: page_0044_solution
teaching_card:
  student_title: 把 xe^{ax} 合成 e^{ax+\ln x} 求参数范围
  what_it_trains: 训练看出 x 与 e^{ax} 可以合并成一个指数，从而把存在性问题降到 e^t-t-1 的等号条件。
  recognition_cues:
    - 式子里同时出现 xe^{ax}、\ln x、ax。
    - 题目问存在 x 使函数值等于一个常数。
    - 整理后能出现 e^t-t-1。
  normalization_moves:
    - 先设 t=ax+\ln x，而不是直接对原函数求导。
    - 等号条件给出 ax+\ln x=0，再分离 a。
  common_failures:
    - 把题干的 x_0\in R 直接当成所有实数，忘记 \ln x 只允许 x>0。
    - 只记住 e^t-t-1\geqslant0，却没有抓住等号 t=0。
    - 把 -\ln x/x 的范围方向写反。
  similar_practice_query: 含 xe^{ax} 与 \ln x 的存在性参数范围题，使用 e^t-t-1 等号条件
