stem: |-
  已知 f(x)=xe^{ax}-\ln x-ax，若存在 x_0>0，使得 f(x_0)=1，则实数 a 的取值范围是（  ）
  A. (-∞, 1/e)
  B. [-1/e, +∞)
  C. (-1/e, 0)
  D. (0, 1/e]
answer: |-
  B

  把 xe^{ax} 改写为 e^{ax+\ln x}，令 t=ax+\ln x，则 f(x)-1=e^t-t-1。由于 e^t-t-1\geqslant0 且等号在 t=0 取得，存在 f(x)=1 等价于存在 x>0 使 ax+\ln x=0，即 a=-\ln x/x。利用 \ln x/x\leqslant1/e 得 a\geqslant-1/e。
