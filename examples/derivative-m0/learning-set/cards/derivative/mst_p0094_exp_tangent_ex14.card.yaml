solution:
  source_solution_summary: |
    设切点为 $(t,(1-t)e^t)$，则 $f'(x)=-xe^x$，切线方程为
    $y-(1-t)e^t=-te^t(x-t)$。代入 $A(a,0)$ 得
    $-e^t+te^t=-te^t(a-t)$，整理为 $t^2-(a+1)t+1=0$。
    只有一条切线时，该二次方程有两个相等的实根，于是
    $\Delta=(a+1)^2-4=a^2+2a-3=0$，解得 $a=-3$ 或 $a=1$，选 C。
    图像法中，$f''(x)=-(x+1)e^x$，拐点在 $x=-1$，拐点切线为
    $y=(x+3)/e$；它与 $x$ 轴交于 $(-3,0)$，曲线与 $x$ 轴交于 $(1,0)$，
    这两类边界点恰好只引一条切线。
  key_steps:
    - step_id: step_1
      statement: 设切点并写切线方程。
      formula_trace:
        from: |
          $f(x)=(1-x)e^x,\quad f'(x)=-xe^x,\quad T=(t,(1-t)e^t)$
        to: |
          $y-(1-t)e^t=-te^t(x-t)$
        operation: 用切点函数值和切点处导数写点斜式切线。
        why: 切线条数由切点参数 $t$ 的可能取值决定。
      source_ref: page_0094
    - step_id: step_2
      statement: 把切线过 $A(a,0)$ 化成二次方程。
      formula_trace:
        from: |
          $0-(1-t)e^t=-te^t(a-t)$
        to: |
          $-e^t+te^t=-te^t(a-t),\qquad t^2-(a+1)t+1=0$
        operation: 代入点 $A(a,0)$，消去 $e^t$ 后展开移项。
        why: 一个实根对应一个切点；题目要求有且仅有一个切点。
      source_ref: page_0095
    - step_id: step_3
      statement: 用重根条件求 $a$。
      formula_trace:
        from: |
          $t^2-(a+1)t+1=0\text{ 有两个相等的实数根}$
        to: |
          $\Delta=(a+1)^2-4=a^2+2a-3=0,\qquad a=-3\text{ 或 }a=1$
        operation: 令判别式为 $0$ 并解方程。
        why: 二次方程重根时只有一个切点参数，即只有一条切线。
      source_ref: page_0095
    - step_id: step_4
      statement: 用拐点切线边界解释两个答案。
      formula_trace:
        from: |
          $f''(x)=-(x+1)e^x,\quad x_{\text{拐}}=-1,\quad f(1)=0$
        to: |
          $y=\frac{x+3}{e},\quad (-3,0)\text{ 为拐点切线与 }x\text{ 轴交点},\quad (1,0)\text{ 为曲线与 }x\text{ 轴交点}$
        operation: 求拐点切线和曲线零点。
        why: 在这两个边界点处，多条切线合并为唯一切线。
      source_ref: page_0095
teaching_card:
  student_title: 唯一切线就是切点方程的重根
  what_it_trains: 训练把外点引切线条数转化为切点参数方程根数，并用拐点切线边界解释重根位置。
  recognition_cues:
    - 题干说“过点 $A(a,0)$ 作切线有且仅有 1 条”，提示切点参数方程只有一个解。
    - 曲线是 $(1-x)e^x$，导数很快变成 $-xe^x$，适合直接写切线。
    - 选项只给 $a$ 的离散值，通常来自曲线交点或拐点切线交点。
  normalization_moves:
    - 设切点为 $(t,(1-t)e^t)$。
    - 代入 $A(a,0)$，整理出 $t^2-(a+1)t+1=0$。
    - 令判别式为 $0$，得到 $a=-3$ 或 $1$。
  common_failures:
    - 把题目中的 $a$ 当成切点横坐标。
    - 从 $-e^t+te^t=-te^t(a-t)$ 整理二次方程时漏掉常数项 $1$。
    - 只找到曲线与 $x$ 轴交点 $a=1$，漏掉拐点切线与 $x$ 轴交点 $a=-3$。
  similar_practice_query: $(1-x)e^x$ 过 $A(a,0)$ 唯一切线 重根 拐点切线
