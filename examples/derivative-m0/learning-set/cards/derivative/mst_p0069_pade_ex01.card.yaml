stem: 求 $f(x)=\ln(1+x)$ 的 $[1,1]$ 阶帕德逼近。
answer: |-
  $f(x)=\ln(1+x)$ 的 $[1,1]$ 阶帕德逼近为
  $R(x)=\frac{x}{1+\frac12 x}=\frac{2x}{x+2}$。
  源页随后由图像给出：$-1<x<0$ 时 $\ln(1+x)<\frac{2x}{x+2}$，$x>0$ 时 $\ln(1+x)>\frac{2x}{x+2}$；平移后，当 $x\ge1$ 时 $\frac{2(x-1)}{x+1}\le\ln x$，当 $0<x\le1$ 时 $\ln x\le\frac{2(x-1)}{x+1}$。


  把 $[1,1]$ 阶帕德逼近写成 $R(x)=\frac{a_0+a_1x}{1+b_1x}$，依次匹配 $f(0)=R(0)$、$f^{\prime}(0)=R^{\prime}(0)$、$f^{\prime\prime}(0)=R^{\prime\prime}(0)$，得到 $a_0=0$、$a_1=1$、$b_1=\frac12$，所以 $R(x)=\frac{2x}{x+2}$；源页还根据图像记录了它与 $\ln(1+x)$ 以及平移后的 $\ln x$ 的比较关系。
