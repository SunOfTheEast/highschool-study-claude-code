solution:
  source_solution_summary: 把 $[1,1]$ 阶帕德逼近写成 $R(x)=\frac{a_0+a_1x}{1+b_1x}$，依次匹配 $f(0)=R(0)$、$f^{\prime}(0)=R^{\prime}(0)$、$f^{\prime\prime}(0)=R^{\prime\prime}(0)$，得到 $a_0=0$、$a_1=1$、$b_1=\frac12$，所以 $R(x)=\frac{2x}{x+2}$；源页还根据图像记录了它与 $\ln(1+x)$ 以及平移后的 $\ln x$ 的比较关系。
  key_steps:
    - step_id: step_1
      statement: 按 $[1,1]$ 阶帕德逼近写出待定有理函数。
      formula_trace:
        from: $[1,1]\text{ 阶帕德逼近}$
        to: $R(x)=\frac{a_0+a_1x}{1+b_1x}$
        operation: 分子取一次多项式，分母取首项为 $1$ 的一次多项式。
        why: 帕德逼近的约定是用有理函数在展开点附近匹配函数值和若干阶导数。
      source_ref: page_0069
    - step_id: step_2
      statement: 匹配函数值，确定常数项。
      formula_trace:
        from: $f(0)=\ln1=0,\quad R(0)=a_0$
        to: $a_0=0$
        operation: 令 $f(0)=R(0)$。
        why: 逼近函数必须先在展开点 $x=0$ 处与原函数同值。
      source_ref: page_0069
    - step_id: step_3
      statement: 匹配一阶导数，确定分子一次项系数。
      formula_trace:
        from: $f^{\prime}(x)=\frac{1}{1+x},\quad R^{\prime}(x)=\frac{a_1}{(1+b_1x)^2}$
        to: $f^{\prime}(0)=R^{\prime}(0)\Rightarrow a_1=1$
        operation: 对 $R(x)=\frac{a_1x}{1+b_1x}$ 求导并代入 $x=0$。
        why: 一阶导数匹配让有理函数在原点具有相同切线斜率。
      source_ref: page_0069
    - step_id: step_4
      statement: 匹配二阶导数，确定分母一次项系数。
      formula_trace:
        from: $f^{\prime\prime}(0)=-1,\quad R^{\prime\prime}(0)=-2b_1$
        to: $b_1=\frac12$
        operation: 由 $f^{\prime\prime}(0)=R^{\prime\prime}(0)$ 解出 $b_1$。
        why: $[1,1]$ 阶共有两个非零待定系数，匹配到二阶导数即可确定逼近式。
      source_ref: page_0069
    - step_id: step_5
      statement: 写出帕德逼近式，并记录源页给出的对数比较。
      formula_trace:
        from: $a_0=0,\ a_1=1,\ b_1=\frac12$
        to: $R(x)=\frac{x}{1+\frac12x}=\frac{2x}{x+2}$
        operation: 代回待定有理函数并化简。
        why: 源页随后用该式生成 $\ln(1+x)$ 与 $\ln x$ 的常用有理放缩。
      source_ref: page_0069
teaching_card:
  student_title: 用三次匹配求出 $\ln(1+x)$ 的帕德式
  what_it_trains: 训练把帕德逼近看成“设有理函数、匹配原点处函数值和导数”的待定系数问题，并把结果转成常用对数放缩。
  recognition_cues:
    - 题干直接出现 $[1,1]$ 阶帕德逼近。
    - 函数是 $\ln(1+x)$，展开点在 $x=0$。
    - 分母按帕德约定从 $1+b_1x$ 写起。
  normalization_moves:
    - 先写 $R(x)=\frac{a_0+a_1x}{1+b_1x}$。
    - 用 $f(0)=R(0)$ 得 $a_0=0$。
    - 用一阶导数匹配得 $a_1=1$。
    - 用二阶导数匹配得 $b_1=\frac12$。
    - 将 $\ln(1+x)$ 的比较式平移成 $\ln x$ 的比较式。
  common_failures:
    - 把泰勒多项式 $\ln(1+x)\approx x-\frac12x^2$ 当成 $[1,1]$ 帕德逼近。
    - 忘记分母常数项固定为 $1$，导致待定系数不唯一。
    - 求 $R^{\prime}(x)$ 时漏掉分母平方，得不到 $b_1=\frac12$。
    - 把 $x$ 换成 $x-1$ 后忘记定义域从 $-1<x$ 变成 $x>0$。
  similar_practice_query: $\ln(1+x)$ $[1,1]$ 帕德逼近 $R(x)=2x/(x+2)$ 对数放缩
