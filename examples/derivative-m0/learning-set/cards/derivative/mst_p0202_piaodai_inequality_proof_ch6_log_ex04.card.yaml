stem: 已知函数 $f(x)=ax-ax\ln x+1\ (a\in\mathbf R,\ a\ne0)$。证明：当 $a=-2$ 时，$f(x)\le x^2-3x+\frac1x+2\ln x$。
answer: |-
  当 $a=-2$ 时，不等式 $f(x)\le x^2-3x+\frac1x+2\ln x$ 成立。

  取 $a=-2$，则 $f(x)=-2x+2x\ln x+1$。考察差值 $\Delta=x^2-3x+\frac1x+2\ln x-f(x)$，整理得 $\Delta=(x-1)\left(x-\frac1x-2\ln x\right)$。设 $g(x)=x-\frac1x-2\ln x$，则 $g^{\prime}(x)=1+\frac1{x^2}-\frac2x=\frac{(x-1)^2}{x^2}\ge0$， 所以 $g$ 在 $(0,+\infty)$ 单调递增，且 $g(1)=0$，于是 $0<x<1$ 时 $g(x)<0$，$x>1$ 时 $g(x)>0$。因此 $(x-1)g(x)\ge0$，即 $\Delta\ge0$，原不等式成立。
