stem: |-
  若 $f(x)=e^x(ax-1)-x+2$，若存在唯一的整数 $x_0$ 使得 $f(x_0)<0$，则实数 $a$ 的取值范围为（  ）
  A. $\left[\frac{1}{4}+\frac{1}{2e^4},\ \frac{1}{3e^3}+\frac{1}{3}\right)$
  B. $(3e-1,\ 2e^2-\frac{1}{2}]$
  C. $\left[\frac{1}{2},\ 1-\frac{1}{e}\right)\cup(3e-1,\ 2e^2-\frac{1}{2}]$
  D. $\left[\frac{1}{2},\ 1-\frac{1}{e}\right)\cup\left[\frac{1}{4}+\frac{1}{2e^4},\ \frac{1}{3e^3}+\frac{1}{3}\right)$
answer: |-
  C

  由 $f(x)<0$ 得 $e^x(ax-1)-x+2<0\iff ax-1<\frac{x-2}{e^x}$。设 $h(x)=\frac{x-2}{e^x}$，则 $h^{\prime}(x)=\frac{3-x}{e^x}$， 先增后减；直线 $y=ax-1$ 恒过 $(0,-1)$。要“唯一整数点”可分两侧判定：右侧只能让 $x=1$ 成立而 $x=2$ 不成立，得 $\begin{cases}a-1<-\frac1e\\2a-1\ge0\end{cases}$，即 $\frac12\le a<1-\frac1e$；左侧只能让 $x=-1$ 成立而 $x=-2$ 不成立，得 $\begin{cases}-a-1<-3e\\-2a-1\ge-4e^2\end{cases}$，即 $3e-1<a\le2e^2-\frac12$。并集为 $\left[\frac12,1-\frac1e\right)\cup(3e-1,2e^2-\frac12]$，选 C。
