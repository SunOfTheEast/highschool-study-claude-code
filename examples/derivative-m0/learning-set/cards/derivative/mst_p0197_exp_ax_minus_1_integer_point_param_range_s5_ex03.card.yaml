solution:
  source_solution_summary: 由 $f(x)<0$ 得 $e^x(ax-1)-x+2<0\iff ax-1<\frac{x-2}{e^x}$。设 $h(x)=\frac{x-2}{e^x}$，则 $h^{\prime}(x)=\frac{3-x}{e^x}$， 先增后减；直线 $y=ax-1$ 恒过 $(0,-1)$。要“唯一整数点”可分两侧判定：右侧只能让 $x=1$ 成立而 $x=2$ 不成立，得 $\begin{cases}a-1<-\frac1e\\2a-1\ge0\end{cases}$，即 $\frac12\le a<1-\frac1e$；左侧只能让 $x=-1$ 成立而 $x=-2$ 不成立，得 $\begin{cases}-a-1<-3e\\-2a-1\ge-4e^2\end{cases}$，即 $3e-1<a\le2e^2-\frac12$。并集为 $\left[\frac12,1-\frac1e\right)\cup(3e-1,2e^2-\frac12]$，选 C。
  key_steps:
    - step_id: step_1
      statement: 把原不等式改写为“动直线 < 定曲线”的整点判定模型。
      formula_trace:
        from: $e^x(ax-1)-x+2<0$
        to: $ax-1<\frac{x-2}{e^x}$
        operation: 移项并同除 $e^x(>0)$。
        why: 参数 $a$ 只留在线性项，便于逐个整数位置比较。
      source_ref: page_0197_ex3_solution
    - step_id: step_2
      statement: 先做右侧整点筛选（只保留 $x=1$，排除 $x=2$）。
      formula_trace:
        from: $a-1<\frac{1-2}{e},\ 2a-1\ge\frac{2-2}{e^2}$
        to: $\frac12\le a<1-\frac1e$
        operation: 代入两处临界整数并联立不等式。
        why: 右半轴上指数曲线增长快，唯一整点只能卡在最近整数。
      source_ref: page_0197_ex3_solution
    - step_id: step_3
      statement: 再做左侧整点筛选（只保留 $x=-1$，排除 $x=-2$）。
      formula_trace:
        from: $-a-1<\frac{-1-2}{e^{-1}},\ -2a-1\ge\frac{-2-2}{e^{-2}}$
        to: $3e-1<a\le2e^2-\frac12$
        operation: 同样代入相邻左侧整数并联立。
        why: 保证左侧至多出现一个满足不等式的整数点。
      source_ref: page_0197_ex3_solution
    - step_id: step_4
      statement: 合并两种唯一整点情形并匹配选项。
      formula_trace:
        from: $\frac12\le a<1-\frac1e$ 与 $3e-1<a\le2e^2-\frac12$
        to: $a\in\left[\frac12,1-\frac1e\right)\cup(3e-1,2e^2-\frac12]$
        operation: 取并集。
        why: 题目只要求“存在唯一整数 $x_0$”，可来自左右任一侧。
      source_ref: page_0197_ex3_solution
teaching_card:
  student_title: 整点题先做“一个成立一个否”
  what_it_trains: 训练把指数不等式转成直曲位置关系，再用相邻整数的“成立/不成立”联立条件锁定参数区间。
  recognition_cues:
    - 题目给出“存在唯一整数 $x_0$”。
    - 式子可化成 $ax+b<\text{(定曲线)}$。
    - 参数只在线性项里，适合逐整数判定。
  normalization_moves:
    - 先参变量分离：把 $a$ 留在直线一侧。
    - 按左右两侧分别找“候选整数 + 邻点排除”。
    - 每侧联立两条不等式，再取并集。
  common_failures:
    - 只写“某点成立”，漏写“相邻点不成立”，导致不是唯一整点。
    - 把 $\frac{-3}{e^{-1}}$ 误算成 $-\frac3e$。
    - 最后把两个可行情形误取交集。
  similar_practice_query: 整点唯一 直曲分离 相邻整数排除 参数范围 指数不等式
