solution:
  source_solution_summary: |
    先比较 $a,c$。源解用
    \[
    e^x-e^{-x}-2x\ge0\quad(x\ge0),
    \]
    代入 $x=0.1$ 得
    \[
    e^{0.1}-e^{-0.1}-0.2>0,
    \]
    即 $a>c$。
    再比较 $c,b$。由
    \[
    2x\ge2\ln(1+x),
    \]
    代入 $x=0.1$ 得
    \[
    0.2=2\times0.1>2\ln1.1=\ln1.21,
    \]
    即 $c>b$。故
    \[
    b<c<a,
    \]
    选 D。
  key_steps:
    - step_id: step_1
      statement: 把 $a$ 与 $c=0.2$ 比较。
      formula_trace:
        from: $a=e^{0.1}-e^{-0.1}$
        to: $a-0.2=e^{0.1}-e^{-0.1}-0.2>0$
        operation: 应用 $e^x-e^{-x}-2x\ge0\ (x\ge0)$，取 $x=0.1$。
        why: 先锁定 $a>c$。
      source_ref: page_0156_ex02_problem
    - step_id: step_2
      statement: 把 $b$ 与 $c=0.2$ 比较。
      formula_trace:
        from: $b=\ln1.21=\ln(1.1^2)$
        to: $b=2\ln1.1<0.2=c$
        operation: 用 $2x\ge2\ln(1+x)$，代入 $x=0.1$。
        why: 建立 $c>b$。
      source_ref: page_0156_ex02_problem
    - step_id: step_3
      statement: 合并不等式得到顺序。
      formula_trace:
        from: $a>c$ 且 $c>b$
        to: $b<c<a$
        operation: 传递比较。
        why: 对应选项 D。
      source_ref: page_0156_ex02_problem
