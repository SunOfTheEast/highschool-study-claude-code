stem: |-
  （2024 · 河南模拟）已知 $a=e^{0.1}-e^{-0.1}$，$b=\ln1.21$，$c=0.2$，则（  ）
  A. $b<a<c$
  B. $c<b<a$
  C. $a<c<b$
  D. $b<c<a$
answer: |
  D

  先比较 $a,c$。源解用
  \[
  e^x-e^{-x}-2x\ge0\quad(x\ge0),
  \]
  代入 $x=0.1$ 得
  \[
  e^{0.1}-e^{-0.1}-0.2>0,
  \]
  即 $a>c$。
  再比较 $c,b$。由
  \[
  2x\ge2\ln(1+x),
  \]
  代入 $x=0.1$ 得
  \[
  0.2=2\times0.1>2\ln1.1=\ln1.21,
  \]
  即 $c>b$。故
  \[
  b<c<a,
  \]
  选 D。
