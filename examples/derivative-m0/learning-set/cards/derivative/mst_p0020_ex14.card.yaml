solution:
  source_solution_summary: 由 $f'(x)=\ln x+1$ 得 $g(x)=(\ln x+1)/x=e\,h(ex)$，其中 $h(u)=\ln u/u$。① 因 $x>0$，$g(x)>0\iff \ln x+1>0\iff x>1/e$，正确。② $h(u)$ 在 $(0,e)$ 增、$(e,+\infty)$ 减，所以 $g(x)=e h(ex)$ 在 $(0,1)$ 增、$(1,+\infty)$ 减，命题给成 $(0,e)$ 与 $(e,+\infty)$，错误。③ 当 $x\in[1/e,1]$，$f(x)=x\ln x\le0$ 且 $g(x)\ge0$，两端等号不在同一点同时发生，故 $f(x)<g(x)$，正确。④ $F'(x)=\ln x+1-2ax$ 有两个零点等价于水平线 $y=2a$ 与 $y=g(x)$ 有两个交点，正确范围为 $0<2a<1$，即 $a\in(0,1/2)$；源解析据此判命题给出的 $(0,1)$ 错误。故正确命题个数为 2，选 B。
  key_steps:
    - step_id: step_1
      statement: 求出 $g(x)$ 并同构到 $h(ex)$。
      formula_trace:
        from: $f(x)=x\ln x$
        to: $f'(x)=\ln x+1,\quad g(x)=\frac{\ln x+1}{x}=e\cdot\frac{\ln(ex)}{ex}=e h(ex)$
        operation: 求导后把 $\ln x+1$ 写成 $\ln(ex)$，令 $h(u)=\ln u/u$。
        why: 把 $g$ 的符号和单调性转给熟悉的 $\ln u/u$ 模型。
      source_ref: page_0020
    - step_id: step_2
      statement: 判断命题①。
      formula_trace:
        from: $g(x)>0$
        to: $\frac{\ln x+1}{x}>0\iff \ln x+1>0\iff x>\frac1e$
        operation: 利用定义域 $x>0$，分母恒正。
        why: 解集与命题①一致。
      source_ref: page_0020
    - step_id: step_3
      statement: 判断命题②。
      formula_trace:
        from: $h(u)=\ln u/u$ 在 $(0,e)$ 增、在 $(e,+\infty)$ 减
        to: $g(x)=e h(ex)$ 在 $(0,1)$ 增、在 $(1,+\infty)$ 减
        operation: 令 $u=ex$，把 $u=e$ 对应回 $x=1$。
        why: 命题②把分界点错写成 $e$，应为 $1$，所以错误。
      source_ref: page_0020
    - step_id: step_4
      statement: 判断命题③。
      formula_trace:
        from: $x\in[\frac1e,1]$
        to: $f(x)=x\ln x\le0,\quad g(x)=\frac{\ln x+1}{x}\ge0$
        operation: 用 $f'(x)=\ln x+1\ge0$ 得 $f$ 在该区间递增且 $f(1)=0$；用命题①结论得 $g\ge0$。
        why: $f$ 的等号在 $x=1$，$g$ 的等号在 $x=1/e$，不能同时取等，故 $f(x)<g(x)$ 恒成立。
      source_ref: page_0020-page_0021
    - step_id: step_5
      statement: 把命题④转成导函数零点个数。
      formula_trace:
        from: $F(x)=f(x)-ax^2$
        to: $F'(x)=\ln x+1-2ax$ 有两个零点 $\iff y=2a$ 与 $y=g(x)$ 有两个交点
        operation: 令 $F'(x)=0$，移项得 $2a=(\ln x+1)/x=g(x)$。
        why: 极值点个数由导函数零点个数决定，图像交点能读参数范围。
      source_ref: page_0021
    - step_id: step_6
      statement: 由图像和 $g$ 的最大值读出命题④的正确范围。
      formula_trace:
        from: $g(x)$ 在 $x=1$ 处最大值为 $1$，且 $g(x)>0$ 的区间为 $(1/e,+\infty)$
        to: $y=2a$ 与 $y=g(x)$ 有两个交点 $\iff 0<2a<1\iff a\in(0,\frac12)$
        operation: 用单峰图像与水平线交点个数判定。
        why: 源题把范围写成 $(0,1)$，不是精确范围，故按源解析判错。
      source_ref: page_0021
    - step_id: step_7
      statement: 合并命题真假。
      formula_trace:
        from: ①正确，②错误，③正确，④错误
        to: 正确命题个数为 $2$，选 B
        operation: 计数。
        why: 与源页最终结论“只有①③正确，故选 B”一致。
      source_ref: page_0021
teaching_card:
  student_title: 把 $g(x)$ 看成平移后的 $\ln x/x$
  what_it_trains: 训练把 $\frac{\ln x+1}{x}$ 同构成 $e\frac{\ln(ex)}{ex}$，再用 $\ln x/x$ 的单峰性一次判断解集、单调区间、不等式和极值点参数。
  recognition_cues:
    - 题目给出 $f(x)=x\ln x$ 和 $g(x)=f'(x)/x$。
    - $g(x)$ 中出现 $\ln x+1$，可以合成 $\ln(ex)$。
    - 命题同时问 $g>0$、$g$ 单调、$F'(x)=0$ 的交点个数。
    - 图像中 $g$ 的最高点在 $x=1$，最大值为 $1$。
  normalization_moves:
    - 先求 $f'(x)$，再把 $g(x)$ 化为 $e h(ex)$。
    - 把 $h$ 的单调分界点 $u=e$ 对应回 $ex=e$，即 $x=1$。
    - 证明 $f<g$ 时分别估 $f\le0$ 和 $g\ge0$，再检查等号点不同。
    - 极值点问题先写 $F'(x)=0$，再看水平线 $y=2a$ 与 $g$ 的交点个数。
  common_failures:
    - 把题干误读成 $g(x)=f''(x)/x$。
    - 知道 $h(x)=\ln x/x$ 在 $x=e$ 处分界，却忘记 $g(x)=e h(ex)$ 的分界点变成 $x=1$。
    - 在第③个命题里只看到 $f(1)=0$ 或 $g(1/e)=0$，没有检查等号不能同取。
    - 第④个命题只凭 $(0,1/2)\subset(0,1)$ 作形式逻辑判断；源题按参数范围是否精确给出，判为错误。
  similar_practice_query: x ln x f'(x)/x ln x / x 同构 单调区间 极值点参数 y=2a
quality:
  confidence: high
