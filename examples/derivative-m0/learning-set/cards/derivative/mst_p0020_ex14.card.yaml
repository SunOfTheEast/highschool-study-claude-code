stem: |-
  设函数 $f(x)=x\ln x$，$g(x)=\frac{f'(x)}{x}$，给定下列命题
  ① 不等式 $g(x)>0$ 的解集为 $(\frac{1}{e}, +\infty)$。
  ② 函数 $g(x)$ 在 $(0,e)$ 单调递增，在 $(e,+\infty)$ 单调递减。
  ③ $x\in[\frac{1}{e},1]$ 时，总有 $f(x)<g(x)$ 恒成立。
  ④ 若函数 $F(x)=f(x)-ax^2$ 有两个极值点，则实数 $a\in(0,1)$。
  则正确的命题的个数为 ( )
  A. 1
  B. 2
  C. 3
  D. 4
answer: |-
  B

  由 $f'(x)=\ln x+1$ 得 $g(x)=(\ln x+1)/x=e\,h(ex)$，其中 $h(u)=\ln u/u$。① 因 $x>0$，$g(x)>0\iff \ln x+1>0\iff x>1/e$，正确。② $h(u)$ 在 $(0,e)$ 增、$(e,+\infty)$ 减，所以 $g(x)=e h(ex)$ 在 $(0,1)$ 增、$(1,+\infty)$ 减，命题给成 $(0,e)$ 与 $(e,+\infty)$，错误。③ 当 $x\in[1/e,1]$，$f(x)=x\ln x\le0$ 且 $g(x)\ge0$，两端等号不在同一点同时发生，故 $f(x)<g(x)$，正确。④ $F'(x)=\ln x+1-2ax$ 有两个零点等价于水平线 $y=2a$ 与 $y=g(x)$ 有两个交点，正确范围为 $0<2a<1$，即 $a\in(0,1/2)$；源解析据此判命题给出的 $(0,1)$ 错误。故正确命题个数为 2，选 B。
