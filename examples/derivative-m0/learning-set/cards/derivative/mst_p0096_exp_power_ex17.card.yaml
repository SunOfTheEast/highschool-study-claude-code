stem: |-
  （2023 雅安高二期末 T7）经过点 $(2,0)$ 作曲线 $y=x^2e^x$ 的切线有 ( )
  A. 1 条
  B. 2 条
  C. 3 条
  D. 4 条
answer: |
  C

  设切点为 $(x_0,x_0^2e^{x_0})$，因为
  $y'=(x^2+2x)e^x$，切线方程为
  $y-x_0^2e^{x_0}=(x_0^2+2x_0)e^{x_0}(x-x_0)$。
  将 $(2,0)$ 代入，得
  $-x_0^2e^{x_0}=(x_0^2+2x_0)e^{x_0}(2-x_0)$，
  整理为 $x_0e^{x_0}(x_0^2-x_0-4)=0$。因此
  $x_0=0$ 或 $x_0^2-x_0-4=0$；后二次方程判别式
  $\Delta=17>0$，且两根均不为 $0$，共得到三个不同切点，
  所以切线有 3 条，选 C。
