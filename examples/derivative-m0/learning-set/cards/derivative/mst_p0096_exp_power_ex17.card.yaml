solution:
  source_solution_summary: |
    设切点为 $(x_0,x_0^2e^{x_0})$，因为
    $y'=(x^2+2x)e^x$，切线方程为
    $y-x_0^2e^{x_0}=(x_0^2+2x_0)e^{x_0}(x-x_0)$。
    将 $(2,0)$ 代入，得
    $-x_0^2e^{x_0}=(x_0^2+2x_0)e^{x_0}(2-x_0)$，
    整理为 $x_0e^{x_0}(x_0^2-x_0-4)=0$。因此
    $x_0=0$ 或 $x_0^2-x_0-4=0$；后二次方程判别式
    $\Delta=17>0$，且两根均不为 $0$，共得到三个不同切点，
    所以切线有 3 条，选 C。
  key_steps:
    - step_id: step_1
      statement: 设切点并写出导数。
      formula_trace:
        from: $y=x^2e^x$
        to: $y^{\prime}=(x^2+2x)e^x,\quad y^{\prime}\big|_{x=x_0}=(x_0^2+2x_0)e^{x_0}$
        operation: 对乘积 $x^2e^x$ 求导。
        why: 过定点的切线必须先由切点坐标和该点斜率确定。
      source_ref: page_0097
    - step_id: step_2
      statement: 写出 $x_0$ 处切线并代入定点 $(2,0)$。
      formula_trace:
        from: $y-x_0^2e^{x_0}=(x_0^2+2x_0)e^{x_0}(x-x_0)$
        to: $-x_0^2e^{x_0}=(x_0^2+2x_0)e^{x_0}(2-x_0)$
        operation: 把 $x=2,y=0$ 代入切线方程。
        why: 定点在切线上等价于切点参数满足该方程。
      source_ref: page_0097
    - step_id: step_3
      statement: 整理为切点参数方程。
      formula_trace:
        from: $-x_0^2=(x_0^2+2x_0)(2-x_0)$
        to: $x_0(x_0^2-x_0-4)=0$
        operation: 两边除以 $e^{x_0}>0$ 并展开、移项、提取 $x_0$。
        why: 实根个数就是满足定点切线条件的不同切点个数。
      source_ref: page_0097
    - step_id: step_4
      statement: 数方程实根。
      formula_trace:
        from: $x_0=0\quad\text{或}\quad x_0^2-x_0-4=0$
        to: $1+2=3\text{ 个不同实根}$
        operation: 用 $\Delta=(-1)^2-4\cdot1\cdot(-4)=17>0$ 判断二次方程有两个不同实根。
        why: 三个不同切点对应三条不同切线。
      source_ref: page_0097
    - step_id: step_5
      statement: 用图像法解释三条切线的位置。
      formula_trace:
        from: $f^{\prime}(x)=(x^2+2x)e^x=0,\quad x=0,-2;\quad f^{\prime\prime}(x)=(x^2+4x+2)e^x$
        to: $x=0$ 给出 $x$ 轴切线，另有第一象限近切线和 $(-2,-2+\sqrt2)$ 内的远切线
        operation: 结合极值点、拐点和源页示意图定位三条切线。
        why: 源页法二用几何图像验证代数计数结论。
      source_ref: page_0097
teaching_card:
  student_title: 用切点参数数 $x^2e^x$ 过定点的三条切线
  what_it_trains: 训练把过定点作切线的问题转化成切点参数方程，再用方程根个数判断切线条数。
  recognition_cues:
    - 题干只问“经过点作曲线切线有几条”，没有要求具体切线方程。
    - 函数是 $x^2e^x$，求导后仍含公共因子 $e^x$，可在方程中消去。
    - 定点 $(2,0)$ 不在一般切点上，需要把它代入切线方程。
  normalization_moves:
    - 设切点横坐标 $x_0$，写 $x_0$ 处切线。
    - 代入 $(2,0)$ 得到只含 $x_0$ 的方程。
    - 把方程化成 $x_0(x_0^2-x_0-4)=0$，数三个实根。
  common_failures:
    - 只看到 $(0,0)$ 处的 $x$ 轴切线，漏掉另外两个切点。
    - 展开代入式时漏掉公共因子 $x_0$，把答案误判为 2 条。
    - 把 $x<-2$ 区间的函数单调性和切线切点区间混在一起。
  similar_practice_query: $x^2e^x$ 过 $(2,0)$ 切线条数 切点参数方程
