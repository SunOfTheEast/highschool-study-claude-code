original_problem:
  stem: |
    (甘肃张家川回族自治县第一中学 2024 届高三月考 T11) 若 $2^a+\log_2 a<2^{2b}+\log_2 b+1$，则下列正确的是 (  )
  parts: *a1
  choices:
    - A. $\ln(2b-a+1)<0$
    - B. $\ln(2b-a+1)>0$
    - C. $\ln|a-2b|>0$
    - D. $\ln|a-2b|<0$
  answer: B
  fidelity_notes:
    - 题头和题干开头位于 page_0025；解析跨到 page_0026 顶部。
    - 由 $\log_2 a,\log_2 b$ 有意义可知 $a>0,b>0$。
solution:
  source_solution_summary: 把 $2^{2b}+\log_2 b+1$ 写成 $2^{2b}+\log_2(2b)$。令 $f(x)=2^x+\log_2 x$，由其在 $(0,+\infty)$ 上单调递增，题设变为 $f(a)<f(2b)$，所以 $a<2b$。于是 $2b-a+1>1$，$\ln(2b-a+1)>0$，选 B。
  key_steps:
    - step_id: step_1
      statement: 先处理定义域。
      formula_trace:
        from: $\log_2 a,\ \log_2 b$ 有意义
        to: $a>0,\quad b>0,\quad 2b>0$
        operation: 使用对数真数大于 0。
        why: $a$ 与 $2b$ 都必须落在单调母函数 $f$ 的定义域内。
      source_ref: page_0025
    - step_id: step_2
      statement: 把右侧补成 $f(2b)$。
      formula_trace:
        from: $2^{2b}+\log_2 b+1$
        to: $2^{2b}+\log_2(2b)$
        operation: 使用 $\log_2(2b)=\log_2 b+\log_2 2=\log_2 b+1$。
        why: 这样题设左、右两侧同构为 $f(a)$ 与 $f(2b)$。
      source_ref: page_0025
    - step_id: step_3
      statement: 用单调母函数比较 $a$ 与 $2b$。
      formula_trace:
        from: $2^a+\log_2 a<2^{2b}+\log_2(2b)$
        to: $f(a)<f(2b)\Rightarrow a<2b$
        operation: |
          令 $f(x)=2^x+\log_2 x$，由 $f'(x)=2^x\ln2+\frac1{x\ln2}>0$ 得 $f$ 严格递增。
        why: 严格递增函数把函数值不等式等价转回自变量不等式。
      source_ref: page_0026
    - step_id: step_4
      statement: 把 $a<2b$ 转成选项中的对数符号。
      formula_trace:
        from: $a<2b$
        to: $2b-a+1>1,\quad \ln(2b-a+1)>0$
        operation: 两边移项得 $2b-a>0$，再加 1；利用 $\ln x$ 在 $x>0$ 上递增且 $\ln1=0$。
        why: 选项 B 正是该正负判断。
      source_ref: page_0026
teaching_card:
  student_title: 把 $+1$ 合进对数后比较 $a$ 与 $2b$
  what_it_trains: 训练识别 $2^x+\log_2 x$ 型单调同构，并把参数比较转成选项里的对数正负。
  recognition_cues:
    - 题设左侧是 $2^a+\log_2 a$。
    - 右侧有 $2^{2b}$ 和 $\log_2 b+1$。
    - 选项围绕 $2b-a$ 的符号或大小。
  normalization_moves:
    - 把 $\log_2 b+1$ 合并成 $\log_2(2b)$。
    - 令 $f(x)=2^x+\log_2 x$ 并比较 $f(a)$、$f(2b)$。
    - 由 $a<2b$ 推出 $2b-a+1>1$。
  common_failures:
    - 看见 $+1$ 后没有想到 $\log_2 2$。
    - 误以为 $a<2b$ 可以判断 $|a-2b|$ 与 1 的大小。
    - 忘记用 $\ln 1=0$ 判断选项 B。
  similar_practice_query: 同构函数 $2^x+\log_2 x$ 不等式 $a<2b$ 对数选项
quality:
  confidence: high
  needs_review: false
  review_notes:
    - 解析跨 page_0025/page_0026；已按 page_0026 顶部图片核对答案 B。
