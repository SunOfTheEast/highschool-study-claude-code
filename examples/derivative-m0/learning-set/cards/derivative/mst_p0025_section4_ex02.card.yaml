stem: |-
  (甘肃张家川回族自治县第一中学 2024 届高三月考 T11) 若 $2^a+\log_2 a<2^{2b}+\log_2 b+1$，则下列正确的是 (  )

  A. $\ln(2b-a+1)<0$
  B. $\ln(2b-a+1)>0$
  C. $\ln|a-2b|>0$
  D. $\ln|a-2b|<0$
answer: |-
  B

  把 $2^{2b}+\log_2 b+1$ 写成 $2^{2b}+\log_2(2b)$。令 $f(x)=2^x+\log_2 x$，由其在 $(0,+\infty)$ 上单调递增，题设变为 $f(a)<f(2b)$，所以 $a<2b$。于是 $2b-a+1>1$，$\ln(2b-a+1)>0$，选 B。
