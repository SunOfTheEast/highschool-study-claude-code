      - 若学生忽略 $\log_2 a,\log_2 b$ 的定义域，回补函数三要素与定义域。
      - 若学生不会把 $\log_2 b+1$ 合成为 $\log_2(2b)$，回补指数对数基础。
      - 若学生不能用导数证明 $2^x+\log_2 x$ 递增，回补导数运算与几何意义。
      - 若学生得到 $a<2b$ 后仍不会判断 $\ln(2b-a+1)>0$，回补函数性质与图像。
