stem: 已知函数 $f(x)=a\ln x-x^2-1$，$a\in\mathbf R$。若不等式 $f(x)\leqslant e^x-a$ 恒成立，求实数 $a$ 的取值范围。
answer: |-
  $0\leqslant a\leqslant e+2$。

  原不等式等价于 $a(1+\ln x)\leqslant e^x+x^2+1$ 对任意 $x>0$ 恒成立。若 $a<0$，当 $x\to0^+$ 时 $a(1+\ln x)\to+\infty$，而右边趋向 2，矛盾，所以必须 $a\geqslant0$。当 $a\geqslant0$ 时，将不等式两侧除以 $x>0$： $\frac{e^x}{x}+x+\frac1x\geqslant ae\frac{\ln(ex)}{ex}$。 左侧记为 $g(x)$，source 给出 $g_{\min}=g(1)=e+2$；右侧 $ae\frac{\ln(ex)}{ex}$ 的最大值在 $ex=e$ 即 $x=1$ 处取得，值为 $a$。取等点一致，因此要恒成立必须且只需 $a\leqslant e+2$。又 当 $a>e+2$ 时取 $x=1$ 得 $f(1)=-2>e-a$，与题设矛盾。综上 $0\leqslant a\leqslant e+2$。
