original_problem:
  stem: 已知函数 $f(x)=a\ln x-x^2-1$，$a\in\mathbf R$。若不等式 $f(x)\leqslant e^x-a$ 恒成立，求实数 $a$ 的取值范围。
  parts: *a1
  choices: []
  answer: $0\leqslant a\leqslant e+2$。
  fidelity_notes:
    - 单问求参题，无选项。
    - 定义域由 $\ln x$ 决定为 $x>0$。
solution:
  source_solution_summary: 原不等式等价于 $a(1+\ln x)\leqslant e^x+x^2+1$ 对任意 $x>0$ 恒成立。若 $a<0$，当 $x\to0^+$ 时 $a(1+\ln x)\to+\infty$，而右边趋向 2，矛盾，所以必须 $a\geqslant0$。当 $a\geqslant0$ 时，将不等式两侧除以 $x>0$： $\frac{e^x}{x}+x+\frac1x\geqslant ae\frac{\ln(ex)}{ex}$。 左侧记为 $g(x)$，source 给出 $g_{\min}=g(1)=e+2$；右侧 $ae\frac{\ln(ex)}{ex}$ 的最大值在 $ex=e$ 即 $x=1$ 处取得，值为 $a$。取等点一致，因此要恒成立必须且只需 $a\leqslant e+2$。又 当 $a>e+2$ 时取 $x=1$ 得 $f(1)=-2>e-a$，与题设矛盾。综上 $0\leqslant a\leqslant e+2$。
  key_steps:
    - step_id: step_1
      statement: 先把恒成立不等式移成参数乘法。
      formula_trace:
        from: $a\ln x-x^2-1\leqslant e^x-a$
        to: $a(1+\ln x)\leqslant e^x+x^2+1$
        operation: 移项并合并含 $a$ 项。
        why: 参数只出现在一侧，便于判断符号和求范围。
      source_ref: page_0223_ex07_solution
    - step_id: step_2
      statement: 排除 $a<0$。
      formula_trace:
        from: $a(1+\ln x)\leqslant e^x+x^2+1$
        to: $a<0$ 时 $x\to0^+$ 左侧趋向 $+\infty$，不可能恒成立
        operation: 看定义域端点极限。
        why: source 写“易知 $a\geqslant0$”，这里补出原因。
      source_ref: page_0223_ex07_solution
    - step_id: step_3
      statement: 除以 $x$，进入上下函数比较。
      formula_trace:
        from: $e^x+x^2+1\geqslant a(1+\ln x)$
        to: $\frac{e^x}{x}+x+\frac1x\geqslant ae\frac{\ln(ex)}{ex}$
        operation: 两侧除以 $x>0$，并把 $1+\ln x$ 写成 $\ln(ex)$。
        why: 右侧变成 $\ln u/u$，左侧变成有明确最小值的上函数。
      source_ref: page_0223_ex07_solution
    - step_id: step_4
      statement: 比较左右最值。
      formula_trace:
        from: $G(x)=\frac{e^x}{x}+x+\frac1x$，$H(x)=ae\frac{\ln(ex)}{ex}$
        to: $G_{\min}=G(1)=e+2$，$H_{\max}=H(1)=a$
        operation: 分别使用基础函数极值。
        why: 取等点一致，边界可以直接由 $a\leqslant e+2$ 给出。
      source_ref: page_0223_ex07_solution
    - step_id: step_5
      statement: 用 $x=1$ 验证必要性。
      formula_trace:
        from: $a>e+2$
        to: $f(1)=-2>e-a$，矛盾
        operation: 代入取等点。
        why: 排除超过边界的参数，完成求参。
      source_ref: page_0223_ex07_solution
teaching_card:
  student_title: 把 $a(1+\ln x)$ 除成 $\ln(ex)/(ex)$ 来夹参
  what_it_trains: 训练含参恒成立中的分而治之：先判断参数符号，再把指对式除成一组同点取等的上下函数。
  recognition_cues:
    - 题里有 $a\ln x$ 和右边的 $-a$，可以合并成 $a(1+\ln x)$。
    - 出现 $1+\ln x$ 时，可以写成 $\ln(ex)$。
    - 左右边界都在 $x=1$，说明这是“取等一致”的求参题。
  normalization_moves:
    - 先移项集中参数。
    - 用 $x\to0^+$ 判断 $a$ 不能为负。
    - 除以 $x$ 后分别找左最小、右最大。
  common_failures:
    - 没处理 $a<0$，直接除式求出 $a\leqslant e+2$。
    - 把 $\ln x+1$ 忘记写成 $\ln(ex)$，导致右侧无法套 $\ln u/u$。
    - 只看特殊点 $x=1$，没有说明为什么其他 $x$ 都成立。
  similar_practice_query: a lnx - x^2 -1 <= e^x-a 参数范围 ln(ex)/(ex) 分而治之
