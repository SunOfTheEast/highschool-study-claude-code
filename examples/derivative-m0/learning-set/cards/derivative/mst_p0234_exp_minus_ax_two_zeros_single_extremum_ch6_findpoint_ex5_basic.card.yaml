stem: 当 $a>e$ 时，讨论函数 $f(x)=e^x-ax$ 的零点个数。
answer: |-
  $f(x)$ 有两个零点，且可取 $x_1\in(0,\ln a)$、$x_2\in(\ln a,2\ln a)$。

  $f'(x)=e^x-a$，当 $x<\ln a$ 时 $f$ 递减，当 $x>\ln a$ 时 $f$ 递增，极小值为 $f(\ln a)=a(1-\ln a)<0$。又 $f(0)=1>0$， 所以左侧有零点 $x_1\in(0,\ln a)$。右侧要找大于 $\ln a$ 的点， 用等效零点法 $f(x)=e^{x/2}(e^{x/2}-\frac{ax}{e^{x/2}})$。由 $\frac{x}{e^{x/2}}\leqslant\frac2e$ 得 $f(x)\geqslant e^{x/2}(e^{x/2}-\frac{2a}{e})$，取 $x=2\ln\frac{2a}{e}$ 可得右侧变号；source 进一步取整为 $x=2\ln a$，得到 $x_2\in(\ln a,2\ln a)$。因此共有两个零点。
