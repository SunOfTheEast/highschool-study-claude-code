original_problem:
  stem: 当 $a>e$ 时，讨论函数 $f(x)=e^x-ax$ 的零点个数。
  parts: *a1
  choices: []
  answer: $f(x)$ 有两个零点，且可取 $x_1\in(0,\ln a)$、$x_2\in(\ln a,2\ln a)$。
  fidelity_notes:
    - 单问零点个数题，无选项。
    - 题设 $a>e$，所以 $\ln a>1$。
solution:
  source_solution_summary: $f'(x)=e^x-a$，当 $x<\ln a$ 时 $f$ 递减，当 $x>\ln a$ 时 $f$ 递增，极小值为 $f(\ln a)=a(1-\ln a)<0$。又 $f(0)=1>0$， 所以左侧有零点 $x_1\in(0,\ln a)$。右侧要找大于 $\ln a$ 的点， 用等效零点法 $f(x)=e^{x/2}(e^{x/2}-\frac{ax}{e^{x/2}})$。由 $\frac{x}{e^{x/2}}\leqslant\frac2e$ 得 $f(x)\geqslant e^{x/2}(e^{x/2}-\frac{2a}{e})$，取 $x=2\ln\frac{2a}{e}$ 可得右侧变号；source 进一步取整为 $x=2\ln a$，得到 $x_2\in(\ln a,2\ln a)$。因此共有两个零点。
  key_steps:
    - step_id: step_1
      statement: 先确定单极值形状。
      formula_trace:
        from: $f(x)=e^x-ax$
        to: $f^\prime(x)=e^x-a$，极小值点 $x=\ln a$
        operation: 求导并令导数为 0。
        why: 单极值函数的两个零点要围绕极值点左右取点。
      source_ref: page_0234_ex5_basic_solution_start
    - step_id: step_2
      statement: 极小值小于 0，确认有两个零点的可能。
      formula_trace:
        from: $f(\ln a)=a-a\ln a$
        to: $f(\ln a)=a(1-\ln a)<0$
        operation: 用 $a>e$ 得 $\ln a>1$。
        why: 极小值低于 x 轴，左右都有机会过零。
      source_ref: page_0234_ex5_basic_solution_start
    - step_id: step_3
      statement: 左侧零点由 $f(0)>0$ 直接夹出。
      formula_trace:
        from: $f(0)=1>0,\ f(\ln a)<0$
        to: $x_1\in(0,\ln a)$
        operation: 介值定理。
        why: 左侧不需要复杂取点。
      source_ref: page_0234_ex5_basic_solution_start
    - step_id: step_4
      statement: 右侧使用等效零点法。
      formula_trace:
        from: $f(x)=e^x-ax$
        to: $f(x)=e^{x/2}(e^{x/2}-\frac{ax}{e^{x/2}})$
        operation: 提出 $e^{x/2}$。
        why: 把无界客体 $-ax$ 转成可控的 $x/e^{x/2}$。
      source_ref: page_0235_ex5_basic_continuation
    - step_id: step_5
      statement: 用 $x/e^{x/2}$ 的上界构造右侧点。
      formula_trace:
        from: $\frac{x}{e^{x/2}}\leqslant\frac2e$
        to: $f(x)\geqslant e^{x/2}(e^{x/2}-\frac{2a}{e})$
        operation: 用客体变量上界。
        why: 这就是 source 的“主题留一半，客体被吊打”。
      source_ref: page_0235_ex5_basic_continuation
    - step_id: step_6
      statement: 取整得到更好看的右侧夹点。
      formula_trace:
        from: $x=2\ln\frac{2a}{e}$ 可用
        to: $x=2\ln a$，故 $x_2\in(\ln a,2\ln a)$
        operation: 用更大的右侧点保持正值并让结构更整齐。
        why: source 明确说明通常放缩取点需要取整。
      source_ref: page_0235_ex5_basic_continuation
teaching_card:
  student_title: 单极值双零点：左边直接夹，右边提出 $e^{x/2}$ 再取整
  what_it_trains: 训练单极值双零点的主体客体分析：右侧零点不能硬猜，要把 $ax$ 变成有界客体。
  recognition_cues:
    - $a>e$ 让极小值 $a(1-\ln a)$ 为负。
    - 左侧已经有 $f(0)>0$，右侧才是取点难点。
    - $e^x-ax$ 右侧取点常用提出 $e^{x/2}$。
  normalization_moves:
    - 先找极小值点 $\ln a$。
    - 用 $f(0)>0$ 得左零点。
    - 右侧写成 $e^{x/2}(e^{x/2}-ax/e^{x/2})$。
    - 用 $x/e^{x/2}\leqslant2/e$ 后取 $2\ln a$。
  common_failures:
    - 只说有两个零点，没给右侧取点。
    - 把 $2\ln(2a/e)$ 和 $2\ln a$ 的作用混淆。
    - 没有解释为什么要提出 $e^{x/2}$。
  similar_practice_query: e^x-ax a>e 两个零点 单极值双零点 e^{x/2} 主题留一半 客体被吊打
