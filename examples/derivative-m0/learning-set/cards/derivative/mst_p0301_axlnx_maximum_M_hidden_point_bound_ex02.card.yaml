stem: |-
  （2024 · 北京月考）已知函数 $f(x)=ax\ln x-x$，$a\in\mathbf{R}$。当 $a=1$ 时，记函数 $g(x)=\ln(x+1)-f(x)$ 的最大值为 $M$。
  1. 证明：$M<2$。
answer: |-
  $M<2$。

  当 $a=1$ 时， $g(x)=\ln(x+1)-x\ln x+x$，定义域为 $(0,+\infty)$。 $g^\prime(x)=\frac1{x+1}-\ln x$， 且 $g^{\prime\prime}(x)=-\frac1{(x+1)^2}-\frac1x<0$， 所以 $g^\prime$ 单调递减。又 $g^\prime(1)=\frac12>0$， $g^\prime(\frac32)=\frac25-\ln\frac32<0$，故存在唯一 $x_0\in(1,\frac32)$ 使 $g^\prime(x_0)=0$。此时 $g$ 先增后减， 最大值为 $M=g(x_0)$。由 $g^\prime(x_0)=0$ 得 $\ln x_0=\frac1{x_0+1}$，于是 $M=\ln(x_0+1)-\frac{x_0}{x_0+1}+x_0$。令 $\varphi(x)=\ln(x+1)+x+\frac1{x+1}-1$，则 $\varphi^\prime(x)=\frac{x}{(x+1)^2}+1>0$，所以 $M=\varphi(x_0)<\varphi(\frac32)=\ln\frac52+\frac9{10}<1+\frac9{10}<2$。
