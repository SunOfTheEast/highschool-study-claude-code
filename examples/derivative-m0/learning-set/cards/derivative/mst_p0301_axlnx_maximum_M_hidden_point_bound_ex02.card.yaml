original_problem:
  stem: （2024 · 北京月考）已知函数 $f(x)=ax\ln x-x$，$a\in\mathbf{R}$。当 $a=1$ 时，记函数 $g(x)=\ln(x+1)-f(x)$ 的最大值为 $M$。
  parts: *a1
  choices: []
  answer: $M<2$。
  fidelity_notes:
    - 无选项。
    - 题目只处理 $a=1$ 情形。
solution:
  source_solution_summary: 当 $a=1$ 时， $g(x)=\ln(x+1)-x\ln x+x$，定义域为 $(0,+\infty)$。 $g^\prime(x)=\frac1{x+1}-\ln x$， 且 $g^{\prime\prime}(x)=-\frac1{(x+1)^2}-\frac1x<0$， 所以 $g^\prime$ 单调递减。又 $g^\prime(1)=\frac12>0$， $g^\prime(\frac32)=\frac25-\ln\frac32<0$，故存在唯一 $x_0\in(1,\frac32)$ 使 $g^\prime(x_0)=0$。此时 $g$ 先增后减， 最大值为 $M=g(x_0)$。由 $g^\prime(x_0)=0$ 得 $\ln x_0=\frac1{x_0+1}$，于是 $M=\ln(x_0+1)-\frac{x_0}{x_0+1}+x_0$。令 $\varphi(x)=\ln(x+1)+x+\frac1{x+1}-1$，则 $\varphi^\prime(x)=\frac{x}{(x+1)^2}+1>0$，所以 $M=\varphi(x_0)<\varphi(\frac32)=\ln\frac52+\frac9{10}<1+\frac9{10}<2$。
  key_steps:
    - step_id: step_1
      statement: 写出 $a=1$ 时的 $g$ 和导数。
      formula_trace:
        from: $g(x)=\ln(x+1)-f(x)$
        to: $g(x)=\ln(x+1)-x\ln x+x,\quad g^\prime(x)=\frac1{x+1}-\ln x$
        operation: 代入 $a=1$ 并求导。
        why: 最大值来自 $g^\prime=0$ 的隐点。
      source_ref: page_0301_ex02_solution_start
    - step_id: step_2
      statement: 证明 $g^\prime$ 单调递减并定位最大点。
      formula_trace:
        from: $g^{\prime\prime}(x)=-\frac1{(x+1)^2}-\frac1x<0$
        to: $x_0\in(1,\frac32),\quad g^\prime(x_0)=0$
        operation: 用 $g^\prime(1)>0$ 与 $g^\prime(\frac32)<0$ 夹住零点。
        why: $g$ 在 $x_0$ 处取得唯一最大值。
      source_ref: page_0301_ex02_solution_start
    - step_id: step_3
      statement: 用隐点关系改写最大值 $M$。
      formula_trace:
        from: $g^\prime(x_0)=0$
        to: $\ln x_0=\frac1{x_0+1}$
        operation: 把导数零点方程改写。
        why: 这样可以消掉 $M$ 中的 $x_0\ln x_0$。
      source_ref: page_0301_ex02_solution_start
    - step_id: step_4
      statement: 把 $M$ 化成关于 $x_0$ 的可估表达式。
      formula_trace:
        from: $M=g(x_0)=\ln(x_0+1)-x_0\ln x_0+x_0$
        to: $M=\ln(x_0+1)-\frac{x_0}{x_0+1}+x_0$
        operation: 代入 $\ln x_0=\frac1{x_0+1}$。
        why: 这是本题的隐点消参核心。
      source_ref: page_0301_ex02_solution_start
    - step_id: step_5
      statement: 构造递增函数上估 $M$。
      formula_trace:
        from: $\varphi(x)=\ln(x+1)+x+\frac1{x+1}-1$
        to: $M=\varphi(x_0)<\varphi(\frac32)$
        operation: 证明 $\varphi^\prime(x)>0$，并用 $x_0<\frac32$。
        why: 最大点不可求，但它的位置足够给出上界。
      source_ref: page_0302_ex02_solution_end
    - step_id: step_6
      statement: 完成数值上界。
      formula_trace:
        from: $\varphi(\frac32)=\ln\frac52+\frac9{10}$
        to: $M<2$
        operation: 用 $\ln\frac52<1$。
        why: 这是最后的粗估，不是主路线。
      source_ref: page_0302_ex02_solution_end
teaching_card:
  student_title: 最大点消参后估上界
  what_it_trains: 训练最大值点求不出来时，先用导数方程改写最大值，再用最大点所在区间估上界。
  recognition_cues:
    - 题目问最大值 $M$ 的上界，而最大点 $x_0$ 求不出来。
    - $g^\prime(x)=\frac1{x+1}-\ln x$ 单调递减。
    - $g^\prime(x_0)=0$ 正好能把 $\ln x_0$ 换成 $\frac1{x_0+1}$。
    - $x_0<\frac32$ 后可以用一个递增函数压住 $M$。
  normalization_moves:
    - 不要硬求 $x_0$。
    - 先证明 $x_0$ 在 $(1,\frac32)$。
    - 把 $M$ 改写成 $\varphi(x_0)$。
    - 最后用 $\varphi(\frac32)$ 做上界。
  common_failures:
    - 只知道最大值在 $g^\prime=0$，但忘记把这个方程代回 $M$。
    - 把 $\ln x_0=\frac1{x_0+1}$ 写反或漏掉。
    - 不会证明 $\varphi$ 递增。
    - 把最后的数值粗估当成主方法，忽略前面的隐点消参。
  similar_practice_query: xlnx ln(x+1) 最大值 M 隐点 x0 gprime=0 上界
