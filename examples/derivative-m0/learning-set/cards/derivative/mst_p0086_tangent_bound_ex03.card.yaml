solution:
  source_solution_summary: 设切点为 $(x_0,x_0+\ln x_0)$，其中 $x_0>0$。因为 $f'(x_0)=1+\frac1{x_0}$，切线方程整理为 $y=(1+\frac1{x_0})x-1+\ln x_0$，所以 $k=1+\frac1{x_0}$，$m=-1+\ln x_0=-\ln(k-1)-1$，A 正确。 又 $k+m=\frac1{x_0}+\ln x_0$，其导数为 $\frac{x_0-1}{x_0^2}$，在 $x_0=1$ 处取最小值 1，B 正确。 $k-m=2+\frac1{x_0}-\ln x_0$ 在 $(0,+\infty)$ 上单调递减且 当 $x_0\to0^+$ 时趋于 $+\infty$，没有最大值，C 错误。 若 $m=-2k$，代入切点参数得 $\ln x_0+1+\frac2{x_0}=0$，但该函数在 $x_0=2$ 处最小值为 $\ln2+2>0$，所以不存在这样的切线，更不可能有 2 条，D 错误。 故选 AB。
  key_steps:
    - step_id: step_1
      statement: 设切点并把切线写成 $k,m$ 的参数形式。
      formula_trace:
        from: |
          $f(x)=x+\ln x,\qquad f'(x_0)=1+\frac1{x_0}$
        to: |
          $y-\left(x_0+\ln x_0\right)=\left(1+\frac1{x_0}\right)(x-x_0)$
          $y=\left(1+\frac1{x_0}\right)x-1+\ln x_0$
        operation: 用切点 $(x_0,x_0+\ln x_0)$ 和导数斜率写点斜式，再展开。
        why: 所有切线都由切点横坐标 $x_0>0$ 唯一参数化，后面四个选项都可回到这个参数。
      source_ref: page_0086
    - step_id: step_2
      statement: 判断 A：消去切点参数得到 $m$ 与 $k$ 的关系。
      formula_trace:
        from: |
          $k=1+\frac1{x_0},\qquad m=-1+\ln x_0$
        to: |
          $x_0=\frac1{k-1},\qquad m=\ln\frac1{k-1}-1=-\ln(k-1)-1$
        operation: 由 $k$ 解出 $x_0$，代回 $m$。
        why: 切线斜率 $k>1$，因此 $k-1=\frac1{x_0}>0$，对数表达有意义。
      source_ref: page_0086
    - step_id: step_3
      statement: 判断 B：把 $k+m$ 化成单变量函数求最小值。
      formula_trace:
        from: |
          $k+m=\left(1+\frac1{x_0}\right)+(-1+\ln x_0)=\frac1{x_0}+\ln x_0$
        to: |
          $(k+m)'=\frac{x_0-1}{x_0^2},\qquad (k+m)_{\min}=1$
        operation: 对 $G(x)=\frac1x+\ln x$ 求导并判定 $x=1$ 为谷底。
        why: $G(1)=1$，且 $G$ 在 $(0,1)$ 上递减、在 $(1,+\infty)$ 上递增。
      source_ref: page_0086
    - step_id: step_4
      statement: 判断 C：$k-m$ 不存在最大值。
      formula_trace:
        from: |
          $k-m=\left(1+\frac1{x_0}\right)-(-1+\ln x_0)=2+\frac1{x_0}-\ln x_0$
        to: |
          $\frac{d}{dx_0}(k-m)=-\frac1{x_0^2}-\frac1{x_0}<0,\qquad
          \lim_{x_0\to0^+}(k-m)=+\infty$
        operation: 用切点参数表达 $k-m$，再看单调性和端点趋势。
        why: 函数从 $+\infty$ 单调降到 $-\infty$，所以不可能有“最大值为 1”。
      source_ref: page_0086
    - step_id: step_5
      statement: 判断 D：把 $m=-2k$ 化成切点方程。
      formula_trace:
        from: |
          $m=-2k,\qquad k=1+\frac1{x_0},\qquad m=-1+\ln x_0$
        to: |
          $\ln x_0+1+\frac2{x_0}=0$
        operation: 把 $k,m$ 的切点参数式代入 $m=-2k$。
        why: $m=-2k$ 等价于直线族都过定点 $(2,0)$，是否有切线仍要看切点方程有没有解。
      source_ref: page_0086
    - step_id: step_6
      statement: 说明 D 中切点方程无解。
      formula_trace:
        from: |
          $H(x)=\ln x+1+\frac2x$
        to: |
          $H'(x)=\frac{x-2}{x^2},\qquad H_{\min}=H(2)=\ln2+2>0$
        operation: 对 $H$ 求导，找最小值。
        why: $H(x)$ 恒大于 0，所以过 $(2,0)$ 不存在 $y=x+\ln x$ 的切线。
      source_ref: page_0086
teaching_card:
  student_title: 先用切点把 k 和 m 捆在一起
  what_it_trains: 训练学生遇到“给出所有切线再判断命题”的多选题时，先把切线斜率和截距 都写成切点横坐标的函数，再逐项判断关系、最值和切线条数。
  recognition_cues:
    - 题干只说直线是 $x+\ln x$ 的切线，没有给切点。
    - 选项同时出现 $m$、$k+m$、$k-m$、$m=-2k$。
    - $f^{\prime\prime}(x)=-1/x^2<0$，切线与上凸图像的位置关系可辅助判断。
  normalization_moves:
    - 设切点 $x_0>0$，写出 $k=1+\frac1{x_0}$、$m=-1+\ln x_0$。
    - 判断关系式时先消去 $x_0$。
    - 判断最值时保留 $x_0$，把 $k\pm m$ 化成单变量函数。
    - 判断 $m=-2k$ 时把直线族看成过 $(2,0)$，再检查切点方程。
  common_failures:
    - 把 $k$ 当作任意实数，忘记切线斜率必须满足 $k>1$。
    - 只会验证 A，不能继续用同一个 $x_0$ 参数处理 B、C、D。
    - 误以为 $k-m$ 在图像上有最大值，忽略 $x_0\to0^+$ 时它趋于 $+\infty$。
    - 看到 $m=-2k$ 就认为过定点一定有两条切线，没有检查切点方程是否有解。
  similar_practice_query: x+lnx 切线 k m 参数 多选 k+m 最小值 过定点切线
