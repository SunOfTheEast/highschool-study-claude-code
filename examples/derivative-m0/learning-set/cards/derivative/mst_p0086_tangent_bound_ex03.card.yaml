stem: |-
  （2023 福州一中高二期中 T11）已知直线 $l:y=kx+m$ 是曲线 $f(x)=x+\ln x$ 的切线，则（  ）
  A. $m=-\ln(k-1)-1$
  B. $k+m$ 的最小值为 1
  C. $k-m$ 的最大值为 1
  D. $m=-2k$ 时，直线 $l$ 有 2 条
answer: |-
  AB

  设切点为 $(x_0,x_0+\ln x_0)$，其中 $x_0>0$。因为 $f'(x_0)=1+\frac1{x_0}$，切线方程整理为 $y=(1+\frac1{x_0})x-1+\ln x_0$，所以 $k=1+\frac1{x_0}$，$m=-1+\ln x_0=-\ln(k-1)-1$，A 正确。 又 $k+m=\frac1{x_0}+\ln x_0$，其导数为 $\frac{x_0-1}{x_0^2}$，在 $x_0=1$ 处取最小值 1，B 正确。 $k-m=2+\frac1{x_0}-\ln x_0$ 在 $(0,+\infty)$ 上单调递减且 当 $x_0\to0^+$ 时趋于 $+\infty$，没有最大值，C 错误。 若 $m=-2k$，代入切点参数得 $\ln x_0+1+\frac2{x_0}=0$，但该函数在 $x_0=2$ 处最小值为 $\ln2+2>0$，所以不存在这样的切线，更不可能有 2 条，D 错误。 故选 AB。
