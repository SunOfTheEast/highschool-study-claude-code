stem: （2024 · 武汉四调节选）已知函数 $f(x)=\frac{e^x-1}{x}$。若 $f(x)>a^x$，其中 $a>0$ 且 $a\ne1$，求实数 $a$ 的值。
answer: |-
  $a=\sqrt e$。

  令 $g(x)=e^x-1-xa^x$。原不等式在 $x>0$ 时等价于 $g(x)>0$，在 $x<0$ 时等价于 $g(x)<0$。由于 $g(0)=0$ 且 $g^\prime(0)=0$，要让 $g$ 在 0 左右按正确方向穿过， 需要 $g^\prime$ 在 0 附近以 0 为极小值，即先令 $g^{\prime\prime}(0)=1-2\ln a=0$，得 $a=\sqrt e$。当 $a=\sqrt e$ 时， $g=e^{x/2}(e^{x/2}-e^{-x/2}-x)$，其符号与 $x$ 一致， 所以成立。若 $a>\sqrt e$，则 $g^{\prime\prime}(0)<0$， 正侧附近会使 $g<0$；若 $a<\sqrt e$，负侧附近会使 $g>0$； 均矛盾。
