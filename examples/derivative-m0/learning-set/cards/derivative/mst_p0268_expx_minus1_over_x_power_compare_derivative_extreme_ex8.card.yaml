original_problem:
  stem: （2024 · 武汉四调节选）已知函数 $f(x)=\frac{e^x-1}{x}$。若 $f(x)>a^x$，其中 $a>0$ 且 $a\ne1$，求实数 $a$ 的值。
  parts: *a1
  choices: []
  answer: $a=\sqrt e$。
  fidelity_notes:
    - 无选项。
    - 本题默认 $x\ne0$；source 通过 $x=0$ 附近的延拓符号来探路。
solution:
  source_solution_summary: 令 $g(x)=e^x-1-xa^x$。原不等式在 $x>0$ 时等价于 $g(x)>0$，在 $x<0$ 时等价于 $g(x)<0$。由于 $g(0)=0$ 且 $g^\prime(0)=0$，要让 $g$ 在 0 左右按正确方向穿过， 需要 $g^\prime$ 在 0 附近以 0 为极小值，即先令 $g^{\prime\prime}(0)=1-2\ln a=0$，得 $a=\sqrt e$。当 $a=\sqrt e$ 时， $g=e^{x/2}(e^{x/2}-e^{-x/2}-x)$，其符号与 $x$ 一致， 所以成立。若 $a>\sqrt e$，则 $g^{\prime\prime}(0)<0$， 正侧附近会使 $g<0$；若 $a<\sqrt e$，负侧附近会使 $g>0$； 均矛盾。
  key_steps:
    - step_id: step_1
      statement: 把原不等式转成 $g$ 的左右符号。
      formula_trace:
        from: $\frac{e^x-1}{x}>a^x$
        to: $g(x)=e^x-1-xa^x$，且 $x>0$ 要 $g>0$，$x<0$ 要 $g<0$
        operation: 乘以 $x$ 并按正负分侧。
        why: 0 左右的符号方向相反，是导函数极点效应的入口。
      source_ref: page_0268_ex8_solution
    - step_id: step_2
      statement: 计算导数并识别极点条件。
      formula_trace:
        from: $g^\prime(x)=e^x-xa^x\ln a-a^x$
        to: $g^\prime(0)=0$
        operation: 求导并代入 0。
        why: $g$ 要穿过 0，而 $g^\prime(0)=0$，所以要继续看 $g^\prime$ 的局部形态。
      source_ref: page_0268_ex8_solution
    - step_id: step_3
      statement: 由 $g^{\prime\prime}(0)=0$ 锁定参数。
      formula_trace:
        from: $g^{\prime\prime}(0)=1-2\ln a$
        to: $a=\sqrt e$
        operation: 令导函数在 0 处满足极点效应。
        why: 否则 $g^\prime$ 会在某一侧变成错误符号，破坏 $g$ 的左右符号。
      source_ref: page_0268_ex8_solution
    - step_id: step_4
      statement: 证明 $a=\sqrt e$ 的充分性。
      formula_trace:
        from: $g(x)=e^x-1-xe^{x/2}$
        to: $g(x)=e^{x/2}(e^{x/2}-e^{-x/2}-x)$
        operation: 提取 $e^{x/2}$。
        why: $e^{x/2}-e^{-x/2}$ 与 $x$ 同向比较，给出正确符号。
      source_ref: page_0268_ex8_solution
    - step_id: step_5
      statement: 排除 $a\ne\sqrt e$。
      formula_trace:
        from: $g^{\prime\prime}(0)=1-2\ln a$
        to: $a>\sqrt e$ 正侧矛盾；$a<\sqrt e$ 负侧矛盾
        operation: 局部反证。
        why: 说明 $a=\sqrt e$ 不只是候选，而是唯一值。
      source_ref: page_0268_ex8_solution
teaching_card:
  student_title: 同一道题的二阶探路：让导函数在 0 附近贴住
  what_it_trains: 训练导函数极点效应：原函数左右要穿过 0，但一阶导在 0 也为 0，于是继续看二阶导来锁参数。
  recognition_cues:
    - $\frac{e^x-1}{x}$ 和 $a^x$ 在 $x=0$ 附近都贴近 1。
    - 乘以 $x$ 后，$x>0$ 与 $x<0$ 对 $g$ 的符号要求相反。
    - $g^\prime(0)=0$ 自动成立，说明要继续看 $g^{\prime\prime}(0)$。
  normalization_moves:
    - 先构造 $g=e^x-1-xa^x$。
    - 再看 $g^\prime$ 是否能在 0 附近保持正确方向。
    - 由 $g^{\prime\prime}(0)=0$ 得 $a=\sqrt e$，最后回证。
  common_failures:
    - 直接把 $x=0$ 当作原函数定义域内点。
    - 只算 $g^\prime(0)=0$ 就停下，没有看二阶。
    - 得到 $a=\sqrt e$ 后不验证左右符号。
    - 反证 $a>\sqrt e$ 或 $a<\sqrt e$ 时只说局部错误，没有指明是哪一侧符号冲突。
  similar_practice_query: (e^x-1)/x a^x 导函数极点效应 二阶导 sqrt(e)
