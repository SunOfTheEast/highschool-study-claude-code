solution:
  source_solution_summary: |
    先比较 $b,a$：
    \[
    e^x>1+x\ (x>0),\qquad x>\sin x\ (x>0).
    \]
    取 $x=0.1$ 得
    \[
    b=e^{0.1}>1+0.1>1+\sin0.1=a,
    \]
    所以 $b>a$。
    再比较 $a,c$。
    法一（构造函数）：
    \[
    h(x)=\sin x-\frac58x,\quad 0<x<\frac\pi6.
    \]
    则
    \[
    h^{\prime}(x)=\cos x-\frac58.
    \]
    因 $0<x<\frac\pi6$ 时 $\cos x>\frac{\sqrt3}{2}>\frac58$，故 $h^{\prime}(x)>0$，$h(x)$ 递增，
    \[
    h(x)>h(0)=0\Rightarrow \sin x>\frac58x.
    \]
    代入 $x=0.1$：
    \[
    \sin0.1>\frac58\cdot0.1=\frac1{16},
    \]
    所以
    \[
    a=1+\sin0.1>1+\frac1{16}=\frac{17}{16}=c.
    \]
    法二（割线放缩）：
    \[
    \sin x>\frac{2x}{\pi}>\frac58x\quad (0<x<\frac\pi6),
    \]
    同样推出 $\sin0.1>\frac1{16}$，故 $a>c$。
    综上
    \[
    b>a>c,
    \]
    选 B。
  key_steps:
    - step_id: step_1
      statement: 用指数与正弦的标准不等式先证 $b>a$。
      formula_trace:
        from: $b=e^{0.1},\ a=1+\sin0.1$
        to: $e^{0.1}>1+0.1>1+\sin0.1$，即 $b>a$
        operation: 联用 $e^x>1+x$ 与 $x>\sin x$（$x=0.1$）。
        why: 先固定 $b$ 的相对位置。
      source_ref: page_0160_ex14_solution_cont
    - step_id: step_2
      statement: 法一：构造 $h(x)$ 并由导数证明 $\sin x>\frac58x$。
      formula_trace:
        from: $h(x)=\sin x-\frac58x$
        to: $h^{\prime}(x)=\cos x-\frac58>0\Rightarrow \sin x>\frac58x$
        operation: 在 $\left(0,\frac\pi6\right)$ 上用 $\cos x>\frac{\sqrt3}{2}>\frac58$。
        why: 建立 $\sin0.1$ 的可计算下界。
      source_ref: page_0160_ex14_solution_cont
    - step_id: step_3
      statement: 代入 $x=0.1$ 得到 $a>c$。
      formula_trace:
        from: $\sin0.1>\frac58\cdot0.1$
        to: $a=1+\sin0.1>1+\frac1{16}=\frac{17}{16}=c$
        operation: 把线性下界换算为分数阈值。
        why: 完成 $a,c$ 的比较。
      source_ref: page_0160_ex14_solution_cont
    - step_id: step_4
      statement: 法二：割线放缩给出同一结论。
      formula_trace:
        from: $\sin x>\frac{2x}{\pi}>\frac58x$
        to: $\sin0.1>\frac1{16}\Rightarrow a>c$
        operation: 用过原点与 $\left(\frac\pi2,1\right)$ 的割线下界。
        why: 源解提供的备选路径，与法一互证。
      source_ref: page_0160_ex14_solution_cont
    - step_id: step_5
      statement: 合并顺序并对应选项。
      formula_trace:
        from: $b>a$ 且 $a>c$
        to: $b>a>c$，选 B
        operation: 传递不等式。
        why: 得到最终答案。
      source_ref: page_0160_ex14_solution_cont
teaching_card:
  student_title: 小角正弦下界配指数下界做三数排序
  what_it_trains: 训练三角与指数混合比较题里的“双通道”处理：直接不等式判一段，导数或割线判另一段。
  recognition_cues:
    - 出现 $\sin(0.1)$ 这类小角数值。
    - 同时有 $e^{0.1}$ 与简单分数阈值。
    - 题解常给“构造函数/割线”两法。
  normalization_moves:
    - 先把 $b$ 与 $a$ 快速分开。
    - 给 $\sin0.1$ 找线性下界。
    - 把下界转成与 $\frac{17}{16}$ 可比的分数。
  common_failures:
    - 只用 $\sin x< x$，却没有给出 $\sin x$ 的有效下界。
    - 在 $h^{\prime}(x)$ 符号判断里忽略区间 $\left(0,\frac\pi6\right)$。
    - 算 $\frac58\cdot0.1$ 时把 $\frac1{16}$ 算错。
  similar_practice_query: 1+sin0.1 e^0.1 17/16 比大小 割线放缩
