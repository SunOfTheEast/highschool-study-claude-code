solution:
  source_solution_summary: A 可用反例否定：取 $m=2,n=1$，$f(x)=x^2+\frac1x$， $f'(x)=2x-\frac1{x^2}=0$ 只给出 $x=\sqrt[3]{\frac12}$ 一个极小值点， 所以“对任意都有两个极值点”错误。B 同样取 $m=2,n=1$，设切点 $x_0>0$，切线过原点可列 $-\left(x_0^2+\frac1{x_0}\right)= \left(2x_0-\frac1{x_0^2}\right)(-x_0)$，解得 $x_0=\sqrt[3]{2}$，故存在经过原点的切线。C 中当 $x>0$ 时 $f^{\prime\prime}(x)=m(m-1)x^{m-2}+\frac{n(n+1)}{x^{n+2}}>0$， 因而 $f$ 在 $(0,+\infty)$ 上严格凸，满足题中中点不等式。 D 中 $f(-x)=(-1)^m x^m+(-1)^n x^{-n}$，只是把两个正项分别加上 正负号，所以 $|f(-x)|\le x^m+x^{-n}=f(x)$；源页也按 $m,n$ 奇偶四类逐一说明。故选 BCD。
  key_steps:
    - step_id: step_1
      statement: 判断 A：用一个具体 $m,n$ 反例否定“任意”。
      formula_trace:
        from: |
          $m=2,\ n=1,\qquad f(x)=x^2+\frac1x$
        to: |
          $f'(x)=2x-\frac1{x^2}=0\Rightarrow x=\sqrt[3]{\frac12}$
        operation: 代入一组正整数参数并求导数零点。
        why: 只要找到一个例子不是两个极值点，就能否定 A 的“对任意”。
      source_ref: page_0087
    - step_id: step_2
      statement: 说明反例中确实只有一个极值点。
      formula_trace:
        from: |
          $f'(x)=\frac{2x^3-1}{x^2}$
        to: |
          $x<0$ 时 $f'(x)<0$；$x>0$ 时只在 $x=\sqrt[3]{\frac12}$ 变号
        operation: 结合定义域 $x\ne0$ 和导数符号判断极值点个数。
        why: 该函数只有一个极小值点，所以 A 错误。
      source_ref: page_0087
    - step_id: step_3
      statement: 判断 B：继续用 $m=2,n=1$ 构造过原点切线。
      formula_trace:
        from: |
          $y-\left(x_0^2+\frac1{x_0}\right)=\left(2x_0-\frac1{x_0^2}\right)(x-x_0)$
        to: |
          $-\left(x_0^2+\frac1{x_0}\right)=\left(2x_0-\frac1{x_0^2}\right)(-x_0)$
        operation: 设切点为 $(x_0,f(x_0))$，把原点 $(0,0)$ 代入切线方程。
        why: B 只要求“存在”一组 $m,n$，因此构造出一条过原点切线即可。
      source_ref: page_0087
    - step_id: step_4
      statement: 解出 B 的切点。
      formula_trace:
        from: |
          $-\left(x_0^2+\frac1{x_0}\right)=-2x_0^2+\frac1{x_0}$
        to: |
          $x_0^3=2,\qquad x_0=\sqrt[3]{2}$
        operation: 移项并乘以 $x_0$ 化简。
        why: $x_0>0$ 有实数解，说明曲线 $y=x^2+\frac1x$ 确有经过原点的切线。
      source_ref: page_0087
    - step_id: step_5
      statement: 判断 C：用二阶导数证明正半轴上严格凸。
      formula_trace:
        from: |
          $f'(x)=mx^{m-1}-\frac{n}{x^{n+1}}$
        to: |
          $f^{\prime\prime}(x)=m(m-1)x^{m-2}+\frac{n(n+1)}{x^{n+2}}>0\quad (x>0)$
        operation: 连续求导，并利用 $m,n\in\mathbf N^*$、$x>0$ 判断符号。
        why: 二阶导数恒正，图像严格凸，中点函数值严格小于两端函数值平均数。
      source_ref: page_0087
    - step_id: step_6
      statement: 把严格凸性转成 C 的中点不等式。
      formula_trace:
        from: |
          $f^{\prime\prime}(x)>0\quad (x>0)$
        to: |
          $f\left(\frac{x_1+x_2}{2}\right)<\frac{f(x_1)+f(x_2)}2\quad (x_1,x_2>0,\ x_1\ne x_2)$
        operation: 应用严格凸函数的中点不等式。
        why: 两个不同正点的中点位于弦下方，故 C 正确。
      source_ref: page_0087
    - step_id: step_7
      statement: 判断 D：把 $f(-x)$ 写成两个带符号的正项。
      formula_trace:
        from: |
          $f(x)=x^m+\frac1{x^n}\quad (x>0)$
        to: |
          $f(-x)=(-1)^m x^m+(-1)^n\frac1{x^n}$
        operation: 按 $m,n$ 的奇偶性给两个正项分别加上正负号。
        why: 无论奇偶如何，$f(-x)$ 的绝对值都不会超过两个正项的和。
      source_ref: page_0088
    - step_id: step_8
      statement: 完成 D 的不等式。
      formula_trace:
        from: |
          $f(-x)=\pm x^m\pm\frac1{x^n}$
        to: |
          $|f(-x)|\le x^m+\frac1{x^n}=f(x)$
        operation: 用三角不等式汇总源页的四种奇偶分类。
        why: 同奇或同偶时取等号；一奇一偶时两个正项相减，绝对值小于正项和。
      source_ref: page_0088
teaching_card:
  student_title: 多选题先分清任意、存在和恒成立
  what_it_trains: 训练学生在含参数函数多选题里，按量词选择路线：任意命题找反例， 存在命题做构造，恒成立不等式再用凸性或奇偶分类证明。
  recognition_cues:
    - 选项 A、C、D 是“对任意/恒成立”，选项 B 是“存在”。
    - $x^m+\frac1{x^n}$ 在正半轴上二阶导数容易判正。
    - 选项 D 出现 $f(-x)$，提示必须看 $m,n$ 的奇偶。
    - 选项 B 问“经过原点的切线”，适合设切点并代入 $(0,0)$。
  normalization_moves:
    - 先用 $m=2,n=1$ 检查 A 和 B。
    - 对 B 写切点方程，让原点满足切线。
    - 对 C 直接求 $f^{\prime\prime}(x)$ 并调用严格凸函数中点不等式。
    - 对 D 把 $f(-x)$ 写成 $\pm x^m\pm x^{-n}$。
  common_failures:
    - 看到 A 的“两个极值点”就凭对勾函数印象判断，没验证负半轴和具体参数。
    - B 只画图说“原点在外弧”，没有给出一组可行的 $m,n$ 和切点。
    - C 中把 $f^{\prime\prime}>0$ 的凹凸名称记混，但不等式方向也跟着写反。
    - D 中只讨论同奇同偶，漏掉一奇一偶时的差值情形。
  similar_practice_query: x^m+1/x^n 多选 反例 存在过原点切线 凸性 奇偶分类
quality:
  confidence: high
  needs_review: false
  review_notes:
    - page_0087/page_0088 页图与 markdown 对例 5 的题干、选项、解析和答案 BCD 一致；page_0088 后续例 6 已按所有权规则跳过。
    - B 选项源解用 $m=2,n=1$ 构造，本卡只补全切点方程化简；D 选项用三角不等式汇总源页四类奇偶讨论，不改变源结论。
