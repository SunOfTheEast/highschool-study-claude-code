stem: |-
  （2023 东北三省三校二模 T12）已知函数 $f(x)=x^m+\frac1{x^n}\ (m,n\in\mathbf N^*)$，下列结论正确的是（  ）
  A. 对任意 $m,n\in\mathbf N^*$，函数 $f(x)$ 有且只有两个极值点
  B. 存在 $m,n\in\mathbf N^*$，曲线 $y=f(x)$ 有经过原点的切线
  C. 对于任意 $x_1>0,x_2>0$ 且 $x_1\ne x_2$，均满足 $f\left(\frac{x_1+x_2}{2}\right)<\frac{f(x_1)+f(x_2)}2$
  D. 当 $x>0$ 时，$|f(-x)|\leqslant f(x)$ 恒成立
answer: |-
  BCD

  A 可用反例否定：取 $m=2,n=1$，$f(x)=x^2+\frac1x$， $f'(x)=2x-\frac1{x^2}=0$ 只给出 $x=\sqrt[3]{\frac12}$ 一个极小值点， 所以“对任意都有两个极值点”错误。B 同样取 $m=2,n=1$，设切点 $x_0>0$，切线过原点可列 $-\left(x_0^2+\frac1{x_0}\right)= \left(2x_0-\frac1{x_0^2}\right)(-x_0)$，解得 $x_0=\sqrt[3]{2}$，故存在经过原点的切线。C 中当 $x>0$ 时 $f^{\prime\prime}(x)=m(m-1)x^{m-2}+\frac{n(n+1)}{x^{n+2}}>0$， 因而 $f$ 在 $(0,+\infty)$ 上严格凸，满足题中中点不等式。 D 中 $f(-x)=(-1)^m x^m+(-1)^n x^{-n}$，只是把两个正项分别加上 正负号，所以 $|f(-x)|\le x^m+x^{-n}=f(x)$；源页也按 $m,n$ 奇偶四类逐一说明。故选 BCD。
