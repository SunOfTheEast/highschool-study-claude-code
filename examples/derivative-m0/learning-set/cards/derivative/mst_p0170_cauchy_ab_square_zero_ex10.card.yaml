solution:
  source_solution_summary: |
    由题意存在 x_0∈[1,2] 使 f(x_0)=0，即 (x_0^2-1)a+x_0b+1-2x_0^2=0， 从而 (2x_0^2-1)^2=[(x_0^2-1)a+x_0b]^2。对右侧用柯西不等式： [(x_0^2-1)a+x_0b]^2<= (a^2+b^2)[(x_0^2-1)^2+x_0^2]， 得 a^2+b^2>=(4x_0^4-4x_0^2+1)/(x_0^4-x_0^2+1) =4-3/((x_0^2-1/2)^2+3/4)。当 x_0∈[1,2] 时， ((x_0^2-1/2)^2+3/4)>=1，故上式最小值为 1（x_0=1 取到）， 所以 a^2+b^2 的最小值是 1，选 D。
  key_steps:
    - step_id: step_1
      statement: 把“有零点”翻译为关于 (a,b) 的线性约束。
      formula_trace:
        from: f(x)=(a-2)x^2+bx-a+1 在 [1,2] 有零点
        to: 存在 x_0∈[1,2]，使 (x_0^2-1)a+x_0b=2x_0^2-1
        operation: 设 f(x_0)=0 后移项整理。
        why: 把参数问题绑定到一个可控的中间变量 x_0。
      source_ref: page_0170_ex10_solution
    - step_id: step_2
      statement: 对线性组合套柯西不等式。
      formula_trace:
        from: (2x_0^2-1)^2=[(x_0^2-1)a+x_0b]^2
        to: (2x_0^2-1)^2<=(a^2+b^2)[(x_0^2-1)^2+x_0^2]
        operation: 把 (a,b) 与 (x_0^2-1,x_0) 视作两向量做柯西估计。
        why: 直接产出 a^2+b^2 的下界。
      source_ref: page_0170_ex10_solution
    - step_id: step_3
      statement: 化成单变量函数并取区间最小值。
      formula_trace:
        from: a^2+b^2>=(4x_0^4-4x_0^2+1)/(x_0^4-x_0^2+1)
        to: a^2+b^2>=4-3/((x_0^2-1/2)^2+3/4)>=1
        operation: 按源解代数化简并用 x_0∈[1,2] 判断分母下界。
        why: 完成参数下界的数值化。
      source_ref: page_0170_ex10_solution
    - step_id: step_4
      statement: 回到选项。
      formula_trace:
        from: a^2+b^2 的最小值是 1
        to: 选 D
        operation: 与选项比对。
        why: 题目是单选。
      source_ref: page_0170_ex10_solution
teaching_card:
  student_title: 先落零点，再用柯西卡住 a^2+b^2
  what_it_trains: 训练把“参数二元 + 区间零点”降成“中间变量 + 柯西下界 + 单变量最值”的三段式。
  recognition_cues:
    - 题目给出“在区间上有零点”且目标是 a^2+b^2 最小值。
    - 方程可整理成 A(x)a+B(x)b=C(x) 的线性组合形式。
    - 出现 a^2+b^2 时优先联想到柯西。
  normalization_moves:
    - 设零点 x_0，把参数与 x_0 绑定。
    - 对 A a + B b 先平方再套柯西。
    - 把下界函数改写成便于读最小值的结构。
  common_failures:
    - 漏掉“x_0∈[1,2]”导致最小值区间判错。
    - 只写出柯西不等式，不继续化简到可比较的常数。
    - 把 (2x_0^2-1)^2 与 (1-2x_0^2)^2 误当不同表达。
  similar_practice_query: 区间有零点 a^2+b^2 最小值 柯西不等式 参数分离
