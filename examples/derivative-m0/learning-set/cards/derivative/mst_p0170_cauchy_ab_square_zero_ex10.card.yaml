stem: |-
  （2025 · 山东师大附中一模 T8）已知函数 f(x)=(a-2)x^2+bx-a+1（a,b∈R 且 a≠2）在区间 [1,2] 上有零点，则 a^2+b^2 的最小值为（  ）
  A. 3/2
  B. 1/2
  C. 2
  D. 1
answer: |
  D（最小值为 1）

  由题意存在 x_0∈[1,2] 使 f(x_0)=0，即 (x_0^2-1)a+x_0b+1-2x_0^2=0， 从而 (2x_0^2-1)^2=[(x_0^2-1)a+x_0b]^2。对右侧用柯西不等式： [(x_0^2-1)a+x_0b]^2<= (a^2+b^2)[(x_0^2-1)^2+x_0^2]， 得 a^2+b^2>=(4x_0^4-4x_0^2+1)/(x_0^4-x_0^2+1) =4-3/((x_0^2-1/2)^2+3/4)。当 x_0∈[1,2] 时， ((x_0^2-1/2)^2+3/4)>=1，故上式最小值为 1（x_0=1 取到）， 所以 a^2+b^2 的最小值是 1，选 D。
