original_problem:
  stem: （2024 春 · 浦东新区校级月考 T1）已知 $f(x)=\log_a x$，$g(x)=a^x$，其中 $a>1$。
  parts: *a1
  choices: []
  answer: (1) $f'(x)=\frac{1}{x\ln a}$，$h(x)$ 的递增区间为 $(0,1)$；(2) $f(x_1)+x_2=-\frac{2\ln\ln a}{\ln a}$；(3) 当 $a\ge e^{1/e}$ 时公切线存在。
  fidelity_notes:
    - 第 (2) 问按 page_0115 解析与函数定义修正为 $(x_2,g(x_2))$，见 source_discrepancies。
    - 第 (3) 问的证明文字按切线方程修正曲线归属，见 source_discrepancies。
solution:
  source_solution_summary: |
    第 (1) 问由换底公式 $f(x)=\frac{\ln x}{\ln a}$ 得
    $f'(x)=\frac{1}{x\ln a}$，于是
    $h'(x)=\frac{1}{\ln a}\left(\frac1x-1\right)$，因 $a>1$，
    递增区间为 $(0,1)$。
    第 (2) 问令两条切线斜率相等：
    $a^{x_2}\ln a=\frac{1}{x_1\ln a}$，取以 $a$ 为底的对数得
    $\log_a x_1+x_2+2\log_a(\ln a)=0$，所以
    $f(x_1)+x_2=-\frac{2\ln\ln a}{\ln a}$。
    第 (3) 问把公切线分别写成 $y=a^x$ 在 $x_1$ 处的切线和
    $y=\log_a x$ 在 $x_2$ 处的切线。两条线重合给出斜率、截距方程，
    消去 $x_2$ 后得到
    $u(x)=a^x-xa^x\ln a+x+\frac1{\ln a}+\frac{2\ln\ln a}{\ln a}$。
    通过 $u'(x)=1-(\ln a)^2xa^x$ 找到唯一极大点 $x_0>0$，
    用 $a\ge e^{1/e}$ 和均值不等式得 $u(x_0)\ge0$；再用
    $a^x\ge1+x\ln a$ 在足够大的 $x$ 处推出 $u(x)<0$，由连续性得到零点，
    从而公切线存在。
  key_steps:
    - step_id: step_1
      statement: 用换底公式求 $f'(x)$，并判定 $h(x)$ 的递增区间。
      formula_trace:
        from: $f(x)=\log_a x=\frac{\ln x}{\ln a},\quad h(x)=f(x)-\frac{x}{\ln a}$
        to: $f'(x)=\frac{1}{x\ln a},\quad h'(x)=\frac{1}{\ln a}\left(\frac1x-1\right)$
        operation: 把 $\log_a x$ 换成 $\ln x/\ln a$ 后求导，并对 $h$ 求导。
        why: $a>1$ 保证 $\ln a>0$，所以 $h'(x)>0$ 等价于 $0<x<1$。
      source_ref: page_0114
    - step_id: step_2
      statement: 由第 (2) 问的平行切线斜率关系求 $f(x_1)+x_2$。
      formula_trace:
        from: $f'(x_1)=\frac{1}{x_1\ln a},\quad g'(x_2)=a^{x_2}\ln a,\quad f'(x_1)=g'(x_2)$
        to: $\log_a x_1+x_2+2\log_a(\ln a)=0,\quad f(x_1)+x_2=-\frac{2\ln\ln a}{\ln a}$
        operation: 令两斜率相等，再对 $x_1(\ln a)^2a^{x_2}=1$ 取以 $a$ 为底的对数。
        why: $f(x_1)=\log_a x_1$，所以目标式正好是对数方程左侧的前两项。
      source_ref: page_0114-page_0115
    - step_id: step_3
      statement: 为第 (3) 问分别写出指数曲线和对数曲线的切线。
      formula_trace:
        from: $g(x)=a^x,\quad f(x)=\log_a x$
        to: $l_1:\ y-a^{x_1}=a^{x_1}\ln a(x-x_1),\quad l_2:\ y-\log_a x_2=\frac{1}{x_2\ln a}(x-x_2)$
        operation: 按 page_0115 后续公式修正曲线归属：$l_1$ 切于 $y=g(x)$，$l_2$ 切于 $y=f(x)$。
        why: 公切线可以切在两条曲线的不同横坐标处，需设 $x_1\in\mathbb R$、$x_2>0$。
      source_ref: page_0115
    - step_id: step_4
      statement: 把两条切线重合转成斜率相等和截距相等。
      formula_trace:
        from: $l_1=l_2$
        to: $a^{x_1}\ln a=\frac{1}{x_2\ln a},\quad a^{x_1}-x_1a^{x_1}\ln a=\log_a x_2-\frac1{\ln a}$
        operation: 比较 $x$ 的系数和常数项。
        why: 两条一次函数完全相同，当且仅当斜率和截距分别相等。
      source_ref: page_0115
    - step_id: step_5
      statement: 消去 $x_2$，把公切线存在性化成 $u(x_1)=0$ 有解。
      formula_trace:
        from: $a^{x_1}\ln a=\frac{1}{x_2\ln a},\quad a^{x_1}-x_1a^{x_1}\ln a=\log_a x_2-\frac1{\ln a}$
        to: $x_2=\frac{1}{a^{x_1}(\ln a)^2},\quad u(x_1)=a^{x_1}-x_1a^{x_1}\ln a+x_1+\frac1{\ln a}+\frac{2\ln\ln a}{\ln a}=0$
        operation: 由斜率方程解出 $x_2$，代入截距方程并用 $\log_a x_2=-x_1-\frac{2\ln\ln a}{\ln a}$。
        why: 只要这个单变量方程有实根，就能反推出对应 $x_2>0$，两切线重合。
      source_ref: page_0115
    - step_id: step_6
      statement: 分析 $u'(x)$，找到 $u$ 的唯一极大点。
      formula_trace:
        from: $u(x)=a^x-xa^x\ln a+x+\frac1{\ln a}+\frac{2\ln\ln a}{\ln a}$
        to: $u'(x)=1-(\ln a)^2xa^x$，且存在唯一 $x_0>0$ 使 $u'(x_0)=0$
        operation: 求导；在 $x<0$ 时 $u'(x)>0$，在 $x>0$ 时 $u'(x)$ 严格递减，并用 $u'(0)=1$、$u'\!\left(\frac1{(\ln a)^2}\right)<0$ 夹出唯一零点。
        why: 这个极大点给出零点存在性的上端参照。
      source_ref: page_0115
    - step_id: step_7
      statement: 证明极大值处 $u(x_0)\ge0$。
      formula_trace:
        from: $(\ln a)^2x_0a^{x_0}=1,\quad a\ge e^{1/e}$
        to: $u(x_0)=\frac{1}{x_0(\ln a)^2}+x_0+\frac{2\ln\ln a}{\ln a}\ge\frac{2+2\ln\ln a}{\ln a}\ge0$
        operation: 把临界方程代入 $u(x_0)$，再用 $\frac{1}{x_0(\ln a)^2}+x_0\ge\frac2{\ln a}$ 和 $\ln\ln a\ge-1$。
        why: 当 $a\ge e^{1/e}$ 时，极大值不低于 $x$ 轴。
      source_ref: page_0115
    - step_id: step_8
      statement: 找一个足够大的点使 $u(x)<0$，由连续性推出零点。
      formula_trace:
        from: $x>\frac1{\ln a},\quad a^x\ge1+x\ln a$
        to: $u(x)\le-(\ln a)^2x^2+x+1+\frac1{\ln a}+\frac{2\ln\ln a}{\ln a}\to-\infty$
        operation: 把 $u(x)$ 写为 $a^x(1-x\ln a)+x+\frac1{\ln a}+\frac{2\ln\ln a}{\ln a}$；因 $1-x\ln a<0$，用 $a^x\ge1+x\ln a$ 作上界。
        why: 存在 $t$ 使 $u(t)<0$，再结合 $u(x_0)\ge0$ 可由介值定理得到 $u(x_1)=0$。
      source_ref: page_0115
teaching_card:
  student_title: 把指数和对数的公切线化成一个零点
  what_it_trains: 训练先用导数写出两条曲线的切线条件，再把双切点公切线存在性压缩成单变量零点问题。
  recognition_cues:
    - 题目同时出现 $y=\log_a x$ 与 $y=a^x$，且问平行切线或同一条切线。
    - 平行切线只需要斜率相等；公切线还要斜率和截距都相等。
    - 条件 $a\ge e^{1/e}$ 等价于 $\ln a\ge1/e$，后面常配合 $\ln\ln a\ge-1$。
    - 出现 $a^x-xa^x\ln a$ 时，要想到把它写成 $a^x(1-x\ln a)$。
  normalization_moves:
    - 用换底公式先把 $\log_a x$ 的导数写清楚。
    - 第 (2) 问对 $x_1(\ln a)^2a^{x_2}=1$ 取以 $a$ 为底的对数。
    - 第 (3) 问分别设指数曲线切点 $x_1$、对数曲线切点 $x_2$。
    - 用斜率方程消去 $x_2$，得到 $u(x_1)=0$。
    - 用 $u$ 的极大值和远处负值夹出零点。
  common_failures:
    - 把 page_0115 的印刷错位照抄，导致把 $a^{x_1}$ 当成 $f(x_1)$。
    - 只令两条切线斜率相等，忘记公切线还需要截距相等。
    - 由 $x_2=\frac{1}{a^{x_1}(\ln a)^2}$ 求 $\log_a x_2$ 时漏掉 $-2\ln\ln a/\ln a$。
    - 在 $1-x\ln a<0$ 时使用 $a^x\ge1+x\ln a$ 不变号，导致放缩方向反了。
    - 把 $u(x_0)\ge0$ 当成已有零点，漏掉还要找 $u(t)<0$。
  similar_practice_query: log_a x a^x 公切线 平行切线 消元 零点存在 e^{1/e}
