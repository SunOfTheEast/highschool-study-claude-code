solution:
  source_solution_summary: |
    在 $x>1$ 上有
    \[
    (x^3-x)f^{\prime}(x)>f(x)(5x^2-3).
    \]
    乘以 $x^2(>0)$ 得
    \[
    (x^5-x^3)f^{\prime}(x)>f(x)(5x^4-3x^2).
    \]
    设
    \[
    g(x)=\frac{f(x)}{x^5-x^3},\quad x>1,
    \]
    则
    \[
    g^{\prime}(x)=
    \frac{f^{\prime}(x)(x^5-x^3)-f(x)(5x^4-3x^2)}{(x^5-x^3)^2}>0.
    \]
    故 $g$ 在 $(1,+\infty)$ 递增，进而
    \[
    g(\sqrt2)<g(2)<g(3),
    \]
    即
    \[
    \frac{f(\sqrt2)}{2\sqrt2}<\frac{f(2)}{24}=\frac{f(-2)}{-24}<\frac{f(3)}{216}.
    \]
    由左段不等式得 $6\sqrt2f(\sqrt2)<f(2)$，B 对；
    由右段不等式得 $f(3)+9f(-2)>0$，D 对。
    同时 $f(3)>9f(2)$ 不能推出 $f(3)>12f(2)$，C 错；
    由奇函数 $f(-\sqrt2)=-f(\sqrt2)$ 可知 A 与 B 方向相反，A 错。
    故选 BD。
  key_steps:
    - step_id: step_1
      statement: 用“系数5”锁定分母模板。
      formula_trace:
        from: $(x^3-x)f^{\prime}(x)>f(x)(5x^2-3)$
        to: $(x^5-x^3)f^{\prime}(x)>f(x)(5x^4-3x^2)$
        operation: 两边乘以 $x^2$（$x>1$）。
        why: 把 $5x^4-3x^2$ 对齐为 $(x^5-x^3)^{\prime}$。
      source_ref: page_0137_cont
    - step_id: step_2
      statement: 作商并判单调。
      formula_trace:
        from: $g(x)=\frac{f(x)}{x^5-x^3}$
        to: $g^{\prime}(x)>0$（$x>1$）
        operation: 商求导后用题设不等式判分子符号。
        why: 把原不等式转为三点函数值可比。
      source_ref: page_0137_cont
    - step_id: step_3
      statement: 在 $(1,+\infty)$ 上建立三点链。
      formula_trace:
        from: $g(\sqrt2)<g(2)<g(3)$
        to: $\frac{f(\sqrt2)}{2\sqrt2}<\frac{f(2)}{24}<\frac{f(3)}{216}$
        operation: 代入 $\sqrt2,2,3$ 计算分母。
        why: 这是所有选项判定的统一母链。
      source_ref: page_0137_cont
    - step_id: step_4
      statement: 结合奇函数信息改写中间项。
      formula_trace:
        from: $f(-2)=-f(2)$
        to: $\frac{f(2)}{24}=\frac{f(-2)}{-24}$
        operation: 利用奇函数在 $x=2$ 的对应值。
        why: 把 D 项中的 $f(-2)$ 接入同一比较链。
      source_ref: page_0137_cont
    - step_id: step_5
      statement: 判定 B 与 D。
      formula_trace:
        from: $\frac{f(\sqrt2)}{2\sqrt2}<\frac{f(2)}{24}<\frac{f(3)}{216}$
        to: $6\sqrt2f(\sqrt2)<f(2)$ 且 $f(3)+9f(-2)>0$
        operation: 同乘正数并用 $f(-2)=-f(2)$。
        why: 直接对应 B、D 两项。
      source_ref: page_0137_cont
    - step_id: step_6
      statement: 排除 A、C。
      formula_trace:
        from: $f(-\sqrt2)=-f(\sqrt2)$ 与 $f(3)>9f(2)$
        to: A 错、C 错
        operation: A 与 B 方向互反；C 的“12倍”强于链上“9倍”。
        why: 完成多选闭环判定。
      source_ref: page_0137_cont
