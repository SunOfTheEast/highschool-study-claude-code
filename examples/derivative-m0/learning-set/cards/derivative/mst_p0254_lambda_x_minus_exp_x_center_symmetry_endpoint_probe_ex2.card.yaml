original_problem:
  stem: （2025 · 辽宁沈阳 · 模拟预测）已知函数 $f(x)=\lambda x-e^x$。
  parts: *a1
  choices: []
  answer: 第(1)问：$g(x)=2x-2+e^{4-x}$。第(2)问：$\lambda\le e^2$ 时递减，$\lambda\ge e^6$ 时递增，$e^2<\lambda<e^6$ 时先增后减。第(3)问：$\lambda\in(-\infty,1]$。
  fidelity_notes:
    - 三问综合题，无选项。
    - 第(3)问的 $e^x$ 在不等式两侧抵消，核心变成端点恒成立。
solution:
  source_solution_summary: 第(1)问，若点 $P(x,y)$ 在 $g$ 上，则其关于 $(2,3)$ 的对称点 $Q(4-x,6-y)$ 在 $f$ 上，于是 $6-y=2(4-x)-e^{4-x}$，得到 $g(x)=2x-2+e^{4-x}$。第(2)问由 $f^\prime(x)=\lambda-e^x$，在 $[2,6]$ 上按 $\lambda\le e^2$、$\lambda\ge e^6$、$e^2<\lambda<e^6$ 分类。第(3)问 化为 $h(x)=\frac16x^3+\sin x-\lambda x\ge0$，$x\ge0$。因为 $h(0)=0$，必要条件是右导数 $h^\prime(0)=1-\lambda\ge0$，所以 $\lambda\le1$。当 $\lambda\le1$ 时， $h''(x)=x-\sin x\ge0$，故 $h'$ 单调递增，$h'(x)\ge h'(0)\ge0$， 进而 $h(x)\ge h(0)=0$，充分成立。
  key_steps:
    - step_id: step_1
      statement: 用中心对称点写出 $g$。
      formula_trace:
        from: $P(x,y)$ 关于 $(2,3)$ 的对称点
        to: $Q(4-x,6-y)$
        operation: 用中点坐标公式。
        why: $Q$ 在 $f$ 上，代入即可解出 $y$。
      source_ref: page_0254_ex2_part1_solution
    - step_id: step_2
      statement: 代入 $\lambda=2$ 得 $g$ 的解析式。
      formula_trace:
        from: $6-y=2(4-x)-e^{4-x}$
        to: $g(x)=2x-2+e^{4-x}$
        operation: 整理 $y$。
        why: 这是第(1)问答案。
      source_ref: page_0254_ex2_part1_solution
    - step_id: step_3
      statement: 第(2)问按导数零点是否落在区间内分类。
      formula_trace:
        from: $f^\prime(x)=\lambda-e^x$
        to: $x=\ln\lambda$
        operation: 解导数零点。
        why: 区间端点 $2,6$ 对应阈值 $e^2,e^6$。
      source_ref: page_0254_ex2_part2_solution
    - step_id: step_4
      statement: 第(3)问先抵消 $e^x$。
      formula_trace:
        from: $f(x)+e^x\le\frac16x^3+\sin x$
        to: $\lambda x\le\frac16x^3+\sin x$
        operation: 代入 $f(x)=\lambda x-e^x$ 并抵消。
        why: 问题变成一元端点恒成立。
      source_ref: page_0254_ex2_part3_solution
    - step_id: step_5
      statement: 构造端点函数。
      formula_trace:
        from: $\frac16x^3+\sin x-\lambda x$
        to: $h(0)=0,\quad h^\prime(0)=1-\lambda$
        operation: 设 $h(x)$ 并看端点导数。
        why: 在 $[0,+\infty)$ 上从端点出发保持非负，右导数必须非负。
      source_ref: page_0254_ex2_part3_solution
    - step_id: step_6
      statement: 证明 $\lambda\le1$ 的充分性。
      formula_trace:
        from: $h'(x)=x-\sin x\ge0$
        to: $h^\prime(x)\ge h^\prime(0)\ge0$，$h(x)\ge0$
        operation: 用二阶导非负推出一阶导递增。
        why: 这完成恒成立证明。
      source_ref: page_0254_ex2_part3_solution
teaching_card:
  student_title: 中心对称和端点效应放在同一题里
  what_it_trains: 训练用点对称写函数解析式，并在恒成立问题中用端点导数快速锁定参数。
  recognition_cues:
    - 关于点 $(2,3)$ 中心对称，要先写对称点坐标。
    - $f^\prime(x)=\lambda-e^x$，单调性只看 $\ln\lambda$ 是否落在 $[2,6]$。
    - 第(3)问两边有 $e^x$ 可以抵消。
    - 恒成立区间从 $0$ 开始，且 $h(0)=0$，应优先看 $h^\prime(0)$。
  normalization_moves:
    - 点对称：$(x,y)\mapsto(4-x,6-y)$。
    - 区间单调：用 $e^2,e^6$ 分三类。
    - 恒成立：移项成 $h(x)\ge0$。
    - 端点探路：$h^\prime(0)\ge0$。
    - 充分性：$h'(x)=x-\sin x\ge0$。
  common_failures:
    - 把中心对称误写成轴对称。
    - 漏掉 $\lambda\le e^2$ 或 $\lambda\ge e^6$ 的端点情形。
    - 第(3)问不先抵消 $e^x$，导致表达式复杂化。
    - 只得到 $\lambda\le1$，没有证明充分性。
  similar_practice_query: lambda x - e^x 中心对称 端点效应 h(0)=0 lambda<=1 区间单调
