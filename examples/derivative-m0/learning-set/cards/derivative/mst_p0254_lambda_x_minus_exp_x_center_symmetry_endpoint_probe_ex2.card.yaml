stem: |-
  （2025 · 辽宁沈阳 · 模拟预测）已知函数 $f(x)=\lambda x-e^x$。
  1. 当 $\lambda=2$ 时，曲线 $y=f(x)$ 与 $y=g(x)$ 关于点 $(2,3)$ 中心对称，求函数 $g(x)$ 的解析式。
  2. 讨论 $f(x)$ 在 $[2,6]$ 上的单调性。
  3. 若关于 $x$ 的不等式 $f(x)+e^x\le\frac16x^3+\sin x$ 在 $[0,+\infty)$ 上恒成立，求实数 $\lambda$ 的取值范围。
answer: |-
  第(1)问：$g(x)=2x-2+e^{4-x}$。第(2)问：$\lambda\le e^2$ 时递减，$\lambda\ge e^6$ 时递增，$e^2<\lambda<e^6$ 时先增后减。第(3)问：$\lambda\in(-\infty,1]$。

  第(1)问，若点 $P(x,y)$ 在 $g$ 上，则其关于 $(2,3)$ 的对称点 $Q(4-x,6-y)$ 在 $f$ 上，于是 $6-y=2(4-x)-e^{4-x}$，得到 $g(x)=2x-2+e^{4-x}$。第(2)问由 $f^\prime(x)=\lambda-e^x$，在 $[2,6]$ 上按 $\lambda\le e^2$、$\lambda\ge e^6$、$e^2<\lambda<e^6$ 分类。第(3)问 化为 $h(x)=\frac16x^3+\sin x-\lambda x\ge0$，$x\ge0$。因为 $h(0)=0$，必要条件是右导数 $h^\prime(0)=1-\lambda\ge0$，所以 $\lambda\le1$。当 $\lambda\le1$ 时， $h''(x)=x-\sin x\ge0$，故 $h'$ 单调递增，$h'(x)\ge h'(0)\ge0$， 进而 $h(x)\ge h(0)=0$，充分成立。
