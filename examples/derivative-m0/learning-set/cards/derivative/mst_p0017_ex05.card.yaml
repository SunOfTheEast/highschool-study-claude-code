original_problem:
  stem: 对 $\forall x>0$，不等式 $2ae^{2x}-\ln x+\ln a\ge 0$ 恒成立，则实数 $a$ 的最小值为（ ）
  parts: *a1
  choices:
    - label: A
      text_raw: $\frac{2}{\sqrt e}$
      text_latex: $\frac{2}{\sqrt e}$
    - label: B
      text_raw: $\frac{1}{2\sqrt e}$
      text_latex: $\frac{1}{2\sqrt e}$
    - label: C
      text_raw: $\frac{2}{e}$
      text_latex: $\frac{2}{e}$
    - label: D
      text_raw: $\frac{1}{2e}$
      text_latex: $\frac{1}{2e}$
  answer: D；$a_{\min}=\frac1{2e}$。
  fidelity_notes:
    - page_0017.png 已核对：原式为 $2ae^{2x}-\ln x+\ln a\ge0$，不是 $2axe^{2x}$。
    - 因题干含 $\ln a$，本卡在解法中显式记录 $a>0$ 的定义域要求。
solution:
  source_solution_summary: 由 $\ln a$ 可知 $a>0$。原式等价于 $2ae^{2x}\ge\ln(x/a)$。同乘正数 $x/a$ 得 $2xe^{2x}\ge (x/a)\ln(x/a)$，即 $F(2x)\ge F(\ln(x/a))$，其中 $F(t)=te^t$。因 $2x>0$，该条件转为 $2x\ge\ln(x/a)$，从而 $a\ge x/e^{2x}$。对 $x>0$ 求 $x/e^{2x}$ 最大值，在 $x=1/2$ 处为 $1/(2e)$，故 $a$ 的最小值为 $1/(2e)$。
  key_steps:
    - step_id: step_1
      statement: 先写出参数定义域并移项。
      formula_trace:
        from: $2ae^{2x}-\ln x+\ln a\ge0$
        to: $2ae^{2x}\ge \ln x-\ln a=\ln\frac{x}{a}$
        operation: 由 $\ln a$ 得 $a>0$，再把对数项移到右侧。
        why: 右侧合并成 $\ln(x/a)$，为同构变形准备。
      source_ref: page_0017
    - step_id: step_2
      statement: 同乘正数 $x/a$，补出 $te^t$。
      formula_trace:
        from: $2ae^{2x}\ge \ln\frac{x}{a}$
        to: $2xe^{2x}\ge \frac{x}{a}\ln\frac{x}{a}=e^{\ln(x/a)}\ln\frac{x}{a}$
        operation: 同乘 $\frac{x}{a}>0$，并用 $x/a=e^{\ln(x/a)}$。
        why: 左边是 $F(2x)$，右边是 $F(\ln(x/a))$。
      source_ref: page_0017
    - step_id: step_3
      statement: 把同构比较转成指数内量的比较。
      formula_trace:
        from: $F(2x)\ge F(\ln(x/a)),\quad F(t)=te^t,\quad 2x>0$
        to: $2x\ge \ln\frac{x}{a}$
        operation: 若 $\ln(x/a)<0$，该不等式自动成立；若 $\ln(x/a)\ge0$，用 $F$ 在非负区间递增。
        why: 恒成立问题由同构函数比较变成可分离参数的一阶不等式。
      source_ref: page_0017
    - step_id: step_4
      statement: 分离参数并取最大值。
      formula_trace:
        from: $2x\ge \ln\frac{x}{a}$
        to: $a\ge \frac{x}{e^{2x}}\quad\Rightarrow\quad a\ge\left(\frac{x}{e^{2x}}\right)_{\max}=\frac1{2e}$
        operation: 指数化得到 $x/a\le e^{2x}$，再整理为 $a\ge x/e^{2x}$；用导数或源页模型求最大值。
        why: 要求对所有 $x>0$ 成立，参数下界必须不小于右侧函数最大值。
      source_ref: page_0017
teaching_card:
  student_title: 乘上 $x/a$，把参数恒成立变成 $x/e^{2x}$ 最大值
  what_it_trains: 训练在含 $\ln a$ 的恒成立题中，先合并对数，再乘正量补出 $te^t$，最后分离参数取最大值。
  recognition_cues:
    - 题干含 $2ae^{2x}$ 与 $\ln x-\ln a$。
    - 出现 $\ln(x/a)$ 后，旁边有 $e^{2x}$，适合凑 $te^t$。
    - 问 $a$ 的最小值，通常落到某个 $x$ 函数的最大值。
  normalization_moves:
    - 先确认 $a>0$，再把 $\ln x-\ln a$ 合成 $\ln(x/a)$。
    - 同乘 $x/a$，让右边变成 $(x/a)\ln(x/a)$。
    - 把 $(x/a)\ln(x/a)$ 写成 $e^{\ln(x/a)}\ln(x/a)$。
    - 由 $2x\ge\ln(x/a)$ 推到 $a\ge x/e^{2x}$。
  common_failures:
    - 忘记 $a>0$，导致 $\ln a$ 的定义域没交代。
    - 直接对 $2ae^{2x}\ge\ln(x/a)$ 指数化，破坏不等式结构。
    - 求 $x/e^{2x}$ 最大值时把点误算成 $x=1$。
    - 把答案选成 $1/e$，漏掉指数中的 $2x$ 带来的因子 $1/2$。
  similar_practice_query: $2ae^{2x}-\ln x+\ln a$ 恒成立 参数最小值 $xe^x$ 同构 $x/e^{2x}$ 最大值
quality:
  confidence: high
  needs_review: false
  review_notes:
    - 已核对 page_0017 markdown 与页图；源解中 $F(2x)\ge F(\ln(x/a))\Rightarrow2x\ge\ln(x/a)$ 写得很压缩。reviewer 判定：$\ln(x/a)<0$ 时自动成立，$\ln(x/a)\ge0$ 时由 $F(t)=te^t$ 在非负区间递增推出。
