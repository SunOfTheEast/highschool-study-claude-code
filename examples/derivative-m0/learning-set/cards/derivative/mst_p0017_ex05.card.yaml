stem: |-
  对 $\forall x>0$，不等式 $2ae^{2x}-\ln x+\ln a\ge 0$ 恒成立，则实数 $a$ 的最小值为（ ）
  A. $\frac{2}{\sqrt e}$
  B. $\frac{1}{2\sqrt e}$
  C. $\frac{2}{e}$
  D. $\frac{1}{2e}$
answer: |-
  D；$a_{\min}=\frac1{2e}$。

  由 $\ln a$ 可知 $a>0$。原式等价于 $2ae^{2x}\ge\ln(x/a)$。同乘正数 $x/a$ 得 $2xe^{2x}\ge (x/a)\ln(x/a)$，即 $F(2x)\ge F(\ln(x/a))$，其中 $F(t)=te^t$。因 $2x>0$，该条件转为 $2x\ge\ln(x/a)$，从而 $a\ge x/e^{2x}$。对 $x>0$ 求 $x/e^{2x}$ 最大值，在 $x=1/2$ 处为 $1/(2e)$，故 $a$ 的最小值为 $1/(2e)$。
