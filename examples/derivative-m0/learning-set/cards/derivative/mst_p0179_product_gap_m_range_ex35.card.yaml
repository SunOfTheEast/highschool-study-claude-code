stem: |-
  （2024 · 陕西同仁一模 · 多选 T12）已知函数 $f(x)=(ax-me^x)(ax-\ln x)$（其中 $e$ 为自然对数的底数），若存在实数 $a$ 使得 $f(x)<0$ 恒成立，则实数 $m$ 的取值范围是（  ）
  A. $\left(-\infty,\frac{1}{e^2}\right)$
  B. $(e^2,+\infty)$
  C. $\left(\frac{1}{e},+\infty\right)$
  D. $\left(\frac{1}{e^2},+\infty\right)$
answer: |-
  D

  定义域为 $x>0$。由 $f(x)<0$ 得 $(ax-me^x)(ax-\ln x)<0$，即 $\left(a-\frac{me^x}{x}\right)\left(a-\frac{\ln x}{x}\right)<0$。 令 $g(x)=\frac{\ln x}{x}$，$h(x)=\frac{me^x}{x}$，题意等价于存在常数 $a$，使两函数图象分居直线 $y=a$ 两侧，故需要一个函数最小值大于另一函数最大值。 源解取 $h_{\min}>g_{\max}$：$g_{\max}=g(e)=\frac{1}{e}$， $h_{\min}=h(1)=me$，于是 $me>\frac{1}{e}$， 得 $m>\frac{1}{e^2}$，对应选项 D。
