solution:
  source_solution_summary: 定义域为 $x>0$。由 $f(x)<0$ 得 $(ax-me^x)(ax-\ln x)<0$，即 $\left(a-\frac{me^x}{x}\right)\left(a-\frac{\ln x}{x}\right)<0$。 令 $g(x)=\frac{\ln x}{x}$，$h(x)=\frac{me^x}{x}$，题意等价于存在常数 $a$，使两函数图象分居直线 $y=a$ 两侧，故需要一个函数最小值大于另一函数最大值。 源解取 $h_{\min}>g_{\max}$：$g_{\max}=g(e)=\frac{1}{e}$， $h_{\min}=h(1)=me$，于是 $me>\frac{1}{e}$， 得 $m>\frac{1}{e^2}$，对应选项 D。
  key_steps:
    - step_id: step_1
      statement: 把乘积恒负改写为同一参数 $a$ 的双函数比较。
      formula_trace:
        from: $(ax-me^x)(ax-\ln x)<0$
        to: $\left(a-\frac{me^x}{x}\right)\left(a-\frac{\ln x}{x}\right)<0$
        operation: 在定义域 $x>0$ 内提取公因子 $x^2$ 并约去。
        why: 把问题转成“同一水平线 $y=a$ 与两条曲线的位置关系”。
      source_ref: page_0179_ex35_solution
    - step_id: step_2
      statement: 构造分离函数并写出分隔判据。
      formula_trace:
        from: $g(x)=\frac{\ln x}{x},\ h(x)=\frac{me^x}{x}$
        to: $h(x)_{\min}>g(x)_{\max}$
        operation: 把“对任意 $x$ 异号”翻译为两函数在整域上可被一条水平线严格隔开。
        why: 存在性参数题可转成“最大值与最小值”比较。
      source_ref: page_0179_ex35_solution
    - step_id: step_3
      statement: 求两个关键极值点。
      formula_trace:
        from: $g(x)=\frac{\ln x}{x},\ h(x)=\frac{me^x}{x}$
        to: $g(e)=\frac{1}{e},\ h(1)=me$
        operation: 按源解直接读取 $g$ 的最大值点 $x=e$ 与 $h$ 的最小值点 $x=1$。
        why: 极值代入后即可直接解出参数下界。
      source_ref: page_0179_ex35_solution
    - step_id: step_4
      statement: 比较极值并回到选项。
      formula_trace:
        from: $me>\frac{1}{e}$
        to: $m>\frac{1}{e^2}$
        operation: 同除正数 $e$。
        why: 得到参数范围并匹配 D。
      source_ref: page_0179_ex35_solution
teaching_card:
  student_title: 存在参数先看“最大值 < 最小值”
  what_it_trains: 训练把“存在一个常数让两个因子恒异号”的题，转换成两条函数曲线被水平线分隔的极值比较问题。
  recognition_cues:
    - 题干出现“存在实数 $a$ 使不等式恒成立”。
    - 两个括号都有同一线性项 $ax$。
    - 可自然改写成 $a-\text{函数}(x)$ 的乘积。
  normalization_moves:
    - 先统一成 $\left(a-u(x)\right)\left(a-v(x)\right)$。
    - 把恒异号翻译为“$a$ 夹在两函数之间且全程不穿越”。
    - 把夹逼条件化为 $u_{\min}>v_{\max}$ 或对称形式。
  common_failures:
    - 只在某个点比较，忽略“对任意 $x>0$ 恒成立”。
    - 误把“多选题”当成“至少两个正确”，忽略单个选项也可能成立。
    - 把 $me>\frac{1}{e}$ 误算成 $m>\frac{1}{e}$。
  similar_practice_query: 存在参数 恒异号 gmax hmin ln x/x me^x/x
