solution:
  source_solution_summary: |
    两条切线分别为
    $y=\frac1{x_1}x-1+\ln x_1$ 与
    $y=e^{x_2}x+e^{x_2}(1-x_2)$。由重合得
    $\frac1{x_1}=e^{x_2}$、$\ln x_1-1=e^{x_2}(1-x_2)$。
    因 $y_2=e^{x_2}$，所以 $x_1y_2=1$，A 正确。又
    $x_2=-\ln x_1$，且 $x_1=1$ 时两切线分别为
    $y=x-1$ 与 $y=x+1$，不合题意，所以 $x_1\ne1$。
    将 $\ln x_1=-x_2$ 代入截距关系，得
    $-x_2-1=\frac1{x_1}(1-x_2)$，整理成
    $x_2+\frac{x_1+1}{x_1-1}=0$，B 正确。
    点积
    $\overrightarrow{OP}\cdot\overrightarrow{OQ}
    =\left(\frac1{x_1}-x_1\right)\ln x_1$，当
    $0<x_1<1$ 或 $x_1>1$ 时都小于 0，因此最大值不是 0，C 错误。
    若 $x_2<0$，设 $f(x)=e^x(1-x)$，则 $f'(x)=-xe^x>0$，
    $0<e^{x_2}(1-x_2)<1$，于是 $1<\ln x_1<2$，即
    $e<x_1<e^2$。令 $g(x)=x-\ln x$，在 $(e,e^2)$ 上递增，
    所以 $x_1+x_2=x_1-\ln x_1<e^2-2$，D 错误。故选 AB。
  key_steps:
    - step_id: step_1
      statement: 用同一条切线建立斜率和截距方程。
      formula_trace:
        from: $y=\ln x$ 在 $P(x_1,\ln x_1)$ 处切线，$y=e^x$ 在 $Q(x_2,e^{x_2})$ 处切线
        to: $\frac1{x_1}=e^{x_2},\quad \ln x_1-1=e^{x_2}(1-x_2)$
        operation: 分别写斜截式后比较斜率和截距。
        why: 四个选项都依赖这组切点数据关系。
      source_ref: page_0110_ex19_solution_start
    - step_id: step_2
      statement: 判断 A。
      formula_trace:
        from: $\frac1{x_1}=e^{x_2},\quad y_2=e^{x_2}$
        to: $x_1y_2=x_1e^{x_2}=1$
        operation: 把指数曲线切点纵坐标代入斜率关系。
        why: A 项正是斜率相等的直接改写。
      source_ref: page_0110_ex19_solution_start
    - step_id: step_3
      statement: 判断 B。
      formula_trace:
        from: $x_2=-\ln x_1,\quad \ln x_1-1=\frac1{x_1}(1-x_2)$
        to: $x_2+\frac{x_1+1}{x_1-1}=0$
        operation: 用 $\ln x_1=-x_2$ 代入截距关系并移项分解。
        why: $x_1=1$ 时两切线不重合，所以可除以 $x_1-1$。
      source_ref: page_0111_ex19_continuation
    - step_id: step_4
      statement: 把点积化成只含 $x_1$ 的表达式。
      formula_trace:
        from: $P=(x_1,\ln x_1),\quad Q=(x_2,e^{x_2}),\quad x_2=-\ln x_1,\quad e^{x_2}=\frac1{x_1}$
        to: $\overrightarrow{OP}\cdot\overrightarrow{OQ}=\left(\frac1{x_1}-x_1\right)\ln x_1$
        operation: 代入坐标后合并 $x_1x_2+y_1y_2$。
        why: C 项需要判断点积的取值符号。
      source_ref: page_0111_ex19_continuation
    - step_id: step_5
      statement: 判断 C。
      formula_trace:
        from: $\left(\frac1{x_1}-x_1\right)\ln x_1,\quad x_1>0,\quad x_1\ne1$
        to: $\overrightarrow{OP}\cdot\overrightarrow{OQ}<0$
        operation: 分 $0<x_1<1$ 与 $x_1>1$ 比较两个因子的符号。
        why: 实际值始终小于 0，0 不会被取到，所以“最大值为 0”错误。
      source_ref: page_0111_ex19_continuation
    - step_id: step_6
      statement: 在 $x_2<0$ 时确定 $x_1$ 的范围。
      formula_trace:
        from: |
          $f(x)=e^x(1-x),\quad x<0,\quad f'(x)=-xe^x>0$
        to: $0<e^{x_2}(1-x_2)<1,\quad 1<\ln x_1<2,\quad e<x_1<e^2$
        operation: 用 $f$ 在 $(-\infty,0)$ 上递增，结合截距关系 $\ln x_1-1=e^{x_2}(1-x_2)$。
        why: D 项要比较 $x_1+x_2=x_1-\ln x_1$ 与 $e^2-2$。
      source_ref: page_0111_ex19_continuation
    - step_id: step_7
      statement: 判断 D 并汇总答案。
      formula_trace:
        from: |
          $g(x)=x-\ln x,\quad g'(x)=1-\frac1x>0\ (e<x<e^2)$
        to: $x_1+x_2=x_1-\ln x_1<g(e^2)=e^2-2$
        operation: 用 $g$ 在 $(e,e^2)$ 上递增，取右端上界。
        why: 选项 D 的不等号方向与实际结论相反。
      source_ref: page_0111_ex19_continuation
teaching_card:
  student_title: 同一条指对切线带出一串定值关系
  what_it_trains: 训练从公切线方程中提取切点数据关系，再用这些关系判断点积、范围和不等式选项。
  recognition_cues:
    - 题干和例 18 一样，都是 $y=\ln x$ 的切线同时切到 $y=e^x$。
    - 选项里出现 $x_1y_2$、$\frac{x_1+1}{x_1-1}+x_2$，提示先统一切点数据。
    - C、D 不是重新求切线，而是把几何量化成 $x_1$ 的单变量表达式。
  normalization_moves:
    - 先写两条切线并得到 $\frac1{x_1}=e^{x_2}$。
    - 用 $x_2=-\ln x_1$ 把 B、C、D 都转成 $x_1$ 语言。
    - 判断点积时只看 $\left(\frac1{x_1}-x_1\right)$ 与 $\ln x_1$ 的符号。
    - 处理 $x_2<0$ 时，用 $e^{x_2}(1-x_2)$ 的单调性夹出 $e<x_1<e^2$。
  common_failures:
    - 忘记 $x_1=1$ 时两条切线不重合，错误地直接代入 B 项分式。
    - 把点积小于 0 误读成最大值等于 0；这里 0 没有取到。
    - D 项中只由 $x_2<0$ 得到 $x_1>1$，没有继续用截距关系缩小范围。
  similar_practice_query: e^x ln x 公切线 切点数据 向量点积 多选
