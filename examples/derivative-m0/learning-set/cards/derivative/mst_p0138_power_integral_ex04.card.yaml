solution:
  source_solution_summary: |
    按源页构造
    \[
    g(x)=x^2f(x)-\frac{x^3}{3},
    \]
    则
    \[
    g^{\prime}(x)=2xf(x)+x^2f^{\prime}(x)-x^2=x\bigl(2f(x)+xf^{\prime}(x)-x\bigr).
    \]
    由题设 $2f(x)+xf^{\prime}(x)-x>0$，可得：
    当 $x>0$ 时，$g^{\prime}(x)>0$；当 $x<0$ 时，$g^{\prime}(x)<0$。
    因而 $g$ 在 $(0,+\infty)$ 递增、在 $(-\infty,0)$ 递减，且 $g(0)=0$。
    所以任意 $x\neq0$ 都有 $g(x)>0$，即
    \[
    x^2\!\left(f(x)-\frac{x}{3}\right)>0 \Rightarrow f(x)>\frac{x}{3}.
    \]
    又 $x=0$ 时题设给出 $2f(0)>0$，故 $f(0)>0=f(0)-0$ 亦满足。
    因此恒成立的是 C。
  key_steps:
    - step_id: step_1
      statement: 将题设转成可判单调的构造函数导数。
      formula_trace:
        from: $2f(x)+xf^{\prime}(x)>x$
        to: $g^{\prime}(x)=x\bigl(2f(x)+xf^{\prime}(x)-x\bigr)$
        operation: 设 $g(x)=x^2f(x)-x^3/3$ 并求导。
        why: 把抽象导数不等式转成一元函数变化率。
      source_ref: page_0138
    - step_id: step_2
      statement: 按 x 的符号分段确定 g 的单调。
      formula_trace:
        from: $2f(x)+xf^{\prime}(x)-x>0$
        to: $x>0\Rightarrow g^{\prime}(x)>0,\ x<0\Rightarrow g^{\prime}(x)<0$
        operation: 利用 $g^{\prime}(x)=x(\cdots)$ 的乘积符号。
        why: 补全“全 R 恒成立”所需的两侧区间论证。
      source_ref: page_0138
    - step_id: step_3
      statement: 由 g 与 g(0) 的比较还原目标不等式。
      formula_trace:
        from: $g(x)>g(0)=0$（$x\neq0$）
        to: $f(x)>x/3$
        operation: 写成 $x^2\left(f(x)-x/3\right)>0$ 并除以 $x^2>0$。
        why: 直接对应选项 C。
      source_ref: page_0138
