solution:
  source_solution_summary: 源解提示不要拆括号。两边除以 $e^{a-1}$，得 $(2a-2b+1)e^{a-b+1}+b+(1-2a)e^{1-a}=0$。把 $b$ 写成 $(b-a)+a$，并把 $2a-2b+1$ 写成 $1-2(b-a)$，得到 $[1-2(b-a)]e^{1-(b-a)}+(b-a)+(1-2a)e^{1-a}+a=0$。令 $f(x)=(1-2x)e^{1-x}+x$，则 $f(b-a)+f(a)=0$。求导可证 $f(x)$ 的最小值为 $f(1)=0$，故两个非负项相加为 0，只能 $b-a=1$ 且 $a=1$，所以 $b=2$，$a+b=3$。
  key_steps:
    - step_id: step_1
      statement: 先整体除以 $e^{a-1}$。
      formula_trace:
        from: $(2a-2b+1)e^{2a-b}+be^{a-1}-2a+1=0$
        to: $(2a-2b+1)e^{a-b+1}+b+(1-2a)e^{1-a}=0$
        operation: 两边除以正数 $e^{a-1}$；第一项指数 $2a-b-(a-1)=a-b+1$，常数项变为 $(1-2a)e^{1-a}$。
        why: 让第一项指数中出现 $1-(b-a)$，便于以括号为主体同构。
      source_ref: page_0031
    - step_id: step_2
      statement: 把两个主体整理成 $b-a$ 与 $a$。
      formula_trace:
        from: $(2a-2b+1)e^{a-b+1}+b+(1-2a)e^{1-a}=0$
        to: $[1-2(b-a)]e^{1-(b-a)}+(b-a)+(1-2a)e^{1-a}+a=0$
        operation: 用 $2a-2b+1=1-2(b-a)$、$a-b+1=1-(b-a)$，并把 $b=(b-a)+a$。
        why: 这样前两项是同一个函数在 $b-a$ 处的值，后两项是它在 $a$ 处的值。
      source_ref: page_0031
    - step_id: step_3
      statement: 构造同构函数。
      formula_trace:
        from: $[1-2(b-a)]e^{1-(b-a)}+(b-a)+(1-2a)e^{1-a}+a=0$
        to: $f(b-a)+f(a)=0，\quad f(x)=(1-2x)e^{1-x}+x$
        operation: 把 $[1-2u]e^{1-u}+u$ 定义为 $f(u)$。
        why: 原方程被压缩成两个同构函数值之和。
      source_ref: page_0031
    - step_id: step_4
      statement: 求导准备证明 $f(x)\ge0$。
      formula_trace:
        from: $f(x)=(1-2x)e^{1-x}+x$
        to: $f'(x)=(2x-3)e^{1-x}+1，\quad f''(x)=(5-2x)e^{1-x}$
        operation: 对乘积 $(1-2x)e^{1-x}$ 求导，再对 $f'$ 求导。
        why: 二阶导的符号可以判断 $f'$ 的增减，从而得到 $f$ 的全局最小值。
      source_ref: page_0031-page_0032
    - step_id: step_5
      statement: 由 $f''$ 判断 $f'$ 的符号变化。
      formula_trace:
        from: $f''(x)=(5-2x)e^{1-x}$
        to: $x<1$ 时 $f'(x)<0$，$x>1$ 时 $f'(x)>0$，且 $f'(1)=0$
        operation: $f''$ 在 $x=5/2$ 前为正、后为负，所以 $f'$ 先增后减；结合 $f'(1)=0$ 以及 $x\ge5/2$ 时 $f'(x)>0$，得到 $f'$ 只在 1 处变号。
        why: 这说明 $f$ 在 $(-\infty,1)$ 递减，在 $(1,+\infty)$ 递增。
      source_ref: page_0032
    - step_id: step_6
      statement: 得到 $f$ 的非负最小值。
      formula_trace:
        from: $f$ 在 $x=1$ 处取全局最小
        to: $f(x)\ge f(1)=0$
        operation: 代入 $f(1)=(1-2)e^0+1=0$。
        why: 两个函数值之和为 0 时，每个都只能取最小值 0。
      source_ref: page_0032
    - step_id: step_7
      statement: 由 $f(b-a)+f(a)=0$ 锁定 $a,b$。
      formula_trace:
        from: $f(b-a)+f(a)=0，\quad f(x)\ge0$
        to: $b-a=1，\quad a=1$
        operation: 非负数相加为 0，两个都等于 0；而 $f(x)=0$ 只在最小点 $x=1$。
        why: 这直接给出 $a=1$ 与 $b=2$。
      source_ref: page_0032
    - step_id: step_8
      statement: 求目标值。
      formula_trace:
        from: $a=1，\quad b=2$
        to: $a+b=3$
        operation: 代入相加。
        why: 与源页答案一致。
      source_ref: page_0032
teaching_card:
  student_title: 不拆括号，把原式拼成 $f(b-a)+f(a)$
  what_it_trains: 训练在复杂指数方程中保留括号主体，经过整体除法和变量拆分，构造同一个非负函数来锁定两个变量。
  recognition_cues:
    - 原式有 $(2a-2b+1)e^{2a-b}$ 这样的成组括号。
    - 除以 $e^{a-1}$ 后，指数会出现 $1-(b-a)$。
    - 还剩一个 $b$，可以拆成 $(b-a)+a$。
  normalization_moves:
    - 不要先拆括号，先除以 $e^{a-1}$。
    - 把所有含 $b$ 的主体改写成 $b-a$。
    - 构造 $f(x)=(1-2x)e^{1-x}+x$。
    - 证明 $f$ 的最小值为 0，再由和为 0 推出两个输入都为 1。
  common_failures:
    - 把括号拆开后失去 $1-2x$ 与 $e^{1-x}$ 的同构形状。
    - 忘记把 $b$ 写成 $(b-a)+a$，导致无法形成 $f(b-a)+f(a)$。
    - 只算出 $f'(1)=0$，没有证明这是全局最小值。
  similar_practice_query: 指数方程 不拆括号 f(b-a)+f(a) 构造函数 最小值
