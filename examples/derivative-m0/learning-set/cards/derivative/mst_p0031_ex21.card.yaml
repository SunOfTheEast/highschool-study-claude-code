stem: 若 $(2a-2b+1)e^{2a-b}+be^{a-1}-2a+1=0$，则 $a+b=$ ______.
answer: |-
  3

  源解提示不要拆括号。两边除以 $e^{a-1}$，得 $(2a-2b+1)e^{a-b+1}+b+(1-2a)e^{1-a}=0$。把 $b$ 写成 $(b-a)+a$，并把 $2a-2b+1$ 写成 $1-2(b-a)$，得到 $[1-2(b-a)]e^{1-(b-a)}+(b-a)+(1-2a)e^{1-a}+a=0$。令 $f(x)=(1-2x)e^{1-x}+x$，则 $f(b-a)+f(a)=0$。求导可证 $f(x)$ 的最小值为 $f(1)=0$，故两个非负项相加为 0，只能 $b-a=1$ 且 $a=1$，所以 $b=2$，$a+b=3$。
