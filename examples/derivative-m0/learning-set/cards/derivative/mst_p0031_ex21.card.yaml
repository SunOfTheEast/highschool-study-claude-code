original_problem:
  stem: 若 $(2a-2b+1)e^{2a-b}+be^{a-1}-2a+1=0$，则 $a+b=$ ______.
  parts: *a1
  choices: []
  answer: "3"
  fidelity_notes:
    - 题干从 page_0031 开始，解析续到 page_0032；本卡将两页都作为证据。
