solution:
  source_solution_summary: |
    令 $t=\\ln(x+2)$，则 $x=e^t-2$，原不等式等价于 $ae^t-2a+b\\ge t$，也就是 $e^{t+\\ln a}\\ge t+2a-b$。由 $e^u\\ge u+1$，$e^{t+\\ln a}\\ge t+\\ln a+1$，要恒压住 $t+2a-b$，最优边界满足 $\\ln a+1\\ge2a-b$，即 $b/a\\ge2-(\\ln a+1)/a$。再设 $y=ea$，有 $2-(\\ln a+1)/a=2-e\\ln(ea)/(ea)\\ge1$，等号在 $a=1$ 处取到，所以 $b/a\\ge1$，且 $a=b=1$ 时可行。零点法中，直线零点为 $-b/a$，对数曲线零点为 $-1$，相切时 $-b/a$ 的最大值为 $-1$，同样得到 $b/a\\ge1$。故选 B。
  key_steps:
    - step_id: step_1
      statement: 把对数自变量换成指数变量。
      formula_trace:
        from: $\ln(x+2)=t\quad (x>-2)$
        to: $x=e^t-2,\quad ax+b=ae^t-2a+b$
        operation: 令 $t$ 为对数函数值，反解 $x$。
        why: 这样原不等式变成指数函数压住一次函数。
      source_ref: page_0042
    - step_id: step_2
      statement: 把恒成立条件写成指数切线模板。
      formula_trace:
        from: $ae^t-2a+b\ge t$
        to: $e^{t+\ln a}\ge t+2a-b$
        operation: 移项，并用 $ae^t=e^{t+\ln a}$。
        why: 可直接使用 $e^u\ge u+1$。
      source_ref: page_0043
    - step_id: step_3
      statement: 由切线式得到关于 $b/a$ 的下界。
      formula_trace:
        from: $e^{t+\ln a}\ge t+\ln a+1$
        to: $t+\ln a+1\ge t+2a-b\Rightarrow \frac ba\ge2-\frac{\ln a+1}{a}$
        operation: 比较两个一次式的常数项，再移项除以 $a>0$。
        why: 这是保证恒成立的最优边界，等号对应两曲线相切。
      source_ref: page_0043
    - step_id: step_4
      statement: 求右端的最小可能值。
      formula_trace:
        from: $2-\frac{\ln a+1}{a}$
        to: $2-e\cdot\frac{\ln(ea)}{ea}\ge1$
        operation: 令 $y=ea$，使用 $\ln y/y\le1/e$。
        why: 要得到所有 $a>0$ 下共同的 $b/a$ 下界。
      source_ref: page_0043
    - step_id: step_5
      statement: 说明边界可取。
      formula_trace:
        from: $\ln y/y\le1/e$
        to: $a=1,\ b=1\Rightarrow \frac ba=1$
        operation: 等号在 $y=e$ 取到，即 $ea=e$。
        why: 边界可达，所以取值范围包含 1。
      source_ref: page_0043
    - step_id: step_6
      statement: 零点比大小给出同一方向。
      formula_trace:
        from: $ax+b=0,\quad \ln(x+2)=0$
        to: $x=-\frac ba,\quad x=-1,\quad -\frac ba\le-1\Rightarrow \frac ba\ge1$
        operation: 比较直线和对数曲线共零点相切时零点位置。
        why: 若直线始终在对数曲线上方，直线零点不能跑到 $-1$ 的右侧。
      source_ref: page_0043
teaching_card:
  student_title: 把对数曲线换成指数切线来压直线
  what_it_trains: 训练处理直线压住对数曲线的恒成立问题：先换元把对数值变成变量，再用指数切线和相切点确定参数比的边界。
  recognition_cues:
    - 题干是 $ax+b$ 在 $x>-2$ 上压住 $\ln(x+2)$。
    - 目标是 $b/a$ 的范围，说明直线零点 $-b/a$ 很关键。
    - 对数里是 $x+2$，零点固定在 $x=-1$。
  normalization_moves:
    - 令 $t=\ln(x+2)$，把 $x$ 改写成 $e^t-2$。
    - 把 $ae^t$ 写成 $e^{t+\ln a}$。
    - 用 $e^u\ge u+1$ 找相切边界。
    - 也可直接比较直线零点 $-b/a$ 与对数零点 $-1$。
  common_failures:
    - 换元后漏掉 $x=e^t-2$ 中的 $-2$。
    - 把 $b/a\ge2-(\ln a+1)/a$ 当成最终答案，没再对 $a$ 求统一下界。
    - 零点比较时把 $-b/a\le-1$ 的方向翻错。
  similar_practice_query: 直线压对数 恒成立 b/a 取值范围 ln(x+2) 零点相切
quality:
