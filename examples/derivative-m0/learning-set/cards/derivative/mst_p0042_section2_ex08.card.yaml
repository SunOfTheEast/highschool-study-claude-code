stem: |-
  （2025 · 桃城区校级三模 T11）已知在函数 $f(x)=ax+b\ (a>0,b>0)$，$g(x)=\ln(x+2)$，若对 $\forall x>-2$，$f(x)\geqslant g(x)$ 恒成立，则实数 $\frac{b}{a}$ 的取值范围为 (  )
  A. $[0, +\infty)$
  B. $[1, +\infty)$
  C. $[2, +\infty)$
  D. $[\mathrm{e}, +\infty)$
answer: |
  B

  令 $t=\\ln(x+2)$，则 $x=e^t-2$，原不等式等价于 $ae^t-2a+b\\ge t$，也就是 $e^{t+\\ln a}\\ge t+2a-b$。由 $e^u\\ge u+1$，$e^{t+\\ln a}\\ge t+\\ln a+1$，要恒压住 $t+2a-b$，最优边界满足 $\\ln a+1\\ge2a-b$，即 $b/a\\ge2-(\\ln a+1)/a$。再设 $y=ea$，有 $2-(\\ln a+1)/a=2-e\\ln(ea)/(ea)\\ge1$，等号在 $a=1$ 处取到，所以 $b/a\\ge1$，且 $a=b=1$ 时可行。零点法中，直线零点为 $-b/a$，对数曲线零点为 $-1$，相切时 $-b/a$ 的最大值为 $-1$，同样得到 $b/a\\ge1$。故选 B。
