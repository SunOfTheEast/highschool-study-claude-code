solution:
  source_solution_summary: 令 $t=g(x)=\frac{x}{e^x}$，则 $g^{\prime}(x)=\frac{1-x}{e^x}$，所以 $g(x)$ 在 $(-\infty,1)$ 递增、在 $(1,+\infty)$ 递减，最大值是 $g(1)=\frac1e$。由 $f(x)=\left(\frac{x}{e^x}\right)^2+\frac{ax}{e^x}-a=0$ 得 $t^2+at-a=0$。按三零点条件可知该二次式两根满足 $t_1<0<t_2<\frac1e$，且 $t_1=\frac{x_1}{e^{x_1}}$ 对应一个负根 $x_1<0$，$t_2=\frac{x_2}{e^{x_2}}=\frac{x_3}{e^{x_3}}$ 对应两根 $0<x_2<1<x_3$。于是 $\left(1-\frac{x_1}{e^{x_1}}\right)^2\left(1-\frac{x_2}{e^{x_2}}\right)\left(1-\frac{x_3}{e^{x_3}}\right) =(1-t_1)^2(1-t_2)^2=[(1-t_1)(1-t_2)]^2$。 再用韦达 $t_1+t_2=-a,\ t_1t_2=-a$ 得 $[(1-t_1)(1-t_2)]^2=[1-(t_1+t_2)+t_1t_2]^2=1$，故选 A。
  key_steps:
    - step_id: step_1
      statement: 先把原方程压到单变量模板 $t=\frac{x}{e^x}$。
      formula_trace:
        from: $\left(\frac{x}{e^x}\right)^2+\frac{ax}{e^x}-a=0$
        to: $t^2+at-a=0,\quad t=\frac{x}{e^x}$
        operation: 同构换元，把零点方程转成二次方程。
        why: 便于用根与系数关系处理目标乘积。
      source_ref: page_0189_ex17_solution
    - step_id: step_2
      statement: 用 $g(x)=\frac{x}{e^x}$ 的单峰图像判根分配。
      formula_trace:
        from: $g^{\prime}(x)=\frac{1-x}{e^x},\ g_{\max}=g(1)=\frac1e$
        to: $t_1<0<t_2<\frac1e$ 且 $t_1\leftrightarrow x_1,\ t_2\leftrightarrow x_2,x_3$
        operation: 由递增-递减与水平线交点个数判定。
        why: 确定一个 $t$ 根对应一个或两个 $x$ 根。
      source_ref: page_0189_ex17_solution
    - step_id: step_3
      statement: 把目标式改写为韦达可算的积定值。
      formula_trace:
        from: $\left(1-\frac{x_1}{e^{x_1}}\right)^2\left(1-\frac{x_2}{e^{x_2}}\right)\left(1-\frac{x_3}{e^{x_3}}\right)$
        to: $[(1-t_1)(1-t_2)]^2=[1-(t_1+t_2)+t_1t_2]^2=1$
        operation: 代入 $t_i$ 对应关系并用 $t_1+t_2=-a,\ t_1t_2=-a$。
        why: 参数 $a$ 抵消，得到常数值。
      source_ref: page_0189_ex17_solution
