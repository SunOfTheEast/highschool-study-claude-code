stem: |-
  （2020 · 四川攀枝花期末 T12）已知函数 $f(x)=\left(\frac{x}{e^x}\right)^2+\frac{ax}{e^x}-a$ 有三个不同的零点 $x_1,x_2,x_3$（其中 $x_1<x_2<x_3$），则 $\left(1-\frac{x_1}{e^{x_1}}\right)^2\left(1-\frac{x_2}{e^{x_2}}\right)\left(1-\frac{x_3}{e^{x_3}}\right)$ 的值为（  ）
  A. 1
  B. -1
  C. $a$
  D. $-a$
answer: |-
  A

  令 $t=g(x)=\frac{x}{e^x}$，则 $g^{\prime}(x)=\frac{1-x}{e^x}$，所以 $g(x)$ 在 $(-\infty,1)$ 递增、在 $(1,+\infty)$ 递减，最大值是 $g(1)=\frac1e$。由 $f(x)=\left(\frac{x}{e^x}\right)^2+\frac{ax}{e^x}-a=0$ 得 $t^2+at-a=0$。按三零点条件可知该二次式两根满足 $t_1<0<t_2<\frac1e$，且 $t_1=\frac{x_1}{e^{x_1}}$ 对应一个负根 $x_1<0$，$t_2=\frac{x_2}{e^{x_2}}=\frac{x_3}{e^{x_3}}$ 对应两根 $0<x_2<1<x_3$。于是 $\left(1-\frac{x_1}{e^{x_1}}\right)^2\left(1-\frac{x_2}{e^{x_2}}\right)\left(1-\frac{x_3}{e^{x_3}}\right) =(1-t_1)^2(1-t_2)^2=[(1-t_1)(1-t_2)]^2$。 再用韦达 $t_1+t_2=-a,\ t_1t_2=-a$ 得 $[(1-t_1)(1-t_2)]^2=[1-(t_1+t_2)+t_1t_2]^2=1$，故选 A。
