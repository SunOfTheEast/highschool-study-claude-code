stem: （2024 · 吉林白城一中期中 T16）已知 t 是函数 f(x)=sqrt(2)m+n*sqrt(x)+e^(x/2) 的一个零点，且 t∈[1,2]，则 sqrt(e/(m^2+n^2)) 的最大值为 ________。
answer: |
  $\sqrt{3}$

  由 t 是零点，得 sqrt(2)m+n*sqrt(t)+e^(t/2)=0， 即 sqrt(2)m+n*sqrt(t)=-e^(t/2)。两边平方并用柯西不等式： e^t=(sqrt(2)m+n*sqrt(t))^2 <= (m^2+n^2)(2+t)， 故 m^2+n^2>=e^t/(2+t)=:R(t)。对 R(t) 求导： R^{\prime}(t)=e^t*(t+1)/(t+2)^2>0（t∈[1,2]）， 所以 R(t) 在 [1,2] 递增，最小值在 t=1 处， R_min=e/3。于是 m^2+n^2>=e/3， sqrt(e/(m^2+n^2))<=sqrt(e/(e/3))=sqrt(3)， 最大值为 sqrt(3)。
