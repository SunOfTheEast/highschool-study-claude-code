solution:
  source_solution_summary: |
    由 t 是零点，得 sqrt(2)m+n*sqrt(t)+e^(t/2)=0， 即 sqrt(2)m+n*sqrt(t)=-e^(t/2)。两边平方并用柯西不等式： e^t=(sqrt(2)m+n*sqrt(t))^2 <= (m^2+n^2)(2+t)， 故 m^2+n^2>=e^t/(2+t)=:R(t)。对 R(t) 求导： R^{\prime}(t)=e^t*(t+1)/(t+2)^2>0（t∈[1,2]）， 所以 R(t) 在 [1,2] 递增，最小值在 t=1 处， R_min=e/3。于是 m^2+n^2>=e/3， sqrt(e/(m^2+n^2))<=sqrt(e/(e/3))=sqrt(3)， 最大值为 sqrt(3)。
  key_steps:
    - step_id: step_1
      statement: 把零点条件改写成参数线性组合等式。
      formula_trace:
        from: f(t)=sqrt(2)m+n*sqrt(t)+e^(t/2)=0
        to: sqrt(2)m+n*sqrt(t)=-e^(t/2)
        operation: 把指数项移到右侧。
        why: 为平方与柯西做准备。
      source_ref: page_0170_ex12_solution
    - step_id: step_2
      statement: 平方后套柯西得到 m^2+n^2 的下界。
      formula_trace:
        from: e^t=(sqrt(2)m+n*sqrt(t))^2
        to: e^t<=(m^2+n^2)(2+t)
        operation: 将 (m,n) 与 (sqrt(2),sqrt(t)) 向量配对应用柯西。
        why: 把双参数问题转成单变量下界函数 R(t)。
      source_ref: page_0170_ex12_solution
    - step_id: step_3
      statement: 在 t∈[1,2] 上求 R(t)=e^t/(2+t) 最小值。
      formula_trace:
        from: m^2+n^2>=R(t)=e^t/(2+t)
        to: R^{\prime}(t)=e^t*(t+1)/(t+2)^2>0，R_min=R(1)=e/3
        operation: 求导并利用区间单调。
        why: 确定 m^2+n^2 的最小可能值。
      source_ref: page_0170_ex12_solution
    - step_id: step_4
      statement: 把下界转换为目标上界并取最大值。
      formula_trace:
        from: m^2+n^2>=e/3
        to: sqrt(e/(m^2+n^2))<=sqrt(3)，故最大值为 sqrt(3)
        operation: 对正量取倒数并开方。
        why: 题目求的是反比量的最大值。
      source_ref: page_0170_ex12_solution
teaching_card:
  student_title: 先保底 m^2+n^2，再反推目标上界
  what_it_trains: 训练“参数和的下界 -> 反比表达式上界”的转换能力，尤其是柯西后的一步反向推理。
  recognition_cues:
    - 题干给零点，目标却是 sqrt(e/(m^2+n^2)) 这类反比式。
    - 参数项是线性组合，适合平方后套柯西。
    - t 有明确区间，单变量函数容易判单调。
  normalization_moves:
    - 零点代入，构造 sqrt(2)m+n*sqrt(t)。
    - 柯西得 m^2+n^2 的函数下界。
    - 对 R(t) 取最小，再转换成目标最大。
  common_failures:
    - 把 e^t/(2+t) 误当成在区间上递减。
    - 求出 m^2+n^2 下界后忘记反向到 sqrt(e/(m^2+n^2))。
    - 平方时漏掉“右侧先取负再平方不影响结果”。
  similar_practice_query: 零点 柯西 m^2+n^2 下界 反比式最大值 e^t/(t+2)
