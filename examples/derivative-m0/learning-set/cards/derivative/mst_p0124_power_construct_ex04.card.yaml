stem: |-
  （2023·孝感期末）定义在 $(0,+\infty)$ 上的函数 $f(x)$ 的导函数为 $f'(x)$，且 $(x^3-x^2+x)f'(x)<(3x^2-2x+1)f(x)$ 恒成立，则必有（  ）
  A. $f(1)<\frac{f(2)}{2}<\frac{f(3)}{7}$
  B. $3f(1)<\frac{f(2)}{2}<\frac{f(3)}{7}$
  C. $f(1)>\frac{f(2)}{2}>\frac{f(3)}{7}$
  D. $3f(1)>\frac{f(2)}{2}>\frac{f(3)}{7}$
answer: |
  D

  由题设
  \[
  (x^3-x^2+x)f'(x)<(3x^2-2x+1)f(x)=(x^3-x^2+x)'f(x).
  \]
  令
  \[
  g(x)=\frac{f(x)}{x^3-x^2+x}\quad(x>0),
  \]
  则
  \[
  g'(x)=\frac{(x^3-x^2+x)f'(x)-(x^3-x^2+x)'f(x)}{(x^3-x^2+x)^2}<0.
  \]
  故 $g(x)$ 在 $(0,+\infty)$ 上单调递减，所以
  $g(1)>g(2)>g(3)$，即
  \[
  \frac{f(1)}{1}>\frac{f(2)}{6}>\frac{f(3)}{21}.
  \]
  同乘 3 得
  \[
  3f(1)>\frac{f(2)}{2}>\frac{f(3)}{7},
  \]
  选 D。
