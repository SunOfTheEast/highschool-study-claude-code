solution:
  source_solution_summary: |
    由题设
    \[
    (x^3-x^2+x)f'(x)<(3x^2-2x+1)f(x)=(x^3-x^2+x)'f(x).
    \]
    令
    \[
    g(x)=\frac{f(x)}{x^3-x^2+x}\quad(x>0),
    \]
    则
    \[
    g'(x)=\frac{(x^3-x^2+x)f'(x)-(x^3-x^2+x)'f(x)}{(x^3-x^2+x)^2}<0.
    \]
    故 $g(x)$ 在 $(0,+\infty)$ 上单调递减，所以
    $g(1)>g(2)>g(3)$，即
    \[
    \frac{f(1)}{1}>\frac{f(2)}{6}>\frac{f(3)}{21}.
    \]
    同乘 3 得
    \[
    3f(1)>\frac{f(2)}{2}>\frac{f(3)}{7},
    \]
    选 D。
  key_steps:
    - step_id: step_1
      statement: 识别右侧系数是左侧乘子的导数。
      formula_trace:
        from: $(x^3-x^2+x)f'(x)<(3x^2-2x+1)f(x)$
        to: $(x^3-x^2+x)f'(x)<(x^3-x^2+x)'f(x)$
        operation: 将 $3x^2-2x+1$ 识别为 $(x^3-x^2+x)'$。
        why: 便于直接构造商函数导数分子。
      source_ref: page_0124
    - step_id: step_2
      statement: 构造商函数并判导数符号。
      formula_trace:
        from: $g(x)=\frac{f(x)}{x^3-x^2+x}$
        to: $g'(x)=\frac{(x^3-x^2+x)f'(x)-(x^3-x^2+x)'f(x)}{(x^3-x^2+x)^2}<0$
        operation: 商法则求导并代入题设。
        why: 分母平方恒正，符号由分子决定。
      source_ref: page_0124
    - step_id: step_3
      statement: 用单调递减比较 1,2,3 三点。
      formula_trace:
        from: $g'(x)<0$
        to: $g(1)>g(2)>g(3)$
        operation: 利用递减函数保序反向。
        why: 选项本质是三个点的比例比较。
      source_ref: page_0124
    - step_id: step_4
      statement: 换回 $f$ 并对齐选项形式。
      formula_trace:
        from: $g(1)>g(2)>g(3)$
        to: $\frac{f(1)}1>\frac{f(2)}6>\frac{f(3)}{21}\Rightarrow 3f(1)>\frac{f(2)}2>\frac{f(3)}7$
        operation: 计算三个分母并同乘 3。
        why: 得到选项 D 的标准写法。
      source_ref: page_0124
teaching_card:
  student_title: 把导数不等式配成商函数递减
  what_it_trains: 看到 $pf'<p'f$ 时快速构造 $g=f/p$，再用单调性做点值比较。
  recognition_cues:
    - 题干同时出现 $p(x)f'(x)$ 与 $p'(x)f(x)$。
    - 选项是同一批点值的分式比较。
  normalization_moves:
    - 令 $p(x)=x^3-x^2+x$。
    - 构造 $g(x)=f(x)/p(x)$ 并求导。
    - 由 $g(1)>g(2)>g(3)$ 回到 $f$ 的不等式。
  common_failures:
    - 误构造为乘积函数 $p(x)f(x)$。
    - 忽略分母在三点处的具体值 1,6,21。
    - 链式不等式缩放后方向写错。
  similar_practice_query: 抽象函数 商函数构造 pf' p'f 单调递减 点值比较
