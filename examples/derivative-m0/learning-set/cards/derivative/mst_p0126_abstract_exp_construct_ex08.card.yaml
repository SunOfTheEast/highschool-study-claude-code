teaching_card:
  student_title: 对数不等式先做指数商构造
  what_it_trains: 训练在 $f^{\prime}-f$ 型题设下快速构造指数商函数，并把对数不等式翻译成单调函数比较。
  recognition_cues:
    - 题设同时出现 $f^{\prime}(x)$ 与 $f(x)$ 的线性比较。
    - 目标式含 $\ln$ 与线性项 $x$。
    - 给出单点值 $f(0)$ 常用于锚定比较。
  normalization_moves:
    - 构造 $g=\frac{f+2}{e^x}$。
    - 用题设直接判 $g^{\prime}<0$。
    - 把原不等式改写成 $g(x)>g(0)$。
    - 由递减性反推 $x<0$。
  common_failures:
    - 只把不等式移项，不做函数构造。
    - 把 $g^{\prime}(x)$ 分子符号写反。
    - 将递减函数的比较方向判断错误。
  similar_practice_query: 抽象函数 指数商构造 对数不等式 单调性 解集
