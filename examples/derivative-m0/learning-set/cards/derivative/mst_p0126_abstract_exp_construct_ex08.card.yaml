stem: |-
  （2023·叙州区模拟）已知函数 $f(x)$ 是定义在 $\mathbf{R}$ 上的增函数，$f(x)+2>f^{\prime}(x)$，$f(0)=1$，则不等式 $\ln[f(x)+2]>\ln 3+x$ 的解集为（ ）
  A. $(-\infty,0)$
  B. $(0,+\infty)$
  C. $(-\infty,1)$
  D. $(1,+\infty)$
answer: |
  A

  构造
  \[
  g(x)=\frac{f(x)+2}{e^x}.
  \]
  则
  \[
  g^{\prime}(x)=\frac{f^{\prime}(x)-f(x)-2}{e^x}.
  \]
  由题设 $f(x)+2>f^{\prime}(x)$，得 $g^{\prime}(x)<0$，所以 $g$ 在
  $\mathbf{R}$ 上单调递减。又 $f(0)=1$，故
  \[
  g(0)=\frac{f(0)+2}{e^0}=3.
  \]
  原不等式
  \[
  \ln[f(x)+2]>\ln3+x
  \]
  等价于
  \[
  \ln\frac{f(x)+2}{3}>x
  \iff \frac{f(x)+2}{3}>e^x
  \iff \frac{f(x)+2}{e^x}>3
  \iff g(x)>g(0).
  \]
  由 $g$ 递减，$g(x)>g(0)$ 当且仅当 $x<0$，故解集为
  $(-\infty,0)$，选 A。
