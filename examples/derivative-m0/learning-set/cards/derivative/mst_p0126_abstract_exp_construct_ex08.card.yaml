    等价于
    \[
    \ln\frac{f(x)+2}{3}>x
    \iff \frac{f(x)+2}{3}>e^x
    \iff \frac{f(x)+2}{e^x}>3
    \iff g(x)>g(0).
    \]
    由 $g$ 递减，$g(x)>g(0)$ 当且仅当 $x<0$，故解集为
